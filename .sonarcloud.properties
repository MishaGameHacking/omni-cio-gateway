# PostgreSQL migration files are not Oracle PL/SQL.
# SonarQube maps .sql to the PL/SQL analyzer by default; keep that analyzer scoped
# to actual PL/SQL suffixes. PostgreSQL migrations remain mandatory production
# code and are protected by immutable digests plus the canonical PostgreSQL integration/reconcile paths.
sonar.plsql.file.suffixes=.plsql,.pls,.pks,.pkb
