# SonarQube Cloud Automatic Analysis treats .sql as Oracle PL/SQL by default.
# OmniCIO migrations are PostgreSQL, immutable after acceptance, and validated by
# SHA-256 regression digests plus the PostgreSQL-native integration/reconcile paths.
# Exclude only this incompatible analyzer scope; production Python/web code remains analyzed.
sonar.exclusions=migrations/*.sql

# Keep all application, deployment and workflow sources in analysis.
sonar.sources=.
# Tests are analyzed as tests, not billed as application lines of code.
# Sonar automatically excludes these test inclusions from the source scope.
sonar.tests=tests,.github/scripts
sonar.test.inclusions=tests/**,.github/scripts/test_*.py
