services:
  - type: web
    name: omni-cio-telegram-bot
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn telegram_bot.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: OMNI_GATEWAY_URL
        value: https://omni-cio-gateway-au6d.onrender.com
      - key: OMNI_GATEWAY_API_KEY
        sync: false
      - key: TELEGRAM_AUTO_CONFIGURE
        value: "true"
      - key: TELEGRAM_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: TELEGRAM_GATEWAY_RETRY_ATTEMPTS
        value: "2"
      - key: TELEGRAM_GATEWAY_RETRY_DELAY_SECONDS
        value: "5"
      - key: TELEGRAM_MAX_RESPONSE_CHARS
        value: "12000"
      - key: TELEGRAM_MIN_REQUEST_INTERVAL_SECONDS
        value: "1.5"
