services:
  - type: web
    name: omni-cio-gateway
    runtime: python
    plan: free
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SSL_TBANK_VERIFY
        value: "True"
      - key: TINVEST_TOKEN
        sync: false
      - key: GATEWAY_API_KEY
        sync: false
      - key: TINVEST_SANDBOX_TOKEN
        sync: false
      - key: SANDBOX_TRADING_ENABLED
        value: "false"
      - key: SANDBOX_CONFIRMATION_TTL_SECONDS
        value: "120"
