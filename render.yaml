services:
  - type: web
    name: omni-cio-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_v332:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SSL_TBANK_VERIFY
        value: "True"
      - key: TINVEST_TOKEN
        sync: false
      - key: GATEWAY_API_KEY
        sync: false
