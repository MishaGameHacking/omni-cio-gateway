[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# PR-03 establishes a low-noise correctness baseline across legacy runtime.
# Additional rule families are enabled only with their fixes in later PRs.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# WP12 keeps one inert legacy compatibility import in the private execution
# core. Suppress only that unused-import diagnostic; all other Ruff and mypy
# checks remain active for the package.
"omni_cio/plan_execution/service_core_v1.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_incremental = true
pretty = true
files = [
  "omni_cio/reconciliation",
  "apps/api",
  "omni_cio/tbank_tls.py",
  "omni_cio/contracts",
  "omni_cio/adapters",
  "omni_cio/quality",
  "omni_cio/analytics",
  "omni_cio/portfolio",
  "omni_cio/core",
  "omni_cio/persistence",
  "omni_cio/jobs",
  "omni_cio/risk",
  "omni_cio/market",
  "omni_cio/news",
  "omni_cio/decision",
  "omni_cio/decision_journal",
  "omni_cio/router",
  "omni_cio/policy",
  "omni_cio/universe",
  "omni_cio/candidates",
  "omni_cio/research",
  "omni_cio/credit",
  "omni_cio/funds",
  "omni_cio/strategy",
  "omni_cio/optimizer",
  "omni_cio/plans",
  "omni_cio/plan_execution",
  "omni_cio/watchtower",
  "omni_cio/rebalancing",
  "omni_cio/pretrade",
  "omni_cio/paper",
  "omni_cio/shadow",
  "omni_cio/observability",
  "omni_cio/release",
  "omni_cio/sandbox",
  "omni_cio/real_trading",
  "omni_cio/web",
  "scripts/check_ci_security_baseline.py",
  "scripts/check_live_gateway_authority.py",
  "scripts/check_read_only_release_contract.py",
  "scripts/check_repository_layout.py",
  "scripts/check_v10_repository_boundaries.py",
  "scripts/check_v10_toolchain_baseline.py",
  "scripts/check_v10_regression_shield.py",
  "scripts/check_optimizer_boundary.py",
  "scripts/check_plan_boundary.py",
  "scripts/check_plan_execution_boundary.py",
  "scripts/check_watchtower_boundary.py",
  "scripts/check_decision_journal_boundary.py",
  "scripts/reconcile_watchtower_schedule.py",
  "scripts/rehearse_v10_wp13_persistence.py",
  "scripts/rehearse_v10_wp14_jobs.py",
  "scripts/rehearse_v10_wp14_windows.py",
  "scripts/check_v10_wp15_ci_isolation.py",
  "scripts/rehearse_v10_wp15_offline.py",
  "scripts/rehearse_v10_wp15_owner.py",
  "scripts/validate_v10_wp15_owner_evidence.py",
  "scripts/check_v10_wp17_web_security.py",
  "scripts/timeweb_ipv4_allocation.py",
  "scripts/timeweb_ipv4_allocation_github.py",
  "scripts/timeweb_ipv4_allocation_journal.py",
  "scripts/timeweb_ipv4_allocation_windows.py",
  "scripts/timeweb_ipv4_allocation_provider.py",
  "scripts/run_v10_timeweb_ipv4_allocation.py",
  "scripts/check_v10_timeweb_ipv4_allocation.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "app",
  "main",
  "omni_cio.portfolio.market_source_v1",
  "omni_cio.analytics.portfolio_source_v1",
  "omni_cio.analytics.cash_liquidity_v1",
  "omni_cio.pretrade.purchase_capacity_v1",
  "omni_cio.pretrade.purchase_capacity_integrity_v1",
  "omni_cio.pretrade.sale_capacity_v1",
  "omni_cio.pretrade.sale_capacity_normalization_v1",
  "omni_cio.analytics.operations_source_v1",
  "omni_cio.adapters.tinvest_order_compat_v1",
  "omni_cio.reconciliation",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv-ci",
  "__pycache__",
  "tests",
]
