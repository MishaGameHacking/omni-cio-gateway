[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicio-gateway"
version = "1.5.0"
description = "OmniCIO public market analytics and private portfolio monitoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "uv>=0.12,<0.13",
]

[dependency-groups]
build = ["setuptools>=75"]

[tool.omnicio.runtime]
# Change this contract when the previous runtime cannot safely read the new data.
rollback_contract = "mobile-social-email-holdings-v1"

[tool.omnicio.timeweb]
server-id = 9235089
ipv4 = "194.87.151.244"

[tool.omnicio.timeweb.backups]
cluster_id = 4215095
copies = 7
weekly_copies = 4
max_disk_kib = 20971520
max_monthly_rub = 1600
rub_per_gib = 6

[tool.omnicio.timeweb.upgrade]
mode = "single_existing_database"
source_release = "a775679cc353eeb64fb51721fdd963eb660e5edb"
source_version = "1.3.0"
target_version = "1.5.0"
source_schema_sha256 = "287e991cdb3e98879b4be876b7291bd2459c617cb93d8b45c9930a335863c2d2"
migration_sha256 = [
  "a541cc6e56a0a93b8930f2204c13a934e7dd9dd3255dd2173aed5e4048b6dff0",
  "b37ea71ac1bea7522baad32f4e99babe4135bc4ad885db51bbe5c22f0705bb25",
  "fc4346e037ffc8e4965a341005f857f305d42bf56c88ee0d15f2b034b2b2bdeb",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
packages = ["omnicio"]
