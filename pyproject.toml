[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicio-gateway"
version = "1.4.0"
description = "OmniCIO public market analytics and private portfolio monitoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "uv>=0.12,<0.13",
]

[dependency-groups]
build = ["setuptools>=75"]

[tool.omnicio.runtime]
# Change this contract when the previous runtime cannot safely read the new data.
rollback_contract = "public-email-holdings-v1"

[tool.omnicio.timeweb]
server-id = 9235089
ipv4 = "194.87.151.244"

[tool.omnicio.timeweb.backups]
cluster_id = 4215095
copies = 7
weekly_copies = 4
max_disk_kib = 20971520
max_monthly_rub = 1600
rub_per_gib = 6

[tool.omnicio.timeweb.upgrade]
mode = "single_existing_database"
source_release = "ac4cade4d4291c65f50f070e45d304ad634f9b85"
source_version = "1.2.0"
target_version = "1.3.0"
source_schema_sha256 = "ad860f140e3ba980090d88c039d8f4d6abb5f6e4dacfdbcd61820fc85f21ba50"
migration_sha256 = [
  "90a733bcf4e9289eff6b14b9653f4a2344454a77b0b8bd76153accd042904419",
  "a8da904abff76418b04c7d02b1088e3cc48c0f15922562ec5c597b75feb4301f",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omnicio"]
