[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# PR-03 establishes a low-noise correctness baseline across legacy runtime.
# Additional rule families are enabled only with their fixes in later PRs.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_incremental = true
pretty = true
files = [
  "portfolio_analytics.py",
  "portfolio_market.py",
  "cash_liquidity.py",
  "purchase_capacity_integrity.py",
  "operations_analytics.py",
  "sdk_order_compat.py",
  "omni_cio/tbank_tls.py",
  "omni_cio/contracts",
  "omni_cio/adapters",
  "omni_cio/quality",
  "omni_cio/analytics",
  "omni_cio/risk",
  "omni_cio/market",
  "omni_cio/news",
  "omni_cio/decision",
  "omni_cio/router",
  "omni_cio/policy",
  "omni_cio/universe",
  "omni_cio/candidates",
  "omni_cio/research",
  "omni_cio/credit",
  "omni_cio/funds",
  "omni_cio/rebalancing",
  "omni_cio/pretrade",
  "omni_cio/paper",
  "omni_cio/shadow",
  "omni_cio/observability",
  "omni_cio/release",
  "omni_cio/sandbox",
  "omni_cio/real_trading",
  "scripts/check_ci_security_baseline.py",
  "scripts/check_live_read_only_release.py",
  "scripts/check_read_only_release_contract.py",
  "scripts/check_repository_layout.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "app",
  "main",
  "portfolio_market",
  "portfolio_analytics",
  "cash_liquidity",
  "purchase_capacity",
  "purchase_capacity_integrity",
  "operations_analytics",
  "sdk_order_compat",
  "broker_report_reconciliation",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv-ci",
  "__pycache__",
  "tests",
]
