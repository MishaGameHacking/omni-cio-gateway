version: 2.1

jobs:
  supplemental_linux_governance:
    docker:
      - image: cimg/python:3.12.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact source and immutable safety boundary
          command: |
            set -eu
            ACTUAL_HEAD="$(git rev-parse HEAD)"
            test "$ACTUAL_HEAD" = "$CIRCLE_SHA1"
            test "$(python --version)" = "Python 3.12.10"
            test -f AGENTS.md
            test -f README.md
            test -f docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.md
            test -f knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            grep -Fq 'app:app' AGENTS.md
            grep -Fq 'trading_methods=false' README.md
            grep -Fq 'REAL_TRADING_ENABLED=false' AGENTS.md
            grep -Fq 'PUBLIC_MULTI_USER_ENABLED=false' knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            printf 'CIRCLECI_EXACT_HEAD=%s\n' "$ACTUAL_HEAD"
            printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_SAFETY_BOUNDARY=PASS'
      - run:
          name: Verify portable engineering governance contracts
          command: |
            set -eu
            python scripts/check_v10_engineering_governance.py
            python scripts/check_v10_documentation_consistency.py
            python scripts/check_v10_public_product_plan.py
            python scripts/check_v10_ci_cost_control.py
            python scripts/check_v10_regression_shield.py
      - run:
          name: Compile portable governance and CI guards
          command: |
            set -eu
            python -m py_compile \
              scripts/check_v10_engineering_governance.py \
              scripts/check_v10_documentation_consistency.py \
              scripts/check_v10_public_product_plan.py \
              scripts/check_v10_ci_cost_control.py \
              scripts/check_v10_regression_shield.py \
              scripts/v10_ci_router.py
      - run:
          name: Run portable stdlib CI contract regression tests
          command: |
            set -eu
            python -m unittest \
              tests.test_v10_regression_shield \
              tests.test_v10_ci_action_download_resilience \
              tests.test_v10_release_provenance
      - run:
          name: Record supplemental Linux evidence boundary
          command: |
            printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_GOVERNANCE=PASS'
            printf '%s\n' 'CANONICAL_SOURCE=GITHUB'
            printf '%s\n' 'LENOVO_WINDOWS_CONTOUR_REPLACED=NO'
            printf '%s\n' 'PRODUCTION_MUTATION_PERFORMED=NO'
            printf '%s\n' 'BILLING_MUTATION_PERFORMED=NO'
            printf '%s\n' 'REAL_SECRETS_USED=NO'

  supplemental_linux_runtime_dependencies:
    docker:
      - image: cimg/python:3.12.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Reproduce hash-locked runtime dependencies
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "$(python --version)" = "Python 3.12.10"
            python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
            python -c "import psycopg, pydantic; print('CIRCLECI_RUNTIME_DEPENDENCIES=PASS')"

  supplemental_linux_postgres18_environment:
    docker:
      - image: cimg/python:3.12.10
      - image: cimg/postgres:18.4
        environment:
          POSTGRES_USER: omni_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: omni_ci
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify PostgreSQL service port readiness
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            ready=0
            for attempt in $(seq 1 45); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = "1"
            printf '%s\n' 'CIRCLECI_POSTGRES18_SERVICE_PORT=PASS'

  supplemental_linux_postgres18_driver:
    docker:
      - image: cimg/python:3.12.10
      - image: cimg/postgres:18.4
        environment:
          POSTGRES_USER: omni_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: omni_ci
    resource_class: small
    environment:
      OMNI_CIO_WP13_DSN: postgresql://omni_ci:synthetic-ci-only@127.0.0.1:5432/omni_ci
    steps:
      - checkout
      - run:
          name: Install exact runtime dependencies
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run:
          name: Connect through psycopg and verify PostgreSQL 18
          command: |
            set -eu
            python -c "import os,time,psycopg; dsn=os.environ['OMNI_CIO_WP13_DSN']; deadline=time.monotonic()+45; connection=None; last=None; exec(\"while time.monotonic() < deadline:\\n try:\\n  connection=psycopg.connect(dsn, connect_timeout=3); break\\n except psycopg.Error as exc:\\n  last=type(exc).__name__; time.sleep(1)\"); assert connection is not None, f'POSTGRES18_NOT_READY:{last}'; version_num=int(connection.execute('SHOW server_version_num').fetchone()[0]); connection.close(); assert version_num // 10000 == 18, f'POSTGRES_MAJOR_MISMATCH:{version_num}'; print(f'CIRCLECI_POSTGRES_VERSION_NUM={version_num}')"
            printf '%s\n' 'CIRCLECI_POSTGRES18_DRIVER=PASS'

  supplemental_linux_wp13_rehearsal:
    docker:
      - image: cimg/python:3.12.10
      - image: cimg/postgres:18.4
        environment:
          POSTGRES_USER: omni_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: omni_ci
    resource_class: small
    environment:
      OMNI_CIO_WP13_DSN: postgresql://omni_ci:synthetic-ci-only@127.0.0.1:5432/omni_ci
    steps:
      - checkout
      - run:
          name: Install exact runtime dependencies
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run:
          name: Wait for PostgreSQL TCP readiness
          command: |
            set -eu
            ready=0
            for attempt in $(seq 1 45); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = "1"
      - run:
          name: Rehearse accepted WP13 durable-state semantics
          command: |
            set -eu
            python scripts/rehearse_v10_wp13_persistence.py exercise
            printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_POSTGRES18=PASS'
            printf '%s\n' 'SYNTHETIC_DATABASE_ONLY=YES'
            printf '%s\n' 'REAL_SECRETS_USED=NO'

workflows:
  v10_supplemental_linux_governance:
    jobs:
      - supplemental_linux_governance
      - supplemental_linux_runtime_dependencies
      - supplemental_linux_postgres18_environment
      - supplemental_linux_postgres18_driver:
          requires:
            - supplemental_linux_runtime_dependencies
            - supplemental_linux_postgres18_environment
      - supplemental_linux_wp13_rehearsal:
          requires:
            - supplemental_linux_postgres18_driver
