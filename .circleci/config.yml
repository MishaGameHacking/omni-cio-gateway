version: 2.1

jobs:
  supplemental_linux_governance:
    docker:
      - image: cimg/python:3.12.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact source and governance contracts
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            grep -Fq 'app:app' AGENTS.md
            grep -Fq 'trading_methods=false' README.md
            grep -Fq 'REAL_TRADING_ENABLED=false' AGENTS.md
            grep -Fq 'PUBLIC_MULTI_USER_ENABLED=false' knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            python scripts/check_v10_engineering_governance.py
            python scripts/check_v10_documentation_consistency.py
            python scripts/check_v10_public_product_plan.py
            python scripts/check_v10_ci_cost_control.py
            python scripts/check_v10_regression_shield.py

  supplemental_linux_diagnostic_import:
    docker:
      - image: cimg/python:3.12.10
    resource_class: small
    environment:
      PYTHONPATH: .
    steps:
      - checkout
      - run:
          name: Install hash-locked runtime dependencies
          command: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run:
          name: Import Linux portability diagnostic module
          command: python -c "import scripts.diagnose_v10_wp13_linux_portability; print('CIRCLECI_WP13_DIAGNOSTIC_IMPORT=PASS')"

  supplemental_linux_diagnostic_initialized:
    docker:
      - image: cimg/python:3.12.10
      - image: cimg/postgres:18.4.0
        environment:
          POSTGRES_USER: omni_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: omni_ci
    resource_class: small
    environment:
      PYTHONPATH: .
      OMNI_CIO_WP13_DSN: postgresql://omni_ci:synthetic-ci-only@127.0.0.1:5432/omni_ci
    steps:
      - checkout
      - run:
          name: Install hash-locked runtime dependencies
          command: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run:
          name: Wait for PostgreSQL 18 and initialize accepted schema/catalog
          command: |
            set -eu
            python -c "import os,time,psycopg; dsn=os.environ['OMNI_CIO_WP13_DSN']; deadline=time.monotonic()+45; c=None; exec(\"while time.monotonic() < deadline:\\n try:\\n  c=psycopg.connect(dsn, connect_timeout=3); break\\n except psycopg.Error:\\n  time.sleep(1)\"); assert c is not None; version_num=int(c.execute('SHOW server_version_num').fetchone()[0]); c.close(); assert version_num // 10000 == 18"
            python -c "from scripts.diagnose_v10_wp13_linux_portability import _initialized; c,_,_=_initialized(); c.close(); print('CIRCLECI_WP13_DIAGNOSTIC_INITIALIZED=PASS')"

workflows:
  v10_supplemental_linux_diagnostics:
    jobs:
      - supplemental_linux_governance
      - supplemental_linux_diagnostic_import
      - supplemental_linux_diagnostic_initialized:
          requires:
            - supplemental_linux_diagnostic_import
