version: 2.1

jobs:
  supplemental_linux_environment_probe:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - run:
          name: Verify hosted Linux environment
          command: |
            set -eu
            uname -a
            git --version
            printf '%s\n' 'CIRCLECI_LINUX_ENVIRONMENT=PASS'

  supplemental_linux_checkout_probe:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact checked-out source
          command: |
            set -eu
            ACTUAL_HEAD="$(git rev-parse HEAD)"
            test "$ACTUAL_HEAD" = "$CIRCLE_SHA1"
            test -f AGENTS.md
            test -f README.md
            test -f docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.md
            test -f knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            printf 'CIRCLECI_EXACT_HEAD=%s\n' "$ACTUAL_HEAD"

  marker_app_entrypoint:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run: grep -Fq 'app:app' AGENTS.md

  marker_trading_methods:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run: grep -Fq 'trading_methods=false' AGENTS.md

  marker_real_trading:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run: grep -Fq 'REAL_TRADING_ENABLED=false' AGENTS.md

  marker_public_multi_user:
    docker:
      - image: cimg/base:2026.07
    resource_class: small
    steps:
      - checkout
      - run: grep -Fq 'PUBLIC_MULTI_USER_ENABLED=false' knowledge/17_V10_CURRENT_PROGRAM_STATUS.md

workflows:
  wp22a_supplemental_linux_capacity_probe:
    jobs:
      - supplemental_linux_environment_probe
      - supplemental_linux_checkout_probe:
          requires:
            - supplemental_linux_environment_probe
      - marker_app_entrypoint:
          requires:
            - supplemental_linux_checkout_probe
      - marker_trading_methods:
          requires:
            - supplemental_linux_checkout_probe
      - marker_real_trading:
          requires:
            - supplemental_linux_checkout_probe
      - marker_public_multi_user:
          requires:
            - supplemental_linux_checkout_probe
