version: 2.1

jobs:
  supplemental_linux_governance:
    docker:
      - image: cimg/python:3.12.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact source and immutable safety boundary
          command: |
            set -eu
            ACTUAL_HEAD="$(git rev-parse HEAD)"
            test "$ACTUAL_HEAD" = "$CIRCLE_SHA1"
            test "$(python --version)" = "Python 3.12.10"
            test -f AGENTS.md
            test -f README.md
            test -f docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.md
            test -f knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            grep -Fq 'app:app' AGENTS.md
            grep -Fq 'trading_methods=false' README.md
            grep -Fq 'REAL_TRADING_ENABLED=false' AGENTS.md
            grep -Fq 'PUBLIC_MULTI_USER_ENABLED=false' knowledge/17_V10_CURRENT_PROGRAM_STATUS.md
            printf 'CIRCLECI_EXACT_HEAD=%s\n' "$ACTUAL_HEAD"
            printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_SAFETY_BOUNDARY=PASS'
      - run:
          name: Verify portable engineering governance contracts
          command: |
            set -eu
            python scripts/check_v10_engineering_governance.py
            python scripts/check_v10_documentation_consistency.py
            python scripts/check_v10_public_product_plan.py
            python scripts/check_v10_ci_cost_control.py
            python scripts/check_v10_regression_shield.py
      - run:
          name: Compile portable governance and CI guards
          command: |
            set -eu
            python -m py_compile \
              scripts/check_v10_engineering_governance.py \
              scripts/check_v10_documentation_consistency.py \
              scripts/check_v10_public_product_plan.py \
              scripts/check_v10_ci_cost_control.py \
              scripts/check_v10_regression_shield.py \
              scripts/v10_ci_router.py
      - run:
          name: Run portable stdlib CI contract regression tests
          command: |
            set -eu
            python -m unittest \
              tests.test_v10_regression_shield \
              tests.test_v10_ci_action_download_resilience \
              tests.test_v10_release_provenance
      - run:
          name: Record supplemental Linux evidence boundary
          command: |
            printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_GOVERNANCE=PASS'
            printf '%s\n' 'CANONICAL_SOURCE=GITHUB'
            printf '%s\n' 'LENOVO_WINDOWS_CONTOUR_REPLACED=NO'
            printf '%s\n' 'PRODUCTION_MUTATION_PERFORMED=NO'
            printf '%s\n' 'BILLING_MUTATION_PERFORMED=NO'
            printf '%s\n' 'REAL_SECRETS_USED=NO'

  supplemental_linux_postgres18:
    parameters:
      rehearsal:
        type: enum
        enum:
          - wp13
          - phase4-creator-edge
          - phase4-bootstrap
        default: wp13
    docker:
      - image: cimg/python:3.12.10
      - image: cimg/postgres@sha256:a41132098e5802d6287f4186f7e2b8bbf0d745dfbc912f0e826e6666d91d1bb2
        environment:
          POSTGRES_USER: omni_ci
          POSTGRES_PASSWORD: synthetic-ci-only # pragma: allowlist secret
          POSTGRES_DB: omni_ci
    resource_class: small
    environment:
      PYTHONPATH: .
      OMNI_CIO_WP13_DSN: postgresql://omni_ci:synthetic-ci-only@127.0.0.1:5432/omni_ci # pragma: allowlist secret
    steps:
      - checkout
      - run:
          name: Verify exact source and install hash-locked runtime dependencies
          command: |
            set -eu
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "$(python --version)" = "Python 3.12.10"
            python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run:
          name: Wait for PostgreSQL 18 service readiness
          command: |
            set -eu
            python -m scripts.wait_for_postgres18
      - when:
          condition:
            equal: [wp13, << parameters.rehearsal >>]
          steps:
            - run:
                name: Rehearse accepted WP13 persistence semantics on Linux PostgreSQL 18
                command: |
                  set -eu
                  python scripts/rehearse_v10_wp13_persistence.py exercise
                  printf '%s\n' 'V10_SUPPLEMENTAL_LINUX_POSTGRES18=PASS'
                  printf '%s\n' 'SYNTHETIC_DATABASE_ONLY=YES'
                  printf '%s\n' 'REAL_SECRETS_USED=NO'
      - when:
          condition:
            equal: [phase4-creator-edge, << parameters.rehearsal >>]
          steps:
            - run:
                name: Prove PostgreSQL 18 creator-admin edge
                command: |
                  set -eu
                  python -m scripts.rehearse_v10_wp22a_phase4_runtime_role creator-edge
      - when:
          condition:
            equal: [phase4-bootstrap, << parameters.rehearsal >>]
          steps:
            - run:
                name: Prove hosted runtime bootstrap on PostgreSQL 18
                command: |
                  set -eu
                  python -m scripts.rehearse_v10_wp22a_phase4_runtime_role bootstrap

workflows:
  v10_supplemental_linux_governance:
    jobs:
      - supplemental_linux_governance
      - supplemental_linux_postgres18
      - supplemental_linux_postgres18:
          name: supplemental_linux_phase4_pg18_creator_edge
          rehearsal: phase4-creator-edge
      - supplemental_linux_postgres18:
          name: supplemental_linux_phase4_pg18_bootstrap
          rehearsal: phase4-bootstrap
