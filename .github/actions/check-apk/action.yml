name: Check installable preview APK
description: Verify the fixed preview artifact, upgrade path, launch, and UI on a disposable Android 16 emulator.
runs:
  using: composite
  steps:
    - name: Require publication-grade emulator inputs
      shell: cmd
      run: |
        if defined PREVIOUS_APK goto previous_defined
        echo PREVIOUS_APK is required for the distributable APK upgrade test.
        exit /b 1
        :previous_defined
        if exist "%PREVIOUS_APK%" goto previous_exists
        echo PREVIOUS_APK does not point to an existing reference APK.
        exit /b 1
        :previous_exists
        if "%RUN_PROFILE_UI_TESTS%"=="1" goto inputs_ready
        echo RUN_PROFILE_UI_TESTS must be 1 for the distributable APK UI contract.
        exit /b 1
        :inputs_ready

    - name: Verify signature and package metadata with official Android tools
      shell: cmd
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        set "TOOLS=%ANDROID_SDK_ROOT%\build-tools\36.0.0"
        "%JAVA_HOME%\bin\java.exe" -jar "%TOOLS%\lib\apksigner.jar" verify --verbose --print-certs "%APK_DIR%\app-preview.apk" > "%APK_DIR%\signature.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\zipalign.exe" -c -P 16 -v 4 "%APK_DIR%\app-preview.apk" > "%APK_DIR%\alignment.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump badging "%APK_DIR%\app-preview.apk" > "%APK_DIR%\badging.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump xmltree "%APK_DIR%\app-preview.apk" AndroidManifest.xml > "%APK_DIR%\manifest.txt"
        if errorlevel 1 exit /b 1
        py -3 .github\scripts\verify_apk.py
        if errorlevel 1 exit /b 1

    - name: Build and lint separate test-only frame instrumentation
      shell: cmd
      run: |
        call gradlew.bat :ci-ui-driver:lintDebug :ci-ui-driver:assembleDebug --stacktrace
        if errorlevel 1 exit /b 1

    - name: Prepare official Android emulator images
      shell: cmd
      run: |
        set "YES_FILE=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview\sdk-licenses.txt"
        (for /l %%A in (1,1,200) do @echo y) > "%YES_FILE%"
        call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" --channel=0 "emulator" "platform-tools" "system-images;android-36;google_apis;x86_64" < "%YES_FILE%"
        if errorlevel 1 exit /b 1


    - name: Test upgrade, clean install, launch, and profile UI on Android 16
      shell: cmd
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --previous "%PREVIOUS_APK%" --api 36 --work-dir "%APK_DIR%\install-api-36"
        if errorlevel 1 exit /b 1

    - name: Validate actual installation results for this artifact
      shell: cmd
      run: |
        py -3 .github\scripts\validate_distribution.py
        if errorlevel 1 exit /b 1
