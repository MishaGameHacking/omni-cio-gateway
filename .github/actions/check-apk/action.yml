name: Check installable preview APK
description: Verify the fixed preview artifact, upgrade path, launch, and UI on disposable Android 17 emulators with both page-size profiles.
runs:
  using: composite
  steps:
    - name: Require publication-grade emulator inputs
      shell: cmd
      run: |
        if defined PREVIOUS_APK goto previous_defined
        echo PREVIOUS_APK is required for the distributable APK upgrade test.
        exit /b 1
        :previous_defined
        if exist "%PREVIOUS_APK%" goto previous_exists
        echo PREVIOUS_APK does not point to an existing reference APK.
        exit /b 1
        :previous_exists
        if "%RUN_PROFILE_UI_TESTS%"=="1" goto inputs_ready
        echo RUN_PROFILE_UI_TESTS must be 1 for the distributable APK UI contract.
        exit /b 1
        :inputs_ready

    - name: Validate native checker and deterministic 3D asset catalogue
      shell: cmd
      run: |
        py -3 tools\test_native_alignment.py
        if errorlevel 1 exit /b 1
        py -3 tools\generate_spectrum_meshes.py --check --check-apk
        if errorlevel 1 exit /b 1
        py -3 tools\test_spectrum_meshes.py
        if errorlevel 1 exit /b 1

    - name: Verify signature and package metadata with official Android tools
      shell: cmd
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        set "TOOLS=%ANDROID_SDK_ROOT%\build-tools\37.0.0"
        "%JAVA_HOME%\bin\java.exe" -jar "%TOOLS%\lib\apksigner.jar" verify --verbose --print-certs "%APK_DIR%\app-preview.apk" > "%APK_DIR%\signature.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\zipalign.exe" -c -P 16 -v 4 "%APK_DIR%\app-preview.apk" > "%APK_DIR%\alignment.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump badging "%APK_DIR%\app-preview.apk" > "%APK_DIR%\badging.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump xmltree "%APK_DIR%\app-preview.apk" AndroidManifest.xml > "%APK_DIR%\manifest.txt"
        if errorlevel 1 exit /b 1
        py -3 .github\scripts\verify_apk.py
        if errorlevel 1 exit /b 1

    - name: Build and lint separate test-only frame instrumentation
      shell: cmd
      run: |
        call gradlew.bat :ci-ui-driver:lintDebug :ci-ui-driver:assembleDebug --stacktrace
        if errorlevel 1 exit /b 1

    - name: Prepare and verify official Android 17 emulator images
      shell: cmd
      run: |
        py -3 .github\scripts\prepare_android_sdk.py --sdk "%ANDROID_SDK_ROOT%" --runtime
        if errorlevel 1 exit /b 1

    - name: Test upgrade, clean install, launch, and full profile UI on Android 17 with 16 KB pages
      shell: cmd
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --previous "%PREVIOUS_APK%" --api 37 --page-bytes 16384 --work-dir "%APK_DIR%\install-api37-16384"
        if errorlevel 1 exit /b 1
        py -3 -c "import shutil; shutil.copytree(r'app/build/outputs/apk/preview/ui-screens', r'app/build/outputs/apk/preview/ui-screens-api37-16384', dirs_exist_ok=True)"
        if errorlevel 1 exit /b 1

    - name: Test upgrade, clean install, launch, and profile UI on Android 17 with 4 KB pages
      shell: cmd
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --previous "%PREVIOUS_APK%" --api 37 --page-bytes 4096 --work-dir "%APK_DIR%\install-api37-4096"
        if errorlevel 1 exit /b 1

    - name: Validate actual installation results for this artifact
      shell: cmd
      run: |
        py -3 .github\scripts\validate_distribution.py
        if errorlevel 1 exit /b 1
