name: Check installable preview APK
description: Verify the fixed preview artifact and install it on disposable Android 13 and 16 emulators.
runs:
  using: composite
  steps:
    - name: Verify signature and package metadata with official Android tools
      shell: cmd
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        set "TOOLS=%ANDROID_SDK_ROOT%\build-tools\36.0.0"
        "%JAVA_HOME%\bin\java.exe" -jar "%TOOLS%\lib\apksigner.jar" verify --verbose --print-certs "%APK_DIR%\app-preview.apk" > "%APK_DIR%\signature.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\zipalign.exe" -c -P 16 -v 4 "%APK_DIR%\app-preview.apk" > "%APK_DIR%\alignment.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump badging "%APK_DIR%\app-preview.apk" > "%APK_DIR%\badging.txt"
        if errorlevel 1 exit /b 1
        "%TOOLS%\aapt.exe" dump xmltree "%APK_DIR%\app-preview.apk" AndroidManifest.xml > "%APK_DIR%\manifest.txt"
        if errorlevel 1 exit /b 1
        py -3 .github\scripts\verify_apk.py
        if errorlevel 1 exit /b 1

    - name: Prepare official Android emulator images
      shell: cmd
      run: |
        set "YES_FILE=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview\sdk-licenses.txt"
        (for /l %%A in (1,1,200) do @echo y) > "%YES_FILE%"
        call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" --channel=0 "emulator" "platform-tools" "system-images;android-33;google_apis;x86_64" "system-images;android-36;google_apis;x86_64" < "%YES_FILE%"
        if errorlevel 1 exit /b 1

    - name: Test clean install and launch on Android 13
      shell: cmd
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        if defined PREVIOUS_APK goto upgrade
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --api 33 --work-dir "%APK_DIR%\install-api-33"
        if errorlevel 1 exit /b 1
        goto complete
        :upgrade
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --previous "%PREVIOUS_APK%" --api 33 --work-dir "%APK_DIR%\install-api-33"
        if errorlevel 1 exit /b 1
        :complete

    - name: Test clean install and launch on Android 16
      shell: cmd
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: |
        set "APK_DIR=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview"
        if defined PREVIOUS_APK goto upgrade
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --api 36 --work-dir "%APK_DIR%\install-api-36"
        if errorlevel 1 exit /b 1
        goto complete
        :upgrade
        py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_DIR%\app-preview.apk" --previous "%PREVIOUS_APK%" --api 36 --work-dir "%APK_DIR%\install-api-36"
        if errorlevel 1 exit /b 1
        :complete

    - name: Validate actual installation results for this artifact
      shell: cmd
      run: |
        py -3 .github\scripts\validate_distribution.py
        if errorlevel 1 exit /b 1
