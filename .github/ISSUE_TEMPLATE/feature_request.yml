name: Улучшение Omni-CIO
description: Предложить maintenance-улучшение или новую owner-approved возможность без нарушения текущих safety boundaries
title: "[Enhancement] "
labels: [enhancement]
assignees: [Misha2304]
body:
  - type: markdown
    attributes:
      value: |
        Omni-CIO v9.0.0 (WP0–WP15) уже полностью реализован и owner-accepted. Репозиторий находится в controlled maintenance mode. Новая функциональная программа, особенно расширяющая broker-write/GPT authority, требует отдельного явного owner approval, threat model и reviewed delivery plan. Не вставляйте секреты, полный account ID или private broker payloads.
  - type: input
    id: summary
    attributes:
      label: Краткое название
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - portfolio / analytics
        - market data / research
        - cash / liquidity / operations
        - broker report
        - policy / risk / optimizer / plans
        - Sandbox execution
        - Real execution safety / reconciliation
        - Watchtower / decision journal
        - Custom GPT / Actions / recovery
        - deployment / durable state
        - CI / dependencies / security
        - documentation / repository hygiene
    validations:
      required: true
  - type: dropdown
    id: change_class
    attributes:
      label: Класс изменения
      options:
        - maintenance / bugfix / compatibility
        - security / dependency
        - documentation / recovery
        - new owner-approved feature program required
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Проблема пользователя / системы
      description: Опишите наблюдаемый defect или unmet need и укажите current source of truth.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: data_sources
    attributes:
      label: Источники данных и ограничения
      description: Укажите source of truth, freshness/completeness, валюты/FX, reconciliation и возможные расхождения.
  - type: textarea
    id: authority_change
    attributes:
      label: Изменение authority / execution surface
      description: Укажите, меняются ли OpenAPI/operationIds, GPT Editor config, Sandbox/Real authority, credentials, kill switches или consequential actions. Если нет — напишите "нет".
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Обязательные инварианты
      options:
        - label: Не создаётся второй GPT/Gateway/frontend/scheduler/broker stack или competing source of truth.
          required: true
        - label: Render entrypoint `app:app` не меняется без отдельной reviewed migration.
          required: true
        - label: Production read-only credential остаётся изолирован от Sandbox/Real execution.
          required: true
        - label: Секреты и реальные пользовательские данные не нужны в GitHub.
          required: true
        - label: Если затрагивается Real execution, сохраняются exact-owner-confirmation, idempotency, fail-closed и broker reconciliation boundaries.
          required: true
        - label: Transfer/withdrawal, margin/short, MARKET/BESTPRICE и autonomous recurring real-money execution не добавляются неявно.
          required: true
