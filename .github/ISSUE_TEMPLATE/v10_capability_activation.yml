name: V10 Capability Activation Dashboard
description: Working dashboard for one material progressive capability activation transition under Amendment 13
title: "[V10 Capability Activation] "
assignees: [MishaGameHacking]
body:
  - type: markdown
    attributes:
      value: |
        **WORKING CAPABILITY ACTIVATION STATE — NOT ACCEPTED MAIN AUTHORITY**

        This issue tracks working activation evidence only. Accepted current state remains in `knowledge/17_V10_CURRENT_PROGRAM_STATUS.md`. Do not paste provider/broker secrets, Authorization headers, full account IDs or private portfolio payloads.

  - type: input
    id: capability
    attributes:
      label: Capability ID
      description: Stable capability identifier, for example telegram_login or tinvest_read.
    validations:
      required: true

  - type: input
    id: accepted_main
    attributes:
      label: Accepted main SHA
      description: Exact accepted protected main used as the activation evidence base.
    validations:
      required: true

  - type: dropdown
    id: current_state
    attributes:
      label: Current activation state
      options:
        - IMPLEMENTED
        - LIVE_OPERABLE
        - BLOCKED_EXTERNAL
        - REAL_MONEY_AUTHORIZED
    validations:
      required: true

  - type: dropdown
    id: proposed_state
    attributes:
      label: Proposed activation state
      options:
        - IMPLEMENTED
        - LIVE_OPERABLE
        - BLOCKED_EXTERNAL
        - REAL_MONEY_AUTHORIZED
    validations:
      required: true

  - type: textarea
    id: implementation_evidence
    attributes:
      label: Accepted implementation / technical evidence
      description: PR/SHA/gates proving the capability itself is implemented. Do not include secrets or private payloads.
      value: |
        Implementation PR/SHA:
        Technical/security gates:
        Rollback/recovery:
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: External blockers
      description: List only real provider/broker/legal/privacy/secret-custody/runtime/operations blockers. “V10 is not finished” is not a valid blocker.
      value: |
        - BLOCKER:
          Evidence:
          Safe completion evidence:
    validations:
      required: true

  - type: textarea
    id: live_user_evidence
    attributes:
      label: Real-user operability evidence
      description: Sanitized canonical-Web/USER evidence. No tokens, full account IDs or private portfolio payloads.
      value: |
        Canonical Web/runtime:
        USER flow:
        Logout/revoke/error behavior:

  - type: textarea
    id: tenant_isolation
    attributes:
      label: Multi-user / tenant-isolation evidence
      description: Required where capability is tenant-scoped.
      value: |
        USER A -> USER B read negative:
        USER A -> USER B write negative:
        Session/cache/job/secret scope:

  - type: textarea
    id: broker_boundary
    attributes:
      label: Broker / Real-money boundary
      description: For broker capability, record READ/TRADE intersection and whether Real submit is forbidden or explicitly authorized.
      value: |
        READ independent from Real execution:
        TRADE credential connected != submit authorized:
        EXECUTABLE_ACCOUNTS = VERIFIED_READ_ACCOUNTS ∩ VERIFIED_TRADE_ACCOUNTS:
        Real-money state:

  - type: textarea
    id: current_next
    attributes:
      label: Current / next exact action
      value: |
        CURRENT:
        NEXT:
        BLOCKERS:
    validations:
      required: true

  - type: checkboxes
    id: protected_authority
    attributes:
      label: Protected authority checklist
      options:
        - label: No real provider/broker secret, Authorization header, full account ID or private portfolio payload is stored in this issue.
          required: true
        - label: Capability dashboard is working-state only and does not compete with canonical current status.
          required: true
        - label: A `LIVE_OPERABLE` state does not imply `REAL_MONEY_AUTHORIZED`.
          required: true
        - label: TRADE credential connection/verification does not itself authorize broker submit.
          required: true
        - label: Transfer/withdrawal/margin/uncovered-short authority is not expanded.
          required: true
        - label: Multi-user isolation is fail-closed where applicable.
          required: true
        - label: Real external gates are not marked complete without evidence.
          required: true
