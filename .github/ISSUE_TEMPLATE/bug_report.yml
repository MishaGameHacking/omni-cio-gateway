name: Ошибка Omni-CIO
description: Сообщить о воспроизводимой ошибке Custom GPT/Gateway без секретов и персональных данных
title: "[Bug] "
labels: [bug]
assignees: [Misha2304]
body:
  - type: markdown
    attributes:
      value: |
        Current applied state: existing Omni-CIO GPT v9.0.0 + production Gateway `app:app`. Не вставляйте токены, API-ключи, Authorization headers, полный номер счёта, private positions/operations/reports или secret exports. Для Real/Sandbox ошибок используйте минимальный безопасный reproduction без нового live submit, если он не является отдельно owner-authorized acceptance action.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Значение `version` из `/health`, ответа Action или applied GPT version.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: `build.commit_sha` / deployed SHA, если доступен.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - gateway health / connection / auth
        - portfolio snapshot / market valuation
        - market data / instrument identity
        - portfolio analytics / risk
        - cash / liquidity / purchase capacity
        - operations analytics
        - broker report reconciliation
        - policy / universe / research / optimizer / plan
        - Sandbox execution
        - Real execution readiness / prepare / execute / reconciliation
        - Watchtower / QStash / durable state
        - decision journal / evaluation
        - OpenAPI / Custom GPT Actions
        - GPT configuration / Knowledge / recovery
        - Render deployment
        - CI / dependencies / security
        - documentation / repository hygiene
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте только маскированные и фиктивные значения. Не публикуйте exact confirmation phrase/token/private payload, если это может раскрыть чувствительные данные.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: source_of_truth
    attributes:
      label: С чем сравнивали
      description: Укажите relevant canonical doc/contract, effective OpenAPI, accepted main behavior или runbook. Старый issue/PR/comment сам по себе не является current source of truth.
  - type: checkboxes
    id: safety
    attributes:
      label: Проверка безопасности
      options:
        - label: В сообщении нет секретов, Authorization headers, полного account ID или private broker payloads.
          required: true
        - label: Reproduction не требует transfer/withdrawal, margin/short или иного запрещённого authority.
          required: true
        - label: Если ошибка касается Real execution, duplicate submit не выполнялся; ambiguous possible-submit оставлен на reconciliation.
          required: true
