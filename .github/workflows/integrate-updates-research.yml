name: Integrate reviewed updater source
on:
  push:
    branches: [feature/mandatory-updates-quant-research]
    paths: [.github/workflows/integrate-updates-research.yml]
concurrency:
  group: integrate-updates-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  integrate:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Apply pinned source edits only
        shell: cmd
        run: |
          py -3 .github\scripts\integrate_updates_research.py
          if errorlevel 1 exit /b 1
          py -3 -m compileall -q backend
          if errorlevel 1 exit /b 1
      - name: Full backend suite in isolated environment
        shell: cmd
        env:
          TELEGRAM_CLIENT_ID: '123456'
          TELEGRAM_CLIENT_SECRET: test-only
          BACKEND_PUBLIC_URL: https://example.invalid
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ANALYSIS_SCHEDULER_ENABLED: 'false'
          AI_EXTERNAL_PROCESSING_APPROVED: 'false'
          ANDROID_UPDATES_ENABLED: 'false'
          PYTHONIOENCODING: utf-8
        run: |
          set "VENV=%RUNNER_TEMP%\analyst-updates-%GITHUB_RUN_ID%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --no-cache-dir -r backend\requirements.txt
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m unittest discover -s backend\tests -p "test_*.py" -v
          if errorlevel 1 exit /b 1
      - name: Commit reviewed source paths; no deployment or APK publishing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = 'feature/mandatory-updates-quant-research';
            if (context.ref !== `refs/heads/${branch}`) throw new Error('Unexpected branch');
            const current = (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
            if (current.object.sha !== context.sha) throw new Error('Branch advanced; refusing overwrite');
            const parent = (await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data;
            const allowed = ['backend/app.py','backend/autonomous_ai.py','backend/portfolio_details.py','app/src/main/java/ru/omnicio/app/MainActivity.kt','app/src/main/java/ru/omnicio/app/data/backend/AnalystBackendClient.kt','app/src/main/java/ru/omnicio/app/data/analysis/AnalysisBackendClient.kt','app/src/main/java/ru/omnicio/app/data/portfolio/PortfolioDataClient.kt','app/src/main/java/ru/omnicio/app/ui/portfolio/PortfolioComponents.kt','app/src/main/AndroidManifest.xml','app/build.gradle.kts'];
            const tree = (await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:allowed.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))})).data;
            const commit = (await github.rest.git.createCommit({owner,repo,message:'Updates: wire version gate into auth, queue and Android; backend tests passed, no deployment',tree:tree.sha,parents:[context.sha]})).data;
            const latest = (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
            if (latest.object.sha !== context.sha) throw new Error('Branch advanced before commit');
            await github.rest.git.updateRef({owner,repo,ref:`heads/${branch}`,sha:commit.sha,force:false});
            core.notice(`INTEGRATED_SOURCE_COMMIT=${commit.sha}`);
