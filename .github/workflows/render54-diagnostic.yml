name: Read synthetic candidate54 render failure
on:
  push:
    branches: [codex/strategy53-delivery-tools-2026-10-29]
    paths: [.github/workflows/render54-diagnostic.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: render54-failure-${{ github.run_id }}
          persist-credentials: false
          sparse-checkout: tools/read54_render_failure.py
          sparse-checkout-cone-mode: false
      - shell: cmd
        working-directory: render54-failure-${{ github.run_id }}
        run: py -3 tools/read54_render_failure.py
