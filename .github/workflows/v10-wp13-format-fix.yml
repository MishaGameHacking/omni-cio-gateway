name: V10 WP13 Format Fix

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: write

concurrency:
  group: v10-wp13-format-fix
  cancel-in-progress: true

jobs:
  format:
    name: Apply WP13 Ruff formatting
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out WP13 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/wp13-postgresql-persistence
          persist-credentials: true

      - name: Bootstrap protected Python 3.12.10
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated formatter environment
        run: |
          python -m venv "%RUNNER_TEMP%\wp13-format-${{ github.run_id }}"
          "%RUNNER_TEMP%\wp13-format-${{ github.run_id }}\Scripts\python.exe" -m pip install --disable-pip-version-check ruff==0.16.1

      - name: Format and commit
        run: |
          "%RUNNER_TEMP%\wp13-format-${{ github.run_id }}\Scripts\python.exe" -m ruff format scripts\rehearse_v10_wp13_persistence.py
          git rm .github\workflows\v10-wp13-format-fix.yml
          git add scripts\rehearse_v10_wp13_persistence.py
          git diff --cached --check
          python -c "import subprocess; changed=sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()); expected=sorted(['.github/workflows/v10-wp13-format-fix.yml','scripts/rehearse_v10_wp13_persistence.py']); assert changed == expected, (changed, expected)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V10 WP13: format persistence rehearsal"
          git push origin HEAD:v10/wp13-postgresql-persistence

      - name: Clean formatter environment
        if: always()
        run: if exist "%RUNNER_TEMP%\wp13-format-${{ github.run_id }}" rmdir /s /q "%RUNNER_TEMP%\wp13-format-${{ github.run_id }}"
