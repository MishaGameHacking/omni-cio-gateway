        for name,item in value['sources'].items():\n    assert item['status'] in {'observed','absent','bounded_read_unavailable'}\n\
        \    if item['status']=='observed':\n        assert set(item)=={'status','bytes','sha256','matches_reference44','matches_prepared46'}\n\
        \        assert type(item['bytes']) is int and 0<item['bytes']<=2*1024**2 and re.fullmatch('[a-f0-9]{64}',item['sha256'])\n\
        \        identity={'bytes':item['bytes'],'sha256':item['sha256']}\n        assert item['matches_reference44']==(identity==EXPECTED['sources'][name]['reference44'])\n\
        \        assert item['matches_prepared46']==(identity==EXPECTED['sources'][name]['prepared46'])\n    else:assert set(item)=={'status'}\n\
        assert value['all_web_source_files_match_reference44']==all(item.get('matches_reference44') is True for item in value['sources'].values())\n\
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\nfolder=root/('theme46-runtime-observation-'+run+'-'+attempt)\n\
        folder.mkdir(exist_ok=False)\npath=folder/'runtime-comparison.json'\nresult=(json.dumps(value,ensure_ascii=True,sort_keys=True,indent=2)+'\\\
        n').encode('ascii')\nassert len(result)<=64*1024\nwith path.open('xb') as output:output.write(result)\nsummary={key:value[key]\
        \ for key in ('observed_at','runtime_server_id','sources','services','all_web_source_files_match_reference44','deployment_performed')}\n\
        summary.update(help_status=value['help']['status'],served_help_path_verified=value['help']['served_path_verified'],\n\
        \               report_bytes=len(result),report_sha256=hashlib.sha256(result).hexdigest())\nprint('THEME46_RUNTIME_READONLY='+json.dumps(summary,ensure_ascii=True,sort_keys=True),flush=True)\n\
        \nPY\n"
    - name: Retain bounded source identities and existing-help observations only
