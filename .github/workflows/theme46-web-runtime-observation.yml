        '],\\n        \\'sources\\': sources, \\'configuration_file_identities\\': configuration,\\n        \\'active_caddy_configuration\\\
        ': active, \\'help\\': help_observation(config),\\n        \\'services\\': {name: service_state(name) for name in\
        \ (\\'analyst-ai-owner.service\\', \\'analyst-ai-updates.service\\')},\\n        \\'all_web_source_files_match_reference44\\\
        ': all(row.get(\\'matches_reference44\\') is True for row in sources.values()),\\n        \\'application_or_tests_executed\\\
        ': False, \\'application_imported\\': False, \\'runtime_files_written\\': False,\\n        \\'database_opened\\':\
        \ False, \\'configuration_written\\': False, \\'services_restarted\\': False,\\n        \\'release_published\\': False,\
        \ \\'phone_accessed\\': False, \\'deployment_performed\\': False,\\n        \\'source_or_configuration_text_exported\\\
        ': False,\\n    }\\n    raw = (json.dumps(result, ensure_ascii=True, sort_keys=True, separators=(\\',\\', \\':\\'))\
        \ + \\'\\\\n\\').encode(\\'ascii\\')\\n    need(len(raw) <= 48 * 1024, \\'observation_output_exceeds_bound\\')\\n\
        \    sys.stdout.buffer.write(raw)\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        main()\\n    except\
        \ BaseException as error:\\n        code = str(error) if isinstance(error, ObservationError) else type(error).__name__\\\
        n        if re.fullmatch(r\\'[A-Za-z0-9_]{1,100}\\', code) is None:\\n            code = \\'readonly_runtime_observation_failed\\\
        '\\n        print(\\'THEME46_READONLY_FAILED=\\' + code, file=sys.stderr, flush=True)\\n        raise SystemExit(1)\
        \ from None\\n'\nimport re\nassert __debug__ and os.environ['GITHUB_REPOSITORY']=='MishaGameHacking/omni-cio-gateway'\n\
        assert os.environ['GITHUB_REF']=='refs/heads/codex/timeweb-owner-prepare-2026-10-23'\nassert os.environ['GITHUB_EVENT_NAME']=='push'\n\
        run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']\nassert re.fullmatch(r'[0-9]{8,20}',run)\
        \ and re.fullmatch(r'[0-9]{1,5}',attempt)\nassert hashlib.sha256(remote.encode('utf-8')).hexdigest()==REMOTE_SHA256\n\
        raw=with_ams(remote,timeout=180,capture=True)\nassert 0<len(raw)<=48*1024\ndef unique(pairs):\n    result={}\n   \
        \ for key,value in pairs:\n        assert key not in result\n        result[key]=value\n    return result\nvalue=json.loads(raw,object_pairs_hook=unique)\n\
        assert value['schema']==1 and value['kind']=='theme46_runtime_readonly_comparison'\nassert value['runtime_server_id']==9417611\
        \ and value['public_host']=='analyst-ai-2941515.twc1.net'\nassert value['reference44_source_sha256']==EXPECTED['reference44_source_sha256']\n\
