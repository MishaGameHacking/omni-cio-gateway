name: Theme46 read-only comparison of current owner runtime web files
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/theme46-web-runtime-observation.yml
permissions:
  contents: read
concurrency:
  group: analyst-theme46-runtime-readonly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout pinned administrative transport only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Compare exact runtime web source and discover existing served help without changes
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"\
        server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"\
        availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nEXPECTED = {'reference44_source_sha256': 'e34b717fa408fbe377d910a372933c35a2ba1bdddf02263b6daa477df70f93b9',\
        \ 'prepared46_manifest_sha256': 'a320b29b48f408945d9f446070a9ef126262e31c806a60fa4123d7367ae3fd50', 'sources': {'app.py':\
        \ {'reference44': {'bytes': 28437, 'sha256': '6a44c9fbe9cd06a91c890961db9708accf7f4a9096987fae5b490113933ad455'},\
        \ 'prepared46': {'bytes': 29703, 'sha256': 'a402ec6346c3ef5673484e11e2d60640245e1dc1be9ea1f9bec7263a2427ed4b'}}, 'telegram_browser_app.py':\
        \ {'reference44': {'bytes': 16754, 'sha256': 'be7d2b0b122740bd02d8fecf0148db9c6569f0cf3b1c255b79eb4bf020bca5ff'},\
        \ 'prepared46': {'bytes': 17398, 'sha256': '6be30431dfe9c6330479e15d1932a9b9bd05352b531ff145558759c6d2696750'}}, 'owner_app.py':\
        \ {'reference44': {'bytes': 4170, 'sha256': '4162966c03c3793d6cb9903a690842600fcc241dff1a402ae253e3fc0b285419'}, 'prepared46':\
        \ {'bytes': 6232, 'sha256': '4b0456f25f82fdfd8e4bc1fbe46c231c855650a4105716589bea611c36e227c3'}}}, 'help': {'reference44':\
        \ {'bytes': 1670, 'sha256': '6c12714f6b2a2a0b698f3fa94aaa979325d53a281f8ea1938572451ca60866ff'}, 'prepared46': {'bytes':\
        \ 2838, 'sha256': '84d495c82d113289945375b28936c0ca2ca8991ba079b1bf97cf9ab4f44fb13d'}}}\nREMOTE_SHA256 = '4348c52aff490ba6d33f1dacee02f5e5f116bf664ddb758c33ecac7fb6dc6e49'\n\
        remote = '\"\"\"Read bounded runtime source/config identities; never import application code.\\n\\nAll source/config/HTTP\
        \ bodies stay in memory. Output contains only file identities,\\nfixed service names, controlled help paths and comparison\
        \ results. No environment,\\ndatabase, session, key, source text, server log, or complete configuration is read\\\
        ninto the output. Existing services are only observed, never started or restarted.\\n\"\"\"\\nfrom __future__ import\
        \ annotations\\n\\nimport datetime\\nimport hashlib\\nimport http.client\\nimport json\\nimport os\\nfrom pathlib\
        \ import Path, PurePosixPath\\nimport re\\nimport socket\\nimport ssl\\nimport stat\\nimport subprocess\\nimport sys\\\
        n\\nEXPECTED = {\\'reference44_source_sha256\\': \\'e34b717fa408fbe377d910a372933c35a2ba1bdddf02263b6daa477df70f93b9\\\
        ', \\'prepared46_manifest_sha256\\': \\'a320b29b48f408945d9f446070a9ef126262e31c806a60fa4123d7367ae3fd50\\', \\'sources\\\
        ': {\\'app.py\\': {\\'reference44\\': {\\'bytes\\': 28437, \\'sha256\\': \\'6a44c9fbe9cd06a91c890961db9708accf7f4a9096987fae5b490113933ad455\\\
        '}, \\'prepared46\\': {\\'bytes\\': 29703, \\'sha256\\': \\'a402ec6346c3ef5673484e11e2d60640245e1dc1be9ea1f9bec7263a2427ed4b\\\
        '}}, \\'telegram_browser_app.py\\': {\\'reference44\\': {\\'bytes\\': 16754, \\'sha256\\': \\'be7d2b0b122740bd02d8fecf0148db9c6569f0cf3b1c255b79eb4bf020bca5ff\\\
        '}, \\'prepared46\\': {\\'bytes\\': 17398, \\'sha256\\': \\'6be30431dfe9c6330479e15d1932a9b9bd05352b531ff145558759c6d2696750\\\
        '}}, \\'owner_app.py\\': {\\'reference44\\': {\\'bytes\\': 4170, \\'sha256\\': \\'4162966c03c3793d6cb9903a690842600fcc241dff1a402ae253e3fc0b285419\\\
        '}, \\'prepared46\\': {\\'bytes\\': 6232, \\'sha256\\': \\'4b0456f25f82fdfd8e4bc1fbe46c231c855650a4105716589bea611c36e227c3\\\
        '}}}, \\'help\\': {\\'reference44\\': {\\'bytes\\': 1670, \\'sha256\\': \\'6c12714f6b2a2a0b698f3fa94aaa979325d53a281f8ea1938572451ca60866ff\\\
        '}, \\'prepared46\\': {\\'bytes\\': 2838, \\'sha256\\': \\'84d495c82d113289945375b28936c0ca2ca8991ba079b1bf97cf9ab4f44fb13d\\\
        '}}}\\nPUBLIC_HOST = \\'analyst-ai-2941515.twc1.net\\'\\nPUBLIC_IP = \\'83.217.195.29\\'\\nSOURCE_ROOT = Path(\\'/opt/analyst-ai/backend\\\
        ')\\nCONFIG_PATHS = (\\n    \\'/etc/analyst-ai/Caddyfile\\', \\'/etc/analyst-ai/Caddyfile.runtime\\', \\'/etc/caddy/Caddyfile\\\
        ',\\n    \\'/etc/systemd/system/analyst-ai-owner.service\\',\\n    \\'/etc/systemd/system/analyst-ai-updates.service\\\
        ',\\n)\\nSTATIC_ROOTS = frozenset((\\n    \\'/srv/analyst-ai-ota\\', \\'/srv/analyst-ai-ota/public\\', \\'/srv/analyst-ai-ota/www\\\
        ',\\n    \\'/srv/analyst-ai-ota/releases\\', \\'/srv/analyst-ai\\', \\'/srv/analyst-ai/public\\',\\n    \\'/var/www/analyst-ai\\\
        ', \\'/var/www/html\\', \\'/opt/analyst-ai/public\\',\\n    \\'/var/lib/analyst-ai/releases\\',\\n))\\nHELP_NAMES\
        \ = (\\'update-help.html\\', \\'help.html\\')\\nHELP_PREFIXES = frozenset((\\'\\', \\'/updates\\', \\'/downloads\\\
        ', \\'/releases\\'))\\nLEGACY_CADDY_ROOT = \\'/var/lib/analyst-ai\\'\\nLEGACY_HELP_ROOT = \\'/var/lib/analyst-ai/releases\\\
        '\\nLEGACY_HELP_FILE = LEGACY_HELP_ROOT + \\'/help.html\\'\\n\\n\\nclass ObservationError(RuntimeError):\\n    pass\\\
        n\\n\\ndef need(value, code):\\n    if not value:\\n        raise ObservationError(code)\\n\\n\\ndef digest(raw):\\\
        n    return hashlib.sha256(raw).hexdigest()\\n\\n\\ndef identity(raw):\\n    return {\\'bytes\\': len(raw), \\'sha256\\\
        ': digest(raw)}\\n\\n\\ndef stable(info):\\n    return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_nlink,\\\
        n            info.st_size, info.st_mtime_ns, info.st_ctime_ns)\\n\\n\\ndef trusted_read(path, maximum):\\n    need(path.is_absolute()\
        \ and path == Path(PurePosixPath(path).as_posix()), \\'noncanonical_fixed_path\\')\\n    for parent in reversed(path.parents):\\\
        n        info = parent.lstat()\\n        need(stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)\\n   \
        \          and info.st_uid == 0 and not info.st_mode & 0o022, \\'untrusted_parent\\')\\n    before = path.lstat()\\\
        n    need(stat.S_ISREG(before.st_mode) and before.st_uid == 0 and before.st_nlink == 1\\n         and not before.st_mode\
        \ & 0o022 and 0 < before.st_size <= maximum, \\'untrusted_or_oversized_file\\')\\n    descriptor = os.open(path, os.O_RDONLY\
        \ | os.O_NOFOLLOW)\\n    with os.fdopen(descriptor, \\'rb\\') as stream:\\n        need(stable(os.fstat(stream.fileno()))\
        \ == stable(before), \\'file_changed_before_read\\')\\n        raw = stream.read(maximum + 1)\\n        need(len(raw)\
        \ == before.st_size and len(raw) <= maximum\\n             and stable(os.fstat(stream.fileno())) == stable(before)\
        \ == stable(path.lstat()),\\n             \\'file_changed_during_read\\')\\n    return raw\\n\\n\\ndef observed_file(path,\
        \ maximum):\\n    try:\\n        raw = trusted_read(path, maximum)\\n        return {\\'status\\': \\'observed\\',\
        \ **identity(raw)}, raw\\n    except FileNotFoundError:\\n        return {\\'status\\': \\'absent\\'}, None\\n   \
        \ except (ObservationError, OSError, ValueError):\\n        return {\\'status\\': \\'bounded_read_unavailable\\'},\
        \ None\\n\\n\\ndef unique(pairs):\\n    value = {}\\n    for key, item in pairs:\\n        need(key not in value,\
        \ \\'duplicate_json_key\\')\\n        value[key] = item\\n    return value\\n\\n\\ndef active_caddy():\\n    connection\
        \ = http.client.HTTPConnection(\\'127.0.0.1\\', 2019, timeout=5)\\n    try:\\n        connection.request(\\'GET\\\
        ', \\'/config/\\', headers={\\'Accept\\': \\'application/json\\'})\\n        response = connection.getresponse()\\\
        n        raw = response.read(2 * 1024**2 + 1)\\n        need(response.status == 200 and 0 < len(raw) <= 2 * 1024**2,\
        \ \\'active_caddy_unavailable\\')\\n        value = json.loads(raw, object_pairs_hook=unique)\\n        need(type(value)\
        \ is dict and type(value.get(\\'apps\\', {}).get(\\'http\\', {}).get(\\'servers\\')) is dict,\\n             \\'active_caddy_schema_unavailable\\\
        ')\\n        return {\\'status\\': \\'observed\\', **identity(raw)}, value\\n    except (ObservationError, OSError,\
        \ ValueError, http.client.HTTPException):\\n        return {\\'status\\': \\'bounded_active_configuration_unavailable\\\
        '}, None\\n    finally:\\n        connection.close()\\n\\n\\ndef static_routes(config):\\n    \"\"\"Discover bounded\
        \ candidates, without claiming a guessed route is served.\\n\\n    Public body equality is required below to attest\
        \ a particular served file.\\n    Unsupported root placeholders or route rewrites remain unverified.\\n    \"\"\"\\\
        n    roots, prefixes, exact_paths = set(), {\\'\\'}, set()\\n    file_servers = html_responses = visited = 0\\n\\\
        n    def visit(value, depth=0):\\n        nonlocal file_servers, html_responses, visited\\n        visited += 1\\\
        n        need(visited <= 20000 and depth <= 32, \\'active_route_tree_exceeds_bound\\')\\n        if type(value) is\
        \ list:\\n            for item in value:\\n                visit(item, depth + 1)\\n        elif type(value) is dict:\\\
        n            handler = value.get(\\'handler\\')\\n            if handler == \\'file_server\\':\\n                file_servers\
        \ += 1\\n            if handler == \\'static_response\\':\\n                body = value.get(\\'body\\', \\'\\')\\\
        n                if isinstance(body, str) and re.search(r\\'<(?:!doctype|html|body)\\\\b\\', body, re.I):\\n     \
        \               html_responses += 1\\n            if handler in {\\'file_server\\', \\'vars\\'} and value.get(\\'root\\\
        ') in STATIC_ROOTS:\\n                roots.add(value[\\'root\\'])\\n            elif handler in {\\'file_server\\\
        ', \\'vars\\'} and value.get(\\'root\\') == LEGACY_CADDY_ROOT:\\n                # publish_moscow_release.sh installs\
        \ only this known help file\\n                # below the service\\'s data parent. Do not inspect the database\\n\
        \                # namespace or relax root-owned/non-writable ancestry checks.\\n                roots.add(LEGACY_HELP_ROOT)\\\
        n            paths = value.get(\\'path\\')\\n            if type(paths) is list:\\n                for path in paths:\\\
        n                    if not isinstance(path, str) or not re.fullmatch(r\\'/[A-Za-z0-9/_.*-]{0,160}\\', path):\\n \
        \                       continue\\n                    if path.endswith(\\'/*\\') and \\'*\\' not in path[:-1]:\\\
        n                        if path[:-2] in HELP_PREFIXES:\\n                            prefixes.add(path[:-2])\\n \
        \                   elif \\'*\\' not in path and path.rsplit(\\'/\\', 1)[0] in HELP_PREFIXES \\\\\\n             \
        \               and (path.endswith(\\'/help\\') or path.rsplit(\\'/\\', 1)[-1] in HELP_NAMES):\\n                \
        \        exact_paths.add(path)\\n            for item in value.values():\\n                if type(item) in (list,\
        \ dict):\\n                    visit(item, depth + 1)\\n\\n    visit(config)\\n    need(len(roots) <= 8 and len(prefixes)\
        \ <= 16 and len(exact_paths) <= 8, \\'static_candidate_count_exceeds_bound\\')\\n    return {\\'file_server_handlers\\\
        ': file_servers, \\'inline_html_handlers\\': html_responses,\\n            \\'allowed_static_roots\\': sorted(roots)},\
        \ sorted(roots), sorted(prefixes), sorted(exact_paths)\\n\\n\\ndef https_help(path):\\n    need(re.fullmatch(r\\'/[A-Za-z0-9/_.-]{1,200}\\\
        ', path) is not None\\n         and \\'..\\' not in PurePosixPath(path).parts, \\'unsafe_controlled_help_path\\')\\\
        n    connection = http.client.HTTPSConnection(PUBLIC_HOST, 443, timeout=6, context=ssl.create_default_context())\\\
        n    try:\\n        connection.request(\\'GET\\', path, headers={\\'Accept\\': \\'text/html\\', \\'User-Agent\\':\
        \ \\'AnalystAI-Theme46-ReadOnly\\'})\\n        response = connection.getresponse()\\n        raw = response.read(1024**2\
        \ + 1)\\n        need(len(raw) <= 1024**2, \\'public_help_body_exceeds_bound\\')\\n        return {\\'path\\': path,\
        \ \\'http_status\\': response.status,\\n                \\'html_content_type\\': response.getheader(\\'Content-Type\\\
        ', \\'\\').split(\\';\\', 1)[0].strip().lower() == \\'text/html\\',\\n                \\'redirect_followed\\': False,\
        \ **identity(raw)}\\n    except (ObservationError, OSError, ValueError, http.client.HTTPException):\\n        return\
        \ {\\'path\\': path, \\'status\\': \\'bounded_https_observation_unavailable\\', \\'redirect_followed\\': False}\\\
        n    finally:\\n        connection.close()\\n\\n\\ndef help_observation(config):\\n    if config is None:\\n     \
        \   return {\\'status\\': \\'undetermined_active_config_unavailable\\', \\'served_path_verified\\': False}\\n    try:\\\
        n        routes, roots, prefixes, exact_paths = static_routes(config)\\n        result = {**routes, \\'served_path_verified\\\
        ': False, \\'filesystem_binding_verified\\': False,\\n                  \\'deployment_target_requires_review\\': True,\
        \ \\'files\\': [], \\'public\\': []}\\n        if routes[\\'file_server_handlers\\'] == 0:\\n            result[\\\
        'status\\'] = (\\'inline_html_requires_separate_review\\' if routes[\\'inline_html_handlers\\']\\n               \
        \                 else \\'no_static_file_server_observed_in_active_caddy\\')\\n            return result\\n      \
        \  if not roots:\\n            result[\\'status\\'] = \\'active_static_root_not_in_observation_allowlist\\'\\n   \
        \         return result\\n        for root in roots:\\n            for name in ((\\'help.html\\',) if root == LEGACY_HELP_ROOT\
        \ else HELP_NAMES):\\n                path = Path(root) / name\\n                metadata, raw = observed_file(path,\
        \ 1024**2)\\n                row = {\\'path\\': str(path), **metadata}\\n                if raw is not None:\\n  \
        \                  row[\\'matches_reference44_help\\'] = identity(raw) == EXPECTED[\\'help\\'][\\'reference44\\']\\\
        n                    row[\\'matches_prepared46_help\\'] = identity(raw) == EXPECTED[\\'help\\'][\\'prepared46\\']\\\
        n                result[\\'files\\'].append(row)\\n        present = [row for row in result[\\'files\\'] if row[\\\
        'status\\'] == \\'observed\\']\\n        if not present:\\n            result[\\'status\\'] = (\\'bounded_help_candidates_unreadable\\\
        ' if\\n                                any(row[\\'status\\'] != \\'absent\\' for row in result[\\'files\\']) else\\\
        n                                \\'help_file_absent_in_bounded_active_static_roots\\')\\n            return result\\\
        n        addresses = {row[4][0] for row in socket.getaddrinfo(PUBLIC_HOST, 443, family=socket.AF_INET,\\n        \
        \                                                  type=socket.SOCK_STREAM)}\\n        need(addresses == {PUBLIC_IP},\
        \ \\'public_host_not_exact_runtime_ipv4\\')\\n        names = {Path(row[\\'path\\']).name for row in present if row[\\\
        'path\\'] != LEGACY_HELP_FILE}\\n        paths = sorted(set(exact_paths) | {prefix + \\'/\\' + name for prefix in\
        \ prefixes for name in names})\\n        if any(row[\\'path\\'] == LEGACY_HELP_FILE for row in present):\\n      \
        \      paths = sorted(set(paths) | {\\'/releases/help.html\\'})\\n        need(len(paths) <= 12, \\'public_help_candidate_count_exceeds_bound\\\
        ')\\n        for path in paths:\\n            public = https_help(path)\\n            matches = [row[\\'path\\'] for\
        \ row in present if public.get(\\'http_status\\') == 200\\n                       and public.get(\\'html_content_type\\\
        ') is True and\\n                       public.get(\\'bytes\\') == row[\\'bytes\\'] and public.get(\\'sha256\\') ==\
        \ row[\\'sha256\\']]\\n            if matches:\\n                public[\\'matching_static_files\\'] = matches\\n\
        \                result[\\'served_path_verified\\'] = True\\n            result[\\'public\\'].append(public)\\n  \
        \      result[\\'status\\'] = \\'served_help_bytes_verified\\' if result[\\'served_path_verified\\'] else \\'help_candidates_not_verified_as_served\\\
        '\\n        return result\\n    except (ObservationError, OSError, ValueError, TypeError, KeyError):\\n        return\
        \ {\\'status\\': \\'bounded_help_discovery_unavailable\\', \\'served_path_verified\\': False}\\n\\n\\ndef service_state(name):\\\
        n    need(name in {\\'analyst-ai-owner.service\\', \\'analyst-ai-updates.service\\'}, \\'unexpected_service\\')\\\
        n    try:\\n        value = subprocess.run([\\'systemctl\\', \\'is-active\\', name], stdin=subprocess.DEVNULL,\\n\
        \                               stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=5, check=False)\\n    \
        \    state = value.stdout.decode(\\'ascii\\').strip()\\n        return state if state in {\\'active\\', \\'inactive\\\
        ', \\'failed\\', \\'activating\\', \\'deactivating\\', \\'unknown\\'} else \\'unavailable\\'\\n    except (OSError,\
        \ ValueError, subprocess.TimeoutExpired):\\n        return \\'unavailable\\'\\n\\n\\ndef main():\\n    need(sys.platform\
        \ == \\'linux\\' and os.getuid() == 0, \\'wrong_observer_platform\\')\\n    need(set(EXPECTED[\\'sources\\']) == {\\\
        'app.py\\', \\'telegram_browser_app.py\\', \\'owner_app.py\\'}, \\'wrong_source_scope\\')\\n    sources = {}\\n  \
        \  for name, expected in EXPECTED[\\'sources\\'].items():\\n        metadata, raw = observed_file(SOURCE_ROOT / name,\
