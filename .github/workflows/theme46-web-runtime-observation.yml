        ']\\n        sources[name] = metadata\\n    configuration = {}\\n    for name in CONFIG_PATHS:\\n        metadata,\
        \ raw = observed_file(Path(name), 128 * 1024)\\n        if raw is not None and name.endswith(\\'/analyst-ai-owner.service\\\
        '):\\n            text = raw.decode(\\'utf-8\\')\\n            metadata[\\'expected_owner_factory_entrypoint\\'] =\
        \ bool(re.search(\\n                r\\'^ExecStart=/opt/analyst-ai/venv/bin/uvicorn owner_app:create_app --factory\
        \ --host 127\\\\.0\\\\.0\\\\.1 --port 8080 --workers 1$\\',\\n                text, re.M))\\n            metadata[\\\
        'expected_working_directory\\'] = bool(re.search(r\\'^WorkingDirectory=/opt/analyst-ai/backend$\\', text, re.M))\\\
        n        configuration[name] = metadata\\n    active, config = active_caddy()\\n    result = {\\n        \\'schema\\\
        ': 1, \\'kind\\': \\'theme46_runtime_readonly_comparison\\',\\n        \\'observed_at\\': datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\
        n        \\'runtime_server_id\\': 9417611, \\'public_host\\': PUBLIC_HOST,\\n        \\'reference44_source_sha256\\\
