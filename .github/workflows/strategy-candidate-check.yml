name: Strategy candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/strategy-candidate-check.yml

permissions:
  contents: read

concurrency:
  group: strategy-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 751 &&
      github.event.pull_request.head.ref == 'feature/strategy-account-assessment' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact released baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c0e2f71c6bacbd9a34fedba2262ce8f7efd8b38
          persist-credentials: false
          clean: true
      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Verify fixed source manifest and publish immutable blobs only
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          "%OMNICIO_PYTHON%" -c "import base64,hashlib,json,os,textwrap,urllib.request; sha='ac268b2b6ba9aff77524886416454b4839ea55da'; req=urllib.request.Request('https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'OmniCIO-reviewed-source-delivery'}); response=urllib.request.urlopen(req,timeout=30); raw=base64.b64decode(json.load(response)['content']); response.close(); assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha; script=textwrap.dedent(raw.decode('utf-8').split('        run: |\n',1)[1].split('      - name: Preserve verified source identities',1)[0]); exec(compile(script,'verified-source-delivery','exec'))"
      - name: Preserve verified source identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-candidate-blobs-751
          path: candidate-blobs.json
          retention-days: 1
          if-no-files-found: error
