name: Strategy candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/strategy-candidate-check.yml

permissions:
  contents: write

concurrency:
  group: strategy-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.head.ref == 'feature/strategy-account-assessment' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout exact inspected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 48fba00a18067dc9f1367fe5b750b95bc705a0ef
          persist-credentials: false
          clean: true
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          call .github\scripts\bootstrap_self_hosted_python.cmd
          if errorlevel 1 exit /b 1
          for %%I in ("%OMNICIO_PYTHON%") do echo %%~dpI>>"%GITHUB_PATH%"
      - name: Verify two-file repair and publish immutable source objects only
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import zlib

          base = '48fba00a18067dc9f1367fe5b750b95bc705a0ef'
          main = '0c0e2f71c6bacbd9a34fedba2262ce8f7efd8b38'
          expected = os.environ['EXPECTED_HEAD']
          api = 'https://api.github.com/repos/MishaGameHacking/omni-cio-gateway'
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                     'User-Agent': 'OmniCIO-reviewed-source-delivery',
                     'Accept': 'application/vnd.github+json'}
          def request(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              for attempt in range(3):
                  req = urllib.request.Request(api + path, data=payload, headers=headers,
                                               method='GET' if data is None else 'POST')
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          raw = response.read(2000000)
                          assert len(raw) < 2000000
                          return json.loads(raw)
                  except urllib.error.HTTPError:
                      raise
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          def gitsha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def check_refs():
              assert request('/git/ref/heads/main')['object']['sha'] == main
              assert request('/git/ref/heads/feature/strategy-account-assessment')['object']['sha'] == expected

          check_refs()
          commit = request('/git/commits/' + expected)
          assert [row['sha'] for row in commit['parents']] == [base]
          packed = ''
          raw_manifest = zlib.decompress(base64.b64decode(packed))
          assert hashlib.sha256(raw_manifest).hexdigest() == '1770a7185dd7fef5b34abea1b733f8a2c7c7c87a6b093ede0968be0cd545a1e4'
          manifest = json.loads(raw_manifest)
          assert manifest['base'] == base
          allowed = {'.github/scripts/timeweb_auth_app.py', '.github/scripts/test_timeweb_auth_app.py'}
          assert set(manifest['files']) == allowed
          prepared = {}
          for path, change in manifest['files'].items():
              original = subprocess.check_output(['git', 'show', base + ':' + path])
              assert gitsha(original) == change['before']
              lines = original.decode('utf-8').splitlines(keepends=True)
              bound = len(lines)
              for start, end, replacement in reversed(change['edits']):
                  assert type(start) is int and type(end) is int and 0 <= start <= end <= bound
                  lines[start:end] = [replacement]
                  bound = start
              content = ''.join(lines).encode('utf-8')
              assert gitsha(content) == change['after']
              prepared[path] = content
          check_refs()
          published = {}
          for path, content in prepared.items():
              result = request('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              assert result['sha'] == manifest['files'][path]['after']
              published[path] = result['sha']
          pathlib.Path('candidate-blobs.json').write_text(json.dumps({'base': base, 'head': expected, 'files': published}, indent=2), encoding='utf-8')
          print('Verified immutable repair files:', json.dumps(published, sort_keys=True))
      - name: Preserve verified source identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-preflight-blobs-751
          path: candidate-blobs.json
          retention-days: 1
          if-no-files-found: error
