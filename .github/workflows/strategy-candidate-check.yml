name: Strategy candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/strategy-candidate-check.yml

permissions:
  contents: read

concurrency:
  group: strategy-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 751 &&
      github.event.pull_request.head.ref == 'feature/strategy-account-assessment' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout exact released baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c0e2f71c6bacbd9a34fedba2262ce8f7efd8b38
          persist-credentials: false
          clean: true
      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Resolve existing locked Linux review wheels
        shell: cmd
        run: >-
          "%OMNICIO_PYTHON%" -c "import hashlib,pathlib,tomllib,urllib.request; names={'ruff','mypy','mypy-extensions','pathspec','librt','psycopg','psycopg-binary','psycopg-pool'}; packages=tomllib.loads(pathlib.Path('uv.lock').read_text(encoding='utf-8'))['package']; out=pathlib.Path('review-wheels'); out.mkdir(exist_ok=True); selected=[next(w for w in p['wheels'] if w['url'].endswith('none-any.whl') or ('x86_64' in w['url'] and 'manylinux' in w['url'] and ('cp313-cp313' in w['url'] or 'py3-none' in w['url']))) for p in packages if p['name'] in names]; assert len(selected)==len(names); [(lambda w,raw: (raw if hashlib.sha256(raw).hexdigest()==w['hash'].split(':')[1] else (_ for _ in ()).throw(ValueError('wheel hash mismatch')), (out/w['url'].rsplit('/',1)[1]).write_bytes(raw)))(w,urllib.request.urlopen(w['url'],timeout=30).read(25000000)) for w in selected]; print('Verified locked review wheels:',len(selected))"
      - name: Preserve verified development tools only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-review-wheels
          path: review-wheels/*.whl
          retention-days: 1
          if-no-files-found: error
