name: V10 Cloudflare Production Release

on:
  workflow_run:
    workflows:
      - Regression Shield
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact accepted main SHA to recover/retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v10-cloudflare-production-release
  cancel-in-progress: false

jobs:
  inspect_database_state:
    name: CF-D exact-main database state and staging anchor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      staging_bootstrap_required: ${{ steps.staging_database_state.outputs.bootstrap_required }}
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact accepted main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Require all exact-main post-merge push workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.check_v10_cloudflare_postmerge_release_gate \
            --expected-sha "$EXPECTED_HEAD" \
            --wait-seconds 900 \
            --poll-seconds 15

      - name: Resolve provider authority fail-closed without identifier logging
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.check_v10_cloudflare_provider_readiness

      - name: Verify Workers Builds authority before candidate or production mutation
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_workers_builds_authority

      - name: Install exact Cloudflare delivery toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          python -m scripts.install_v10_cloudflare_delivery_toolchain
          test "$(node ./node_modules/npm/bin/npm-cli.js --version)" = "11.16.0"
          test "$(node ./node_modules/wrangler/bin/wrangler.js --version | awk '{print $NF}')" = "4.127.1"

      - name: Verify Cloudflare Containers registry read authority
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_container_registry_authority

      - name: Ensure isolated staging Worker anchor before recovery probe
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          python -m scripts.probe_v10_cloudflare_staging_worker_anchor --environment staging
          anchor_rc=$?
          set -e
          case "$anchor_rc" in
            0)
              ;;
            10)
              ./node_modules/.bin/wrangler deploy --config cloudflare/wrangler.bootstrap.staging.jsonc
              python -m scripts.probe_v10_cloudflare_staging_worker_anchor --environment staging
              ;;
            *)
              exit "$anchor_rc"
              ;;
          esac

      - name: Probe reusable staging runtime secret before Neon management API
        id: staging_database_state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt"
          set +e
          python -m scripts.probe_v10_cloudflare_staging_runtime_secret
          secret_rc=$?
          set -e
          case "$secret_rc" in
            0)
              echo "bootstrap_required=false" >> "$GITHUB_OUTPUT"
              echo "CLOUDFLARE_STAGING_DATABASE_ROLE=UNCHANGED"
              ;;
            10)
              echo "bootstrap_required=true" >> "$GITHUB_OUTPUT"
              echo "CLOUDFLARE_STAGING_DATABASE_RECOVERY=HOSTED_EGRESS_REQUIRED"
              ;;
            *)
              exit "$secret_rc"
              ;;
          esac

      - name: Clean database-state workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  bootstrap_staging_database:
    name: CF-D hosted staging database recovery
    needs: inspect_database_state
    if: >-
      !cancelled() &&
      needs.inspect_database_state.result == 'success' &&
      needs.inspect_database_state.outputs.staging_bootstrap_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

    steps:
      - name: Bootstrap exact accepted main on hosted recovery egress
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Set up protected Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact hosted Neon control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.build_v10_cloudflare_hosted_control_plane_lock
          hosted_lock="${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          test -s "$hosted_lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --force-reinstall -r "$hosted_lock"
          python -c "from scripts.build_v10_cloudflare_hosted_control_plane_lock import verify_installed_control_plane_versions as verify; verify()"

      - name: Bootstrap staging database secret through hosted egress
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          python -m scripts.bootstrap_v10_cloudflare_neon_hosted_egress \
            bootstrap-staging \
            --expected-sha "$EXPECTED_HEAD"
          hosted_rc=$?
          set -e
          if [ "$hosted_rc" -ne 0 ]; then
            python -m scripts.probe_v10_neon_authority_diagnostics || true
            exit "$hosted_rc"
          fi

      - name: Clean hosted staging recovery workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true

  rehearse:
    name: CF-D exact-main staging rehearsal and production database state
    needs:
      - inspect_database_state
      - bootstrap_staging_database
    if: >-
      !cancelled() &&
      needs.inspect_database_state.result == 'success' &&
      (needs.inspect_database_state.outputs.staging_bootstrap_required == 'false' ||
       needs.bootstrap_staging_database.result == 'success')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      production_bootstrap_required: ${{ steps.production_database_state.outputs.bootstrap_required }}
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact accepted main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Recheck exact-main post-merge gate before staging rehearsal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.check_v10_cloudflare_postmerge_release_gate \
            --expected-sha "$EXPECTED_HEAD" \
            --wait-seconds 0 \
            --poll-seconds 1

      - name: Install exact Cloudflare delivery toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          python -m scripts.install_v10_cloudflare_delivery_toolchain
          test "$(node ./node_modules/npm/bin/npm-cli.js --version)" = "11.16.0"
          test "$(node ./node_modules/wrangler/bin/wrangler.js --version | awk '{print $NF}')" = "4.127.1"

      - name: Confirm reusable staging runtime secret ready
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_staging_runtime_secret

      - name: Rehearse exact accepted main on isolated staging Worker and Container
        id: candidate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bootstrap_origin_file="${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt"
          rm -f "$bootstrap_origin_file"
          python -m scripts.probe_v10_cloudflare_staging_worker_anchor --environment staging
          python -m scripts.quarantine_v10_cloudflare_staging_trigger \
            --expected-sha "$EXPECTED_HEAD"
          python -m scripts.run_v10_cloudflare_gated_candidate \
            --expected-sha "$EXPECTED_HEAD" \
            --source-branch main
          test -s "$bootstrap_origin_file"

      - name: Accept exact-main staging rehearsal
        shell: bash
        env:
          OMNI_V10_CLOUDFLARE_ORIGIN: ${{ steps.candidate.outputs.staging_url }}
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 40); do
            if bash scripts/probe_v10_cloudflare_live_release.sh "$EXPECTED_HEAD" false; then
              accepted=1
              break
            fi
            echo "CLOUDFLARE_POSTMERGE_CANDIDATE_RETRY attempt=${attempt}/40"
            sleep 15
          done
          test "$accepted" -eq 1
          echo "CLOUDFLARE_POSTMERGE_CANDIDATE=ACCEPTED"

      - name: Validate canonical public domain configuration
        shell: cmd
        env:
          OMNI_V10_CLOUDFLARE_CUSTOM_HOST: ${{ secrets.OMNI_V10_CLOUDFLARE_CUSTOM_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
        run: python -m scripts.manage_v10_cloudflare_production validate-domain-config

      - name: Bootstrap production Worker anchor without public route if absent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          python -m scripts.probe_v10_cloudflare_staging_worker_anchor --environment production
          anchor_rc=$?
          set -e
          case "$anchor_rc" in
            0)
              ;;
            10)
              ./node_modules/.bin/wrangler deploy --config cloudflare/wrangler.bootstrap.production.jsonc
              python -m scripts.probe_v10_cloudflare_staging_worker_anchor --environment production
              ;;
            *)
              exit "$anchor_rc"
              ;;
          esac

      - name: Probe production database secret
        id: production_database_state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt"
          set +e
          python -m scripts.manage_v10_cloudflare_production probe-runtime-secret
          secret_rc=$?
          set -e
          case "$secret_rc" in
            0)
              echo "CLOUDFLARE_PRODUCTION_DATABASE_ROLE=UNCHANGED"
              echo "bootstrap_required=false" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "bootstrap_required=true" >> "$GITHUB_OUTPUT"
              echo "CLOUDFLARE_PRODUCTION_DATABASE_RECOVERY=HOSTED_EGRESS_REQUIRED"
              ;;
            *)
              exit "$secret_rc"
              ;;
          esac

      - name: Quarantine staging trigger and clean rehearsal workspace
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          python -m scripts.quarantine_v10_cloudflare_staging_trigger \
            --expected-sha "$EXPECTED_HEAD"
          quarantine_rc=$?
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
          exit "$quarantine_rc"

  bootstrap_production_database:
    name: CF-D hosted production database recovery
    needs: rehearse
    if: >-
      !cancelled() &&
      needs.rehearse.result == 'success' &&
      needs.rehearse.outputs.production_bootstrap_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

    steps:
      - name: Bootstrap exact accepted main on hosted recovery egress
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Set up protected Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact hosted Neon control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.build_v10_cloudflare_hosted_control_plane_lock
          hosted_lock="${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          test -s "$hosted_lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --force-reinstall -r "$hosted_lock"
          python -c "from scripts.build_v10_cloudflare_hosted_control_plane_lock import verify_installed_control_plane_versions as verify; verify()"

      - name: Bootstrap production database secret through hosted egress
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          python -m scripts.bootstrap_v10_cloudflare_neon_hosted_egress \
            bootstrap-production \
            --expected-sha "$EXPECTED_HEAD"
          hosted_rc=$?
          set -e
          if [ "$hosted_rc" -ne 0 ]; then
            python -m scripts.probe_v10_neon_authority_diagnostics || true
            exit "$hosted_rc"
          fi

      - name: Clean hosted production recovery workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true

  promote:
    name: CF-D exact-main gated production promotion
    needs:
      - rehearse
      - bootstrap_production_database
    if: >-
      !cancelled() &&
      needs.rehearse.result == 'success' &&
      (needs.rehearse.outputs.production_bootstrap_required == 'false' ||
       needs.bootstrap_production_database.result == 'success')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      OMNI_V10_PRODUCTION_DEPLOY_ATTEMPTED: "0"

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact accepted main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Recheck Cloudflare authority before production mutation
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.check_v10_cloudflare_provider_readiness

      - name: Recheck Workers Builds authority before production mutation
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_workers_builds_authority

      - name: Install exact Cloudflare delivery toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          python -m scripts.install_v10_cloudflare_delivery_toolchain
          test "$(node ./node_modules/npm/bin/npm-cli.js --version)" = "11.16.0"
          test "$(node ./node_modules/wrangler/bin/wrangler.js --version | awk '{print $NF}')" = "4.127.1"

      - name: Recheck Cloudflare Containers registry read authority
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_container_registry_authority

      - name: Confirm production database secret ready
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python -m scripts.manage_v10_cloudflare_production probe-runtime-secret

      - name: Quarantine stale production Builds before rollback snapshot
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python -m scripts.run_v10_cloudflare_gated_production \
            --expected-sha "$EXPECTED_HEAD" \
            --quarantine-only

      - name: Snapshot current production Worker version for bounded rollback
        id: rollback_snapshot
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.manage_v10_cloudflare_production snapshot-active-deployment

      - name: Recheck exact current main immediately before production promotion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.check_v10_cloudflare_postmerge_release_gate \
            --expected-sha "$EXPECTED_HEAD" \
            --wait-seconds 0 \
            --poll-seconds 1

      - name: Deploy exact accepted main through gated Cloudflare Workers Build
        id: production_deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "OMNI_V10_PRODUCTION_DEPLOY_ATTEMPTED=1" >> "$GITHUB_ENV"
          python -m scripts.run_v10_cloudflare_gated_production \
            --expected-sha "$EXPECTED_HEAD"

      - name: Attach or verify canonical Cloudflare Custom Domain
        id: domain
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OMNI_V10_CLOUDFLARE_CUSTOM_HOST: ${{ secrets.OMNI_V10_CLOUDFLARE_CUSTOM_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
        run: python -m scripts.manage_v10_cloudflare_production attach-domain

      - name: Accept canonical Cloudflare production release
        id: live_acceptance
        shell: bash
        env:
          OMNI_V10_CLOUDFLARE_ORIGIN: https://${{ secrets.OMNI_V10_CLOUDFLARE_CUSTOM_HOST }}
          OMNI_V10_CLOUDFLARE_CUSTOM_HOST: ${{ secrets.OMNI_V10_CLOUDFLARE_CUSTOM_HOST }}
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 60); do
            if bash scripts/probe_v10_cloudflare_live_release.sh "$EXPECTED_HEAD" false; then
              accepted=1
              break
            fi
            echo "CLOUDFLARE_PRODUCTION_LIVE_RETRY attempt=${attempt}/60"
            sleep 15
          done
          test "$accepted" -eq 1
          echo "CLOUDFLARE_CF_D_LIVE=ACCEPTED"

      - name: Record accepted production evidence
        if: success()
        shell: bash
        env:
          BUILD_UUID: ${{ steps.production_deploy.outputs.cloudflare_build_uuid }}
        run: |
          {
            echo "### V10 Cloudflare CF-D production release"
            echo "- exact accepted main SHA: \`${EXPECTED_HEAD}\`"
            echo "- all observed post-merge push workflows: PASS"
            echo "- exact-main isolated staging rehearsal: PASS"
            echo "- database recovery egress: hosted only when a runtime secret is absent"
            echo "- production Worker + Container build: PASS"
            echo "- canonical custom domain: PASS"
            echo "- exact-SHA / health / database live acceptance: PASS"
            echo "- Cloudflare build UUID: \`${BUILD_UUID}\`"
            echo "- PUBLIC_MULTI_USER_ENABLED: false"
            echo "- broker write / Real execution: OFF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back failed production attempt to captured prior version
        if: >-
          always() && env.OMNI_V10_PRODUCTION_DEPLOY_ATTEMPTED == '1' &&
          (steps.production_deploy.outcome != 'success' ||
           steps.domain.outcome != 'success' ||
           steps.live_acceptance.outcome != 'success')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OMNI_V10_CLOUDFLARE_CUSTOM_HOST: ${{ secrets.OMNI_V10_CLOUDFLARE_CUSTOM_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          PREVIOUS_VERSION_ID: ${{ steps.rollback_snapshot.outputs.previous_version_id }}
          CUSTOM_DOMAIN_CREATED: ${{ steps.domain.outputs.custom_domain_created }}
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_VERSION_ID"
          ./node_modules/.bin/wrangler rollback "$PREVIOUS_VERSION_ID" \
            --name omni-cio-v10-web \
            --message "Automated rollback after failed exact-main CF-D acceptance"
          if [[ "$CUSTOM_DOMAIN_CREATED" == "true" ]]; then
            python -m scripts.manage_v10_cloudflare_production detach-domain-if-owned
          fi
          echo "CLOUDFLARE_PRODUCTION_ROLLBACK=COMPLETED"

      - name: Quarantine staging trigger and clean secrets/workspace
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          python -m scripts.quarantine_v10_cloudflare_staging_trigger \
            --expected-sha "$EXPECTED_HEAD"
          quarantine_rc=$?
          rm -f -- \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-production-dsn.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-bootstrap-origin.txt" \
            "${RUNNER_TEMP}/omni-cio-v10-cloudflare-hosted-control-plane.txt"
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
          exit "$quarantine_rc"

  release_outcome:
    name: CF-D release DAG terminal fail-closed gate
    needs:
      - inspect_database_state
      - bootstrap_staging_database
      - rehearse
      - bootstrap_production_database
      - promote
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce required recovery and promotion outcomes
        shell: bash
        env:
          INSPECT_RESULT: ${{ needs.inspect_database_state.result }}
          STAGING_REQUIRED: ${{ needs.inspect_database_state.outputs.staging_bootstrap_required }}
          STAGING_RECOVERY_RESULT: ${{ needs.bootstrap_staging_database.result }}
          REHEARSE_RESULT: ${{ needs.rehearse.result }}
          PRODUCTION_REQUIRED: ${{ needs.rehearse.outputs.production_bootstrap_required }}
          PRODUCTION_RECOVERY_RESULT: ${{ needs.bootstrap_production_database.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          test "$INSPECT_RESULT" = "success"
          case "$STAGING_REQUIRED" in
            true|false) ;;
            *) echo "CLOUDFLARE_RELEASE_DAG_INVALID staging_bootstrap_required=${STAGING_REQUIRED:-missing}" >&2; exit 31 ;;
          esac
          if [ "$STAGING_REQUIRED" = "true" ]; then
            test "$STAGING_RECOVERY_RESULT" = "success"
          fi
          test "$REHEARSE_RESULT" = "success"
          case "$PRODUCTION_REQUIRED" in
            true|false) ;;
            *) echo "CLOUDFLARE_RELEASE_DAG_INVALID production_bootstrap_required=${PRODUCTION_REQUIRED:-missing}" >&2; exit 32 ;;
          esac
          if [ "$PRODUCTION_REQUIRED" = "true" ]; then
            test "$PRODUCTION_RECOVERY_RESULT" = "success"
          fi
          test "$PROMOTE_RESULT" = "success"
          echo "CLOUDFLARE_RELEASE_DAG=TERMINAL_SUCCESS"
