name: Live Read-Only Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
    paths:
      - ".github/workflows/live-read-only-acceptance.yml"
      - "omni_cio/contracts/v1/release.py"
      - "omni_cio/release/live_acceptance_v1.py"
      - "scripts/check_live_read_only_release.py"
      - "tests/test_live_acceptance_repository_assets.py"
      - "tests/test_live_read_only_acceptance_v1.py"

permissions:
  contents: read

concurrency:
  group: live-read-only-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-release:
    name: Verify deployed health and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNI_LIVE_BASE_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements.txt

      - name: Verify deployed read-only release
        run: python scripts/check_live_read_only_release.py
