name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Query current main Sonar issues
        shell: cmd
        run: |
          echo === ALL_ISSUES ===
          curl.exe -fSs "https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&ps=100"
          if errorlevel 1 exit /b 1
          echo.
          echo === ACCEPTED ===
          curl.exe -fSs "https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&issueStatuses=ACCEPTED&ps=100"
          if errorlevel 1 exit /b 1
          echo.
          echo === OPEN_CONFIRMED_ACCEPTED ===
          curl.exe -fSs "https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&issueStatuses=OPEN,CONFIRMED,ACCEPTED&ps=100"
          if errorlevel 1 exit /b 1
          echo.
          echo === NEW_OPEN_CONFIRMED ===
          curl.exe -fSs "https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&issueStatuses=OPEN,CONFIRMED&sinceLeakPeriod=true&ps=100"
          if errorlevel 1 exit /b 1
