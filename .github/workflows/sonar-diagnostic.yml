name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    permissions:
      contents: read
      checks: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Read annotations from failed Sonar check
        shell: cmd
        run: |
          curl.exe -fSs ^
            -H "Authorization: Bearer %GH_TOKEN%" ^
            -H "Accept: application/vnd.github+json" ^
            -H "X-GitHub-Api-Version: 2022-11-28" ^
            "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/114678890853/annotations?per_page=100"
          if errorlevel 1 exit /b 1
