name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Query current main Sonar state
        shell: cmd
        run: |
          echo === COMPONENT ===
          curl.exe -sS -w "\nHTTP=%%{http_code}\n" "https://sonarcloud.io/api/components/show?component=MishaGameHacking_omni-cio-gateway"
          echo.
          echo === QUALITY_GATE ===
          curl.exe -sS -w "\nHTTP=%%{http_code}\n" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=MishaGameHacking_omni-cio-gateway&branch=main"
          echo.
          echo === BRANCHES ===
          curl.exe -sS -w "\nHTTP=%%{http_code}\n" "https://sonarcloud.io/api/project_branches/list?project=MishaGameHacking_omni-cio-gateway"
          echo.
          echo === ALL_ISSUES_COMPONENTKEYS ===
          curl.exe -sS -w "\nHTTP=%%{http_code}\n" "https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&ps=100"
          echo.
          echo === ALL_ISSUES_COMPONENTS ===
          curl.exe -sS -w "\nHTTP=%%{http_code}\n" "https://sonarcloud.io/api/issues/search?components=MishaGameHacking_omni-cio-gateway&branch=main&ps=100"
