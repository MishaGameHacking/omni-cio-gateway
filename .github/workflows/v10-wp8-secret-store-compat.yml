name: V10 WP8 Secret Store Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp8-secret-store-compat.yml"
      - ".github/workflows/v10-wp8-secret-store-audit.yml"
      - "docs/architecture/V10_WP8_**"
      - "docs/architecture/DECISIONS.md"
      - "docs/operations/V10_WP8_**"
      - "infrastructure/windows/*wp8*"
      - "scripts/*wp8*"
      - "tests/test_v10_wp8_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp8-secret-store-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows-preview:
    name: Clean Windows non-mutating WP8 preview
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify WP8 static secret-store contract
        shell: pwsh
        run: |
          python scripts/check_v10_wp8_secret_store_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP8 PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "infrastructure\windows\provision_wp8_secret_store.ps1",
            "infrastructure\windows\manage_wp8_secret.ps1",
            "infrastructure\windows\rollback_wp8_secret_store.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Prove WP8 preview does not mutate clean hosted node
        shell: powershell
        run: |
          $trackedPaths = @(
            "C:\ProgramData\OmniCIO\wp8",
            "C:\ProgramData\OmniCIO\secrets\read-broker",
            "C:\ProgramData\OmniCIO\secrets\execution\wp8-trading",
            "C:\ProgramData\OmniCIO\secrets\telegram",
            "C:\ProgramData\OmniCIO\secrets\encryption",
            "C:\ProgramData\OmniCIO\secrets\external"
          )
          $before = @{}
          foreach ($path in $trackedPaths) {
            $before[$path] = Test-Path -LiteralPath $path
          }

          $profilePath = Join-Path $env:RUNNER_TEMP "wp8-clean-preview.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\provision_wp8_secret_store.ps1 -AsJson `
            > $profilePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if ($profile.mode -ne "PREVIEW") { exit 1 }
          if ($profile.status -notin @("OWNER_ACTION_REQUIRED", "PASS")) { exit 1 }
          if ($profile.real_secret_values_used -ne $false) { exit 1 }
          foreach ($name in @(
            "raw_usernames_collected",
            "sids_emitted",
            "hostnames_collected",
            "addresses_collected",
            "secret_values_collected",
            "secret_hashes_collected",
            "ciphertext_collected",
            "account_ids_collected",
            "private_data_collected",
            "process_dumps_collected"
          )) {
            if ($profile.privacy.$name -ne $false) { exit 1 }
          }

          foreach ($path in $trackedPaths) {
            if ((Test-Path -LiteralPath $path) -ne $before[$path]) {
              Write-Error "WP8 preview mutated tracked path state."
              exit 1
            }
          }
          Remove-Item -LiteralPath $profilePath -Force

      - name: Prove WP8 rollback preview is non-mutating
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\rollback_wp8_secret_store.ps1 -AsJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
