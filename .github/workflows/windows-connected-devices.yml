name: Observe already connected Android devices without installing
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-connected-devices.yml
permissions:
  contents: read
concurrency:
  group: analyst-existing-device-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 40
    env:
      DEVICE_OBSERVER_ROOT: ${{ github.workspace }}\device-observer-${{ github.run_id }}-${{ github.run_attempt }}\checkout
      PATCH_DIR: ${{ github.workspace }}\device-observer-${{ github.run_id }}-${{ github.run_attempt }}\transport
    steps:
    - name: Require the existing Windows laptop and a new owned observation directory
      shell: cmd
      run: 'py -3 -c "import os,sys,pathlib; assert sys.platform==''win32'' and os.environ.get(''COMPUTERNAME'')==''LAPTOP-NPSGA016'';
        assert sys.version_info[:3]==(3,14,6); p=pathlib.Path(os.environ[''DEVICE_OBSERVER_ROOT'']).parent; assert not p.exists()
        and not p.is_symlink(); p.mkdir(); pathlib.Path(os.environ[''PATCH_DIR'']).mkdir()"

        if errorlevel 1 exit /b 1'
    - name: Read pinned canonical lease from the exact source backup
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 1cc05586b6874bfdd0cdb80131d178de9f95870c
        path: device-observer-${{ github.run_id }}-${{ github.run_attempt }}/checkout
        persist-credentials: false
        clean: false
    - name: 'Stage verified administrative transport: observe-devices.py'
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''PATCH_DIR''])/''observe-devices.py.b64''; p.open(''w'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''PATCH_DIR'']); b=zlib.decompress(base64.b64decode((p/''observe-devices.py.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''a6f22df414ba0a73a2f83ad0efa2e32c8c074efb6a020831e77f37d7b9e29ab2''; (p/''observe-devices.py'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Read authorized local ADB connections under the existing lease
      shell: cmd
      timeout-minutes: 35
      run: 'py -3 "%PATCH_DIR%\observe-devices.py"

        if errorlevel 1 exit /b 1'
    - name: Retain only bounded aggregate device metadata
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows-existing-device-observation
        path: ${{ github.workspace }}/device-observer-${{ github.run_id }}-${{ github.run_attempt }}/device-connection-observation.json
        retention-days: 3
        if-no-files-found: error
