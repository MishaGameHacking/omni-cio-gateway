name: V10 WP9 Scheduler ACL Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-wp9-scheduler-acl-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Hosted Windows Task Scheduler ACL probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Exercise read-only Task Scheduler security descriptors
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $folderName = "OmniCIO-WP9-Acl-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $taskPath = "\$folderName\V10\"
          $taskName = "WP9.ReadOnly.Acl.Probe"
          $service = New-Object -ComObject "Schedule.Service"
          $service.Connect()
          $root = $service.GetFolder("\")
          $syntheticSid = [System.Security.Principal.SecurityIdentifier]::new(
            "S-1-5-21-111111111-222222222-333333333-4444"
          )

          function Ensure-SchedulerObjectReadAccess {
            param(
              [object]$SchedulerObject,
              [System.Security.Principal.SecurityIdentifier]$RunnerSid
            )
            $daclSecurityInformation = 4
            $fileGenericRead = 0x00120089
            $sddl = [string]$SchedulerObject.GetSecurityDescriptor($daclSecurityInformation)
            if ([string]::IsNullOrWhiteSpace($sddl)) { throw "SDDL unavailable" }
            $descriptor = [System.Security.AccessControl.RawSecurityDescriptor]::new($sddl)
            if ($null -eq $descriptor.DiscretionaryAcl) { throw "DACL unavailable" }
            foreach ($ace in @($descriptor.DiscretionaryAcl)) {
              if (
                $ace -is [System.Security.AccessControl.CommonAce] -and
                $ace.AceQualifier -eq [System.Security.AccessControl.AceQualifier]::AccessAllowed -and
                $null -ne $ace.SecurityIdentifier -and
                $ace.SecurityIdentifier.Value -eq $RunnerSid.Value -and
                (($ace.AccessMask -band $fileGenericRead) -eq $fileGenericRead)
              ) { return }
            }
            $readAce = [System.Security.AccessControl.CommonAce]::new(
              [System.Security.AccessControl.AceFlags]::None,
              [System.Security.AccessControl.AceQualifier]::AccessAllowed,
              $fileGenericRead,
              $RunnerSid,
              $false,
              $null
            )
            $descriptor.DiscretionaryAcl.InsertAce($descriptor.DiscretionaryAcl.Count, $readAce)
            $newSddl = $descriptor.GetSddlForm([System.Security.AccessControl.AccessControlSections]::Access)
            $SchedulerObject.SetSecurityDescriptor($newSddl, 0)
          }

          function Assert-ReadAce {
            param(
              [object]$SchedulerObject,
              [System.Security.Principal.SecurityIdentifier]$RunnerSid
            )
            $descriptor = [System.Security.AccessControl.RawSecurityDescriptor]::new(
              [string]$SchedulerObject.GetSecurityDescriptor(4)
            )
            $fileGenericRead = 0x00120089
            $matches = @(
              $descriptor.DiscretionaryAcl | Where-Object {
                $_ -is [System.Security.AccessControl.CommonAce] -and
                $_.AceQualifier -eq [System.Security.AccessControl.AceQualifier]::AccessAllowed -and
                $null -ne $_.SecurityIdentifier -and
                $_.SecurityIdentifier.Value -eq $RunnerSid.Value -and
                (($_.AccessMask -band $fileGenericRead) -eq $fileGenericRead)
              }
            )
            if ($matches.Count -ne 1) { throw "Read-only ACE did not round-trip exactly once" }
          }

          try {
            [void]$root.CreateFolder($folderName)
            $parent = $service.GetFolder("\$folderName")
            [void]$parent.CreateFolder("V10")
            $folder = $service.GetFolder("\$folderName\V10")

            $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\cmd.exe" -Argument "/d /c exit 0"
            $principal = New-ScheduledTaskPrincipal `
              -UserId "NT AUTHORITY\LOCAL SERVICE" `
              -LogonType ServiceAccount `
              -RunLevel Limited
            $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew
            $trigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddDays(1))
            $definition = New-ScheduledTask `
              -Action $action `
              -Principal $principal `
              -Settings $settings `
              -Trigger $trigger `
              -Description "OMNI-CIO-V10-WP9-ACL-PROBE"
            Register-ScheduledTask `
              -TaskName $taskName `
              -TaskPath $taskPath `
              -InputObject $definition `
              -Force | Out-Null
            Disable-ScheduledTask -TaskPath $taskPath -TaskName $taskName | Out-Null

            Ensure-SchedulerObjectReadAccess -SchedulerObject $parent -RunnerSid $syntheticSid
            Ensure-SchedulerObjectReadAccess -SchedulerObject $folder -RunnerSid $syntheticSid
            $registered = $folder.GetTask($taskName)
            Ensure-SchedulerObjectReadAccess -SchedulerObject $registered -RunnerSid $syntheticSid
            Ensure-SchedulerObjectReadAccess -SchedulerObject $registered -RunnerSid $syntheticSid

            Assert-ReadAce -SchedulerObject $parent -RunnerSid $syntheticSid
            Assert-ReadAce -SchedulerObject $folder -RunnerSid $syntheticSid
            Assert-ReadAce -SchedulerObject $registered -RunnerSid $syntheticSid
          }
          finally {
            Unregister-ScheduledTask -TaskPath $taskPath -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            try { $service.GetFolder("\$folderName").DeleteFolder("V10", 0) } catch { }
            try { $root.DeleteFolder($folderName, 0) } catch { }
          }
