name: V10 WP10 Recovery Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-recovery-audit.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-recovery-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lenovo synthetic backup and restore audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify WP10 recovery and backup schedule contracts
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp10_recovery_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp10_backup_schedule.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Re-check inherited WP6-WP9A boundaries
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp6_privilege_boundary.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp7_bootstrap_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp8_secret_store_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp9_supervision_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp9a_operations_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Rehearse isolated PostgreSQL backup corruption and restore
        shell: cmd
        run: |
          @echo off
          set "PROFILE=%RUNNER_TEMP%\wp10-recovery-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\rehearse_wp10_recovery.ps1 -AsJson > "%PROFILE%"
          if errorlevel 1 (
            type "%PROFILE%"
            exit /b 1
          )
          type "%PROFILE%"
          echo WP10_RECOVERY_PROFILE=%PROFILE%>>"%GITHUB_ENV%"

      - name: Validate sanitized recovery evidence
        shell: cmd
        run: |
          @echo off
          python scripts\assess_v10_wp10_recovery_profile.py "%WP10_RECOVERY_PROFILE%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Assert no OWNER physical acceptance in CI
        shell: cmd
        run: |
          @echo off
          python -c "import json; c=json.load(open('docs/architecture/V10_WP10_RECOVERY_CONTRACT.json', encoding='utf-8')); assert c['off_device']['ci_may_synthesize_owner_evidence'] is False; assert c['acceptance']['owner_physical_recovery_required'] is True; print('OWNER_ACTION_REQUIRED preserved')"
          if errorlevel 1 exit /b %errorlevel%

      - name: Clean local synthetic evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP10_RECOVERY_PROFILE if exist "%WP10_RECOVERY_PROFILE%" del /f /q "%WP10_RECOVERY_PROFILE%"
          git reset --hard HEAD
          git clean -ffdx
