name: V10 WP13 PostgreSQL Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "omni_cio/persistence/**"
      - "scripts/rehearse_v10_wp13_persistence.py"
      - "infrastructure/windows/rehearse_wp13_persistence.ps1"
      - "infrastructure/windows/run_wp10_backup.ps1"
      - "scripts/v10_wp10_backup_bundle.py"
      - "requirements.in"
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements-dev.txt"
      - ".github/workflows/v10-wp13-postgresql-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp13-postgresql-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: WP13 PostgreSQL 18 persistence and recovery gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated WP13 environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked WP13 dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import psycopg; print('psycopg import OK')"

      - name: Run synthetic PostgreSQL persistence and WP10 restore rehearsal
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\rehearse_wp13_persistence.ps1 -PythonPath "%VENV_WINDOWS_PATH%\Scripts\python.exe" -AsJson > "%RUNNER_TEMP%\wp13-postgresql-audit.json"
          set "AUDIT_EXIT=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\wp13-postgresql-audit.json"
          if not "%AUDIT_EXIT%"=="0" exit /b %AUDIT_EXIT%
          echo WP13_EVIDENCE=%RUNNER_TEMP%\wp13-postgresql-audit.json>> "%GITHUB_ENV%"

      - name: Upload sanitized WP13 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp13-postgresql-audit-evidence
          path: ${{ env.WP13_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx
