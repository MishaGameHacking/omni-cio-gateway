name: Verify investment OSINT backend on owner laptop
on:
  push:
    branches: [codex/investment-osint-2026-10-28]
permissions:
  contents: read
concurrency:
  group: analyst-investment-osint-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 65
    env:
      EXPECTED_TESTED_MERGE_SHA: ${{ github.sha }}
      EXPECTED_PR_HEAD_SHA: ''
      EXPECTED_PR_BASE_SHA: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - name: Checkout exact GitHub source on the owner laptop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: backend-ci-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 16
          persist-credentials: false
      - name: Verify all Python sources and complete backend suite in existing WSL
        shell: cmd
        working-directory: backend-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 .github\scripts\laptop_backend_ci.py
          if errorlevel 1 exit /b 1
      - name: Package the exact verified server changes
        id: package
        shell: cmd
        working-directory: backend-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 .github\scripts\package_server_runtime.py
          if errorlevel 1 exit /b 1
      - name: Retain synthetic verification and source release bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/windows-backend-report.json
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/python-source-audit.log
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/sonar-helper-tests.log
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/backend-ci-regressions.log
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/linux-backend.log
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/guest-evidence/
            ${{ runner.temp }}/backend-ci-${{ github.run_id }}-${{ github.run_attempt }}/server-runtime.json
          if-no-files-found: error
          retention-days: 7

  source-quality:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/require_clean_sonar.cjs
          sparse-checkout-cone-mode: false
      - name: Require clean exact-head Sonar and expose every finding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {newestSonarCheck,assertCleanSonar}=require('./.github/scripts/require_clean_sonar.cjs');
            const ref=context.sha;
            let sonar;
            for(let attempt=0;attempt<36;attempt++) {
              const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref,per_page:100});
              sonar=newestSonarCheck(checks,ref);
              if(sonar?.status==='completed') break;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if(!sonar||sonar.status!=='completed') throw new Error('Exact-source Sonar unavailable');
            const notes=await github.paginate(github.rest.checks.listAnnotations,{...context.repo,check_run_id:sonar.id,per_page:100});
            for(const note of notes) core.info('SONAR_FINDING='+JSON.stringify({path:note.path,line:note.start_line,title:note.title,message:note.message}));
            assertCleanSonar(sonar,notes,ref);
