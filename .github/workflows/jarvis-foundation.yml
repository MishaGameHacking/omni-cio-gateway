name: Verify Jarvis worker integration on owner Lenovo
on:
  push:
    branches: [codex/jarvis-foundation-2026-10-31]
    paths:
      - backend/agent_*.py
      - backend/autonomous_ai.py
      - backend/tests/test_agent_*.py
      - docs/JARVIS*.md
      - .github/scripts/jarvis_policy_ci.py
      - .github/workflows/jarvis-foundation.yml
permissions:
  contents: read
concurrency:
  group: analyst-jarvis-foundation
  cancel-in-progress: false
jobs:
  policy:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 7
    steps:
      - name: Verify intended owner machine
        shell: cmd
        run: |
          if /I not "%COMPUTERNAME%"=="LAPTOP-NPSGA016" exit /b 1
          echo Owner Lenovo verified. Synthetic tests only; no deployment or paid calls.
      - name: Checkout isolated candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: jarvis-policy-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run real worker with synthetic inputs in disposable venv
        shell: cmd
        working-directory: jarvis-policy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -I .github\scripts\jarvis_policy_ci.py
          if errorlevel 1 exit /b 1
