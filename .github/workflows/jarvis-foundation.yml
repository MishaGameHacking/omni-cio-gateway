name: Verify Jarvis admission and dispatch on owner Lenovo
on:
  push:
    branches: [codex/jarvis-foundation-2026-10-31]
    paths:
      - backend/agent_runtime_policy.py
      - backend/agent_task_client.py
      - backend/tests/test_agent_runtime_policy.py
      - backend/tests/test_agent_task_client.py
      - docs/JARVIS_LOCAL_AGENT_2026-10-31.md
      - docs/JARVIS_STAGE2_INTEGRATION_2026-10-31.md
      - .github/workflows/jarvis-foundation.yml
permissions:
  contents: read
concurrency:
  group: analyst-jarvis-foundation
  cancel-in-progress: false
jobs:
  policy:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Verify intended owner machine
        shell: cmd
        run: |
          if /I not "%COMPUTERNAME%"=="LAPTOP-NPSGA016" exit /b 1
          echo Owner Lenovo verified. Synthetic tests only; no deployment or paid calls.
      - name: Checkout isolated candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: jarvis-policy-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run synthetic dispatch and existing regression tests
        shell: cmd
        working-directory: jarvis-policy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -I -c "import pathlib,sys,unittest; sys.path.insert(0,str(pathlib.Path.cwd())); suite=unittest.defaultTestLoader.loadTestsFromNames(['backend.tests.test_agent_runtime_policy','backend.tests.test_agent_task_client','backend.tests.test_ai_policy','backend.tests.test_ai_accounting_audit','backend.tests.test_ai_jobs_schema_atomic','backend.tests.test_ai_budget_schema_atomic']); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
          if errorlevel 1 exit /b 1
