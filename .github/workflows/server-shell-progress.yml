name: Observe bounded server shell build progress
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/server-shell-progress.yml, tools/observe_shell_progress.py]
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: shell-observer-${{ github.run_id }}
          persist-credentials: false
          sparse-checkout: tools/observe_shell_progress.py
          sparse-checkout-cone-mode: false
      - name: Read task names and completion states for this build only
        shell: cmd
        working-directory: shell-observer-${{ github.run_id }}
        run: |
          py -3 tools\observe_shell_progress.py
          if errorlevel 1 exit /b 1
