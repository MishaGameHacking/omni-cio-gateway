name: Android 17 SDK inventory

on:
  push:
    branches: [audit/android17-project-20261020]
    paths: [.github/workflows/android17-sdk-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Set up supported JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android CLI and official Android 17 catalogue
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          echo SDK_ROOT=%SDK_ROOT%
          if exist "%SDK_ROOT%\cmdline-tools\latest\bin\android.exe" goto tools_ready
          set "TOOLS_ZIP=%RUNNER_TEMP%\commandlinetools-win-15859902_latest.zip"
          curl.exe -fL --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%TOOLS_ZIP%"
          if errorlevel 1 exit /b 1
          certutil -hashfile "%TOOLS_ZIP%" SHA256 > "%TOOLS_ZIP%.sha256"
          if errorlevel 1 exit /b 1
          findstr /I /C:"90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" "%TOOLS_ZIP%.sha256" >nul
          if errorlevel 1 exit /b 1
          if not exist "%SDK_ROOT%\cmdline-tools" mkdir "%SDK_ROOT%\cmdline-tools"
          tar.exe -xf "%TOOLS_ZIP%" -C "%SDK_ROOT%\cmdline-tools"
          if errorlevel 1 exit /b 1
          if not exist "%SDK_ROOT%\cmdline-tools\latest" move "%SDK_ROOT%\cmdline-tools\cmdline-tools" "%SDK_ROOT%\cmdline-tools\latest"
          :tools_ready
          set "ANDROID_CLI=%SDK_ROOT%\cmdline-tools\latest\bin\android.exe"
          if not exist "%ANDROID_CLI%" exit /b 1
          "%ANDROID_CLI%" --version
          if errorlevel 1 exit /b 1
          "%ANDROID_CLI%" --sdk="%SDK_ROOT%" sdk list --all ".*37.*"
          if errorlevel 1 exit /b 1
          "%ANDROID_CLI%" sdk list --help
          if errorlevel 1 exit /b 1
          "%ANDROID_CLI%" emulator create --list-profiles
          if errorlevel 1 exit /b 1
