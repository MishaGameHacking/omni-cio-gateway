name: Stage verified local AI and full source without activation
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/local-ai-preparation.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
env:
  EXPECTED_TOOLS_SHA: '37b32928323c0db7761b7462278b5af2f753af34'
  EXPECTED_TOOLS_RUN: '41091495802'
  EXPECTED_SSH_TOOLS_SHA: '7bd97dcb25778d756b6419887052107933736606'
  EXPECTED_SSH_TOOLS_RUN: '41093693464'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful owner WSL verification and unchanged reviewed transport
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            if(!/^[a-f0-9]{40}$/.test(e.EXPECTED_TOOLS_SHA)||/^0+$/.test(e.EXPECTED_TOOLS_SHA)) throw new Error('Exact tested source required');
            if(!/^[1-9][0-9]{7,19}$/.test(e.EXPECTED_TOOLS_RUN)) throw new Error('Exact successful run required');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_TOOLS_SHA||r.path!=='.github/workflows/local-ai-preparation-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Exact diagnostic verification did not pass');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN),per_page:100});
            if(jobs.filter(j=>j.name==='verify'&&j.conclusion==='success'&&j.status==='completed').length!==1) throw new Error('Successful verify job missing');
            for(const path of ['deploy/prepare_local_ai_runtime.py','deploy/test_prepare_local_ai_runtime.py','tools/check_local_ai_preparation.py','tools/prepare_local_ai_runtime_transport.py','.github/workflows/local-ai-preparation-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('Tested tool changed: '+path);
            }
            const {data:transport}=await github.rest.repos.getContent({...context.repo,path:'tools/owner_plan_transport_20261027.py',ref:context.sha});
            if(transport.sha!=='7478ac9850fe1deeb729d1ccbc8fb0f28b849124') throw new Error('Reviewed transport changed');
      - name: Require tested private SSH diagnostics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_SSH_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_SSH_TOOLS_SHA||r.path!=='.github/workflows/ssh-handshake-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('SSH diagnostic verification required');
            for(const path of ['tools/observe_ssh_handshake.py','tools/test_observe_ssh_handshake.py','tools/check_ssh_handshake.py','.github/workflows/ssh-handshake-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_SSH_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('SSH diagnostic source changed');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Require exact backend verification and download measured model evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha='853090e11dcefef693366159c97316e55045c4c9';
            for(const [run_id,path] of [[41088491538,'.github/workflows/gpt6-analysis-routing.yml'],[41088491694,'.github/workflows/local-research-evaluation.yml']]) {
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(r.head_sha!==sha||r.path!==path||r.head_branch!=='codex/gpt6-analysis-routing-2026-10-30'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Exact source/model evidence required');
            }
            const {data:a}=await github.rest.actions.getArtifact({...context.repo,artifact_id:12992484056});
            if(a.expired||a.workflow_run.head_sha!==sha||a.workflow_run.id!==41088491694||a.digest!=='sha256:a2d4494ee0aa8f4eec5964d9040d9495638d5490303f29d7537d864d9df2fd3e') throw new Error('Measured artifact changed');
            const archive=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
            require('node:fs').writeFileSync(require('node:path').join(process.env.RUNNER_TEMP,'local-e4b-evaluation.zip'),Buffer.from(archive.data));
      - name: Prepare exact measured local AI installation
        run: python3 tools/prepare_local_ai_runtime_transport.py
      - name: Install pinned public weights and full source without restarting the application
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/observe_ssh_handshake.py
      - name: Preserve sanitized read-only receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ai-preparation-${{ github.run_id }}
          path: plan-reports/
          if-no-files-found: warn
          retention-days: 7
