name: V10 WP8 Secret Store Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp8-secret-store-audit.yml"
      - ".github/workflows/v10-wp8-secret-store-compat.yml"
      - "docs/architecture/V10_WP8_**"
      - "docs/architecture/DECISIONS.md"
      - "docs/operations/V10_WP8_**"
      - "infrastructure/windows/*wp8*"
      - "scripts/*wp8*"
      - "tests/test_v10_wp8_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp8-secret-store-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lenovo local secret-store audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify WP8 repository/secret-store contract
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp8_secret_store_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python -m pytest -q tests\test_v10_wp8_secret_store_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Re-check inherited WP6/WP7 boundaries
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp6_privilege_boundary.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp7_bootstrap_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect privacy-safe WP8 preview
        shell: cmd
        run: |
          @echo off
          set "PREVIEW=%RUNNER_TEMP%\wp8-preview-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\provision_wp8_secret_store.ps1 -AsJson > "%PREVIEW%"
          if errorlevel 1 exit /b %errorlevel%
          type "%PREVIEW%"
          echo WP8_PREVIEW_PATH=%PREVIEW%>>"%GITHUB_ENV%"

      - name: Verify applied WP8 Exit Gate state
        shell: cmd
        run: |
          @echo off
          set "VERIFY=%RUNNER_TEMP%\wp8-verify-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\provision_wp8_secret_store.ps1 -Verify -AsJson > "%VERIFY%"
          set "RC=%ERRORLEVEL%"
          type "%VERIFY%"
          echo WP8_VERIFY_PATH=%VERIFY%>>"%GITHUB_ENV%"
          if not "%RC%"=="0" exit /b %RC%
          python scripts\assess_v10_wp8_secret_store_profile.py "%VERIFY%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Clean sanitized local evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP8_PREVIEW_PATH if exist "%WP8_PREVIEW_PATH%" del /f /q "%WP8_PREVIEW_PATH%"
          if defined WP8_VERIFY_PATH if exist "%WP8_VERIFY_PATH%" del /f /q "%WP8_VERIFY_PATH%"
          git reset --hard HEAD
          git clean -ffdx
