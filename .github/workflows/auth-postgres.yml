name: Auth PostgreSQL

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - "pyproject.toml"
      - ".github/workflows/auth-postgres.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_auth_postgres.py"
      - "migrations/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - "pyproject.toml"
      - ".github/workflows/auth-postgres.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_auth_postgres.py"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-postgres
  cancel-in-progress: false

jobs:
  tests:
    name: Test PostgreSQL reconciler
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile reconciler
        run: python3 -m py_compile .github/scripts/timeweb_auth_postgres.py

      - name: Run reconciler tests
        run: |
          python3 .github/scripts/test_timeweb_ssh_trust.py
          python3 .github/scripts/test_timeweb_auth_postgres.py

  reconcile:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Reconcile private PostgreSQL
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      VPC_NAME: omni-cio-private
      DB_CLUSTER_NAME: omnicio-auth-postgres
      DB_INSTANCE_NAME: omnicio
      DB_ADMIN_LOGIN: omnicio_app
      POSTGRES_VERSION: "18"
      TARGET_LOCATION: ru-3
      TARGET_ZONE: msk-1
      MAX_DB_PRICE_RUB: "1110"
      MIN_DB_CPU: "1"
      MIN_DB_RAM_MB: "2048"
      MIN_DB_DISK_MB: "20480"

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify current main release checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_main_release.py

      - name: Validate verified SSH server key
        run: python3 .github/scripts/timeweb_ssh_trust.py

      - name: Validate Timeweb secret
        run: |
          set -euo pipefail
          test -n "${TIMEWEB_CLOUD_TOKEN:-}" || {
            echo "::error::TIMEWEB_CLOUD_TOKEN is missing"
            exit 1
          }

      - name: Reconcile PostgreSQL and schema
        id: postgres
        run: |
          set -euo pipefail
          python3 .github/scripts/timeweb_auth_postgres.py \
            --server-name "${SERVER_NAME}" \
            --server-comment "${SERVER_COMMENT}" \
            --vpc-name "${VPC_NAME}" \
            --cluster-name "${DB_CLUSTER_NAME}" \
            --instance-name "${DB_INSTANCE_NAME}" \
            --admin-login "${DB_ADMIN_LOGIN}" \
            --postgres-version "${POSTGRES_VERSION}" \
            --location "${TARGET_LOCATION}" \
            --availability-zone "${TARGET_ZONE}" \
            --max-price-rub "${MAX_DB_PRICE_RUB}" \
            --min-cpu "${MIN_DB_CPU}" \
            --min-ram-mb "${MIN_DB_RAM_MB}" \
            --min-disk-mb "${MIN_DB_DISK_MB}" \
            --migration migrations/0001_phone_auth.sql \
            --migration migrations/0002_tbank_connection.sql \
            --migration migrations/0003_vkid_owner_identity.sql

      - name: Surface private network gate
        if: steps.postgres.outputs.status == 'pending_server_network'
        run: |
          echo "::warning title=VDS private network required::PostgreSQL was not created. Attach omni-cio-white-site to omni-cio-private, then rerun this accepted-main workflow."

      - name: Surface DBaaS token permission gate
        if: steps.postgres.outputs.status == 'pending_token_permission'
        run: |
          echo "::warning title=Timeweb DBaaS permission required::The existing TIMEWEB_CLOUD_TOKEN needs management access to cloud databases before PostgreSQL can be created."

      - name: Confirm database readiness
        if: steps.postgres.outputs.status == 'database_ready'
        run: |
          echo "Private PostgreSQL cluster ${{ steps.postgres.outputs.cluster_id }} is ready and schema migration completed."
