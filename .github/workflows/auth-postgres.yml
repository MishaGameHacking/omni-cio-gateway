name: Auth PostgreSQL

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - ".github/scripts/timeweb_http.py"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-runtime.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - "src/omnicio/**"
      - "web/**"
      - "assets/brand/**"
      - ".github/workflows/auth-postgres.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/inplace_upgrade.py"
      - ".github/scripts/timeweb_recovery.py"
      - ".github/scripts/run_recovery_drill.py"
      - ".github/scripts/test_timeweb_recovery.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_auth_postgres.py"
      - "migrations/**"
  # Release verification requires tests for every exact accepted main, including Android-only updates.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect live prerequisites, send one authorized control email, or apply the reviewed schema transition"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - email_probe
          - apply
      smtp_probe_recipient:
        description: "Explicitly authorized control-email recipient (email_probe only)"
        type: string
        required: false
        default: ""
      restore_drill:
        description: "Legacy logical restore drill (disabled by the single-database policy)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # Preserve each main push's validation when schedules/manual runs are queued.
  # Both mutation jobs retain the shared production SSH lock below.
  group: auth-postgres-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    name: Test PostgreSQL reconciler
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install hash-pinned runtime and reviewed project for controller tests
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Compile reconciler
        shell: cmd
        run: '"%OMNICIO_PYTHON%" -m py_compile .github\scripts\inplace_upgrade.py .github\scripts\timeweb_auth_postgres.py'

      - name: Run reconciler tests
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_ssh_trust.py
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_auth_postgres.py
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_recovery.py

  reconcile:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    name: Reconcile private PostgreSQL
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.restore_drill)
    needs: tests
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 30
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      VPC_NAME: omni-cio-private
      DB_CLUSTER_NAME: omnicio-auth-postgres
      DB_INSTANCE_NAME: omnicio
      DB_ADMIN_LOGIN: omnicio_app
      POSTGRES_VERSION: "18"
      TARGET_LOCATION: ru-3
      TARGET_ZONE: msk-1
      BACKUP_ONLY: ${{ github.event_name == 'schedule' && '--backup-only' || '' }}
      OMNICIO_POSTGRES_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preflight' }}
      OMNICIO_SMTP_PROBE_RECIPIENT: ${{ github.event_name == 'workflow_dispatch' && inputs.smtp_probe_recipient || '' }}
      # Read-only cutover preflight uses the same future integration settings
      # as application deployment, before stopping the accepted source runtime.
      OPERATOR_USER_ID: ${{ vars.OPERATOR_USER_ID }}
      AUTH_SMTP_HOST: ${{ vars.AUTH_SMTP_HOST }}
      AUTH_SMTP_PORT: ${{ vars.AUTH_SMTP_PORT }}
      AUTH_SMTP_USERNAME: ${{ secrets.AUTH_SMTP_USERNAME }}
      AUTH_SMTP_PASSWORD: ${{ secrets.AUTH_SMTP_PASSWORD }}
      AUTH_SMTP_SENDER: ${{ vars.AUTH_SMTP_SENDER }}
      AUTH_SMTP_MODE: ${{ vars.AUTH_SMTP_MODE }}
      MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
      MARKET_DATA_DISTRIBUTION_APPROVED: ${{ vars.MARKET_DATA_DISTRIBUTION_APPROVED }}
      ASSISTANT_BASE_URL: ${{ vars.ASSISTANT_BASE_URL }}
      ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
      ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY }}
      ASSISTANT_ENABLED: "false"
      ASSISTANT_ALLOWED_ENDPOINTS: ${{ vars.ASSISTANT_ALLOWED_ENDPOINTS }}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${{ vars.ASSISTANT_DAILY_REQUEST_LIMIT }}
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATION_EMAIL_ENABLED: "false"
      NOTIFICATION_CRYPTO_KEY: ${{ secrets.NOTIFICATION_CRYPTO_KEY }}
      NOTIFICATION_VAPID_PRIVATE_KEY: ${{ secrets.NOTIFICATION_VAPID_PRIVATE_KEY }}
      NOTIFICATION_VAPID_SUBJECT: "https://omnicio.ru"
      NOTIFICATION_SMTP_HOST: ${{ vars.NOTIFICATION_SMTP_HOST }}
      NOTIFICATION_SMTP_PORT: ${{ vars.NOTIFICATION_SMTP_PORT }}
      NOTIFICATION_SMTP_USERNAME: ${{ secrets.NOTIFICATION_SMTP_USERNAME }}
      NOTIFICATION_SMTP_PASSWORD: ${{ secrets.NOTIFICATION_SMTP_PASSWORD }}
      NOTIFICATION_SMTP_SENDER: ${{ vars.NOTIFICATION_SMTP_SENDER }}
      NOTIFICATION_SMTP_MODE: ${{ vars.NOTIFICATION_SMTP_MODE }}
      OMNICIO_RESTORE_RECEIPT_KEY: ${{ secrets.OMNICIO_RESTORE_RECEIPT_KEY }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
      BILLING_TERMINAL_KEY: ${{ secrets.BILLING_TERMINAL_KEY }}
      BILLING_PASSWORD: ${{ secrets.BILLING_PASSWORD }}
      BILLING_AMOUNT_KOPECKS: ${{ vars.BILLING_AMOUNT_KOPECKS }}
      BILLING_PERIOD_DAYS: ${{ vars.BILLING_PERIOD_DAYS }}
      BILLING_OFFER_VERSION: ${{ vars.BILLING_OFFER_VERSION }}
      BILLING_DESCRIPTION: ${{ vars.BILLING_DESCRIPTION }}
      BILLING_TAXATION: ${{ vars.BILLING_TAXATION }}
      BILLING_TAX: ${{ vars.BILLING_TAX }}
      LEGAL_OPERATOR_NAME: "КЛИМАЧЕВ МИХАИЛ КОНСТАНТИНОВИЧ"
      LEGAL_OPERATOR_EMAIL: "omnicioinfo@gmail.com"
      LEGAL_PRIVACY_VERSION: "2026-10-09-v1.4.0"
      LEGAL_CONSENT_VERSION: "2026-10-09-v1.4.0"
      LEGAL_TERMS_VERSION: "2026-10-09-v1.4.0"
      SESSION_TTL_SECONDS: "34560000"

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Verify current main release checks
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"%OMNICIO_PYTHON%" .github\scripts\verify_main_release.py'

      - name: Validate verified SSH server key
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\timeweb_ssh_trust.py'

      - name: Validate Timeweb secret
        shell: cmd
        run: |
          @echo off
          if not defined TIMEWEB_CLOUD_TOKEN (
            echo ::error::TIMEWEB_CLOUD_TOKEN is missing
            exit /b 1
          )

      - name: Reconcile PostgreSQL and schema
        id: postgres
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\timeweb_auth_postgres.py ^
            %BACKUP_ONLY% ^
            --server-name "%SERVER_NAME%" ^
            --server-comment "%SERVER_COMMENT%" ^
            --vpc-name "%VPC_NAME%" ^
            --cluster-name "%DB_CLUSTER_NAME%" ^
            --instance-name "%DB_INSTANCE_NAME%" ^
            --admin-login "%DB_ADMIN_LOGIN%" ^
            --postgres-version "%POSTGRES_VERSION%" ^
            --location "%TARGET_LOCATION%" ^
            --availability-zone "%TARGET_ZONE%" ^
            --migration migrations/0029_email_auth.sql ^
            --migration migrations/0030_portfolio_read_only.sql

      - name: Confirm database readiness
        if: steps.postgres.outputs.status == 'database_ready'
        shell: cmd
        run: echo Private PostgreSQL cluster ${{ steps.postgres.outputs.cluster_id }} is ready and schema migration completed.

  isolated-restore:
    name: Verify isolated logical restore
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.restore_drill
    needs: tests
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      OMNICIO_RESTORE_DRILL_ALLOWED: "false"
      OMNICIO_RESTORE_SOURCE_DSN: ${{ secrets.OMNICIO_RESTORE_SOURCE_DSN }}
      OMNICIO_RESTORE_ARCHIVE_KEY: ${{ secrets.OMNICIO_RESTORE_ARCHIVE_KEY }}
      OMNICIO_RESTORE_RECEIPT_KEY: ${{ secrets.OMNICIO_RESTORE_RECEIPT_KEY }}
      DB_INSTANCE_NAME: omnicio

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install hash-pinned runtime and accepted project
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Export encrypted archive and verify on a new isolated cluster
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\run_recovery_drill.py'

      - name: Keep only encrypted archive and signed provenance for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolated-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/restore/database.dump.encrypted
            artifacts/restore/manifest.json
            artifacts/restore/restore-verification.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove this job's local encrypted artifacts
        if: always()
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\run_recovery_drill.py --cleanup-artifact'

