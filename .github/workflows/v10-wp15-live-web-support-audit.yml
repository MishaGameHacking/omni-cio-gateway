name: V10 WP15 Live Web Support Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/app.py"
      - "apps/web/src/app-shell/**"
      - "omni_cio/web/api_v1.py"
      - "omni_cio/web/live_acceptance_v1.py"
      - "tests/contracts/api/test_web_api_v1_contract.py"
      - "tests/test_v10_wp15_live_web_acceptance.py"
      - "tests/test_v10_wp15_live_web_api.py"
      - "tests/test_v10_wp15_live_task_scheduler_contract.py"
      - "tests/test_v10_wp15_live_owner_workflow.py"
      - "scripts/check_v10_wp15_live_web_acceptance.py"
      - "docs/architecture/V10_WP15_LIVE_WEB_ACCEPTANCE_CONTRACT.json"
      - "docs/operations/V10_WP15_OWNER_LIVE_READ_RUNBOOK.md"
      - "infrastructure/windows/provision_wp15_live_web_acceptance.ps1"
      - "infrastructure/windows/start_wp15_live_web_acceptance.ps1"
      - "infrastructure/windows/run_wp15_live_web_runtime.ps1"
      - "infrastructure/windows/bootstrap_wp15_live_database.py"
      - "infrastructure/windows/probe_wp15_live_session_runtime.py"
      - "infrastructure/windows/finalize_wp15_live_web_evidence.ps1"
      - "infrastructure/windows/audit_wp15_live_web_runner.ps1"
      - ".github/workflows/v10-wp15-live-web-support-audit.yml"
      - ".github/workflows/v10-wp15-live-web-owner-audit.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/app.py"
      - "apps/web/src/app-shell/**"
      - "omni_cio/web/api_v1.py"
      - "omni_cio/web/live_acceptance_v1.py"
      - "tests/contracts/api/test_web_api_v1_contract.py"
      - "tests/test_v10_wp15_live_web_acceptance.py"
      - "tests/test_v10_wp15_live_web_api.py"
      - "tests/test_v10_wp15_live_task_scheduler_contract.py"
      - "tests/test_v10_wp15_live_owner_workflow.py"
      - "scripts/check_v10_wp15_live_web_acceptance.py"
      - "docs/architecture/V10_WP15_LIVE_WEB_ACCEPTANCE_CONTRACT.json"
      - "docs/operations/V10_WP15_OWNER_LIVE_READ_RUNBOOK.md"
      - "infrastructure/windows/provision_wp15_live_web_acceptance.ps1"
      - "infrastructure/windows/start_wp15_live_web_acceptance.ps1"
      - "infrastructure/windows/run_wp15_live_web_runtime.ps1"
      - "infrastructure/windows/bootstrap_wp15_live_database.py"
      - "infrastructure/windows/probe_wp15_live_session_runtime.py"
      - "infrastructure/windows/finalize_wp15_live_web_evidence.ps1"
      - "infrastructure/windows/audit_wp15_live_web_runner.ps1"
      - ".github/workflows/v10-wp15-live-web-support-audit.yml"
      - ".github/workflows/v10-wp15-live-web-owner-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp15-live-web-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support-audit:
    name: WP15 live Web deterministic support gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          else
            git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event"
          fi
          git checkout --detach "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner tools
        shell: cmd
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 10
          if not exist "C:\Program Files\nodejs\node.exe" exit /b 11
          if not exist "C:\Program Files\nodejs\npm.cmd" exit /b 12
          >>"%GITHUB_PATH%" echo C:\Program Files\nodejs

      - name: Create isolated WP15 live environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp15-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked Python dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import fastapi; import psycopg; import t_tech.invest; print('WP15 live support imports OK')"

      - name: Verify exact checked-out head
        shell: cmd
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 13
          echo WP15 live exact head: %ACTUAL_HEAD%

      - name: Run static quality and type safety
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff check omni_cio\web\live_acceptance_v1.py omni_cio\web\api_v1.py apps\api\app.py infrastructure\windows\bootstrap_wp15_live_database.py infrastructure\windows\probe_wp15_live_session_runtime.py scripts\check_v10_wp15_live_web_acceptance.py tests\contracts\api\test_web_api_v1_contract.py tests\test_v10_wp15_live_web_acceptance.py tests\test_v10_wp15_live_web_api.py tests\test_v10_wp15_live_task_scheduler_contract.py tests\test_v10_wp15_live_owner_workflow.py
          if errorlevel 1 exit /b 20
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff format --check omni_cio\web\live_acceptance_v1.py omni_cio\web\api_v1.py apps\api\app.py infrastructure\windows\bootstrap_wp15_live_database.py infrastructure\windows\probe_wp15_live_session_runtime.py scripts\check_v10_wp15_live_web_acceptance.py tests\contracts\api\test_web_api_v1_contract.py tests\test_v10_wp15_live_web_acceptance.py tests\test_v10_wp15_live_web_api.py tests\test_v10_wp15_live_task_scheduler_contract.py tests\test_v10_wp15_live_owner_workflow.py
          if errorlevel 1 exit /b 21
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m mypy
          if errorlevel 1 exit /b 22

      - name: Run focused live acceptance and Web API tests
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m pytest -q tests\contracts\api\test_web_api_v1_contract.py tests\test_v10_wp15_live_web_acceptance.py tests\test_v10_wp15_live_web_api.py tests\test_v10_wp15_live_task_scheduler_contract.py tests\test_v10_wp15_live_owner_workflow.py tests\test_v10_wp17_web_api.py tests\test_v10_wp17_broker_provisioning.py tests\test_v10_wp17_read_connection_vault.py tests\test_v10_wp15_tinvest_connection_scope.py
          if errorlevel 1 exit /b 30

      - name: Enforce live support architecture boundary
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_wp15_live_web_acceptance.py
          if errorlevel 1 exit /b 31
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_wp17_web_security.py
          if errorlevel 1 exit /b 32

      - name: Verify PowerShell 5.1 scripts parse without applying
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $paths=@('infrastructure\windows\provision_wp15_live_web_acceptance.ps1','infrastructure\windows\start_wp15_live_web_acceptance.ps1','infrastructure\windows\run_wp15_live_web_runtime.ps1','infrastructure\windows\finalize_wp15_live_web_evidence.ps1','infrastructure\windows\audit_wp15_live_web_runner.ps1'); foreach ($path in $paths) { $tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 40 } }; Write-Host 'WP15 live PowerShell parse contract passed.'"
          if errorlevel 1 exit /b 40

      - name: Verify runtime identity translation and ownership semantics
        shell: cmd
        run: |
          findstr /L /C:"$runtimeAccount = $runtimeSid.Translate([System.Security.Principal.NTAccount]).Value" infrastructure\windows\provision_wp15_live_web_acceptance.ps1 >nul
          if errorlevel 1 exit /b 41
          findstr /L /C:"$administratorsSid = [System.Security.Principal.SecurityIdentifier]::new(\"S-1-5-32-544\")" infrastructure\windows\provision_wp15_live_web_acceptance.ps1 >nul
          if errorlevel 1 exit /b 42
          findstr /L /C:"Get-LocalGroupMember -SID $administratorsSid -ErrorAction Stop" infrastructure\windows\provision_wp15_live_web_acceptance.ps1 >nul
          if errorlevel 1 exit /b 43
          findstr /L /C:"Omni-CIO V10 WP6 runtime role anchor" infrastructure\windows\provision_wp15_live_web_acceptance.ps1 >nul
          if errorlevel 1 exit /b 44
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $user=Get-LocalUser -Name 'omni-cio-runtime' -ErrorAction Stop; if ([string]$user.Description -ne 'Omni-CIO V10 WP6 runtime role anchor') { exit 45 }; $adminSid=[System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'); $members=@(Get-LocalGroupMember -SID $adminSid -ErrorAction Stop); if ($members.SID.Value -contains $user.SID.Value) { exit 46 }; $account=$user.SID.Translate([System.Security.Principal.NTAccount]).Value; if ([string]::IsNullOrWhiteSpace($account) -or $account.IndexOf('\') -lt 1) { exit 47 }; Write-Host 'WP15 localized runtime identity ownership contract passed.'"
          if errorlevel 1 exit /b 47

      - name: Compile and validate batch-logon helper without mutation
        shell: cmd
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\start_wp15_live_web_acceptance.ps1 -ExpectedImplementationSha "%EXPECTED_HEAD%" -ValidateOnly -AsJson
          if errorlevel 1 exit /b 48

      - name: Reproduce production Python 3.14 runtime dependencies
        shell: cmd
        run: |
          if not exist "C:\Program Files\Python314\python.exe" exit /b 45
          "C:\Program Files\Python314\python.exe" -c "import platform,sys; v=platform.python_version(); print(v); sys.exit(0 if v == '3.14.6' else 46)"
          if errorlevel 1 exit /b 46
          set "PROD_VENV=%RUNNER_TEMP%\omni-cio-wp15-prod-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%PROD_VENV%" rmdir /s /q "%PROD_VENV%"
          "C:\Program Files\Python314\python.exe" -m venv "%PROD_VENV%"
          if errorlevel 1 exit /b 47
          echo PROD_VENV_WINDOWS_PATH=%PROD_VENV%>> "%GITHUB_ENV%"
          set "PROD_LOCK=%PROD_VENV%\requirements.windows.txt"
          "C:\Program Files\Python314\python.exe" scripts\windows_ci_lock.py project requirements.txt "%PROD_LOCK%"
          if errorlevel 1 exit /b 48
          "%PROD_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --require-hashes -r "%PROD_LOCK%"
          if errorlevel 1 exit /b 49
          "%PROD_VENV%\Scripts\python.exe" -c "import fastapi; import psycopg; import t_tech.invest; import uvicorn; print('WP15 live Python 3.14 Windows runtime OK')"
          if errorlevel 1 exit /b 50

      - name: Verify Node and npm identity
        shell: cmd
        run: |
          "C:\Program Files\nodejs\node.exe" -e "if (process.version !== 'v24.18.0') process.exit(1); console.log(process.version)"
          if errorlevel 1 exit /b 51
          powershell.exe -NoProfile -NonInteractive -Command "$v = (& 'C:\Program Files\nodejs\npm.cmd' --version | Out-String).Trim(); Write-Host ('npm ' + $v); if ($v -ne '11.16.0') { exit 52 }"
          if errorlevel 1 exit /b 52

      - name: Reproduce and validate Web build
        working-directory: apps/web
        shell: cmd
        run: |
          call "C:\Program Files\nodejs\npm.cmd" ci --ignore-scripts --no-audit --no-fund
          if errorlevel 1 exit /b 60
          call "C:\Program Files\nodejs\npm.cmd" run typecheck
          if errorlevel 1 exit /b 61
          call "C:\Program Files\nodejs\npm.cmd" run lint
          if errorlevel 1 exit /b 62
          call "C:\Program Files\nodejs\npm.cmd" test
          if errorlevel 1 exit /b 63
          call "C:\Program Files\nodejs\npm.cmd" run build
          if errorlevel 1 exit /b 64
          python ..\..\scripts\run_v10_npm_audit.py --npm "C:\Program Files\nodejs\npm.cmd" --audit-level high
          if errorlevel 1 exit /b 65

      - name: Verify permanent repository guards
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_web_baseline.py
          if errorlevel 1 exit /b 70
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_repository_boundaries.py
          if errorlevel 1 exit /b 71
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_regression_shield.py
          if errorlevel 1 exit /b 72

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          if [ -n "${PROD_VENV_WINDOWS_PATH:-}" ]; then rm -rf "$(cygpath -u "$PROD_VENV_WINDOWS_PATH")"; fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          git reset --hard HEAD
          git clean -ffdx
