name: Source maintenance for PR 827
on:
  push:
    branches: [diagnostics/source-v05]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout fixed maintenance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: maintenance
      - name: Checkout feature branch, never main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: fix/themes-live-portfolio-050
          path: work
      - name: Apply fixed source refinements
        shell: cmd
        working-directory: work
        run: |
          py -3 ..\maintenance\.github\scripts\refine_050.py
          if errorlevel 1 exit /b 1
      - name: Correct emulator test scope and use actual Activity owner
        shell: py -3 {0}
        working-directory: work
        run: |
          from pathlib import Path
          from textwrap import indent
          path = Path('.github/scripts/test_apk_installation.py')
          text = path.read_text(encoding='utf-8')
          begin = text.index('\n        if args.api == 33 and os.getenv("RUN_PROFILE_UI_TESTS")')
          end = text.index('\n        finally:', begin)
          text = text[:begin + 1] + indent(text[begin + 1:end], '    ') + text[end:]
          path.write_bytes(text.encode('utf-8'))
          compile(text, str(path), 'exec')
          root = Path('app/src/main/java/ru/omnicio/app')
          for name in ['ui/portfolio/AccountDataState.kt', 'data/portfolio/LivePortfolio.kt', 'ui/theme/AnalystTheme.kt']:
              path = root / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('import androidx.activity.ComponentActivity', 'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.LocalActivity')
              text = text.replace('(LocalContext.current as? ComponentActivity)', '(LocalActivity.current as? ComponentActivity)')
              if name.endswith('LivePortfolio.kt'):
                  text = text.replace('    val context = LocalContext.current\n', '    val activity = LocalActivity.current\n').replace('(context as? ComponentActivity)', '(activity as? ComponentActivity)')
              if name.endswith('AnalystTheme.kt'):
                  text = text.replace('    val context = LocalContext.current\n', '    val context = LocalContext.current\n    val activity = LocalActivity.current\n').replace('(context as? ComponentActivity)', '(activity as? ComponentActivity)')
              path.write_bytes(text.encode('utf-8'))
      - name: Validate Python syntax
        shell: cmd
        working-directory: work
        run: |
          py -3 -m compileall -q backend .github\scripts
          if errorlevel 1 exit /b 1
      - name: Commit source-only changes with optimistic concurrency check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const cp = require('child_process');
            const ref = 'heads/fix/themes-live-portfolio-050';
            const base = cp.execFileSync('git',['rev-parse','HEAD'],{cwd:'work',encoding:'utf8'}).trim();
            const head = (await github.rest.git.getRef({...context.repo,ref})).data.object.sha;
            if (head !== base) throw new Error('Feature branch changed; refuse stale commit');
            const commit = (await github.rest.git.getCommit({...context.repo,commit_sha:head})).data;
            const paths = cp.execFileSync('git',['diff','--name-only','-z'],{cwd:'work',encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed = /^(app\/src\/|backend\/|\.github\/scripts\/)/;
            if (!paths.length || paths.some(p => !allowed.test(p))) throw new Error('Unexpected source path');
            const tree = paths.map(p => ({path:p,mode:'100644',type:'blob',content:fs.readFileSync(path.join('work',p),'utf8').replace(/\r\n/g,'\n')}));
            const created = (await github.rest.git.createTree({...context.repo,base_tree:commit.tree.sha,tree})).data;
            const next = (await github.rest.git.createCommit({...context.repo,message:'fix: portable calendar, Activity ownership and tested profile interactions',tree:created.sha,parents:[head]})).data;
            await github.rest.git.updateRef({...context.repo,ref,sha:next.sha,force:false});
            core.info('REFINED_SHA=' + next.sha);
