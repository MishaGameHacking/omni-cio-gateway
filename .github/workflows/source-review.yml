name: Private source review

on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-review.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Export tracked text sources for the 2D refactor
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Export source only without executing project code
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import zipfile

          revisions = {
              'main': '97149a309361aa0db0da3c07d2e7342f23d3cc8b',
              'development': '0d5d406193e4d5a26b3336877eecc31a3ccfdd3c',
          }
          allowed = {'.py', '.kt', '.kts', '.java', '.xml', '.json', '.md', '.txt',
                     '.yml', '.yaml', '.toml', '.properties', '.cjs', '.js', '.sh', '.bat'}
          archive = Path(os.environ['RUNNER_TEMP']) / 'analyst-source-review.zip'
          manifest = []
          total = 0
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
              for label, revision in revisions.items():
                  entries = subprocess.run(['git', 'ls-tree', '-r', '-z', revision],
                      check=True, capture_output=True, timeout=30).stdout.split(b'\0')
                  for entry in filter(None, entries):
                      metadata, raw_path = entry.split(b'\t', 1)
                      mode, kind, blob = metadata.decode('ascii').split()
                      path = PurePosixPath(raw_path.decode('utf-8'))
                      if kind != 'blob' or mode not in {'100644', '100755'}:
                          continue
                      if path.is_absolute() or '..' in path.parts or '\\' in str(path):
                          raise RuntimeError('Invalid tracked source path')
                      if path.suffix.lower() not in allowed:
                          continue
                      if any(part.startswith('.env') or part.lower() in {'secrets', 'credentials', 'keystores'}
                             for part in path.parts):
                          continue
                      content = subprocess.run(['git', 'cat-file', 'blob', blob],
                          check=True, capture_output=True, timeout=15).stdout
                      if len(content) > 2_000_000:
                          raise RuntimeError('Unexpectedly large source file')
                      content.decode('utf-8')
                      total += len(content)
                      if total > 50_000_000:
                          raise RuntimeError('Source export size exceeded')
                      name = f'{label}/{path}'
                      output.writestr(name, content)
                      manifest.append({'path': name, 'blob': blob,
                          'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)})
              output.writestr('source-manifest.json', json.dumps(
                  {'revisions': revisions, 'files': manifest}, indent=2))
          print('SOURCE_REVIEW_FILES=' + str(len(manifest)))
          print('SOURCE_REVIEW_SHA256=' + hashlib.sha256(archive.read_bytes()).hexdigest())
      - name: Retain private short-lived source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analyst-source-review
          path: ${{ runner.temp }}/analyst-source-review.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
