# Triggered after workflow registration.
name: Apply Omni-CIO v3.3.2

on:
  push:
    paths:
      - .github/workflows/apply-v332.yml

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v3.3.2 market-source and consistency upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '    version="3.3.1",',
              '    version="3.3.2",',
              "application version",
          )

          replace_once(
              '''        "instrument_uid": data.get("instrument_uid"),
        "figi": data.get("figi"),
        "time": orderbook_time,
''',
              '''        "instrument_uid": data.get("instrument_uid"),
        "figi": data.get("figi"),
        "order_book_type": normalized_operation_enum(
            data.get("order_book_type"),
            {},
            "ORDERBOOK_TYPE_UNSPECIFIED",
        ),
        "time": orderbook_time,
''',
              "order-book source type",
          )

          helper_code = '''

def market_dealer_session(
    last_price: dict[str, Any],
    trading_status: dict[str, Any],
    order_book: dict[str, Any],
) -> bool:
    """Infer whether the snapshot describes a dealer trading session.

    The inference is intentionally separate from the raw T-Invest fields. It
    never changes or replaces the reported trading status or source enums.
    """
    status_name = str(trading_status.get("trading_status", "") or "").upper()
    last_price_type = str(
        last_price.get("last_price_type", "") or ""
    ).upper()
    order_book_type = str(
        order_book.get("order_book_type", "") or ""
    ).upper()

    return (
        "DEALER" in status_name
        or last_price_type == "LAST_PRICE_DEALER"
        or order_book_type == "ORDERBOOK_TYPE_DEALER"
    )


def trading_flag_consistency_issues(
    last_price: dict[str, Any],
    trading_status: dict[str, Any],
    order_book: dict[str, Any],
) -> list[str]:
    """Report notable divergences without overriding any raw API value."""
    issues: list[str] = []
    status_name = str(trading_status.get("trading_status", "") or "").upper()
    last_price_type = str(
        last_price.get("last_price_type", "") or ""
    ).upper()
    order_book_type = str(
        order_book.get("order_book_type", "") or ""
    ).upper()

    limit_available = trading_status.get("limit_order_available_flag")
    market_available = trading_status.get("market_order_available_flag")
    api_available = trading_status.get("api_trade_available_flag")
    bestprice_available = trading_status.get(
        "bestprice_order_available_flag"
    )
    only_best_price = trading_status.get("only_best_price")
    order_flags = (
        limit_available,
        market_available,
        bestprice_available,
    )

    if only_best_price is True and bestprice_available is False:
        issues.append(
            "only_best_price is true while bestprice_order_available_flag is false."
        )

    if api_available is False and any(flag is True for flag in order_flags):
        issues.append(
            "api_trade_available_flag is false while at least one order-type "
            "availability flag is true."
        )

    if "NORMAL_TRADING" in status_name and api_available is False:
        issues.append(
            "The trading-status name indicates normal trading while "
            "api_trade_available_flag is false."
        )

    if "NOT_AVAILABLE_FOR_TRADING" in status_name and any(
        flag is True for flag in (*order_flags, api_available)
    ):
        issues.append(
            "The trading-status name indicates that trading is unavailable "
            "while at least one availability flag is true."
        )

    if "DEALER" in status_name:
        if last_price_type == "LAST_PRICE_EXCHANGE":
            issues.append(
                "Dealer trading status was returned with an exchange last-price source."
            )
        if order_book_type == "ORDERBOOK_TYPE_EXCHANGE":
            issues.append(
                "Dealer trading status was returned with an exchange-only order book."
            )

    return issues
'''

          replace_once(
              '\n\ndef market_component_error(',
              helper_code + '\n\ndef market_component_error(',
              "market consistency helpers",
          )

          replace_once(
              '''            lot_values = estimated_lot_values(
                metadata_value if isinstance(metadata_value, dict) else None,
                last_price,
                order_book,
            )

            warnings = [
''',
              '''            lot_values = estimated_lot_values(
                metadata_value if isinstance(metadata_value, dict) else None,
                last_price,
                order_book,
            )
            dealer_session = market_dealer_session(
                last_price,
                trading_status,
                order_book,
            )
            consistency_issues = trading_flag_consistency_issues(
                last_price,
                trading_status,
                order_book,
            )

            warnings = [
''',
              "market interpretation calculation",
          )

          replace_once(
              '''                (
                    "Trading-status flags describe API availability at the "
                    "retrieval time and do not guarantee sufficient liquidity."
                ),
                (
                    "The gateway remains read-only and exposes no order "
                    "placement, replacement, or cancellation endpoints."
                ),
            ]

            return {
''',
              '''                (
                    "Trading-status flags describe API availability at the "
                    "retrieval time and do not guarantee sufficient liquidity."
                ),
                (
                    "last_price.last_price_type and order_book.order_book_type "
                    "are raw T-Invest source labels. An unspecified source is "
                    "not inferred or silently replaced by the gateway."
                ),
                (
                    "Trading-status and order-availability flags are returned "
                    "exactly as received. The gateway reports divergences but "
                    "does not override one field with another."
                ),
                (
                    "The gateway remains read-only and exposes no order "
                    "placement, replacement, or cancellation endpoints."
                ),
            ]
            warnings.extend(
                f"Trading-status/flag consistency warning: {issue}"
                for issue in consistency_issues
            )

            return {
''',
              "market warnings",
          )

          replace_once(
              '''                "trading_status": trading_status,
                "order_book": order_book,
                "estimated_lot_values": lot_values,
''',
              '''                "trading_status": trading_status,
                "order_book": order_book,
                "dealer_session": dealer_session,
                "trading_flag_consistency": {
                    "status": "warning" if consistency_issues else "ok",
                    "issues": consistency_issues,
                    "raw_fields_preserved": True,
                },
                "estimated_lot_values": lot_values,
''',
              "market response interpretation",
          )

          replace_once(
              '''        "instrument_uid": _OA_STRING,
        "figi": _OA_STRING,
        "time": _OA_STRING,
''',
              '''        "instrument_uid": _OA_STRING,
        "figi": _OA_STRING,
        "order_book_type": _OA_STRING,
        "time": _OA_STRING,
''',
              "OpenAPI order-book type",
          )

          replace_once(
              '''            "trading_status": _OA_TRADING_STATUS,
            "order_book": _OA_ORDER_BOOK,
            "estimated_lot_values": _oa_obj(
''',
              '''            "trading_status": _OA_TRADING_STATUS,
            "order_book": _OA_ORDER_BOOK,
            "dealer_session": _OA_BOOL,
            "trading_flag_consistency": _oa_obj(
                {
                    "status": _OA_STRING,
                    "issues": _oa_array(_OA_STRING),
                    "raw_fields_preserved": _OA_BOOL,
                }
            ),
            "estimated_lot_values": _oa_obj(
''',
              "OpenAPI market consistency fields",
          )

          if text == original:
              raise SystemExit("No changes were made")

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile main.py

          grep -q 'version="3.3.2"' main.py
          grep -q '"order_book_type"' main.py
          grep -q '"dealer_session"' main.py
          grep -q '"bestprice_order_available_flag"' main.py
          grep -q '"raw_fields_preserved"' main.py

      - name: Commit upgraded gateway
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Add market source diagnostics v3.3.2"
          git push origin main
