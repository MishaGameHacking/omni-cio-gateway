name: Observe candidate42 complete laptop build
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-layout42-progress.yml]
permissions:
  contents: read
  checks: write
  actions: read
concurrency:
  group: analyst-n00-layout42-build-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 150
    steps:
      - name: Observe exact laptop build without executing application code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const cp=require('node:child_process');const made=await github.rest.checks.create({...context.repo,name:'N00 candidate42 complete Windows build progress',head_sha:context.sha,status:'in_progress',output:{title:'Candidate42 laptop build',summary:'Observing run 40266100999; checks and build remain authoritative.'}});\nlet terminal=false;\nfor(let poll=0;poll<290;poll++){\n const r=cp.spawnSync('py',['-3','-c',\"import pathlib,sys,os,json\\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nout={'run_id':40266100999,'found':False}\\nstates=[pathlib.Path('C:/actions-runner'+s+'/_work/_temp/analyst-development-40266100999-1') for s in ('','-2','-3','-4')]\\nstates=[p for p in states if p.is_dir()]\\nassert len(states)<=1\\nif states:\\n state=states[0];out['found']=True;out['state']=str(state)\\n p=state/'windows-development.json'\\n if p.is_file():\\n  report=json.loads(p.read_text(encoding='utf-8'))\\n  out['report']={k:v for k,v in report.items() if k in ('status','base_commit','source_sha256','source_sha256_after','complete_source_sha256','complete_source_sha256_after','check','build','apks','certificate_sha256','github','root','error','error_type','failed_stage','external_quality_gate','started_at','finished_at','patch_files','steps')}\\n for name in ('controller.json','export-receipt.json'):\\n  p=state/name\\n  if p.is_file():out[name]=json.loads(p.read_text(encoding='utf-8'))\\n out['available_logs']=[p.name for p in state.glob('*.log')][:50]\\n for name in ('host-tests.log','tools-tests.log','node-tests.log','gradle.log','failure.log'):\\n  p=state/name\\n  if p.is_file():\\n   with p.open('rb') as f:\\n    f.seek(max(0,p.stat().st_size-4500));tail=f.read().decode('utf-8',errors='replace')\\n   out[name]={'bytes':p.stat().st_size,'tail':tail}\\nprint(json.dumps(out,ensure_ascii=True))\\n\"],{encoding:'utf8',timeout:45000,maxBuffer:180000,env:{...process.env,PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8'}});\n let report;try{if(r.status!==0)throw Error('Read failed');report=JSON.parse(r.stdout);}catch(e){report={error:String(e),stderr:r.stderr?.slice(-1500)};}\n const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40266100999});report.workflow_status=run.data.status;report.workflow_conclusion=run.data.conclusion;\n terminal=run.data.status==='completed'||Boolean(report['controller.json']?.finished_at);\n const fence=String.fromCharCode(96).repeat(3);const summary=fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence;if(summary.length>63000)throw Error('Report exceeded bound');\n await github.rest.checks.update({...context.repo,check_run_id:made.data.id,status:terminal?'completed':'in_progress',...(terminal?{conclusion:'neutral'}:{}),output:{title:'Actual candidate42 host, WSL and Android build observations',summary}});\n if(terminal)break;await new Promise(resolve=>setTimeout(resolve,30000));\n}\nif(!terminal)await github.rest.checks.update({...context.repo,check_run_id:made.data.id,status:'completed',conclusion:'neutral',output:{title:'Observation window ended',summary:'Inspect original build run 40266100999.'}});\n"
