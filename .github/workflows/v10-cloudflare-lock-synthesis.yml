name: V10 Cloudflare Root Lock Synthesis

on:
  push:
    branches:
      - system/cloudflare-public-product

permissions:
  contents: read

jobs:
  synthesize-root-lock:
    name: Generate npm 10.9.2 root lock evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bootstrap exact pushed repository without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Generate deterministic root package lock with provider npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npx --yes npm@10.9.2 --version)" = "10.9.2"
          npx --yes npm@10.9.2 install --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          import base64
          from pathlib import Path

          payload = Path("package-lock.json").read_bytes()
          print("BEGIN_PACKAGE_LOCK_BASE64")
          print(base64.b64encode(payload).decode("ascii"))
          print("END_PACKAGE_LOCK_BASE64")
          PY
