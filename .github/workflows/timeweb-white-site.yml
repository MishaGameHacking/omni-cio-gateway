name: Timeweb white site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/timeweb-white-site.yml"
      - ".github/scripts/timeweb_white_site.py"
      - ".github/scripts/test_timeweb_white_site.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/timeweb-white-site.yml"
      - ".github/scripts/timeweb_white_site.py"
      - ".github/scripts/test_timeweb_white_site.py"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = read-only check; deploy = reconcile desired state now"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      confirm:
        description: "For manual deploy, type CREATE exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: timeweb-white-site
  cancel-in-progress: false

jobs:
  tests:
    name: Test reconciler
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout candidate repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Timeweb reconciler regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_timeweb_white_site.py

  timeweb:
    name: Reconcile desired state
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      ACTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'reconcile' }}
      DEPLOY_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || '' }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      MAX_SERVER_PRICE_RUB: "199"
      TARGET_LOCATION: "ru-3"
      TARGET_AVAILABILITY_ZONE: "msk-1"

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Timeweb secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TIMEWEB_CLOUD_TOKEN:-}" ]; then
            echo "::error::Repository secret TIMEWEB_CLOUD_TOKEN is missing or empty."
            exit 1
          fi

      - name: Reconcile Timeweb white site
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/timeweb_white_site.py \
            --mode "${ACTION_MODE}" \
            --confirm "${DEPLOY_CONFIRM}" \
            --server-name "${SERVER_NAME}" \
            --server-comment "${SERVER_COMMENT}" \
            --max-server-price-rub "${MAX_SERVER_PRICE_RUB}" \
            --target-location "${TARGET_LOCATION}" \
            --target-availability-zone "${TARGET_AVAILABILITY_ZONE}"

      - name: Surface transient capacity state
        if: steps.reconcile.outputs.status == 'pending_capacity'
        shell: bash
        run: |
          echo "::warning title=Timeweb capacity pending::No approved placement currently has a free node. The scheduled reconciler will retry without raising the server budget."
