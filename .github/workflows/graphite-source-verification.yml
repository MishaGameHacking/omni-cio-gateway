name: Graphite source verification

on:
  push:
    branches: [feature/graphite-market-workspace]
    paths: [.github/workflows/graphite-source-verification.yml]

permissions:
  contents: write

jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Read fixed delivery candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Verify source manifest and publish immutable blobs only
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"%OMNICIO_PYTHON%" .github\scripts\graphite_source_delivery.py'
      - name: Preserve verified identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphite-candidate-blobs
          path: graphite-candidate-blobs.json
          if-no-files-found: error
          retention-days: 1
