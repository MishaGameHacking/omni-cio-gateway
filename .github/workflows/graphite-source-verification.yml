name: Graphite source verification

on:
  push:
    branches: [feature/graphite-market-workspace]
    paths: [.github/workflows/graphite-source-verification.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Read immutable accepted source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 89ed9342a63512b22b4d84a01a0274bc415d9516
          persist-credentials: false
          clean: true
      - name: Export tracked source without runner state
        shell: cmd
        run: |
          git archive --format=zip --output=graphite-baseline.zip 89ed9342a63512b22b4d84a01a0274bc415d9516
          if errorlevel 1 exit /b 1
      - name: Preserve exact baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphite-baseline-89ed9342
          path: graphite-baseline.zip
          if-no-files-found: error
          retention-days: 1
