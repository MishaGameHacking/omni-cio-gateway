name: V10 Fast PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Current OWNER-observed GitHub-hosted capacity is blocked by the account-level
# zero-budget hard stop. Fast deterministic checks therefore use the accepted
# Lenovo continuity lane. This does not claim disposable hosted clean-room
# evidence; V10 Toolchain Compatibility reports that evidence separately.
jobs:
  route:
    name: Classify V10 CI paths
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    outputs:
      fast_frontend: ${{ steps.route.outputs.fast_frontend }}
      categories: ${{ steps.route.outputs.categories }}

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository with comparison history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/base" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Classify changed paths
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/v10-changed-paths.txt"
          else
            git ls-files > "$RUNNER_TEMP/v10-changed-paths.txt"
          fi
          python scripts/v10_ci_router.py \
            --paths-file "$RUNNER_TEMP/v10-changed-paths.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Clean routing workspace
        if: always()
        shell: cmd
        run: |
          git config --local --unset-all credential.helper >nul 2>nul
          git rev-parse --verify HEAD >nul 2>nul
          if errorlevel 1 (
            if exist .git rmdir /s /q .git
            exit /b 0
          )
          git reset --hard HEAD
          git clean -ffdx

  policy-and-source:
    name: Fast policy and source contracts
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python 3.12.10
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify protected interpreter identity
        run: python -c "import platform; assert platform.python_version() == '3.12.10'; print(platform.python_version())"

      - name: Verify CI and security baseline
        run: python scripts\check_ci_security_baseline.py

      - name: Verify repository structure
        run: python scripts\check_repository_layout.py

      - name: Verify V10 repository boundaries
        run: python scripts\check_v10_repository_boundaries.py

      - name: Verify V10 engineering governance when present
        run: |
          if exist scripts\check_v10_engineering_governance.py python scripts\check_v10_engineering_governance.py
          if errorlevel 1 exit /b %errorlevel%
          if exist scripts\check_v10_ci_cost_control.py python scripts\check_v10_ci_cost_control.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify V10 toolchain baseline
        run: python scripts\check_v10_toolchain_baseline.py

      - name: Verify product Web package and lock baseline
        run: python scripts\check_v10_web_baseline.py

      - name: Verify V10 Regression Shield and WP4 release contract
        run: python scripts\check_v10_regression_shield.py

      - name: Compile policy release and boundary sources
        run: >-
          python -m compileall -q scripts omni_cio\contracts
          omni_cio\plan_execution omni_cio\sandbox omni_cio\real_trading

      - name: Run CI and release guard unit tests
        run: >-
          python -m unittest
          tests.test_v10_regression_shield
          tests.test_v10_release_provenance
          tests.test_v10_web_baseline

      - name: Clean policy workspace
        if: always()
        shell: cmd
        run: |
          git config --local --unset-all credential.helper >nul 2>nul
          git rev-parse --verify HEAD >nul 2>nul
          if errorlevel 1 (
            if exist .git rmdir /s /q .git
            exit /b 0
          )
          git reset --hard HEAD
          git clean -ffdx

  frontend-contracts:
    name: Fast frontend applicability and contracts
    needs: route
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 18
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Report non-applicable frontend lane
        if: needs.route.outputs.fast_frontend != 'true'
        run: echo Fast frontend substantive checks NOT_APPLICABLE by source-controlled path router; routing check executed successfully.

      - name: Bootstrap protected runner Python for audit transport guard
        if: needs.route.outputs.fast_frontend == 'true'
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify exact installed Node.js and npm
        if: needs.route.outputs.fast_frontend == 'true'
        run: |
          if not exist "C:\Program Files\nodejs\node.exe" exit /b 20
          if not exist "C:\Program Files\nodejs\npm.cmd" exit /b 21
          "C:\Program Files\nodejs\node.exe" -e "if (process.version !== 'v24.18.0') process.exit(1); console.log(process.version)"
          if errorlevel 1 exit /b 22
          powershell.exe -NoProfile -NonInteractive -Command "$v = (& 'C:\Program Files\nodejs\npm.cmd' --version | Out-String).Trim(); Write-Host ('npm ' + $v); if ($v -ne '11.16.0') { exit 23 }"
          if errorlevel 1 exit /b 23
          >>"%GITHUB_PATH%" echo C:\Program Files\nodejs

      - name: Reproduce WP2 frontend fixture
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: tests/toolchain/frontend
        run: call "C:\Program Files\nodejs\npm.cmd" ci --ignore-scripts --no-audit --no-fund

      - name: Type-check WP2 frontend fixture
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: tests/toolchain/frontend
        run: call "C:\Program Files\nodejs\npm.cmd" run typecheck

      - name: Lint WP2 frontend fixture
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: tests/toolchain/frontend
        run: call "C:\Program Files\nodejs\npm.cmd" run lint

      - name: Run WP2 frontend fixture unit tests
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: tests/toolchain/frontend
        run: call "C:\Program Files\nodejs\npm.cmd" test

      - name: Build WP2 frontend fixture
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: tests/toolchain/frontend
        run: call "C:\Program Files\nodejs\npm.cmd" run build

      - name: Reproduce product Web from committed lock
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: call "C:\Program Files\nodejs\npm.cmd" ci --ignore-scripts --no-audit --no-fund

      - name: Type-check product Web
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: call "C:\Program Files\nodejs\npm.cmd" run typecheck

      - name: Lint product Web
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: call "C:\Program Files\nodejs\npm.cmd" run lint

      - name: Run product Web unit tests
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: call "C:\Program Files\nodejs\npm.cmd" test

      - name: Build product Web
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: call "C:\Program Files\nodejs\npm.cmd" run build

      - name: Audit product Web dependencies
        if: needs.route.outputs.fast_frontend == 'true'
        working-directory: apps/web
        run: python ..\..\scripts\run_v10_npm_audit.py --npm "C:\Program Files\nodejs\npm.cmd" --audit-level high

      - name: Clean frontend workspace
        if: always()
        shell: cmd
        run: |
          git config --local --unset-all credential.helper >nul 2>nul
          git rev-parse --verify HEAD >nul 2>nul
          if errorlevel 1 (
            if exist .git rmdir /s /q .git
            exit /b 0
          )
          git reset --hard HEAD
          git clean -ffdx
