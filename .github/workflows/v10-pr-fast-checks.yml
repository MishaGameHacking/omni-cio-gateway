name: V10 Fast PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Classify hosted CI paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast_frontend: ${{ steps.route.outputs.fast_frontend }}
      categories: ${{ steps.route.outputs.categories }}

    steps:
      - name: Check out repository with comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/v10-changed-paths.txt"
          else
            git ls-files > "$RUNNER_TEMP/v10-changed-paths.txt"
          fi
          python scripts/v10_ci_router.py \
            --paths-file "$RUNNER_TEMP/v10-changed-paths.txt" \
            --github-output "$GITHUB_OUTPUT"

  policy-and-source:
    name: Fast policy and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify exact interpreter
        shell: bash
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "3.14.6"

      - name: Verify CI and security baseline
        run: python scripts/check_ci_security_baseline.py

      - name: Verify repository structure
        run: python scripts/check_repository_layout.py

      - name: Verify V10 repository boundaries
        run: python scripts/check_v10_repository_boundaries.py

      - name: Verify V10 toolchain baseline
        run: python scripts/check_v10_toolchain_baseline.py

      - name: Verify V10 Regression Shield and WP4 release contract
        run: python scripts/check_v10_regression_shield.py

      - name: Compile policy, release, and boundary sources
        run: >-
          python -m compileall -q scripts omni_cio/contracts
          omni_cio/plan_execution omni_cio/sandbox omni_cio/real_trading

      - name: Run CI and release guard unit tests
        run: >-
          python -m unittest
          tests.test_v10_regression_shield
          tests.test_v10_release_provenance

  frontend-contracts:
    name: Fast frontend type lint unit build
    needs: route
    if: needs.route.outputs.fast_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/toolchain/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Node.js LTS with npm cache
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: tests/toolchain/frontend/package-lock.json

      - name: Verify exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Reproduce dependency tree from committed lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check frontend baseline
        run: npm run typecheck

      - name: Lint frontend baseline
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend baseline
        run: npm run build
