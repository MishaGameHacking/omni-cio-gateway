name: V10 Engineering Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-engineering-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Engineering quality and green-merge contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git checkout --detach FETCH_HEAD
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          @echo off
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 10
          echo Governance exact head: %ACTUAL_HEAD%

      - name: Verify engineering governance contract
        run: python scripts/check_v10_engineering_governance.py

      - name: Verify Integrated System Update execution law
        run: python scripts/check_v10_integrated_system_update_governance.py

      - name: Verify Progressive Capability Activation law
        run: python scripts/check_v10_progressive_capability_activation.py

      - name: Verify documentation authority and lifecycle consistency
        run: python scripts/check_v10_documentation_consistency.py

      - name: Verify public free hosted product plan
        run: python scripts/check_v10_public_product_plan.py

      - name: Verify CI cost-control contract
        run: python scripts/check_v10_ci_cost_control.py

      - name: Verify Regression Shield capacity routing contract
        run: python scripts/check_v10_regression_shield.py

      - name: Compile governance and CI guards
        run: >-
          python -m py_compile
          scripts/check_v10_engineering_governance.py
          scripts/check_v10_integrated_system_update_governance.py
          scripts/check_v10_progressive_capability_activation.py
          scripts/check_v10_documentation_consistency.py
          scripts/check_v10_public_product_plan.py
          scripts/check_v10_ci_cost_control.py
          scripts/check_v10_regression_shield.py
          scripts/v10_ci_router.py

      - name: Run stdlib CI contract regression tests
        run: >-
          python -m unittest
          tests.test_v10_regression_shield
          tests.test_v10_ci_action_download_resilience
          tests.test_v10_release_provenance
          tests.test_v10_integrated_system_update_governance
          tests.test_v10_progressive_capability_activation
          tests.test_v10_wp22a_historical_gate_routing

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          git reset --hard HEAD
          git clean -ffdx
