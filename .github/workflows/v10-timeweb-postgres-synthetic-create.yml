name: V10 RU-PG-B Timeweb Synthetic Create

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm the authorized 790 RUB/month synthetic PostgreSQL create
        required: true
        type: choice
        options:
          - CREATE_TIMEWEB_RU_PG_SYNTHETIC_790_RUB_MONTH

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-timeweb-postgres-synthetic-create
  cancel-in-progress: false

jobs:
  environment-policy-proof:
    name: Verify Timeweb environment main-only policy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.sha }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify synthetic-create source contract before provider authority
        shell: cmd
        run: python scripts/check_v10_timeweb_postgres_synthetic_create.py

      - name: Verify GitHub environment main-only policy before provider authority
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_v10_timeweb_github_environment

      - name: Clean environment-proof workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  create-synthetic:
    name: Create Timeweb PostgreSQL 18 synthetic cluster
    needs: environment-policy-proof
    if: github.ref == 'refs/heads/main'
    environment: timeweb-synthetic
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      EXPECTED_CONFIRMATION: CREATE_TIMEWEB_RU_PG_SYNTHETIC_790_RUB_MONTH

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify synthetic-create source contract before secret access
        shell: cmd
        run: python scripts/check_v10_timeweb_postgres_synthetic_create.py

      - name: Re-verify GitHub environment policy immediately before provider access
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_v10_timeweb_github_environment

      - name: Verify exact paid-create confirmation
        shell: cmd
        env:
          CREATE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          @echo off
          if not "%CREATE_CONFIRMATION%"=="%EXPECTED_CONFIRMATION%" exit /b 20

      - name: Create and verify the single synthetic Timeweb cluster
        shell: cmd
        env:
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
          TIMEWEB_RU_PG_CREATE_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m scripts.provision_v10_timeweb_postgres_synthetic

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
