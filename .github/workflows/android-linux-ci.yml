name: Android Linux verification
'on':
  push:
    branches:
    - codex/spectrum-3d-100
    paths:
    - .github/workflows/android-linux-ci.yml
    - tools/timeweb_ci_transfer.py
    - tools/ci-transfer-requirements.txt
permissions:
  contents: read
concurrency:
  group: analyst-android-linux-verification
  cancel-in-progress: false
jobs:
  build:
    name: Build with the existing signing identity
    if: contains(github.event.head_commit.message, '[android-linux-verify]')
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    permissions:
      contents: read
      checks: read
      actions: read
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    outputs:
      archive_sha256: ${{ steps.transfer.outputs.archive_sha256 }}
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Prepare canonical 3D catalogue before packaging
      shell: cmd
      run: |
        py -3 tools\prepare_spectrum_checkout.py
        if errorlevel 1 exit /b 1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify pinned Gradle wrapper
      shell: cmd
      run: |
        certutil -hashfile gradle\wrapper\gradle-wrapper.jar SHA256 > "%RUNNER_TEMP%\gradle-wrapper.sha256"
        if errorlevel 1 exit /b 1
        findstr /I /C:"238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5" "%RUNNER_TEMP%\gradle-wrapper.sha256" >nul
        if errorlevel 1 exit /b 1
        call gradlew.bat --version
        if errorlevel 1 exit /b 1
    - name: Choose Android SDK root
      shell: cmd
      run: |
        set "SDK_ROOT=%ANDROID_SDK_ROOT%"
        if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
        if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
        if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
        echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
        echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"
    - name: Ensure Android SDK 37 is installed
      shell: cmd
      run: |
        py -3 .github\scripts\prepare_android_sdk.py --sdk "%ANDROID_SDK_ROOT%"
        if errorlevel 1 exit /b 1
    - name: Test APK verification rules
      shell: cmd
      run: |
        py -3 -m unittest discover -s .github\scripts\tests -p "test_*.py" -v
        if errorlevel 1 exit /b 1
    - name: Report exact-head Sonar findings for remediation
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        retries: 3
        script: |
          const { newestSonarCheck, assertCleanSonar } = require('./.github/scripts/require_clean_sonar.cjs');
          const ref = context.sha;
          let sonar = null;
          for (let attempt = 0; attempt < 18; attempt++) {
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref, check_name: 'SonarCloud Code Analysis', per_page: 100,
            });
            sonar = newestSonarCheck(checks, ref);
            if (sonar?.status === 'completed') break;
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!sonar || sonar.status !== 'completed') {
            core.setFailed('Exact-head Sonar result is not ready: quality has not been verified.');
            return;
          }
          core.info('SONAR_CHECK=' + JSON.stringify({head:ref,id:sonar.id,conclusion:sonar.conclusion}));
          const annotations = await github.paginate(github.rest.checks.listAnnotations, {
            ...context.repo, check_run_id: sonar.id, per_page: 100,
          });
          for (const item of annotations) {
            core.warning('SONAR_ANNOTATION ' + JSON.stringify({path:item.path,start_line:item.start_line,end_line:item.end_line,level:item.annotation_level,title:item.title,message:item.message}));
          }
          core.info('SONAR_ANNOTATION_COUNT=' + annotations.length);
          assertCleanSonar(sonar, annotations, ref);
    - name: Lint and build all Android variants
      shell: cmd
      run: |
        call gradlew.bat :app:testDebugUnitTest :app:lintDebug :app:lintPreview :app:assembleDebug :app:assembleRelease :app:assemblePreview :ci-ui-driver:lintDebug :ci-ui-driver:assembleDebug --stacktrace
        if errorlevel 1 exit /b 1
    - name: Download installed 0.10.0 APK for exact upgrade compatibility test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag:'android-preview-0a894dddfa858efe6c7be60aea78935adec84c1b'})).data;
          const asset = release.assets.find(a => a.name === 'Analyst-AI-0.10.0-preview-0a894dd.apk');
          if (!asset) throw new Error('0.10.0 reference APK missing');
          const response = await github.rest.repos.getReleaseAsset({...context.repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
          const bytes = Buffer.from(response.data);
          if (crypto.createHash('sha256').update(bytes).digest('hex') !== '3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3') throw new Error('0.10.0 reference APK checksum mismatch');
          const dest = path.join(process.env.RUNNER_TEMP, `previous-apk-${context.runId}.apk`);
          fs.writeFileSync(dest, bytes);
          core.exportVariable('PREVIOUS_APK', dest);
    - name: Release only this checkout's reproducible build intermediates
      shell: cmd
      run: |
        py -3 .github\scripts\release_build_intermediates.py
        if errorlevel 1 exit /b 1
    - name: Prepare pinned private transfer dependencies
      shell: cmd
      run: |
        py -3 -m venv "%RUNNER_TEMP%\ci-transfer"
        if errorlevel 1 exit /b 1
        "%RUNNER_TEMP%\ci-transfer\Scripts\python.exe" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools\ci-transfer-requirements.txt
        if errorlevel 1 exit /b 1
    - name: Transfer only the four signed test inputs through a private temporary bucket
      id: transfer
      shell: cmd
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      run: |
        "%RUNNER_TEMP%\ci-transfer\Scripts\python.exe" tools\timeweb_ci_transfer.py upload
        if errorlevel 1 exit /b 1
  runtime:
    name: Verify the exact APK on free Linux / API 37 / 16 KB and 4 KB
    needs:
    - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 70
    env:
      RUN_PROFILE_UI_TESTS: '1'
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
    - &id001
      name: Checkout the same source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Enable this ephemeral runner user to use KVM
      run: |
        sudo chown "$(id -u):$(id -g)" /dev/kvm
        python3 tools/ci_host_capacity.py
    - name: Prepare pinned private transfer dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/ci-transfer"
        "$RUNNER_TEMP/ci-transfer/bin/python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools/ci-transfer-requirements.txt
    - name: Restore and verify the exact signed APK bytes and source commit
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      run: '"$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py download'
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install checksum-pinned official Linux Android tools
      run: |
        archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
        curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' --output "$archive"
        echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check -
        mkdir -p "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
        unzip -q "$archive" -d "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
        mv "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/latest"
        echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
    - name: Install and verify release API 37 packages and both page-size images
      run: |
        python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT"
        python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT" --runtime
        "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
    - name: Prepare headless Mesa Vulkan for the unchanged 3D renderer
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools libgl1
        python3 - <<'PYCODE'
        from pathlib import Path
        import os
        paths = list(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))
        if len(paths) != 1:
            raise SystemExit("Exactly one Mesa Lavapipe Vulkan ICD is required")
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("VK_ICD_FILENAMES=" + str(paths[0]) + "\n")
        PYCODE
    - name: Verify native 3D assets and the signed preview using official Android tools
      run: |
        python3 tools/prepare_spectrum_checkout.py
        python3 tools/test_native_alignment.py
        python3 tools/generate_spectrum_meshes.py --check --check-apk
        python3 tools/test_spectrum_meshes.py
        apk_dir="$GITHUB_WORKSPACE/app/build/outputs/apk/preview"
        build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
        java -jar "$build_tools/lib/apksigner.jar" verify --verbose --print-certs "$apk_dir/app-preview.apk" > "$apk_dir/signature.txt"
        "$build_tools/zipalign" -c -P 16 -v 4 "$apk_dir/app-preview.apk" > "$apk_dir/alignment.txt"
        "$build_tools/aapt" dump badging "$apk_dir/app-preview.apk" > "$apk_dir/badging.txt"
        "$build_tools/aapt" dump xmltree "$apk_dir/app-preview.apk" AndroidManifest.xml > "$apk_dir/manifest.txt"
        python3 .github/scripts/verify_apk.py
    - name: Verify clean install, upgrade, launch and full 3D UI at API 37 / 16 KB
      run: |
        xvfb-run --auto-servernum python3 .github/scripts/test_apk_installation.py --sdk "$ANDROID_SDK_ROOT" --apk app/build/outputs/apk/preview/app-preview.apk --previous "$PREVIOUS_APK" --api 37 --page-bytes 16384 --work-dir app/build/outputs/apk/preview/install-api37-16384
        python3 -c "import shutil; shutil.copytree('app/build/outputs/apk/preview/ui-screens', 'app/build/outputs/apk/preview/ui-screens-api37-16384', dirs_exist_ok=True)"
    - name: Verify clean install, upgrade, launch and full 3D UI at API 37 / 4 KB
      run: |
        xvfb-run --auto-servernum python3 .github/scripts/test_apk_installation.py --sdk "$ANDROID_SDK_ROOT" --apk app/build/outputs/apk/preview/app-preview.apk --previous "$PREVIOUS_APK" --api 37 --page-bytes 4096 --work-dir app/build/outputs/apk/preview/install-api37-4096
        python3 .github/scripts/validate_distribution.py
    - name: Record synthetic UI evidence and reports
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          const base = path.join(root, 'app/build/outputs/apk/preview');
          const shots = ['workspace-ux100', 'ux100-chart', 'bars-selected', 'bars-large-font', 'ux100-impact', 'workspace-appearance', 'workspace-strategy', 'workspace-assistant', 'workspace-market', 'workspace-ratings', 'spectrum-home', 'spectrum-portfolio', 'spectrum-allocation', 'light-initial', 'dark-selected', 'dark-restored', 'light-selected', 'system-dark', 'system-light', 'security', 'info', 'about', 'education', 'large-font', 'education-large-font'];
          const spatialShots = ['spatial-dark', 'spatial-shadow-reference', 'spatial-light', 'spatial-dialog', 'spatial-bars', 'spatial-candles', 'spatial-ring', 'spatial-selected', 'spatial-clipping', 'spatial-long-scroll', 'spatial-rotation-before', 'spatial-rotation-ready', 'spatial-rotation', 'spatial-large-font', 'spatial-dialog-large-font', 'spatial-system-motion-off', 'spatial-thermal-moderate', 'spatial-predictive-back-progress', 'spatial-predictive-back-cancelled', 'business-assistant-draft-rotation', 'business-assistant-draft-rotation-font-200', 'business-assistant-impact', 'business-assistant-impact-font-200', 'business-risk-scenario-rotation', 'business-risk-scenario-rotation-font-200', 'business-risk-scenarios', 'business-risk-scenarios-font-200', 'business-strategy-draft-rotation', 'business-strategy-draft-rotation-font-200', 'balance-private-first', 'balance-private-second', 'balance-private-first-font-200', 'balance-private-second-font-200', 'portfolio-quick-long-press', 'portfolio-quick-button', 'goal-draft-rotation', 'goal-draft-rotation-font-200', 'goal-pending-rotation', 'goal-pending-rotation-font-200', 'goal-recovered', 'goal-recovered-font-200'];
          const businessShots = ['risk', 'assistant', 'plans', 'strategy', 'notifications', 'analysis', 'catalogue'].flatMap(route =>
            ['ready', 'empty', 'partial', 'error', 'job'].filter(state => state !== 'job' || ['assistant', 'plans'].includes(route)).flatMap(state =>
              ['', '-font-200'].map(suffix => `business-${route}-${state}${suffix}`)));
          const portfolioCases = [['discovery', 'ready'], ['dossier', 'ready'], ['history', 'ready'], ['history', 'partial'],
            ['quotes', 'ready'], ['markets', 'ready'], ['appearance', 'ready']];
          const portfolioShots = portfolioCases.flatMap(([route, state]) =>
            ['', '-font-200'].map(suffix => `portfolio-${route}-${state}${suffix}`));
          const portfolioSteps = {
            discovery: ['common-period', 'comparison', 'archive', 'watch-dossier'],
            dossier: ['scheduled-report', 'published-report', 'primary-source', 'selected-holding', 'event-draft'],
            history: ['exact-observation', 'missing-observation', 'range'],
            quotes: ['exact-ohlc', 'stale-week', 'magnifier'],
            markets: ['session-midnight', 'geography'],
            appearance: ['applied', 'restored', 'preview-rotation']
          };
          const portfolioStepShots = Object.entries(portfolioSteps).flatMap(([route, stages]) =>
            stages.flatMap(stage => ['', '-font-200'].map(suffix => `portfolio-${route}-${stage}${suffix}`)));
          const contextShots = ['session-context-restored', 'session-context-restored-font-200', 'session-context-signed-out-rotation', 'session-context-signed-out-rotation-font-200'];
          const allShots = [...contextShots, ...shots, ...spatialShots, ...businessShots, ...portfolioShots, ...portfolioStepShots];
          const names = ['apk-verification.json', 'install-api37-16384/install-results.json', 'install-api37-4096/install-results.json',
            ...['ui-screens-api37-16384', 'ui-screens'].flatMap(folder => [
              `${folder}/session-context-verification.json`, `${folder}/balance-privacy-verification.json`, `${folder}/position-preview-verification.json`, `${folder}/goal-workflow-verification.json`, `${folder}/spatial-verification.json`, `${folder}/business-verification.json`, `${folder}/portfolio-verification.json`,
              ...allShots.map(name => `${folder}/${name}.png`)])];
          const records = [];
          for (const name of names) {
            const file = path.join(base, name);
            if (!fs.existsSync(file)) continue;
            if (fs.lstatSync(file).isSymbolicLink() || !fs.realpathSync(file).startsWith(root + path.sep)) throw new Error('Evidence outside checkout');
            const bytes = fs.readFileSync(file);
            if (bytes.length > 2097152) throw new Error('Evidence file unexpectedly large');
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (name.endsWith('.json')) {
              core.info(`VERIFICATION_REPORT ${name} ${JSON.stringify(JSON.parse(bytes.toString('utf8')))}`);
            }
            const blob = (await github.rest.git.createBlob({...context.repo, encoding:'base64', content:bytes.toString('base64')})).data;
            let preview_base64_blob_sha = null;
            if (name.endsWith('.png')) {
              const preview = (await github.rest.git.createBlob({...context.repo, encoding:'utf-8', content:bytes.toString('base64')})).data;
              preview_base64_blob_sha = preview.sha;
            }
            records.push({name, blob_sha:blob.sha, preview_base64_blob_sha, sha256, bytes:bytes.length});
          }
          core.info('VERIFICATION_EVIDENCE=' + JSON.stringify({head:context.sha, run:context.runId, records}));
          await core.summary.addHeading('Android verification evidence').addCodeBlock(JSON.stringify(records, null, 2), 'json').write();
  cleanup:
    name: Delete only this run's private CI transfer
    needs:
    - build
    - runtime
    if: always() && contains(github.event.head_commit.message, '[android-linux-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - *id001
    - name: Prepare pinned private transfer dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/ci-transfer"
        "$RUNNER_TEMP/ci-transfer/bin/python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools/ci-transfer-requirements.txt
    - name: Verify deletion of the owned temporary bucket
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      run: '"$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py cleanup'
