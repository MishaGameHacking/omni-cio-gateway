name: PR-03 Bootstrap

on:
  push:
    branches:
      - agent/reproducible-ci-security-gates

permissions:
  contents: read

jobs:
  generate-locks-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TINVEST_TOKEN: regression-test-tinvest-token
      GATEWAY_API_KEY: regression-test-gateway-key
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Generate hashed lock files
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.0
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-dev.txt \
            requirements-dev.in

      - name: Install locked development environment
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Measure current coverage
        run: >-
          python -m pytest -q
          --cov=app
          --cov=main
          --cov=portfolio_market
          --cov=portfolio_analytics
          --cov=cash_liquidity
          --cov=purchase_capacity
          --cov=purchase_capacity_integrity
          --cov=operations_analytics
          --cov=sdk_order_compat
          --cov=broker_report_reconciliation
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json

      - name: Upload generated baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr03-generated-baseline
          path: |
            requirements.txt
            requirements-dev.txt
            coverage.json
          if-no-files-found: error
          retention-days: 3
