name: PR-03 Lock Repair

on:
  push:
    branches:
      - agent/reproducible-ci-security-gates
  pull_request:

permissions:
  contents: read

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Generate complete hash locks
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.0
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-dev.txt \
            requirements-dev.in

      - name: Verify clean hash-locked install
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Upload repaired locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr03-repaired-locks
          path: |
            requirements.txt
            requirements-dev.txt
          if-no-files-found: error
          retention-days: 3
