name: V10 WP13 Repository SAST Fix

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: write

concurrency:
  group: v10-wp13-repository-sast-fix
  cancel-in-progress: true

jobs:
  transform:
    name: Convert repository queries to composable SQL
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out repository branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/wp13-postgresql-persistence
          persist-credentials: true

      - name: Apply deterministic repository transform
        run: python scripts\_wp13_repository_transform.py

      - name: Validate and commit root-cause fix
        run: |
          python -m compileall -q omni_cio\persistence\repository.py
          git rm .github\workflows\v10-wp13-repository-sast-fix.yml scripts\_wp13_repository_transform.py
          git add omni_cio\persistence\repository.py
          git diff --cached --check
          python -c "import subprocess; changed=sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()); expected=sorted(['.github/workflows/v10-wp13-repository-sast-fix.yml','scripts/_wp13_repository_transform.py','omni_cio/persistence/repository.py']); assert changed == expected, (changed, expected)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V10 WP13: use composable repository SQL"
          git push origin HEAD:v10/wp13-postgresql-persistence
