name: V10 Timeweb PostgreSQL Production Cutover

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted protected-main SHA to observe, prepare, or accept
        required: true
        type: string
      operation:
        description: Read-only observation, bounded database preparation, or final acceptance
        required: true
        default: observe
        type: choice
        options:
          - observe
          - prepare
          - accept
      confirmation:
        description: Required only for prepare; use PREPARE_TIMEWEB_PRODUCTION_POSTGRES
        required: false
        default: ""
        type: string
      recovery_attestation:
        description: Required only for accept; explicit recovery rehearsal acceptance phrase
        required: false
        default: ""
        type: string
      recovery_evidence_sha256:
        description: Required only for accept; SHA-256 of sanitized external recovery evidence
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-timeweb-postgres-production-cutover
  cancel-in-progress: false

jobs:
  exact-main-policy:
    name: Verify exact protected main and P3 source authority
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin \
            "$EXPECTED_HEAD" refs/heads/main:refs/remotes/origin/main
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify P3 PostgreSQL cutover source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_postgres_production_cutover

      - name: Verify GitHub production environment policy
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_v10_timeweb_github_environment
          --environment-name timeweb-production

      - name: Clean policy workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  production-cutover:
    name: Observe, prepare, or accept Timeweb PostgreSQL 18 production
    needs: exact-main-policy
    environment: timeweb-production
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      REQUESTED_RECOVERY_ATTESTATION: ${{ inputs.recovery_attestation }}
      REQUESTED_RECOVERY_EVIDENCE_SHA256: ${{ inputs.recovery_evidence_sha256 }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin \
            "$EXPECTED_HEAD" refs/heads/main:refs/remotes/origin/main
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-verify P3 source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_postgres_production_cutover

      - name: Re-verify GitHub production environment policy before production bindings
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_v10_timeweb_github_environment
          --environment-name timeweb-production

      - name: Observe verified production database
        if: ${{ inputs.operation == 'observe' }}
        shell: bash
        env:
          OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN }}
          OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN }}
        run: |
          set -euo pipefail
          test -z "$REQUESTED_CONFIRMATION"
          test -z "$REQUESTED_RECOVERY_ATTESTATION"
          test -z "$REQUESTED_RECOVERY_EVIDENCE_SHA256"
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_postgres_production_cutover \
            --operation observe \
            --expected-sha "$EXPECTED_HEAD" \
            --observed-main-sha "$OBSERVED_MAIN"

      - name: Prepare verified production database
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        env:
          OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN }}
          OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN }}
        run: |
          set -euo pipefail
          test "$REQUESTED_CONFIRMATION" = "PREPARE_TIMEWEB_PRODUCTION_POSTGRES"
          test -z "$REQUESTED_RECOVERY_ATTESTATION"
          test -z "$REQUESTED_RECOVERY_EVIDENCE_SHA256"
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_postgres_production_cutover \
            --operation prepare \
            --expected-sha "$EXPECTED_HEAD" \
            --observed-main-sha "$OBSERVED_MAIN" \
            --confirmation "PREPARE_TIMEWEB_PRODUCTION_POSTGRES"

      - name: Accept verified production database
        if: ${{ inputs.operation == 'accept' }}
        shell: bash
        env:
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
          OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_BOOTSTRAP_DSN }}
          OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN: ${{ secrets.OMNI_V10_TIMEWEB_PROD_RUNTIME_DSN }}
        run: |
          set -euo pipefail
          test -z "$REQUESTED_CONFIRMATION"
          test "$REQUESTED_RECOVERY_ATTESTATION" = "TIMEWEB_PHYSICAL_BACKUP_AND_SEPARATE_RESTORE_REHEARSAL_ACCEPTED"
          case "$REQUESTED_RECOVERY_EVIDENCE_SHA256" in
            *[!0-9a-f]*|'') exit 21 ;;
          esac
          test "${#REQUESTED_RECOVERY_EVIDENCE_SHA256}" -eq 64
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_postgres_production_cutover \
            --operation accept \
            --expected-sha "$EXPECTED_HEAD" \
            --observed-main-sha "$OBSERVED_MAIN" \
            --recovery-attestation "$REQUESTED_RECOVERY_ATTESTATION" \
            --recovery-evidence-sha256 "$REQUESTED_RECOVERY_EVIDENCE_SHA256"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
