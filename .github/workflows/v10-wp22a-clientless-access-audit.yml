name: V10 WP22A Clientless Access Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp22a-clientless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wp22a-clientless:
    name: WP22A clientless external-access gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner tools
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 10
          if not exist "C:\Program Files\nodejs\node.exe" exit /b 11
          if not exist "C:\Program Files\nodejs\npm.cmd" exit /b 12
          >>"%GITHUB_PATH%" echo C:\Program Files\nodejs

      - name: Create isolated WP22A Python environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp22a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked WP22A dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import fastapi; import psycopg; import ruff; print('WP22A Python toolchain imports OK')"

      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 13
          echo WP22A exact head: %ACTUAL_HEAD%

      - name: Reproduce Web dependencies from committed lock
        working-directory: apps/web
        run: |
          call "C:\Program Files\nodejs\npm.cmd" ci --ignore-scripts --no-audit --no-fund
          if errorlevel 1 exit /b 20

      - name: Type-check lint test and build Web
        working-directory: apps/web
        run: |
          call "C:\Program Files\nodejs\npm.cmd" run typecheck
          if errorlevel 1 exit /b 21
          call "C:\Program Files\nodejs\npm.cmd" run lint
          if errorlevel 1 exit /b 22
          call "C:\Program Files\nodejs\npm.cmd" test
          if errorlevel 1 exit /b 23
          call "C:\Program Files\nodejs\npm.cmd" run build
          if errorlevel 1 exit /b 24

      - name: Audit Web dependencies
        working-directory: apps/web
        run: |
          python ..\..\scripts\run_v10_npm_audit.py --npm "C:\Program Files\nodejs\npm.cmd" --audit-level high
          if errorlevel 1 exit /b 25

      - name: Run WP22A static and unit contracts
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff check omni_cio\web\external_access_v1.py apps\api\app.py apps\api\wp22a_remote.py tests\test_v10_wp22a_external_access.py tests\test_v10_wp22a_mutation_rate_limit.py tests\test_v10_wp22a_provisioning_contract.py tests\test_v10_wp22a_provider_lock_regression.py tests\test_v10_wp22a_managed_cloud_origin_decision.py
          if errorlevel 1 exit /b 30
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff format --check omni_cio\web\external_access_v1.py apps\api\app.py apps\api\wp22a_remote.py tests\test_v10_wp22a_external_access.py tests\test_v10_wp22a_mutation_rate_limit.py tests\test_v10_wp22a_provisioning_contract.py tests\test_v10_wp22a_provider_lock_regression.py tests\test_v10_wp22a_managed_cloud_origin_decision.py
          if errorlevel 1 exit /b 31
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m mypy
          if errorlevel 1 exit /b 32
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m pytest -q tests\test_v10_wp22a_external_access.py tests\test_v10_wp22a_mutation_rate_limit.py tests\test_v10_wp22a_provisioning_contract.py tests\test_v10_wp22a_provider_lock_regression.py tests\test_v10_wp22a_managed_cloud_origin_decision.py
          if errorlevel 1 exit /b 33

      - name: Parse WP22A PowerShell without mutation
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $paths=@('scripts\bootstrap_wp22a_terraform.ps1','scripts\bootstrap_wp22a_cloudflare_provider.ps1','scripts\validate_wp22a_terraform.ps1','infrastructure\windows\run_wp22a_clientless_remote_runtime.ps1','infrastructure\windows\provision_wp22a_clientless_remote_access.ps1'); foreach ($path in $paths) { $tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 34 } }; Write-Host 'WP22A PowerShell parse contract passed.'"
          if errorlevel 1 exit /b 34

      - name: Verify dormant clientless source contract without provider execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('docs/architecture/V10_WP22A_EXECUTION_CONTRACT.md').read_text(encoding='utf-8')
          selection = Path('docs/architecture/V10_WP22A_SERVICE_SELECTION.md').read_text(encoding='utf-8')
          iac_decision = Path('docs/architecture/V10_WP22A_IAC_TOOLCHAIN_DECISION.md').read_text(encoding='utf-8')
          for label, historical_source in (
              ('execution contract', contract),
              ('service selection', selection),
              ('IaC toolchain decision', iac_decision),
          ):
              if 'Amendment 18' not in historical_source or 'HISTORICAL' not in historical_source[:1200]:
                  raise SystemExit(f'WP22A {label} lacks Amendment-18 historical override')
          middleware = Path('omni_cio/web/external_access_v1.py').read_text(encoding='utf-8')
          factory = Path('apps/api/wp22a_remote.py').read_text(encoding='utf-8')
          launcher = Path('infrastructure/windows/run_wp22a_clientless_remote_runtime.ps1').read_text(encoding='utf-8')
          provisioner = Path('infrastructure/windows/provision_wp22a_clientless_remote_access.ps1').read_text(encoding='utf-8')
          terraform = Path('infrastructure/cloudflare/wp22a/main.tf').read_text(encoding='utf-8')
          terraform_lock = Path('infrastructure/cloudflare/wp22a/.terraform.lock.hcl').read_text(encoding='utf-8')
          api = Path('apps/web/src/app-shell/api.ts').read_text(encoding='utf-8')

          planning_required = [
              'managed-cloud Omni-CIO Web/API',
              'WP23+: LOCKED',
              'trading_methods=false',
              'REAL_TRADING_ENABLED=false',
              'historical/dormant engineering evidence',
          ]
          for marker in planning_required:
              if marker not in contract and marker not in selection:
                  raise SystemExit(f'WP22A corrected planning marker missing: {marker}')
          for marker in (
              'Production-origin provider selection is not yet made',
              'No provider mutation is authorized',
              'managed-cloud production origin independent of OWNER home infrastructure',
          ):
              if marker not in selection:
                  raise SystemExit(f'WP22A provider-neutral planning marker missing: {marker}')

          # The already-accepted Phase-A Cloudflare/Lenovo source remains dormant
          # historical evidence during this planning-only PR. Validate its safety
          # properties without treating it as the selected final public architecture.
          for marker in ('Cf-Access-Authenticated-User-Email', 'Cf-Access-Jwt-Assertion', '__Host-omni_v10_session', '__Host-omni_v10_csrf'):
              if marker not in middleware:
                  raise SystemExit(f'WP22A dormant Phase-A middleware marker missing: {marker}')
          if 'OMNI_V10_WEB_EXTERNAL_PROVIDER' not in factory or 'cloudflare' not in factory:
              raise SystemExit('WP22A dormant Phase-A remote factory safety source drifted')
          if '--host 127.0.0.1' not in launcher or '--no-proxy-headers' not in launcher:
              raise SystemExit('WP22A dormant Phase-A runtime lost loopback/no-proxy-header boundary')
          for marker in ('--token-file', 'Get-FileHash -Algorithm SHA256', 'BlockRunnerLoopback', 'Read-Host "Cloudflare Tunnel token'):
              if marker not in provisioner:
                  raise SystemExit(f'WP22A dormant Phase-A Lenovo source missing: {marker}')
          for marker in ('data "cloudflare_zero_trust_organization"', 'data "cloudflare_zero_trust_access_identity_providers"', 'idp.config.restrict_to_account_members', 'cloudflare_zero_trust_access_application', 'cloudflare_account_member', 'required  = true', 'http_status:404', 'http://127.0.0.1:8765', 'deny_unmatched_requests == true'):
              if marker not in terraform:
                  raise SystemExit(f'WP22A dormant Phase-A Cloudflare source missing: {marker}')
          if 'resource "cloudflare_zero_trust_organization"' in terraform or 'resource "cloudflare_zero_trust_access_identity_provider"' in terraform:
              raise SystemExit('WP22A dormant Phase-A source must not create duplicate Zero Trust organization/IdP')
          for marker in ('registry.terraform.io/cloudflare/cloudflare', 'version     = "5.22.0"', 'zh:ca4bf16742a7e59319a482f003d32f6f6abbc5fbf862916ce1a136278e6d420d'):
              if marker not in terraform_lock:
                  raise SystemExit(f'WP22A dormant Phase-A Terraform lock marker missing: {marker}')
          if 'X-Omni-CSRF' not in api or 'localStorage' in api or 'sessionStorage' in api:
              raise SystemExit('WP22A frontend session/CSRF contract invalid')
          if 'Tailscale-User-' in middleware or '.ts.net' in middleware:
              raise SystemExit('WP22A dormant Phase-A source contains Tailscale identity coupling')
          print('WP22A corrected planning + dormant Phase-A source safety contract OK')
          PY

      - name: Verify accepted Web and repository guards
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_web_baseline.py
          if errorlevel 1 exit /b 40
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_repository_boundaries.py
          if errorlevel 1 exit /b 41
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_regression_shield.py
          if errorlevel 1 exit /b 42

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
