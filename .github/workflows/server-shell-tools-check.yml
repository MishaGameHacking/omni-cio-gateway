name: Check server shell delivery inputs on owner laptop
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/server-shell-tools-check.yml
      - deploy/publish_server_shell.py
      - deploy/test_server_shell.py
      - tools/prepare_shell_delivery.py
      - tools/deliver_server_shell.py
      - tools/check_server_shell_tools.py
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: shell-tools-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            deploy
            tools
            .github/scripts/emulator_lease.py
      - name: Check transport syntax and tampered input handling using synthetic files
        shell: cmd
        working-directory: shell-tools-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'"
          if errorlevel 1 exit /b 1
          py -3 -m py_compile deploy\publish_server_shell.py tools\prepare_shell_delivery.py tools\deliver_server_shell.py
          if errorlevel 1 exit /b 1
          py -3 tools\check_server_shell_tools.py
          if errorlevel 1 exit /b 1
