name: Read owner55 exact source quality findings
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner55-quality-observation.yml]
permissions:
  contents: read
  checks: read
jobs:
  read:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Read bounded Sonar annotations for the candidate source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const ref = '4fdaf2cf327dbdbce83d0adc901e4c0a081b9f7b';
            const checks = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref, per_page:100});
            const sonar = checks.filter(x => x.name === 'SonarCloud Code Analysis' && x.head_sha === ref)
              .sort((a,b) => b.id-a.id)[0];
            if (!sonar) throw new Error('Exact source analysis unavailable');
            const notes = await github.paginate(github.rest.checks.listAnnotations,
              {...context.repo, check_run_id:sonar.id, per_page:100});
            if (notes.length > 500) throw new Error('Unexpected finding count');
            console.log('QUALITY_FINDINGS='+JSON.stringify({sha:ref, check_id:sonar.id,
              conclusion:sonar.conclusion, findings:notes.map(x => ({path:x.path,line:x.start_line,
                level:x.annotation_level,title:x.title,message:x.message}))}));
