name: UI candidate transfer (PR 750 only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/ui-candidate-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Verify exact reload repair without moving refs
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 50b02bd18a456a262b06b6f58df233fc061a1375
          persist-credentials: false
          clean: true
      - shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          "%OMNICIO_PYTHON%" -c "import base64,hashlib,json,os,urllib.request; sha='461e68fb2610864bdc8131c8a7353a434fae7c4e'; req=urllib.request.Request('https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'OmniCIO-reviewed-source-transport'}); response=urllib.request.urlopen(req,timeout=30); data=json.loads(response.read(200000)); response.close(); raw=base64.b64decode(data['content']); assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha; exec(compile(raw,'verified-reload-transport','exec'))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-reload-blobs-750
          path: candidate-blobs.json
          if-no-files-found: error
          retention-days: 1
