name: UI candidate transfer (PR 750 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ui-candidate-transfer.yml

permissions:
  contents: read
  checks: read

concurrency:
  group: ui-candidate-transfer-750
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Read fixed candidate quality evidence only
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read accepted source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ae04f3c5f8b31cc52fb08e21364655d5540754b
          persist-credentials: false
          clean: true
      - name: Bootstrap existing pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Read quality annotations for actual candidate
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "%OMNICIO_PYTHON%" -c "import json,os,pathlib,urllib.request; base='https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/112095224340'; headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'OmniCIO-quality-evidence'}; response=urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30); check=json.load(response); response.close(); assert check['head_sha']=='2fef19ccf3fc2eaf21c7c97d7194eb950a5d2221' and check['app']['id']==12526; response=urllib.request.urlopen(urllib.request.Request(base+'/annotations?per_page=100',headers=headers),timeout=30); rows=json.load(response); response.close(); assert len(rows)==check['output']['annotations_count']; pathlib.Path('quality-annotations.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8'); print('Read annotations:',len(rows))"
      - name: Preserve private quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-quality-750
          path: quality-annotations.json
          if-no-files-found: error
          retention-days: 1
