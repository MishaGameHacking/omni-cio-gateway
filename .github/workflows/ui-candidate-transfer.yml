name: UI candidate transfer (PR 750 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ui-candidate-transfer.yml

permissions:
  contents: read

concurrency:
  group: ui-candidate-transfer-750
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Verify reviewed candidate and publish immutable source blobs
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Read accepted source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ae04f3c5f8b31cc52fb08e21364655d5540754b
          persist-credentials: false
          clean: true
      - name: Bootstrap existing pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Verify exact bytes and publish immutable blobs without moving refs
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $script = @'
          """One-use reviewed source transport: immutable blobs only, never refs or deploys."""
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request

          REPO = 'MishaGameHacking/omni-cio-gateway'
          BASE = '0ae04f3c5f8b31cc52fb08e21364655d5540754b'
          PARTS = ['5fe38b1f0f144ac7f9be764a6882eb78705e88d0', 'b28047c081db4756c269398ba048fd1e43b8d54e', '376792c53d050a067c44c6cb17ad01073f39a5cd', 'acb109027e84916c5bff04bc19822aefd7b0d34f']
          XZ_HASH = 'd97739bfa82ffca38bda80c96e7f4e01a348342e810fdcf2da2763e7bb4d79b0'
          PATCH_HASH = 'a05b415dd71d49ece051627f1b8b4fd558b9ec02ea6fd7e75d19bb1ea20fc8d2'
          FILES = {'.github/scripts/test_timeweb_auth_app.py': ('deeb2a2569d798130950c86f6b1cc245cd6cf23a', 'da5429fc26f3c171ddaff456c46c92b9c3772d5d'), '.github/workflows/auth-postgres.yml': ('c78ce2c3bf771e9a9a0b28a1145f69382542c4f0', '461fcd876417895c0a6e3ac019c809d1dd3a12f6'), 'AGENTS.md': ('05e6b02518b3f9c32f18313e6e64b826ee4e3676', '52e53c9e3a369914e0a96bde02ab15f887e80dde'), 'migrations/0012_strategy_drafts.sql': (None, 'eb31fa60d46440bb1890d82553ff5b0ddf532db0'), 'pyproject.toml': ('feb94d5921ccd2683d56573fc2de4ea3a5ff2331', '0411cf0aab0dbf208f5abf6c2f3d06ac3dabe329'), 'src/omnicio/db.py': ('2652db46c8bcddc9c182d3fff54482cf6b0cb47c', '272a2098d353d3ac86f6edff81b9427515c221f1'), 'src/omnicio/main.py': ('7e8b4d837bdc94a77010e3ce1c581819633e37bb', 'e80792e5b57fb305cfd3225bea278cbd7647a4e6'), 'src/omnicio/portfolio_store.py': ('92a7cf80ba0e5e4f813ad94a78f647a73951611e', '1e3c9a75cf055a61a935ef572df2bb6f5535feeb'), 'src/omnicio/strategy.py': (None, 'cb2d3fa06c1d962b7008b5517f6d90cc4779717d'), 'tests/frontend-smoke.cjs': ('e8bee692f2c20811a18f26b7fc20ea29c7eb0889', '17ce56b78fd10feb269947d0cb6c14a8e57d2dc6'), 'tests/test_postgres_migrations.py': ('ec2bccc8010c32d7fb4278cac0ed805831ea32df', 'fae73784fe60e95a6dc35619b31ca94770f520e7'), 'tests/test_settings_recovery.py': ('9f70719a4c394aef50e9aeb216fc3e0e56c56ff0', 'e2c1811cbe819a38aa3ecae28c190140d6c0f5cc'), 'tests/test_strategy.py': (None, '0ebac3fc8c69e89294a9c3b81958ee589c5a810b'), 'uv.lock': ('30a106ed9109b8c4146b499614a6571a5283a63a', '5e8921246a453d0ad19f190703ae31b1e6a952b3'), 'web/app.css': ('ac0fce4ae9a77b0c8bc7187e79f98c5de8b2cb6e', 'b171f5ea106168e499eea518e23a6618ef41f9cc'), 'web/app.js': ('cbc7d819d7c8182a3d726caa4e6f74a9e88204a5', 'f1f509f30007ca06204152e5dda65c869387cdd4'), 'web/index.html': ('0d4622c67b2e12473c82988b37d33ec3c4a3e7d5', 'b7fbd1dc9540fb544476a5767f7bfa114da0b12d'), 'web/workspace.js': ('d3cdd2e1ed22b0eb4bb9dd56024894ad2dea032a', '498025dc8f14a4c9375c5b2e40e975ad8b032dbb')}

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git_blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          def api(path, data=None):
              url = 'https://api.github.com/repos/' + REPO + '/' + path
              raw = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(url, data=raw, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OmniCIO-reviewed-source-transport',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read(2000001)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('GitHub source transport HTTP ' + str(exc.code)) from None
              require(len(payload) <= 2000000, 'Response too large')
              return json.loads(payload)

          def git(*args):
              return subprocess.run(['git', '-c', 'core.autocrlf=false', *args],
                                    check=True, capture_output=True).stdout

          require(os.environ['GITHUB_REPOSITORY'] == REPO, 'Wrong repository')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pr = event['pull_request']
          require(pr['number'] == 750 and pr['head']['ref'] == 'feature/strategy-touch-controls', 'Wrong PR')
          require(pr['head']['repo']['full_name'] == REPO and pr['author_association'] == 'OWNER', 'Wrong authority')
          require(os.environ['GITHUB_ACTOR'] == 'MishaGameHacking', 'Wrong actor')
          require(api('git/ref/heads/main')['object']['sha'] == BASE, 'Main advanced; inspect before retry')
          require(api('pulls/750')['head']['sha'] == os.environ['EXPECTED_HEAD'], 'PR advanced; inspect before retry')
          require(git('rev-parse', 'HEAD').decode().strip() == BASE, 'Not pinned baseline')
          chunks = []
          for index, sha in enumerate(PARTS):
              blob = api('git/blobs/' + sha)
              require(blob['encoding'] == 'base64', 'Unexpected blob encoding')
              chunk = base64.b64decode(''.join(blob['content'].split()), validate=True)
              require(git_blob(chunk) == sha, 'Chunk hash mismatch')
              require(len(chunk) == (14304 if index == 3 else 15000), 'Chunk size mismatch')
              chunks.append(chunk)
          compressed = b''.join(chunks)
          require(hashlib.sha256(compressed).hexdigest() == XZ_HASH, 'XZ hash mismatch')
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(compressed, max_length=281009)
          require(decoder.eof and not decoder.unused_data, 'Incomplete or extra compressed stream')
          require(len(patch) == 281008 and hashlib.sha256(patch).hexdigest() == PATCH_HASH, 'Patch mismatch')
          changed = re.findall(rb'^diff --git a/(\S+) b/(\S+)$', patch, re.M)
          require(len(changed) == len(FILES), 'Wrong file count')
          require(all(a == b for a, b in changed), 'Renames not allowed')
          require({a.decode() for a, _ in changed} == set(FILES), 'Patch path outside whitelist')
          root = Path.cwd()
          for path, (before, after) in FILES.items():
              target = root / path
              if before is None:
                  require(not target.exists(), 'New path already exists: ' + path)
              else:
                  raw = git('show', BASE + ':' + path)
                  require(git_blob(raw) == before, 'Baseline mismatch: ' + path)
                  target.write_bytes(raw)
          with tempfile.TemporaryDirectory(prefix='omnicio-patch-', dir=os.environ['RUNNER_TEMP']) as tmp:
              patch_path = Path(tmp) / 'reviewed.patch'
              patch_path.write_bytes(patch)
              git('apply', '--check', '--unidiff-zero', str(patch_path))
              git('apply', '--unidiff-zero', str(patch_path))
          for path, (_, after) in FILES.items():
              require(git_blob((root / path).read_bytes()) == after, 'Candidate mismatch: ' + path)
          require(api('git/ref/heads/main')['object']['sha'] == BASE, 'Main advanced during verification')
          require(api('pulls/750')['head']['sha'] == os.environ['EXPECTED_HEAD'], 'PR advanced during verification')
          result = {'base_sha': BASE, 'transport_head': os.environ['EXPECTED_HEAD'],
                    'patch_sha256': PATCH_HASH, 'files': {}}
          for path, (_, after) in FILES.items():
              raw = (root / path).read_bytes()
              raw.decode('utf-8')
              response = api('git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              require(response['sha'] == after, 'GitHub candidate mismatch: ' + path)
              result['files'][path] = after
              print(path + ': ' + after)
          Path('candidate-blobs.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print('Verified all 18 files; immutable source blobs published. No ref, merge or production mutation.')
          '@
          $path = Join-Path $env:RUNNER_TEMP ('strategy-transfer-' + $env:GITHUB_RUN_ID + '.py')
          [System.IO.File]::WriteAllText($path, $script, (New-Object System.Text.UTF8Encoding($false)))
          & $env:OMNICIO_PYTHON $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate syntax without write token
        shell: cmd
        run: |
          node --check web\app.js
          if errorlevel 1 exit /b 1
          node --check web\workspace.js
          if errorlevel 1 exit /b 1
          node --check tests\frontend-smoke.cjs
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m py_compile src\omnicio\strategy.py src\omnicio\main.py src\omnicio\portfolio_store.py
      - name: Preserve private mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-candidate-blobs-750
          path: candidate-blobs.json
          if-no-files-found: warn
          retention-days: 1
