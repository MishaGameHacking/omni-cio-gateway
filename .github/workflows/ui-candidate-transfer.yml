name: UI candidate transfer (PR 750 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ui-candidate-transfer.yml

permissions:
  contents: read

concurrency:
  group: ui-candidate-transfer-750
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Package pinned source without running application code
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read accepted source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ae04f3c5f8b31cc52fb08e21364655d5540754b
          persist-credentials: false
          clean: true
      - name: Upload private integration baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-integration-baseline-750
          path: |
            src/omnicio/
            migrations/
            tests/
            web/
            .github/scripts/
            .github/workflows/auth-foundation.yml
            .github/workflows/auth-app-deploy.yml
            .github/workflows/auth-postgres.yml
            .sonarcloud.properties
            pyproject.toml
            uv.lock
            requirements-runtime.txt
            requirements-dev.txt
            AGENTS.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
