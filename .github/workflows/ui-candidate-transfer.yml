name: UI candidate transfer (PR 750 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ui-candidate-transfer.yml

permissions:
  contents: read

concurrency:
  group: ui-candidate-transfer-750
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Verify follow-up and publish immutable source blobs
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Read delivered candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2fef19ccf3fc2eaf21c7c97d7194eb950a5d2221
          persist-credentials: false
          clean: true
      - name: Bootstrap existing pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Apply sealed reviewed follow-up and transfer immutable blobs only
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          "%OMNICIO_PYTHON%" -c "import base64,hashlib,json,os,urllib.request; request=urllib.request.Request('https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/git/blobs/9f3a6197b4cf17c5c0841f6d0253e35b9ec82f56',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'OmniCIO-reviewed-source-transport'}); response=urllib.request.urlopen(request,timeout=30); data=json.loads(response.read(100000)); response.close(); raw=base64.b64decode(data['content']); assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='9f3a6197b4cf17c5c0841f6d0253e35b9ec82f56'; exec(compile(raw,'verified-followup-transfer','exec'))"
      - name: Candidate syntax without write token
        shell: cmd
        run: |
          node --check web\app.js
          if errorlevel 1 exit /b 1
          node --check web\workspace.js
          if errorlevel 1 exit /b 1
          node --check tests\frontend-smoke.cjs
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m py_compile src\omnicio\strategy.py src\omnicio\main.py src\omnicio\portfolio_store.py
      - name: Preserve private mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-followup-blobs-750
          path: candidate-blobs.json
          if-no-files-found: warn
          retention-days: 1
