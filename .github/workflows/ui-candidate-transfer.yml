name: UI candidate transfer (PR 750 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ui-candidate-transfer.yml

permissions:
  contents: read

concurrency:
  group: ui-candidate-transfer-750
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'MishaGameHacking/omni-cio-gateway' &&
      github.event.pull_request.number == 750 &&
      github.event.pull_request.head.ref == 'feature/strategy-touch-controls' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.actor == 'MishaGameHacking'
    name: Verify sealed candidate and publish immutable blobs only
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Read pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3e7d37bac20c5973a751a2031c9e83a08b8629f1
          persist-credentials: false
          clean: true
      - name: Bootstrap existing pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Verify exact patch and transfer blobs without moving any ref
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $script = @'
          import base64, hashlib, http.client, json, lzma, os, pathlib, subprocess, tempfile
          REPO = 'MishaGameHacking/omni-cio-gateway'
          BASE = '3e7d37bac20c5973a751a2031c9e83a08b8629f1'
          MAIN = '0ae04f3c5f8b31cc52fb08e21364655d5540754b'
          GIT = r'C:\Program Files\Git\cmd\git.exe'
          MANIFEST = {
            'AGENTS.md': ('05e6b02518b3f9c32f18313e6e64b826ee4e3676', 'dfae87f3e6fde0d2d1c84f7042069c8f3e4959fe'),
            'tests/frontend-smoke.cjs': ('e8bee692f2c20811a18f26b7fc20ea29c7eb0889', '388fd97f845074a78a339f85ca93874259fd8874'),
            'uv.lock': ('30a106ed9109b8c4146b499614a6571a5283a63a', '5e8921246a453d0ad19f190703ae31b1e6a952b3'),
            'web/app.css': ('ac0fce4ae9a77b0c8bc7187e79f98c5de8b2cb6e', '6e15aa89ec200ff89e21b2f2394cadc03671fe3c'),
            'web/app.js': ('cbc7d819d7c8182a3d726caa4e6f74a9e88204a5', '45ee2a945c8d0541e1303113e9ccfb933026b246'),
            'web/index.html': ('0d4622c67b2e12473c82988b37d33ec3c4a3e7d5', '21b4d293fbd6ae72de8f12ca5bb8f3b526973edc'),
            'web/workspace.js': ('d3cdd2e1ed22b0eb4bb9dd56024894ad2dea032a', 'cb5861ff5884b84596f7fa292eb3b68a4f200ef0'),
          }
          DATA = ''''''
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def git(*args):
              return subprocess.run([GIT, *args], check=True, capture_output=True).stdout
          compressed = base64.b64decode(DATA, validate=True)
          assert len(compressed) == 21388 and hashlib.sha256(compressed).hexdigest() == 'b205b367b8042467526b87ee67ad5e5109bce780c5b970a83706a9f36496e686'
          patch = lzma.decompress(compressed)
          assert len(patch) == 84083 and hashlib.sha256(patch).hexdigest() == 'd0665016497a318dc044ead55a98f8b885ed3ed8e6e346ab76442c9a5b2f7e6d'
          for path, (before, after) in MANIFEST.items():
              original = git('show', BASE + ':' + path)
              assert blob(original) == before, path
              pathlib.Path(path).write_bytes(original)
          with tempfile.TemporaryDirectory() as directory:
              patch_path = pathlib.Path(directory) / 'sealed.patch'
              patch_path.write_bytes(patch)
              git('apply', '--check', str(patch_path))
              git('apply', str(patch_path))
          for path, (before, after) in MANIFEST.items():
              assert blob(pathlib.Path(path).read_bytes()) == after, path
          version_path = '.github/scripts/test_timeweb_auth_app.py'
          version_source = git('show', BASE + ':' + version_path)
          assert blob(version_source) == 'deeb2a2569d798130950c86f6b1cc245cd6cf23a'
          old = b'\'version = "0.19.2"\''
          new = b'\'version = "0.19.3"\''
          assert version_source.count(old) == 1
          pathlib.Path(version_path).write_bytes(version_source.replace(old, new))
          paths = [*MANIFEST, version_path]
          assert set(git('diff', '--name-only').decode().splitlines()) == set(paths)
          git('diff', '--check')
          def api(method, suffix, payload=None):
              connection = http.client.HTTPSConnection('api.github.com', timeout=20)
              try:
                  connection.request(method, '/repos/' + REPO + suffix, body=None if payload is None else json.dumps(payload), headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'omnicio-sealed-candidate'})
                  response = connection.getresponse()
                  data = response.read(2000001)
                  if response.status not in (200, 201) or len(data) > 2000000:
                      raise RuntimeError('GitHub transport status ' + str(response.status))
                  return json.loads(data)
              finally:
                  connection.close()
          assert api('GET', '/git/ref/heads/main')['object']['sha'] == MAIN
          assert api('GET', '/git/ref/heads/feature/strategy-touch-controls')['object']['sha'] == os.environ['EXPECTED_HEAD']
          results = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              result = api('POST', '/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == blob(data), path
              results[path] = result['sha']
          pathlib.Path('candidate-blobs.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          print('BLOB_JSON=' + json.dumps(results, sort_keys=True))
          print('SEALED_PATCH_VERIFIED; NO REFS MOVED; NO PRODUCTION ACTION')
          '@
          $script | & $env:OMNICIO_PYTHON -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate syntax and browser preflight without write token
        shell: cmd
        run: |
          node --check web\app.js
          if errorlevel 1 exit /b 1
          node --check web\workspace.js
          if errorlevel 1 exit /b 1
          node --check tests\frontend-smoke.cjs
          if errorlevel 1 exit /b 1
          node tests\frontend-smoke.cjs
      - name: Preserve private candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-candidate-evidence-750
          path: |
            candidate-blobs.json
            artifacts/frontend/*.png
          if-no-files-found: warn
          retention-days: 1
