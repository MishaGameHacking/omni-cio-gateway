name: Auth private network

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/auth-private-network.yml"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_network.py"
      - ".github/scripts/timeweb_http.py"
      - ".github/scripts/test_timeweb_auth_network.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-private-network.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_network.py"
      - ".github/scripts/timeweb_http.py"
      - ".github/scripts/test_timeweb_auth_network.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-private-network
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    name: Test network reconciler
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Run network reconciler tests
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\test_timeweb_auth_network.py'

  reconcile:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Reconcile private network
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      VPC_NAME: omni-cio-private
      VPC_SUBNET: "10.77.0.0/24"
      VPC_LOCATION: ru-3
      VPC_ZONE: msk-1

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Verify current main release checks
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"%OMNICIO_PYTHON%" .github\scripts\verify_main_release.py'

      - name: Validate Timeweb secret
        shell: cmd
        run: |
          @echo off
          if not defined TIMEWEB_CLOUD_TOKEN (
            echo ::error::TIMEWEB_CLOUD_TOKEN is missing
            exit /b 1
          )

      - name: Reconcile auth private network
        id: network
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\timeweb_auth_network.py ^
            --server-name "%SERVER_NAME%" ^
            --server-comment "%SERVER_COMMENT%" ^
            --vpc-name "%VPC_NAME%" ^
            --subnet-v4 "%VPC_SUBNET%" ^
            --location "%VPC_LOCATION%" ^
            --availability-zone "%VPC_ZONE%"

      - name: Surface incompatible VDS tariff gate
        if: steps.network.outputs.status == 'pending_server_preset'
        shell: cmd
        run: echo ::warning title=Private network tariff required::The existing VDS tariff cannot join a private network. No VPC or PostgreSQL resource was created.

      - name: Surface manual VDS attachment gate
        if: steps.network.outputs.status == 'pending_server_network'
        shell: cmd
        run: echo ::warning title=Private network attachment required::VPC ${{ steps.network.outputs.vpc_id }} is ready, but the existing VDS must be attached in Timeweb Cloud before PostgreSQL can be created privately.
