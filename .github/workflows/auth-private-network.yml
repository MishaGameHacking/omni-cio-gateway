name: Auth private network

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/auth-private-network.yml"
      - ".github/scripts/timeweb_auth_network.py"
      - ".github/scripts/test_timeweb_auth_network.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-private-network.yml"
      - ".github/scripts/timeweb_auth_network.py"
      - ".github/scripts/test_timeweb_auth_network.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-private-network
  cancel-in-progress: false

jobs:
  tests:
    name: Test network reconciler
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run network reconciler tests
        run: python3 .github/scripts/test_timeweb_auth_network.py

  reconcile:
    name: Reconcile private network
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      VPC_NAME: omni-cio-private
      VPC_SUBNET: "10.77.0.0/24"
      VPC_LOCATION: ru-3
      VPC_ZONE: msk-1

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Timeweb secret
        run: |
          set -euo pipefail
          test -n "${TIMEWEB_CLOUD_TOKEN:-}" || {
            echo "::error::TIMEWEB_CLOUD_TOKEN is missing"
            exit 1
          }

      - name: Reconcile auth private network
        id: network
        run: |
          set -euo pipefail
          python3 .github/scripts/timeweb_auth_network.py \
            --server-name "${SERVER_NAME}" \
            --server-comment "${SERVER_COMMENT}" \
            --vpc-name "${VPC_NAME}" \
            --subnet-v4 "${VPC_SUBNET}" \
            --location "${VPC_LOCATION}" \
            --availability-zone "${VPC_ZONE}"

      - name: Surface incompatible VDS tariff gate
        if: steps.network.outputs.status == 'pending_server_preset'
        run: |
          echo "::warning title=Private network tariff required::The existing VDS tariff cannot join a private network. No VPC or PostgreSQL resource was created."

      - name: Surface manual VDS attachment gate
        if: steps.network.outputs.status == 'pending_server_network'
        run: |
          echo "::warning title=Private network attachment required::VPC ${{ steps.network.outputs.vpc_id }} is ready, but the existing VDS must be attached in Timeweb Cloud before PostgreSQL can be created privately."
