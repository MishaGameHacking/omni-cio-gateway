name: TEMP V10 Post-Merge Regression Verification 355

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-postmerge-regression-verification-355.yml"

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  verify-postmerge-regression:
    name: Verify exact-main post-merge Regression Shield
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Verify Regression Shield for exact accepted main
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $repo=$env:GITHUB_REPOSITORY; $expected=$env:EXPECTED_MAIN_SHA; $headers=@{Authorization=('Bearer '+$env:GH_TOKEN); Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}; $runsUri=('https://api.github.com/repos/'+$repo+'/actions/workflows/regression-shield.yml/runs?branch=main&event=push&per_page=20'); $runs=(Invoke-RestMethod -Uri $runsUri -Headers $headers -Method Get).workflow_runs; $matches=@($runs | Where-Object { $_.head_sha -eq $expected -and $_.event -eq 'push' -and $_.head_branch -eq 'main' } | Sort-Object run_number -Descending); if($matches.Count -ne 1){ throw ('POSTMERGE_REGRESSION_RUN_NOT_FOUND count='+$matches.Count) }; $run=$matches[0]; if($run.status -ne 'completed'){ throw ('POSTMERGE_REGRESSION_NOT_COMPLETED run='+$run.id+' status='+$run.status) }; if($run.conclusion -ne 'success'){ throw ('POSTMERGE_REGRESSION_NOT_GREEN run='+$run.id+' conclusion='+$run.conclusion) }; $jobs=(Invoke-RestMethod -Uri $run.jobs_url -Headers $headers -Method Get).jobs; $required=@('Quality, contracts and coverage','Dependency, code and secret security'); foreach($name in $required){ $matching=@($jobs | Where-Object { $_.name -eq $name }); if($matching.Count -ne 1){ throw ('POSTMERGE_REQUIRED_JOB_NOT_FOUND name='+$name+' count='+$matching.Count) }; $job=$matching[0]; if($job.status -ne 'completed' -or $job.conclusion -ne 'success'){ throw ('POSTMERGE_REQUIRED_JOB_NOT_GREEN name='+$name+' status='+$job.status+' conclusion='+$job.conclusion) } }; Write-Output ('REGRESSION_SHIELD_EVIDENCE run_id='+$run.id+' run_number='+$run.run_number+' head_sha='+$run.head_sha+' conclusion='+$run.conclusion); foreach($name in $required){ $job=@($jobs | Where-Object { $_.name -eq $name })[0]; Write-Output ('REGRESSION_SHIELD_JOB name='+$name+' conclusion='+$job.conclusion) }"

      - name: Diagnose SonarQube Cloud check for deployment PR
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR_NUMBER: "357"
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $repo=$env:GITHUB_REPOSITORY; $headers=@{Authorization=('Bearer '+$env:GH_TOKEN); Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}; $pr=Invoke-RestMethod -Uri ('https://api.github.com/repos/'+$repo+'/pulls/'+$env:TARGET_PR_NUMBER) -Headers $headers -Method Get; $sha=[string]$pr.head.sha; if($sha.Length -ne 40){ throw 'TARGET_PR_HEAD_INVALID' }; $payload=Invoke-RestMethod -Uri ('https://api.github.com/repos/'+$repo+'/commits/'+$sha+'/check-runs?per_page=100') -Headers $headers -Method Get; $sonar=@($payload.check_runs | Where-Object { ([string]$_.name) -match 'Sonar' -or ([string]$_.app.slug) -match 'sonar' }); if($sonar.Count -lt 1){ throw ('SONAR_CHECK_NOT_FOUND head_sha='+$sha) }; foreach($check in $sonar){ Write-Output ('SONAR_CHECK id='+$check.id+' name='+$check.name+' status='+$check.status+' conclusion='+$check.conclusion+' head_sha='+$sha); if($null -ne $check.output){ Write-Output ('SONAR_OUTPUT_TITLE '+([string]$check.output.title)); Write-Output ('SONAR_OUTPUT_SUMMARY '+(([string]$check.output.summary) -replace '[\r\n]+',' ')); Write-Output ('SONAR_OUTPUT_TEXT '+(([string]$check.output.text) -replace '[\r\n]+',' ')) }; $annotations=@(Invoke-RestMethod -Uri ('https://api.github.com/repos/'+$repo+'/check-runs/'+$check.id+'/annotations?per_page=100') -Headers $headers -Method Get); Write-Output ('SONAR_ANNOTATION_COUNT '+$annotations.Count); foreach($annotation in $annotations){ Write-Output ('SONAR_ANNOTATION path='+$annotation.path+' start_line='+$annotation.start_line+' end_line='+$annotation.end_line+' level='+$annotation.annotation_level+' title='+(([string]$annotation.title) -replace '[\r\n]+',' ')+' message='+(([string]$annotation.message) -replace '[\r\n]+',' ')) } }"
