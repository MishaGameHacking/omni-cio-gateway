name: Apply Android 16 backend fixture fixes

# One-time retry after widening the fixture scan to release metadata contracts.
on:
  push:
    branches: [feature/android-16-only]
    paths:
      - ".github/workflows/apply-android16-backend-fixture-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Repair Android 16 publication fixtures
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/android-16-only
          persist-credentials: true
          clean: true

      - name: Apply exact fixture fixes
        shell: cmd
        run: |
          py -3 .github\scripts\apply_android16_backend_fixture_fixes.py
          if errorlevel 1 exit /b 1
          py -3 -m py_compile backend\release_publication.py backend\tests\test_update_integration.py backend\tests\test_release_metadata_contract.py backend\tests\test_release_recovery.py backend\tests\test_release_rollover.py
          if errorlevel 1 exit /b 1
          git diff --check
          if errorlevel 1 exit /b 1

      - name: Commit repaired source and fixtures
        shell: cmd
        run: |
          git config user.name "Analyst AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ":(exclude).github/workflows/apply-android16-backend-fixture-fixes.yml"
          git diff --cached --quiet && exit /b 1
          git commit -m "Fix Android 16 publication fixture contracts"
          if errorlevel 1 exit /b 1
          git push origin HEAD:feature/android-16-only
          if errorlevel 1 exit /b 1
