name: V10 RU-PG-B Timeweb Existing IPv4 Allocation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded allocation phase
        required: true
        type: choice
        options:
          - INITIALIZE
          - PLAN
          - APPLY
          - RECONCILE
      plan_id:
        description: PLAN handle for APPLY or RECONCILE; leave empty otherwise
        required: false
        type: string
      approval_comment_id:
        description: OWNER-authored issue #559 comment ID for APPLY only
        required: false
        type: string
      confirmation:
        description: Exact allocation confirmation for APPLY only
        required: true
        type: choice
        options:
          - NONE
          - ALLOCATE_EXISTING_TIMEWEB_IPV4_NO_CREATE_NO_DELETE

permissions:
  actions: read
  contents: read

# Serialize with the existing network/TLS workflow. Allocation metadata and
# transport mutation must never race on the same Timeweb account/cluster.
concurrency:
  group: v10-timeweb-postgres-public-ipv4-tls
  cancel-in-progress: false

jobs:
  environment-policy-proof:
    name: Verify existing-IPv4 allocation source and main-only policy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.sha }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify allocation source contract
        shell: cmd
        run: python scripts/check_v10_timeweb_ipv4_allocation.py

      - name: Verify provider secret custody
        shell: cmd
        run: python scripts/check_v10_provider_secret_custody.py

      - name: Verify Timeweb control-plane scope
        shell: cmd
        run: python scripts/check_v10_timeweb_postgres_control_plane.py

      - name: Verify GitHub environment main-only policy before protected execution
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_v10_timeweb_github_environment

      - name: Clean source-proof workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  non-apply:
    name: ${{ inputs.mode }} existing IPv4 allocation state
    needs: environment-policy-proof
    if: github.ref == 'refs/heads/main' && inputs.mode != 'APPLY'
    environment: timeweb-synthetic
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_HEAD: ${{ github.sha }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-verify allocation source contract
        shell: cmd
        run: python scripts/check_v10_timeweb_ipv4_allocation.py

      - name: Re-verify GitHub environment policy
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_v10_timeweb_github_environment

      - name: Initialize protected allocation journal
        if: inputs.mode == 'INITIALIZE'
        shell: cmd
        run: python -m scripts.run_v10_timeweb_ipv4_allocation --mode INITIALIZE

      - name: Prepare existing-IPv4 allocation plan
        if: inputs.mode == 'PLAN'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
        run: python -m scripts.run_v10_timeweb_ipv4_allocation --mode PLAN

      - name: Reconcile attempted allocation without provider write
        if: inputs.mode == 'RECONCILE'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
        run: >-
          python -m scripts.run_v10_timeweb_ipv4_allocation
          --mode RECONCILE
          --plan-id "${{ inputs.plan_id }}"

      - name: Clean protected runner workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  apply:
    name: Apply separately approved existing IPv4 allocation
    needs: environment-policy-proof
    if: github.ref == 'refs/heads/main' && inputs.mode == 'APPLY'
    environment: timeweb-synthetic
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
    env:
      EXPECTED_HEAD: ${{ github.sha }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-verify allocation source contract before provider mutation
        shell: cmd
        run: python scripts/check_v10_timeweb_ipv4_allocation.py

      - name: Re-verify GitHub environment policy before provider mutation
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_v10_timeweb_github_environment

      - name: Apply exact OWNER-approved existing IPv4 allocation
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
        run: >-
          python -m scripts.run_v10_timeweb_ipv4_allocation
          --mode APPLY
          --plan-id "${{ inputs.plan_id }}"
          --approval-reference "${{ inputs.approval_comment_id }}"
          --confirmation "${{ inputs.confirmation }}"

      - name: Clean protected runner workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
