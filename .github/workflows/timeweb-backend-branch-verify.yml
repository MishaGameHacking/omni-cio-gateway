name: Timeweb backend branch verify

on:
  push:
    branches: [feature/telegram-auth-timeweb]
    paths:
      - ".github/workflows/timeweb-backend-branch-verify.yml"

jobs:
  deploy:
    name: Deploy branch backend to Timeweb
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 30
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
      TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Deploy exact branch backend
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" (
            echo ::error::Git Bash is not installed on this runner.
            exit /b 1
          )
          "C:\Program Files\Git\bin\bash.exe" ".github/scripts/deploy_timeweb_backend.sh"
          if errorlevel 1 exit /b 1
