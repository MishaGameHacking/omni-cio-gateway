name: Auth application deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - "uv.lock"
      - "requirements-runtime.txt"
      - "requirements-dev.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_recovery.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - "src/omnicio/**"
      - "web/**"
      - "tests/frontend-smoke.cjs"
      - "tests/frontend_server_contract.py"
      - "tests/i18n-contract.cjs"
      - "assets/brand/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - "uv.lock"
      - "requirements-runtime.txt"
      - "requirements-dev.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_recovery.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - "src/omnicio/**"
      - "web/**"
      - "tests/frontend-smoke.cjs"
      - "tests/frontend_server_contract.py"
      - "tests/i18n-contract.cjs"
      - "assets/brand/**"
      - "pyproject.toml"
  workflow_run:
    workflows:
      - Auth PostgreSQL
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR validation must never block a production deployment. Production-triggered
  # runs still share one lock so two releases cannot mutate the server at once.
  group: auth-app-deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    permissions:
      contents: read
      checks: read
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    name: Test auth deployer
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install reviewed runtime and test dependencies for browser fixtures
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Compile deploy scripts
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m py_compile .github\scripts\timeweb_auth_postgres.py .github\scripts\timeweb_auth_app.py

      - name: Validate browser JavaScript syntax
        shell: cmd
        run: |
          where node.exe >nul 2>nul
          if errorlevel 1 (
            echo ::error::node.exe is required for browser JavaScript syntax validation.
            exit /b 1
          )
          node.exe --check web\app.js
          if errorlevel 1 exit /b 1
          node.exe --check web\workspace.js
          if errorlevel 1 exit /b 1
          node.exe --check web\i18n.js
          if errorlevel 1 exit /b 1
          node.exe tests\i18n-contract.cjs
          if errorlevel 1 exit /b 1
          node.exe --check web\sw.js

      - name: Browser workspace and demo isolation
        shell: cmd
        run: node.exe tests\frontend-smoke.cjs

      - name: Upload synthetic interface screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-screenshots
          path: |
            artifacts/frontend/*.png
            artifacts/frontend/failure-state.json
            artifacts/frontend/layout-metrics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run deployer tests
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_ssh_trust.py
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_auth_app.py

      - name: Verify auth page markers
        shell: cmd
        run: >-
          "%OMNICIO_PYTHON%" -c "from pathlib import Path; text=Path('web/index.html').read_text(encoding='utf-8'); assert 'name=\"omni-cio-white-site\"' in text; assert r'\n' not in text"

      - name: Report source-specific Sonar diagnostics
        if: always()
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/report_sonar_annotations.py'

  deploy:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Deploy auth application
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha)
    needs: tests
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 30
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      DB_CLUSTER_NAME: omnicio-auth-postgres
      VPC_NAME: omni-cio-private
      TARGET_LOCATION: ru-3
      TARGET_ZONE: msk-1
      VKID_APP_ID: ${{ vars.VKID_APP_ID }}
      OPERATOR_USER_ID: ${{ vars.OPERATOR_USER_ID }}
      TID_CLIENT_ID: ${{ vars.TID_CLIENT_ID }}
      TID_CLIENT_SECRET: ${{ secrets.TID_CLIENT_SECRET }}
      TID_LOGIN_ENABLED: ${{ vars.TID_LOGIN_ENABLED }}
      TID_PKCE_ENABLED: ${{ vars.TID_PKCE_ENABLED }}
      ASSISTANT_BASE_URL: ${{ vars.ASSISTANT_BASE_URL }}
      ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
      ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY }}
      # External AI is activated in a later accepted release, per the owner command.
      ASSISTANT_ENABLED: "false"
      ASSISTANT_ALLOWED_ENDPOINTS: ${{ vars.ASSISTANT_ALLOWED_ENDPOINTS }}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${{ vars.ASSISTANT_DAILY_REQUEST_LIMIT }}
      # The owner requested native Web Push; user permission and a bound session
      # remain mandatory. No email delivery is activated by this release.
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATION_EMAIL_ENABLED: "false"
      NOTIFICATION_CRYPTO_KEY: ${{ secrets.NOTIFICATION_CRYPTO_KEY }}
      NOTIFICATION_VAPID_PRIVATE_KEY: ${{ secrets.NOTIFICATION_VAPID_PRIVATE_KEY }}
      NOTIFICATION_VAPID_SUBJECT: "https://omnicio.ru"
      NOTIFICATION_SMTP_HOST: ${{ vars.NOTIFICATION_SMTP_HOST }}
      NOTIFICATION_SMTP_PORT: ${{ vars.NOTIFICATION_SMTP_PORT }}
      NOTIFICATION_SMTP_USERNAME: ${{ secrets.NOTIFICATION_SMTP_USERNAME }}
      NOTIFICATION_SMTP_PASSWORD: ${{ secrets.NOTIFICATION_SMTP_PASSWORD }}
      NOTIFICATION_SMTP_SENDER: ${{ vars.NOTIFICATION_SMTP_SENDER }}
      NOTIFICATION_SMTP_MODE: ${{ vars.NOTIFICATION_SMTP_MODE }}
      OMNICIO_RESTORE_RECEIPT_KEY: ${{ secrets.OMNICIO_RESTORE_RECEIPT_KEY }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
      BILLING_TERMINAL_KEY: ${{ secrets.BILLING_TERMINAL_KEY }}
      BILLING_PASSWORD: ${{ secrets.BILLING_PASSWORD }}
      BILLING_AMOUNT_KOPECKS: ${{ vars.BILLING_AMOUNT_KOPECKS }}
      BILLING_PERIOD_DAYS: ${{ vars.BILLING_PERIOD_DAYS }}
      BILLING_OFFER_VERSION: ${{ vars.BILLING_OFFER_VERSION }}
      BILLING_DESCRIPTION: ${{ vars.BILLING_DESCRIPTION }}
      BILLING_TAXATION: ${{ vars.BILLING_TAXATION }}
      BILLING_TAX: ${{ vars.BILLING_TAX }}
      REGISTRATION_ENABLED: "true"
      REGISTRATION_MAX_USERS: "2"
      MULTIUSER_LEGAL_APPROVED: "true"
      RKN_NOTIFICATION_CONFIRMED: "false"
      CONTROLLED_LIVE_TEST_MODE: "true"
      LEGACY_PROFILE_RESET_ENABLED: "false"
      LEGAL_OPERATOR_NAME: "КЛИМАЧЕВ МИХАИЛ КОНСТАНТИНОВИЧ"
      LEGAL_OPERATOR_EMAIL: "omnicioinfo@gmail.com"
      LEGAL_PRIVACY_VERSION: "2026-10-07-v1.3.0"
      LEGAL_CONSENT_VERSION: "2026-10-07-v1.3.0"
      LEGAL_TERMS_VERSION: "2026-10-07-v1.3.0"
      SESSION_TTL_SECONDS: "34560000"
      PORTFOLIO_LIVE_EXECUTION_ENABLED: "false"
      PORTFOLIO_LIVE_MAX_ORDER_RUB: "10000"
      PORTFOLIO_LIVE_MAX_DAILY_RUB: "20000"

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Verify current main release checks
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"%OMNICIO_PYTHON%" .github\scripts\verify_main_release.py'

      - name: Validate verified SSH server key
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\timeweb_ssh_trust.py'

      - name: Validate Timeweb secret
        shell: cmd
        run: |
          @echo off
          if not defined TIMEWEB_CLOUD_TOKEN (
            echo ::error::TIMEWEB_CLOUD_TOKEN is missing
            exit /b 1
          )

      - name: Deploy accepted auth release
        id: app
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\timeweb_auth_app.py ^
            --server-name "%SERVER_NAME%" ^
            --server-comment "%SERVER_COMMENT%" ^
            --release-sha "%GITHUB_SHA%" ^
            --repository-root "%GITHUB_WORKSPACE%" ^
            --cluster-name "%DB_CLUSTER_NAME%" ^
            --vpc-name "%VPC_NAME%" ^
            --location "%TARGET_LOCATION%" ^
            --availability-zone "%TARGET_ZONE%"

      - name: Surface database gate
        if: steps.app.outputs.status == 'pending_database'
        shell: cmd
        run: echo ::warning title=Private PostgreSQL required::Auth application was not changed because the private PostgreSQL/runtime environment is not ready.

      - name: Confirm application readiness
        if: steps.app.outputs.status == 'app_ready'
        shell: cmd
        run: echo OmniCIO is healthy over HTTPS. VK ID auth is deployed with the reviewed access mode.
