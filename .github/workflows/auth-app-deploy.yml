name: Auth application deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - "uv.lock"
      - "requirements-runtime.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - "src/omnicio/**"
      - "web/**"
      - "assets/brand/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - "uv.lock"
      - "requirements-runtime.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - "src/omnicio/**"
      - "web/**"
      - "assets/brand/**"
      - "pyproject.toml"
  workflow_run:
    workflows:
      - Auth PostgreSQL
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR validation must never block a production deployment. Production-triggered
  # runs still share one lock so two releases cannot mutate the server at once.
  group: auth-app-deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    permissions:
      contents: read
      checks: read
    name: Test auth deployer
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile deploy scripts
        run: |
          python3 -m py_compile \
            .github/scripts/timeweb_auth_postgres.py \
            .github/scripts/timeweb_auth_app.py

      - name: Validate browser JavaScript syntax
        run: node --check web/app.js

      - name: Run deployer tests
        run: |
          python3 .github/scripts/test_timeweb_ssh_trust.py
          python3 .github/scripts/test_timeweb_auth_app.py

      # Temporary R7 diagnostic. Remove before merge.
      - name: Diagnose Sonar security annotations
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = "MishaGameHacking/omni-cio-gateway"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "omnicio-r7-sonar-diagnostic/1.0",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          sha = os.environ["PR_HEAD_SHA"]
          selected = None
          for _ in range(24):
              payload = get(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/check-runs"
                  "?filter=all&per_page=100"
              )
              completed = [
                  row for row in payload["check_runs"]
                  if row.get("name") == "SonarCloud Code Analysis"
                  and row.get("app", {}).get("id") == 12526
                  and row.get("status") == "completed"
              ]
              if completed:
                  selected = max(completed, key=lambda row: row["id"])
                  break
              time.sleep(5)
          if selected is None:
              raise SystemExit("Sonar check did not complete during diagnostic window")

          annotations = get(selected["output"]["annotations_url"])
          print(json.dumps({
              "check_run_id": selected["id"],
              "conclusion": selected.get("conclusion"),
              "annotations": len(annotations),
          }, sort_keys=True))
          for annotation in annotations:
              print(json.dumps({
                  "path": annotation.get("path"),
                  "start_line": annotation.get("start_line"),
                  "end_line": annotation.get("end_line"),
                  "annotation_level": annotation.get("annotation_level"),
                  "title": annotation.get("title"),
                  "message": annotation.get("message"),
              }, ensure_ascii=True, sort_keys=True))
          PY

      - name: Verify auth page markers
        run: |
          grep -F 'name="omni-cio-white-site"' web/index.html
          if grep -F '\n' web/index.html; then
            echo "::error::Auth page contains a literal escaped newline"
            exit 1
          fi

  deploy:
    permissions:
      contents: read
      actions: read
      checks: read
    name: Deploy auth application
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      SERVER_NAME: omni-cio-white-site
      SERVER_COMMENT: "Managed by GitHub Actions: timeweb-white-site"
      DB_CLUSTER_NAME: omnicio-auth-postgres
      VPC_NAME: omni-cio-private
      TARGET_LOCATION: ru-3
      TARGET_ZONE: msk-1
      VKID_APP_ID: ${{ vars.VKID_APP_ID }}
      REGISTRATION_ENABLED: "true"
      REGISTRATION_MAX_USERS: "2"
      MULTIUSER_LEGAL_APPROVED: "true"
      RKN_NOTIFICATION_CONFIRMED: "false"
      CONTROLLED_LIVE_TEST_MODE: "true"
      LEGACY_PROFILE_RESET_ENABLED: "false"
      LEGAL_OPERATOR_NAME: "КЛИМАЧЕВ МИХАИЛ КОНСТАНТИНОВИЧ"
      LEGAL_OPERATOR_EMAIL: "omnicioinfo@gmail.com"
      LEGAL_PRIVACY_VERSION: "2026-10-02-v6"
      LEGAL_CONSENT_VERSION: "2026-10-02-v6"
      LEGAL_TERMS_VERSION: "2026-10-02-v6"
      SESSION_TTL_SECONDS: "34560000"
      PORTFOLIO_LIVE_EXECUTION_ENABLED: "false"
      PORTFOLIO_LIVE_MAX_ORDER_RUB: "10000"
      PORTFOLIO_LIVE_MAX_DAILY_RUB: "20000"

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main release checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_main_release.py

      - name: Validate verified SSH server key
        run: python3 .github/scripts/timeweb_ssh_trust.py

      - name: Validate Timeweb secret
        run: |
          set -euo pipefail
          test -n "${TIMEWEB_CLOUD_TOKEN:-}" || {
            echo "::error::TIMEWEB_CLOUD_TOKEN is missing"
            exit 1
          }

      - name: Deploy accepted auth release
        id: app
        run: |
          set -euo pipefail
          python3 .github/scripts/timeweb_auth_app.py \
            --server-name "${SERVER_NAME}" \
            --server-comment "${SERVER_COMMENT}" \
            --release-sha "${GITHUB_SHA}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --cluster-name "${DB_CLUSTER_NAME}" \
            --vpc-name "${VPC_NAME}" \
            --location "${TARGET_LOCATION}" \
            --availability-zone "${TARGET_ZONE}"

      - name: Surface database gate
        if: steps.app.outputs.status == 'pending_database'
        run: |
          echo "::warning title=Private PostgreSQL required::Auth application was not changed because the private PostgreSQL/runtime environment is not ready."

      - name: Confirm application readiness
        if: steps.app.outputs.status == 'app_ready'
        run: |
          echo "OmniCIO is healthy over HTTPS. VK ID auth is deployed with the reviewed access mode."
