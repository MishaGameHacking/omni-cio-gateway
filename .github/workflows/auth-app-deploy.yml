name: Auth application deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - ".github/scripts/timeweb_http.py"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - "uv.lock"
      - "requirements-runtime.txt"
      - "requirements-dev.txt"
      - ".github/workflows/auth-app-deploy.yml"
      - ".github/workflows/auth-app-release.yml"
      - ".github/scripts/verify_main_release.py"
      - ".github/scripts/test_release_gate.py"
      - ".github/scripts/ci_evidence.py"
      - ".github/scripts/test_ci_evidence.py"
      - ".github/scripts/timeweb_auth_app.py"
      - ".github/scripts/timeweb_public_site.py"
      - ".github/scripts/test_timeweb_auth_app.py"
      - ".github/scripts/timeweb_auth_postgres.py"
      - ".github/scripts/inplace_upgrade.py"
      - ".github/scripts/timeweb_recovery.py"
      - ".github/scripts/host_recovery.py"
      - ".github/scripts/tenant_archive.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - "src/omnicio/**"
      - "web/**"
      - "tests/frontend-smoke.cjs"
      - "assets/brand/**"
      - "pyproject.toml"
  # Release verification requires tests for every exact accepted main, including Android-only updates.
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  # Replace older validation only within the same PR; isolate every main push.
  # Production mutation lives in the manual-only auth-app-release workflow.
  group: auth-app-deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    permissions:
      contents: read
      checks: read
    # Exact main push tests remain release evidence; manual deployment is a separate workflow.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    name: Test auth deployer
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    # Include both browser rounds, artifacts and bounded Sonar diagnostics.
    timeout-minutes: 12

    steps:
      - name: Checkout candidate state
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        id: python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install reviewed runtime and test dependencies for browser fixtures
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Compile deploy scripts
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m py_compile .github\scripts\inplace_upgrade.py .github\scripts\timeweb_auth_postgres.py .github\scripts\timeweb_auth_app.py

      - name: Validate browser JavaScript syntax
        shell: cmd
        run: |
          where node.exe >nul 2>nul
          if errorlevel 1 (
            echo ::error::node.exe is required for browser JavaScript syntax validation.
            exit /b 1
          )
          node.exe --check web\app.js
          if errorlevel 1 exit /b 1
          node.exe --check web\sw.js

      - name: Browser public site, releases and cache retirement
        id: browser
        shell: cmd
        run: node.exe tests\frontend-smoke.cjs

      - name: Run deployer tests
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_ssh_trust.py
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_auth_app.py

      - name: Verify auth page markers
        shell: cmd
        run: >-
          "%OMNICIO_PYTHON%" -c "from pathlib import Path; text=Path('web/index.html').read_text(encoding='utf-8'); assert 'name=\"omni-cio-white-site\"' in text; assert r'\n' not in text"

      - name: Preserve browser evidence on the self-hosted runner
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: cmd
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTCOME: ${{ steps.browser.outcome }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/ci_evidence.py frontend'

      - name: Report source-specific Sonar diagnostics
        if: github.event_name == 'pull_request' && always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/report_sonar_annotations.py'

