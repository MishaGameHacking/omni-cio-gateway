name: Check redesigned shell delivery inputs on owner laptop
on:
  push:
    branches: [codex/strategy53-delivery-tools-2026-10-29]
    paths:
      - .github/workflows/workspace-shell-tools-check.yml
      - deploy/publish_workspace_shell.py
      - deploy/test_workspace_shell.py
      - tools/prepare_workspace_shell.py
      - tools/deliver_workspace_shell.py
      - tools/check_workspace_shell_tools.py
      - tools/workspace_native.py
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: shell-tools-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            deploy
            tools
            .github/scripts/emulator_lease.py
      - name: Check transport syntax and tampered input handling using synthetic files
        shell: cmd
        working-directory: shell-tools-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'"
          if errorlevel 1 exit /b 1
          py -3 -m py_compile deploy\publish_workspace_shell.py tools\prepare_workspace_shell.py tools\deliver_workspace_shell.py tools\workspace_native.py
          if errorlevel 1 exit /b 1
          py -3 tools\check_workspace_shell_tools.py
          if errorlevel 1 exit /b 1

