name: Verify analytics54 release tools on owner laptop
on:
  push:
    branches: [codex/strategy53-delivery-tools-2026-10-29]
    paths: [.github/workflows/release54-tools-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: release54-tools-${{ github.run_id }}
          persist-credentials: false
      - name: Test rollback, immutable inputs and compatible publication
        shell: cmd
        working-directory: release54-tools-${{ github.run_id }}
        run: |
          py -3 -c "import os; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'"
          if errorlevel 1 exit /b 1
          py -3 -m unittest discover -s deploy -p test_workspace_release.py -v
          if errorlevel 1 exit /b 1
          py -3 tools/check_workspace_shell_tools.py
          if errorlevel 1 exit /b 1
