name: TEMP V10 Post-Merge Regression Verification 336

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-postmerge-regression-verification-336.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify-postmerge-regression:
    name: Verify exact-main post-merge Regression Shield
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Regression Shield for exact accepted main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 00fc692710aa9eaf02ca78ea0535b51600020768
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["EXPECTED_MAIN_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "regression-shield.yml/runs?branch=main&event=push&per_page=20"
          )
          runs = get_json(runs_url)["workflow_runs"]
          matches = sorted(
              (
                  run
                  for run in runs
                  if run["head_sha"] == expected
                  and run["event"] == "push"
                  and run["head_branch"] == "main"
              ),
              key=lambda run: run["run_number"],
              reverse=True,
          )

          if len(matches) != 1:
              raise SystemExit(f"POSTMERGE_REGRESSION_RUN_NOT_FOUND count={len(matches)}")

          run = matches[0]
          if run["status"] != "completed":
              raise SystemExit(
                  f"POSTMERGE_REGRESSION_NOT_COMPLETED run={run['id']} status={run['status']}"
              )
          if run["conclusion"] != "success":
              raise SystemExit(
                  f"POSTMERGE_REGRESSION_NOT_GREEN run={run['id']} conclusion={run['conclusion']}"
              )

          jobs = get_json(run["jobs_url"])["jobs"]
          required = (
              "Quality, contracts and coverage",
              "Dependency, code and secret security",
          )
          by_name = {job["name"]: job for job in jobs}

          for name in required:
              job = by_name.get(name)
              if job is None:
                  raise SystemExit(f"POSTMERGE_REQUIRED_JOB_NOT_FOUND name={name}")
              if job["status"] != "completed" or job["conclusion"] != "success":
                  raise SystemExit(
                      "POSTMERGE_REQUIRED_JOB_NOT_GREEN "
                      f"name={name} status={job['status']} conclusion={job['conclusion']}"
                  )

          print(
              "REGRESSION_SHIELD_EVIDENCE "
              f"run_id={run['id']} run_number={run['run_number']} "
              f"head_sha={run['head_sha']} conclusion={run['conclusion']}"
          )
          for name in required:
              print(f"REGRESSION_SHIELD_JOB name={name} conclusion={by_name[name]['conclusion']}")
          PY
