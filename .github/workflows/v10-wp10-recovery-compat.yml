name: V10 WP10 Recovery Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-recovery-compat.yml"
      - ".github/workflows/v10-wp10-recovery-audit.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-recovery-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows:
    name: Clean Windows WP10 compatibility
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify WP10 recovery contract
        shell: pwsh
        run: |
          python scripts/check_v10_wp10_recovery_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP10 PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "infrastructure\windows\rehearse_wp10_recovery.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Run WP10 deterministic tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest -q `
            tests/test_v10_wp10_recovery_contract.py `
            tests/test_v10_wp10_backup_bundle.py
