name: Verify the existing laptop Linux using live public data
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/home-runtime-wsl-live.yml, tools/home_runtime/wsl_readiness.py, tools/home_runtime/service_wsl_smoke.ps1]
permissions:
  contents: read
jobs:
  linux:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 7
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const cp=require('node:child_process'),path=require('node:path');
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong host');
            const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMPUTERNAME','PATH','USERPROFILE','PROGRAMFILES','PROGRAMDATA','LOCALAPPDATA','TEMP','TMP'].includes(k.toUpperCase())));
            const wsl=path.join(process.env.SystemRoot,'System32','wsl.exe');
            const programs={};
            for(const name of ['wsl_readiness.py','public_check.py']){
              const {data}=await github.rest.repos.getContent({...context.repo,ref:context.sha,path:'tools/home_runtime/'+name});
              programs[name]=data.content.replace(/\s+/g,'');
            }
            const run=[
              'import base64,json,time',
              "def module(data,name):",
              "    scope={'__name__':name}; exec(compile(base64.b64decode(data),'wsl-check','exec'),scope); return scope",
              "module("+JSON.stringify(programs['wsl_readiness.py'])+",'__main__')",
              "probe=module("+JSON.stringify(programs['public_check.py'])+",'issuer_reader')['main']",
              'for attempt in range(2):',
              '    result=probe()',
              "    if result.get('status')=='verified' and result.get('exact_excerpts',0)>0: break",
              "    print('HOME_LINUX_MODEL_PENDING='+json.dumps({'attempt':attempt+1,'sources':result.get('sources',[]),'excerpts':result.get('exact_excerpts')}),flush=True)",
              '    if attempt==0: time.sleep(5)',
              "print('HOME_LINUX_MODEL='+json.dumps({k:result.get(k) for k in ('status','source','published_period','exact_excerpts','seconds','trade_permission')}),flush=True)",
              "raise SystemExit(0 if result.get('status')=='verified' and result.get('exact_excerpts',0)>0 else 2)"
            ].join('\n');
            const p=cp.spawnSync(wsl,['-d','AnalystAI-Home','-u','analyst-ai','--exec','/opt/analyst-ai/venv/bin/python','-I','-'],
              {env,input:run,encoding:'utf8',windowsHide:true,timeout:290000});
            const output=(p.stdout||'').split(/\r?\n/).filter(s=>/^HOME_LINUX_(?:NOW|MODEL|MODEL_PENDING)=/.test(s));
            output.forEach(s=>core.info(s.slice(0,1650)));
            if(p.status!==0||!output.some(s=>s.startsWith('HOME_LINUX_NOW='))||!output.some(s=>s.startsWith('HOME_LINUX_MODEL=')))throw Error('Linux application or issuer analysis incomplete');
      - name: Verify the reviewed host implementation keeps the existing WSL worker alive
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const dir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'analyst-wsl-host-role-'));
            try{
              for(const n of ['service_wsl_smoke.ps1','AnalystAIHomeHost.cs']){
                const {data}=await github.rest.repos.getContent({...context.repo,ref:context.sha,path:'tools/home_runtime/'+n});
                fs.writeFileSync(path.join(dir,n),Buffer.from(data.content,'base64'),{flag:'wx'});
              }
              const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMSPEC','COMPUTERNAME','PATH','PATHEXT','TMP','TEMP','USERPROFILE','PROGRAMFILES','PROGRAMDATA','LOCALAPPDATA','PSMODULEPATH'].includes(k.toUpperCase())));
              const p=cp.spawnSync(path.join(process.env.SystemRoot,'System32','WindowsPowerShell','v1.0','powershell.exe'),
                ['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',path.join(dir,'service_wsl_smoke.ps1'),path.join(dir,'AnalystAIHomeHost.cs')],
                {env,windowsHide:true,encoding:'utf8',timeout:140000});
              const rows=(p.stdout||'').split(/\r?\n/).filter(s=>/^HOME_(?:WINDOWS_LINUX_ANCHOR|ANCHOR_ERROR)=/.test(s));
              rows.forEach(s=>core.info(s.slice(0,550)));
              if(p.status!==0||!rows.some(s=>s.startsWith('HOME_WINDOWS_LINUX_ANCHOR=')))throw Error('Windows did not verify the WSL lifetime');
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
