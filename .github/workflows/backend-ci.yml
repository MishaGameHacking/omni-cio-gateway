name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "**/*.py"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/require_clean_sonar*"
      - ".github/scripts/deploy_timeweb_backend.sh"
      - ".github/workflows/timeweb-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "**/*.py"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/require_clean_sonar*"
      - ".github/scripts/deploy_timeweb_backend.sh"
      - ".github/workflows/timeweb-backend.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Backend smoke test
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Validate deployment script
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" (
            echo ::error::Git Bash is not installed on this runner.
            exit /b 1
          )
          "C:\Program Files\Git\bin\bash.exe" -n ".github/scripts/deploy_timeweb_backend.sh"
          if errorlevel 1 exit /b 1

      - name: Create isolated Python environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\analyst-ai-backend-ci"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --no-cache-dir -r backend\requirements-dev.txt
          if errorlevel 1 exit /b 1
          echo BACKEND_CI_VENV=%VENV%>>"%GITHUB_ENV%"

      - name: Audit syntax of all tracked Python sources
        shell: cmd
        run: |
          "%BACKEND_CI_VENV%\Scripts\python.exe" .github\scripts\audit_python_sources.py
          if errorlevel 1 exit /b 1

      - name: Compile backend
        shell: cmd
        run: |
          "%BACKEND_CI_VENV%\Scripts\python.exe" -m compileall -q backend
          if errorlevel 1 exit /b 1

      - name: Run all backend unittest and pytest scenarios
        shell: cmd
        run: |
          set "TELEGRAM_CLIENT_ID=123456"
          set "TELEGRAM_CLIENT_SECRET=test-only"
          set "BACKEND_PUBLIC_URL=https://example.invalid"
          set "DATABASE_PATH=%RUNNER_TEMP%\\analyst-ai-backend-tests.sqlite3"
          set "FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          set "ANALYSIS_SCHEDULER_ENABLED=false"
          set "AI_EXTERNAL_PROCESSING_APPROVED=false"
          "%BACKEND_CI_VENV%\\Scripts\\python.exe" -m pytest backend\\tests -q
          if errorlevel 1 exit /b 1

      - name: Verify health endpoint and OpenAPI
        shell: cmd
        run: |
          set "TELEGRAM_CLIENT_ID=123456"
          set "TELEGRAM_CLIENT_SECRET=test-only"
          set "BACKEND_PUBLIC_URL=https://example.invalid"
          set "DATABASE_PATH=%RUNNER_TEMP%\analyst-ai-backend-ci.sqlite3"
          set "FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          "%BACKEND_CI_VENV%\Scripts\python.exe" -c "from fastapi.testclient import TestClient; from backend.app import app; c=TestClient(app); c.__enter__(); r=c.get('/health'); assert r.status_code == 200 and r.json() == {'status':'ok'}; spec=c.get('/openapi.json'); assert spec.status_code == 200; c.__exit__(None,None,None)"
          if errorlevel 1 exit /b 1

      - name: Read exact-head Sonar findings for remediation
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        timeout-minutes: 3
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { newestSonarCheck, assertCleanSonar } = require('./.github/scripts/require_clean_sonar.cjs');
            const { runTests } = require('./.github/scripts/require_clean_sonar.test.cjs');
            core.info('SONAR_GATE_TESTS=' + runTests());
            const ref = context.payload.pull_request.head.sha;
            let sonar = null;
            for (let attempt = 0; attempt < 24; attempt++) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref, check_name: 'SonarCloud Code Analysis', per_page: 100,
              });
              sonar = newestSonarCheck(checks, ref);
              if (sonar?.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!sonar || sonar.status !== 'completed') {
              core.setFailed('Exact-head Sonar result is not ready: quality has not been verified.');
              return;
            }
            core.info('SONAR_CHECK=' + JSON.stringify({head:ref,id:sonar.id,conclusion:sonar.conclusion}));
            const annotations = await github.paginate(github.rest.checks.listAnnotations, {
              ...context.repo, check_run_id:sonar.id, per_page:100,
            });
            for (const item of annotations) {
              core.info('SONAR_ANNOTATION=' + JSON.stringify({
                path:item.path,start_line:item.start_line,end_line:item.end_line,
                level:item.annotation_level,title:item.title,message:item.message,
              }));
            }
            core.info('SONAR_ANNOTATION_COUNT=' + annotations.length);
            assertCleanSonar(sonar, annotations, ref);
            core.info('SONAR_ZERO_ISSUES_GATE=passed');
