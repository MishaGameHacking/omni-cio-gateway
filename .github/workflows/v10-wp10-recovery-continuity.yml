name: V10 WP10 Recovery Continuity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-recovery-continuity.yml"
      - ".github/workflows/v10-wp10-recovery-compat.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-recovery-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity-windows:
    name: Lenovo portable-Python WP10 compatibility continuity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Acquire isolated CPython 3.14.6 CI package
        run: |
          $version = "3.14.6"
          $root = Join-Path $env:RUNNER_TEMP "wp10-python-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $package = Join-Path $root "python.$version.nupkg"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $indexUrl = "https://api.nuget.org/v3/registration5-gz-semver2/python/index.json"
          $index = Invoke-RestMethod -UseBasicParsing -Uri $indexUrl
          $leaf = $null
          foreach ($page in $index.items) {
            $items = $page.items
            if ($null -eq $items) {
              $pageDoc = Invoke-RestMethod -UseBasicParsing -Uri $page.'@id'
              $items = $pageDoc.items
            }
            foreach ($candidate in $items) {
              $entry = $candidate.catalogEntry
              if ($entry -is [string]) {
                $entry = Invoke-RestMethod -UseBasicParsing -Uri $entry
              }
              if ($entry.version -eq $version) {
                $leaf = $candidate
                break
              }
            }
            if ($null -ne $leaf) { break }
          }
          if ($null -eq $leaf) {
            throw "WP10_CONTINUITY_NUGET_VERSION_NOT_FOUND"
          }

          $catalogRef = $leaf.catalogEntry
          if ($catalogRef -is [string]) {
            $catalogUrl = $catalogRef
          }
          else {
            $catalogUrl = $catalogRef.'@id'
          }
          if ([string]::IsNullOrWhiteSpace($catalogUrl)) {
            throw "WP10_CONTINUITY_NUGET_CATALOG_MISSING"
          }
          $catalog = Invoke-RestMethod -UseBasicParsing -Uri $catalogUrl
          if ($catalog.id -ne "python" -or $catalog.version -ne $version) {
            throw "WP10_CONTINUITY_NUGET_CATALOG_IDENTITY_MISMATCH"
          }
          if ($catalog.packageHashAlgorithm -ne "SHA512" -or [string]::IsNullOrWhiteSpace($catalog.packageHash)) {
            throw "WP10_CONTINUITY_NUGET_HASH_METADATA_INVALID"
          }
          if ([string]::IsNullOrWhiteSpace($leaf.packageContent)) {
            throw "WP10_CONTINUITY_NUGET_CONTENT_URL_MISSING"
          }

          Invoke-WebRequest -UseBasicParsing -Uri $leaf.packageContent -OutFile $package
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          try {
            $bytes = [System.IO.File]::ReadAllBytes($package)
            $actualHash = [Convert]::ToBase64String($sha512.ComputeHash($bytes))
          }
          finally {
            $sha512.Dispose()
          }
          if ($actualHash -ne $catalog.packageHash) {
            throw "WP10_CONTINUITY_NUGET_SHA512_MISMATCH"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract = Join-Path $root "package"
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package, $extract)
          $python = Join-Path $extract "tools\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "WP10_CONTINUITY_NUGET_PYTHON_MISSING"
          }
          $actualVersion = & $python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Trim() -ne $version) {
            throw "WP10_CONTINUITY_PYTHON_VERSION_MISMATCH:$actualVersion"
          }

          "WP10_PORTABLE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WP10_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WP10 portable CI Python resolved: $version"

      - name: Prepare isolated pytest dependency target
        run: |
          $target = Join-Path $env:RUNNER_TEMP "wp10-pytest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          python -m pip install --disable-pip-version-check --no-compile --target "$target" pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WP10_PYTEST_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify WP10 recovery contract on Python 3.14.6
        run: |
          & $env:WP10_PYTHON scripts\check_v10_wp10_recovery_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP10 PowerShell with Windows PowerShell 5.1
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "WP10_CONTINUITY_WINDOWS_POWERSHELL_51_REQUIRED"
          }
          $files = @(
            "infrastructure\windows\rehearse_wp10_recovery.ps1",
            "infrastructure\windows\prepare_wp10_offdevice_target.ps1",
            "infrastructure\windows\audit_wp10_offdevice_target.ps1",
            "infrastructure\windows\complete_wp10_owner_offdevice_gate.ps1",
            "infrastructure\windows\run_wp10_owner_rehearsal.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Run WP10 deterministic compatibility tests on Python 3.14.6
        run: |
          $env:PYTHONPATH = $env:WP10_PYTEST_TARGET
          & $env:WP10_PYTHON -m pytest -q `
            tests/test_v10_wp10_recovery_contract.py `
            tests/test_v10_wp10_backup_bundle.py `
            tests/test_v10_wp10_recovery_profile.py `
            tests/test_v10_wp10_offdevice_profile.py `
            tests/test_v10_wp10_owner_gate_static.py `
            tests/test_v10_wp10_offdevice_audit_privilege_boundary.py `
            tests/test_v10_wp10_owner_rehearsal_launcher.py `
            tests/test_v10_wp10_ci_continuity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove isolated compatibility state
        if: always()
        run: |
          foreach ($path in @($env:WP10_PORTABLE_ROOT, $env:WP10_PYTEST_TARGET)) {
            if ($path -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
            if ($path -and (Test-Path -LiteralPath $path)) {
              throw "WP10_CONTINUITY_TEMP_CLEANUP_FAILED"
            }
          }

      - name: Clean self-hosted workspace
        if: always()
        shell: cmd
        run: |
          @echo off
          git reset --hard HEAD
          git clean -ffdx
