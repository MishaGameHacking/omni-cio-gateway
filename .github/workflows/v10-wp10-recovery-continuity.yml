name: V10 WP10 Recovery Continuity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-recovery-continuity.yml"
      - ".github/workflows/v10-wp10-recovery-compat.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-recovery-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity-windows:
    name: Lenovo portable-Python WP10 compatibility continuity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Acquire isolated CPython 3.14.6 CI package
        shell: cmd
        run: |
          @echo off
          set "WP10_PORTABLE_ROOT=%RUNNER_TEMP%\wp10-python-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          python scripts\fetch_v10_wp10_portable_python.py --version 3.14.6 --output-root "%WP10_PORTABLE_ROOT%"
          if errorlevel 1 exit /b %errorlevel%
          set "WP10_PYTHON=%WP10_PORTABLE_ROOT%\package\tools\python.exe"
          "%WP10_PYTHON%" -c "import platform; assert platform.python_version() == '3.14.6'"
          if errorlevel 1 exit /b %errorlevel%
          echo WP10_PORTABLE_ROOT=%WP10_PORTABLE_ROOT%>>"%GITHUB_ENV%"
          echo WP10_PYTHON=%WP10_PYTHON%>>"%GITHUB_ENV%"

      - name: Prepare isolated pytest dependency target
        shell: cmd
        run: |
          @echo off
          set "WP10_PYTEST_TARGET=%RUNNER_TEMP%\wp10-pytest-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%WP10_PYTEST_TARGET%" rmdir /s /q "%WP10_PYTEST_TARGET%"
          mkdir "%WP10_PYTEST_TARGET%"
          python -m pip install --disable-pip-version-check --no-compile --target "%WP10_PYTEST_TARGET%" pytest==9.0.2
          if errorlevel 1 exit /b %errorlevel%
          echo WP10_PYTEST_TARGET=%WP10_PYTEST_TARGET%>>"%GITHUB_ENV%"

      - name: Verify WP10 recovery contract on Python 3.14.6
        shell: cmd
        run: |
          @echo off
          "%WP10_PYTHON%" scripts\check_v10_wp10_recovery_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Parse WP10 PowerShell with Windows PowerShell 5.1
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_wp10_powershell51.ps1
          if errorlevel 1 exit /b %errorlevel%

      - name: Run WP10 deterministic compatibility tests on Python 3.14.6
        shell: cmd
        run: |
          @echo off
          set "PYTHONPATH=%WP10_PYTEST_TARGET%"
          "%WP10_PYTHON%" -m pytest -q tests\test_v10_wp10_recovery_contract.py tests\test_v10_wp10_backup_bundle.py tests\test_v10_wp10_recovery_profile.py tests\test_v10_wp10_offdevice_profile.py tests\test_v10_wp10_owner_gate_static.py tests\test_v10_wp10_offdevice_audit_privilege_boundary.py tests\test_v10_wp10_owner_rehearsal_launcher.py tests\test_v10_wp10_ci_continuity.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Remove isolated compatibility state
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP10_PORTABLE_ROOT if exist "%WP10_PORTABLE_ROOT%" rmdir /s /q "%WP10_PORTABLE_ROOT%"
          if defined WP10_PYTEST_TARGET if exist "%WP10_PYTEST_TARGET%" rmdir /s /q "%WP10_PYTEST_TARGET%"
          if defined WP10_PORTABLE_ROOT if exist "%WP10_PORTABLE_ROOT%" exit /b 1
          if defined WP10_PYTEST_TARGET if exist "%WP10_PYTEST_TARGET%" exit /b 1

      - name: Clean self-hosted workspace
        if: always()
        shell: cmd
        run: |
          @echo off
          git reset --hard HEAD
          git clean -ffdx
