name: Upgrade v3.9.0 Broker Report Reconciliation

on:
  push:
    branches:
      - v3.9.0-broker-report-reconciliation
    paths:
      - .github/workflows/upgrade-v390.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v3.9.0-broker-report-reconciliation
          fetch-depth: 0

      - name: Write v3.9.0 sources and patch stable entrypoint
        env:
          BROKER_MODULE_GZ_B64: 
          BROKER_TEST_GZ_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('broker_report_reconciliation.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['BROKER_MODULE_GZ_B64']))
          )
          Path('tests/test_broker_report_reconciliation.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['BROKER_TEST_GZ_B64']))
          )

          app_path = Path('app.py')
          app_text = app_path.read_text(encoding='utf-8')
          import_marker = 'import operations_analytics as operations_analytics_engine\n'
          import_line = 'import broker_report_reconciliation as broker_report_reconciliation_engine\n'
          if import_line not in app_text:
              app_text = app_text.replace(import_marker, import_marker + import_line)
          app_text = app_text.replace('APP_VERSION = "3.8.0"', 'APP_VERSION = "3.9.0"', 1)
          app_text = app_text.replace(
              'v3.8.0 adds executed-only operations analytics with pagination diagnostics, '
              'currency-local cash-flow reconciliation, and duplicate protection.',
              'v3.9.0 adds asynchronous official broker-report generation, paginated '
              'report loading, and currency-local trade and commission reconciliation.',
          )
          register_call = (
              '\nbroker_report_reconciliation_engine.register_gateway(\n'
              '    app=app,\n'
              '    base=base,\n'
              '    app_version=APP_VERSION,\n'
              ')\n'
          )
          marker = '\napp.openapi_schema = None\n'
          if register_call not in app_text:
              app_text = app_text.replace(marker, register_call + marker)
          app_path.write_text(app_text, encoding='utf-8')

          test_path = Path('tests/test_regression_shield.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('EXPECTED_VERSION = "3.8.0"', 'EXPECTED_VERSION = "3.9.0"')
          action_line = '    "/operations/analytics": "getOperationsAnalytics",\n'
          new_action_line = '    "/operations/broker-report-reconciliation": "getBrokerReportReconciliation",\n'
          if new_action_line not in test_text:
              test_text = test_text.replace(action_line, action_line + new_action_line)
          protected_line = '    "/operations/analytics?days=1",\n'
          new_protected_line = '    "/operations/broker-report-reconciliation?days=1&wait_seconds=0",\n'
          if new_protected_line not in test_text:
              test_text = test_text.replace(protected_line, protected_line + new_protected_line)
          capability_line = '    assert "operations_cash_flow_reconciliation" in capabilities\n'
          capability_add = (
              '    assert "broker_report_reconciliation" in capabilities\n'
              '    assert "broker_report_async_generation" in capabilities\n'
              '    assert "broker_report_trade_reconciliation" in capabilities\n'
          )
          if 'assert "broker_report_reconciliation" in capabilities' not in test_text:
              test_text = test_text.replace(capability_line, capability_line + capability_add)
          schema_anchor = '    assert "complete" in operations_properties\n'
          schema_add = (
              '\n    broker_schema = schema["paths"][\n'
              '        "/operations/broker-report-reconciliation"\n'
              '    ]["get"]["responses"]["200"]["content"]["application/json"]["schema"]\n'
              '    broker_properties = broker_schema["properties"]\n'
              '    assert "report_generation" in broker_properties\n'
              '    assert "broker_report_summary" in broker_properties\n'
              '    assert "trade_reconciliation" in broker_properties\n'
              '    assert "commission_reconciliation" in broker_properties\n'
              '    assert "cash_flow_reconciliation" in broker_properties\n'
              '    assert "quality" in broker_properties\n'
          )
          if 'broker_report_summary" in broker_properties' not in test_text:
              test_text = test_text.replace(schema_anchor, schema_anchor + schema_add)
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Compile patched sources
        run: python -m compileall -q app.py broker_report_reconciliation.py tests

      - name: Commit upgrade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py broker_report_reconciliation.py tests/test_broker_report_reconciliation.py tests/test_regression_shield.py
          git commit -m "Release v3.9.0 Broker Report & Operations Reconciliation"
          git push origin HEAD:v3.9.0-broker-report-reconciliation
