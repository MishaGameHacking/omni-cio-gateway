name: Publish owner55 preview after exact laptop and visual verification
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner55-shell-delivery.yml]
permissions:
  contents: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
env:
  EXPECTED_SOURCE_SHA: b69169abb4e750985ba79bf4c08f8f0f1a2ef596
  EXPECTED_TEST_RUN: '40914747142'
  EXPECTED_RUNTIME_DEPLOY_RUN: '40919271605'
  EXPECTED_RUNTIME_DEPLOY_SHA: b8ecdce47e1ecaff06190e46b1fc912687132b6b
  EXPECTED_RUNTIME_SOURCE_SHA: b69169abb4e750985ba79bf4c08f8f0f1a2ef596
  EXPECTED_RUNTIME_TEST_RUN: '40914747142'
  EXPECTED_CLIENT_ARTIFACT_SHA256: a54c6d396b198ee8696eaa1d154b20534ee6c332760a3e87ccd5ba3bc383fca4
  EXPECTED_APK_SHA256: 85fd8b63a2b0fb627d7e9211bac4453efc48dfbeb31066b25ff17878fdd02896
  EXPECTED_VISUAL_RUN: '40919273008'
  EXPECTED_VISUAL_SHA: b8ecdce47e1ecaff06190e46b1fc912687132b6b
  EXPECTED_VISUAL_ARTIFACT_SHA256: 152ba6f6ebda65c0259576db80e31d1fbc6dfabfb736e730aff01dc1b21af25e
  REVIEWED_VISUAL_ARTIFACT_SHA256: 152ba6f6ebda65c0259576db80e31d1fbc6dfabfb736e730aff01dc1b21af25e
  EXPECTED_PUBLICATION_TOOLS_SHA: ea903bbf6480b0f6984945b0ee4be992931a95ea
  EXPECTED_PUBLICATION_TOOLS_RUN: '40903420435'
jobs:
  deliver:
    permissions:
      contents: read
      actions: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_PUBLICATION_TOOLS_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          path: .source-quality
          persist-credentials: false
          sparse-checkout: .github/scripts/require_clean_sonar.cjs
          sparse-checkout-cone-mode: false
      - name: Require exact backend, Android, reviewed visual evidence and deployed runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const env=process.env, ref=env.EXPECTED_SOURCE_SHA;
            async function sourceTree(commit_sha, root) {
              const {data:commit}=await github.rest.git.getCommit({...context.repo,commit_sha});
              const {data:tree}=await github.rest.git.getTree({...context.repo,tree_sha:commit.tree.sha});
              const entry=tree.tree.find(item=>item.path===root&&item.type==='tree');
              if(!entry) throw new Error('Required source inventory missing');
              return entry.sha;
            }
            if(await sourceTree(ref,'backend')!==await sourceTree(env.EXPECTED_RUNTIME_SOURCE_SHA,'backend'))
              throw new Error('Client requires backend changes that were not deployed');
            const {data:branch}=await github.rest.git.getRef({...context.repo,ref:'heads/codex/owner-system-2026-10-29'});
            if(branch.object.sha!==ref) throw new Error('Source branch advanced before publication');
            for(const [run_id,sha,path] of [
              [Number(env.EXPECTED_TEST_RUN),ref,'.github/workflows/owner-system.yml'],
              [Number(env.EXPECTED_VISUAL_RUN),env.EXPECTED_VISUAL_SHA,'.github/workflows/owner-visual55.yml'],
              [Number(env.EXPECTED_PUBLICATION_TOOLS_RUN),env.EXPECTED_PUBLICATION_TOOLS_SHA,'.github/workflows/owner55-shell-tools.yml'],
              [Number(env.EXPECTED_RUNTIME_DEPLOY_RUN),env.EXPECTED_RUNTIME_DEPLOY_SHA,'.github/workflows/workspace-deploy.yml']]) {
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(run.status!=='completed'||run.conclusion!=='success'||run.head_sha!==sha||
                 run.path!==path||run.run_attempt!==1||run.event!=='push')
                throw new Error('Required exact verification is not successful');
            }
            const run_id=Number(env.EXPECTED_TEST_RUN);
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id,per_page:100});
            for(const name of ['verify','verify-client']) {
              const matches=jobs.filter(job=>job.name===name);
              if(matches.length!==1||matches[0].status!=='completed'||matches[0].conclusion!=='success')
                throw new Error('Exact backend and client verification required');
            }
            const {newestSonarCheck,assertCleanSonar}=require('./.source-quality/.github/scripts/require_clean_sonar.cjs');
            const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref,per_page:100});
            const sonar=newestSonarCheck(checks,ref);
            if(!sonar||sonar.status!=='completed') throw new Error('Exact source analysis not completed');
            const notes=await github.paginate(github.rest.checks.listAnnotations,{...context.repo,check_run_id:sonar.id,per_page:100});
            assertCleanSonar(sonar,notes,ref);
            if(!/^[a-f0-9]{64}$/.test(env.REVIEWED_VISUAL_ARTIFACT_SHA256)||
               env.REVIEWED_VISUAL_ARTIFACT_SHA256!==env.EXPECTED_VISUAL_ARTIFACT_SHA256)
              throw new Error('Reviewed screenshots are not bound to the visual artifact');
            async function download(run_id,name,digest,filename) {
              const items=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id,per_page:100});
              const matches=items.filter(x=>x.name===name&&!x.expired);
              if(matches.length!==1||matches[0].digest!=='sha256:'+digest) throw new Error('Artifact identity changed');
              const archive=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:matches[0].id,archive_format:'zip'});
              require('node:fs').writeFileSync(require('node:path').join(env.RUNNER_TEMP,filename),Buffer.from(archive.data));
            }
            await download(run_id,'server-version-client-'+run_id+'-1',env.EXPECTED_CLIENT_ARTIFACT_SHA256,'shell-artifact.zip');
            const visual_run=Number(env.EXPECTED_VISUAL_RUN);
            await download(visual_run,'owner55-visual-'+visual_run+'-1',env.EXPECTED_VISUAL_ARTIFACT_SHA256,'owner55-visual-artifact.zip');
      - name: Bind exact signed APK bytes and actual rendered screenshots
        run: python3 tools/prepare_owner55_shell.py
      - name: Publish to existing channel and verify every public APK byte
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/deliver_owner55_shell.py
      - name: Preserve publication and public whole-file verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owner55-shell-delivery-${{ github.run_id }}
          path: plan-reports/
          retention-days: 7
          if-no-files-found: warn
