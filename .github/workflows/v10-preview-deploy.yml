name: V10 Render Neon Synthetic Preview Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v10-preview-deploy.yml"
      - "Dockerfile.v10-preview"
      - "apps/api/hosted_preview.py"
      - "apps/web/**"
      - "infrastructure/preview/render-neon-contract.json"
      - "omni_cio/**"
      - "requirements.txt"
      - "scripts/v10_preview_deploy.py"
      - "tests/test_v10_hosted_preview.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-render-neon-synthetic-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy exact accepted main to free synthetic preview
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

    steps:
      - name: Require exact main authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${#GITHUB_SHA}" -eq 40
          test -n "$NEON_API_KEY"
          test -n "$RENDER_API_KEY"
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$RENDER_API_KEY"

      - name: Bootstrap exact accepted repository without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/exact-main"
          git checkout --detach "$GITHUB_SHA"
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Verify preview source before provider mutation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q apps/api/hosted_preview.py scripts/v10_preview_deploy.py
          python -m unittest tests.test_v10_hosted_preview

      - name: Apply free Render and Neon preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v10_preview_deploy.py \
            --apply \
            --expected-sha "$GITHUB_SHA"

      - name: Summarize exact release
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "### Exact release identity"
            echo "- branch: main"
            echo "- sha: $GITHUB_SHA"
            echo "- paid overage: forbidden"
            echo "- public multi-user: disabled"
            echo "- real trading: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
