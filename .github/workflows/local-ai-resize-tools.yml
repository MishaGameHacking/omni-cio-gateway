name: Verify local AI resource budget and private backups on owner WSL
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/local-ai-resize-tools.yml
      - deploy/pre_resize_backup.py
      - tools/resize_local_ai_host.py
      - deploy/test_local_ai_resize.py
      - tools/check_local_ai_resize.py
      - tools/inspect_infrastructure_budget.py
      - deploy/local_ai_resize_cost_fixture.json
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: budget-tools-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            deploy/pre_resize_backup.py
            tools/resize_local_ai_host.py
            deploy/test_local_ai_resize.py
            tools/check_local_ai_resize.py
            tools/inspect_infrastructure_budget.py
            deploy/local_ai_resize_cost_fixture.json
            .github/scripts/emulator_lease.py
          sparse-checkout-cone-mode: false
      - name: Verify budget constraints, fixed PATCH scope and online SQLite backup in WSL
        shell: cmd
        working-directory: budget-tools-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os,subprocess; assert os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']"
          if errorlevel 1 exit /b 1
          py -3 tools\check_local_ai_resize.py
          if errorlevel 1 exit /b 1
          git diff --exit-code
          if errorlevel 1 exit /b 1
      - name: Record exact successful diagnostic verification
        shell: py -3 {0}
        working-directory: budget-tools-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import hashlib,json,os
          from pathlib import Path
          paths=['tools/resize_local_ai_host.py','deploy/pre_resize_backup.py','deploy/test_local_ai_resize.py','tools/check_local_ai_resize.py','tools/inspect_infrastructure_budget.py','deploy/local_ai_resize_cost_fixture.json']
          result={'status':'passed','host':'LAPTOP-NPSGA016','environment':'Ubuntu-24.04 WSL','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'production_modified':False,'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          target=Path(os.environ['RUNNER_TEMP'])/('local-ai-resize-tools-'+os.environ['GITHUB_RUN_ID']+'.json')
          target.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ai-resize-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-ai-resize-tools-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 7

