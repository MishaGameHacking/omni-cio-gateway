name: Deploy verified owner system 56 to existing Timeweb runtime
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/workspace-deploy.yml
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
env:
  EXPECTED_SOURCE_SHA: a9574656fcac4507660c872ebcc22641154a3c8a
  EXPECTED_TEST_RUN: '40966175873'
  EXPECTED_ARTIFACT_SHA256: 8df19df929e002fa30228bdea48a8dbdcf5acd7ba68ed7858a3a0db7358e7cb8
  EXPECTED_BUNDLE_SHA256: 649ea9fe5a8c1882731334f11f0eb67e393414c78e529c1be7895bbe0110d7dc
  EXPECTED_TOOLS_SHA: 45ad46c7e0392b1c17131fcfd1b1dbf8418e0e1e
  EXPECTED_TOOLS_RUN: '40964343667'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout: .github/scripts/require_clean_sonar.cjs
          sparse-checkout-cone-mode: false
      - name: Require exact source quality and preserve outstanding findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {newestSonarCheck, assertCleanSonar} = require('./.github/scripts/require_clean_sonar.cjs');
            const ref = process.env.EXPECTED_SOURCE_SHA;
            for (const candidate of [ref]) {
              const checks = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref:candidate, per_page:100});
              const found = newestSonarCheck(checks, candidate);
              if (found) {
                const notes = await github.paginate(github.rest.checks.listAnnotations, {...context.repo, check_run_id:found.id, per_page:100});
                for (const note of notes) core.info('SONAR_FINDING=' + JSON.stringify({sha:candidate,path:note.path,line:note.start_line,title:note.title,message:note.message}));
              }
            }
            let sonar;
            for (let attempt=0;attempt<6;attempt++) {
              const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref,per_page:100});
              sonar=newestSonarCheck(checks,ref);
              if (sonar?.status==='completed') break;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if (!sonar || sonar.status!=='completed') throw new Error('Exact-source Sonar is not available; deployment has not been authorized by quality checks');
            const notes=await github.paginate(github.rest.checks.listAnnotations,{...context.repo,check_run_id:sonar.id,per_page:100});
            assertCleanSonar(sonar,notes,ref);
            const {data:toolsRun}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.EXPECTED_TOOLS_RUN)});
            const toolsSha=process.env.EXPECTED_TOOLS_SHA;
            if(toolsRun.status!=='completed'||toolsRun.conclusion!=='success'||toolsRun.head_sha!==toolsSha||
               toolsRun.path!=='.github/workflows/owner-system-tools55.yml'||toolsRun.run_attempt!==1)
              throw new Error('Installer tests are not bound to reviewed tools');
            for(const path of ['deploy/workspace_release.py','deploy/test_workspace_release.py','tools/prepare_workspace_transport.py']) {
              const {data:old}=await github.rest.repos.getContent({...context.repo,path,ref:toolsSha});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(old.sha!==current.sha) throw new Error('Tested installer changed: '+path);
            }
            let verified=false;
            for(let attempt=0;attempt<50;attempt++) {
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.EXPECTED_TEST_RUN)});
              if(run.head_sha!==ref||run.path!=='.github/workflows/owner-system.yml'||run.run_attempt!==1)
                throw new Error('Laptop source verification identity changed');
              if(run.status==='completed') {
                if(run.conclusion!=='success') throw new Error('Laptop source verification failed');
                verified=true;
                break;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            if(!verified) throw new Error('Exact laptop verification did not finish within bounded wait');
  deploy:
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Download only the exact successful laptop artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const run_id=Number(process.env.EXPECTED_TEST_RUN);
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
            if (run.run_attempt!==1 || run.head_sha!==process.env.EXPECTED_SOURCE_SHA || run.event!=='push' ||
                run.path!=='.github/workflows/owner-system.yml' || run.head_branch!=='codex/owner-system-2026-10-29' ||
                run.status!=='completed' || run.conclusion!=='success')
              throw new Error('Laptop verification identity changed');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id,per_page:100});
            for(const name of ['verify','verify-client']) {
              const verified=jobs.filter(job=>job.name===name);
              if(verified.length!==1 || verified[0].status!=='completed' || verified[0].conclusion!=='success')
                throw new Error('Exact laptop verification has not passed: '+name);
            }
            const items=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id,per_page:100});
            const matches=items.filter(item=>item.name==='server-runtime-'+run_id+'-1' && !item.expired);
            if (matches.length!==1 || matches[0].digest!=='sha256:'+process.env.EXPECTED_ARTIFACT_SHA256) throw new Error('Artifact identity changed');
            const archive=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:matches[0].id,archive_format:'zip'});
            require('node:fs').writeFileSync(require('node:path').join(process.env.RUNNER_TEMP,'server-runtime-artifact.zip'),Buffer.from(archive.data));
      - name: Verify bundle and prepare the existing bounded transport
        run: python3 tools/prepare_workspace_transport.py
      - name: Install the verified server modules on the existing Timeweb runtime
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/owner_plan_transport_20261027.py
      - name: Preserve deployment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-deployment-${{ github.run_id }}
          path: plan-reports/
          if-no-files-found: warn
          retention-days: 7


