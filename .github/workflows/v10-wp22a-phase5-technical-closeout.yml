name: V10 WP22A Phase 5 Technical Closeout

# Historical one-shot acceptance gate. WP22A Phase 5 is already accepted on main.
# Live status/governance/test changes are protected by permanent repository guards and
# must not replay this temporal exact-base acceptance against a later PR base.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/architecture/V10_WP22A_PHASE5_PUBLIC_HOSTED_ACCEPTANCE_CONTRACT.json"
      - "docs/architecture/V10_WP22A_PHASE5_TECHNICAL_ACCEPTANCE_EVIDENCE.json"
      - "docs/architecture/V10_WP22A_PHASE5_TECHNICAL_ACCEPTANCE_EVIDENCE.md"

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-wp22a-phase5-technical-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase5-technical-closeout:
    name: WP22A Phase 5 technical closeout gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 25
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git checkout --detach "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 20

      - name: Verify closeout evidence is bound to exact accepted base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(
              Path('docs/architecture/V10_WP22A_PHASE5_TECHNICAL_ACCEPTANCE_EVIDENCE.json')
              .read_text(encoding='utf-8')
          )
          base_sha = os.environ['PR_BASE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', base_sha):
              raise SystemExit('WP22A Phase-5 closeout PR base SHA is not canonical')
          if payload['accepted_runtime_main_binding'] != 'github.event.pull_request.base.sha':
              raise SystemExit('WP22A Phase-5 closeout lost exact PR-base binding')
          if payload['integrated_implementation']['accepted_main_sha'] != base_sha:
              raise SystemExit('WP22A Phase-5 evidence is stale relative to PR base')
          if payload['hosted_exact_release']['exact_main_sha'] != base_sha:
              raise SystemExit('WP22A hosted exact-release evidence is stale relative to PR base')
          print('WP22A_PHASE5_CLOSEOUT_BASE_BINDING=PASS')
          PY

      - name: Re-verify exact-base Regression Shield
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_v10_exact_main_regression.py

      - name: Run focused closeout contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/check_v10_documentation_consistency.py scripts/check_v10_public_product_plan.py scripts/check_v10_wp22a_phase4_public_acceptance.py tests/test_v10_wp22a_phase5_transition.py
          python scripts/check_v10_documentation_consistency.py
          python scripts/check_v10_public_product_plan.py
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q tests/test_v10_wp22a_phase5_transition.py

      - name: Probe exact public hosted technical release without secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('docs/architecture/V10_WP22A_PHASE5_TECHNICAL_ACCEPTANCE_EVIDENCE.json')
              .read_text(encoding='utf-8')
          )
          print(payload['public_preview_url'])
          PY
          )"
          python scripts/check_v10_wp22a_phase4_public_acceptance.py \
            --base-url "$BASE_URL" \
            --expected-sha "$PR_BASE_SHA" \
            --attempts 8 \
            --delay-seconds 10 \
            --timeout-seconds 20

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          fi
