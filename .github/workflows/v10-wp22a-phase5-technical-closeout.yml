# ARCHIVE-IN-PLACE historical WP22A Phase-5 technical closeout workflow.
# WP22A Phase 5 is accepted historical evidence. Amendment 18 removes the
# Render/Neon hosted preview from current V10 provider authority, so replaying
# its temporal live acceptance against later pull requests is forbidden.
name: V10 WP22A Phase 5 Technical Closeout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp22a-phase5-technical-closeout-retired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-phase5-technical-closeout:
    name: Historical Phase-5 hosted closeout is retired
    if: ${{ false }}
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Refuse retired V10 Render closeout replay
        shell: cmd
        run: |
          @echo off
          echo LEGACY_WP22A_PHASE5_RENDER_CLOSEOUT_RETIRED_AMENDMENT_18
          echo Historical evidence remains in source; no retired V10 provider probe is authorized.
          exit /b 81
