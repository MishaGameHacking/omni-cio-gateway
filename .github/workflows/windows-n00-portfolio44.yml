name: N00 candidate44 original fourteen portfolio cases after library scroll repair
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-n00-portfolio44.yml
permissions:
  contents: read
concurrency:
  group: analyst-n00-candidate44-portfolio-focused
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify the existing private return transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Create and verify one private run-owned transfer
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const helper=require(''./.github/scripts/ci_private_transfer.cjs'');

          await helper({github,context,core,command:''prepare''});

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one preflight-owned private draft is required'');

          const release=helper.owned(matches[0],identity);

          if(release.assets.length!==0) throw new Error(''Preflight draft must be empty'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.setOutput(''release_id'',String(release.id));'
  develop:
    name: Run all fourteen original portfolio cases on exact candidate44
    needs: preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 100
    permissions:
      contents: write
      checks: write
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
      original14_complete: ${{ steps.focused_report.outputs.original14_complete }}
    env:
      SOURCE_ROOT: ${{ github.workspace }}\windows-development-${{ github.run_id }}-${{ github.run_attempt }}
      ANDROID_SDK_ROOT: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      ANDROID_HOME: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 1cc05586b6874bfdd0cdb80131d178de9f95870c
        path: windows-development-${{ github.run_id }}-${{ github.run_attempt }}
        persist-credentials: false
    - name: Stage verified focused transport n00-runtime.py
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-runtime.py.b64''; p.open(''w'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-runtime.py.b64''; p.open(''a'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); b=zlib.decompress(base64.b64decode((p/''n00-runtime.py.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''b5479dcb488eed6e38a1c2dc40d21b43e6ce61aeeaed644037be169e4d0d0cb9''; (p/''n00-runtime.py'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Stage verified focused transport n00-portfolio-focused-hook.py
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-portfolio-focused-hook.py.b64'';
        p.open(''w'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); b=zlib.decompress(base64.b64decode((p/''n00-portfolio-focused-hook.py.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''ddff3bb7c57670141b9e5f0ce02994fb0d8ed7748b781776a284460614f2276e''; (p/''n00-portfolio-focused-hook.py'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Stage verified focused transport n00-successful-build-report.json
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-successful-build-report.json.b64'';
        p.open(''w'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-successful-build-report.json.b64'';
        p.open(''a'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); b=zlib.decompress(base64.b64decode((p/''n00-successful-build-report.json.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''808a43afb0585b3cf2cd9519d54c525f51be4d66fa239e3d9c4c4257d2eafd40''; (p/''n00-successful-build-report.json'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Stage verified focused transport n00-build-export-receipt.json
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-build-export-receipt.json.b64'';
        p.open(''w'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); b=zlib.decompress(base64.b64decode((p/''n00-build-export-receipt.json.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''aea3b2586adf4f62304bb66495e154c0c015b45ebbaed7dca6f04157f7ef6c43''; (p/''n00-build-export-receipt.json'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
      id: setup
    - name: Verify exact tested source44 and published baseline43
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" prepare

        if errorlevel 1 exit /b 1'
      id: prepare
    - name: Original portfolio cases at fonts100 and200 on Android37 16KB
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" 16384

        if errorlevel 1 exit /b 1'
      id: runtime16
    - name: Report focused portfolio observation separately from full matrix
      if: always() && steps.prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const identity={\"source_commit\":\"1cc05586b6874bfdd0cdb80131d178de9f95870c\",\"source_sha256\":\"e34b717fa408fbe377d910a372933c35a2ba1bdddf02263b6daa477df70f93b9\"\
          ,\"build_run_id\":40282775349,\"build_run_attempt\":1,\"build_report_sha256\":\"808a43afb0585b3cf2cd9519d54c525f51be4d66fa239e3d9c4c4257d2eafd40\"\
          };\nconst fs=require('node:fs'),p=require('node:path');\nconst folder=p.join(process.env.SOURCE_ROOT,'app/build/outputs/apk/preview/ui-screens');\n\
          const file=p.join(folder,'portfolio-focused-observations.json');\nconst source=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{diagnostic_only:true,release_gate_pass:false,error:'focused_report_missing'};\n\
          const cases=source.portfolio && Array.isArray(source.portfolio.cases)?source.portfolio.cases:[];\nconst complete=source.diagnostic_only===true\
          \ && source.release_gate_pass===false && source.portfolio_cases_complete===true && cases.length===14;\nconst report={...identity,diagnostic_only:true,release_gate_pass:false,\n\
          \  original14:{complete,required_cases:14,observed_cases:cases.length},\n  full15:{executed:false,accepted:false,required_stages:15},\n\
          \  observations:{...source,portfolio:source.portfolio?{...source.portfolio,cases:cases.map(c=>({case:c.case,font_scale:c.font_scale,checks:c.checks,screenshots:c.screenshots}))}:null}};\n\
          const state=p.join(process.env.RUNNER_TEMP,'n00-native44-focused-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);\n\
          fs.writeFileSync(p.join(state,'native44-original14-summary.json'),JSON.stringify(report,null,2)+'\\n');\ncore.setOutput('original14_complete',String(complete));\n\
          core.info('N00_ORIGINAL14_COMPLETE='+String(complete));\ncore.info('N00_FULL15_ACCEPTED=false');\nconst title=complete?'Original\
          \ 14 native cases completed; full 15-stage matrix remains pending':'Original 14 native cases incomplete; full 15-stage\
          \ matrix remains pending';\nconst fence=String.fromCharCode(96).repeat(3);\nawait github.rest.checks.create({...context.repo,name:'N00\
          \ candidate44 original14 observations (diagnostic only)',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title,summary:fence+'json\\\
          n'+JSON.stringify(report,null,2)+'\\n'+fence}});\n"
      id: focused_report
    - name: Preserve genuine UI and install evidence after either outcome
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" export

        if errorlevel 1 exit /b 1'
      if: always() && steps.prepare.outcome == 'success'
      id: export
    - name: Retain original14 native diagnostic reports and synthetic captures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: n00-candidate44-original14-native-16384
        path: '${{ runner.temp }}/n00-native44-focused-${{ github.run_id }}-${{ github.run_attempt }}/*.json

          ${{ runner.temp }}/n00-native44-focused-${{ github.run_id }}-${{ github.run_attempt }}/*.log

          ${{ runner.temp }}/n00-native44-focused-${{ github.run_id }}-${{ github.run_attempt }}/*.xml

          ${{ runner.temp }}/n00-native44-focused-${{ github.run_id }}-${{ github.run_attempt }}/*.png

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-16384/*.json

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-16384/*.log

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-16384/*.xml

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-16384/*.png

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens/**/*.json

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens/**/*.log

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens/**/*.xml

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens/**/*.png

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.json

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.log

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.xml

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.png'
        retention-days: 3
        if-no-files-found: error
    - name: Require the same empty private return draft
      id: evidence_prepare
      if: always() && steps.export.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight
          return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always() && steps.evidence_prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
  collect:
    name: Return exact Windows native evidence to Timeweb storage
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"\
        server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"\
        availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nimport re\nrun=os.environ[\"GITHUB_RUN_ID\"];attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"\
        ]\nexpected=os.environ[\"TRANSFER_SHA256\"]\nassert re.fullmatch(r\"[1-9]\\d{0,19}\",run) and re.fullmatch(r\"[1-9]\\\
        d{0,4}\",attempt)\nassert re.fullmatch(r\"[a-f0-9]{64}\",expected)\nblob=(pathlib.Path(os.environ[\"RUNNER_TEMP\"\
        ])/\"ci-handoff.zip\").read_bytes()\nassert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected\n\
        remote_script=r\"\"\"import pathlib,sys,hashlib,json,os,pwd,stat\ndata=sys.stdin.buffer.read(512*1024**2+1)\nassert\
        \ len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH\nparent=pathlib.Path('/var/lib/analyst-ai-build/incoming')\n\
        account=pwd.getpwnam('analyst-build')\nif not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)\n\
        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\n\
        destination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n\
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\n\
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows\
        \ laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\\
        n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\
        \"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"\
        FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\n\
        with_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Original14 diagnostics do not claim full15 runtime acceptance
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required runtime or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Focused portfolio\
        \ evidence collected; complete matrix acceptance remains separate.\"\n"
