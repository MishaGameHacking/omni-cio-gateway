name: V10 WP13 Concurrency Fix

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: write

concurrency:
  group: v10-wp13-concurrency-fix
  cancel-in-progress: true

jobs:
  transform:
    name: Serialize incident revisions and prove replay safety
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out WP13 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/wp13-postgresql-persistence
          persist-credentials: true

      - name: Bootstrap protected Python 3.12.10
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Apply concurrency root-cause fix
        run: python scripts\_wp13_concurrency_fix.py

      - name: Validate and commit focused fix
        run: |
          python -m compileall -q omni_cio\persistence scripts\rehearse_v10_wp13_persistence.py
          git rm .github\workflows\v10-wp13-concurrency-fix.yml scripts\_wp13_concurrency_fix.py
          git add omni_cio\persistence\repository.py scripts\rehearse_v10_wp13_persistence.py
          git diff --cached --check
          python -c "import subprocess; changed=sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()); expected=sorted(['.github/workflows/v10-wp13-concurrency-fix.yml','scripts/_wp13_concurrency_fix.py','omni_cio/persistence/repository.py','scripts/rehearse_v10_wp13_persistence.py']); assert changed == expected, (changed, expected)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V10 WP13: serialize concurrent incident revisions"
          git push origin HEAD:v10/wp13-postgresql-persistence
