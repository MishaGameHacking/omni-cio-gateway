name: Wire local companion text routes on owner Lenovo
on:
  push:
    branches: [codex/jarvis-runtime-access-2026-11-01]
    paths: [.github/workflows/jarvis-companion-wiring.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Derive immutable repository source blobs, not installed runtime files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('wrong_host');
            const base='1d642ef71503e17c8ff367ae17c0d97b5cfc1dab';
            const append='\n\n# General companion conversation has session/device authority, not broker authority.\nif __package__:\n    from . import companion_chat\nelse:\n    import companion_chat\ncompanion_chat.install_routes(app, connect, FERNET, current_user, lambda: os.environ)\n';
            const patches=[
              {path:'backend/app.py',expected:'a68eef110e6efbfb521316ec84244b46801c997a',append},
              {path:'.github/scripts/jarvis_policy_ci.py',edits:[["    'backend/tests/test_agent_status_transport.py',\n","    'backend/tests/test_agent_status_transport.py',\n    'backend/tests/test_companion_chat.py',\n"]]},
              {path:'backend/companion_chat.py',edits:[
                ['ORDER BY created_at DESC,id DESC LIMIT 6','ORDER BY rowid DESC LIMIT 6'],
                ['ORDER BY t.created_at,t.id LIMIT ?','ORDER BY t.rowid LIMIT ?']
              ]}
            ];
            for(const patch of patches){
              const {data}=await github.rest.repos.getContent({...context.repo,path:patch.path,ref:base});
              if(data.type!=='file'||data.encoding!=='base64'||(patch.expected&&patch.expected!==data.sha))throw Error('source_identity');
              let text=Buffer.from(data.content,'base64').toString('utf8');
              if(patch.append){if(text.includes('companion_chat.install_routes'))throw Error('already_wired');text+=patch.append;}
              for(const [before,after] of patch.edits||[]){if(text.split(before).length!==2)throw Error('nonunique_anchor');text=text.replace(before,after);}
              const {data:blob}=await github.rest.git.createBlob({...context.repo,content:text,encoding:'utf-8'});
              core.info('COMPANION_SOURCE_BLOB='+JSON.stringify({path:patch.path,base_blob:data.sha,sha:blob.sha}));
            }
