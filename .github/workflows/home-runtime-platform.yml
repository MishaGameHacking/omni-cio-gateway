name: Install the isolated home research distribution
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/home-runtime-platform.yml, tools/home_runtime/platform.py]
permissions:
  contents: read
concurrency:
  group: analyst-home-runtime-install
  cancel-in-progress: false
jobs:
  platform:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 2
          script: |
            const cp=require('node:child_process');
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong host');
            const {data}=await github.rest.repos.getContent({...context.repo,path:'tools/home_runtime/platform.py',ref:context.sha});
            const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMSPEC','COMPUTERNAME','PATH','PATHEXT','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','PUBLIC','USERNAME','USERDOMAIN'].includes(k.toUpperCase())));
            env.PYTHONUTF8='1';
            const r=cp.spawnSync('py.exe',['-3','-I','-'],{input:Buffer.from(data.content,'base64'),encoding:'utf8',env,timeout:1750000,maxBuffer:250000,windowsHide:true});
            let row;
            try{row=JSON.parse(r.stdout.trim());}catch{throw Error('Home installer process unavailable: '+(r.error?.code||r.status));}
            if(row.status==='ready')core.info('HOME_PLATFORM_READY='+JSON.stringify({status:row.status,scope:row.scope,source_image:row.source_image,image_sha256:row.image_sha256,pid1:row.linux.pid1,windows_drive_mounted:row.linux.windows_drive_mounted}));
            else core.setFailed('HOME_PLATFORM_BLOCKED='+String(row.reason).replace(/[^A-Za-z0-9_./+-]/g,'').slice(0,145));
