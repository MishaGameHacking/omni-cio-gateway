name: Auth PostgreSQL restore drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-restore:
    name: Verify isolated logical restore
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    concurrency:
      group: omnicio-production-ssh
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TIMEWEB_SSH_KNOWN_HOSTS: ${{ vars.TIMEWEB_SSH_KNOWN_HOSTS }}
      OMNICIO_RESTORE_DRILL_ALLOWED: "true"
      DB_INSTANCE_NAME: omnicio

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install hash-pinned runtime and accepted project
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Verify encrypted recovery on the existing Timeweb host
        shell: cmd
        run: '"%OMNICIO_PYTHON%" .github\scripts\run_recovery_drill.py --on-host'
