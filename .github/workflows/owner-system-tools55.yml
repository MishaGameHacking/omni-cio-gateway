name: Verify owner system 55 delivery tools on laptop
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/owner-system-tools55.yml
      - deploy/workspace_release.py
      - deploy/test_workspace_release.py
      - tools/prepare_workspace_transport.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: owner-system-tools55-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            deploy
            tools/prepare_workspace_transport.py
          sparse-checkout-cone-mode: false
      - name: Verify replacement, auth migration race and rollback on laptop
        shell: cmd
        working-directory: owner-system-tools55-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os,subprocess; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['GITHUB_SHA']"
          if errorlevel 1 exit /b 1
          py -3 -m py_compile deploy\workspace_release.py tools\prepare_workspace_transport.py
          if errorlevel 1 exit /b 1
          py -3 deploy\test_workspace_release.py -v
          if errorlevel 1 exit /b 1
          git diff --exit-code
          if errorlevel 1 exit /b 1
      - name: Write exact tested source receipt
        shell: py -3 {0}
        working-directory: owner-system-tools55-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          paths = ['deploy/workspace_release.py', 'deploy/test_workspace_release.py', 'tools/prepare_workspace_transport.py']
          receipt = {'status': 'passed', 'host': 'LAPTOP-NPSGA016', 'source_commit': commit,
                     'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'synthetic_tests_only': True, 'production_modified': False,
                     'sha256': {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}}
          target = Path(os.environ['RUNNER_TEMP']) / ('owner-system-tools55-' + os.environ['GITHUB_RUN_ID'] + '.json')
          target.write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owner-system-tools55-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-system-tools55-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 7
