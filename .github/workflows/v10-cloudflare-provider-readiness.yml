name: V10 Cloudflare Provider Readiness

on:
  push:
    branches:
      - system/cloudflare-public-product
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-cloudflare-provider-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-readiness:
    name: Cloudflare provider authority and build-path readiness
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_SECRET_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID_VAR_VALUE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY_VALUE: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID_VALUE: ${{ vars.NEON_ORG_ID }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact pushed head without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Probe provider authority without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          readiness=0
          if [ -n "${CLOUDFLARE_API_TOKEN_VALUE:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=AVAILABLE"
          else
            echo "CLOUDFLARE_API_TOKEN=MISSING"
            readiness=1
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID_SECRET_VALUE:-}" ] || [ -n "${CLOUDFLARE_ACCOUNT_ID_VAR_VALUE:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=AVAILABLE"
          else
            echo "CLOUDFLARE_ACCOUNT_ID=MISSING"
            readiness=1
          fi
          if [ -n "${NEON_API_KEY_VALUE:-}" ]; then
            echo "NEON_API_KEY=AVAILABLE"
          else
            echo "NEON_API_KEY=MISSING"
            readiness=1
          fi
          if [ -n "${NEON_ORG_ID_VALUE:-}" ]; then
            echo "NEON_ORG_ID=AVAILABLE"
          else
            echo "NEON_ORG_ID=MISSING"
            readiness=1
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "CLOUDFLARE_CONTAINER_ENGINE=AVAILABLE"
            echo "CLOUDFLARE_DEPLOY_PATH=DIRECT_WRANGLER_AVAILABLE"
          else
            echo "CLOUDFLARE_CONTAINER_ENGINE=MISSING_OR_NOT_RUNNING"
            echo "CLOUDFLARE_DEPLOY_PATH=WORKERS_BUILDS"
          fi
          if [ "$readiness" -ne 0 ]; then
            echo "CLOUDFLARE_CF_C_PROVIDER_READINESS=BLOCKED"
            exit 78
          fi
          echo "CLOUDFLARE_CF_C_PROVIDER_READINESS=READY"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
