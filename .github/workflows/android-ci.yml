name: Android CI
'on':
  workflow_call:
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  transfer-preflight:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      id: checkout
      with:
        persist-credentials: false
    - name: Test private handoff boundaries without credentials
      run: |
        node --test .github/scripts/ci_private_transfer.test.cjs .github/scripts/require_main_release.test.cjs
        python3 -m unittest discover -s tools/tests -p 'test_*.py'
    - name: Verify synthetic draft handoff and unauthenticated denial
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'prepare'});
    - name: Remove the temporary draft immediately if preparation fails
      if: failure() && steps.checkout.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    name: Verify private CI handoff before building
  build:
    name: Build with the existing signing identity
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    permissions:
      contents: write
      checks: read
      actions: read
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    outputs:
      archive_sha256: ${{ steps.transfer.outputs.archive_sha256 }}
    steps:
    - name: Checkout source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Prepare canonical 3D catalogue before packaging
      shell: cmd
      run: |
        py -3 tools\prepare_spectrum_checkout.py
        if errorlevel 1 exit /b 1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify pinned Gradle wrapper
      shell: cmd
      run: |
        certutil -hashfile gradle\wrapper\gradle-wrapper.jar SHA256 > "%RUNNER_TEMP%\gradle-wrapper.sha256"
        if errorlevel 1 exit /b 1
        findstr /I /C:"238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5" "%RUNNER_TEMP%\gradle-wrapper.sha256" >nul
        if errorlevel 1 exit /b 1
        call gradlew.bat --version
        if errorlevel 1 exit /b 1
    - name: Choose Android SDK root
      shell: cmd
      run: |
        set "SDK_ROOT=%ANDROID_SDK_ROOT%"
        if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
        if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
        if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
        echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
        echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"
    - name: Ensure Android SDK 37 is installed
      shell: cmd
      run: |
        py -3 .github\scripts\prepare_android_sdk.py --sdk "%ANDROID_SDK_ROOT%"
        if errorlevel 1 exit /b 1
    - name: Test APK verification rules
      shell: cmd
      run: |
        py -3 -m unittest discover -s .github\scripts\tests -p "test_*.py" -v
        if errorlevel 1 exit /b 1
    - name: Report exact-head Sonar findings for remediation
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        retries: 3
        script: |
          const { newestSonarCheck, assertCleanSonar } = require('./.github/scripts/require_clean_sonar.cjs');
          const ref = context.payload.pull_request?.head?.sha || context.sha;
          let sonar = null;
          for (let attempt = 0; attempt < 18; attempt++) {
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref, check_name: 'SonarCloud Code Analysis', per_page: 100,
            });
            sonar = newestSonarCheck(checks, ref);
            if (sonar?.status === 'completed') break;
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!sonar || sonar.status !== 'completed') {
            core.setFailed('Exact-head Sonar result is not ready: quality has not been verified.');
            return;
          }
          core.info('SONAR_CHECK=' + JSON.stringify({head:ref,id:sonar.id,conclusion:sonar.conclusion}));
          const annotations = await github.paginate(github.rest.checks.listAnnotations, {
            ...context.repo, check_run_id: sonar.id, per_page: 100,
          });
          for (const item of annotations) {
            core.warning('SONAR_ANNOTATION ' + JSON.stringify({path:item.path,start_line:item.start_line,end_line:item.end_line,level:item.annotation_level,title:item.title,message:item.message}));
          }
          core.info('SONAR_ANNOTATION_COUNT=' + annotations.length);
          assertCleanSonar(sonar, annotations, ref);
    - name: Lint and build all Android variants
      shell: cmd
      run: |
        call gradlew.bat :app:testDebugUnitTest :app:lintDebug :app:lintPreview :app:assembleDebug :app:assembleRelease :app:assemblePreview :ci-ui-driver:lintDebug :ci-ui-driver:assembleDebug --stacktrace
        if errorlevel 1 exit /b 1
    - name: Download installed 0.10.0 APK for exact upgrade compatibility test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag:'android-preview-0a894dddfa858efe6c7be60aea78935adec84c1b'})).data;
          const asset = release.assets.find(a => a.name === 'Analyst-AI-0.10.0-preview-0a894dd.apk');
          if (!asset) throw new Error('0.10.0 reference APK missing');
          const response = await github.rest.repos.getReleaseAsset({...context.repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
          const bytes = Buffer.from(response.data);
          if (crypto.createHash('sha256').update(bytes).digest('hex') !== '3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3') throw new Error('0.10.0 reference APK checksum mismatch');
          const dest = path.join(process.env.RUNNER_TEMP, `previous-apk-${context.runId}.apk`);
          fs.writeFileSync(dest, bytes);
          core.exportVariable('PREVIOUS_APK', dest);
    - name: Release only this checkout's reproducible build intermediates
      if: always() && steps.checkout.outcome == 'success'
      shell: cmd
      run: |
        py -3 .github\scripts\release_build_intermediates.py --allow-incomplete-build
        if errorlevel 1 exit /b 1
    - name: Test private CI transport boundaries
      shell: cmd
      run: |
        node --test .github\scripts\ci_private_transfer.test.cjs
        if errorlevel 1 exit /b 1
    - name: Pack only the four signed CI inputs with exact source hashes
      shell: cmd
      run: |
        py -3 tools\ci_apk_archive.py pack
        if errorlevel 1 exit /b 1
    - name: Transfer signed inputs through a private temporary GitHub draft
      id: transfer
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'upload'});
    needs:
    - transfer-preflight
    concurrency:
      group: analyst-android-pr-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
  runtime:
    name: Verify the exact APK on free Linux / API 37 / 16 KB and 4 KB
    needs:
    - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
      actions: read
    timeout-minutes: 70
    env:
      RUN_PROFILE_UI_TESTS: '1'
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
    - name: Checkout the same source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Enable this ephemeral runner user to use KVM
      run: |
        sudo chown "$(id -u):$(id -g)" /dev/kvm
        python3 tools/ci_host_capacity.py
    - name: Download and verify the private signed CI inputs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Verify exact source and per-file hashes before unpacking
      run: python3 tools/ci_apk_archive.py unpack
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install checksum-pinned official Linux Android tools
      run: |
        archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
        curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' --output "$archive"
        echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check -
        mkdir -p "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
        unzip -q "$archive" -d "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
        mv "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/latest"
        echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
    - name: Install and verify release API 37 packages and both page-size images
      run: |
        python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT"
        python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT" --runtime
        "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
    - name: Prepare headless Mesa Vulkan for the unchanged 3D renderer
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools libgl1
        python3 - <<'PYCODE'
        from pathlib import Path
        import os
        paths = list(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))
        if len(paths) != 1:
            raise SystemExit("Exactly one Mesa Lavapipe Vulkan ICD is required")
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("VK_ICD_FILENAMES=" + str(paths[0]) + "\n")
        PYCODE
    - name: Verify native 3D assets and the signed preview using official Android tools
      run: |
        python3 tools/prepare_spectrum_checkout.py
        python3 tools/test_native_alignment.py
        python3 tools/generate_spectrum_meshes.py --check --check-apk
        python3 tools/test_spectrum_meshes.py
        apk_dir="$GITHUB_WORKSPACE/app/build/outputs/apk/preview"
        build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
        java -jar "$build_tools/lib/apksigner.jar" verify --verbose --print-certs "$apk_dir/app-preview.apk" > "$apk_dir/signature.txt"
        "$build_tools/zipalign" -c -P 16 -v 4 "$apk_dir/app-preview.apk" > "$apk_dir/alignment.txt"
        "$build_tools/aapt" dump badging "$apk_dir/app-preview.apk" > "$apk_dir/badging.txt"
        "$build_tools/aapt" dump xmltree "$apk_dir/app-preview.apk" AndroidManifest.xml > "$apk_dir/manifest.txt"
        python3 .github/scripts/verify_apk.py
    - name: Verify clean install, upgrade, launch and full 3D UI at API 37 / 16 KB
      run: |
        xvfb-run --auto-servernum python3 .github/scripts/test_apk_installation.py --sdk "$ANDROID_SDK_ROOT" --apk app/build/outputs/apk/preview/app-preview.apk --previous "$PREVIOUS_APK" --api 37 --page-bytes 16384 --work-dir app/build/outputs/apk/preview/install-api37-16384
        python3 -c "import shutil; shutil.copytree('app/build/outputs/apk/preview/ui-screens', 'app/build/outputs/apk/preview/ui-screens-api37-16384', dirs_exist_ok=True)"
    - name: Verify clean install, upgrade, launch and full 3D UI at API 37 / 4 KB
      run: |
        xvfb-run --auto-servernum python3 .github/scripts/test_apk_installation.py --sdk "$ANDROID_SDK_ROOT" --apk app/build/outputs/apk/preview/app-preview.apk --previous "$PREVIOUS_APK" --api 37 --page-bytes 4096 --work-dir app/build/outputs/apk/preview/install-api37-4096
        python3 .github/scripts/validate_distribution.py
    - name: Record synthetic UI evidence and reports
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          const base = path.join(root, 'app/build/outputs/apk/preview');
          const shots = ['failure', 'workspace-ux100', 'ux100-chart', 'bars-selected', 'bars-large-font', 'ux100-impact', 'workspace-appearance', 'workspace-strategy', 'workspace-assistant', 'workspace-market', 'workspace-ratings', 'spectrum-home', 'spectrum-portfolio', 'spectrum-allocation', 'light-initial', 'dark-selected', 'dark-restored', 'light-selected', 'system-dark', 'system-light', 'security', 'info', 'about', 'education', 'large-font', 'education-large-font'];
          const spatialShots = ['spatial-dark', 'spatial-shadow-reference', 'spatial-light', 'spatial-dialog', 'spatial-bars', 'spatial-candles', 'spatial-ring', 'spatial-selected', 'spatial-clipping', 'spatial-long-scroll', 'spatial-rotation-before', 'spatial-rotation-ready', 'spatial-rotation', 'spatial-large-font', 'spatial-dialog-large-font', 'spatial-system-motion-off', 'spatial-thermal-moderate', 'spatial-predictive-back-progress', 'spatial-predictive-back-cancelled', 'business-assistant-draft-rotation', 'business-assistant-draft-rotation-font-200', 'business-assistant-impact', 'business-assistant-impact-font-200', 'business-risk-scenario-rotation', 'business-risk-scenario-rotation-font-200', 'business-risk-scenarios', 'business-risk-scenarios-font-200', 'business-strategy-draft-rotation', 'business-strategy-draft-rotation-font-200', 'balance-private-first', 'balance-private-second', 'balance-private-first-font-200', 'balance-private-second-font-200', 'portfolio-quick-long-press', 'portfolio-quick-button', 'goal-draft-rotation', 'goal-draft-rotation-font-200', 'goal-pending-rotation', 'goal-pending-rotation-font-200', 'goal-recovered', 'goal-recovered-font-200'];
          const businessShots = ['risk', 'assistant', 'plans', 'strategy', 'notifications', 'analysis', 'catalogue'].flatMap(route =>
            ['ready', 'empty', 'partial', 'error', 'job'].filter(state => state !== 'job' || ['assistant', 'plans'].includes(route)).flatMap(state =>
              ['', '-font-200'].map(suffix => `business-${route}-${state}${suffix}`)));
          const portfolioCases = [['discovery', 'ready'], ['dossier', 'ready'], ['history', 'ready'], ['history', 'partial'],
            ['quotes', 'ready'], ['markets', 'ready'], ['appearance', 'ready']];
          const portfolioShots = portfolioCases.flatMap(([route, state]) =>
            ['', '-font-200'].map(suffix => `portfolio-${route}-${state}${suffix}`));
          const portfolioSteps = {
            discovery: ['common-period', 'comparison', 'archive', 'watch-dossier'],
            dossier: ['scheduled-report', 'published-report', 'primary-source', 'selected-holding', 'event-draft'],
            history: ['exact-observation', 'missing-observation', 'range'],
            quotes: ['exact-ohlc', 'stale-week', 'magnifier'],
            markets: ['session-midnight', 'geography'],
            appearance: ['applied', 'restored', 'preview-rotation']
          };
          const portfolioStepShots = Object.entries(portfolioSteps).flatMap(([route, stages]) =>
            stages.flatMap(stage => ['', '-font-200'].map(suffix => `portfolio-${route}-${stage}${suffix}`)));
          const contextShots = ['session-context-restored', 'session-context-restored-font-200', 'session-context-signed-out-rotation', 'session-context-signed-out-rotation-font-200'];
          const allShots = [...contextShots, ...shots, ...spatialShots, ...businessShots, ...portfolioShots, ...portfolioStepShots];
          const names = ['apk-verification.json', 'install-api37-16384/install-results.json', 'install-api37-4096/install-results.json',
            ...['ui-screens-api37-16384', 'ui-screens'].flatMap(folder => [
              `${folder}/session-context-verification.json`, `${folder}/balance-privacy-verification.json`, `${folder}/position-preview-verification.json`, `${folder}/goal-workflow-verification.json`, `${folder}/spatial-verification.json`, `${folder}/business-verification.json`, `${folder}/portfolio-verification.json`,
              ...allShots.map(name => `${folder}/${name}.png`)])];
          const records = [];
          for (const name of names) {
            const file = path.join(base, name);
            if (!fs.existsSync(file)) continue;
            if (fs.lstatSync(file).isSymbolicLink() || !fs.realpathSync(file).startsWith(root + path.sep)) throw new Error('Evidence outside checkout');
            const bytes = fs.readFileSync(file);
            if (bytes.length > 2097152) throw new Error('Evidence file unexpectedly large');
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (name.endsWith('.json')) {
              core.info(`VERIFICATION_REPORT ${name} ${JSON.stringify(JSON.parse(bytes.toString('utf8')))}`);
            }
            const blob = (await github.rest.git.createBlob({...context.repo, encoding:'base64', content:bytes.toString('base64')})).data;
            let preview_base64_blob_sha = null;
            if (name.endsWith('.png')) {
              const preview = (await github.rest.git.createBlob({...context.repo, encoding:'utf-8', content:bytes.toString('base64')})).data;
              preview_base64_blob_sha = preview.sha;
            }
            records.push({name, blob_sha:blob.sha, preview_base64_blob_sha, sha256, bytes:bytes.length});
          }
          core.info('VERIFICATION_EVIDENCE=' + JSON.stringify({head:context.payload.pull_request?.head?.sha || context.sha, run:context.runId, records}));
          await core.summary.addHeading('Android verification evidence').addCodeBlock(JSON.stringify(records, null, 2), 'json').write();
    - name: Upload optional synthetic Spectrum screenshots
      if: always() && vars.RETAIN_DUPLICATE_UI_ARTIFACTS == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: spectrum-ui-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          app/build/outputs/apk/preview/ui-screens/*.png
          app/build/outputs/apk/preview/ui-screens/*.json
          app/build/outputs/apk/preview/ui-screens-api37-16384/*.png
          app/build/outputs/apk/preview/ui-screens-api37-16384/*.json
        if-no-files-found: warn
        retention-days: 1
        compression-level: 0
    - name: Assert verified APK and evidence are present
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        base = Path('app/build/outputs/apk/preview')
        required = ['app-preview.apk', 'apk-verification.json', 'install-api37-16384/install-results.json', 'install-api37-4096/install-results.json']
        if any(not (base / name).is_file() for name in required) or not list((base / 'ui-screens').glob('*.png')):
            raise RuntimeError('Verified APK or required runtime evidence is missing')
        PYCODE

    - name: Verify explicit release quality before sharing any APK
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          const quality = await require('./.github/scripts/require_main_release.cjs')({github, context});
          core.info('MAIN_RELEASE_QUALITY=' + JSON.stringify(quality));
          const fs = require('fs');
          const crypto = require('crypto');
          const base = 'app/build/outputs/apk/preview/';
          const report = JSON.parse(fs.readFileSync(base + 'apk-verification.json', 'utf8'));
          const bytes = fs.readFileSync(base + 'app-preview.apk');
          if (!Number.isSafeInteger(report.version_code) || report.version_code <= 34 ||
              report.device_install_test !== 'passed_on_emulators_not_a_physical_phone' ||
              crypto.createHash('sha256').update(bytes).digest('hex') !== report.sha256) {
            throw new Error('Unverified or previously published APK identity cannot be shared');
          }
          await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    - name: Retain APK and verification evidence when storage is available
      id: retain_apk
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Analyst-AI-${{ github.sha }}
        path: |
          app/build/outputs/apk/preview/app-preview.apk
          app/build/outputs/apk/preview/apk-verification.json
          app/build/outputs/apk/preview/install-api37-4096/install-results.json
          app/build/outputs/apk/preview/install-api37-16384/install-results.json
          app/build/outputs/apk/preview/ui-screens/*.png
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

    - name: Report unavailable optional Actions retention
      if: steps.retain_apk.outcome == 'failure'
      run: |
        echo ::warning::Verified APK retention in GitHub Actions storage failed, usually because the repository artifact quota is full. Build, installation, UI, and release-integrity gates remain authoritative.


    - name: Publish verified APK to GitHub Releases
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ github.token }}
        script: |
          const quality = await require('./.github/scripts/require_main_release.cjs')({github, context});
          core.info('MAIN_RELEASE_QUALITY=' + JSON.stringify(quality));
          await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
          const fs = require('fs');
          const crypto = require('crypto');
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const sha = context.sha;
          const reportPath = 'app/build/outputs/apk/preview/apk-verification.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          // Code 34 belongs to the installed 0.10.0 preview. Changed bytes must use a newer code.
          if (!Number.isSafeInteger(report.version_code) || report.version_code <= 34) {
            throw new Error('A new versionCode is required before publishing changed APK bytes');
          }
          const data = fs.readFileSync('app/build/outputs/apk/preview/app-preview.apk');
          const hash = crypto.createHash('sha256').update(data).digest('hex');
          if (hash !== report.sha256 || report.device_install_test !== 'passed_on_emulators_not_a_physical_phone') {
            throw new Error('APK was not fully validated or changed after validation');
          }
          const version = report.version_name;
          const tag = `android-preview-${sha}`;
          const assetName = `Analyst-AI-${version}-${sha.slice(0, 7)}.apk`;
          const title = `Analyst AI ${version}`;
          const sourceDocs = `https://github.com/${owner}/${repo}/blob/${sha}/docs`;
          const releaseNotes = ['3D100.md', '3D100_EVIDENCE.md', 'PLAN_STATUS.md'].reduce(
            (text, file) => text.replaceAll(`(../${file})`, `(${sourceDocs}/${file})`),
            fs.readFileSync('docs/releases/0.11.0.md', 'utf8').trim());
          if (!releaseNotes.includes('0.11.0') || !releaseNotes.includes('3D100')) throw new Error('Release notes do not identify this update');
          const body = [
            releaseNotes,
            'Signed, non-debuggable preview APK. Android 17+; application ID ru.omnicio.app.debug.',
            'Uses the existing test signing key, not a production-store signing key.',
            'APK signature, ZIP/ELF alignment, DEX integrity, clean installation and launch, upgrade from 0.10.0 / 34 and post-upgrade launch were verified on Android 17/API 37 x86_64 emulators with measured getconf PAGE_SIZE values of 16384 and 4096 bytes.',
            'The spectrum-3d-100-v2 UI receipt contains 60 business and 14 portfolio case/font IDs per page-size profile, alongside the native-rendering checks. Production UI components were exercised in a separate debug APK with synthetic data.',
            'The attached apk-verification.json binds both emulator results to this preview APK SHA-256 and each UI receipt to the exact installed debug APK SHA-256 and case/font IDs.',
            'These emulator checks do not verify a physical phone, physical ARM hardware with 16 KB pages, TalkBack gestures, heat, battery use, live broker or paid-model access, or installation through the in-app updater.',
            `Source commit: ${sha}`,
            `SHA-256: ${hash}`,
            `Signing certificate SHA-256: ${report.certificate_sha256}`,
          ].join('\n\n');
          const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page:100});
          let release = releases.find(r => r.tag_name === tag);
          if (!release) {
            release = (await github.rest.repos.createRelease({owner, repo, tag_name:tag, target_commitish:sha, name:title, body, draft:true, prerelease:true, make_latest:'false'})).data;
          }
          if (!release.draft) {
            if (!release.assets.some(a => a.name === assetName)) throw new Error('Immutable release missing APK');
            core.notice(`APK already published: ${release.html_url}`);
            return;
          }
          const files = [[assetName, data, 'application/vnd.android.package-archive'], ['apk-verification.json', fs.readFileSync(reportPath), 'application/json']];
          for (const [name, bytes, type] of files) {
            for (const asset of release.assets.filter(a => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id:asset.id});
            }
            const asset = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data:bytes, headers:{'content-type':type,'content-length':bytes.length}})).data;
            const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
            const received = Buffer.from(downloaded.data);
            if (received.length !== bytes.length || !crypto.createHash('sha256').update(received).digest().equals(crypto.createHash('sha256').update(bytes).digest())) {
              throw new Error('Release upload read-back integrity mismatch');
            }
          }
          release = (await github.rest.repos.updateRelease({owner, repo, release_id:release.id, name:title, body, draft:false, prerelease:true, make_latest:'false'})).data;
          core.notice(`APK published and verified: ${release.html_url}`);
          await core.summary.addHeading(title).addRaw(`APK SHA-256: ${hash}\n\n${body}`).write();
    - name: Retain requested device-test APK as a private draft
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          await require('./.github/scripts/private_apk_review.cjs')({github, context, core});
  cleanup:
    name: Delete only this run's private CI transfer
    needs:
    - transfer-preflight
    - build
    - runtime
    if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout the same source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Delete only this run private CI handoff and verify absence
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    permissions:
      contents: write
  verify:
    name: Android debug and release build
    if: always()
    needs:
    - transfer-preflight
    - build
    - runtime
    - cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require every build, runtime and cleanup result
      env:
        PREFLIGHT: ${{ needs.transfer-preflight.result }}
        BUILD: ${{ needs.build.result }}
        RUNTIME: ${{ needs.runtime.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: |
        for result in "$PREFLIGHT" "$BUILD" "$RUNTIME" "$CLEANUP"; do
          if [ "$result" != success ]; then
            echo "A required Android verification job did not succeed."
            exit 1
          fi
        done
