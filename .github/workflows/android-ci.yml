name: Android CI
'on':
  workflow_call:
    secrets:
      TIMEWEB_CLOUD_TOKEN:
        required: true
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  transfer-preflight:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name ==
      'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      prepared_attempt: ${{ steps.prepare.outputs.prepared_attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      id: checkout
      with:
        persist-credentials: false
    - name: Verify synthetic draft handoff and unauthenticated denial
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'prepare'});
          core.setOutput('prepared_attempt', process.env.GITHUB_RUN_ATTEMPT);
    - name: Remove the temporary draft immediately if preparation fails
      if: failure() && steps.checkout.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    name: Verify the private final-evidence return before building
  build:
    name: Build with the existing signing identity
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name ==
      'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    needs:
    - transfer-preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 285
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      SOURCE_ROOT: ${{ github.workspace }}/android-ci-build-${{ github.run_id }}-${{ github.run_attempt }}/source
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      RUN_PROFILE_UI_TESTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    outputs:
      input_archive: ${{ steps.pack_inputs.outputs.input_archive }}
      input_sha256: ${{ steps.pack_inputs.outputs.input_sha256 }}
      input_receipt_sha256: ${{ steps.pack_inputs.outputs.input_receipt_sha256 }}
      input_attempt: ${{ steps.pack_inputs.outputs.input_attempt }}
    steps:
    - name: Require the existing laptop and a new job-owned directory
      shell: cmd
      run: |
        py -3 -c "import os,sys,pathlib; assert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; assert sys.version_info[:3]==(3,14,6); w=pathlib.Path(os.environ['GITHUB_WORKSPACE']); assert w in [pathlib.Path('C:/')/r/'_work/omni-cio-gateway/omni-cio-gateway' for r in ('actions-runner','actions-runner-2','actions-runner-3','actions-runner-4')]; assert all(not q.is_symlink() and not getattr(q.lstat(),'st_file_attributes',0)&0x400 for q in (w,*w.parents)); p=pathlib.Path(os.environ['SOURCE_ROOT']).parent; assert p.parent==w; assert p.name=='android-ci-build-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']; assert not p.exists() and not p.is_symlink()"
        if errorlevel 1 exit /b 1
    - name: Checkout the exact tested merge with LF bytes
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: android-ci-build-${{ github.run_id }}-${{ github.run_attempt }}/source
        persist-credentials: false
        clean: false
    - name: Run complete host checks and all signed Android builds under the shared lease
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" build
        if errorlevel 1 exit /b 1
      id: build_checks
      timeout-minutes: 210
    - name: Report exact-head Sonar findings for remediation
      if: always() && steps.checkout.outcome == 'success'
      timeout-minutes: 22
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        retries: 3
        script: |
          const { newestSonarCheck, assertCleanSonar } = require(process.env.SOURCE_ROOT + '/.github/scripts/require_clean_sonar.cjs');
          const ref = context.payload.pull_request?.head?.sha || context.sha;
          let sonar = null;
          // Automatic analysis can queue while Gradle builds. Keep the exact-head
          // gate before any APK handoff; a timeout still fails verification.
          for (let attempt = 0; attempt < 120; attempt++) {
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref, check_name: 'SonarCloud Code Analysis', per_page: 100,
            });
            sonar = newestSonarCheck(checks, ref);
            if (sonar?.status === 'completed') break;
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!sonar || sonar.status !== 'completed') {
            core.setFailed('Exact-head Sonar result is not ready: quality has not been verified.');
            return;
          }
          core.info('SONAR_CHECK=' + JSON.stringify({head:ref,id:sonar.id,conclusion:sonar.conclusion}));
          const annotations = await github.paginate(github.rest.checks.listAnnotations, {
            ...context.repo, check_run_id: sonar.id, per_page: 100,
          });
          for (const item of annotations) {
            core.warning('SONAR_ANNOTATION ' + JSON.stringify({path:item.path,start_line:item.start_line,end_line:item.end_line,level:item.annotation_level,title:item.title,message:item.message}));
          }
          core.info('SONAR_ANNOTATION_COUNT=' + annotations.length);
          assertCleanSonar(sonar, annotations, ref);
    - name: Download the exact published 0.13.5 / 43 APK for upgrade verification
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const expected = {
            version_code: 43,
            version_name: '0.13.5-preview',
            bytes: 29771254,
            sha256: '4e9bf0a2fd54d8ab4b9d49ef9ddf96bc14a274ac4c145585fcfdb88d6ae774b6',
          };
          const url = 'https://analyst-ai-2941515.twc1.net/client/apk/Analyst-AI-43-4e9bf0a2fd54d8ab4b9d49ef9ddf96bc14a274ac4c145585fcfdb88d6ae774b6.apk';
          const response = await fetch(url, {redirect: 'error', signal: AbortSignal.timeout(60000)});
          if (response.status !== 200 || !response.body) {
            await response.body?.cancel();
            throw new Error('Published baseline43 download failed: HTTP ' + response.status);
          }
          const length = response.headers.get('content-length');
          if (length !== null && length !== String(expected.bytes)) {
            await response.body.cancel();
            throw new Error('Published baseline43 Content-Length differs');
          }
          const chunks = [];
          const digest = crypto.createHash('sha256');
          let total = 0;
          for await (const chunk of response.body) {
            total += chunk.byteLength;
            if (total > expected.bytes) throw new Error('Published baseline43 exceeds exact size');
            digest.update(chunk);
            chunks.push(chunk);
          }
          if (total !== expected.bytes || digest.digest('hex') !== expected.sha256) {
            throw new Error('Published baseline43 bytes or SHA256 differ');
          }
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          if (!/^[1-9]\d{0,19}$/.test(String(context.runId)) || !/^[1-9]\d{0,4}$/.test(attempt)) {
            throw new Error('Exact run and attempt identity required for baseline43');
          }
          const dest = path.join(fs.realpathSync(process.env.RUNNER_TEMP), `previous43-${context.runId}-${attempt}.apk`);
          fs.writeFileSync(dest, Buffer.concat(chunks, total), {flag: 'wx'});
          const saved = fs.readFileSync(dest);
          if (saved.length !== expected.bytes || crypto.createHash('sha256').update(saved).digest('hex') !== expected.sha256) {
            throw new Error('Saved baseline43 read-back differs');
          }
          core.exportVariable('PREVIOUS_APK', dest);
          core.info('PUBLISHED_ANDROID_UPGRADE_BASELINE=' + JSON.stringify(expected));
    - name: Retain the four exact CI inputs on this laptop with source and receipt hashes
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" pack
        if errorlevel 1 exit /b 1
      id: pack_inputs
      timeout-minutes: 35
    concurrency:
      group: analyst-android-pr-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
  runtime:
    name: Verify the exact APK on the existing laptop / API37 / 16KB and 4KB
    needs:
    - transfer-preflight
    - build
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 420
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      SOURCE_ROOT: ${{ github.workspace }}/android-ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}/source
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      RUN_PROFILE_UI_TESTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      CI_INPUT_ARCHIVE: ${{ needs.build.outputs.input_archive }}
      CI_INPUT_SHA256: ${{ needs.build.outputs.input_sha256 }}
      CI_INPUT_RECEIPT_SHA256: ${{ needs.build.outputs.input_receipt_sha256 }}
      CI_INPUT_ATTEMPT: ${{ needs.build.outputs.input_attempt }}
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
      runtime_root: ${{ steps.export.outputs.runtime_root }}
      runtime_attempt: ${{ steps.export.outputs.runtime_attempt }}
      runtime_receipt_sha256: ${{ steps.export.outputs.runtime_receipt_sha256 }}
    steps:
    - name: Require the existing laptop and a new job-owned directory
      shell: cmd
      run: |
        py -3 -c "import os,sys,pathlib; assert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; assert sys.version_info[:3]==(3,14,6); w=pathlib.Path(os.environ['GITHUB_WORKSPACE']); assert w in [pathlib.Path('C:/')/r/'_work/omni-cio-gateway/omni-cio-gateway' for r in ('actions-runner','actions-runner-2','actions-runner-3','actions-runner-4')]; assert all(not q.is_symlink() and not getattr(q.lstat(),'st_file_attributes',0)&0x400 for q in (w,*w.parents)); p=pathlib.Path(os.environ['SOURCE_ROOT']).parent; assert p.parent==w; assert p.name=='android-ci-runtime-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']; assert not p.exists() and not p.is_symlink()"
        if errorlevel 1 exit /b 1
    - name: Checkout the exact tested merge with LF bytes
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: android-ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}/source
        persist-credentials: false
        clean: false
    - name: Prepare the private evidence return for a later rerun attempt
      id: prepare_return
      if: needs.transfer-preflight.outputs.prepared_attempt != format('{0}', github.run_attempt)
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require(process.env.SOURCE_ROOT + '/.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'prepare'});
    - name: Remove this run draft immediately when rerun preparation fails
      if: failure() && steps.prepare_return.outcome == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require(process.env.SOURCE_ROOT + '/.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    - name: Copy verified retained inputs into the fresh runtime checkout and recheck APK integrity
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" runtime-prepare
        if errorlevel 1 exit /b 1
      id: prepare_runtime
      timeout-minutes: 65
    - name: Run original full native API37 suite with measured 16384-byte pages
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" profile-16384
        if errorlevel 1 exit /b 1
      id: profile_16384
      timeout-minutes: 125
      if: always() && steps.prepare_runtime.outcome == 'success'
    - name: Run original full native API37 suite with measured 4096-byte pages
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" profile-4096
        if errorlevel 1 exit /b 1
      id: profile_4096
      timeout-minutes: 125
      if: always() && steps.prepare_runtime.outcome == 'success'
    - name: Require both complete installation and current UI receipts for the same APK
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" validate
        if errorlevel 1 exit /b 1
      id: validate
      timeout-minutes: 35
      if: always() && steps.prepare_runtime.outcome == 'success'
    - name: Preserve exact private runtime evidence after either outcome
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" export
        if errorlevel 1 exit /b 1
      id: export
      timeout-minutes: 15
      if: always() && steps.checkout.outcome == 'success' && steps.prepare_runtime.outcome != 'skipped'
    - name: Upload only the private final-evidence archive
      id: evidence_upload
      if: always() && steps.export.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require(process.env.SOURCE_ROOT + '/.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'upload'});
  collect:
    name: Preserve the exact private Android evidence on runtime storage
    needs:
    - transfer-preflight
    - runtime
    if: always() && needs.runtime.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.runtime.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.runtime.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
                with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                    raw=r.read(4194305);assert len(raw)<=4194304
                    return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))

        def with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):
            sid=9417611;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g"
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["name"]=="Analyst AI runtime 20261025" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            access.SERVER_ID=sid
            with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(12):
                        try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                        except (p.ProbeError,subprocess.TimeoutExpired):
                            if attempt==11:raise
                            time.sleep(5)
                    payload=remote_script.encode() if binary_input is None else binary_input
                    remote_command="python3 -" if binary_input is None else "python3 -c "+shlex.quote(remote_script)
                    result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                    if not capture:print(result.stdout.decode(errors="replace"),flush=True)
                    if result.returncode:
                        print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                        raise RuntimeError("remote_task_failed")
                    return result.stdout
                finally:
                    try:
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("AMS_TEMP_KEY_REMOVED=true",flush=True)


        import re
        run=os.environ["GITHUB_RUN_ID"];attempt=os.environ["GITHUB_RUN_ATTEMPT"]
        expected=os.environ["TRANSFER_SHA256"]
        assert re.fullmatch(r"[1-9]\d{0,19}",run) and re.fullmatch(r"[1-9]\d{0,4}",attempt)
        assert re.fullmatch(r"[a-f0-9]{64}",expected)
        blob=(pathlib.Path(os.environ["RUNNER_TEMP"])/"ci-handoff.zip").read_bytes()
        assert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected
        remote_script=r"""import pathlib,sys,hashlib,json,os,pwd,stat
        data=sys.stdin.buffer.read(512*1024**2+1)
        assert len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH
        parent=pathlib.Path('/var/lib/analyst-ai-build/incoming')
        account=pwd.getpwnam('analyst-build')
        if not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)
        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)
        folder=parent/FOLDER
        folder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)
        destination=folder/'android-ci-evidence.zip'
        with destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)
        assert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}
        metadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)
        print('WINDOWS_ANDROID_CI_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)
        """
        remote_script=remote_script.replace("EXPECTED_BYTES",str(len(blob))).replace("EXPECTED_HASH",repr(expected)).replace("FOLDER",repr("android-ci-"+run+"-"+attempt)).replace("RUN_ID",run).replace("RUN_ATTEMPT",attempt)
        with_ams(remote_script,timeout=180,binary_input=blob)
        PY
  cleanup:
    name: Delete only this run's private CI transfer
    needs:
    - transfer-preflight
    - build
    - runtime
    - collect
    if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name
      == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout the same source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: true
    - name: Delete only this run private CI handoff and verify absence
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
    permissions:
      contents: write
  publication:
    name: Apply existing release or private-retention policy after evidence cleanup
    needs:
    - runtime
    - collect
    - cleanup
    if: always() && needs.runtime.result == 'success' && needs.collect.result == 'success' && needs.cleanup.result == 'success'
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 40
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    env:
      SOURCE_ROOT: ${{ github.workspace }}/android-ci-publication-${{ github.run_id }}-${{ github.run_attempt }}/source
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      RUN_PROFILE_UI_TESTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      CI_RUNTIME_ROOT: ${{ needs.runtime.outputs.runtime_root }}
      CI_RUNTIME_ATTEMPT: ${{ needs.runtime.outputs.runtime_attempt }}
      CI_RUNTIME_RECEIPT_SHA256: ${{ needs.runtime.outputs.runtime_receipt_sha256 }}
      CI_EVIDENCE_SHA256: ${{ needs.runtime.outputs.archive_sha256 }}
    steps:
    - name: Require the existing laptop and a new job-owned directory
      shell: cmd
      run: |
        py -3 -c "import os,sys,pathlib; assert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; assert sys.version_info[:3]==(3,14,6); w=pathlib.Path(os.environ['GITHUB_WORKSPACE']); assert w in [pathlib.Path('C:/')/r/'_work/omni-cio-gateway/omni-cio-gateway' for r in ('actions-runner','actions-runner-2','actions-runner-3','actions-runner-4')]; assert all(not q.is_symlink() and not getattr(q.lstat(),'st_file_attributes',0)&0x400 for q in (w,*w.parents)); p=pathlib.Path(os.environ['SOURCE_ROOT']).parent; assert p.parent==w; assert p.name=='android-ci-publication-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']; assert not p.exists() and not p.is_symlink()"
        if errorlevel 1 exit /b 1
    - name: Checkout the exact tested merge with LF bytes
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: android-ci-publication-${{ github.run_id }}-${{ github.run_attempt }}/source
        persist-credentials: false
        clean: false
    - name: Reverify exact retained runtime root receipt source and APKs before sharing
      shell: cmd
      run: |
        py -3 "%SOURCE_ROOT%\.github\scripts\windows_android_ci.py" inspect-retained
        if errorlevel 1 exit /b 1
      id: retained
      timeout-minutes: 10
    - name: Verify explicit release quality before sharing any APK
      if: |-
        github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |+
          process.chdir(process.env.RUNTIME_ROOT);
          process.env.GITHUB_WORKSPACE = process.env.RUNTIME_ROOT;
          const quality = await require(process.env.SOURCE_ROOT + '/.github/scripts/require_main_release.cjs')({github, context});
          core.info('MAIN_RELEASE_QUALITY=' + JSON.stringify(quality));
          const fs = require('fs');
          const crypto = require('crypto');
          const base = 'app/build/outputs/apk/preview/';
          const report = JSON.parse(fs.readFileSync(base + 'apk-verification.json', 'utf8'));
          const bytes = fs.readFileSync(base + 'app-preview.apk');
          if (!Number.isSafeInteger(report.version_code) || report.version_code <= 34 ||
              report.device_install_test !== 'passed_on_emulators_not_a_physical_phone' ||
              crypto.createHash('sha256').update(bytes).digest('hex') !== report.sha256) {
            throw new Error('Unverified or previously published APK identity cannot be shared');
          }

      env:
        RUNTIME_ROOT: ${{ steps.retained.outputs.retained_root }}
    - name: Retain APK and verification evidence when storage is available
      id: retain_apk
      if: |-
        github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Analyst-AI-${{ github.sha }}
        path: |-
          ${{ steps.retained.outputs.retained_root }}/app/build/outputs/apk/preview/app-preview.apk
          ${{ steps.retained.outputs.retained_root }}/app/build/outputs/apk/preview/apk-verification.json
          ${{ steps.retained.outputs.retained_root }}/app/build/outputs/apk/preview/install-api37-4096/install-results.json
          ${{ steps.retained.outputs.retained_root }}/app/build/outputs/apk/preview/install-api37-16384/install-results.json
          ${{ steps.retained.outputs.retained_root }}/app/build/outputs/apk/preview/ui-screens/*.png
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Report unavailable optional Actions retention
      if: steps.retain_apk.outcome == 'failure'
      run: |
        echo ::warning::Verified APK retention in GitHub Actions storage failed, usually because the repository artifact quota is full. Build, installation, UI, and release-integrity gates remain authoritative.
    - name: Publish verified APK to GitHub Releases
      if: |-
        github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-apk]')))
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          process.chdir(process.env.RUNTIME_ROOT);
          process.env.GITHUB_WORKSPACE = process.env.RUNTIME_ROOT;
          const quality = await require(process.env.SOURCE_ROOT + '/.github/scripts/require_main_release.cjs')({github, context});
          core.info('MAIN_RELEASE_QUALITY=' + JSON.stringify(quality));

          const fs = require('fs');
          const crypto = require('crypto');
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const sha = context.sha;
          const reportPath = 'app/build/outputs/apk/preview/apk-verification.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          // Code 34 belongs to the installed 0.10.0 preview. Changed bytes must use a newer code.
          if (!Number.isSafeInteger(report.version_code) || report.version_code <= 34) {
            throw new Error('A new versionCode is required before publishing changed APK bytes');
          }
          const data = fs.readFileSync('app/build/outputs/apk/preview/app-preview.apk');
          const hash = crypto.createHash('sha256').update(data).digest('hex');
          if (hash !== report.sha256 || report.device_install_test !== 'passed_on_emulators_not_a_physical_phone') {
            throw new Error('APK was not fully validated or changed after validation');
          }
          const version = report.version_name;
          const tag = `android-preview-${sha}`;
          const assetName = `Analyst-AI-${version}-${sha.slice(0, 7)}.apk`;
          const title = `Analyst AI ${version}`;
          const sourceDocs = `https://github.com/${owner}/${repo}/blob/${sha}/docs`;
          const releaseNotes = ['3D100.md', '3D100_EVIDENCE.md', 'PLAN_STATUS.md'].reduce(
            (text, file) => text.replaceAll(`(../${file})`, `(${sourceDocs}/${file})`),
            fs.readFileSync('docs/releases/0.11.0.md', 'utf8').trim());
          if (!releaseNotes.includes('0.11.0') || !releaseNotes.includes('3D100')) throw new Error('Release notes do not identify this update');
          const body = [
            releaseNotes,
            'Signed, non-debuggable preview APK. Android 17+; application ID ru.omnicio.app.debug.',
            'Uses the existing test signing key, not a production-store signing key.',
            'APK signature, ZIP/ELF alignment, DEX integrity, clean installation and launch, upgrade from 0.13.5 / 43 and post-upgrade launch were verified on Android 17/API 37 x86_64 emulators with measured getconf PAGE_SIZE values of 16384 and 4096 bytes.',
            'The spectrum-3d-100-v2 UI receipt contains 60 business and 14 portfolio case/font IDs per page-size profile, alongside the native-rendering checks. Production UI components were exercised in a separate debug APK with synthetic data.',
            'The attached apk-verification.json binds both emulator results to this preview APK SHA-256 and each UI receipt to the exact installed debug APK SHA-256 and case/font IDs.',
            'These emulator checks do not verify a physical phone, physical ARM hardware with 16 KB pages, TalkBack gestures, heat, battery use, live broker or paid-model access, or installation through the in-app updater.',
            `Source commit: ${sha}`,
            `SHA-256: ${hash}`,
            `Signing certificate SHA-256: ${report.certificate_sha256}`,
          ].join('\n\n');
          const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page:100});
          let release = releases.find(r => r.tag_name === tag);
          if (!release) {
            release = (await github.rest.repos.createRelease({owner, repo, tag_name:tag, target_commitish:sha, name:title, body, draft:true, prerelease:true, make_latest:'false'})).data;
          }
          if (!release.draft) {
            if (!release.assets.some(a => a.name === assetName)) throw new Error('Immutable release missing APK');
            core.notice(`APK already published: ${release.html_url}`);
            return;
          }
          const files = [[assetName, data, 'application/vnd.android.package-archive'], ['apk-verification.json', fs.readFileSync(reportPath), 'application/json']];
          for (const [name, bytes, type] of files) {
            for (const asset of release.assets.filter(a => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id:asset.id});
            }
            const asset = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data:bytes, headers:{'content-type':type,'content-length':bytes.length}})).data;
            const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
            const received = Buffer.from(downloaded.data);
            if (received.length !== bytes.length || !crypto.createHash('sha256').update(received).digest().equals(crypto.createHash('sha256').update(bytes).digest())) {
              throw new Error('Release upload read-back integrity mismatch');
            }
          }
          release = (await github.rest.repos.updateRelease({owner, repo, release_id:release.id, name:title, body, draft:false, prerelease:true, make_latest:'false'})).data;
          core.notice(`APK published and verified: ${release.html_url}`);
          await core.summary.addHeading(title).addRaw(`APK SHA-256: ${hash}\n\n${body}`).write();
      env:
        RUNTIME_ROOT: ${{ steps.retained.outputs.retained_root }}
    - name: Retain requested device-test APK as a private draft
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: |
          process.chdir(process.env.RUNTIME_ROOT);
          process.env.GITHUB_WORKSPACE = process.env.RUNTIME_ROOT;
          await require(process.env.SOURCE_ROOT + '/.github/scripts/private_apk_review.cjs')({github, context, core});
      env:
        RUNTIME_ROOT: ${{ steps.retained.outputs.retained_root }}
  verify:
    name: Android debug and release build
    if: always()
    needs:
    - transfer-preflight
    - build
    - runtime
    - collect
    - cleanup
    - publication
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require every build runtime evidence cleanup and policy result
      env:
        PREFLIGHT: ${{ needs.transfer-preflight.result }}
        BUILD: ${{ needs.build.result }}
        RUNTIME: ${{ needs.runtime.result }}
        CLEANUP: ${{ needs.cleanup.result }}
        COLLECT: ${{ needs.collect.result }}
        PUBLICATION: ${{ needs.publication.result }}
      run: |
        for result in "$PREFLIGHT" "$BUILD" "$RUNTIME" "$COLLECT" "$CLEANUP" "$PUBLICATION"; do
          if [ "$result" != success ]; then
            echo "A required Android verification, evidence, cleanup, or policy job did not succeed."
            exit 1
          fi
        done
  merge-gate:
    name: V10 authoritative merge gate
    needs:
    - verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require current Android, backend and Sonar evidence
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        ANDROID_RESULT: ${{ needs.verify.result }}
      with:
        script: await require('./.github/scripts/authoritative_merge_gate.cjs').verify({github, context, core, androidResult:process.env.ANDROID_RESULT});
