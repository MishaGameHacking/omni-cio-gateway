name: Verify the owner's downloadable Windows launcher on the Lenovo
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/home/Start-AnalystAIHome.zip, .github/workflows/home-runtime-launcher.yml]
permissions:
  contents: read
concurrency:
  group: analyst-home-launcher-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),os=require('node:os'),cp=require('node:child_process'),crypto=require('node:crypto');
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong machine');
            const dir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'analyst-start-check-'));
            try{
              for(const fname of ['Start-AnalystAIHome.ps1','Start-AnalystAIHome.cmd','Start-AnalystAIHome.zip']){
                const repoPath=(fname.endsWith('.zip')?'deploy/home/':'tools/home_runtime/')+fname;
                const {data}=await github.rest.repos.getContent({...context.repo,path:repoPath,ref:context.sha});
                fs.writeFileSync(path.join(dir,fname),Buffer.from(data.content,'base64'),{flag:'wx'});
              }
              const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMSPEC','COMPUTERNAME','PATH','PATHEXT','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','PUBLIC','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','USERNAME','USERDOMAIN','PSMODULEPATH'].includes(k.toUpperCase())));
              const check=cp.spawnSync('py.exe',['-3','-I','-c',[
                'import pathlib,zipfile,sys',
                "d=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(d/'Start-AnalystAIHome.zip')",
                "names=['Start-AnalystAIHome.cmd','Start-AnalystAIHome.ps1']",
                'assert sorted(z.namelist())==names and all(z.read(n)==(d/n).read_bytes() for n in names)',
                "target=d/'verified'; target.mkdir();z.extractall(target)"
              ].join('\n'),dir],{env,windowsHide:true,encoding:'utf8'});
              if(check.status!==0)throw Error('Packaged launcher/source mismatch');
              const executable=path.join(process.env.SystemRoot,'System32','WindowsPowerShell','v1.0','powershell.exe');
              const probe=cp.spawnSync(executable,['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',path.join(dir,'verified','Start-AnalystAIHome.ps1'),'-Verify'],{env,windowsHide:true,encoding:'utf8',timeout:230000});
              if(probe.status!==0)throw Error('Reviewed launcher did not validate installed materials');
              const result=JSON.parse(probe.stdout.trim());
              if(result.items!==7||result.media_sha256!=='verified'||result.powershell_syntax!=='valid')throw Error('Missing verification');
              const zip=fs.readFileSync(path.join(dir,'Start-AnalystAIHome.zip')),sha=crypto.createHash('sha256').update(zip).digest('hex');
              core.info('HOME_LAUNCHER_VERIFIED='+JSON.stringify({package:result.package,zip_sha256:sha,bytes:zip.length,entrypoints:2,verified_files:result.items,elevation_performed:false}));
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
