name: Verify the owner's downloadable Windows launcher on the Lenovo
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/home/Start-AnalystAIHome.zip, tools/home_runtime/Start-AnalystAIHome.cmd, tools/home_runtime/Start-AnalystAIHome.ps1, .github/workflows/home-runtime-launcher.yml]
permissions:
  contents: read
concurrency:
  group: analyst-home-launcher-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong machine');
            const dir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'analyst-start-check-'));
            try{
              for(const fname of ['Start-AnalystAIHome.ps1','Start-AnalystAIHome.cmd','Start-AnalystAIHome.zip','Install-AnalystAIHome.ps1']){
                const repoPath=(fname.endsWith('.zip')?'deploy/home/':'tools/home_runtime/')+fname;
                const {data}=await github.rest.repos.getContent({...context.repo,path:repoPath,ref:context.sha});
                fs.writeFileSync(path.join(dir,fname),Buffer.from(data.content,'base64'),{flag:'wx'});
              }
              const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMSPEC','COMPUTERNAME','PATH','PATHEXT','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','PUBLIC','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','USERNAME','USERDOMAIN','PSMODULEPATH'].includes(k.toUpperCase())));
              const check=cp.spawnSync('py.exe',['-3','-I','-c',[
                'import hashlib,pathlib,re,zipfile,sys',
                "d=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(d/'Start-AnalystAIHome.zip')",
                "member='Start-AnalystAI-Service.cmd'; assert z.namelist()==[member]",
                "content=z.read(member); assert content==(d/'Start-AnalystAIHome.cmd').read_bytes()",
                "script=content.decode('ascii').splitlines(); idx=script.index('# Analyst AI PowerShell')",
                "assert script[idx+1:]==(d/'Start-AnalystAIHome.ps1').read_text('ascii').splitlines()",
                "reviewed=hashlib.sha256((d/'Install-AnalystAIHome.ps1').read_bytes()).hexdigest()",
                "assert sum(line.strip()==chr(36)+'expected='+chr(39)+reviewed+chr(39) for line in script[idx+1:])==1",
                "target=d/'verified'; target.mkdir(); (target/member).write_bytes(content)"
              ].join('\n'),dir],{env,windowsHide:true,encoding:'utf8'});
              if(check.status!==0)throw Error('Packaged launcher/source mismatch');
              const executable=path.join(process.env.SystemRoot,'System32','cmd.exe');
              const probe=cp.spawnSync(executable,['/d','/c','Start-AnalystAI-Service.cmd'],{cwd:path.join(dir,'verified'),
                env:{...env,ANALYST_HOME_TEST_LAUNCHER:'1'},windowsHide:true,encoding:'utf8',timeout:230000});
              if(probe.status!==0)throw Error('Reviewed launcher did not validate installed materials');
              const result=JSON.parse(probe.stdout.trim().split(/\r?\n/).at(-1));
              if(result.items!==7||result.media_sha256!=='verified'||result.account_whatif!==true||
                 result.description_chars!==23||result.description_limit!==48)throw Error('Missing native Windows account validation');
              const zip=fs.readFileSync(path.join(dir,'Start-AnalystAIHome.zip')),sha=crypto.createHash('sha256').update(zip).digest('hex');
              core.info('HOME_LAUNCHER_VERIFIED='+JSON.stringify({package:result.package,zip_sha256:sha,bytes:zip.length,entrypoints:1,verified_files:result.items,description_chars:result.description_chars,elevation_performed:false}));
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
