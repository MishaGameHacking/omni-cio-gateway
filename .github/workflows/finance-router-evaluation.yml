name: Compare the local evidence router with the original financial reasoning result
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - research/financial_evidence.py
      - tools/evaluate_finance_router.py
      - tools/check_finance_router.py
      - tools/test_finance_router.py
      - .github/workflows/finance-router-evaluation.yml
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 22
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: finance-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/emulator_lease.py
            tools/evaluate_local_e4b.py
            tools/evaluate_finance_reasoning.py
            research/financial_evidence.py
            tools/check_finance_router.py
            tools/test_finance_router.py
            tools/evaluate_finance_router.py
          sparse-checkout-cone-mode: false
      - name: Fetch only the pinned historical public benchmark input
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const run_id=41098946607, sha='0ac358fe29f99ad1f8e618fae76782b45a8d51c8', artifact_id=12997412164;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
            if(r.head_sha!==sha||r.event!=='push'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.path!=='.github/workflows/finance-reasoning-evaluation.yml'||r.status!=='completed'||r.run_attempt!==1||r.conclusion!=='failure') throw new Error('Original measurement identity changed');
            const {data:a}=await github.rest.actions.getArtifact({...context.repo,artifact_id});
            if(a.expired||a.workflow_run?.id!==run_id||a.digest!=='sha256:546ac8e113dee245064ab620ad8be0c2cb7b09d9f67340e4f9e2f696e8a2d909') throw new Error('Public input digest mismatch');
            const data=await github.rest.actions.downloadArtifact({...context.repo,artifact_id,archive_format:'zip'});
            const bytes=Buffer.from(data.data);
            if(bytes.length>32768||'sha256:'+require('node:crypto').createHash('sha256').update(bytes).digest('hex')!==a.digest) throw new Error('Download integrity failure');
            require('node:fs').writeFileSync(require('node:path').join('finance-'+context.runId+'-'+process.env.GITHUB_RUN_ATTEMPT,'prior-evidence.zip'),bytes,{flag:'wx'});
      - name: Check citations, reverse periods, absent inputs, and real historical comparisons
        shell: cmd
        working-directory: finance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os,subprocess; assert os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']"
          if errorlevel 1 exit /b 1
          py -3 tools\check_finance_router.py
          if errorlevel 1 exit /b 1
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: finance-router-${{ github.run_id }}
          path: finance-${{ github.run_id }}-${{ github.run_attempt }}/finance-router-evaluation.json
          if-no-files-found: warn
          retention-days: 7
