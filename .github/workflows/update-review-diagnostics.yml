name: Read current update quality findings
on:
  push:
    branches:
      - feature/mandatory-updates-quant-research
      - feature/spectrum-ui-risk-update
      - codex/spectrum-3d-100
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  diagnostics:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SONAR_READ_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          script: |
            // GET-only source diagnostics. No cloud access, publishing,
            // issue acceptance, test overrides or secret values in output.
            const project = 'MishaGameHacking_omni-cio-gateway';
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const headers = {Accept:'application/json'};
            if (process.env.SONAR_READ_TOKEN) headers.Authorization = 'Bearer '+process.env.SONAR_READ_TOKEN;
            async function readIssuePage(number, page) {
              const endpoint = new URL('https://sonarcloud.io/api/issues/search');
              endpoint.search = new URLSearchParams({componentKeys:project,pullRequest:String(number),
                issueStatuses:'OPEN,CONFIRMED',sinceLeakPeriod:'true',ps:'500',p:String(page)}).toString();
              const response = await fetch(endpoint,{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(15000)});
              if (!response.ok) throw new Error('Sonar issue inventory HTTP '+response.status);
              const raw = await response.text();
              if (raw.length>1048576) throw new Error('Response exceeds diagnostic limit');
              const result = JSON.parse(raw);
              const total = result.paging?.total ?? result.total;
              if (!Number.isSafeInteger(total) || total<0 || total>2000 || !Array.isArray(result.issues)) {
                throw new Error('Invalid or oversized Sonar issue inventory');
              }
              return {total,issues:result.issues};
            }
            async function readAllIssues(number) {
              const issues = new Map();
              let expectedTotal;
              for (let page=1; page<=4; page++) {
                const result = await readIssuePage(number,page);
                expectedTotal ??= result.total;
                if (result.total!==expectedTotal) throw new Error('Sonar inventory changed during paging');
                for (const issue of result.issues) {
                  if (typeof issue.key!=='string' || issues.has(issue.key)) throw new Error('Missing or duplicate issue identity');
                  issues.set(issue.key,issue);
                }
                core.info('SONAR_READ_PAGE='+JSON.stringify({pr:number,page,total:result.total,issues:result.issues.length}));
                if (issues.size===expectedTotal) return [...issues.values()];
                if (result.issues.length===0) throw new Error('Incomplete Sonar issue inventory');
              }
              throw new Error('Sonar issue inventory exceeded page limit');
            }
            const numbers = context.ref === 'refs/heads/codex/spectrum-3d-100' ? [880] : [831, 832, 833];
            for (const number of numbers) {
              const pr = (await github.rest.pulls.get({...context.repo, pull_number:number})).data;
              let check;
              for (let attempt=0; attempt<36; attempt++) {
                const checks = (await github.rest.checks.listForRef({...context.repo, ref:pr.head.sha, per_page:100})).data.check_runs;
                check = checks.find(item=>item.name==='SonarCloud Code Analysis');
                if (check?.status==='completed') break;
                await wait(5000);
              }
              if (!check || check.status!=='completed') {
                core.info('SONAR_READ_UNAVAILABLE='+JSON.stringify({pr:number,head:pr.head.sha,reason:'analysis_pending'}));
                continue;
              }
              core.info('EXACT_HEAD_QUALITY='+JSON.stringify({pr:number,head:pr.head.sha,check:check.id,conclusion:check.conclusion}));
              const annotations = await github.paginate(github.rest.checks.listAnnotations, {...context.repo,check_run_id:check.id,per_page:100});
              for (const a of annotations) core.info('QUALITY_FINDING='+JSON.stringify({pr:number,path:a.path,line:a.start_line,title:a.title,message:a.message}));
              try {
                const issues = await readAllIssues(number);
                const after = (await github.rest.pulls.get({...context.repo,pull_number:number})).data;
                if (after.head.sha!==pr.head.sha) {
                  core.info('SONAR_READ_UNAVAILABLE='+JSON.stringify({pr:number,reason:'head_changed'}));
                  continue;
                }
                const expectedNew = /\[(\d+) New issues\]/.exec(check.output?.summary||'');
                if (expectedNew && Number(expectedNew[1])!==issues.length) {
                  throw new Error('Sonar API count disagrees with exact-head check');
                }
                for (const issue of issues) {
                  core.info('QUALITY_REVIEW_FINDING='+JSON.stringify({pr:number,head:pr.head.sha,key:issue.key,
                    rule:issue.rule,type:issue.type,severity:issue.severity,impacts:issue.impacts||[],
                    component:issue.component,line:issue.line,textRange:issue.textRange,
                    message:issue.message,flows:issue.flows||[]}));
                }
                core.info('SONAR_COMPLETE_INVENTORY='+JSON.stringify({pr:number,head:pr.head.sha,check:check.id,
                  issues:issues.length,unique:issues.length,all_types:true,complete:true}));
              } catch (error) {
                core.setFailed('SONAR_READ_UNAVAILABLE='+JSON.stringify({pr:number,head:pr.head.sha,reason:error.message}));
              }
            }
