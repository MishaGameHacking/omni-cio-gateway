name: One-time stale deployment cleanup

on:
  push:
    branches:
      - maintenance/cleanup-stale-github-deployments
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Discover deployment environment names safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "omni-cio-maintenance",
          }

          counts = collections.Counter()
          refs = collections.defaultdict(set)
          page = 1
          while True:
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/deployments?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  items = json.load(response)
              if not items:
                  break
              for item in items:
                  environment = item.get("environment") or "<empty>"
                  counts[environment] += 1
                  refs[environment].add(str(item.get("ref")))
              if len(items) < 100:
                  break
              page += 1

          print("Deployment environments discovered:")
          for environment, count in sorted(counts.items()):
              print(f"ENV={environment!r} COUNT={count} REFS={sorted(refs[environment])}")
          print(f"TOTAL={sum(counts.values())}")
          PY
