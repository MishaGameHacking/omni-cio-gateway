name: One-time stale deployment cleanup

on:
  push:
    branches:
      - maintenance/cleanup-stale-github-deployments
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove retired Render deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          protected = "main - omni-cio-gateway"
          retired = (
              "main - omni-cio-gateway-au6d",
              "main - omni-cio-telegram-bot",
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "omni-cio-maintenance",
          }

          def request(method, path, payload=None, tolerate=()):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if exc.code in tolerate:
                      print(f"Tolerated HTTP {exc.code}: {method} {path}")
                      return None
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {exc.code}: {method} {path}: {body}") from exc

          def list_environment(environment):
              found = []
              page = 1
              while True:
                  items = request(
                      "GET",
                      f"/repos/{repo}/deployments?environment={urllib.parse.quote(environment)}&per_page=100&page={page}",
                  ) or []
                  if not items:
                      break
                  found.extend(item for item in items if item.get("environment") == environment)
                  if len(items) < 100:
                      break
                  page += 1
              return found

          protected_before = list_environment(protected)
          if not protected_before:
              raise RuntimeError(f"Safety stop: protected environment {protected!r} not found")

          expected = {
              "main - omni-cio-gateway-au6d": 184,
              "main - omni-cio-telegram-bot": 127,
          }
          for environment in retired:
              deployments = list_environment(environment)
              print(f"{environment}: found {len(deployments)} deployment records")
              if len(deployments) != expected[environment]:
                  raise RuntimeError(
                      f"Safety stop: unexpected deployment count for {environment!r}: "
                      f"expected {expected[environment]}, found {len(deployments)}"
                  )

          for environment in retired:
              deployments = list_environment(environment)
              for index, deployment in enumerate(deployments, start=1):
                  deployment_id = deployment["id"]
                  request(
                      "POST",
                      f"/repos/{repo}/deployments/{deployment_id}/statuses",
                      {
                          "state": "inactive",
                          "environment": environment,
                          "description": "Retired Render service cleanup",
                      },
                      tolerate=(409, 422),
                  )
                  request(
                      "DELETE",
                      f"/repos/{repo}/deployments/{deployment_id}",
                      tolerate=(404,),
                  )
                  if index % 25 == 0:
                      print(f"{environment}: removed {index}/{len(deployments)}")
                  time.sleep(0.08)

              remaining = list_environment(environment)
              if remaining:
                  raise RuntimeError(
                      f"Cleanup incomplete for {environment!r}: {len(remaining)} remain"
                  )
              print(f"{environment}: cleanup complete")

          protected_after = list_environment(protected)
          if not protected_after:
              raise RuntimeError("Safety failure: protected production deployment disappeared")

          all_remaining = []
          page = 1
          while True:
              items = request("GET", f"/repos/{repo}/deployments?per_page=100&page={page}") or []
              if not items:
                  break
              all_remaining.extend(items)
              if len(items) < 100:
                  break
              page += 1

          environments = sorted({item.get("environment") for item in all_remaining})
          print(f"Remaining deployment records: {len(all_remaining)}")
          print(f"Remaining environments: {environments}")
          if any(environment in environments for environment in retired):
              raise RuntimeError("Retired deployment environment still present after cleanup")
          if protected not in environments:
              raise RuntimeError("Protected production environment missing after cleanup")
          print("Stale deployment cleanup completed; production deployment preserved.")
          PY
