name: Restore guest key access and activate the isolated public report model
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/graceful-guest-research-recovery.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
env:
  EXPECTED_TOOLS_SHA: '4447c357a28d774fc1383216ced010dd0cc38f09'
  EXPECTED_TOOLS_RUN: '41096599909'
  EXPECTED_SSH_TOOLS_SHA: '7bd97dcb25778d756b6419887052107933736606'
  EXPECTED_SSH_TOOLS_RUN: '41093693464'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Require exact successful owner WSL verification and unchanged reviewed transport
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            if(!/^[a-f0-9]{40}$/.test(e.EXPECTED_TOOLS_SHA)||/^0+$/.test(e.EXPECTED_TOOLS_SHA)) throw new Error('Exact tested source required');
            if(!/^[1-9][0-9]{7,19}$/.test(e.EXPECTED_TOOLS_RUN)) throw new Error('Exact successful run required');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_TOOLS_SHA||r.path!=='.github/workflows/local-ai-activation-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Exact diagnostic verification did not pass');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN),per_page:100});
            if(jobs.filter(j=>j.name==='verify'&&j.conclusion==='success'&&j.status==='completed').length!==1) throw new Error('Successful verify job missing');
            for(const path of ['deploy/activate_local_research.py','deploy/test_activate_local_research.py','tools/check_local_ai_activation.py','.github/workflows/local-ai-activation-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('Tested tool changed: '+path);
            }
            const {data:transport}=await github.rest.repos.getContent({...context.repo,path:'tools/owner_plan_transport_20261027.py',ref:context.sha});
            if(transport.sha!=='7478ac9850fe1deeb729d1ccbc8fb0f28b849124') throw new Error('Reviewed transport changed');
      - name: Require tested private SSH diagnostics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_SSH_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_SSH_TOOLS_SHA||r.path!=='.github/workflows/ssh-handshake-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('SSH diagnostic verification required');
            for(const path of ['tools/observe_ssh_handshake.py','tools/test_observe_ssh_handshake.py','tools/check_ssh_handshake.py','.github/workflows/ssh-handshake-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_SSH_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('SSH diagnostic source changed');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Require the owner-tested key propagation and release tools before accessing the guest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha='b1d47d217e9d9fdd6dd6b629d48f1a361602811c',run_id=41098399765;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
            if(r.head_sha!==sha||r.path!=='.github/workflows/local-report-delivery-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Owner WSL delivery verification required');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id,per_page:100});
            if(jobs.filter(j=>j.name==='verify'&&j.conclusion==='success'&&j.status==='completed').length!==1) throw new Error('WSL verification job missing');
            for(const path of ["deploy/local_report_route_release.py","deploy/test_local_report_delivery.py","tools/prepare_local_report_release.py","tools/timeweb_registered_ssh.py","tools/check_local_report_delivery.py",".github/workflows/local-report-delivery-tools.yml","deploy/gpt6_protocol_release.py","tools/prepare_gpt6_protocol_transport.py","tools/observe_ssh_handshake.py","tools/owner_plan_transport_20261027.py"]) {
              const {data:a}=await github.rest.repos.getContent({...context.repo,path,ref:sha});
              const {data:b}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(!a.sha||a.sha!==b.sha) throw new Error('Tested code changed: '+path);
            }
      - name: Require completed pinned source and model installation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:41094102698});
            if(r.head_sha!=='c7056097e88778a4766e8c3525299d72d497a515'||r.path!=='.github/workflows/local-ai-preparation.yml'||r.status!=='completed'||r.conclusion!=='success'||r.run_attempt!==1) throw new Error('Pinned model preparation not completed');
      - name: Require completed in-place resize and provider reconciliation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            for(const [run_id,sha,path] of [[41095586773,'97b203d72b5bc38d2f6b8991e6222a1c13a3d2e0','.github/workflows/local-ai-resize.yml'],[41096021700,'da42aa3d6c3ecb15e404c5d8f002873fddec9c55','.github/workflows/infrastructure-budget.yml']]) {
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(r.head_sha!==sha||r.path!==path||r.status!=='completed'||r.conclusion!=='success'||r.run_attempt!==1) throw new Error('Resize evidence missing');
            }
      - name: Require exact recovery tests and a recent verified backup before the one-reboot path
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const branch='codex/timeweb-owner-prepare-2026-10-23';
            if(process.env.GITHUB_RUN_ATTEMPT!=='1') throw new Error('Do not repeat or re-run an attempted guest reboot');
            for(const [run_id,sha,path] of [
              [41104010825,'84ce316b00874fd052bb842575139cb74deb64f3','.github/workflows/guest-key-recovery-tools.yml'],
              [41102905710,'0885614807efc99be76e13a48fd7596b55da74ad','.github/workflows/guest-login-diagnostic.yml'],
              [41095586773,'97b203d72b5bc38d2f6b8991e6222a1c13a3d2e0','.github/workflows/local-ai-resize.yml']]){
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(r.head_sha!==sha||r.path!==path||r.head_branch!==branch||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Required maintenance evidence unavailable: '+path);
              if(run_id===41095586773 && (Date.now()-Date.parse(r.run_started_at)>6*3600000||Date.now()<Date.parse(r.run_started_at))) throw new Error('Recent private backup required');
            }
            for(const path of ['tools/recover_guest_research.py','tools/test_guest_key_recovery.py','tools/check_guest_key_recovery.py','tools/observe_ssh_handshake.py','tools/timeweb_registered_ssh.py','.github/workflows/guest-key-recovery-tools.yml']){
              const {data:a}=await github.rest.repos.getContent({...context.repo,path,ref:'84ce316b00874fd052bb842575139cb74deb64f3'});
              const {data:b}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(!a.sha||a.sha!==b.sha) throw new Error('Reviewed recovery changed');
            }
      - name: Prepare isolated model activation
        shell: python
        run: |
          import json
          from pathlib import Path
          target=Path('deploy/plan-20261027')
          target.mkdir(parents=True,exist_ok=True)
          (target/'operation.py').write_bytes(Path('deploy/activate_local_research.py').read_bytes())
          (target/'payload.json').write_text(json.dumps({'source_commit':'853090e11dcefef693366159c97316e55045c4c9'}))
      - name: Verify actual guest memory and run one retained public report through the model
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/recover_guest_research.py
      - name: Observe public application after the recovery attempt
        if: always()
        shell: python
        run: |
          import json, urllib.request
          from datetime import datetime,timezone
          address="https://analyst-ai-2941515.twc1.net/health"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          try:
              with urllib.request.build_opener(NoRedirect()).open(address,timeout=8) as r:
                  ok=r.status==200 and r.geturl()==address
          except OSError:
              ok=False
          print("POST_MAINTENANCE_HEALTH="+json.dumps({"observed_at":datetime.now(timezone.utc).isoformat(),"http_200":ok}))
      - name: Preserve sanitized activation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ai-activation-${{ github.run_id }}
          path: plan-reports/
          if-no-files-found: warn
          retention-days: 7
