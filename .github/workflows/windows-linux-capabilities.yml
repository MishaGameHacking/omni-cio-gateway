name: Inspect active Windows build evidence
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-linux-capabilities.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Read only the current run's bounded progress and test summary
        shell: cmd
        run: |
          py -3 -c "import base64;exec(compile(base64.b64decode('',validate=True),'reviewed-build-observation','exec'))"
          if errorlevel 1 exit /b 1
