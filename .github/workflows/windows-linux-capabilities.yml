name: N00 prepare project Linux tests on the Windows laptop
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-linux-capabilities.yml
permissions:
  contents: read
concurrency:
  group: analyst-windows-n00-linux-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 35
    steps:
    - name: Prepare one owned Linux distribution after owner enabled WSL
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-wsl-prepare.py.b64''; p.write_text('''',encoding=''ascii'')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,base64,zlib,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); data=zlib.decompress(base64.b64decode((p/''n00-wsl-prepare.py.b64'').read_text())); assert hashlib.sha256(data).hexdigest()==''1ec84d52be88999e2fcf28b06a54f37d2c65f93f8e986904b6e1433692760b41''; (p/''n00-wsl-prepare.py'').write_bytes(data)"

        if errorlevel 1 exit /b 1

        py -3 "%RUNNER_TEMP%\n00-wsl-prepare.py"

        if errorlevel 1 exit /b 1'
