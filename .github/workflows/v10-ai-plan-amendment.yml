name: Apply V10 AI Copilot plan amendment

on:
  push:
    branches:
      - v10/program-lock
    paths:
      - .github/workflows/v10-ai-plan-amendment.yml

permissions:
  contents: write

jobs:
  amend:
    name: Amend canonical V10 plan and regenerate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out V10 program-lock branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/program-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic owner-approved plan amendment
        run: python3 .v10-plan-amendment/apply.py

      - name: Render updated plan PDF
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, urllib.request

          source = Path('docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.md')
          text = source.read_text(encoding='utf-8')
          payload = json.dumps({'text': text, 'mode': 'gfm', 'context': os.environ['GITHUB_REPOSITORY']}).encode()
          req = urllib.request.Request(
              'https://api.github.com/markdown',
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'Content-Type': 'application/json',
              },
          )
          rendered = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
          style = '@page{size:A4;margin:15mm 16mm 17mm 16mm}body{font-family:Arial,"DejaVu Sans",sans-serif;font-size:10.5pt;line-height:1.38;color:#111}h1{font-size:22pt;page-break-after:avoid}h2{font-size:16pt;page-break-after:avoid}h3{font-size:12.5pt;page-break-after:avoid}table{width:100%;border-collapse:collapse;font-size:8.8pt}th,td{border:1px solid #aaa;padding:4px 5px;vertical-align:top}th{background:#f2f2f2}pre,code{font-family:"DejaVu Sans Mono",monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;border:1px solid #ddd;padding:7px;background:#f8f8f8}a{color:#0645ad;overflow-wrap:anywhere}'
          html = f"<!doctype html><html><head><meta charset='utf-8'><title>Omni-CIO V10 Master Plan</title><style>{style}</style></head><body>{rendered}</body></html>"
          Path(os.environ['RUNNER_TEMP'], 'omni-cio-v10-master-plan.html').write_text(html, encoding='utf-8')
          PY

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          HTML="$RUNNER_TEMP/omni-cio-v10-master-plan.html"
          PDF="$PWD/docs/master-plan/Omni-CIO_V10_Master_Plan_RU.pdf"
          "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="$PDF" "file://$HTML"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/master-plan/Omni-CIO_V10_Master_Plan_RU.pdf')
          b = p.read_bytes()
          if len(b) < 50000 or not b.startswith(b'%PDF-'):
              raise SystemExit(f'Invalid PDF: {len(b)} bytes')
          PY

          {
            sha256sum docs/master-plan/Omni-CIO_V10_Master_Plan_RU.pdf | awk '{print $1 "  Omni-CIO_V10_Master_Plan_RU.pdf"}'
            sha256sum docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.md | awk '{print $1 "  OMNI_CIO_V10_MASTER_PLAN.md"}'
          } > docs/master-plan/OMNI_CIO_V10_MASTER_PLAN.sha256

      - name: Commit plan-only amendment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v10-plan-amendment
          rm -f .github/workflows/v10-ai-plan-amendment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: make AI Copilot and GPT migration mandatory in V10 plan'
          git push origin HEAD:v10/program-lock
