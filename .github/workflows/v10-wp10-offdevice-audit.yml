name: V10 WP10 Off-Device Audit

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-offdevice-audit.yml"
      - ".github/workflows/v10-wp10-recovery-compat.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-offdevice-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: OWNER encrypted off-device target audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-check WP10 static recovery contract
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp10_recovery_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Audit OWNER-controlled encrypted off-device target
        shell: cmd
        run: |
          @echo off
          set "PROFILE=%RUNNER_TEMP%\wp10-offdevice-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\audit_wp10_offdevice_target.ps1 -AsJson > "%PROFILE%"
          if errorlevel 1 (
            type "%PROFILE%"
            exit /b 1
          )
          type "%PROFILE%"
          echo WP10_OFFDEVICE_PROFILE=%PROFILE%>>"%GITHUB_ENV%"

      - name: Validate sanitized off-device evidence
        shell: cmd
        run: |
          @echo off
          python scripts\assess_v10_wp10_offdevice_profile.py "%WP10_OFFDEVICE_PROFILE%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Clean sanitized evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP10_OFFDEVICE_PROFILE if exist "%WP10_OFFDEVICE_PROFILE%" del /f /q "%WP10_OFFDEVICE_PROFILE%"
          git reset --hard HEAD
          git clean -ffdx
