        \ {'bytes': 13743, 'sha256': '79c1f8670cc61f94f917c9ad4b6e394f1430a08b61b8ef87216624fec12b9184'}}, 'units': {'/etc/systemd/system/analyst-ai-owner.service':\
        \ {'bytes': 923, 'sha256': '7df9096fbc578716208077355fa8ac4cbc5c1480844e83910bfa7a0b40c06ed0'}, '/etc/systemd/system/analyst-ai-updates.service':\
        \ {'bytes': 893, 'sha256': '98a5a053ccdbb37938b7cac9bcba937da09cdcd828f913ec2750e01d0bc95cc9'}}}\nREMOTE_SHA256 =\
