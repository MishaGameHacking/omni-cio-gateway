        '}, \\'/opt/analyst-ai/backend/client_updates.py\\': {\\'bytes\\': 13743, \\'sha256\\': \\'79c1f8670cc61f94f917c9ad4b6e394f1430a08b61b8ef87216624fec12b9184\\\
        '}, \\'/opt/analyst-ai-updates/backend/public_updates_app.py\\': {\\'bytes\\': 1219, \\'sha256\\': \\'65223e183ab426c2e9fb7619e97aa321f6a9b9c1e4f72392ee8b4fe056edf0d8\\\
