name: Theme46 read-only active routes and effective service entrypoints
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/theme46-web-runtime-routing.yml
permissions:
  contents: read
concurrency:
  group: analyst-theme46-runtime-readonly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout pinned administrative transport only
