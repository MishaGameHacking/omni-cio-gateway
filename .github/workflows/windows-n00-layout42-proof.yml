name: Preserve candidate42 exact Windows build proof
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-layout42-proof.yml]
permissions:
  contents: read
  checks: write
  actions: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 100
    steps:
      - name: Verify completed build reports and original APK bytes
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "for(let n=0;n<180;n++){const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40265186363});if(r.data.status==='completed')break;if(n===179)throw Error('Exact build has not completed');await new Promise(resolve=>setTimeout(resolve,30000));}\nconst cp=require('node:child_process');const r=cp.spawnSync('py',['-3','-c',\"import pathlib,sys,os,json,hashlib,re,xml.etree.ElementTree as ET\\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nrun=40265186363\\nstate=pathlib.Path('C:/actions-runner-4/_work/_temp/analyst-development-40265186363-1')\\nroot=pathlib.Path('C:/actions-runner-4/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40265186363-1')\\nreport=json.loads((state/'windows-development.json').read_text(encoding='utf-8'))\\ncontroller=json.loads((state/'controller.json').read_text(encoding='utf-8'))\\nassert report['status']=='passed_check_and_build_only',report.get('error')\\nassert report['check']['status']==report['build']['status']=='passed'\\nassert report['source_sha256']==report['source_sha256_after']=='6025e9bf286b253361d894fc421bbefcfa0b40c7fd1364be470d11a68ce3589d'\\nassert report['complete_source_sha256']==report['complete_source_sha256_after']\\nassert controller['owned_processes_after']==0 and not controller.get('error') and not controller.get('cleanup_error')\\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/('n00-build42-proof-'+os.environ['GITHUB_RUN_ID'])\\nout.mkdir(exist_ok=False);identities={}\\ndef sha(p):\\n h=hashlib.sha256()\\n with p.open('rb') as f:\\n  for b in iter(lambda:f.read(1048576),b''):h.update(b)\\n return h.hexdigest()\\ndef copy(p,name):\\n assert pathlib.Path(name).name==name and p.is_file() and not p.is_symlink() and p.stat().st_size<4000000\\n data=p.read_bytes();(out/name).write_bytes(data);identities[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}\\nfor name in ('windows-development.json','controller.json','export-receipt.json','applied-patches.json','linux-linux-test-report.json','linux-backend-tests.xml'):\\n copy(state/name,name)\\nfor name in ('host-tests.log','tools-tests.log','node-tests.log','gradle.log'):\\n files=list(state.glob('*-'+name));assert len(files)==1;copy(files[0],name)\\nfor name in ('linux-backend-full-suite.log','linux-health-openapi.log'):\\n copy(state/name,name)\\ntests=[]\\nfor f in sorted((root/'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):\\n tree=ET.parse(f).getroot();assert tree.tag=='testsuite'\\n row={k:int(tree.get(k,'0')) for k in ('tests','failures','errors','skipped')};row['name']=tree.get('name');tests.append(row);copy(f,'android-'+f.name)\\nassert tests and all(x['failures']==0 and x['errors']==0 for x in tests)\\napks={}\\nfor name,ident in report['apks'].items():\\n p=root/name;assert p.is_file() and p.stat().st_size==ident['bytes'] and sha(p)==ident['sha256'];apks[name]=ident\\nhost=(out/'host-tests.log').read_text(encoding='utf-8',errors='replace')\\nmatch=re.search(r'Ran (\\\\d+) tests in ([0-9.]+)s',host);assert match\\nassert re.search(r'^OK(?: \\\\(skipped=\\\\d+\\\\))?\\\\s*$',host,re.M)\\nandroid={k:sum(x[k] for x in tests) for k in ('tests','failures','errors','skipped')}\\nbackend=(state/'linux-backend-full-suite.log').read_text(encoding='utf-8',errors='replace')\\nlinux=json.loads((state/'linux-linux-test-report.json').read_text(encoding='utf-8'))\\nresult={'run_id':run,'source_root':str(root),'source_sha256':report['source_sha256'],'base_commit':report['base_commit'],'source_unchanged':True,'apks':apks,'certificate_sha256':report['certificate_sha256'],'host_tests':int(match.group(1)),'host_seconds':float(match.group(2)),'host_summary':host[-300:],'android_jvm':{'suites':len(tests),**android},'backend_tail':backend[-2000:],'linux_report':linux,'check':report['check'],'build':report['build'],'external_quality_gate':report['external_quality_gate'],'owned_processes_after':controller['owned_processes_after'],'identities':identities}\\n(out/'manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')\\nprint(json.dumps({'folder':str(out),'report':result},ensure_ascii=True))\\n\"],{encoding:'utf8',timeout:120000,maxBuffer:200000,env:{...process.env,PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8'}});\nif(r.status!==0)throw Error('Proof failed: '+r.stderr.slice(-2500));const value=JSON.parse(r.stdout);const report=value.report;delete report.identities;const fence=String.fromCharCode(96).repeat(3);const summary=fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence;if(summary.length>60000)throw Error('Proof summary too large');\nawait github.rest.checks.create({...context.repo,name:'N00 candidate42 exact build proof',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Verified laptop source, APKs and actual test reports',summary}});core.setOutput('folder',value.folder);"
      - name: Preserve exact build report evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n00-candidate42-build-proof
          path: ${{ steps.evidence.outputs.folder }}
          if-no-files-found: error
          retention-days: 3
