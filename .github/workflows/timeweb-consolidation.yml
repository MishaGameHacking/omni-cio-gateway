name: Audit Timeweb consolidation and preserve working app
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-consolidation.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-consolidation
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Read server, storage and signing identities without runtime changes
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error

        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
                with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                    raw=r.read(4194305);assert len(raw)<=4194304
                    return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))

        from contextlib import contextmanager
        import importlib.util,stat
        @contextmanager
        def owned_remote(sid,name,ip,host):
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["id"]==sid and server["name"]==name and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            assert server.get("is_qemu_agent") is True and server.get("status")=="on"
            with tempfile.TemporaryDirectory(prefix="analyst-runtime-stage-access-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);folder.chmod(0o700)
                p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                access.SERVER_ID=sid
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-runtime-stage-"+os.environ["GITHUB_RUN_ID"]+"-"+str(sid),"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.SERVER_ID=sid
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    command=p.ssh_command(folder,ip,host);command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(24):
                        try:
                            check=subprocess.run([*command,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                            if check.returncode==0:break
                            if attempt in (0,11,23):print("RUNTIME_STAGE_SSH_WAIT="+json.dumps({"server_id":sid,"attempt":attempt+1,"exit_code":check.returncode,"stderr":check.stderr.decode(errors="replace")[-1500:]}),flush=True)
                            if attempt==23:raise RuntimeError("runtime_stage_ssh_not_ready")
                        except subprocess.TimeoutExpired:
                            if attempt==23:raise
                        time.sleep(5)
                    yield command
                finally:
                    try:
                        access.SERVER_ID=sid
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("RUNTIME_STAGE_TEMP_KEY_REMOVED="+str(sid),flush=True)

        def scalar(row, keys):
            return {k:row.get(k) for k in keys if row.get(k) is None or type(row.get(k)) in (str,int,float,bool)}
        servers=[]
        for offset in range(0,2000,100):
            status,payload=api('GET','/servers?limit=100&offset='+str(offset));assert status==200
            rows=payload['servers'];assert isinstance(rows,list)
            for row in rows:
                item=scalar(row,('id','name','status','project_id','availability_zone','location','preset_id','cpu','ram','disk','is_qemu_agent','is_delete_protection','is_protected','boot_mode'))
                if isinstance(row.get('configuration'),dict):item['configuration']=scalar(row['configuration'],('cpu','ram','disk','price','price_hour'))
                item['public_ipv4']=p.cloud.public_ipv4(row)
                item['disks']=[scalar(d,('id','size','type','is_system')) for d in row.get('disks',[])]
                servers.append(item)
            if len(rows)<100:break
        else:raise RuntimeError('pagination_exhausted')
        print('CLEANUP_SERVERS='+json.dumps(servers),flush=True)
        status,payload=api('GET','/floating-ips');assert status==200
        rows=payload.get('floating_ips',payload.get('floating-ips'));assert isinstance(rows,list)
        print('CLEANUP_IPS='+json.dumps([scalar(row,('id','ip','availability_zone','project_id','resource_type','resource_id','is_ddos_guard')) for row in rows]),flush=True)
        status,payload=api('GET','/projects/2941515/resources');assert status==200
        print('CLEANUP_PROJECT_RESOURCES='+json.dumps({k:([scalar(x,('id','name','status','location')) for x in v] if k=='dedicated_servers' else len(v)) for k,v in payload.items() if isinstance(v,list)}),flush=True)
        remote="import hashlib, json, os, pathlib, shutil, stat, subprocess\n\ndef digest(path):\n    with path.open('rb') as stream:\n        return hashlib.file_digest(stream, 'sha256').hexdigest()\n\nassert os.geteuid() == 0\nresult = {'hostname': os.uname().nodename, 'disk': dict(zip(('total','used','free'),shutil.disk_usage('/'))), 'memory': {}}\nfor line in pathlib.Path('/proc/meminfo').read_text().splitlines():\n    key = line.split(':',1)[0]\n    if key in ('MemTotal','MemAvailable','SwapTotal','SwapFree'):\n        result['memory'][key] = int(line.split()[1]) * 1024\nresult['units'] = {}\nfor unit in ('analyst-ai-owner.service','analyst-ai-updates.service','caddy.service'):\n    raw = subprocess.check_output(['systemctl','show',unit,'--no-pager','-p','ActiveState','-p','MainPID','-p','ControlPID','-p','UnitFileState'],timeout=20,text=True)\n    fields = dict(line.split('=',1) for line in raw.splitlines() if '=' in line)\n    result['units'][unit] = fields\n    if unit == 'analyst-ai-owner.service' and int(fields.get('MainPID','0')):\n        environment = pathlib.Path('/proc') / fields['MainPID'] / 'environ'\n        effective = dict(item.split(b'=',1) for item in environment.read_bytes().split(b'\\0') if b'=' in item)\n        result['effective_flags'] = {k: effective.get(k.encode(), b'<absent>').decode() for k in ('ANALYSIS_SCHEDULER_ENABLED','SANDBOX_WORKER_ENABLED','AI_EXTERNAL_PROCESSING_APPROVED')}\nresult['paths'] = []\nroots = ('/srv/analyst-ai','/var/lib/analyst-ai-build','/var/backups/analyst-ai','/root','/opt/analyst-android-sdk','/opt/analyst-ai','/opt/analyst-ai-updates','/srv/analyst-ai-ota')\nfor name in roots:\n    p = pathlib.Path(name)\n    if not p.exists():\n        result['paths'].append({'path':name,'exists':False}); continue\n    s = p.lstat()\n    row = {'path':name,'mode':oct(stat.S_IMODE(s.st_mode)),'uid':s.st_uid,'gid':s.st_gid}\n    raw = subprocess.check_output(['du','-sx','--block-size=1',name],timeout=90,text=True)\n    row['disk_bytes'] = int(raw.split()[0])\n    if p.is_dir():\n        row['children'] = [x.name for x in sorted(p.iterdir()) if name != '/root' or 'analyst' in x.name or x.name in ('.android','.gradle')][:60]\n    result['paths'].append(row)\nresult['signing_files'] = []\nfor name in ('/srv/analyst-ai','/var/lib/analyst-ai-build','/var/backups/analyst-ai','/root/.android'):\n    base = pathlib.Path(name)\n    if not base.is_dir(): continue\n    for directory, folders, files in os.walk(base, followlinks=False):\n        folders[:] = [x for x in folders if x not in ('caches','node_modules','sdk','system-images','emulator','venv','.venv') and not (pathlib.Path(directory)/x).is_symlink()]\n        for filename in files:\n            if not filename.endswith(('.keystore','.jks')): continue\n            p = pathlib.Path(directory)/filename; s = p.lstat()\n            if stat.S_ISREG(s.st_mode): result['signing_files'].append({'path':str(p),'bytes':s.st_size,'sha256':digest(p),'mode':oct(stat.S_IMODE(s.st_mode)),'uid':s.st_uid})\nresult['runtime_identity'] = {}\nfor name in ('/etc/analyst-ai/backend.env','/var/lib/analyst-ai/backend.db','/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json'):\n    p=pathlib.Path(name)\n    if p.is_file(): result['runtime_identity'][name]={'bytes':p.stat().st_size,'sha256':digest(p)}\np=pathlib.Path('/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json')\nif p.is_file():\n    current=json.loads(p.read_bytes())\n    result['release']={k:current.get(k) for k in ('version_code','version_name','apk_sha256','apk_bytes','certificate_sha256')}\nprint(json.dumps(result,sort_keys=True),flush=True)\n"
        for sid,name,ip,host in [(9415007,'Analyst AI PRO','83.217.195.29','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0'),(9417611,'Analyst AI runtime 20261025','31.130.128.55','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g')]:
            with owned_remote(sid,name,ip,host) as command:
                data=p.remote(command,'python3 -',remote.encode(),timeout=300)
                result=json.loads(data);result['server_id']=sid
                print('CLEANUP_HOST_AUDIT='+json.dumps(result),flush=True)

        PY
