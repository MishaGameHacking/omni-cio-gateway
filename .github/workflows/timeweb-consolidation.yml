name: Remove verified redundant Timeweb server and temporary IP
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-consolidation.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-consolidation
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Recheck preserved data and live replacement, then delete only the retired server and IP
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error

        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            attempts=5 if method=='GET' else 1
            for attempt in range(attempts):
                try:
                    with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                        raw=r.read(4194305);assert len(raw)<=4194304
                        return r.status,json.loads(raw) if raw else {}
                except urllib.error.HTTPError as e:
                    result=(e.code,p.cloud.error_details(e.read(65536)))
                    if method!='GET' or e.code not in (429,500,502,503,504) or attempt==attempts-1:return result
                    failure='http_'+str(e.code)
                except (TimeoutError,urllib.error.URLError) as e:
                    if method!='GET' or attempt==attempts-1:raise
                    failure=type(e).__name__
                print('TIMEWEB_READ_RETRY='+json.dumps({'path':path,'attempt':attempt+1,'reason':failure}),flush=True)
                time.sleep(min(2**(attempt+1),15))

        from contextlib import contextmanager
        import importlib.util,stat
        @contextmanager
        def owned_remote(sid,name,ip,host):
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["id"]==sid and server["name"]==name and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            assert server.get("is_qemu_agent") is True and server.get("status")=="on"
            with tempfile.TemporaryDirectory(prefix="analyst-runtime-stage-access-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);folder.chmod(0o700)
                p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                access.SERVER_ID=sid
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-runtime-stage-"+os.environ["GITHUB_RUN_ID"]+"-"+str(sid),"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.SERVER_ID=sid
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    command=p.ssh_command(folder,ip,host);command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(24):
                        try:
                            check=subprocess.run([*command,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                            if check.returncode==0:break
                            if attempt in (0,11,23):print("RUNTIME_STAGE_SSH_WAIT="+json.dumps({"server_id":sid,"attempt":attempt+1,"exit_code":check.returncode,"stderr":check.stderr.decode(errors="replace")[-1500:]}),flush=True)
                            if attempt==23:raise RuntimeError("runtime_stage_ssh_not_ready")
                        except subprocess.TimeoutExpired:
                            if attempt==23:raise
                        time.sleep(5)
                    yield command
                finally:
                    try:
                        access.SERVER_ID=sid
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("RUNTIME_STAGE_TEMP_KEY_REMOVED="+str(sid),flush=True)

        CHECK='import hashlib,json,os,pathlib,sqlite3,stat,subprocess,sys\n\ndef need(value,code):\n    if not value:raise RuntimeError(code)\ndef sha(path):\n    with path.open(\'rb\') as stream:return hashlib.file_digest(stream,\'sha256\').hexdigest()\ndef trusted(path):\n    s=path.lstat();need(stat.S_ISREG(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022 and path.resolve()==path,\'untrusted_receipt\')\n\nneed(os.geteuid()==0,\'root_required\')\nrole,stage=sys.argv[1:3]\nneed(stage==\'runtime-final-20261025-40213299556\',\'unexpected_cutover_stage\')\nbase=pathlib.Path(\'/root/.analyst-runtime-stage-\'+stage)\nunits={}\nfor unit in (\'analyst-ai-owner.service\',\'analyst-ai-updates.service\',\'caddy.service\'):\n    text=subprocess.check_output([\'systemctl\',\'show\',unit,\'--no-pager\',\'-p\',\'ActiveState\',\'-p\',\'MainPID\',\'-p\',\'ControlPID\',\'-p\',\'UnitFileState\'],timeout=15,text=True)\n    units[unit]=dict(line.split(\'=\',1) for line in text.splitlines() if \'=\' in line)\nif role==\'old\':\n    need(os.uname().nodename==\'analyst-ai-ams-main\',\'unexpected_old_host\')\n    path=base/\'retired-old-receipt.json\';trusted(path);receipt=json.loads(path.read_bytes())\n    need(receipt[\'retired\'] is True and receipt[\'replacement_id\']==9417611,\'retirement_not_recorded\')\n    need(all(row[\'ActiveState\']==\'inactive\' and row[\'MainPID\']==\'0\' and row[\'ControlPID\']==\'0\' and row[\'UnitFileState\']==\'disabled\' for row in units.values()),\'old_runtime_still_active\')\n    result={\'server_id\':9415007,\'retired\':True,\'units\':units,\'safe_to_delete_after_replacement_verification\':True}\nelse:\n    need(role==\'new\' and os.uname().nodename==\'analyst-ai-runtime-20261025\',\'unexpected_replacement_host\')\n    path=base/\'cutover-complete.json\';trusted(path);receipt=json.loads(path.read_bytes())\n    need(receipt[\'old_server_id\']==9415007 and receipt[\'new_server_id\']==9417611 and receipt[\'active_ip\']==\'83.217.195.29\',\'wrong_cutover_identity\')\n    need(all(row[\'ActiveState\']==\'active\' and int(row[\'MainPID\'])>0 and row[\'UnitFileState\']==\'enabled\' for row in units.values()),\'replacement_runtime_not_running\')\n    need(sha(base/\'runtime.tar\')==receipt[\'runtime_archive_sha256\'],\'final_runtime_backup_changed\')\n    archive=pathlib.Path(\'/var/backups/analyst-ai-retired-9415007-20261025/preservation.tar.gz\');trusted(archive)\n    need(archive.stat().st_size==706187073 and sha(archive)==\'8b29d3c1e790281f99f9ed824c7d8d6b1c183df43c0e4e6af0ec810f8f518ec9\',\'preservation_archive_changed\')\n    need(sha(pathlib.Path(\'/etc/analyst-ai/backend.env\'))==\'4fd25800431cc948a45b5bf067102b6fb26f443361628000e1194b6818bb79e6\',\'runtime_credentials_changed\')\n    current=json.loads(pathlib.Path(\'/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json\').read_bytes())\n    need(current[\'version_code\']==38 and current[\'apk_sha256\']==\'058e307855cad135a30bccc8a4a5bafc96638fd8400ba31fda0af07f255d0bef\',\'replacement_apk_changed\')\n    code="import sqlite3,json; c=sqlite3.connect(\'file:/var/lib/analyst-ai/backend.db?mode=ro\',uri=True,timeout=15);c.execute(\'PRAGMA query_only=ON\');assert c.execute(\'PRAGMA quick_check\').fetchall()==[(\'ok\',)];assert c.execute(\'PRAGMA foreign_key_check\').fetchone() is None;print(json.dumps({\'quick_check\':\'ok\',\'foreign_key_check\':\'ok\'}));c.close()"\n    probe=subprocess.run([\'runuser\',\'-u\',\'analyst-ai\',\'--\',\'/opt/analyst-ai/venv/bin/python\',\'-c\',code],stdin=subprocess.DEVNULL,capture_output=True,timeout=45)\n    need(probe.returncode==0,\'replacement_database_integrity_failed\')\n    root=pathlib.Path(\'/var/lib/analyst-ai-build\')\n    if not root.exists():root.mkdir(mode=0o750);os.chown(root,995,986)\n    s=root.lstat();need(stat.S_ISDIR(s.st_mode) and not root.is_symlink() and s.st_uid==995 and s.st_gid==986 and stat.S_IMODE(s.st_mode)==0o750,\'future_archive_home_invalid\')\n    result={\'server_id\':9417611,\'active\':True,\'units\':units,\'database\':json.loads(probe.stdout),\'preservation_sha256\':receipt[\'preservation\'][\'sha256\'],\'runtime_archive_sha256\':receipt[\'runtime_archive_sha256\'],\'apk_version\':38,\'future_windows_archive_home_ready\':True}\nprint(json.dumps(result,sort_keys=True),flush=True)\n'
        def public_probe(*,resolve_ip=None):
            prefix=['curl','--noproxy','*','--silent','--show-error','--fail','--connect-timeout','10','--max-time','90']
            if resolve_ip:prefix+=['--resolve',DOMAIN+':443:'+resolve_ip]
            def read(path):
                result=subprocess.run([*prefix,'https://'+DOMAIN+path],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=95)
                assert result.returncode==0 and len(result.stdout)<16384,'https_probe_failed'
                return json.loads(result.stdout)
            assert read('/health')=={'status':'ok'}
            policy=read('/client/update-policy?package_name=ru.omnicio.app.debug')
            assert policy['version_code']==38 and policy['apk_sha256']==APK_SHA and policy['apk_bytes']==29754870
            path='/client/apk/Analyst-AI-38-'+APK_SHA+'.apk';assert policy['apk_path']==path
            with tempfile.TemporaryFile() as output:
                result=subprocess.run([*prefix,'https://'+DOMAIN+path],stdin=subprocess.DEVNULL,stdout=output,stderr=subprocess.PIPE,timeout=95)
                assert result.returncode==0
                assert output.tell()==29754870;output.seek(0)
                assert hashlib.file_digest(output,'sha256').hexdigest()==APK_SHA
            status_command=['curl','--noproxy','*','--silent','--show-error','--connect-timeout','10','--max-time','30','--output','/dev/null','--write-out','%{http_code}']
            if resolve_ip:status_command+=['--resolve',DOMAIN+':443:'+resolve_ip]
            r=subprocess.run([*status_command,'https://'+DOMAIN+'/workspace'],stdin=subprocess.DEVNULL,capture_output=True,timeout=35)
            assert r.returncode==0 and r.stdout==b'401','public_private_route_not_protected'
            return {'health_http':200,'workspace_without_session_http':401,'policy_version':38,'apk_bytes':29754870,'apk_sha256':APK_SHA,'tls_verified':True}

        import datetime
        DOMAIN='analyst-ai-2941515.twc1.net'
        APK_SHA='058e307855cad135a30bccc8a4a5bafc96638fd8400ba31fda0af07f255d0bef'
        MAIN_FLOAT='b77b2b7c-cd0e-4434-b096-27ef94ddcc86'
        TEMP_FLOAT='fa1ee0ae-0d98-42cc-92c6-e4bda4ff88d0'
        STAGE='runtime-final-20261025-40213299556'
        def server(sid,name,ip,cpu,ram):
            status,data=api('GET','/servers/'+str(sid));assert status==200
            s=data['server'];assert s['id']==sid and s['name']==name and s['project_id']==2941515 and s['availability_zone']=='ams-1'
            assert s['status']=='on' and s['cpu']==cpu and s['ram']==ram and p.cloud.public_ipv4(s)==ip
            assert len(s['disks'])==1 and s['disks'][0]['is_system'] is True and s['disks'][0]['size']==30720
            return {'id':sid,'name':name,'cpu':cpu,'ram_mb':ram,'disk_mb':30720,'ip':ip,'availability_zone':'ams-1'}
        def ips():
            status,data=api('GET','/floating-ips');assert status==200
            return data['ips']
        def exact_ip(rows,identifier,address,resource):
            matching=[row for row in rows if row['id']==identifier];assert len(matching)==1
            row=matching[0];assert row['ip']==address and row['project_id']==2941515 and row['availability_zone']=='ams-1'
            assert row['resource_id']==resource and row['resource_type']==('server' if resource is not None else None)
            return row
        def host_check(command,role):
            result=subprocess.run([*command,shlex.join(['python3','-c',CHECK,role,STAGE])],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
            if result.returncode:
                print('RETIREMENT_CHECK_ERROR='+result.stderr.decode(errors='replace')[-1500:],flush=True)
                raise RuntimeError('retirement_'+role+'_check_failed')
            assert len(result.stdout)<16384
            return json.loads(result.stdout)
        old_meta=server(9415007,'Analyst AI PRO','31.130.128.55',4,6144)
        new_meta=server(9417611,'Analyst AI runtime 20261025','83.217.195.29',2,4096)
        rows=ips();exact_ip(rows,MAIN_FLOAT,'83.217.195.29',9417611);exact_ip(rows,TEMP_FLOAT,'31.130.128.55',9415007)
        print('RETIREMENT_API_IDENTITIES='+json.dumps({'old':old_meta,'replacement':new_meta}),flush=True)
        with owned_remote(9417611,'Analyst AI runtime 20261025','83.217.195.29','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g') as new:
            new_check=host_check(new,'new')
            with owned_remote(9415007,'Analyst AI PRO','31.130.128.55','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0') as old:
                old_check=host_check(old,'old')
            before=public_probe()
            print('RETIREMENT_PREDELETE_VERIFIED='+json.dumps({'replacement':new_check,'retired':old_check,'https':before}),flush=True)
            server(9415007,'Analyst AI PRO','31.130.128.55',4,6144)
            server(9417611,'Analyst AI runtime 20261025','83.217.195.29',2,4096)
            exact_ip(ips(),MAIN_FLOAT,'83.217.195.29',9417611)
            status,data=api('DELETE','/servers/9415007')
            print('RETIREMENT_DELETE_SERVER_HTTP='+str(status),flush=True)
            assert status==204,'server_deletion_not_completed_or_confirmation_required'
            for _ in range(60):
                status,_=api('GET','/servers/9415007')
                if status==404:break
                assert status==200;time.sleep(5)
            else:raise RuntimeError('server_deletion_not_visible')
            for _ in range(36):
                rows=ips();exact_ip(rows,MAIN_FLOAT,'83.217.195.29',9417611)
                matches=[row for row in rows if row['id']==TEMP_FLOAT]
                if not matches:break
                assert len(matches)==1 and matches[0]['ip']=='31.130.128.55' and matches[0]['resource_id'] in (None,9415007)
                if matches[0]['resource_id'] is None:
                    exact_ip(rows,TEMP_FLOAT,'31.130.128.55',None)
                    status,_=api('DELETE','/floating-ips/'+TEMP_FLOAT);assert status==204
                    print('RETIREMENT_DELETE_TEMP_IP_HTTP='+str(status),flush=True);break
                time.sleep(5)
            else:raise RuntimeError('retired_ip_still_attached')
            rows=ips();exact_ip(rows,MAIN_FLOAT,'83.217.195.29',9417611);assert all(row['id']!=TEMP_FLOAT for row in rows)
            servers=[]
            for offset in range(0,2000,100):
                status,data=api('GET','/servers?limit=100&offset='+str(offset));assert status==200
                page=data['servers'];servers.extend({'id':s['id'],'name':s['name'],'project_id':s['project_id']} for s in page)
                if len(page)<100:break
            else:raise RuntimeError('final_inventory_pagination_limit')
            assert len(servers)==1 and servers[0]['id']==9417611,'unexpected_final_server_inventory'
            assert len(rows)==1,'unexpected_final_ip_inventory'
            final_server=server(9417611,'Analyst AI runtime 20261025','83.217.195.29',2,4096)
            status,resources=api('GET','/projects/2941515/resources');assert status==200
            counts={key:len(value) for key,value in resources.items() if isinstance(value,list)}
            assert counts.get('servers')==1 and counts.get('floating_ips')==1 and counts.get('dedicated_servers')==0
            after=public_probe();after_host=host_check(new,'new')
            receipt={'kind':'timeweb_cleanup_complete','finished_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'deleted_server_id':9415007,'deleted_server_name':'Analyst AI PRO','deleted_public_ip':'31.130.128.55','deleted_floating_ip_id':TEMP_FLOAT,'remaining_server':final_server,'remaining_servers':servers,'remaining_public_ips':1,'project_resource_counts':counts,'replacement':after_host,'public':after,'domain_unchanged':DOMAIN,'preservation_archive':'/var/backups/analyst-ai-retired-9415007-20261025/preservation.tar.gz','preservation_sha256':'8b29d3c1e790281f99f9ed824c7d8d6b1c183df43c0e4e6af0ec810f8f518ec9','no_builds_or_application_tests_on_timeweb':True,'phone_installation_not_claimed':True}
            code="import pathlib,os;path=pathlib.Path('/var/backups/analyst-ai-retired-9415007-20261025/deletion-receipt.json');data="+repr(json.dumps(receipt,sort_keys=True).encode())+";fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);f=os.fdopen(fd,'wb');f.write(data);f.flush();os.fsync(f.fileno());f.close()"
            p.remote(new,'python3 -',code.encode(),timeout=30)
            print('TIMEWEB_CLEANUP_COMPLETE='+json.dumps(receipt),flush=True)

        PY
