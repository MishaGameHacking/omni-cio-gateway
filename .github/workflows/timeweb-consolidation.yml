name: Preserve all source, signing and evidence before Timeweb retirement
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-consolidation.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-consolidation
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Copy and verify source, signing key and complete Windows evidence privately
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error

        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
                with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                    raw=r.read(4194305);assert len(raw)<=4194304
                    return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))

        from contextlib import contextmanager
        import importlib.util,stat
        @contextmanager
        def owned_remote(sid,name,ip,host):
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["id"]==sid and server["name"]==name and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            assert server.get("is_qemu_agent") is True and server.get("status")=="on"
            with tempfile.TemporaryDirectory(prefix="analyst-runtime-stage-access-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);folder.chmod(0o700)
                p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                access.SERVER_ID=sid
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-runtime-stage-"+os.environ["GITHUB_RUN_ID"]+"-"+str(sid),"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.SERVER_ID=sid
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    command=p.ssh_command(folder,ip,host);command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(24):
                        try:
                            check=subprocess.run([*command,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                            if check.returncode==0:break
                            if attempt in (0,11,23):print("RUNTIME_STAGE_SSH_WAIT="+json.dumps({"server_id":sid,"attempt":attempt+1,"exit_code":check.returncode,"stderr":check.stderr.decode(errors="replace")[-1500:]}),flush=True)
                            if attempt==23:raise RuntimeError("runtime_stage_ssh_not_ready")
                        except subprocess.TimeoutExpired:
                            if attempt==23:raise
                        time.sleep(5)
                    yield command
                finally:
                    try:
                        access.SERVER_ID=sid
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("RUNTIME_STAGE_TEMP_KEY_REMOVED="+str(sid),flush=True)

        REMOTE='"""Preserve original source, signing key and build evidence before retiring 9415007."""\nimport hashlib, io, json, os, pathlib, shutil, stat, sys, tarfile, time\n\nROOTS = (\'srv/analyst-ai\', \'var/lib/analyst-ai-build\', \'var/backups/analyst-ai\',\n         \'root/.android\', \'root/analyst-ai-enrollment.json\', \'root/analyst-ai-owner.json\',\n         \'root/analyst-ams-bootstrap.py\', \'root/analyst-caddy-package-default\',\n         \'root/analyst-owner-handoff\', \'root/analyst-runtime-preparation.py\')\nKEY = \'var/lib/analyst-ai-build/.android/debug.keystore\'\nKEY_SHA = \'bf4443e8ed6cb10b4ea4c9c0f46751e5955560e8c5f1bbb928b70febfc9e8ef2\'\nEVIDENCE = \'var/lib/analyst-ai-build/incoming/windows-development-40207960042-1/windows-development-evidence.zip\'\nEVIDENCE_SHA = \'e4dde847b35e6f97fc6c398355b71c8c0da0a146474128dd525c901c159cd477\'\nSOURCE_BASE = pathlib.Path(\'/root/.analyst-retirement-9415007-20261025\')\nDEST_BASE = pathlib.Path(\'/var/backups/analyst-ai-retired-9415007-20261025\')\nLIMIT = 4 * 1024**3\n\ndef need(value, message):\n    if not value: raise RuntimeError(message)\n\ndef sha(path):\n    with path.open(\'rb\') as stream: return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\ndef write_new(path, data):\n    fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n    with os.fdopen(fd,\'wb\') as stream:\n        stream.write(data);stream.flush();os.fsync(stream.fileno())\n\ndef scoped(rel):\n    path=pathlib.PurePosixPath(rel)\n    need(not path.is_absolute() and \'..\' not in path.parts and \'\\\\\' not in rel and rel==path.as_posix(), \'invalid_archive_name\')\n    need(any(rel==root or rel.startswith(root+\'/\') for root in ROOTS), \'archive_path_out_of_scope\')\n\ndef private_dir(path):\n    if not path.exists(): path.mkdir(mode=0o700)\n    s=path.lstat()\n    need(stat.S_ISDIR(s.st_mode) and s.st_uid==0 and stat.S_IMODE(s.st_mode)==0o700 and path.resolve()==path,\'unsafe_archive_directory\')\n\ndef prepare():\n    private_dir(SOURCE_BASE)\n    receipt=SOURCE_BASE/\'preservation-receipt.json\'; archive=SOURCE_BASE/\'preservation.tar.gz\'\n    if receipt.exists():\n        prior=json.loads(receipt.read_bytes())\n        need(sha(archive)==prior[\'sha256\'],\'existing_preservation_changed\')\n        return prior\n    need(not archive.exists(),\'incomplete_preservation_archive\')\n    need(sha(pathlib.Path(\'/\')/KEY)==KEY_SHA and sha(pathlib.Path(\'/\')/EVIDENCE)==EVIDENCE_SHA,\'critical_preservation_source_changed\')\n    rows=[]; total=0\n    with tarfile.open(archive,\'x:gz\',compresslevel=1,format=tarfile.PAX_FORMAT,dereference=False) as tar:\n        def add(path,rel):\n            nonlocal total\n            scoped(rel);s=path.lstat()\n            need(len(rows)<100000 and not os.listxattr(path,follow_symlinks=False),\'unsupported_preservation_metadata\')\n            row={\'path\':rel,\'mode\':stat.S_IMODE(s.st_mode),\'uid\':s.st_uid,\'gid\':s.st_gid,\'mtime_ns\':s.st_mtime_ns}\n            info=tarfile.TarInfo(\'payload/\'+rel);info.mode=row[\'mode\'];info.uid=s.st_uid;info.gid=s.st_gid;info.mtime=s.st_mtime_ns/1e9\n            if stat.S_ISDIR(s.st_mode):\n                row[\'kind\']=\'directory\';info.type=tarfile.DIRTYPE;tar.addfile(info)\n            elif stat.S_ISLNK(s.st_mode):\n                row.update(kind=\'symlink\',target=os.readlink(path));info.type=tarfile.SYMTYPE;info.linkname=row[\'target\'];tar.addfile(info)\n            else:\n                need(stat.S_ISREG(s.st_mode),\'unsupported_preservation_file_type\')\n                need(s.st_size<=1024**3,\'oversized_preservation_member\')\n                total+=s.st_size;need(total<LIMIT,\'preservation_payload_exceeds_limit\')\n                row.update(kind=\'file\',bytes=s.st_size,sha256=sha(path));info.type=tarfile.REGTYPE;info.size=s.st_size\n                with path.open(\'rb\') as stream:tar.addfile(info,stream)\n                after=path.stat();need((s.st_ino,s.st_size,s.st_mtime_ns)==(after.st_ino,after.st_size,after.st_mtime_ns),\'preservation_source_changed\')\n            rows.append(row)\n        for rel in ROOTS:\n            path=pathlib.Path(\'/\')/rel\n            if not path.exists() and not path.is_symlink():continue\n            add(path,rel)\n            if path.is_dir() and not path.is_symlink():\n                for directory,dirs,files in os.walk(path,followlinks=False):\n                    for name in sorted(dirs):\n                        child=pathlib.Path(directory)/name;add(child,child.relative_to(\'/\').as_posix())\n                    dirs[:]=sorted(name for name in dirs if not (pathlib.Path(directory)/name).is_symlink())\n                    for name in sorted(files):\n                        child=pathlib.Path(directory)/name;add(child,child.relative_to(\'/\').as_posix())\n        manifest={\'schema\':1,\'source_server_id\':9415007,\'roots\':list(ROOTS),\'files\':rows,\'payload_bytes\':total,\'key_sha256\':KEY_SHA,\'windows_evidence_sha256\':EVIDENCE_SHA}\n        data=json.dumps(manifest,sort_keys=True,separators=(\',\',\':\')).encode()\n        need(len(data)<32*1024**2,\'preservation_manifest_too_large\')\n        info=tarfile.TarInfo(\'manifest.json\');info.mode=0o600;info.size=len(data);tar.addfile(info,io.BytesIO(data))\n    archive.chmod(0o600);need(archive.stat().st_size<LIMIT,\'preservation_archive_too_large\')\n    value={\'source_server_id\':9415007,\'bytes\':archive.stat().st_size,\'sha256\':sha(archive),\'entries\':len(rows),\'payload_bytes\':total,\'manifest_sha256\':hashlib.sha256(data).hexdigest(),\'signing_key_preserved\':True,\'exact_windows_evidence_preserved\':True}\n    write_new(receipt,(json.dumps(value,sort_keys=True)+\'\\n\').encode())\n    return value\n\ndef receive(expected):\n    private_dir(DEST_BASE)\n    final=DEST_BASE/\'preservation.tar.gz\';partial=DEST_BASE/\'preservation.tar.gz.part\'\n    need(not final.exists() and not partial.exists(),\'preservation_target_already_exists\')\n    need(0<expected[\'bytes\']<LIMIT and shutil.disk_usage(DEST_BASE).free>expected[\'bytes\']+4*1024**3,\'preservation_target_capacity\')\n    fd=os.open(partial,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);h=hashlib.sha256();count=0\n    with os.fdopen(fd,\'wb\') as stream:\n        while block:=sys.stdin.buffer.read(1024**2):\n            count+=len(block);need(count<=expected[\'bytes\'],\'incoming_preservation_too_large\');h.update(block);stream.write(block)\n        stream.flush();os.fsync(stream.fileno())\n    need(count==expected[\'bytes\'] and h.hexdigest()==expected[\'sha256\'],\'preservation_transfer_mismatch\')\n    os.replace(partial,final)\n    return verify(expected)\n\ndef verify(expected):\n    archive=DEST_BASE/\'preservation.tar.gz\'\n    need(archive.stat().st_size==expected[\'bytes\'] and sha(archive)==expected[\'sha256\'],\'stored_preservation_mismatch\')\n    observed={};manifest=None\n    with tarfile.open(archive,\'r|gz\') as tar:\n        for entry in tar:\n            if entry.name==\'manifest.json\':\n                need(manifest is None and entry.isfile() and entry.size<32*1024**2,\'invalid_preservation_manifest\')\n                data=tar.extractfile(entry).read();need(hashlib.sha256(data).hexdigest()==expected[\'manifest_sha256\'],\'manifest_hash_mismatch\')\n                manifest=json.loads(data);continue\n            need(entry.name.startswith(\'payload/\'),\'invalid_preservation_entry\')\n            rel=entry.name.removeprefix(\'payload/\');scoped(rel);need(rel not in observed,\'duplicate_preservation_entry\')\n            row={\'mode\':entry.mode,\'uid\':entry.uid,\'gid\':entry.gid}\n            if entry.isfile():\n                with tar.extractfile(entry) as stream: digest=hashlib.file_digest(stream,\'sha256\').hexdigest()\n                row.update(kind=\'file\',bytes=entry.size,sha256=digest)\n            elif entry.isdir():row.update(kind=\'directory\')\n            elif entry.issym():row.update(kind=\'symlink\',target=entry.linkname)\n            else:raise RuntimeError(\'unexpected_preservation_member_type\')\n            observed[rel]=row\n    need(manifest is not None and len(observed)==expected[\'entries\'],\'missing_preservation_entries\')\n    need(set(observed)=={row[\'path\'] for row in manifest[\'files\']},\'preservation_path_set_mismatch\')\n    for row in manifest[\'files\']:\n        need(all(row.get(k)==v for k,v in observed[row[\'path\']].items()),\'preservation_member_mismatch\')\n    need(observed[KEY][\'sha256\']==KEY_SHA and observed[EVIDENCE][\'sha256\']==EVIDENCE_SHA,\'preserved_critical_identity_mismatch\')\n    receipt={**expected,\'destination_server_id\':9417611,\'archive_path\':str(archive),\'all_member_hashes_verified\':True,\'storage_mode\':\'root_only_0600\',\'source_workspace_and_history_preserved\':True}\n    path=DEST_BASE/\'preservation-receipt.json\'\n    encoded=(json.dumps(receipt,sort_keys=True)+\'\\n\').encode()\n    if path.exists():need(path.read_bytes()==encoded,\'preservation_receipt_conflict\')\n    else:write_new(path,encoded)\n    return receipt\n\nos.umask(0o077);need(os.geteuid()==0,\'root_required\')\naction=sys.argv[1];parameters=json.loads(sys.argv[2]) if len(sys.argv)>2 else {}\nif action==\'prepare\':value=prepare()\nelif action==\'download\':\n    p=SOURCE_BASE/\'preservation.tar.gz\';need(p.stat().st_size==parameters[\'bytes\'] and sha(p)==parameters[\'sha256\'],\'source_archive_changed\')\n    with p.open(\'rb\') as stream:shutil.copyfileobj(stream,sys.stdout.buffer,1024**2)\n    raise SystemExit(0)\nelif action==\'receive\':value=receive(parameters)\nelif action==\'verify\':value=verify(parameters)\nelse:raise RuntimeError(\'unknown_preservation_action\')\nprint(json.dumps(value,sort_keys=True),flush=True)\n'
        def call(command, action, parameters=None, input_file=None, output_file=None):
            args=[*command,shlex.join(['python3','-c',REMOTE,action,json.dumps(parameters or {},separators=(',',':'))])]
            r=subprocess.run(args,stdin=input_file or subprocess.DEVNULL,stdout=output_file or subprocess.PIPE,stderr=subprocess.PIPE,timeout=900)
            if r.returncode:
                print('PRESERVATION_ERROR='+r.stderr.decode(errors='replace')[-1500:],flush=True)
                raise RuntimeError('preservation_'+action+'_failed')
            if output_file is None:
                assert len(r.stdout)<16384
                return json.loads(r.stdout)
        with owned_remote(9415007,'Analyst AI PRO','83.217.195.29','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0') as old:
            with owned_remote(9417611,'Analyst AI runtime 20261025','31.130.128.55','ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g') as new:
                expected=call(old,'prepare');print('PRESERVATION_PREPARED='+json.dumps(expected),flush=True)
                with tempfile.TemporaryDirectory(prefix='analyst-preservation-transfer-',dir=os.environ['RUNNER_TEMP']) as temp:
                    local=pathlib.Path(temp)/'preservation.tar.gz'
                    with local.open('xb') as stream:call(old,'download',expected,output_file=stream)
                    with local.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==expected['sha256']
                    assert local.stat().st_size==expected['bytes']
                    with local.open('rb') as stream:result=call(new,'receive',expected,input_file=stream)
                print('PRESERVATION_VERIFIED='+json.dumps(result),flush=True)

        PY
