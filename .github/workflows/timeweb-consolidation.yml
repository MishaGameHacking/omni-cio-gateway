        def call(command,action,parameters=None,input_file=None,output_file=None):
            args=[*command,shlex.join(['python3','-c',REMOTE,action,STAGE,json.dumps(parameters or {},separators=(',',':'))])]
            r=subprocess.run(args,stdin=input_file or subprocess.DEVNULL,stdout=output_file or subprocess.PIPE,stderr=subprocess.PIPE,timeout=480)
            if r.returncode:
                print('FINAL_RUNTIME_ERROR='+r.stderr.decode(errors='replace')[-2000:],flush=True)
                raise RuntimeError('final_runtime_'+action+'_failed')
            if output_file is None:
                assert len(r.stdout)<65536
                return json.loads(r.stdout)

        def floating(identifier):
            status,data=api('GET','/floating-ips');assert status==200
            rows=[row for row in data['ips'] if row['id']==identifier];assert len(rows)==1
            row=rows[0]
            assert row['availability_zone']=='ams-1' and row['project_id']==2941515
            assert row['ip']=={MAIN_FLOAT:OLD_IP,TEMP_FLOAT:NEW_IP}[identifier]
            assert row['resource_type'] in (None,'server')
            assert row['resource_id'] in (None,OLD_ID,NEW_ID)
            return row

        def await_assignment(identifier,server_id):
            for _ in range(36):
                row=floating(identifier)
                if row['resource_id']==server_id and row['resource_type']==('server' if server_id else None):return
                time.sleep(5)
            raise RuntimeError('floating_assignment_timeout')

        def assign(identifier,server_id):
            row=floating(identifier)
            if row['resource_id']==server_id:return
            if row['resource_id'] is not None:
                status,_=api('POST','/floating-ips/'+identifier+'/unbind');assert status==204
                await_assignment(identifier,None)
            if server_id is not None:
                status,_=api('POST','/floating-ips/'+identifier+'/bind',{'resource_type':'server','resource_id':server_id});assert status==204
                await_assignment(identifier,server_id)
            print('FINAL_IP_ASSIGNMENT='+json.dumps({'id':identifier,'resource_id':server_id}),flush=True)

        def repoint(command,ip,host):
            folder=pathlib.Path(command[command.index('-i')+1]).parent
            command[:]=p.ssh_command(folder,ip,host)
            command[1:1]=['-o','ServerAliveInterval=20','-o','ServerAliveCountMax=3']

        def wait_ssh(command,hostname):
            query='python3 -c '+shlex.quote('import os;assert os.geteuid()==0 and os.uname().nodename=='+repr(hostname))
            for _ in range(36):
                try:
                    r=subprocess.run([*command,query],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=10)
                    if r.returncode==0:return
                except subprocess.TimeoutExpired:pass
                time.sleep(5)
            raise RuntimeError('pinned_host_not_reachable_after_ip_change')

        def public_probe(*,resolve_ip=None):
            prefix=['curl','--noproxy','*','--silent','--show-error','--fail','--connect-timeout','10','--max-time','90']
            if resolve_ip:prefix+=['--resolve',DOMAIN+':443:'+resolve_ip]
            def read(path):
                result=subprocess.run([*prefix,'https://'+DOMAIN+path],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=95)
                assert result.returncode==0 and len(result.stdout)<16384,'https_probe_failed'
                return json.loads(result.stdout)
            assert read('/health')=={'status':'ok'}
            policy=read('/client/update-policy?package_name=ru.omnicio.app.debug')
            assert policy['version_code']==38 and policy['apk_sha256']==APK_SHA and policy['apk_bytes']==29754870
            path='/client/apk/Analyst-AI-38-'+APK_SHA+'.apk';assert policy['apk_path']==path
            with tempfile.TemporaryFile() as output:
                result=subprocess.run([*prefix,'https://'+DOMAIN+path],stdin=subprocess.DEVNULL,stdout=output,stderr=subprocess.PIPE,timeout=95)
                assert result.returncode==0
                assert output.tell()==29754870;output.seek(0)
                assert hashlib.file_digest(output,'sha256').hexdigest()==APK_SHA
            status_command=['curl','--noproxy','*','--silent','--show-error','--connect-timeout','10','--max-time','30','--output','/dev/null','--write-out','%{http_code}']
            if resolve_ip:status_command+=['--resolve',DOMAIN+':443:'+resolve_ip]
            r=subprocess.run([*status_command,'https://'+DOMAIN+'/workspace'],stdin=subprocess.DEVNULL,capture_output=True,timeout=35)
            assert r.returncode==0 and r.stdout==b'401','public_private_route_not_protected'
            return {'health_http':200,'workspace_without_session_http':401,'policy_version':38,'apk_bytes':29754870,'apk_sha256':APK_SHA,'tls_verified':True}


