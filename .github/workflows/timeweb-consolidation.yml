name: Activate the preserved runtime after Timeweb IP transfer
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-consolidation.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-consolidation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Restore original service startup after verifying the old runtime is stopped
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error

        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
                with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                    raw=r.read(4194305);assert len(raw)<=4194304
                    return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))

        from contextlib import contextmanager
        import importlib.util,stat
        @contextmanager
        def owned_remote(sid,name,ip,host):
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["id"]==sid and server["name"]==name and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            assert server.get("is_qemu_agent") is True and server.get("status")=="on"
            with tempfile.TemporaryDirectory(prefix="analyst-runtime-stage-access-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);folder.chmod(0o700)
                p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                access.SERVER_ID=sid
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-runtime-stage-"+os.environ["GITHUB_RUN_ID"]+"-"+str(sid),"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.SERVER_ID=sid
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    command=p.ssh_command(folder,ip,host);command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(24):
                        try:
                            check=subprocess.run([*command,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                            if check.returncode==0:break
                            if attempt in (0,11,23):print("RUNTIME_STAGE_SSH_WAIT="+json.dumps({"server_id":sid,"attempt":attempt+1,"exit_code":check.returncode,"stderr":check.stderr.decode(errors="replace")[-1500:]}),flush=True)
                            if attempt==23:raise RuntimeError("runtime_stage_ssh_not_ready")
                        except subprocess.TimeoutExpired:
                            if attempt==23:raise
                        time.sleep(5)
                    yield command
                finally:
                    try:
                        access.SERVER_ID=sid
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("RUNTIME_STAGE_TEMP_KEY_REMOVED="+str(sid),flush=True)

        REMOTE='\nimport datetime, grp, hashlib, io, json, os, pathlib, platform, pwd, re\nimport shutil, signal, sqlite3, stat, subprocess, sys, sysconfig, tarfile, time\nfrom contextlib import closing\n\nLIMIT = 1024 ** 3\nMAX_FILES = 20000\nROOTS = (\n    \'opt/analyst-ai\', \'opt/analyst-ai-updates\', \'etc/analyst-ai\', \'etc/caddy\',\n    \'var/lib/analyst-ai\', \'var/lib/caddy\', \'srv/analyst-ai-ota\', \'usr/bin/caddy\',\n    \'usr/lib/systemd/system/caddy.service\',\n    \'etc/systemd/system/analyst-ai-owner.service\',\n    \'etc/systemd/system/analyst-ai-updates.service\',\n)\nUNITS = (\'analyst-ai-owner.service\', \'analyst-ai-updates.service\', \'caddy.service\')\nIDS = {\'root\': (0, 0), \'analyst-ai\': (994, 985),\n       \'analyst-build\': (995, 986), \'caddy\': (997, 987)}\nHOMES = {\'analyst-ai\': \'/var/lib/analyst-ai\',\n         \'analyst-build\': \'/var/lib/analyst-ai-build\', \'caddy\': \'/var/lib/caddy\'}\nDB = pathlib.Path(\'/var/lib/analyst-ai/backend.db\')\nCADDY_SHA = \'9681d054b6e5137d53f6d027188b349e0603fd12ea6334bd0d49da6755432f1b\'\nCA_SHA = \'aa800ef345422d6158c6fafe1c06c429dbda21c3df4bb1ccb45a920ec1111399\'\nCA_REL = \'opt/analyst-ai/backend/certs/russian_trusted_root_ca.pem\'\nENV_REL = \'etc/analyst-ai/backend.env\'\nOVERRIDE = pathlib.Path(\'/etc/systemd/system/analyst-ai-owner.service.d\')\nEXTRA_ENV = pathlib.Path(\'/etc/analyst-ai/migration-stage.env\')\n\ndef need(value, code):\n    if not value:\n        raise RuntimeError(code)\n\ndef stamp():\n    return datetime.datetime.now(datetime.timezone.utc).isoformat()\n\ndef sha(path):\n    with path.open(\'rb\') as stream:\n        return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\ndef private_write(path, data):\n    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n    with os.fdopen(fd, \'wb\') as stream:\n        stream.write(data)\n        stream.flush()\n        os.fsync(stream.fileno())\n\ndef regular(path):\n    s = path.lstat()\n    need(stat.S_ISREG(s.st_mode) and s.st_nlink == 1, \'file_not_regular_single_link\')\n    return s\n\ndef parents_safe(path):\n    for parent in reversed(path.parents):\n        s = parent.lstat()\n        need(stat.S_ISDIR(s.st_mode) and not stat.S_ISLNK(s.st_mode), \'linked_parent\')\n\ndef identity():\n    need(os.geteuid() == 0 and platform.machine() == \'x86_64\', \'root_x86_64_required\')\n    release = dict(line.split(\'=\', 1) for line in pathlib.Path(\'/etc/os-release\').read_text().splitlines() if \'=\' in line)\n    need(release[\'ID\'].strip(\'"\') == \'ubuntu\' and release[\'VERSION_ID\'].strip(\'"\') == \'24.04\', \'unexpected_os\')\n    need(sys.version_info[:2] == (3, 12), \'python312_required\')\n    return {\'os\': \'ubuntu24.04\', \'machine\': platform.machine(),\n            \'python\': platform.python_version(), \'cache_tag\': sys.implementation.cache_tag,\n            \'soabi\': sysconfig.get_config_var(\'SOABI\'), \'multiarch\': sysconfig.get_config_var(\'MULTIARCH\')}\n\ndef stopped_units():\n    answer = {}\n    for unit in UNITS:\n        p = subprocess.run([\'systemctl\', \'show\', unit, \'--no-pager\',\n                            \'-p\', \'LoadState\', \'-p\', \'ActiveState\', \'-p\', \'MainPID\', \'-p\', \'ControlPID\'],\n                           stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n                           timeout=15, check=False)\n        need(p.returncode in (0, 1, 4) and len(p.stdout) < 8192, \'unit_state_unavailable\')\n        fields = dict(line.split(\'=\', 1) for line in p.stdout.decode().splitlines() if \'=\' in line)\n        need(p.returncode == 0 or fields.get(\'LoadState\') == \'not-found\', \'unit_state_query_failed\')\n        need(fields.get(\'ActiveState\') in (\'inactive\', \'failed\')\n             and fields.get(\'MainPID\') == \'0\' and fields.get(\'ControlPID\') == \'0\', \'new_unit_not_stopped\')\n        answer[unit] = fields\n    return answer\n\ndef users():\n    result = {}\n    for name, (uid, gid) in IDS.items():\n        user = pwd.getpwnam(name)\n        group = grp.getgrgid(gid)\n        need(user.pw_uid == uid and user.pw_gid == gid and group.gr_name == name, \'source_identity_changed\')\n        if name != \'root\':\n            need(user.pw_dir == HOMES[name] and user.pw_shell in (\'/usr/sbin/nologin\', \'/bin/false\', \'/bin/bash\'), \'source_service_account_changed\')\n        result[name] = {\'uid\': uid, \'gid\': gid, \'home\': user.pw_dir, \'shell\': user.pw_shell}\n    return result\n\ndef new_empty():\n    for rel in ROOTS:\n        path = pathlib.Path(\'/\') / rel\n        need(not os.path.lexists(path), \'new_runtime_path_already_exists\')\n        parents_safe(path)\n    need(not os.path.lexists(OVERRIDE), \'new_owner_override_already_exists\')\n    for unit in UNITS:\n        need(not os.path.lexists(pathlib.Path(\'/etc/systemd/system/multi-user.target.wants\') / unit), \'new_unit_already_enabled\')\n    need(shutil.disk_usage(\'/\').free >= 3 * LIMIT, \'new_runtime_disk_capacity\')\n    return stopped_units()\n\ndef database_check(path):\n    # Every caller supplies a closed backup or an offline new-server copy.\n    # Avoid creating root-owned WAL/SHM beside the service-owned restored DB.\n    with closing(sqlite3.connect(path.as_uri() + \'?mode=ro&immutable=1\', uri=True, timeout=10)) as con:\n        con.execute(\'PRAGMA query_only=ON\')\n        need(con.execute(\'PRAGMA quick_check\').fetchall() == [(\'ok\',)], \'sqlite_quick_check_failed\')\n        need(con.execute(\'PRAGMA foreign_key_check\').fetchone() is None, \'sqlite_foreign_key_check_failed\')\n        table_count = con.execute("SELECT count(*) FROM sqlite_master WHERE type=\'table\'").fetchone()[0]\n    return {\'quick_check\': \'ok\', \'foreign_key_check\': \'ok\', \'table_count\': table_count}\n\ndef allowed_rel(rel):\n    pure = pathlib.PurePosixPath(rel)\n    need(isinstance(rel, str) and rel == pure.as_posix() and not pure.is_absolute()\n         and \'\\\\\' not in rel and \'\\x00\' not in rel and all(x not in (\'.\', \'..\') for x in pure.parts)\n         and any(rel == root or rel.startswith(root + \'/\') for root in ROOTS), \'archive_path_out_of_scope\')\n\ndef link_allowed(rel, target):\n    for root in (\'opt/analyst-ai/venv\', \'opt/analyst-ai-updates/venv\'):\n        expected = {\n            root + \'/bin/python\': (\'python3\', \'python3.12\'),\n            root + \'/bin/python3\': (\'/usr/bin/python3\', \'python3.12\'),\n            root + \'/bin/python3.12\': (\'python3\', \'/usr/bin/python3.12\'),\n            root + \'/lib64\': (\'lib\',),\n        }\n        if rel in expected:\n            need(target in expected[rel], \'unexpected_venv_symlink_target\')\n            return\n    raise RuntimeError(\'unreviewed_runtime_symlink\')\n\ndef metadata(path, rel, effective=None):\n    allowed_rel(rel)\n    s = path.lstat() if effective is None else effective\n    # Do not silently discard ACLs, file capabilities or other extended permissions.\n    need(not os.listxattr(path, follow_symlinks=False), \'source_extended_attributes_require_review\')\n    user, group = pwd.getpwuid(s.st_uid).pw_name, grp.getgrgid(s.st_gid).gr_name\n    need(user in IDS and group in IDS, \'unreviewed_file_owner\')\n    need(not stat.S_IMODE(s.st_mode) & 0o7000, \'special_permission_bits\')\n    return {\'path\': rel, \'mode\': stat.S_IMODE(s.st_mode), \'user\': user, \'group\': group,\n            \'mtime_ns\': s.st_mtime_ns}\n\ndef snapshot(stage):\n    system = identity()\n    named = users()\n    for rel in ROOTS:\n        path = pathlib.Path(\'/\') / rel\n        parents_safe(path)\n        need(path.exists() and not path.is_symlink(), \'source_root_missing_or_linked\')\n    need(sha(pathlib.Path(\'/usr/bin/caddy\')) == CADDY_SHA, \'caddy_binary_changed\')\n    need(sha(pathlib.Path(\'/\') / CA_REL) == CA_SHA, \'pinned_ca_changed\')\n    need(not stage.exists(), \'old_stage_exists_reconcile\')\n    stage.mkdir(mode=0o700)\n    stage.chmod(0o700)\n    original_db = regular(DB)\n    backup = stage / \'backend.snapshot.db\'\n    deadline = time.monotonic() + 240\n    def progress(*_):\n        need(time.monotonic() < deadline, \'sqlite_backup_deadline\')\n    with closing(sqlite3.connect(DB.as_uri() + \'?mode=ro\', uri=True, timeout=10)) as src:\n        src.execute(\'PRAGMA query_only=ON\')\n        with closing(sqlite3.connect(backup, timeout=10)) as dst:\n            src.backup(dst, pages=128, progress=progress, sleep=0.05)\n    backup.chmod(0o600)\n    db_check = database_check(backup)\n    rows, seen = [], set()\n    total = 0\n    archive = stage / \'runtime.tar\'\n    def add(tar, path, rel):\n        nonlocal total\n        if rel in (\'var/lib/analyst-ai/backend.db-wal\', \'var/lib/analyst-ai/backend.db-shm\'):\n            return\n        need(rel not in seen and len(seen) < MAX_FILES, \'duplicate_or_excessive_source_files\')\n        seen.add(rel)\n        before = path.lstat()\n        data_path = backup if rel == \'var/lib/analyst-ai/backend.db\' else path\n        row = metadata(path, rel, original_db if data_path == backup else None)\n        info = tarfile.TarInfo(\'payload/\' + rel)\n        info.mode, info.uname, info.gname = row[\'mode\'], row[\'user\'], row[\'group\']\n        info.uid, info.gid, info.mtime = IDS[row[\'user\']][0], IDS[row[\'group\']][1], row[\'mtime_ns\'] / 1e9\n        if stat.S_ISLNK(before.st_mode):\n            target = os.readlink(path)\n            link_allowed(rel, target)\n            expected_target = path.parent / \'lib\' if rel.endswith(\'/lib64\') else pathlib.Path(\'/usr/bin/python3\')\n            need(path.resolve(strict=True) == expected_target.resolve(strict=True), \'venv_symlink_resolution_changed\')\n            row.update(kind=\'symlink\', target=target)\n            info.type, info.linkname = tarfile.SYMTYPE, target\n            tar.addfile(info)\n        elif stat.S_ISDIR(before.st_mode):\n            row.update(kind=\'directory\')\n            info.type = tarfile.DIRTYPE\n            tar.addfile(info)\n        else:\n            data_stat = regular(data_path)\n            need(data_stat.st_size <= 128 * 1024**2, \'individual_source_file_too_large\')\n            total += data_stat.st_size\n            need(total <= LIMIT - 16 * 1024**2, \'runtime_payload_too_large\')\n            row.update(kind=\'file\', bytes=data_stat.st_size, sha256=sha(data_path))\n            info.type, info.size = tarfile.REGTYPE, data_stat.st_size\n            with data_path.open(\'rb\') as source:\n                tar.addfile(info, source)\n            after = data_path.stat()\n            need((after.st_ino, after.st_size, after.st_mtime_ns) ==\n                 (data_stat.st_ino, data_stat.st_size, data_stat.st_mtime_ns), \'source_file_changed_during_copy\')\n        rows.append(row)\n    class BoundedArchive:\n        def __init__(self, stream):\n            self.stream = stream\n        def write(self, data):\n            need(self.stream.tell() + len(data) <= LIMIT, \'archive_exceeds_one_gib\')\n            return self.stream.write(data)\n        def __getattr__(self, name):\n            return getattr(self.stream, name)\n    with archive.open(\'xb\') as output, tarfile.open(fileobj=BoundedArchive(output), mode=\'w\', format=tarfile.PAX_FORMAT) as tar:\n        for rel in ROOTS:\n            path = pathlib.Path(\'/\') / rel\n            add(tar, path, rel)\n            if path.is_dir():\n                for directory, dirs, files in os.walk(path, followlinks=False):\n                    for name in sorted(dirs):\n                        child = pathlib.Path(directory) / name\n                        add(tar, child, child.relative_to(\'/\').as_posix())\n                    dirs[:] = sorted(d for d in dirs if not (pathlib.Path(directory) / d).is_symlink())\n                    for name in sorted(files):\n                        child = pathlib.Path(directory) / name\n                        add(tar, child, child.relative_to(\'/\').as_posix())\n        manifest = {\'schema\': 1, \'stage_id\': STAGE_ID, \'created_at\': stamp(),\n                    \'system\': system, \'users\': named, \'roots\': list(ROOTS), \'entries\': rows,\n                    \'database\': db_check, \'database_copy\': \'sqlite_online_backup\',\n                    \'old_application_stopped\': True, \'source_workspace_included\': False}\n        data = json.dumps(manifest, sort_keys=True, separators=(\',\', \':\')).encode()\n        need(len(data) <= 12 * 1024**2, \'manifest_too_large\')\n        info = tarfile.TarInfo(\'manifest.json\')\n        info.mode, info.size = 0o600, len(data)\n        tar.addfile(info, io.BytesIO(data))\n    archive.chmod(0o600)\n    need(archive.stat().st_size <= LIMIT, \'archive_exceeds_one_gib\')\n    receipt = {\'stage_id\': STAGE_ID, \'bytes\': archive.stat().st_size, \'sha256\': sha(archive),\n               \'manifest_sha256\': hashlib.sha256(data).hexdigest(), \'entries\': len(rows),\n               \'payload_bytes\': total, \'system\': system, \'database\': db_check}\n    private_write(stage / \'snapshot-receipt.json\', json.dumps(receipt).encode())\n    return receipt\n\ndef ensure_accounts(named):\n    need(set(named) == set(IDS), \'account_manifest_changed\')\n    for name, values in named.items():\n        uid, gid = IDS[name]\n        need(values[\'uid\'] == uid and values[\'gid\'] == gid, \'account_ids_changed\')\n        try:\n            group = grp.getgrnam(name)\n            need(group.gr_gid == gid, \'existing_group_identity_conflict\')\n        except KeyError:\n            try:\n                grp.getgrgid(gid)\n            except KeyError:\n                subprocess.run([\'groupadd\', \'--system\', \'--gid\', str(gid), name], check=True,\n                               stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)\n            else:\n                raise RuntimeError(\'target_gid_collision\')\n        try:\n            user = pwd.getpwnam(name)\n            need(user.pw_uid == uid and user.pw_gid == gid, \'existing_user_identity_conflict\')\n        except KeyError:\n            need(name != \'root\' and values[\'home\'] == HOMES[name]\n                 and values[\'shell\'] in (\'/usr/sbin/nologin\', \'/bin/false\', \'/bin/bash\'), \'account_attributes_changed\')\n            try:\n                pwd.getpwuid(uid)\n            except KeyError:\n                subprocess.run([\'useradd\', \'--system\', \'--uid\', str(uid), \'--gid\', str(gid),\n                                \'--home-dir\', values[\'home\'], \'--no-create-home\', \'--shell\', values[\'shell\'], name],\n                               check=True, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)\n            else:\n                raise RuntimeError(\'target_uid_collision\')\n    users()\n\ndef restore(stage, expected):\n    system = identity()\n    new_empty()\n    archive = stage / \'runtime.tar\'\n    regular(archive)\n    need(archive.stat().st_size == expected[\'bytes\'] and sha(archive) == expected[\'sha256\'], \'received_archive_changed\')\n    tree = stage / \'tree\'\n    need(not tree.exists(), \'unpack_tree_exists\')\n    tree.mkdir(mode=0o700)\n    with tarfile.open(archive, \'r:\') as tar:\n        members = tar.getmembers()\n        need(1 <= len(members) <= MAX_FILES + 1 and len({m.name for m in members}) == len(members), \'archive_members_invalid\')\n        m = tar.getmember(\'manifest.json\')\n        need(m.isfile() and 0 < m.size <= 12 * 1024**2, \'manifest_type_or_size\')\n        data = tar.extractfile(m).read()\n        need(hashlib.sha256(data).hexdigest() == expected[\'manifest_sha256\'], \'manifest_hash_changed\')\n        manifest = json.loads(data)\n        need(manifest[\'schema\'] == 1 and manifest[\'stage_id\'] == STAGE_ID\n             and manifest[\'roots\'] == list(ROOTS) and manifest[\'system\'] == system\n             and expected[\'system\'] == system, \'source_target_system_mismatch\')\n        rows = manifest[\'entries\']\n        need(isinstance(rows, list) and len(rows) == expected[\'entries\']\n             and len({r[\'path\'] for r in rows}) == len(rows), \'manifest_entries_invalid\')\n        mapping = {r[\'path\']: r for r in rows}\n        need({m.name for m in members} == {\'manifest.json\'} | {\'payload/\' + r for r in mapping}, \'unexpected_archive_entries\')\n        for item in members:\n            if item.name == \'manifest.json\':\n                continue\n            rel = item.name.removeprefix(\'payload/\')\n            allowed_rel(rel)\n            row = mapping[rel]\n            need(row[\'user\'] in IDS and row[\'group\'] in IDS and type(row[\'mode\']) is int\n                 and 0 <= row[\'mode\'] <= 0o777, \'invalid_archive_owner_or_mode\')\n            path = tree / rel\n            path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n            parents_safe(path)\n            need(not os.path.lexists(path), \'duplicate_unpacked_path\')\n            if row[\'kind\'] == \'directory\':\n                need(item.isdir(), \'directory_type_mismatch\')\n                path.mkdir(mode=0o700)\n            elif row[\'kind\'] == \'symlink\':\n                need(item.issym() and item.linkname == row[\'target\'], \'symlink_type_mismatch\')\n                link_allowed(rel, item.linkname)\n                os.symlink(item.linkname, path)\n            else:\n                need(row[\'kind\'] == \'file\' and item.isfile() and item.size == row[\'bytes\'], \'file_type_or_size_mismatch\')\n                h = hashlib.sha256()\n                fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n                with os.fdopen(fd, \'wb\') as output, tar.extractfile(item) as source:\n                    count = 0\n                    while block := source.read(1024**2):\n                        count += len(block)\n                        need(count <= row[\'bytes\'], \'oversized_unpacked_file\')\n                        h.update(block)\n                        output.write(block)\n                    output.flush()\n                    os.fsync(output.fileno())\n                need(count == row[\'bytes\'] and h.hexdigest() == row[\'sha256\'], \'unpacked_file_hash_mismatch\')\n    need(sha(tree / CA_REL) == CA_SHA and sha(tree / \'usr/bin/caddy\') == CADDY_SHA, \'critical_runtime_file_changed\')\n    need(mapping[ENV_REL][\'mode\'] & 0o077 == 0 and mapping[ENV_REL][\'user\'] == \'root\', \'environment_permissions_unsafe\')\n    need(database_check(tree / \'var/lib/analyst-ai/backend.db\') == manifest[\'database\'], \'unpacked_database_invalid\')\n    ensure_accounts(manifest[\'users\'])\n    installed = []\n    progress_file = stage / \'installation-progress.json\'\n    private_write(progress_file, json.dumps({\'installed\': installed}).encode())\n    for rel in ROOTS:\n        destination = pathlib.Path(\'/\') / rel\n        parents_safe(destination)\n        need(not os.path.lexists(destination), \'destination_appeared_during_stage\')\n        os.rename(tree / rel, destination)\n        installed.append(rel)\n        progress_file.write_text(json.dumps({\'installed\': installed}))\n    for row in sorted(rows, key=lambda r: len(pathlib.PurePosixPath(r[\'path\']).parts), reverse=True):\n        path = pathlib.Path(\'/\') / row[\'path\']\n        os.chown(path, IDS[row[\'user\']][0], IDS[row[\'group\']][1], follow_symlinks=False)\n        if row[\'kind\'] != \'symlink\':\n            os.chmod(path, row[\'mode\'], follow_symlinks=False)\n            os.utime(path, ns=(row[\'mtime_ns\'], row[\'mtime_ns\']), follow_symlinks=False)\n            if row[\'kind\'] == \'file\':\n                need(sha(path) == row[\'sha256\'], \'installed_file_hash_mismatch\')\n        else:\n            need(os.readlink(path) == row[\'target\'], \'installed_symlink_changed\')\n    # EnvironmentFile valu