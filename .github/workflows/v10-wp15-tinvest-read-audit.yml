name: V10 WP15 T-Invest Read Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "omni_cio/adapters/tinvest_read_v1.py"
      - "omni_cio/adapters/tinvest_connection_v1.py"
      - "omni_cio/adapters/tinvest_market_v1.py"
      - "omni_cio/adapters/tinvest_secret_v1.py"
      - "tests/test_v10_wp15_tinvest_readonly.py"
      - "tests/test_v10_wp15_tinvest_connection_scope.py"
      - "tests/test_v10_wp15_tinvest_market.py"
      - "tests/test_v10_wp15_secret_boundary.py"
      - "tests/test_v10_wp15_owner_evidence.py"
      - "tests/test_v10_wp15_ci_isolation.py"
      - "tests/test_v10_wp15_cursor_resume.py"
      - "scripts/check_v10_wp15_ci_isolation.py"
      - "scripts/rehearse_v10_wp15_offline.py"
      - "scripts/validate_v10_wp15_owner_evidence.py"
      - "docs/architecture/V10_WP15_TINVEST_READONLY_CONTRACT.md"
      - "docs/architecture/V10_WP15_LIVE_ACCEPTANCE_STATE.json"
      - "docs/operations/V10_WP15_OWNER_LIVE_READ_RUNBOOK.md"
      - "requirements.in"
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/v10-wp15-tinvest-read-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp15-tinvest-read-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: WP15 deterministic connection, freshness and cursor gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated WP15 environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp15-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked WP15 dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import grpc; import t_tech.invest; print('WP15 broker-read imports OK')"

      - name: Capture authoritative static quality diagnostics
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "STATIC_EXIT=0"
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff check . > "%RUNNER_TEMP%\wp15-ruff-check.txt" 2>&1
          if errorlevel 1 set "STATIC_EXIT=1"
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff format --check omni_cio\adapters\tinvest_connection_v1.py scripts\rehearse_v10_wp15_offline.py scripts\rehearse_v10_wp15_owner.py scripts\validate_v10_wp15_owner_evidence.py tests\test_v10_wp15_tinvest_connection_scope.py tests\test_v10_wp15_owner_evidence.py > "%RUNNER_TEMP%\wp15-ruff-format.txt" 2>&1
          if errorlevel 1 set "STATIC_EXIT=1"
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m mypy > "%RUNNER_TEMP%\wp15-mypy.txt" 2>&1
          if errorlevel 1 set "STATIC_EXIT=1"
          echo WP15_STATIC_EXIT=!STATIC_EXIT!>> "%GITHUB_ENV%"
          echo WP15_RUFF_CHECK=%RUNNER_TEMP%\wp15-ruff-check.txt>> "%GITHUB_ENV%"
          echo WP15_RUFF_FORMAT=%RUNNER_TEMP%\wp15-ruff-format.txt>> "%GITHUB_ENV%"
          echo WP15_MYPY=%RUNNER_TEMP%\wp15-mypy.txt>> "%GITHUB_ENV%"
          endlocal
          exit /b 0

      - name: Upload static quality diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp15-static-quality-diagnostics
          path: |
            ${{ env.WP15_RUFF_CHECK }}
            ${{ env.WP15_RUFF_FORMAT }}
            ${{ env.WP15_MYPY }}
          if-no-files-found: error
          retention-days: 3

      - name: Enforce authoritative static quality result
        shell: cmd
        run: |
          if "%WP15_STATIC_EXIT%"=="0" exit /b 0
          echo ===== RUFF CHECK =====
          type "%WP15_RUFF_CHECK%"
          echo ===== RUFF FORMAT =====
          type "%WP15_RUFF_FORMAT%"
          echo ===== MYPY =====
          type "%WP15_MYPY%"
          exit /b %WP15_STATIC_EXIT%

      - name: Run focused WP15 unit and authority tests
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m pytest -q tests\test_v10_wp15_tinvest_readonly.py tests\test_v10_wp15_tinvest_connection_scope.py tests\test_v10_wp15_tinvest_market.py tests\test_v10_wp15_secret_boundary.py tests\test_v10_wp15_owner_evidence.py tests\test_v10_wp15_ci_isolation.py tests\test_v10_wp15_cursor_resume.py

      - name: Run deterministic offline WP15 rehearsal
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m scripts.rehearse_v10_wp15_offline > "%RUNNER_TEMP%\wp15-tinvest-read-audit.json" 2> "%RUNNER_TEMP%\wp15-tinvest-read-diagnostic.txt"
          set "AUDIT_EXIT=!ERRORLEVEL!"
          if exist "%RUNNER_TEMP%\wp15-tinvest-read-audit.json" type "%RUNNER_TEMP%\wp15-tinvest-read-audit.json"
          if exist "%RUNNER_TEMP%\wp15-tinvest-read-diagnostic.txt" type "%RUNNER_TEMP%\wp15-tinvest-read-diagnostic.txt"
          echo WP15_AUDIT_EXIT=!AUDIT_EXIT!>> "%GITHUB_ENV%"
          echo WP15_EVIDENCE=%RUNNER_TEMP%\wp15-tinvest-read-audit.json>> "%GITHUB_ENV%"
          echo WP15_DIAGNOSTIC=%RUNNER_TEMP%\wp15-tinvest-read-diagnostic.txt>> "%GITHUB_ENV%"
          endlocal
          exit /b 0

      - name: Upload synthetic WP15 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp15-tinvest-read-audit-evidence
          path: |
            ${{ env.WP15_EVIDENCE }}
            ${{ env.WP15_DIAGNOSTIC }}
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce deterministic rehearsal result
        shell: cmd
        run: |
          if not "%WP15_AUDIT_EXIT%"=="0" exit /b %WP15_AUDIT_EXIT%

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx