name: Inspect laptop readiness for unattended development
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-unattended-readiness.yml]
permissions:
  contents: read
  checks: write
concurrency:
  group: analyst-windows-unattended-readiness
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Read and record bounded laptop prerequisites
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const cp=require('node:child_process'),path=require('node:path');
            const command="$ErrorActionPreference = 'Stop'\nif ($env:COMPUTERNAME -ne 'LAPTOP-NPSGA016') { throw 'Unexpected host' }\n$identity = [Security.Principal.WindowsIdentity]::GetCurrent()\n$principal = New-Object Security.Principal.WindowsPrincipal($identity)\n$report = [ordered]@{\n  checked_at_utc=[DateTime]::UtcNow.ToString('o')\n  elevated=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)\n  service_account=$identity.Name\n  runner_services=@(Get-CimInstance Win32_Service -Filter \"Name LIKE 'actions.runner.%'\" | ForEach-Object {@{name=$_.Name;state=$_.State;start_mode=$_.StartMode}})\n  scheduled_task=$null\n  task_probe_error=$null\n  installed_script_sha256=$null\n  metadata=$null\n  latest_status=$null\n}\n$root = 'C:\\ProgramData\\AnalystAI-Maintenance'\n$script = Join-Path $root 'AnalystAI-Maintenance.ps1'\nif (Test-Path -LiteralPath $script) {\n  $report.installed_script_sha256=(Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant()\n}\nforeach ($pair in @(@('metadata','installed.json'),@('latest_status','status.json'))) {\n  $file=Join-Path $root $pair[1]\n  if (Test-Path -LiteralPath $file) { $report[$pair[0]]=Get-Content -LiteralPath $file -Raw | ConvertFrom-Json }\n}\ntry {\n  $task=Get-ScheduledTask -TaskName 'AnalystAI-RestartAfter12Hours' -TaskPath '\\' -ErrorAction Stop\n  $info=Get-ScheduledTaskInfo -TaskName $task.TaskName -TaskPath '\\'\n  $report.scheduled_task=@{\n    name=$task.TaskName;state=[string]$task.State;\n    user=$task.Principal.UserId;run_level=[string]$task.Principal.RunLevel;\n    actions=@($task.Actions | ForEach-Object {@{execute=$_.Execute;arguments=$_.Arguments}});\n    last_result=$info.LastTaskResult;\n    last_run=$info.LastRunTime.ToUniversalTime().ToString('o');\n    next_run=$info.NextRunTime.ToUniversalTime().ToString('o')\n  }\n} catch { $report.task_probe_error=$_.FullyQualifiedErrorId }\n$wsl=(& wsl.exe --list --quiet 2>&1 | Out-String) -replace \"\\x00\",''\n$report.wsl_available=($LASTEXITCODE -eq 0 -and $wsl -match 'Ubuntu-24.04')\n$report | ConvertTo-Json -Depth 8\n";
            const result=cp.spawnSync(path.join(process.env.SystemRoot,'System32','WindowsPowerShell','v1.0','powershell.exe'),['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-EncodedCommand',Buffer.from(command,'utf16le').toString('base64')],{encoding:'utf8',timeout:120000,maxBuffer:64000});
            let report;
            if(result.status===0){try{report=JSON.parse(result.stdout.trim());}catch(e){report={error:'invalid_report',stdout:result.stdout.slice(-4000),stderr:result.stderr.slice(-2000)};}}
            else report={error:'readiness_command_failed',exit:result.status,spawn_error:result.error?.message,stdout:result.stdout?.slice(-4000),stderr:result.stderr?.slice(-4000)};
            await github.rest.checks.create({...context.repo,name:'Laptop unattended readiness report',head_sha:context.sha,status:'completed',conclusion:report.error?'failure':'success',output:{title:'Laptop setup inspection',summary:'\`\`\`json\n'+JSON.stringify(report,null,2)+'\n\`\`\`'}});
            if(report.error)core.setFailed(report.error);
