name: V10 WP5 Local Evidence Probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/v10-wp5-local-evidence.yml'
      - 'infrastructure/windows/collect_owner_node_profile.ps1'
      - 'infrastructure/windows/measure_wp5_gpu_load.ps1'
      - 'infrastructure/windows/run_wp5_owner_acceptance.ps1'
      - 'infrastructure/windows/wp5_node_thresholds.json'
      - 'docs/architecture/V10_WP5_OWNER_PHYSICAL_EVIDENCE.json'
      - 'docs/operations/V10_WP5_THERMAL_RETEST.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp5-local-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Read sanitized OWNER-local WP5 evidence
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'v10/wp5-'))
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Read sanitized local acceptance summaries only
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $stateRoot = Join-Path $env:ProgramData 'OmniCIO\wp5'
          $gpuPath = Join-Path $stateRoot 'wp5-gpu-load.json'
          $eventsPath = Join-Path $stateRoot 'wp5-system-events.json'

          function Assert-FalseFlag {
            param([object]$Value, [string]$Name)
            if ($Value -ne $false) {
              throw "Unsafe local evidence privacy flag: $Name"
            }
          }

          if (Test-Path -LiteralPath $gpuPath) {
            $gpu = Get-Content -LiteralPath $gpuPath -Raw | ConvertFrom-Json
            if ($gpu.schema_version -ne '1') { throw 'Unsupported local GPU evidence schema.' }
            Assert-FalseFlag $gpu.privacy.model_or_uuid_collected 'model_or_uuid_collected'
            Assert-FalseFlag $gpu.privacy.serial_collected 'serial_collected'
            Assert-FalseFlag $gpu.privacy.address_collected 'address_collected'
            Assert-FalseFlag $gpu.privacy.process_list_collected 'process_list_collected'

            if ($null -eq $gpu.PSObject.Properties['observed_duration_seconds']) {
              throw 'Local GPU evidence predates observed-duration validation; a fresh acceptance run is required.'
            }

            $gpuPeak = [double]$gpu.gpu_temperature_c.maximum
            $gpuAverage = [double]$gpu.gpu_temperature_c.average
            $gpuUtilAverage = [double]$gpu.gpu_utilization_percent.average
            $gpuUtilMaximum = [double]$gpu.gpu_utilization_percent.maximum
            $sampleCount = [int]$gpu.sample_count
            $durationSeconds = [int]$gpu.duration_seconds
            $observedDurationSeconds = [int]$gpu.observed_duration_seconds

            if ($gpuPeak -lt 0 -or $gpuPeak -gt 125) { throw 'Local GPU peak temperature is outside the accepted evidence range.' }
            if ($gpuAverage -lt 0 -or $gpuAverage -gt 125) { throw 'Local GPU average temperature is outside the accepted evidence range.' }
            if ($gpuUtilAverage -lt 0 -or $gpuUtilAverage -gt 100) { throw 'Local GPU average utilization is outside the accepted evidence range.' }
            if ($gpuUtilMaximum -lt 0 -or $gpuUtilMaximum -gt 100) { throw 'Local GPU maximum utilization is outside the accepted evidence range.' }
            if ($sampleCount -lt 1 -or $durationSeconds -lt 1) { throw 'Local GPU evidence contains an invalid duration or sample count.' }
            if ($observedDurationSeconds -lt $durationSeconds) { throw 'Local GPU evidence did not observe the complete requested duration.' }

            Write-Host "WP5_LOCAL_GPU_EVIDENCE_PRESENT=true"
            Write-Host "WP5_LOCAL_GPU_DURATION_SECONDS=$durationSeconds"
            Write-Host "WP5_LOCAL_GPU_OBSERVED_DURATION_SECONDS=$observedDurationSeconds"
            Write-Host "WP5_LOCAL_GPU_SAMPLE_COUNT=$sampleCount"
            Write-Host "WP5_LOCAL_GPU_TEMP_PEAK_C=$gpuPeak"
            Write-Host "WP5_LOCAL_GPU_TEMP_AVG_C=$gpuAverage"
            Write-Host "WP5_LOCAL_GPU_UTIL_MAX_PERCENT=$gpuUtilMaximum"
            Write-Host "WP5_LOCAL_GPU_UTIL_AVG_PERCENT=$gpuUtilAverage"
          } else {
            Write-Host 'WP5_LOCAL_GPU_EVIDENCE_PRESENT=false'
          }

          if (Test-Path -LiteralPath $eventsPath) {
            $events = Get-Content -LiteralPath $eventsPath -Raw | ConvertFrom-Json
            if ($events.schema_version -ne '1') { throw 'Unsupported local system-event evidence schema.' }
            Assert-FalseFlag $events.privacy.usernames_collected 'usernames_collected'
            Assert-FalseFlag $events.privacy.hostnames_collected 'hostnames_collected'
            Assert-FalseFlag $events.privacy.addresses_collected 'addresses_collected'
            Assert-FalseFlag $events.privacy.stable_device_ids_collected 'stable_device_ids_collected'
            Assert-FalseFlag $events.privacy.secrets_collected 'secrets_collected'

            $requestedMinutes = [int]$events.duration_minutes_requested
            $eventCount = [int]$events.relevant_system_event_count
            if ($requestedMinutes -lt 1 -or $requestedMinutes -gt 60) { throw 'Local event evidence duration is outside the accepted range.' }
            if ($eventCount -lt 0 -or $eventCount -gt 1000) { throw 'Local event evidence count is outside the accepted range.' }

            Write-Host 'WP5_LOCAL_EVENT_EVIDENCE_PRESENT=true'
            Write-Host "WP5_LOCAL_EVENT_DURATION_MINUTES=$requestedMinutes"
            Write-Host "WP5_LOCAL_RELEVANT_SYSTEM_EVENT_COUNT=$eventCount"
          } else {
            Write-Host 'WP5_LOCAL_EVENT_EVIDENCE_PRESENT=false'
          }

          Write-Host 'WP5 local evidence probe completed without emitting identifiers, addresses, process lists, secrets, or recovery material.'
