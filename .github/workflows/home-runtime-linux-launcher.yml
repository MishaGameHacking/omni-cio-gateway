name: Verify and place the reviewed Linux launcher on the Lenovo
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/home/Enable-AnalystAI-Linux.zip, tools/home_runtime/Enable-AnalystAI-Linux.cmd, .github/workflows/home-runtime-linux-launcher.yml]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016'||path.basename(process.env.USERPROFILE).toLowerCase()!=='networkservice')throw Error('Wrong staging identity');
            const tmp=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'analyst-linux-launch-'));
            try {
              for(const [n,r] of [['original.cmd','tools/home_runtime/Enable-AnalystAI-Linux.cmd'],['release.zip','deploy/home/Enable-AnalystAI-Linux.zip']]){
                const {data}=await github.rest.repos.getContent({...context.repo,ref:context.sha,path:r});
                fs.writeFileSync(path.join(tmp,n),Buffer.from(data.content,'base64'),{flag:'wx'});
              }
              const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>['SYSTEMROOT','WINDIR','SYSTEMDRIVE','COMSPEC','COMPUTERNAME','PATH','PATHEXT','TEMP','TMP','USERPROFILE','PUBLIC','PROGRAMFILES','PROGRAMDATA','LOCALAPPDATA','PSMODULEPATH'].includes(k.toUpperCase())));
              const program=[
                'import hashlib,json,ntpath,os,pathlib,stat,sys,zipfile',
                'd=pathlib.Path(sys.argv[1]); name="Enable-AnalystAI-Linux.cmd"; z=zipfile.ZipFile(d/"release.zip")',
                'assert z.namelist()==[name]; data=z.read(name); assert data==(d/"original.cmd").read_bytes(); (d/name).write_bytes(data)',
              ].join('\n');
              const py=cp.spawnSync('py.exe',['-3','-I','-c',program,tmp],{env,encoding:'utf8'});
              if(py.status!==0)throw Error('Reviewed package mismatch');
              const file=path.join(tmp,'Enable-AnalystAI-Linux.cmd');
              const proc=cp.spawnSync(env.COMSPEC||'cmd.exe',['/d','/c','call','Enable-AnalystAI-Linux.cmd'],{cwd:tmp,env:{...env,ANALYST_HOME_TEST_LAUNCHER:'1'},windowsHide:true,timeout:95000,encoding:'utf8'});
              if(proc.status!==0||!(proc.stdout||'').includes('HOME_SCM_SOURCE_VERIFIED'))throw Error('Real Windows launcher verification failed');
              const sha=crypto.createHash('sha256').update(fs.readFileSync(path.join(tmp,'release.zip'))).digest('hex');
              core.info('HOME_LINUX_LAUNCHER='+JSON.stringify({zip:sha,member:path.basename(file),lenovo:true,elevation:false}));
            } finally {fs.rmSync(tmp,{recursive:true,force:true});}
