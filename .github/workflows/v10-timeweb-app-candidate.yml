name: V10 Timeweb App Exact-SHA Candidate

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted protected-main SHA to observe or deploy
        required: true
        type: string
      operation:
        description: Read-only observation or one exact-SHA deploy
        required: true
        default: observe
        type: choice
        options:
          - observe
          - deploy
      runtime_mode:
        description: Preactivation candidate or post-P5 live-operable continuous release
        required: true
        default: preactivation
        type: choice
        options:
          - preactivation
          - live-operable
      p5_live_evidence_sha256:
        description: Required only for live-operable mode; SHA-256 of accepted P5 live evidence
        required: false
        default: ""
        type: string
      confirmation:
        description: Required only for deploy; use DEPLOY_EXACT_TIMEWEB_APP_COMMIT
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-timeweb-app-exact-sha-candidate
  cancel-in-progress: false

jobs:
  environment-policy-proof:
    name: Verify Timeweb production environment main-only policy
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin               "$EXPECTED_HEAD"               refs/heads/main:refs/remotes/origin/main || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify P2 exact-SHA source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_app_candidate

      - name: Verify GitHub production environment policy
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_v10_timeweb_github_environment
          --environment-name timeweb-production

      - name: Clean environment-proof workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  exact-sha-candidate:
    name: Observe or deploy exact protected-main Timeweb candidate
    needs: environment-policy-proof
    environment: timeweb-production
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_RUNTIME_MODE: ${{ inputs.runtime_mode }}
      P5_LIVE_EVIDENCE: ${{ inputs.p5_live_evidence_sha256 }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin               "$EXPECTED_HEAD"               refs/heads/main:refs/remotes/origin/main || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-verify P2 exact-SHA source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_app_candidate

      - name: Re-verify production environment policy before provider access
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_v10_timeweb_github_environment
          --environment-name timeweb-production

      - name: Observe or deploy exact Timeweb App candidate
        shell: bash
        env:
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          confirmation=""
          if [ "$REQUESTED_OPERATION" = "deploy" ]; then
            test "$REQUESTED_CONFIRMATION" = "DEPLOY_EXACT_TIMEWEB_APP_COMMIT"
            confirmation="DEPLOY_EXACT_TIMEWEB_APP_COMMIT"
          else
            test "$REQUESTED_OPERATION" = "observe"
            test -z "$REQUESTED_CONFIRMATION"
          fi
          case "$REQUESTED_RUNTIME_MODE" in
            preactivation)
              test -z "$P5_LIVE_EVIDENCE"
              ;;
            live-operable)
              case "$P5_LIVE_EVIDENCE" in
                *[!0-9a-f]*|'') exit 16 ;;
              esac
              test "${#P5_LIVE_EVIDENCE}" -eq 64
              ;;
            *) exit 17 ;;
          esac
          python -m scripts.timeweb_app_release             --operation "$REQUESTED_OPERATION"             --expected-sha "$EXPECTED_HEAD"             --observed-main-sha "$OBSERVED_MAIN"             --runtime-mode "$REQUESTED_RUNTIME_MODE"             --p5-live-evidence-sha256 "$P5_LIVE_EVIDENCE"             --confirmation "$confirmation"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
