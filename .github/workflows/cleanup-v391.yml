name: Clean v3.9.1 generated bytecode

on:
  push:
    branches:
      - v3.9.1-broker-report-async-integrity
    paths:
      - .cleanup-v391/TRIGGER

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v3.9.1-broker-report-async-integrity
          fetch-depth: 0
      - name: Remove generated Python bytecode
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .cleanup-v391
          rm -f .github/workflows/cleanup-v391.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove generated bytecode from v3.9.1"
          git push origin HEAD:v3.9.1-broker-report-async-integrity
