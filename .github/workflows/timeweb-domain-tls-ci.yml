name: Timeweb domain TLS CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/timeweb_addresses.py"
      - ".github/scripts/timeweb_http.py"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - "pyproject.toml"
      - ".github/workflows/timeweb-domain-tls.yml"
      - ".github/workflows/timeweb-domain-tls-ci.yml"
      - ".github/scripts/timeweb_domain_tls.py"
      - ".github/scripts/timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_ssh_trust.py"
      - ".github/scripts/test_timeweb_domain_tls.py"

concurrency:
  group: timeweb-domain-tls-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    name: Test TLS bootstrap
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Checkout candidate repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Run TLS bootstrap regression tests
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_ssh_trust.py
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" .github\scripts\test_timeweb_domain_tls.py
