name: Derive reviewed Jarvis status wiring on owner Lenovo
on:
  push:
    branches: [codex/jarvis-status-source-2026-10-31]
    paths: [.github/workflows/jarvis-status-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Derive exact public-source edits without installed-file access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong source-edit host');
            const base='47cbb9c74a6f1d6a0ec7e965a4defeeaa77015de';
            const before=[
              '    readiness = []',
              '    guarded = GuardedAIClient(user_id, backend.connect)',
              '    for tier in (AnalysisTier.FAST, AnalysisTier.STANDARD, AnalysisTier.PREMIUM):',
              '        try:',
              '            guarded.check_ready(tier)',
              "            readiness.append({'tier': tier.value, 'ready': True, 'reason': None})",
              '        except (GuardError, BudgetDenied) as error:',
              "            readiness.append({'tier': tier.value, 'ready': False, 'reason': str(error)})",
              "    ai_configured = all(item['ready'] for item in readiness)", ''
            ].join('\n');
            const after=[
              '    if __package__:',
              '        from .agent_routing_status import route_status',
              '    else:',
              '        from agent_routing_status import route_status',
              '    model_status = route_status(user_id, backend.connect,',
              '                                environment=os.environ, client_factory=GuardedAIClient)', ''
            ].join('\n');
            const patches=[{
              path:'backend/autonomous_ai.py',expected:'cf693cb1ec160cf820245135de823e43a0d7eb1a',
              edits:[[before,after],[
                '        "ai_configured": ai_configured,\n        "route_readiness": readiness,\n',
                '        **model_status,\n'
              ],[
                '        "spending": MoneyLedger(backend.connect).user_summary(user_id),\n',''
              ]]
            },{
              path:'.github/scripts/jarvis_policy_ci.py',expected:'5dc7ddb0f034be72c32dc3180f8591b9744be541',
              edits:[[
                "    'backend/tests/test_agent_analysis_runtime.py',\n",
                "    'backend/tests/test_agent_analysis_runtime.py',\n    'backend/tests/test_agent_routing_status.py',\n"
              ]]
            }];
            for(const patch of patches){
              const {data}=await github.rest.repos.getContent({...context.repo,path:patch.path,ref:base});
              if(data.type!=='file'||data.sha!==patch.expected||data.encoding!=='base64')throw Error('Unexpected source identity');
              let text=Buffer.from(data.content,'base64').toString('utf8');
              for(const [a,b] of patch.edits){
                if(text.split(a).length!==2)throw Error('Nonunique source anchor');
                text=text.replace(a,b);
              }
              const {data:blob}=await github.rest.git.createBlob({...context.repo,content:text,encoding:'utf-8'});
              core.info('JARVIS_SOURCE_BLOB='+JSON.stringify({path:patch.path,base_blob:patch.expected,sha:blob.sha}));
            }
