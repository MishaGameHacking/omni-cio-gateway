name: V10 Timeweb Telegram Public Activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted protected-main SHA to observe, ready, or accept
        required: true
        type: string
      operation:
        description: Read-only activation phase
        required: true
        default: observe
        type: choice
        options:
          - observe
          - ready
          - accept
      confirmation:
        description: Required for ready or accept
        required: false
        default: ""
        type: string
      p3_acceptance_evidence_sha256:
        description: Sanitized SHA-256 of accepted P3 database evidence
        required: false
        default: ""
        type: string
      p4_acceptance_evidence_sha256:
        description: Sanitized SHA-256 of accepted P4 ingress evidence
        required: false
        default: ""
        type: string
      external_readiness_evidence_sha256:
        description: Sanitized SHA-256 of legal/privacy/provider readiness
        required: false
        default: ""
        type: string
      rollback_release_sha:
        description: Distinct last-known-good production SHA
        required: false
        default: ""
        type: string
      rollback_evidence_sha256:
        description: Sanitized SHA-256 of rollback evidence
        required: false
        default: ""
        type: string
      readiness_sha256:
        description: READY_TO_ACTIVATE evidence seal; accept only
        required: false
        default: ""
        type: string
      live_acceptance_evidence_sha256:
        description: Sanitized SHA-256 of real login/isolation acceptance
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: v10-timeweb-telegram-public-activation
  cancel-in-progress: false

jobs:
  telegram-activation:
    name: Observe or accept Telegram public-user activation
    environment: timeweb-production
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      P3_EVIDENCE: ${{ inputs.p3_acceptance_evidence_sha256 }}
      P4_EVIDENCE: ${{ inputs.p4_acceptance_evidence_sha256 }}
      EXTERNAL_EVIDENCE: ${{ inputs.external_readiness_evidence_sha256 }}
      ROLLBACK_RELEASE_SHA: ${{ inputs.rollback_release_sha }}
      ROLLBACK_EVIDENCE: ${{ inputs.rollback_evidence_sha256 }}
      READINESS_SHA256: ${{ inputs.readiness_sha256 }}
      LIVE_EVIDENCE: ${{ inputs.live_acceptance_evidence_sha256 }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin \
              "$EXPECTED_HEAD" \
              refs/heads/main:refs/remotes/origin/main || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify P5 source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_telegram_public_activation

      - name: Observe, seal, or accept Telegram activation
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_telegram_public_activation \
            --operation "$REQUESTED_OPERATION" \
            --expected-sha "$EXPECTED_HEAD" \
            --observed-main-sha "$OBSERVED_MAIN" \
            --confirmation "$REQUESTED_CONFIRMATION" \
            --p3-acceptance-evidence-sha256 "$P3_EVIDENCE" \
            --p4-acceptance-evidence-sha256 "$P4_EVIDENCE" \
            --external-readiness-evidence-sha256 "$EXTERNAL_EVIDENCE" \
            --rollback-release-sha "$ROLLBACK_RELEASE_SHA" \
            --rollback-evidence-sha256 "$ROLLBACK_EVIDENCE" \
            --readiness-sha256 "$READINESS_SHA256" \
            --live-acceptance-evidence-sha256 "$LIVE_EVIDENCE"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
