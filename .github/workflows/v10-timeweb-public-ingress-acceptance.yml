name: V10 Timeweb Public Ingress Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted protected-main SHA to observe or accept
        required: true
        type: string
      operation:
        description: Read-only public observation or final P4 acceptance
        required: true
        default: observe
        type: choice
        options:
          - observe
          - accept
      confirmation:
        description: Required only for accept
        required: false
        default: ""
        type: string
      p3_recovery_evidence_sha256:
        description: Required only for accept; SHA-256 of sanitized P3 recovery evidence
        required: false
        default: ""
        type: string
      russian_no_vpn_evidence_sha256:
        description: Required only for accept; SHA-256 of sanitized RU no-VPN evidence
        required: false
        default: ""
        type: string
      rollback_release_sha:
        description: Required only for accept; distinct successful last-known-good SHA
        required: false
        default: ""
        type: string
      rollback_evidence_sha256:
        description: Required only for accept; SHA-256 of sanitized rollback evidence
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-timeweb-public-ingress-acceptance
  cancel-in-progress: false

jobs:
  exact-main-policy:
    name: Verify exact protected main and P4 source authority
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin               "$EXPECTED_HEAD"               refs/heads/main:refs/remotes/origin/main || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify P4 public-ingress source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_public_ingress_acceptance

      - name: Verify GitHub production environment policy
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_v10_timeweb_github_environment
          --environment-name timeweb-production

      - name: Clean policy workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  production-ingress:
    name: Observe or accept canonical omnicio.ru ingress
    needs: exact-main-policy
    environment: timeweb-production
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      P3_RECOVERY_EVIDENCE_SHA256: ${{ inputs.p3_recovery_evidence_sha256 }}
      RUSSIAN_NO_VPN_EVIDENCE_SHA256: ${{ inputs.russian_no_vpn_evidence_sha256 }}
      ROLLBACK_RELEASE_SHA: ${{ inputs.rollback_release_sha }}
      ROLLBACK_EVIDENCE_SHA256: ${{ inputs.rollback_evidence_sha256 }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact protected main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "main"
          case "$EXPECTED_HEAD" in
            *[!0-9a-f]*|'') exit 13 ;;
          esac
          test "${#EXPECTED_HEAD}" -eq 40
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin             "$EXPECTED_HEAD"             refs/heads/main:refs/remotes/origin/main
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$OBSERVED_MAIN"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Re-verify P4 source contract
        shell: cmd
        run: python -m scripts.check_v10_timeweb_public_ingress_acceptance

      - name: Observe canonical public ingress
        if: ${{ inputs.operation == 'observe' }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$REQUESTED_CONFIRMATION"
          test -z "$P3_RECOVERY_EVIDENCE_SHA256"
          test -z "$RUSSIAN_NO_VPN_EVIDENCE_SHA256"
          test -z "$ROLLBACK_RELEASE_SHA"
          test -z "$ROLLBACK_EVIDENCE_SHA256"
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_public_ingress_acceptance             --operation observe             --expected-sha "$EXPECTED_HEAD"             --observed-main-sha "$OBSERVED_MAIN"

      - name: Accept canonical public ingress
        if: ${{ inputs.operation == 'accept' }}
        shell: bash
        env:
          TIMEWEB_CLOUD_API_TOKEN: ${{ secrets.TIMEWEB_CLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$REQUESTED_CONFIRMATION" = "ACCEPT_OMNICIO_RU_TIMEWEB_PUBLIC_INGRESS"
          for digest in             "$P3_RECOVERY_EVIDENCE_SHA256"             "$RUSSIAN_NO_VPN_EVIDENCE_SHA256"             "$ROLLBACK_EVIDENCE_SHA256"
          do
            case "$digest" in
              *[!0-9a-f]*|'') exit 21 ;;
            esac
            test "${#digest}" -eq 64
          done
          case "$ROLLBACK_RELEASE_SHA" in
            *[!0-9a-f]*|'') exit 22 ;;
          esac
          test "${#ROLLBACK_RELEASE_SHA}" -eq 40
          test "$ROLLBACK_RELEASE_SHA" != "$EXPECTED_HEAD"
          OBSERVED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          python -m scripts.timeweb_public_ingress_acceptance             --operation accept             --expected-sha "$EXPECTED_HEAD"             --observed-main-sha "$OBSERVED_MAIN"             --confirmation "ACCEPT_OMNICIO_RU_TIMEWEB_PUBLIC_INGRESS"             --p3-recovery-evidence-sha256 "$P3_RECOVERY_EVIDENCE_SHA256"             --russian-no-vpn-evidence-sha256 "$RUSSIAN_NO_VPN_EVIDENCE_SHA256"             --rollback-release-sha "$ROLLBACK_RELEASE_SHA"             --rollback-evidence-sha256 "$ROLLBACK_EVIDENCE_SHA256"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
