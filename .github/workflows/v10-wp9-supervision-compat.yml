name: V10 WP9 Supervision Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp9-supervision-compat.yml"
      - ".github/workflows/v10-wp9-supervision-audit.yml"
      - "docs/architecture/V10_WP9_**"
      - "docs/architecture/DECISIONS.md"
      - "docs/operations/V10_WP9_**"
      - "infrastructure/windows/*wp9*"
      - "scripts/*wp9*"
      - "tests/test_v10_wp9_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp9-supervision-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows-preview:
    name: Clean Windows WP9 compatibility
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify WP9 static supervision contract
        shell: pwsh
        run: |
          python scripts/check_v10_wp9_supervision_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP9 PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "infrastructure\windows\provision_wp9_supervision.ps1",
            "infrastructure\windows\rollback_wp9_supervision.ps1",
            "infrastructure\windows\wp9_health_supervisor.ps1",
            "infrastructure\windows\wp9_component_guard.ps1",
            "infrastructure\windows\wp9_rehearsal_worker.ps1",
            "scripts\collect_v10_wp9_supervision_profile.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Exercise reviewed Task Scheduler primitives
        shell: powershell
        run: |
          $folderName = "OmniCIO-WP9-Compat-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $nestedPath = "\$folderName\V10\"
          $taskName = "WP9.LocalService.Primitive"
          $markerRoot = "C:\ProgramData\$folderName"
          $markerPath = Join-Path $markerRoot "localservice-ran.txt"
          $service = New-Object -ComObject "Schedule.Service"
          $service.Connect()
          $root = $service.GetFolder("\")
          try {
            New-Item -ItemType Directory -Path $markerRoot -Force | Out-Null
            $acl = New-Object System.Security.AccessControl.DirectorySecurity
            $acl.SetAccessRuleProtection($true, $false)
            $inherit = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
              [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
            foreach ($sid in @("S-1-5-18", "S-1-5-32-544")) {
              $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                (New-Object System.Security.Principal.SecurityIdentifier($sid)),
                [System.Security.AccessControl.FileSystemRights]::FullControl,
                $inherit,
                [System.Security.AccessControl.PropagationFlags]::None,
                [System.Security.AccessControl.AccessControlType]::Allow
              )
              $acl.AddAccessRule($rule)
            }
            $localServiceRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              (New-Object System.Security.Principal.SecurityIdentifier("S-1-5-19")),
              [System.Security.AccessControl.FileSystemRights]::Modify,
              $inherit,
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
            )
            $acl.AddAccessRule($localServiceRule)
            Set-Acl -LiteralPath $markerRoot -AclObject $acl

            [void]$root.CreateFolder($folderName)
            $folder = $service.GetFolder("\$folderName")
            [void]$folder.CreateFolder("V10")
            [void]$service.GetFolder("\$folderName\V10")
            [void]$root.GetFolder($folderName)
            [void]$folder.GetFolder("V10")

            $action = New-ScheduledTaskAction `
              -Execute "$env:SystemRoot\System32\cmd.exe" `
              -Argument "/d /c echo WP9_LOCAL_SERVICE_OK>$markerPath"
            $principal = New-ScheduledTaskPrincipal `
              -UserId "NT AUTHORITY\LOCAL SERVICE" `
              -LogonType ServiceAccount `
              -RunLevel Limited
            $settings = New-ScheduledTaskSettingsSet `
              -RestartCount 3 `
              -RestartInterval (New-TimeSpan -Seconds 60) `
              -ExecutionTimeLimit (New-TimeSpan -Minutes 10) `
              -MultipleInstances IgnoreNew `
              -StartWhenAvailable
            $bootTrigger = New-ScheduledTaskTrigger -AtStartup
            $dailyTrigger = New-ScheduledTaskTrigger -Daily -At ([datetime]::Today.AddMinutes(5))
            $definition = New-ScheduledTask `
              -Action $action `
              -Principal $principal `
              -Settings $settings `
              -Trigger @($bootTrigger, $dailyTrigger) `
              -Description "OMNI-CIO-V10-WP9-COMPAT"
            Register-ScheduledTask `
              -TaskName $taskName `
              -TaskPath $nestedPath `
              -InputObject $definition `
              -Force | Out-Null
            Start-ScheduledTask -TaskPath $nestedPath -TaskName $taskName
            $deadline = [datetime]::UtcNow.AddSeconds(20)
            while (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) {
              if ([datetime]::UtcNow -ge $deadline) {
                Write-Error "LocalService scheduled task did not execute."
                exit 1
              }
              Start-Sleep -Milliseconds 500
            }
            if ((Get-Content -LiteralPath $markerPath -Raw).Trim() -ne "WP9_LOCAL_SERVICE_OK") {
              Write-Error "LocalService task marker mismatch."
              exit 1
            }

            Disable-ScheduledTask -TaskPath $nestedPath -TaskName $taskName | Out-Null
            $task = Get-ScheduledTask -TaskPath $nestedPath -TaskName $taskName
            if ([string]$task.State -ne "Disabled") {
              Write-Error "Task State did not report Disabled."
              exit 1
            }
            if ([bool]$task.Settings.Enabled -ne $false) {
              Write-Error "Task Settings.Enabled did not report False."
              exit 1
            }
            if ([int]$task.Settings.RestartCount -ne 3) {
              Write-Error "Task restart count did not round-trip."
              exit 1
            }
            if ([string]$task.Settings.MultipleInstances -ne "IgnoreNew") {
              Write-Error "Task multiple-instance policy did not round-trip."
              exit 1
            }
            $triggers = @($task.Triggers)
            $bootCount = @($triggers | Where-Object { $_.CimClass.CimClassName -eq "MSFT_TaskBootTrigger" }).Count
            $dailyCount = @($triggers | Where-Object { $_.CimClass.CimClassName -eq "MSFT_TaskDailyTrigger" }).Count
            if ($triggers.Count -ne 2 -or $bootCount -ne 1 -or $dailyCount -ne 1) {
              Write-Error "Task startup/daily trigger types did not round-trip as expected."
              exit 1
            }
          }
          finally {
            Unregister-ScheduledTask -TaskPath $nestedPath -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            try { $service.GetFolder("\$folderName").DeleteFolder("V10", 0) } catch { }
            try { $root.DeleteFolder($folderName, 0) } catch { }
            Remove-Item -LiteralPath $markerRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prove WP9 preview does not mutate clean hosted node
        shell: powershell
        run: |
          $root = "C:\ProgramData\OmniCIO\services\wp9"
          $before = Test-Path -LiteralPath $root
          $profilePath = Join-Path $env:RUNNER_TEMP "wp9-clean-preview.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\provision_wp9_supervision.ps1 -AsJson `
            > $profilePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if ($profile.mode -ne "PREVIEW") { exit 1 }
          if ($profile.status -ne "OWNER_ACTION_REQUIRED") { exit 1 }
          if ((Test-Path -LiteralPath $root) -ne $before) {
            Write-Error "WP9 preview mutated the clean hosted node."
            exit 1
          }
          foreach ($name in @(
            "OmniCIO.V10.HealthSupervisor",
            "OmniCIO.V10.CoreApi",
            "OmniCIO.V10.Web",
            "OmniCIO.V10.Telegram",
            "OmniCIO.V10.Watchtower",
            "OmniCIO.V10.AIWorker"
          )) {
            if (Get-ScheduledTask -TaskPath "\OmniCIO\V10\" -TaskName $name -ErrorAction SilentlyContinue) {
              Write-Error "WP9 preview registered a task."
              exit 1
            }
          }
          Remove-Item -LiteralPath $profilePath -Force

      - name: Prove WP9 rollback preview is non-mutating
        shell: powershell
        run: |
          $root = "C:\ProgramData\OmniCIO\services\wp9"
          $before = Test-Path -LiteralPath $root
          $raw = powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\rollback_wp9_supervision.ps1 -AsJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = $raw | ConvertFrom-Json
          if ($profile.mode -ne "PREVIEW" -or $profile.status -ne "PASS") { exit 1 }
          if ((Test-Path -LiteralPath $root) -ne $before) { exit 1 }
