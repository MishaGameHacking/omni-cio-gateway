name: Observe owner laptop availability for server version verification
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/server-version-laptop-status.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Report only host availability and free disk without touching running jobs
        shell: cmd
        run: |
          py -3 -c "import os,json,shutil,datetime; assert os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'; print(json.dumps({'host':os.environ['COMPUTERNAME'],'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'disk_free_bytes':shutil.disk_usage('C:/').free,'read_only':True}))"
          if errorlevel 1 exit /b 1
