name: Generate Android lock

on:
  pull_request:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Choose Android SDK root
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
          echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"

      - name: Regenerate lock state
        shell: cmd
        run: |
          del /q app\gradle.lockfile 2>nul
          call gradlew.bat :app:dependencies --write-locks --no-configuration-cache
          if errorlevel 1 exit /b 1
          echo ===== APP_LOCK_BEGIN =====
          type app\gradle.lockfile
          echo ===== APP_LOCK_END =====
