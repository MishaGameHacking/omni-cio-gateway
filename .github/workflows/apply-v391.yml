name: Apply v3.9.1 Broker Report Async Integrity

on:
  push:
    branches:
      - v3.9.1-broker-report-async-integrity
    paths:
      - .v391/TRIGGER

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: v3.9.1-broker-report-async-integrity
          fetch-depth: 0

      - name: Promote stable gateway and endpoint tests
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = (
              Path("app.py"),
              Path("tests/test_broker_report_reconciliation.py"),
              Path("tests/test_cash_liquidity.py"),
              Path("tests/test_portfolio_analytics.py"),
              Path("tests/test_portfolio_market_snapshot.py"),
              Path("tests/test_purchase_capacity.py"),
          )
          for path in targets:
              text = path.read_text(encoding="utf-8")
              updated = text.replace("3.9.0", "3.9.1")
              if updated == text:
                  print(f"No v3.9.0 marker found in {path}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation tests

      - name: Run tests
        run: python -m pytest -q

      - name: Remove one-time scaffolding and commit
        run: |
          rm -rf .v391
          rm -f .github/workflows/apply-v391.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Release v3.9.1 Broker Report Async Integrity"
          git push origin HEAD:v3.9.1-broker-report-async-integrity
