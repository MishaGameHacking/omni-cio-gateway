name: Inspect the existing Windows Android test host
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-windows-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 6
    steps:
      - name: Read host capacity, Android tools and acceleration without starting an emulator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import ctypes,json,os,pathlib,platform,shutil,subprocess,sys,datetime,xml.etree.ElementTree as ET
          assert sys.platform=="win32","This preflight must run on the existing Windows runner"
          def run(args,timeout=20):
              try:
                  p=subprocess.run([str(a) for a in args],capture_output=True,text=True,errors="replace",timeout=timeout)
                  return {"exit_code":p.returncode,"stdout":p.stdout[-6000:],"stderr":p.stderr[-2000:]}
              except (OSError,subprocess.TimeoutExpired) as e:
                  return {"error_type":type(e).__name__,"error":str(e)[:1200]}
          class MemoryStatus(ctypes.Structure):
              _fields_=[("length",ctypes.c_ulong),("load",ctypes.c_ulong),("total_physical",ctypes.c_ulonglong),("available_physical",ctypes.c_ulonglong),("total_pagefile",ctypes.c_ulonglong),("available_pagefile",ctypes.c_ulonglong),("total_virtual",ctypes.c_ulonglong),("available_virtual",ctypes.c_ulonglong),("available_extended_virtual",ctypes.c_ulonglong)]
          m=MemoryStatus();m.length=ctypes.sizeof(m);assert ctypes.windll.kernel32.GlobalMemoryStatusEx(ctypes.byref(m))
          candidates=[]
          for raw in [os.environ.get("ANDROID_SDK_ROOT"),os.environ.get("ANDROID_HOME"),str(pathlib.Path(os.environ.get("LOCALAPPDATA",""))/"Android"/"Sdk"),str(pathlib.Path(os.environ.get("RUNNER_TOOL_CACHE",""))/"AndroidSdk"/"sdk")]:
              if raw and raw not in candidates:candidates.append(raw)
          sdks=[]
          for raw in candidates:
              p=pathlib.Path(raw)
              if not p.is_dir():continue
              d=shutil.disk_usage(p)
              item={"path":str(p),"disk_free_bytes":d.free,"disk_total_bytes":d.total,"adb_exists":(p/"platform-tools/adb.exe").is_file(),"emulator_exists":(p/"emulator/emulator.exe").is_file(),"packages":[]}
              for q in sorted(p.glob("system-images/*/*/*/package.xml")):
                  try:
                      root=ET.parse(q).getroot();package=next(x for x in root.iter() if x.tag.rsplit("}",1)[-1]=="localPackage")
                      item["packages"].append({"path":package.attrib.get("path"),"xml_bytes":q.stat().st_size})
                  except (ET.ParseError,StopIteration,OSError):item["packages"].append({"path":str(q.relative_to(p)),"invalid":True})
              if item["emulator_exists"]:
                  item["emulator_version"]=run([p/"emulator/emulator.exe","-version"])
                  item["acceleration"]=run([p/"emulator/emulator.exe","-accel-check"])
                  item["configured_avds"]=run([p/"emulator/emulator.exe","-list-avds"])
              if item["adb_exists"]:item["adb_version"]=run([p/"platform-tools/adb.exe","version"])
              sdks.append(item)
          system=run(["powershell.exe","-NoProfile","-NonInteractive","-Command","Get-CimInstance Win32_ComputerSystem | Select-Object HypervisorPresent,NumberOfLogicalProcessors | ConvertTo-Json -Compress"])
          cpu=run(["powershell.exe","-NoProfile","-NonInteractive","-Command","Get-CimInstance Win32_Processor | Select-Object Name,VirtualizationFirmwareEnabled,VMMonitorModeExtensions,SecondLevelAddressTranslationExtensions | ConvertTo-Json -Compress"])
          gpu=run(["powershell.exe","-NoProfile","-NonInteractive","-Command","Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,Status | ConvertTo-Json -Compress"])
          result={"schema_version":1,"kind":"existing_windows_android_preflight","observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"runner_name":os.environ.get("RUNNER_NAME"),"runner_os":os.environ.get("RUNNER_OS"),"run_id":os.environ.get("GITHUB_RUN_ID"),"python":sys.version.split()[0],"platform":platform.platform(),"memory_total_bytes":m.total_physical,"memory_available_bytes":m.available_physical,"sdk_candidates":sdks,"system":system,"cpu":cpu,"gpu":gpu,"app_executed":False,"adb_server_touched":False,"avd_started":False}
          print("WINDOWS_ANDROID_PREFLIGHT="+json.dumps(result,ensure_ascii=True),flush=True)
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/("analyst-windows-preflight-"+os.environ["GITHUB_RUN_ID"]+".json");out.write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          '@
          $probe = Join-Path $env:RUNNER_TEMP ("analyst-windows-preflight-" + $env:GITHUB_RUN_ID + ".py")
          [System.IO.File]::WriteAllText($probe, $script, (New-Object System.Text.UTF8Encoding($false)))
          & py -3 $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
