name: Diagnose the observed Windows archive test path identity
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-windows-path-diagnosis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Observe the exact failed fixture with and without canonical paths
        shell: python
        run: |
          import hashlib,importlib.util,json,os,pathlib,sys
          assert sys.platform=="win32" and os.environ.get("COMPUTERNAME")=="LAPTOP-NPSGA016"
          root=pathlib.Path(r"C:\actions-runner\_work\omni-cio-gateway\omni-cio-gateway\windows-development-40204894674-1")
          path=root/".github/scripts/tests/test_automation_artifacts.py"
          raw=path.read_bytes()
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()=="2184efb396e746103e3cc195bd3d21340287c411"
          spec=importlib.util.spec_from_file_location("observed_automation_archive_test",path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          report={"host":os.environ["COMPUTERNAME"],"source_test_blob":"2184efb396e746103e3cc195bd3d21340287c411","source_modified":False,"emulator_started":False}
          for canonical in (False,True):
              case=module.AutomationArchiveTests("test_link_metadata_cannot_escape_the_owned_attempt")
              try:
                  case.setUp()
                  details={"temp_root":str(case.root),"resolved_root":str(case.root.resolve(strict=True)),"path_equals_resolved":case.root==case.root.resolve(strict=True)}
                  if canonical:
                      case.root=case.root.resolve(strict=True)
                      case.source=case.root/"synthetic-screens";case.attempt=case.root/"attempt-1";case.destination=case.attempt/"automation-ui"
                  name=case.report["cases"][0]["screenshot"]
                  details["mock_target_equals_actual_read_path"]=(case.source/name)==(module.artifacts._directory(case.source)/name)
                  try:
                      case.test_link_metadata_cannot_escape_the_owned_attempt()
                      details["test_passed"]=True
                  except Exception as error:
                      details.update(test_passed=False,error_type=type(error).__name__,error=str(error)[:500])
                  report["canonical_fixture" if canonical else "original_fixture"]=details
              finally:case.doCleanups()
          print("WINDOWS_PATH_ALIAS_DIAGNOSIS="+json.dumps(report,sort_keys=True))
          assert report["original_fixture"]["test_passed"] is False
          assert report["canonical_fixture"]["test_passed"] is True
          
