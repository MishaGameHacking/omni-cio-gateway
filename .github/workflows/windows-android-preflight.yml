name: Inspect the existing Windows Android test host
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-windows-host-preflight
  cancel-in-progress: false
jobs:
  inspect:
    name: Verify existing laptop development prerequisites without changing them
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 6
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Inspect existing SDK, Java, signing certificate and development tools
        shell: cmd
        run: |
          py -3 -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-dev-preflight.b64'; p.write_text('',encoding='ascii')"
          if errorlevel 1 exit /b 1
          py -3 -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-dev-preflight.b64'; p.open('a',encoding='ascii').write('')"
          if errorlevel 1 exit /b 1
          py -3 -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-dev-preflight.b64'; p.open('a',encoding='ascii').write('')"
          if errorlevel 1 exit /b 1
          py -3 -c "import pathlib,os,base64,zlib,hashlib; p=pathlib.Path(os.environ['RUNNER_TEMP']); b=zlib.decompress(base64.b64decode((p/'windows-dev-preflight.b64').read_bytes())); assert hashlib.sha256(b).hexdigest()=='b07c59b7616a66b780d995831919dfa02f90efd60e922cb4fd6d1ee4465ce941'; (p/'windows-dev-preflight.py').write_bytes(b)"
          if errorlevel 1 exit /b 1
          py -3 "%RUNNER_TEMP%\windows-dev-preflight.py" --source-root "C:\actions-runner-4\_work\omni-cio-gateway\omni-cio-gateway\windows-verification-40199511664-1" --inspect-old-debug-dex
          if errorlevel 1 exit /b 1
