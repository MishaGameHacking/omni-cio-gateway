name: Verify Timeweb APK38 on the Windows laptop
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-android-release38.yml]
permissions:
  contents: read
concurrency:
  group: analyst-frozen38-windows-runtime
  cancel-in-progress: false
jobs:
  inputs:
    name: Transfer the frozen Timeweb APK inputs privately
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.upload.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
          persist-credentials: false
      - name: Checkout the pinned Timeweb transport helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Confirm private transfer before loading APK bytes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'prepare'});
      - name: Read exact Timeweb APK bytes over the verified temporary SSH connection
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      payload=remote_script.encode() if binary_input is None else binary_input
                      remote_command="python3 -" if binary_input is None else "python3 -c "+shlex.quote(remote_script)
                      result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      if not capture:print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                      return result.stdout
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          
          remote_script="import pathlib,hashlib,sys,stat\np=pathlib.Path(\"/var/lib/analyst-ai-build/exports/android38-source955-windows/ci-handoff.zip\")\ns=p.lstat()\nassert stat.S_ISREG(s.st_mode) and not p.is_symlink() and s.st_nlink==1 and s.st_size==125533350\nb=p.read_bytes()\nassert len(b)==125533350 and hashlib.sha256(b).hexdigest()==\"f6af467ac6129da1ab5c422e49349b0cfdd7f9520fc55ecdf7c724e967bab15b\"\nsys.stdout.buffer.write(b)\n"
          blob=with_ams(remote_script,timeout=180,capture=True)
          assert len(blob)==125533350 and hashlib.sha256(blob).hexdigest()=="f6af467ac6129da1ab5c422e49349b0cfdd7f9520fc55ecdf7c724e967bab15b"
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'ci-handoff.zip'
          assert not archive.exists()
          archive.write_bytes(blob)
          print('TIMEWEB_FROZEN_INPUT_RECEIVED='+json.dumps({'bytes':len(blob),'sha256':hashlib.sha256(blob).hexdigest(),'source_commit':"f4e3368fff1209c02b1cd088a5dc6a5380e7e433",'source_sha256':"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e"}),flush=True)
          PY
      - name: Upload the immutable private inputs
        id: upload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'upload'});
  verify:
    name: Windows Android 38 verification
    needs: inputs
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
    env:
      SOURCE_ROOT: ${{ github.workspace }}/windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
      ANDROID_SDK_ROOT: 'C:\actions-runner-2\_work\_tool\AndroidSdk\sdk'
      ANDROID_HOME: 'C:\actions-runner-2\_work\_tool\AndroidSdk\sdk'
      RUN_PROFILE_UI_TESTS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      ANALYST_JOB_NAME: Windows Android 38 verification
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - name: Checkout the exact frozen sources in an isolated directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
          path: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          clean: false
      - name: Receive the exact private APK archive
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TRANSFER_SHA256: ${{ needs.inputs.outputs.archive_sha256 }}
        with:
          script: await require(require('node:path').join(process.env.SOURCE_ROOT,'.github/scripts/ci_private_transfer.cjs'))({github, context, core, command:'download'});
      - name: Prepare the reviewed Windows verification wrapper
        shell: cmd
        run: |
          py -3 -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-runtime38.b64'; p.write_text('',encoding='ascii')"
          if errorlevel 1 exit /b 1
          py -3 -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-runtime38.b64'; f=p.open('a',encoding='ascii'); f.write(''); f.close()"
          if errorlevel 1 exit /b 1
          py -3 -c "import base64,zlib,pathlib,os,hashlib; r=pathlib.Path(os.environ['RUNNER_TEMP']); b=zlib.decompress(base64.b64decode((r/'windows-runtime38.b64').read_text(encoding='ascii'))); assert hashlib.sha256(b).hexdigest()=='a5bd2de2420d3414866a8c0fa3e36d3af336bf8a4848bbcf7cea35590facd7ad'; (r/'windows-runtime38.py').write_bytes(b)"
          if errorlevel 1 exit /b 1
      - name: Verify source bytes and frozen APK inputs
        id: verify_inputs
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" inputs
          if errorlevel 1 exit /b 1
      - name: Remove only the verified input asset and retain its private draft
        id: retained_transfer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const helper = require(require('node:path').join(process.env.SOURCE_ROOT,'.github/scripts/ci_private_transfer.cjs'));
            const identity = helper.identity(context,process.env);
            const releases = await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
            const matches = releases.filter(value=>value.tag_name===identity.tag);
            if(matches.length!==1) throw new Error('Exactly one owned private draft is required');
            const release = helper.owned(matches[0],identity);
            await helper.inaccessibleWithoutAuth(context.repo,'releases/'+release.id,fetch);
            if(release.assets.length!==1) throw new Error('The exact verified input asset is required');
            const asset=release.assets[0];
            if(!Number.isSafeInteger(asset.id)||asset.id<=0||asset.state!=='uploaded'||asset.size!==125533350) throw new Error('Input asset identity or size changed');
            await helper.inaccessibleWithoutAuth(context.repo,'releases/assets/'+asset.id,fetch);
            const bytes=Buffer.from((await github.rest.repos.getReleaseAsset({...context.repo,asset_id:asset.id,headers:{accept:'application/octet-stream'}})).data);
            if(bytes.length!==125533350||require('node:crypto').createHash('sha256').update(bytes).digest('hex')!=='f6af467ac6129da1ab5c422e49349b0cfdd7f9520fc55ecdf7c724e967bab15b') throw new Error('Input asset bytes changed before removal');
            const current=helper.owned((await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data,identity);
            if(current.assets.length!==1||current.assets[0].id!==asset.id||current.assets[0].size!==asset.size) throw new Error('Private input identity changed before removal');
            await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:asset.id});
            const empty=helper.owned((await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data,identity);
            if(empty.assets.length!==0) throw new Error('Input asset removal not confirmed');
            await helper.inaccessibleWithoutAuth(context.repo,'releases/'+release.id,fetch);
            core.setOutput('release_id',String(release.id));
            core.info('CI_PRIVATE_INPUT_REMOVED_DRAFT_RETAINED='+JSON.stringify({release_id:release.id,run_id:context.runId,anonymous_access:false}));
      - name: Verify the existing completed Java 17 cache
        shell: cmd
        run: |
          py -3 "%SOURCE_ROOT%\.github\scripts\verify_cached_jdk.py"
          if errorlevel 1 exit /b 1
      - name: Prepare the shared SDK and require usable hardware acceleration
        id: prepare_sdk
        timeout-minutes: 5
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" sdk
          if errorlevel 1 exit /b 1
      - name: Verify the exact candidate signature and APK metadata
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" static
          if errorlevel 1 exit /b 1
      - name: Verify API 37 with 16 KB pages
        id: runtime16
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" 16384
          if errorlevel 1 exit /b 1
      - name: Verify API 37 with 4 KB pages
        id: runtime4
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" 4096
          if errorlevel 1 exit /b 1
      - name: Validate the complete APK distribution evidence
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" distribution
          if errorlevel 1 exit /b 1
      - name: Export Windows runtime evidence
        id: export
        if: always() && steps.verify_inputs.outcome == 'success'
        shell: cmd
        run: |
          py -3 "%RUNNER_TEMP%\windows-runtime38.py" export
          if errorlevel 1 exit /b 1
      - name: Prepare the private evidence return
        id: evidence_prepare
        if: always() && steps.export.outcome == 'success' && steps.retained_transfer.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RETAINED_RELEASE_ID: ${{ steps.retained_transfer.outputs.release_id }}
        with:
          script: |
            const helper = require(require('node:path').join(process.env.SOURCE_ROOT,'.github/scripts/ci_private_transfer.cjs'));
            const identity = helper.identity(context,process.env);
            const releases = await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
            const matches = releases.filter(value=>value.tag_name===identity.tag);
            if(matches.length!==1) throw new Error('Exactly one owned private draft is required');
            const release = helper.owned(matches[0],identity);
            await helper.inaccessibleWithoutAuth(context.repo,'releases/'+release.id,fetch);
            if(!/^[1-9]\d{0,19}$/.test(process.env.RETAINED_RELEASE_ID)||String(release.id)!==process.env.RETAINED_RELEASE_ID||release.assets.length!==0) throw new Error('The same empty preflight-owned private draft is required');
            core.info('CI_PRIVATE_EVIDENCE_RETURN_READY='+JSON.stringify({release_id:release.id,run_id:context.runId,anonymous_access:false}));
      - name: Upload the private raw Windows evidence
        id: evidence_upload
        if: always() && steps.evidence_prepare.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require(require('node:path').join(process.env.SOURCE_ROOT,'.github/scripts/ci_private_transfer.cjs'))({github, context, core, command:'upload'});
  collect:
    name: Return the raw Windows evidence to Timeweb
    needs: [inputs, verify]
    if: always() && needs.verify.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
          persist-credentials: false
      - name: Checkout the pinned Timeweb transport helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Download and verify the exact private evidence archive
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TRANSFER_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
      - name: Save verified evidence on Timeweb without publishing
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          TRANSFER_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      payload=remote_script.encode() if binary_input is None else binary_input
                      remote_command="python3 -" if binary_input is None else "python3 -c "+shlex.quote(remote_script)
                      result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      if not capture:print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                      return result.stdout
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          
          import re
          run=os.environ["GITHUB_RUN_ID"];attempt=os.environ["GITHUB_RUN_ATTEMPT"]
          expected=os.environ["TRANSFER_SHA256"]
          assert re.fullmatch(r"[1-9]\d{0,19}",run) and re.fullmatch(r"[1-9]\d{0,4}",attempt)
          assert re.fullmatch(r"[a-f0-9]{64}",expected)
          blob=(pathlib.Path(os.environ["RUNNER_TEMP"])/"ci-handoff.zip").read_bytes()
          assert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected
          remote_script=r"""import pathlib,sys,hashlib,json,os,pwd,stat
          data=sys.stdin.buffer.read(512*1024**2+1)
          assert len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH
          parent=pathlib.Path('/var/lib/analyst-ai-build/incoming')
          account=pwd.getpwnam('analyst-build')
          if not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)
          assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)
          folder=parent/FOLDER
          folder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)
          destination=folder/'windows-runtime-evidence.zip'
          with destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())
          os.chown(destination,0,account.pw_gid);destination.chmod(0o640)
          assert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH
          receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False}
          metadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)
          print('REDESIGN_WINDOWS_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)
          """
          remote_script=remote_script.replace("EXPECTED_BYTES",str(len(blob))).replace("EXPECTED_HASH",repr(expected)).replace("FOLDER",repr("windows38-"+run+"-"+attempt)).replace("RUN_ID",run).replace("RUN_ATTEMPT",attempt)
          with_ams(remote_script,timeout=180,binary_input=blob)
          PY
  cleanup:
    name: Remove only this run's private transfer
    needs: [inputs, verify, collect]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
          persist-credentials: false
      - name: Verify private transfer removal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require every frozen APK verification stage
    needs: [inputs, verify, collect, cleanup]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          INPUTS: ${{ needs.inputs.result }}
          VERIFY: ${{ needs.verify.result }}
          COLLECT: ${{ needs.collect.result }}
          CLEANUP: ${{ needs.cleanup.result }}
        run: |
          for result in "$INPUTS" "$VERIFY" "$COLLECT" "$CLEANUP"; do
            if [ "$result" != success ]; then
              echo "A required frozen APK verification stage failed."
              exit 1
            fi
          done
