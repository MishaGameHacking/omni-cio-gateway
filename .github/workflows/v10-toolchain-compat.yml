name: V10 Toolchain Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-toolchain-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GitHub-hosted Windows is a disposable compatibility/acceleration lane, not the
# authoritative merge gate. OWNER-observed hosted capacity is currently blocked
# by the account-level zero-budget hard stop. While that state is source-controlled
# as blocked, this workflow executes the applicability/capacity contract on the
# Lenovo runner and deliberately does NOT claim a hosted clean-room PASS.
# Stable release provenance must not fabricate missing hosted compatibility.
jobs:
  route:
    name: Classify Windows compatibility paths and capacity
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    outputs:
      python: ${{ steps.route.outputs.hosted_windows_python }}
      frontend: ${{ steps.route.outputs.hosted_windows_frontend }}
      categories: ${{ steps.route.outputs.categories }}

    steps:
      - name: Check out exact reviewed head with comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify current zero-budget capacity contract
        shell: cmd
        run: |
          if not exist scripts\check_v10_ci_cost_control.py exit /b 20
          python scripts\check_v10_ci_cost_control.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Classify changed paths
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/v10-changed-paths.txt"
          else
            git ls-files > "$RUNNER_TEMP/v10-changed-paths.txt"
          fi
          python scripts/v10_ci_router.py \
            --paths-file "$RUNNER_TEMP/v10-changed-paths.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Clean routing workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx

  python-baseline:
    name: Python 3.14.6 clean-room applicability contract
    needs: route
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap protected runner Python
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify capacity contract
        run: python scripts\check_v10_ci_cost_control.py

      - name: Report non-applicable Python clean-room lane
        if: needs.route.outputs.python != 'true'
        run: echo Hosted Python 3.14.6 clean-room lane NOT_APPLICABLE by source-controlled path router; routing check executed successfully.

      - name: Report capacity-deferred Python clean-room lane
        if: needs.route.outputs.python == 'true'
        run: |
          echo Hosted Python 3.14.6 clean-room evidence is REQUIRED_BY_PATH but CURRENTLY_CAPACITY_BLOCKED by the OWNER-observed zero-budget hard stop.
          echo This successful job validates routing/capacity only; it does NOT claim Python 3.14.6 clean-room compatibility PASS.
          echo The self-hosted V10 authoritative merge gate remains mandatory. Stable release provenance must not fabricate missing hosted compatibility evidence.

      - name: Clean Python applicability workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx

  frontend-baseline:
    name: Node 24.18.0 clean-room applicability contract
    needs: route
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap protected runner Python
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify capacity contract
        run: python scripts\check_v10_ci_cost_control.py

      - name: Report non-applicable frontend clean-room lane
        if: needs.route.outputs.frontend != 'true'
        run: echo Hosted Node 24.18.0 clean-room lane NOT_APPLICABLE by source-controlled path router; routing check executed successfully.

      - name: Report capacity-deferred frontend clean-room lane
        if: needs.route.outputs.frontend == 'true'
        run: |
          echo Hosted Node 24.18.0 clean-room evidence is REQUIRED_BY_PATH but CURRENTLY_CAPACITY_BLOCKED by the OWNER-observed zero-budget hard stop.
          echo This successful job validates routing/capacity only; it does NOT claim disposable hosted Node compatibility PASS.
          echo Applicable frontend correctness remains exercised by self-hosted Web/fast gates. Stable release provenance must not fabricate missing hosted compatibility evidence.

      - name: Clean frontend applicability workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
