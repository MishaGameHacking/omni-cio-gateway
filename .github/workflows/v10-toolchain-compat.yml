name: V10 Toolchain Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/v10-toolchain-compat.yml"
      - "requirements.in"
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/**"
      - "omni_cio/**"
      - "app.py"
      - "app_v371.py"
      - "app_v360.py"
      - "main.py"
      - "docs/architecture/V10_TOOLCHAIN_BASELINE.md"
      - "knowledge/17_V10_CURRENT_PROGRAM_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-toolchain-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Python ${{ matrix.python }} compatibility
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12.10"
          - "3.13.14"
          - "3.14.6"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up candidate Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Verify exact interpreter
        shell: pwsh
        run: |
          python -c "import platform; print(platform.python_version())"
          if ((python -c "import platform; print(platform.python_version())") -ne "${{ matrix.python }}") { exit 1 }

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.txt

      - name: Compile protected runtime and Core
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation omni_cio tests scripts

      - name: Verify repository and V10 boundaries
        run: |
          python scripts/check_repository_layout.py
          python scripts/check_v10_repository_boundaries.py

      - name: Verify stable app entrypoint
        shell: pwsh
        run: |
          @'
          import app
          from fastapi.testclient import TestClient

          assert app.ENTRYPOINT == "app:app"
          assert app.app is app.base.app
          health = TestClient(app.app).get("/health")
          assert health.status_code == 200
          payload = health.json()
          assert payload["trading_methods"] is False
          print("app:app compatibility OK", payload["version"])
          '@ | python -

      - name: Run full deterministic test suite
        run: python -m pytest -q

  node-candidate:
    name: Node 24.18.0 / npm 11.16.0 candidate
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js LTS candidate
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify exact Node.js and npm versions
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.18.0") { exit 1 }
          if ((npm --version) -ne "11.16.0") { exit 1 }
          node --version
          npm --version
