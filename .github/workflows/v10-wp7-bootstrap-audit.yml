name: V10 WP7 Bootstrap Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp7-bootstrap-audit.yml"
      - ".github/workflows/v10-wp7-bootstrap-compat.yml"
      - "docs/architecture/V10_WP7_**"
      - "docs/operations/V10_WP7_**"
      - "infrastructure/windows/bootstrap-v10.ps1"
      - "infrastructure/windows/*wp7*"
      - "scripts/*wp7*"
      - "tests/test_v10_wp7_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp7-bootstrap-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lenovo one-time bootstrap audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify WP7 repository/bootstrap contract
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp7_bootstrap_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python -m pytest -q tests\test_v10_wp7_bootstrap_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Re-check inherited WP6 static privilege boundary
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp6_privilege_boundary.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect privacy-safe WP7 preview
        shell: cmd
        run: |
          @echo off
          set "PREVIEW=%RUNNER_TEMP%\wp7-preview-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\bootstrap-v10.ps1 -AsJson > "%PREVIEW%"
          if errorlevel 1 exit /b %errorlevel%
          type "%PREVIEW%"
          echo WP7_PREVIEW_PATH=%PREVIEW%>>"%GITHUB_ENV%"

      - name: Verify applied WP7 Exit Gate state
        shell: cmd
        run: |
          @echo off
          set "VERIFY=%RUNNER_TEMP%\wp7-verify-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\bootstrap-v10.ps1 -Verify -AsJson > "%VERIFY%"
          set "RC=%ERRORLEVEL%"
          type "%VERIFY%"
          echo WP7_VERIFY_PATH=%VERIFY%>>"%GITHUB_ENV%"
          if not "%RC%"=="0" exit /b %RC%

      - name: Clean sanitized local evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP7_PREVIEW_PATH if exist "%WP7_PREVIEW_PATH%" del /f /q "%WP7_PREVIEW_PATH%"
          if defined WP7_VERIFY_PATH if exist "%WP7_VERIFY_PATH%" del /f /q "%WP7_VERIFY_PATH%"
          git reset --hard HEAD
          git clean -ffdx
