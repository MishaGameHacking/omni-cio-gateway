name: Observe only bounded public callback headers before web deployment
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/single-style47-public-observer.yml
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Read callback error branch without login or mutation
      shell: bash
      run: "python - <<'PY'\ndef need(value, code):\n    if not value: raise RuntimeError(code)\n\n\"\"\"Finite public checks.\
        \ Bodies stay in memory; no login transaction is created.\"\"\"\nimport hashlib\nfrom html.parser import HTMLParser\n\
        import http.client\nimport json\nimport socket\nimport ssl\n\nPUBLIC_HOST = 'analyst-ai-2941515.twc1.net'\nPUBLIC_IP\
        \ = '83.217.195.29'\nCALLBACK = '/auth/telegram/callback?error=theme_verification'\nPOLICY = '/client/update-policy?package_name=ru.omnicio.app.debug'\n\
        RETIRED = '/auth/telegram/owner-enrollment/callback'\nCALLBACK_HEADERS = {\n    'cache-control': 'no-store, private',\n\
        \    'referrer-policy': 'no-referrer',\n    'x-content-type-options': 'nosniff',\n    'content-security-policy': \"\
        default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'\",\n}\n\n\nclass PinnedRuntimeTLS(http.client.HTTPSConnection):\n\
        \    def __init__(self):\n        super().__init__(PUBLIC_HOST, timeout=8, context=ssl.create_default_context())\n\
        \n    def connect(self):\n        raw = socket.create_connection((PUBLIC_IP, 443), timeout=self.timeout)\n       \
        \ try:\n            self.sock = self._context.wrap_socket(raw, server_hostname=PUBLIC_HOST)\n        except BaseException:\n\
        \            raw.close()\n            raise\n\n\nclass CallbackPage(HTMLParser):\n    def __init__(self):\n      \
        \  super().__init__(convert_charrefs=True)\n        self.styles = []\n        self.links = []\n        self.color_scheme\
        \ = []\n        self.scripts = []\n        self.current = None\n\n    def handle_starttag(self, tag, pairs):\n   \
        \     values = dict(pairs)\n        if tag == 'style':\n            self.styles.append('')\n            self.current\
        \ = 'style'\n        elif tag == 'script':\n            self.scripts.append('')\n            self.current = 'script'\n\
        \        elif tag == 'a':\n            self.links.append(values.get('href'))\n        elif tag == 'meta' and values.get('name')\
        \ == 'color-scheme':\n            self.color_scheme.append(values.get('content'))\n\n    def handle_endtag(self, tag):\n\
        \        if tag == self.current:\n            self.current = None\n\n    def handle_data(self, data):\n        if\
        \ self.current == 'style':\n            self.styles[-1] += data\n        elif self.current == 'script':\n        \
        \    self.scripts[-1] += data\n\n\ndef public_read(path, maximum):\n    need(path in {'/health', CALLBACK, POLICY,\
        \ RETIRED}, 'public_path_not_allowlisted')\n    connection = PinnedRuntimeTLS()\n    try:\n        connection.request('GET',\
        \ path, headers={'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity'})\n        response = connection.getresponse()\n\
        \        raw = response.read(maximum + 1)\n        need(len(raw) <= maximum and response.getheader('Content-Encoding',\
        \ 'identity') == 'identity',\n             'public_body_outside_bound')\n        headers = {key: response.getheader(key)\
        \ for key in (*CALLBACK_HEADERS, 'content-type')}\n        return response.status, headers, raw\n    finally:\n  \
        \      connection.close()\n\n\ndef public_check(*, expected_style=None, expected_policy=None):\n    status, headers,\
        \ raw = public_read('/health', 1024)\n    need(status == 200 and (headers['content-type'] or '').split(';')[0] ==\
        \ 'application/json'\n         and json.loads(raw) == {'status': 'ok'}, 'public_owner_health_failed')\n    status,\
        \ headers, raw = public_read(CALLBACK, 65536)\n    need(status == 200 and (headers['content-type'] or '').split(';')[0]\
        \ == 'text/html'\n         and all(headers[key] == value for key, value in CALLBACK_HEADERS.items()), 'public_callback_headers_changed')\n\
        \    page = CallbackPage()\n    page.feed(raw.decode('utf-8'))\n    page.close()\n    need(page.links == ['analystai://auth?error=telegram_denied']\
        \ and\n         page.scripts == ['window.location.replace(\"analystai://auth?error=telegram_denied\");'] and\n   \
        \      len(page.styles) == 1, 'public_callback_handoff_changed')\n    style_sha = hashlib.sha256(page.styles[0].encode('utf-8')).hexdigest()\n\
        \    if expected_style is not None:\n        need(style_sha == expected_style and page.color_scheme == ['dark'],\n\
        \             'public_callback_theme_bytes_differ')\n    status, headers, raw = public_read(RETIRED, 4096)\n    need(status\
        \ == 410, 'retired_enrollment_route_changed')\n    status, headers, raw = public_read(POLICY, 16384)\n    need(status\
        \ == 200 and (headers['content-type'] or '').split(';')[0] == 'application/json', 'public_update_policy_unavailable')\n\
        \    policy = json.loads(raw)\n    need(type(policy) is dict and policy.get('package_name') == 'ru.omnicio.app.debug'\n\
        \         and type(policy.get('version_code')) is int and policy['version_code'] >= 44,\n         'unexpected_public_update_policy')\n\
        \    policy_sha = hashlib.sha256(json.dumps(policy, sort_keys=True, separators=(',', ':')).encode()).hexdigest()\n\
        \    if expected_policy is not None:\n        need(policy_sha == expected_policy, 'public_update_policy_changed_during_web_deployment')\n\
        \    return {'health_http': 200, 'health_body': {'status': 'ok'}, 'callback_http': 200,\n            'callback_headers_verified':\
        \ True, 'callback_handoff_verified': True,\n            'callback_style_sha256': style_sha, 'callback_theme_verified':\
        \ expected_style is not None,\n            'retired_enrollment_http': 410, 'update_policy_sha256': policy_sha,\n \
        \           'update_version_code': policy['version_code'], 'login_start_requested': False,\n            'login_transaction_created_by_verifier':\
        \ False, 'owner_denial_requested': False,\n            'browser_pixels_verified': False}\n\nstatus, headers, raw =\
        \ public_read(CALLBACK, 65536)\npage = CallbackPage()\npage.feed(raw.decode('utf-8'))\npage.close()\nprint('PUBLIC_CALLBACK_OBSERVATION='\
        \ + json.dumps({'status':status,'headers':{key:value[:1000] if value else value for key,value in headers.items()},\
        \ 'expected_header_matches':{key:headers[key] == value for key,value in CALLBACK_HEADERS.items()},'link_matches':page.links\
        \ == ['analystai://auth?error=telegram_denied'],'script_matches':page.scripts == ['window.location.replace(\"analystai://auth?error=telegram_denied\"\
        );'],'style_count':len(page.styles),'scheme':page.color_scheme,'login_transaction_created':False}, sort_keys=True))\n\
        \nPY\n"
