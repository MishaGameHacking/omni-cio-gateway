name: V10 WP9A Operations Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp9a-operations-compat.yml"
      - ".github/workflows/v10-wp9a-operations-audit.yml"
      - "docs/architecture/V10_WP9A_**"
      - "docs/operations/V10_WP9A_**"
      - "infrastructure/windows/*wp9a*"
      - "scripts/*wp9a*"
      - "tests/test_v10_wp9a_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp9a-operations-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows:
    name: Clean Windows WP9A compatibility
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify WP9A static operations contract
        shell: pwsh
        run: |
          python scripts/check_v10_wp9a_operations_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP9A PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "scripts\collect_v10_wp9a_operations_profile.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Prove passive collector does not mutate hosted Windows
        shell: powershell
        run: |
          $programDataRoot = "C:\ProgramData\OmniCIO\services\wp9a"
          $before = Test-Path -LiteralPath $programDataRoot
          $profilePath = Join-Path $env:RUNNER_TEMP "wp9a-hosted-profile.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\collect_v10_wp9a_operations_profile.ps1 -AsJson `
            > $profilePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if ($profile.schema_version -ne "1" -or $profile.work_package -ne "WP9A") { exit 1 }
          if ((Test-Path -LiteralPath $programDataRoot) -ne $before) {
            Write-Error "WP9A passive collector mutated ProgramData."
            exit 1
          }
          foreach ($flag in $profile.privacy.PSObject.Properties) {
            if ([bool]$flag.Value) {
              Write-Error "WP9A collector emitted a privacy-positive flag."
              exit 1
            }
          }
          Remove-Item -LiteralPath $profilePath -Force

      - name: Run WP9A deterministic tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest -q tests/test_v10_wp9a_operations_contract.py tests/test_v10_wp9a_operations_profile.py
