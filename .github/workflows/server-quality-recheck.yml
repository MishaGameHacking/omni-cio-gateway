name: Inspect deployed shell source quality
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/server-quality-recheck.yml]
permissions:
  contents: read
  checks: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2d3e08614f15cfb1d9e9428a0d3613672394a92b
          persist-credentials: false
          sparse-checkout: .github/scripts/require_clean_sonar.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const ref='2d3e08614f15cfb1d9e9428a0d3613672394a92b';
            const {newestSonarCheck,assertCleanSonar}=require('./.github/scripts/require_clean_sonar.cjs');
            const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref,per_page:100});
            const sonar=newestSonarCheck(checks,ref);
            if(!sonar||sonar.status!=='completed') throw new Error('Deployed-source analysis is incomplete');
            const notes=await github.paginate(github.rest.checks.listAnnotations,{...context.repo,check_run_id:sonar.id,per_page:100});
            assertCleanSonar(sonar,notes,ref);
            core.info('DEPLOYED_SOURCE_QUALITY_VERIFIED='+ref);
