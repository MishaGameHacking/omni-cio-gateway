name: Deploy Moscow Telegram auth repair

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/scripts/diagnose_moscow_telegram.py"
      - ".github/scripts/deploy_moscow_telegram_browser_auth.py"
      - ".github/scripts/deploy_moscow_telegram_browser_auth_remote.sh"
      - ".github/scripts/normalize_moscow_telegram_deploy_shell.py"
      - ".github/workflows/deploy-moscow-telegram-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyst-moscow-telegram-auth-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Telegram browser login
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[deploy-telegram-auth]'))
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Normalize remote Bash script to LF
        shell: cmd
        run: |
          py -3 .github\scripts\normalize_moscow_telegram_deploy_shell.py
          if errorlevel 1 exit /b 1

      - name: Validate deployment without cloud access
        shell: cmd
        run: |
          py -3 -m py_compile .github\scripts\diagnose_moscow_telegram.py .github\scripts\normalize_moscow_telegram_deploy_shell.py .github\scripts\deploy_moscow_telegram_browser_auth.py
          if errorlevel 1 exit /b 1
          py -3 .github\scripts\deploy_moscow_telegram_browser_auth.py --check
          if errorlevel 1 exit /b 1

      - name: Deploy exact reviewed backend and verify public route
        shell: cmd
        run: |
          py -3 .github\scripts\deploy_moscow_telegram_browser_auth.py
          if errorlevel 1 exit /b 1
