name: Moscow same-size staging (owner authorized)
on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/russia-stage-ultra.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: One same-size Moscow alternative cheaper than existing KZ server
        shell: py -3 {0}
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          import ipaddress
          import json
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from provision_russian_stage import call, inventory, CloudError, SOURCE_ID, SOURCE_NAME, TARGET_NAME, TARGET_COMMENT
          source = call('GET', '/servers/' + str(SOURCE_ID))['server']
          if (source.get('id'), source.get('name'), source.get('location'), source.get('status'), source.get('cpu'), source.get('ram')) != (SOURCE_ID, SOURCE_NAME, 'kz-1', 'on', 2, 2048):
              raise RuntimeError('Source identity/resources changed')
          if any(p.get('name') == TARGET_NAME for p in inventory()):
              raise RuntimeError('Staging VM already exists; do not order another')
          catalog = call('GET', '/presets/servers')
          rows = catalog.get('server_presets')
          if not isinstance(rows, list) or catalog.get('meta', {}).get('total') != len(rows):
              raise RuntimeError('Incomplete catalog')
          matches = [p for p in rows if p.get('id') == 6871]
          originals = [p for p in rows if p.get('id') == source.get('preset_id')]
          if len(matches) != 1 or len(originals) != 1:
              raise RuntimeError('Preset identity not uniquely verified')
          p, old = matches[0], originals[0]
          expected = {'cpu': 2, 'ram': 2048, 'disk': 40960, 'location': 'ru-3', 'disk_type': 'nvme', 'cpu_frequency': '3.3'}
          if any(p.get(key) != value for key, value in expected.items()):
              raise RuntimeError('Moscow configuration changed')
          if (type(p.get('price')) not in (int, float) or type(old.get('price')) not in (int, float)
              or not 0 < p['price'] <= 3760 or not p['price'] < old['price']
              or type(p.get('bandwidth')) is not int or not 100 <= p['bandwidth'] <= 1000):
              raise RuntimeError('Price or bandwidth is not within selected limits')
          print('MOSCOW_PRICE_CHECK=' + json.dumps({'preset_id': 6871, 'source_server_price_rub': old['price'], 'target_server_price_rub': p['price'], 'cpu': 2, 'ram_mb': 2048, 'disk_mb': 40960, 'note': 'IP and backups are separate; source remains running during migration'}), flush=True)
          try:
              result = call('POST', '/servers', {'name': TARGET_NAME, 'comment': TARGET_COMMENT, 'os_id': 99, 'preset_id': 6871, 'availability_zone': 'msk-1', 'bandwidth': p['bandwidth'], 'is_ddos_guard': False, 'is_local_network': False, 'ssh_keys_ids': []})
          except CloudError as exc:
              print('MOSCOW_ULTRA_REJECTED=' + json.dumps({'http_status': exc.status, 'error_code': exc.code, 'source_untouched': True, 'staging_count': sum(s.get('name') == TARGET_NAME for s in inventory())}), flush=True)
              raise
          target_id = result.get('server', {}).get('id')
          if type(target_id) is not int or target_id <= 0 or target_id == SOURCE_ID:
              raise RuntimeError('Uncertain creation result; no retry')
          print('RUSSIAN_VM_CREATED=' + json.dumps({'id': target_id, 'source_untouched': True, 'data_copied': False, 'server_price_rub': p['price']}), flush=True)
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              target = call('GET', '/servers/' + str(target_id))['server']
              identity = {'id': target_id, 'name': TARGET_NAME, 'comment': TARGET_COMMENT, 'preset_id': 6871, 'location': 'ru-3', 'availability_zone': 'msk-1', 'cpu': 2, 'ram': 2048}
              if any(target.get(key) != value for key, value in identity.items()):
                  raise RuntimeError('Created server identity mismatch; no further changes')
              if target.get('status') == 'on':
                  disks = target.get('disks', [])
                  if len(disks) != 1 or disks[0].get('size') != 40960 or disks[0].get('type') != 'nvme':
                      raise RuntimeError('Target disk mismatch')
                  ips = []
                  for network in target.get('networks', []):
                      if network.get('type') == 'public':
                          for entry in network.get('ips', []):
                              candidate = entry.get('ip') if isinstance(entry, dict) else entry
                              try:
                                  value = ipaddress.ip_address(candidate)
                                  if value.version == 4 and value.is_global:
                                      ips.append(str(value))
                              except ValueError:
                                  pass
                  print('RUSSIAN_VM_READY=' + json.dumps({'id': target_id, 'location': 'ru-3', 'availability_zone': 'msk-1', 'public_ipv4': ips, 'source_untouched': True, 'data_copied': False, 'old_server_deleted': False}), flush=True)
                  break
              if target.get('status') not in ('off', 'installing', 'turning_on', 'rebooting'):
                  raise RuntimeError('Unexpected staging status; no further order')
              time.sleep(10)
          else:
              raise RuntimeError('VM startup timeout; no further order')
