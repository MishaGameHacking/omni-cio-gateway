name: Render candidate53 production UI on owner laptop
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/workspace-redesign-visual.yml]
permissions:
  contents: read
concurrency:
  group: workspace-redesign-visual
  cancel-in-progress: false
env:
  RENDER_SOURCE_SHA: 45cf542b9a8c6b0c220b54dee9b7c08d874f9ee8
jobs:
  render:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 170
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 021a1e90e13066e95356f72e5ce16905f575a57c
          path: visual-tools-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: tools/render_workspace_redesign.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 45cf542b9a8c6b0c220b54dee9b7c08d874f9ee8
          path: visual-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Render actual Compose layouts with synthetic data and restore reference files
        shell: cmd
        working-directory: visual-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 ..\visual-tools-${{ github.run_id }}-${{ github.run_attempt }}\tools\render_workspace_redesign.py
          if errorlevel 1 exit /b 1
      - name: Preserve rendered screens and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: redesign-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/redesign-visual-${{ github.run_id }}-${{ github.run_attempt }}/
            visual-source-${{ github.run_id }}-${{ github.run_attempt }}/app/build/reports/screenshotTest/
          if-no-files-found: error
          retention-days: 7

