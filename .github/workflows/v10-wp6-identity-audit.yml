name: V10 WP6 Identity Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp6-identity-audit.yml"
      - ".github/workflows/self-hosted-windows-smoke.yml"
      - "docs/architecture/V10_WP6_**"
      - "docs/operations/V10_WP6_**"
      - "infrastructure/windows/*wp6*"
      - "scripts/*wp6*"
      - "tests/test_v10_wp6_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp6-identity-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lenovo least-privilege identity and ACL audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify static WP6 privilege contract
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp6_privilege_boundary.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify provisioning preflight without mutation
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\provision_wp6_privilege_boundary.ps1
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect sanitized WP6 identity profile
        shell: cmd
        run: |
          @echo off
          set "PROFILE=%RUNNER_TEMP%\wp6-identity-profile-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\collect_wp6_identity_profile.ps1 -OutputPath "%PROFILE%"
          if errorlevel 1 exit /b %errorlevel%
          echo WP6_IDENTITY_PROFILE_PATH=%PROFILE%>>"%GITHUB_ENV%"

      - name: Verify sentinel DACL with native Windows API
        shell: cmd
        run: |
          @echo off
          python scripts\augment_v10_wp6_native_acl_evidence.py "%WP6_IDENTITY_PROFILE_PATH%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Assess fail-closed WP6 Exit Gate evidence
        shell: cmd
        run: |
          @echo off
          set "RESULT=%RUNNER_TEMP%\wp6-assessment-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          python scripts\assess_v10_wp6_identity_profile.py "%WP6_IDENTITY_PROFILE_PATH%" --json > "%RESULT%"
          set "RC=%ERRORLEVEL%"
          type "%RESULT%"
          if not "%RC%"=="0" exit /b %RC%

      - name: Clean sanitized local evidence
        if: always()
        shell: bash
        run: |
          if [ -n "${WP6_IDENTITY_PROFILE_PATH:-}" ]; then rm -f "$(cygpath -u "$WP6_IDENTITY_PROFILE_PATH")"; fi
          rm -f "$(cygpath -u "$RUNNER_TEMP")/wp6-assessment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
