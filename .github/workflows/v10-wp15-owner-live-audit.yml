name: V10 WP15 Deferred Live Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "omni_cio/adapters/tinvest_read_v1.py"
      - "omni_cio/adapters/tinvest_connection_v1.py"
      - "omni_cio/adapters/tinvest_market_v1.py"
      - "omni_cio/adapters/tinvest_secret_v1.py"
      - "scripts/check_v10_wp15_ci_isolation.py"
      - "scripts/validate_v10_wp15_owner_evidence.py"
      - "docs/architecture/V10_WP15_TINVEST_READONLY_CONTRACT.md"
      - "docs/architecture/V10_WP15_LIVE_ACCEPTANCE_STATE.json"
      - "docs/operations/V10_WP15_OWNER_LIVE_READ_RUNBOOK.md"
      - "docs/master-plan/OMNI_CIO_V10_IDENTITY_MULTI_TENANT_ACCOUNT_AND_AUTHENTICATION_AMENDMENT.md"
      - ".github/workflows/v10-wp15-owner-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp15-deferred-live-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: WP15 deferred Web live-acceptance gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Classify CI access to private WP15 boundaries
        shell: cmd
        run: |
          python scripts\check_v10_wp15_ci_isolation.py --output "%RUNNER_TEMP%\wp15-boundary-classification.json"
          if not "%ERRORLEVEL%"=="0" exit /b %ERRORLEVEL%
          echo WP15_BOUNDARY_DIAGNOSTIC=%RUNNER_TEMP%\wp15-boundary-classification.json>> "%GITHUB_ENV%"

      - name: Upload sanitized boundary classification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp15-boundary-classification
          path: ${{ env.WP15_BOUNDARY_DIAGNOSTIC }}
          if-no-files-found: error
          retention-days: 3

      - name: Enforce CI isolation from private WP15 boundaries
        shell: cmd
        run: python scripts\check_v10_wp15_ci_isolation.py --enforce "%WP15_BOUNDARY_DIAGNOSTIC%"

      - name: Validate source-controlled deferred live acceptance
        shell: cmd
        run: |
          python scripts\validate_v10_wp15_owner_evidence.py > "%RUNNER_TEMP%\wp15-deferred-live-validation.json"
          set "AUDIT_EXIT=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\wp15-deferred-live-validation.json"
          if not "%AUDIT_EXIT%"=="0" exit /b %AUDIT_EXIT%
          echo WP15_DEFERRED_EVIDENCE=%RUNNER_TEMP%\wp15-deferred-live-validation.json>> "%GITHUB_ENV%"

      - name: Upload sanitized deferred-live evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp15-deferred-live-evidence
          path: ${{ env.WP15_DEFERRED_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
