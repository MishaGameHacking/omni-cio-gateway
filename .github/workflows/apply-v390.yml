name: Apply v3.9.0 Broker Report Reconciliation

on:
  push:
    branches:
      - v3.9.0-broker-report-reconciliation
    paths:
      - .v390/TRIGGER

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: v3.9.0-broker-report-reconciliation
          fetch-depth: 0

      - name: Reconstruct v3.9.0 sources
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          module_b64 = "".join(
              path.read_text(encoding="utf-8").strip()
              for path in sorted(Path(".v390").glob("module.*.b64"))
          )
          test_b64 = "".join(
              path.read_text(encoding="utf-8").strip()
              for path in sorted(Path(".v390").glob("test.*.b64"))
          )
          Path("broker_report_reconciliation.py").write_bytes(
              gzip.decompress(base64.b64decode(module_b64))
          )
          Path("tests/test_broker_report_reconciliation.py").write_bytes(
              gzip.decompress(base64.b64decode(test_b64))
          )
          PY

      - name: Patch stable gateway and Regression Shield
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("app.py")
          app_text = app_path.read_text(encoding="utf-8")
          import_marker = "import operations_analytics as operations_analytics_engine\n"
          import_line = (
              "import broker_report_reconciliation as "
              "broker_report_reconciliation_engine\n"
          )
          if import_line not in app_text:
              app_text = app_text.replace(import_marker, import_marker + import_line)
          app_text = app_text.replace(
              'APP_VERSION = "3.8.0"',
              'APP_VERSION = "3.9.0"',
              1,
          )
          app_text = app_text.replace(
              "v3.8.0 adds executed-only operations analytics with pagination "
              "diagnostics, currency-local cash-flow reconciliation, and "
              "duplicate protection.",
              "v3.9.0 adds asynchronous official broker-report generation, "
              "paginated report loading, and currency-local trade and "
              "commission reconciliation.",
          )
          register_call = (
              "\nbroker_report_reconciliation_engine.register_gateway(\n"
              "    app=app,\n"
              "    base=base,\n"
              "    app_version=APP_VERSION,\n"
              ")\n"
          )
          marker = "\napp.openapi_schema = None\n"
          if register_call not in app_text:
              app_text = app_text.replace(marker, register_call + marker)
          app_path.write_text(app_text, encoding="utf-8")

          regression_path = Path("tests/test_regression_shield.py")
          regression = regression_path.read_text(encoding="utf-8")
          regression = regression.replace(
              'EXPECTED_VERSION = "3.8.0"',
              'EXPECTED_VERSION = "3.9.0"',
          )
          action_anchor = (
              '    "/operations/analytics": "getOperationsAnalytics",\n'
          )
          action_line = (
              '    "/operations/broker-report-reconciliation": '
              '"getBrokerReportReconciliation",\n'
          )
          if action_line not in regression:
              regression = regression.replace(
                  action_anchor,
                  action_anchor + action_line,
              )
          protected_anchor = '    "/operations/analytics?days=1",\n'
          protected_line = (
              '    "/operations/broker-report-reconciliation?'
              'days=1&wait_seconds=0",\n'
          )
          if protected_line not in regression:
              regression = regression.replace(
                  protected_anchor,
                  protected_anchor + protected_line,
              )
          capability_anchor = (
              '    assert "operations_cash_flow_reconciliation" '
              'in capabilities\n'
          )
          capability_lines = (
              '    assert "broker_report_reconciliation" in capabilities\n'
              '    assert "broker_report_async_generation" in capabilities\n'
              '    assert "broker_report_trade_reconciliation" in capabilities\n'
          )
          if 'assert "broker_report_reconciliation" in capabilities' not in regression:
              regression = regression.replace(
                  capability_anchor,
                  capability_anchor + capability_lines,
              )
          schema_anchor = '    assert "complete" in operations_properties\n'
          schema_lines = (
              '\n    broker_schema = schema["paths"]'
              '["/operations/broker-report-reconciliation"]'
              '["get"]["responses"]["200"]["content"]'
              '["application/json"]["schema"]\n'
              '    broker_properties = broker_schema["properties"]\n'
              '    assert "report_generation" in broker_properties\n'
              '    assert "broker_report_summary" in broker_properties\n'
              '    assert "trade_reconciliation" in broker_properties\n'
              '    assert "commission_reconciliation" in broker_properties\n'
              '    assert "cash_flow_reconciliation" in broker_properties\n'
              '    assert "quality" in broker_properties\n'
          )
          if 'broker_report_summary" in broker_properties' not in regression:
              regression = regression.replace(
                  schema_anchor,
                  schema_anchor + schema_lines,
              )
          regression_path.write_text(regression, encoding="utf-8")

          shield_path = Path(".github/workflows/regression-shield.yml")
          shield = shield_path.read_text(encoding="utf-8")
          shield = shield.replace(
              "# v3.8.0 Operations Analytics & Cash Flow Reconciliation "
              "release checks.",
              "# v3.9.0 Broker Report & Operations Reconciliation release checks.",
          )
          branch_anchor = "      - v3.8.0-operations-analytics\n"
          branch_line = "      - v3.9.0-broker-report-reconciliation\n"
          if branch_line not in shield:
              shield = shield.replace(branch_anchor, branch_anchor + branch_line)
          shield = shield.replace(
              "operations_analytics.py tests",
              "operations_analytics.py broker_report_reconciliation.py tests",
          )
          shield = shield.replace(
              'assert app.app.version == "3.8.0"',
              'assert app.app.version == "3.9.0"',
          )
          capability_verify = (
              '          assert "operations_cash_flow_reconciliation" '
              'in app.base.CAPABILITIES\n'
          )
          capability_verify_add = (
              '          assert "broker_report_reconciliation" '
              'in app.base.CAPABILITIES\n'
              '          assert "broker_report_async_generation" '
              'in app.base.CAPABILITIES\n'
              '          assert "broker_report_trade_reconciliation" '
              'in app.base.CAPABILITIES\n'
          )
          if (
              'assert "broker_report_reconciliation" in app.base.CAPABILITIES'
              not in shield
          ):
              shield = shield.replace(
                  capability_verify,
                  capability_verify + capability_verify_add,
              )
          shield_path.write_text(shield, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Remove upgrade scaffolding and commit
        run: |
          rm -rf .v390
          rm -f .github/workflows/apply-v390.yml
          rm -f .github/workflows/upgrade-v390.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Release v3.9.0 Broker Report & Operations Reconciliation"
          git push origin HEAD:v3.9.0-broker-report-reconciliation
