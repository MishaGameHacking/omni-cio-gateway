name: Check the current VM's reported public uplink without generating traffic
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/public-uplink-observation.yml]
permissions:
  contents: read
  actions: read
env:
  EXPECTED_TOOLS_SHA: 'e9c49b0f7333ecddb0c25890aabc7804ff6dde8f'
  EXPECTED_TOOLS_RUN: '41087924449'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact successful owner WSL tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_TOOLS_SHA||r.path!=='.github/workflows/infrastructure-budget-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Exact verification required');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN),per_page:100});
            if(jobs.filter(j=>j.name==='verify'&&j.conclusion==='success'&&j.status==='completed').length!==1) throw new Error('Verify job missing');
            for(const path of ['tools/inspect_infrastructure_budget.py','tools/test_infrastructure_budget.py','tools/check_infrastructure_budget.py','.github/workflows/infrastructure-budget-tools.yml']) {
              const {data:a}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_TOOLS_SHA});
              const {data:b}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(a.sha!==b.sha) throw new Error('Tested tool changed');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only declared public-network rate or quota from the selected VM
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        shell: python
        run: |
          import json,os,sys
          from datetime import datetime,timezone
          sys.path.insert(0,"tools")
          import inspect_infrastructure_budget as observed
          doc=observed.ReadOnlyAPI(os.environ["TIMEWEB_CLOUD_TOKEN"]).get(observed.PATHS["server"])
          row=doc.get("server",{})
          if row.get("id")!=9417611 or row.get("project_id")!=2941515 or row.get("availability_zone")!="ams-1":
              raise RuntimeError("server_identity_changed")
          scopes=[("server",row)]
          networks=row.get("networks")
          if isinstance(networks,dict):
              for k in ("public","public_network","public_networks"):
                  public=networks.get(k)
                  for entry in public if isinstance(public,list) else [public]:
                      if isinstance(entry,dict): scopes.append(("public_network",entry))
          elif isinstance(networks,list):
              for entry in networks:
                  if isinstance(entry,dict) and entry.get("type") in {"public","public_network","public_ip"}:
                      scopes.append(("public_network",entry))
          fields=[]
          for scope,obj in scopes:
              for key in ("bandwidth","bandwidth_mbps","bandwidth_mbit","speed","speed_mbps","network_bandwidth",
                          "traffic_limit_gb","traffic_limit_tb","monthly_traffic_limit_gb","monthly_traffic_limit_tb","unlimited_traffic"):
                  if key not in obj: continue
                  value=obj[key]; n=observed.number(value)
                  if key=="unlimited_traffic" and type(value) is bool: val=value
                  elif n is not None: val=str(n)
                  else: continue
                  fields.append({"scope":scope,"field":key,"value":val})
          print("PUBLIC_UPLINK="+json.dumps({"observed_at":datetime.now(timezone.utc).isoformat(),"server_id":9417611,
              "public_fields":fields,"explicit_public_networks":len(scopes)-1,"synthetic_traffic_bytes":0,
              "bandwidth_measured":False,"ssh_attempted":False,"resource_changes":False}),flush=True)
