name: V10 Cloudflare Frontend npm Lock Synthesis

on:
  push:
    branches:
      - system/cloudflare-public-product
    paths:
      - .github/workflows/v10-cloudflare-frontend-npm-lock-synthesis.yml

permissions:
  contents: write

concurrency:
  group: v10-cloudflare-frontend-npm-lock-synthesis
  cancel-in-progress: false

jobs:
  synthesize-lock:
    name: Generate locked npm 11.16.0 bootstrap for frontend
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      TARGET_BRANCH: system/cloudflare-public-product

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact pushed repository without interactive credentials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Generate and atomically publish provider-compatible frontend npm lock
        shell: bash
        env:
          GH_WRITE: ${{ github.token }}
        run: |
          set -euo pipefail
          node_exe='/c/Program Files/nodejs/node.exe'
          npx_cmd='/c/Program Files/nodejs/npx.cmd'
          test "$("$node_exe" --version | tr -d '\r')" = 'v24.18.0'
          test "$("$npx_cmd" --yes npm@10.9.2 --version | tr -d '\r')" = '10.9.2'

          "$node_exe" - <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (pkg.engines?.node !== '24.18.0' || pkg.engines?.npm !== '10.9.2') {
            throw new Error('unexpected root provider engine baseline');
          }
          if (pkg.packageManager !== 'npm@10.9.2') {
            throw new Error('unexpected root provider packageManager baseline');
          }
          if (pkg.devDependencies?.npm !== undefined) {
            throw new Error('frontend npm bootstrap dependency already exists');
          }
          pkg.devDependencies = { npm: '11.16.0', ...pkg.devDependencies };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          "$npx_cmd" --yes npm@10.9.2 install --package-lock-only --ignore-scripts --no-audit --no-fund

          "$node_exe" - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          const npmPackage = lock.packages?.['node_modules/npm'];
          if (pkg.devDependencies?.npm !== '11.16.0') {
            throw new Error('root package is missing exact frontend npm bootstrap');
          }
          if (lock.lockfileVersion !== 3 || lock.requires !== true) {
            throw new Error('unexpected root lock format');
          }
          if (root?.devDependencies?.npm !== '11.16.0') {
            throw new Error('root lock is missing exact frontend npm bootstrap');
          }
          if (npmPackage?.version !== '11.16.0') {
            throw new Error('locked frontend npm package version mismatch');
          }
          if (typeof npmPackage.integrity !== 'string' || !npmPackage.integrity.startsWith('sha512-')) {
            throw new Error('locked frontend npm package integrity missing');
          }
          NODE

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'package-lock.json'
          test "${changed[1]}" = 'package.json'

          "$node_exe" - <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const token = process.env.GH_WRITE;
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedHead = process.env.EXPECTED_HEAD;
          const branch = process.env.TARGET_BRANCH;
          const shaPattern = /^[0-9a-f]{40}$/;
          const maxResponseBytes = 1024 * 1024;
          if (!token || !repository || !shaPattern.test(expectedHead || '') || !branch) {
            throw new Error('GitHub publish authority inputs invalid');
          }

          const branchPath = branch.split('/').map(encodeURIComponent).join('/');
          const requestJson = (method, path, body, expectedStatuses) => new Promise((resolve, reject) => {
            const encoded = body === undefined ? undefined : Buffer.from(JSON.stringify(body), 'utf8');
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'omni-cio-v10-lock-synthesis',
            };
            if (encoded !== undefined) {
              headers['Content-Type'] = 'application/json';
              headers['Content-Length'] = encoded.length;
            }
            const req = https.request({ hostname: 'api.github.com', path, method, headers }, (res) => {
              if ((res.statusCode || 0) >= 300 && (res.statusCode || 0) < 400) {
                res.resume();
                reject(new Error(`unexpected GitHub redirect status ${res.statusCode}`));
                return;
              }
              const chunks = [];
              let size = 0;
              res.on('data', (chunk) => {
                size += chunk.length;
                if (size > maxResponseBytes) {
                  req.destroy(new Error('GitHub response exceeded bounded size'));
                  return;
                }
                chunks.push(chunk);
              });
              res.on('end', () => {
                if (!expectedStatuses.includes(res.statusCode)) {
                  reject(new Error(`GitHub API request failed with status ${res.statusCode}`));
                  return;
                }
                try {
                  resolve(JSON.parse(Buffer.concat(chunks).toString('utf8')));
                } catch {
                  reject(new Error('GitHub API response was not valid JSON'));
                }
              });
            });
            req.setTimeout(30000, () => req.destroy(new Error('GitHub API request timed out')));
            req.on('error', reject);
            if (encoded !== undefined) req.write(encoded);
            req.end();
          });

          const assertSha = (value, label) => {
            if (!shaPattern.test(value || '')) throw new Error(`${label} SHA invalid`);
            return value;
          };

          (async () => {
            const ref = await requestJson(
              'GET',
              `/repos/${repository}/git/ref/heads/${branchPath}`,
              undefined,
              [200],
            );
            if (ref?.object?.sha !== expectedHead) {
              throw new Error('branch advanced during lock synthesis');
            }

            const parent = await requestJson(
              'GET',
              `/repos/${repository}/git/commits/${expectedHead}`,
              undefined,
              [200],
            );
            const baseTree = assertSha(parent?.tree?.sha, 'base tree');

            const entries = [];
            for (const path of ['package.json', 'package-lock.json']) {
              const content = fs.readFileSync(path).toString('base64');
              const blob = await requestJson(
                'POST',
                `/repos/${repository}/git/blobs`,
                { content, encoding: 'base64' },
                [201],
              );
              entries.push({ path, mode: '100644', type: 'blob', sha: assertSha(blob?.sha, path) });
            }

            const tree = await requestJson(
              'POST',
              `/repos/${repository}/git/trees`,
              { base_tree: baseTree, tree: entries },
              [201],
            );
            const treeSha = assertSha(tree?.sha, 'generated tree');
            const commit = await requestJson(
              'POST',
              `/repos/${repository}/git/commits`,
              {
                message: 'CI: lock frontend npm bootstrap',
                tree: treeSha,
                parents: [expectedHead],
              },
              [201],
            );
            const commitSha = assertSha(commit?.sha, 'generated commit');

            await requestJson(
              'PATCH',
              `/repos/${repository}/git/refs/heads/${branchPath}`,
              { sha: commitSha, force: false },
              [200],
            );
            console.log(`FRONTEND_NPM_LOCK_COMMIT=${commitSha}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : 'lock synthesis failed');
            process.exitCode = 1;
          });
          NODE

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
