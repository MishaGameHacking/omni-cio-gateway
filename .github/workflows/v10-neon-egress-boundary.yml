name: V10 Neon Egress Boundary Diagnostic

# ARCHIVE-IN-PLACE: Amendment 18 retired Neon from active V10 authority.
# Manual dispatch remains only so historical Actions provenance stays resolvable.
# Every job is hard-disabled; the retired provider must not be contacted by CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self_hosted:
    if: ${{ false }}
    name: Neon egress control / self-hosted Windows
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      status: ${{ steps.probe.outputs.status }}
      media: ${{ steps.probe.outputs.media }}
    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact diagnostic source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          test "$bootstrap_succeeded" -eq 1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Probe anonymous synthetic Neon API path
        id: probe
        shell: cmd
        run: python -m scripts.probe_v10_neon_egress_boundary probe

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          set +e
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  github_hosted:
    if: ${{ false }}
    name: Neon egress control / GitHub-hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      status: ${{ steps.probe.outputs.status }}
      media: ${{ steps.probe.outputs.media }}
    steps:
      - name: Bootstrap exact diagnostic source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Probe anonymous synthetic Neon API path
        id: probe
        shell: bash
        run: python3 -m scripts.probe_v10_neon_egress_boundary probe

  classify:
    if: ${{ false }}
    name: Neon egress boundary classification
    needs:
      - self_hosted
      - github_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Bootstrap exact diagnostic source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compare bounded egress evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.probe_v10_neon_egress_boundary compare \
            --self-status "${{ needs.self_hosted.outputs.status }}" \
            --self-media "${{ needs.self_hosted.outputs.media }}" \
            --hosted-status "${{ needs.github_hosted.outputs.status }}" \
            --hosted-media "${{ needs.github_hosted.outputs.media }}"
