name: Android 17 migration contract audit

on:
  push:
    branches: [audit/android17-project-20261020]
    paths:
      - .github/workflows/android17-contract-audit.yml
      - .github/scripts/**
      - tools/migrate_android17*
      - backend/**
      - app/**
      - ci-ui-driver/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-contract-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Identify the exact source and runtime contract
        shell: cmd
        run: |
          git rev-parse HEAD
          if errorlevel 1 exit /b 1
          py -3 -c "from backend.android_runtime_contract import MIN_SDK, COMPILE_SDK, TARGET_SDK, RUNTIME_PROFILES; assert (MIN_SDK,COMPILE_SDK,TARGET_SDK)==(37,37,37); assert {(p.api,p.page_size_bytes) for p in RUNTIME_PROFILES}=={(37,4096),(37,16384)}; print('ANDROID17_CONTRACT=verified-source-only')"
          if errorlevel 1 exit /b 1
      - name: Audit every tracked Python source
        shell: cmd
        run: |
          py -3 .github\scripts\audit_python_sources.py
          if errorlevel 1 exit /b 1
      - name: Test APK emulator and release verification contracts
        shell: cmd
        run: |
          py -3 -m unittest discover -s .github\scripts\tests -p "test_*.py" -q
          if errorlevel 1 exit /b 1
      - name: Create isolated backend environment
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\android17-contract-backend"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -r backend\requirements-dev.txt
          if errorlevel 1 exit /b 1
          echo ANDROID17_CONTRACT_VENV=%VENV%>>"%GITHUB_ENV%"
      - name: Run all backend tests without live services
        if: ${{ !cancelled() && env.ANDROID17_CONTRACT_VENV != '' }}
        shell: cmd
        env:
          TELEGRAM_CLIENT_ID: '123456'
          TELEGRAM_CLIENT_SECRET: test-only
          BACKEND_PUBLIC_URL: https://example.invalid
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ANALYSIS_SCHEDULER_ENABLED: 'false'
          AI_EXTERNAL_PROCESSING_APPROVED: 'false'
        run: |
          set "DATABASE_PATH=%RUNNER_TEMP%\android17-contract-tests.sqlite3"
          "%ANDROID17_CONTRACT_VENV%\Scripts\python.exe" -m pytest backend\tests -q
          if errorlevel 1 exit /b 1
      - name: Verify tests did not modify tracked sources
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          git diff --exit-code
          if errorlevel 1 exit /b 1
          echo This job does not certify device execution and cannot publish or deploy anything.
