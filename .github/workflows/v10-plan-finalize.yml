name: V10 plan finalization

on:
  push:
    branches:
      - v10/program-lock
    paths:
      - .github/workflows/v10-plan-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out planning branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v10/program-lock
          fetch-depth: 0

      - name: Install PDF verification dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Consolidate and verify V10 canonical plan
        shell: cmd
        run: python scripts\_finalize_v10_plan_once.py && git diff --check

      - name: Commit canonical plan consolidation
        shell: cmd
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add AGENTS.md docs/master-plan knowledge/17_V10_CURRENT_PROGRAM_STATUS.md &&
          (git diff --cached --quiet || (git commit -m "docs(v10): finalize canonical development plan" && git push origin HEAD:v10/program-lock))
