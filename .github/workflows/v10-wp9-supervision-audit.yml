name: V10 WP9 Supervision Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp9-supervision-audit.yml"
      - ".github/workflows/v10-wp9-supervision-compat.yml"
      - "docs/architecture/V10_WP9_**"
      - "docs/architecture/DECISIONS.md"
      - "docs/operations/V10_WP9_**"
      - "infrastructure/windows/*wp9*"
      - "scripts/*wp9*"
      - "tests/test_v10_wp9_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp9-supervision-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lenovo post-reboot supervision audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify WP9 repository contract
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp9_supervision_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Re-check inherited WP6-WP8 boundaries
        shell: cmd
        run: |
          @echo off
          python scripts\check_v10_wp6_privilege_boundary.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp7_bootstrap_contract.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts\check_v10_wp8_secret_store_contract.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect privacy-safe non-admin WP9 profile
        shell: cmd
        run: |
          @echo off
          set "PROFILE=%RUNNER_TEMP%\wp9-profile-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\collect_v10_wp9_supervision_profile.ps1 -AsJson > "%PROFILE%"
          if not exist "%PROFILE%" exit /b 1
          type "%PROFILE%"
          echo WP9_PROFILE_PATH=%PROFILE%>>"%GITHUB_ENV%"

      - name: Verify applied WP9 Exit Gate state
        shell: cmd
        run: |
          @echo off
          python scripts\assess_v10_wp9_supervision_profile.py "%WP9_PROFILE_PATH%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Clean sanitized local evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP9_PROFILE_PATH if exist "%WP9_PROFILE_PATH%" del /f /q "%WP9_PROFILE_PATH%"
          git reset --hard HEAD
          git clean -ffdx
