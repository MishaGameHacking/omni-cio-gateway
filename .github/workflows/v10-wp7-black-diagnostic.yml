name: V10 WP7 Black Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-wp7-black-diagnostic.yml"
      - "scripts/check_v10_wp7_bootstrap_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Show exact Black 26.3.1 diff
        run: |
          python -m pip install --disable-pip-version-check --no-input "black==26.3.1"
          black --version
          black --diff --color=never scripts/check_v10_wp7_bootstrap_contract.py
