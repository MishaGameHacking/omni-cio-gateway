name: V10 WP7 Black Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-wp7-black-diagnostic.yml"
      - "scripts/check_v10_wp7_bootstrap_contract.py"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Apply exact Black 26.3.1 formatting
        run: |
          python -m pip install --disable-pip-version-check --no-input "black==26.3.1"
          black scripts/check_v10_wp7_bootstrap_contract.py
          if git diff --quiet -- scripts/check_v10_wp7_bootstrap_contract.py; then
            echo "Checker already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_v10_wp7_bootstrap_contract.py
          git commit -m "style(wp7): apply Black 26.3.1"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
