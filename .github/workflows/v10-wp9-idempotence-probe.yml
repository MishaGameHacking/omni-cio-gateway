name: V10 WP9 Idempotence Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-wp9-idempotence-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Hosted Windows Task Scheduler semantic probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact WP9 task round-trip predicates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $folderName = "OmniCIO-WP9-Idempotence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $taskPath = "\$folderName\V10\"
          $taskDescription = "OMNI-CIO-V10-WP9-OWNED-v1"
          $powershellExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $localServiceSid = [System.Security.Principal.SecurityIdentifier]::new("S-1-5-19")
          $service = New-Object -ComObject "Schedule.Service"
          $service.Connect()
          $root = $service.GetFolder("\")

          function Convert-PrincipalToSid {
            param([string]$UserId)
            try {
              if ($UserId -match '^S-1-') {
                return [System.Security.Principal.SecurityIdentifier]::new($UserId)
              }
              $account = [System.Security.Principal.NTAccount]::new($UserId)
              return $account.Translate([System.Security.Principal.SecurityIdentifier])
            }
            catch { return $null }
          }

          function Test-Task {
            param(
              [string]$TaskName,
              [string]$ExpectedArguments,
              [bool]$ExpectedEnabled,
              [bool]$HealthTask
            )
            $task = Get-ScheduledTask -TaskPath $taskPath -TaskName $TaskName -ErrorAction Stop
            $principalSid = Convert-PrincipalToSid -UserId ([string]$task.Principal.UserId)
            $actions = @($task.Actions)
            $triggers = @($task.Triggers)
            $checks = [ordered]@{
              description = ([string]$task.Description -eq $taskDescription)
              principal = ($null -ne $principalSid -and $principalSid.Value -eq $localServiceSid.Value)
              action_count = ($actions.Count -eq 1)
              action_execute = ($actions.Count -eq 1 -and ([string]$actions[0].Execute).Equals($powershellExe, [System.StringComparison]::OrdinalIgnoreCase))
              action_arguments = ($actions.Count -eq 1 -and [string]$actions[0].Arguments -eq $ExpectedArguments)
              enabled = ([bool]$task.Settings.Enabled -eq $ExpectedEnabled)
              restart_count = ([int]$task.Settings.RestartCount -eq 3)
              multiple_instances = ([string]$task.Settings.MultipleInstances -eq "IgnoreNew")
            }
            if ($HealthTask) {
              $bootCount = @($triggers | Where-Object { $_.CimClass.CimClassName -eq "MSFT_TaskBootTrigger" }).Count
              $dailyCount = @($triggers | Where-Object { $_.CimClass.CimClassName -eq "MSFT_TaskDailyTrigger" }).Count
              $checks.triggers = ($bootCount -eq 1 -and $dailyCount -eq 1 -and $triggers.Count -eq 2)
            }
            else {
              $checks.triggers = ($triggers.Count -eq 0)
            }
            $failed = @($checks.GetEnumerator() | Where-Object { $_.Value -ne $true } | ForEach-Object { $_.Key })
            Write-Host ("WP9 idempotence probe {0}: failed=[{1}]" -f $TaskName, ($failed -join ','))
            if ($failed.Count -gt 0) { return $false }
            return $true
          }

          function New-Settings {
            New-ScheduledTaskSettingsSet `
              -RestartCount 3 `
              -RestartInterval (New-TimeSpan -Seconds 60) `
              -ExecutionTimeLimit (New-TimeSpan -Minutes 10) `
              -MultipleInstances IgnoreNew `
              -StartWhenAvailable
          }

          try {
            [void]$root.CreateFolder($folderName)
            $folder = $service.GetFolder("\$folderName")
            [void]$folder.CreateFolder("V10")

            $principal = New-ScheduledTaskPrincipal `
              -UserId "NT AUTHORITY\LOCAL SERVICE" `
              -LogonType ServiceAccount `
              -RunLevel Limited

            $healthName = "OmniCIO.V10.HealthSupervisor"
            $healthArgs = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\OmniCIO\services\wp9\deployed\wp9_health_supervisor.ps1" -ContractPath "C:\ProgramData\OmniCIO\services\wp9\deployed\V10_WP9_SUPERVISION_CONTRACT.json"'
            $healthAction = New-ScheduledTaskAction -Execute $powershellExe -Argument $healthArgs
            $healthDefinition = New-ScheduledTask `
              -Action $healthAction `
              -Principal $principal `
              -Settings (New-Settings) `
              -Trigger @(
                (New-ScheduledTaskTrigger -AtStartup),
                (New-ScheduledTaskTrigger -Daily -At ([datetime]::Today.AddMinutes(5)))
              ) `
              -Description $taskDescription
            Register-ScheduledTask -TaskName $healthName -TaskPath $taskPath -InputObject $healthDefinition -Force | Out-Null

            $sealedName = "OmniCIO.V10.CoreApi"
            $sealedArgs = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\ProgramData\OmniCIO\services\wp9\deployed\wp9_component_guard.ps1" -ComponentId core_api'
            $sealedAction = New-ScheduledTaskAction -Execute $powershellExe -Argument $sealedArgs
            $sealedDefinition = New-ScheduledTask `
              -Action $sealedAction `
              -Principal $principal `
              -Settings (New-Settings) `
              -Description $taskDescription
            Register-ScheduledTask -TaskName $sealedName -TaskPath $taskPath -InputObject $sealedDefinition -Force | Out-Null
            Disable-ScheduledTask -TaskPath $taskPath -TaskName $sealedName | Out-Null

            $healthOk = Test-Task -TaskName $healthName -ExpectedArguments $healthArgs -ExpectedEnabled $true -HealthTask $true
            $sealedOk = Test-Task -TaskName $sealedName -ExpectedArguments $sealedArgs -ExpectedEnabled $false -HealthTask $false
            if (-not $healthOk -or -not $sealedOk) { exit 1 }
          }
          finally {
            Unregister-ScheduledTask -TaskPath $taskPath -TaskName "OmniCIO.V10.HealthSupervisor" -Confirm:$false -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskPath $taskPath -TaskName "OmniCIO.V10.CoreApi" -Confirm:$false -ErrorAction SilentlyContinue
            try { $service.GetFolder("\$folderName").DeleteFolder("V10", 0) } catch { }
            try { $root.DeleteFolder($folderName, 0) } catch { }
          }
