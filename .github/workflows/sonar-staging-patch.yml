name: Export Sonar staging source

on:
  push:
    branches:
      - codex/sonar50-staging-2026-10-28

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/sonar50-staging-2026-10-28
          fetch-depth: 1
          persist-credentials: false
      - name: Archive tracked source
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/sonar-staging-source.zip" HEAD
      - name: Retain source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-staging-source
          path: ${{ runner.temp }}/sonar-staging-source.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
