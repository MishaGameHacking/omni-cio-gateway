    raise RuntimeError("unexpected_worker_phase")


def _prepare_control(root, state, phase, identity):
    first = phase in ("build", "runtime-prepare")
    if first:
        state.mkdir(exist_ok=False)
        env, _ = test_environment(root, state)
        source = source_identity(root, identity)
        save(state / SOURCE_RECEIPT, source)
        save(state / "identity.json", identity)
    else:
        checked(state, directory=True)
        need(read_json(state / "identity.json") == identity, "runtime_context_changed")
        need(source_identity(root, identity) == read_json(state / SOURCE_RECEIPT), "source_changed_between_phases")
        env, _ = test_environment(root, state)
    return first, env


def _emulator_lease(root):
    lease_bytes = read_bytes(root / ".github/scripts/emulator_lease.py", MAX_JSON_BYTES)
    need(git_blob(lease_bytes) == LEASE_BLOB, "canonical_emulator_lease_changed")
    sys.path.insert(0, str(root / ".github/scripts"))
    import emulator_lease
    return emulator_lease


def _controller_record(state, phase, identity):
    record = {"phase": phase, **identity, "host": HOST, "started_at": now(), "status": "running",
              "worker_started": False, "owned_processes_after": None, "publication_authorized": False}
    destination = state / (phase + "-controller.json")
    need(not destination.exists(), "controller_phase_already_recorded")
    save(destination, record)
    return record, destination


def _worker_arguments(state, phase):
    admitted_phase = _worker_phase(phase)
    python = state / "venv/Scripts/python.exe" if admitted_phase in ("profile-16384", "profile-4096") else Path(sys.executable)
    return [str(python), str(Path(__file__).resolve()), "worker", "--phase", admitted_phase]


def _await_worker(process, phase):
    deadline = time.monotonic() + PHASE_SECONDS[phase]
    while process.poll() is None:
        remaining = deadline - time.monotonic()
        need(remaining > 0, "owned_worker_deadline_exceeded")
        try:
            process.wait(timeout=min(30, remaining))
        except subprocess.TimeoutExpired:
            print("WINDOWS_ANDROID_PROGRESS=" + json.dumps({"phase": phase, "running": True}), flush=True)


def _cleanup_worker(job, process, record):
    try:
        if job is not None:
            if job.active():
                job.stop()
            end = time.monotonic() + 30
            while job.active() and time.monotonic() < end:
                time.sleep(0.2)
            record["owned_processes_after"] = job.active()
            need(record["owned_processes_after"] == 0, "owned_processes_remain")
    finally:
        try:
            if job is not None:
                job.close()
        finally:
            if process is not None and process.poll() is None:
                process.kill()
                process.wait(timeout=15)


def _run_worker(root, state, phase, env, record):
    job = OwnedJob()
    process = None
    try:
        with (state / (phase + "-worker.log")).open("xb") as log:
            process = subprocess.Popen(_worker_arguments(state, phase), cwd=root, env=env, stdin=subprocess.PIPE,
                                       stdout=log, stderr=subprocess.STDOUT, close_fds=True)
            job.attach(process)
            record.update(worker_started=True, worker_pid=process.pid)
            process.stdin.write(b"WINDOWS_OWNED_JOB_READY\\n")
            process.stdin.close()
            _await_worker(process, phase)
            record["worker_exit_code"] = process.returncode
            need(process.returncode == 0, "owned_worker_failed")
    finally:
        _cleanup_worker(job, process, record)


def _finalize_control(root, state, phase, identity, first, record, error):
    if phase == "profile-16384":
        base = root / "app/build/outputs/apk/preview"
        if (base / "ui-screens").exists():
            snapshot_ui(base / "ui-screens", base / "ui-screens-api37-16384")
    need(source_identity(root, identity) == read_json(state / SOURCE_RECEIPT), "sources_changed_during_worker")
    if not first:
        require_runtime_inputs(root, state, identity)
    if error is None:
        record["status"] = "passed"


def control(root, state, phase, identity):
    phase = _worker_phase(phase)
    first, env = _prepare_control(root, state, phase, identity)
    emulator_lease = _emulator_lease(root)
    lease_context = nullcontext() if phase in ("profile-16384", "profile-4096") else emulator_lease.exclusive_emulator()
    record, destination = _controller_record(state, phase, identity)
    error = None
    try:
        with lease_context:
            _run_worker(root, state, phase, env, record)
    except BaseException as failure:
        error = failure
        record.update(status="failed", error_type=type(failure).__name__, error=str(failure)[:500])
    try:
        _finalize_control(root, state, phase, identity, first, record, error)
    except BaseException as failure:
        if error is None:
            error = failure
        record.update(status="failed", final_integrity_error=type(failure).__name__)
    record["finished_at"] = now()
    save(destination, record)
    print("WINDOWS_ANDROID_CONTROLLER=" + json.dumps(record, sort_keys=True), flush=True)
    if error is not None:
        from ci_failure_diagnostics import print_worker_failure
        print_worker_failure(state, phase, read_bytes)
        raise error

