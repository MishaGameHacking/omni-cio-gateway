name: Apply bounded Sonar staging patches

on:
  push:
    branches:
      - codex/sonar50-staging-2026-10-28

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/sonar50-staging-2026-10-28
          fetch-depth: 0
      - name: Apply exact source patches
        shell: bash
        run: |
          python -m py_compile .github/scripts/fix_sonar_patcher.py
          python .github/scripts/fix_sonar_patcher.py
          python -m py_compile .github/scripts/apply_sonar_staging_patches.py
          python .github/scripts/apply_sonar_staging_patches.py
          rm .github/scripts/fix_sonar_patcher.py
          rm .github/scripts/apply_sonar_staging_patches.py
          rm .github/workflows/sonar-staging-patch.yml
      - name: Commit exact patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "fix(sonar): apply bounded source patches"
          git push origin HEAD:codex/sonar50-staging-2026-10-28
