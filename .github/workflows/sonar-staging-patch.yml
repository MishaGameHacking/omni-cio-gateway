          choice_helpers = '''def _choice_window(tree):
    active_window = active_window_id(tree)
    windows = [child for child in tree if child.tag == "node"
               and _window_id(child) == active_window and _bool(child, "visible-to-user")]
    if len(windows) != 1:
        raise AssertionError("Choice requires one active visible owned window")
    window = windows[0]
    window_package = window.get("package", "")
    if not window_package:
        raise AssertionError("Choice window package is missing")
    return active_window, window_package, bounds(window)


def _choice_owner(tree, label, resource, active_window):
    if resource:
        owners = [node for node in visible_resource(tree, resource) if _window_id(node) == active_window]
        if label:
            owners = [node for node in owners if node.get("text") == label or node.get("content-desc") == label]
    else:
        owners = [node for node in visible_label(tree, label) if _window_id(node) == active_window]
    if len(owners) != 1:
        raise AssertionError("Choice owner is missing or ambiguous")
    return owners[0]


def _validate_choice_owner(owner, active_window, window_package, window_bounds, density):
    owner_window_id = _window_id(owner)
    owner_package = owner.get("package", "")
    owner_bounds = bounds(owner)
    owner_scale = node_scale(owner)
    if owner_window_id != active_window or owner_package != window_package or not _bool(owner, "visible-to-user"):
        raise AssertionError("Choice owner is foreign or hidden")
    if not _contains(window_bounds, owner_bounds):
        raise AssertionError("Choice owner is clipped outside the active window")
    if not .5 <= owner_scale <= 3 or abs(owner_scale - density) > .05:
        raise AssertionError("Choice owner density does not match the native capture")
    return owner_bounds, owner_package, owner_scale


def _choice_role(owner, owner_package, checked, enabled):
    roles = [node for node in owner.iter()
             if node.get("role") in {"RadioButton", "Checkbox", "Switch"}
             and node.get("package") == owner_package and _bool(node, "visible-to-user")
             and _bool(node, "checked") == checked]
    if enabled is not None:
        roles = [node for node in roles if _bool(node, "enabled") == enabled]
    if len(roles) != 1:
        raise AssertionError("Expected exactly one visible checked role under the choice")
    return roles[0]


def _validate_choice_role(role, owner_bounds, owner_package, active_window, owner_scale):
    role_bounds = bounds(role)
    if role.get("package") != owner_package or _window_id(role) != active_window or not _contains(owner_bounds, role_bounds):
        raise AssertionError("Choice role escaped its owned row or window")
    if (role_bounds[2] - role_bounds[0]) / owner_scale < 48 or (role_bounds[3] - role_bounds[1]) / owner_scale < 48:
        raise AssertionError("Choice role target is smaller than 48dp")


def _owned_choice_nodes(owner, owner_bounds, owner_package, active_window):
    visible_owned = []
    for node in owner.iter():
        if node.get("package") == owner_package and _bool(node, "visible-to-user"):
            if _window_id(node) != active_window or not _contains(owner_bounds, bounds(node)):
                raise AssertionError("Choice descendant is outside its owned row")
            visible_owned.append(node)
    return visible_owned


def _validate_choice_text(owner, role, visible_owned, label, checked):
    labels = [node_text(node) for node in visible_owned if node.get("text")]
    if label not in labels and owner.get("content-desc") != label:
        raise AssertionError("Choice label is not in the exact native row")
    state = state_description(role)
    if not labels and not owner.get("content-desc") and not state:
        raise AssertionError("Choice has no accessible label or state")
    if state:
        expected = "selected" if checked else "not selected"
        if checked and "not " in state.lower():
            raise AssertionError("Checked role exposes the opposite state")
        if not checked and expected not in state.lower() and state.lower() in {"selected", "checked"}:
            raise AssertionError("Unchecked role exposes the opposite state")


def checked_choice(tree, label, checked, *, resource=None, enabled=None, density=1.0):
    if density <= 0 or density != density:
        raise AssertionError("Choice density is invalid")
    active_window, window_package, window_bounds = _choice_window(tree)
    owner = _choice_owner(tree, label, resource, active_window)
    owner_bounds, owner_package, owner_scale = _validate_choice_owner(
        owner, active_window, window_package, window_bounds, density)
    role = _choice_role(owner, owner_package, checked, enabled)
    _validate_choice_role(role, owner_bounds, owner_package, active_window, owner_scale)
    visible_owned = _owned_choice_nodes(owner, owner_bounds, owner_package, active_window)
    _validate_choice_text(owner, role, visible_owned, label, checked)
    return role

