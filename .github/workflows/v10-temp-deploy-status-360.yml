name: TEMP V10 Deploy Status 360

on:
  push:
    branches:
      - v10/temp-site-probe-360
    paths:
      - ".github/workflows/v10-temp-deploy-status-360.yml"
      - "scripts/v10_temp_deploy_status_360.py"

permissions:
  actions: read
  contents: write

jobs:
  diagnose-exact-main-deploy:
    name: Diagnose exact-main Phase 4 deploy
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: "4e10a04376523248cba8d5fa2ec8288de345e1e9"
      PREVIEW_ROOT: "https://omni-cio-v10-web.onrender.com/"
      RESULT_REPO_PATH: "tmp/v10-deploy-status-360.txt"
      RESULT_BRANCH: "v10/temp-site-probe-360"

    steps:
      - name: Bootstrap repository and Python runtime
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set "GIT_TERMINAL_PROMPT=0"
          set "GCM_INTERACTIVE=Never"
          set "GH_TOKEN=%GH_TOKEN%"
          if exist repo rmdir /s /q repo
          git -c credential.helper= -c http.extraHeader="Authorization: Bearer %GH_TOKEN%" clone --filter=blob:none --no-checkout "https://github.com/%GITHUB_REPOSITORY%.git" repo
          if errorlevel 1 exit /b 20
          cd repo
          git -c credential.helper= -c http.extraHeader="Authorization: Bearer %GH_TOKEN%" fetch --depth=1 origin "%GITHUB_SHA%"
          if errorlevel 1 exit /b 21
          git -c advice.detachedHead=false checkout --detach "%GITHUB_SHA%"
          if errorlevel 1 exit /b 22
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Collect and publish sanitized deployment evidence
        shell: cmd
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C:\actions-runner\_tool\omni-python-3.12.10\python.exe scripts\v10_temp_deploy_status_360.py
