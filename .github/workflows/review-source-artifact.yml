name: Private review source artifact
on:
  push:
    branches: [feature/evidence-risk-rebalancing]
    paths: [.github/workflows/review-source-artifact.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Read tracked-only private snapshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const directory = path.join(process.env.RUNNER_TEMP, `review-source-${context.runId}`);
            fs.mkdirSync(directory, {recursive:true});
            const sources = [
              ['831','84dce6c3b439000073cc94dcd471a8b06f79c296','2434046234d41c682cc5a4ed28c799775b0bcf798fe81dff3c3b555f5dca2496',1932384],
              ['832','e3acace94d2aead141695e44295498406ccb0545','41c504aca1090c6bbac0d81fab54f5a4fa3d288281a057eb74e211eb7da3dd19',1944877],
              ['833','521fa5238c46f6ad4fc672bd0b1bd21b6a62fd7a','b931268f91484e800358e81b4f689c381dfb34d54b17cd7f6e34237cfcc5f6e6',1961126],
              ['main','27e11beda95603f82b63a2b240308adb8e7e9d97','2f8205f89246bd9c2352eebe21b558e5956e2f3360273e10a827357ec39e56b2',1885617],
            ];
            for (const [name,sha,digest,size] of sources) {
              const object = (await github.rest.git.getBlob({...context.repo,file_sha:sha})).data;
              if (object.encoding !== 'base64') throw new Error('Unexpected blob encoding');
              const bytes = Buffer.from(object.content,'base64');
              if (bytes.length !== size || crypto.createHash('sha256').update(bytes).digest('hex') !== digest) throw new Error('Snapshot integrity mismatch');
              fs.writeFileSync(path.join(directory, `source-${name}.zip`),bytes,{flag:'wx'});
              core.info(`VERIFIED_SOURCE=${name}:${digest}`);
            }
            core.exportVariable('REVIEW_SOURCE_DIRECTORY',directory);
      - name: Retain private source for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-review-sources
          path: ${{ env.REVIEW_SOURCE_DIRECTORY }}/*.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
