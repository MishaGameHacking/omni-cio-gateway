name: Sonar diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sonar-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Query public SonarQube Cloud issue API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          PROJECT = "MishaGameHacking_omni-cio-gateway"
          params = urllib.parse.urlencode({
              "componentKeys": PROJECT,
              "branch": "main",
              "ps": "500",
          })
          url = "https://sonarcloud.io/api/issues/search?" + params
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "omni-cio-sonar-diagnostics/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          print(json.dumps({
              "total": data.get("total"),
              "issues": [
                  {
                      "key": item.get("key"),
                      "rule": item.get("rule"),
                      "severity": item.get("severity"),
                      "type": item.get("type"),
                      "component": item.get("component"),
                      "line": item.get("line"),
                      "message": item.get("message"),
                      "status": item.get("status"),
                      "issueStatus": item.get("issueStatus"),
                      "creationDate": item.get("creationDate"),
                      "updateDate": item.get("updateDate"),
                      "cleanCodeAttribute": item.get("cleanCodeAttribute"),
                      "impacts": item.get("impacts"),
                  }
                  for item in data.get("issues", [])
              ],
          }, indent=2, sort_keys=True))
          PY
