name: Sonar diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sonar-diagnostics.yml"

permissions:
  checks: read

jobs:
  inspect:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read existing Sonar check annotations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          root = "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "omnicio-check-annotations/1.0",
          }

          def read(path):
              request = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          targets = (
              ("portfolio-pr-658", 110532674368, "f00b4f7d1d5f4b6bd8db601170d8eafc550dabff"),
              ("historical-pr-620", 109972480542, "b7beb5243973016886d379bcb25a809a95862f29"),
              ("historical-pr-642", 110289452922, "af999b1a1201ae2f26efb5b7cd13141950148477"),
              ("main", 110471295666, "eac2ebfcf64fa494b59b772fda9490b2c4e1823e"),
          )
          for label, check_id, expected_sha in targets:
              check = read(f"/check-runs/{check_id}")
              if check["head_sha"] != expected_sha or check["name"] != "SonarCloud Code Analysis":
                  raise RuntimeError("Unexpected check identity")
              expected = check["output"]["annotations_count"]
              if not 0 <= expected <= 1000:
                  raise RuntimeError("Annotation count exceeds diagnostic bound")
              annotations = []
              for page in range(1, 11):
                  batch = read(f"/check-runs/{check_id}/annotations?per_page=100&page={page}")
                  annotations.extend({
                      key: item.get(key)
                      for key in ("path", "start_line", "end_line", "annotation_level", "title", "message")
                  } for item in batch)
                  if len(batch) < 100:
                      break
              if len(annotations) != expected:
                  raise RuntimeError("Incomplete annotation response")
              print(json.dumps({
                  "target": label, "head_sha": expected_sha,
                  "check_id": check_id, "count": len(annotations),
                  "annotations": annotations,
              }, ensure_ascii=True, sort_keys=True))

          public_paths = (
              "/api/components/show?component=MishaGameHacking_omni-cio-gateway",
              "/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&resolved=false&ps=100",
          )
          for path in public_paths:
              request = urllib.request.Request(
                  "https://sonarcloud.io" + path,
                  headers={"Accept": "application/json", "User-Agent": "omnicio-public-sonar-diagnostics/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.load(response)
                  component = data.get("component", {})
                  print(json.dumps({
                      "public_sonar_path": path, "status": 200,
                      "component": {key: component.get(key) for key in ("key", "visibility", "qualifier")},
                      "total": data.get("total"),
                      "issues": [{
                          key: item.get(key)
                          for key in ("key", "rule", "severity", "type", "component", "line", "message", "status")
                      } for item in data.get("issues", [])],
                  }, sort_keys=True))
              except urllib.error.HTTPError as error:
                  print(json.dumps({"public_sonar_path": path, "status": error.code}))
          PY
