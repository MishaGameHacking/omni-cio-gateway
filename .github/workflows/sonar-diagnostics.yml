name: Sonar diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sonar-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Query public SonarQube Cloud APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          PROJECT = "MishaGameHacking_omni-cio-gateway"

          def get(path, params):
              query = urllib.parse.urlencode(params)
              url = "https://sonarcloud.io" + path + "?" + query
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "omni-cio-sonar-diagnostics/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          issues = get(
              "/api/issues/search",
              {
                  "componentKeys": PROJECT,
                  "branch": "main",
                  "ps": "500",
              },
          )
          measures = get(
              "/api/measures/component",
              {
                  "component": PROJECT,
                  "branch": "main",
                  "metricKeys": (
                      "security_rating,new_security_rating,"
                      "vulnerabilities,new_vulnerabilities,"
                      "security_issues,new_security_issues"
                  ),
              },
          )

          print("MEASURES")
          print(json.dumps(measures, indent=2, sort_keys=True))
          print("ISSUES")
          print(json.dumps({
              "total": issues.get("total"),
              "issues": [
                  {
                      "key": item.get("key"),
                      "rule": item.get("rule"),
                      "severity": item.get("severity"),
                      "type": item.get("type"),
                      "component": item.get("component"),
                      "line": item.get("line"),
                      "message": item.get("message"),
                      "status": item.get("status"),
                      "issueStatus": item.get("issueStatus"),
                      "creationDate": item.get("creationDate"),
                      "updateDate": item.get("updateDate"),
                      "cleanCodeAttribute": item.get("cleanCodeAttribute"),
                      "impacts": item.get("impacts"),
                  }
                  for item in issues.get("issues", [])
              ],
          }, indent=2, sort_keys=True))
          PY
