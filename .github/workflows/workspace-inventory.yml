name: Inspect current workspace and Timeweb model prices
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/workspace-inventory.yml, tools/prepare_workspace_inventory.py, tools/read_ai_catalogue.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - run: python3 tools/read_ai_catalogue.py
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      - run: python3 tools/prepare_workspace_inventory.py
      - run: python3 tools/owner_plan_transport_20261027.py
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: workspace-inventory-${{ github.run_id }}
          path: plan-reports/
          retention-days: 7
