name: Probe Timeweb AI capabilities

on:
  push:
    branches:
      - ops/timeweb-ai-bootstrap
    paths:
      - ".github/scripts/probe_timeweb_ai.py"
      - ".github/workflows/timeweb-ai-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Inspect Timeweb AI access
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ops/timeweb-ai-bootstrap
          persist-credentials: false
          clean: true

      - name: Probe Timeweb AI access without exposing credentials
        shell: cmd
        run: |
          py -3 .github\scripts\probe_timeweb_ai.py
          if errorlevel 1 exit /b 1
