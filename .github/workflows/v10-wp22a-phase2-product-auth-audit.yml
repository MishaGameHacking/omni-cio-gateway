name: V10 WP22A Phase 2 Product Auth Tenant Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp22a-phase2-auth-tenant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase2-product-auth-tenant:
    name: WP22A Phase 2 product-auth tenant gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected Python 3.12.10 runtime
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 20

      - name: Create isolated Phase 2 Python environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp22a-phase2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked Phase 2 dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import fastapi; import psycopg; import pytest; import ruff; print('WP22A Phase 2 toolchain imports OK')"

      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 21
          echo WP22A Phase 2 exact head: %ACTUAL_HEAD%

      - name: Run Phase 2 static quality and product-auth unit tests
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff check omni_cio\web\api_v1.py omni_cio\web\product_identity_v1.py omni_cio\web\persistence_v1.py scripts\rehearse_v10_wp22a_phase2_tenant_security.py scripts\run_v10_wp22a_phase2_rehearsal_watchdog.py tests\test_v10_wp22a_product_identity.py tests\test_v10_wp22a_phase2_api_tenant_scope.py tests\test_v10_wp22a_phase2_source_contract.py tests\contracts\api\test_web_api_v1_contract.py
          if errorlevel 1 exit /b 30
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff format --check omni_cio\web\api_v1.py omni_cio\web\product_identity_v1.py omni_cio\web\persistence_v1.py scripts\rehearse_v10_wp22a_phase2_tenant_security.py scripts\run_v10_wp22a_phase2_rehearsal_watchdog.py tests\test_v10_wp22a_product_identity.py tests\test_v10_wp22a_phase2_api_tenant_scope.py tests\test_v10_wp22a_phase2_source_contract.py tests\contracts\api\test_web_api_v1_contract.py
          if errorlevel 1 exit /b 31
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m mypy
          if errorlevel 1 exit /b 32
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m pytest -q tests\test_v10_wp22a_product_identity.py tests\test_v10_wp22a_phase2_api_tenant_scope.py tests\test_v10_wp22a_phase2_source_contract.py tests\contracts\api\test_web_api_v1_contract.py tests\test_v10_wp17_sessions.py tests\test_v10_wp17_broker_provisioning.py tests\test_v10_wp17_web_api.py
          if errorlevel 1 exit /b 33

      - name: Parse Phase 2 PowerShell without applying
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$text=Get-Content -LiteralPath 'infrastructure\windows\rehearse_wp22a_phase2_tenant_security.ps1' -Raw; [void][scriptblock]::Create($text); Write-Host 'WP22A Phase 2 PowerShell parse OK'"
          if errorlevel 1 exit /b 34

      - name: Run isolated PostgreSQL tenant-security rehearsal
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\run_v10_wp22a_phase2_rehearsal_watchdog.py --script infrastructure\windows\rehearse_wp22a_phase2_tenant_security.ps1 --python-path "%VENV_WINDOWS_PATH%\Scripts\python.exe" --timeout-seconds 240
          if errorlevel 1 exit /b 40

      - name: Rehearse inherited WP13 migration backup and restore compatibility
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\rehearse_wp13_persistence.ps1 -PythonPath "%VENV_WINDOWS_PATH%\Scripts\python.exe"
          if errorlevel 1 exit /b 41

      - name: Verify Phase 2 source boundaries remain fail closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('omni_cio/persistence/migrations/0004_product_identity_multi_tenant.sql').read_text(encoding='utf-8')
          identity = Path('omni_cio/web/product_identity_v1.py').read_text(encoding='utf-8')
          api = Path('omni_cio/web/api_v1.py').read_text(encoding='utf-8')
          persistence = Path('omni_cio/web/persistence_v1.py').read_text(encoding='utf-8')
          shell = Path('apps/web/src/app-shell/app-shell.tsx').read_text(encoding='utf-8')
          status = Path('knowledge/17_V10_CURRENT_PROGRAM_STATUS.md').read_text(encoding='utf-8')

          required_migration = (
              'subject_binding_hmac_sha256',
              'ENABLE ROW LEVEL SECURITY',
              'broker_accounts_tenant_isolation',
              'broker_connections_tenant_isolation',
              'broker_connection_accounts_tenant_isolation',
              "current_setting('omni_cio.tenant_id', true)",
          )
          for marker in required_migration:
              if marker not in migration:
                  raise SystemExit(f'WP22A Phase 2 migration marker missing: {marker}')
          for forbidden in (
              'DROP CONSTRAINT portfolio_owner_only',
              'DROP CONSTRAINT decision_owner_only',
              'DROP CONSTRAINT job_owner_only',
              'DROP CONSTRAINT content_blob_owner_only',
              'FORCE ROW LEVEL SECURITY',
          ):
              if forbidden in migration:
                  raise SystemExit(f'WP22A Phase 2 widened/deferred boundary unexpectedly: {forbidden}')
          for marker in ('hmac.new', 'PUBLIC_REGISTRATION_DISABLED', 'pg_advisory_xact_lock', 'ProductAuthenticationServiceV1'):
              if marker not in identity:
                  raise SystemExit(f'WP22A Phase 2 product identity marker missing: {marker}')
          if '"user_label": "OWNER"' in api or '"tenant_label": "Personal"' in api:
              raise SystemExit('WP22A session view still exposes historical OWNER product labels')
          if "set_config('omni_cio.tenant_id', %s, true)" not in persistence:
              raise SystemExit('WP22A broker repository lost transaction-local tenant context')
          if 'OWNER private access' in shell or 'privateRemoteLogin' in shell:
              raise SystemExit('WP22A product shell still exposes engineering-edge OWNER login')
          for invariant in ('PUBLIC_MULTI_USER_ENABLED=false', 'WP23+ remains locked'):
              if invariant not in status:
                  raise SystemExit(f'WP22A Phase 2 program lock marker missing: {invariant}')
          print('WP22A Phase 2 fail-closed source contract OK')
          PY

      - name: Verify permanent repository and regression guards
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_repository_boundaries.py
          if errorlevel 1 exit /b 50
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_regression_shield.py
          if errorlevel 1 exit /b 51
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_engineering_governance.py
          if errorlevel 1 exit /b 52

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
