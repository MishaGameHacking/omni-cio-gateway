name: Android stock runtime control

on:
  push:
    branches: [codex/spectrum-3d-100]
    paths:
      - '.github/workflows/android-runtime-control.yml'
      - '.github/scripts/emulator_runtime_control.py'

permissions:
  contents: read

concurrency:
  group: android-stock-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-runtime:
    name: Stock Android 15 16KB on Linux (not APK certification)
    if: contains(github.event.head_commit.message, '[emulator-control]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Allow KVM access only on this ephemeral VM
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install the official Android 15 16KB image
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          python3 -c 'print("y\n" * 200)' > "$RUNNER_TEMP/control-sdk-yes.txt"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --channel=0 \
            "emulator" "platform-tools" "system-images;android-35;google_apis_ps16k;x86_64" \
            < "$RUNNER_TEMP/control-sdk-yes.txt"
      - name: Observe stock Android without installing Analyst AI
        run: python3 .github/scripts/emulator_runtime_control.py
      - name: Record scope of this independent control
        if: always()
        shell: bash
        run: |
          echo '### Stock-image control only' >> "$GITHUB_STEP_SUMMARY"
          echo 'No APK was installed or tested. This run does not authorize a release, server update or merge.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Windows Android CI installation, upgrade and complete UI gate remains mandatory and unchanged.' >> "$GITHUB_STEP_SUMMARY"
