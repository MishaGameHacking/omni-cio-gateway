name: Sonar config annotation inventory

on:
  push:
    branches:
      - diagnostic/sonar-config-main-062
    paths:
      - ".github/workflows/sonar-config-annotations.yml"

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    name: Read Sonar config annotations
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read annotations
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl.exe --fail --silent --show-error
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer %GH_TOKEN%"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/111383207053/annotations?per_page=100"
