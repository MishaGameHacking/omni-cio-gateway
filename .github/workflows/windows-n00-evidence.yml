name: Inspect candidate42 actual compiler failure
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Preserve actual compiler failure and passing test logs
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');\nif(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('wrong_host');\nconst root='C:/actions-runner-4/_work/_temp/analyst-development-40265186363-1';\nconst report=JSON.parse(fs.readFileSync(p.join(root,'windows-development.json'),'utf8'));\nif(report.status!=='failed'||report.error!=='step_failed:gradle')throw Error('unexpected_outcome');\nconst out=p.join(process.env.RUNNER_TEMP,'n00-build42-failure-'+process.env.GITHUB_RUN_ID);fs.mkdirSync(out,{recursive:false});const identities={};\nfor(const name of ['windows-development.json','controller.json','export-receipt.json','10-host-tests.log','18-gradle.log','linux-backend-full-suite.log','linux-linux-test-report.json','linux-backend-tests.xml']){\n const target=p.join(root,name);const stat=fs.lstatSync(target);if(!stat.isFile()||stat.isSymbolicLink()||stat.size>6000000)throw Error('unexpected_file');const b=fs.readFileSync(target);fs.writeFileSync(p.join(out,name),b,{flag:'wx'});identities[name]={bytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex')};\n}\nconst gradle=fs.readFileSync(p.join(root,'18-gradle.log'),'utf8').split(/\\r?\\n/);const host=fs.readFileSync(p.join(root,'10-host-tests.log'),'utf8');const backend=fs.readFileSync(p.join(root,'linux-backend-full-suite.log'),'utf8');\nconst result={run_id:40265186363,status:report.status,source_sha256:report.source_sha256,check:report.check,build:report.build,error:report.error,gradle_errors:gradle.filter(l=>/^e:|^w:|FAILURE|What went wrong|^> Task .*FAILED/.test(l)),host_tail:host.slice(-500),backend_tail:backend.slice(-1600),identities};\nfs.writeFileSync(p.join(out,'manifest.json'),JSON.stringify(result,null,2));\nconst fence=String.fromCharCode(96).repeat(3);await github.rest.checks.create({...context.repo,name:'N00 candidate42 compiler failure evidence',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Preserved actual compiler error and passing host and WSL checks',summary:fence+'json\\n'+JSON.stringify(result,null,2)+'\\n'+fence}});core.setOutput('folder',out);"
      - name: Preserve compiler evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n00-candidate42-compiler-failure
          path: ${{ steps.evidence.outputs.folder }}
          if-no-files-found: error
          retention-days: 3
