name: Inspect exact candidate41 build outputs
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Read completed candidate41 source APK and JVM evidence
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const cp=require('node:child_process'),fs=require('node:fs'),p=require('node:path');\nconst r=cp.spawnSync('py',['-3','-c',\"import pathlib,hashlib,json,os,stat,xml.etree.ElementTree as ET\\nassert os.name=='nt' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nroot=pathlib.Path('C:/actions-runner-4/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40252011635-1')\\nexpected=json.loads(\\\"{\\\\\\\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumTabs.kt\\\\\\\":{\\\\\\\"bytes\\\\\\\":5495,\\\\\\\"sha256\\\\\\\":\\\\\\\"51599f1211c2630451a17b5ea1d2e4efbd3521e0cf8f39b0e23ffac8ca18c145\\\\\\\"},\\\\\\\"app/build.gradle.kts\\\\\\\":{\\\\\\\"bytes\\\\\\\":2450,\\\\\\\"sha256\\\\\\\":\\\\\\\"38211eae835361b9a0dfefeecddc0bbc8a70095b75a7e8f4cbb7498cc9552c34\\\\\\\"},\\\\\\\".github/scripts/tests/test_android17_live_spectrum.py\\\\\\\":{\\\\\\\"bytes\\\\\\\":7591,\\\\\\\"sha256\\\\\\\":\\\\\\\"5278e2210efad5cbcde230fad68452d2815406e64f1732795ef3cd04b1988c50\\\\\\\"},\\\\\\\".github/scripts/tests/test_spectrum_brand_identity.py\\\\\\\":{\\\\\\\"bytes\\\\\\\":4023,\\\\\\\"sha256\\\\\\\":\\\\\\\"b8912a719de1bf54d5d6579d0e85b750945a9ea33cbc918f0fa5960089bb2aac\\\\\\\"},\\\\\\\"app/build/outputs/apk/debug/app-debug.apk\\\\\\\":{\\\\\\\"bytes\\\\\\\":63276145,\\\\\\\"sha256\\\\\\\":\\\\\\\"925a7f8a874e70123c380c9ef2ac256c5e9be08f41c7fb53758e77f7e7dd0931\\\\\\\"},\\\\\\\"app/build/outputs/apk/preview/app-preview.apk\\\\\\\":{\\\\\\\"bytes\\\\\\\":29754870,\\\\\\\"sha256\\\\\\\":\\\\\\\"0cad98a49c15678cc2933610a5165d90f8442ef356e86e8d1d91215374f12fda\\\\\\\"},\\\\\\\"app/build/outputs/apk/release/app-release-unsigned.apk\\\\\\\":{\\\\\\\"bytes\\\\\\\":29746658,\\\\\\\"sha256\\\\\\\":\\\\\\\"6e10febf02408a6bdb9c5866c3de5d3c28dd21fc0c85f66265cd135a69be15ed\\\\\\\"},\\\\\\\"ci-ui-driver/build/outputs/apk/debug/ci-ui-driver-debug.apk\\\\\\\":{\\\\\\\"bytes\\\\\\\":2683192,\\\\\\\"sha256\\\\\\\":\\\\\\\"7fb9ad4121c2a1e981cacc611522941122c9fe3178e2eeb3849683200f3c7705\\\\\\\"}}\\\")\\nfor name,identity in expected.items():\\n p=root/name;s=p.lstat();assert stat.S_ISREG(s.st_mode) and not p.is_symlink() and not getattr(s,'st_file_attributes',0)&0x400\\n data=p.read_bytes();assert len(data)==identity['bytes'] and hashlib.sha256(data).hexdigest()==identity['sha256']\\nsuites=[];totals={k:0 for k in ('tests','failures','errors','skipped')}\\nfor p in sorted((root/'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):\\n assert p.stat().st_size<3000000 and p.stat().st_mtime>=1792976661\\n data=p.read_bytes();suite=ET.fromstring(data);row={'name':suite.get('name'),'file':p.name,'sha256':hashlib.sha256(data).hexdigest()}\\n for k in totals:\\n  value=int(suite.get(k,'0'));assert value>=0;totals[k]+=value;row[k]=value\\n suites.append(row)\\nassert suites and totals['tests']>0 and totals['failures']==totals['errors']==totals['skipped']==0\\nprint(json.dumps({'run_id':40252011635,'source_root':str(root),'source_sha256':'8d309ea0b418dcf125957d72806bde5dd6fa65db716d8024e02e2ca406cfbef9','files':expected,'android_jvm_totals':totals,'suite_count':len(suites),'suites':suites,'runtime_pass':False,'publication_authorized':False}))\\n\"],{encoding:'utf8',timeout:45000,maxBuffer:120000,env:{...process.env,PYTHONUTF8:'1'}});\nif(r.status!==0)throw new Error('Build evidence verification failed: '+r.stderr?.slice(-1500));\nconst report=JSON.parse(r.stdout);const out=p.join(process.env.RUNNER_TEMP,'candidate41-build-evidence-'+context.runId);fs.mkdirSync(out);fs.writeFileSync(p.join(out,'candidate41-build-proof.json'),JSON.stringify(report,null,2));\nconst fence=String.fromCharCode(96).repeat(3);await github.rest.checks.create({...context.repo,name:'N00 candidate41 compiled bytes and Android JVM evidence',head_sha:context.sha,status:'completed',conclusion:'success',output:{title:'Exact Windows source, four APK identities and actual JVM XML reports',summary:fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence}});core.setOutput('folder',out);"
      - name: Retain exact build observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate41-build-proof
          path: ${{ steps.evidence.outputs.folder }}
          retention-days: 3
          if-no-files-found: error
