name: Inspect exact candidate42 original portfolio runtime
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Preserve original runtime observations and actual native captures
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');\nif(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('wrong_host');\nconst root='C:/actions-runner/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40267647899-1/app/build/outputs/apk/preview';\nconst source=p.join(root,'ui-screens-api37-16384');const observations=JSON.parse(fs.readFileSync(p.join(source,'portfolio-focused-observations.json'),'utf8'));\nif(observations.diagnostic_only!==true||observations.release_gate_pass!==false)throw Error('unexpected_diagnostic_contract');\nconst out=p.join(process.env.RUNNER_TEMP,'n00-candidate42-ui-'+context.runId);fs.mkdirSync(out,{recursive:false});const identities={};let total=0;\nfunction copy(from,name){const st=fs.lstatSync(from);if(!st.isFile()||st.isSymbolicLink()||st.size>3000000||st.mtimeMs<Date.parse('2026-10-26T04:10:00Z'))throw Error('unexpected_file');const b=fs.readFileSync(from);total+=b.length;if(total>25000000)throw Error('too_large');fs.writeFileSync(p.join(out,name),b,{flag:'wx'});identities[name]={bytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex')};}\nconst available=fs.readdirSync(source);\nfor(const name of available.filter(n=>n.endsWith('.png')||n.endsWith('.xml')||['portfolio-focused-observations.json','portfolio-verification.json'].includes(n)))copy(p.join(source,name),name);\nconst log=p.join(root,'install-api37-16384/runtime-console.log');copy(log,'runtime-16384.log');const lines=fs.readFileSync(log,'utf8').split(/\\r?\\n/);\nconst installed=p.join(root,'install-api37-16384/install-results.json');if(fs.existsSync(installed))copy(installed,'install-results.json');\nconst result={run_id:40267647899,source_root:source,base_commit:'c2d572e992516ed3080a22582e926754fb61262d',source_sha256:'cd798608db48de57f6a01e15293fda8fe093984054edfeeea0e0e210936c8f2e',debug_apk_sha256:'b7a883b22c5fd3f53178862733c92b6dbcebbca10aecde6f2d4bbba15deb551b',page_bytes:16384,observations,identities,available,log_tail:lines.slice(-80).map(x=>x.slice(0,1200)).join('\\n').slice(-22000)};\nfs.writeFileSync(p.join(out,'manifest.json'),JSON.stringify(result,null,2));const fence=String.fromCharCode(96).repeat(3);const summary=fence+'json\\n'+JSON.stringify(result,null,2)+'\\n'+fence;if(summary.length>63000)throw Error('summary_too_large');\nawait github.rest.checks.create({...context.repo,name:'N00 exact candidate42 portfolio runtime evidence',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Original portfolio runtime and exact native captures',summary}});core.setOutput('folder',out);"
      - name: Preserve exact candidate42 portfolio evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n00-candidate42-portfolio-16384
          path: ${{ steps.evidence.outputs.folder }}
          if-no-files-found: error
          retention-days: 3
