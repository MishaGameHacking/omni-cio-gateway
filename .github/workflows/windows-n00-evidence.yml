name: Inspect four repaired native catalogue result cases
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Preserve four actual repaired result cases
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');
            if(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw new Error('wrong_host');
            const root='C:/actions-runner-2/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40246855859-1/app/build/outputs/apk/preview';
            const source=p.join(root,'ui-screens-api37-16384');
            const out=p.join(process.env.RUNNER_TEMP,'n00-ui-evidence-'+process.env.GITHUB_RUN_ID);
            fs.mkdirSync(out,{recursive:false});
            const identities={};let total=0;
            function copy(from,name){
              const stat=fs.lstatSync(from);if(!stat.isFile()||stat.isSymbolicLink()||stat.size>3000000||stat.mtimeMs<Date.parse('2026-10-25T23:56:15Z'))throw new Error('unexpected_file');
              const data=fs.readFileSync(from);total+=data.length;if(total>25000000)throw new Error('evidence_too_large');
              fs.writeFileSync(p.join(out,name),data,{flag:'wx'});
              identities[name]={bytes:data.length,sha256:c.createHash('sha256').update(data).digest('hex')};
            }
            const available=fs.readdirSync(source);
            for(const name of available.filter(n=>/^purchase-result-font-.*\.png$/.test(n)||n==='catalogue-focused-observations.json'))copy(p.join(source,name),name);
            const log=p.join(root,'install-api37-16384/runtime-console.log');
            copy(log,'runtime-16384.log');
            const lines=fs.readFileSync(log,'utf8').split(/\r?\n/);
            if(!lines.some(l=>l.includes('Diagnostic only: full UI suite was deliberately not claimed')))throw new Error('expected_completed_failure_not_observed');
            const report={source_run:40246855859,source_root:source,diagnostic_only:true,release_gate_pass:false,page_bytes:16384,
              base_commit:'740a50defc93262b30b800cf15f15086f83231ef',verified_backup_commit:'46158e9a5b8da09f0188fc882154a455d119f127',source_inventory:'770337e637aadcccec66047048aa7e696a58524d2536f2f66d4d20a16b633bac',
              debug_apk_sha256:'3e29f33beb3a6ad4dade2f56b8340d8419aeff415ffe78ed35714291ae889acf',
              identities,available_files:available,log_tail:lines.slice(-100).map(x=>x.slice(0,1200)).join('\n').slice(-26000)};
            report.focused=JSON.parse(fs.readFileSync(p.join(source,'catalogue-focused-observations.json'),'utf8'));
            if(report.focused.focused_cases_completed!==true||report.focused.cases.length!==4||report.focused.result_screens.length!==4)throw new Error('focused_repair_cases_not_complete');
            fs.writeFileSync(p.join(out,'manifest.json'),JSON.stringify(report,null,2));
            await github.rest.checks.create({...context.repo,name:'N00 actual catalogue result recovery screenshots',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Four actual focused result cases passed; full matrix remains separate',summary:'\x60\x60\x60json\n'+JSON.stringify(report,null,2)+'\n\x60\x60\x60'}});
            core.setOutput('folder',out);
      - name: Retain private synthetic failure evidence for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n00-purchase-result-recovery-16384
          path: ${{ steps.evidence.outputs.folder }}
          if-no-files-found: error
          retention-days: 3
