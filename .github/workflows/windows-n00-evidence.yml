name: Inspect original payout tab native geometry evidence
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Preserve original failing tab traversal and reverse observation
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');
            if(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw new Error('wrong_host');
            const root='C:/actions-runner-2/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40251310156-1/app/build/outputs/apk/preview';
            const source=p.join(root,'ui-screens-api37-16384');
            const out=p.join(process.env.RUNNER_TEMP,'n00-ui-evidence-'+process.env.GITHUB_RUN_ID);
            fs.mkdirSync(out,{recursive:false});
            const identities={};let total=0;
            function copy(from,name){
              const stat=fs.lstatSync(from);if(!stat.isFile()||stat.isSymbolicLink()||stat.size>3000000||stat.mtimeMs<Date.parse('2026-10-26T00:51:27Z'))throw new Error('unexpected_file');
              const data=fs.readFileSync(from);total+=data.length;if(total>25000000)throw new Error('evidence_too_large');
              fs.writeFileSync(p.join(out,name),data,{flag:'wx'});
              identities[name]={bytes:data.length,sha256:c.createHash('sha256').update(data).digest('hex')};
            }
            const available=fs.readdirSync(source);
            for(const name of available.filter(n=>['portfolio-tabs-original-failure.png','portfolio-tabs-reverse-visible.png','portfolio-tabs-diagnostic-last.png','portfolio-tabs-original-failure.xml','portfolio-tabs-reverse-visible.xml','portfolio-tabs-observations.json'].includes(n)))copy(p.join(source,name),name);
            const log=p.join(root,'install-api37-16384/runtime-console.log');
            copy(log,'runtime-16384.log');
            const lines=fs.readFileSync(log,'utf8').split(/\r?\n/);
            if(!lines.some(l=>l.includes('List target not reachable: Выплаты')))throw new Error('expected_completed_failure_not_observed');
            const report={source_run:40251310156,source_root:source,diagnostic_only:true,release_gate_pass:false,page_bytes:16384,
              base_commit:'4e4af39281f8cf15c7cc42f3837340384b6928c3',verified_backup_commit:'4e4af39281f8cf15c7cc42f3837340384b6928c3',source_inventory:'4aa72786eeb5021e012e97b1d4ad12fabb7336c1d43721d8b477f5736f159025',
              debug_apk_sha256:'3e29f33beb3a6ad4dade2f56b8340d8419aeff415ffe78ed35714291ae889acf',
              identities,available_files:available,native_reveals:lines.filter(l=>l.startsWith('UI_ACCESSIBILITY_ACTION=')&&l.includes(';show-')).slice(-20),log_tail:lines.slice(-100).map(x=>x.slice(0,1200)).join('\n').slice(-26000)};
            fs.writeFileSync(p.join(out,'manifest.json'),JSON.stringify(report,null,2));
            await github.rest.checks.create({...context.repo,name:'N00 original payout tab geometry evidence',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Original native tab geometry and post-failure reverse observation',summary:'\x60\x60\x60json\n'+JSON.stringify(report,null,2)+'\n\x60\x60\x60'}});
            core.setOutput('folder',out);
      - name: Retain private synthetic failure evidence for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: n00-portfolio-tabs-geometry-16384
          path: ${{ steps.evidence.outputs.folder }}
          if-no-files-found: error
          retention-days: 3
