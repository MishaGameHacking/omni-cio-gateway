name: Observe actual candidate40 Android build evidence
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read exact current Gradle log and generated JVM reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const cp=require('node:child_process');const r=cp.spawnSync('py',['-3','-c',\"import pathlib,json,sys,os,xml.etree.ElementTree as ET\\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nroot=pathlib.Path(r'C:\\\\actions-runner-3\\\\_work\\\\omni-cio-gateway\\\\omni-cio-gateway\\\\windows-development-40239983022-1')\\nstate=pathlib.Path(r'C:\\\\actions-runner-3\\\\_work\\\\_temp\\\\analyst-development-40239983022-1')\\nout={'partial_observation_only':True,'source_root':str(root),'run_id':40239983022}\\nlog=state/'18-gradle.log'\\nif log.is_file():\\n with log.open('rb') as f:\\n  f.seek(max(0,log.stat().st_size-512*1024));lines=f.read().decode('utf-8',errors='replace').splitlines()\\n out['gradle_log_bytes']=log.stat().st_size\\n out['gradle_observed_lines']=[x[:700] for x in lines if x.startswith(('> Task ', 'BUILD ','FAILURE:','e: ','w: '))][-35:]\\nout['jvm_reports']={'suites':0,'tests':0,'failures':0,'errors':0,'skipped':0}\\nfor p in (root/'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):\\n try:v=ET.parse(p).getroot()\\n except ET.ParseError:continue\\n out['jvm_reports']['suites']+=1\\n for key in ('tests','failures','errors','skipped'):out['jvm_reports'][key]+=int(v.get(key,'0'))\\nprint(json.dumps(out,ensure_ascii=True))\\n\"],{encoding:'utf8',timeout:45000,maxBuffer:50000,env:{...process.env,PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8'}});if(r.status!==0)throw Error('Could not read owned build evidence: '+r.stderr?.slice(-1500));const report=JSON.parse(r.stdout);const fence=String.fromCharCode(96).repeat(3);await github.rest.checks.create({...context.repo,name:'N00 candidate40 actual Android build progress',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Partial Android build observation, not release acceptance',summary:fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence}});"
