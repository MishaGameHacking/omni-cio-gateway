name: Observe actual candidate42 Gradle progress
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-evidence.yml]
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const fs=require('node:fs'),p=require('node:path');if(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('wrong_host');\nconst state='C:/actions-runner-3/_work/_temp/analyst-development-40266100999-1';const report=JSON.parse(fs.readFileSync(p.join(state,'windows-development.json'),'utf8'));if(report.source_sha256!=='cd798608db48de57f6a01e15293fda8fe093984054edfeeea0e0e210936c8f2e')throw Error('wrong_source');\nconst file=p.join(state,'18-gradle.log');const stat=fs.lstatSync(file);if(!stat.isFile()||stat.size>10000000)throw Error('unexpected_log');const lines=fs.readFileSync(file,'utf8').split(/\\r?\\n/);\nconst result={run_id:40266100999,observed_at:new Date().toISOString(),build:report.build,gradle_log_bytes:stat.size,gradle_tasks:lines.filter(x=>x.startsWith('> Task')).slice(-30),compiler_errors:lines.filter(x=>x.startsWith('e:')).slice(-10),tail:lines.slice(-25).join('\\n').slice(-5000)};\nconst fence=String.fromCharCode(96).repeat(3);await github.rest.checks.create({...context.repo,name:'N00 candidate42 actual Gradle progress snapshot',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Read-only current Android build tasks',summary:fence+'json\\n'+JSON.stringify(result,null,2)+'\\n'+fence}});"
