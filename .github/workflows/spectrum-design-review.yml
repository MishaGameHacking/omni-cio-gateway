name: Spectrum design review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/spectrum-payload/**'
      - '.github/spectrum-*.py'
      - '.github/workflows/spectrum-design-review.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-native-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Assemble reviewed native UI candidate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/analyst-native-spectrum-20261015'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Apply exact source replacements
        shell: cmd
        run: py -3 .github/spectrum-native-entry.py
      - name: Add native UI regression checks
        shell: cmd
        run: py -3 .github/spectrum-native-extra.py
      - name: Retain reviewed native source blobs without changing any ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('spectrum-generated.json', 'utf8'));
            const head = context.payload.pull_request.head.sha;
            const current = await github.rest.git.getRef({...context.repo, ref:'heads/' + context.payload.pull_request.head.ref});
            if (current.data.object.sha !== head) throw new Error('PR head moved; discard this candidate');
            const base = await github.rest.git.getCommit({...context.repo, commit_sha: head});
            const records = [];
            for (const file of manifest.files) {
              const allowed = file.path.startsWith('app/src/main/java/ru/omnicio/app/ui/') ||
                file.path.startsWith('app/src/main/res/') || file.path.startsWith('app/src/debug/') ||
                file.path.startsWith('docs/') || file.path === 'AGENTS.md' || file.path === 'app/build.gradle.kts' ||
                file.path === 'app/src/main/java/ru/omnicio/app/MainActivity.kt' ||
                file.path === '.github/scripts/profile_ui_probe.py' || file.path === '.github/scripts/spectrum_ui_probe.py' ||
                file.path === '.github/workflows/android-ci.yml';
              if (!allowed || file.path.includes('..') || typeof file.content !== 'string') throw new Error('Unexpected candidate path');
              const blob = await github.rest.git.createBlob({...context.repo, content:file.content, encoding:'utf-8'});
              const record = {path:file.path, sha:blob.data.sha};
              records.push(record);
              core.info('SPECTRUM_BLOB=' + JSON.stringify(record));
            }
            core.notice('SPECTRUM_PARENT=' + head);
            core.notice('SPECTRUM_BASE_TREE=' + base.data.tree.sha);
            core.notice('SPECTRUM_DELETIONS=' + JSON.stringify(manifest.deletions));
            core.notice('SPECTRUM_NATIVE_FILES=' + records.length);
            await core.summary.addHeading('Native source blobs prepared').addRaw('Parent: ' + head + '\nFiles: ' + records.length).write();
