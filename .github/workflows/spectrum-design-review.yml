name: Spectrum design review

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/spectrum-design-review.yml"
      - ".github/scripts/spectrum*"

permissions:
  contents: read

concurrency:
  group: spectrum-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact Android source snapshot
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=spectrum-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spectrum-source-${{ github.event.pull_request.head.sha }}
          path: spectrum-source.zip
          if-no-files-found: error
          retention-days: 7
