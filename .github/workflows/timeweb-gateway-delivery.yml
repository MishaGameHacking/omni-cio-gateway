name: Deliver existing AI gateway credential encrypted to the Lenovo owner
on:
  push:
    branches: [codex/timeweb-model-access-2026-11-01]
    paths:
      - tools/seal-timeweb-gateway.mjs
      - tools/tests/seal-timeweb-gateway.test.mjs
      - tools/fixtures/lenovo-gateway-recipient.json
      - .github/workflows/timeweb-gateway-delivery.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-gateway-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ai-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Test encryption and recipient checks without credentials
        shell: cmd
        working-directory: ai-delivery-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "C:\Program Files\nodejs\node.exe" --test tools/tests/seal-timeweb-gateway.test.mjs
          if errorlevel 1 exit /b 1
      - name: Seal the existing gateway key to the owner on this same Lenovo
        shell: cmd
        working-directory: ai-delivery-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
        run: |
          "C:\Program Files\nodejs\node.exe" tools/seal-timeweb-gateway.mjs
          if errorlevel 1 exit /b 1
