name: V10 WP9 Restart Runtime Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-wp9-restart-runtime-probe.yml"
      - "infrastructure/windows/wp9_rehearsal_worker.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Hosted Windows Task Scheduler restart runtime probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Probe external termination and restart-on-failure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $folderName = "OmniCIO-WP9-Restart-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $taskPath = "\$folderName\"
          $taskName = "WP9.Restart.Probe"
          $stateRoot = Join-Path $env:RUNNER_TEMP $folderName
          $statePath = Join-Path $stateRoot "state.json"
          New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null
          $worker = (Resolve-Path ".\infrastructure\windows\wp9_rehearsal_worker.ps1").Path
          $powershellExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $service = New-Object -ComObject "Schedule.Service"
          $service.Connect()
          $root = $service.GetFolder("\")

          function Read-State {
            if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { return $null }
            try { return Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json } catch { return $null }
          }

          try {
            [void]$root.CreateFolder($folderName)
            $actionArgs = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}" -StatePath "{1}" -HoldSeconds 120' -f $worker, $statePath
            $action = New-ScheduledTaskAction -Execute $powershellExe -Argument $actionArgs
            $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\LOCAL SERVICE" -LogonType ServiceAccount -RunLevel Limited
            $settings = New-ScheduledTaskSettingsSet -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit (New-TimeSpan -Minutes 5) -MultipleInstances IgnoreNew -StartWhenAvailable
            $definition = New-ScheduledTask -Action $action -Principal $principal -Settings $settings -Description "OMNI-CIO-V10-WP9-RESTART-PROBE"
            Register-ScheduledTask -TaskName $taskName -TaskPath $taskPath -InputObject $definition -Force | Out-Null
            Start-ScheduledTask -TaskPath $taskPath -TaskName $taskName

            $first = $null
            $deadline = [datetime]::UtcNow.AddSeconds(30)
            do {
              $first = Read-State
              if ($null -ne $first -and [int]$first.run_count -eq 1 -and [string]$first.state -eq "RUNNING_FIRST_ATTEMPT") { break }
              Start-Sleep -Milliseconds 500
            } while ([datetime]::UtcNow -lt $deadline)
            if ($null -eq $first) { throw "FIRST_ATTEMPT_NOT_OBSERVED" }

            $pidToKill = [int]$first.process_id
            Stop-Process -Id $pidToKill -Force
            Write-Host "External termination issued."

            $recovered = $false
            $deadline = [datetime]::UtcNow.AddSeconds(150)
            do {
              $state = Read-State
              $info = Get-ScheduledTaskInfo -TaskPath $taskPath -TaskName $taskName
              $task = Get-ScheduledTask -TaskPath $taskPath -TaskName $taskName
              Write-Host ("probe: scheduler_state={0}; last_result={1}; run_count={2}; worker_state={3}" -f [string]$task.State, [int]$info.LastTaskResult, $(if ($null -ne $state) {[int]$state.run_count} else {-1}), $(if ($null -ne $state) {[string]$state.state} else {"NONE"}))
              if ($null -ne $state -and [int]$state.run_count -ge 2 -and [string]$state.state -eq "RECOVERED") { $recovered = $true; break }
              Start-Sleep -Seconds 5
            } while ([datetime]::UtcNow -lt $deadline)

            if (-not $recovered) { throw "AUTOMATIC_RESTART_NOT_OBSERVED" }
            Write-Host "Automatic restart observed."
          }
          finally {
            Unregister-ScheduledTask -TaskPath $taskPath -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            try { $root.DeleteFolder($folderName, 0) } catch { }
            Remove-Item -LiteralPath $stateRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
