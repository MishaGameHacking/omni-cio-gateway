name: Verify the home owner login across real public HTTPS
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/home-runtime-internet.yml, tools/home_runtime/ingress.py, tools/home_runtime/internet.cjs]
permissions:
  contents: read
  checks: write
jobs:
  home:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 14
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 2
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const file=path.join(process.env.RUNNER_TEMP,'analyst-https-'+context.runId+'-'+process.env.GITHUB_RUN_ATTEMPT+'.cjs');
            const {data}=await github.rest.repos.getContent({...context.repo,path:'tools/home_runtime/internet.cjs',ref:context.sha});
            fs.writeFileSync(file,Buffer.from(data.content,'base64'),{flag:'wx'});
            try{await require(file)({github,context,core,side:'home'});}finally{fs.rmSync(file,{force:true});}
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/home_runtime/internet.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 2
          script: |
            await require('./tools/home_runtime/internet.cjs')({github,context,core,side:'external'});
