name: Check selected Sol through the actual guarded server client
on:
  push:
    branches: [codex/timeweb-model-access-2026-11-01]
    paths:
      - tools/qualify_guarded_ai.py
      - .github/workflows/timeweb-guarded-client-eval.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-guarded-client-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: guarded-eval-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Prepare an isolated interpreter for the existing runner identity
        shell: cmd
        working-directory: guarded-eval-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "C:\actions-runner-2\_work\_tool\omnicio-python-3.12.10\python.exe" -m venv .qualification-venv
          if errorlevel 1 exit /b 1
          .qualification-venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-input --index-url https://pypi.org/simple fastapi==0.120.0 httpx==0.28.1 cryptography==50.0.0 PyJWT==2.15.0 tzdata==2026.5
          if errorlevel 1 exit /b 1
          .qualification-venv\Scripts\python.exe -m pip check
          if errorlevel 1 exit /b 1
      - name: Exercise production guards and ledger with no network or secret
        shell: cmd
        working-directory: guarded-eval-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          .qualification-venv\Scripts\python.exe tools/qualify_guarded_ai.py --dry-run
          if errorlevel 1 exit /b 1
      - name: Make ten synthetic Sol calls through the existing server client
        shell: cmd
        working-directory: guarded-eval-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
        run: |
          .qualification-venv\Scripts\python.exe tools/qualify_guarded_ai.py
          if errorlevel 1 exit /b 1
      - name: Preserve sanitized results and accounting status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timeweb-guarded-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: guarded-eval-${{ github.run_id }}-${{ github.run_attempt }}/guarded-ai-evaluation/report.json
          if-no-files-found: error
          retention-days: 7
