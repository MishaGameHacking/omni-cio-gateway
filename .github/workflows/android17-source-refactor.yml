name: Apply reviewed Android 17 source refactor
on:
  push:
    branches: [audit/android17-project-20261020]
    paths: [.github/workflows/android17-source-refactor.yml]
permissions:
  contents: write
concurrency:
  group: android17-source-refactor
  cancel-in-progress: false
jobs:
  refactor:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.ref == 'refs/heads/audit/android17-project-20261020'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true
          fetch-depth: 1
      - name: Apply only exact reviewed source fragments
        shell: cmd
        run: |
          py -3 tools\finish_android17_surface.py
          if errorlevel 1 exit /b 1
          git diff --check
          if errorlevel 1 exit /b 1
          git diff --stat
          if errorlevel 1 exit /b 1
      - name: Test every APK and emulator verification rule
        shell: cmd
        run: |
          py -3 -m unittest discover -s .github\scripts\tests -p "test_*.py" -q
          if errorlevel 1 exit /b 1
      - name: Test all backend scenarios before committing
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\android17-backend-tests"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -r backend\requirements-dev.txt
          if errorlevel 1 exit /b 1
          set "TELEGRAM_CLIENT_ID=123456"
          set "TELEGRAM_CLIENT_SECRET=test-only"
          set "BACKEND_PUBLIC_URL=https://example.invalid"
          set "DATABASE_PATH=%RUNNER_TEMP%\android17-backend-tests.sqlite3"
          set "FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          set "ANALYSIS_SCHEDULER_ENABLED=false"
          set "AI_EXTERNAL_PROCESSING_APPROVED=false"
          "%VENV%\Scripts\python.exe" -m pytest backend\tests -q
          if errorlevel 1 exit /b 1
      - name: Commit only the successfully tested source paths
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          py -3 -c "import json,subprocess; rows=json.load(open('.git/android17-refactor.json',encoding='utf-8')); paths=[r['path'] for r in rows]; assert len(paths)==18; assert all(not p.startswith('.github/workflows/') for p in paths); subprocess.run(['git','add','--',*paths],check=True)"
          if errorlevel 1 exit /b 1
          git diff --cached --check
          if errorlevel 1 exit /b 1
          git commit -m "refactor(android): use current device policy and strict platform-bound private APK retention"
          if errorlevel 1 exit /b 1
          git push origin HEAD:refs/heads/audit/android17-project-20261020
          if errorlevel 1 exit /b 1
          git log -1 --format=GENERATED_ANDROID17_COMMIT=%%H
          git diff --exit-code
          if errorlevel 1 exit /b 1
