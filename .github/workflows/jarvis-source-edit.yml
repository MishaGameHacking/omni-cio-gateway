name: Apply two reviewed Jarvis source edits on owner Lenovo
on:
  push:
    branches: [codex/jarvis-source-edit-2026-10-31]
    paths: [.github/workflows/jarvis-source-edit.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Derive public repository blobs without touching installed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if(process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw Error('Wrong source-edit host');
            const base='22999cc5deebf899304ce95f20bc7960b6b06246';
            const patches=[{
              path:'backend/autonomous_ai.py',
              expected:'7d3796b749953f339fe605f4c73660d62c8851a2',
              edits:[[
                '        guarded_client = GuardedAIClient(\n            user_id, backend.connect,\n',
                '        if __package__:\n            from .agent_analysis_runtime import build_analysis_client\n        else:\n            from agent_analysis_runtime import build_analysis_client\n        guarded_client, model_context = build_analysis_client(\n            user_id, backend.connect, context=context, decision=decision,\n            environment_provider=lambda: os.environ, legacy_factory=GuardedAIClient,\n'
              ],[
                '            context=context,\n            client=guarded_client,\n',
                '            context=model_context,\n            client=guarded_client,\n'
              ]]
            },{
              path:'.github/scripts/laptop_backend_ci.py',
              expected:'02a2c5d9954b475224196964bdb45e7d26b75628',
              edits:[[
                "                 'refs/heads/codex/lenovo-local-json-2026-10-31',\n",
                "                 'refs/heads/codex/lenovo-local-json-2026-10-31',\n                 'refs/heads/codex/jarvis-foundation-2026-10-31',\n"
              ]]
            }];
            for(const patch of patches){
              const {data}=await github.rest.repos.getContent({...context.repo,path:patch.path,ref:base});
              if(data.type!=='file'||data.sha!==patch.expected||data.encoding!=='base64')throw Error('Unexpected source identity');
              let text=Buffer.from(data.content,'base64').toString('utf8');
              for(const [before,after] of patch.edits){
                if(text.split(before).length!==2)throw Error('Source anchor is not unique');
                text=text.replace(before,after);
              }
              const {data:blob}=await github.rest.git.createBlob({...context.repo,content:text,encoding:'utf-8'});
              core.info('JARVIS_SOURCE_BLOB='+JSON.stringify({path:patch.path,base_blob:patch.expected,sha:blob.sha}));
            }
