name: V10 WP22A Provider Boundary Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp22a-provider-activation.yml"
      - ".github/workflows/v10-wp22a-provider-boundary-audit.yml"
      - "infrastructure/windows/install_wp22a_provider_controller.ps1"
      - "infrastructure/windows/run_wp22a_provider_controller.ps1"
      - "tests/test_v10_wp22a_provider_activation_boundary.py"
      - "docs/architecture/V10_WP22A_PROVIDER_ACTIVATION_BOUNDARY.md"
      - "docs/operations/V10_WP22A_PROVIDER_ACTIVATION_RUNBOOK.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v10-wp22a-provider-activation.yml"
      - ".github/workflows/v10-wp22a-provider-boundary-audit.yml"
      - "infrastructure/windows/install_wp22a_provider_controller.ps1"
      - "infrastructure/windows/run_wp22a_provider_controller.ps1"
      - "tests/test_v10_wp22a_provider_activation_boundary.py"
      - "docs/architecture/V10_WP22A_PROVIDER_ACTIVATION_BOUNDARY.md"
      - "docs/operations/V10_WP22A_PROVIDER_ACTIVATION_RUNBOOK.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp22a-provider-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-boundary-audit:
    name: WP22A deterministic provider trust-boundary gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 25

    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap protected runner Python
        shell: cmd
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 10

      - name: Create isolated boundary environment
        shell: bash
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp22a-provider-boundary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VENV_WINDOWS_PATH="$(cygpath -w "$VENV_PATH")"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "VENV_WINDOWS_PATH=$VENV_WINDOWS_PATH" >> "$GITHUB_ENV"
          echo "$VENV_WINDOWS_PATH\\Scripts" >> "$GITHUB_PATH"

      - name: Install hash-locked development dependencies
        shell: bash
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt

      - name: Verify exact clean reviewed head
        shell: cmd
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 11
          for /f %%S in ('git status --porcelain') do exit /b 12
          echo WP22A provider boundary exact head: %ACTUAL_HEAD%

      - name: Run provider boundary static and unit contracts
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff check tests\test_v10_wp22a_provider_activation_boundary.py
          if errorlevel 1 exit /b 20
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m ruff format --check tests\test_v10_wp22a_provider_activation_boundary.py
          if errorlevel 1 exit /b 21
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" -m pytest -q tests\test_v10_wp22a_provider_activation_boundary.py
          if errorlevel 1 exit /b 22

      - name: Parse protected controller scripts without mutation
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $paths=@('infrastructure\windows\install_wp22a_provider_controller.ps1','infrastructure\windows\run_wp22a_provider_controller.ps1'); foreach ($path in $paths) { $tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 30 } }; Write-Host 'WP22A provider boundary PowerShell parse contract passed.'"
          if errorlevel 1 exit /b 30

      - name: Exercise source-only no-mutation validation modes
        shell: cmd
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\install_wp22a_provider_controller.ps1 -ExpectedImplementationSha "%EXPECTED_HEAD%" -ValidateOnly -AsJson
          if errorlevel 1 exit /b 31
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\run_wp22a_provider_controller.ps1 -ValidateOnly -AsJson
          if errorlevel 1 exit /b 32

      - name: Verify permanent V10 repository guards
        shell: cmd
        run: |
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_repository_boundaries.py
          if errorlevel 1 exit /b 40
          "%VENV_WINDOWS_PATH%\Scripts\python.exe" scripts\check_v10_regression_shield.py
          if errorlevel 1 exit /b 41

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx
