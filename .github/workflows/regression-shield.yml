name: Regression Shield

on:
  push:
    branches:
      - main
      - v3.3.3-regression-shield
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-shield:
    name: Read-only contract and OpenAPI checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TINVEST_TOKEN: regression-test-tinvest-token
      GATEWAY_API_KEY: regression-test-gateway-key
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile gateway sources
        run: python -m compileall -q app.py main.py tests

      - name: Verify stable entrypoint import
        run: |
          python - <<'PY'
          import app

          assert app.app.version == "3.3.3"
          assert app.app is app.base.app
          assert "regression_shield" in app.base.CAPABILITIES
          print("Stable entrypoint:", app.app.version)
          PY

      - name: Run Regression Shield
        run: python -m pytest -q
