# v3.9.1 Broker Report Async Integrity release checks.
name: Regression Shield

on:
  push:
    branches:
      - main
      - v3.3.3-regression-shield
      - v3.4.0-portfolio-market-snapshot
      - v3.5.0-portfolio-analytics
      - v3.6.0-cash-liquidity
      - v3.7.0-purchase-capacity
      - v3.7.1-purchase-capacity-integrity
      - v3.8.0-operations-analytics
      - v3.9.0-broker-report-reconciliation
      - v3.9.1-broker-report-async-integrity
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-shield:
    name: Read-only contract and OpenAPI checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TINVEST_TOKEN: regression-test-tinvest-token
      GATEWAY_API_KEY: regression-test-gateway-key
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile gateway sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation tests

      - name: Verify stable entrypoint import
        run: |
          python - <<'PY'
          import app

          assert app.app.version == "3.9.1"
          assert app.app is app.base.app
          assert "portfolio_market_snapshot" in app.base.CAPABILITIES
          assert "portfolio_analytics" in app.base.CAPABILITIES
          assert "cash_liquidity_diagnostics" in app.base.CAPABILITIES
          assert "purchase_capacity_preview" in app.base.CAPABILITIES
          assert "purchase_capacity_integrity" in app.base.CAPABILITIES
          assert "operations_analytics" in app.base.CAPABILITIES
          assert "operations_cash_flow_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_async_generation" in app.base.CAPABILITIES
          assert "broker_report_async_integrity" in app.base.CAPABILITIES
          assert "broker_report_trade_reconciliation" in app.base.CAPABILITIES
          assert "regression_shield" in app.base.CAPABILITIES
          print("Stable entrypoint:", app.app.version)
          PY

      - name: Run Regression Shield
        id: pytest
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 3
