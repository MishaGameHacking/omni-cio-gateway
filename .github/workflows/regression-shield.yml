# Permanent read-only quality and security checks for Omni-CIO Gateway.
name: Regression Shield

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    name: Quality, contracts and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TINVEST_TOKEN: regression-test-tinvest-token # pragma: allowlist secret
      GATEWAY_API_KEY: regression-test-gateway-key # pragma: allowlist secret
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.txt

      - name: Verify lock files are current
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --output-file=requirements-dev.txt \
            requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Verify CI and security policy
        run: python scripts/check_ci_security_baseline.py

      - name: Verify repository structure
        run: python scripts/check_repository_layout.py

      - name: Compile gateway sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting baseline
        run: >-
          python -m ruff format --check
          scripts tests/test_ci_security_baseline.py

      - name: Type-check baseline
        run: python -m mypy

      - name: Verify stable gateway entrypoint
        run: |
          python - <<'PY'
          import app
          from fastapi.testclient import TestClient

          assert app.app.version == "3.9.1"
          assert app.app is app.base.app
          assert app.ENTRYPOINT == "app:app"
          health = TestClient(app.app).get("/health").json()
          assert health["trading_methods"] is False
          assert "portfolio_market_snapshot" in app.base.CAPABILITIES
          assert "portfolio_analytics" in app.base.CAPABILITIES
          assert "cash_liquidity_diagnostics" in app.base.CAPABILITIES
          assert "purchase_capacity_preview" in app.base.CAPABILITIES
          assert "purchase_capacity_integrity" in app.base.CAPABILITIES
          assert "operations_analytics" in app.base.CAPABILITIES
          assert "operations_cash_flow_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_async_generation" in app.base.CAPABILITIES
          assert "broker_report_async_integrity" in app.base.CAPABILITIES
          assert "broker_report_trade_reconciliation" in app.base.CAPABILITIES
          assert "regression_shield" in app.base.CAPABILITIES
          print("Gateway entrypoint:", app.app.version)
          print("Trading methods:", health["trading_methods"])
          PY

      - name: Run Regression Shield with coverage
        id: pytest
        run: >-
          python -m pytest -q
          --junitxml=pytest-results.xml
          --cov=app
          --cov=main
          --cov=portfolio_market
          --cov=portfolio_analytics
          --cov=cash_liquidity
          --cov=purchase_capacity
          --cov=purchase_capacity_integrity
          --cov=operations_analytics
          --cov=sdk_order_compat
          --cov=broker_report_reconciliation
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=60

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-diagnostics
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 3

  security:
    name: Dependency, code and secret security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install hash-locked security tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off
          -r requirements.txt

      - name: Run medium/high-confidence SAST
        run: python -m bandit -c pyproject.toml -r . -ll -ii -q

      - name: Scan tracked content for potential secrets
        run: >-
          python -m detect_secrets scan --all-files
          --exclude-files
          '(^|/)(\.git|\.mypy_cache|\.ruff_cache|__pycache__|requirements(-dev)?\.txt|coverage\.xml|pytest-results\.xml)(/|$)'
          | python scripts/check_ci_security_baseline.py --detect-secrets-report
