# Permanent read-only regression checks for Omni-CIO Gateway and Telegram Companion.
name: Regression Shield

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-shield:
    name: Read-only contracts, OpenAPI, Telegram and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TINVEST_TOKEN: regression-test-tinvest-token
      GATEWAY_API_KEY: regression-test-gateway-key
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com
      TELEGRAM_AUTO_CONFIGURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify repository structure
        run: python scripts/check_repository_layout.py

      - name: Compile gateway and Telegram sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation telegram_bot tests scripts

      - name: Verify stable gateway entrypoint
        run: |
          python - <<'PY'
          import app

          assert app.app.version == "3.9.1"
          assert app.app is app.base.app
          assert app.ENTRYPOINT == "app:app"
          assert "portfolio_market_snapshot" in app.base.CAPABILITIES
          assert "portfolio_analytics" in app.base.CAPABILITIES
          assert "cash_liquidity_diagnostics" in app.base.CAPABILITIES
          assert "purchase_capacity_preview" in app.base.CAPABILITIES
          assert "purchase_capacity_integrity" in app.base.CAPABILITIES
          assert "operations_analytics" in app.base.CAPABILITIES
          assert "operations_cash_flow_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_async_generation" in app.base.CAPABILITIES
          assert "broker_report_async_integrity" in app.base.CAPABILITIES
          assert "broker_report_trade_reconciliation" in app.base.CAPABILITIES
          assert "regression_shield" in app.base.CAPABILITIES
          print("Gateway entrypoint:", app.app.version)
          PY

      - name: Verify Telegram Companion entrypoint
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import telegram_bot.app as telegram_module

          assert telegram_module.app.version == "4.0.0"
          route_methods = {
              route.path: set(route.methods or set())
              for route in telegram_module.app.routes
              if hasattr(route, "methods")
          }
          assert route_methods["/health"] == {"GET"}
          assert route_methods["/telegram/webhook"] == {"POST"}
          with TestClient(telegram_module.app) as client:
              payload = client.get("/health").json()
          assert payload["version"] == "4.0.0"
          assert payload["build"]["entrypoint"] == "telegram_bot.app:app"
          assert payload["read_only"] is True
          assert payload["trading_methods"] is False
          print("Telegram entrypoint:", payload["version"])
          PY

      - name: Run Regression Shield
        id: pytest
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 3
