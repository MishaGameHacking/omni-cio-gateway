# Permanent post-merge read-only quality and security checks for Omni-CIO Gateway.
name: Regression Shield

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    name: Quality, contracts and coverage
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      TINVEST_TOKEN: regression-test-tinvest-token # pragma: allowlist secret
      GATEWAY_API_KEY: regression-test-gateway-key # pragma: allowlist secret
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact main repository without external Actions
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap isolated Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated CI environment
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"
          "$VENV_PATH/Scripts/python.exe" -m pip --version

      - name: Build strict Windows dependency projection
        run: >-
          python scripts/windows_ci_lock.py project
          requirements-dev.txt windows-requirements-dev.txt

      - name: Verify T-Bank package CA trust before dependency install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r windows-requirements-dev.txt

      - name: Verify lock files are current
        run: python scripts/verify_windows_ci_locks.py

      - name: Verify CI and security policy
        run: python scripts/check_ci_security_baseline.py

      - name: Verify repository structure
        run: python scripts/check_repository_layout.py

      - name: Verify V10 repository boundaries
        run: python scripts/check_v10_repository_boundaries.py

      - name: Verify V10 toolchain baseline
        run: python scripts/check_v10_toolchain_baseline.py

      - name: Verify V10 Regression Shield contract
        run: python scripts/check_v10_regression_shield.py

      - name: Compile gateway sources
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          omni_cio apps tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting baseline
        run: >-
          python -m ruff format --check
          scripts tests/test_ci_security_baseline.py
          tests/test_v10_repository_boundaries.py
          tests/test_v10_toolchain_baseline.py
          tests/test_v10_regression_shield.py

      - name: Type-check baseline
        run: |
          set -o pipefail
          python -m mypy 2>&1 | tee mypy-results.txt

      - name: Verify stable gateway entrypoint
        run: |
          python - <<'PY'
          import app
          from fastapi.testclient import TestClient

          assert app.app.version == "3.10.0"
          assert app.app is app.base.app
          assert app.ENTRYPOINT == "app:app"
          health = TestClient(app.app).get("/health").json()
          assert health["version"] == "3.10.0"
          assert health["trading_methods"] is False
          assert "portfolio_market_snapshot" in app.base.CAPABILITIES
          assert "portfolio_analytics" in app.base.CAPABILITIES
          assert "cash_liquidity_diagnostics" in app.base.CAPABILITIES
          assert "purchase_capacity_preview" in app.base.CAPABILITIES
          assert "purchase_capacity_integrity" in app.base.CAPABILITIES
          assert "operations_analytics" in app.base.CAPABILITIES
          assert "operations_cash_flow_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_reconciliation" in app.base.CAPABILITIES
          assert "broker_report_async_generation" in app.base.CAPABILITIES
          assert "broker_report_async_integrity" in app.base.CAPABILITIES
          assert "broker_report_trade_reconciliation" in app.base.CAPABILITIES
          assert "final_decision_review" in app.base.CAPABILITIES
          assert "regression_shield" in app.base.CAPABILITIES
          print("Gateway entrypoint:", app.app.version)
          print("Trading methods:", health["trading_methods"])
          PY

      - name: Verify read-only GPT Actions release contract
        run: python scripts/check_read_only_release_contract.py

      - name: Run Regression Shield with coverage
        id: pytest
        run: >-
          python -m pytest -q
          --junitxml=pytest-results.xml
          --cov=app
          --cov=main
          --cov=omni_cio.portfolio.market_snapshot_v1
          --cov=omni_cio.analytics.portfolio_structure_v1
          --cov=omni_cio.portfolio.cash_liquidity_v1
          --cov=omni_cio.pretrade.purchase_capacity_v1
          --cov=omni_cio.pretrade.purchase_capacity_integrity_v1
          --cov=omni_cio.analytics.operations_v1
          --cov=omni_cio.adapters.sdk_order_compat_v1
          --cov=omni_cio.reconciliation.broker_report
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=60

      - name: Summarize regression diagnostics without external Actions
        if: always()
        run: |
          {
            echo "### Regression Shield diagnostics"
            for path in mypy-results.txt pytest-results.xml coverage.xml windows-compiled-requirements.txt windows-compiled-requirements-dev.txt; do
              if [ -f "$path" ]; then
                echo "- $path present; sha256=$(sha256sum "$path" | awk '{print $1}')"
              else
                echo "- $path not produced"
              fi
            done
            echo "- Full quality and test output remains in this GitHub Actions run log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean self-hosted workspace
        if: always()
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi

  security:
    name: Dependency, code and secret security
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact main repository without external Actions
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap isolated Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated CI environment
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"
          "$VENV_PATH/Scripts/python.exe" -m pip --version

      - name: Build strict Windows dependency projections
        run: |
          python scripts/windows_ci_lock.py project \
            requirements-dev.txt windows-requirements-dev.txt
          python scripts/windows_ci_lock.py project \
            requirements.txt windows-requirements.txt

      - name: Verify T-Bank package CA trust before security-tool install
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\check_v10_tbank_ca_trust.ps1 -AsJson

      - name: Install hash-locked security tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r windows-requirements-dev.txt

      - name: Audit runtime dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          --disable-pip
          --strict
          --vulnerability-service osv
          --progress-spinner off
          -r windows-requirements.txt

      - name: Run medium/high-confidence SAST
        run: python -m bandit -c pyproject.toml -r . -ll -ii -q

      - name: Scan tracked content for potential secrets
        run: >-
          python -m detect_secrets scan --all-files
          --exclude-files
          '(^|[\\/])(\.git|\.venv|\.venv-ci|\.mypy_cache|\.ruff_cache|__pycache__|requirements(-dev)?\.txt|windows-.*requirements.*\.txt|coverage\.xml|pytest-results\.xml)([\\/]|$)'
          | python scripts/check_ci_security_baseline.py --detect-secrets-report

      - name: Clean self-hosted workspace
        if: always()
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
