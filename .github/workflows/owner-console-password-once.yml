name: One owner-authorized Linux console password reset on VM 9417611
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner-console-password-once.yml]
permissions:
  contents: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
jobs:
  reset:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.ref == 'refs/heads/codex/timeweb-owner-prepare-2026-10-23' && github.event.before == '109cd6c51e05885de773f07d126d26fda5093d15' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the already verified read-only VM identity helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9c49b0f7333ecddb0c25890aabc7804ff6dde8f
          persist-credentials: false
          sparse-checkout: tools/inspect_infrastructure_budget.py
          sparse-checkout-cone-mode: false
      - name: Verify identity and issue the approved console password reset once
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              raise SystemExit("a_reset_request_must_not_be_retried")
          source=Path("tools/inspect_infrastructure_budget.py").read_bytes()
          identity=hashlib.sha1(b"blob "+str(len(source)).encode()+bytes([0])+source).hexdigest()
          if identity!="48549795c867cf1ca8beab9c4f021454f6e82a2b":
              raise SystemExit("unexpected_read_only_helper")
          sys.path.insert(0,"tools")
          import inspect_infrastructure_budget as observed
          key=os.environ["TIMEWEB_CLOUD_TOKEN"]
          guest=observed.ReadOnlyAPI(key).get(observed.PATHS["server"]).get("server",{})
          if not (guest.get("id")==9417611 and guest.get("project_id")==2941515
                  and guest.get("availability_zone")=="ams-1" and guest.get("status")=="on"
                  and guest.get("boot_mode")=="std"):
              raise SystemExit("unexpected_vm_identity_or_state_no_request_sent")
          del guest
          url="https://api.timeweb.cloud/api/v1/servers/9417611/reset-password"
          req=urllib.request.Request(url,method="POST",headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
          code=None
          print("CONSOLE_RESET_REQUEST_BEGIN="+json.dumps({"server_id":9417611,"at":datetime.now(timezone.utc).isoformat(),"attempt":1}),flush=True)
          try:
              with urllib.request.build_opener(observed.NoRedirect()).open(req,timeout=30) as reply:
                  code=reply.status
          except urllib.error.HTTPError as failure:
              code=failure.code
              failure.close()
          except OSError:
              pass
          print("CONSOLE_RESET_ACK="+json.dumps({"server_id":9417611,"at":datetime.now(timezone.utc).isoformat(),
               "http_code":code,"documented_acknowledgement":code==204,"reset_response_body_read":False,"attempts":1}),flush=True)
          if code!=204:
              raise SystemExit("console_reset_not_confirmed_do_not_retry")
      - name: Observe application availability independently
        if: always()
        shell: python
        run: |
          import json,urllib.request,urllib.error
          from datetime import datetime,timezone
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          url="https://analyst-ai-2941515.twc1.net/health"
          code=None
          try:
              with urllib.request.build_opener(NoRedirect()).open(url,timeout=8) as reply:
                  code=reply.status if reply.geturl()==url else None
          except urllib.error.HTTPError as error:
              code=error.code
              error.close()
          except OSError:
              pass
          print("RESET_APP_HEALTH="+json.dumps({"http_code":code,"observed_at":datetime.now(timezone.utc).isoformat()}),flush=True)
