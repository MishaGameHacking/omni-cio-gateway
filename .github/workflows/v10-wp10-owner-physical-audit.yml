name: V10 WP10 OWNER Physical Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp10-owner-physical-audit.yml"
      - "docs/architecture/V10_WP10_**"
      - "docs/operations/V10_WP10_**"
      - "infrastructure/windows/*wp10*"
      - "scripts/*wp10*"
      - "tests/test_v10_wp10_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp10-owner-physical-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-physical:
    name: OWNER off-device recovery and runner isolation evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Require real local OWNER rehearsal evidence
        shell: cmd
        run: |
          @echo off
          set "OWNER_REHEARSAL=C:\ProgramData\OmniCIO\wp10\owner-rehearsal.sanitized.local.json"
          if not exist "%OWNER_REHEARSAL%" (
            echo WP10_OWNER_PHYSICAL_GATE=OWNER_ACTION_REQUIRED
            echo The OWNER must run the reviewed local WP10 owner gate on an existing encrypted non-system data volume.
            exit /b 1
          )
          echo WP10_OWNER_REHEARSAL=%OWNER_REHEARSAL%>>"%GITHUB_ENV%"
          echo WP10_OWNER_LOCAL_REHEARSAL=PRESENT

      - name: Prove non-admin runner cannot access off-device payload
        shell: cmd
        run: |
          @echo off
          set "ACCESS=%RUNNER_TEMP%\wp10-owner-access-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\audit_wp10_offdevice_target.ps1 -AsJson > "%ACCESS%"
          if errorlevel 1 (
            type "%ACCESS%"
            exit /b 1
          )
          type "%ACCESS%"
          echo WP10_OWNER_ACCESS=%ACCESS%>>"%GITHUB_ENV%"

      - name: Build and validate sanitized final OWNER evidence
        shell: cmd
        run: |
          @echo off
          set "FINAL=%RUNNER_TEMP%\wp10-owner-final-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.json"
          python scripts\assess_v10_wp10_owner_evidence.py "%WP10_OWNER_REHEARSAL%" "%WP10_OWNER_ACCESS%" --output "%FINAL%"
          if errorlevel 1 exit /b %errorlevel%
          type "%FINAL%"
          echo WP10_OWNER_FINAL=%FINAL%>>"%GITHUB_ENV%"

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v10-wp10-owner-sanitized-evidence
          path: ${{ runner.temp }}\wp10-owner-final-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 3

      - name: Clean runner-temporary sanitized evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined WP10_OWNER_ACCESS if exist "%WP10_OWNER_ACCESS%" del /f /q "%WP10_OWNER_ACCESS%"
          if defined WP10_OWNER_FINAL if exist "%WP10_OWNER_FINAL%" del /f /q "%WP10_OWNER_FINAL%"
          git reset --hard HEAD
          git clean -ffdx
