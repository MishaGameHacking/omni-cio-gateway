name: V10 WP9 Recovery Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp9-recovery-compat.yml"
      - "infrastructure/windows/provision_wp9_supervision.ps1"
      - "infrastructure/windows/wp9_rehearsal_worker.ps1"
      - "docs/architecture/V10_WP9_SUPERVISION_CONTRACT.json"
      - "tests/test_v10_wp9_restart_rehearsal_semantics.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp9-recovery-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-recovery:
    name: Hosted Windows bounded kill/recovery
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise explicit bounded recovery after process kill
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $folderName = "OmniCIO-WP9-Recovery-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $taskPath = "\$folderName\"
          $taskName = "WP9.BoundedRecovery"
          $stateRoot = Join-Path $env:RUNNER_TEMP $folderName
          $statePath = Join-Path $stateRoot "state.json"
          New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null
          $worker = (Resolve-Path ".\infrastructure\windows\wp9_rehearsal_worker.ps1").Path
          $powershellExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $service = New-Object -ComObject "Schedule.Service"
          $service.Connect()
          $root = $service.GetFolder("\")

          function Read-State {
            if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { return $null }
            try { return Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json } catch { return $null }
          }

          try {
            [void]$root.CreateFolder($folderName)
            $actionArgs = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}" -StatePath "{1}" -HoldSeconds 120 -MaxAttempts 3 -BackoffSeconds 60' -f $worker, $statePath
            $action = New-ScheduledTaskAction -Execute $powershellExe -Argument $actionArgs
            $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\LOCAL SERVICE" -LogonType ServiceAccount -RunLevel Limited
            $settings = New-ScheduledTaskSettingsSet -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit (New-TimeSpan -Minutes 5) -MultipleInstances IgnoreNew -StartWhenAvailable
            $definition = New-ScheduledTask -Action $action -Principal $principal -Settings $settings -Description "OMNI-CIO-V10-WP9-BOUNDED-RECOVERY-COMPAT"
            Register-ScheduledTask -TaskName $taskName -TaskPath $taskPath -InputObject $definition -Force | Out-Null
            Start-ScheduledTask -TaskPath $taskPath -TaskName $taskName

            $first = $null
            $deadline = [datetime]::UtcNow.AddSeconds(30)
            do {
              $first = Read-State
              if ($null -ne $first -and [int]$first.run_count -eq 1 -and [string]$first.state -eq "RUNNING_FIRST_ATTEMPT") { break }
              Start-Sleep -Milliseconds 500
            } while ([datetime]::UtcNow -lt $deadline)
            if ($null -eq $first) { throw "WP9_COMPAT_FIRST_ATTEMPT_NOT_OBSERVED" }

            $firstProcessId = [int]$first.process_id
            $firstProcess = Get-Process -Id $firstProcessId -ErrorAction Stop
            if ([string]$firstProcess.ProcessName -notmatch '^powershell$') {
              throw "WP9_COMPAT_PROCESS_MISMATCH"
            }
            Stop-Process -Id $firstProcessId -Force -ErrorAction Stop

            $recovered = $null
            $deadline = [datetime]::UtcNow.AddSeconds(120)
            do {
              $candidate = Read-State
              if ($null -ne $candidate -and [int]$candidate.run_count -ge 2 -and [string]$candidate.state -eq "RECOVERED") {
                $recovered = $candidate
                break
              }
              Start-Sleep -Seconds 2
            } while ([datetime]::UtcNow -lt $deadline)

            if ($null -eq $recovered) { throw "WP9_COMPAT_RECOVERY_NOT_OBSERVED" }
            if ([int]$recovered.run_count -gt 3) { throw "WP9_COMPAT_MAX_ATTEMPTS_EXCEEDED" }
            Write-Host "WP9 bounded synthetic kill/recovery: PASS"
          }
          finally {
            Unregister-ScheduledTask -TaskPath $taskPath -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            try { $root.DeleteFolder($folderName, 0) } catch { }
            Remove-Item -LiteralPath $stateRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
