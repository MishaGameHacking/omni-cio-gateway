name: V10 Cloudflare Candidate Deployment

on:
  push:
    branches:
      - system/cloudflare-public-product
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-cloudflare-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: CF-C staging Worker and Container acceptance
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.sha }}

    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact branch head without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Resolve provider authority fail-closed without identifier logging
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY_VALUE: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID_VALUE: ${{ secrets.NEON_ORG_ID }}
          NEON_PROJECT_ID_VALUE: ${{ secrets.NEON_PROJECT_ID }}
        run: python -m scripts.check_v10_cloudflare_provider_readiness

      - name: Verify Workers Builds authority before provider mutation
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_CREDENTIAL_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_workers_builds_authority

      - name: Install exact Cloudflare delivery toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/wrangler --version | awk '{print $NF}')" = "4.127.1"

      - name: Verify Cloudflare Containers registry read authority
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.probe_v10_cloudflare_container_registry_authority

      - name: Install exact hashed provider control-plane dependencies
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --force-reinstall -r requirements.cloudflare-control-plane.txt
          python -c "import importlib.metadata as m; expected={'psycopg':'3.3.4','psycopg-binary':'3.3.4','typing-extensions':'4.16.0','tzdata':'2026.3'}; actual={name:m.version(name) for name in expected}; assert actual == expected, actual"

      - name: Provision isolated Neon staging runtime role
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          dsn_file="${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt"
          rm -f "$dsn_file"
          python -m scripts.provision_v10_cloudflare_neon_runtime \
            --expected-sha "$EXPECTED_HEAD" \
            --environment staging
          test -s "$dsn_file"
          printf 'OMNI_V10_STAGING_DSN_FILE=%s\n' "$dsn_file" >> "$GITHUB_ENV"

      - name: Bootstrap isolated staging Worker without local Containers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          python -m scripts.probe_v10_cloudflare_staging_worker_anchor
          bootstrap_rc=$?
          set -e
          case "$bootstrap_rc" in
            0)
              ;;
            10)
              ./node_modules/.bin/wrangler deploy --config cloudflare/wrangler.bootstrap.staging.jsonc
              python -m scripts.probe_v10_cloudflare_staging_worker_anchor
              ;;
            *)
              exit "$bootstrap_rc"
              ;;
          esac

      - name: Configure Workers Builds and accept exact staging build
        id: bootstrap
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python -m scripts.bootstrap_v10_cloudflare_builds \
            --expected-sha "$EXPECTED_HEAD"

      - name: Accept live staging Worker and Container
        shell: bash
        env:
          OMNI_V10_CLOUDFLARE_ORIGIN: ${{ steps.bootstrap.outputs.staging_url }}
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 40); do
            if bash scripts/probe_v10_cloudflare_live_release.sh "$EXPECTED_HEAD"; then
              accepted=1
              break
            fi
            echo "CLOUDFLARE_LIVE_ACCEPTANCE_RETRY attempt=${attempt}/40"
            sleep 15
          done
          test "$accepted" -eq 1
          echo "CLOUDFLARE_CF_C=ACCEPTED"

      - name: Record accepted staging evidence
        shell: bash
        env:
          STAGING_URL: ${{ steps.bootstrap.outputs.staging_url }}
          BUILD_UUID: ${{ steps.bootstrap.outputs.cloudflare_build_uuid }}
        run: |
          {
            echo "### V10 Cloudflare CF-C candidate"
            echo "- exact SHA: \`${EXPECTED_HEAD}\`"
            echo "- Worker + Container build: PASS"
            echo "- Neon PostgreSQL 18 isolated staging role: PASS"
            echo "- exact-SHA / health / database live acceptance: PASS"
            echo "- staging URL: ${STAGING_URL}"
            echo "- Cloudflare build UUID: \`${BUILD_UUID}\`"
            echo "- production promotion: NOT PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean secrets and self-hosted workspace
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/omni-cio-v10-cloudflare-staging-dsn.txt"
          if [[ -n "${OMNI_V10_STAGING_DSN_FILE:-}" ]]; then
            rm -f -- "$OMNI_V10_STAGING_DSN_FILE"
          fi
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
