name: Observe current owned N00 checks
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-progress.yml]
permissions:
  contents: read
  checks: write
concurrency:
  group: analyst-n00-current-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read current synthetic check reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const cp=require('node:child_process');
            const r=cp.spawnSync('py',['-3','-c',"import pathlib,os,sys,json,re\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\nroot=pathlib.Path('C:/actions-runner-2/_work/_temp/analyst-development-40232092366-1')\nout={}\np=root/'10-host-tests.log'\nif p.is_file():\n text=p.read_text(encoding='utf-8',errors='replace')\n out['failures']=[block[:3500] for block in re.split(r'\\n={20,}\\r?\\n',text)[1:] if 'FAIL:' in block or 'ERROR:' in block]\n out['summary']=text[-180:]\nout['tests']={}\nsource=pathlib.Path('C:/actions-runner-2/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40232092366-1')\nfor p in (source/'.github/scripts/tests').glob('test_*.py'):\n s=p.read_text(encoding='utf-8')\n if 'registerContentObserver' in s or 'ANIMATOR_DURATION_SCALE' in s:\n  out['tests'][p.name]=s\nprint(json.dumps(out,ensure_ascii=False))\n"],{encoding:'utf8',timeout:45000,maxBuffer:60000});
            let report;
            try{if(r.status!==0)throw new Error('read failed');report=JSON.parse(r.stdout.trim());}catch(e){report={error:String(e),stderr:r.stderr?.slice(-3000)};}
            await github.rest.checks.create({...context.repo,name:'N00 concrete host test failures',head_sha:context.sha,status:'completed',conclusion:report.error?'failure':'success',output:{title:'Current laptop check and build state',summary:'\`\`\`json\n'+JSON.stringify(report,null,2)+'\n\`\`\`'}});
            if(report.error)core.setFailed(report.error);
            
