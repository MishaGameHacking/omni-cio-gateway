name: Observe current owned N00 checks
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-progress.yml]
permissions:
  contents: read
  checks: write
concurrency:
  group: analyst-n00-current-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read preserved synthetic test evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const cp=require('node:child_process');
            const result=cp.spawnSync('py',['-3','-c',"import pathlib,os,sys,json,subprocess\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\nreport={'host':os.environ['COMPUTERNAME'],'linux':{},'android':{}}\nr=subprocess.run(['wsl.exe','-d','Ubuntu-24.04','-u','analyst-ci','--exec','python3','-c',\"import pathlib,json\\nroot=pathlib.Path('/opt/analyst-ci/runs/40227746918-1')\\nout={'exists':root.is_dir(),'files':[]}\\nif root.is_dir():\\n out['files']=[{'name':str(p.relative_to(root)),'bytes':p.stat().st_size} for p in root.rglob('*') if p.is_file() and p.suffix in {'.json','.log'} and '/source/' not in str(p) and '/.venv/' not in str(p)][:100]\\n for p in root.glob('*report*.json'):\\n  out[p.name]=p.read_text()[-21000:]\\nprint(json.dumps(out))\\n\"],capture_output=True,text=True,encoding='utf-8',timeout=90)\nreport['linux']={'exit':r.returncode,'stdout':r.stdout[-26000:],'stderr':r.stderr[-1000:]}\nroot=pathlib.Path('C:/actions-runner-2/_work/omni-cio-gateway/omni-cio-gateway/windows-n00-40227132451-1')\nreport['android']['source_exists']=root.is_dir()\nout=root/'app/build/outputs/apk/preview'\nreport['android']['files']=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size} for p in out.rglob('*') if p.is_file() and p.suffix in {'.json','.log'}][:100] if out.is_dir() else []\nfor p in out.glob('runtime-*.json'):\n report['android'][p.name]=p.read_text(encoding='utf-8')[-12000:]\nfor p in out.glob('install-api37-*/runtime-console.log'):\n report['android'][str(p.relative_to(out))]=p.read_text(encoding='utf-8',errors='replace')[-4500:]\nprint(json.dumps(report))\n"],{encoding:'utf8',timeout:150000,maxBuffer:100000});
            let report;
            if(result.status===0){try{report=JSON.parse(result.stdout.trim());}catch(e){report={error:'invalid_json',stdout:result.stdout.slice(-10000),stderr:result.stderr.slice(-2000)};}}
            else report={error:'inspection_failed',exit:result.status,stdout:result.stdout?.slice(-4000),stderr:result.stderr?.slice(-4000)};
            let summary='\`\`\`json\n'+JSON.stringify(report,null,2)+'\n\`\`\`';
            if(summary.length>62000)summary=summary.slice(0,62000);
            await github.rest.checks.create({...context.repo,name:'N00 persistent failure evidence',head_sha:context.sha,status:'completed',conclusion:report.error?'failure':'success',output:{title:'Read retained Linux and Android test failures',summary}});
            if(report.error)core.setFailed(report.error);
            
