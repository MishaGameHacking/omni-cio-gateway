name: Observe current owned N00 checks
'on':
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-progress.yml]
permissions:
  contents: read
concurrency:
  group: analyst-n00-current-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read bounded current logs without changing the active tests
        shell: cmd
        run: |
          py -3 -c "exec(compile(bytes.fromhex(''),'n00-current-observer','exec'))"
          if errorlevel 1 exit /b 1
