name: Observe candidate40 purchase result geometry progress
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-progress.yml]
permissions:
  contents: read
  checks: write
  actions: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    steps:
      - name: Read actual geometry observations from the separate laptop checkout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs'),p=require('node:path');
            if(process.platform!=='win32'||process.env.COMPUTERNAME!=='LAPTOP-NPSGA016')throw new Error('wrong_host');
            const run_id=40245350516;
            const root='C:/actions-runner/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40245350516-1';
            const file=p.join(root,'app/build/outputs/apk/preview/ui-screens/purchase-result-observations.json');
            const check=(await github.rest.checks.create({...context.repo,name:'N00 purchase result diagnostic progress',head_sha:context.sha,status:'in_progress',output:{title:'Awaiting actual native result observations',summary:'Read-only observation; no release acceptance.'}})).data;
            const fence=String.fromCharCode(96).repeat(3);
            function frame(row,expected){
              if(!row)return null;
              return {...row,labels:row.labels.map(x=>({text:x.text,bounds:x.bounds,visible:x['visible-to-user']}))};
            }
            for(let attempt=0;attempt<150;attempt++){
              let observed=null;
              if(fs.existsSync(file)){try{observed=JSON.parse(fs.readFileSync(file,'utf8'));}catch(error){if(!(error instanceof SyntaxError))throw error;}}
              const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
              const report={run_id,source_root:root,workflow_status:run.status,workflow_conclusion:run.conclusion,diagnostic_only:true,release_gate_pass:false};
              if(observed){
                report.active_case=observed.active_case;report.cases=observed.cases.map(x=>({case:x.case,font_scale:x.font_scale,checks:x.checks}));
                report.result=observed.result;
                report.geometry=observed.result_traversals.map(x=>({case:x.case,expected:x.expected,original_search_passed:x.original_search_passed,original_failure:x.original_failure,reachable_by_reverse_scroll:x.reachable_by_reverse_scroll,
                  frames:x.frames?.map(r=>frame(r,x.expected)),first_frame:frame(x.first_frame,x.expected),last_frame:frame(x.last_frame,x.expected)}));
              }
              const completed=!!observed?.result||run.status==='completed';
              await github.rest.checks.update({...context.repo,check_run_id:check.id,status:completed?'completed':'in_progress',...(completed?{conclusion:'neutral'}:{}),output:{title:completed?'Actual diagnostic observations preserved; no complete acceptance':'Observing unchanged native traversal',summary:fence+'json\n'+JSON.stringify(report,null,2)+'\n'+fence}});
              if(completed)return;
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Bounded observation period ended before diagnostic completion');
