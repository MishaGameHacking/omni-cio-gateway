name: Main security diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main-security-diagnostics.yml"
      - ".github/scripts/bootstrap_self_hosted_python.cmd"
      - ".github/scripts/main_security_diagnostics.py"

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Checkout accepted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Query GitHub code-scanning alerts
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: '"%OMNICIO_PYTHON%" .github\scripts\main_security_diagnostics.py'
