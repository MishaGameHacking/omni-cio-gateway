        ': False}\\n        need(stable_tuple(os.fstat(stream.fileno())) == stable_tuple(before) == stable_tuple(trusted(ARCHIVE)),\\\
        n             \\'archive_changed_during_evidence_read\\')\\n    recovery = {\\n        \\'schema\\': 1, \\'kind\\\
        ': \\'original_build44_archive_evidence_recovery\\',\\n        \\'status\\': \\'original_source_evidence_recovered\\\
        ', \\'observed_at\\': datetime.datetime.now(datetime.timezone.utc).isoformat(),\\n        \\'build_run_id\\': 40282775349,\
        \ \\'build_run_attempt\\': 1, \\'archive_bytes\\': ARCHIVE_BYTES, \\'archive_sha256\\': ARCHIVE_SHA256,\\n       \
        \ \\'archive_stable_during_read\\': True, \\'archive_envelope_verified\\': True, \\'archive_evidence_file_count\\\
        ': ARCHIVE_EVIDENCE_FILES,\\n        \\'build_report_sha256\\': BUILD_REPORT_SHA256, \\'base_commit\\': BASE_COMMIT,\
        \ \\'base_source_sha256\\': BASE_SOURCE,\\n        \\'source_sha256\\': SOURCE_SHA256, \\'complete_source_sha256\\\
        ': COMPLETE_SOURCE_SHA256,\\n        \\'inventories\\': {\\'source-before.json\\': baseline_receipt, \\'source-final.json\\\
        ': final_receipt},\\n        \\'junit\\': junit, \\'application_or_tests_executed\\': False, \\'remote_files_written\\\
        ': False,\\n        \\'database_opened\\': False, \\'release_published\\': False, \\'phone_accessed\\': False,\\n\
        \        \\'runtime_pass\\': False, \\'full_runtime_matrix_passed\\': False, \\'phone_verified\\': False,\\n     \
        \   \\'exported_files\\': {name: {\\'bytes\\': len(raw), \\'sha256\\': sha(raw)} for name, raw in sorted(selected.items())},\\\
        n    }\\n    selected[\\'recovery-report.json\\'] = encoded(recovery)\\n    need(sum(len(raw) for raw in selected.values())\
        \ <= MAX_SELECTED_BYTES, \\'selected_evidence_exceeds_bound\\')\\n    memory = io.BytesIO()\\n    with zipfile.ZipFile(memory,\
        \ \\'w\\', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as outgoing:\\n        for name, raw in sorted(selected.items()):\\\
        n            outgoing.writestr(name, raw)\\n    data = memory.getvalue()\\n    need(len(data) <= MAX_METADATA_ZIP,\
        \ \\'outgoing_metadata_zip_exceeds_bound\\')\\n    transfer = {\\'schema\\': 1, \\'kind\\': \\'build44_readonly_metadata_transfer\\\
        ',\\n                \\'archive_bytes\\': ARCHIVE_BYTES, \\'archive_sha256\\': ARCHIVE_SHA256,\\n                \\\
        'build_report_sha256\\': BUILD_REPORT_SHA256, \\'source_sha256\\': SOURCE_SHA256,\\n                \\'metadata_zip_bytes\\\
        ': len(data), \\'metadata_zip_sha256\\': sha(data),\\n                \\'files\\': {name: {\\'bytes\\': len(raw),\
        \ \\'sha256\\': sha(raw)} for name, raw in sorted(selected.items())},\\n                \\'metadata_zip_base64\\':\
        \ base64.b64encode(data).decode(\\'ascii\\')}\\n    response = json.dumps(transfer, ensure_ascii=True, separators=(\\\
        ',\\', \\':\\')).encode(\\'ascii\\')\\n    need(len(response) <= 12 * 1024**2, \\'outgoing_response_exceeds_bound\\\
        ')\\n    sys.stdout.buffer.write(response + b\\'\\\\n\\')\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n   \
        \     main()\\n    except BaseException as error:\\n        # Exception text and tracebacks can contain private archive\
        \ data. Never\\n        # return them through the administrative transport\\'s stderr logger.\\n        code = str(error)\
        \ if isinstance(error, ObservationError) else type(error).__name__\\n        if not re.fullmatch(r\\'[A-Za-z0-9_]{1,100}\\\
        ', code):\\n            code = \\'readonly_recovery_unavailable\\'\\n        print(\\'BUILD44_READONLY_RECOVERY_FAILED=\\\
        ' + code, file=sys.stderr, flush=True)\\n        raise SystemExit(1) from None\\n'\n\"\"\"Receive the remote metadata\
        \ in memory; preserve only an explicit allowlist.\n\nThe generator prepends the byte-pinned proven9417611 transport\
        \ and exact remote\npayload. This script is administrative data handling, not an application runner.\n\"\"\"\nimport\
        \ base64\nimport io\nimport re\nimport stat\nimport zipfile\n\nassert __debug__ and os.environ['GITHUB_REPOSITORY']\
        \ == 'MishaGameHacking/omni-cio-gateway'\nassert os.environ['GITHUB_REF'] == 'refs/heads/codex/timeweb-owner-prepare-2026-10-23'\n\
        assert os.environ['GITHUB_EVENT_NAME'] == 'push'\nrun, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']\n\
        assert re.fullmatch(r'[1-9]\\d{0,19}', run) and re.fullmatch(r'[1-9]\\d{0,4}', attempt)\nassert hashlib.sha256(remote.encode('utf-8')).hexdigest()\
        \ == REMOTE_SHA256\nraw_response = with_ams(remote, timeout=240, capture=True)\nassert len(raw_response) <= 12 * 1024**2\n\
        transfer = json.loads(raw_response)\nassert transfer['schema'] == 1 and transfer['kind'] == 'build44_readonly_metadata_transfer'\n\
        assert transfer['archive_bytes'] == 68927139\nassert transfer['archive_sha256'] == 'f8dd107e1714fcc1a3aeed4afd25b6d9efa3dca878b7106191f3fd77e4fa1b89'\n\
        assert transfer['build_report_sha256'] == '808a43afb0585b3cf2cd9519d54c525f51be4d66fa239e3d9c4c4257d2eafd40'\nassert\
        \ transfer['source_sha256'] == 'e34b717fa408fbe377d910a372933c35a2ba1bdddf02263b6daa477df70f93b9'\ndata = base64.b64decode(transfer.pop('metadata_zip_base64'),\
        \ validate=True)\nassert len(data) == transfer['metadata_zip_bytes'] <= 8 * 1024**2\nassert hashlib.sha256(data).hexdigest()\
        \ == transfer['metadata_zip_sha256']\nrequired = {'source-before.json', 'source-final.json', 'windows-development.json',\n\
        \            'windows-development-envelope.json', 'controller.json', 'recovery-report.json'}\nvalues = {}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as archive:\n    infos = archive.infolist()\n    names = [item.filename for item in infos]\n    assert required\
        \ <= set(names) and len(names) == len(set(names)) <= 262\n    assert set(names) == set(transfer['files'])\n    assert\
        \ sum(item.file_size for item in infos) <= 40 * 1024**2\n    for item in infos:\n        name = item.filename\n  \
        \      assert name in required or re.fullmatch(r'junit-xml/TEST-[A-Za-z0-9_.$-]+\\.xml', name)\n        assert not\
        \ item.is_dir() and not item.flag_bits & 1 and stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG)\n      \
        \  limit = 8 * 1024**2 if name in ('source-before.json', 'source-final.json') else 4 * 1024**2\n        assert item.file_size\
        \ <= limit\n        with archive.open(item) as stream:\n            raw = stream.read(limit + 1)\n        assert len(raw)\
        \ == item.file_size and transfer['files'][name] == {\n            'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}\n\
        \        values[name] = raw\nassert hashlib.sha256(values['windows-development.json']).hexdigest() == transfer['build_report_sha256']\n\
        receipt = json.loads(values['recovery-report.json'])\nassert receipt['status'] == 'original_source_evidence_recovered'\n\
        assert receipt['archive_stable_during_read'] is receipt['archive_envelope_verified'] is True\nassert receipt['archive_sha256']\
        \ == transfer['archive_sha256'] and receipt['source_sha256'] == transfer['source_sha256']\nassert receipt['exported_files']\
        \ == {name: value for name, value in transfer['files'].items() if name != 'recovery-report.json'}\nassert all(receipt[key]\
        \ is False for key in ('application_or_tests_executed', 'remote_files_written', 'database_opened',\n    'release_published',\
        \ 'phone_accessed', 'runtime_pass', 'full_runtime_matrix_passed', 'phone_verified'))\nfor name in ('source-before.json',\
        \ 'source-final.json'):\n    assert receipt['inventories'][name]['original_bytes_preserved'] is True\n    assert receipt['inventories'][name]['sha256']\
        \ == transfer['files'][name]['sha256']\n    assert receipt['inventories'][name]['bytes'] == transfer['files'][name]['bytes']\n\
        output = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / ('n00-build44-recovery-' + run + '-' + attempt)\n\
        assert not output.exists() and not output.is_symlink()\noutput.mkdir()\nfor name, raw in sorted(values.items()):\n\
        \    path = output / name\n    path.parent.mkdir(exist_ok=True)\n    with path.open('xb') as stream:\n        stream.write(raw)\n\
        \    assert hashlib.sha256(path.read_bytes()).hexdigest() == transfer['files'][name]['sha256']\nwith (output / 'recovery-transfer.json').open('x',\
        \ encoding='utf-8') as stream:\n    json.dump(transfer, stream, ensure_ascii=True, sort_keys=True, indent=2)\n   \
        \ stream.write('\\n')\nsummary = {key: value for key, value in receipt.items() if key not in ('exported_files', 'junit')}\n\
        summary['junit'] = {key: value for key, value in receipt['junit'].items() if key != 'files'}\nsummary['metadata_zip_bytes']\
        \ = transfer['metadata_zip_bytes']\nsummary['metadata_zip_sha256'] = transfer['metadata_zip_sha256']\nprint('N00_BUILD44_ORIGINAL_EVIDENCE_RECOVERED='\
        \ + json.dumps(summary, ensure_ascii=True, separators=(',', ':')), flush=True)\n\nPY\n"
    - name: Preserve verified original inventory and available JVM XML
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build44-original-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/n00-build44-recovery-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: warn
        retention-days: 3
  windows_path_stat:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.ref == 'refs/heads/codex/timeweb-owner-prepare-2026-10-23'
      && github.event_name == 'push'
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 3
    steps:
    - name: Observe only fixed retained source and former temp state paths
      shell: py -3 {0}
      env:
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
        PYTHONUNBUFFERED: '1'
      run: "\"\"\"One-shot lstat only for fixed build44 paths; no traversal/content/ADB reads.\"\"\"\nimport datetime\nimport\
        \ json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nimport sys\n\nROOT = Path('C:/actions-runner-3/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40282775349-1')\n\
        STATE = Path('C:/actions-runner-3/_work/_temp/analyst-development-40282775349-1')\nPATHS = {\n    'retained_build_root':\
        \ ROOT,\n    'runner_temp_parent': STATE.parent,\n    'build_state': STATE,\n    'completed_report': STATE / 'windows-development.json',\n\
        \    'source_before': STATE / 'source-before.json',\n    'source_final': STATE / 'source-final.json',\n    'junit_directory':\
        \ ROOT / 'app/build/test-results/testDebugUnitTest',\n}\n\n\ndef main():\n    assert __debug__ and sys.platform ==\
        \ 'win32' and os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'\n    assert os.environ.get('RUNNER_OS') == 'Windows'\
        \ and os.environ.get('RUNNER_ARCH') == 'X64'\n    assert os.environ.get('GITHUB_REPOSITORY') == 'MishaGameHacking/omni-cio-gateway'\n\
        \    assert os.environ.get('GITHUB_REF') == 'refs/heads/codex/timeweb-owner-prepare-2026-10-23'\n    assert os.environ.get('GITHUB_EVENT_NAME')\
        \ == 'push'\n    run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']\n    assert re.fullmatch(r'[1-9]\\\
        d{0,19}', run) and re.fullmatch(r'[1-9]\\d{0,4}', attempt)\n    result = {'schema': 1, 'kind': 'fixed_build44_path_stat',\
        \ 'target_build_run_id': 40282775349,\n              'target_build_attempt': 1, 'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),\n\
        \              'observation_run_id': int(run), 'observation_run_attempt': int(attempt),\n              'read_only':\
        \ True, 'directory_enumeration_performed': False, 'file_contents_read': False,\n              'adb_accessed': False,\
        \ 'app_or_tests_executed': False, 'paths': {}}\n    for label, path in PATHS.items():\n        value = {'path': str(path)}\n\
        \        try:\n            info = path.lstat()\n            redirected = stat.S_ISLNK(info.st_mode) or bool(getattr(info,\
        \ 'st_file_attributes', 0) & 0x400)\n            value.update(exists=True, redirected=redirected, bytes=info.st_size,\
        \ mtime_ns=info.st_mtime_ns,\n                         type='directory' if stat.S_ISDIR(info.st_mode) else 'regular_file'\
        \ if stat.S_ISREG(info.st_mode) else 'other')\n        except FileNotFoundError:\n            value.update(exists=False,\
        \ observation='not_found')\n        except OSError:\n            value.update(exists=None, observation='stat_unavailable')\n\
        \        result['paths'][label] = value\n    result['retained_source_with_missing_temp_state_observed'] = (\n    \
        \    result['paths']['retained_build_root'].get('exists') is True and\n        result['paths']['retained_build_root'].get('type')\
        \ == 'directory' and\n        result['paths']['build_state'].get('exists') is False)\n    result['cleanup_actor_or_cause_proven']\
        \ = False\n    temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)\n    assert temp in {Path('C:/actions-runner'\
        \ + suffix) / '_work/_temp' for suffix in ('', '-2', '-3', '-4')}\n    info = temp.lstat()\n    assert stat.S_ISDIR(info.st_mode)\
        \ and not info.st_file_attributes & 0x400\n    output = temp / ('n00-build44-path-stat-' + run + '-' + attempt)\n\
        \    assert not output.exists() and not output.is_symlink()\n    output.mkdir()\n    with (output / 'fixed-build44-path-stat.json').open('x',\
        \ encoding='utf-8') as stream:\n        json.dump(result, stream, ensure_ascii=True, indent=2)\n        stream.write('\\\
        n')\n    print('N00_BUILD44_FIXED_PATH_STAT=' + json.dumps(result, ensure_ascii=True, separators=(',', ':')), flush=True)\n\
        \n\nif __name__ == '__main__':\n    main()\n"
    - name: Preserve fixed path existence and stat observations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build44-fixed-path-stat-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/n00-build44-path-stat-${{ github.run_id }}-${{ github.run_attempt }}/fixed-build44-path-stat.json
        if-no-files-found: warn
        retention-days: 3
