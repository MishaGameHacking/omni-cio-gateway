name: Recover original build44 metadata and observe fixed Windows paths
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-n00-build44-original-evidence.yml
permissions:
  contents: read
concurrency:
  group: build44-original-evidence-readonly
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.ref == 'refs/heads/codex/timeweb-owner-prepare-2026-10-23'
      && github.event_name == 'push'
