name: Read existing Timeweb AI tariffs without model charges
on:
  push:
    branches: [codex/timeweb-model-access-2026-11-01]
    paths:
      - tools/timeweb-model-pricing.mjs
      - tools/timeweb-ai-http.mjs
      - tools/tests/timeweb-model-pricing.test.mjs
      - .github/workflows/timeweb-model-pricing.yml
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-model-pricing
  cancel-in-progress: false
jobs:
  prices:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ai-pricing-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Check parser and request restrictions
        shell: cmd
        working-directory: ai-pricing-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "C:\Program Files\nodejs\node.exe" --test tools/tests/timeweb-model-pricing.test.mjs
          if errorlevel 1 exit /b 1
      - name: Read only public model and tariff metadata with the existing key
        shell: cmd
        working-directory: ai-pricing-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          "C:\Program Files\nodejs\node.exe" tools/timeweb-model-pricing.mjs
          if errorlevel 1 exit /b 1
      - name: Preserve sanitized tariff metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timeweb-model-pricing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai-pricing-${{ github.run_id }}-${{ github.run_attempt }}/timeweb-model-pricing.json
          if-no-files-found: error
          retention-days: 7
