name: Restore original signing identity to Timeweb
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner-signing-restore.yml]
permissions:
  contents: write
concurrency:
  group: analyst-ams-signing-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: analyst-ams-administration
          persist-credentials: false
      - name: Prepare authenticated encrypted administrative transfer
        shell: cmd
        working-directory: analyst-ams-administration
        run: |
          py -3 -m venv "%RUNNER_TEMP%\analyst-key-transport"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\analyst-key-transport\Scripts\python.exe" -m pip install --require-hashes --only-binary=:all: -r tools\timeweb-actions-requirements.txt
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\analyst-key-transport\Scripts\python.exe" -m pip install --only-binary=:all: cryptography==50.0.0
          if errorlevel 1 exit /b 1
      - name: Encrypt for the verified Timeweb recipient and upload a private draft
        shell: cmd
        working-directory: analyst-ams-administration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "%RUNNER_TEMP%\analyst-key-transport\Scripts\python.exe" deploy\restore_ams_signing.py
          if errorlevel 1 exit /b 1
