name: Linux Android runtime preparation

on:
  push:
    branches: [codex/spectrum-3d-100]
    paths:
      - .github/workflows/linux-runtime-probe.yml
      - tools/timeweb_*.py
      - tools/ci_host_capacity.py
      - .github/scripts/ci_private_transfer.cjs
      - .github/scripts/ci_private_transfer.test.cjs
      - tools/ci_apk_archive.py
      - tools/ci-transfer-requirements.txt
      - tools/tests/test_timeweb_ci_transfer.py

permissions:
  contents: read

concurrency:
  group: analyst-linux-runtime-preparation
  cancel-in-progress: false

jobs:
  github-transfer:
    if: contains(github.event.head_commit.message, '[github-transfer-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CI_TRANSFER_KIND: probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          persist-credentials: false
      - name: Test private handoff boundaries without credentials
        run: |
          node --test .github/scripts/ci_private_transfer.test.cjs
          python3 -m unittest discover -s tools/tests -p 'test_timeweb_*.py'
      - name: Verify synthetic draft handoff and unauthenticated denial
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'probe'});
      - name: Remove this run's temporary draft and confirm absence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  recover-empty-transfer:
    if: contains(github.event.head_commit.message, '[timeweb-transfer-recover]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned recovery environment
        id: environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-transfer"
          "$RUNNER_TEMP/ci-transfer/bin/python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools/ci-transfer-requirements.txt
          "$RUNNER_TEMP/ci-transfer/bin/python" -m unittest discover -s tools/tests -p 'test_timeweb_*.py'
      - name: Diagnose the empty bucket from the failed synthetic probe
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: env GITHUB_RUN_ID=39563232714 GITHUB_RUN_ATTEMPT=1 GITHUB_SHA=0182a11c41e34e623ca6ee399e65df2a75d91eb7 "$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py diagnose
      - name: Remove only that verified empty probe bucket
        if: always() && steps.environment.outcome == 'success'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: env GITHUB_RUN_ID=39563232714 GITHUB_RUN_ATTEMPT=1 GITHUB_SHA=0182a11c41e34e623ca6ee399e65df2a75d91eb7 "$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py cleanup-empty
  private-transfer:
    if: contains(github.event.head_commit.message, '[timeweb-transfer-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned transfer dependencies without credentials
        id: environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-transfer"
          "$RUNNER_TEMP/ci-transfer/bin/python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools/ci-transfer-requirements.txt
          "$RUNNER_TEMP/ci-transfer/bin/python" -m unittest discover -s tools/tests -p 'test_timeweb_*.py'
      - name: Verify private synthetic transfer within a one-ruble monthly tariff
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: '"$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py probe'
      - name: Delete this run's synthetic object and bucket and verify absence
        if: always() && steps.environment.outcome == 'success'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: '"$RUNNER_TEMP/ci-transfer/bin/python" tools/timeweb_ci_transfer.py cleanup'
  prepare:
    if: contains(github.event.head_commit.message, '[linux-runtime-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure hardware and test the read-only catalogue
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          python3 tools/ci_host_capacity.py
          python3 -m unittest discover -s tools/tests -p 'test_timeweb_*.py'
      - name: Audit retained IPs and compare small private-transfer storage offers
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 tools/timeweb_ci_catalog.py
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install checksum-pinned official Linux Android tools
        run: |
          archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' --output "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/analyst-android-sdk/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$RUNNER_TEMP/analyst-android-sdk" >> "$GITHUB_ENV"
      - name: Install and verify release API 37 packages and both page-size images
        run: |
          python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT"
          python3 .github/scripts/prepare_android_sdk.py --sdk "$ANDROID_SDK_ROOT" --runtime
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
