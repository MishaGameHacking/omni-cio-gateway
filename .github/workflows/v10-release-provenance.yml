name: V10 Release Provenance

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release/tag identity, e.g. v10.0.0-rc.1"
        required: true
        type: string
      authoritative_run_id:
        description: "Exact-SHA Self-Hosted Windows CI workflow_dispatch run"
        required: true
        type: string
      regression_run_id:
        description: "Exact-SHA Regression Shield run on main"
        required: true
        type: string
      hosted_run_id:
        description: "Exact-SHA V10 Toolchain Compatibility workflow_dispatch run"
        required: true
        type: string
      rollback_target:
        description: "Exact protected rollback identity: git:<sha>@app:app"
        required: true
        default: "git:b9e4fabcb54f8f6e0ba206f030c35f2fafa2ce62@app:app"
        type: string
      channel:
        description: "Future updater channel metadata only"
        required: true
        default: "INTERNAL"
        type: choice
        options:
          - INTERNAL
          - STAGING
          - STABLE
      minimum_supported_version:
        description: "Minimum V10 version accepted by future updater"
        required: true
        default: "v10.0.0"
        type: string
      signed_metadata_ref:
        description: "Future signed updater metadata reference; required for STABLE"
        required: false
        type: string
      signing_identity_ref:
        description: "Future signing identity reference; required for STABLE"
        required: false
        type: string
      metadata_expires_at_utc:
        description: "Future RFC3339 metadata expiry; required for STABLE"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-release-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Generate and validate V10 release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Reject non-main release candidates
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ inputs.release_version }}" in
            v10.*) ;;
            *) echo "release_version must use v10.*" >&2; exit 1 ;;
          esac

      - name: Verify exact rollback commit identity
        shell: bash
        env:
          ROLLBACK_TARGET: ${{ inputs.rollback_target }}
        run: |
          if [[ ! "$ROLLBACK_TARGET" =~ ^git:([0-9a-f]{40})@app:app$ ]]; then
            echo "rollback_target must be git:<40-char-sha>@app:app" >&2
            exit 1
          fi
          ROLLBACK_SHA="${BASH_REMATCH[1]}"
          git cat-file -e "${ROLLBACK_SHA}^{commit}"

      - name: Verify repository, toolchain, and Regression Shield contracts
        run: |
          python scripts/check_v10_toolchain_baseline.py
          python scripts/check_v10_regression_shield.py

      - name: Verify exact-SHA CI evidence through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/v10_release_manifest.py verify-ci
          --repository "${{ github.repository }}"
          --git-sha "$GITHUB_SHA"
          --authoritative-run-id "${{ inputs.authoritative_run_id }}"
          --regression-run-id "${{ inputs.regression_run_id }}"
          --hosted-run-id "${{ inputs.hosted_run_id }}"
          --output "dist/v10/ci-evidence.json"

      - name: Generate deterministic lock-derived SBOMs
        run: |
          mkdir -p dist/v10
          python scripts/v10_release_manifest.py generate-sbom \
            --release-version "${{ inputs.release_version }}" \
            --python-lock requirements-dev.txt \
            --npm-lock tests/toolchain/frontend/package-lock.json \
            --python-output dist/v10/python-release-sbom.cdx.json \
            --frontend-output dist/v10/frontend-release-sbom.cdx.json

      - name: Build exact-SHA source artifact
        shell: bash
        run: |
          git archive --format=zip --output=dist/v10/omni-cio-v10-source.zip "$GITHUB_SHA"
          test -s dist/v10/omni-cio-v10-source.zip

      - name: Generate release manifest candidate
        shell: bash
        run: |
          BUILT_AT_UTC="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())')"
          python scripts/v10_release_manifest.py generate \
            --root "$GITHUB_WORKSPACE" \
            --release-version "${{ inputs.release_version }}" \
            --git-sha "$GITHUB_SHA" \
            --built-at-utc "$BUILT_AT_UTC" \
            --workflow-name "V10 Release Provenance" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --source-ref "$GITHUB_REF" \
            --dependency-lock requirements.txt \
            --dependency-lock requirements-dev.txt \
            --dependency-lock tests/toolchain/frontend/package-lock.json \
            --python-sbom "$GITHUB_WORKSPACE/dist/v10/python-release-sbom.cdx.json" \
            --frontend-sbom "$GITHUB_WORKSPACE/dist/v10/frontend-release-sbom.cdx.json" \
            --source-artifact "$GITHUB_WORKSPACE/dist/v10/omni-cio-v10-source.zip" \
            --ci-evidence "$GITHUB_WORKSPACE/dist/v10/ci-evidence.json" \
            --rollback-target "${{ inputs.rollback_target }}" \
            --channel "${{ inputs.channel }}" \
            --minimum-supported-version "${{ inputs.minimum_supported_version }}" \
            --signed-metadata-ref "${{ inputs.signed_metadata_ref }}" \
            --signing-identity-ref "${{ inputs.signing_identity_ref }}" \
            --metadata-expires-at-utc "${{ inputs.metadata_expires_at_utc }}" \
            --output "$GITHUB_WORKSPACE/dist/v10/release-manifest.json"

      - name: Fail closed on incomplete or damaged provenance
        run: >-
          python scripts/v10_release_manifest.py validate
          dist/v10/release-manifest.json
          --root "$GITHUB_WORKSPACE"
          --expected-git-sha "$GITHUB_SHA"

      - name: Write provenance summary
        shell: bash
        run: |
          {
            echo "## V10 release provenance candidate"
            echo
            echo "- Version/tag: \`${{ inputs.release_version }}\`"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Channel metadata: \`${{ inputs.channel }}\`"
            echo "- Rollback target: \`${{ inputs.rollback_target }}\`"
            echo "- Manifest SHA-256: \`$(sha256sum dist/v10/release-manifest.json | cut -d' ' -f1)\`"
            echo "- Publication: **not performed by WP4 workflow**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived release provenance candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v10-release-provenance-${{ inputs.release_version }}
          path: dist/v10/
          if-no-files-found: error
          retention-days: 3
