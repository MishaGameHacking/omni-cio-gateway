name: Live Gateway Authority Acceptance

# Actual deployed V9 authority evidence requires a network path independent of
# the Personal Node. While OWNER-observed GitHub-hosted capacity is blocked and
# the Lenovo route cannot establish TCP/443 to the protected Render endpoint,
# automatic execution is intentionally suspended rather than fabricated.
# Re-enable schedule/PR live execution only through a reviewed capacity-routing
# change after a trusted route is reverified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-gateway-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-authority:
    name: Verify deployed health and reviewed OpenAPI authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNI_LIVE_BASE_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements.txt

      - name: Verify deployed v9 Action authority without broker mutation
        run: python scripts/check_live_gateway_authority.py
