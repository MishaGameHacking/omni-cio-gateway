name: Live Gateway Authority Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
    paths:
      - ".github/workflows/live-gateway-authority.yml"
      - "docs/operations/LIVE_GATEWAY_AUTHORITY_ACCEPTANCE.md"
      - "omni_cio/release/live_authority_v1.py"
      - "scripts/check_live_gateway_authority.py"
      - "tests/test_live_gateway_authority_v1.py"
      - "tests/test_live_acceptance_repository_assets.py"

permissions:
  contents: read

concurrency:
  group: live-gateway-authority-${{ github.ref }}
  cancel-in-progress: true

# This is a live read-only authority probe, not disposable clean-room evidence.
# During the OWNER-observed GitHub Actions zero-budget hard stop it runs on the
# accepted Lenovo continuity lane so the daily schedule does not create a
# predictable hosted billing RED. It consumes no broker/application secrets.
jobs:
  verify-live-authority:
    name: Verify deployed health and reviewed OpenAPI authority
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    env:
      OMNI_LIVE_BASE_URL: https://omni-cio-gateway.onrender.com

    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap protected runner Python 3.12.10
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Build strict Windows runtime dependency projection
        run: python scripts\windows_ci_lock.py project requirements.txt windows-requirements.txt

      - name: Install hash-locked Windows runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r windows-requirements.txt

      - name: Verify deployed v9 Action authority without broker mutation
        run: python scripts\check_live_gateway_authority.py

      - name: Clean live-authority workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
