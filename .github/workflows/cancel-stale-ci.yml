name: Cancel stale CI run

on:
  push:
    branches:
      - chore/sonar-zero-main-2
    paths:
      - ".github/workflows/cancel-stale-ci.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    name: Cancel superseded Auth foundation run
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Cancel stale run 37180863841
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl.exe --fail --silent --show-error
          -X POST
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer %GH_TOKEN%"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/actions/runs/37180863841/cancel"
