name: TEMP V10 Phase 4 Post-Merge Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-phase4-postmerge-probe.yml"

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Probe exact-main Regression Shield, deploy, and public preview
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: "4e10a04376523248cba8d5fa2ec8288de345e1e9"
      PREVIEW_ROOT: "https://omni-cio-v10-web.onrender.com/"

    steps:
      - name: Collect sanitized exact-main and public evidence
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = ('Bearer ' + $env:GH_TOKEN)
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Write-Output ('EXPECTED_MAIN_SHA=' + $env:EXPECTED_MAIN_SHA)

          function Emit-WorkflowEvidence([string]$workflow, [string]$prefix, [string]$requiredEvent) {
            $uri = 'https://api.github.com/repos/' + $repo + '/actions/workflows/' + $workflow + '/runs?per_page=40'
            $runs = (Invoke-RestMethod -Uri $uri -Headers $headers -Method Get).workflow_runs
            $matches = @(
              $runs |
                Where-Object {
                  $_.head_sha -eq $env:EXPECTED_MAIN_SHA -and
                  $_.head_branch -eq 'main' -and
                  ($requiredEvent -eq '' -or $_.event -eq $requiredEvent)
                } |
                Sort-Object run_number -Descending
            )
            Write-Output ($prefix + '_MATCH_COUNT=' + [string]$matches.Count)
            if ($matches.Count -lt 1) {
              Write-Output ($prefix + '_RUN_FOUND=false')
              return
            }
            $run = $matches[0]
            Write-Output ($prefix + '_RUN_FOUND=true')
            Write-Output ($prefix + '_RUN_ID=' + [string]$run.id)
            Write-Output ($prefix + '_RUN_NUMBER=' + [string]$run.run_number)
            Write-Output ($prefix + '_EVENT=' + [string]$run.event)
            Write-Output ($prefix + '_STATUS=' + [string]$run.status)
            Write-Output ($prefix + '_CONCLUSION=' + [string]$run.conclusion)
            Write-Output ($prefix + '_HEAD_SHA=' + [string]$run.head_sha)
            Write-Output ($prefix + '_CREATED_AT=' + [string]$run.created_at)
            Write-Output ($prefix + '_UPDATED_AT=' + [string]$run.updated_at)
            $jobs = (Invoke-RestMethod -Uri $run.jobs_url -Headers $headers -Method Get).jobs
            foreach ($job in $jobs) {
              $safeName = ([string]$job.name -replace '[\r\n=|]+', ' ').Trim()
              Write-Output (
                $prefix + '_JOB=' + $safeName +
                '|status=' + [string]$job.status +
                '|conclusion=' + [string]$job.conclusion +
                '|id=' + [string]$job.id
              )
            }
          }

          Emit-WorkflowEvidence 'regression-shield.yml' 'REGRESSION' 'push'
          Emit-WorkflowEvidence 'v10-phase4-free-preview-deploy.yml' 'DEPLOY' ''

          try {
            $root = Invoke-WebRequest -Uri $env:PREVIEW_ROOT -Method Get -UseBasicParsing -TimeoutSec 45
            Write-Output ('ROOT_HTTP_STATUS=' + [string][int]$root.StatusCode)
            $titleMatch = [regex]::Match([string]$root.Content, '<title>([^<]*)</title>', 'IgnoreCase')
            if ($titleMatch.Success) {
              Write-Output ('ROOT_TITLE=' + (($titleMatch.Groups[1].Value -replace '[\r\n=]+', ' ').Trim()))
            }
            foreach ($headerName in @('Cache-Control','Strict-Transport-Security','X-Content-Type-Options','Content-Security-Policy','Referrer-Policy','Permissions-Policy','X-Frame-Options')) {
              $value = ([string]$root.Headers[$headerName] -replace '[\r\n=]+', ' ').Trim()
              Write-Output ('ROOT_HEADER_' + ($headerName -replace '-', '_').ToUpperInvariant() + '=' + $value)
            }
          }
          catch {
            $code = $null
            if ($null -ne $_.Exception.Response) {
              try { $code = [int]$_.Exception.Response.StatusCode } catch { $code = $null }
            }
            if ($null -ne $code) { Write-Output ('ROOT_HTTP_STATUS=' + [string]$code) }
            Write-Output ('ROOT_ERROR=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          try {
            $healthUrl = $env:PREVIEW_ROOT + 'healthz'
            $healthResponse = Invoke-WebRequest -Uri $healthUrl -Method Get -UseBasicParsing -TimeoutSec 45
            Write-Output ('HEALTH_HTTP_STATUS=' + [string][int]$healthResponse.StatusCode)
            $health = $healthResponse.Content | ConvertFrom-Json
            Write-Output ('HEALTH_STATUS=' + ([string]$health.status -replace '[\r\n=]+', ' ').Trim())
            Write-Output ('HEALTH_RELEASE_SHA=' + ([string]$health.release_sha -replace '[\r\n=]+', ' ').Trim())
            Write-Output ('HEALTH_DATABASE=' + ([string]$health.database -replace '[\r\n=]+', ' ').Trim())
            Write-Output ('HEALTH_SYNTHETIC_PREVIEW=' + ([string]$health.synthetic_preview -replace '[\r\n=]+', ' ').Trim())
            foreach ($headerName in @('Cache-Control','Strict-Transport-Security','X-Content-Type-Options','Content-Security-Policy','Referrer-Policy','Permissions-Policy','X-Frame-Options')) {
              $value = ([string]$healthResponse.Headers[$headerName] -replace '[\r\n=]+', ' ').Trim()
              Write-Output ('HEALTH_HEADER_' + ($headerName -replace '-', '_').ToUpperInvariant() + '=' + $value)
            }
          }
          catch {
            $code = $null
            if ($null -ne $_.Exception.Response) {
              try { $code = [int]$_.Exception.Response.StatusCode } catch { $code = $null }
            }
            if ($null -ne $code) { Write-Output ('HEALTH_HTTP_STATUS=' + [string]$code) }
            Write-Output ('HEALTH_ERROR=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }
