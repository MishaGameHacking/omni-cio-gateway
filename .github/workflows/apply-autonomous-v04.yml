name: Apply autonomous Analyst AI v0.4

on:
  push:
    branches:
      - feat/autonomous-analysis-v04
    paths:
      - ".github/scripts/apply_autonomous_v04.py"
      - ".github/workflows/apply-autonomous-v04.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build:
    name: Apply, test and build v0.4
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/autonomous-analysis-v04
          fetch-depth: 0
          clean: true

      - name: Apply source integration
        shell: cmd
        run: |
          py -3 .github\scripts\apply_autonomous_v04.py
          if errorlevel 1 exit /b 1
          git diff --check
          if errorlevel 1 exit /b 1

      - name: Create isolated Python environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\analyst-ai-v04-ci"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --no-cache-dir -r backend\requirements.txt
          if errorlevel 1 exit /b 1
          echo ANALYST_V04_VENV=%VENV%>>"%GITHUB_ENV%"

      - name: Compile and test backend
        shell: cmd
        run: |
          set "TELEGRAM_CLIENT_ID=123456"
          set "TELEGRAM_CLIENT_SECRET=test-only"
          set "BACKEND_PUBLIC_URL=https://example.invalid"
          set "DATABASE_PATH=%RUNNER_TEMP%\analyst-ai-v04.sqlite3"
          set "FERNET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          set "ANALYSIS_SCHEDULER_ENABLED=false"
          "%ANALYST_V04_VENV%\Scripts\python.exe" -m compileall -q backend
          if errorlevel 1 exit /b 1
          "%ANALYST_V04_VENV%\Scripts\python.exe" -m unittest discover -s backend\tests -p "test_*.py" -v
          if errorlevel 1 exit /b 1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Choose Android SDK root
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
          echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"

      - name: Ensure Android SDK 36 is installed
        shell: cmd
        run: |
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" goto tools_ready

          set "TOOLS_ZIP=%RUNNER_TEMP%\commandlinetools-win-15859902_latest.zip"
          curl.exe -fL --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%TOOLS_ZIP%"
          if errorlevel 1 exit /b 1
          certutil -hashfile "%TOOLS_ZIP%" SHA256 > "%TOOLS_ZIP%.sha256"
          if errorlevel 1 exit /b 1
          findstr /I /C:"90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" "%TOOLS_ZIP%.sha256" >nul
          if errorlevel 1 (
            echo ::error::Android command-line tools checksum mismatch.
            exit /b 1
          )
          if not exist "%ANDROID_SDK_ROOT%\cmdline-tools" mkdir "%ANDROID_SDK_ROOT%\cmdline-tools"
          tar.exe -xf "%TOOLS_ZIP%" -C "%ANDROID_SDK_ROOT%\cmdline-tools"
          if errorlevel 1 exit /b 1
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest" rmdir /s /q "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          move "%ANDROID_SDK_ROOT%\cmdline-tools\cmdline-tools" "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          if errorlevel 1 exit /b 1

          :tools_ready
          set "SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          set "YES_FILE=%RUNNER_TEMP%\android-sdk-yes.txt"
          (for /l %%A in (1,1,50) do @echo y) > "%YES_FILE%"
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" --licenses < "%YES_FILE%"
          if errorlevel 1 exit /b 1
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" "platforms;android-36" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Lint and build Android variants
        shell: cmd
        run: |
          call gradlew.bat :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
          if errorlevel 1 exit /b 1

      - name: Commit generated integration
        shell: cmd
        run: |
          git config user.name "Analyst AI automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend app README.md
          git diff --cached --quiet
          if not errorlevel 1 (
            echo No generated source changes to commit
            exit /b 0
          )
          git commit -m "feat: autonomous Analyst AI monitoring and insight feed"
          if errorlevel 1 exit /b 1
          git push origin HEAD:feat/autonomous-analysis-v04
          if errorlevel 1 exit /b 1
