name: Настроить первый вход Analyst AI
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner-entry55.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-ai-private-operation55
  cancel-in-progress: false
env:
  EXPECTED_AI_ADMIN_TOOLS_SHA: 6eb5bb66b06b442d350aad0d4a6f5e1f99f67b1f
  EXPECTED_AI_ADMIN_TOOLS_RUN: '40949411204'
  OWNER_AI_ADMIN_HOST: reviewed-ubuntu24-administration-only
  OWNER_BOOTSTRAP_EXPECTED_SOURCES: '{"owner_password.py":"ac83180f34c02000b69a555452e7be0201704e84475033f78dcc4fb433e50c32","owner_password_routes.py":"8713726948c95bd9ff6cd593e806a5b46d4dde68e9a8fb4ff2793fa43356dffb","owner_access.py":"5bd31e342cea7dbbf1814874a8702140d5669534cd2948c33982b319beee78d3"}'
jobs:
  prepare-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require tested tools and the deployed owner authentication source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            for(const [id,sha,path] of [
              [e.EXPECTED_AI_ADMIN_TOOLS_RUN,e.EXPECTED_AI_ADMIN_TOOLS_SHA,'.github/workflows/owner-ai-admin-tools55.yml'],
              ['40919271605','b8ecdce47e1ecaff06190e46b1fc912687132b6b','.github/workflows/workspace-deploy.yml']]) {
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
              if(r.head_sha!==sha||r.conclusion!=='success'||r.status!=='completed'||r.path!==path||r.run_attempt!==1)
                throw new Error('Exact successful source evidence required');
            }
            const sources=JSON.parse(e.OWNER_BOOTSTRAP_EXPECTED_SOURCES);
            for(const [name,digest] of Object.entries(sources)) {
              const {data:f}=await github.rest.repos.getContent({...context.repo,path:'backend/'+name,ref:'b69169abb4e750985ba79bf4c08f8f0f1a2ef596'});
              if(require('node:crypto').createHash('sha256').update(Buffer.from(f.content,'base64')).digest('hex')!==digest)
                throw new Error('Owner authentication source changed');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_AI_ADMIN_TOOLS_SHA }}
          path: owner-entry55
          persist-credentials: false
          sparse-checkout: |
            tools/owner_ai_admin_transport.py
            tools/admin_owner55_ai.py
            tools/adopt_supplied_owner55_ai.py
            tools/provision_owner55_bootstrap.py
            tools/owner55_ai_guest.py
            tools/inspect_owner55_ai.py
            tools/provision_owner55_ai.py
            tools/activate_owner55_ai.py
            tools/owner_ai_private_transport.py
            tools/owner_plan_transport_20261027.py
            deploy/stage_owner55_ai.py
            deploy/activate_owner55_ai.py
            deploy/provision_owner55_bootstrap.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: owner-entry55/.transport-admin
          persist-credentials: false
          sparse-checkout: |
            deploy/prepare_owner_vm.py
            deploy/access_owner_vm.py
            tools/timeweb_ci_capacity.py
            tools/timeweb_actions_probe.py
            tools/timeweb_ci_catalog.py
          sparse-checkout-cone-mode: false
      - name: Подготовить ключ первого входа и проверить сервер
        working-directory: owner-entry55
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          ANALYST_OWNER_BOOTSTRAP_SECRET: ${{ secrets.ANALYST_OWNER_BOOTSTRAP_SECRET }}
        run: python3 tools/provision_owner55_bootstrap.py
