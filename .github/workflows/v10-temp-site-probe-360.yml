name: TEMP V10 Site Probe 360

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-site-probe-360.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe-exact-main-site:
    name: Probe exact-main deploy and public HTTPS
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: "96154892e39f72f3d647aea089d44a3d000a112c"
      PREVIEW_ROOT: "https://omni-cio-v10-web.onrender.com/"

    steps:
      - name: Discover deploy and probe public site
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([ScriptBlock]::Create((Get-Content -Raw '{0}')))"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = ('Bearer ' + $env:GH_TOKEN)
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUri = 'https://api.github.com/repos/' + $repo + '/actions/workflows/v10-phase4-free-preview-deploy.yml/runs?per_page=30'
          $runs = (Invoke-RestMethod -Uri $runsUri -Headers $headers -Method Get).workflow_runs
          $matches = @($runs | Where-Object { $_.head_sha -eq $env:EXPECTED_MAIN_SHA -and $_.head_branch -eq 'main' } | Sort-Object run_number -Descending)
          if ($matches.Count -lt 1) { throw ('DEPLOY_RUN_NOT_FOUND exact_main=' + $env:EXPECTED_MAIN_SHA) }
          $run = $matches[0]
          Write-Output ('DEPLOY_RUN id=' + $run.id + ' number=' + $run.run_number + ' status=' + $run.status + ' conclusion=' + $run.conclusion + ' head_sha=' + $run.head_sha)
          $jobs = (Invoke-RestMethod -Uri $run.jobs_url -Headers $headers -Method Get).jobs
          foreach ($job in $jobs) {
            $safeName = ([string]$job.name -replace '[\r\n=|]+', ' ').Trim()
            Write-Output ('DEPLOY_JOB name=' + $safeName + ' id=' + $job.id + ' status=' + $job.status + ' conclusion=' + $job.conclusion)
          }
          if ($run.status -ne 'completed') { throw ('DEPLOY_RUN_NOT_COMPLETED id=' + $run.id + ' status=' + $run.status) }

          try {
            $root = Invoke-WebRequest -Uri $env:PREVIEW_ROOT -Method Get -UseBasicParsing -TimeoutSec 45
            $title = ''
            $match = [regex]::Match([string]$root.Content, '<title>([^<]*)</title>', 'IgnoreCase')
            if ($match.Success) { $title = ($match.Groups[1].Value -replace '[\r\n=]+', ' ').Trim() }
            Write-Output ('PUBLIC_ROOT status=' + [int]$root.StatusCode + ' title=' + $title)
          }
          catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) { try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { $statusCode = $null } }
            Write-Output ('PUBLIC_ROOT status=' + [string]$statusCode + ' error=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          try {
            $health = Invoke-WebRequest -Uri ($env:PREVIEW_ROOT + 'healthz') -Method Get -UseBasicParsing -TimeoutSec 45
            $payload = $health.Content | ConvertFrom-Json
            Write-Output ('PUBLIC_HEALTH status=' + [int]$health.StatusCode + ' app_status=' + [string]$payload.status + ' release_sha=' + [string]$payload.release_sha + ' database=' + [string]$payload.database + ' synthetic_preview=' + [string]$payload.synthetic_preview)
          }
          catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) { try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { $statusCode = $null } }
            Write-Output ('PUBLIC_HEALTH status=' + [string]$statusCode + ' error=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          if ($run.conclusion -ne 'success') { exit 2 }
