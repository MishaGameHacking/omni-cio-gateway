name: TEMP V10 Site Probe 360

on:
  push:
    branches:
      - v10/temp-site-probe-360
    paths:
      - ".github/workflows/v10-temp-site-probe-360.yml"

permissions:
  contents: write
  actions: read

jobs:
  probe-exact-main-site:
    name: Probe exact-main deploy and public HTTPS
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: "96154892e39f72f3d647aea089d44a3d000a112c"
      PREVIEW_ROOT: "https://omni-cio-v10-web.onrender.com/"
      RESULT_REPO_PATH: "tmp/v10-site-probe-360.txt"
      RESULT_BRANCH: "v10/temp-site-probe-360"

    steps:
      - name: Discover deploy and publish sanitized evidence
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('PROBE_TIMESTAMP_UTC=' + [DateTime]::UtcNow.ToString('o'))
          $lines.Add('EXPECTED_MAIN_SHA=' + $env:EXPECTED_MAIN_SHA)
          $lines.Add('PUBLIC_URL=' + $env:PREVIEW_ROOT)
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = ('Bearer ' + $env:GH_TOKEN)
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          try {
            $runsUri = 'https://api.github.com/repos/' + $repo + '/actions/workflows/v10-phase4-free-preview-deploy.yml/runs?per_page=30'
            $runs = (Invoke-RestMethod -Uri $runsUri -Headers $headers -Method Get).workflow_runs
            $matches = @($runs | Where-Object { $_.head_sha -eq $env:EXPECTED_MAIN_SHA -and $_.head_branch -eq 'main' } | Sort-Object run_number -Descending)
            if ($matches.Count -lt 1) {
              $lines.Add('DEPLOY_RUN_FOUND=false')
            }
            else {
              $run = $matches[0]
              $lines.Add('DEPLOY_RUN_FOUND=true')
              $lines.Add('DEPLOY_RUN_ID=' + [string]$run.id)
              $lines.Add('DEPLOY_RUN_NUMBER=' + [string]$run.run_number)
              $lines.Add('DEPLOY_EVENT=' + [string]$run.event)
              $lines.Add('DEPLOY_STATUS=' + [string]$run.status)
              $lines.Add('DEPLOY_CONCLUSION=' + [string]$run.conclusion)
              $lines.Add('DEPLOY_HEAD_SHA=' + [string]$run.head_sha)
              $lines.Add('DEPLOY_CREATED_AT=' + [string]$run.created_at)
              $lines.Add('DEPLOY_UPDATED_AT=' + [string]$run.updated_at)
              $jobs = (Invoke-RestMethod -Uri $run.jobs_url -Headers $headers -Method Get).jobs
              foreach ($job in $jobs) {
                $safeName = ([string]$job.name -replace '[\r\n=|]+', ' ').Trim()
                $lines.Add('DEPLOY_JOB=' + $safeName + '|status=' + [string]$job.status + '|conclusion=' + [string]$job.conclusion + '|id=' + [string]$job.id)
              }
            }
          }
          catch {
            $lines.Add('DEPLOY_METADATA_ERROR=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          try {
            $root = Invoke-WebRequest -Uri $env:PREVIEW_ROOT -Method Get -UseBasicParsing -TimeoutSec 45
            $lines.Add('ROOT_HTTP_STATUS=' + [string][int]$root.StatusCode)
            $title = ''
            $match = [regex]::Match([string]$root.Content, '<title>([^<]*)</title>', 'IgnoreCase')
            if ($match.Success) { $title = ($match.Groups[1].Value -replace '[\r\n=]+', ' ').Trim() }
            $lines.Add('ROOT_TITLE=' + $title)
          }
          catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) { try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { $statusCode = $null } }
            if ($null -ne $statusCode) { $lines.Add('ROOT_HTTP_STATUS=' + [string]$statusCode) }
            $lines.Add('ROOT_ERROR=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          try {
            $health = Invoke-WebRequest -Uri ($env:PREVIEW_ROOT + 'healthz') -Method Get -UseBasicParsing -TimeoutSec 45
            $lines.Add('HEALTH_HTTP_STATUS=' + [string][int]$health.StatusCode)
            $payload = $health.Content | ConvertFrom-Json
            $lines.Add('HEALTH_STATUS=' + ([string]$payload.status -replace '[\r\n=]+', ' ').Trim())
            $lines.Add('HEALTH_RELEASE_SHA=' + ([string]$payload.release_sha -replace '[\r\n=]+', ' ').Trim())
            $lines.Add('HEALTH_DATABASE=' + ([string]$payload.database -replace '[\r\n=]+', ' ').Trim())
            $lines.Add('HEALTH_SYNTHETIC_PREVIEW=' + ([string]$payload.synthetic_preview -replace '[\r\n=]+', ' ').Trim())
          }
          catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) { try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { $statusCode = $null } }
            if ($null -ne $statusCode) { $lines.Add('HEALTH_HTTP_STATUS=' + [string]$statusCode) }
            $lines.Add('HEALTH_ERROR=' + (($_.Exception.Message -replace '[\r\n=]+', ' ').Trim()))
          }

          $text = ($lines -join "`n") + "`n"
          $uri = 'https://api.github.com/repos/' + $repo + '/contents/' + $env:RESULT_REPO_PATH
          $encodedBranch = [uri]::EscapeDataString($env:RESULT_BRANCH)
          $existingSha = $null
          try {
            $existing = Invoke-RestMethod -Uri ($uri + '?ref=' + $encodedBranch) -Headers $headers -Method Get
            $existingSha = [string]$existing.sha
          }
          catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) { try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { $statusCode = $null } }
            if ($statusCode -ne 404) { throw }
          }
          $body = @{
            message = 'Publish sanitized exact-main site probe evidence'
            content = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($text))
            branch = $env:RESULT_BRANCH
          }
          if ($existingSha) { $body.sha = $existingSha }
          Invoke-RestMethod -Uri $uri -Headers $headers -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 4) | Out-Null
          $lines | ForEach-Object { Write-Output $_ }
          Write-Output ('SANITIZED_RESULT_PUBLISHED path=' + $env:RESULT_REPO_PATH)
