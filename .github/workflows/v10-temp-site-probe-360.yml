name: TEMP V10 Site Probe 360

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-site-probe-360.yml"

permissions:
  contents: read

jobs:
  reproduce-bootstrap-import:
    name: Reproduce exact-main direct-script bootstrap imports
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: "96154892e39f72f3d647aea089d44a3d000a112c"

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact accepted main without external Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Bootstrap isolated Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create exact deployment diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-phase4-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"
          "$VENV_PATH/Scripts/python.exe" -m pip --version

      - name: Install exact Phase 4 dependency projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt

      - name: Prove cwd import works
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from psycopg import sql
          from omni_cio.persistence.hosted_postgres_runtime_v1 import (
              load_hosted_postgres_runtime_contract,
              validate_hosted_postgres_runtime_sql,
          )
          from omni_cio.persistence.migration import apply_migrations
          del sql, load_hosted_postgres_runtime_contract, validate_hosted_postgres_runtime_sql, apply_migrations
          print("IMPORT_PROBE_CWD=PASS", flush=True)
          PY

      - name: Reproduce direct scripts path import closure
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/_phase4_import_probe.py <<'PY'
          import sys

          print(f"DIRECT_SCRIPT_SYS_PATH_0={sys.path[0]}", flush=True)
          from psycopg import sql
          print("IMPORT_PROBE=PASS module=psycopg.sql", flush=True)
          from omni_cio.persistence.hosted_postgres_runtime_v1 import (
              load_hosted_postgres_runtime_contract,
              validate_hosted_postgres_runtime_sql,
          )
          print("IMPORT_PROBE=PASS module=omni_cio.persistence.hosted_postgres_runtime_v1", flush=True)
          from omni_cio.persistence.migration import apply_migrations
          print("IMPORT_PROBE=PASS module=omni_cio.persistence.migration", flush=True)
          del sql, load_hosted_postgres_runtime_contract, validate_hosted_postgres_runtime_sql, apply_migrations
          PY
          python scripts/_phase4_import_probe.py

      - name: Clean diagnostic workspace
        if: always()
        shell: bash
        run: |
          rm -rf "${VENV_PATH:-}"
          git config --local --unset-all credential.helper 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true
