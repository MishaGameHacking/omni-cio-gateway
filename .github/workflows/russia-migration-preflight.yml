name: Russia migration preflight (read only)
on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/russia-migration-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Read preset metadata and source state; no cloud changes
        shell: py -3 {0}
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from provision_russian_stage import call, inventory, TARGET_NAME, SOURCE_ID
          source = call('GET', '/servers/' + str(SOURCE_ID)).get('server', {})
          rows = inventory()
          presets = call('GET', '/presets/servers')['server_presets']
          keys = ('id', 'location', 'availability_zone', 'price', 'cpu', 'cpu_frequency', 'ram', 'disk', 'disk_type', 'bandwidth', 'description', 'description_short', 'tags', 'is_available', 'is_preorder')
          selected = [{key: p[key] for key in keys if key in p} for p in presets if p.get('id') in (2451, 2577, 4241, 4799, 3795)]
          print('RUSSIA_RECONCILIATION=' + json.dumps({'source': {key: source.get(key) for key in ('id', 'name', 'location', 'availability_zone', 'status')}, 'staging_count': sum(p.get('name') == TARGET_NAME for p in rows), 'presets': selected}, ensure_ascii=True))
