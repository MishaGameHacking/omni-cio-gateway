name: APK installation audit

on:
  push:
    branches: [fix/apk-install-042]
    paths: [".github/workflows/apk-install-audit.yml", ".github/scripts/test_apk_installation.py"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: analyst-apk-install-emulator
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact published APKs for comparison
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const dir = path.join(process.env.RUNNER_TEMP, `apk-install-audit-${context.runId}`);
            fs.mkdirSync(dir, { recursive: true });
            core.exportVariable('APK_AUDIT_DIR', dir);
            for (const [label, sha] of [['previous','d88c04b8777962cb4f60a4f5f02be7769137cf11'],['reported','0cbb7ee3668c4093007831d310780fa47afe9dda']]) {
              const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag:`android-debug-${sha}`})).data;
              const asset = release.assets.find(a => a.name.endsWith('.apk'));
              if (!asset) throw new Error('APK missing for ' + label);
              const response = await github.rest.repos.getReleaseAsset({...context.repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
              const bytes = Buffer.from(response.data);
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.length !== asset.size || (asset.digest && asset.digest !== 'sha256:' + digest)) throw new Error('Downloaded APK integrity mismatch');
              fs.writeFileSync(path.join(dir, label + '.apk'), bytes);
              core.info(`${label}: bytes=${bytes.length} sha256=${digest}`);
            }
      - name: Prepare isolated Android emulator dependencies
        shell: py -3 {0}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8', errors='backslashreplace')
          roots=[os.getenv('ANDROID_SDK_ROOT'),os.getenv('ANDROID_HOME'),str(Path(os.environ['LOCALAPPDATA'])/'Android'/'Sdk'),str(Path(os.environ['RUNNER_TOOL_CACHE'])/'AndroidSdk'/'sdk')]
          sdk=next((Path(p) for p in roots if p and (Path(p)/'build-tools'/'36.0.0'/'aapt.exe').exists()),None)
          if sdk is None: raise SystemExit('Android build tools 36.0.0 unavailable')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('ANDROID_SDK_ROOT='+str(sdk)+'\n')
              env.write('ANDROID_HOME='+str(sdk)+'\n')
          manager=sdk/'cmdline-tools'/'latest'/'bin'/'sdkmanager.bat'
          result=subprocess.run([str(manager),'--sdk_root='+str(sdk),'--channel=0','emulator','platform-tools','system-images;android-33;google_apis;x86_64'], input='y\n'*200,capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=600)
          print(result.stdout[-4000:])
          print(result.stderr[-4000:])
          if result.returncode: raise SystemExit(result.returncode)
      - name: Clean install, upgrade and launch without test-only bypass
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          py -3 .github\scripts\test_apk_installation.py --sdk "%ANDROID_SDK_ROOT%" --apk "%APK_AUDIT_DIR%\reported.apk" --previous "%APK_AUDIT_DIR%\previous.apk" --work-dir "%APK_AUDIT_DIR%\emulator-test" --api 33
          if errorlevel 1 exit /b 1
