name: TEMP V10 Post-Merge Regression Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-postmerge-regression-verification.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify-postmerge-regression:
    name: Verify exact-main post-merge Regression Shield
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Verify Regression Shield for exact accepted main
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 5f535c0ced9514866bd3680042f3ba0bb012f866
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
          "$ErrorActionPreference='Stop';
          $headers=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};
          $runsUri='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/actions/workflows/regression-shield.yml/runs?branch=main&event=push&per_page=20';
          $runs=Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers;
          $run=@($runs.workflow_runs | Where-Object {$_.head_sha -eq $env:EXPECTED_MAIN_SHA -and $_.event -eq 'push' -and $_.head_branch -eq 'main'} | Sort-Object run_number -Descending | Select-Object -First 1);
          if($run.Count -ne 1){throw 'POSTMERGE_REGRESSION_RUN_NOT_FOUND'};
          $r=$run[0];
          if($r.status -ne 'completed'){throw ('POSTMERGE_REGRESSION_NOT_COMPLETED: run='+$r.id+' status='+$r.status)};
          if($r.conclusion -ne 'success'){throw ('POSTMERGE_REGRESSION_NOT_GREEN: run='+$r.id+' conclusion='+$r.conclusion)};
          $jobs=Invoke-RestMethod -Method Get -Uri $r.jobs_url -Headers $headers;
          $required=@('Quality, contracts and coverage','Dependency, code and secret security');
          foreach($name in $required){$job=@($jobs.jobs | Where-Object {$_.name -eq $name});if($job.Count -ne 1){throw ('POSTMERGE_REQUIRED_JOB_NOT_FOUND: '+$name)};if($job[0].status -ne 'completed' -or $job[0].conclusion -ne 'success'){throw ('POSTMERGE_REQUIRED_JOB_NOT_GREEN: '+$name+' status='+$job[0].status+' conclusion='+$job[0].conclusion)}};
          Write-Host ('REGRESSION_SHIELD_EVIDENCE run_id='+$r.id+' run_number='+$r.run_number+' head_sha='+$r.head_sha+' conclusion='+$r.conclusion);
          foreach($name in $required){$job=@($jobs.jobs | Where-Object {$_.name -eq $name})[0];Write-Host ('REGRESSION_SHIELD_JOB name='+$name+' conclusion='+$job.conclusion)}"
