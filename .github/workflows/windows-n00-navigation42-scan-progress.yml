name: Observe candidate42 original portfolio acceptance
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-navigation42-scan-progress.yml]
permissions:
  contents: read
  checks: write
  actions: read
concurrency:
  group: analyst-n00-navigation42-scan-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 150
    steps:
      - name: Observe queued repair host checks and native portfolio cases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const cp=require('node:child_process');const created=await github.rest.checks.create({...context.repo,name:'N00 candidate42 repaired navigation all-case diagnostic progress',head_sha:context.sha,status:'in_progress',output:{title:'Waiting for focused original portfolio checks',summary:'Run40271927516; base14153157fb21456fe9edc8597d4cf2256fe116a4 with verified navigation repair and exact APK42.'}});let terminal=false;const seen={};\nfor(let poll=0;poll<290;poll++){\n const r=cp.spawnSync('py',['-3','-c',\"import pathlib,sys,os,json\\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nout={'run_id':40271927516,'profiles':{},'controllers':{}}\\nroots=[pathlib.Path('C:/actions-runner'+s+'/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40271927516-1') for s in ('','-2','-3','-4')]\\nroots=[p for p in roots if p.is_dir()]\\nassert len(roots)<=1\\nif roots:\\n root=roots[0];out['source_root']=str(root);base=root/'app/build/outputs/apk/preview'\\n for page in (16384,):\\n  work=base/('install-api37-'+str(page));profile={}\\n  log=work/'runtime-console.log'\\n  if log.is_file():\\n   with log.open('rb') as f:\\n    f.seek(max(0,log.stat().st_size-4*1024**2));lines=f.read().decode('utf-8',errors='replace').splitlines()\\n   profile['console_bytes']=log.stat().st_size\\n   profile['stages']=[s[:1000] for s in lines if s.startswith(('PROFILE_UI_STAGE=','PROFILE_UI_STAGE_PASSED=','PROFILE_UI_TESTS='))][-40:]\\n   profile['cases']=[s[:500] for s in lines if s.startswith(('BUSINESS_UI_CASE=','BUSINESS_UI_CASE_PASSED=','PORTFOLIO_UI_CASE=','PORTFOLIO_UI_CASE_PASSED=','AUTOMATION_UI_CASE=','PORTFOLIO_DIAGNOSTIC_CASE_FAILED='))][-32:]\\n   profile['failures']=[s[:1200] for s in lines if s.startswith(('AssertionError:','RuntimeError:','ValueError:','TimeoutError:','subprocess.TimeoutExpired:'))][-5:]\\n  p=work/'install-results.json'\\n  if p.is_file():\\n   rows=json.loads(p.read_text(encoding='utf-8'))\\n   profile['installation']=[{k:v for k,v in row.items() if k in ('test','success','page_size_bytes','android_api','apk_sha256','error_type','ui_suite','ui_stages','business_case_count','portfolio_case_count','automation_case_count')} for row in rows]\\n  out['profiles'][str(page)]=profile\\nfor suffix in ('','-2','-3','-4'):\\n state=pathlib.Path('C:/actions-runner'+suffix+'/_work/_temp/n00-navigation42-scan-40271927516-1')\\n for p in state.glob('runtime-*.json'):out['controllers'][p.stem]=json.loads(p.read_text(encoding='utf-8'))\\n for name in ('source-after-patches.json','host-check.json','driver-build.json'):\\n  p=state/name\\n  if p.is_file():out[name]=json.loads(p.read_text(encoding='utf-8'))\\n for name in ('host-red.log','host-tests.log','driver-gradle.log'):\\n  p=state/name\\n  if p.is_file():out[name]={'bytes':p.stat().st_size,'tail':p.read_text(encoding='utf-8',errors='replace')[-1200:]}\\nprint(json.dumps(out,ensure_ascii=True))\\n\"],{encoding:'utf8',timeout:45000,maxBuffer:120000,env:{...process.env,PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8'}});\n let report;try{if(r.status!==0)throw Error('Read failed');report=JSON.parse(r.stdout);}catch(e){report={error:String(e),stderr:r.stderr?.slice(-1500)};}\n Object.assign(seen,report.controllers||{});report.controllers=seen;\n const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40271927516});report.workflow_status=run.data.status;report.workflow_conclusion=run.data.conclusion;\n terminal=run.data.status==='completed'||Boolean(seen['runtime-16384']);\n const passed=seen['runtime-16384']?.exit_code===0&&seen['runtime-4096']?.exit_code===0&&!seen['runtime-16384']?.error&&!seen['runtime-4096']?.error;\n const fence=String.fromCharCode(96).repeat(3);const summary=fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence;if(summary.length>63000)throw Error('Report exceeded bound');\n await github.rest.checks.update({...context.repo,check_run_id:created.data.id,status:terminal?'completed':'in_progress',...(terminal?{conclusion:'neutral'}:{}),output:{title:'Actual candidate42 original portfolio observations',summary}});\n if(terminal)break;await new Promise(resolve=>setTimeout(resolve,30000));\n}\nif(!terminal)await github.rest.checks.update({...context.repo,check_run_id:created.data.id,status:'completed',conclusion:'neutral',output:{title:'Observation window ended',summary:'Inspect full runtime run40271927516.'}});"
