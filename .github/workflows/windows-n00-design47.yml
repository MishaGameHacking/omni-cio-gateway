          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.json

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.log

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.xml

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/ui-screens-api37-16384/**/*.png

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-4096/*.json

          ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/preview/install-api37-4096/*.log'
        retention-days: 3
        if-no-files-found: error
    - name: Require the same empty private return draft
      id: evidence_prepare
      if: always() && steps.export.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight
          return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always() && steps.evidence_prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
  collect:
    name: Return exact Windows native evidence to Timeweb storage
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
