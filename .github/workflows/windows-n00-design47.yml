  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Focused design47 diagnostics do not claim full15 runtime acceptance
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required runtime or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Focused design47\
        \ evidence collected; complete matrix acceptance remains separate.\"\n"
