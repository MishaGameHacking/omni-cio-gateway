      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" prepare

        if errorlevel 1 exit /b 1'
      id: prepare
    - name: Actual icon dock, outside/Back dismissal and automatic appearance on API37 16KB
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" 16384

        if errorlevel 1 exit /b 1'
      id: runtime16
    - name: The same real dock observations on API37 4KB
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" 4096

        if errorlevel 1 exit /b 1'
      id: runtime4
      if: always() && steps.prepare.outcome == 'success'
    - name: Report bounded native47 observations separately from full15 acceptance
      if: always() && steps.prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const identity={\"source_sha256\":\"92a9b9867c184388b81db58437761578bc0f1098b902a8827acc87591136545a\",\"\
          source_backup_commit\":\"dd23de9c125b35e7c94974d7ef3f23198a21b0dd\",\"build_run_id\":40386457173,\"build_run_attempt\"\
          :1,\"build_report_sha256\":\"24cec335d6c3035adaee5a0b27cd4f6493bc65067f958b87420de818d211002f\",\"native_hook_sha256\"\
          :\"f6910e05cb1ac3e93d199d84055854db2467e4049c80b719639452899290dc26\",\"debug_apk_sha256\":\"906026b3b26f33ceb8bf2a89f190190d3d372abadfc693074f7078a969f4760c\"\
          ,\"destinations\":[\"strategy\",\"markets\",\"notifications\",\"assistant\",\"appearance\",\"library\"]};\nconst\
          \ fs=require('node:fs'),p=require('node:path'),crypto=require('node:crypto');\nconst base=p.join(process.env.SOURCE_ROOT,'app/build/outputs/apk/preview');\n\
          const pages={};\nlet complete=true;\nfor (const [page,folder] of [[16384,'ui-screens-api37-16384'],[4096,'ui-screens']])\
          \ {\n  const file=p.join(base,folder,'design47-focused-observations.json');\n  if (!fs.existsSync(file)) { complete=false;\
          \ pages[page]={missing:true}; continue; }\n  const bytes=fs.readFileSync(file), value=JSON.parse(bytes.toString('utf8'));\n\
          \  const valid=value.schema_version===1 && value.diagnostic_only===true && value.release_gate_pass===false\n   \
          \ && value.full15_executed===false && value.status==='passed' && value.fixture_apk_sha256===identity.debug_apk_sha256\n\
          \    && value.actual_device_observations===true && value.cases.length===2\n    && JSON.stringify(value.cases.map(c=>c.font_scale).sort())==='[1,2]'\n\
          \    && value.appearance_restart_cases.length===2\n    && JSON.stringify(value.appearance_restart_cases.map(c=>c.font_scale).sort())==='[1,2]'\n\
          \    && value.appearance_restart_cases.every(c=>c.force_stop_and_relaunch===true\n      && c.previous_process_id!==c.restarted_process_id\
          \ && c.save_button_pressed===false\n      && c.server_mutations===0 && c.after_restart.writes===0 && c.after_restore.writes===0\n\
          \      && c.after_restart.preferences===c.persisted\n      && c.before.preferences===c.after_restore.preferences\
          \ && c.captures.length===2)\n    && value.autosave_cases.length===2\n    && JSON.stringify(value.autosave_cases.map(c=>c.font_scale).sort())==='[1,2]'\n\
          \    && value.autosave_cases.every(c=>c.invalid_draft_retained===true && c.invalid_server_writes===0\n      && c.invalid.writes===0\
          \ && c.invalid_after_navigation.writes===0\n      && c.server_mutations===2 && c.saved.writes===2 && c.after.writes===2\n\
          \      && c.valid_horizon_months===48 && c.confirmed_version===4\n      && c.save_or_confirm_button_pressed===false\
          \ && c.navigation_preserved_saved_value===true\n      && c.process_id===c.process_id_after && c.minimum_touch_dp===48)\n\
          \    && value.cases.every(c=>c.icons.length===21 && new Set(c.icons.map(i=>i.id)).size===21\n      && JSON.stringify(c.destinations.map(d=>d.page))===JSON.stringify(identity.destinations)\n\
          \      && c.automatic_appearance.length===2 && c.server_mutations===0 && c.minimum_touch_dp===48\n      && c.predictive_back.underlying_page_unchanged===true\
          \ && c.outside.underlying_page_unchanged===true\n      && c.before.preferences===c.after.preferences && c.process_id===c.process_id_after);\n\
          \  if(!valid) complete=false;\n  pages[page]={complete:valid,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),observations:value};\n\
          }\nconst report={schema:1,...identity,design47_complete:complete,pages,diagnostic_only:true,\n  release_gate_pass:false,full15_executed:false,physical_phone_verified:false};\n\
          const state=p.join(process.env.RUNNER_TEMP,'n00-native47-focused-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);\n\
          fs.writeFileSync(p.join(state,'native47-design-summary.json'),JSON.stringify(report,null,2)+'\\n');\ncore.setOutput('design47_complete',String(complete));\n\
          core.info('N00_DESIGN47_COMPLETE='+String(complete));\ncore.info('N00_FULL15_ACCEPTED=false');\nawait github.rest.checks.create({...context.repo,name:'N00\
          \ candidate47 dock observations (diagnostic only)',\n  head_sha:context.sha,status:'completed',conclusion:'neutral',output:{\n\
          \    title:complete?'Focused dock observations completed; full matrix remains pending':'Focused dock observations\
          \ incomplete',\n    summary:JSON.stringify({design47_complete:complete,source_sha256:identity.source_sha256,\n \
          \     native_hook_sha256:identity.native_hook_sha256,full15_executed:false})}});\n"
      id: focused_report
    - name: Preserve genuine UI and install evidence after either outcome
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" export

        if errorlevel 1 exit /b 1'
