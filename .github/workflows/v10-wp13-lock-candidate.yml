name: V10 WP13 Lock Candidate

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: read

concurrency:
  group: v10-wp13-lock-candidate
  cancel-in-progress: true

jobs:
  generate:
    name: Generate psycopg lock candidates
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated lock environment
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp13-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"

      - name: Install current hash-locked build toolchain
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt

      - name: Generate runtime and development lock candidates
        run: |
          CANDIDATE_ROOT="$(cygpath -u "$RUNNER_TEMP")/wp13-lock-candidate-${GITHUB_RUN_ID}"
          rm -rf "$CANDIDATE_ROOT"
          mkdir -p "$CANDIDATE_ROOT"
          cp requirements.in "$CANDIDATE_ROOT/requirements.in"
          cp requirements-dev.in "$CANDIDATE_ROOT/requirements-dev.in"
          printf '\n# WP13 PostgreSQL driver\npsycopg[binary]==3.3.4\n' >> "$CANDIDATE_ROOT/requirements.in"
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --constraint=requirements.txt \
            --output-file=wp13-requirements.txt \
            "$CANDIDATE_ROOT/requirements.in"
          (cd "$CANDIDATE_ROOT" && python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --constraint="$GITHUB_WORKSPACE/requirements-dev.txt" \
            --output-file="$GITHUB_WORKSPACE/wp13-requirements-dev.txt" \
            requirements-dev.in)
          python scripts/windows_ci_lock.py verify requirements.txt wp13-requirements.txt || true
          python scripts/windows_ci_lock.py verify requirements-dev.txt wp13-requirements-dev.txt || true

      - name: Upload non-secret lock candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp13-lock-candidates
          path: |
            wp13-requirements.txt
            wp13-requirements-dev.txt
          if-no-files-found: error
          retention-days: 1

      - name: Clean workspace
        if: always()
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx
