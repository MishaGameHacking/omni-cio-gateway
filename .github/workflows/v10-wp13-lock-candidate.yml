name: V10 WP13 Lock Candidate

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: write

concurrency:
  group: v10-wp13-lock-candidate
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and commit psycopg locks
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/wp13-postgresql-persistence
          persist-credentials: true

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Create isolated lock environment
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-wp13-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"

      - name: Install current hash-locked build toolchain
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt

      - name: Generate psycopg blocks and preserve canonical Linux lock
        run: |
          printf '\n# WP13 PostgreSQL driver\npsycopg[binary]==3.3.4\n' >> requirements.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --output-file=wp13-runtime-candidate.txt \
            requirements.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --output-file=wp13-dev-candidate.txt \
            requirements-dev.in
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          import windows_ci_lock as lock

          wanted = ('psycopg', 'psycopg-binary')

          def merge(base_name: str, candidate_name: str) -> None:
              base = Path(base_name)
              prefix, base_blocks = lock._split_lock(base.read_text(encoding='utf-8'))
              _, candidate_blocks = lock._split_lock(
                  Path(candidate_name).read_text(encoding='utf-8')
              )
              candidates = {
                  lock._parse_block(block).name: block for block in candidate_blocks
              }
              missing = set(wanted) - candidates.keys()
              if missing:
                  raise SystemExit(f'missing generated lock blocks: {sorted(missing)}')
              parsed_names = [lock._parse_block(block).name for block in base_blocks]
              if set(wanted) & set(parsed_names):
                  raise SystemExit('psycopg already exists in canonical Linux lock')
              merged = list(base_blocks)
              for name in wanted:
                  insert_at = next(
                      (
                          index
                          for index, block in enumerate(merged)
                          if lock._parse_block(block).name > name
                      ),
                      len(merged),
                  )
                  merged.insert(insert_at, candidates[name])
              base.write_text(
                  ''.join(prefix) + ''.join(''.join(block) for block in merged),
                  encoding='utf-8',
                  newline='\n',
              )

          merge('requirements.txt', 'wp13-runtime-candidate.txt')
          merge('requirements-dev.txt', 'wp13-dev-candidate.txt')
          PY
          grep -n -E '^psycopg(-binary)?==' requirements.txt
          grep -n -E '^psycopg(-binary)?==' requirements-dev.txt
          grep -n -E '^uvloop==' requirements-dev.txt
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes -r windows-requirements-dev.txt
          python -c "import psycopg; print('psycopg lock install OK')"

      - name: Commit only reviewed dependency source and locks
        run: |
          rm -f wp13-runtime-candidate.txt wp13-dev-candidate.txt windows-requirements-dev.txt
          git rm .github/workflows/v10-wp13-lock-candidate.yml
          git add requirements.in requirements.txt requirements-dev.txt
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/v10-wp13-lock-candidate.yml' 'requirements-dev.txt' 'requirements.in' 'requirements.txt' | sort)"
          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "Unexpected staged files:" >&2
            printf '%s\n' "$CHANGED" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V10 WP13: lock PostgreSQL driver"
          git push origin HEAD:v10/wp13-postgresql-persistence

      - name: Clean workspace
        if: always()
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx
