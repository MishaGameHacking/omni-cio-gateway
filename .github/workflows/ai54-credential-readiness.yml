name: Inspect protected AI credential readiness
on:
  push:
    branches: [codex/strategy53-delivery-tools-2026-10-29]
    paths: [.github/workflows/ai54-credential-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Check only configured credential presence without revealing its value
        shell: powershell
        env:
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:TIMEWEB_AI_TOKEN) -and $env:TIMEWEB_AI_TOKEN.StartsWith('sk-')
          Write-Output ("AI54_EXISTING_PROTECTED_CREDENTIAL=" + $ready.ToString().ToLower())
