name: Check bounded candidate 56 live chat verification tools on owner laptop
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/owner56-chat-smoke-tools.yml
      - tools/owner56_chat_smoke.py
      - tools/tests/test_owner56_chat_smoke.py
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: chat-smoke-${{ github.run_id }}
          persist-credentials: false
      - shell: cmd
        working-directory: chat-smoke-${{ github.run_id }}
        run: |
          py -3 -c "import os; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'"
          if errorlevel 1 exit /b 1
          py -3 -m unittest discover -s tools\tests -p test_owner56_chat_smoke.py -v
          if errorlevel 1 exit /b 1
