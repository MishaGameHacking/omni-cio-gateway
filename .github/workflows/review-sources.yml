name: Private source review snapshots

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/review-sources.yml]

permissions:
  contents: read

jobs:
  snapshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Checkout reviewed evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97e1e0ae48a12fae81efa6bb51c2db308de32f77
          path: source-831
          persist-credentials: false
          clean: true
      - name: Checkout reviewed updater source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0eed770ea8f423adceec0597f62564763cbad6de
          path: source-832
          persist-credentials: false
          clean: true
      - name: Checkout reviewed Spectrum source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0fb6904d006b6fec226d213e1f666e2b108445b4
          path: source-833
          persist-credentials: false
          clean: true
      - name: Archive tracked source only
        shell: cmd
        run: |
          if not exist review-snapshots mkdir review-snapshots
          git -C source-831 archive --format=zip --output="%GITHUB_WORKSPACE%\review-snapshots\831-97e1e0ae.zip" HEAD
          if errorlevel 1 exit /b 1
          git -C source-832 archive --format=zip --output="%GITHUB_WORKSPACE%\review-snapshots\832-0eed770e.zip" HEAD
          if errorlevel 1 exit /b 1
          git -C source-833 archive --format=zip --output="%GITHUB_WORKSPACE%\review-snapshots\833-0fb6904d.zip" HEAD
          if errorlevel 1 exit /b 1
          git -C source-831 rev-parse HEAD > review-snapshots\831.txt
          git -C source-832 rev-parse HEAD > review-snapshots\832.txt
          git -C source-833 rev-parse HEAD > review-snapshots\833.txt
      # The private repository's existing access controls apply. No credentials,
      # untracked files, runner directories or production data are archived.
      - name: Retain review snapshots briefly in this private repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-snapshots/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
