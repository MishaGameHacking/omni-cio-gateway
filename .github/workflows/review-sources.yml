name: Private source snapshot verification

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/review-sources.yml]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Read baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e99007a24f015617d904248aac3e5eddf4efa4d1
          path: source-main
          persist-credentials: false
          clean: true
      - name: Read evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97e1e0ae48a12fae81efa6bb51c2db308de32f77
          path: source-831
          persist-credentials: false
          clean: true
      - name: Read updater source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a6a8c6f6d486fe85eda6e5b8d1e9d0e33aa9fd6c
          path: source-832
          persist-credentials: false
          clean: true
      - name: Read Spectrum source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6d61a8bdeeaa3711598d841f93a1458bc7810896
          path: source-833
          persist-credentials: false
          clean: true
      - name: Retain tracked-only snapshots as private Git objects
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const cp = require('child_process');
            const revisions = {
              main: 'e99007a24f015617d904248aac3e5eddf4efa4d1',
              831: '97e1e0ae48a12fae81efa6bb51c2db308de32f77',
              832: 'a6a8c6f6d486fe85eda6e5b8d1e9d0e33aa9fd6c',
              833: '6d61a8bdeeaa3711598d841f93a1458bc7810896',
            };
            const root = fs.realpathSync(process.env.GITHUB_WORKSPACE);
            for (const [name, expected] of Object.entries(revisions)) {
              const directory = path.join(root, `source-${name}`);
              const sha = cp.execFileSync('git', ['-C', directory, 'rev-parse', 'HEAD'], {encoding:'utf8', timeout:10000}).trim();
              if (sha !== expected) throw new Error('Snapshot source revision mismatch');
              // git archive includes tracked files only, never .git credentials,
              // runner/home directories, untracked data, production DB or secrets.
              const bytes = cp.execFileSync('git', ['-C', directory, 'archive', '--format=zip', sha], {timeout:30000, maxBuffer:20*1024*1024});
              if (!bytes.length || bytes.length > 20*1024*1024) throw new Error('Unexpected source archive size');
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              const blob = (await github.rest.git.createBlob({...context.repo, encoding:'base64', content:bytes.toString('base64')})).data;
              core.info('PRIVATE_SOURCE_SNAPSHOT=' + JSON.stringify({name, source:sha, blob:blob.sha, bytes:bytes.length, sha256:digest}));
            }
            // No release, public URL, artifact-quota change, branch update,
            // remote execution of source code or deployment is performed here.
