name: Timeweb backend deploy — paused after Moscow cutover

# The previous deploy script still selects the Kazakhstan source by name.
# Its Moscow replacement has NOT been installed. Do not run that script against
# the retired source or present a skipped deployment as a successful release.
# Android builds, installation checks, Backend CI and Sonar remain unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-paused:
    name: Deployment paused — needs audited Moscow target configuration
    if: ${{ false }}
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 1
    steps:
      - name: No cloud credentials or deployment commands are used
        shell: cmd
        run: |
          echo Deployment is paused. Moscow production is already active from the verified migration.
          exit /b 1
