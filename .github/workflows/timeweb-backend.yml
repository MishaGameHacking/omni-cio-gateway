name: Prepare the new owner Timeweb installation
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/prepare_owner_vm.py, .github/workflows/timeweb-backend.yml]

permissions:
  contents: read

concurrency:
  group: analyst-owner-first-vm
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare one minimal VM and the existing owner installer
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          PYTHONUNBUFFERED: '1'
        run: python3 deploy/prepare_owner_vm.py
