name: Timeweb backend deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/scripts/deploy_timeweb_backend.sh"
      - ".github/workflows/timeweb-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Provision and deploy Analyst AI backend
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 60
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
      TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
      TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
      TIMEWEB_AI_BASE_URL: ${{ vars.TIMEWEB_AI_BASE_URL }}
      AI_MODEL_FAST: ${{ vars.AI_MODEL_FAST }}
      AI_MODEL_STANDARD: ${{ vars.AI_MODEL_STANDARD }}
      AI_MODEL_PREMIUM: ${{ vars.AI_MODEL_PREMIUM }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Deploy backend to Timeweb with retries
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" (
            echo ::error::Git Bash is not installed on this runner.
            exit /b 1
          )

          set ATTEMPT=1
          :deploy_retry
          echo Starting Timeweb deployment attempt %ATTEMPT% of 5...
          "C:\Program Files\Git\bin\bash.exe" ".github/scripts/deploy_timeweb_backend.sh"
          if not errorlevel 1 goto deploy_success
          if %ATTEMPT% GEQ 5 (
            echo ::error::Timeweb deployment failed after 5 attempts.
            exit /b 1
          )
          set /a ATTEMPT+=1
          echo Transient Timeweb or SSH failure. Retrying in 20 seconds...
          timeout /t 20 /nobreak >nul
          goto deploy_retry

          :deploy_success
          echo Timeweb deployment completed successfully on attempt %ATTEMPT%.
