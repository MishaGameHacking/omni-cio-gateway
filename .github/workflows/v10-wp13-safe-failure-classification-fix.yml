name: V10 WP13 Safe Failure Classification Fix

on:
  push:
    branches:
      - v10/wp13-postgresql-persistence

permissions:
  contents: write

concurrency:
  group: v10-wp13-safe-failure-classification-fix
  cancel-in-progress: true

jobs:
  transform:
    name: Classify sanitized PostgreSQL audit failures
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out WP13 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          ref: v10/wp13-postgresql-persistence
          persist-credentials: true

      - name: Bootstrap protected Python 3.12.10
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Apply safe classification transform
        run: python scripts\_wp13_safe_failure_classification_fix.py

      - name: Validate and commit focused diagnostics fix
        run: |
          git rm .github\workflows\v10-wp13-safe-failure-classification-fix.yml scripts\_wp13_safe_failure_classification_fix.py
          git add infrastructure\windows\rehearse_wp13_persistence.ps1
          git diff --cached --check
          python -c "import subprocess; changed=sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()); expected=sorted(['.github/workflows/v10-wp13-safe-failure-classification-fix.yml','scripts/_wp13_safe_failure_classification_fix.py','infrastructure/windows/rehearse_wp13_persistence.ps1']); assert changed == expected, (changed, expected)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V10 WP13: classify sanitized audit failures"
          git push origin HEAD:v10/wp13-postgresql-persistence
