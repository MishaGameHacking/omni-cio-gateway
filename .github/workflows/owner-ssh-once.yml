name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-preserve-build-evidence
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inventory necessary sources and Android build evidence on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l"),(9408159,"analyst-ai-owner-route-20261023","201.34.146.244","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHV5M7lARkfgXm/r87ZaU31LX3KENsB5L+i3z0iJ0/kC")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,json,os,pathlib,shutil,subprocess\nroot=pathlib.Path(\"/root\")\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"disk_free_bytes\":shutil.disk_usage(\"/\").free,\"repos\":[],\"build_evidence\":[],\"kvm_device\":pathlib.Path(\"/dev/kvm\").exists()}\nfor name in (\"analyst-ai-source\",\"analyst-ai-development-79be1821\",\"analyst-ai-android-690811a5\"):\n    path=root/name\n    if not path.exists():continue\n    entry={\"directory\":name}\n    if (path/\".git\").is_dir():\n        entry[\"head\"]=subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=path,text=True).strip()\n        entry[\"changes\"]=subprocess.check_output([\"git\",\"status\",\"--porcelain\"],cwd=path,text=True).splitlines()\n    report[\"repos\"].append(entry)\nfiles=[]\nfor rel in (\"analyst-ai-android-690811a5/app/build/outputs\",\"analyst-ai-android-690811a5/app/build/reports\",\"analyst-ai-android-690811a5/app/build/test-results\",\"analyst-ai-android-690811a5/ci-ui-driver/build/outputs\",\"analyst-ai-android-690811a5/ci-ui-driver/build/reports\"):\n    folder=root/rel\n    if not folder.is_dir():continue\n    count=0;size=0\n    for path in sorted(folder.rglob(\"*\")):\n        if not path.is_file():continue\n        assert not path.is_symlink() and all(not x.is_symlink() for x in path.parents)\n        st=path.stat();assert st.st_uid==0\n        hasher=hashlib.sha256()\n        with path.open(\"rb\") as source:\n            for data in iter(lambda:source.read(1024*1024),b\"\"):hasher.update(data)\n        files.append({\"path\":path.relative_to(root).as_posix(),\"bytes\":st.st_size,\"sha256\":hasher.hexdigest(),\"mode\":st.st_mode&0o777})\n        count+=1;size+=st.st_size\n    report[\"build_evidence\"].append({\"directory\":rel,\"files\":count,\"bytes\":size})\nif files:\n    assert len(files)==len({x[\"path\"] for x in files})\n    manifest={\"source_server_id\":9408159,\"destination_server_id\":9413105,\"files\":files}\n    path=root/\"analyst-build-evidence-transfer-9413105.json\"\n    assert not path.is_symlink()\n    path.write_text(json.dumps(manifest,sort_keys=True,indent=2)+\"\\n\");path.chmod(0o600)\n    report[\"transfer\"]={\"manifest_sha256\":hashlib.sha256(path.read_bytes()).hexdigest(),\"files\":len(files),\"bytes\":sum(x[\"bytes\"] for x in files)}\nfor name in (\"analyst-ai-artifacts\",\"analyst-ai-android-690811a5\",\"analyst-ai-development-79be1821\"):\n    p=root/name\n    if p.exists():report[name+\"_bytes\"]=int(subprocess.check_output([\"du\",\"-sb\",str(p)],text=True).split()[0])\nreport[\"android_sdk_present\"]=pathlib.Path(\"/opt/analyst-android-sdk\").exists()\nreport[\"app_signing_key_present\"]=(root/\".android/debug.keystore\").is_file()\nreport[\"java_process_count\"]=len(subprocess.run([\"pgrep\",\"-x\",\"java\"],capture_output=True,text=True).stdout.splitlines())\ntarget=root/\"analyst-cleanup-preservation-inventory.json\";target.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nprint(\"PRESERVATION_INVENTORY=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=90).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
