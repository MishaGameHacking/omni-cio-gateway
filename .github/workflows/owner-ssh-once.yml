name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams('backup_token='+json.dumps(os.environ['GH_TOKEN'])+'\n'+"\nimport pathlib,json,time\nresult=pathlib.Path(\"/var/lib/analyst-ai-build/runtime-result.json\")\ndeadline=time.monotonic()+180\nwhile result.exists():\n current=json.loads(result.read_text())\n if current.get(\"status\")!=\"running\" or time.monotonic()>=deadline:break\n time.sleep(3)\nprint(\"AMS_RUNTIME_AT_BACKUP=\"+json.dumps(current),flush=True)\n\nimport pathlib,json,subprocess,os,tempfile,pwd,hashlib,datetime,shutil\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\nowner=pwd.getpwnam(\"analyst-build\")\ncheck=json.loads((state/\"check-result.json\").read_text())\ndef git(args,*,env=None,raw=False):\n    r=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",*args],cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)\n    if r.returncode:\n        if args[0]==\"diff\":print(\"AMS_BACKUP_DIFF_ERROR=\"+r.stdout.decode(errors=\"replace\")[-4000:]+r.stderr.decode(errors=\"replace\")[-1000:],flush=True)\n        raise RuntimeError(\"source_backup_git_command_failed_\"+args[0])\n    return r.stdout if raw else r.stdout.decode().strip()\ndigest=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",str(state/\"venv/bin/python\"),\"-c\",\"import sys;sys.path.insert(0,'deploy');import timeweb_workspace;print(timeweb_workspace.source_hash())\"],cwd=root,text=True).strip()\nassert check[\"status\"]==\"passed\" and check[\"source_sha256\"]==digest==\"d22243392b9cabca5f0c11dbd9bb96e62099653a49d4f90e041559844b2e76a2\"\n\nimport pathlib,json,datetime,zoneinfo,os,pwd\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nowner=pwd.getpwnam(\"analyst-build\")\nnow=datetime.datetime.now(datetime.timezone.utc)\nlocal=now.astimezone(zoneinfo.ZoneInfo(\"Europe/Moscow\")).strftime(\"%d.%m.%Y, %H:%M МСК\")\nbuild=json.loads((state/\"build-result.json\").read_text())\ncheck=json.loads((state/\"check-result.json\").read_text())\nruntime=json.loads((state/\"runtime-result.json\").read_text()) if (state/\"runtime-result.json\").exists() else {\"status\":\"not_started\"}\nassert check[\"status\"]==build[\"status\"]==\"passed\" and check[\"source_sha256\"]==build[\"source_sha256\"]==\"d22243392b9cabca5f0c11dbd9bb96e62099653a49d4f90e041559844b2e76a2\"\ndetails=f\"\"\"## Актуальное рабочее место — {local}\n\nПоследнее прямое указание OWNER: создать необходимый основной сервер в\nАмстердаме. Оно заменяет прежние ограничения Москвы/Петербурга/России.\nВсе изменения, сборки и проверки выполняются только на Timeweb; GitHub\nостаётся резервной копией и ранее разрешённым SSH/API-транспортом.\n\nОсновной сервер Analyst AI PRO, ID 9415007, ams-1, IPv4 83.217.195.29:\n4 vCPU, 6 ГБ RAM, 30 ГБ NVMe, Ubuntu 24.04.5 LTS. Рабочий каталог\n/srv/analyst-ai/workspace, служебное состояние /var/lib/analyst-ai-build.\nПочасовое списание: сервер+IPv4 9.34 ₽/час, 6840 ₽/месяц в показателях API.\nЕжедневная автоматическая копия диска настроена с 25.10.2026 UTC,\nхранение одной копии — 180 ₽/месяц после её создания; плановый итог 7020 ₽.\nНаличие первой копии пока не подтверждено. Временные/дублирующие VM не создавались.\n\nПрежний сервер 9413105 отсутствовал в полном инвентаре ещё до создания\n9415007. Восстановлена резервная копия публичного исходного кода и прежний\nключ подписи APK. Приватная БД, прежний FERNET_KEY и привязка владельца\nне восстановлены; доступной копии пока не найдено. Старые записи о работающем\nbackend и канале APK относятся к прежнему серверу и не описывают текущий.\n\nSSH с проверкой ключа сервера и входом по ключу работает; парольный SSH отключён.\nFirewall открывает только 22/80/443. DNS origin\nhttps://analyst-ai-2941515.twc1.net указывает на новый IPv4. Публичный TLS\nпроверен без отключения проверки сертификата. HTTP 503 — явное техническое\nобслуживание, не успешный /health и не готовый API.\n\nПолный check прошёл {check[\"finished_at\"]}: 4 workspace guards, 974 host,\n52 tools, 61 Node, 1563 backend tests и 1481 subtests.\nПолная Android-сборка прошла {build[\"finished_at\"]}, первая холодная сборка\nзаняла 21м20с, Gradle — 21м15с. Все 152 Android JVM-теста, lint debug/preview,\nтри варианта APK и test-only UI driver, mesh/signature/16KB alignment,\nportrait/manifest/APK checks прошли. Пик cgroup около 4.0 GiB, увеличение\nтарифа для сборки не требуется по этому замеру.\nSource SHA-256: {build[\"source_sha256\"]}.\nКандидат 0.12.0/36, APK SHA-256: {build[\"apk_sha256\"]}.\nПрежний сертификат bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1.\nAPK: {build[\"apk\"]}.\n\nRuntime status на момент записи: {runtime[\"status\"]}.\\nОтчёт runtime: {runtime.get(\"log_directory\", \"not_started\")}.\\nОшибка runtime (если есть): {runtime.get(\"error\", \"none\")}.\nKVM/VMX/SVM отсутствуют. Подготовка SDK и успешная сборка не заменяют\nполную runtime-матрицу API37 / 4KB и 16KB. Новый APK не опубликован и\nне проверен на физическом телефоне.\n\nTelegram client ID/secret подготовлены приватно, но новый OWNER_SUB нельзя\nвыдумывать или брать из тестов: требуется настоящий Telegram OIDC вход и\nявная привязка подтверждённой личности. Платный ИИ не проверен: рабочего\nTIMEWEB_AI_TOKEN/политики разрешения внешней обработки нет. Проверенные TLS\nмаршруты к Telegram, T-Invest и AI Gateway не доказывают успешную авторизацию\nили реальный ответ модели.\n\n\"\"\"\npath=root/\"docs/TIMEWEB_WORKSPACE.md\"\ntext=path.read_text()\nmarker=\"## Актуальное рабочее место — \"\nif marker not in text:text=details+text\nelse:raise RuntimeError(\"current_workspace_note_already_exists_review_before_replacing\")\npath.write_text(text.rstrip()+\"\\n\");os.chown(path,owner.pw_uid,owner.pw_gid)\nsummary=f\"> Актуально {local}: основной Timeweb — Амстердам, 9415007, 4 CPU / 6 ГБ / 30 ГБ. Полные check и сборка APK 0.12/36 прошли; runtime — {runtime['status']}. Backend находится в техническом обслуживании: приватная БД и привязка владельца не восстановлены. Новый APK не опубликован. Все более ранние записи о сервере и выпуске — исторические. [Проверенное состояние](TIMEWEB_WORKSPACE.md).\\n\\n\"\nfor rel in (\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/LIVE_UPDATES_0.12.md\"):\n path=root/rel;path.write_text(summary+path.read_text().rstrip()+\"\\n\");os.chown(path,owner.pw_uid,owner.pw_gid)\npath=root/\"README.md\";body=path.read_text();first,sep,rest=body.partition(\"\\n\")\npath.write_text(first+\"\\n\\n\"+summary.replace(\"(TIMEWEB_WORKSPACE.md)\",\"(docs/TIMEWEB_WORKSPACE.md)\")+rest.lstrip(\"\\n\").rstrip()+\"\\n\");os.chown(path,owner.pw_uid,owner.pw_gid)\npath=root/\"AGENTS.md\"\ninstruction=f\"\"\"## Действующее указание OWNER — {local}, Амстердам\n\nОсновное рабочее место теперь Timeweb 9415007 / ams-1 / 83.217.195.29,\n4 vCPU/6 ГБ/30 ГБ; каталог /srv/analyst-ai/workspace. Это заменяет прежние\nрегиональные ограничения и ссылки на 9413105 как действующий сервер.\nНовый сервер уже создан. Не создавать дублирующие/временные VM.\nРедактирование и проверки остаются на Timeweb, GitHub — резервная копия\nи ранее разрешённый административный транспорт.\nCheck и сборка 0.12/36 прошли; runtime status: {runtime[\"status\"]}.\nProduction backend ещё не восстановлен; HTTPS отдаёт maintenance 503.\nПрежний ключ подписи восстановлен, новая owner binding требует реального\nTelegram OIDC входа. Сохранять single-owner, секреты и полную APK-матрицу.\nРанее записанное состояние старого сервера является историей.\nФакты и ограничения: docs/TIMEWEB_WORKSPACE.md.\n\n\"\"\"\nbody=path.read_text().replace(\"## Проверено 24.10.2026, 21:27 МСК\",\"## Историческая проверка прежнего сервера — 24.10.2026, 21:27 МСК\",1)\npath.write_text(instruction+body.rstrip()+\"\\n\");os.chown(path,owner.pw_uid,owner.pw_gid)\nprint(\"AMS_DOCS_REFRESHED=\"+json.dumps({\"time\":now.isoformat(),\"runtime_status\":runtime[\"status\"],\"source_sha256\":build[\"source_sha256\"]}),flush=True)\n\n\nallowed={\".gitignore\",\".github/scripts/native_renderer_evidence.py\",\".github/scripts/tests/test_native_renderer_evidence.py\",\".github/scripts/test_apk_installation.py\",\"deploy/timeweb_workspace.py\",\"AGENTS.md\",\"README.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/TIMEWEB_WORKSPACE.md\",\"docs/LIVE_UPDATES_0.12.md\"}\nmodified=set(git([\"diff\",\"--name-only\",\"-z\"],raw=True).decode().strip(\"\\0\").split(\"\\0\"))|set(git([\"ls-files\",\"--others\",\"--exclude-standard\",\"-z\"],raw=True).decode().strip(\"\\0\").split(\"\\0\"))\nmodified.discard(\"\");assert modified and modified<=allowed,\"unreviewed_backup_paths\"\nfor name in modified:assert (root/name).is_file() and not (root/name).is_symlink() and (root/name).stat().st_size<500000\nbranch=\"refs/heads/backup/timeweb-workspace-20261024\";parent=\"e1af1b43d991db35a7c0b5064febb890e2406712\"\nassert git([\"ls-remote\",\"origin\",branch]).split()[0]==parent,\"backup_head_changed\"\nwith tempfile.TemporaryDirectory(prefix=\"source-backup-\",dir=state) as directory:\n    folder=pathlib.Path(directory);os.chown(folder,owner.pw_uid,owner.pw_gid);folder.chmod(0o700)\n    ask=folder/\"askpass.py\"\n    ask.write_text(\"#!/usr/bin/python3\\nimport os,sys\\nprint('x-access-token' if 'username' in sys.argv[1].lower() else os.environ['ANALYST_BACKUP_TOKEN'])\\n\")\n    ask.chmod(0o700);os.chown(ask,owner.pw_uid,owner.pw_gid)\n    env={**os.environ,\"GIT_INDEX_FILE\":str(folder/\"index\"),\"GIT_AUTHOR_NAME\":\"Analyst AI Timeweb\",\"GIT_AUTHOR_EMAIL\":\"timeweb-workspace@localhost\",\"GIT_COMMITTER_NAME\":\"Analyst AI Timeweb\",\"GIT_COMMITTER_EMAIL\":\"timeweb-workspace@localhost\",\"GIT_ASKPASS\":str(ask),\"GIT_TERMINAL_PROMPT\":\"0\",\"ANALYST_BACKUP_TOKEN\":backup_token}\n    git([\"read-tree\",parent],env=env)\n    git([\"add\",\"--\",*sorted(modified)],env=env);git([\"diff\",\"--cached\",\"--check\"],env=env)\n    tree=git([\"write-tree\"],env=env)\n    commit=git([\"commit-tree\",tree,\"-p\",parent,\"-m\",\"Record verified Amsterdam server, completed APK build and remaining runtime and owner blockers\"],env=env)\n    hashes={}\n    for name in sorted(modified):\n        sha=hashlib.sha256((root/name).read_bytes()).hexdigest();assert hashlib.sha256(git([\"show\",commit+\":\"+name],raw=True)).hexdigest()==sha;hashes[name]=sha\n    git([\"push\",\"--force-with-lease=\"+branch+\":\"+parent,\"origin\",commit+\":\"+branch],env=env)\n    assert git([\"ls-remote\",\"origin\",branch]).split()[0]==commit\n    proof={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"branch\":branch,\"commit\":commit,\"source_sha256\":digest,\"files\":hashes}\n    target=state/\"source-backup-proof.json\";target.write_text(json.dumps(proof,indent=2)+\"\\n\");target.chmod(0o600)\n    print(\"AMS_SOURCE_BACKUP=\"+json.dumps({\"commit\":commit,\"source_sha256\":digest,\"files\":len(hashes)}),flush=True)\n\n\nimport pathlib,subprocess,json,shutil,os\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\np=state/\"runtime-result.json\"\nif p.exists():\n report=json.loads(p.read_text());print(\"AMS_RUNTIME_RESULT=\"+json.dumps(report),flush=True)\n folder=pathlib.Path(report[\"log_directory\"])\n for name in (\"runtime-16384.log\",\"runtime-4096.log\",\"failure.log\"):\n  log=folder/name\n  if log.exists():print(\"AMS_RUNTIME_LOG=\"+json.dumps({\"name\":name,\"lines\":log.read_text(errors=\"replace\").splitlines()[-40:]}),flush=True)\nroot=pathlib.Path(\"/srv/analyst-ai/workspace/app/build/outputs/apk/preview\")\nfor folder in [*root.glob(\"install-api37-*\"),*root.glob(\"install-api37-*/attempt-*\")]:\n for name in (\"emulator.log\",\"emulator-output.log\",\"install-results.json\"):\n  path=folder/name\n  if path.is_file():print(\"AMS_EMULATOR_OUTPUT=\"+json.dumps({\"path\":str(path),\"lines\":path.read_text(errors=\"replace\").splitlines()[-45:]}),flush=True)\nprint(\"AMS_RUNTIME_RESOURCES=\"+subprocess.check_output([\"systemctl\",\"show\",\"analyst-workspace@runtime.service\",\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"MemoryCurrent\",\"-p\",\"MemoryPeak\",\"-p\",\"MemorySwapCurrent\",\"-p\",\"CPUUsageNSec\"],text=True).replace(\"\\n\",\" \"),flush=True)\nprint(\"AMS_DISK_FREE=\"+str(shutil.disk_usage(\"/\").free),flush=True)\n\np=pathlib.Path(\"/var/lib/analyst-ai-ops/runtime-preparation.json\")\nif p.exists():print(\"AMS_RUNTIME_PREPARATION=\"+p.read_text().replace(\"\\n\",\" \"),flush=True)\n",timeout=420)
          PY
