\\\"invalid_apk_status\\\":invalid[\\\"status\\\"],\\\"private_api_status\\\":private[\\\"status\\\"]}\\nrootdir(ADMIN.parent,0o700);rootdir(ADMIN,0o700)\\nRECEIPT=ADMIN/\\\"owner-exception.json\\\"\\nreceipt=json.loads(RECEIPT.read_text()) if RECEIPT.exists() else None\\nif receipt:\\n assert receipt.get(\\\"kind\\\")==\\\"owner_authorized_test_ota_exception\\\" and receipt.get(\\\"apk_sha256\\\")==DIGEST and receipt.get(\\\"source_sha256\\\")==SOURCE and receipt.get(\\\"revoked\\\") is not True\\nwith (STATE/\\\"workspace.lock\\\").open(\\\"a\\\") as workspace_lock:\\n fcntl.flock(workspace_lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n assert source_hash()==SOURCE,\\\"source_changed\\\"\\n assert APK.is_file() and not APK.is_symlink() and APK.stat().st_uid==0 and not APK.stat().st_mode&0o022\\n assert APK.stat().st_size==SIZE and sha(APK)==DIGEST\\n proof=json.loads((APK.parent/\\\"apk-verification.json\\\").read_text())\\n reports={s:json.loads((APK.parent/(s+\\\"-result.json\\\")).read_text()) for s in (\\\"check\\\",\\\"build\\\")}\\n for stage,report in reports.items():\\n  assert report[\\\"status\\\"]==\\\"passed\\\" and report[\\\"source_sha256\\\"]==SOURCE\\n  fresh=json.loads((STATE/(stage+\\\"-result.json\\\")).read_text());assert fresh==report\\n assert reports[\\\"build\\\"][\\\"apk_sha256\\\"]==DIGEST\\n assert proof[\\\"package\\\"]==PACKAGE and proof[\\\"version_code\\\"]==37 and proof[\\\"version_name\\\"]==\\\"0.12.1-preview\\\"\\n assert proof[\\\"phone_orientation\\\"]==\\\"portrait\\\" and proof[\\\"min_sdk\\\"]==37 and proof[\\\"target_sdk\\\"]==37\\n assert \\\"installation_evidence\\\" not in proof and \\\"installation_tests\\\" not in proof\\n protected_paths=[STATE/\\\"runtime-result.json\\\",ROOT/\\\"backend/release_publication.py\\\",ROOT/\\\"deploy/publish_timeweb_workspace.py\\\"]\\n protected_before={str(p):sha(p) if p.exists() else None for p in protected_paths}\\n code=ADMIN/\\\"code\\\";rootdir(code,0o700);rootdir(code/\\\"backend\\\",0o700)\\n for name,digest in PINNED_HELPERS.items():\\n  content=(ROOT/\\\"backend\\\"/name).read_bytes();assert hashlib.sha256(content).hexdigest()==digest,\\\"helper_source_changed\\\"\\n  target=code/\\\"backend\\\"/name\\n  if target.exists():assert sha(target)==digest\\n  else:atomic(target,content)\\n init=code/\\\"backend/__init__.py\\\"\\n if not init.exists():atomic(init,b\\\"\\\")\\n assert init.read_bytes()==b\\\"\\\"\\n sys.path.insert(0,str(code))\\n from backend.client_updates import AndroidRelease,ReleaseChannel,ReleaseUnavailable\\n from backend import release_publication as publication\\n publication._require_apk_evidence(proof,sha256=DIGEST,size=SIZE,certificate=CERT)\\n publication._require_android_floor(proof)\\n try:publication._evidence(proof,sha256=DIGEST,size=SIZE,certificate=CERT)\\n except ReleaseUnavailable as error:assert str(error)==\\\"installation_evidence_missing\\\"\\n else:raise AssertionError(\\\"expected_runtime_gate_did_not_reject\\\")\\n rootdir(CHANNEL.parent,0o755);rootdir(CHANNEL,0o755)\\n directory=CHANNEL/PACKAGE\\n if not receipt:assert not list(CHANNEL.iterdir()),\\\"initial_channel_not_empty\\\"\\n rootdir(directory,0o755)\\n live=Path(\\\"/etc/caddy/Caddyfile\\\");prepared=Path(\\\"/etc/caddy/Caddyfile.ota-prepared\\\")\\n assert not live.is_symlink() and not prepared.is_symlink() and live.stat().st_uid==0 and prepared.stat().st_uid==0\\n assert sha(prepared)==NEW_CADDY\\n current_caddy=sha(live);assert current_caddy in ({OLD_CADDY,NEW_CADDY} if receipt else {OLD_CADDY}),\\\"caddy_changed\\\"\\n for service in (\\\"caddy\\\",\\\"analyst-ai-updates\\\"):\\n  assert subprocess.run([\\\"systemctl\\\",\\\"is-active\\\",\\\"--quiet\\\",service],check=False).returncode==0\\n saved=ADMIN/\\\"Caddyfile.before\\\"\\n if saved.exists():assert sha(saved)==OLD_CADDY\\n else:\\n  assert current_caddy==OLD_CADDY;atomic(saved,live.read_bytes())\\n channel=ReleaseChannel(CHANNEL)\\n candidate=AndroidRelease.parse({\\\"schema_version\\\":1,\