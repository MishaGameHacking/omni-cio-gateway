name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nresult=subprocess.run([\"/opt/analyst-ai/venv/bin/python\",\"-I\",\"-B\",\"-c\",\"import base64,hashlib,json,os,time\\nfrom pathlib import Path\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\nassert hashlib.sha256((ROOT/\\\"controller.py\\\").read_bytes()).hexdigest()==\\\"89cc6cbaea3e3cd292dbc5a514002ce06efa1a070deaef81c19586900491d65e\\\"\\nstate=json.loads((ROOT/\\\"state.json\\\").read_text())\\nassert state[\\\"session_id\\\"]==\\\"dcbeaea9-5b49-4135-a8e2-65552db8fbd7\\\",\\\"different_login_session\\\"\\nassert state[\\\"phase\\\"]==\\\"awaiting_confirmation\\\" and isinstance(state[\\\"candidate\\\"],dict),\\\"verified_identity_not_waiting\\\"\\nassert state[\\\"expires_at\\\"]>time.time()+60,\\\"login_confirmation_expired\\\"\\nassert not Path(\\\"/root/analyst-ai-owner.json\\\").exists() and not (ROOT/\\\"confirm.json\\\").exists()\\ndef emit_envelope(payload,kind,session_id,expires_at,sequence):\\n from cryptography.hazmat.primitives import hashes,serialization\\n from cryptography.hazmat.primitives.asymmetric import padding,rsa\\n from cryptography.hazmat.primitives.ciphers.aead import AESGCM\\n public_pem=\\\"-----BEGIN PUBLIC KEY-----\\\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvyc8WS9TUYJmZMdZ/a/N\\\\nCkhaF5DsJErf0rHb3Bs8YXcRYuvhyMhp/qjpKPjsuXjvv4lnOjCU1EVgqK9r4mDU\\\\nYpInURKRL7P7ok+liyM/q9pHDFvDBAejaGw0Ume2CDbwlQM18IyWk7IQyLygqvzJ\\\\nKDz5lHQellXk6g7LMswtALK20bluAEDX/XEedNmuTNOCBvGIWZ7yFuOM1Qz3QK8c\\\\nq44tXPKCGMipxZPwIPl2Npyh5YSZUA2SjcLSbMM1TFiQQN+aJEa/adM+18Ql8Wkk\\\\nnbFPqeTalrJveZfTbj18fTBbdi7ERIMA4EG1tBa76FJX3kAliJ9ZKWXZKOVWvsFN\\\\ncJZ5zV4gaOxyU4SqxEtpvDePIt5H+s85KtpU02hv/E99PhJfgwpgbeZpG9vnU/V9\\\\n61CzSivNnyoMurSIc38BkILYMjWCWYcP1n0lHUrhWNtEisMCkl37CcWE6Esp/mbz\\\\n8MaF1cZWvco6uRBM/DDIAWbKIyGlKicfmGb9yRj8ujK9AgMBAAE=\\\\n-----END PUBLIC KEY-----\\\\n\\\".encode()\\n recipient=\\\"8b6ae36e28368f425f5e619b63e143e8535302a2475a9d525be3858713f16d06\\\"\\n assert hashlib.sha256(public_pem).hexdigest()==recipient\\n public=serialization.load_pem_public_key(public_pem)\\n assert isinstance(public,rsa.RSAPublicKey) and public.key_size==3072\\n meta={\\\"version\\\":1,\\\"purpose\\\":\\\"analyst-owner-handoff\\\",\\\"server_id\\\":9415007,\\\"origin\\\":\\\"https://analyst-ai-2941515.twc1.net\\\",\\\"session_id\\\":session_id,\\\"expires_at\\\":expires_at,\\\"kind\\\":kind,\\\"sequence\\\":sequence,\\\"recipient_sha256\\\":recipient}\\n aad=json.dumps(meta,sort_keys=True,separators=(\\\",\\\",\\\":\\\")).encode()\\n raw=json.dumps(payload,sort_keys=True,separators=(\\\",\\\",\\\":\\\"),ensure_ascii=True).encode();assert len(raw)<=16384\\n key=os.urandom(32);nonce=os.urandom(12)\\n cipher=AESGCM(key).encrypt(nonce,raw,aad)\\n wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=b\\\"analyst-owner-handoff/v1\\\"))\\n out={\\\"metadata\\\":meta,\\\"wrapped_key\\\":base64.b64encode(wrapped).decode(),\\\"nonce\\\":base64.b64encode(nonce).decode(),\\\"ciphertext\\\":base64.b64encode(cipher).decode()}\\n print(\\\"OWNER_HANDOFF_ENVELOPE=\\\"+json.dumps(out,separators=(\\\",\\\",\\\":\\\")),flush=True)\\n\\nemit_envelope({\\\"phase\\\":state[\\\"phase\\\"],\\\"candidate\\\":state[\\\"candidate\\\"],\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"session_id\\\":state[\\\"session_id\\\"],\\\"confirmation_ready_at_ns\\\":state[\\\"confirmation_ready_at_ns\\\"]},\\\"identity\\\",state[\\\"session_id\\\"],state[\\\"expires_at\\\"],3)\\nprint(\\\"OWNER_IDENTITY_STATUS=\\\"+json.dumps({\\\"phase\\\":state[\\\"phase\\\"],\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"owner_binding_created\\\":False,\\\"candidate_verified\\\":True}),flush=True)\\n\"],timeout=30)\nraise SystemExit(result.returncode)\n",timeout=90)
          PY
