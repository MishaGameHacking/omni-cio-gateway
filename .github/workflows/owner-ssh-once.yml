name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-system-resolver-repair
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Repair confirmed stale system DNS using preverified recursive resolvers with rollback
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["id"]==9413105 and server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and server["preset_id"]==6867 and p.cloud.public_ipv4(server)=="201.24.52.66"
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,json,os,pathlib,socket,struct,subprocess,sys,time\nroot=pathlib.Path(\"/root\");host=\"analyst-ai-2941515.twc1.net\";expected=\"201.24.52.66\"\nreport={\"server_id\":9413105,\"started_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"phase\":\"resolver_preflight\",\"configured\":False,\"verified\":False}\nout=root/\"analyst-moscow-resolver-repair.json\"\ndef save():\n    out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\ndef skip_name(data,offset):\n    for _ in range(128):\n        assert offset<len(data)\n        n=data[offset]\n        if n&0xc0==0xc0:\n            assert offset+1<len(data);return offset+2\n        assert n<64\n        offset+=1\n        if n==0:return offset\n        offset+=n\n    raise ValueError(\"invalid_dns_name\")\ndef query(server):\n    ident=int.from_bytes(os.urandom(2),\"big\")\n    name=b\"\".join(bytes([len(part)])+part.encode() for part in host.split(\".\"))+b\"\\0\"\n    packet=struct.pack(\"!6H\",ident,0x0100,1,0,0,0)+name+struct.pack(\"!HH\",1,1)\n    with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as sock:\n        sock.settimeout(5);sock.connect((server,53));sock.send(packet);data=sock.recv(65535)\n    rid,flags,questions,answers,_,_=struct.unpack_from(\"!6H\",data)\n    assert rid==ident and flags&0x8000 and flags&15==0 and questions==1 and not flags&0x0200\n    offset=skip_name(data,12)+4;rows=[]\n    for _ in range(answers):\n        offset=skip_name(data,offset)\n        kind,cls,ttl,length=struct.unpack_from(\"!HHIH\",data,offset);offset+=10\n        assert offset+length<=len(data)\n        if kind==1 and cls==1 and length==4:rows.append({\"address\":socket.inet_ntoa(data[offset:offset+4]),\"ttl\":ttl})\n        offset+=length\n    return rows\nconfig=pathlib.Path(\"/etc/systemd/resolved.conf.d/80-analyst-working-dns.conf\")\ncreated=False\ntry:\n    report[\"system_before\"]=sorted({x[4][0] for x in socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)})\n    report[\"previous_dns_servers\"]=subprocess.check_output([\"resolvectl\",\"dns\"],text=True).strip()\n    report[\"previous_domains\"]=subprocess.check_output([\"resolvectl\",\"domain\"],text=True).strip()\n    report[\"resolver_probes\"]=[]\n    for server in (\"8.8.8.8\",\"8.8.4.4\"):\n        answers=query(server)\n        report[\"resolver_probes\"].append({\"server\":server,\"answers\":answers});save()\n        assert sorted({r[\"address\"] for r in answers})==[expected],\"candidate_resolver_not_current\"\n    assert not config.exists() and not config.is_symlink(),\"existing_resolver_override_requires_review\"\n    assert not config.parent.is_symlink()\n    config.parent.mkdir(mode=0o755,exist_ok=True)\n    content=\"[Resolve]\\nDNS=\\nDNS=8.8.8.8 8.8.4.4\\nDomains=~.\\n\"\n    fd=os.open(config,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o644)\n    with os.fdopen(fd,\"w\") as stream:stream.write(content)\n    created=True;report[\"phase\"]=\"verify_system_resolver\";save()\n    subprocess.run([\"systemctl\",\"restart\",\"systemd-resolved\"],check=True,capture_output=True,timeout=25)\n    subprocess.run([\"resolvectl\",\"flush-caches\"],check=True,capture_output=True,timeout=15)\n    time.sleep(2)\n    report[\"system_after\"]={}\n    code=\"import json,socket,sys; print(json.dumps(sorted({x[4][0] for x in socket.getaddrinfo(sys.argv[1],443,socket.AF_INET,socket.SOCK_STREAM)})))\"\n    for name in (host,\"pypi.org\",\"api.timeweb.cloud\",\"oauth.telegram.org\"):\n        report[\"system_after\"][name]=json.loads(subprocess.check_output([\"python3\",\"-c\",code,name],text=True,timeout=20))\n        assert report[\"system_after\"][name]\n    assert report[\"system_after\"][host]==[expected]\n    assert subprocess.check_output([\"systemctl\",\"is-active\",\"systemd-resolved\"],text=True).strip()==\"active\"\n    report[\"effective_dns_servers\"]=subprocess.check_output([\"resolvectl\",\"dns\"],text=True).strip()\n    report[\"effective_domains\"]=subprocess.check_output([\"resolvectl\",\"domain\"],text=True).strip()\n    report[\"configured\"]=True;report[\"verified\"]=True;report[\"phase\"]=\"verified\"\nexcept Exception as error:\n    report[\"error_type\"]=type(error).__name__\n    if created:\n        config.unlink()\n        subprocess.run([\"systemctl\",\"restart\",\"systemd-resolved\"],check=True,capture_output=True,timeout=25)\n        report[\"rolled_back\"]=True\nfinally:\n    report[\"finished_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\nif report[\"verified\"]:\n    p=root/\"analyst-moscow-handoff.json\";values=json.loads(p.read_text());values[\"dns_resolver_repair\"]=report\n    p.write_text(json.dumps(values,ensure_ascii=False,indent=2));p.chmod(0o600)\n    p=root/\"analyst-moscow-readiness.json\";values=json.loads(p.read_text());values[\"dns_resolves_to_moscow\"]=True\n    p.write_text(json.dumps(values,indent=2));p.chmod(0o600)\n    repo=root/\"analyst-ai-development-79be1821\";heading=\"## TIMEWEB 24.10.2026 — исправлен устаревший системный DNS\"\n    note=heading+chr(10)+chr(10)+\"После смены A-записи Google DNS over HTTPS подтверждал 201.24.52.66, но системный resolver после очистки кэша продолжал возвращать 201.34.146.244. /etc/hosts не содержал переопределения. Оба рекурсивных DNS 8.8.8.8 и 8.8.4.4 предварительно проверены прямыми запросами с VM и вернули новый адрес. Постоянная настройка systemd-resolved перенесена в /etc/systemd/resolved.conf.d/80-analyst-working-dns.conf; старые файлы сохранены. Фактическое системное разрешение домена теперь 201.24.52.66; pypi.org, api.timeweb.cloud и oauth.telegram.org также разрешаются, resolved активен. Изменения DNSSEC/TLS-политик не вносились. Это не исправляет и не отменяет ранее подтверждённые TCP-тайм-ауты Telegram. Backend/HTTPS и привязка владельца пока не запущены.\"+chr(10)\n    for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n        p=repo/rel;old=p.read_text();assert heading not in old\n        p.write_text(old.rstrip()+chr(10)+chr(10)+note)\n    subprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"MOSCOW_RESOLVER_REPAIR=\"+json.dumps(report),flush=True)\n"
                  output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=150).decode()
                  print(output,end="",flush=True)
                  result=json.loads(next(line.split("=",1)[1] for line in output.splitlines() if line.startswith("MOSCOW_RESOLVER_REPAIR=")))
                  assert result["verified"],"system_dns_repair_not_verified"
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
