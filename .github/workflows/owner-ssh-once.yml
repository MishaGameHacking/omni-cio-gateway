ision\\\\\\\"]\\\\n    with ThreadPoolExecutor(max_workers=1) as pool:\\\\n        pending = pool.submit(setup.get, \\\\\\\"/workspace/live?wait=2&after=\\\\\\\" + revision, headers=headers())\\\\n        time.sleep(.08)\\\\n        with closing(backend.connect()) as db:\\\\n            db.execute(\\\\\\\"DELETE FROM sessions WHERE user_id=1\\\\\\\")\\\\n            db.commit()\\\\n        assert pending.result(timeout=2).status_code == 401\\\\n\\\\n\\\\ndef test_broker_change_has_its_own_stamp_without_revealing_the_token(setup):\\\\n    before = current()\\\\n    with closing(backend.connect()) as db:\\\\n        db.execute(\\\\\\\"UPDATE users SET tinvest_token_encrypted=? WHERE id=1\\\\\\\", (\\\\\\\"synthetic-private-token\\\\\\\",))\\\\n        db.commit()\\\\n    response = setup.get(\\\\\\\"/workspace/live?wait=0\\\\\\\", headers=headers())\\\\n    assert response.json()[\\\\\\\"broker_connected\\\\\\\"] is True\\\\n    assert response.json()[\\\\\\\"broker_revision\\\\\\\"] != before[\\\\\\\"broker_revision\\\\\\\"]\\\\n    assert \\\\\\\"synthetic-private-token\\\\\\\" not in response.text\\\\n\\\\n\\\\ndef test_initialize_is_idempotent_and_deployment_changes_invalidate(setup, monkeypatch):\\\\n    before = current()\\\\n    live.initialize()\\\\n    assert current() == before\\\\n    monkeypatch.setattr(live, \\\\\\\"DEPLOYMENT\\\\\\\", \\\\\\\"next-verified-server-release\\\\\\\")\\\\n    assert current()[\\\\\\\"revision\\\\\\\"] != before[\\\\\\\"revision\\\\\\\"]\\\\n\\\\n\\\\ndef test_waiter_limits_release_after_failures(setup):\\\\n    with live.watcher(1), live.watcher(1), live.watcher(1):\\\\n        with pytest.raises(HTTPException) as error:\\\\n            with live.watcher(1):\\\\n                pass\\\\n        assert error.value.status_code == 429\\\\n        with live.watcher(2):\\\\n            pass\\\\n    assert not live._waiters\\\\n    with pytest.raises(RuntimeError):\\\\n        with live.watcher(1):\\\\n            raise RuntimeError(\\\\\\\"cancelled\\\\\\\")\\\\n    assert not live._waiters\\\\n\\\",\\\"app/src/main/java/ru/omnicio/app/data/workspace/WorkspaceLiveClient.kt\\\":\\\"package ru.omnicio.app.data.workspace\\\\n\\\\nimport java.net.URI\\\\nimport java.util.concurrent.atomic.AtomicInteger\\\\nimport java.util.concurrent.atomic.AtomicReference\\\\nimport javax.net.ssl.HttpsURLConnection\\\\nimport org.json.JSONObject\\\\nimport ru.omnicio.app.data.backend.BackendConfig\\\\nimport ru.omnicio.app.data.backend.SessionExpiry\\\\nimport ru.omnicio.app.data.updates.ClientVersion\\\\n\\\\ndata class LiveChange(val revision: String, val brokerRevision: String, val brokerConnected: Boolean) {\\\\n    init {\\\\n        require(revision.matches(Regex(\\\\\\\"[a-f0-9]{64}\\\\\\\")))\\\\n        require(brokerRevision.matches(Regex(\\\\\\\"[a-f0-9]{64}\\\\\\\")))\\\\n    }\\\\n}\\\\ndata class LivePoll(val change: LiveChange? = null, val status: Int = 0, val retryAfterMillis: Long = 0)\\\\ndata class LiveDecision(val changed: Boolean, val brokerChanged: Boolean)\\\\n\\\\n/** A cursor is scoped to one signed-in session and survives only reconnects. */\\\\nclass LiveCursor {\\\\n    var revision: String? = null\\\\n        private set\\\\n    private var brokerRevision: String? = null\\\\n    fun accept(change: LiveChange): LiveDecision {\\\\n        val result = LiveDecision(revision != change.revision, brokerRevision != change.brokerRevision)\\\\n        revision = change.revision\\\\n        brokerRevision = change.brokerRevision\\\\n        return result\\\\n    }\\\\n}\\\\nfun liveRetryDelay(failures: Int): Long =\\\\n    (1_000L shl (failures - 1).coerceIn(0, 5)).coerceAtMost(30_000L)\\\\n\\\\n/** Read-only authenticated long poll, using the same pinned origin policy as other API calls. */\\\\nclass WorkspaceLiveClient(private val baseUrl: String = BackendConfig.BASE_URL) {\\\\n    private val generation = AtomicInteger()\\\\n    private val active = AtomicReference<HttpsURLConnection?>()\\