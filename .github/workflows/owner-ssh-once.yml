name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,datetime\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\ndirectory=pathlib.Path(\"/var/lib/analyst-ai-build/runs/20261025T110508321822Z-runtime-leaf-4k\")\nunit=\"analyst-ai-runtime-leaf-4k-fdb.service\"\nr=subprocess.run([\"systemctl\",\"show\",unit,\"--property=ActiveState,SubState,Result,ExecMainStatus,MemoryCurrent,MemoryPeak,CPUUsageNSec\"],capture_output=True,text=True,timeout=10)\nprint(\"REDESIGN_RUNTIME_LEAF_UNIT=\"+json.dumps(r.stdout),flush=True)\np=directory/\"leaf-result.json\";receipt=json.loads(p.read_text())\nprint(\"REDESIGN_RUNTIME_LEAF_RECEIPT=\"+json.dumps(receipt),flush=True)\nfor name in (\"runtime.log\",\"install-api37-4096/attempt-1/emulator.log\"):\n p=directory/name\n if p.is_file():\n  print(\"REDESIGN_RUNTIME_LOG_TAIL=\"+json.dumps({\"name\":name,\"bytes\":p.stat().st_size,\"tail\":p.read_text(errors=\"replace\")[-2600:]}),flush=True)\np=directory/\"resources.jsonl\"\nif p.is_file() and p.stat().st_size:\n lines=p.read_text().splitlines()\n print(\"REDESIGN_RUNTIME_RESOURCE_LATEST=\"+lines[-1],flush=True)\np=directory/\"install-api37-4096/attempt-1/boot-observation.json\"\nif p.is_file():print(\"REDESIGN_RUNTIME_BOOT_OBSERVATION=\"+p.read_text().replace(\"\\n\",\"\"),flush=True)\n\nimport shutil,os,hashlib\nRUNUSER=shutil.which(\"runuser\");assert RUNUSER\nconfig={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n k,v=line.split(\"=\",1);assert k not in config\n config[k]=json.loads(v) if v.startswith('\"') else v\nconfig.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nPROBE=\"\\\"\\\"\\\"Bounded aggregate-only currency overlap diagnostic; no production writes.\\\"\\\"\\\"\\nimport hashlib\\nimport json\\nimport logging\\nimport re\\nimport signal\\nimport sqlite3\\nimport sys\\nimport time\\nfrom collections import Counter\\nfrom decimal import Decimal, localcontext\\nfrom pathlib import Path\\n\\nsys.dont_write_bytecode = True\\nlogging.disable(logging.CRITICAL)\\nSOURCE = Path(\\\"/opt/analyst-ai/backend\\\")\\nDATABASE = Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\nDATABASE_URI = DATABASE.resolve().as_uri() + \\\"?mode=ro\\\"\\nDISPLAY = \\\"RUB\\\"\\nMAX_ACCOUNTS = 5\\nDEADLINE_SECONDS = 180\\nSTARTED = time.monotonic()\\nCOUNTS = Counter()\\nSOURCE_HASHES = {\\n    \\\"app.py\\\": \\\"6a44c9fbe9cd06a91c890961db9708accf7f4a9096987fae5b490113933ad455\\\",\\n    \\\"portfolio_details.py\\\": \\\"d677d2d74f1761b53c507ae716da29d7312f7c526e99a873686008e6ba986a57\\\",\\n    \\\"tinvest_portfolio.py\\\": \\\"09044bd13225118e7a06d4be03d30a1c651d266d616a59a2c34aed1f8901f124\\\",\\n    \\\"volume_contract.py\\\": \\\"e00250093544aec09f78d86afa597db7aaec690921fc6c90dad6ce01f26a2a41\\\",\\n    \\\"volume_state.py\\\": \\\"72db61c3c4ecb2ccb10ed68962758dd3121e9e8e5fcc36bc7a2e9b9d1c746d49\\\",\\n}\\nALLOWED_PATHS = {\\n    \\\"portfolio\\\": \\\"OperationsService/GetPortfolio\\\",\\n    \\\"positions\\\": \\\"OperationsService/GetPositions\\\",\\n}\\nEXPECTED_BASE = \\\"https://invest-public-api.tbank.ru/rest/tinkoff.public.invest.api.contract.v1.\\\"\\n\\n\\nclass ProbeFailure(RuntimeError):\\n    pass\\n\\n\\ndef require(condition, code):\\n    if not condition:\\n        raise ProbeFailure(code)\\n\\n\\ndef remaining():\\n    value = DEADLINE_SECONDS - (time.monotonic() - STARTED)\\n    require(value > 0, \\\"deadline_exceeded\\\")\\n    return value\\n\\n\\ndef alarm(_signal, _frame):\\n    raise ProbeFailure(\\\"deadline_exceeded\\\")\\n\\n\\ndef audit_hook(event, args):\\n    # Fail closed if any imported helper attempts an ordinary writable connect.\\n    if event == \\\"sqlite3.connect\\\" and (not args or args[0] != DATABASE_URI):\\n        raise ProbeFailure(\\\"non_readonly_sqlite_connection_blocked\\\")\\n\\n\\nsys.addaudithook(audit_hook)\\n\\n\\ndef dictionary(value):\\n    return value if isinstance(value, dict) else {}\\n\\n\\ndef read_state(state):\\n    connection = sqlite3.connect(DATABASE_URI, uri=True, timeout=3)\\n    connection.row_factory = sqlite3.Row\\n    try:\\n        connection.execute(\\\"PRAGMA query_only=ON\\\")\\n        connection.execute(\\\"BEGIN\\\")\\n        users = connection.execute(\\n            \\\"SELECT u.id,u.tinvest_token_encrypted FROM users u JOIN installation_owner o \\\"\\n            \\\"ON o.telegram_sub=u.telegram_sub WHERE o.singleton=1\\\"\\n        ).fetchall()\\n        require(len(users) == 1 and bool(users[0][\\\"tinvest_token_encrypted\\\"]), \\\"owner_connection_unavailable\\\")\\n        user = users[0]\\n        saved = connection.execute(\\n            \\\"SELECT id,broker_key,payload_json FROM workspace_snapshots WHERE user_id=? AND currency=?\\\",\\n            (user[\\\"id\\\"], DISPLAY),\\n        ).fetchone()\\n        require(saved is not None and saved[\\\"broker_key\\\"] == state.broker_key(user), \\\"snapshot_connection_mismatch\\\")\\n        snapshot = json.loads(saved[\\\"payload_json\\\"])\\n        require(isinstance(snapshot, dict) and snapshot.get(\\\"snapshot_id\\\") == saved[\\\"id\\\"], \\\"snapshot_shape_invalid\\\")\\n        accounts = snapshot.get(\\\"accounts\\\")\\n        require(isinstance(accounts, list) and 0 < len(accounts) <= 1000, \\\"snapshot_accounts_invalid\\\")\\n        identifiers = []\\n        for account in accounts:\\n            identifier = dictionary(account).get(\\\"id\\\")\\n            require(isinstance(identifier, str) and 0 < len(identifier) <= 128, \\\"snapshot_accounts_invalid\\\")\\n            if identifier not in identifiers:\\n                identifiers.append(identifier)\\n        selected = sorted(identifiers)[:MAX_ACCOUNTS]\\n        COUNTS[\\\"snapshot_accounts\\\"] = len(identifiers)\\n        COUNTS[\\\"selected_accounts\\\"] = len(selected)\\n        return user, snapshot, selected\\n    finally:\\n        connection.rollback()\\n        connection.close()\\n\\n\\ndef list_field(payload, field):\\n    value = payload.get(field, [])\\n    require(isinstance(value, list) and len(value) <= 10000 and all(isinstance(item, dict) for item in value), \\\"broker_list_shape_invalid\\\")\\n    return value\\n\\n\\ndef checked_money(value, portfolio):\\n    require(isinstance(value, dict), \\\"broker_money_shape_invalid\\\")\\n    amount, currency = portfolio._money_decimal(value)\\n    require(re.fullmatch(\\\"[A-Z]{3}\\\", currency) is not None, \\\"broker_money_shape_invalid\\\")\\n    return amount, currency\\n\\n\\ndef validate_responses(raw, balances, account_id, portfolio):\\n    require(isinstance(raw, dict) and isinstance(balances, dict), \\\"broker_response_shape_invalid\\\")\\n    for payload in (raw, balances):\\n        require(\\\"accountId\\\" not in payload or payload[\\\"accountId\\\"] == account_id, \\\"broker_account_mismatch\\\")\\n    total, currency = checked_money(raw.get(\\\"totalAmountPortfolio\\\"), portfolio)\\n    require(currency == DISPLAY, \\\"broker_total_currency_mismatch\\\")\\n    positions = list_field(raw, \\\"positions\\\")\\n    list_field(raw, \\\"virtualPositions\\\")\\n    for position in positions:\\n        identifier = position.get(\\\"instrumentUid\\\") or position.get(\\\"positionUid\\\") or position.get(\\\"figi\\\")\\n        require(isinstance(identifier, str) and 0 < len(identifier) <= 128, \\\"broker_position_identity_missing\\\")\\n        require(isinstance(position.get(\\\"instrumentType\\\"), str), \\\"broker_position_type_missing\\\")\\n        require(isinstance(position.get(\\\"quantity\\\"), dict), \\\"broker_quantity_missing\\\")\\n        portfolio._decimal(position[\\\"quantity\\\"])\\n        for field in (\\\"currentPrice\\\", \\\"currentNkd\\\"):\\n            if field in position:\\n                checked_money(position[field], portfolio)\\n    for field in (\\\"money\\\", \\\"blocked\\\"):\\n        for item in list_field(balances, field):\\n            checked_money(item, portfolio)\\n    for field in (\\\"securities\\\", \\\"futures\\\", \\\"options\\\"):\\n        list_field(balances, field)\\n    return total, positions\\n\\n\\ndef summarize(rows, total, contract):\\n    seen, known_sum, invalid = set(), Decimal(0), 0\\n    for row in rows:\\n        value = contract.decimal(row.get(\\\"currentValue\\\"))\\n        currency = dictionary(row.get(\\\"currentValue\\\")).get(\\\"currency\\\")\\n        identifier = row.get(\\\"id\\\")\\n        if identifier in seen or value is None or value < 0 or currency != DISPLAY:\\n            invalid += 1\\n            continue\\n        seen.add(identifier)\\n        known_sum += value\\n    return {\\\"sum\\\": known_sum, \\\"complete\\\": invalid == 0,\\n            \\\"matches\\\": abs(known_sum - total) <= Decimal(\\\"0.01\\\"), \\\"invalid\\\": invalid, \\\"rows\\\": len(rows)}\\n\\n\\ndef compare_account(raw, balances, account_id, portfolio, details, contract):\\n    total, raw_positions = validate_responses(raw, balances, account_id, portfolio)\\n    COUNTS[\\\"portfolio_positions\\\"] += len(raw_positions)\\n    currency_positions = [item for item in raw_positions if item[\\\"instrumentType\\\"].lower() == \\\"currency\\\"]\\n    money = [checked_money(item, portfolio) for item in list_field(balances, \\\"money\\\")]\\n    COUNTS[\\\"currency_positions\\\"] += len(currency_positions)\\n    COUNTS[\\\"money_rows\\\"] += len(money)\\n    COUNTS[\\\"accounts_with_currency_positions\\\"] += bool(currency_positions)\\n    COUNTS[\\\"accounts_with_money_key\\\"] += \\\"money\\\" in balances\\n    COUNTS[\\\"accounts_with_currency_and_money_rows\\\"] += bool(currency_positions and money)\\n    COUNTS[\\\"accounts_limits_loading\\\"] += balances.get(\\\"limitsLoadingInProgress\\\") is True\\n    COUNTS[\\\"virtual_positions\\\"] += len(raw.get(\\\"virtualPositions\\\", []))\\n    COUNTS[\\\"money_duplicate_currency_rows\\\"] += len(money) - len({code for _, code in money})\\n\\n    lightweight = portfolio._portfolio_positions(raw, balances)\\n\\n    class CapturedReader:\\n        # Existing full-account normalizer; never query metadata or broker again.\\n        def read(self, method, body):\\n            require(body == ({\\\"accountId\\\": account_id, \\\"currency\\\": DISPLAY} if method == \\\"portfolio\\\" else {\\\"accountId\\\": account_id}), \\\"captured_query_invalid\\\")\\n            require(method in ALLOWED_PATHS, \\\"captured_method_not_allowed\\\")\\n            return raw if method == \\\"portfolio\\\" else balances\\n\\n        def metadata(self, _raw, budget=None):\\n            require(budget is not None and budget[0] == 0, \\\"metadata_budget_not_zero\\\")\\n            return {}\\n\\n    full = details.read_account(CapturedReader(), {\\\"id\\\": account_id}, DISPLAY, [0])[\\\"positions\\\"]\\n    without_currency = {**raw, \\\"positions\\\": [item for item in raw_positions\\n                        if not (item[\\\"instrumentType\\\"] == \\\"currency\\\" and \\\"money\\\" in balances)]}\\n    counterfactual = portfolio._portfolio_positions(without_currency, balances)\\n    summaries = {\\\"lightweight\\\": summarize(lightweight, total, contract),\\n                 \\\"full_account\\\": summarize(full, total, contract),\\n                 \\\"currency_omission\\\": summarize(counterfactual, total, contract)}\\n    for name, summary in summaries.items():\\n        COUNTS[name + \\\"_rows\\\"] += summary[\\\"rows\\\"]\\n        COUNTS[name + \\\"_invalid_valuation_rows\\\"] += summary[\\\"invalid\\\"]\\n        COUNTS[name + \\\"_fully_valued_accounts\\\"] += summary[\\\"complete\\\"]\\n        COUNTS[name + \\\"_sum_matches_accounts\\\"] += summary[\\\"matches\\\"]\\n        COUNTS[name + \\\"_fully_valued_reconciled_accounts\\\"] += summary[\\\"complete\\\"] and summary[\\\"matches\\\"]\\n    light, full_summary, omitted = (summaries[key] for key in (\\\"lightweight\\\", \\\"full_account\\\", \\\"currency_omission\\\"))\\n    COUNTS[\\\"light_mismatch_full_reconciled_accounts\\\"] += (light[\\\"complete\\\"] and not light[\\\"matches\\\"]\\n        and full_summary[\\\"complete\\\"] and full_summary[\\\"matches\\\"])\\n    currency_normalized = [portfolio._portfolio_position(item) for item in currency_positions]\\n    require(all(item is not None for item in currency_normalized), \\\"currency_normalization_missing\\\")\\n    removed = summarize(currency_normalized, Decimal(0), contract)\\n    COUNTS[\\\"excess_explained_by_currency_rows_accounts\\\"] += bool(currency_positions and \\\"money\\\" in balances\\n        and light[\\\"complete\\\"] and not light[\\\"matches\\\"] and light[\\\"sum\\\"] > total\\n        and full_summary[\\\"complete\\\"] and full_summary[\\\"matches\\\"] and omitted[\\\"complete\\\"] and omitted[\\\"matches\\\"]\\n        and removed[\\\"complete\\\"] and abs((light[\\\"sum\\\"] - total) - removed[\\\"sum\\\"]) <= Decimal(\\\"0.01\\\"))\\n\\n    for raw_position, normalized in zip(currency_positions, currency_normalized):\\n        # Neither PortfolioPosition nor GetPositions.money binds the currency UID\\n        # to a denomination. Instrument.currency metadata is settlement currency.\\n        # Do not claim identity from quote currency, ticker or matching amounts.\\n        COUNTS[\\\"currency_denomination_unknown\\\"] += 1\\n        quantity = contract.decimal(normalized.get(\\\"quantity\\\"))\\n        value = contract.decimal(normalized.get(\\\"currentValue\\\"))\\n        valuation_currency = dictionary(normalized.get(\\\"currentValue\\\")).get(\\\"currency\\\")\\n        # Numeric compatibility is explicitly distinct from denomination identity.\\n        COUNTS[\\\"currency_value_matches_a_money_row\\\"] += any(value is not None and value == amount and valuation_currency == code for amount, code in money)\\n        COUNTS[\\\"currency_quantity_and_value_match_a_money_row\\\"] += any(quantity == amount and value == amount and valuation_currency == code for amount, code in money)\\n    COUNTS[\\\"accounts_completed\\\"] += 1\\n\\n\\ndef run():\\n    for filename, expected in SOURCE_HASHES.items():\\n        require(hashlib.sha256((SOURCE / filename).read_bytes()).hexdigest() == expected, \\\"source_hash_mismatch\\\")\\n    sys.path.insert(0, str(SOURCE))\\n    import app as backend\\n    import portfolio_details as details\\n    import tinvest_portfolio as portfolio\\n    import volume_contract as contract\\n    import volume_state as state\\n    for module, filename in ((backend, \\\"app.py\\\"), (details, \\\"portfolio_details.py\\\"), (portfolio, \\\"tinvest_portfolio.py\\\"),\\n                             (contract, \\\"volume_contract.py\\\"), (state, \\\"volume_state.py\\\")):\\n        require(Path(module.__file__).resolve() == (SOURCE / filename).resolve(), \\\"module_path_mismatch\\\")\\n    require(backend.DATABASE_PATH.resolve() == DATABASE.resolve(), \\\"database_path_mismatch\\\")\\n    require(details.BASE == EXPECTED_BASE and all(details.METHODS[name] == endpoint for name, endpoint in ALLOWED_PATHS.items()), \\\"broker_endpoint_mismatch\\\")\\n    user, snapshot, selected = read_state(state)\\n    attempted = set()\\n\\n    class BoundedReader(details.BrokerReader):\\n        def read(self, method, body):\\n            require(method in ALLOWED_PATHS and isinstance(body, dict), \\\"broker_method_not_allowed\\\")\\n            account_id = body.get(\\\"accountId\\\")\\n            require(account_id in selected, \\\"broker_account_out_of_scope\\\")\\n            expected = {\\\"accountId\\\": account_id, **({\\\"currency\\\": DISPLAY} if method == \\\"portfolio\\\" else {})}\\n            require(body == expected, \\\"broker_body_invalid\\\")\\n            require((method, account_id) not in attempted and len(attempted) < 2 * MAX_ACCOUNTS, \\\"broker_call_budget_exceeded\\\")\\n            wait = remaining()\\n            attempted.add((method, account_id))\\n            COUNTS[\\\"broker_calls_attempted\\\"] += 1\\n            previous_timeout = self.client.timeout\\n            self.client.timeout = backend.httpx.Timeout(min(12.0, wait), connect=min(5.0, wait))\\n            try:\\n                response = super().read(method, body)\\n                COUNTS[\\\"broker_calls_completed\\\"] += 1\\n                return response\\n            finally:\\n                self.client.timeout = previous_timeout\\n\\n    with BoundedReader(user) as reader:\\n        for account_id in selected:\\n            raw = reader.read(\\\"portfolio\\\", {\\\"accountId\\\": account_id, \\\"currency\\\": DISPLAY})\\n            balances = reader.read(\\\"positions\\\", {\\\"accountId\\\": account_id})\\n            compare_account(raw, balances, account_id, portfolio, details, contract)\\n    remaining()\\n    return {\\\"completed\\\": True, \\\"source_guards_passed\\\": True, \\\"readonly_database\\\": True,\\n            \\\"snapshot_scope_truncated\\\": COUNTS[\\\"snapshot_accounts\\\"] > MAX_ACCOUNTS,\\n            \\\"all_selected_lightweight_reconciled\\\": COUNTS[\\\"lightweight_fully_valued_reconciled_accounts\\\"] == len(selected),\\n            \\\"all_selected_full_account_reconciled\\\": COUNTS[\\\"full_account_fully_valued_reconciled_accounts\\\"] == len(selected),\\n            \\\"counts\\\": dict(COUNTS)}\\n\\n\\nsignal.signal(signal.SIGALRM, alarm)\\nsignal.alarm(DEADLINE_SECONDS)\\ntry:\\n    with localcontext() as context:\\n        context.prec = 80\\n        output = run()\\nexcept ProbeFailure as error:\\n    output = {\\\"completed\\\": False, \\\"guard_failure\\\": {str(error): True}, \\\"counts\\\": dict(COUNTS)}\\nexcept Exception:\\n    # No traceback, response bodies, exception detail or input identifiers.\\n    output = {\\\"completed\\\": False, \\\"unexpected_or_broker_error\\\": True, \\\"counts\\\": dict(COUNTS)}\\nfinally:\\n    signal.alarm(0)\\nprint(json.dumps(output, sort_keys=True))\\nraise SystemExit(0 if output[\\\"completed\\\"] else 1)\\n\"\nassert hashlib.sha256(PROBE.encode()).hexdigest()==\"8be9ca98a8b73f0c6a570b0a804a68aa959544a31e181a8a001d7cc875e72a3d\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=PROBE,text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=190)\nlines=p.stdout.splitlines()\nif len(lines)!=1:\n result={\"completed\":False,\"output_shape_valid\":False}\nelse:result=json.loads(lines[0])\nreport={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"probe\":\"readonly_currency_normalization_overlap\",\"source_sha256\":\"8be9ca98a8b73f0c6a570b0a804a68aa959544a31e181a8a001d7cc875e72a3d\",\"process_exit_code\":p.returncode,\"data\":result}\nprint(\"REDESIGN_CURRENCY_OVERLAP=\"+json.dumps(report),flush=True)\nout=state/\"currency-overlap-result.json\";tmp=out.with_suffix(\".next\");tmp.write_text(json.dumps(report,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,out)\n",timeout=230)
