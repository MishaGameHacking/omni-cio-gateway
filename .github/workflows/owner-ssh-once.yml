name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import ast,base64,datetime,fcntl,hashlib,json,os,pwd,shutil,socket,stat,subprocess,sys\nfrom pathlib import Path\nROOT=Path(\"/srv/analyst-ai/workspace\");STATE=Path(\"/var/lib/analyst-ai-build\")\nSOURCE=\"aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7\"\nHANDOFF=Path(\"/root/analyst-owner-handoff\");SNAP=HANDOFF/\"source\"\nCADDY_SHA=\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\"\ndef stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()\ndef sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()\ndef rootdir(p,mode=0o700):\n if p.exists():assert p.is_dir() and not p.is_symlink() and p.stat().st_uid==0 and not p.stat().st_mode&0o022\n else:p.mkdir(mode=mode)\n p.chmod(mode)\ndef atomic(p,raw,mode=0o600):\n assert not p.is_symlink()\n temp=p.with_name(p.name+\".next\")\n fd=os.open(temp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode)\n try:\n  with os.fdopen(fd,\"wb\") as f:f.write(raw);f.flush();os.fsync(f.fileno())\n  temp.chmod(mode);os.replace(temp,p)\n finally:temp.unlink(missing_ok=True)\ndef source_hash():\n names=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(ROOT),\"ls-files\",\"--cached\",\"--others\",\"--exclude-standard\",\"-z\"],timeout=60).split(b\"\\0\")\n h=hashlib.sha256()\n for n in sorted(set(names)-{b\"\"}):\n  rel=os.fsdecode(n)\n  if rel in (\"AGENTS.md\",\"README.md\") or rel.startswith(\"docs/\"):continue\n  p=ROOT/rel\n  if p.is_file():h.update(n+b\"\\0\"+sha(p).encode()+b\"\\0\")\n return h.hexdigest()\nwith (STATE/\"workspace.lock\").open(\"a\") as lock:\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n assert source_hash()==SOURCE\n publication=json.loads(Path(\"/var/lib/analyst-ai-ota-admin/v37-1c91b77a8c86453b/owner-exception.json\").read_text())\n assert publication[\"phase\"]==\"verified\"\n operations=json.loads(\"[{\\\"path\\\":\\\"AGENTS.md\\\",\\\"expected_git_blob\\\":\\\"49fc5d34d5b95525a7ea22f9c139e72976d18140\\\",\\\"operation\\\":\\\"replace_before\\\",\\\"marker\\\":\\\"## Действующее указание OWNER\\\",\\\"prefix\\\":\\\"## Состояние — 25.10.2026: тестовое OTA 0.12.1 опубликовано\\\\n\\\\nВладелец принял конкретное предложение выдать 0.12.1-preview / 37 через сервер\\\\nдо завершения Android runtime-матрицы. Разовое исключение относится только к APK\\\\nSHA-256 1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74.\\\\nЭто не разрешение следующих непроверенных выпусков. Обычные publisher/runtime\\\\nguards и их доказательства не изменены; полностью зелёная ветка не заявляется.\\\\n\\\\nНа Timeweb 9415007 канал активирован и 2026-10-25T06:07:11.998735+00:00 проверен через HTTPS:\\\\npolicy 200, полный APK 29 820 366 байт с точным SHA-256; client/ready 401,\\\\nприватный workspace пока503. Check/build/JVM/lint/подпись прошли; установка и\\\\nэкраны Android для37, а также телефон37 ещё не проверены. На последнем скриншоте\\\\nвладельца установлен36. Для36 первый переход: «Повторить проверку» →\\\\n«Обновить приложение». В37 дальнейшая автоматическая попытка происходит только\\\\nпри открытом приложении и разрешённой установке; Android может запросить действие.\\\\n\\\\nПриватная БД и owner binding нового сервера ещё не восстановлены; доступность\\\\nOTA не означает работоспособность личного backend или ИИ. Для владельца нужен\\\\nреальный Telegram OIDC вход с отдельным подтверждением проверенной личности.\\\\nПодробности: docs/AUTOMATIC_UPDATES_0.12.1.md. Предыдущие состояния ниже исторические.\\\\n\\\\n\\\"},{\\\"path\\\":\\\"docs/AUTOMATIC_UPDATES_0.12.1.md\\\",\\\"expected_sha256\\\":\\\"6811a68855c159a7bf81b0ac288a8ed845ccb6140c6e553696d7a9c03936f799\\\",\\\"operation\\\":\\\"replace\\\",\\\"content\\\":\\\"# Analyst AI 0.12.1-preview / 37: автоматическое обновление через Timeweb\\\\n\\\\n## Фактический результат 25 октября 2026\\\\n\\\\nТестовый APK **0.12.1-preview / 37 опубликован в канале обновлений** на основном\\\\nTimeweb 9415007 (ams-1). Активация и проверка HTTPS завершены\\\\n**2026-10-25T06:07:11.998735+00:00**. Это конкретная тестовая выдача по принятому владельцем\\\\nпредложению, в котором отсутствие полной Android runtime-матрицы было раскрыто.\\\\nРазрешение действует только для указанных ниже байтов, не для последующих выпусков.\\\\n\\\\n| Проверка | Результат |\\\\n|---|---|\\\\n| Полный host/backend check | PASS для source SHA ниже |\\\\n| Android JVM | 163 tests, 0 failures/errors/skips |\\\\n| Debug/Preview lint, сборка трёх APK и driver | PASS |\\\\n| Package, версия, подпись, portrait, ZIP/DEX/ELF/16KiB alignment | PASS |\\\\n| Полная установка/обновление/UI API37 с PAGE_SIZE 4096 и16384 | Не выполнена для37 |\\\\n| Публикация policy и полное скачивание APK по HTTPS | PASS; точные размер и SHA |\\\\n| Установка37 на физическом телефоне | Не подтверждена |\\\\n| Личный backend, новая owner binding и данные | Ещё не восстановлены |\\\\n| Реальные ответы ИИ | Не подтверждены |\\\\n\\\\nСтандартные `backend/release_publication.py` и `deploy/publish_timeweb_workspace.py`\\\\nне изменены и продолжают требовать полную runtime-матрицу. При проверке обычный\\\\npublisher действительно отказал из-за отсутствующей installation evidence.\\\\nОдноразовая root-операция отдельно закрепила явное решение владельца, точный\\\\nкандидат и результаты. Никакие runtime transcripts не создавались и не исправлялись.\\\\n`main` не изменялся и полностью зелёным не объявляется.\\\\n\\\\n## Установить обновление\\\\n\\\\nНа присланном владельцем скриншоте установлена **0.12.0-preview / 36**.\\\\n\\\\n1. В Analyst AI нажать **«Повторить проверку»**.\\\\n2. Когда сервер покажет **0.12.1-preview**, нажать **«Обновить приложение»**.\\\\n3. Разрешить установку из Analyst AI или подтвердить системное окно, если Android попросит.\\\\n4. После установки открыть приложение и проверить номер версии.\\\\n\\\\nAPK загружается самим приложением с Timeweb. Удалять прежнее приложение или\\\\nочищать его данные для обновления не требуется. Старое сообщение «Обновление\\\\nустановлено. Откройте Analyst AI.» — статус прошлой установки; оно само по себе\\\\nне блокирует новую проверку или кнопку обновления.\\\\n\\\\n[Прямая ссылка на те же байты APK](https://analyst-ai-2941515.twc1.net/client/apk/Analyst-AI-37-1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74.apk?package_name=ru.omnicio.app.debug).\\\\n[Текущая policy](https://analyst-ai-2941515.twc1.net/client/update-policy?package_name=ru.omnicio.app.debug).\\\\n\\\\n## Что меняет37\\\\n\\\\nПосле проверенной policy приложение автоматически начинает обновление,\\\\nкогда Activity открыта, установка разрешена и нет другой загрузки/установки.\\\\nГейт допускает одну автоматическую попытку на идентичность APK; изменение notes\\\\nне создаёт повторную попытку, ошибки и отмена не вызывают бесконечный цикл окон.\\\\nПовторная явная попытка доступна пользователю. Сохранённая установочная сессия\\\\nвосстанавливается до первой проверки версии; регистрация сессии защищена от гонки.\\\\n\\\\nЭто **foreground-обновление**. Работа при полностью закрытом приложении не добавлена.\\\\n`USER_ACTION_NOT_REQUIRED` используется при подходящих условиях Android;\\\\n`STATUS_PENDING_USER_ACTION` обрабатывается. Отсутствие системных подтверждений\\\\nна каждом конкретном телефоне не обещается.\\\\n\\\\nСерверные данные и завершённые результаты могут меняться без APK через уже\\\\nреализованный live-клиент, когда личный backend и сессия снова работают.\\\\nИзменения нативного интерфейса и кода доставляются подписанным APK.\\\\n\\\\n## Точные артефакты и доказательства\\\\n\\\\n- Package: `ru.omnicio.app.debug`; versionName `0.12.1-preview`; versionCode **37**.\\\\n- minSdk/targetSdk/compileSdk: **37**; телефонная ориентация **portrait**.\\\\n- APK: **29 820 366 байт**.\\\\n- APK SHA-256: `1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74`.\\\\n- Сертификат SHA-256: `bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1`.\\\\n- Source SHA-256: `aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7`.\\\\n- Архив кандидата: `/var/lib/analyst-ai-build/candidates/v37-1c91b77a8c86453b/`.\\\\n- Check: `/var/lib/analyst-ai-build/runs/20261025T054811Z-check`, завершён05:49:29 UTC.\\\\n- Build: `/var/lib/analyst-ai-build/runs/20261025T054931Z-build`, завершён05:53:56 UTC.\\\\n- Публичный канал: `/srv/analyst-ai-ota/releases`, отдельный read-only service8081.\\\\n- Root-private решение и журнал публикации:\\\\n  `/var/lib/analyst-ai-ota-admin/v37-1c91b77a8c86453b/owner-exception.json`.\\\\n- [Административная операция и проверка](https://github.com/MishaGameHacking/omni-cio-gateway/actions/runs/40167900538).\\\\n- Исходники кандидата: backup commit `e36d038f11de813de267d4e2b79ff5e6eb37bae3`;\\\\n  предыдущая документация: `50ea426d7a5849496c0077a59995930e51e3553e`.\\\\n\\\\nВнешний канал проверен с заголовками установленной36: policy200, APK200,\\\\nполный размер/хеш совпадают; ready401, неверное имя APK404, private workspace503.\\\\nОтключение maintenance выполнено только для обновлений. User tokens не принимались,\\\\nприватная БД не создавалась, новые аккаунты публично не регистрировались.\\\\n\\\\n## Остаток работы\\\\n\\\\nНа основной VM нет KVM/VMX/SVM. Диагностика stock-эмулятора API37/16KiB не\\\\nзавершила boot за1800 секунд; это не успешный тест установки кандидата.\\\\nПолная матрица37 и проверка телефона остаются открытыми. Старый APK36 сохранён\\\\nс исходным SHA для будущей проверки обновления.\\\\n\\\\nСледующий необходимый шаг подключения личного сервера — настоящий Telegram OIDC\\\\nвход владельца, проверка и явное подтверждение identity. Его нельзя заменить\\\\nпервым посетителем сайта, username, новым выдуманным владельцем или unit-тестом.\\\\nEnrollment не создаёт Android-сессию: после запуска backend нужен обычный вход\\\\nиз приложения. Отсутствующие приватные данные не подменяются демонстрационными.\\\\n\\\"},{\\\"path\\\":\\\"docs/PLAN_STATUS.md\\\",\\\"expected