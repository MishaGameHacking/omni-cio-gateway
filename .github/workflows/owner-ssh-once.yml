name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-direct-server-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Check current Moscow provisioning and verify SSH and KVM when ready
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          def owned(s):
              assert s["id"]==121673 and s["name"]=="analyst-ai-msk-20261024" and s["comment"]=="Analyst AI owner authorized Moscow work server 2026-10-24"
              assert s["preset_id"]==6007 and s["location"]=="ru-3" and s["project_id"]==2941515 and Decimal(str(s["price"]))==5480
              return s
          previous=None
          server=None
          for attempt in range(1):
              server=owned(get("/dedicated-servers/121673")["dedicated_server"])
              safe={k:server.get(k) for k in ("id","name","status","location","price","ip","os_id","autoinstall_ready")}
              if safe!=previous or attempt%20==0:
                  print("MOSCOW_READY_OBSERVATION="+json.dumps(safe),flush=True)
                  previous=safe
              if server.get("status") in {"on","installed"} and server.get("ip"):
                  break
              time.sleep(15)
          else:
              print("MOSCOW_STILL_PROVIDER_INSTALLING="+json.dumps({"id":121673,"status":server.get("status"),"ip_assigned":bool(server.get("ip")),"ssh_verified":False,"kvm_verified":False}),flush=True)
              sys.exit(0)
          address=str(ipaddress.IPv4Address(server["ip"]))
          assert ipaddress.ip_address(address).is_global,"non_global_dedicated_address"
          password=server.get("password")
          assert isinstance(password,str) and 8<=len(password)<=1024 and "\n" not in password,"root_credential_not_ready"
          with tempfile.TemporaryDirectory(prefix="moscow-first-access-",dir=os.environ["RUNNER_TEMP"]) as temp:
              folder=pathlib.Path(temp)
              folder.chmod(0o700)
              scan=subprocess.run(["ssh-keyscan","-T","10","-t","ed25519",address],capture_output=True,text=True,check=False,timeout=30)
              keys={line for line in scan.stdout.splitlines() if line.startswith(address+" ssh-ed25519 ")}
              assert len(keys)==1,"dedicated_ssh_ed25519_not_ready"
              line=keys.pop()
              public=" ".join(line.split()[1:3])
              known=folder/"known_hosts"
              known.write_text(address+" "+public+"\n")
              known.chmod(0o600)
              fingerprint=subprocess.check_output(["ssh-keygen","-l","-f",str(known)],text=True).split()[1]
              print("MOSCOW_SSH_FIRST_USE_PIN="+json.dumps({"server_id":121673,"ip":address,"host_public_key":public,"fingerprint":fingerprint,"source":"first_connection_to_authenticated_API_assigned_IP"}),flush=True)
              secret=folder/"root_password"
              secret.write_text(password+"\n")
              secret.chmod(0o600)
              askpass=folder/"askpass"
              askpass.write_text("#!/bin/sh\nexec cat "+shlex.quote(str(secret))+"\n")
              askpass.chmod(0o700)
              config=folder/"ssh_config"
              config.write_text("")
              environment=os.environ.copy()
              environment.update({"SSH_ASKPASS":str(askpass),"SSH_ASKPASS_REQUIRE":"force","DISPLAY":":0"})
              command=["ssh","-F",str(config),"-o","BatchMode=no","-o","PreferredAuthentications=password","-o","PubkeyAuthentication=no","-o","NumberOfPasswordPrompts=1","-o","ConnectTimeout=10","-o","StrictHostKeyChecking=yes","-o","HostKeyAlgorithms=ssh-ed25519","-o","UserKnownHostsFile="+str(known),"root@"+address]
              script="import datetime,fcntl,json,os,pathlib,shutil,socket,ssl,subprocess\nos.umask(0o077)\nassert os.geteuid()==0,\"root_required\"\nmem={}\nfor line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n    key,value=line.split(\":\",1)\n    if key in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\"}:mem[key+\"_kib\"]=int(value.split()[0])\ncpuinfo=pathlib.Path(\"/proc/cpuinfo\").read_text()\nflags=set(next((line.split(\":\",1)[1].split() for line in cpuinfo.splitlines() if line.startswith(\"flags\")),[]))\nlscpu=json.loads(subprocess.check_output([\"lscpu\",\"-J\"],text=True))\ncpu={row[\"field\"].rstrip(\":\"):row[\"data\"] for row in lscpu[\"lscpu\"] if row[\"field\"].rstrip(\":\") in {\"Architecture\",\"CPU(s)\",\"Model name\",\"Core(s) per socket\",\"Socket(s)\",\"Thread(s) per core\",\"Virtualization\",\"Hypervisor vendor\"}}\nos_release={}\nfor line in pathlib.Path(\"/etc/os-release\").read_text().splitlines():\n    key,sep,value=line.partition(\"=\")\n    if key in {\"ID\",\"VERSION_ID\",\"PRETTY_NAME\"}:os_release[key]=value.strip('\"')\nvirt=subprocess.run([\"systemd-detect-virt\"],capture_output=True,text=True,check=False).stdout.strip()\nkvm={\"cpu_vmx\":\"vmx\" in flags,\"cpu_svm\":\"svm\" in flags,\"api_version\":None,\"create_vm\":False}\nmodule=\"kvm_intel\" if \"vmx\" in flags else \"kvm_amd\" if \"svm\" in flags else None\nif module:\n    kvm[\"module_load_rc\"]=subprocess.run([\"modprobe\",module],capture_output=True,check=False).returncode\nkvm[\"device_exists\"]=pathlib.Path(\"/dev/kvm\").exists()\nif kvm[\"device_exists\"]:\n    try:\n        device=os.open(\"/dev/kvm\",os.O_RDWR|os.O_CLOEXEC)\n        try:\n            kvm[\"api_version\"]=fcntl.ioctl(device,0xAE00,0)\n            if kvm[\"api_version\"]==12:\n                guest=fcntl.ioctl(device,0xAE01,0)\n                os.close(guest)\n                kvm[\"create_vm\"]=True\n        finally:os.close(device)\n    except OSError as error:kvm[\"error\"]={\"type\":type(error).__name__,\"errno\":error.errno}\nnetwork={}\nfor host in (\"oauth.telegram.org\",\"dl.google.com\",\"repo.maven.apache.org\"):\n    try:\n        with socket.create_connection((host,443),timeout=10) as raw:\n            with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:\n                network[host]={\"tls_verified\":True,\"tls_version\":tls.version()}\n    except OSError as error:network[host]={\"tls_verified\":False,\"error\":type(error).__name__,\"errno\":error.errno}\ndisk=shutil.disk_usage(\"/\")\nreport={\"server_id\":121673,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"ssh_root_verified\":True,\"os\":os_release,\"cpu\":cpu,\"virtualization\":virt,\"memory\":mem,\"disk\":{\"total_bytes\":disk.total,\"free_bytes\":disk.free},\"kvm\":kvm,\"outbound_tls\":network}\nreport[\"hardware_suitable\"]=mem[\"MemTotal_kib\"]>=7*1024*1024 and os.cpu_count()>=4 and disk.free>=30*1024**3 and kvm[\"create_vm\"] and os_release.get(\"ID\")==\"ubuntu\" and os_release.get(\"VERSION_ID\")==\"24.04\"\nreport[\"full_application_checks_complete\"]=False\ntarget=pathlib.Path(\"/root/analyst-moscow-hardware-proof.json\")\nassert not target.is_symlink()\ntarget.write_text(json.dumps(report,ensure_ascii=False,indent=2)+\"\\n\")\ntarget.chmod(0o600)\nprint(\"MOSCOW_PHYSICAL_HARDWARE=\"+json.dumps(report,ensure_ascii=False),flush=True)\n"
              result=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],capture_output=True,env=environment,start_new_session=True,timeout=120)
              secret.unlink(missing_ok=True)
              assert result.returncode==0,"dedicated_ssh_probe_failed_rc_"+str(result.returncode)
              lines=result.stdout.decode().splitlines()
              records=[line for line in lines if line.startswith("MOSCOW_PHYSICAL_HARDWARE=")]
              assert len(records)==1,"dedicated_probe_result_missing"
              report=json.loads(records[0].split("=",1)[1])
              assert report["server_id"]==121673 and report["ssh_root_verified"]
              print(records[0],flush=True)
              if not report["hardware_suitable"]:raise p.ProbeError("dedicated_hardware_gate_failed_preserve_old_server")
              print("MOSCOW_SSH_KVM_READY_FOR_MIGRATION=121673",flush=True)
          assert owned(get("/dedicated-servers/121673")["dedicated_server"])["ip"]==address
          
          PY
