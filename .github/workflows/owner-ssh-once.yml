name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nr=subprocess.run(['/opt/analyst-ai/venv/bin/python','-I','-B','-c',\"import base64,datetime,hashlib,importlib.util,json,os,socket,stat,subprocess,sys,time,urllib.request,uuid\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\ndef load(name,path):\\n spec=importlib.util.spec_from_file_location(name,path);module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module);return module\\ncontroller=load(\\\"handoff\\\",ROOT/\\\"controller.py\\\");watcher=load(\\\"retry\\\",ROOT/\\\"retry_watcher.py\\\")\\nproof=watcher.read_private(ROOT/\\\"retry-prepared.json\\\")\\nassert proof[\\\"phase\\\"]==\\\"prepared_dormant\\\" and proof[\\\"original_auth_guards_unchanged\\\"] is True and proof[\\\"atomic_noreplace_supported\\\"] is True\\nfor filename,key in ((\\\"controller.py\\\",\\\"controller_sha256\\\"),(\\\"enrollment_entry.py\\\",\\\"entry_sha256\\\"),(\\\"retry_watcher.py\\\",\\\"watcher_sha256\\\"),(\\\"backend_activate.py\\\",\\\"activation_sha256\\\")):\\n data,_=controller.read_file(ROOT/filename,262144,private=True);assert hashlib.sha256(data).hexdigest()==proof[key]\\ncontroller.prerequisites();controller.verify_sources().check_fresh_owner()\\nassert hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()==\\\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\\\"\\nassert Path(\\\"/etc/systemd/system/analyst-owner-retry.service\\\").read_bytes()==(ROOT/\\\"analyst-owner-retry.service\\\").read_bytes()\\nfor name in (\\\"analyst-owner-enrollment.service\\\",\\\"analyst-owner-retry.service\\\"):\\n result=subprocess.run([\\\"systemctl\\\",\\\"show\\\",name,\\\"--property=ActiveState,MainPID\\\"],capture_output=True,text=True,check=True,timeout=5)\\n unit=dict(line.split(\\\"=\\\",1) for line in result.stdout.splitlines() if \\\"=\\\" in line)\\n assert unit.get(\\\"ActiveState\\\") in (\\\"inactive\\\",\\\"failed\\\") and unit.get(\\\"MainPID\\\")==\\\"0\\\"\\nassert not controller.exists(ROOT/\\\"retry-authorization.json\\\") and not controller.exists(ROOT/\\\"confirm.json\\\")\\nprior_bytes,_=controller.read_file(ROOT/\\\"owner-review-decision.json\\\",65536,private=True);prior=json.loads(prior_bytes)\\nassert prior[\\\"kind\\\"]==\\\"administrator_review_after_human_owner_login\\\" and prior[\\\"verified_subject_from_oidc\\\"] is True and prior[\\\"profile_hint_used_as_authentication\\\"] is False\\nwith socket.socket() as port:port.bind((\\\"127.0.0.1\\\",8765))\\nold=watcher.read_private(ROOT/\\\"state.json\\\");assert old[\\\"phase\\\"] in (\\\"cancelled\\\",\\\"failed\\\",\\\"expired\\\")\\nsuccess=False\\ntry:\\n subprocess.run([\\\"systemctl\\\",\\\"reset-failed\\\",\\\"analyst-owner-enrollment.service\\\"],check=True,timeout=10)\\n subprocess.run([\\\"systemctl\\\",\\\"start\\\",\\\"analyst-owner-enrollment.service\\\"],check=True,timeout=15)\\n deadline=time.monotonic()+25;state=None\\n while time.monotonic()<deadline:\\n  state=watcher.read_private(ROOT/\\\"state.json\\\")\\n  if state[\\\"session_id\\\"]!=old[\\\"session_id\\\"]:\\n   if state[\\\"phase\\\"]==\\\"waiting_for_telegram\\\":break\\n   if state[\\\"phase\\\"] in (\\\"cancelled\\\",\\\"expired\\\",\\\"failed\\\"):raise RuntimeError(\\\"fresh_flow_failed\\\")\\n  time.sleep(0.1)\\n assert state[\\\"phase\\\"]==\\\"waiting_for_telegram\\\" and state[\\\"session_id\\\"]!=old[\\\"session_id\\\"] and state[\\\"session_id\\\"]!=prior[\\\"session_id\\\"]\\n assert state[\\\"server_id\\\"]==9415007 and state[\\\"origin\\\"]==\\\"https://analyst-ai-2941515.twc1.net\\\" and state[\\\"expires_at\\\"]-time.time()>570\\n assert state[\\\"candidate\\\"] is None and state[\\\"owner_config_created\\\"] is False\\n authorization={\\\"kind\\\":\\\"one_time_same_reviewed_identity_retry\\\",\\\"server_id\\\":9415007,\\\"origin\\\":state[\\\"origin\\\"],\\\"session_id\\\":state[\\\"session_id\\\"],\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"approved_candidate_sha256\\\":prior[\\\"candidate_sha256\\\"],\\\"prior_review_sha256\\\":hashlib.sha256(prior_bytes).hexdigest(),\\\"activation_sha256\\\":proof[\\\"activation_sha256\\\"],\\\"authorized_at\\\":int(time.time()),\\\"basis\\\":\\\"Repeat the original administrator-approved complete verified identity for one fresh live Telegram login after the previous confirmation failed; no new owner selection.\\\"}\\n watcher.write_new(ROOT/\\\"retry-authorization.json\\\",authorization)\\n subprocess.run([\\\"systemctl\\\",\\\"start\\\",\\\"analyst-owner-retry.service\\\"],check=True,timeout=15)\\n deadline=time.monotonic()+5\\n while time.monotonic()<deadline:\\n  if (ROOT/\\\"retry-result.json\\\").exists():\\n   result=watcher.read_private(ROOT/\\\"retry-result.json\\\")\\n   if result.get(\\\"session_id\\\")==state[\\\"session_id\\\"]:break\\n  time.sleep(0.1)\\n assert result[\\\"phase\\\"]==\\\"waiting_for_same_verified_identity\\\"\\n assert subprocess.run([\\\"systemctl\\\",\\\"is-active\\\",\\\"--quiet\\\",\\\"analyst-owner-retry.service\\\"]).returncode==0\\n assert subprocess.run([\\\"systemctl\\\",\\\"is-active\\\",\\\"--quiet\\\",\\\"analyst-owner-enrollment.service\\\"]).returncode==0\\n with urllib.request.urlopen(\\\"https://analyst-ai-2941515.twc1.net/client/update-policy?package_name=ru.omnicio.app.debug\\\",timeout=10) as response:\\n  policy=json.loads(response.read(16385));assert response.status==200 and policy[\\\"version_code\\\"]==37 and policy[\\\"apk_sha256\\\"]==\\\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\\\"\\n def emit_envelope(payload,kind,session_id,expires_at,sequence):\\n  from cryptography.hazmat.primitives import hashes,serialization\\n  from cryptography.hazmat.primitives.asymmetric import padding,rsa\\n  from cryptography.hazmat.primitives.ciphers.aead import AESGCM\\n  public_pem=\\\"-----BEGIN PUBLIC KEY-----\\\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvyc8WS9TUYJmZMdZ/a/N\\\\nCkhaF5DsJErf0rHb3Bs8YXcRYuvhyMhp/qjpKPjsuXjvv4lnOjCU1EVgqK9r4mDU\\\\nYpInURKRL7P7ok+liyM/q9pHDFvDBAejaGw0Ume2CDbwlQM18IyWk7IQyLygqvzJ\\\\nKDz5lHQellXk6g7LMswtALK20bluAEDX/XEedNmuTNOCBvGIWZ7yFuOM1Qz3QK8c\\\\nq44tXPKCGMipxZPwIPl2Npyh5YSZUA2SjcLSbMM1TFiQQN+aJEa/adM+18Ql8Wkk\\\\nnbFPqeTalrJveZfTbj18fTBbdi7ERIMA4EG1tBa76FJX3kAliJ9ZKWXZKOVWvsFN\\\\ncJZ5zV4gaOxyU4SqxEtpvDePIt5H+s85KtpU02hv/E99PhJfgwpgbeZpG9vnU/V9\\\\n61CzSivNnyoMurSIc38BkILYMjWCWYcP1n0lHUrhWNtEisMCkl37CcWE6Esp/mbz\\\\n8MaF1cZWvco6uRBM/DDIAWbKIyGlKicfmGb9yRj8ujK9AgMBAAE=\\\\n-----END PUBLIC KEY-----\\\\n\\\".encode()\\n  recipient=\\\"8b6ae36e28368f425f5e619b63e143e8535302a2475a9d525be3858713f16d06\\\"\\n  assert hashlib.sha256(public_pem).hexdigest()==recipient\\n  public=serialization.load_pem_public_key(public_pem)\\n  assert isinstance(public,rsa.RSAPublicKey) and public.key_size==3072\\n  meta={\\\"version\\\":1,\\\"purpose\\\":\\\"analyst-owner-handoff\\\",\\\"server_id\\\":9415007,\\\"origin\\\":\\\"https://analyst-ai-2941515.twc1.net\\\",\\\"session_id\\\":session_id,\\\"expires_at\\\":expires_at,\\\"kind\\\":kind,\\\"sequence\\\":sequence,\\\"recipient_sha256\\\":recipient}\\n  aad=json.dumps(meta,sort_keys=True,separators=(\\\",\\\",\\\":\\\")).encode()\\n  raw=json.dumps(payload,sort_keys=True,separators=(\\\",\\\",\\\":\\\"),ensure_ascii=True).encode();assert len(raw)<=16384\\n  key=os.urandom(32);nonce=os.urandom(12)\\n  cipher=AESGCM(key).encrypt(nonce,raw,aad)\\n  wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=b\\\"analyst-owner-handoff/v1\\\"))\\n  out={\\\"metadata\\\":meta,\\\"wrapped_key\\\":base64.b64encode(wrapped).decode(),\\\"nonce\\\":base64.b64encode(nonce).decode(),\\\"ciphertext\\\":base64.b64encode(cipher).decode()}\\n  print(\\\"OWNER_HANDOFF_ENVELOPE=\\\"+json.dumps(out,separators=(\\\",\\\",\\\":\\\")),flush=True)\\n emit_envelope({\\\"phase\\\":state[\\\"phase\\\"],\\\"authorization_url\\\":state[\\\"authorization_url\\\"],\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"session_id\\\":state[\\\"session_id\\\"]},\\\"authorization\\\",state[\\\"session_id\\\"],state[\\\"expires_at\\\"],4)\\n ready={\\\"server_id\\\":9415007,\\\"session_id\\\":state[\\\"session_id\\\"],\\\"phase\\\":\\\"waiting_for_telegram\\\",\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"expires_at_utc\\\":datetime.datetime.fromtimestamp(state[\\\"expires_at\\\"],datetime.timezone.utc).isoformat(),\\\"previously_approved_identity_retry_armed\\\":True,\\\"new_identity_auto_binding\\\":False,\\\"owner_binding_created\\\":False,\\\"backend_activation_prepared\\\":True,\\\"ota_version\\\":37}\\n print(\\\"OWNER_RETRY_READY=\\\"+json.dumps(ready),flush=True)\\n success=True\\nfinally:\\n if not success:\\n  for name in (\\\"analyst-owner-retry.service\\\",\\\"analyst-owner-enrollment.service\\\"):\\n   subprocess.run([\\\"systemctl\\\",\\\"stop\\\",name],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=40)\\n\"],timeout=105)\nraise SystemExit(r.returncode)",timeout=150)
