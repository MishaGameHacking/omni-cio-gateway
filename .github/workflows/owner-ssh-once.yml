name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-spb-alternative-catalog
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read current Saint Petersburg offers in increasing size and reconcile inventory
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          print("SPB_CURRENT_INVENTORY="+json.dumps([{k:r.get(k) for k in ("id","name","location","availability_zone","cpu","ram","preset_id","configurator_id","status")} for r in doc["servers"]]),flush=True)
          presets=get("/presets/dedicated-servers")
          print("SPB_DEDICATED_CATALOG_KEYS="+json.dumps(sorted(presets)),flush=True)
          rows=presets.get("dedicated_servers_presets",presets.get("dedicated_server_presets",[]))
          selected=[r for r in rows if r.get("location")=="ru-1"]
          print("SPB_DEDICATED_OFFERS="+json.dumps(sorted(selected,key=lambda r:r.get("price",10**9))[:12]),flush=True)
          current=get("/dedicated-servers?limit=100&offset=0")
          rows=current.get("dedicated_servers",[])
          print("SPB_DEDICATED_INVENTORY="+json.dumps([{k:r.get(k) for k in ("id","name","location","preset_id","status","ip","autoinstall_ready","price")} for r in rows]),flush=True)
          
          PY
