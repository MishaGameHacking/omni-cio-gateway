name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("\nimport pathlib,json,subprocess,re,datetime,hashlib,os,time,collections\nfrom http.client import HTTPConnection\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nfolder=state/\"diagnostics/20261025T120007847288Z-boot-capture\"\nunit=\"analyst-ai-boot-capture-955-v1.service\"\nexpected=\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\"\nhelper=state/\"boot_stream_diagnostic_955.py\"\ndef require(value,message):\n if not value:raise RuntimeError(message)\ndef sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()\ndef props():\n raw=subprocess.check_output([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"MainPID\",\"-p\",\"InvocationID\",\"-p\",\"ControlGroup\",\"-p\",\"MemoryHigh\",\"-p\",\"MemoryMax\",\"-p\",\"MemorySwapMax\",\"-p\",\"CPUWeight\",\"-p\",\"RuntimeMaxUSec\"],text=True)\n return dict(line.split(\"=\",1) for line in raw.splitlines() if \"=\" in line)\ndef point(p):\n cg=pathlib.Path(\"/sys/fs/cgroup\")/p[\"ControlGroup\"].lstrip(\"/\")\n return {\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"monotonic\":time.monotonic(),\"unit\":p,\n   \"cgroup\":{name:(cg/name).read_text().strip() for name in (\"memory.high\",\"memory.max\",\"memory.swap.max\",\"memory.current\",\"memory.swap.current\",\"memory.events\",\"memory.pressure\",\"cpu.max\",\"cpu.weight\",\"cpu.stat\")},\n   \"host_pressure\":{kind:pathlib.Path(\"/proc/pressure\",kind).read_text().strip() for kind in (\"memory\",\"cpu\",\"io\")},\n   \"host_memory_kib\":{line.split(\":\")[0]:int(line.split()[1]) for line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if line.startswith((\"MemTotal:\",\"MemAvailable:\",\"MemFree:\",\"SwapTotal:\",\"SwapFree:\"))}}\ndef write_immutable(path,value):\n data=(json.dumps(value,sort_keys=True,indent=2)+\"\\n\").encode()\n fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)\n try:\n  os.write(fd,data);os.fsync(fd)\n finally:os.close(fd)\n require(path.stat().st_uid==0 and path.stat().st_mode&0o777==0o400,\"intervention_receipt_not_root_readonly\")\n return hashlib.sha256(data).hexdigest()\nrequire(os.geteuid()==0,\"administrator_required\")\nrequire(folder.resolve()==folder and folder.is_dir(),\"unexpected_diagnostic_folder\")\nreport=json.loads((folder/\"boot-diagnostic.json\").read_text())\np=props()\nif report.get(\"status\")!=\"running\" or p.get(\"ActiveState\")!=\"active\":\n print(\"REDESIGN_MEMORY_INTERVENTION=\"+json.dumps({\"status\":\"not_applied\",\"reason\":\"boot_diagnostic_already_terminal\",\"boot_status\":report.get(\"status\"),\"unit\":p}),flush=True)\n raise SystemExit(0)\nrequire(report.get(\"source_sha256_before\")==expected and report.get(\"requested_boot_seconds\")==3600,\"unexpected_boot_source_or_deadline\")\nrequire(report.get(\"directory\")==str(folder) and report.get(\"unit\")==unit,\"unexpected_boot_identity\")\nrequire(sha(helper)==\"96e0739276fb0f5ec62d25636242e3ca930ec91c4e7e525d1b11c4cdbcaa9444\",\"boot_helper_changed\")\nrequire(p.get(\"ControlGroup\")==\"/system.slice/\"+unit and int(p[\"MainPID\"])>0 and re.fullmatch(r\"[0-9a-f]{32}\",p.get(\"InvocationID\",\"\")),\"unexpected_running_invocation\")\nbefore=point(p)\nrequire(before[\"cgroup\"][\"memory.high\"]==\"5033164800\" and before[\"cgroup\"][\"memory.max\"]==\"5452595200\" and before[\"cgroup\"][\"memory.swap.max\"]==\"536870912\",\"unexpected_memory_policy\")\nevents=dict(x.split() for x in before[\"cgroup\"][\"memory.events\"].splitlines())\nrequire(int(events.get(\"oom\",0))==0 and int(events.get(\"oom_kill\",0))==0 and int(events.get(\"max\",0))==0,\"memory_failure_already_observed\")\npsi=float(re.search(r\"some avg10=([0-9.]+)\",before[\"cgroup\"][\"memory.pressure\"]).group(1))\nif psi<30 or int(events.get(\"high\",0))<1000 or int(before[\"cgroup\"][\"memory.current\"])<=5033164800:\n print(\"REDESIGN_MEMORY_INTERVENTION=\"+json.dumps({\"status\":\"not_applied\",\"reason\":\"fresh_soft_limit_pressure_not_present\",\"before\":before}),flush=True)\n raise SystemExit(0)\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nnames=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(root),\"ls-files\",\"--cached\",\"--others\",\"--exclude-standard\",\"-z\"]).split(b\"\\0\")\ndigest=hashlib.sha256()\nfor name in sorted(set(names)-{b\"\"}):\n rel=os.fsdecode(name)\n if rel in (\"README.md\",\"AGENTS.md\") or rel.startswith(\"docs/\"):continue\n path=root/rel\n if path.is_file():digest.update(name+b\"\\0\"+sha(path).encode()+b\"\\0\")\nrequire(digest.hexdigest()==expected,\"workspace_changed\")\nc=HTTPConnection(\"127.0.0.1\",8080,timeout=5)\ntry:\n c.request(\"GET\",\"/health\");r=c.getresponse();body=r.read(1024)\n require(r.status==200 and body.strip()==b'{\"status\":\"ok\"}',\"backend_health_not_ready\")\nfinally:c.close()\nrequest={\"schema_version\":1,\"kind\":\"bootstrap_administrative_resource_intervention\",\"status\":\"prepared\",\"unit\":unit,\"invocation_id\":p[\"InvocationID\"],\"helper_sha256\":sha(helper),\"source_sha256\":expected,\n \"reason\":\"Observed sustained memory.high direct reclaim with high memory PSI and reduced QEMU CPU; one bounded diagnostic adjustment\",\n \"before\":before,\"requested_change\":{\"memory.high\":{\"from\":\"5033164800\",\"to\":\"5452595200\"}},\"hard_memory_max_changed\":False,\"swap_limit_changed\":False,\"guest_profile_changed\":False,\"boot_deadline_extended\":False,\n \"initial_profile_preserved\":False,\"runtime_baseline_approved\":False,\"publication_authorized\":False,\n \"original_report_resource_policy_is_initial_only\":True,\"note\":\"Original helper and its initial resource-policy map are retained without rewriting. The final boot result requires this intervention history as a companion.\"}\nrequest_path=folder/\"memory-high-intervention-request.json\"\nrequest_sha=write_immutable(request_path,request)\nresult=subprocess.run([\"systemctl\",\"set-property\",\"--runtime\",unit,\"MemoryHigh=5200M\"],text=True,capture_output=True,timeout=15,check=False)\nafter=point(props())\nsame_invocation=after[\"unit\"].get(\"InvocationID\")==p[\"InvocationID\"]\npreserved=all(after[\"cgroup\"][key]==before[\"cgroup\"][key] for key in (\"memory.max\",\"memory.swap.max\",\"cpu.max\",\"cpu.weight\"))\napplied=result.returncode==0 and same_invocation and preserved and after[\"cgroup\"][\"memory.high\"]==\"5452595200\"\nreceipt={**request,\"status\":\"applied\" if applied else \"failed_or_incomplete\",\"request_sha256\":request_sha,\"request_path\":str(request_path),\"systemctl_returncode\":result.returncode,\"systemctl_stderr\":result.stderr[:1000],\"after\":after}\nresult_path=folder/\"memory-high-intervention-result.json\"\nreceipt_sha=write_immutable(result_path,receipt)\nprint(\"REDESIGN_MEMORY_INTERVENTION=\"+json.dumps({\"status\":receipt[\"status\"],\"receipt\":str(result_path),\"sha256\":receipt_sha,\"request_sha256\":request_sha,\"before\":before,\"after\":after,\"initial_profile_preserved\":False,\"runtime_baseline_approved\":False,\"boot_deadline_extended\":False}),flush=True)\nerrors=collections.deque(maxlen=60)\nfor q in sorted(folder.glob(\"guest-logcat-all-*.log\")):\n with q.open(errors=\"replace\") as stream:\n  for line in stream:\n   if re.search(r\" E ArtService:|artd.*(?:[Ee]rror|timeout|[Ff]ailed)|dex2oat.*(?:[Ff]ailed|[Tt]imed out)\",line):errors.append(line[:1500].rstrip())\nprint(\"REDESIGN_BOOT_ART_ERRORS=\"+json.dumps(list(errors)),flush=True)\nrequire(applied,\"memory_intervention_not_applied_as_requested\")\n",timeout=150)
          PY
