name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import pathlib,json,subprocess,hashlib,sqlite3,shutil,os,time,urllib.request,urllib.error,ssl,runpy\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\npipeline=runpy.run_path(str(root/\"deploy/timeweb_workspace.py\"))\ncurrent=pipeline[\"source_hash\"]()\ncheck=json.loads((state/\"check-result.json\").read_text())\nfor attempt in range(24):\n    if check[\"status\"]!=\"running\":break\n    time.sleep(2.5)\n    check=json.loads((state/\"check-result.json\").read_text())\nprint(\"LIVE_DEPLOY_CHECK=\"+json.dumps({\"status\":check[\"status\"],\"source_sha256\":check.get(\"source_sha256\"),\"current\":current}),flush=True)\nassert check[\"status\"]==\"passed\" and check[\"source_sha256\"]==current,\"checks_not_passed_for_current_sources\"\nstamp=time.strftime(\"%Y%m%dT%H%M%SZ\",time.gmtime())\nbackup=pathlib.Path(\"/root/analyst-redesign-20261024/backend-live-\"+stamp);backup.mkdir(mode=0o700)\ndef digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()\nreleases=pathlib.Path(\"/var/lib/analyst-ai/releases\")\nbefore_release={str(p.relative_to(releases)):digest(p) for p in releases.rglob(\"*.json\")}\nproduction=pathlib.Path(\"/opt/analyst-ai/backend\")\nnames=sorted(p.name for p in (root/\"backend\").glob(\"*.py\"))\nchanged=[name for name in names if not (production/name).exists() or digest(root/\"backend\"/name)!=digest(production/name)]\nassert set(changed)<= {\"app.py\",\"volume.py\",\"volume_live.py\",\"installation_evidence.py\"},\"unexpected_backend_changes\"\nassert \"volume_live.py\" in changed,\"live_already_deployed_or_source_mismatch\"\nstaged=pathlib.Path(\"/opt/analyst-ai/backend-live-staged-\"+stamp)\nshutil.copytree(production,staged,ignore=shutil.ignore_patterns(\"__pycache__\", \".pytest_cache\", \"tests\"))\nfor name in names:\n    shutil.copy2(root/\"backend\"/name,staged/name)\n    os.chown(staged/name,0,0);(staged/name).chmod(0o644)\nwith sqlite3.connect(\"file:/var/lib/analyst-ai/backend.db?mode=ro\",uri=True) as src, sqlite3.connect(backup/\"backend.db\") as dst:\n    src.backup(dst)\n    assert dst.execute(\"PRAGMA integrity_check\").fetchone()[0]==\"ok\"\n(backup/\"backend.db\").chmod(0o600)\nshutil.copy2(\"/etc/analyst-ai/backend.env\",backup/\"backend.env\");(backup/\"backend.env\").chmod(0o600)\nold=backup/\"backend\"\ndef request(path):\n    req=urllib.request.Request(\"https://analyst-ai-2941515.twc1.net\"+path,headers={\"Accept\":\"application/json\"})\n    start=time.monotonic()\n    try:\n        with urllib.request.urlopen(req,context=ssl.create_default_context(),timeout=8) as r:\n            body=r.read(16384);return r.status,int((time.monotonic()-start)*1000),json.loads(body)\n    except urllib.error.HTTPError as e:\n        return e.code,int((time.monotonic()-start)*1000),{}\nassert request(\"/health\")[0]==200\nsubprocess.run([\"systemctl\",\"stop\",\"analyst-ai-owner.service\"],check=True)\ninstalled=False\nmoved_old=False\ntry:\n    os.replace(production,old);moved_old=True\n    os.replace(staged,production);installed=True\n    subprocess.run([\"systemctl\",\"start\",\"analyst-ai-owner.service\"],check=True)\n    healthy=[]\n    for attempt in range(20):\n        try:\n            status,latency,payload=request(\"/health\")\n            if status==200 and payload.get(\"status\")==\"ok\":healthy.append(latency)\n        except Exception:pass\n        if len(healthy)>=3:break\n        time.sleep(1)\n    assert len(healthy)>=3,\"new_backend_not_healthy\"\n    status,_,_=request(\"/workspace/live?wait=0\")\n    assert status==401,\"live_route_must_require_authentication\"\n    with sqlite3.connect(\"file:/var/lib/analyst-ai/backend.db?mode=ro\",uri=True) as db:\n        assert db.execute(\"PRAGMA integrity_check\").fetchone()[0]==\"ok\"\n        triggers=db.execute(\"SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'live_v1_%'\").fetchone()[0]\n        assert triggers>=6\n        assert db.execute(\"SELECT COUNT(*) FROM workspace_live_global WHERE singleton=1\").fetchone()[0]==1\n        assert db.execute(\"SELECT COUNT(*) FROM workspace_live_versions WHERE user_id<=0\").fetchone()[0]==0\n        assert db.execute(\"SELECT COUNT(*) FROM installation_owner\").fetchone()[0]==1\n    assert before_release=={str(p.relative_to(releases)):digest(p) for p in releases.rglob(\"*.json\")},\"apk_channel_changed\"\n    assert current==pipeline[\"source_hash\"](),\"workspace_changed_during_deploy\"\n    proof={\"status\":\"deployed\",\"at\":stamp,\"source_sha256\":current,\"check_log\":check[\"log_directory\"],\n        \"backend_files\":{name:digest(production/name) for name in names},\"changed\":changed,\n        \"health_samples_ms\":healthy,\"live_unauthenticated_http\":status,\"live_triggers\":triggers,\n        \"database_integrity\":\"ok\",\"apk_channel_unchanged\":True,\n        \"authenticated_production_session_tested\":False,\"physical_phone_tested\":False,\n        \"private_backup\":str(backup)}\n    out=pathlib.Path(\"/var/lib/analyst-ai-ops/live-deployment-proof.json\")\n    out.write_text(json.dumps(proof,indent=2)+\"\\n\");out.chmod(0o600)\n    print(\"LIVE_DEPLOYED=\"+json.dumps({k:v for k,v in proof.items() if k not in (\"backend_files\",\"private_backup\")}),flush=True)\nexcept BaseException:\n    if moved_old:\n        subprocess.run([\"systemctl\",\"stop\",\"analyst-ai-owner.service\"],check=False)\n        failed=backup/\"failed-new-backend\"\n        if production.exists():os.replace(production,failed)\n        os.replace(old,production)\n        subprocess.run([\"systemctl\",\"start\",\"analyst-ai-owner.service\"],check=True)\n        print(\"LIVE_DEPLOY_ROLLED_BACK=true\",flush=True)\n    raise\n"
                      result=subprocess.run([*command,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=300)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("REDESIGN_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-5000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
