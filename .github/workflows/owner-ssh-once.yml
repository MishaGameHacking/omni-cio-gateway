name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import json,pathlib,subprocess\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nbuild=json.loads((state/\"build-result.json\").read_text())\nprint(\"REDESIGN_BUILD_STATUS=\"+json.dumps(build),flush=True)\nfor step in build.get(\"steps\",[]):\n if step[\"name\"] in (\"gradle\",\"mesh-apk-check\",\"apk-verification\"):\n  p=pathlib.Path(step[\"log\"])\n  if p.is_file():print(\"REDESIGN_BUILD_LOG=\"+json.dumps({\"name\":step[\"name\"],\"tail\":p.read_text(errors=\"replace\")[-3400:]}),flush=True)\nunit=subprocess.run([\"systemctl\",\"show\",\"analyst-backend-redesign-38-cash.service\",\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\"],capture_output=True,text=True,check=True).stdout\nprint(\"REDESIGN_CASH_DEPLOY_UNIT=\"+json.dumps(unit),flush=True)\npath=state/\"backend-redesign-result.json\"\ndeployment=json.loads(path.read_text())\nif deployment.get(\"source_sha256\")!=\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\" or deployment.get(\"status\")!=\"deployed\":\n print(\"REDESIGN_CASH_DEPLOY_PENDING=\"+json.dumps({\"deployment\":deployment}),flush=True);raise SystemExit(0)\n\nPROBE_PAYLOAD=\"\"\nimport base64,zlib,hashlib,json,pathlib,subprocess,os,datetime,urllib.request,re,shutil\nRUNUSER=shutil.which(\"runuser\")\nassert RUNUSER,\"runuser_executable_missing\"\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\npath=state/\"backend-redesign-result.json\"\nif not path.is_file():\n print(\"REDESIGN_DEPLOYMENT_PENDING=\"+json.dumps({\"reason\":\"receipt_not_created\"}),flush=True);raise SystemExit(0)\ndeployment=json.loads(path.read_text());print(\"REDESIGN_BACKEND_DEPLOYMENT=\"+json.dumps(deployment),flush=True)\nif deployment.get(\"status\")!=\"deployed\":raise SystemExit(0)\nassert deployment.get(\"source_sha256\")==\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\"\nconfig={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n k,v=line.split(\"=\",1);assert k not in config\n config[k]=json.loads(v) if v.startswith('\"') else v\nconfig.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nencoded=PROBE_PAYLOAD.encode(\"ascii\")\nassert hashlib.sha256(encoded).hexdigest()==\"41abc4bebf6b58811f5bbaa57be866ea453c6ef5ccc4cdaca2794dd0bb71f485\"\nprobe=zlib.decompress(base64.b64decode(encoded))\nassert hashlib.sha256(probe).hexdigest()==\"5cc45d6867c37dc87d0ad143fbd4f5d0434980d61430db99c802b28f97145eed\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=probe.decode(),text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=45)\nrecords=[line for line in p.stdout.splitlines() if line.startswith(\"REDESIGN_POSTDEPLOY_READONLY=\")]\nassert len(records)==1,\"postdeploy_probe_receipt_missing\"\nprint(records[0],flush=True)\nreadonly=json.loads(records[0].split(\"=\",1)[1])\nprint(\"REDESIGN_POSTDEPLOY_PROBE_EXIT=\"+str(p.returncode),flush=True)\nhost=\"https://analyst-ai-2941515.twc1.net\"\nassert config[\"BACKEND_PUBLIC_URL\"].rstrip(\"/\")==host\nhttp={}\nfor route in (\"/health\",\"/client/update-policy?package_name=ru.omnicio.app.debug\"):\n req=urllib.request.Request(host+route,headers={\"User-Agent\":\"Analyst-Timeweb-release-verifier\"})\n with urllib.request.urlopen(req,timeout=20) as response:\n  raw=response.read(32769);assert len(raw)<=32768\n  body=json.loads(raw);status=response.status\n  if route==\"/health\":\n   assert status==200 and body=={\"status\":\"ok\"}\n   http[\"health\"]={\"status\":status}\n  else:\n   fields=(\"schema_version\",\"package_name\",\"version_code\",\"version_name\",\"apk_sha256\",\"certificate_sha256\",\"minimum_version_code\",\"apk_path\")\n   public={name:body.get(name) for name in fields}\n   assert status==200 and public[\"version_code\"]==37\n   assert public[\"apk_sha256\"]==\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\"\n   assert public[\"certificate_sha256\"]==\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\n   assert response.headers.get(\"Cache-Control\")==\"no-store\"\n   http[\"update_policy\"]={\"status\":status,\"cache_control\":\"no-store\",**public}\nprint(\"REDESIGN_PUBLIC_HTTP=\"+json.dumps(http),flush=True)\nj=subprocess.run([\"journalctl\",\"-u\",\"analyst-ai-owner.service\",\"--since\",\"@\"+str(int(datetime.datetime.fromisoformat(deployment[\"started_at\"]).timestamp())),\"--no-pager\",\"-o\",\"json\"],capture_output=True,text=True,timeout=15)\nassert j.returncode==0\nmessages=[]\nfor line in j.stdout.splitlines():\n if line:messages.append(str(json.loads(line).get(\"MESSAGE\",\"\")))\njournal={\"entries\":len(messages),\"tracebacks\":sum(\"Traceback (most recent call last)\" in s for s in messages),\"error_lines\":sum(bool(re.search(r\"\\bERROR\\b\",s)) for s in messages)}\nprint(\"REDESIGN_POSTDEPLOY_JOURNAL=\"+json.dumps(journal),flush=True)\nreport={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_sha256\":deployment[\"source_sha256\"],\"readonly\":readonly,\"probe_exit_code\":p.returncode,\"public_http\":http,\"journal\":journal}\nout=state/\"postdeploy-redesign-result.json\";tmp=out.with_suffix(\".next\");tmp.write_text(json.dumps(report,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,out)\nif p.returncode:raise SystemExit(p.returncode)\n\nMETADATA_PAYLOAD=\"\\n\"\nDISCOVERY_PAYLOAD=\"\"\n\nfor label,payload,filename,marker in (\n (\"REDESIGN_METADATA_READONLY\",METADATA_PAYLOAD,\"metadata-redesign-cash-result.json\",None),\n (\"REDESIGN_DISCOVERY_READONLY\",DISCOVERY_PAYLOAD,\"discovery-redesign-cash-result.json\",\"REDESIGN_DISCOVERY_READONLY=\")\n):\n raw=zlib.decompress(base64.b64decode(payload))\n r=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=raw.decode(),text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=45)\n if marker:\n  rows=[x for x in r.stdout.splitlines() if x.startswith(marker)]\n  assert len(rows)==1,\"aggregate_receipt_missing\"\n  value=json.loads(rows[0].split(\"=\",1)[1])\n else:value=json.loads(r.stdout)\n report={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_sha256\":deployment[\"source_sha256\"],\"probe_exit_code\":r.returncode,\"result\":value}\n out=state/filename;temp=out.with_suffix(\".next\");temp.write_text(json.dumps(report,indent=2)+\"\\n\");temp.chmod(0o600);os.replace(temp,out)\n print(label+\"=\"+json.dumps(value),flush=True)\n print(label+\"_RECEIPT=\"+json.dumps(report),flush=True)\n assert r.returncode==0,\"aggregate_probe_failed\"\n",timeout=150)
          PY
