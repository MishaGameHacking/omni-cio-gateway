name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])

          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=30) as r:
                  raw=r.read(4194305);assert len(raw)<=4194304
                  return json.loads(raw)
          doc=get("/presets/dedicated-servers")
          rows=doc["dedicated_servers_presets"] if "dedicated_servers_presets" in doc else doc.get("dedicated_server_presets",doc.get("presets",[]))
          if not rows:print("DEDICATED_CATALOG_KEYS="+json.dumps(sorted(doc)),flush=True)
          else:
              allowed={"id","name","cpu","ram","disk","price","location","bandwidth","cpu_description","ram_description","hdd_description","is_pre_installed","autoinstall_ready","period","price_month","prices","available","is_available"}
              safe=[{k:v for k,v in x.items() if k in allowed} for x in rows]
              print("DEDICATED_CATALOG="+json.dumps(safe),flush=True)

          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import json,pathlib,subprocess,tarfile\nroot=pathlib.Path(\"/root\");w=root/\"analyst-workspace-preparation-20261024\"\nwith tarfile.open(root/\"analyst-apk-direct-20261024/build-evidence.tar.gz\") as tar:\n    b=tar.extractfile(\"analyst-apk-build/build.py\").read().decode()\n(w/\"previous-build.py\").write_text(b)\nprint(\"BUILD_SCRIPT=\"+json.dumps(b),flush=True)\nsdk=pathlib.Path(\"/opt/analyst-android-sdk\")\nprint(\"SDK_TOOLS=\"+json.dumps([str(x) for x in (sdk/\"cmdline-tools/latest/bin\").iterdir()]),flush=True)\nrepo=root/\"analyst-ai-android-690811a5\"\np=subprocess.run([\"git\",\"remote\",\"get-url\",\"origin\"],cwd=repo,capture_output=True,text=True)\nprint(\"SOURCE_REMOTE_OK=\"+json.dumps(p.stdout.strip()==\"https://github.com/MishaGameHacking/omni-cio-gateway.git\"),flush=True)\nprint(\"DEPENDENCY_FILES=\"+json.dumps([str(p.relative_to(repo)) for p in repo.glob(\"**/*requirements*.txt\") if \".git\" not in p.parts and \"build\" not in p.parts]),flush=True)\n"
                      outcome=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],capture_output=True,timeout=60)
                      print(outcome.stdout.decode(),flush=True)
                      if outcome.returncode:print("INSPECT_FAILURE="+outcome.stderr.decode(errors="replace")[-1000:],flush=True)
                      assert outcome.returncode==0
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
