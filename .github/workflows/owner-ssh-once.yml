name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def selected(value, fields):
              return {key:value.get(key) for key in fields if key in value}
          for path in ["/servers","/configurator/servers","/os/servers","/account/finances","/projects/2941515/resources","/floating-ips"]:
              status,data=api("GET",path)
              if status!=200:
                  print("INVENTORY_ERROR="+json.dumps({"path":path,"status":status,"details":data}),flush=True)
                  continue
              if path=="/servers":
                  rows=data.get("servers",[])
                  print("SERVER_INVENTORY="+json.dumps([selected(s,["id","name","project_id","status","location","availability_zone","cpu","ram","disk","configurator_id","preset_id","networks","is_qemu_agent"]) for s in rows]),flush=True)
              elif path=="/configurator/servers":
                  rows=data.get("server_configurators",[])
                  print("AMS_CONFIGURATORS="+json.dumps([s for s in rows if "ams" in json.dumps(s).lower() or s.get("location")=="nl-1"]),flush=True)
              elif path=="/os/servers":
                  print("UBUNTU_IMAGES="+json.dumps([s for s in data.get("servers_os",data.get("os",[])) if "ubuntu" in json.dumps(s).lower()]),flush=True)
                  print("OS_RESPONSE_KEYS="+json.dumps(list(data)),flush=True)
              elif path=="/account/finances":
                  print("ACCOUNT_FINANCES="+json.dumps(selected(data.get("finances",data),["balance","currency","monthly_cost","total_paid","hourly_cost","money_source","is_payer"])) ,flush=True)
              elif path=="/projects/2941515/resources":
                  print("PROJECT_RESOURCES="+json.dumps(data),flush=True)
              else:
                  print("FLOATING_IPS="+json.dumps([selected(s,["id","ip","server_id","resource_id","resource_type","availability_zone","location","is_ddos_guard"]) for s in data.get("floating_ips",[])]),flush=True)
          PY
