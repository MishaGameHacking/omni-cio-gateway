name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          def with_runtime(remote_script, *, timeout=300):
              sid=9417611;ip="31.130.128.55";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI runtime 20261025" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(24):
                          try:
                              ready=subprocess.run([*cmd,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                              if ready.returncode==0:break
                              if attempt in (0,11,23):print("RUNTIME_SSH_DIAGNOSTIC="+json.dumps({"attempt":attempt+1,"exit_code":ready.returncode,"stderr":ready.stderr.decode(errors="replace")[-3000:]}),flush=True)
                              if attempt==23:raise RuntimeError("runtime_ssh_not_ready_observed_"+str(ready.returncode))
                          except subprocess.TimeoutExpired:
                              if attempt in (0,11,23):print("RUNTIME_SSH_DIAGNOSTIC="+json.dumps({"attempt":attempt+1,"timeout":True}),flush=True)
                              if attempt==23:raise
                          time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("RUNTIME_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("RUNTIME_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import datetime,hashlib,json,os,pathlib,pwd,shutil,stat,subprocess\nroots=(\"/opt/analyst-ai\",\"/opt/analyst-ai-updates\",\"/etc/analyst-ai\",\"/etc/caddy\",\"/var/lib/analyst-ai\",\"/var/lib/caddy\",\"/srv/analyst-ai-ota\",\"/srv/analyst-ai/workspace\",\"/var/lib/analyst-ai-build\")\ndef sizes(root):\n    count=0;total=0;links=0\n    if root.is_file() and not root.is_symlink():return {\"files\":1,\"bytes\":root.stat().st_size,\"symlinks\":0}\n    for base,dirs,files in os.walk(root,followlinks=False):\n        for name in [*dirs,*files]:\n            path=pathlib.Path(base)/name\n            value=path.lstat()\n            if stat.S_ISLNK(value.st_mode):links+=1\n            elif stat.S_ISREG(value.st_mode):count+=1;total+=value.st_size\n    return {\"files\":count,\"bytes\":total,\"symlinks\":links}\nreport={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"roots\":{},\"build_children\":{},\"users\":{},\"certs\":[],\"binaries\":[]}\nfor name in roots:\n    path=pathlib.Path(name)\n    report[\"roots\"][name]=sizes(path) if path.exists() else {\"missing\":True}\nfor path in pathlib.Path(\"/var/lib/analyst-ai-build\").iterdir():\n    if path.name not in (\".android\",\".gradle\",\"android-sdk\",\"sdk\",\"avd\"):report[\"build_children\"][path.name]=sizes(path)\nfor name in (\"analyst-ai\",\"analyst-build\",\"caddy\"):\n    entry=pwd.getpwnam(name);report[\"users\"][name]={\"uid\":entry.pw_uid,\"gid\":entry.pw_gid,\"home\":entry.pw_dir,\"shell\":entry.pw_shell}\nfor path in (pathlib.Path(\"/opt/analyst-ai/backend/certs/russian_trusted_root_ca.pem\"),pathlib.Path(\"/usr/bin/caddy\")):\n    value=path.stat();entry={\"path\":str(path),\"sha256\":hashlib.sha256(path.read_bytes()).hexdigest(),\"bytes\":value.st_size,\"uid\":value.st_uid,\"gid\":value.st_gid,\"mode\":oct(stat.S_IMODE(value.st_mode))}\n    report[\"certs\" if path.suffix==\".pem\" else \"binaries\"].append(entry)\nreport[\"systemd_units\"]=subprocess.run([\"systemctl\",\"show\",\"analyst-ai-owner.service\",\"analyst-ai-updates.service\",\"caddy.service\",\"-p\",\"FragmentPath\",\"-p\",\"DropInPaths\",\"-p\",\"Restart\",\"-p\",\"User\",\"-p\",\"Group\"],capture_output=True,text=True,check=True,timeout=15).stdout\nreport[\"disk_free_bytes\"]=shutil.disk_usage(\"/\").free\nprint(\"RUNTIME_MIGRATION_TRANSFER_SIZE=\"+json.dumps(report,sort_keys=True))\n",timeout=180)
          with_runtime("import datetime,hashlib,json,socket,ssl\ncertificate=\"-----BEGIN CERTIFICATE-----\\nMIIFwjCCA6qgAwIBAgICEAAwDQYJKoZIhvcNAQELBQAwcDELMAkGA1UEBhMCUlUx\\nPzA9BgNVBAoMNlRoZSBNaW5pc3RyeSBvZiBEaWdpdGFsIERldmVsb3BtZW50IGFu\\nZCBDb21tdW5pY2F0aW9uczEgMB4GA1UEAwwXUnVzc2lhbiBUcnVzdGVkIFJvb3Qg\\nQ0EwHhcNMjIwMzAxMjEwNDE1WhcNMzIwMjI3MjEwNDE1WjBwMQswCQYDVQQGEwJS\\nVTE/MD0GA1UECgw2VGhlIE1pbmlzdHJ5IG9mIERpZ2l0YWwgRGV2ZWxvcG1lbnQg\\nYW5kIENvbW11bmljYXRpb25zMSAwHgYDVQQDDBdSdXNzaWFuIFRydXN0ZWQgUm9v\\ndCBDQTCCAiIwDQYJKoZIhvcNAQEBBQADggIPADCCAgoCggIBAMfFOZ8pUAL3+r2n\\nqqE0Zp52selXsKGFYoG0GM5bwz1bSFtCt+AZQMhkWQheI3poZAToYJu69pHLKS6Q\\nXBiwBC1cvzYmUYKMYZC7jE5YhEU2bSL0mX7NaMxMDmH2/NwuOVRj8OImVa5s1F4U\\nzn4Kv3PFlDBjjSjXKVY9kmjUBsXQrIHeaqmUIsPIlNWUnimXS0I0abExqkbdrXbX\\nYwCOXhOO2pDUx3ckmJlCMUGacUTnylyQW2VsJIyIGA8V0xzdaeUXg0VZ6ZmNUr5Y\\nBer/EAOLPb8NYpsAhJe2mXjMB/J9HNsoFMBFJ0lLOT/+dQvjbdRZoOT8eqJpWnVD\\nU+QL/qEZnz57N88OWM3rabJkRNdU/Z7x5SFIM9FrqtN8xewsiBWBI0K6XFuOBOTD\\n4V08o4TzJ8+Ccq5XlCUW2L48pZNCYuBDfBh7FxkB7qDgGDiaftEkZZfApRg2E+M9\\nG8wkNKTPLDc4wH0FDTijhgxR3Y4PiS1HL2Zhw7bD3CbslmEGgfnnZojNkJtcLeBH\\nBLa52/dSwNU4WWLubaYSiAmA9IUMX1/RpfpxOxd4Ykmhz97oFbUaDJFipIggx5sX\\nePAlkTdWnv+RWBxlJwMQ25oEHmRguNYf4Zr/Rxr9cS93Y+mdXIZaBEE0KS2iLRqa\\nOiWBki9IMQU4phqPOBAaG7A+eP8PAgMBAAGjZjBkMB0GA1UdDgQWBBTh0YHlzlpf\\nBKrS6badZrHF+qwshzAfBgNVHSMEGDAWgBTh0YHlzlpfBKrS6badZrHF+qwshzAS\\nBgNVHRMBAf8ECDAGAQH/AgEEMA4GA1UdDwEB/wQEAwIBhjANBgkqhkiG9w0BAQsF\\nAAOCAgEAALIY1wkilt/urfEVM5vKzr6utOeDWCUczmWX/RX4ljpRdgF+5fAIS4vH\\ntmXkqpSCOVeWUrJV9QvZn6L227ZwuE15cWi8DCDal3Ue90WgAJJZMfTshN4OI8cq\\nW9E4EG9wglbEtMnObHlms8F3CHmrw3k6KmUkWGoa+/ENmcVl68u/cMRl1JbW2bM+\\n/3A+SAg2c6iPDlehczKx2oa95QW0SkPPWGuNA/CE8CpyANIhu9XFrj3RQ3EqeRcS\\nAQQod1RNuHpfETLU/A2gMmvn/w/sx7TB3W5BPs6rprOA37tutPq9u6FTZOcG1Oqj\\nC/B7yTqgI7rbyvox7DEXoX7rIiEqyNNUguTk/u3SZ4VXE2kmxdmSh3TQvybfbnXV\\n4JbCZVaqiZraqc7oZMnRoWrXRG3ztbnbes/9qhRGI7PqXqeKJBztxRTEVj8ONs1d\\nWN5szTwaPIvhkhO3CO5ErU2rVdUr89wKpNXbBODFKRtgxUT70YpmJ46VVaqdAhOZ\\nD9EUUn4YaeLaS8A