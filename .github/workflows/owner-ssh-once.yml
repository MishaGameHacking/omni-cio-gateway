name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("# Persist reviewed next-release proposals without applying source changes.\nimport pathlib,pwd,os,hashlib,base64,zlib,json,subprocess,datetime\nroot=pathlib.Path('/srv/analyst-ai/workspace')\ndef source_digest():\n return subprocess.check_output(['/usr/sbin/runuser','-u','analyst-build','--','/usr/bin/python3','-c',\"import sys;sys.dont_write_bytecode=True;sys.path.insert(0,'/srv/analyst-ai/workspace/deploy');import timeweb_workspace;print(timeweb_workspace.source_hash())\"],cwd=root,text=True,timeout=30).strip()\nbefore=source_digest();assert before=='955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e'\naccount=pwd.getpwnam('analyst-build')\nbase=pathlib.Path('/var/lib/analyst-ai-build/proposals')\nif not base.exists():base.mkdir(mode=0o750);os.chown(base,0,account.pw_gid)\nassert base.resolve()==base\nfolder=base/'android39-after38'\nif not folder.exists():folder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\nassert folder.resolve()==folder and folder.stat().st_uid==0 and not folder.stat().st_mode&0o022\nitems=json.loads(\"{\\\"ota_background_coordinator_patch\\\":{\\\"payload\\\":\\\"\\\",\\\"sha256\\\":\\\"05222ef6db268eda570f516db32e084ba017597442b568d4e8020ac318952be6\\\",\\\"bytes\\\":149951},\\\"ota_installer_recovery_patch\\\":{\\\"payload\\\":\\\"\\\",\\\"sha256\\\":\\\"43801845e60de451590a0f96dddc17dd1406e16270f728ead887d6e9ef91f0f1\\\",\\\"bytes\\\":60884},\\\"windows_shared_sdk_patch\\\":{\\\"payload\\\":\\\"\\\",\\\"sha256\\\":\\\"c04f4e214aff71de24c5c3e6a1a69105b9948ce11f1ba8e25904ec37be6c1b47\\\",\\\"bytes\\\":47131},\\\"ota_recovery_supplement_39\\\":{\\\"payload\\\":\\\"\\\",\\\"sha256\\\":\\\"1a1e3962a356f9e1e57321dcb7e2773ca5a548409777b2e8e864eaeb84b9bdf8\\\",\\\"bytes\\\":143544}}\")\nsaved=[]\nfor name,item in items.items():\n data=zlib.decompress(base64.b64decode(item['payload']))\n assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']\n parsed=json.loads(data);assert isinstance(parsed.get('files'),list)\n p=folder/(name+'.json')\n if p.exists():assert p.is_file() and not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']\n else:\n  with p.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n  os.chown(p,0,account.pw_gid);p.chmod(0o440)\n saved.append({'path':str(p),'bytes':len(data),'sha256':item['sha256']})\ncheckpoint=json.loads(\"{\\\"schema_version\\\":1,\\\"kind\\\":\\\"windows38_and_next39_checkpoint\\\",\\\"source_commit\\\":\\\"f4e3368fff1209c02b1cd088a5dc6a5380e7e433\\\",\\\"source_sha256\\\":\\\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\\\",\\\"candidate\\\":{\\\"version_code\\\":38,\\\"sha256\\\":\\\"d57ea8c55642aaf1b18703cf0170fdd78b5d73912d57b3415d34c563fcab9649\\\",\\\"published\\\":false},\\\"current_run\\\":{\\\"id\\\":40199511664,\\\"workflow_sha\\\":\\\"d2ad9d78e3516c18285dc29cf800ab2e9187774c\\\",\\\"wrapper_sha256\\\":\\\"a5bd2de2420d3414866a8c0fa3e36d3af336bf8a4848bbcf7cea35590facd7ad\\\",\\\"completed\\\":false},\\\"cleanup\\\":{\\\"schema_version\\\":1,\\\"kind\\\":\\\"owned_ci_sdk_cache_cleanup\\\",\\\"started_at\\\":\\\"2026-10-25T12:59:01.414851+00:00\\\",\\\"run_id\\\":\\\"40195527203\\\",\\\"machine\\\":\\\"LAPTOP-NPSGA016\\\",\\\"runner\\\":\\\"omni-cio-ci\\\",\\\"lease\\\":\\\"C:\\\\\\\\Windows\\\\\\\\ServiceProfiles\\\\\\\\NetworkService\\\\\\\\AppData\\\\\\\\Local\\\\\\\\Temp\\\\\\\\analyst-ai-emulator-lease\\\\\\\\android.lock\\\",\\\"free_bytes_before\\\":2283962368,\\\"selected\\\":[{\\\"path\\\":\\\"C:\\\\\\\\actions-runner\\\\\\\\_work\\\\\\\\_tool\\\\\\\\AndroidSdk\\\\\\\\sdk\\\\\\\\system-images\\\\\\\\android-33\\\\\\\\google_apis\\\\\\\\x86_64\\\",\\\"package_id\\\":\\\"system-images;android-33;google_apis;x86_64\\\",\\\"bytes\\\":8774501963,\\\"files\\\":20,\\\"package_xml_sha256\\\":\\\"e2deb58f48dfae110a14dfbf8cc538b000f95ad83f090dfed64a5dc9c35a1596\\\",\\\"inventory_sha256\\\":\\\"e275a0cf965550d081404c9d83cdeecf969c3f5ae02