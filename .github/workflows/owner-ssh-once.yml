  need(guards >= 6 and live == 1, 'startup_guards_missing')\\\\n        return {'users': total, 'sessions': db.execute('SELECT count(*) FROM sessions').fetchone()[0],\\\\n                'owner_records': len(owners), 'owner_guards': guards, 'live_global_records': live}\\\\n    finally:\\\\n        db.close()\\\\n\\\\n\\\\ndef verify_public_apk():\\\\n    path = '/client/apk/Analyst-AI-37-' + APK_SHA + '.apk?package_name=ru.omnicio.app.debug'\\\\n    connection = http.client.HTTPSConnection(HOST, timeout=remaining(8),\\\\n                                            context=ssl.create_default_context())\\\\n    try:\\\\n        connection.request('GET', path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        need(response.status == 200, 'public_apk_unavailable')\\\\n        need(int(response.getheader('Content-Length', '-1')) == APK_BYTES,\\\\n             'public_apk_size_mismatch')\\\\n        total = 0\\\\n        checksum = hashlib.sha256()\\\\n        while True:\\\\n            remaining(1)\\\\n            chunk = response.read(262144)\\\\n            if not chunk: break\\\\n            total += len(chunk)\\\\n            need(total <= APK_BYTES, 'public_apk_size_mismatch')\\\\n            checksum.update(chunk)\\\\n        need(total == APK_BYTES and checksum.hexdigest() == APK_SHA,\\\\n             'public_apk_hash_mismatch')\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef parse_environment(raw):\\\\n    result = {}\\\\n    for line in raw.decode('utf-8').splitlines():\\\\n        name, separator, value = line.partition('=')\\\\n        need(separator and re.fullmatch(r'[A-Z][A-Z0-9_]*', name)\\\\n             and name not in result, 'environment_format_invalid')\\\\n        parsed = json.loads(value)\\\\n        need(isinstance(parsed, str), 'environment_format_invalid')\\\\n        result[name] = parsed\\\\n    return result\\\\n\\\\ndef rollback(before, target, record):\\\\n    global END