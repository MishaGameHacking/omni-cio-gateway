name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-resource-reconciliation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Reconcile the disappeared unused VM and point the owned application DNS to Moscow
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def request(method,path,data=None,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              with opener.open(req,timeout=30) as response:
                  raw=response.read(2*1024*1024+1)
                  return p.decode_response(raw) if raw else {}
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          new,=[s for s in servers["servers"] if s["id"]==9413105]
          assert new["name"]=="analyst-ai-msk-app-20261024-b" and new["location"]=="ru-3" and p.cloud.public_ipv4(new)=="201.24.52.66"
          report={"server_id":9413105,"obsolete_server_id":9413003,"obsolete_server_absent_from_complete_inventory":not any(s["id"]==9413003 for s in servers["servers"])}
          # The previous read was denied; do not retry it or treat absence from the list as deletion.
          report["obsolete_server_get_status"]=403
          report["obsolete_server_get_checked_at_utc"]="2026-10-24T10:23:41Z"
          report["obsolete_cleanup_verified"]=False
          ips=request("GET","/floating-ips")
          assert ips["meta"]["total"]==len(ips["ips"])
          obsolete=[r for r in ips["ips"] if r["id"]=="a0fc704a-bf26-440a-b55f-facd8db769df"]
          report["obsolete_ip_present"]=bool(obsolete)
          if obsolete:
              row,=obsolete
              assert row["ip"]=="81.200.158.176"
              report["obsolete_ip_resource_id"]=row.get("resource_id")
          domain=p.domain_api(token,"GET")["domain"]
          assert domain["fqdn"]==p.HOST and domain["is_technical"] is True and domain["linked_ip"] is None
          path="/domains/"+p.HOST+"/dns-records"
          def records():
              d=request("GET",path)
              assert d["meta"]["total"]==len(d["dns_records"])
              return d["dns_records"]
          before=records()
          addresses=[r for r in before if r["type"] in ("A","AAAA","CNAME") and r.get("fqdn")==p.HOST]
          row,=addresses
          assert row["id"]==95036473 and row["type"]=="A" and row["data"]["value"] in ("201.34.146.244","201.24.52.66")
          preserved={r["id"]:json.dumps(r,sort_keys=True) for r in before if r["id"]!=95036473}
          if row["data"]["value"]=="201.34.146.244":
              try:
                  request("PATCH",path+"/95036473",{"type":"A","value":"201.24.52.66","ttl":300},version=2)
                  report["dns_patch_http"]=200
              except urllib.error.HTTPError as error:
                  report["dns_patch_http"]=error.code
                  report["dns_patch_error"]=p.cloud.error_details(error.read(2*1024*1024+1))
          after=records()
          assert {r["id"]:json.dumps(r,sort_keys=True) for r in after if r["id"]!=95036473}==preserved,"unrelated_dns_records_changed"
          row,=[r for r in after if r["id"]==95036473]
          report["dns_a_value"]=row["data"]["value"]
          report["dns_points_to_moscow"]=row["data"]["value"]=="201.24.52.66"
          print("MOSCOW_RESOURCE_RECONCILIATION="+json.dumps(report),flush=True)
          access.SERVER_ID=9413105
          
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,json,pathlib,socket,subprocess,sys\nroot=pathlib.Path(\"/root\");report=json.loads(sys.argv[1])\nreport[\"checked_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\ntry:report[\"dns_ipv4_from_moscow\"]=sorted({x[4][0] for x in socket.getaddrinfo(\"analyst-ai-2941515.twc1.net\",443,socket.AF_INET,socket.SOCK_STREAM)})\nexcept OSError as error:report[\"dns_resolution_error\"]=type(error).__name__\nout=root/\"analyst-moscow-resource-reconciliation.json\";out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\nhandoff_path=root/\"analyst-moscow-handoff.json\";handoff=json.loads(handoff_path.read_text())\ncleanup={\"server_id\":9413003,\"server_get_http\":report[\"obsolete_server_get_status\"],\"absent_from_complete_inventory\":report[\"obsolete_server_absent_from_complete_inventory\"],\"ip_present\":report[\"obsolete_ip_present\"],\"earlier_delete_request_http\":403}\nhandoff[\"spare_empty_vm_cleanup\"]=cleanup\nhandoff[\"dns\"]=report\nhandoff_path.write_text(json.dumps(handoff,ensure_ascii=False,indent=2));handoff_path.chmod(0o600)\nrepo=root/\"analyst-ai-development-79be1821\"\nheading=\"## TIMEWEB 24.10.2026 — заключительная сверка DNS и ресурсов\"\nnote=heading+chr(10)+chr(10)+\"Повторная полная инвентаризация: сервер 9413003 \"+(\"отсутствует, GET вернул 404\" if report[\"obsolete_server_get_status\"]==404 else \"не подтверждён как удалённый: отсутствует в списке доступных VM, но отдельный GET ранее отклонён HTTP 403\")+\". Ранее DELETE получил 403; отсутствие в списке не доказывает удаление при запрете отдельного GET. Старый публичный IPv4 \"+(\"ещё присутствует\" if report[\"obsolete_ip_present\"] else \"отсутствует в полной инвентаризации\")+\". Текущая A-запись приложения: \"+report[\"dns_a_value\"]+\". DNS указывает на Москву: \"+str(report[\"dns_points_to_moscow\"])+\". Backend и HTTPS не запускаются без штатной привязки реального владельца Telegram; проверки сети Telegram остаются 4/6, полный живой запуск не подтверждён.\"+chr(10)\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=repo/rel;previous=path.read_text()\n    assert heading not in previous\n    path.write_text(previous.rstrip()+chr(10)+chr(10)+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"MOSCOW_FINAL_RESOURCE_STATUS=\"+json.dumps(report),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script)+" "+shlex.quote(json.dumps(report)),timeout=75).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
