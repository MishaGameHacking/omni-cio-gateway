name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import ast,base64,datetime,fcntl,hashlib,json,os,pwd,shutil,socket,stat,subprocess,sys\nfrom pathlib import Path\nROOT=Path(\"/srv/analyst-ai/workspace\");STATE=Path(\"/var/lib/analyst-ai-build\")\nSOURCE=\"aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7\"\nHANDOFF=Path(\"/root/analyst-owner-handoff\");SNAP=HANDOFF/\"source\"\nCADDY_SHA=\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\"\ndef stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()\ndef sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()\ndef rootdir(p,mode=0o700):\n if p.exists():assert p.is_dir() and not p.is_symlink() and p.stat().st_uid==0 and not p.stat().st_mode&0o022\n else:p.mkdir(mode=mode)\n p.chmod(mode)\ndef atomic(p,raw,mode=0o600):\n assert not p.is_symlink()\n temp=p.with_name(p.name+\".next\")\n fd=os.open(temp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode)\n try:\n  with os.fdopen(fd,\"wb\") as f:f.write(raw);f.flush();os.fsync(f.fileno())\n  temp.chmod(mode);os.replace(temp,p)\n finally:temp.unlink(missing_ok=True)\ndef source_hash():\n names=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(ROOT),\"ls-files\",\"--cached\",\"--others\",\"--exclude-standard\",\"-z\"],timeout=60).split(b\"\\0\")\n h=hashlib.sha256()\n for n in sorted(set(names)-{b\"\"}):\n  rel=os.fsdecode(n)\n  if rel in (\"AGENTS.md\",\"README.md\") or rel.startswith(\"docs/\"):continue\n  p=ROOT/rel\n  if p.is_file():h.update(n+b\"\\0\"+sha(p).encode()+b\"\\0\")\n return h.hexdigest()\nwith (STATE/\"workspace.lock\").open(\"a\") as lock:\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n assert source_hash()==SOURCE\n publication=json.loads(Path(\"/var/lib/analyst-ai-ota-admin/v37-1c91b77a8c86453b/owner-exception.json\").read_text())\n assert publication[\"phase\"]==\"verified\"\n documents=[{\"path\":\"AGENTS.md\",\"sha256\":\"8aef9ddbd563e6048c30859a3776ce8af233e43cdcca8df7240441c2d1e18467\",\"git_blob\":\"31f46bac965d0b84ddf9ab5419034c86e8d13164\",\"bytes\":92772},{\"path\":\"docs/AUTOMATIC_UPDATES_0.12.1.md\",\"sha256\":\"009bbcfa97d9ada7f2383df85446385a2a663b5fca50b80dd5a858c501659758\",\"git_blob\":\"f672fe9a0e7ae551788d730394850d5bb8056bed\",\"bytes\":8725},{\"path\":\"docs/PLAN_STATUS.md\",\"sha256\":\"0aa6476c5685b072e0b217cd7416bac9557b90e94640c068d4febaac265873cf\",\"git_blob\":\"b097fd523e8cd14143e9d3a192ea6d2635777580\",\"bytes\":376288},{\"path\":\"docs/MASTER_PLAN.md\",\"sha256\":\"323a8a53df3e8ff23e3d60e85b6f9afb33b2fabd0e7112b96ddedee2afd8a533\",\"git_blob\":\"8d7d6e687538e94db0796c08f146d435cfd31906\",\"bytes\":232453},{\"path\":\"README.md\",\"sha256\":\"44b14acea59f4e15aa27385fdca0de5fbf8a4314a83739c0a3bc59f1579d9ecd\",\"git_blob\":\"837f6a1e4790c4af48781bbd28af4df2b2b87504\",\"bytes\":148609}]\n for document in documents:assert sha(ROOT/document[\"path\"])==document[\"sha256\"],\"published_document_changed\"\n print(\"OTA_PUBLICATION_DOCUMENTS=\"+json.dumps(documents),flush=True)\n rootdir(HANDOFF);rootdir(SNAP);rootdir(SNAP/\"backend\");rootdir(SNAP/\"backend/certs\");rootdir(SNAP/\"deploy\")\n files=[p for p in (ROOT/\"backend\").iterdir() if p.suffix in (\".py\",\".json\") or p.name==\"requirements.txt\"]\n files+=[ROOT/\"backend/certs/russian_trusted_root_ca.pem\"]\n files +=[ROOT/\"deploy\"/n for n in (\"enroll_owner.py\",\"install_owner_backend.py\",\"analyst-ai-owner.service\")]\n manifest={}\n for p in sorted(files):\n  assert p.is_file() and not p.is_symlink()\n  rel=p.relative_to(ROOT);raw=p.read_bytes();target=SNAP/rel\n  if target.exists():assert target.read_bytes()==raw\n  else:atomic(target,raw)\n  manifest[str(rel)]=hashlib.sha256(raw).hexdigest()\n for sub in (\"backend\",\"deploy\"):\n  target=SNAP/sub/\"__init__.py\"\n  if not target.exists():atomic(target,b\"\")\n assert source_hash()==SOURCE\n atomic(HANDOFF/\"source-manifest.json\",(json.dumps(manifest,indent=2)+\"\\n\").encode())\n sys.path.insert(0,str(SNAP))\n from deploy import install_owner_backend as installer\n values=installer.load_config(enrollment=True)\n assert values[\"BACKEND_PUBLIC_URL\"]==\"https://analyst-ai-2941515.twc1.net\"\n assert values[\"EXPECTED_PUBLIC_IPV4\"]==\"83.217.195.29\"\n assert values[\"TELEGRAM_ENROLLMENT_REDIRECT_URI\"]==\"https://analyst-ai-2941515.twc1.net/auth/telegram/owner-enrollment/callback\"\n installer.check_address(values)\n for p in (installer.INPUT_CONFIG,installer.CONFIG/\"backend.env\",installer.UNIT):\n  assert not p.exists() and not p.is_symlink(),\"owner_or_service_already_exists\"\n assert not installer.STATE.exists(),\"unexpected_private_state\"\n for port in (8080,8765):\n  sock=socket.socket()\n  try:sock.bind((\"127.0.0.1\",port))\n  finally:sock.close()\n paths=installer.source_files()\n if not installer.INSTALL.exists():installer.install_sources(paths)\n else:\n  assert not installer.INSTALL.is_symlink() and installer.INSTALL.stat().st_uid==0\n  for p in paths:assert sha(installer.INSTALL/\"backend\"/p.relative_to(SNAP/\"backend\"))==sha(p)\n rootdir(installer.CONFIG)\n try:user=pwd.getpwnam(\"analyst-ai\");assert user.pw_uid!=0 and user.pw_shell==\"/usr/sbin/nologin\"\n except KeyError:installer.run([\"useradd\",\"--system\",\"--user-group\",\"--home-dir\",str(installer.STATE),\"--no-create-home\",\"--shell\",\"/usr/sbin/nologin\",\"analyst-ai\"])\n if not (installer.INSTALL/\"venv\").exists():installer.run([\"python3\",\"-m\",\"venv\",str(installer.INSTALL/\"venv\")])\n py=str(installer.INSTALL/\"venv/bin/python\")\n installer.run([py,\"-m\",\"pip\",\"check\"])\n check_script=\"import ast,json,sys,pathlib,httpx,jwt,cryptography,fastapi,uvicorn\\nsys.path.insert(0,\"+repr(str(SNAP))+\")\\nfrom deploy.enroll_owner import check_fresh_owner\\ncheck_fresh_owner()\\nfor p in pathlib.Path('/opt/analyst-ai/backend').rglob('*.py'):ast.parse(p.read_text())\\npinned=json.loads(pathlib.Path('/opt/analyst-ai/backend/telegram_jwks.json').read_text())\\nwith httpx.Client(timeout=httpx.Timeout(15,connect=5),verify=True,follow_redirects=False,trust_env=False) as client:\\n r=client.get('https://oauth.telegram.org/.well-known/jwks.json');r.raise_for_status();assert len(r.content)<=131072;live=r.json()\\nnormalize=lambda key:tuple(key.get(k) for k in ('kid','kty','alg','n','e'))\\nusable=[k for k in live.get('keys',[]) if k.get('kty')=='RSA' and k.get('alg')=='RS256']\\nassert usable and all(normalize(k) in [normalize(v) for v in usable] for k in pinned['keys']), 'pinned_telegram_keys_changed'\\nprint(json.dumps({'imports_passed':True,'python_ast_passed':True,'fresh_owner_guard_passed':True,'live_telegram_jwks_matches_pinned':True,'owner_binding_created':False,'app_database_created':False}))\"\n checked=subprocess.run([py,\"-I\",\"-B\",\"-c\",check_script],capture_output=True,text=True,timeout=45)\n if checked.returncode:raise RuntimeError(\"owner_preparation_imports_or_live_jwks_failed\")\n checks=json.loads(checked.stdout)\n draft=HANDOFF/\"owner.service.pending\"\n if not draft.exists():atomic(draft,(SNAP/\"deploy/analyst-ai-owner.service\").read_bytes())\n else:assert draft.read_bytes()==(SNAP/\"deploy/analyst-ai-owner.service\").read_bytes()\n caddy=Path(\"/etc/caddy/Caddyfile\");assert sha(caddy)==CADDY_SHA\n text=caddy.read_text()\n adapted=subprocess.run([\"caddy\",\"adapt\",\"--config\",str(caddy),\"--adapter\",\"caddyfile\"],capture_output=True,text=True,timeout=30)\n assert adapted.returncode==0\n current_json=json.loads(adapted.stdout)\n assert not current_json.get(\"logging\",{}).get(\"logs\",{}),\"existing_custom_logging_requires_review\"\n assert all(not server.get(\"logs\") for server in current_json.get(\"apps\",{}).get(\"http\",{}).get(\"servers\",{}).values()),\"existing_access_logging_requires_review\"\n logging=\"    log default {\\n        output discard\\n    }\\n\"\n if text.lstrip().startswith(\"{\"):\n  brace=text.index(\"{\")+1;text=text[:brace]+\"\\n\"+logging+text[brace:]\n else:text=\"{\\n\"+logging+\"}\\n\"+text\n before=HANDOFF/\"Caddyfile.before\"\n if not before.exists():atomic(before,caddy.read_bytes())\n else:assert sha(before)==CADDY_SHA\n marker=\"@public_updates\"\n start=text.index(marker);line_start=text.rfind(\"\\n\",0,start)+1\n indent=text[line_start:start]\n block=indent+\"@owner_enrollment {\\n\"+indent+\"    method GET\\n\"+indent+\"    path /auth/telegram/owner-enrollment/callback\\n\"+indent+\"}\\n\"+indent+\"handle @owner_enrollment {\\n\"+indent+\"    reverse_proxy 127.0.0.1:8765\\n\"+indent+\"}\\n\"\n prepared=HANDOFF/\"Caddyfile.enrollment\";content=(text[:line_start]+block+text[line_start:]).encode()\n if prepared.exists():assert prepared.read_bytes()==content\n else:atomic(prepared,content)\n installer.run([\"caddy\",\"validate\",\"--config\",str(prepared),\"--adapter\",\"caddyfile\"],timeout=30)\n adapted=subprocess.run([\"caddy\",\"adapt\",\"--config\",str(prepared),\"--adapter\",\"caddyfile\"],capture_output=True,text=True,timeout=30)\n assert adapted.returncode==0\n prepared_json=json.loads(adapted.stdout)\n logs=prepared_json.get(\"logging\",{}).get(\"logs\",{})\n assert logs.get(\"default\",{}).get(\"writer\",{}).get(\"output\")==\"discard\"\n assert all(v.get(\"writer\",{}).get(\"output\")==\"discard\" for v in logs.values())\n assert all(not server.get(\"logs\") for server in prepared_json.get(\"apps\",{}).get(\"http\",{}).get(\"servers\",{}).values())\n assert sha(caddy)==CADDY_SHA and not installer.STATE.exists() and not installer.INPUT_CONFIG.exists()\n data={\"schema_version\":1,\"phase\":\"prepared_dormant\",\"server_id\":9415007,\"source_sha256\":SOURCE,\"source_backup_commit\":\"50ea426d7a5849496c0077a59995930e51e3553e\",\"prepared_at\":stamp(),\"source_files\":len(manifest),\"source_manifest_sha256\":sha(HANDOFF/\"source-manifest.json\"),\"caddy_before_sha256\":sha(before),\"caddy_enrollment_sha256\":sha(prepared),\"backend_installed\":True,\"dependencies_checked\":True,\"enrollment_started\":False,\"owner_binding_created\":False,\"app_database_created\":False,**checks}\n atomic(HANDOFF/\"prerequisites.json\",(json.dumps(data,indent=2)+\"\\n\").encode())\n print(\"OWNER_HANDOFF_PREPARED=\"+json.dumps(data),flush=True)\n",timeout=420)
          origin="https://analyst-ai-2941515.twc1.net";digest="1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74";package="ru.omnicio.app.debug"
          with urllib.request.urlopen(urllib.request.Request(origin+"/client/update-policy?package_name="+package,headers={"X-Analyst-Version-Code":"36","X-Analyst-Package":package}),timeout=30) as r:
