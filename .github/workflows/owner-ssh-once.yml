name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import os,json,pathlib,subprocess,sqlite3,time,hashlib,importlib.util\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nprobe=\"import sys,json,subprocess;sys.path.insert(0,'deploy');import timeweb_workspace as m;print(json.dumps({'source_sha256':m.source_hash(),'git':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}))\"\nresult=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"python3\",\"-c\",probe],cwd=root,capture_output=True,text=True,check=True)\nprint(\"REDESIGN_SOURCE=\"+result.stdout.strip())\nfor unit in (\"analyst-ai-owner.service\",\"analyst-ai-updates.service\",\"analyst-workspace-check.service\",\"analyst-workspace-build.service\",\"analyst-workspace-runtime.service\"):\n r=subprocess.run([\"systemctl\",\"show\",unit,\"--property=ActiveState,SubState,MainPID,Result,MemoryCurrent\"],capture_output=True,text=True)\n print(\"REDESIGN_SERVICE=\"+json.dumps({\"unit\":unit,\"properties\":r.stdout.splitlines()}))\ndb=sqlite3.connect(\"file:/var/lib/analyst-ai/backend.db?mode=ro\",uri=True);db.execute(\"PRAGMA query_only=ON\")\ntables=[r[0] for r in db.execute(\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\")]\nprint(\"REDESIGN_DB_TABLES=\"+json.dumps(tables))\nfor table in tables:\n if any(s in table for s in (\"credential\",\"session\",\"ai_\",\"analysis\",\"error\",\"crash\",\"preference\",\"portfolio\")):\n  if not table.replace(\"_\",\"\").isalnum():continue\n  columns=[r[1:3] for r in db.execute('PRAGMA table_info(\"'+table+'\")')]\n  count=db.execute('SELECT count(*) FROM \"'+table+'\"').fetchone()[0]\n  print(\"REDESIGN_DB_SCHEMA=\"+json.dumps({\"table\":table,\"columns\":columns,\"count\":count}))\nenv=pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text()\nsettings={}\nfor line in env.splitlines():\n if \"=\" not in line or line.startswith(\"#\"):continue\n k,v=line.split(\"=\",1)\n if any(s in k for s in (\"SCHEDUL\",\"APPROV\",\"BUDGET\",\"AUTO\",\"TIMEWEB\",\"AI_\",\"TINKOFF\",\"TINVEST\",\"OPENAI\")):\n  settings[k]=v if (v in (\"true\",\"false\",\"0\",\"1\",\"0.0\") or k.endswith(\"_ENABLED\")) else bool(v.strip())\nprint(\"REDESIGN_CONFIG_FLAGS=\"+json.dumps(settings))\njournal=subprocess.run([\"journalctl\",\"-u\",\"analyst-ai-owner.service\",\"--since\",\"2026-10-25 08:00:00 UTC\",\"--no-pager\",\"-o\",\"json\"],capture_output=True,text=True,check=True)\nmessages=[json.loads(x).get(\"MESSAGE\",\"\") for x in journal.stdout.splitlines()]\npatterns=(\"Traceback\",\"ERROR\",\"Exception\",\"error\",\"failed\",\"CRITICAL\")\nprint(\"REDESIGN_BACKEND_LOG_COUNTS=\"+json.dumps({\"records\":len(messages),\"matches\":{p:sum(p in x for x in messages) for p in patterns}}))\nprint(\"REDESIGN_HW=\"+json.dumps({\"kvm\":pathlib.Path(\"/dev/kvm\").exists(),\"cpu_vmx\": \" vmx \" in pathlib.Path(\"/proc/cpuinfo\").read_text(),\"cpu_svm\":\" svm \" in pathlib.Path(\"/proc/cpuinfo\").read_text(),\"disk_free\":__import__(\"shutil\").disk_usage(root).free}))\nfor name in (\"check-result.json\",\"build-result.json\",\"runtime-result.json\"):\n path=pathlib.Path(\"/var/lib/analyst-ai-build\")/name\n if path.is_file():\n  data=json.loads(path.read_text());print(\"REDESIGN_RECEIPT=\"+json.dumps({\"file\":name,\"data\":data}))\n\napk=root/\"app/build/outputs/apk/preview/app-preview.apk\"\naapt=pathlib.Path(\"/opt/analyst-android-sdk/build-tools/37.0.0/aapt2\")\nif not aapt.exists():\n candidates=sorted(pathlib.Path(\"/opt/analyst-android-sdk/build-tools\").glob(\"*/aapt2\"));aapt=candidates[-1]\nr=subprocess.run([str(aapt),\"dump\",\"permissions\",str(apk)],capture_output=True,text=True,check=True)\nprint(\"REDESIGN_APK_PERMISSIONS=\"+json.dumps({\"sha256\":hashlib.sha256(apk.read_bytes()).hexdigest(),\"permissions\":r.stdout.splitlines()}))\nfor args in ([\"-no-window\",\"-help-all\"],[\"-no-window\",\"-qemu\",\"-h\"]):\n try:r=subprocess.run([\"/opt/analyst-android-sdk/emulator/emulator\",*args],capture_output=True,text=True,timeout=15)\n except subprocess.TimeoutExpired:print(\"REDESIGN_EMULATOR_HELP=\"+json.dumps({\"args\":args,\"timeout\":True}));continue\n lines=(r.stdout+r.stderr).splitlines()\n print(\"REDESIGN_EMULATOR_HELP=\"+json.dumps({\"args\":args,\"returncode\":r.returncode,\"relevant\":[x for x in lines if any(k in x.lower() for k in (\"tcg\",\"thread\",\"qemu\",\"engine\",\"version\",\"accel\",\"cpu\",\"kvm\"))][:90]}))\n",timeout=150)
          PY
