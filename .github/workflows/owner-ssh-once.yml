name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-cleanup-handoff
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Save cleanup proof and prepare the exact previous APK for Timeweb upgrade checks
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,json,os,pathlib,re,socket,subprocess,tempfile\nos.umask(0o077)\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\";android=root/\"analyst-ai-android-690811a5\"\ncleanup=json.loads((root/\"analyst-timeweb-cleanup.json\").read_text())\nassert cleanup[\"server_deletion_accepted\"] and cleanup[\"server_absent_from_complete_inventory\"] and cleanup[\"public_ip_absent_from_complete_inventory\"]\nartifact=root/\"analyst-ai-artifacts/previous-0.10.0.apk\"\nassert not artifact.is_symlink()\nif not artifact.exists():\n    partial=artifact.with_suffix(\".apk.part\");assert not partial.exists() and not partial.is_symlink()\n    result=subprocess.run([\"curl\",\"--fail\",\"--silent\",\"--show-error\",\"--location\",\"--proto\",\"=https\",\"--tlsv1.2\",\"--connect-timeout\",\"10\",\"--max-time\",\"90\",\"https://github.com/MishaGameHacking/omni-cio-gateway/releases/download/android-preview-0a894dddfa858efe6c7be60aea78935adec84c1b/Analyst-AI-0.10.0-preview-0a894dd.apk\",\"--output\",str(partial)],capture_output=True)\n    assert result.returncode==0,\"previous_apk_download_failed\"\n    assert partial.stat().st_size==4347764 and hashlib.sha256(partial.read_bytes()).hexdigest()==\"3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3\",\"previous_apk_identity_failed\"\n    os.replace(partial,artifact);artifact.chmod(0o600)\nassert artifact.stat().st_size==4347764 and hashlib.sha256(artifact.read_bytes()).hexdigest()==\"3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3\"\npreflight=subprocess.run([\"python3\",str(root/\"analyst-ai-source/deploy/install_owner_backend.py\"),\"--enroll-owner\"],capture_output=True,text=True,timeout=30)\nassert preflight.returncode==0 and \"configuration_and_sources_validated_only\" in preflight.stdout\nipv4=sorted({x[4][0] for x in socket.getaddrinfo(\"analyst-ai-2941515.twc1.net\",443,socket.AF_INET,socket.SOCK_STREAM)})\nassert ipv4==[\"201.24.52.66\"]\nprobes=[]\nfor attempt in range(6):\n    result=subprocess.run([\"curl\",\"--ipv4\",\"--fail\",\"--silent\",\"--show-error\",\"--connect-timeout\",\"5\",\"--max-time\",\"10\",\"https://oauth.telegram.org/.well-known/jwks.json\"],capture_output=True,timeout=15)\n    valid=False\n    if result.returncode==0:\n        try:\n            document=json.loads(result.stdout)\n            valid=isinstance(document.get(\"keys\"),list) and len(document[\"keys\"])>0 and all(k.get(\"kty\")==\"RSA\" and k.get(\"kid\") for k in document[\"keys\"])\n        except (ValueError,TypeError):pass\n    probes.append({\"attempt\":attempt+1,\"curl_exit\":result.returncode,\"valid_jwks\":bool(valid)})\nhost=re.search(r'const val HOST = \"([^\"]+)\"',(android/\"app/src/main/java/ru/omnicio/app/data/backend/BackendConfig.kt\").read_text()).group(1)\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"server_id\":9413105,\"retired_vm_id\":9408159,\"old_vm_and_ip_deleted\":True,\"dns_ipv4\":ipv4,\"enrollment_preflight_passed\":True,\"owner_binding_present\":(root/\"analyst-ai-owner.json\").exists(),\"backend_service_installed\":pathlib.Path(\"/etc/systemd/system/analyst-ai-owner.service\").exists(),\"candidate_backend_host\":host,\"previous_apk_sha256\":hashlib.sha256(artifact.read_bytes()).hexdigest(),\"previous_apk_ready_for_upgrade_test\":True,\"telegram_jwks_probes\":probes,\"working_release_published\":False}\ntarget=root/\"analyst-timeweb-next-release-readiness.json\";target.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nheading=\"## OWNER 24.10.2026 — очистка ресурсов и фактический статус обновления\"\nnote=heading+\"\\n\\nВладелец потребовал оставить только ресурсы для разработки и запуска; вся разработка, сборка и проверки выполняются на Timeweb, GitHub используется для резервного копирования и ранее разрешённого API/SSH-транспорта. Постоянный сервер приложения: Москва, 9413105, 201.24.52.66, 1 CPU / 1 ГБ / 15 ГБ.\\n\\nПосле проверки переноса исходников, исходного ключа подписи и APK дополнительно перенесены 103 файла Android outputs/test reports, 255205115 байт; все размеры и SHA-256 совпали. Старый NL сервер 9408159 удалён HTTP204, его IP 201.34.146.244 освобождён; оба отсутствуют в полных перечнях API. Оставлен заказ московского сервера 121673 для обязательных Android/KVM проверок; последняя проверка API: installing, IP ещё не назначен. Готовность оборудования и KVM не объявляется.\\n\\nУстановленный 0.10.0 /34 содержит прежний адрес 176.98.178.81.sslip.io; удаление прежнего сервера разорвало путь самостоятельного обновления. Нужен совместимый APK с проверенным новым origin, прежними package и подписью, установленный поверх существующей версии. Эталонный APK 0.10.0 сохранён на Timeweb для проверки обновления, SHA-256 \"+report[\"previous_apk_sha256\"]+\".\\n\\n0.11.0-preview /35 собран на Timeweb, но не выпущен и пока содержит backend-not-configured.invalid. Не выдавать его за рабочее приложение. На head690811a5 Sonar и backend checks успешны; Android runtime run39993098373 завершился ошибкой Native cursor did not move within the unsent question в strategy/ready/font200. Сообщение общего helper относится здесь к полю горизонта стратегии. Без воспроизведения и полной матрицы API37/4096/16384 ошибка не считается исправленной. Реальный вход владельца, HTTPS, рабочий ключ AI Gateway и проверка телефона также не подтверждены.\\n\\nВ ходе инвентаризации диагностический run40088233675 ошибочно вывел приватные SSH-поля API Timeweb. Журнал удалён; SSH host keys обеих затронутых машин заменены, соединения с новыми закреплёнными ключами проверены, пароль root заблокирован и password/kbdinteractive login отключены. Ключ подписи APK не выводился и сохранён. Старый сервер затем удалён. Не выводить полные ответы projects/resources или servers: только явный список безопасных полей.\\n\\nАктуальная проверка DNS/предварительной установки и Telegram: \"+json.dumps({\"dns_ipv4\":ipv4,\"enrollment_preflight_passed\":True,\"telegram_jwks_probes\":probes},ensure_ascii=False)+\".\\n\"\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=repo/rel;text=path.read_text()\n    assert heading not in text\n    if rel==\"AGENTS.md\":\n        old=\"- Не блокировать ориентацию/размер окна. Проверять поворот, split-screen, большой шрифт, отмену жеста, возобновление и потерю процесса.\"\n        text=text.replace(old,\"- Приложение строго портретное по прямому указанию OWNER 23–24.10.2026. Поворот устройства не переводит приложение в горизонтальный режим. Проверять сохранение портретного режима, большой шрифт, отмену жеста, возобновление и потерю процесса.\")\n    path.write_text(text.rstrip()+\"\\n\\n\"+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"TIMEWEB_RELEASE_READINESS=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=240).decode()
                      print(output,end="",flush=True)
                      docs=json.loads(p.remote(command,"python3 -c "+shlex.quote("import json,pathlib\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\"\nsecret=json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"TELEGRAM_CLIENT_SECRET\"]\nfiles={rel:(repo/rel).read_text() for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\")}\nassert all(secret not in text and \"-----BEGIN OPENSSH PRIVATE KEY-----\" not in text and \"-----BEGIN PRIVATE KEY-----\" not in text for text in files.values())\nprint(json.dumps(files))\n"),timeout=30))
                      assert set(docs)=={"AGENTS.md","docs/MASTER_PLAN.md","docs/PLAN_STATUS.md"}
                      def gh(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"+path,method=method,data=data,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              raw=response.read(4*1024*1024+1)
                          return json.loads(raw) if raw else {}
                      empty=gh("GET","/releases/419287182")
                      assert empty["draft"] is True and empty["tag_name"]=="ci-transfer-39564974948-1" and empty["assets"]==[]
                      run=gh("GET","/actions/runs/39564974948")
                      assert run["status"]=="completed"
                      gh("DELETE","/releases/419287182")
                      print("EMPTY_OBSOLETE_TRANSFER_DRAFT_DELETED=419287182",flush=True)
                      ref=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert ref["object"]["sha"]==os.environ["GITHUB_SHA"],"backup_ref_changed"
                      commit=gh("GET","/git/commits/"+ref["object"]["sha"])
                      tree=gh("POST","/git/trees",{"base_tree":commit["tree"]["sha"],"tree":[{"path":path,"mode":"100644","type":"blob","content":text} for path,text in docs.items()]})
                      backed=gh("POST","/git/commits",{"message":"Back up Timeweb cleanup evidence and current owner instructions","tree":tree["sha"],"parents":[ref["object"]["sha"]]})
                      current=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert current["object"]["sha"]==ref["object"]["sha"],"backup_ref_changed"
                      gh("PATCH","/git/refs/heads/codex/timeweb-owner-prepare-2026-10-23",{"sha":backed["sha"],"force":False})
                      print("TIMEWEB_DOCUMENT_BACKUP="+json.dumps({"sha":backed["sha"],"tree":tree["sha"],"files":sorted(docs),"edited_on":"Timeweb 9413105"}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
