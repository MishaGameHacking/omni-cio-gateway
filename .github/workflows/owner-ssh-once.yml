name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess,json,pathlib\nrunner=\"import datetime,fcntl,hashlib,json,os,pathlib,struct,subprocess,sys,time,traceback,urllib.request\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\");state=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nsys.path.insert(0,str(root/\\\"deploy\\\"));import timeweb_workspace as workspace\\nfolder=state/\\\"runs\\\"/(\\\"host-appearance-\\\"+datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%SZ\\\"))\\nfolder.mkdir(parents=True,exist_ok=False);report={\\\"kind\\\":\\\"host-layoutlib-synthetic-fixtures\\\",\\\"android_runtime_pass\\\":False,\\\"status\\\":\\\"running\\\",\\\"started_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"log_directory\\\":str(folder)}\\nresult=state/\\\"host-appearance-result.json\\\"\\ndef save():\\n temp=result.with_suffix(\\\".next\\\");temp.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");os.replace(temp,result)\\nsave()\\ntry:\\n with (state/\\\"workspace.lock\\\").open(\\\"a\\\") as lock:\\n  fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n  workspace.require_capacity(\\\"build\\\")\\n  report[\\\"source_before\\\"]=workspace.source_hash();save()\\n  env=dict(os.environ);env.update({\\\"ANDROID_HOME\\\":\\\"/opt/analyst-android-sdk\\\",\\\"ANDROID_SDK_ROOT\\\":\\\"/opt/analyst-android-sdk\\\",\\\"GRADLE_USER_HOME\\\":\\\"/var/cache/analyst-ai/gradle\\\",\\\"JAVA_HOME\\\":\\\"/usr/lib/jvm/java-17-openjdk-amd64\\\",\\\"TZ\\\":\\\"UTC\\\",\\\"PYTHONUNBUFFERED\\\":\\\"1\\\"})\\n  extra=[]\\n  try:\\n   with urllib.request.urlopen(\\\"https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.pom\\\",timeout=10) as response:assert b\\\"<artifactId>junit</artifactId>\\\" in response.read(100000)\\n  except Exception:\\n   with urllib.request.urlopen(\\\"https://maven-central.storage-download.googleapis.com/maven2/junit/junit/4.13.2/junit-4.13.2.pom\\\",timeout=15) as response:assert b\\\"<artifactId>junit</artifactId>\\\" in response.read(100000)\\n   init=folder/\\\"maven-mirror.init.gradle\\\"\\n   init.write_text(\\\"settingsEvaluated { s -> [s.pluginManagement.repositories,s.dependencyResolutionManagement.repositories].each { rs -> rs.each { r -> if (r instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && r.url.host == 'repo.maven.apache.org') r.setUrl('https://maven-central.storage-download.googleapis.com/maven2/') } } }\\\\n\\\")\\n   extra=[\\\"--init-script\\\",str(init)]\\n  references=root/\\\"app/src/screenshotTestDebug/reference\\\"\\n  if references.exists():\\n   assert references.is_dir() and not references.is_symlink(),\\\"unexpected_reference_path\\\"\\n   os.replace(references,folder/\\\"references-before-render\\\")\\n  log=folder/\\\"gradle-render.log\\\";before=time.time()\\n  command=[\\\"./gradlew\\\",\\\":app:updateDebugScreenshotTest\\\",\\\"--rerun-tasks\\\",\\\"--no-build-cache\\\",\\\"--no-daemon\\\",\\\"--max-workers=1\\\",\\\"--no-parallel\\\",\\\"--stacktrace\\\",\\\"--write-locks\\\",\\\"-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8\\\",*extra]\\n  with log.open(\\\"w\\\") as stream:code=subprocess.run(command,cwd=root,env=env,stdout=stream,stderr=subprocess.STDOUT,timeout=1800).returncode\\n  report[\\\"exit_code\\\"]=code;report[\\\"log\\\"]=str(log);report[\\\"source_after\\\"]=workspace.source_hash()\\n  if code:raise RuntimeError(\\\"host_layoutlib_render_failed\\\")\\n  references=root/\\\"app/src/screenshotTestDebug/reference\\\"\\n  files=sorted(references.rglob(\\\"*.png\\\"));assert len(files)==16,\\\"expected_sixteen_actual_images\\\"\\n  images=[]\\n  for p in files:\\n   raw=p.read_bytes();assert len(raw)>5000 and raw[:8]==b\\\"\\\\x89PNG\\\\r\\\\n\\\\x1a\\\\n\\\" and p.stat().st_mtime>=before,\\\"missing_or_stale_image\\\"\\n   width,height=struct.unpack(\\\">II\\\",raw[16:24]);images.append({\\\"path\\\":str(p.relative_to(root)),\\\"bytes\\\":len(raw),\\\"sha256\\\":hashlib.sha256(raw).hexdigest(),\\\"width\\\":width,\\\"height\\\":height})\\n  report[\\\"images\\\"]=images;report[\\\"status\\\"]=\\\"rendered_pending_visual_review\\\"\\nexcept BaseException as error:\\n report[\\\"status\\\"]=\\\"failed\\\";report[\\\"error\\\"]=str(error);report[\\\"error_type\\\"]=type(error).__name__\\n (folder/\\\"failure.log\\\").write_text(traceback.format_exc())\\nfinally:\\n report[\\\"finished_at\\\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\\n print(\\\"HOST_APPEARANCE_RESULT=\\\"+json.dumps(report),flush=True)\\nif report[\\\"status\\\"]==\\\"failed\\\":raise SystemExit(1)\\n\"\nold=\"analyst-host-appearance-38.service\";new=\"analyst-host-appearance-38-v2.service\"\nprops=subprocess.run([\"systemctl\",\"show\",old,\"-p\",\"MemoryMax\",\"-p\",\"MemoryHigh\",\"-p\",\"TasksMax\",\"-p\",\"CPUQuotaPerSecUSec\",\"-p\",\"User\",\"-p\",\"Group\"],capture_output=True,text=True,check=True,timeout=10).stdout\nsettings=dict(line.split(\"=\",1) for line in props.splitlines() if \"=\" in line)\nassert settings[\"User\"]==\"analyst-build\"\nlimit=settings.get(\"MemoryMax\",\"\")\nassert limit.isdigit() and 2147483648<=int(limit)<=5033164800,\"unexpected_host_memory_limit\"\nargs=[\"systemd-run\",\"--unit=\"+new,\"--uid=analyst-build\",\"--gid=analyst-build\",\"--working-directory=/srv/analyst-ai/workspace\",\"--property=MemoryMax=\"+limit,\"--property=RuntimeMaxSec=1800\",\"--property=RemainAfterExit=yes\",\"--property=KillMode=control-group\"]\nfor key in (\"MemoryHigh\",\"TasksMax\"):\n if settings.get(key,\"\").isdigit():args.append(\"--property=\"+key+\"=\"+settings[key])\nargs+=[\"/usr/bin/python3\",\"-c\",runner]\nr=subprocess.run(args,capture_output=True,text=True,timeout=20)\nif r.returncode:print(r.stderr[-2000:],flush=True);raise RuntimeError(\"host_render_v2_start_failed\")\nprint(\"REDESIGN_HOST_RESTARTED=\"+json.dumps({\"unit\":new,\"source_execution_user\":\"analyst-build\",\"expected_images\":16,\"memory_max\":int(limit),\"old_unit_retained\":True}),flush=True)\n",timeout=180)
          PY
