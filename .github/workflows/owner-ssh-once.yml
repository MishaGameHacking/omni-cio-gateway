name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("DISCOVERY_PAYLOAD=\"\"\nimport pathlib,json,hashlib,base64,zlib,subprocess,shutil,os,datetime,urllib.request\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nencoded=DISCOVERY_PAYLOAD.encode(\"ascii\")\nassert hashlib.sha256(encoded).hexdigest()==\"583da00ade1f4b71505b116410b5436e7724af0fc916b1de163ac94d7a95802a\"\ncode=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(code).hexdigest()==\"9465ea43faacccdb6e78d5a8c1b96c0f1c471b737c8f186dfcf42de23caa7f21\"\nenv={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n key,value=line.split(\"=\",1);assert key not in env\n env[key]=json.loads(value) if value.startswith('\"') else value\nenv.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nrunuser=shutil.which(\"runuser\");assert runuser\np=subprocess.run([runuser,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=code.decode(),text=True,cwd=\"/opt/analyst-ai/backend\",env=env,capture_output=True,timeout=45)\nlines=[line for line in p.stdout.splitlines() if line.startswith(\"REDESIGN_DISCOVERY_READONLY=\")]\nassert len(lines)==1,\"discovery_probe_receipt_missing\"\nvalue=json.loads(lines[0].split(\"=\",1)[1]);value[\"observed_at\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\nprint(\"REDESIGN_DISCOVERY_READONLY=\"+json.dumps(value),flush=True)\nprint(\"REDESIGN_DISCOVERY_PROBE_EXIT=\"+str(p.returncode),flush=True)\ntarget=state/\"discovery-redesign-result.json\";tmp=target.with_suffix(\".next\");tmp.write_text(json.dumps(value,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,target)\nwith urllib.request.urlopen(\"https://analyst-ai-2941515.twc1.net/health\",timeout=15) as response:\n body=json.loads(response.read(1024));assert response.status==200 and body=={\"status\":\"ok\"}\n print(\"REDESIGN_HEALTH_DURING_DIAGNOSTIC=\"+json.dumps({\"status\":response.status}),flush=True)\n\nimport pathlib,json,subprocess,hashlib,datetime\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nunit=\"analyst-boot-evidence-38-20261025-v2.service\"\nr=subprocess.run([\"systemctl\",\"show\",unit,\"--property=ActiveState,SubState,Result,ExecMainStatus,MemoryCurrent,MemoryPeak,CPUUsageNSec\"],capture_output=True,text=True,timeout=10)\nprint(\"REDESIGN_BOOT_UNIT=\"+json.dumps(r.stdout),flush=True)\nmatches=sorted((state/\"diagnostics\").glob(\"boot-evidence-*\"))\nif not matches:\n print(\"REDESIGN_BOOT_PENDING=\"+json.dumps({\"reason\":\"diagnostic_directory_not_created\"}),flush=True);raise SystemExit(0)\ndirectory=matches[-1]\nassert directory.is_dir() and not directory.is_symlink()\nresult=json.loads((directory/\"result.json\").read_text())\nprint(\"REDESIGN_BOOT_RESULT=\"+json.dumps(result),flush=True)\ninfo=[]\nfor name in (\"samples.jsonl\",\"emulator.log\",\"guest-all.log\",\"guest-all.stderr.log\",\"emulator.stderr.log\",\"avd-config.ini\"):\n p=directory/name\n if p.is_file():\n  raw=p.read_bytes();info.append({\"name\":name,\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest()})\nprint(\"REDESIGN_BOOT_FILES=\"+json.dumps(info),flush=True)\nprint(\"REDESIGN_BOOT_DIRECTORY=\"+json.dumps(str(directory)),flush=True)\n",timeout=150)
          PY
