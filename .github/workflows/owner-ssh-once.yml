name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-reviewed-empty-install-recovery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Prepare and validate recovery of the failed empty installation without changing it
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      reference="fd01d2ac090103cf64557c97aeaf36bc290e2cec"
                      paths=subprocess.check_output(["git","ls-tree","-r","--name-only",reference],text=True).splitlines()
                      selected=[path for path in paths if (path.startswith("backend/") and pathlib.PurePosixPath(path).parent==pathlib.PurePosixPath("backend") and (path.endswith((".py",".json")) or path=="backend/requirements.txt")) or path in {"backend/certs/russian_trusted_root_ca.pem","deploy/install_owner_backend.py","deploy/enroll_owner.py","deploy/analyst-ai-owner.service"}]
                      expected={path:hashlib.sha256(subprocess.check_output(["git","show",reference+":"+path])).hexdigest() for path in selected}
                      assert len(expected)>30
                      script="import pathlib,py_compile,subprocess\nwork=pathlib.Path(\"/root/analyst-owner-login-relay-20261024\")\npath=work/\"prepare_fresh_retry.py\"\nassert not path.exists()\npath.write_text(\"EXPECTED=\"+repr(EXPECTED)+\"\\n\"+\"\\\"\\\"\\\"Recover only this proven empty pre-enrollment installation after TLS succeeds.\\\"\\\"\\\"\\nimport argparse,datetime,grp,hashlib,json,os,pathlib,pwd,subprocess,sys\\nROOT=pathlib.Path(\\\"/root\\\")\\nSOURCE=ROOT/\\\"analyst-ai-source\\\"\\nWORK=ROOT/\\\"analyst-owner-login-relay-20261024\\\"\\nfor relative,digest in EXPECTED.items():\\n    path=SOURCE/relative\\n    assert path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==digest,\\\"reviewed_source_changed\\\"\\nsys.path.insert(0,str(SOURCE))\\nfrom deploy import install_owner_backend as installer\\nHOST=\\\"analyst-ai-2941515.twc1.net\\\"\\ndef command(args,check=True):\\n    return subprocess.run(args,capture_output=True,text=True,timeout=45,check=check)\\ndef preflight():\\n    assert os.geteuid()==0\\n    evidence=json.loads((WORK/\\\"state.json\\\").read_text())\\n    assert evidence[\\\"phase\\\"]==\\\"installation_stopped\\\" and \\\"OWNER_BACKEND_INSTALL_ERROR=enrollment_tls_probe_failed\\\" in evidence[\\\"fixed_errors\\\"]\\n    assert not installer.INPUT_CONFIG.exists() and not installer.INPUT_CONFIG.is_symlink()\\n    assert not installer.UNIT.exists() and not installer.UNIT.is_symlink()\\n    assert not (installer.CONFIG/\\\"backend.env\\\").exists()\\n    assert installer.STATE.is_dir() and not installer.STATE.is_symlink() and not any(installer.STATE.iterdir())\\n    assert {path.name for path in installer.CONFIG.iterdir()}=={\\\"Caddyfile\\\"}\\n    assert (installer.CONFIG/\\\"Caddyfile\\\").read_text()==installer.caddy_text(HOST,enrollment=True)\\n    assert {path.name for path in installer.CADDY_DROPIN.parent.iterdir()}=={installer.CADDY_DROPIN.name}\\n    assert not list((installer.INSTALL/\\\"backend\\\").rglob(\\\"*.db\\\"))\\n    for path in installer.source_files():\\n        copied=installer.INSTALL/\\\"backend\\\"/path.relative_to(SOURCE/\\\"backend\\\")\\n        assert copied.is_file() and not copied.is_symlink() and hashlib.sha256(copied.read_bytes()).digest()==hashlib.sha256(path.read_bytes()).digest()\\n    account=pwd.getpwnam(\\\"analyst-ai\\\")\\n    assert account.pw_uid>0 and account.pw_dir==str(installer.STATE) and account.pw_shell==\\\"/usr/sbin/nologin\\\"\\n    assert command([\\\"pgrep\\\",\\\"-u\\\",str(account.pw_uid)],check=False).returncode==1,\\\"application_user_process_present\\\"\\n    group=grp.getgrgid(account.pw_gid)\\n    assert group.gr_name==\\\"analyst-ai\\\" and not group.gr_mem\\n    assert all(user.pw_name==\\\"analyst-ai\\\" or user.pw_gid!=account.pw_gid for user in pwd.getpwall())\\n    socket=WORK/\\\"tmux.sock\\\"\\n    dead=command([\\\"tmux\\\",\\\"-S\\\",str(socket),\\\"display-message\\\",\\\"-p\\\",\\\"-t\\\",\\\"owner:0.0\\\",\\\"#{pane_dead}\\\"]).stdout.strip()\\n    assert dead==\\\"1\\\",\\\"old_installer_still_active\\\"\\n    paths=[installer.INSTALL,installer.CONFIG,installer.STATE,pathlib.Path(\\\"/etc/caddy\\\"),installer.CADDY_DROPIN.parent]\\n    assert all(path.is_dir() and not path.is_symlink() and path.stat().st_dev==ROOT.stat().st_dev for path in paths)\\n    return paths\\ndef prepare():\\n    paths=preflight()\\n    certificate=json.loads((WORK/\\\"certificate-retry.json\\\").read_text())\\n    assert certificate.get(\\\"tls_verified\\\") is True and certificate.get(\\\"original_logging_restored\\\") is True,\\\"verified_certificate_required\\\"\\n    assert installer.enrollment_tls_ready(HOST),\\\"current_verified_tls_required\\\"\\n    archive=ROOT/\\\"analyst-empty-install-before-tls-retry-20261024\\\"\\n    assert not archive.exists() and not archive.is_symlink()\\n    command([\\\"systemctl\\\",\\\"stop\\\",\\\"caddy\\\"])\\n    command([\\\"tmux\\\",\\\"-S\\\",str(WORK/\\\"tmux.sock\\\"),\\\"kill-server\\\"])\\n    archive.mkdir(mode=0o700)\\n    names=(\\\"installed-code\\\",\\\"configuration\\\",\\\"empty-application-state\\\",\\\"packaged-caddy-configuration\\\",\\\"caddy-unit-override\\\")\\n    for path,name in zip(paths,names):\\n        os.rename(path,archive/name)\\n    command([\\\"userdel\\\",\\\"analyst-ai\\\"])\\n    try:group=grp.getgrnam(\\\"analyst-ai\\\")\\n    except KeyError:pass\\n    else:\\n        assert not group.gr_mem and not any(user.pw_gid==group.gr_gid for user in pwd.getpwall())\\n        command([\\\"groupdel\\\",\\\"analyst-ai\\\"])\\n    command([\\\"systemctl\\\",\\\"daemon-reload\\\"])\\n    installer.check_target()\\n    report={\\\"server_id\\\":9413105,\\\"prepared_at_utc\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"fresh_install_target_verified\\\":True,\\\"owner_configuration_preserved_absent\\\":not installer.INPUT_CONFIG.exists(),\\\"certificate_storage_preserved\\\":True,\\\"archived_paths\\\":[str(path) for path in paths],\\\"archive\\\":str(archive)}\\n    path=WORK/\\\"fresh-retry-preparation.json\\\";path.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");path.chmod(0o600)\\n    print(\\\"TIMEWEB_FRESH_RETRY_PREPARED=\\\"+json.dumps(report),flush=True)\\nif __name__==\\\"__main__\\\":\\n    parser=argparse.ArgumentParser();parser.add_argument(\\\"--prepare\\\",action=\\\"store_true\\\");options=parser.parse_args()\\n    if options.prepare:prepare()\\n    else:\\n        paths=preflight()\\n        print(\\\"TIMEWEB_FRESH_RETRY_PREFLIGHT=\\\"+json.dumps({\\\"read_only\\\":True,\\\"empty_pre_enrollment_state_verified\\\":True,\\\"paths_checked\\\":len(paths),\\\"certificate_storage_excluded\\\":True}),flush=True)\\n\");path.chmod(0o600)\npy_compile.compile(str(path),doraise=True)\nresult=subprocess.run([\"/root/analyst-ai-development-venv/bin/python\",str(path)],capture_output=True,text=True,timeout=60)\nif result.returncode:\n    log=work/\"fresh-retry-preflight-error.log\";log.write_text(result.stdout+result.stderr);log.chmod(0o600)\n    print(\"TIMEWEB_FRESH_RETRY_PREFLIGHT_FAILED=true\",flush=True)\nelse:print(result.stdout,end=\"\",flush=True)\n"
                      script='EXPECTED='+repr(expected)+'\n'+script
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=180).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
