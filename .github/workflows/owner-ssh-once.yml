name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nscript=\"import base64,errno,hashlib,importlib.util,json,os,socket,subprocess,sys,time,uuid\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\nstate=json.loads((ROOT/\\\"state.json\\\").read_text())\\nassert state[\\\"phase\\\"]==\\\"cancelled\\\" and state[\\\"caddy_restored\\\"] is True and state[\\\"authorization_url\\\"] is None and state[\\\"candidate\\\"] is None\\nunit=subprocess.run([\\\"systemctl\\\",\\\"show\\\",\\\"analyst-owner-enrollment.service\\\",\\\"--property=ActiveState,SubState,MainPID,Result,ExecMainStatus\\\"],capture_output=True,text=True,check=True,timeout=10)\\nprops=dict(line.split(\\\"=\\\",1) for line in unit.stdout.splitlines() if \\\"=\\\" in line)\\nassert props[\\\"ActiveState\\\"] in (\\\"inactive\\\",\\\"failed\\\") and props[\\\"MainPID\\\"]==\\\"0\\\"\\nlisteners=subprocess.run([\\\"ss\\\",\\\"-H\\\",\\\"-ltn\\\",\\\"sport = :8765\\\"],capture_output=True,text=True,check=True,timeout=10)\\nassert not listeners.stdout.strip(),\\\"callback_listener_still_present\\\"\\nconnections=subprocess.run([\\\"ss\\\",\\\"-H\\\",\\\"-tan\\\",\\\"sport = :8765\\\"],capture_output=True,text=True,check=True,timeout=10)\\nconnection_states={}\\nfor line in connections.stdout.splitlines():\\n name=line.split()[0];connection_states[name]=connection_states.get(name,0)+1\\nwith socket.socket() as sock:\\n sock.settimeout(2);connect_result=sock.connect_ex((\\\"127.0.0.1\\\",8765))\\nassert connect_result==errno.ECONNREFUSED\\nwith socket.socket() as sock:sock.bind((\\\"127.0.0.1\\\",8765))\\nassert hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()==\\\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\\\"\\nspec=importlib.util.spec_from_file_location(\\\"handoff\\\",ROOT/\\\"controller.py\\\")\\ncontroller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)\\ncontroller.prerequisites();controller.verify_sources().check_fresh_owner()\\ntest=json.loads((ROOT/\\\"selftest.json\\\").read_text());assert test[\\\"passed\\\"] is True\\nassert not Path(\\\"/var/lib/analyst-ai\\\").exists()\\nreport={\\\"controller_sha256\\\":hashlib.sha256((ROOT/\\\"controller.py\\\").read_bytes()).hexdigest(),\\\"selftest_passed\\\":True,\\\"callback_proxy_reached_original_guard\\\":True,\\\"invalid_callback_did_not_consume_flow\\\":True,\\\"callback_probe_run\\\":40168984481,\\\"cancel_stopped_listener\\\":True,\\\"port_connect_refused\\\":True,\\\"port_available_for_next_flow\\\":True,\\\"remaining_connection_states\\\":connection_states,\\\"caddy_restored\\\":True,\\\"ota_version\\\":37,\\\"owner_binding_created\\\":False,\\\"database_created\\\":False,\\\"normal_owner_service_created\\\":False,\\\"completed_at\\\":int(time.time())}\\ncontroller.save_json(ROOT/\\\"controller-verification.json\\\",report)\\nsubprocess.run([\\\"systemctl\\\",\\\"reset-failed\\\",\\\"analyst-owner-enrollment.service\\\"],check=True,timeout=10)\\nprint(\\\"OWNER_CONTROLLER_VERIFIED=\\\"+json.dumps(report),flush=True)\\ndef emit_envelope(payload,kind,session_id,expires_at,sequence):\\n from cryptography.hazmat.primitives import hashes,serialization\\n from cryptography.hazmat.primitives.asymmetric import padding,rsa\\n from cryptography.hazmat.primitives.ciphers.aead import AESGCM\\n public_pem=\\\"-----BEGIN PUBLIC KEY-----\\\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvyc8WS9TUYJmZMdZ/a/N\\\\nCkhaF5DsJErf0rHb3Bs8YXcRYuvhyMhp/qjpKPjsuXjvv4lnOjCU1EVgqK9r4mDU\\\\nYpInURKRL7P7ok+liyM/q9pHDFvDBAejaGw0Ume2CDbwlQM18IyWk7IQyLygqvzJ\\\\nKDz5lHQellXk6g7LMswtALK20bluAEDX/XEedNmuTNOCBvGIWZ7yFuOM1Qz3QK8c\\\\nq44tXPKCGMipxZPwIPl2Npyh5YSZUA2SjcLSbMM1TFiQQN+aJEa/adM+18Ql8Wkk\\\\nnbFPqeTalrJveZfTbj18fTBbdi7ERIMA4EG1tBa76FJX3kAliJ9ZKWXZKOVWvsFN\\\\ncJZ5zV4gaOxyU4SqxEtpvDePIt5H+s85KtpU02hv/E99PhJfgwpgbeZpG9vnU/V9\\\\n61CzSivNnyoMurSIc38BkILYMjWCWYcP1n0lHUrhWNtEisMCkl37CcWE6Esp/mbz\\\\n8MaF1cZWvco6uRBM/DDIAWbKIyGlKicfmGb9yRj8ujK9AgMBAAE=\\\\n-----END PUBLIC KEY-----\\\\n\\\".encode()\\n recipient=\\\"8b6ae36e28368f425f5e619b63e143e8535302a2475a9d525be3858713f16d06\\\"\\n assert hashlib.sha256(public_pem).hexdigest()==recipient\\n public=serialization.load_pem_public_key(public_pem)\\n assert isinstance(public,rsa.RSAPublicKey) and public.key_size==3072\\n meta={\\\"version\\\":1,\\\"purpose\\\":\\\"analyst-owner-handoff\\\",\\\"server_id\\\":9415007,\\\"origin\\\":\\\"https://analyst-ai-2941515.twc1.net\\\",\\\"session_id\\\":session_id,\\\"expires_at\\\":expires_at,\\\"kind\\\":kind,\\\"sequence\\\":sequence,\\\"recipient_sha256\\\":recipient}\\n aad=json.dumps(meta,sort_keys=True,separators=(\\\",\\\",\\\":\\\")).encode()\\n raw=json.dumps(payload,sort_keys=True,separators=(\\\",\\\",\\\":\\\"),ensure_ascii=True).encode();assert len(raw)<=16384\\n key=os.urandom(32);nonce=os.urandom(12)\\n cipher=AESGCM(key).encrypt(nonce,raw,aad)\\n wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=b\\\"analyst-owner-handoff/v1\\\"))\\n out={\\\"metadata\\\":meta,\\\"wrapped_key\\\":base64.b64encode(wrapped).decode(),\\\"nonce\\\":base64.b64encode(nonce).decode(),\\\"ciphertext\\\":base64.b64encode(cipher).decode()}\\n print(\\\"OWNER_HANDOFF_ENVELOPE=\\\"+json.dumps(out,separators=(\\\",\\\",\\\":\\\")),flush=True)\\n\\nemit_envelope({\\\"transport\\\":\\\"ready\\\",\\\"probe\\\":\\\"private-owner-handoff-v1\\\"},\\\"probe\\\",str(uuid.uuid4()),int(time.time())+300,1)\\n\"\nresult=subprocess.run([\"/opt/analyst-ai/venv/bin/python\",\"-I\",\"-B\",\"-c\",script],timeout=60)\nraise SystemExit(result.returncode)\n",timeout=120)
          origin="https://analyst-ai-2941515.twc1.net";digest="1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74";package="ru.omnicio.app.debug"
          with urllib.request.urlopen(urllib.request.Request(origin+"/client/update-policy?package_name="+package,headers={"X-Analyst-Version-Code":"36","X-Analyst-Package":package}),timeout=30) as r:
              policy=json.loads(r.read(16385));assert r.status==200 and policy["version_code"]==37 and policy["apk_sha256"]==digest
          h=hashlib.sha256();size=0
          with urllib.request.urlopen(origin+policy["apk_path"]+"?package_name="+package,timeout=60) as r:
              assert r.status==200
              for b in iter(lambda:r.read(1048576),b""):h.update(b);size+=len(b);assert size<=29820366
          assert h.hexdigest()==digest and size==29820366
          print("EXTERNAL_RUNNER_OTA_VERIFIED="+json.dumps({"version_code":37,"apk_sha256":digest,"apk_bytes":size,"https_status":200}),flush=True)
          PY
