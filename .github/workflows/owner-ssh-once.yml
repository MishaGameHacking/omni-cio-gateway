name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import pathlib,subprocess,json,shutil,datetime\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nbackup=pathlib.Path(\"/root/analyst-redesign-20261024/before-live-sync\");backup.mkdir(mode=0o700,exist_ok=True)\nfor stage in (\"check\",\"build\"):\n    active=subprocess.check_output([\"systemctl\",\"show\",\"analyst-workspace@\"+stage+\".service\",\"-p\",\"ActiveState\",\"--value\"],text=True).strip()\n    assert active!=\"activating\",\"stage_running\"\nchanges=[]\ndef put(name,text):\n    p=root/name\n    if p.exists() and p.read_text()==text:return\n    if p.exists():\n        save=backup/name;save.parent.mkdir(parents=True,exist_ok=True)\n        if not save.exists():shutil.copy2(p,save)\n    p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\n    shutil.chown(p,user=\"analyst-build\",group=\"analyst-build\");changes.append(name)\ndef edit(name,fn):put(name,fn((root/name).read_text()))\nfor name,value in json.loads(\"{\\\"backend/volume_live.py\\\":\\\"\\\\\\\"\\\\\\\"\\\\\\\"Authenticated live invalidation; no broker/model calls or financial payloads.\\\\n\\\\nSQLite triggers change opaque stamps in the same transaction as visible data.\\\\nA bounded long poll wakes within 500 ms of a commit; reconnecting compares the\\\\nlatest durable stamp, so there is no lossy in-memory event queue to replay.\\\\n\\\\\\\"\\\\\\\"\\\\\\\"\\\\nfrom __future__ import annotations\\\\n\\\\nimport asyncio\\\\nfrom contextlib import closing, contextmanager\\\\nfrom datetime import datetime, timezone\\\\nimport hashlib\\\\nimport os\\\\nfrom pathlib import Path\\\\nimport re\\\\nimport sqlite3\\\\nimport threading\\\\nimport time\\\\nfrom typing import Any\\\\n\\\\nfrom fastapi import APIRouter, Depends, Header, HTTPException, Query, Request\\\\nfrom fastapi.responses import JSONResponse\\\\n\\\\ntry:\\\\n    from . import app as backend, research_store\\\\nexcept ImportError:\\\\n    import app as backend\\\\n    import research_store\\\\n\\\\nrouter = APIRouter(prefix=\\\\\\\"/workspace\\\\\\\", tags=[\\\\\\\"Live data\\\\\\\"])\\\\nPOLL_INTERVAL = .5\\\\nUSER_TABLES = (\\\\n    \\\\\\\"workspace_snapshots\\\\\\\", \\\\\\\"workspace_records\\\\\\\", \\\\\\\"workspace_strategy_versions\\\\\\\",\\\\n    \\\\\\\"workspace_events\\\\\\\", \\\\\\\"workspace_chat_threads\\\\\\\", \\\\\\\"workspace_chat_messages\\\\\\\",\\\\n    \\\\\\\"workspace_notification_preferences\\\\\\\", \\\\\\\"workspace_notification_outbox\\\\\\\",\\\\n    \\\\\\\"workspace_plan_operations\\\\\\\", \\\\\\\"workspace_analysis_facts\\\\\\\", \\\\\\\"workspace_jobs\\\\\\\",\\\\n    \\\\\\\"ai_work_jobs\\\\\\\", \\\\\\\"analysis_profiles\\\\\\\", \\\\\\\"analysis_runs\\\\\\\", \\\\\\\"insight_cards\\\\\\\",\\\\n    \\\\\\\"portfolio_snapshots\\\\\\\", \\\\\\\"analysis_budget_usage\\\\\\\", \\\\\\\"ai_money_reservations\\\\\\\",\\\\n    \\\\\\\"broker_connection_versions\\\\\\\",\\\\n)\\\\nGLOBAL_TABLES = (\\\\\\\"market_facts\\\\\\\", \\\\\\\"research_revision_v1\\\\\\\")\\\\n_waiters: dict[int, int] = {}\\\\n_waiter_lock = threading.Lock()\\\\n\\\\n\\\\ndef deployment_signature() -> str:\\\\n    digest = hashlib.sha256()\\\\n    for source in sorted(Path(__file__).parent.glob(\\\\\\\"*.py\\\\\\\")):\\\\n        digest.update(source.name.encode() + b\\\\\\\"\\\\\\\\0\\\\\\\" + source.read_bytes())\\\\n    for name in sorted(os.environ):\\\\n        if name.startswith(\\\\\\\"AI_\\\\\\\") and not name.endswith((\\\\\\\"_SECRET\\\\\\\", \\\\\\\"_KEY\\\\\\\", \\\\\\\"_TOKEN\\\\\\\")):\\\\n            digest.update(name.encode() + b\\\\\\\"\\\\\\\\0\\\\\\\" + os.environ[name].encode() + b\\\\\\\"\\\\\\\\0\\\\\\\")\\\\n    digest.update(hashlib.sha256(os.environ.get(\\\\\\\"TIMEWEB_AI_TOKEN\\\\\\\", \\\\\\\"\\\\\\\").encode()).digest())\\\\n    return digest.hexdigest()\\\\n\\\\n\\\\nDEPLOYMENT = deployment_signature()\\\\n\\\\n\\\\ndef initialize(connect=None) -> None:\\\\n    connect = backend.connect if connect is None else connect\\\\n    with closing(connect()) as db:\\\\n        # Reviewed evidence already has its own durable revision.\\\\n        research_store.initialize(db)\\\\n        db.execute(\\\\\\\"BEGIN IMMEDIATE\\\\\\\")\\\\n        db.execute(\\\\\\\"\\\\\\\"\\\\\\\"CREATE TABLE IF NOT EXISTS workspace_live_versions (\\\\n            user_id INTEGER PRIMARY KEY,\\\\n            stamp TEXT NOT NULL CHECK(length(stamp)=64 AND stamp NOT GLOB '*[^0-9a-f]*'))\\\\\\\"\\\\\\\"\\\\\\\")\\\\n        db.execute(\\\\\\\"INSERT OR IGNORE INTO workspace_live_versions VALUES (0,lower(hex(randomblob(32))))\\\\\\\")\\\\n        existing = {row[0] for row in db.execute(\\\\\\\"SELECT name FROM sqlite_master WHERE type='table'\\\\\\\")}\\\\n        for table in USER_TABLES + GLOBAL_TABLES:\\\\n            if table not in existing:\\\\n                continue\\\\n            columns = [row[1] for row in db.execute('PRAGMA table_info(\\\\\\\"' + table + '\\\\\\\")')]\\\\n            if table in USER_TABLES and \\\\\\\"user_id\\\\\\\" not in columns:\\\\n                raise RuntimeError(\\\\\\\"live_table_has_no_owner:\\\\\\\" + table)\\\\n            if not all(re.fullmatch(r\\\\\\\"[a-z_][a-z0-9_]*\\\\\\\", name) for name in columns):\\\\n                raise RuntimeError(\\\\\\\"live_table_column_invalid\\\\\\\")\\\\n            for operation in (\\\\\\\"INSERT\\\\\\\", \\\\\\\"UPDATE\\\\\\\", \\\\\\\"DELETE\\\\\\\"):\\\\n                trigger = \\\\\\\"live_v1_\\\\\\\" + table + \\\\\\\"_\\\\\\\" + operation.lower()\\\\n                owners = (\\\\\\\"0\\\\\\\",) if table in GLOBAL_TABLES else (\\\\n                    (\\\\\\\"NEW.user_id\\\\\\\", \\\\\\\"OLD.user_id\\\\\\\") if operation == \\\\\\\"UPDATE\\\\\\\"\\\\n                    else (\\\\\\\"OLD.user_id\\\\\\\",) if operation == \\\\\\\"DELETE\\\\\\\" else (\\\\\\\"NEW.user_id\\\\\\\",))\\\\n                when = \\\\\\\"\\\\\\\"\\\\n                if operation == \\\\\\\"UPDATE\\\\\\\":\\\\n                    when = \\\\\\\" WHEN \\\\\\\" + \\\\\\\" OR \\\\\\\".join('OLD.\\\\\\\"' + col + '\\\\\\\" IS NOT NEW.\\\\\\\"' + col + '\\\\\\\"' for col in columns)\\\\n                statements = \\\\\\\"\\\\\\\".join(\\\\n                    \\\\\\\"INSERT INTO workspace_live_versions(user_id,stamp) VALUES (\\\\\\\" + owner +\\\\n                    \\\\\\\",lower(hex(randomblob(32)))) ON CONFLICT(user_id) DO UPDATE SET stamp=excluded.stamp;\\\\\\\"\\\\n                    for owner in owners)\\\\n                sql = \\\\\\\"CREATE TRIGGER \\\\\\\" + trigger + \\\\\\\" AFTER \\\\\\\" + operation + \\\\\\\" ON \\\\\\\" + table + when + \\\\\\\" BEGIN \\\\\\\" + statements + \\\\\\\" END\\\\\\\"\\\\n                installed = db.execute(\\\\\\\"SELECT sql FROM sqlite_master WHERE type='trigger' AND name=?\\\\\\\", (trigger,)).fetchone()\\\\n                if installed is None or installed[0] != sql:\\\\n                    db.execute(\\\\\\\"DROP TRIGGER IF EXISTS \\\\\\\" + trigger)\\\\n                    db.execute(sql)\\\\n        db.commit()\\\\n\\\\n\\\\ndef snapshot(user_id: int, token_hash: str, connect=None) -> dict:\\\\n    connect = backend.connect if connect is None else connect\\\\n    with closing(connect()) as db:\\\\n        db.execute(\\\\\\\"BEGIN\\\\\\\")\\\\n        user = db.execute(\\\\\\\"\\\\\\\"\\\\\\\"SELECT CASE WHEN u.tinvest_token_encrypted IS NOT NULL\\\\n                AND length(u.tinvest_token_encrypted)>0 THEN 1 ELSE 0 END\\\\n            FROM sessions s JOIN users u ON u.id=s.user_id\\\\n            WHERE s.token_hash=? AND s.user_id=? AND s.expires_at>=?\\\\\\\"\\\\\\\"\\\\\\\",\\\\n            (token_hash, user_id, int(time.time()))).fetchone()\\\\n        if user is None:\\\\n            raise HTTPException(401, \\\\\\\"invalid_session\\\\\\\")\\\\n        rows = db.execute(\\\\\\\"SELECT user_id,stamp FROM workspace_live_versions WHERE user_id IN (0,?) ORDER BY user_id\\\\\\\",\\\\n                          (user_id,)).fetchall()\\\\n        if