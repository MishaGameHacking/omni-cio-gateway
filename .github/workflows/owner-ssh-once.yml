name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          OWNER_TELEGRAM_SUB: ${{ secrets.OWNER_TELEGRAM_SUB }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          host="analyst-ai-2941515.twc1.net";ip="83.217.195.29"
          status,data=api("GET","/domains/"+host+"/dns-records");assert status==200
          records=[r for r in data["dns_records"] if r["type"] in ("A","AAAA","CNAME") and r.get("data",{}).get("subdomain") in (None,"","@",host)]
          assert len(records)==1 and records[0]["type"]=="A" and records[0]["data"]["value"] in ("201.24.52.66",ip),"dns_state_changed"
          print("AMS_DNS_RECONCILED="+json.dumps(records),flush=True)
          if records[0]["data"]["value"]!=ip:
              rid=records[0]["id"]
              status,data=api("PATCH","/domains/"+host+"/dns-records/"+str(rid),{"type":"A","subdomain":host,"value":ip,"ttl":300})
              print("AMS_DNS_V1_PATCH="+json.dumps({"status":status,"result":data}),flush=True)
              status,data=api("GET","/domains/"+host+"/dns-records");assert status==200
              roots=[r for r in data["dns_records"] if r["type"]=="A" and r.get("data",{}).get("subdomain") in (None,"","@",host)]
              assert len(roots)==1
              if roots[0]["data"]["value"]!=ip:
                  assert roots[0]["id"]==rid and roots[0]["data"]["value"]=="201.24.52.66"
                  status,data=api("DELETE","/domains/"+host+"/dns-records/"+str(rid));assert status in (200,204)
                  status,data=api("POST","/domains/"+host+"/dns-records",{"type":"A","subdomain":host,"value":ip,"ttl":300})
                  print("AMS_DNS_REPLACED="+json.dumps({"status":status,"result":data}),flush=True)
                  assert status in (200,201),"dns_creation_requires_reconciliation"
          status,data=api("GET","/domains/"+host+"/dns-records");assert status==200
          roots=[r for r in data["dns_records"] if r["type"]=="A" and r.get("data",{}).get("subdomain") in (None,"","@",host)]
          assert len(roots)==1 and roots[0]["data"]["value"]==ip
          print("AMS_DNS_VERIFIED="+json.dumps(roots),flush=True)
          values={"TELEGRAM_CLIENT_ID":os.environ["TELEGRAM_CLIENT_ID"],"TELEGRAM_CLIENT_SECRET":os.environ["TELEGRAM_CLIENT_SECRET"],"BACKEND_PUBLIC_URL":"https://"+host,"EXPECTED_PUBLIC_IPV4":ip,"TELEGRAM_ENROLLMENT_REDIRECT_URI":"https://"+host+"/auth/telegram/owner-enrollment/callback"}
          with_ams("enrollment_values="+repr(values)+"\n"+"\nimport pathlib,json,subprocess,runpy,os\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nvalues=runpy.run_path(str(root/\"deploy/install_owner_backend.py\"))[\"validated_enrollment_config\"](enrollment_values)\npath=pathlib.Path(\"/root/analyst-ai-enrollment.json\")\nif not path.exists():\n    fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)\n    with os.fdopen(fd,\"w\") as f:json.dump(values,f)\nsubprocess.run([\"python3\",str(root/\"deploy/install_owner_backend.py\"),\"--enroll-owner\"],check=True,cwd=root,timeout=30)\ncaddy=pathlib.Path(\"/etc/caddy/Caddyfile\")\nsaved=pathlib.Path(\"/root/analyst-caddy-package-default\")\nif not saved.exists():saved.write_bytes(caddy.read_bytes());saved.chmod(0o600)\ncaddy.write_text('analyst-ai-2941515.twc1.net {\\n\\theader Cache-Control \"no-store\"\\n\\theader Retry-After \"60\"\\n\\trespond \"Application service is being restored.\" 503\\n}\\n')\ncaddy.chmod(0o644)\nsubprocess.run([\"caddy\",\"validate\",\"--config\",str(caddy)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,check=True)\nsubprocess.run([\"systemctl\",\"enable\",\"--now\",\"caddy\"],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)\nprint(\"AMS_DOMAIN_TLS_SERVICE=\"+json.dumps({\"domain\":\"analyst-ai-2941515.twc1.net\",\"mode\":\"maintenance_503\",\"owner_binding\":\"required\",\"private_enrollment_config\":\"validated\",\"private_database_restored\":False}),flush=True)\n\nimport pathlib,subprocess,hashlib,json\nops=pathlib.Path(\"/var/lib/analyst-ai-ops\");target=ops/\"signing-transport.pem\"\nassert not target.exists(),\"transport_key_already_exists\"\nsubprocess.run([\"openssl\",\"genpkey\",\"-algorithm\",\"RSA\",\"-pkeyopt\",\"rsa_keygen_bits:3072\",\"-out\",str(target)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True,timeout=60)\ntarget.chmod(0o600)\npublic=subprocess.check_output([\"openssl\",\"pkey\",\"-in\",str(target),\"-pubout\"],stderr=subprocess.DEVNULL)\nprint(\"AMS_SIGNING_RECIPIENT=\"+json.dumps({\"server_id\":9415007,\"public_pem\":public.decode(),\"sha256\":hashlib.sha256(public).hexdigest()}),flush=True)\n\n")
          PY
