name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nr=subprocess.run(['/opt/analyst-ai/venv/bin/python','-I','-B','-c',\"import datetime,hashlib,importlib.util,json,os,stat,subprocess,sys,time,uuid\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\");WORK=Path(\\\"/srv/analyst-ai/workspace\\\")\\nspec=importlib.util.spec_from_file_location(\\\"controller\\\",ROOT/\\\"controller.py\\\")\\ncontroller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)\\nrecord,_=controller.read_json(ROOT/\\\"backend-activation.json\\\",private=True)\\nproof,_=controller.read_json(ROOT/\\\"backend-repair-verification.json\\\",private=True)\\nassert record[\\\"phase\\\"]==\\\"verified\\\" and record[\\\"owner_bound\\\"] is True and record[\\\"https_verified\\\"] is True and proof[\\\"phase\\\"]==\\\"verified\\\"\\nassert hashlib.sha256((ROOT/\\\"backend_activate.py\\\").read_bytes()).hexdigest()==proof[\\\"activation_sha256\\\"]\\nassert hashlib.sha256(Path(\\\"/root/analyst-ai-owner.json\\\").read_bytes()).hexdigest()==record[\\\"owner_config_sha256\\\"]\\nassert hashlib.sha256(Path(\\\"/etc/analyst-ai/backend.env\\\").read_bytes()).hexdigest()==record[\\\"env_sha256\\\"]\\nr=subprocess.run([\\\"systemctl\\\",\\\"show\\\",\\\"analyst-ai-owner.service\\\",\\\"--property=ActiveState,SubState,MainPID,MemoryCurrent\\\"],capture_output=True,text=True,check=True,timeout=10)\\nunit=dict(line.split(\\\"=\\\",1) for line in r.stdout.splitlines() if \\\"=\\\" in line)\\nassert unit[\\\"ActiveState\\\"]==\\\"active\\\" and unit[\\\"SubState\\\"]==\\\"running\\\" and int(unit[\\\"MainPID\\\"])>0\\nenabled=subprocess.run([\\\"systemctl\\\",\\\"is-enabled\\\",\\\"analyst-ai-owner.service\\\"],capture_output=True,text=True,check=True,timeout=10).stdout.strip()\\nassert enabled==\\\"enabled\\\"\\nassert hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()==record[\\\"caddy_after_sha256\\\"]\\nif record.get(\\\"backend_stopped\\\") is True:\\n historical=ROOT/\\\"backend-activation-before-recovery-status.json\\\"\\n if historical.exists():assert controller.read_json(historical,private=True)[0]==record\\n else:controller.save_json(historical,record)\\n record[\\\"previous_failed_attempt\\\"]={key:record.get(key) for key in (\\\"last_error\\\",\\\"last_error_type\\\",\\\"backend_stopped\\\") if key in record}\\n record.pop(\\\"last_error\\\",None);record.pop(\\\"last_error_type\\\",None)\\n record.update(backend_stopped=False,verified_at=proof[\\\"verified_at\\\"],recovery_verification=\\\"backend-repair-verification.json\\\")\\n controller.save_json(ROOT/\\\"backend-activation.json\\\",record)\\nsubprocess.run([\\\"systemctl\\\",\\\"reset-failed\\\",\\\"analyst-owner-retry.service\\\"],check=True,timeout=10)\\npatches=[{\\\"path\\\":\\\"README.md\\\",\\\"before_sha256\\\":\\\"44b14acea59f4e15aa27385fdca0de5fbf8a4314a83739c0a3bc59f1579d9ecd\\\",\\\"changes\\\":[{\\\"before\\\":\\\"Приватный backend, owner binding и данные нового сервера пока не восстановлены.\\\",\\\"after\\\":\\\"На основном Timeweb 9415007 завершена реальная привязка единственного владельца\\\\nTelegram; личный backend запущен и проверен по HTTPS 25.10.2026 в 07:15 UTC.\\\\nСоздана новая приватная БД; прежние личные данные не восстановлены.\\\\nПривязка владельца не создаёт Android-сессию: при проверке действующих сессий\\\\nприложения ещё не было; установка версии 37 и работа live-данных на телефоне\\\\nне подтверждены. T-Invest и AI-ключи не подключены; scheduler отключён,\\\\nAI-бюджеты равны нулю.\\\"}]},{\\\"path\\\":\\\"docs/PLAN_STATUS.md\\\",\\\"before_sha256\\\":\\\"0aa6476c5685b072e0b217cd7416bac9557b90e94640c068d4febaac265873cf\\\",\\\"changes\\\":[{\\\"before\\\":\\\"Приватный backend/owner binding пока не восстановлены. Функции F01–F23 в целом\\\\nэтой публикацией не закрываются. [Протокол](AUTOMATIC_UPDATES_0.12.1.md).\\\",\\\"after\\\":\\\"После реального Telegram OIDC входа завершена привязка ранее подтверждённого\\\\nединственного владельца. На основном Timeweb 9415007 запущен личный backend:\\\\n25.10.2026 в 07:15 UTC прошли локальные и независимые внешние HTTPS-проверки.\\\\nПриватные маршруты без сессии возвращают 401, завершённый enrollment callback — 410.\\\\nКанал OTA 37 сохранён; полный APK скачан с точным размером и SHA-256.\\\\nСоздана новая приватная БД; прежние личные данные не восстановлены.\\\\nПри проверке действующих сессий приложения ещё не было. Установка 37 и live-данные\\\\nна физическом телефоне не подтверждены. T-Invest и AI-ключи не подключены;\\\\nscheduler отключён, AI-бюджеты равны нулю. Функции F01–F23 в целом этим не закрываются.\\\\n[Протокол](AUTOMATIC_UPDATES_0.12.1.md).\\\"},{\\\"before\\\":\\\"> Актуально 25.10.2026, 00:20 МСК:\\\",\\\"after\\\":\\\"> Историческое состояние 25.10.2026, 00:20 МСК, до OTA 37 и активации backend:\\\"}]},{\\\"path\\\":\\\"docs/MASTER_PLAN.md\\\",\\\"before_sha256\\\":\\\"323a8a53df3e8ff23e3d60e85b6f9afb33b2fabd0e7112b96ddedee2afd8a533\\\",\\\"changes\\\":[{\\\"before\\\":\\\"Приватный backend/owner binding пока не восстановлены. Функции F01–F23 в целом\\\\nэтой публикацией не закрываются. [Протокол](AUTOMATIC_UPDATES_0.12.1.md).\\\",\\\"after\\\":\\\"После реального Telegram OIDC входа завершена привязка ранее подтверждённого\\\\nединственного владельца. На основном Timeweb 9415007 запущен личный backend:\\\\n25.10.2026 в 07:15 UTC прошли локальные и независимые внешние HTTPS-проверки.\\\\nПриватные маршруты без сессии возвращают 401, завершённый enrollment callback — 410.\\\\nКанал OTA 37 сохранён; полный APK скачан с точным размером и SHA-256.\\\\nСоздана новая приватная БД; прежние личные данные не восстановлены.\\\\nПри проверке действующих сессий приложения ещё не было. Установка 37 и live-данные\\\\nна физическом телефоне не подтверждены. T-Invest и AI-ключи не подключены;\\\\nscheduler отключён, AI-бюджеты равны нулю. Функции F01–F23 в целом этим не закрываются.\\\\n[Протокол](AUTOMATIC_UPDATES_0.12.1.md).\\\"},{\\\"before\\\":\\\"> Актуально 25.10.2026, 00:20 МСК:\\\",\\\"after\\\":\\\"> Историческое состояние 25.10.2026, 00:20 МСК, до OTA 37 и активации backend:\\\"}]},{\\\"path\\\":\\\"AGENTS.md\\\",\\\"before_sha256\\\":\\\"8aef9ddbd563e6048c30859a3776ce8af233e43cdcca8df7240441c2d1e18467\\\",\\\"changes\\\":[{\\\"before\\\":\\\"policy 200, полный APK 29 820 366 байт с точным SHA-256; client/ready 401,\\\\nприватный workspace пока503. Check/build/JVM/lint/подпись прошли; установка и\\\",\\\"after\\\":\\\"policy 200, полный APK 29 820 366 байт с точным SHA-256. При публикации\\\\nclient/ready возвращал 401, приватный workspace — 503.\\\\nПосле активации личного backend в 07:15 UTC приватные маршруты без сессии\\\\nвозвращают 401; OTA сохранён. Check/build/JVM/lint/подпись прошли; установка и\\\"},{\\\"before\\\":\\\"Приватная БД и owner binding нового сервера ещё не восстановлены; доступность\\\\nOTA не означает работоспособность личного backend или ИИ. Для владельца нужен\\\\nреальный Telegram OIDC вход с отдельным подтверждением проверенной личности.\\\",\\\"after\\\":\\\"Реальная привязка единственного владельца Telegram завершена; личный backend\\\\nна 9415007 запущен и проверен по HTTPS. Создана новая приватная БД;\\\\nпрежние личные данные не восстановлены. При проверке в 07:15 UTC действующих\\\\nAndroid-сессий не было; установка 37 и live-данные на телефоне не подтверждены.\\\\nT-Invest и AI-ключи не подключены; scheduler отключён, AI-бюджеты равны нулю.\\\\nСохранять подтверждённую single-owner привязку, существующий Fernet-ключ и БД.\\\\nУспешный enrollment не повторять; обычная авторизация из Android-приложения\\\\nсоздаёт отдельную пользовательскую сессию. Готовность сервера не доказывает\\\\nработу ИИ или прохождение полной Android runtime-матрицы.\\\"},{\\\"before\\\":\\\"Production backend ещё не восстановлен; HTTPS отдаёт maintenance 503.\\\\nПрежний ключ подписи восстановлен, новая owner binding требует реального\\\\nTelegram OIDC входа. Сохранять single-owner, секреты и полную APK-матрицу.\\\",\\\"after\\\":\\\"После последующей реальной owner binding production backend запущен,\\\\nHTTPS проверен; приватный доступ требует сессии. Прежний ключ подписи сохранён.\\\\nСоздана новая приватная БД; прежние данные не восстановлены.\\\\nСохранять single-owner, секреты и полную APK-матрицу.\\\"}]},{\\\"path\\\":\\\"docs/AUTOMATIC_UPDATES_0.12.1.md\\\",\\\"before_sha256\\\":\\\"009bbcfa97d9ada7f2383df85446385a2a663b5fca50b80dd5a858c501659758\\\",\\\"changes\\\":[{\\\"before\\\":\\\"| Личный backend, новая owner binding и данные | Ещё не восстановлены |\\\",\\\"after\\\":\\\"| Реальная привязка единственного владельца Telegram | Завершена |\\\\n| Личный backend: локальные и независимые внешние HTTPS-проверки | PASS, 07:15 UTC |\\\\n| Действующая сессия Android-приложения | При проверке ещё не создана |\\\\n| Прежние приватные данные | Не восстановлены; создана новая БД |\\\"},{\\\"before\\\":\\\"| Реальные ответы ИИ | Не подтверждены |\\\",\\\"after\\\":\\\"| T-Invest и реальные ответы ИИ | Ключи не подключены; не проверены |\\\"},{\\\"before\\\":\\\"Серверные данные и завершённые результаты могут меняться без APK через уже\\\\nреализованный live-клиент, когда личный backend и сессия снова работают.\\\\nИзменения нативного интерфейса и кода доставляются подписанным APK.\\\",\\\"after\\\":\\\"Личный backend запущен. После обычного входа из приложения серверные данные\\\\nи завершённые результаты могут обновляться через реализованный live-клиент\\\\nбез нового APK. Работа этого обмена на физическом телефоне ещё не подтверждена.\\\\nИзменения нативного интерфейса и кода доставляются подписанным APK.\\\"},{\\\"before\\\":\\\"Внешний канал проверен с заголовками установленной36: policy200, APK200,\\\\nполный размер/хеш совпадают; ready401, неверное имя APK404, private workspace503.\\\\nОтключение maintenance выполнено только для обновлений. User tokens не принимались,\\\\nприватная БД не создавалась, новые аккаунты публично не регистрировались.\\\",\\\"after\\\":\\\"При публикации OTA 37 в 06:07 UTC внешний канал был проверен с заголовками\\\\nустановленной 36: policy 200, APK 200, полный размер/хеш совпали; ready 401,\\\\nневерное имя APK 404, private workspace 503. Тогда maintenance был отключён\\\\nтолько для обновлений, приватная БД ещё не создавалась.\\\\n\\\\nПосле реального повторного Telegram OIDC входа ранее проверенного владельца\\\\nего привязка сохранена штатным enrollment CLI. Затем исправлена подтверждённая\\\\nошибка административного health probe: имя функции перекрывало модуль HTTP.\\\\nПовторный запуск сохранил owner config и уже созданный Fernet-ключ.\\\\n\\\\n25.10.2026 в 07:15 UTC прошли локальные и независимые внешние HTTPS-проверки:\\\\nhealth 200; me, workspace, live и client/ready без сессии — 401;\\\\nзавершённый enrollment callback — 410; страница входа — 200.\\\\nПолный APK 37 повторно скачан с точным размером и SHA-256.\\\\nBackend обслуживает личные маршруты на 127.0.0.1:8080; отдельный канал OTA\\\\nна 127.0.0.1:8081 сохранён. Служба backend включена в автозапуск.\\\\n[Подтверждённый запуск и независимая проверка](https://github.com/MishaGameHacking/omni-cio-gateway/actions/runs/40172032176).\\\\n\\\\nВ новой приватной БД проверены одна запись владельца и действующие ограничения;\\\\nпри проверке было 0 пользовательских аккаунтов и 0 сессий приложения.\\\\nПрежние личные данные не восстановлены. Одноразовые ссылки входа, Telegram subject,\\\\nтокены и содержимое БД не публикуются.\\\"},{\\\"before\\\":\\\"Следующий необходимый шаг подключения личного сервера — настоящий Telegram OIDC\\\\nвход владельца, проверка и явное подтверждение identity. Его нельзя заменить\\\\nпервым посетителем сайта, username, новым выдуманным владельцем или unit-тестом.\\\\nEnrollment не создаёт Android-сессию: после запуска backend нужен обычный вход\\\\nиз приложения. Отсутствующие приватные данные не подменяются демонстрационными.\\\",\\\"after\\\":\\\"Привязка владельца завершена; повторять enrollment не нужно.\\\\nСледующий шаг — обычный вход владельца из Android-приложения и проверка\\\\nверсии 37, авторизованного доступа и live-данных на телефоне.\\\\nЭти результаты пока не подтверждены. Строка client_versions отражает принятую\\\\nсервером версию клиента, но не является аттестацией установленных байтов APK.\\\\n\\\\nT-Invest и AI-ключи не подключены. Scheduler отключён, разрешение платной\\\\nAI-обработки выключено, дневные AI-бюджеты пользователя и проекта равны нулю.\\\\nРеальные ответы ИИ и данные брокерского счёта не проверены.\\\\nОтсутствующие приватные данные не подменяются демонстрационными.\\\\n\\\\nДо следующей обычной публикации необходимо согласовать путь стандартного\\\\npublisher с действующим каналом /srv/analyst-ai-ota/releases; текущий deploy/publish_timeweb_workspace.py\\\\nиспользует прежний /var/lib/analyst-ai/releases. Runtime-гейты сохраняются.\\\\nРазовое разрешение на тестовый APK 37 на будущие выпуски не распространяется.\\\"}]}]\\nassert set(p[\\\"path\\\"] for p in patches)=={\\\"AGENTS.md\\\",\\\"README.md\\\",\\\"docs/AUTOMATIC_UPDATES_0.12.1.md\\\",\\\"docs/MASTER_PLAN.md\\\",\\\"docs/PLAN_STATUS.md\\\"}\\nplanned=[]\\nfor item in patches:\\n path=WORK/item[\\\"path\\\"]\\n assert path.resolve()==path and path.parent.is_dir() and not path.parent.is_symlink()\\n info=path.lstat();assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and not stat.S_IMODE(info.st_mode)&0o002\\n old=path.read_bytes();assert hashlib.sha256(old).hexdigest()==item[\\\"before_sha256\\\"]\\n text=old.decode(\\\"utf-8\\\")\\n for replacement in item[\\\"changes\\\"]:\\n  assert text.count(replacement[\\\"before\\\"])==1\\n  text=text.replace(replacement[\\\"before\\\"],replacement[\\\"after\\\"],1)\\n new=text.encode(\\\"utf-8\\\")\\n planned.append((item,path,info,old,new))\\nbackup=ROOT/\\\"documentation-before-backend-activation\\\"\\nif not backup.exists():backup.mkdir(mode=0o700)\\nassert stat.S_IMODE(backup.stat().st_mode)==0o700 and backup.stat().st_uid==0\\nresults=[]\\nfor item,path,info,old,new in planned:\\n saved=backup/item[\\\"path\\\"].replace(\\\"/\\\",\\\"__\\\")\\n if saved.exists():assert saved.read_bytes()==old\\n else:\\n  fd=os.open(saved,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\\n  with os.fdopen(fd,\\\"wb\\\") as output:output.write(old);output.flush();os.fsync(output.fileno())\\n temporary=path.parent/(\\\".backend-doc-\\\"+uuid.uuid4().hex)\\n fd=os.open(temporary,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,stat.S_IMODE(info.st_mode))\\n try:\\n  with os.fdopen(fd,\\\"wb\\\") as output:\\n   os.fchown(output.fileno(),info.st_uid,info.st_gid);os.fchmod(output.fileno(),stat.S_IMODE(info.st_mode))\\n   output.write(new);output.flush();os.fsync(output.fileno())\\n  assert hashlib.sha256(path.read_bytes()).hexdigest()==item[\\\"before_sha256\\\"]\\n  os.replace(temporary,path)\\n  parent=os.open(path.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)\\n  try:os.fsync(parent)\\n  finally:os.close(parent)\\n finally:temporary.unlink(missing_ok=True)\\n actual=path.read_bytes();assert actual==new\\n results.append({\\\"path\\\":item[\\\"path\\\"],\\\"bytes\\\":len(actual),\\\"sha256\\\":hashlib.sha256(actual).hexdigest(),\\\"git_blob\\\":hashlib.sha1(b\\\"blob \\\"+str(len(actual)).encode()+b\\\"\\\\0\\\"+actual).hexdigest()})\\ncontroller.save_json(ROOT/\\\"documentation-backend-activation.json\\\",{\\\"server_id\\\":9415007,\\\"verified_at\\\":int(time.time()),\\\"files\\\":results})\\nprint(\\\"OWNER_BACKEND_LIVE_STATUS=\\\"+json.dumps({\\\"server_id\\\":9415007,\\\"owner_bound\\\":True,\\\"backend_active\\\":True,\\\"enabled_at_boot\\\":True,\\\"https_verified\\\":True,\\\"service\\\":unit,\\\"existing_owner_and_environment_preserved\\\":True,\\\"verified_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat()}),flush=True)\\nprint(\\\"OWNER_BACKEND_DOCS_WRITTEN=\\\"+json.dumps(results),flush=True)\\n\"],timeout=65)\nraise SystemExit(r.returncode)",timeout=120)
