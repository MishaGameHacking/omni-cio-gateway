name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      loader="import json,os,subprocess,sys\nd=json.load(sys.stdin)\ne=dict(os.environ);e[\"ANALYST_BACKUP_GITHUB_TOKEN\"]=d[\"token\"]\nr=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"python3\",\"-\"],input=d[\"script\"].encode(),env=e,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=280)\nprint(r.stdout.decode(errors=\"replace\"),flush=True)\nif r.returncode:print(\"BACKUP_REMOTE_ERROR=\"+r.stderr.decode(errors=\"replace\")[-1500:],flush=True)\nsys.exit(r.returncode)\n"
                      payload={"script":"import pathlib,tempfile,subprocess,os,json,hashlib,datetime,runpy\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nexpected=\"29fff6ce1a1668b79a4c72e07230a102fd743ff6\"\nbase=\"690811a5a376181990a64f37d914c87eb6c919b7\"\nbranch=\"backup/timeweb-workspace-20261024\"\nrepo=\"https://github.com/MishaGameHacking/omni-cio-gateway.git\"\ncheck=json.loads(pathlib.Path(\"/var/lib/analyst-ai-build/check-result.json\").read_text())\nassert check[\"status\"]==\"passed\"\nwith tempfile.TemporaryDirectory(prefix=\"source-backup-\",dir=\"/var/lib/analyst-ai-build\") as temporary:\n    temporary=pathlib.Path(temporary)\n    ask=temporary/\"askpass\"\n    ask.write_text('#!/bin/sh\\ncase \"$1\" in *Username*) printf \"%s\" \"x-access-token\";; *) printf \"%s\" \"$ANALYST_BACKUP_GITHUB_TOKEN\";; esac\\n')\n    ask.chmod(0o700)\n    env={**os.environ,\"GIT_ASKPASS\":str(ask),\"GIT_TERMINAL_PROMPT\":\"0\",\n        \"GIT_INDEX_FILE\":str(temporary/\"index\"),\"GIT_AUTHOR_NAME\":\"Analyst AI Timeweb Backup\",\n        \"GIT_AUTHOR_EMAIL\":\"codex@users.noreply.github.com\",\"GIT_COMMITTER_NAME\":\"Analyst AI Timeweb Backup\",\n        \"GIT_COMMITTER_EMAIL\":\"codex@users.noreply.github.com\"}\n    def git(*args,input=None):\n        r=subprocess.run([\"git\",*args],cwd=root,env=env,input=input,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)\n        if r.returncode:raise RuntimeError(\"backup_git_\"+args[0]+\"_exit_\"+str(r.returncode))\n        return r.stdout\n    actual=git(\"ls-remote\",repo,\"refs/heads/\"+branch).decode().split()[0]\n    assert actual==expected,\"backup_branch_changed\"\n    git(\"fetch\",\"--no-tags\",\"--depth=1\",repo,expected)\n    git(\"read-tree\",base)\n    names=set(git(\"diff\",\"--name-only\",\"-z\",\"HEAD\").decode().split(\"\\0\"))\n    names.update(git(\"ls-files\",\"--others\",\"--exclude-standard\",\"-z\").decode().split(\"\\0\"));names.discard(\"\")\n    names={n for n in names if not n.startswith(\".kotlin/\")}\n    reviewed=set([\".github/scripts/native_input_evidence.py\",\".github/scripts/portfolio_preferences_probe.py\",\".github/scripts/profile_ui_probe.py\",\".github/scripts/spatial_frame_evidence.py\",\".github/scripts/spatial_policy_probe.py\",\".github/scripts/spatial_ui_probe.py\",\".github/scripts/tests/test_android17_live_spectrum.py\",\".github/scripts/tests/test_native_2d_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\",\".github/scripts/tests/test_spectrum_brand_identity.py\",\".github/scripts/tests/test_spectrum_production_tokens.py\",\"AGENTS.md\",\"README.md\",\"app/build.gradle.kts\",\"app/src/debug/java/ru/omnicio/app/SpatialRendererProbe.kt\",\"app/src/main/java/ru/omnicio/app/MainActivity.kt\",\"app/src/main/java/ru/omnicio/app/data/backend/BackendConfig.kt\",\"app/src/main/java/ru/omnicio/app/data/workspace/VolumeWorkspaceClient.kt\",\"app/src/main/java/ru/omnicio/app/data/workspace/WorkspaceLiveClient.kt\",\"app/src/main/java/ru/omnicio/app/ui/AnalystBottomBar.kt\",\"app/src/main/java/ru/omnicio/app/ui/home/HomeQuickActions.kt\",\"app/src/main/java/ru/omnicio/app/ui/home/HomeScreen.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/FlatArtwork.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/FlatMotionPolicy.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialComponents.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialInteraction.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialScene.kt\",\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumCapitalOrbit.kt\",\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumDesignSystem.kt\",\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumLiveFeatureIcon.kt\",\"app/src/main/java/ru/omnicio/app/ui/theme/AnalystTheme.kt\",\"app/src/main/java/ru/omnicio/app/ui/workspace/AppearanceScreen.kt\",\"app/src/main/java/ru/omnicio/app/ui/workspace/AssistantWorkspaceScreen.kt\",\"app/src/main/java/ru/omnicio/app/ui/workspace/PersonalWorkspaceScreens.kt\",\"app/src/main/java/ru/omnicio/app/ui/workspace/WorkspaceLive.kt\",\"app/src/main/java/ru/omnicio/app/ui/workspace/WorkspaceRuntime.kt\",\"app/src/main/res/drawable/analyst_brain_foreground.xml\",\"app/src/test/java/ru/omnicio/app/data/backend/BackendConfigTest.kt\",\"app/src/test/java/ru/omnicio/app/data/workspace/AiAvailabilityMessageTest.kt\",\"app/src/test/java/ru/omnicio/app/data/workspace/LiveCursorTest.kt\",\"app/src/test/java/ru/omnicio/app/ui/spatial/FlatMotionPolicyTest.kt\",\"backend/app.py\",\"backend/installation_evidence.py\",\"backend/telegram_browser_app.py\",\"backend/telegram_oidc.py\",\"backend/tests/test_owner_enrollment.py\",\"backend/tests/test_owner_enrollment_install.py\",\"backend/tests/test_single_owner_entrypoint.py\",\"backend/tests/test_telegram_nonce_boundaries.py\",\"backend/tests/test_volume_live.py\",\"backend/volume.py\",\"backend/volume_live.py\",\"deploy/OWNER_TIMEWEB.md\",\"deploy/analyst-resource-observer.service\",\"deploy/analyst-resource-observer.timer\",\"deploy/analyst-workspace\",\"deploy/analyst-workspace@.service\",\"deploy/enroll_owner.py\",\"deploy/install_owner_backend.py\",\"deploy/publish_timeweb_workspace.py\",\"deploy/resource_observer.py\",\"deploy/tests/test_timeweb_workspace.py\",\"deploy/timeweb_workspace.py\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/TIMEWEB_WORKSPACE.md\",\"docs/WORKSPACE_UI.md\",\"docs/LIVE_UPDATES_0.12.md\"])\n    assert names<=reviewed,\"unexpected_file_outside_reviewed_source_manifest\"\n    def snapshot():\n        result={}\n        for name in sorted(names):\n            p=root/name\n            assert not p.is_symlink() and p.resolve().is_relative_to(root.resolve())\n            assert p.suffix not in (\".env\",\".jks\",\".keystore\",\".pem\",\".key\",\".db\")\n            result[name]=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None\n        return result\n    before=snapshot()\n    paths=temporary/\"paths\";paths.write_bytes(b\"\\0\".join(os.fsencode(name) for name in sorted(names))+b\"\\0\")\n    git(\"read-tree\",base)\n    git(\"add\",\"-A\",\"--pathspec-from-file=\"+str(paths),\"--pathspec-file-nul\")\n    tree=git(\"write-tree\").decode().strip()\n    commit=git(\"commit-tree\",tree,\"-p\",expected,input=(\"backup: Timeweb native 2D 0.12 and deployed live updates [skip ci]\\n\\nServer checks passed; APK build/runtime and real AI remain separate gates. No secrets, database or signing files.\\n\").encode()).decode().strip()\n    for name,digest in before.items():\n        if digest is not None:assert hashlib.sha256(git(\"show\",commit+\":\"+name)).hexdigest()==digest,\"backup_content_mismatch\"\n    assert snapshot()==before,\"workspace_changed_during_backup\"\n    git(\"push\",\"--porcelain\",\"--force-with-lease=refs/heads/\"+branch+\":\"+expected,repo,commit+\":refs/heads/\"+branch)\n    assert git(\"ls-remote\",repo,\"refs/heads/\"+branch).decode().split()[0]==commit,\"backup_remote_not_updated\"\n    proof={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"commit\":commit,\"tree\":tree,\"parent\":expected,\n        \"source_base\":base,\"branch\":branch,\"verified_public_files\":before,\"checked_source_sha256\":check[\"source_sha256\"],\n        \"checked_stage\":\"passed\",\"native_build_and_runtime_not_asserted\":True}\n    p=pathlib.Path(\"/var/lib/analyst-ai-build/source-backup-proof.json\")\n    p.write_text(json.dumps(proof,indent=2)+\"\\n\");p.chmod(0o600)\n    print(\"TIMEWEB_BACKUP_VERIFIED=\"+json.dumps({k:v for k,v in proof.items() if k!=\"verified_public_files\"}|{\"file_count\":len(before)}),flush=True)\n","token":os.environ["GH_TOKEN"]}
                      result=subprocess.run([*command,"python3 -c "+shlex.quote(loader)],input=json.dumps(payload).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=300)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("BACKUP_TRANSPORT_ERROR="+result.stderr.decode(errors="replace")[-800:],flush=True)
                          raise RuntimeError("Timeweb_backup_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
