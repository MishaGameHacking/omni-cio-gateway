name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-ai-setup
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Recover only the newly created application key and accept the actual opaque credential format
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          adopt.select_target(True)
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          observed=[s for s in doc["servers"] if s["id"]==9408159]
          assert len(observed)==1 and observed[0]["ram"]==3072 and observed[0]["cpu"]==1
          p.CONFIGURATION["ram"]=3072
          adopt.verified_target(token)
          with tempfile.TemporaryDirectory(prefix="analyst-build-monitor-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client")
              public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-monitor-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              identifier=key["id"]
              attached=False
              try:
                  access.request(token,"POST","/servers/9408159/ssh-keys",{"ssh_key_ids":[identifier]})
                  attached=True
                  command=p.ssh_command(folder,adopt.NEW_IP,adopt.NEW_HOST_KEY)
                  for attempt in range(12):
                      try:
                          p.remote(command,"test $(id -u) = 0",timeout=12)
                          break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import json,re,sys\n\ndef main():\n    import datetime,json,os,pathlib,re,ssl,stat,sys,urllib.error,urllib.request,uuid\n    from decimal import Decimal\n    os.umask(0o077)\n    assert os.geteuid()==0\n    payload=json.load(sys.stdin)\n    admin=payload[\"cloud_token\"]\n    assert isinstance(admin,str) and len(admin)>20 and \"\\n\" not in admin\n    class NoRedirect(urllib.request.HTTPRedirectHandler):\n        def redirect_request(self,*args,**kwargs):raise RuntimeError(\"redirect_refused\")\n    opener=urllib.request.build_opener(NoRedirect(),urllib.request.HTTPSHandler(context=ssl.create_default_context()),urllib.request.ProxyHandler({}))\n    def request(method,path,body=None,*,gateway=False,key=None):\n        base=\"https://api.timeweb.ai/v1\" if gateway else \"https://api.timeweb.cloud/api/v1\"\n        credential=key if gateway else admin\n        req=urllib.request.Request(base+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"Authorization\":\"Bearer \"+credential,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n        try:\n            with opener.open(req,timeout=30) as response:raw=response.read(4*1024*1024+1)\n        except urllib.error.HTTPError as error:\n            raw=error.read(1024*1024)\n            try:doc=json.loads(raw)\n            except Exception:doc={}\n            code=doc.get(\"error_code\")\n            if not isinstance(code,str) or not re.fullmatch(\"[a-zA-Z0-9_]{1,100}\",code):code=\"unknown\"\n            raise RuntimeError(\"timeweb_\"+(\"gateway\" if gateway else \"management\")+\"_http_\"+str(error.code)+\"_\"+code) from None\n        assert len(raw)<=4*1024*1024\n        return json.loads(raw) if raw else {}\n    name=\"analyst-ai-owner-20261024\"\n    marker=\"Analyst AI existing application gateway; Timeweb-only development\"\n    path=pathlib.Path(\"/root/analyst-ai-gateway.json\")\n    assert not path.is_symlink()\n    inventory=request(\"GET\",\"/cloud-ai/ai-keys\")\n    rows=inventory[\"ai_keys\"]\n    assert isinstance(rows,list) and inventory.get(\"meta\",{}).get(\"total\")==len(rows),\"incomplete_gateway_key_inventory\"\n    owned=[row for row in rows if row.get(\"name\")==name and row.get(\"description\")==marker and row.get(\"project_id\")==2941515]\n    assert len(owned)<=1,\"ambiguous_application_key\"\n    assert len(owned)==1 and owned[0][\"id\"]==\"70ba4021-d7bd-4006-b93b-34fb0e9dfb14\",\"reconciled_gateway_id_required\"\n    record=owned[0]\n    assert record.get(\"is_readonly\") is False and record[\"entity_type\"]==\"aikey\" and record.get(\"fallback_models\")==[]\n    identifier=str(uuid.UUID(record[\"id\"]))\n    recovery=pathlib.Path(\"/root/analyst-ai-gateway-recovery.json\")\n    assert not recovery.is_symlink()\n    if path.exists():\n        info=path.stat()\n        assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\n        saved=json.loads(path.read_text())\n        assert saved[\"id\"]==identifier\n        key=saved[\"key\"]\n    else:\n        if recovery.exists():\n            info=recovery.stat()\n            assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\n            generated=json.loads(recovery.read_text())\n        else:\n            generated=request(\"PUT\",\"/cloud-ai/ai-keys/\"+identifier+\"/regenerate\")\n            descriptor=os.open(recovery,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n            with os.fdopen(descriptor,\"w\") as out:\n                out.write(json.dumps(generated,indent=2)+\"\\n\")\n                out.flush()\n                os.fsync(out.fileno())\n            print(\"TIMEWEB_APP_GATEWAY_RECOVERY_SAVED=\"+json.dumps({\"id\":identifier,\"private_mode\":\"0600\",\"response_fields\":sorted(generated),\"credential_values_logged\":False}),flush=True)\n        assert generated[\"ai_key\"][\"id\"]==identifier,\"recovery_identity_mismatch\"\n        key=generated[\"key\"]\n        print(\"TIMEWEB_APP_GATEWAY_KEY_SHAPE=\"+json.dumps({\"type\":type(key).__name__,\"length\":len(key) if isinstance(key,str) else None,\"nested_field_names\":sorted(key) if isinstance(key,dict) else None}),flush=True)\n        assert isinstance(key,str) and 16<=len(key)<=16384 and key.isascii() and not any(c.isspace() or ord(c)<32 or ord(c)==127 for c in key),\"invalid_opaque_gateway_credential\"\n        saved={\"id\":identifier,\"key\":key,\"name\":name,\"description\":marker,\"project_id\":2941515,\"created_at\":record.get(\"created_at\"),\"base_url\":\"https://api.timeweb.ai/v1\",\"stage\":\"development_validation\",\"fallback_models\":[]}\n        descriptor=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n        with os.fdopen(descriptor,\"w\") as out:\n            out.write(json.dumps(saved,indent=2)+\"\\n\")\n            out.flush()\n            os.fsync(out.fileno())\n        assert json.loads(path.read_text())==saved\n        recovery.unlink()\n        print(\"TIMEWEB_APP_GATEWAY_KEY_SAVED=\"+json.dumps({\"id\":identifier,\"project_id\":2941515,\"server_id\":9408159,\"file\":str(path),\"mode\":\"0600\",\"base_monthly_rub\":1,\"key_value_logged\":False}),flush=True)\n    \n    identifier=str(uuid.UUID(record[\"id\"]))\n    assert record[\"name\"]==name and record[\"project_id\"]==2941515 and record[\"description\"]==marker,\"unexpected_gateway_identity_preserved_for_inspection\"\n    assert record[\"entity_type\"]==\"aikey\" and record.get(\"fallback_models\")==[]\n    limits_path=\"/cloud-ai/ai-keys/\"+identifier+\"/entity-limits\"\n    limit_doc=request(\"GET\",limits_path)\n    limits=limit_doc[\"ai_key_entity_limits\"]\n    assert isinstance(limits,list) and limit_doc.get(\"meta\",{}).get(\"total\")==len(limits),\"incomplete_gateway_limits\"\n    for period,amount in ((\"day\",10),(\"month\",30)):\n        existing=[row for row in limits if row.get(\"limit_type\")==period and row.get(\"model_id\") is None]\n        assert len(existing)<=1,\"duplicate_gateway_limit\"\n        if existing:\n            assert existing[0][\"entity_type\"]==\"aikey\" and existing[0][\"ai_key_id\"]==identifier and Decimal(str(existing[0][\"money_limit\"]))==amount,\"unexpected_existing_limit_preserved\"\n        else:\n            request(\"POST\",limits_path,{\"entity_type\":\"aikey\",\"limit_type\":period,\"money_limit\":amount})\n    verified=request(\"GET\",limits_path)[\"ai_key_entity_limits\"]\n    for period,amount in ((\"day\",10),(\"month\",30)):\n        matches=[row for row in verified if row.get(\"limit_type\")==period and row.get(\"model_id\") is None and row.get(\"ai_key_id\")==identifier]\n        assert len(matches)==1 and Decimal(str(matches[0][\"money_limit\"]))==amount,\"gateway_limit_not_verified\"\n    print(\"TIMEWEB_APP_GATEWAY_LIMITS=\"+json.dumps({\"id\":identifier,\"stage\":\"development_validation\",\"day_rub\":10,\"thirty_days_rub\":30,\"provider_fallback_models\":[]}),flush=True)\n    models=request(\"GET\",\"/models\",gateway=True,key=key)\n    assert isinstance(models.get(\"data\"),list)\n    catalog=pathlib.Path(\"/root/analyst-ai-gateway-models.json\")\n    assert not catalog.is_symlink()\n    catalog.write_text(json.dumps(models,ensure_ascii=False,indent=2)+\"\\n\")\n    catalog.chmod(0o600)\n    public={\"server_id\":9408159,\"key_id\":identifier,\"models_auth_verified\":True,\"model_count\":len(models[\"data\"]),\"yandex_model_ids\":[row[\"id\"] for row in models[\"data\"] if isinstance(row.get(\"id\"),str) and \"yandex\" in row[\"id\"].lower()],\"paid_inference_called\":False,\"application_enabled\":False}\n    proof=pathlib.Path(\"/root/analyst-ai-gateway-preflight.json\")\n    assert not proof.is_symlink()\n    proof.write_text(json.dumps(public,ensure_ascii=False,indent=2)+\"\\n\")\n    proof.chmod(0o600)\n    print(\"TIMEWEB_APP_GATEWAY_AUTH_VERIFIED=\"+json.dumps(public),flush=True)\n    \n\ntry:\n    main()\nexcept Exception as error:\n    detail=str(error) if isinstance(error,RuntimeError) and re.fullmatch(\"timeweb_[a-zA-Z0-9_]{1,180}\",str(error)) else None\n    frames=[]\n    trace=error.__traceback__\n    while trace:\n        frames.append({\"function\":trace.tb_frame.f_code.co_name,\"line\":trace.tb_lineno})\n        trace=trace.tb_next\n    print(\"TIMEWEB_APP_GATEWAY_SETUP_ERROR=\"+json.dumps({\"type\":type(error).__name__,\"code\":detail,\"frames\":frames,\"existing_state_preserved\":True}),flush=True)\n    sys.exit(1)\n"
                  result=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],input=json.dumps({"cloud_token":token}).encode(),capture_output=True,timeout=240)
                  for line in result.stdout.decode("utf-8","replace").splitlines():
                      if line.startswith("TIMEWEB_APP_GATEWAY_"):print(line,flush=True)
                  if result.returncode:raise p.ProbeError("timeweb_gateway_setup_failed_"+str(result.returncode))
              finally:
                  if attached:access.request(token,"DELETE","/servers/9408159/ssh-keys/"+str(identifier))
                  access.request(token,"DELETE","/ssh-keys/"+str(identifier))
                  print("TIMEWEB_MONITOR_KEY=removed",flush=True)
          req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          with opener.open(req,timeout=30) as response:new=p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          assert new["id"]==121673 and new["name"]=="analyst-ai-msk-20261024" and new["preset_id"]==6007 and new["location"]=="ru-3"
          print("MOSCOW_ORDER_CURRENT="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          
          PY
