name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nr=subprocess.run(['/opt/analyst-ai/venv/bin/python','-I','-B','-c',\"import hashlib,importlib.util,json,os,sqlite3,subprocess,sys,time\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\ndef load(name,path):\\n spec=importlib.util.spec_from_file_location(name,path);module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module);return module\\ncontroller=load(\\\"handoff\\\",ROOT/\\\"controller.py\\\")\\nstate,_=controller.read_json(ROOT/\\\"state.json\\\",private=True)\\nassert state[\\\"session_id\\\"]==\\\"c975ebbf-6348-402f-ad62-3c44d57c7c26\\\" and state[\\\"phase\\\"]==\\\"bound\\\" and state[\\\"owner_config_created\\\"] is True\\nold=\\\"#!/usr/bin/env python3\\\\nfrom __future__ import annotations\\\\nimport fcntl, hashlib, http.client, importlib.util, json, os, pathlib, pwd, grp\\\\nimport re, secrets, signal, sqlite3, ssl, stat, subprocess, sys, time\\\\nsys.dont_write_bytecode = True\\\\nP = pathlib.Path\\\\nBASE = P('/root/analyst-owner-handoff')\\\\nSNAP = BASE / 'source'\\\\nINSTALL = P('/opt/analyst-ai')\\\\nCONFIG = P('/etc/analyst-ai')\\\\nENV = CONFIG / 'backend.env'\\\\nSTATE = P('/var/lib/analyst-ai')\\\\nUNIT = P('/etc/systemd/system/analyst-ai-owner.service')\\\\nSERVICE = 'analyst-ai-owner.service'\\\\nCADDY = P('/etc/caddy/Caddyfile')\\\\nBEFORE = BASE / 'Caddyfile.before'\\\\nRECEIPT = BASE / 'backend-activation.json'\\\\nHOST = 'analyst-ai-2941515.twc1.net'\\\\nORIGIN = 'https://' + HOST\\\\nBEFORE_SHA = '80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd'\\\\nAPK_SHA = '1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74'\\\\nAPK_BYTES = 29820366\\\\nEND = time.monotonic() + 110\\\\nUNIT_TEXT = '''[Unit]\\\\nDescription=Analyst AI single-owner backend\\\\nAfter=network-online.target\\\\nWants=network-online.target\\\\n\\\\n[Service]\\\\nType=simple\\\\nUser=analyst-ai\\\\nGroup=analyst-ai\\\\nWorkingDirectory=/opt/analyst-ai/backend\\\\nEnvironmentFile=/etc/analyst-ai/backend.env\\\\nEnvironment=PYTHONDONTWRITEBYTECODE=1\\\\nEnvironment=PYTHONUNBUFFERED=1\\\\nUnsetEnvironment=TIMEWEB_AI_TOKEN TIMEWEB_CLOUD_API_KEY TIMEWEB_CLOUD_TOKEN\\\\nExecStart=/opt/analyst-ai/venv/bin/uvicorn owner_app:create_app --factory --lifespan on --host 127.0.0.1 --port 8080 --workers 1 --no-access-log\\\\nRestart=on-failure\\\\nRestartSec=5\\\\nTimeoutStartSec=35\\\\nTimeoutStopSec=10\\\\nStateDirectory=analyst-ai\\\\nStateDirectoryMode=0700\\\\nUMask=0077\\\\nMemoryAccounting=true\\\\nMemoryHigh=512M\\\\nMemoryMax=768M\\\\nMemorySwapMax=128M\\\\nTasksMax=128\\\\nNoNewPrivileges=true\\\\nPrivateTmp=true\\\\nProtectHome=true\\\\nProtectSystem=strict\\\\nReadWritePaths=/var/lib/analyst-ai\\\\nRestrictSUIDSGID=true\\\\n\\\\n[Install]\\\\nWantedBy=multi-user.target\\\\n'''.encode()\\\\nPUBLIC_ENV = {\\\\n 'BACKEND_PUBLIC_URL': ORIGIN,\\\\n 'DATABASE_PATH': str(STATE / 'backend.db'),\\\\n 'APP_DEEP_LINK': 'analystai://auth',\\\\n 'TELEGRAM_REDIRECT_URI': ORIGIN + '/auth/telegram/callback',\\\\n 'ANDROID_RELEASE_DIR': '/srv/analyst-ai-ota/releases',\\\\n 'ANDROID_UPDATES_ENABLED': 'true',\\\\n 'ANALYSIS_SCHEDULER_ENABLED': 'false',\\\\n 'AI_EXTERNAL_PROCESSING_APPROVED': 'false',\\\\n 'AI_USER_DAILY_RUB': '0',\\\\n 'AI_PROJECT_DAILY_RUB': '0',\\\\n}\\\\nclass Halt(Exception): pass\\\\ndef need(value, code):\\\\n    if not value: raise Halt(code)\\\\ndef sha(data): return hashlib.sha256(data).hexdigest()\\\\ndef exists(path): return os.path.lexists(path)\\\\ndef remaining(limit):\\\\n    value = END - time.monotonic()\\\\n    need(value > 0, 'activation_deadline')\\\\n    return min(limit, value)\\\\ndef command(argv, limit=12, required=True):\\\\n    result = subprocess.run(argv, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\\\\n                            timeout=remaining(limit), check=False)\\\\n    if required: need(result.returncode == 0, 'command_failed')\\\\n    return result.returncode\\\\n\\\\ndef directory(path, uid=0, mode=None):\\\\n    s = path.lstat()\\\\n    need(stat.S_ISDIR(s.st_mode) and s.st_uid == uid and not s.st_mode & 0o022,\\\\n         'directory_not_trusted')\\\\n    if mode is not None: need(stat.S_IMODE(s.st_mode) == mode, 'directory_mode_invalid')\\\\n\\\\ndef read(path, private=False, maximum=4 * 1024 * 1024):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\\\n    with os.fdopen(fd, 'rb') as stream:\\\\n        s = os.fstat(stream.fileno())\\\\n        need(stat.S_ISREG(s.st_mode) and s.st_uid == 0 and s.st_nlink == 1\\\\n             and not s.st_mode & 0o022 and s.st_size <= maximum, 'file_not_trusted')\\\\n        if private: need(stat.S_IMODE(s.st_mode) == 0o600, 'private_file_mode_invalid')\\\\n        data = stream.read(maximum + 1)\\\\n    need(len(data) <= maximum, 'file_too_large')\\\\n    return data\\\\n\\\\ndef syncdir(path):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\\\\n    try: os.fsync(fd)\\\\n    finally: os.close(fd)\\\\n\\\\ndef put(path, data, mode, exclusive=False, ownership=None):\\\\n    directory(path.parent)\\\\n    temporary = path.parent / ('.activation-' + secrets.token_hex(12))\\\\n    fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)\\\\n    try:\\\\n        with os.fdopen(fd, 'wb') as stream:\\\\n            if ownership is not None: os.fchown(stream.fileno(), *ownership)\\\\n            os.fchmod(stream.fileno(), mode)\\\\n            stream.write(data); stream.flush(); os.fsync(stream.fileno())\\\\n        if exclusive:\\\\n            os.link(temporary, path, follow_symlinks=False)\\\\n        else:\\\\n            if exists(path): read(path)\\\\n            os.replace(temporary, path)\\\\n        syncdir(path.parent)\\\\n    finally:\\\\n        temporary.unlink(missing_ok=True)\\\\n        syncdir(path.parent)\\\\n\\\\ndef save(record):\\\\n    put(RECEIPT, (json.dumps(record, sort_keys=True) + '\\\\\\\\n').encode(), 0o600)\\\\n\\\\ndef load_receipt():\\\\n    if not exists(RECEIPT): return None\\\\n    value = json.loads(read(RECEIPT, private=True, maximum=65536))\\\\n    need(isinstance(value, dict) and value.get('schema_version') == 1\\\\n         and value.get('operation') == 'owner_backend_activation_v1'\\\\n         and value.get('caddy_before_sha256') == BEFORE_SHA\\\\n         and value.get('unit_sha256') == sha(UNIT_TEXT), 'receipt_not_owned')\\\\n    return value\\\\n\\\\ndef caddy_target(before):\\\\n    need(sha(before) == BEFORE_SHA, 'baseline_hash_changed')\\\\n    text = before.decode('utf-8')\\\\n    pattern = (r'(?m)^[ \\\\\\\\t]*@public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*path /client/update-policy /client/apk/\\\\\\\\* /client/ready\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n[ \\\\\\\\t]*handle @public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*reverse_proxy 127\\\\\\\\.0\\\\\\\\.0\\\\\\\\.1:8081\\\\\\\\n[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*handle \\\\\\\\{\\\\\\\\n[ \\\\\\\\t]*respond \\\\\\\"Application service is being restored\\\\\\\\.\\\\\\\" 503\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n\\\\\\\\}\\\\\\\\n?\\\\\\\\Z')\\\\n    match = re.search(pattern, text)\\\\n    need(match is not None and text.startswith(HOST + ' {\\\\\\\\n'), 'caddy_tail_unexpected')\\\\n    tail = '''    @public_updates {\\\\n        method GET HEAD\\\\n        path /client/update-policy /client/apk/*\\\\n    }\\\\n    handle @public_updates {\\\\n        reverse_proxy 127.0.0.1:8081\\\\n    }\\\\n    @owner_enrollment path /auth/telegram/owner-enrollment/callback\\\\n    handle @owner_enrollment {\\\\n        respond \\\\\\\"Owner enrollment is closed.\\\\\\\" 410\\\\n    }\\\\n    handle {\\\\n        reverse_proxy 127.0.0.1:8080\\\\n    }\\\\n}\\\\n'''\\\\n    prefix = text[:match.start()]\\\\n    need(prefix.count('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n') == 1, 'maintenance_header_unexpected')\\\\n    prefix = prefix.replace('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n', '', 1)\\\\n    return ('{\\\\\\\\n    log default {\\\\\\\\n        output discard\\\\\\\\n    }\\\\\\\\n}\\\\\\\\n\\\\\\\\n'\\\\n            + prefix + tail).encode()\\\\n\\\\ndef validate_caddy(data):\\\\n    path = BASE / ('Caddyfile.activation-check-' + secrets.token_hex(8))\\\\n    put(path, data, 0o600, exclusive=True)\\\\n    try:\\\\n        command(['/usr/bin/caddy', 'validate', '--adapter', 'caddyfile', '--config', str(path)], 15)\\\\n    finally:\\\\n        path.unlink(missing_ok=True)\\\\n\\\\ndef replace_caddy(data, accepted):\\\\n    current = read(CADDY)\\\\n    need(sha(current) in accepted, 'caddy_changed_concurrently')\\\\n    info = CADDY.lstat()\\\\n    put(CADDY, data, stat.S_IMODE(info.st_mode), ownership=(info.st_uid, info.st_gid))\\\\n\\\\ndef common():\\\\n    need(os.geteuid() == 0, 'root_required')\\\\n    for path in (P('/root'), BASE, SNAP, SNAP / 'deploy', SNAP / 'backend',\\\\n                 INSTALL, INSTALL / 'backend', INSTALL / 'venv', INSTALL / 'venv/bin',\\\\n                 P('/etc'), P('/etc/caddy'), UNIT.parent, P('/var'), P('/var/lib')):\\\\n        directory(path)\\\\n    directory(BASE, mode=0o700)\\\\n    before = read(BEFORE, private=True)\\\\n    target = caddy_target(before)\\\\n    installer_path = SNAP / 'deploy/install_owner_backend.py'\\\\n    read(installer_path)\\\\n    spec = importlib.util.spec_from_file_location('activation_installer', installer_path)\\\\n    installer = importlib.util.module_from_spec(spec)\\\\n    spec.loader.exec_module(installer)\\\\n    account, group = pwd.getpwnam('analyst-ai'), grp.getgrnam('analyst-ai')\\\\n    need(account.pw_uid > 0 and group.gr_gid > 0 and account.pw_gid == group.gr_gid,\\\\n         'service_identity_invalid')\\\\n    paths = installer.source_files()\\\\n    for source in paths:\\\\n        destination = INSTALL / 'backend' / source.relative_to(SNAP / 'backend')\\\\n        directory(source.parent); directory(destination.parent)\\\\n        need(read(source) == read(destination), 'installed_source_mismatch')\\\\n    read(INSTALL / 'venv/bin/uvicorn')\\\\n    return installer, before, target, account.pw_uid, group.gr_gid, len(paths)\\\\n\\\\ndef http(path, *, public=False, method='GET', maximum=262144):\\\\n    timeout = remaining(4)\\\\n    connection = (http.client.HTTPSConnection(HOST, timeout=timeout,\\\\n                  context=ssl.create_default_context()) if public\\\\n                  else http.client.HTTPConnection('127.0.0.1', 8080, timeout=timeout))\\\\n    try:\\\\n        connection.request(method, path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        data = response.read(maximum + 1)\\\\n        need(len(data) <= maximum, 'probe_response_too_large')\\\\n        return response.status, dict((k.lower(), v) for k, v in response.getheaders()), data\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef healthy():\\\\n    try:\\\\n        code, _, data = http('/health', maximum=4096)\\\\n        return code == 200 and json.loads(data) == {'status': 'ok'}\\\\n    except (OSError, http.client.HTTPException, ValueError):\\\\n        return False\\\\n\\\\ndef probes(public=False):\\\\n    code, _, data = http('/health', public=public, maximum=4096)\\\\n    need(code == 200 and json.loads(data) == {'status': 'ok'}, 'health_failed')\\\\n    code, _, data = http('/client/update-policy?package_name=ru.omnicio.app.debug',\\\\n                         public=public, maximum=16384)\\\\n    policy = json.loads(data) if code == 200 else {}\\\\n    need(code == 200 and policy.get('package_name') == 'ru.omnicio.app.debug'\\\\n         and policy.get('version_code') == 37 and policy.get('minimum_version_code') == 37\\\\n         and policy.get('apk_sha256') == APK_SHA and policy.get('apk_bytes') == APK_BYTES,\\\\n         'ota_policy_failed')\\\\n    for path, method in (('/me', 'GET'), ('/workspace', 'GET'),\\\\n                         ('/workspace/live?wait=0', 'GET'), ('/client/ready', 'POST')):\\\\n        code, _, _ = http(path, public=public, method=method, maximum=4096)\\\\n        need(code == 401, 'anonymous_access_not_closed')\\\\n    code, headers, _ = http('/auth/telegram/start', public=public)\\\\n    need(code == 200 and 'no-store' in headers.get('cache-control', '')\\\\n         and headers.get('cross-origin-opener-policy') == 'same-origin-allow-popups',\\\\n         'login_page_failed')\\\\n    if public:\\\\n        code, _, _ = http('/auth/telegram/owner-enrollment/callback', public=True, maximum=4096)\\\\n        need(code == 410, 'enrollment_callback_not_closed')\\\\n\\\\ndef registry_checks(values, uid):\\\\n    path = STATE / 'backend.db'\\\\n    info = path.lstat()\\\\n    need(stat.S_ISREG(info.st_mode) and info.st_uid == uid\\\\n         and info.st_nlink == 1 and not info.st_mode & 0o077, 'database_file_not_private')\\\\n    db = sqlite3.connect('file:' + str(path) + '?mode=ro', uri=True, timeout=3)\\\\n    try:\\\\n        db.execute('PRAGMA query_only=ON')\\\\n        need(db.execute('PRAGMA quick_check').fetchone() == ('ok',), 'database_check_failed')\\\\n        owners = db.execute('SELECT singleton,telegram_sub FROM installation_owner').fetchall()\\\\n        need(owners == [(1, values['ANALYST_OWNER_TELEGRAM_SUB'])], 'owner_registry_mismatch')\\\\n        total = db.execute('SELECT count(*) FROM users').fetchone()[0]\\\\n        foreign = db.execute('SELECT count(*) FROM users WHERE telegram_sub<>?',\\\\n                             (values['ANALYST_OWNER_TELEGRAM_SUB'],)).fetchone()[0]\\\\n        need(total <= 1 and foreign == 0, 'unexpected_user_data')\\\\n        guards = db.execute(\\\\\\\"SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'owner_%'\\\\\\\").fetchone()[0]\\\\n        live = db.execute('SELECT count(*) FROM workspace_live_global WHERE singleton=1').fetchone()[0]\\\\n        need(guards >= 6 and live == 1, 'startup_guards_missing')\\\\n        return {'users': total, 'sessions': db.execute('SELECT count(*) FROM sessions').fetchone()[0],\\\\n                'owner_records': len(owners), 'owner_guards': guards, 'live_global_records': live}\\\\n    finally:\\\\n        db.close()\\\\n\\\\n\\\\ndef verify_public_apk():\\\\n    path = '/client/apk/Analyst-AI-37-' + APK_SHA + '.apk?package_name=ru.omnicio.app.debug'\\\\n    connection = http.client.HTTPSConnection(HOST, timeout=remaining(8),\\\\n                                            context=ssl.create_default_context())\\\\n    try:\\\\n        connection.request('GET', path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        need(response.status == 200, 'public_apk_unavailable')\\\\n        need(int(response.getheader('Content-Length', '-1')) == APK_BYTES,\\\\n             'public_apk_size_mismatch')\\\\n        total = 0\\\\n        checksum = hashlib.sha256()\\\\n        while True:\\\\n            remaining(1)\\\\n            chunk = response.read(262144)\\\\n            if not chunk: break\\\\n            total += len(chunk)\\\\n            need(total <= APK_BYTES, 'public_apk_size_mismatch')\\\\n            checksum.update(chunk)\\\\n        need(total == APK_BYTES and checksum.hexdigest() == APK_SHA,\\\\n             'public_apk_hash_mismatch')\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef parse_environment(raw):\\\\n    result = {}\\\\n    for line in raw.decode('utf-8').splitlines():\\\\n        name, separator, value = line.partition('=')\\\\n        need(separator and re.fullmatch(r'[A-Z][A-Z0-9_]*', name)\\\\n             and name not in result, 'environment_format_invalid')\\\\n        parsed = json.loads(value)\\\\n        need(isinstance(parsed, str), 'environment_format_invalid')\\\\n        result[name] = parsed\\\\n    return result\\\\n\\\\ndef rollback(before, target, record):\\\\n    global END\\\\n    END = time.monotonic() + 25\\\\n    signal.setitimer(signal.ITIMER_REAL, 27)\\\\n    caddy_ok = unit_ok = False\\\\n    try:\\\\n        if record is None:\\\\n            return sha(read(CADDY)) == BEFORE_SHA and not exists(UNIT)\\\\n        need(record.get('owner_bound') is True\\\\n             and record.get('caddy_after_sha256') == sha(target), 'rollback_not_owned')\\\\n        try:\\\\n            replace_caddy(before, {BEFORE_SHA, sha(target)})\\\\n            command(['/usr/bin/systemctl', 'reload', 'caddy'], 8)\\\\n            caddy_ok = sha(read(CADDY)) == BEFORE_SHA\\\\n        except Exception:\\\\n            caddy_ok = False\\\\n        try:\\\\n            if exists(UNIT):\\\\n                need(read(UNIT) == UNIT_TEXT, 'rollback_unit_not_owned')\\\\n                command(['/usr/bin/systemctl', 'stop', SERVICE], 12)\\\\n                if record.get('enabled_by_helper'):\\\\n                    command(['/usr/bin/systemctl', 'disable', SERVICE], 3)\\\\n                unit_ok = command(['/usr/bin/systemctl', 'is-active', '--quiet', SERVICE],\\\\n                                  2, required=False) == 3\\\\n            else:\\\\n                unit_ok = True\\\\n        except Exception:\\\\n            unit_ok = False\\\\n        record.update(phase='rolled_back' if caddy_ok and unit_ok else 'rollback_incomplete',\\\\n                      caddy_restored=caddy_ok, backend_stopped=unit_ok)\\\\n        try: save(record)\\\\n        except Exception: return False\\\\n        return caddy_ok and unit_ok\\\\n    finally:\\\\n        signal.setitimer(signal.ITIMER_REAL, 0)\\\\n\\\\ndef prepare_state(uid, gid):\\\\n    if not exists(STATE):\\\\n        os.mkdir(STATE, 0o700)\\\\n        os.chown(STATE, uid, gid)\\\\n        syncdir(STATE.parent)\\\\n    else:\\\\n        info = STATE.lstat()\\\\n        need(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700,\\\\n             'state_directory_invalid')\\\\n        if info.st_uid == 0:\\\\n            need(not any(STATE.iterdir()), 'unexpected_root_owned_state')\\\\n            os.chown(STATE, uid, gid)\\\\n        directory(STATE, uid=uid, mode=0o700)\\\\n        need(STATE.lstat().st_gid == gid, 'state_group_invalid')\\\\n\\\\ndef cancelled(_signum, _frame):\\\\n    raise Halt('activation_cancelled')\\\\n\\\\ndef main():\\\\n    global END\\\\n    need(sys.argv[1:] in ([], ['--preflight'], ['--rollback']), 'unsupported_arguments')\\\\n    mode = sys.argv[1:] or ['activate']\\\\n    for sig in (signal.SIGTERM, signal.SIGHUP, signal.SIGINT, signal.SIGALRM):\\\\n        signal.signal(sig, cancelled)\\\\n    signal.setitimer(signal.ITIMER_REAL, 115)\\\\n    lock = None\\\\n    record = None\\\\n    before = target = None\\\\n    operation_started = False\\\\n    try:\\\\n        installer, before, target, uid, gid, source_count = common()\\\\n        lock = os.open(BASE / 'backend-activation.lock',\\\\n                       os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)\\\\n        info = os.fstat(lock)\\\\n        need(stat.S_ISREG(info.st_mode) and info.st_uid == 0 and info.st_nlink == 1\\\\n             and stat.S_IMODE(info.st_mode) == 0o600, 'lock_not_private')\\\\n        fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\\\\n        record = load_receipt()\\\\n        if mode == ['--rollback']:\\\\n            ok = rollback(before, target, record)\\\\n            print(json.dumps({'status': 'rolled_back' if ok else 'rollback_incomplete',\\\\n                              'rollback_complete': ok}), flush=True)\\\\n            return 0 if ok else 1\\\\n        current_sha = sha(read(CADDY))\\\\n        need(current_sha == BEFORE_SHA or\\\\n             (record is not None and record.get('owner_bound') is True\\\\n              and record.get('caddy_after_sha256') == sha(target)\\\\n              and current_sha == sha(target)), 'unexpected_active_caddy')\\\\n        if record is None:\\\\n            need(not any(exists(p) for p in (ENV, UNIT, STATE)), 'preexisting_installation_refused')\\\\n        validate_caddy(target)\\\\n        if mode == ['--preflight']:\\\\n            print(json.dumps({'status': 'preflight_passed', 'source_files': source_count,\\\\n                'fresh_installation': not any(exists(p) for p in (ENV, UNIT, STATE)),\\\\n                'owner_config_present': exists(installer.INPUT_CONFIG)}), flush=True)\\\\n            return 0\\\\n        need(exists(installer.INPUT_CONFIG), 'owner_not_bound')\\\\n        owner_raw = read(installer.INPUT_CONFIG, private=True, maximum=16384)\\\\n        values = installer.load_config()\\\\n        enrollment_values = installer.load_config(enrollment=True)\\\\n        need(all(values[name] == enrollment_values[name] for name in installer.REQUIRED\\\\n                 if name != 'ANALYST_OWNER_TELEGRAM_SUB'), 'enrollment_configuration_mismatch')\\\\n        need(values['BACKEND_PUBLIC_URL'] == ORIGIN\\\\n             and values['EXPECTED_PUBLIC_IPV4'] == '83.217.195.29', 'owner_target_mismatch')\\\\n        owner_hash = sha(owner_raw)\\\\n        if record is not None:\\\\n            need(record.get('owner_bound') is True\\\\n                 and record.get('owner_config_sha256') == owner_hash\\\\n                 and record.get('caddy_after_sha256') == sha(target), 'resume_owner_mismatch')\\\\n        else:\\\\n            record = {'schema_version': 1, 'operation': 'owner_backend_activation_v1',\\\\n                'owner_bound': True, 'owner_config_sha256': owner_hash,\\\\n                'caddy_before_sha256': BEFORE_SHA, 'caddy_after_sha256': sha(target),\\\\n                'unit_sha256': sha(UNIT_TEXT), 'enabled_by_helper': False}\\\\n        record['phase'] = 'preparing'\\\\n        save(record)\\\\n        operation_started = True\\\\n        if not exists(CONFIG):\\\\n            os.mkdir(CONFIG, 0o700); syncdir(CONFIG.parent)\\\\n        directory(CONFIG, mode=0o700)\\\\n        wanted = {key: values[key] for key in installer.REQUIRED if key != 'EXPECTED_PUBLIC_IPV4'}\\\\n        wanted.update(PUBLIC_ENV)\\\\n        from cryptography.fernet import Fernet\\\\n        if exists(ENV):\\\\n            env_raw = read(ENV, private=True, maximum=16384)\\\\n            stored = parse_environment(env_raw)\\\\n            key = stored.pop('FERNET_KEY', None)\\\\n            need(isinstance(key, str) and stored == wanted, 'existing_environment_mismatch')\\\\n            Fernet(key.encode('ascii'))\\\\n            if record.get('env_sha256'):\\\\n                need(record['env_sha256'] == sha(env_raw), 'environment_changed')\\\\n        else:\\\\n            need(not record.get('env_sha256'), 'existing_environment_missing')\\\\n            if exists(STATE):\\\\n                need(STATE.is_dir() and not STATE.is_symlink() and not any(STATE.iterdir()),\\\\n                     'data_without_environment_refused')\\\\n            wanted['FERNET_KEY'] = Fernet.generate_key().decode('ascii')\\\\n            env_raw = ''.join(name + '=' + json.dumps(value, ensure_ascii=True) + '\\\\\\\\n'\\\\n                              for name, value in sorted(wanted.items())).encode()\\\\n            put(ENV, env_raw, 0o600, exclusive=True)\\\\n        record['env_sha256'] = sha(env_raw)\\\\n        save(record)\\\\n        prepare_state(uid, gid)\\\\n        if exists(UNIT):\\\\n            need(read(UNIT) == UNIT_TEXT, 'existing_unit_mismatch')\\\\n        else:\\\\n            put(UNIT, UNIT_TEXT, 0o644, exclusive=True)\\\\n        record['phase'] = 'starting'\\\\n        save(record)\\\\n        command(['/usr/sbin/runuser', '-u', 'analyst-ai', '--', '/usr/bin/test', '-r',\\\\n                 '/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json'], 3)\\\\n        command(['/usr/bin/systemctl', 'daemon-reload'], 8)\\\\n        command(['/usr/bin/systemctl', 'start', SERVICE], 12)\\\\n        until = min(END, time.monotonic() + 35)\\\\n        ready = False\\\\n        while time.monotonic() < until:\\\\n            if healthy(): ready = True; break\\\\n            time.sleep(.4)\\\\n        need(ready, 'backend_startup_failed')\\\\n        counts = registry_checks(values, uid)\\\\n        probes(public=False)\\\\n        record.update(phase='locally_verified', counts=counts)\\\\n        save(record)\\\\n        replace_caddy(target, {BEFORE_SHA, sha(target)})\\\\n        command(['/usr/bin/systemctl', 'reload', 'caddy'], 10)\\\\n        probes(public=True)\\\\n        verify_public_apk()\\\\n        record['enabled_by_helper'] = True\\\\n        save(record)\\\\n        command(['/usr/bin/systemctl', 'enable', SERVICE], 5)\\\\n        record.update(phase='verified', https_verified=True, caddy_restored=False,\\\\n                      scheduler_enabled=False, paid_ai_enabled=False)\\\\n        save(record)\\\\n        print(json.dumps({'status': 'activated', 'https_verified': True,\\\\n                          'owner_bound': True, 'scheduler_enabled': False,\\\\n                          'paid_ai_enabled': False, 'counts': counts}), flush=True)\\\\n        return 0\\\\n    except Exception as error:\\\\n        error_code = error.args[0] if isinstance(error, Halt) else 'activation_not_completed'\\\\n        rolled_back = False\\\\n        if operation_started and before is not None and target is not None:\\\\n            try:\\\\n                record['last_error'] = error_code\\\\n                rolled_back = rollback(before, target, record)\\\\n            except Exception:\\\\n                rolled_back = False\\\\n        print(json.dumps({'status': error_code, 'rollback_complete': rolled_back}), flush=True)\\\\n        return 1\\\\n    finally:\\\\n        signal.setitimer(signal.ITIMER_REAL, 0)\\\\n        if lock is not None: os.close(lock)\\\\n\\\\nif __name__ == '__main__':\\\\n    try:\\\\n        raise SystemExit(main())\\\\n    except Exception:\\\\n        print('{\\\\\\\"status\\\\\\\":\\\\\\\"activation_not_completed\\\\\\\",\\\\\\\"rollback_complete\\\\\\\":false}', flush=True)\\\\n        raise SystemExit(1)\\\\n\\\";new=\\\"#!/usr/bin/env python3\\\\nfrom __future__ import annotations\\\\nimport fcntl, hashlib, importlib.util, json, os, pathlib, pwd, grp\\\\nimport http.client as http_client\\\\nimport re, secrets, signal, sqlite3, ssl, stat, subprocess, sys, time\\\\nsys.dont_write_bytecode = True\\\\nP = pathlib.Path\\\\nBASE = P('/root/analyst-owner-handoff')\\\\nSNAP = BASE / 'source'\\\\nINSTALL = P('/opt/analyst-ai')\\\\nCONFIG = P('/etc/analyst-ai')\\\\nENV = CONFIG / 'backend.env'\\\\nSTATE = P('/var/lib/analyst-ai')\\\\nUNIT = P('/etc/systemd/system/analyst-ai-owner.service')\\\\nSERVICE = 'analyst-ai-owner.service'\\\\nCADDY = P('/etc/caddy/Caddyfile')\\\\nBEFORE = BASE / 'Caddyfile.before'\\\\nRECEIPT = BASE / 'backend-activation.json'\\\\nHOST = 'analyst-ai-2941515.twc1.net'\\\\nORIGIN = 'https://' + HOST\\\\nBEFORE_SHA = '80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd'\\\\nAPK_SHA = '1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74'\\\\nAPK_BYTES = 29820366\\\\nEND = time.monotonic() + 110\\\\nUNIT_TEXT = '''[Unit]\\\\nDescription=Analyst AI single-owner backend\\\\nAfter=network-online.target\\\\nWants=network-online.target\\\\n\\\\n[Service]\\\\nType=simple\\\\nUser=analyst-ai\\\\nGroup=analyst-ai\\\\nWorkingDirectory=/opt/analyst-ai/backend\\\\nEnvironmentFile=/etc/analyst-ai/backend.env\\\\nEnvironment=PYTHONDONTWRITEBYTECODE=1\\\\nEnvironment=PYTHONUNBUFFERED=1\\\\nUnsetEnvironment=TIMEWEB_AI_TOKEN TIMEWEB_CLOUD_API_KEY TIMEWEB_CLOUD_TOKEN\\\\nExecStart=/opt/analyst-ai/venv/bin/uvicorn owner_app:create_app --factory --lifespan on --host 127.0.0.1 --port 8080 --workers 1 --no-access-log\\\\nRestart=on-failure\\\\nRestartSec=5\\\\nTimeoutStartSec=35\\\\nTimeoutStopSec=10\\\\nStateDirectory=analyst-ai\\\\nStateDirectoryMode=0700\\\\nUMask=0077\\\\nMemoryAccounting=true\\\\nMemoryHigh=512M\\\\nMemoryMax=768M\\\\nMemorySwapMax=128M\\\\nTasksMax=128\\\\nNoNewPrivileges=true\\\\nPrivateTmp=true\\\\nProtectHome=true\\\\nProtectSystem=strict\\\\nReadWritePaths=/var/lib/analyst-ai\\\\nRestrictSUIDSGID=true\\\\n\\\\n[Install]\\\\nWantedBy=multi-user.target\\\\n'''.encode()\\\\nPUBLIC_ENV = {\\\\n 'BACKEND_PUBLIC_URL': ORIGIN,\\\\n 'DATABASE_PATH': str(STATE / 'backend.db'),\\\\n 'APP_DEEP_LINK': 'analystai://auth',\\\\n 'TELEGRAM_REDIRECT_URI': ORIGIN + '/auth/telegram/callback',\\\\n 'ANDROID_RELEASE_DIR': '/srv/analyst-ai-ota/releases',\\\\n 'ANDROID_UPDATES_ENABLED': 'true',\\\\n 'ANALYSIS_SCHEDULER_ENABLED': 'false',\\\\n 'AI_EXTERNAL_PROCESSING_APPROVED': 'false',\\\\n 'AI_USER_DAILY_RUB': '0',\\\\n 'AI_PROJECT_DAILY_RUB': '0',\\\\n}\\\\nclass Halt(Exception): pass\\\\ndef need(value, code):\\\\n    if not value: raise Halt(code)\\\\ndef sha(data): return hashlib.sha256(data).hexdigest()\\\\ndef exists(path): return os.path.lexists(path)\\\\ndef remaining(limit):\\\\n    value = END - time.monotonic()\\\\n    need(value > 0, 'activation_deadline')\\\\n    return min(limit, value)\\\\ndef command(argv, limit=12, required=True):\\\\n    result = subprocess.run(argv, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\\\\n                            timeout=remaining(limit), check=False)\\\\n    if required: need(result.returncode == 0, 'command_failed')\\\\n    return result.returncode\\\\n\\\\ndef directory(path, uid=0, mode=None):\\\\n    s = path.lstat()\\\\n    need(stat.S_ISDIR(s.st_mode) and s.st_uid == uid and not s.st_mode & 0o022,\\\\n         'directory_not_trusted')\\\\n    if mode is not None: need(stat.S_IMODE(s.st_mode) == mode, 'directory_mode_invalid')\\\\n\\\\ndef read(path, private=False, maximum=4 * 1024 * 1024):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\\\n    with os.fdopen(fd, 'rb') as stream:\\\\n        s = os.fstat(stream.fileno())\\\\n        need(stat.S_ISREG(s.st_mode) and s.st_uid == 0 and s.st_nlink == 1\\\\n             and not s.st_mode & 0o022 and s.st_size <= maximum, 'file_not_trusted')\\\\n        if private: need(stat.S_IMODE(s.st_mode) == 0o600, 'private_file_mode_invalid')\\\\n        data = stream.read(maximum + 1)\\\\n    need(len(data) <= maximum, 'file_too_large')\\\\n    return data\\\\n\\\\ndef syncdir(path):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\\\\n    try: os.fsync(fd)\\\\n    finally: os.close(fd)\\\\n\\\\ndef put(path, data, mode, exclusive=False, ownership=None):\\\\n    directory(path.parent)\\\\n    temporary = path.parent / ('.activation-' + secrets.token_hex(12))\\\\n    fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)\\\\n    try:\\\\n        with os.fdopen(fd, 'wb') as stream:\\\\n            if ownership is not None: os.fchown(stream.fileno(), *ownership)\\\\n            os.fchmod(stream.fileno(), mode)\\\\n            stream.write(data); stream.flush(); os.fsync(stream.fileno())\\\\n        if exclusive:\\\\n            os.link(temporary, path, follow_symlinks=False)\\\\n        else:\\\\n            if exists(path): read(path)\\\\n            os.replace(temporary, path)\\\\n        syncdir(path.parent)\\\\n    finally:\\\\n        temporary.unlink(missing_ok=True)\\\\n        syncdir(path.parent)\\\\n\\\\ndef save(record):\\\\n    put(RECEIPT, (json.dumps(record, sort_keys=True) + '\\\\\\\\n').encode(), 0o600)\\\\n\\\\ndef load_receipt():\\\\n    if not exists(RECEIPT): return None\\\\n    value = json.loads(read(RECEIPT, private=True, maximum=65536))\\\\n    need(isinstance(value, dict) and value.get('schema_version') == 1\\\\n         and value.get('operation') == 'owner_backend_activation_v1'\\\\n         and value.get('caddy_before_sha256') == BEFORE_SHA\\\\n         and value.get('unit_sha256') == sha(UNIT_TEXT), 'receipt_not_owned')\\\\n    return value\\\\n\\\\ndef caddy_target(before):\\\\n    need(sha(before) == BEFORE_SHA, 'baseline_hash_changed')\\\\n    text = before.decode('utf-8')\\\\n    pattern = (r'(?m)^[ \\\\\\\\t]*@public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*path /client/update-policy /client/apk/\\\\\\\\* /client/ready\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n[ \\\\\\\\t]*handle @public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*reverse_proxy 127\\\\\\\\.0\\\\\\\\.0\\\\\\\\.1:8081\\\\\\\\n[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*handle \\\\\\\\{\\\\\\\\n[ \\\\\\\\t]*respond \\\\\\\"Application service is being restored\\\\\\\\.\\\\\\\" 503\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n\\\\\\\\}\\\\\\\\n?\\\\\\\\Z')\\\\n    match = re.search(pattern, text)\\\\n    need(match is not None and text.startswith(HOST + ' {\\\\\\\\n'), 'caddy_tail_unexpected')\\\\n    tail = '''    @public_updates {\\\\n        method GET HEAD\\\\n        path /client/update-policy /client/apk/*\\\\n    }\\\\n    handle @public_updates {\\\\n        reverse_proxy 127.0.0.1:8081\\\\n    }\\\\n    @owner_enrollment path /auth/telegram/owner-enrollment/callback\\\\n    handle @owner_enrollment {\\\\n        respond \\\\\\\"Owner enrollment is closed.\\\\\\\" 410\\\\n    }\\\\n    handle {\\\\n        reverse_proxy 127.0.0.1:8080\\\\n    }\\\\n}\\\\n'''\\\\n    prefix = text[:match.start()]\\\\n    need(prefix.count('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n') == 1, 'maintenance_header_unexpected')\\\\n    prefix = prefix.replace('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n', '', 1)\\\\n    return ('{\\\\\\\\n    log default {\\\\\\\\n        output discard\\\\\\\\n    }\\\\\\\\n}\\\\\\\\n\\\\\\\\n'\\\\n            + prefix + tail).encode()\\\\n\\\\ndef validate_caddy(data):\\\\n    path = BASE / ('Caddyfile.activation-check-' + secrets.token_hex(8))\\\\n    put(path, data, 0o600, exclusive=True)\\\\n    try:\\\\n        command(['/usr/bin/caddy', 'validate', '--adapter', 'caddyfile', '--config', str(path)], 15)\\\\n    finally:\\\\n        path.unlink(missing_ok=True)\\\\n\\\\ndef replace_caddy(data, accepted):\\\\n    current = read(CADDY)\\\\n    need(sha(current) in accepted, 'caddy_changed_concurrently')\\\\n    info = CADDY.lstat()\\\\n    put(CADDY, data, stat.S_IMODE(info.st_mode), ownership=(info.st_uid, info.st_gid))\\\\n\\\\ndef common():\\\\n    need(os.geteuid() == 0, 'root_required')\\\\n    for path in (P('/root'), BASE, SNAP, SNAP / 'deploy', SNAP / 'backend',\\\\n                 INSTALL, INSTALL / 'backend', INSTALL / 'venv', INSTALL / 'venv/bin',\\\\n                 P('/etc'), P('/etc/caddy'), UNIT.parent, P('/var'), P('/var/lib')):\\\\n        directory(path)\\\\n    directory(BASE, mode=0o700)\\\\n    before = read(BEFORE, private=True)\\\\n    target = caddy_target(before)\\\\n    installer_path = SNAP / 'deploy/install_owner_backend.py'\\\\n    read(installer_path)\\\\n    spec = importlib.util.spec_from_file_location('activation_installer', installer_path)\\\\n    installer = importlib.util.module_from_spec(spec)\\\\n    spec.loader.exec_module(installer)\\\\n    account, group = pwd.getpwnam('analyst-ai'), grp.getgrnam('analyst-ai')\\\\n    need(account.pw_uid > 0 and group.gr_gid > 0 and account.pw_gid == group.gr_gid,\\\\n         'service_identity_invalid')\\\\n    paths = installer.source_files()\\\\n    for source in paths:\\\\n        destination = INSTALL / 'backend' / source.relative_to(SNAP / 'backend')\\\\n        directory(source.parent); directory(destination.parent)\\\\n        need(read(source) == read(destination), 'installed_source_mismatch')\\\\n    read(INSTALL / 'venv/bin/uvicorn')\\\\n    return installer, before, target, account.pw_uid, group.gr_gid, len(paths)\\\\n\\\\ndef http(path, *, public=False, method='GET', maximum=262144):\\\\n    timeout = remaining(4)\\\\n    connection = (http_client.HTTPSConnection(HOST, timeout=timeout,\\\\n                  context=ssl.create_default_context()) if public\\\\n                  else http_client.HTTPConnection('127.0.0.1', 8080, timeout=timeout))\\\\n    try:\\\\n        connection.request(method, path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        data = response.read(maximum + 1)\\\\n        need(len(data) <= maximum, 'probe_response_too_large')\\\\n        return response.status, dict((k.lower(), v) for k, v in response.getheaders()), data\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef healthy():\\\\n    try:\\\\n        code, _, data = http('/health', maximum=4096)\\\\n        return code == 200 and json.loads(data) == {'status': 'ok'}\\\\n    except (OSError, http_client.HTTPException, ValueError):\\\\n        return False\\\\n\\\\ndef probes(public=False):\\\\n    code, _, data = http('/health', public=public, maximum=4096)\\\\n    need(code == 200 and json.loads(data) == {'status': 'ok'}, 'health_failed')\\\\n    code, _, data = http('/client/update-policy?package_name=ru.omnicio.app.debug',\\\\n                         public=public, maximum=16384)\\\\n    policy = json.loads(data) if code == 200 else {}\\\\n    need(code == 200 and policy.get('package_name') == 'ru.omnicio.app.debug'\\\\n         and policy.get('version_code') == 37 and policy.get('minimum_version_code') == 37\\\\n         and policy.get('apk_sha256') == APK_SHA and policy.get('apk_bytes') == APK_BYTES,\\\\n         'ota_policy_failed')\\\\n    for path, method in (('/me', 'GET'), ('/workspace', 'GET'),\\\\n                         ('/workspace/live?wait=0', 'GET'), ('/client/ready', 'POST')):\\\\n        code, _, _ = http(path, public=public, method=method, maximum=4096)\\\\n        need(code == 401, 'anonymous_access_not_closed')\\\\n    code, headers, _ = http('/auth/telegram/start', public=public)\\\\n    need(code == 200 and 'no-store' in headers.get('cache-control', '')\\\\n         and headers.get('cross-origin-opener-policy') == 'same-origin-allow-popups',\\\\n         'login_page_failed')\\\\n    if public:\\\\n        code, _, _ = http('/auth/telegram/owner-enrollment/callback', public=True, maximum=4096)\\\\n        need(code == 410, 'enrollment_callback_not_closed')\\\\n\\\\ndef registry_checks(values, uid):\\\\n    path = STATE / 'backend.db'\\\\n    info = path.lstat()\\\\n    need(stat.S_ISREG(info.st_mode) and info.st_uid == uid\\\\n         and info.st_nlink == 1 and not info.st_mode & 0o077, 'database_file_not_private')\\\\n    db = sqlite3.connect('file:' + str(path) + '?mode=ro', uri=True, timeout=3)\\\\n    try:\\\\n        db.execute('PRAGMA query_only=ON')\\\\n        need(db.execute('PRAGMA quick_check').fetchone() == ('ok',), 'database_check_failed')\\\\n        owners = db.execute('SELECT singleton,telegram_sub FROM installation_owner').fetchall()\\\\n        need(owners == [(1, values['ANALYST_OWNER_TELEGRAM_SUB'])], 'owner_registry_mismatch')\\\\n        total = db.execute('SELECT count(*) FROM users').fetchone()[0]\\\\n        foreign = db.execute('SELECT count(*) FROM users WHERE telegram_sub<>?',\\\\n                             (values['ANALYST_OWNER_TELEGRAM_SUB'],)).fetchone()[0]\\\\n        need(total <= 1 and foreign == 0, 'unexpected_user_data')\\\\n        guards = db.execute(\\\\\\\"SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'owner_%'\\\\\\\").fetchone()[0]\\\\n        live = db.execute('SELECT count(*) FROM workspace_live_global WHERE singleton=1').fetchone()[0]\\\\n        need(guards >= 6 and live == 1, 'startup_guards_missing')\\\\n        return {'users': total, 'sessions': db.execute('SELECT count(*) FROM sessions').fetchone()[0],\\\\n                'owner_records': len(owners), 'owner_guards': guards, 'live_global_records': live}\\\\n    finally:\\\\n        db.close()\\\\n\\\\n\\\\ndef verify_public_apk():\\\\n    path = '/client/apk/Analyst-AI-37-' + APK_SHA + '.apk?package_name=ru.omnicio.app.debug'\\\\n    connection = http_client.HTTPSConnection(HOST, timeout=remaining(8),\\\\n                                            context=ssl.create_default_context())\\\\n    try:\\\\n        connection.request('GET', path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        need(response.status == 200, 'public_apk_unavailable')\\\\n        need(int(response.getheader('Content-Length', '-1')) == APK_BYTES,\\\\n             'public_apk_size_mismatch')\\\\n        total = 0\\\\n        checksum = hashlib.sha256()\\\\n        while True:\\\\n            remaining(1)\\\\n            chunk = response.read(262144)\\\\n            if not chunk: break\\\\n            total += len(chunk)\\\\n            need(total <= APK_BYTES, 'public_apk_size_mismatch')\\\\n            checksum.update(chunk)\\\\n        need(total == APK_BYTES and checksum.hexdigest() == APK_SHA,\\\\n             'public_apk_hash_mismatch')\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef parse_environment(raw):\\\\n    result = {}\\\\n    for line in raw.decode('utf-8').splitlines():\\\\n        name, separator, value = line.partition('=')\\\\n        need(separator and re.fullmatch(r'[A-Z][A-Z0-9_]*', name)\\\\n             and name not in result, 'environment_format_invalid')\\\\n        parsed = json.loads(value)\\\\n        need(isinstance(parsed, str), 'environment_format_invalid')\\\\n        result[name] = parsed\\\\n    return result\\\\n\\\\ndef rollback(before, target, record):\\\\n    global END\\\\n    END = time.monotonic() + 25\\\\n    signal.setitimer(signal.ITIMER_REAL, 27)\\\\n    caddy_ok = unit_ok = False\\\\n    try:\\\\n        if record is None:\\\\n            return sha(read(CADDY)) == BEFORE_SHA and not exists(UNIT)\\\\n        need(record.get('owner_bound') is True\\\\n             and record.get('caddy_after_sha256') == sha(target), 'rollback_not_owned')\\\\n        try:\\\\n            replace_caddy(before, {BEFORE_SHA, sha(target)})\\\\n            command(['/usr/bin/systemctl', 'reload', 'caddy'], 8)\\\\n            caddy_ok = sha(read(CADDY)) == BEFORE_SHA\\\\n        except Exception:\\\\n            caddy_ok = False\\\\n        try:\\\\n            if exists(UNIT):\\\\n                need(read(UNIT) == UNIT_TEXT, 'rollback_unit_not_owned')\\\\n                command(['/usr/bin/systemctl', 'stop', SERVICE], 12)\\\\n                if record.get('enabled_by_helper'):\\\\n                    command(['/usr/bin/systemctl', 'disable', SERVICE], 3)\\\\n                unit_ok = command(['/usr/bin/systemctl', 'is-active', '--quiet', SERVICE],\\\\n                                  2, required=False) == 3\\\\n            else:\\\\n                unit_ok = True\\\\n        except Exception:\\\\n            unit_ok = False\\\\n        record.update(phase='rolled_back' if caddy_ok and unit_ok else 'rollback_incomplete',\\\\n                      caddy_restored=caddy_ok, backend_stopped=unit_ok)\\\\n        try: save(record)\\\\n        except Exception: return False\\\\n        return caddy_ok and unit_ok\\\\n    finally:\\\\n        signal.setitimer(signal.ITIMER_REAL, 0)\\\\n\\\\ndef prepare_state(uid, gid):\\\\n    if not exists(STATE):\\\\n        os.mkdir(STATE, 0o700)\\\\n        os.chown(STATE, uid, gid)\\\\n        syncdir(STATE.parent)\\\\n    else:\\\\n        info = STATE.lstat()\\\\n        need(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700,\\\\n             'state_directory_invalid')\\\\n        if info.st_uid == 0:\\\\n            need(not any(STATE.iterdir()), 'unexpected_root_owned_state')\\\\n            os.chown(STATE, uid, gid)\\\\n        directory(STATE, uid=uid, mode=0o700)\\\\n        need(STATE.lstat().st_gid == gid, 'state_group_invalid')\\\\n\\\\ndef cancelled(_signum, _frame):\\\\n    raise Halt('activation_cancelled')\\\\n\\\\ndef main():\\\\n    global END\\\\n    need(sys.argv[1:] in ([], ['--preflight'], ['--rollback']), 'unsupported_arguments')\\\\n    mode = sys.argv[1:] or ['activate']\\\\n    for sig in (signal.SIGTERM, signal.SIGHUP, signal.SIGINT, signal.SIGALRM):\\\\n        signal.signal(sig, cancelled)\\\\n    signal.setitimer(signal.ITIMER_REAL, 115)\\\\n    lock = None\\\\n    record = None\\\\n    before = target = None\\\\n    operation_started = False\\\\n    try:\\\\n        installer, before, target, uid, gid, source_count = common()\\\\n        lock = os.open(BASE / 'backend-activation.lock',\\\\n                       os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)\\\\n        info = os.fstat(lock)\\\\n        need(stat.S_ISREG(info.st_mode) and info.st_uid == 0 and info.st_nlink == 1\\\\n             and stat.S_IMODE(info.st_mode) == 0o600, 'lock_not_private')\\\\n        fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\\\\n        record = load_receipt()\\\\n        if mode == ['--rollback']:\\\\n            ok = rollback(before, target, record)\\\\n            print(json.dumps({'status': 'rolled_back' if ok else 'rollback_incomplete',\\\\n                              'rollback_complete': ok}), flush=True)\\\\n            return 0 if ok else 1\\\\n        current_sha = sha(read(CADDY))\\\\n        need(current_sha == BEFORE_SHA or\\\\n             (record is not None and record.get('owner_bound') is True\\\\n              and record.get('caddy_after_sha256') == sha(target)\\\\n              and current_sha == sha(target)), 'unexpected_active_caddy')\\\\n        if record is None:\\\\n            need(not any(exists(p) for p in (ENV, UNIT, STATE)), 'preexisting_installation_refused')\\\\n        validate_caddy(target)\\\\n        if mode == ['--preflight']:\\\\n            print(json.dumps({'status': 'preflight_passed', 'source_files': source_count,\\\\n                'fresh_installation': not any(exists(p) for p in (ENV, UNIT, STATE)),\\\\n                'owner_config_present': exists(installer.INPUT_CONFIG)}), flush=True)\\\\n            return 0\\\\n        need(exists(installer.INPUT_CONFIG), 'owner_not_bound')\\\\n        owner_raw = read(installer.INPUT_CONFIG, private=True, maximum=16384)\\\\n        values = installer.load