name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import pathlib,json,subprocess,datetime,os,pwd\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\narchive=pathlib.Path(\"/root/analyst-redesign-20261024\")\nreport=state/\"build-result.json\"\nbefore=json.loads(report.read_text())\nassert before[\"started_at\"]==\"2026-10-24T18:26:42.750933+00:00\",\"different_build_started\"\n(archive/\"build-before-phased-execution.json\").write_text(json.dumps(before,indent=2)+\"\\n\")\nsubprocess.run([\"systemctl\",\"stop\",\"analyst-redesign-build-controller.service\"],timeout=20,check=True)\nsubprocess.run([\"systemctl\",\"stop\",\"analyst-workspace@build.service\"],timeout=55,check=True)\nlatest=json.loads(report.read_text())\nif latest.get(\"status\")==\"running\":\n    latest.update(status=\"interrupted\",finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),\n        interruption_reason=\"Measured swap pressure and Gradle metaspace warning; preserve caches and rerun all tasks in separate sequential JVMs\")\n    report.write_text(json.dumps(latest,indent=2)+\"\\n\")\n    owner=pwd.getpwnam(\"analyst-build\");os.chown(report,owner.pw_uid,owner.pw_gid)\n(archive/\"build-before-phased-execution-final.json\").write_text(json.dumps(latest,indent=2)+\"\\n\")\nprint(\"BUILD_PREVIOUS_RESULT=\"+json.dumps(latest),flush=True)\npipeline=root/\"deploy/timeweb_workspace.py\"\ncontent=pipeline.read_text()\nold='''                run(\"gradle\",[\"./gradlew\",\":app:testDebugUnitTest\",\":app:lintDebug\",\":app:lintPreview\",\":app:assembleDebug\",\":app:assembleRelease\",\":app:assemblePreview\",\":ci-ui-driver:lintDebug\",\":ci-ui-driver:assembleDebug\",\"--no-daemon\",\"--no-parallel\",\"--max-workers=1\",*extra],7200)'''\nnew='''                gradle_flags=[\"--no-daemon\",\"--no-parallel\",\"--max-workers=1\",*extra]\n                tasks=[\":app:testDebugUnitTest\",\":app:lintDebug\",\":app:lintPreview\",\n                    \":app:assembleDebug\",\":app:assembleRelease\",\":app:assemblePreview\",\n                    \":ci-ui-driver:lintDebug\",\":ci-ui-driver:assembleDebug\"]\n                if os.environ.get(\"ANALYST_BUILD_PROFILE\") == \"bounded-swap\":\n                    # Measured combined Kotlin/lint classloader retention caused\n                    # sustained paging and a metaspace exhaustion warning on 1GiB.\n                    # Fresh sequential JVMs retain every gate and reuse disk caches.\n                    for label,batch in [\n                        (\"unit\",[tasks[0]]),(\"debug-lint\",[tasks[1]]),\n                        (\"preview-lint\",[tasks[2]]),(\"debug-apk\",[tasks[3]]),\n                        (\"release-apk\",[tasks[4]]),(\"preview-apk\",[tasks[5]]),\n                        (\"driver\",tasks[6:])]:\n                        run(\"gradle-\"+label,[\"./gradlew\",*batch,*gradle_flags],7200)\n                else:\n                    run(\"gradle\",[\"./gradlew\",*tasks,*gradle_flags],7200)'''\nassert content.count(old)==1,\"unexpected_gradle_pipeline\"\ncontent=content.replace(old,new).replace(\"-XX:MaxMetaspaceSize=384m\",\"-XX:MaxMetaspaceSize=512m\")\npipeline.write_text(content)\nowner=pwd.getpwnam(\"analyst-build\");os.chown(pipeline,owner.pw_uid,owner.pw_gid)\nprint(\"BUILD_PHASED_EXECUTION_CONFIGURED\",flush=True)\n\nimport pathlib,json,subprocess,os,pwd,hashlib,datetime\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nfor stage in (\"check\",\"build\",\"runtime\"):\n    active=subprocess.run([\"systemctl\",\"is-active\",\"analyst-workspace@\"+stage+\".service\"],stdout=subprocess.PIPE,text=True).stdout.strip()\n    assert active not in (\"activating\",\"deactivating\"),\"workspace_stage_still_active\"\nstaging=pathlib.Path(\"/root/analyst-redesign-20261024/native-renderer-gate\")\nsources={\n    \".github/scripts/native_renderer_evidence.py\":staging/\"native_renderer_evidence.py\",\n    \".github/scripts/tests/test_native_renderer_evidence.py\":staging/\"test_native_renderer_evidence.py\",\n}\nchanges={relative:source.read_text() for relative,source in sources.items()}\npath=root/\".github/scripts/test_apk_installation.py\"\ncontent=path.read_text()\nold='''        EMULATOR_FEATURES, EMULATOR_GPU_MODE, read_filament_renderer,\n        require_guest_angle, snapshot_system_graphics,\n    )'''\nnew='''        EMULATOR_FEATURES, EMULATOR_GPU_MODE, snapshot_system_graphics,\n    )\n    from native_renderer_evidence import read_native_renderer'''\nassert content.count(old)==1,\"unexpected_installer_imports\"\ncontent=content.replace(old,new)\nold='''            # The UID can survive reinstalls/restarts: only this fresh pidof PID\n            # may supply the context header for this particular launch record.\n            renderer = read_filament_renderer(device, uid=uid, pid=alive.stdout.strip())\n            result[\"renderer\"] = renderer\n            print(\"EMULATOR_FILAMENT_GLES=\" + json.dumps(\n                {\"launch\": label, **renderer}, sort_keys=True), flush=True)\n            require_guest_angle(renderer)'''\nnew='''            # Native 2D uses Android HWUI, with no Filament engine. Require\n            # completed frames from this exact still-running candidate process.\n            # Full interaction/performance evidence is collected separately.\n            renderer = read_native_renderer(device, uid=uid, pid=alive.stdout.strip())\n            result[\"renderer\"] = renderer\n            print(\"EMULATOR_NATIVE_HWUI=\" + json.dumps(\n                {\"launch\": label, **renderer}, sort_keys=True), flush=True)'''\nassert content.count(old)==1,\"unexpected_installer_renderer_gate\"\ncontent=content.replace(old,new)\nold='''                # Guest ANGLE compiles the app's GLES and uses guest Vulkan.\n                # Windows host GLES can remain legacy SwiftShader even when a\n                # modern software Vulkan ICD is selected. Observe the app's\n                # actual context above; neither a flag nor SF proves this path.'''\nnew='''                # Keep the tested software graphics environment. The native\n                # candidate's own completed HWUI frames are measured separately;\n                # requested flags or SurfaceFlinger alone do not prove rendering.'''\nassert content.count(old)==1\nchanges[\".github/scripts/test_apk_installation.py\"]=content.replace(old,new)\nignore=root/\".gitignore\"\nif \".kotlin/\" not in ignore.read_text().splitlines():\n    changes[\".gitignore\"]=ignore.read_text().rstrip()+\"\\n\\n# Kotlin compiler sessions are transient build output.\\n.kotlin/\\n\"\nowner=pwd.getpwnam(\"analyst-build\")\nfor name,body in changes.items():\n    target=root/name\n    target.write_text(body)\n    os.chown(target,owner.pw_uid,owner.pw_gid)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=root,check=True)\nproof={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\n       \"files\":{name:hashlib.sha256(body.encode()).hexdigest() for name,body in changes.items()},\n       \"scope\":\"native launch evidence; all installation/UI/page-size gates retained\"}\np=state/\"native-renderer-gate-change.json\"\np.write_text(json.dumps(proof,indent=2)+\"\\n\");p.chmod(0o600)\nprint(\"NATIVE_RENDERER_GATE_APPLIED=\"+json.dumps(proof),flush=True)\nsubprocess.run([\"systemctl\",\"reset-failed\",\"analyst-workspace@check.service\",\"analyst-workspace@build.service\"],check=False)\nsubprocess.run([\"systemctl\",\"start\",\"--no-block\",\"analyst-workspace@check.service\"],check=True)\nprint(\"NATIVE_RENDERER_CHECK_STARTED\",flush=True)\n\n\nsubprocess.run([\"systemd-run\",\"--unit=analyst-redesign-build-controller-v2\",\n    \"--property=Type=exec\",\"--property=Restart=no\",\n    \"/usr/bin/python3\",\"/root/analyst-redesign-20261024/after-check-build.py\"],check=True)\nprint(\"BUILD_PHASED_CONTROLLER_STARTED\",flush=True)\n"
                      result=subprocess.run([*command,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=300)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("REDESIGN_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-5000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
