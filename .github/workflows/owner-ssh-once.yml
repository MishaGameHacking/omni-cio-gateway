name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,hashlib,io,tarfile,gzip,base64,shutil\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\ndirectory=pathlib.Path(\"/var/lib/analyst-ai-build/runs/20261025T110508321822Z-runtime-leaf-4k\")\nunit=\"analyst-ai-runtime-leaf-4k-fdb.service\"\nprops=subprocess.check_output([\"systemctl\",\"show\",unit,\"--property=ActiveState,SubState,Result,ExecMainStatus\"],text=True)\nreceipt=json.loads((directory/\"leaf-result.json\").read_text())\nprint(\"REDESIGN_RUNTIME_LEAF_UNIT=\"+json.dumps(props),flush=True)\nprint(\"REDESIGN_RUNTIME_LEAF_RECEIPT=\"+json.dumps(receipt),flush=True)\nif receipt.get(\"status\")==\"running\" or \"ActiveState=activating\" in props or (\"ActiveState=active\" in props and \"SubState=exited\" not in props):\n print(\"REDESIGN_CASH_APPLY_PENDING=\"+json.dumps({\"reason\":\"runtime_inputs_still_frozen\"}),flush=True)\n raise SystemExit(0)\nassert receipt.get(\"finished_at\") and receipt.get(\"remaining_owned_processes\")==0\nassert receipt.get(\"source_sha256_after\")==\"fdb272e3b396586631babd98392590c1562b2c5bafd981dffa831e035b9b7f5c\"\nassert receipt.get(\"hashes_after\")==receipt.get(\"frozen_hashes\")\nfiles=[]\nfor p in sorted(directory.rglob(\"*\")):\n if p.is_file() and p.suffix in (\".json\",\".jsonl\",\".log\",\".txt\",\".xml\",\".png\"):\n  assert not p.is_symlink()\n  assert p.resolve().is_relative_to(directory.resolve())\n  files.append((str(p.relative_to(directory)),p))\nfiles.append((\"runner-source.py\",state/\"runtime_leaf_4k_fdb.py\"))\nfor p in sorted((state/\"diagnostics\").glob(\"leaf-memory-*.json\")):\n if json.loads(p.read_text()).get(\"unit\")==unit:files.append((\"memory/\"+p.name,p))\ntotal=sum(p.stat().st_size for _,p in files)\nassert total<=32*1024*1024,\"runtime_archive_requires_separate_image_export\"\nbuf=io.BytesIO();metadata=[]\nwith gzip.GzipFile(fileobj=buf,mode=\"wb\",mtime=0) as gz:\n with tarfile.open(fileobj=gz,mode=\"w\") as archive:\n  for name,p in files:\n   raw=p.read_bytes();metadata.append({\"path\":name,\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest()})\n   info=tarfile.TarInfo(name);info.size=len(raw);info.mode=0o644;info.mtime=0;archive.addfile(info,io.BytesIO(raw))\nraw=buf.getvalue();encoded=base64.b64encode(raw).decode()\nassert len(raw)<=4*1024*1024,\"compressed_runtime_archive_too_large\"\nprint(\"REDESIGN_RUNTIME_ARCHIVE_META=\"+json.dumps({\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest(),\"git_blob\":hashlib.sha1(b\"blob \"+str(len(raw)).encode()+b\"\\0\"+raw).hexdigest(),\"files\":metadata,\"base64_chars\":len(encoded)}),flush=True)\nfor i in range(0,len(encoded),60000):\n print(\"REDESIGN_RUNTIME_ARCHIVE_CHUNK=\"+json.dumps({\"index\":i//60000,\"data\":encoded[i:i+60000]}),flush=True)\nif receipt.get(\"status\")==\"leaf_passed\":\n print(\"REDESIGN_CASH_APPLY_PENDING=\"+json.dumps({\"reason\":\"successful_leaf_requires_runtime_matrix_decision\"}),flush=True)\n raise SystemExit(0)\nRUNUSER=shutil.which(\"runuser\");assert RUNUSER\nINNER=\"PAYLOAD=\\\"\\\"\\nHELPER=\\\"import base64,zlib,json,pathlib,hashlib,os,pwd,fcntl,tempfile,datetime,sys\\\\nroot=pathlib.Path(\\\\\\\"/srv/analyst-ai/workspace\\\\\\\")\\\\nstate=pathlib.Path(\\\\\\\"/var/lib/analyst-ai-build\\\\\\\")\\\\nassert os.geteuid()==pwd.getpwnam(\\\\\\\"analyst-build\\\\\\\").pw_uid\\\\nassert root.is_dir() and not root.is_symlink()\\\\nlock=(state/\\\\\\\"workspace.lock\\\\\\\").open(\\\\\\\"a\\\\\\\")\\\\nfcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\\\ndef blob(raw):return hashlib.sha1(b\\\\\\\"blob \\\\\\\"+str(len(raw)).encode()+b\\\\\\\"\\\\\\\\0\\\\\\\"+raw).hexdigest()\\\\ndeltas=[json.loads(zlib.decompress(base64.b64decode(s))) for s in PARTS]\\\\nchanges=[]\\\\nfor d in deltas:\\\\n relative=d[\\\\\\\"path\\\\\\\"];p=root/relative\\\\n assert not relative.startswith(\\\\\\\"/\\\\\\\") and \\\\\\\"..\\\\\\\" not in pathlib.PurePosixPath(relative).parts\\\\n for part in (p,*p.parents):\\\\n  if part==root:break\\\\n  assert not part.is_symlink(),\\\\\\\"source_symlink\\\\\\\"\\\\n old=p.read_bytes() if p.exists() else None\\\\n assert (None if old is None else blob(old))==d[\\\\\\\"old_blob\\\\\\\"],\\\\\\\"source_changed:\\\\\\\"+relative\\\\n if \\\\\\\"content\\\\\\\" in d:new=d[\\\\\\\"content\\\\\\\"].encode()\\\\n else:\\\\n  lines=old.decode().splitlines(keepends=True)\\\\n  for h in reversed(d[\\\\\\\"hunks\\\\\\\"]):\\\\n   assert 0<=h[\\\\\\\"start\\\\\\\"]<=h[\\\\\\\"end\\\\\\\"]<=len(lines)\\\\n   lines[h[\\\\\\\"start\\\\\\\"]:h[\\\\\\\"end\\\\\\\"]]=h[\\\\\\\"lines\\\\\\\"]\\\\n  new=\\\\\\\"\\\\\\\".join(lines).encode()\\\\n changes.append((relative,p,old,new))\\\\nbackup=state/\\\\\\\"diagnostics\\\\\\\"/(\\\\\\\"redesign-source-\\\\\\\"+datetime.datetime.now(datetime.timezone.utc).strftime(\\\\\\\"%Y%m%dT%H%M%S%fZ\\\\\\\"))\\\\nbackup.mkdir(parents=True,exist_ok=False)\\\\nfor relative,p,old,new in changes:\\\\n if old is not None:\\\\n  q=backup/relative;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(old)\\\\n p.parent.mkdir(parents=True,exist_ok=True)\\\\n fd,name=tempfile.mkstemp(prefix=\\\\\\\".\\\\\\\"+p.name+\\\\\\\".redesign-\\\\\\\",dir=p.parent)\\\\n try:\\\\n  with os.fdopen(fd,\\\\\\\"wb\\\\\\\") as f:f.write(new);f.flush();os.fsync(f.fileno())\\\\n  os.chmod(name,0o644);os.replace(name,p)\\\\n finally:\\\\n  if os.path.exists(name):os.unlink(name)\\\\n print(\\\\\\\"REDESIGN_SOURCE_FILE=\\\\\\\"+json.dumps({\\\\\\\"path\\\\\\\":relative,\\\\\\\"bytes\\\\\\\":len(new),\\\\\\\"sha256\\\\\\\":hashlib.sha256(new).hexdigest(),\\\\\\\"git_blob\\\\\\\":blob(new)}),flush=True)\\\\nsys.path.insert(0,str(root/\\\\\\\"deploy\\\\\\\"))\\\\nimport timeweb_workspace as workspace\\\\nprint(\\\\\\\"REDESIGN_SOURCE_APPLIED=\\\\\\\"+json.dumps({\\\\\\\"files\\\\\\\":len(changes),\\\\\\\"backup\\\\\\\":str(backup),\\\\\\\"source_sha256\\\\\\\":workspace.source_hash(),\\\\\\\"tests_run\\\\\\\":False}),flush=True)\\\\n\\\"\\nimport base64,zlib,json,hashlib,sys\\nraw=zlib.decompress(base64.b64decode(PAYLOAD))\\nassert hashlib.sha256(raw).hexdigest()==\\\"37bf2c2126f6d607285d56374519bff0bafdb4d0f6bbd02c22d7c19eb720cb7b\\\"\\nbundle=json.loads(raw)\\nsys.path.insert(0,\\\"/srv/analyst-ai/workspace/deploy\\\")\\nimport timeweb_workspace as ws\\nassert ws.source_hash()==\\\"fdb272e3b396586631babd98392590c1562b2c5bafd981dffa831e035b9b7f5c\\\"\\nPARTS=[base64.b64encode(zlib.compress(json.dumps({\\\"path\\\":f[\\\"path\\\"],\\\"old_blob\\\":f[\\\"old\\\"][\\\"git_blob\\\"],\\\"content\\\":f[\\\"content\\\"]}).encode())).decode() for f in bundle[\\\"files\\\"]]\\nexec(HELPER,{\\\"PARTS\\\":PARTS})\\n\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-build\",\"--\",\"python3\",\"-B\",\"-\"],input=INNER,text=True,cwd=\"/srv/analyst-ai/workspace\",capture_output=True,timeout=60)\nprint(p.stdout,flush=True)\nif p.returncode:\n print(\"REDESIGN_PATCH_ERROR=\"+json.dumps({\"stderr\":p.stderr[-2000:]}),flush=True)\n raise SystemExit(p.returncode)\nsubprocess.run([\"systemctl\",\"restart\",\"--no-block\",\"analyst-workspace@check.service\"],check=True,capture_output=True,text=True,timeout=15)\nprint(\"REDESIGN_CHECK_STARTED=\"+json.dumps({\"reason\":\"confirmed_cash_overlap_fix\"}),flush=True)\n",timeout=150)
          PY
