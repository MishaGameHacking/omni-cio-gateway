name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nr=subprocess.run(['/opt/analyst-ai/venv/bin/python','-I','-B','-c',\"import hashlib,http.client,importlib.util,json,os,sqlite3,ssl,stat,subprocess,sys,time\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\");SESSION=\\\"c975ebbf-6348-402f-ad62-3c44d57c7c26\\\"\\ndef safe_json(path):\\n fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)\\n with os.fdopen(fd,\\\"rb\\\") as source:\\n  s=os.fstat(source.fileno());assert s.st_uid==0 and stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode)==0o600 and s.st_nlink==1 and s.st_size<65536\\n  value=json.load(source);assert type(value) is dict;return value\\ndef selected(value,keys):return {key:value.get(key) for key in keys if key in value}\\nstate=safe_json(ROOT/\\\"state.json\\\");assert state[\\\"session_id\\\"]==SESSION\\nprint(\\\"OWNER_RETRY_STATE=\\\"+json.dumps(selected(state,(\\\"server_id\\\",\\\"session_id\\\",\\\"phase\\\",\\\"owner_config_created\\\",\\\"caddy_restored\\\",\\\"error\\\"))),flush=True)\\nfor file,label,keys in [\\n (\\\"retry-result.json\\\",\\\"OWNER_RETRY_RESULT\\\",(\\\"session_id\\\",\\\"phase\\\",\\\"owner_binding_completed\\\",\\\"backend_activated\\\",\\\"error\\\",\\\"started_at\\\",\\\"completed_at\\\",\\\"finished_at\\\")),\\n (\\\"enrollment-failure-\\\"+SESSION+\\\".json\\\",\\\"OWNER_ENROLLMENT_DIAGNOSTIC\\\",(\\\"session_id\\\",\\\"code\\\",\\\"exception_type\\\",\\\"errno\\\",\\\"at\\\")),\\n (\\\"backend-activation.json\\\",\\\"OWNER_BACKEND_ACTIVATION\\\",(\\\"phase\\\",\\\"owner_bound\\\",\\\"https_verified\\\",\\\"scheduler_enabled\\\",\\\"paid_ai_enabled\\\",\\\"counts\\\",\\\"last_error\\\",\\\"caddy_restored\\\",\\\"backend_stopped\\\"))]:\\n if (ROOT/file).exists():print(label+\\\"=\\\"+json.dumps(selected(safe_json(ROOT/file),keys)),flush=True)\\nfor unit in (\\\"analyst-owner-enrollment.service\\\",\\\"analyst-owner-retry.service\\\",\\\"analyst-ai-owner.service\\\",\\\"analyst-ai-updates.service\\\",\\\"caddy.service\\\"):\\n r=subprocess.run([\\\"systemctl\\\",\\\"show\\\",unit,\\\"--property=LoadState,ActiveState,SubState,MainPID,ExecMainStatus,MemoryCurrent\\\"],capture_output=True,text=True,timeout=8)\\n properties=dict(line.split(\\\"=\\\",1) for line in r.stdout.splitlines() if \\\"=\\\" in line)\\n print(\\\"OWNER_SERVICE_STATE=\\\"+json.dumps({\\\"unit\\\":unit,\\\"properties\\\":properties}),flush=True)\\nprint(\\\"OWNER_RUNTIME_FILES=\\\"+json.dumps({\\\"owner_config_exists\\\":Path(\\\"/root/analyst-ai-owner.json\\\").exists(),\\\"environment_exists\\\":Path(\\\"/etc/analyst-ai/backend.env\\\").exists(),\\\"database_exists\\\":Path(\\\"/var/lib/analyst-ai/backend.db\\\").exists(),\\\"caddy_sha256\\\":hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()}),flush=True)\\nchecks=[]\\nfor port in (8080,8081):\\n for method,path in ((\\\"GET\\\",\\\"/health\\\"),(\\\"GET\\\",\\\"/client/update-policy?package_name=ru.omnicio.app.debug\\\"),(\\\"GET\\\",\\\"/workspace\\\"),(\\\"GET\\\",\\\"/workspace/live?wait=0\\\"),(\\\"POST\\\",\\\"/client/ready\\\")):\\n  connection=http.client.HTTPConnection(\\\"127.0.0.1\\\",port,timeout=4)\\n  try:\\n   connection.request(method,path,headers={\\\"Host\\\":\\\"analyst-ai-2941515.twc1.net\\\",\\\"Connection\\\":\\\"close\\\"})\\n   response=connection.getresponse();data=response.read(16385)\\n   result={\\\"port\\\":port,\\\"method\\\":method,\\\"path\\\":path.split(\\\"?\\\")[0],\\\"status\\\":response.status}\\n   if path.startswith(\\\"/client/update-policy\\\") and response.status==200:\\n    policy=json.loads(data);result.update({key:policy.get(key) for key in (\\\"version_code\\\",\\\"minimum_version_code\\\",\\\"apk_sha256\\\",\\\"apk_bytes\\\")})\\n   checks.append(result)\\n  except (OSError,http.client.HTTPException,ValueError) as error:checks.append({\\\"port\\\":port,\\\"path\\\":path.split(\\\"?\\\")[0],\\\"error_type\\\":type(error).__name__})\\n  finally:connection.close()\\nprint(\\\"OWNER_LOOPBACK_STATUS=\\\"+json.dumps(checks),flush=True)\\n\"],timeout=100)\nraise SystemExit(r.returncode)",timeout=150)
          PY
