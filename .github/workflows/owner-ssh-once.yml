name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")

                      delivery=pathlib.Path(os.environ["RUNNER_TEMP"])/"analyst-apk-delivery"
                      delivery.mkdir(mode=0o700)
                      target=delivery/"Analyst-AI-0.12.0-preview-36.apk"
                      with target.open("xb") as output:
                          copied=subprocess.run([*cmd,"cat -- /srv/analyst-ai/workspace/app/build/outputs/apk/preview/app-preview.apk"],stdout=output,stderr=subprocess.PIPE,timeout=120)
                      assert copied.returncode==0,"apk_transfer_failed"
                      assert hashlib.sha256(target.read_bytes()).hexdigest()=="c62c7bb9b2c0fd454ec00985f869f3f9fa3023ed555ced9b5e0ae2a107e7f8d2","apk_transfer_hash_mismatch"
                      print("APK_TRANSFER_VERIFIED=true",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("\nimport pathlib,os,json,stat,hashlib,subprocess,fcntl,re\nkey=\"AAAAC3NzaC1lZDI1NTE5AAAAINhUdUC+GkGLXN/SOnESID3LSHluSHRhM0Ames5gtDo0\"\ntarget=pathlib.Path(\"/root/.ssh/authorized_keys\")\nassert target.is_file() and not target.is_symlink() and target.stat().st_uid==0\nwith target.open(\"r+\") as f:\n    fcntl.flock(f,fcntl.LOCK_EX)\n    lines=f.readlines()\n    keep=[x for x in lines if key not in x.split()]\n    if keep!=lines:\n        f.seek(0);f.write(\"\".join(keep));f.truncate();f.flush();os.fsync(f.fileno())\nassert key not in target.read_text().split()\nsubprocess.run([\"systemctl\",\"stop\",\"analyst-session-key-cleanup.timer\"],capture_output=True)\ncleanup=pathlib.Path(\"/root/analyst-session-key-cleanup.py\")\nif cleanup.exists():\n    assert cleanup.is_file() and not cleanup.is_symlink() and cleanup.stat().st_uid==0 and key in cleanup.read_text()\n    cleanup.unlink()\nprint(\"UNUSED_SESSION_KEY_REMOVED=true\",flush=True)\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\napk=pathlib.Path(\"/srv/analyst-ai/workspace/app/build/outputs/apk/preview/app-preview.apk\")\nassert apk.is_file() and not apk.is_symlink()\nsha=hashlib.sha256(apk.read_bytes()).hexdigest()\nassert sha==\"c62c7bb9b2c0fd454ec00985f869f3f9fa3023ed555ced9b5e0ae2a107e7f8d2\"\nbuild=json.loads((state/\"build-result.json\").read_text())\nassert build[\"status\"]==\"passed\" and build[\"apk_sha256\"]==sha\nbt=pathlib.Path(\"/opt/analyst-android-sdk/build-tools/37.0.0\")\ncert=\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\nverify_code=\"import sys,json,pathlib;sys.path.insert(0,'.github/scripts');from apk_signing_identity import verify_signing;print(json.dumps(verify_signing(pathlib.Path('app/build/outputs/apk/preview/app-preview.apk'),'\"+cert+\"')))\"\nidentity=json.loads(subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"/usr/bin/env\",\"JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64\",\"ANDROID_SDK_ROOT=/opt/analyst-android-sdk\",\"/var/lib/analyst-ai-build/venv/bin/python\",\"-B\",\"-c\",verify_code],cwd=\"/srv/analyst-ai/workspace\",text=True,timeout=100))\nassert identity[\"certificate_sha256\"]==cert and identity[\"apk_sha256\"]==sha and identity[\"signers\"]==1 and identity[\"signature_v2\"] is True\nbadging=subprocess.check_output([str(bt/\"aapt\"),\"dump\",\"badging\",str(apk)],text=True,timeout=30)\nassert \"package: name='ru.omnicio.app.debug' versionCode='36' versionName='0.12.0-preview'\" in badging\nassert \"sdkVersion:'37'\" in badging\nruntime=json.loads((state/\"runtime-result.json\").read_text())\nprint(\"APK_DELIVERY_VERIFICATION=\"+json.dumps({\"apk_sha256\":sha,\"bytes\":apk.stat().st_size,\"certificate_sha256\":cert,\"application_id\":\"ru.omnicio.app.debug\",\"version_name\":\"0.12.0-preview\",\"version_code\":36,\"min_sdk\":37,\"build_status\":build[\"status\"],\"build_source_sha256\":build[\"source_sha256\"],\"runtime_status\":runtime[\"status\"],\"runtime_matrix_passed\":False,\"production_release\":False}),flush=True)\n",timeout=180)
          PY

      - name: Deliver the existing signed APK requested by the owner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Analyst-AI-0.12.0-preview-36-unverified-runtime
          path: ${{ runner.temp }}/analyst-apk-delivery/Analyst-AI-0.12.0-preview-36.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
