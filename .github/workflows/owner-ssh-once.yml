name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Save the owner Russian-only minimum policy and rejected configuration on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          assert {s["id"] for s in servers["servers"]}=={9408159},"inventory_changed_reconcile_before_status_write"
          print("RUSSIA_FINAL_INVENTORY="+json.dumps([{k:s.get(k) for k in ("id","name","status","cpu","ram","location")} for s in servers["servers"]]),flush=True)
          import shlex
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          original_select=adopt.select_target
          observed=servers["servers"][0]
          assert observed["ram"] in {1024,3072} and observed["cpu"]==1
          def select_target(new):
              original_select(new)
              if new:p.CONFIGURATION["ram"]=observed["ram"]
          adopt.select_target=select_target
          def save_policy(command):
              script="import hashlib,json,os,pathlib,subprocess\nos.umask(0o077)\nroot=pathlib.Path(\"/root/analyst-ai-development-79be1821\")\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root,text=True).strip()==\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\"\nallowed={\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"}\nassert set(subprocess.check_output([\"git\",\"diff\",\"--name-only\"],cwd=root,text=True).splitlines())<=allowed\npolicy=\"\\n## OWNER 24.10.2026 — только Россия, минимальная конфигурация\\n\\nВладелец уточнил: «Создай конфигурацию на российском сервере! Выбери самый дешёвый, но необходимый нам! Без запаса!»\\nВыбирать только российскую локацию Timeweb, минимальную фактически достаточную конфигурацию и почасовое списание. Разработка, сборка и проверки выполняются на Timeweb; GitHub служит резервной копией и уже разрешённым транспортом доступа. Это заменяет прежнее разрешение выбирать любую страну. Новые функции не добавлять. Сохранять подпись APK, портретную ориентацию, существующие данные и полные проверки приложения. Наличие тарифа не доказывает возможность заказа, доступный KVM или успешную проверку APK.\\n\\n\"\nreport=[]\nfor name in sorted(allowed):\n    path=root/name\n    assert path.is_file() and not path.is_symlink()\n    before=path.read_text()\n    if \"## OWNER 24.10.2026 — только Россия, минимальная конфигурация\" not in before:\n        title,separator,rest=before.partition(\"\\n\")\n        assert separator and title.startswith(\"# \")\n        path.write_text(title+\"\\n\"+policy+rest)\n    after=path.read_bytes()\n    report.append({\"path\":name,\"sha256\":hashlib.sha256(after).hexdigest(),\"instruction_present\":policy.strip() in after.decode()})\nassert all(r[\"instruction_present\"] for r in report)\nconfig={\"status\":\"not_created_provider_rejected_requests\",\"russian_regions_only\":True,\"hourly_billing_required\":True,\"owner_requested_no_spare_capacity\":True,\"candidate\":{\"cpu\":2,\"ram_mib\":5120,\"disk_mib\":30720,\"configuration_ids\":[149,151],\"locations\":[\"ru-4\",\"ru-5\"],\"monthly_compute_rub\":1780,\"monthly_ipv4_rub\":200,\"monthly_total_rub\":1980},\"suitability_verified\":False,\"required_hardware_checks\":[\"actual_memory\",\"actual_free_disk\",\"ssh_host_identity\",\"KVM_API_version_12\",\"KVM_CREATE_VM\"],\"android_emulator_ram_mib\":4096,\"execution\":\"build_and_emulator_sequential\",\"provider_ticket\":12913059,\"preserve_existing_server_id\":9408159,\"apk_release_completed\":False}\ndestination=pathlib.Path(\"/root/analyst-ai-russian-server-config.json\")\nassert not destination.is_symlink()\ndestination.write_text(json.dumps(config,ensure_ascii=False,indent=2)+\"\\n\")\ndestination.chmod(0o600)\nassert json.loads(destination.read_text())==config\nprint(\"RUSSIA_MINIMUM_PLAN_SAVED=\"+json.dumps({\"server\":9408159,\"configuration_file\":str(destination),\"status\":config[\"status\"],\"candidate\":config[\"candidate\"],\"suitability_verified\":False,\"documents\":report},ensure_ascii=False),flush=True)\n"
              out=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=90)
              print(out.decode(),end="",flush=True)
          access.develop_backend=save_policy
          adopt.run(development=True)
          PY
