name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-enrollment-tls-diagnostic
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Diagnose the actual HTTPS installation failure before owner binding
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,json,os,pathlib,re,subprocess,sys,time,traceback\nsys.path.insert(0,\"/root/analyst-ai-source\")\nfrom deploy import install_owner_backend as installer\nroot=pathlib.Path(\"/root\");work=root/\"analyst-owner-login-relay-20261024\"\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"server_id\":9413105}\ndef run(args,timeout=30):\n    p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)\n    return p.returncode,p.stdout,p.stderr\ntry:\n    values=installer.load_config(enrollment=True);hostname=\"analyst-ai-2941515.twc1.net\"\n    assert not installer.INPUT_CONFIG.exists() and not (installer.CONFIG/\"backend.env\").exists() and not installer.UNIT.exists()\n    assert installer.STATE.is_dir() and not any(installer.STATE.iterdir()),\"nonempty_application_state_refused\"\n    caddy_file=installer.CONFIG/\"Caddyfile\"\n    assert caddy_file.read_text()==installer.caddy_text(hostname,enrollment=True),\"unexpected_proxy_config\"\n    code,out,err=run([\"caddy\",\"validate\",\"--config\",str(caddy_file),\"--adapter\",\"caddyfile\"])\n    report[\"config_validation_exit\"]=code\n    report[\"caddy_file_mode\"]=oct(caddy_file.stat().st_mode&0o777)\n    code,out,err=run([\"systemctl\",\"show\",\"caddy\",\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\"])\n    report[\"before_service\"]=out.splitlines()\n    code,out,err=run([\"journalctl\",\"-u\",\"caddy\",\"--no-pager\",\"-n\",\"100\",\"-o\",\"short-iso\"])\n    journal=work/\"tls-service-journal.log\";journal.write_text(out+err);journal.chmod(0o600)\n    report[\"startup_errors\"]=[re.sub(r\"https?://\\S+\",\"[url]\",line)[:600] for line in out.splitlines() if any(word in line.lower() for word in (\"permission denied\",\"failed\",\"error\",\"status=\"))][-15:]\n    certroot=pathlib.Path(\"/var/lib/caddy\")\n    report[\"certificate_files\"]=[str(path.relative_to(certroot)) for path in certroot.rglob(\"*.crt\") if hostname in str(path)]\n    assert code==0\n    code,out,err=run([\"systemctl\",\"start\",\"caddy\"])\n    report[\"restart_exit\"]=code\n    checks=[]\n    for attempt in range(6):\n        row={\"attempt\":attempt+1}\n        connection=installer.LocalTLSConnection(hostname)\n        try:\n            connection.request(\"GET\",\"/health\",headers={\"Host\":hostname})\n            with connection.getresponse() as response:\n                body=response.read(256)\n                row.update(status=response.status,expected_body=body==b\"owner-enrollment-only\")\n        except Exception as error:\n            row[\"error_type\"]=type(error).__name__\n            row[\"safe_error\"]=re.sub(r\"https?://\\S+\",\"[url]\",str(error))[:300]\n        finally:connection.close()\n        checks.append(row)\n        if row.get(\"status\")==404 and row.get(\"expected_body\"):break\n        time.sleep(3)\n    report[\"tls_checks\"]=checks\n    code,out,err=run([\"systemctl\",\"show\",\"caddy\",\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\"]);report[\"after_service\"]=out.splitlines()\n    report[\"certificate_files_after\"]=[str(path.relative_to(certroot)) for path in certroot.rglob(\"*.crt\") if hostname in str(path)]\n    report[\"backend_or_owner_created\"]=installer.INPUT_CONFIG.exists() or installer.UNIT.exists()\nexcept Exception as error:\n    report[\"error_type\"]=type(error).__name__\n    path=work/\"tls-diagnostic-error.log\";path.write_text(traceback.format_exc());path.chmod(0o600)\npath=work/\"tls-diagnostic.json\";path.write_text(json.dumps(report,indent=2)+\"\\n\");path.chmod(0o600)\nprint(\"TIMEWEB_ENROLLMENT_TLS_DIAGNOSTIC=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=240).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
