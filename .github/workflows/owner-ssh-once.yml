name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import json\nDELTAS=json.loads(\"[{\\\"path\\\":\\\"README.md\\\",\\\"old_blob\\\":\\\"258398f1e1cccd551493335236a2393b2b7154e0\\\",\\\"hunks\\\":[{\\\"start\\\":0,\\\"end\\\":0,\\\"lines\\\":[\\\"## Состояние 25.10.2026, 11:42 UTC — backend исправлен, APK38 ожидает Android runtime\\\\n\\\\nНа основном Timeweb установлен backend `955661284e…`; полный check прошёл:\\\\n1684 backend tests / 1515 subtests, 1001 host, 52 tools, 61 Node, 12 workspace guards.\\\\nAPK 0.13.0-preview / 38 собран с прежней подписью, SHA256 `d57ea8c5…`.\\\\nНовый интерфейс: «Система», «Решения», «Настройки»; 16 реальных Compose/Layoutlib\\\\nизображений проверены на Timeweb с явно синтетическими данными.\\\\n\\\\nИсправлены отсутствие ACCESS_NETWORK_STATE/обработка JobScheduler, ошибочное\\\\nтребование streaming isConsistent у unary GetOrderBook и доказанный двойной\\\\nучёт валютной позиции + GetPositions.money. Последнее проверено на паре\\\\nреальных read-only ответов; в 11:41 сохранённый snapshot уже содержит 1 cash-позицию\\\\nс правильной суммой вместо 2 строк.\\\\n\\\\nФоновый сбор и исследование кандидатов включены, брокер подключён.\\\\nПолная автономная инвестиционная рекомендация и реальные сделки не реализованы:\\\\nтри этапа suitability всегда открыты, автоматического producer issuer/rating\\\\nпока нет. Внешний платный AI выключен; бюджеты 0.\\\\n\\\\nAndroid API37/4096 не загрузился за 1200.002 s, APK не устанавливался;\\\\nобе runtime-профильные проверки остаются непройденными. Канал/телефон всё ещё 37.\\\\nВладелец требует продолжать реальную диагностику среды на той же Timeweb\\\\nи довести проверенный APK до телефона самостоятельно. Публикацию и телефон\\\\nне объявлять успешными по одной сборке или Layoutlib-изображениям.\\\\nДанные владельца, секреты, подпись и БД сохраняются; разовое исключение 37\\\\nне разрешает непроверенный 38. Подробные доказательства и ограничения:\\\\n[отчёт 0.13](docs/AUTOMATION_REDESIGN_0.13.md).\\\\n\\\\nПредыдущие состояния ниже исторические.\\\\n\\\\n\\\"]}]},{\\\"path\\\":\\\"AGENTS.md\\\",\\\"old_blob\\\":\\\"f91344b73e94ef3a5bc2e299b302f915097a108c\\\",\\\"hunks\\\":[{\\\"start\\\":0,\\\"end\\\":0,\\\"lines\\\":[\\\"## Состояние 25.10.2026, 11:42 UTC — backend исправлен, APK38 ожидает Android runtime\\\\n\\\\nНа основном Timeweb установлен backend `955661284e…`; полный check прошёл:\\\\n1684 backend tests / 1515 subtests, 1001 host, 52 tools, 61 Node, 12 workspace guards.\\\\nAPK 0.13.0-preview / 38 собран с прежней подписью, SHA256 `d57ea8c5…`.\\\\nНовый интерфейс: «Система», «Решения», «Настройки»; 16 реальных Compose/Layoutlib\\\\nизображений проверены на Timeweb с явно синтетическими данными.\\\\n\\\\nИсправлены отсутствие ACCESS_NETWORK_STATE/обработка JobScheduler, ошибочное\\\\nтребование streaming isConsistent у unary GetOrderBook и доказанный двойной\\\\nучёт валютной позиции + GetPositions.money. Последнее проверено на паре\\\\nреальных read-only ответов; в 11:41 сохранённый snapshot уже содержит 1 cash-позицию\\\\nс правильной суммой вместо 2 строк.\\\\n\\\\nФоновый сбор и исследование кандидатов включены, брокер подключён.\\\\nПолная автономная инвестиционная рекомендация и реальные сделки не реализованы:\\\\nтри этапа suitability всегда открыты, автоматического producer issuer/rating\\\\nпока нет. Внешний платный AI выключен; бюджеты 0.\\\\n\\\\nAndroid API37/4096 не загрузился за 1200.002 s, APK не устанавливался;\\\\nобе runtime-профильные проверки остаются непройденными. Канал/телефон всё ещё 37.\\\\nВладелец требует продолжать реальную диагностику среды на той же Timeweb\\\\nи довести проверенный APK до телефона самостоятельно. Публикацию и телефон\\\\nне объявлять успешными по одной сборке или Layoutlib-изображениям.\\\\nДанные владельца, секреты, подпись и БД сохраняются; разовое исключение 37\\\\nне разрешает непроверенный 38. Подробные доказательства и ограничения:\\\\n[отчёт 0.13](docs/AUTOMATION_REDESIGN_0.13.md).\\\\n\\\\nПредыдущие состояния ниже исторические.\\\\n\\\\n\\\"]}]},{\\\"path\\\":\\\"docs/AUTOMATION_REDESIGN_0.13.md\\\",\\\"old_blob\\\":null,\\\"content\\\":\\\"# Переработка 0.13: серверный анализ, новый интерфейс и проверки\\\\n\\\\n> Проверенное состояние по 25.10.2026 11:42 UTC. Backend исправлен и установлен,\\\\n> APK38 собран; публикация заблокирована непройденным Android runtime.\\\\n> По новому указанию владельца диагностика загрузки Android продолжается\\\\n> на той же Timeweb VM. Этот checkpoint не объявляет задачу выпуска завершённой.\\\\n\\\\n## Запрос владельца\\\\n\\\\nРазработка, сборка и проверки выполняются на существующем Timeweb, VM 9415007.\\\\nВладелец просит устранить вылеты, создать единый читаемый интерфейс, перенести\\\\nобработку данных портфеля внутрь системы и проверять тот же APK в эмуляторе\\\\nперед обновлением телефона. Отдельно запрошено автономное управление реальными\\\\nсредствами. В этом изменении реализован автономный **анализ с чтением данных**:\\\\nторговые поручения не отправляются, реальная торговля не активирована.\\\\n\\\\n## Изменения\\\\n\\\\n- Три главных раздела: «Система», «Решения», «Настройки». Сырые балансы и позиции\\\\n  убраны с основных экранов; фоновые запросы прежнего портфельного экрана там\\\\n  приостановлены. Подробности доступны в отдельных связанных разделах.\\\\n- Общие светлая/тёмная темы, контрастные семантические цвета, адаптивная навигация,\\\\n  прокрутка настроек, новый экран входа Telegram с настоящими состояниями\\\\n  ожидания и ошибки. Существующий вход и привязка владельца сохранены.\\\\n- Экран системы читает сохранённое состояние `/automation/status`; решения\\\\n  читают `/automation/decisions`. Оба GET не запускают анализ или сделки.\\\\n- Переключатель анализа сохраняет `/automation/preferences` с expected_version:\\\\n  проверяется ответ, конфликт не показывается как успешное сохранение.\\\\n- Планировщик автоматически ставит сбор данных с интервалом 15 минут;\\\\n  повторные попытки ограничены 5-минутными слотами, дубликаты объединяются.\\\\n  Пауза отменяет ожидающие автоматические задания и проверяется активной работой.\\\\n- Поиск последовательно читает реальные инструменты брокера и текущий стакан,\\\\n  проверяет деньги, резерв и стратегию; за цикл исследует не более 8 инструментов.\\\\n  Результаты привязаны к снимку, версии стратегии, доказательствам и сроку годности.\\\\n  Неполные данные не превращаются в выдуманную инвестиционную рекомендацию.\\\\n- В коде устранён конкретный путь SecurityException: добавлено\\\\n  `ACCESS_NETWORK_STATE`, ожидаемые ошибки JobScheduler перехватываются.\\\\n  Это подтверждённый дефект APK 37, но без журнала телефона его нельзя называть\\\\n  единственной причиной наблюдавшегося вылета.\\\\n- Добавлены ограниченные диагностические отчёты Android и exit reasons:\\\\n  без токенов, текста исключений, HTTP-тел и данных портфеля, с авторизацией,\\\\n  ограничениями размера, дедупликацией и сроком хранения.\\\\n- Runtime-контракт для версии 38+ — `analyst-2d-live-v4`: API37 с 4К/16К,\\\\n  состояния новых экранов, масштаб текста 1/2, нативные действия и подтверждения\\\\n  сервера, хеши PNG и APK. Старые результаты версии37 не засчитываются для38.\\\\n- Аудит Python проверяет также новые неотслеживаемые файлы исходников;\\\\n  игнорируемые временные каталоги не исполняются.\\\\n\\\\n## Визуальная проверка\\\\n\\\\nНа Timeweb отрисованы и просмотрены 16 изображений настоящего Compose-интерфейса\\\\nчерез официальный Layoutlib screenshot plugin: система, решения, настройки,\\\\nвход, загрузка, ошибка; светлая/тёмная темы, узкий экран и увеличенный текст.\\\\nДанные в этих изображениях синтетические и явно помечены.\\\\n\\\\nПоследний повторный рендер завершён 2026-10-25 10:01:10 UTC; SHA-256 всех 16 PNG\\\\nсовпал с просмотренным набором. Это проверка вёрстки на хосте. Она **не заменяет\\\\nзапуск Android, установку APK, проверку реального брокера или телефона**.\\\\n\\\\nИсходные изображения находятся в\\\\n`app/src/screenshotTestDebug/reference/ru/omnicio/app/preview/AutomationAppearanceScreenshotTestKt/`.\\\\nСерверная запись визуальной проверки:\\\\n`/var/lib/analyst-ai-build/diagnostics/appearance-38-visual-review.json`.\\\\n\\\\n## Проверки текущих исходников\\\\n\\\\nИсходники: `955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e`.\\\\nПолная проверка выполнена 2026-10-25 11:28:10–11:30:47 UTC:\\\\n\\\\n| Проверка | Фактический результат |\\\\n|---|---|\\\\n| `git diff --check` и зависимости | passed |\\\\n| Компиляционный аудит Python без исполнения | 361 файл, ошибок нет |\\\\n| Защита рабочей области | 12 passed |\\\\n| Host-проверки | 1001 passed |\\\\n| Tools | 52 passed |\\\\n| Node | 61 passed |\\\\n| Backend pytest | 1684 passed; 1515 subtests passed |\\\\n\\\\nЕдинственное предупреждение pytest — deprecation alias в Starlette/AnyIO.\\\\nНовые девять host tests проверяют реальное поведение границ boot timeout,\\\\nCLI dispatch, число попыток, запись диагностического sidecar и окружение\\\\nэмулятора. Поздний положительный ответ ADB не принимается как успешная загрузка.\\\\n\\\\n## Сборка APK 38\\\\n\\\\nФинальная сборка выполнена на Timeweb 2026-10-25 11:32:12–11:33:55 UTC,\\\\nдля того же хеша исходников, что и полный check. Gradle завершил все заданные\\\\nцели: testDebugUnitTest, lintDebug, lintPreview, debug/release/preview APK\\\\nи UI driver; 197 задач, 6 выполнены, 191 актуальна. Время Gradle — 1 минута\\\\n38 секунд. Кешированные результаты не выдаются за повторное выполнение тестов.\\\\n\\\\nAPK совпал байт-в-байт с первым кандидатом, собранным 10:17:56 UTC:\\\\nизменения после него затрагивали backend и проверки, Android-код не менялся.\\\\n\\\\n- Пакет: `ru.omnicio.app.debug`; код 38; версия `0.13.0-preview`.\\\\n- Размер: 29 754 870 байт.\\\\n- SHA-256: `d57ea8c55642aaf1b18703cf0170fdd78b5d73912d57b3415d34c563fcab9649`.\\\\n- Сертификат: `bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1`.\\\\n- Не debuggable, не testOnly; target/min SDK 37.\\\\n- Проверены подпись, ZIP/ELF 16К alignment, 91 упакованный 3D-файл и 90 GLB.\\\\n- Отчёты Android unit tests: 174 теста, 30 suites, без failures/errors/skips.\\\\n- Lint: 0 errors, 68 debug warnings и 64 preview warnings; остаются style/\\\\n  deprecation и другие предупреждения. Сборка не объявляется «без предупреждений».\\\\n\\\\nСтатическая проверка выравнивания не является запуском Android. Отчёт сборки:\\\\n`/var/lib/analyst-ai-build/build-result.json`. APK:\\\\n`/srv/analyst-ai/workspace/app/build/outputs/apk/preview/app-preview.apk`.\\\\n\\\\nВ 11:38:08 UTC полная инвентаризация 800 файлов сверена с подготовленным\\\\nдеревом резервной копии Git; расхождений нет. Все 71 production-файл backend\\\\nсовпали с финальным checkout; предыдущие\\\\nвладельцы, подпись, БД и конфигурация сохранены.\\\\n\\\\n## Работающий backend\\\\n\\\\nПоследний исправленный backend установлен на существующий Timeweb 2026-10-25\\\\n11:33:55–11:34:00 UTC. Исходники установки совпадают с финальными check/build:\\\\n`955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e`.\\\\nПриватная резервная копия: `/var/backups/analyst-ai/redesign-20261025T113355Z`.\\\\nПредыдущий backend сохранён для отката. Предшествующее исправление unary-стакана\\\\nбыло установлено в 10:49:08–10:49:13 UTC; кассовое исправление добавлено отдельно\\\\nпосле завершения замороженной попытки Android runtime.\\\\n\\\\nПеред заменой кода сделаны приватные резервные копии БД и конфигурации,\\\\nпроверена неизменность предыдущих production-файлов, выполнены проверка запуска\\\\nна синтетической БД и миграция копии фактической БД с заблокированной сетью.\\\\nВладелец и шифрованные подключения сохранены, SQLite integrity_check — ok.\\\\nПосле замены: `/health` — HTTP 200; приватные маршруты без авторизации — HTTP 401;\\\\nвнешние HTTPS-проверки — HTTP 200.\\\\nВ послепусковом журнале нет ERROR и traceback. Публичный APK 37 сохранён.\\\\n\\\\nАвтоматический сбор включён, broker connection и действующая owner session\\\\nподтверждены чтением рабочей БД. Доступ к платному внешнему ИИ выключен,\\\\nоба бюджета равны нулю. Реальные торговые поручения не активированы.\\\\n\\\\n## Подтверждённая ошибка формата стакана\\\\n\\\\nТри пути проверки ошибочно требовали `isConsistent` у ответа\\\\n`MarketDataService/GetOrderBook`. В официальном\\\\n`GetOrderBookResponse` такого поля нет: оно относится к streaming\\\\n`OrderBook`. Используемое unary-время — `orderbookTs`.\\\\n\\\\nИсправление допускает отсутствие streaming-поля, сохраняет отказ при явном\\\\nfalse/null/неверном типе и проверки UID, действительного времени, сторон\\\\nстакана, цен, количеств и ограничений. Поле true не дописывается искусственно.\\\\nДва фактических read-only ответа, исследованных 10:37:12 UTC, не содержали\\\\nни этого поля, ни заявок, ни времени стакана; такие данные остаются\\\\nнепригодными. Торговые API при диагностике не вызывались.\\\\n\\\\nВ новом автоматическом цикле, наблюдавшемся после установки, прежний код\\\\n`order_book_not_consistent` исчез. Из 8 инструментов 6 отклонены из-за\\\\nотсутствующего/устаревшего времени стакана; 2 дошли до проверки ограничений.\\\\nКаталог: 26 673 записи, 1 804 прошли базовые фильтры; это не число готовых\\\\nинвестиционных рекомендаций. За один цикл исследуются 8 инструментов.\\\\n\\\\nДва дошедших до проверки кандидата пока не прошли ограничения: отсутствуют\\\\nподтверждённые сведения об идентичности/группах/эмитентах, рейтингах,\\\\nчасти классификации и сверке портфеля; остаются вопросы инвестиционного\\\\nобоснования, допустимых потерь, налогов и расчётов. Готовых рекомендаций — 0.\\\\nСохранённых подтверждённых issuer/rating/statement/return/news-event\\\\nдосье в измеренном снимке — 0; это не означает отсутствия общей новостной ленты\\\\n(в snapshot она доступна).\\\\n\\\\nОдноразовая защищённая инвалидация старого schema-failure кеша не внесла\\\\nизменений: к проверке результат уже был новее завершения deployment.\\\\nПланировщик обновил данные штатно. Настройки, курсор и сохранённые\\\\nрезультаты вручную не очищались.\\\\n\\\\n## Подтверждённый повторный учёт денег\\\\n\\\\nRead-only сверка сохранённого портфеля показала две оценённые строки\\\\n(одна cash и одна неклассифицированная) с суммой, не совпадающей с капиталом.\\\\nЭто было наблюдение, а не предположение по сообщению о 5000 ₽.\\\\n\\\\nВ 11:16:13 UTC выполнены ровно два чтения брокера для одного существующего\\\\nсчёта: GetPortfolio и GetPositions. Одни и те же ответы поданы фактическому\\\\nоблегчённому нормализатору и существующему полному пути. Облегчённый путь\\\\nсоздавал 2 строки с неверной суммой; полный — 1 строку с верной суммой.\\\\nИсключение только валютных PortfolioPosition при наличии money также\\\\nвосстановило сверку. Избыток точно объяснялся повторной валютной строкой.\\\\nСырые ответы, суммы, токены и идентификаторы в диагностические отчёты не выведены.\\\\n\\\\nИсправление ограничено `backend/tinvest_portfolio.py`:\\\\nпри корректном списке GetPositions.money он становится источником денег,\\\\nа валютные PortfolioPosition исключаются. Не валютные бумаги сохраняются,\\\\nвключая случай совпадения стоимости с cash. Дробные Decimal/nanos, blocked\\\\nи limitsLoadingInProgress сохранены. Отсутствующий/null money оставляет\\\\nсовместимый fallback; некорректные денежные данные дают отказ до возврата\\\\nрезультата. HTTP-ошибка GetPositions не маскируется частичным портфелем.\\\\n\\\\nПять новых методов тестирования включают настоящую цепочку endpoint →\\\\nvolume_monitor.ingest → persist → saved_snapshot с синтетическими ответами\\\\nброкера, точностью nanos и отдельной проверкой неполного покрытия.\\\\nЭто не подмена нормализатора тестовым stub.\\\\n\\\\nПосле установки в 11:38:08 UTC повторены ровно два read-only вызова\\\\n(GetPortfolio/GetPositions) для одного счёта. Исправленный production-нормализатор\\\\nи полный путь дали по одной строке; обе суммы совпали с капиталом.\\\\nПроверены точные хеши выполняемых production-файлов.\\\\n\\\\nВ 11:35 UTC сохранённый snapshot ещё содержал прежние 2 строки. При следующем\\\\nнаблюдении в **11:41:10 UTC** в фактической БД уже сохранена **1 cash-позиция**,\\\\nсумма сходится с капиталом с допуском 0.01, дубликатов и некорректных значений нет,\\\\ncoverage complete. Административная проверка не переписывала portfolio rows\\\\nи не вызывала торговые методы.\\\\n\\\\nПолный collection.finished_at при этом оставался 11:24:52 UTC: краткое\\\\nобновление позиций сохраняет прежний timestamp полного сбора. Эти две\\\\nхарактеристики свежести нельзя смешивать. Последний наблюдавшийся discovery\\\\nещё ссылался на предыдущий snapshot; его прежние причины не считаются\\\\nрезультатом повторной проверки нового портфеля.\\\\n\\\\n## Граница готовности автономного анализа\\\\n\\\\nАвтоматические сбор, отбор инструментов и проверка ограничений работают.\\\\n**Полная автономная инвестиционная рекомендация в текущем коде не завершена.**\\\\nЭто не только временное отсутствие данных и не устраняется ожиданием refresh.\\\\n\\\\n`volume_purchases._check_purchase` всегда оставляет\\\\n`suitability_complete=False` и три пункта:\\\\nполный профиль/допустимые потери, инвестиционное обоснование/оценка стоимости,\\\\nналоги/особенности расчётов. Controller не имеет ветви, повышающей\\\\n`recommendation_complete` до true. Ранний отказ на стакане может скрывать\\\\nэти последующие пункты, но не делает рекомендацию полной.\\\\n\\\\nМодельный AnalysisReport сохраняется отдельной карточкой ленты; он не\\\\nзакрывает эти три пункта и не обновляет полноту discovery. Подключение AI\\\\nи бюджета само по себе эту часть реализации не завершает.\\\\n\\\\nАвтоматический refresh читает issuer_identity/rating из research_evidence_v1,\\\\nно самостоятельно не создаёт проверенные записи. Существует отдельный\\\\nоператорский research_import с проверкой структуры/источника; он не скачивает\\\\nи не подтверждает истинность первичного документа\\\\n(`source_truth_attested_by_cli=False`). Пустое хранилище не наполнится просто\\\\nот следующего сбора портфеля.\\\\n\\\\nПоэтому состояние `current` описывает работоспособность/сбор данных,\\\\nа не готовность инвестиционного решения или реальных сделок.\\\\nНикакие реальные ордера не выставлялись.\\\\n\\\\n## Фактическая проверка Android runtime\\\\n\\\\nОдна попытка API37 / 4096 для APK38 начата 2026-10-25 11:05:08 UTC;\\\\ncleanup завершён 11:26:41 UTC. Время ожидания загрузки ограничено 1200 секундами,\\\\nчисло попыток — 1. Зафиксировано **timeout за 1200.002 секунды**,\\\\n`boot_completed=false`; оба `install-results.json` — пустые массивы.\\\\nAPK не устанавливался и не запускался. Матрица 16К также не пройдена.\\\\n\\\\nИсходники попытки — `fdb272e3b396586631babd98392590c1562b2c5bafd981dffa831e035b9b7f5c`.\\\\nПоследующая кассовая правка меняет backend и его тесты; итоговый Android APK\\\\nбайт-в-байт тот же `d57ea8c5…`. Предыдущий timeout не является пройденной\\\\nпроверкой новых исходников.\\\\n\\\\nKernel log показывает SystemServer PID731 уже примерно на 282-й секунде,\\\\nтот же PID наблюдается позднее; после deadline продолжается штатная first-boot\\\\nпроверка байткода системных приложений. Это прогресс загрузки, но не её завершение.\\\\nПодтверждённое падение APK из этого журнала вывести нельзя.\\\\n\\\\nВ 44 ресурсных снимках OOM/oom_kill = 0; reclaim и swap присутствовали.\\\\nМежду двумя подробными снимками memory PSI вырос на 0.840824 секунды за\\\\n295.869298 секунды (0.284188%). Эта дельта не объясняет весь 20-минутный timeout.\\\\nПолный kernel log сохранён; guest log ограничен поздним хвостом, поэтому\\\\nпричина всех ранних задержек не установлена.\\\\n\\\\nИсходники, APK, fixture, подпись/verification, образ и public channel не менялись\\\\nвнутри попытки. Cleanup оставил 0 собственных процессов; публикация запрещена.\\\\nБез новых доказательств повторный запуск, увеличение лимитов или отключение\\\\nпроверки байткода не выполнялись.\\\\n\\\\nТочные исходные журналы:\\\\n[API37/4096/1200s archive](evidence/automation-redesign-20261025/runtime-api37-4096-1200s.tar.gz)\\\\n— 83 380 байт, SHA256 `2df858f45f32487e54a9dc66a222bf0ed9a6db3e021dba2f97219770c3a2ebb7`.\\\\nПодробная оценка:\\\\n[runtime-assessment.md](evidence/automation-redesign-20261025/runtime-assessment.md).\\\\nПредыдущий 240-секундный диагностический архив сохранён отдельно.\\\\n\\\\n## Выпуск и телефон\\\\n\\\\n**APK38 собран, но не опубликован. Телефон не обновлён до38.**\\\\nПроверенный HTTPS update-policy продолжает отдавать 0.12.1-preview / 37,\\\\nSHA256 `1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74`.\\\\nДействующая owner session клиента, сообщающего37, подтверждена; заголовок версии\\\\nне является аттестацией байтов или визуальной проверкой телефона.\\\\n\\\\nВременное отключение проблемного планирования уведомлений для37 сохранено.\\\\nИсходная настройка находится в приватном compatibility record. Возвращать её\\\\nможно после подтверждённого исправленного клиента, не затирая более поздний\\\\nвыбор пользователя. Вход, существующая подпись APK, owner/Fernet и БД не сброшены.\\\\n\\\\nАвтоматическое обновление не объявляется состоявшимся по одной публикации APK\\\\nили заголовку версии клиента. Нужны подтверждённые байты, валидная подпись,\\\\nпройденные runtime-проверки и фактическое наблюдение нового клиента.\\\\nСерверный анализ требует действующего подключения брокера через защищённые\\\\nнастройки приложения. Баланс 5000 ₽ из сообщения владельца не выдаётся за\\\\nполученный ответ API; активы и результаты не придуманы.\\\\n\\\\n## Первичные документы\\\\n\\\\n- Android 14: network-constrained JobScheduler требует ACCESS_NETWORK_STATE:\\\\n  https://developer.android.com/about/versions/14/behavior-changes-14\\\\n- Compose screenshot tests используют Layoutlib:\\\\n  https://developer.android.com/studio/preview/compose-screenshot-testing\\\\n\\\\n- Официальный T-Invest marketdata.proto, проверенный Git blob\\\\n  `e1afb1e98991e640d3705eaeabbe1c362e62bf6c`:\\\\n  https://github.com/RussianInvestments/investAPI/blob/main/src/docs/contracts/marketdata.proto\\\\n- Android Emulator: kernel log и командная строка:\\\\n  https://developer.android.com/studio/run/emulator-commandline\\\\n\\\\n- Официальный T-Invest operations.proto, Git blob `a256f195b445b04be934cee14937572dc8252384`:\\\\n  https://github.com/RussianInvestments/investAPI/blob/main/src/docs/contracts/operations.proto\\\\n- ProtoJSON null/repeated semantics:\\\\n  https://protobuf.dev/programming-guides/json/\\\\n- ART first-boot verification:\\\\n  https://source.android.com/docs/core/runtime/configure/art-service\\\\n\\\"},{\\\"path\\\":\\\"docs/evidence/automation-redesign-20261025/runtime-assessment.md\\\",\\\"old_blob\\\":null,\\\"content\\\":\\\"# Runtime assessment — API 37 / 4096 / 1200 s\\\\n\\\\nThe one actual Timeweb leaf started at 2026-10-25 11:05:08.322004 UTC and finished at 11:26:41.638975 UTC with `status=failed`. The boot window itself elapsed after **1200.002 seconds**. Android did not report boot completion within the deadline. Both installation result arrays are empty: the APK was not installed or launched.\\\\n\\\\n- Source SHA256: `fdb272e3b396586631babd98392590c1562b2c5bafd981dffa831e035b9b7f5c`.\\\\n- Candidate APK38 SHA256: `d57ea8c55642aaf1b18703cf0170fdd78b5d73912d57b3415d34c563fcab9649`.\\\\n- Raw evidence gzip/tar: 83,380 bytes, SHA256 `2df858f45f32487e54a9dc66a222bf0ed9a6db3e021dba2f97219770c3a2ebb7`.\\\\n- Cleanup recorded zero remaining owned processes. Source, APK, fixture, verification, public manifest/APK and image metadata hashes were unchanged. Publication was not authorized.\\\\n\\\\n## Observed guest progress\\\\n\\\\nZygote PID439 starts at kernel time 109.147–109.416s. SystemServer PID731 is already present by 281.833s; the same PID appears around 815–832s, controls artd/idmap2d around 839–862s and still logs at 11:26:14.996 UTC. ART first-boot verification of system applications continues after the deadline; Pulse explicitly uses `--compiler-filter=verify --compilation-reason=first-boot`, and Chrome/GMS verification messages continue until 11:26:20.210.\\\\n\\\\nThis is evidence of continued boot progress, not a successful boot. The late diagnostic collection does not extend or pass the boot gate. No confirmed fatal restart of the principal Zygote/SystemServer is found in the retained logs. Nearby crash_dump and untracked camera child exit lines lack a tombstone tying a fatal signal to a principal service. They do not establish a crash of our app, which was never installed.\\\\n\\\\n## Measured resource pressure\\\\n\\\\nThe two detailed memory snapshots are 295.869298 seconds apart (11:20:11.780348 and 11:25:07.649646 UTC). Memory PSI some grows from 817,034 to 1,657,858 microseconds: **0.840824 seconds, 0.284188%** of that interval. Full grows by 0.840806 seconds. CPU PSI some grows by 0.593523 seconds; I/O PSI some by 0.213619 seconds.\\\\n\\\\nReclaim and swap did occur: the cgroup has memory.high=4800MiB, memory.max=5200MiB, peak near 4802MiB, and swap reaches 512MiB. The interval records +373,449 direct scans, +256,458 direct steals and +1,192 major faults. Host MemAvailable falls from 650.52 to 510.52MiB. All 44 resource samples record zero max/OOM/oom_kill/oom_group_kill events, and no quota throttling. Average cgroup use is about 1.06 CPU cores.\\\\n\\\\nThe measured memory stalls do not explain the entire 1200-second timeout. The presence of swap alone does not establish the cause.\\\\n\\\\n## Limits and decision\\\\n\\\\nThe archive preserves a full kernel log but only a late guest-log tail (last 200 lines, output capped near 18,000 characters), predominantly collected after the deadline. It does not contain the complete early ART/SystemServer timeline or full tombstones. Detailed PSI/memory.stat were collected twice, with the last snapshot 93.989 seconds before the leaf ended; the calculated delta cannot be extrapolated over the remaining diagnostic cleanup.\\\\n\\\\nNo new retry, longer timeout, RAM/GPU/CPU change or disabled verification is justified by these findings. A future read-only audit of the installed image and preopt artifacts is a specific investigation direction, not proof of an image defect. ART's official default for first boot is verify: https://source.android.com/docs/core/runtime/configure/art-service .\\\\n\\\\nThe API37/16K matrix is also unpassed. The mandatory runtime/install/upgrade/UI publication gates remain in force. Layoutlib host renders are separate appearance evidence, not Android runtime screenshots. No claim about the current phone crash follows from this leaf.\\\\n\\\"},{\\\"path\\\":\\\"docs/evidence/automation-redesign-20261025/boot-evidence-api37-4096-240s.tar.gz\\\",\\\"old_blob\\\":null,\\\"content_b64\\\":\\\"\\\"},{\\\"path\\\":\\\"docs/evidence/automation-redesign-20261025/runtime-api37-4096-1200s.tar.gz\\\",\\\"old_blob\\\":null,\\\"content_b64\\\":\\\"\\\"}]\")\nCOPY_FILES=[[\"check-result.json\",\"/var/lib/analyst-ai-build/check-result.json\"],[\"build-result.json\",\"/var/lib/analyst-ai-build/build-result.json\"],[\"backend-deployment.json\",\"/var/lib/analyst-ai-build/backend-redesign-result.json\"],[\"postdeployment.json\",\"/var/lib/analyst-ai-build/postdeploy-redesign-result.json\"],[\"cash-before.json\",\"/var/lib/analyst-ai-build/currency-overlap-result.json\"],[\"cash-after.json\",\"/var/lib/analyst-ai-build/currency-after-cash-result.json\"],[\"snapshot-before.json\",\"/var/lib/analyst-ai-build/metadata-redesign-result.json\"],[\"snapshot-after.json\",\"/var/lib/analyst-ai-build/metadata-redesign-cash-latest.json\"],[\"discovery-after-deployment.json\",\"/var/lib/analyst-ai-build/discovery-redesign-cash-result.json\"],[\"source-inventory.json\",\"/var/lib/analyst-ai-build/source-inventory-redesign-final.json\"],[\"source-verification.json\",\"/var/lib/analyst-ai-build/source-verification-redesign-final.json\"],[\"host-appearance.json\",\"/var/lib/analyst-ai-build/host-appearance-result.json\"],[\"visual-review.json\",\"/var/lib/analyst-ai-build/diagnostics/appearance-38-visual-review.json\"],[\"runtime-leaf.json\",\"/var/lib/analyst-ai-build/runs/20261025T110508321822Z-runtime-leaf-4k/leaf-result.json\"],[\"apk-verification.json\",\"/srv/analyst-ai/workspace/app/build/outputs/apk/preview/apk-verification.json\"]]\nHELPER=\"import base64,zlib,json,pathlib,hashlib,os,pwd,fcntl,tempfile,datetime,sys\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\")\\nstate=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nassert os.geteuid()==pwd.getpwnam(\\\"analyst-build\\\").pw_uid\\nassert root.is_dir() and not root.is_symlink()\\nlock=(state/\\\"workspace.lock\\\").open(\\\"a\\\")\\nfcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\ndef blob(raw):return hashlib.sha1(b\\\"blob \\\"+str(len(raw)).encode()+b\\\"\\\\0\\\"+raw).hexdigest()\\ndeltas=DELTAS\\nchanges=[]\\nfor d in deltas:\\n relative=d[\\\"path\\\"];p=root/relative\\n assert not relative.startswith(\\\"/\\\") and \\\"..\\\" not in pathlib.PurePosixPath(relative).parts\\n for part in (p,*p.parents):\\n  if part==root:break\\n  assert not part.is_symlink(),\\\"source_symlink\\\"\\n old=p.read_bytes() if p.exists() else None\\n assert (None if old is None else blob(old))==d[\\\"old_blob\\\"],\\\"source_changed:\\\"+relative\\n if \\\"content_b64\\\" in d:new=base64.b64decode(d[\\\"content_b64\\\"],validate=True)\\n elif \\\"content\\\" in d:new=d[\\\"content\\\"].encode()\\n else:\\n  lines=old.decode().splitlines(keepends=True)\\n  for h in reversed(d[\\\"hunks\\\"]):\\n   assert 0<=h[\\\"start\\\"]<=h[\\\"end\\\"]<=len(lines)\\n   lines[h[\\\"start\\\"]:h[\\\"end\\\"]]=h[\\\"lines\\\"]\\n  new=\\\"\\\".join(lines).encode()\\n changes.append((relative,p,old,new))\\nbackup=state/\\\"diagnostics\\\"/(\\\"redesign-source-\\\"+datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%S%fZ\\\"))\\nbackup.mkdir(parents=True,exist_ok=False)\\nfor relative,p,old,new in changes:\\n if old is