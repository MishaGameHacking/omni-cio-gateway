name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-tls-issuer-diagnostic
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Capture private certificate issuance errors and restore proxy logging
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,json,os,pathlib,pwd,re,subprocess,sys,time,traceback\nsys.path.insert(0,\"/root/analyst-ai-source\")\nfrom deploy import install_owner_backend as installer\nwork=pathlib.Path(\"/root/analyst-owner-login-relay-20261024\");host=\"analyst-ai-2941515.twc1.net\";config=installer.CONFIG/\"Caddyfile\";original=installer.caddy_text(host,enrollment=True);changed=False\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\ndef run(args):return subprocess.run(args,capture_output=True,text=True,timeout=40)\ntry:\n    assert not installer.INPUT_CONFIG.exists() and not installer.UNIT.exists() and not (installer.CONFIG/\"backend.env\").exists()\n    assert installer.STATE.is_dir() and not any(installer.STATE.iterdir())\n    assert config.read_text()==original\n    account=pwd.getpwnam(\"caddy\");log=pathlib.Path(\"/var/lib/caddy/analyst-enrollment-tls.log\")\n    assert not log.exists() and not log.is_symlink()\n    descriptor=os.open(log,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600);os.fchown(descriptor,account.pw_uid,account.pw_gid);os.close(descriptor)\n    logging=\"\\tlog enrollment_tls {\\n\\t\\tinclude tls http.acme_client\\n\\t\\tlevel DEBUG\\n\\t\\toutput file \"+str(log)+\"\\n\\t\\tformat json\\n\\t}\\n\"\n    config.write_text(original.replace(\"}\\n\"+host,logging+\"}\\n\"+host,1));changed=True\n    validation=run([\"caddy\",\"validate\",\"--config\",str(config),\"--adapter\",\"caddyfile\"])\n    report[\"diagnostic_config_valid\"]=validation.returncode==0\n    if validation.returncode:\n        report[\"config_error\"]=validation.stderr[-1500:]\n    else:\n        started=run([\"systemctl\",\"restart\",\"caddy\"]);report[\"restart_exit\"]=started.returncode\n        for attempt in range(25):\n            if installer.enrollment_tls_ready(host):report[\"tls_ready\"]=True;break\n            time.sleep(2)\n        events=[]\n        for line in log.read_text(errors=\"replace\")[-250000:].splitlines():\n            try:item=json.loads(line)\n            except ValueError:continue\n            if not isinstance(item,dict):continue\n            safe={key:re.sub(r\"https?://\\S+\",\"[url]\",str(item[key]))[:1200] for key in (\"level\",\"logger\",\"msg\",\"error\",\"attempt\",\"retrying_in\") if key in item}\n            if safe:events.append(safe)\n        report[\"certificate_events\"]=events[-35:]\nexcept Exception as error:\n    report[\"error_type\"]=type(error).__name__\n    path=work/\"tls-issuer-diagnostic-error.log\";path.write_text(traceback.format_exc());path.chmod(0o600)\nfinally:\n    if changed:\n        config.write_text(original)\n        restored=run([\"systemctl\",\"reload\",\"caddy\"]);report[\"original_config_restored\"]=restored.returncode==0\n    path=work/\"tls-issuer-diagnostic.json\";path.write_text(json.dumps(report,indent=2)+\"\\n\");path.chmod(0o600)\nprint(\"TIMEWEB_TLS_ISSUER_DIAGNOSTIC=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=240).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
