name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-configured-route-comparison
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Compare Telegram through a provider-bound IP temporarily configured inside Linux
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  comparison_id=None;comparison_bound=False;keep_comparison=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
                      def api(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=data,headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
                          try:
                              with opener.open(req,timeout=30) as response:
                                  status=response.status;raw=response.read(2*1024*1024+1)
                              return status,p.decode_response(raw) if raw else {}
                          except urllib.error.HTTPError as error:
                              print("COMPARISON_API_FAILURE="+json.dumps({"method":method,"path":path,"status":error.code}),flush=True)
                              raise p.ProbeError("comparison_api_failed_"+str(error.code)) from None
                      before=api("GET","/floating-ips")[1]
                      assert before["meta"]["total"]==len(before["ips"])==1
                      assert before["ips"][0]["id"]=="40e88e4d-7807-4c99-80a3-f384db68e93a" and before["ips"][0]["resource_id"]==9413105
                      created=api("POST","/floating-ips",{"availability_zone":"msk-1","is_ddos_guard":False})[1]["ip"]
                      comparison_id=created["id"];comparison_ip=str(ipaddress.IPv4Address(created["ip"]))
                      assert created["availability_zone"]=="msk-1" and created["is_ddos_guard"] is False and comparison_ip!="201.24.52.66"
                      print("TEMPORARY_COMPARISON_IP="+json.dumps({"id":comparison_id,"ip":comparison_ip,"server_id":9413105}),flush=True)
                      api("POST","/floating-ips/"+comparison_id+"/bind",{"resource_type":"server","resource_id":9413105});comparison_bound=True
                      script="import datetime,ipaddress,json,pathlib,subprocess,sys\nroot=pathlib.Path(\"/root\");new_ip=str(ipaddress.IPv4Address(sys.argv[1]));old_ip=\"201.24.52.66\"\ninterfaces=json.loads(subprocess.check_output([\"ip\",\"-j\",\"-4\",\"address\",\"show\"],text=True))\nmatches=[iface[\"ifname\"] for iface in interfaces if any(a.get(\"local\")==old_ip for a in iface.get(\"addr_info\",[]))]\nassert len(matches)==1\ninterface=matches[0]\nassert all(a.get(\"local\")!=new_ip for iface in interfaces for a in iface.get(\"addr_info\",[]))\ndefault_before=json.loads(subprocess.check_output([\"ip\",\"-j\",\"-4\",\"route\",\"show\",\"default\"],text=True))\nassert len(default_before)==1 and default_before[0][\"dev\"]==interface\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"original_ip\":old_ip,\"comparison_ip\":new_ip,\"temporary_linux_address_configured\":False,\"probes\":[],\"new_ip_successes\":0,\"original_ip_successes\":0,\"comparison_improved\":False}\ndef check(address,label,attempt):\n    result=subprocess.run([\"curl\",\"--interface\",address,\"--ipv4\",\"--compressed\",\"--fail\",\"--silent\",\"--show-error\",\"--connect-timeout\",\"5\",\"--max-time\",\"10\",\"https://oauth.telegram.org/.well-known/jwks.json\"],capture_output=True,timeout=15)\n    usable=False\n    if result.returncode==0:\n        try:\n            data=json.loads(result.stdout)\n            usable=any(k.get(\"kty\")==\"RSA\" and k.get(\"alg\",\"RS256\")==\"RS256\" and all(isinstance(k.get(n),str) and k[n] for n in (\"kid\",\"n\",\"e\")) for k in data.get(\"keys\",[]))\n        except (ValueError,TypeError):pass\n    return {\"source\":label,\"attempt\":attempt,\"curl_exit\":result.returncode,\"usable_rs256_key\":bool(usable)}\nsubprocess.run([\"ip\",\"address\",\"add\",new_ip+\"/24\",\"dev\",interface],check=True,capture_output=True)\nreport[\"temporary_linux_address_configured\"]=True\ntry:\n    assert json.loads(subprocess.check_output([\"ip\",\"-j\",\"-4\",\"route\",\"show\",\"default\"],text=True))==default_before\n    for attempt in range(1,7):\n        report[\"probes\"].append(check(old_ip,\"original\",attempt))\n        report[\"probes\"].append(check(new_ip,\"comparison\",attempt))\n    report[\"original_ip_successes\"]=sum(x[\"usable_rs256_key\"] for x in report[\"probes\"] if x[\"source\"]==\"original\")\n    report[\"new_ip_successes\"]=sum(x[\"usable_rs256_key\"] for x in report[\"probes\"] if x[\"source\"]==\"comparison\")\n    if report[\"new_ip_successes\"]==6 and report[\"original_ip_successes\"]<6:\n        for attempt in range(7,19):report[\"probes\"].append(check(new_ip,\"comparison\",attempt))\n        report[\"new_ip_successes\"]=sum(x[\"usable_rs256_key\"] for x in report[\"probes\"] if x[\"source\"]==\"comparison\")\n        report[\"comparison_improved\"]=report[\"new_ip_successes\"]==18\nfinally:\n    subprocess.run([\"ip\",\"address\",\"del\",new_ip+\"/24\",\"dev\",interface],check=True,capture_output=True)\n    report[\"temporary_linux_address_removed\"]=True\n    assert json.loads(subprocess.check_output([\"ip\",\"-j\",\"-4\",\"route\",\"show\",\"default\"],text=True))==default_before\n    report[\"default_route_unchanged\"]=True\n    target=root/\"analyst-telegram-configured-source-ip-comparison.json\";target.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nprint(\"TELEGRAM_SOURCE_IP_COMPARISON=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script)+" "+shlex.quote(comparison_ip),timeout=360).decode()
                      print(output,end="",flush=True)
                      report=json.loads(next(line.split("=",1)[1] for line in output.splitlines() if line.startswith("TELEGRAM_SOURCE_IP_COMPARISON=")))
                      keep_comparison=report["comparison_improved"] is True
                  finally:
                      if comparison_id is not None and not keep_comparison:
                          if comparison_bound:api("POST","/floating-ips/"+comparison_id+"/unbind")
                          api("DELETE","/floating-ips/"+comparison_id)
                          inventory=api("GET","/floating-ips")[1]
                          assert inventory["meta"]["total"]==len(inventory["ips"]) and not any(x["id"]==comparison_id for x in inventory["ips"])
                          print("TEMPORARY_COMPARISON_IP_REMOVED="+comparison_id,flush=True)
                      elif comparison_id is not None:
                          print("VERIFIED_IMPROVED_IP_PENDING_CUTOVER="+json.dumps({"id":comparison_id,"ip":comparison_ip}),flush=True)
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
