name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-owner-update-011-handoff
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify public HTTPS auth protection and inspect Android build resources
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          import datetime,hashlib,http.client,ssl
          host="analyst-ai-2941515.twc1.net"
          connection=http.client.HTTPSConnection(host,443,timeout=15,context=ssl.create_default_context())
          connection.connect()
          peer=connection.sock.getpeername()[0]
          assert peer=="201.24.52.66","unexpected_public_server"
          certificate=connection.sock.getpeercert()
          digest=hashlib.sha256(connection.sock.getpeercert(binary_form=True)).hexdigest()
          observations=[]
          for path,expected in (("/health",200),("/workspace",401),("/me",401),("/auth/telegram/owner-enrollment/callback",410)):
              connection.request("GET",path,headers={"Host":host})
              with connection.getresponse() as response:
                  body=response.read(8192)
                  assert response.status==expected,"external_route_gate_failed"
                  if path=="/health":assert json.loads(body)=={"status":"ok"}
                  observations.append({"path":path,"status":response.status})
          connection.close()
          print("TIMEWEB_EXTERNAL_BACKEND_VERIFIED="+json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"public_ip":peer,"host":host,"certificate_sha256":digest,"certificate_not_after":certificate.get("notAfter"),"verified_tls":True,"routes":observations}),flush=True)
          def read_public_catalog():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/presets/dedicated-servers",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_servers_presets"]
          from decimal import Decimal
          rows=sorted([r for r in read_public_catalog() if r.get("location") in {"ru-1","ru-3"}],key=lambda r:Decimal(str(r["price"])))
          allowed=("id","name","location","price","cpu","memory","disks","disk","is_pre_installed","is_available","status")
          print("TIMEWEB_CURRENT_DEDICATED_OFFERS="+json.dumps({"fields":sorted(rows[0]) if rows else [],"offers":[{k:r[k] for k in allowed if k in r} for r in rows[:12]],"cheapest_preinstalled":[{k:r[k] for k in allowed if k in r} for r in rows if r.get("is_pre_installed") is True][:3]}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      reference="fd01d2ac090103cf64557c97aeaf36bc290e2cec"
                      paths=subprocess.check_output(["git","ls-tree","-r","--name-only",reference],text=True).splitlines()
                      selected=[path for path in paths if (path.startswith("backend/") and pathlib.PurePosixPath(path).parent==pathlib.PurePosixPath("backend") and (path.endswith((".py",".json")) or path=="backend/requirements.txt")) or path in {"backend/certs/russian_trusted_root_ca.pem","deploy/install_owner_backend.py","deploy/enroll_owner.py","deploy/analyst-ai-owner.service"}]
                      expected={path:hashlib.sha256(subprocess.check_output(["git","show",reference+":"+path])).hexdigest() for path in selected}
                      assert len(expected)>30
                      script="import datetime,json,pathlib,shutil,subprocess,sys\nroot=pathlib.Path(\"/root\");source=root/\"analyst-ai-source\"\nsys.path.insert(0,str(source))\nfrom deploy import install_owner_backend as installer\nassert installer.INPUT_CONFIG.exists()\nassert installer.probe() and installer.probe(\"analyst-ai-2941515.twc1.net\")\nvalues=installer.load_config();assert values[\"BACKEND_PUBLIC_URL\"]==\"https://analyst-ai-2941515.twc1.net\"\nmemory={}\nfor line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n    key,_,value=line.partition(\":\")\n    if key in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}:memory[key+\"_kib\"]=int(value.split()[0])\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"memory\":memory,\"free_bytes\":shutil.disk_usage(\"/\").free,\"kvm\":pathlib.Path(\"/dev/kvm\").exists(),\"compiler\":shutil.which(\"kotlinc\"),\"javac\":shutil.which(\"javac\"),\"jars\":{}}\nfor cache in (root/\".gradle/caches\",root/\".m2/repository\",root/\"analyst-ai-artifacts\"):\n    if cache.exists():\n        for pattern in (\"kotlin-compiler-embeddable-*.jar\",\"kotlin-compiler-*.jar\",\"kotlin-stdlib-*.jar\",\"junit-*.jar\",\"hamcrest-core-*.jar\"):\n            files=sorted(str(p) for p in cache.rglob(pattern))\n            if files:report[\"jars\"][str(cache)+\"/\"+pattern]=files[:12]\nandroid=root/\"analyst-ai-android-690811a5\"\nreport[\"android_head\"]=subprocess.check_output([\"git\",\"-C\",str(android),\"rev-parse\",\"HEAD\"],text=True).strip()\nreport[\"android_changed_paths\"]=subprocess.check_output([\"git\",\"-C\",str(android),\"diff\",\"--name-only\"],text=True).splitlines()\nprint(\"TIMEWEB_ANDROID_SOURCE_CAPACITY=\"+json.dumps(report),flush=True)\n"
                      script='EXPECTED='+repr(expected)+'\n'+script
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=1500).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
