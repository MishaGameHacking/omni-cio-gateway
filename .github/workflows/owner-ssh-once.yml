/\"verified-identity.json\"\nassert not identity_path.is_symlink() and stat.S_IMODE(identity_path.stat().st_mode)==0o600 and identity_path.stat().st_uid==0\nidentity=json.loads(identity_path.read_text())\nassert type(identity.get(\"sub\")) is str and 1<=len(identity[\"sub\"])<=256\naccount=pwd.getpwnam(\"analyst-ai\")\nassert account.pw_uid>0 and account.pw_dir==str(installer.STATE) and account.pw_shell==\"/usr/sbin/nologin\"\nassert subprocess.run([\"pgrep\",\"-u\",str(account.pw_uid)],capture_output=True).returncode==1\ngroup=grp.getgrgid(account.pw_gid)\nassert group.gr_name==\"analyst-ai\" and not group.gr_mem\nassert all(user.pw_name==\"analyst-ai\" or user.pw_gid!=account.pw_gid for user in pwd.getpwall())\ntmux=[\"tmux\",\"-S\",str(previous/\"tmux.sock\")]\nassert checked(tmux+[\"display-message\",\"-p\",\"-t\",\"owner:0.0\",\"#{pane_dead}\"]).stdout.strip()==\"1\"\npane=checked(tmux+[\"capture-pane\",\"-p\",\"-J\",\"-S\",\"-150\",\"-t\",\"owner:0.0\"]).stdout\nassert \"Verified Telegram identity (profile hints do not authorize access):\" in pane\nassert \"OWNER_BACKEND_INSTALL_ERROR=installation_command_failed_python\" in pane\npaths=[installer.INSTALL,installer.CONFIG,installer.STATE,pathlib.Path(\"/etc/caddy\"),installer.CADDY_DROPIN.parent]\nassert all(p.is_dir() and not p.is_symlink() and p.stat().st_dev==root.stat().st_dev for p in paths)\nchecked([\"systemctl\",\"start\",\"caddy\"])\nassert installer.enrollment_tls_ready(\"analyst-ai-2941515.twc1.net\"),\"verified_tls_required\"\nchecked([\"systemctl\",\"stop\",\"caddy\"])\nchecked(tmux+[\"kill-server\"])\narchive.mkdir(mode=0o700)\nfor path,name in zip(paths,(\"installed-code\",\"configuration\",\"empty-application-state\",\"packaged-caddy-configuration\",\"caddy-unit-override\")):\n    os.rename(path,archive/name)\nchecked([\"userdel\",\"analyst-ai\"])\ntry:group=grp.getgrnam(\"analyst-ai\")\nexcept KeyError:pass\nelse:\n    assert not group.gr_mem and not any(user.pw_gid==group.gr_gid for user in pw