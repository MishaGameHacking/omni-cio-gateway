name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          observations={}
          for label,path in [('floating_ips','/floating-ips'),('domain','/domains/analyst-ai-2941515.twc1.net'),('dns_records','/domains/analyst-ai-2941515.twc1.net/dns-records')]:
              status,data=api('GET',path)
              if label=='floating_ips' and status==200:
                  rows=data.get('floating_ips',data.get('floating-ips',[]))
                  data={'matching':[r for r in rows if '83.217.195.29' in json.dumps(r)],'total_count':len(rows),'keys':list(data)}
              observations[label]={'status':status,'data':data}
          print('REDESIGN_TIMEWEB_MIGRATION_NETWORK='+json.dumps(observations),flush=True)
          with_ams("import datetime,hashlib,json,os,pathlib,sqlite3,stat,subprocess\ndef run(args,timeout=20):\n    r=subprocess.run(args,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=timeout)\n    return r.returncode,r.stdout,r.stderr[:300]\ndef meta(p):\n    s=p.lstat()\n    row={'path':str(p),'uid':s.st_uid,'gid':s.st_gid,'mode':oct(stat.S_IMODE(s.st_mode)),'bytes':s.st_size,'kind':'symlink' if p.is_symlink() else 'directory' if p.is_dir() else 'file'}\n    if p.is_symlink():row['target']=os.readlink(p)\n    elif p.is_file() and s.st_size<100000000:\n        with p.open('rb') as stream:row['sha256']=hashlib.file_digest(stream,'sha256').hexdigest()\n    return row\nout={'kind':'production_migration_readonly_inventory','observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'units':{},'files':[]}\nfor unit in ('analyst-ai-owner.service','analyst-ai-updates.service','caddy.service'):\n    fields=('ActiveState','SubState','MainPID','User','Group','WorkingDirectory','FragmentPath','DropInPaths','EnvironmentFiles','NRestarts')\n    rc,body,err=run(['systemctl','show',unit,*['--property='+k for k in fields]])\n    values=dict(line.split('=',1) for line in body.splitlines() if '=' in line)\n    out['units'][unit]={'returncode':rc,'properties':values}\n    fragment=values.get('FragmentPath','')\n    for name in [fragment,*values.get('DropInPaths','').split()]:\n        if name and pathlib.Path(name).is_file():out['files'].append(meta(pathlib.Path(name)))\nrc,body,err=run(['systemctl','list-units','--all','--no-pager','--plain','analyst-ai-*'])\nout['application_units']=body[:12000]\nfor name in ('/etc/analyst-ai','/etc/caddy','/var/lib/analyst-ai','/var/lib/caddy','.invalid'):\n    p=pathlib.Path(name)\n    if not p.is_absolute() or not p.exists():continue\n    out['files'].append(meta(p))\n    for q in sorted(p.rglob('*')):\n        if len(out['files'])>1500:raise RuntimeError('inventory_limit')\n        if q.is_file() or q.is_symlink():out['files'].append(meta(q))\nfor name in ('/opt/analyst-ai/backend','/opt/analyst-ai/venv','/srv/analyst-ai-ota','/srv/analyst-ai/workspace','/var/lib/analyst-ai-build'):\n    p=pathlib.Path(name)\n    if p.exists():out['files'].append(meta(p))\np=pathlib.Path('/etc/analyst-ai/backend.env')\nif p.exists():\n    out['environment_variable_names']=sorted({l.split('=',1)[0].strip() for l in p.read_text().splitlines() if '=' in l and not l.lstrip().startswith('#')})\ndb=pathlib.Path('/var/lib/analyst-ai/backend.db')\nwith sqlite3.connect('file:'+str(db)+'?mode=ro',uri=True) as conn:\n    out['database_integrity']=conn.execute('PRAGMA quick_check').fetchall()\n    tables=[r[0] for r in conn.execute(\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\") if r[0].replace('_','').isalnum()]\n    out['database_tables']={name:conn.execute('SELECT count(*) FROM \"'+name+'\"').fetchone()[0] for name in tables}\nout['certificate_public_metadata']=[]\nfor row in out['files']:\n    name=row['path']\n    if name.endswith('.crt') and '/var/lib/caddy/' in name:\n        rc,body,err=run(['openssl','x509','-in',name,'-noout','-fingerprint','-sha256','-dates','-subject','-issuer'])\n        out['certificate_public_metadata'].append({'path':name,'returncode':rc,'public':body})\nprint('REDESIGN_TIMEWEB_MIGRATION_INVENTORY='+json.dumps(out),flush=True)\n", timeout=150)
          PY
