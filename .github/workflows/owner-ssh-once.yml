name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nfrom pathlib import Path\np=Path(\"/var/lib/analyst-ai-build/diagnostics/ota_candidate_preserve.py\")\nassert not p.exists()\np.write_text(\"import datetime,fcntl,hashlib,json,os,pwd,shutil,subprocess,time,traceback\\nfrom pathlib import Path\\nROOT=Path(\\\"/srv/analyst-ai/workspace\\\");STATE=Path(\\\"/var/lib/analyst-ai-build\\\")\\nOUT=STATE/\\\"diagnostics/ota-candidate-37.json\\\"\\nDIGEST=\\\"aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7\\\"\\nCERT=\\\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\\\"\\nreport={\\\"status\\\":\\\"waiting_for_build\\\",\\\"version_code\\\":37,\\\"version_name\\\":\\\"0.12.1-preview\\\",\\\"source_sha256\\\":DIGEST,\\n\\\"runtime_status\\\":\\\"not_run_for_candidate37\\\",\\\"ota_published\\\":False,\\\"phone_installation_verified\\\":False,\\n\\\"source_backup_commit\\\":\\\"e36d038f11de813de267d4e2b79ff5e6eb37bae3\\\"}\\ndef stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()\\ndef sha(path):\\n    h=hashlib.sha256()\\n    with path.open(\\\"rb\\\") as f:\\n        for b in iter(lambda:f.read(1048576),b\\\"\\\"):h.update(b)\\n    return h.hexdigest()\\ndef save():\\n    tmp=OUT.with_suffix(\\\".next\\\");tmp.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");tmp.chmod(0o640);os.replace(tmp,OUT)\\ndef source_hash():\\n    names=subprocess.check_output([\\\"runuser\\\",\\\"-u\\\",\\\"analyst-build\\\",\\\"--\\\",\\\"git\\\",\\\"-C\\\",str(ROOT),\\\"ls-files\\\",\\\"--cached\\\",\\\"--others\\\",\\\"--exclude-standard\\\",\\\"-z\\\"],timeout=60).split(b\\\"\\\\0\\\")\\n    h=hashlib.sha256()\\n    for name in sorted(set(names)-{b\\\"\\\"}):\\n        rel=os.fsdecode(name)\\n        if rel in (\\\"AGENTS.md\\\",\\\"README.md\\\") or rel.startswith(\\\"docs/\\\"):continue\\n        p=ROOT/rel\\n        if p.is_file():h.update(name+b\\\"\\\\0\\\"+sha(p).encode()+b\\\"\\\\0\\\")\\n    return h.hexdigest()\\ntry:\\n    report[\\\"started_at\\\"]=stamp();save()\\n    limit=time.monotonic()+7500\\n    while True:\\n        pipeline=json.loads((STATE/\\\"diagnostics/ota-check-build-20261025.json\\\").read_text())\\n        if pipeline.get(\\\"status\\\")==\\\"failed\\\":raise RuntimeError(\\\"fresh_check_build_failed\\\")\\n        if pipeline.get(\\\"status\\\")==\\\"passed\\\" and pipeline.get(\\\"source_sha256\\\")==DIGEST:break\\n        if time.monotonic()>limit:raise RuntimeError(\\\"build_wait_timeout\\\")\\n        time.sleep(5)\\n    with (STATE/\\\"workspace.lock\\\").open(\\\"a\\\") as lock:\\n        fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n        check=json.loads((STATE/\\\"check-result.json\\\").read_text())\\n        build=json.loads((STATE/\\\"build-result.json\\\").read_text())\\n        assert all(r.get(\\\"status\\\")==\\\"passed\\\" and r.get(\\\"source_sha256\\\")==DIGEST for r in (check,build))\\n        assert source_hash()==DIGEST,\\\"source_changed\\\"\\n        apk=ROOT/\\\"app/build/outputs/apk/preview/app-preview.apk\\\"\\n        proof=json.loads((apk.parent/\\\"apk-verification.json\\\").read_text())\\n        digest=sha(apk)\\n        assert digest==build[\\\"apk_sha256\\\"]==proof[\\\"sha256\\\"]\\n        assert proof[\\\"package\\\"]==\\\"ru.omnicio.app.debug\\\" and proof[\\\"version_code\\\"]==37 and proof[\\\"version_name\\\"]==\\\"0.12.1-preview\\\"\\n        assert proof[\\\"certificate_sha256\\\"]==CERT and proof[\\\"signature_v2\\\"] is True and proof[\\\"zipalign_16kb\\\"] is True\\n        assert proof[\\\"debuggable\\\"] is False and proof[\\\"test_only\\\"] is False and proof[\\\"min_sdk\\\"]==37 and proof[\\\"target_sdk\\\"]==37\\n        assert proof[\\\"bytes\\\"]==apk.stat().st_size\\n        assert proof[\\\"phone_orientation\\\"]==\\\"portrait\\\"\\n        assert \\\"android.permission.REQUEST_INSTALL_PACKAGES\\\" in (apk.parent/\\\"manifest.txt\\\").read_text()\\n        assert \\\"android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION\\\" in (apk.parent/\\\"manifest.txt\\\").read_text()\\n        group=pwd.getpwnam(\\\"analyst-build\\\").pw_gid\\n        base=STATE/\\\"candidates\\\";base.mkdir(exist_ok=True);base.chmod(0o750);os.chown(base,0,group)\\n        target=base/(\\\"v37-\\\"+digest[:16]);target.mkdir(exist_ok=False);target.chmod(0o750);os.chown(target,0,group)\\n        name=\\\"Analyst-AI-0.12.1-preview-37.apk\\\"\\n        dest=target/name\\n        shutil.copyfile(apk,dest);dest.chmod(0o640);os.chown(dest,0,group)\\n        assert sha(dest)==digest,\\\"archived_bytes_changed\\\"\\n        for fname,data in ((\\\"apk-verification.json\\\",proof),(\\\"check-result.json\\\",check),(\\\"build-result.json\\\",build)):\\n            p=target/fname;p.write_text(json.dumps(data,indent=2)+\\\"\\\\n\\\");p.chmod(0o640);os.chown(p,0,group)\\n        report.update({\\\"status\\\":\\\"prepared_not_published\\\",\\\"apk\\\":str(dest),\\\"apk_sha256\\\":digest,\\\"apk_bytes\\\":proof[\\\"bytes\\\"],\\n        \\\"certificate_sha256\\\":CERT,\\\"check_finished_at\\\":check[\\\"finished_at\\\"],\\\"build_finished_at\\\":build[\\\"finished_at\\\"],\\n        \\\"archive_directory\\\":str(target),\\\"publication_gate\\\":\\\"full_android_runtime_required\\\"})\\n        assert source_hash()==DIGEST,\\\"source_changed_during_archive\\\"\\nexcept BaseException as exc:\\n    report[\\\"status\\\"]=\\\"failed\\\";report[\\\"error\\\"]=str(exc);report[\\\"error_type\\\"]=type(exc).__name__\\n    print(traceback.format_exc(),flush=True)\\nfinally:\\n    report[\\\"finished_at\\\"]=stamp();save();print(\\\"OTA_CANDIDATE_ARCHIVE=\\\"+json.dumps(report),flush=True)\\nif report[\\\"status\\\"]!=\\\"prepared_not_published\\\":raise SystemExit(1)\\n\");p.chmod(0o640)\nsubprocess.run([\"systemd-run\",\"--unit=analyst-ota-candidate37-preserve\",\"--property=Type=exec\",\"--property=MemoryMax=134217728\",\"--property=TasksMax=32\",\"--property=RuntimeMaxSec=7800\",\"--property=TimeoutStopSec=30\",\"--property=KillMode=control-group\",\"--property=UMask=0077\",\"--property=StandardOutput=append:/var/lib/analyst-ai-build/diagnostics/ota-candidate37-preserve.log\",\"--property=StandardError=inherit\",\"/usr/bin/python3\",\"-B\",str(p)],check=True)\nprint(\"CANDIDATE_ARCHIVE_QUEUED=true\",flush=True)\nimport json,subprocess\nfrom pathlib import Path\nstate=Path(\"/var/lib/analyst-ai-build\")\nfor name,p in (\n (\"PIPELINE\",state/\"diagnostics/ota-check-build-20261025.json\"),\n (\"CHECK\",state/\"check-result.json\"),(\"BUILD\",state/\"build-result.json\"),\n):\n    if not p.exists():continue\n    data=json.loads(p.read_text())\n    print(name+\"=\"+json.dumps(data),flush=True)\n    folder=Path(data.get(\"log_directory\",\"/nonexistent\"))\n    if data.get(\"status\")==\"failed\":\n        p=folder/\"failure.log\"\n        if p.exists():print(name+\"_FAILURE=\"+p.read_text()[-5000:],flush=True)\n        for step in data.get(\"steps\",[]):\n            if step.get(\"exit_code\") not in (None,0):\n                p=Path(step[\"log\"])\n                if p.exists():print(name+\"_FAILED_LOG=\"+p.read_text(errors=\"replace\")[-14000:],flush=True)\n    elif name==\"BUILD\" and data.get(\"status\")==\"running\":\n        p=folder/\"gradle.log\"\n        if p.exists():print(\"GRADLE_TAIL=\"+p.read_text(errors=\"replace\")[-5000:],flush=True)\nprint(\"STAGE_UNITS=\"+subprocess.run([\"systemctl\",\"show\",\"analyst-workspace@check.service\",\"analyst-workspace@build.service\",\"analyst-ota-check-build-20261025.service\",\"--property=ActiveState,SubState,Result,MemoryCurrent,MemoryPeak,CPUUsageNSec\"],capture_output=True,text=True).stdout,flush=True)\n\n",timeout=180)
          PY
