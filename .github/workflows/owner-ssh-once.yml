name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,subprocess,json,datetime,sqlite3,urllib.request,urllib.error,hashlib,os\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nunit=\"analyst-emulator-leaf37-4096.service\"\nprops=[\"ActiveState\",\"SubState\",\"Result\",\"MainPID\",\"ExecMainStatus\",\"MemoryCurrent\",\"MemoryPeak\",\"MemorySwapCurrent\",\"MemorySwapPeak\",\"CPUUsageNSec\",\"ControlGroup\",\"ActiveEnterTimestamp\",\"InactiveEnterTimestamp\"]\nprint(\"LEAF_UNIT_STATE=\"+json.dumps(dict(x.split(\"=\",1) for x in subprocess.check_output([\"systemctl\",\"show\",unit,*sum([[\"-p\",p] for p in props],[])]).decode().splitlines())),flush=True)\nfolders=sorted((state/\"diagnostics\").glob(\"leaf37-4096-*\"),key=lambda p:p.stat().st_mtime_ns)\nif folders:\n folder=folders[-1]\n print(\"LEAF_DIRECTORY=\"+json.dumps(str(folder)),flush=True)\n for name in (\"result.json\",\"failure.txt\",\"leaf.log\"):\n  p=folder/name\n  if p.exists():print(\"LEAF_FILE=\"+json.dumps({\"file\":name,\"content\":p.read_text(errors=\"replace\")[-18000:]}),flush=True)\n logs=[]\n for p in folder.rglob(\"*\"):\n  if p.is_file() and p.suffix in (\".json\",\".log\",\".txt\") and \"avd\" not in str(p.relative_to(folder)) and p.stat().st_size<20000000:\n   logs.append({\"file\":str(p.relative_to(folder)),\"bytes\":p.stat().st_size})\n print(\"LEAF_EVIDENCE_INDEX=\"+json.dumps(logs[:90]),flush=True)\n sample=folder/\"samples.jsonl\"\n if sample.exists():\n  lines=sample.read_text().splitlines()\n  parsed=[json.loads(x) for x in lines]\n  selected=parsed[:1]+(parsed[-1:] if len(parsed)>1 else [])\n  print(\"LEAF_SAMPLES=\"+json.dumps({\"count\":len(parsed),\"selected\":selected}),flush=True)\n for p in sorted(folder.rglob(\"emulator.log\")):\n  print(\"LEAF_EMULATOR_LOG=\"+json.dumps({\"file\":str(p.relative_to(folder)),\"content\":p.read_text(errors=\"replace\")[-14000:]}),flush=True)\n print(\"LEAF_NEW_IMAGES=\"+json.dumps([str(p.relative_to(folder)) for p in folder.rglob(\"*.png\")]),flush=True)\nfor name in (\"analyst-ai-owner.service\",\"analyst-ai-updates.service\",\"caddy.service\"):\n print(\"PRODUCTION_UNIT=\"+json.dumps({\"unit\":name,\"state\":subprocess.check_output([\"systemctl\",\"is-active\",name]).decode().strip()}),flush=True)\nfor path in (\"/health\",\"/client/update-policy?package_name=ru.omnicio.app.debug\"):\n with urllib.request.urlopen(\"https://analyst-ai-2941515.twc1.net\"+path,timeout=20) as response:\n  body=json.loads(response.read(65536))\n  print(\"PRODUCTION_HTTPS=\"+json.dumps({\"path\":path,\"status\":response.status,\"version_code\":body.get(\"version_code\"),\"apk_sha256\":body.get(\"apk_sha256\")}),flush=True)\nenv={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if \"=\" in line and not line.startswith(\"#\"):\n  k,v=line.split(\"=\",1)\n  try:env[k]=json.loads(v)\n  except json.JSONDecodeError:env[k]=v\ndatabase=pathlib.Path(env[\"DATABASE_PATH\"])\nassert database.is_absolute()\nconnection=sqlite3.connect(\"file:\"+str(database)+\"?mode=ro\",uri=True)\nconnection.execute(\"PRAGMA query_only=ON\");connection.execute(\"BEGIN\")\nconnection.row_factory=sqlite3.Row\nrow=connection.execute(\"WITH active_owner_sessions AS (\\n SELECT s.token_hash,s.user_id,d.created_at,d.last_seen_at\\n FROM sessions AS s JOIN users AS u ON u.id=s.user_id\\n JOIN installation_owner AS o ON o.singleton=1 AND o.telegram_sub=u.telegram_sub\\n JOIN workspace_session_devices AS d ON d.token_hash=s.token_hash\\n WHERE s.expires_at>:now\\n), accepted_37 AS (\\n SELECT a.created_at,a.last_seen_at,c.observed_at\\n FROM active_owner_sessions AS a\\n JOIN client_versions AS c ON c.session_hash=a.token_hash AND c.user_id=a.user_id\\n WHERE c.package_name='ru.omnicio.app.debug' AND c.version_code=37 AND c.release_sha256=:release_sha\\n)\\nSELECT (SELECT COUNT(*) FROM installation_owner) AS owner_bindings,\\n (SELECT COUNT(*) FROM users) AS users_total,\\n (SELECT COUNT(*) FROM active_owner_sessions) AS active_owner_sessions,\\n (SELECT COUNT(*) FROM active_owner_sessions WHERE created_at>=:since) AS new_owner_sessions,\\n (SELECT COUNT(*) FROM accepted_37) AS accepted_v37_sessions,\\n (SELECT COUNT(*) FROM accepted_37 WHERE created_at>=:since AND observed_at>=:since) AS new_sessions_with_v37_accepted,\\n (SELECT MAX(observed_at) FROM accepted_37 WHERE created_at>=:since) AS latest_new_session_v37_observed_at\",{\"now\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"since\":\"2026-10-25T07:15:00+00:00\",\"release_sha\":\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\"}).fetchone()\nprint(\"PHONE_SESSION_AGGREGATE=\"+json.dumps(dict(row)),flush=True)\nconnection.rollback();connection.close()\n",timeout=150)
          PY
