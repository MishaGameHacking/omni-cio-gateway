name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect Moscow and Saint Petersburg compute options for direct API creation
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          fin=get("/account/finances")["finances"]
          status=get("/account/status")["status"]
          assert Decimal(str(fin["balance"]))>0 and not status["is_blocked"]
          print("METRO_ACCOUNT="+json.dumps({"balance_positive":True,"hourly_billing":Decimal(str(fin["hourly_fee"]))>0,"blocked":False}),flush=True)
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          print("METRO_CLOUD_INVENTORY="+json.dumps([{k:s.get(k) for k in ("id","name","status","cpu","ram","location","availability_zone")} for s in servers["servers"]]),flush=True)
          dedicated=get("/dedicated-servers")
          print("METRO_DEDICATED_INVENTORY="+json.dumps({"meta":dedicated.get("meta"),"servers":[{k:s.get(k) for k in ("id","name","status","preset_id","price","location","project_id")} for s in dedicated.get("dedicated_servers",[])]}),flush=True)
          offers=[]
          for row in get("/presets/servers")["server_presets"]:
              if row["location"] in {"ru-1","ru-3"} and 2<=row["cpu"]<=4 and 5120<=row["ram"]<=8192 and row["disk"]>=30720:
                  offers.append({"kind":"preset",**{k:row[k] for k in ("id","location","cpu","ram","disk","price")}})
          for c in get("/configurator/servers")["server_configurators"]:
              if c["location"] not in {"ru-1","ru-3"}:continue
              sizes={"cpu":2,"ram":5120,"disk":30720}
              r=c["requirements"]
              if not all(r[k+"_min"]<=v<=r[k+"_max"] and (v-r[k+"_min"])%r[k+"_step"]==0 for k,v in sizes.items()):continue
              price=Decimal(str(c["prices"]["cpu"]))*2+Decimal(str(c["prices"]["ram"]))*5+Decimal(str(c["prices"]["disk"]))*30
              offers.append({"kind":"configuration","id":c["id"],"location":c["location"],**sizes,"price":float(price),"details":c})
          offers.sort(key=lambda x:Decimal(str(x["price"])))
          print("METRO_CLOUD_CATALOG="+json.dumps(offers[:12]),flush=True)
          presets=get("/presets/dedicated-servers")["dedicated_servers_presets"]
          presets=[row for row in presets if row["location"] in {"ru-1","ru-3"}]
          presets.sort(key=lambda x:Decimal(str(x["price"])))
          print("METRO_DEDICATED_CATALOG="+json.dumps(presets[:5]),flush=True)
          cheapest=presets[0]
          print("METRO_DEDICATED_OPTIONS="+json.dumps({"preset_id":cheapest["id"],"options":get("/presets/dedicated-servers/"+str(cheapest["id"])+"/additional-services")}),flush=True)
          PY
