name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-backend-validation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Restore omitted empty Git directories, verify migration, and test the backend in Moscow
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["id"]==9413105 and server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and server["preset_id"]==6867 and p.cloud.public_ipv4(server)=="201.24.52.66"
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,hashlib,json,os,pathlib,stat,subprocess\nroot=pathlib.Path(\"/root\");manifest=root/\"analyst-moscow-app-transfer-9413105.json\"\ndigest=\"a67642032eeda8449d646567bf89039ff5f90876db4cdc4657c08c9c16675ba8\"\nassert manifest.is_file() and hashlib.sha256(manifest.read_bytes()).hexdigest()==digest\ndoc=json.loads(manifest.read_text())\nassert doc[\"source_server_id\"]==9408159 and doc[\"destination_server_id\"]==9413105 and len(doc[\"files\"])==1984\nfor row in doc[\"files\"]:\n    path=root/row[\"path\"]\n    assert path.is_file() and not path.is_symlink() and path.stat().st_uid==0\n    assert path.stat().st_size==row[\"bytes\"] and hashlib.sha256(path.read_bytes()).hexdigest()==row[\"sha256\"]\n    assert stat.S_IMODE(path.stat().st_mode)==row[\"mode\"]\nrestored=[]\nfor name,sha in doc[\"verified_source_repositories\"].items():\n    git=root/name/\".git\"\n    assert git.is_dir() and not git.is_symlink() and (git/\"HEAD\").is_file() and (git/\"objects\").is_dir()\n    layout={rel:(git/rel).exists() for rel in (\"HEAD\",\"objects\",\"refs\",\"refs/heads\",\"refs/tags\")}\n    print(\"MOSCOW_GIT_TRANSFER_LAYOUT=\"+json.dumps({\"repository\":name,\"before\":layout}),flush=True)\n    # Files-only archives omit empty Git ref directories. Restore Git's directory structure.\n    for rel in (\"refs\",\"refs/heads\",\"refs/tags\",\"objects/info\"):\n        path=git/rel\n        assert not path.is_symlink()\n        if not path.exists():path.mkdir(mode=0o700,parents=True);restored.append(name+\"/.git/\"+rel)\n    assert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root/name,text=True).strip()==sha\n    subprocess.run([\"git\",\"diff\",\"--check\"],cwd=root/name,check=True,capture_output=True)\nprivate=root/\".android/debug.keystore\"\nassert stat.S_IMODE(private.stat().st_mode)==0o600\napk=root/\"analyst-ai-artifacts/690811a5a376181990a64f37d914c87eb6c919b7/Analyst-AI-0.11.0-preview-690811a5.apk\"\nassert hashlib.sha256(apk.read_bytes()).hexdigest()==\"71feb07dd0379a56ec25513194535a145bd5663dadc77611c50cdc442fccd27d\"\nenrollment=root/\"analyst-ai-enrollment.json\";values=json.loads(enrollment.read_text())\nassert values[\"EXPECTED_PUBLIC_IPV4\"]==\"201.34.146.244\" and values[\"BACKEND_PUBLIC_URL\"]==\"https://analyst-ai-2941515.twc1.net\"\nvalues[\"EXPECTED_PUBLIC_IPV4\"]=\"201.24.52.66\"\nfd=os.open(enrollment,os.O_WRONLY|os.O_TRUNC|os.O_NOFOLLOW,0o600)\nwith os.fdopen(fd,\"w\") as stream:stream.write(json.dumps(values,indent=2)+chr(10))\nreport={\"source_server_id\":9408159,\"destination_server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"file_count\":len(doc[\"files\"]),\"total_bytes\":sum(x[\"bytes\"] for x in doc[\"files\"]),\"manifest_sha256\":digest,\"all_file_hashes_verified\":True,\"original_signing_key_preserved\":True,\"apk_sha256\":hashlib.sha256(apk.read_bytes()).hexdigest(),\"old_server_preserved\":True,\"application_started\":False,\"enrollment_expected_ip_updated\":True,\"empty_git_directories_restored\":restored}\nout=root/\"analyst-moscow-migration.json\";out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\nready_path=root/\"analyst-moscow-readiness.json\";ready=json.loads(ready_path.read_text());ready[\"migration_verified\"]=True\nready_path.write_text(json.dumps(ready,indent=2));ready_path.chmod(0o600)\nprogress=root/\"analyst-moscow-encrypted-transfer.json\";value=json.loads(progress.read_text());value[\"phase\"]=\"verified\";value[\"promotion_error_resolved\"]=\"restore_empty_git_directories\";value.pop(\"error_type\",None)\nprogress.write_text(json.dumps(value,indent=2));progress.chmod(0o600)\nprint(\"MOSCOW_MIGRATION_VERIFIED=\"+json.dumps(report),flush=True)\n\nimport datetime,hashlib,json,os,pathlib,resource,shutil,subprocess,tempfile,time,xml.etree.ElementTree as ET\nroot=pathlib.Path(\"/root\")\nrepo=root/\"analyst-ai-development-79be1821\"\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=repo,text=True).strip()==\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\"\nmigration=json.loads((root/\"analyst-moscow-migration.json\").read_text())\nassert migration[\"all_file_hashes_verified\"] and migration[\"original_signing_key_preserved\"] and migration[\"destination_server_id\"]==9413105\nreport={\"server_id\":9413105,\"source_sha\":\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\",\"started_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"steps\":[],\"complete\":False,\"application_started\":False}\nout=root/\"analyst-moscow-validation.json\"\ndef save():\n    out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\ndef run(name,args,cwd=repo,env=None,timeout=600):\n    log=root/(\"analyst-moscow-validation-\"+name+\".log\")\n    started=time.monotonic()\n    with log.open(\"w\") as stream:\n        result=subprocess.run(args,cwd=cwd,env=env,stdout=stream,stderr=subprocess.STDOUT,timeout=timeout)\n    log.chmod(0o600)\n    row={\"name\":name,\"exit\":result.returncode,\"seconds\":round(time.monotonic()-started,2),\"log_sha256\":hashlib.sha256(log.read_bytes()).hexdigest(),\"child_peak_rss_kib\":resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss}\n    report[\"steps\"].append(row);save()\n    print(\"MOSCOW_VALIDATION_STEP=\"+json.dumps(row),flush=True)\n    assert result.returncode==0,\"step_failed_\"+name\ntry:\n    venv=root/\"analyst-ai-development-venv\"\n    assert not venv.exists()\n    run(\"venv\",[\"python3\",\"-m\",\"venv\",str(venv)])\n    python=str(venv/\"bin/python\")\n    run(\"dependencies\",[python,\"-m\",\"pip\",\"install\",\"--disable-pip-version-check\",\"--no-cache-dir\",\"--only-binary=:all:\",\"-r\",\"backend/requirements-dev.txt\"],timeout=900)\n    run(\"dependency-consistency\",[python,\"-m\",\"pip\",\"check\"])\n    with tempfile.TemporaryDirectory(prefix=\"analyst-moscow-tests-\",dir=\"/root\") as directory:\n        env={k:v for k,v in os.environ.items() if k in (\"PATH\",\"LANG\",\"LC_ALL\",\"HOME\")}\n        env.update({\"TELEGRAM_CLIENT_ID\":\"123456\",\"TELEGRAM_CLIENT_SECRET\":\"test-only\",\"BACKEND_PUBLIC_URL\":\"https://example.invalid\",\"FERNET_KEY\":\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\",\"ANALYSIS_SCHEDULER_ENABLED\":\"false\",\"AI_EXTERNAL_PROCESSING_APPROVED\":\"false\",\"DATABASE_PATH\":directory+\"/tests.sqlite3\",\"PYTHONPATH\":str(repo)})\n        run(\"python-syntax\",[python,\".github/scripts/audit_python_sources.py\"],env=env)\n        run(\"backend-compile\",[python,\"-m\",\"compileall\",\"-q\",\"backend\"],env=env)\n        junit=root/\"analyst-moscow-backend-tests.xml\"\n        run(\"backend-tests\",[python,\"-m\",\"pytest\",\"backend/tests\",\"-q\",\"--junitxml=\"+str(junit)],env=env,timeout=900)\n        junit.chmod(0o600)\n        xml=ET.parse(junit).getroot();suites=[xml] if xml.tag==\"testsuite\" else list(xml.iter(\"testsuite\"))\n        report[\"backend_tests\"]={k:sum(int(x.attrib.get(k,0)) for x in suites) for k in (\"tests\",\"failures\",\"errors\",\"skipped\")}\n        save()\n        assert report[\"backend_tests\"][\"failures\"]==0 and report[\"backend_tests\"][\"errors\"]==0\n        smoke=\"from fastapi.testclient import TestClient; from backend.app import app\\nwith TestClient(app) as c:\\n assert c.get('/health').status_code==200 and c.get('/health').json()=={'status':'ok'}\\n assert c.get('/openapi.json').status_code==200\\n\"\n        env[\"DATABASE_PATH\"]=directory+\"/smoke.sqlite3\"\n        run(\"health-openapi\",[python,\"-c\",smoke],env=env)\n    source=root/\"analyst-ai-source\"\n    run(\"installer-preflight\",[\"python3\",str(source/\"deploy/install_owner_backend.py\"),\"--enroll-owner\"],cwd=source)\n    report[\"free_disk_bytes\"]=shutil.disk_usage(\"/\").free\n    report[\"memory_kib\"]={}\n    for line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n        key,_,value=line.partition(\":\")\n        if key in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}:report[\"memory_kib\"][key]=int(value.split()[0])\n    report[\"failed_units\"]=subprocess.check_output([\"systemctl\",\"--failed\",\"--plain\",\"--no-legend\",\"--no-pager\"],text=True).strip().splitlines()\n    report[\"complete\"]=True\nexcept Exception as error:\n    report[\"error_type\"]=type(error).__name__\nfinally:\n    report[\"finished_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\nprint(\"MOSCOW_VALIDATION=\"+json.dumps(report),flush=True)\n"
                  output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=1800).decode()
                  print(output,end="",flush=True)
                  final=json.loads(next(line.split("=",1)[1] for line in output.splitlines() if line.startswith("MOSCOW_VALIDATION=")))
                  assert final["complete"],"moscow_backend_validation_failed_read_saved_log"
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
