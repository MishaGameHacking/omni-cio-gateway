name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,subprocess,json,datetime,sqlite3,urllib.request,urllib.error,hashlib,os,time\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nunit=\"analyst-emulator-leaf37-4096.service\"\nprops=[\"ActiveState\",\"SubState\",\"Result\",\"MainPID\",\"ExecMainStatus\",\"MemoryCurrent\",\"MemoryPeak\",\"MemorySwapCurrent\",\"MemorySwapPeak\",\"CPUUsageNSec\",\"ControlGroup\",\"ActiveEnterTimestamp\",\"InactiveEnterTimestamp\"]\nprint(\"LEAF_UNIT_STATE=\"+json.dumps(dict(x.split(\"=\",1) for x in subprocess.check_output([\"systemctl\",\"show\",unit,*sum([[\"-p\",p] for p in props],[])]).decode().splitlines())),flush=True)\nfolders=sorted((state/\"diagnostics\").glob(\"leaf37-4096-*\"),key=lambda p:p.stat().st_mtime_ns)\nif folders:\n folder=folders[-1]\n print(\"LEAF_DIRECTORY=\"+json.dumps(str(folder)),flush=True)\n for name in (\"result.json\",\"failure.txt\",\"leaf.log\"):\n  p=folder/name\n  if p.exists():print(\"LEAF_FILE=\"+json.dumps({\"file\":name,\"content\":p.read_text(errors=\"replace\")[-18000:]}),flush=True)\n logs=[]\n for p in folder.rglob(\"*\"):\n  if p.is_file() and p.suffix in (\".json\",\".log\",\".txt\") and \"avd\" not in str(p.relative_to(folder)) and p.stat().st_size<20000000:\n   logs.append({\"file\":str(p.relative_to(folder)),\"bytes\":p.stat().st_size})\n print(\"LEAF_EVIDENCE_INDEX=\"+json.dumps(logs[:90]),flush=True)\n sample=folder/\"samples.jsonl\"\n if sample.exists():\n  lines=sample.read_text().splitlines()\n  parsed=[json.loads(x) for x in lines]\n  selected=parsed[:1]+(parsed[-1:] if len(parsed)>1 else [])\n  print(\"LEAF_SAMPLES=\"+json.dumps({\"count\":len(parsed),\"selected\":selected}),flush=True)\n for p in sorted(folder.rglob(\"emulator.log\")):\n  print(\"LEAF_EMULATOR_LOG=\"+json.dumps({\"file\":str(p.relative_to(folder)),\"content\":\"\\n\".join(line for line in p.read_text(errors=\"replace\").splitlines() if not any(skip in line for skip in (\"Extensions VK_\",\"Sending adb public key\",\"androidboot.qemu.adb.pubkey\"))) [-9000:]}),flush=True)\n print(\"LEAF_NEW_IMAGES=\"+json.dumps([str(p.relative_to(folder)) for p in folder.rglob(\"*.png\")]),flush=True)\nfor name in (\"analyst-ai-owner.service\",\"analyst-ai-updates.service\",\"caddy.service\"):\n print(\"PRODUCTION_UNIT=\"+json.dumps({\"unit\":name,\"state\":subprocess.check_output([\"systemctl\",\"is-active\",name]).decode().strip()}),flush=True)\nfor path in (\"/health\",\"/client/update-policy?package_name=ru.omnicio.app.debug\"):\n with urllib.request.urlopen(\"https://analyst-ai-2941515.twc1.net\"+path,timeout=20) as response:\n  body=json.loads(response.read(65536))\n  print(\"PRODUCTION_HTTPS=\"+json.dumps({\"path\":path,\"status\":response.status,\"version_code\":body.get(\"version_code\"),\"apk_sha256\":body.get(\"apk_sha256\")}),flush=True)\nenv={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if \"=\" in line and not line.startswith(\"#\"):\n  k,v=line.split(\"=\",1)\n  try:env[k]=json.loads(v)\n  except json.JSONDecodeError:env[k]=v\ndatabase=pathlib.Path(env[\"DATABASE_PATH\"])\nassert database.is_absolute()\nconnection=sqlite3.connect(\"file:\"+str(database)+\"?mode=ro\",uri=True)\nconnection.execute(\"PRAGMA query_only=ON\");connection.execute(\"BEGIN\")\nconnection.row_factory=sqlite3.Row\nbad_types=connection.execute(\"SELECT (SELECT COUNT(*) FROM sessions WHERE typeof(expires_at)<>'integer')+(SELECT COUNT(*) FROM workspace_session_devices WHERE typeof(created_at)<>'integer' OR typeof(last_seen_at)<>'integer')+(SELECT COUNT(*) FROM client_versions WHERE typeof(observed_at)<>'integer')+(SELECT COUNT(*) FROM login_codes WHERE typeof(expires_at)<>'integer')\").fetchone()[0]\nassert bad_types==0,\"unexpected_timestamp_storage_type\"\nrow=connection.execute(\"WITH owner_users AS (\\n SELECT u.id FROM users u WHERE EXISTS (\\n  SELECT 1 FROM installation_owner o WHERE o.singleton=1 AND o.telegram_sub=u.telegram_sub)\\n), owner_sessions AS (\\n SELECT s.token_hash,s.user_id,s.expires_at FROM sessions s WHERE s.user_id IN (SELECT id FROM owner_users)\\n), active_sessions AS (\\n SELECT * FROM owner_sessions WHERE expires_at>=:now\\n), owner_devices AS (\\n SELECT d.created_at,d.last_seen_at FROM workspace_session_devices d WHERE EXISTS (\\n  SELECT 1 FROM owner_sessions s WHERE s.token_hash=d.token_hash)\\n), active_versions AS (\\n SELECT v.package_name,v.version_code,v.release_sha256,v.observed_at FROM client_versions v WHERE EXISTS (\\n  SELECT 1 FROM active_sessions s WHERE s.token_hash=v.session_hash AND s.user_id=v.user_id)\\n), accepted37 AS (\\n SELECT * FROM active_versions WHERE package_name=:package AND version_code=37 AND release_sha256=:sha37\\n)\\nSELECT :now AS snapshot_epoch_s,:since AS window_start_epoch_s,\\n (SELECT COUNT(*) FROM installation_owner) AS owner_registry_rows,\\n (SELECT COUNT(*) FROM users) AS users_total,\\n (SELECT COUNT(*) FROM owner_users) AS owner_users_total,\\n (SELECT COUNT(*) FROM owner_sessions) AS owner_sessions_total,\\n (SELECT COUNT(*) FROM active_sessions) AS owner_sessions_valid,\\n (SELECT COUNT(*) FROM owner_sessions WHERE expires_at<:now) AS owner_sessions_expired_still_stored,\\n (SELECT MIN(expires_at) FROM active_sessions) AS valid_expiry_min_epoch_s,\\n (SELECT MAX(expires_at) FROM active_sessions) AS valid_expiry_max_epoch_s,\\n (SELECT COUNT(*) FROM active_sessions s WHERE EXISTS (\\n  SELECT 1 FROM workspace_session_devices d WHERE d.token_hash=s.token_hash)) AS valid_sessions_with_device_row,\\n (SELECT COUNT(*) FROM active_sessions s WHERE NOT EXISTS (\\n  SELECT 1 FROM workspace_session_devices d WHERE d.token_hash=s.token_hash)) AS valid_sessions_without_device_row,\\n (SELECT COUNT(*) FROM owner_devices) AS linked_device_rows_total,\\n (SELECT COUNT(*) FROM owner_devices WHERE created_at BETWEEN :since AND :now) AS linked_device_rows_created_in_window,\\n (SELECT COUNT(*) FROM owner_devices WHERE last_seen_at BETWEEN :since AND :now) AS linked_device_rows_seen_in_window,\\n (SELECT COUNT(*) FROM active_versions) AS valid_sessions_with_version_record,\\n (SELECT COUNT(*) FROM active_versions WHERE package_name=:package AND version_code=37) AS valid_sessions_claiming37,\\n (SELECT COUNT(*) FROM accepted37) AS valid_sessions_accepted37,\\n (SELECT COUNT(*) FROM accepted37 WHERE observed_at BETWEEN :since AND :now) AS valid_sessions_accepted37_in_window,\\n (SELECT MAX(observed_at) FROM accepted37) AS accepted37_last_observed_epoch_s,\\n (SELECT COUNT(*) FROM login_codes WHERE user_id IN (SELECT id FROM owner_users) AND used=0 AND expires_at>=:now) AS owner_unconsumed_login_codes_valid\",{\"now\":int(time.time()),\"since\":int(datetime.datetime(2026,10,25,7,15,tzinfo=datetime.timezone.utc).timestamp()),\"package\":\"ru.omnicio.app.debug\",\"sha37\":\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\"}).fetchone()\nprint(\"PHONE_SESSION_AGGREGATE=\"+json.dumps(dict(row)),flush=True)\nconnection.rollback();connection.close()\n",timeout=150)
          PY
