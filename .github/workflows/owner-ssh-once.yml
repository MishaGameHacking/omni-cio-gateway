\"replace\")\n        if \"Type REGISTERED followed by the exact redirect URI:\" in pane and not registered:\n            tty=tmux(\"display-message\",\"-p\",\"-t\",\"owner:0.0\",\"#{pane_tty}\").decode().strip()\n            descriptor=os.open(tty,os.O_RDONLY|os.O_NOCTTY|os.O_NOFOLLOW)\n            try:\n                info=os.fstat(descriptor)\n                private=stat.S_ISCHR(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\n                ready=not termios.tcgetattr(descriptor)[3]&termios.ECHO\n            finally:os.close(descriptor)\n            assert private,\"terminal_privacy_failed\"\n            if ready:\n                assert installer.enrollment_tls_ready(\"analyst-ai-2941515.twc1.net\"),\"enrollment_tls_not_ready\"\n                tmux(\"send-keys\",\"-l\",\"-t\",\"owner:0.0\",\"REGISTERED \"+values[\"TELEGRAM_ENROLLMENT_REDIRECT_URI\"])\n                tmux(\"send-keys\",\"-t\",\"owner:0.0\",\"Enter\");registered=True\n                report[\"phase\"]=\"waiting_for_login_link\";save()\n        found=re.search(r\"https://oauth\\.telegram\\.org/auth\\?[^\\s\\x00-\\x20]{1,4096}\",pane)\n        if found:\n            url=found.group(0);query=urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)\n            assert query.get(\"client_id\")==[values[\"TELEGRAM_CLIENT_ID\"]] and query.get(\"redirect_uri\")==[values[\"TELEGRAM_ENROLLMENT_REDIRECT_URI\"]]\n            assert query.get(\"response_type\")==[\"code\"] and query.get(\"code_challenge_method\")==[\"S256\"] and set(query)=={\"client_id\",\"redirect_uri\",\"response_type\",\"scope\",\"state\",\"nonce\",\"code_challenge\",\"code_challenge_method\"}\n            assert registered\n            break\n        if tmux(\"display-message\",\"-p\",\"-t\",\"owner:0.0\",\"#{pane_dead}\").decode().strip()==\"1\":\n            report[\"phase\"]=\"installation_stopped\"\n            report[\"exit\"]=tmux(\"display-message\",\"-p\",\"-t\",\"owner:0.0\",\"#{pane_dead_status}\").de