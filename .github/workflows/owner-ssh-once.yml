name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: analyst-timeweb-security-remediation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove the diagnostic log containing provider credential fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,urllib.request
          url="https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/actions/runs/40088233675/logs"
          req=urllib.request.Request(url,method="DELETE",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=30) as response:
              assert response.status==204
          print("EXPOSED_DIAGNOSTIC_LOG_DELETED=true",flush=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Rotate exposed SSH host keys on Timeweb and verify password access is disabled
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE"),(9408159,"analyst-ai-owner-route-20261023","201.34.146.244","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDpyNJRmtgaymzM1TT1t1DudEnPQ6eaoYLw7C5kPaJ9H")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-remediate-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,json,os,pathlib,subprocess,tempfile,shutil\nos.umask(0o077)\nassert os.geteuid()==0\nbefore=subprocess.check_output([\"sshd\",\"-T\"],text=True)\nassert \"passwordauthentication no\" in before and \"pubkeyauthentication yes\" in before\nwith tempfile.TemporaryDirectory(prefix=\"analyst-host-key-rotation-\",dir=\"/root\") as temp:\n    folder=pathlib.Path(temp)\n    for algorithm in (\"ed25519\",\"rsa\",\"ecdsa\"):\n        key=folder/(\"ssh_host_\"+algorithm+\"_key\")\n        args=[\"ssh-keygen\",\"-q\",\"-t\",algorithm,\"-N\",\"\",\"-f\",str(key)]\n        if algorithm==\"rsa\":args.extend([\"-b\",\"3072\"])\n        if algorithm==\"ecdsa\":args.extend([\"-b\",\"256\"])\n        subprocess.run(args,check=True,capture_output=True)\n    for source in folder.iterdir():\n        destination=pathlib.Path(\"/etc/ssh\")/source.name\n        assert not destination.is_symlink()\n        os.replace(source,destination)\n        destination.chmod(0o644 if destination.suffix==\".pub\" else 0o600)\nsubprocess.run([\"usermod\",\"--lock\",\"root\"],check=True,capture_output=True)\nsubprocess.run([\"sshd\",\"-t\"],check=True,capture_output=True)\nsubprocess.run([\"systemctl\",\"reload\",\"ssh\"],check=True,capture_output=True)\nsettings={line.split()[0]:\" \".join(line.split()[1:]) for line in subprocess.check_output([\"sshd\",\"-T\"],text=True).splitlines() if line.split()[0] in {\"passwordauthentication\",\"kbdinteractiveauthentication\",\"pubkeyauthentication\",\"permitrootlogin\"}}\nroot_status=subprocess.check_output([\"passwd\",\"-S\",\"root\"],text=True).split()[1]\npublic=\" \".join(pathlib.Path(\"/etc/ssh/ssh_host_ed25519_key.pub\").read_text().split()[:2])\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"host_public_key\":public,\"password_login_disabled\":settings[\"passwordauthentication\"]==\"no\",\"keyboard_login_disabled\":settings[\"kbdinteractiveauthentication\"]==\"no\",\"root_password_locked\":root_status==\"L\",\"settings\":settings,\"app_signing_key_changed\":False}\nassert all(report[k] for k in (\"password_login_disabled\",\"keyboard_login_disabled\",\"root_password_locked\"))\ntarget=pathlib.Path(\"/root/analyst-ssh-incident-remediation.json\")\ntarget.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nprint(\"SSH_REMEDIATION=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=90).decode()
                      result=json.loads(next(line.split("=",1)[1] for line in output.splitlines() if line.startswith("SSH_REMEDIATION=")))
                      assert result["host_public_key"]!=old_host
                      command=p.ssh_command(folder,ip,result["host_public_key"])
                      p.remote(command,"test $(id -u) = 0",timeout=30)
                      print("SSH_REMEDIATION_VERIFIED="+json.dumps({"server_id":server_id,"ip":ip,**result,"new_pin_connection_verified":True}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
