name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-temporary-access
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Prepare a smaller hourly host after measured provider capacity refusals
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,re,shlex,subprocess,sys,tempfile,time,urllib.error,urllib.request,uuid
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          from replace_unreachable_vm import remove_ip
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          name="analyst-ai-build-20261024"
          marker="Analyst AI authorized hourly build host 2026-10-24"
          def inventory():
              doc=p.read_resource(token,"servers")
              assert p.summarize("servers",doc)["complete"]
              return doc["servers"]
          assert {s["id"] for s in inventory()}=={9408159},"unexpected_existing_servers_no_order"
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as r:return p.decode_response(r.read(2*1024*1024+1))
          fin=get("/account/finances")["finances"]
          assert Decimal(str(fin["hourly_fee"]))>0,"hourly_billing_not_verified"
          balance=Decimal(str(fin["balance"]))
          presets={r["id"]:r for r in get("/presets/servers")["server_presets"]}
          configs={r["id"]:r for r in get("/configurator/servers")["server_configurators"]}
          specs=[(31,4096,40960,3400,"ru-3"),(17,6144,51200,1740,"pl-1"),(17,4096,40960,1380,"pl-1")]
          offers=[]
          for identifier,ram,disk,expected,location in specs:
              c=configs[identifier]
              assert c["location"]==location
              sizes={"cpu":2,"ram":ram,"disk":disk}
              for part,size in sizes.items():
                  r=c["requirements"]
                  assert r[part+"_min"]<=size<=r[part+"_max"] and (size-r[part+"_min"])%r[part+"_step"]==0
              price=Decimal(str(c["prices"]["cpu"]))*2+Decimal(str(c["prices"]["ram"]))*ram/1024+Decimal(str(c["prices"]["disk"]))*disk/1024
              assert price==expected
              if balance>=price+200:offers.append({"kind":"configuration","id":identifier,"location":location,"price":expected,**sizes,"request":{"configuration":{"configurator_id":identifier,**sizes}}})
          assert offers,"no_activation_credit_for_smallest_adequate_offer"
          def create(body):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/servers",method="POST",data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              try:
                  with opener.open(req,timeout=30) as r:return p.decode_response(r.read(2*1024*1024+1))
              except urllib.error.HTTPError as e:
                  doc=p.decode_response(e.read(2*1024*1024+1));code=doc.get("error_code")
                  print("HOURLY_BUILD_REFUSED="+json.dumps({"http":e.code,"code":code if isinstance(code,str) and re.fullmatch("[a-z_]{1,64}",code) else "unknown"}),flush=True)
                  if code in {"no_free_node","servers_is_run_out_error","preset_not_found","configurator_not_found","location_not_available"}:
                      assert {s["id"] for s in inventory()}=={9408159},"reconcile_uncertain_creation"
                      return None
                  raise p.ProbeError("build_creation_http_"+str(e.code)) from None
          with tempfile.TemporaryDirectory(prefix="timeweb-hourly-",dir=os.environ["RUNNER_TEMP"]) as temp:
              folder=pathlib.Path(temp)
              for part in ("client","host"):p.cloud.generate_key(folder/part)
              client=(folder/"client.pub").read_text().strip()
              host=(folder/"host.pub").read_text().strip()
              config={"users":[{"name":"root","lock_passwd":True,"ssh_authorized_keys":[client]}],"ssh_pwauth":False,"disable_root":False,"ssh_deletekeys":True,"ssh_keys":{"ed25519_private":(folder/"host").read_text(),"ed25519_public":host},"ssh":{"emit_keys_to_console":False},"no_ssh_fingerprints":True,"runcmd":[["systemctl","restart","ssh"]]}
              server=None
              for offer in offers:
                  print("HOURLY_BUILD_ATTEMPT="+json.dumps({k:v for k,v in offer.items() if k!="request"}),flush=True)
                  doc=create({"name":name,"hostname":name,"comment":marker,"os_id":99,"project_id":p.PROJECT,"cloud_init":"#cloud-config\n"+json.dumps(config)+"\n",**offer["request"]})
                  if doc is not None:
                      server=doc["server"];break
              if server is None:raise p.ProbeError("affordable_russia_and_poland_offers_unavailable")
              sid=server["id"];access.SERVER_ID=sid
              print("HOURLY_BUILD_CREATED="+json.dumps({"id":sid,"offer":{k:v for k,v in offer.items() if k!="request"},"host_key":host,"status":server.get("status"),"zone":server.get("availability_zone")}),flush=True)
              def owned(doc):
                  s=doc["server"]
                  assert s["id"]==sid and s["name"]==name and s["comment"]==marker and s["location"]==offer["location"]
                  assert all(s[k]==offer[k] for k in ("cpu","ram"))
                  if offer["kind"]=="preset":assert s["preset_id"]==offer["id"]
                  else:assert s["configurator_id"]==offer["id"] and s["preset_id"] is None
                  return s
              owned({"server":server})
              command=None;ip_id=None;keep=False
              try:
                  if server.get("status")=="no_paid":raise p.ProbeError("activation_refused_despite_credit_no_ip_created")
                  address=p.cloud.public_ipv4(server)
                  if not address:
                      zone=server["availability_zone"];assert re.fullmatch("[a-z]{2,8}-[1-9][0-9]*",zone)
                      ip=access.request(token,"POST","/floating-ips",{"is_ddos_guard":False,"availability_zone":zone})["ip"]
                      ip_id=str(uuid.UUID(ip["id"]))
                      assert ip["availability_zone"]==zone and ip["is_ddos_guard"] is False and ipaddress.IPv4Address(ip["ip"]).is_global
                      print("HOURLY_BUILD_IP="+json.dumps({"id":ip_id,"ip":ip["ip"]}),flush=True)
                      access.request(token,"POST",f"/floating-ips/{ip_id}/bind",{"resource_type":"server","resource_id":sid})
                  for attempt in range(24):
                      server=owned(p.cloud.request(token,"GET",f"/api/v1/servers/{sid}"))
                      if server["status"]=="no_paid":raise p.ProbeError("activation_became_unpaid")
                      address=p.cloud.public_ipv4(server)
                      if address:
                          command=p.ssh_command(folder,address,host)
                          try:
                              p.remote(command,"cloud-init status --wait >/dev/null && test -d /root",timeout=15)
                              break
                          except (p.ProbeError,subprocess.TimeoutExpired):pass
                      time.sleep(8)
                  else:raise p.ProbeError("hourly_build_ssh_readiness_failed")
                  hardware=json.loads(p.remote(command,"python3 -c "+shlex.quote(p.cloud.REMOTE_PROBE)))
                  assert hardware["memory_kib"]>=(offer["ram"]-512)*1024 and hardware["free_disk_bytes"]>=30*1024**3,"allocated_build_resources_inadequate"
                  p.remote(command,"umask 077; mkdir -p /root/analyst-ai-build")
                  keep=True
                  print("HOURLY_BUILD_READY="+json.dumps({"id":sid,"ip":address,"ip_id":ip_id,"monthly_vm_rub":offer["price"],"hourly_billing":True,"retained_for_build":True,"full_runtime_host":hardware["kvm_api_version"]==12 and hardware["memory_kib"]>=5*1024*1024,**hardware}),flush=True)
              finally:
                  if keep and command:
                      script="import pathlib,sys; p=pathlib.Path('/root/.ssh/authorized_keys'); key=sys.stdin.read().strip(); p.write_text('\\n'.join(line for line in p.read_text().splitlines() if key not in line)+'\\n')"
                      p.remote(command,"python3 -c "+shlex.quote(script),client.encode())
                      print("HOURLY_BUILD_BOOTSTRAP_KEY=removed",flush=True)
                  else:
                      rows=inventory()
                      match=[s for s in rows if s["id"]==sid]
                      if match:
                          owned({"server":match[0]})
                          p.cloud.request(token,"DELETE",f"/api/v1/servers/{sid}")
                      for attempt in range(24):
                          if not any(s["id"]==sid for s in inventory()):break
                          time.sleep(5)
                      else:raise p.ProbeError("hourly_build_cleanup_unconfirmed")
                      if ip_id:remove_ip(token,ip_id,sid)
                      print("HOURLY_BUILD_CLEANUP=server_and_address_absent",flush=True)
          PY
