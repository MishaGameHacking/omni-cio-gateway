name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Recheck the Timeweb VM after owner approval to contact support
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,re,shlex,socket,subprocess,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as prepare
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=prepare.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(prepare.NoRedirect(),urllib.request.HTTPSHandler(context=prepare.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return prepare.decode_response(response.read(2*1024*1024+1))
          server=get("/servers/9408159")["server"]
          assert server["id"]==9408159 and server["name"]=="analyst-ai-owner-route-20261023" and server["configurator_id"]==153
          print("TIMEWEB_RESIZE_PROVIDER_STATE="+json.dumps({k:server.get(k) for k in ("id","status","cpu","ram","configurator_id","start_at","availability_zone")}),flush=True)
          document=get("/servers/9408159/logs?limit=100")
          records=document.get("server_logs",[])
          output=[]
          for row in records:
              event=str(row.get("event",""))
              if re.search("config|reboot|migrat|memory|конфигурац|перезагруз|перенос|памят",event,re.I) and not re.search("парол|password|token|токен|secret|ключ",event,re.I):
                  output.append({"logged_at":row.get("logged_at"),"event":event[:700]})
          print("TIMEWEB_RESIZE_PROVIDER_EVENTS="+json.dumps({"meta":document.get("meta"),"response_id":document.get("response_id"),"events":output[-20:]},ensure_ascii=False),flush=True)
          probe={"tcp_connected":False,"ssh_banner_ready":False}
          try:
              with socket.create_connection(("201.34.146.244",22),timeout=10) as connection:
                  probe["tcp_connected"]=True
                  connection.settimeout(10)
                  probe["ssh_banner_ready"]=connection.recv(256).startswith(b"SSH-2.0-")
          except OSError as error:
              probe["error"]=type(error).__name__
          print("TIMEWEB_POST_RESIZE_TCP="+json.dumps(probe),flush=True)
          fin=get("/account/finances")["finances"]
          status=get("/account/status")["status"]
          inventory=get("/servers?limit=100")
          print("TIMEWEB_CURRENT_HOURLY_ACCOUNT="+json.dumps({"hourly_billing":Decimal(str(fin["hourly_fee"]))>0,"balance_positive":Decimal(str(fin["balance"]))>0,"blocked":status["is_blocked"],"servers":[{k:s.get(k) for k in ("id","name","status","cpu","ram","availability_zone")} for s in inventory["servers"]],"meta":inventory.get("meta")}),flush=True)
          PY
