name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-owner-update-011-handoff
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Use the documented Maven Central mirror and require successful origin tests
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      reference="fd01d2ac090103cf64557c97aeaf36bc290e2cec"
                      paths=subprocess.check_output(["git","ls-tree","-r","--name-only",reference],text=True).splitlines()
                      selected=[path for path in paths if (path.startswith("backend/") and pathlib.PurePosixPath(path).parent==pathlib.PurePosixPath("backend") and (path.endswith((".py",".json")) or path=="backend/requirements.txt")) or path in {"backend/certs/russian_trusted_root_ca.pem","deploy/install_owner_backend.py","deploy/enroll_owner.py","deploy/analyst-ai-owner.service"}]
                      expected={path:hashlib.sha256(subprocess.check_output(["git","show",reference+":"+path])).hexdigest() for path in selected}
                      assert len(expected)>30
                      script="TEST_CONTENT=\"package ru.omnicio.app.data.backend\\n\\nimport java.net.URI\\nimport org.junit.Assert.assertEquals\\nimport org.junit.Assert.assertFalse\\nimport org.junit.Assert.assertThrows\\nimport org.junit.Assert.assertTrue\\nimport org.junit.Test\\nimport ru.omnicio.app.data.updates.UpdateProtocol\\n\\nclass BackendConfigTest {\\n    @Test\\n    fun verifiedOwnerInstallationUsesTheExactHttpsOrigin() {\\n        assertTrue(BackendConfig.isConfigured)\\n        assertEquals(\\\"https://analyst-ai-2941515.twc1.net\\\", BackendConfig.BASE_URL)\\n        val destination = URI(BackendConfig.BASE_URL + \\\"/me\\\")\\n        val connection = BackendConfig.openConnection(destination)\\n        assertEquals(destination, connection.url.toURI())\\n        assertFalse(connection.instanceFollowRedirects)\\n        connection.disconnect()\\n    }\\n\\n    @Test\\n    fun retiredAndForeignAddressesCannotBecomeFallbacks() {\\n        val destinations = listOf(\\n            URI(\\\"https://176.98.178.81.sslip.io/me\\\"),\\n            URI(\\\"https://backend-not-configured.invalid/me\\\"),\\n            URI(\\\"https://other.invalid/me\\\"),\\n            URI(\\\"http://\\\" + BackendConfig.HOST + \\\"/me\\\"),\\n            URI(\\\"https://user@\\\" + BackendConfig.HOST + \\\"/me\\\"),\\n            URI(\\\"https://\\\" + BackendConfig.HOST + \\\":443/me\\\"),\\n            URI(\\\"https://\\\" + BackendConfig.HOST + \\\"/me#fragment\\\"),\\n            URI(\\\"https://\\\" + BackendConfig.HOST + \\\".other.invalid/me\\\"),\\n        )\\n        for (destination in destinations) {\\n            assertThrows(IllegalArgumentException::class.java) { BackendConfig.openConnection(destination) }\\n        }\\n    }\\n\\n    @Test\\n    fun updatePolicyUsesTheSameOriginAndRejectsTheRetiredChannel() {\\n        assertEquals(BackendConfig.HOST, UpdateProtocol.HOST)\\n        val path = UpdateProtocol.policyPath(UpdateProtocol.PREVIEW_PACKAGE)\\n        assertEquals(\\n            URI(BackendConfig.BASE_URL + path),\\n            UpdateProtocol.requestUri(BackendConfig.BASE_URL, path),\\n        )\\n        assertThrows(IllegalArgumentException::class.java) {\\n            UpdateProtocol.requestUri(\\\"https://176.98.178.81.sslip.io\\\", path)\\n        }\\n    }\\n}\\n\"\nimport datetime,hashlib,json,os,pathlib,re,shutil,stat,subprocess,sys,urllib.request,zipfile\nroot=pathlib.Path(\"/root\");source=root/\"analyst-ai-source\";android=root/\"analyst-ai-android-690811a5\";work=root/\"analyst-live-origin-20261024\"\nsys.path.insert(0,str(source))\nfrom deploy import install_owner_backend as installer\nvalues=installer.load_config()\nassert values[\"BACKEND_PUBLIC_URL\"]==\"https://analyst-ai-2941515.twc1.net\"\nassert installer.probe() and installer.probe(\"analyst-ai-2941515.twc1.net\"),\"live_owner_backend_required\"\nassert work.is_dir() and not work.is_symlink()\nreport=json.loads((work/\"verification.json\").read_text())\nassert report[\"phase\"]==\"failed\" and report[\"app_source_changed\"] is False\nreport[\"resumed_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\nreport[\"phase\"]=\"resuming_dependency_download\"\nold_error=(work/\"failure-private.log\").read_text().splitlines()[-1]\nreport[\"previous_download_error\"]=old_error[:240] if old_error.startswith(\"urllib.error.URLError:\") else \"previous_failure_recorded_privately\"\nreport.pop(\"error_type\",None);report.pop(\"failure_line_numbers\",None)\ndef save():\n    path=work/\"verification.json\";path.write_text(json.dumps(report,indent=2)+\"\\n\");path.chmod(0o600)\ndef read(url,limit=2*1024*1024):\n    req=urllib.request.Request(url,headers={\"User-Agent\":\"Analyst-AI-Timeweb-build\",\"Accept\":\"application/json\"})\n    with urllib.request.urlopen(req,timeout=20) as response:data=response.read(limit+1)\n    assert len(data)<=limit,\"download_metadata_too_large\"\n    return data\ndef download(url,path,maximum,sha256=None,sha1=None):\n    req=urllib.request.Request(url,headers={\"User-Agent\":\"Analyst-AI-Timeweb-build\"})\n    h256=hashlib.sha256();h1=hashlib.sha1();size=0\n    with urllib.request.urlopen(req,timeout=45) as response,path.open(\"xb\") as out:\n        path.chmod(0o600)\n        while chunk:=response.read(1024*1024):\n            size+=len(chunk);assert size<=maximum,\"download_size_limit\"\n            h256.update(chunk);h1.update(chunk);out.write(chunk)\n    if sha256:assert h256.hexdigest()==sha256,\"download_sha256_mismatch\"\n    if sha1:assert h1.hexdigest()==sha1,\"download_sha1_mismatch\"\n    return {\"bytes\":size,\"sha256\":h256.hexdigest()}\ntry:\n    save()\n    assert subprocess.check_output([\"git\",\"-C\",str(android),\"rev-parse\",\"HEAD\"],text=True).strip()==\"690811a5a376181990a64f37d914c87eb6c919b7\"\n    changed=set(subprocess.check_output([\"git\",\"-C\",str(android),\"diff\",\"--name-only\"],text=True).splitlines())\n    assert changed=={\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\"},\"unexpected_android_worktree_changes\"\n    assert 'kotlin = \"2.4.10\"' in (android/\"gradle/libs.versions.toml\").read_text()\n    archive=work/\"kotlin-compiler-2.4.10.zip\"\n    assert hashlib.file_digest(archive.open(\"rb\"),\"sha256\").hexdigest()==\"473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d\",\"preserved_compiler_digest_changed\"\n    compiler=work/\"kotlinc/bin/kotlinc\"\n    assert compiler.is_file() and not compiler.is_symlink()\n    report[\"dependency_source\"]=\"Google Cloud hosted Maven Central mirror\"\n    report[\"dependencies\"]={}\n    for group,name,version in ((\"junit\",\"junit\",\"4.13.2\"),(\"org.hamcrest\",\"hamcrest-core\",\"1.3\")):\n        base=\"https://maven-central.storage-download.googleapis.com/maven2/\"+group.replace(\".\",\"/\")+\"/\"+name+\"/\"+version+\"/\"+name+\"-\"+version+\".jar\"\n        expected=read(base+\".sha1\",2048).decode().split()[0].lower();assert re.fullmatch(\"[0-9a-f]{40}\",expected)\n        path=work/(name+\"-\"+version+\".jar\")\n        report[\"dependencies\"][name]=download(base,path,2*1024*1024,sha1=expected)\n    classpath=str(work/\"junit-4.13.2.jar\")+\":\"+str(work/\"hamcrest-core-1.3.jar\")\n    config=android/\"app/src/main/java/ru/omnicio/app/data/backend/BackendConfig.kt\"\n    tests=android/\"app/src/test/java/ru/omnicio/app/data/backend/BackendConfigTest.kt\"\n    original=config.read_text();original_tests=tests.read_text()\n    assert 'const val HOST = \"backend-not-configured.invalid\"' in original\n    (work/\"BackendConfig.before.kt\").write_text(original)\n    (work/\"BackendConfigTest.before.kt\").write_text(original_tests)\n    (work/\"BackendConfigTest.pending.kt\").write_text(TEST_CONTENT)\n    tests.write_text(TEST_CONTENT)\n    report[\"app_source_changed\"]=True\n    sources=[config,android/\"app/src/main/java/ru/omnicio/app/data/updates/UpdateProtocol.kt\",android/\"app/src/main/java/ru/omnicio/app/data/updates/ReleaseDescriptor.kt\",tests]\n    def compile_and_test(label):\n        classes=work/(\"classes-\"+label);classes.mkdir()\n        log=work/(\"compile-\"+label+\".log\")\n        command=[\"systemd-run\",\"--quiet\",\"--pipe\",\"--wait\",\"--collect\",\"--unit=analyst-origin-compile-\"+label,\"-p\",\"MemoryMax=469762048\",\"-p\",\"CPUWeight=20\",\"-p\",\"RuntimeMaxSec=150\",\"--\",str(compiler),\"-J-Xmx256m\",\"-J-XX:MaxMetaspaceSize=128m\",\"-jvm-target\",\"17\",\"-classpath\",classpath,\"-d\",str(classes),*[str(p) for p in sources]]\n        with log.open(\"w\") as output:\n            log.chmod(0o600)\n            result=subprocess.run(command,stdout=output,stderr=subprocess.STDOUT,timeout=180,env=dict(os.environ,JAVA_HOME=\"/usr/lib/jvm/java-17-openjdk-amd64\"))\n        if result.returncode:return {\"compile_exit\":result.returncode,\"test_exit\":None,\"tests\":None}\n        runtime=str(classes)+\":\"+classpath+\":\"+str(work/\"kotlinc/lib/kotlin-stdlib.jar\")\n        log=work/(\"tests-\"+label+\".log\")\n        with log.open(\"w\") as output:\n            log.chmod(0o600)\n            result=subprocess.run([\"java\",\"-Xmx128m\",\"-cp\",runtime,\"org.junit.runner.JUnitCore\",\"ru.omnicio.app.data.backend.BackendConfigTest\"],stdout=output,stderr=subprocess.STDOUT,timeout=60)\n        text=log.read_text()\n        return {\"compile_exit\":0,\"test_exit\":result.returncode,\"passed\":re.findall(r\"OK \\((\\d+) tests?\\)\",text),\"failure_summary\":re.findall(r\"Tests run: \\d+,  Failures: \\d+\",text)}\n    report[\"before_configuration\"]=compile_and_test(\"before\")\n    assert report[\"before_configuration\"][\"compile_exit\"]==0 and report[\"before_configuration\"][\"test_exit\"]==1,\"expected_configuration_failure_not_observed\"\n    config.write_text(original.replace('    // Set the shared host only after fresh Timeweb/TLS/Telegram verification.\\n    // The old VM was deleted; its address is never a safe fallback.\\n','    // Verified owner installation on Timeweb; every client shares this HTTPS origin.\\n').replace('const val HOST = \"backend-not-configured.invalid\"','const val HOST = \"analyst-ai-2941515.twc1.net\"'))\n    report[\"after_configuration\"]=compile_and_test(\"after\")\n    assert report[\"after_configuration\"][\"compile_exit\"]==0 and report[\"after_configuration\"][\"test_exit\"]==0,\"origin_tests_failed\"\n    subprocess.run([\"git\",\"diff\",\"--check\"],cwd=android,capture_output=True,check=True)\n    report[\"changed_paths\"]=subprocess.check_output([\"git\",\"-C\",str(android),\"diff\",\"--name-only\"],text=True).splitlines()\n    report[\"source_sha256\"]={str(p.relative_to(android)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (config,tests)}\n    report[\"local_backend_healthy_after_tests\"]=installer.probe()\n    report[\"tls_backend_healthy_after_tests\"]=installer.probe(\"analyst-ai-2941515.twc1.net\")\n    report[\"phase\"]=\"origin_configured_targeted_jvm_tests_passed\"\nexcept Exception as error:\n    import traceback\n    path=work/\"failure-private.log\";path.write_text(traceback.format_exc());path.chmod(0o600)\n    report[\"phase\"]=\"failed\";report[\"error_type\"]=type(error).__name__\n    if isinstance(error,urllib.error.HTTPError):report[\"http_status\"]=error.code\n    report[\"failure_line_numbers\"]=[f.lineno for f in traceback.extract_tb(error.__traceback__)]\nfinally:\n    save()\nprint(\"TIMEWEB_LIVE_ORIGIN_CONFIGURATION=\"+json.dumps(report),flush=True)\n"
                      script='EXPECTED='+repr(expected)+'\n'+script
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=1500).decode()
                      print(output,end="",flush=True)
                      records=[json.loads(line.split("=",1)[1]) for line in output.splitlines() if line.startswith("TIMEWEB_LIVE_ORIGIN_CONFIGURATION=")]
                      assert len(records)==1 and records[0]["phase"]=="origin_configured_targeted_jvm_tests_passed","timeweb_origin_configuration_gate_failed"
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
