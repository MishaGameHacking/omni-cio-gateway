name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("\nimport pathlib,os,pwd,json,subprocess,tempfile,hashlib,shutil,http.client,re,time,base64\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\naccount=pwd.getpwnam(\"analyst-build\")\nprefix=pathlib.Path(\"/opt/analyst-ai-updates\")\nrelease_root=pathlib.Path(\"/srv/analyst-ai-ota/releases\")\nassert not prefix.exists() and not prefix.is_symlink(),\"update_service_already_prepared\"\nassert not pathlib.Path(\"/etc/systemd/system/analyst-ai-updates.service\").exists()\npublic=\"\\\"\\\"\\\"Public APK delivery while the private backend is unavailable.\\n\\nUses the existing release-channel contract and byte verification. This app\\ndoes not create a database, accept a session, publish or certify a release.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\n\\nfrom typing import NoReturn\\n\\nfrom fastapi import FastAPI, HTTPException\\n\\nif __package__:\\n    from .client_updates import install_routes\\nelse:\\n    from client_updates import install_routes\\n\\n\\ndef _private_database_unavailable() -> NoReturn:\\n    \\\"\\\"\\\"Public update requests must never open a private database.\\\"\\\"\\\"\\n    raise RuntimeError(\\\"private_database_unavailable\\\")\\n\\n\\ndef _reject_unrestored_session() -> NoReturn:\\n    \\\"\\\"\\\"No supplied token authorizes a private session in this service.\\\"\\\"\\\"\\n    raise HTTPException(\\n        status_code=401,\\n        detail=\\\"authentication_required\\\",\\n        headers={\\\"Cache-Control\\\": \\\"no-store\\\", \\\"WWW-Authenticate\\\": \\\"Bearer\\\"},\\n    )\\n\\n\\ndef create_app() -> FastAPI:\\n    app = FastAPI(\\n        title=\\\"Analyst AI public updates\\\",\\n        docs_url=None,\\n        redoc_url=None,\\n        openapi_url=None,\\n        redirect_slashes=False,\\n    )\\n    install_routes(app, _private_database_unavailable, _reject_unrestored_session)\\n    return app\\n\"\nassert (root/\"backend/public_updates_app.py\").read_text()==public\nexpected={\n\"backend/client_updates.py\":\"79c1f8670cc61f94f917c9ad4b6e394f1430a08b61b8ef87216624fec12b9184\",\n\"backend/client_compatibility.py\":\"cf585f4a740198325e47166b318f12c41017491e34edb27c5511c53790a7d8e9\",\n\"backend/release_json.py\":\"04a760b02105322f41d400cbdd6d44a4519c4e8dcd03ffd53fcd6da5fadf6b97\"}\ncontent={}\nfor relative,digest in expected.items():\n    path=root/relative;assert path.is_file() and not path.is_symlink()\n    raw=path.read_bytes();assert hashlib.sha256(raw).hexdigest()==digest\n    content[relative]=raw\ncontent[\"backend/public_updates_app.py\"]=public.encode()\nprefix.mkdir(mode=0o755)\nfor relative,raw in content.items():\n    target=prefix/relative;target.parent.mkdir(exist_ok=True)\n    target.write_bytes(raw);target.chmod(0o644)\nrelease_root.mkdir(parents=True,mode=0o755,exist_ok=False)\nfor path in (release_root.parent,release_root):assert not path.is_symlink();path.chmod(0o755)\nlog=state/\"diagnostics/public-updates-dependencies.log\"\nwith log.open(\"w\") as output:\n    subprocess.run([\"python3\",\"-m\",\"venv\",str(prefix/\"venv\")],stdout=output,stderr=subprocess.STDOUT,check=True,timeout=90)\n    subprocess.run([str(prefix/\"venv/bin/python\"),\"-m\",\"pip\",\"install\",\"--disable-pip-version-check\",\"--no-cache-dir\",\"fastapi==0.120.0\",\"uvicorn==0.38.0\"],stdout=output,stderr=subprocess.STDOUT,check=True,timeout=180)\n    subprocess.run([str(prefix/\"venv/bin/python\"),\"-m\",\"pip\",\"check\"],stdout=output,stderr=subprocess.STDOUT,check=True,timeout=30)\nunit=\"[Unit]\\nDescription=Analyst AI public APK update channel\\nAfter=network.target\\n\\n[Service]\\nType=exec\\nDynamicUser=yes\\nUser=analyst-updates\\nWorkingDirectory=/opt/analyst-ai-updates\\nEnvironment=ANDROID_RELEASE_DIR=/srv/analyst-ai-ota/releases\\nEnvironment=ANDROID_UPDATES_ENABLED=false\\nEnvironment=PYTHONDONTWRITEBYTECODE=1\\nExecStart=/opt/analyst-ai-updates/venv/bin/python -B -m uvicorn backend.public_updates_app:create_app --factory --host 127.0.0.1 --port 8081 --workers 1 --no-access-log\\nRestart=on-failure\\nRestartSec=3\\nNoNewPrivileges=yes\\nProtectSystem=strict\\nProtectHome=yes\\nPrivateTmp=yes\\nPrivateDevices=yes\\nProtectKernelTunables=yes\\nProtectKernelModules=yes\\nProtectControlGroups=yes\\nRestrictSUIDSGID=yes\\nRestrictAddressFamilies=AF_UNIX AF_INET AF_INET6\\nCapabilityBoundingSet=\\nUMask=0077\\nMemoryHigh=201326592\\nMemoryMax=268435456\\nCPUWeight=30\\nTasksMax=64\\n\\n[Install]\\nWantedBy=multi-user.target\\n\"\nsource_unit=root/\"deploy/public_updates.service\"\nassert not source_unit.exists()\nsource_unit.write_text(unit);source_unit.chmod(0o644);os.chown(source_unit,account.pw_uid,account.pw_gid)\ninstalled_unit=pathlib.Path(\"/etc/systemd/system/analyst-ai-updates.service\")\ninstalled_unit.write_text(unit);installed_unit.chmod(0o644)\nsubprocess.run([\"systemctl\",\"daemon-reload\"],check=True,timeout=20)\nsubprocess.run([\"systemctl\",\"enable\",\"--now\",\"analyst-ai-updates.service\"],check=True,capture_output=True,timeout=30)\ndef request(method,path):\n    conn=http.client.HTTPConnection(\"127.0.0.1\",8081,timeout=5)\n    try:\n        conn.request(method,path);response=conn.getresponse()\n        return response.status,response.read(4097),dict(response.getheaders())\n    finally:conn.close()\ndeadline=time.monotonic()+20\nwhile True:\n    try:\n        status,body,headers=request(\"POST\",\"/client/ready\")\n        assert status==401 and json.loads(body)=={\"detail\":\"authentication_required\"}\n        break\n    except (ConnectionError,OSError):\n        if time.monotonic()>deadline:raise\n        time.sleep(0.25)\nassert request(\"GET\",\"/client/update-policy\")[0]==503\nassert request(\"GET\",\"/client/apk/not-an-apk\")[0]==404\nassert request(\"GET\",\"/health\")[0]==404\ncaddy=pathlib.Path(\"/etc/caddy/Caddyfile\")\nold=caddy.read_text()\nassert hashlib.sha256(old.encode()).hexdigest()==\"48a1aa9673d3e7899b15267e468f7967364deaf222d094912be4578c3502ab5c\",\"caddy_configuration_changed\"\nmatches=list(re.finditer(r'\\brespond(?:\\s+\"[^\"\\r\\n]*\")?\\s+503\\b',old))\nassert len(matches)==1,\"maintenance_directive_not_unique\"\nmatch=matches[0]\nroutes='@public_updates {\\n        path /client/update-policy /client/apk/* /client/ready\\n    }\\n    handle @public_updates {\\n        reverse_proxy 127.0.0.1:8081\\n    }\\n    handle {\\n        '+match.group(0)+'\\n    }'\nnew=old[:match.start()]+routes+old[match.end():]\nprepared=pathlib.Path(\"/etc/caddy/Caddyfile.ota-prepared\")\nassert not prepared.exists()\nprepared.write_text(new);prepared.chmod(0o644)\nchecked=subprocess.run([\"caddy\",\"validate\",\"--adapter\",\"caddyfile\",\"--config\",str(prepared)],capture_output=True,text=True,timeout=30)\nif checked.returncode:print(\"OTA_CADDY_VALIDATION_ERROR=\"+checked.stderr[-2000:],flush=True);checked.check_returncode()\nassert caddy.read_text()==old\nprint(\"OTA_SERVICE_PREPARED=\"+json.dumps({\"service\":\"analyst-ai-updates.service\",\"listen\":\"127.0.0.1:8081\",\"ready_status\":401,\"empty_channel_status\":503,\"database_created\":False,\"tls_configuration_changed\":False,\"caddy_prepared_sha256\":hashlib.sha256(new.encode()).hexdigest()}),flush=True)\nreceipt={\"prepared_at\":time.time(),\"source_sha256\":{n:hashlib.sha256(b).hexdigest() for n,b in content.items()},\"caddy_original_sha256\":hashlib.sha256(old.encode()).hexdigest(),\"caddy_prepared_sha256\":hashlib.sha256(new.encode()).hexdigest()}\n(state/\"ota-service-prepared.json\").write_text(json.dumps(receipt,indent=2)+\"\\n\")\npaths=[\n\"app/build.gradle.kts\",\n\"app/src/main/java/ru/omnicio/app/ui/updates/MandatoryUpdateHost.kt\",\n\"app/src/main/java/ru/omnicio/app/ui/updates/UpdateAttemptGate.kt\",\n\"app/src/test/java/ru/omnicio/app/ui/updates/UpdateAttemptGateTest.kt\",\n\"app/src/main/java/ru/omnicio/app/data/updates/UpdateInstaller.kt\",\n\"app/src/main/java/ru/omnicio/app/ui/spectrum/RequiredUpdateScreen.kt\",\n\"backend/public_updates_app.py\",\"backend/tests/test_public_updates_app.py\",\"deploy/public_updates.service\"]\npayload=[{\"path\":p,\"content_base64\":base64.b64encode((root/p).read_bytes()).decode(),\"sha256\":hashlib.sha256((root/p).read_bytes()).hexdigest()} for p in paths]\nprint(\"OTA_PUBLIC_SOURCE_BACKUP=\"+json.dumps(payload,separators=(\",\",\":\")),flush=True)\ndiag=pathlib.Path(\"/var/lib/analyst-ai-build/diagnostics/boot-20261025T050110Z-16490\")\nif (diag/\"result.json\").exists():print(\"OTA_BOOT_REPORT=\"+(diag/\"result.json\").read_text(),flush=True)\nif (diag/\"samples.jsonl\").exists():\n    sample=json.loads((diag/\"samples.jsonl\").read_text().splitlines()[-1])\n    print(\"OTA_BOOT_PROGRESS=\"+json.dumps({\"elapsed_seconds\":sample[\"elapsed_seconds\"],\"processes\":sample[\"processes\"][\"stdout\"],\"system_log_excerpt\":sample[\"logcat\"][\"stdout\"][-6500:],\"events\":sample[\"events\"][\"stdout\"][-2000:]}),flush=True)\ncg=pathlib.Path(\"/sys/fs/cgroup/system.slice/analyst-boot-diagnostic-20261025t0501.service\")\nif cg.exists():print(\"OTA_BOOT_CGROUP=\"+json.dumps({n:(cg/n).read_text() for n in (\"memory.events\",\"cpu.stat\",\"memory.current\")}),flush=True)\n",timeout=420)
          PY
