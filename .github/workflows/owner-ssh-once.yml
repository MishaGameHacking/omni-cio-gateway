name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-temporary-access
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect smaller hourly build configurations after provider capacity refusals
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,shlex,subprocess,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as prepare
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=prepare.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(prepare.NoRedirect(),urllib.request.HTTPSHandler(context=prepare.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return prepare.decode_response(response.read(2*1024*1024+1))
          fin=get("/account/finances")["finances"]
          status=get("/account/status")["status"]
          balance=Decimal(str(fin["balance"]))
          inventory=prepare.read_resource(token,"servers")
          assert prepare.summarize("servers",inventory)["complete"]
          print("TIMEWEB_HOURLY_ACCOUNT="+json.dumps({"hourly_billing":Decimal(str(fin["hourly_fee"]))>0,"balance_positive":balance>0,"blocked":status["is_blocked"],"servers":[{k:s.get(k) for k in ("id","name","status","cpu","ram","availability_zone")} for s in inventory["servers"]]}),flush=True)
          configs=get("/configurator/servers")["server_configurators"]
          offers=[]
          for c in configs:
              if c["location"] not in {"ru-1","ru-2","ru-3","ru-4","ru-5","pl-1","nl-1"}:continue
              if c["id"] not in {43,11,19,31,149,151,17,153}:continue
              for ram,disk,role in ((6144,51200,"build_and_runtime_trial"),(4096,40960,"build")):
                  sizes={"cpu":2,"ram":ram,"disk":disk}
                  r=c["requirements"]
                  if not all(r[k+"_min"]<=v<=r[k+"_max"] and (v-r[k+"_min"])%r[k+"_step"]==0 for k,v in sizes.items()):continue
                  price=Decimal(str(c["prices"]["cpu"]))*2+Decimal(str(c["prices"]["ram"]))*ram/1024+Decimal(str(c["prices"]["disk"]))*disk/1024
                  offers.append({"id":c["id"],"location":c["location"],**sizes,"role":role,"price":float(price),"activation_credit_covered":balance>=price+200})
          print("TIMEWEB_SMALL_BUILD_CANDIDATES="+json.dumps(offers),flush=True)
          def hourly_command(command):
              script="import hashlib,json,pathlib,subprocess\nroot=pathlib.Path(\"/root/analyst-ai-development-79be1821\")\nassert root.is_dir() and not root.is_symlink()\npolicy=\"\"\"## OWNER 24.10.2026 — почасовая оплата Timeweb\n\nOWNER требует почасовую оплату и продолжение текущей работы.\nИспользовать почасовую тарификацию облачных ресурсов. Не оформлять месячный\nили годовой пакет оплаты и не подключать автопополнение ради этой задачи.\nПроверять реальную доступность и достаточность более дешёвых конфигураций.\nНенужные временные серверы и их платные адреса удалять после проверки.\nРазрешённый канал команд GitHub Actions и разработка только на Timeweb,\nвертикальный дизайн и все обязательные проверки остаются в силе.\n\n\"\"\"\nfor name in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    p=root/name\n    value=p.read_text()\n    if policy not in value:\n        first,sep,tail=value.partition(\"\\n\")\n        p.write_text(first+\"\\n\\n\"+policy+tail.lstrip(\"\\n\"))\nprint(json.dumps({\"server_id\":9408159,\"hourly_preference_saved\":True,\"source_head\":subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root,text=True).strip(),\"modified\":subprocess.check_output([\"git\",\"status\",\"--short\"],cwd=root,text=True).strip()},ensure_ascii=False),flush=True)\n"
              result=subprocess.run(command+["python3 -c "+shlex.quote(script)],capture_output=True,text=True,timeout=180)
              for line in result.stdout.splitlines():
                  if line.startswith("{"):print("OWNER_TIMEWEB_HOURLY="+json.dumps(json.loads(line),ensure_ascii=False),flush=True)
              if result.returncode:
                  print("OWNER_REMOTE_DIAGNOSTIC="+result.stderr[-3000:],flush=True)
                  raise prepare.ProbeError("hourly_preference_checkpoint_failed")
          access.develop_backend=hourly_command
          adopt.run(development=True)
          PY
