name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import fcntl,glob,json,os,platform,shutil,stat,subprocess,time\nfrom pathlib import Path\ndef run(args,timeout=12):\n try:\n  result=subprocess.run(args,capture_output=True,text=True,timeout=timeout,check=False)\n  return {\"code\":result.returncode,\"stdout\":result.stdout[:14000],\"stderr\":result.stderr[:800]}\n except Exception as error:return {\"error_type\":type(error).__name__}\ncpu=Path(\"/proc/cpuinfo\").read_text()\nflags=next((line.split(\":\",1)[1].split() for line in cpu.splitlines() if line.startswith(\"flags\")),[])\nmem={}\nfor line in Path(\"/proc/meminfo\").read_text().splitlines():\n key,value=line.split(\":\",1)\n if key in (\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"):mem[key]=value.strip()\nkvm={\"exists\":Path(\"/dev/kvm\").exists(),\"vmx\":\"vmx\" in flags,\"svm\":\"svm\" in flags}\nif kvm[\"exists\"]:\n try:\n  fd=os.open(\"/dev/kvm\",os.O_RDWR|os.O_CLOEXEC)\n  try:\n   kvm[\"api\"]=fcntl.ioctl(fd,0xAE00,0);vm=fcntl.ioctl(fd,0xAE01,0)\n   try:kvm[\"create_vm_succeeded\"]=True\n   finally:os.close(vm)\n  finally:os.close(fd)\n except OSError as error:kvm.update(error_type=type(error).__name__,errno=error.errno)\ndisk=shutil.disk_usage(\"/\")\nprint(\"RUNTIME_HOST=\"+json.dumps({\"kernel\":platform.release(),\"machine\":platform.machine(),\"cpu_count\":os.cpu_count(),\"virtualization\":kvm,\"memory\":mem,\"disk\":{\"total\":disk.total,\"used\":disk.used,\"free\":disk.free},\"load\":os.getloadavg()}),flush=True)\nresult=run([\"ps\",\"-eo\",\"pid,ppid,user,etimes,pcpu,rss,comm\"])\nrows=[line for line in result.get(\"stdout\",\"\").splitlines() if any(term in line.split()[-1:] for term in ()) ]\nrows=[]\nfor line in result.get(\"stdout\",\"\").splitlines():\n fields=line.split()\n if len(fields)>=7 and any(term in fields[-1] for term in (\"emulator\",\"qemu\",\"adb\",\"java\",\"Xvfb\")):rows.append(line.strip())\nprint(\"RUNTIME_PROCESSES=\"+json.dumps(rows),flush=True)\nunits=run([\"systemctl\",\"list-units\",\"--all\",\"--type=service\",\"--output=json\"])\nif units.get(\"code\")==0:\n values=json.loads(units[\"stdout\"])\n print(\"RUNTIME_SERVICES=\"+json.dumps([{key:item.get(key) for key in (\"unit\",\"active\",\"sub\")} for item in values if any(term in item.get(\"unit\",\"\") for term in (\"analyst\",\"emulator\",\"android\"))]),flush=True)\nfor name in (\"analyst-ai-owner.service\",\"analyst-ai-updates.service\"):\n value=run([\"systemctl\",\"show\",name,\"--property=ActiveState,MainPID,User,Group,DynamicUser,SupplementaryGroups,MemoryCurrent,MemoryMax\"])\n print(\"RUNTIME_PUBLIC_SERVICE=\"+json.dumps({\"unit\":name,\"properties\":value}),flush=True)\nworkspace=Path(\"/srv/analyst-ai/workspace\")\nfor dirname in (\"deploy\",\"tools\"):\n base=workspace/dirname\n if base.is_dir():\n  listing=run([\"rg\",\"--files\",str(base)])\n  print(\"RUNTIME_TOOL_PATHS=\"+json.dumps([line for line in listing.get(\"stdout\",\"\").splitlines() if any(term in line.lower() for term in (\"runtime\",\"emulator\",\"timeweb\",\"evidence\",\"snapshot\",\"publish\",\"workspace\"))]),flush=True)\nfor base in (Path(\"/var/lib/analyst-ai-build\"),Path(\"/opt\"),Path(\"/srv/analyst-ai\")):\n print(\"RUNTIME_DIRECTORY=\"+json.dumps({\"path\":str(base),\"entries\":sorted(p.name for p in base.iterdir()) if base.is_dir() else []}),flush=True)\nruns=Path(\"/var/lib/analyst-ai-build/runs\")\nif runs.is_dir():\n entries=sorted(runs.iterdir(),key=lambda p:p.stat().st_mtime,reverse=True)[:14]\n print(\"RUNTIME_RECENT_RUNS=\"+json.dumps([{\"name\":p.name,\"modified\":int(p.stat().st_mtime),\"files\":sorted(c.name for c in p.iterdir())[:24] if p.is_dir() else []} for p in entries]),flush=True)\nfor root in (Path(\"/opt/android-sdk\"),Path(\"/opt/android\"),Path(\"/srv/analyst-ai/android-sdk\"),Path(\"/var/lib/analyst-ai-build/android-sdk\")):\n emulator=root/\"emulator/emulator\"\n if emulator.is_file():\n  print(\"RUNTIME_ANDROID_SDK=\"+json.dumps({\"path\":str(root),\"version\":run([str(emulator),\"-version\"]),\"acceleration\":run([str(emulator),\"-accel-check\"]),\"images\":sorted(str(p.relative_to(root)) for p in (root/\"system-images\").glob(\"*/*/*/source.properties\")) if (root/\"system-images\").is_dir() else []}),flush=True)\n",timeout=100)
          PY
