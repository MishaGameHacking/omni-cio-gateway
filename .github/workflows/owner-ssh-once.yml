name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-build-readonly-inspection
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect provider status and SSH reachability without changing the server
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,socket,subprocess,sys,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(2*1024*1024+1))
          doc=get("/servers/9409007");s=doc["server"]
          assert s["name"]=="analyst-ai-build-20261023" and s["comment"]=="Analyst AI Timeweb-only development authorized 2026-10-23"
          report={k:s.get(k) for k in ("id","status","cpu","ram","preset_id","availability_zone","created_at")}
          report["ip"]=p.cloud.public_ipv4(s)
          logs=get("/servers/9409007/logs")
          report["provider_log_schema"]={k:type(v).__name__ for k,v in logs.items()}
          report["provider_events"]=[{k:row.get(k) for k in ("id","type","action","status","date","created_at")} for row in logs.get("server_logs",[])][-10:]
          if report["ip"]:
              try:
                  with socket.create_connection((report["ip"],22),timeout=8) as conn:
                      conn.settimeout(4);report["ssh_banner"]=conn.recv(200).decode(errors="replace")
              except OSError as e:report["tcp_error"]={"type":type(e).__name__,"errno":e.errno}
              scan=subprocess.run(["ssh-keyscan","-T","5","-t","ed25519",report["ip"]],capture_output=True,text=True,timeout=8)
              keys=[line.split()[1:3] for line in scan.stdout.splitlines() if not line.startswith("#")]
              report["pinned_host_key_seen"]=["ssh-ed25519","AAAAC3NzaC1lZDI1NTE5AAAAIGmwBxMAtvv3Qi5vfEfbsDoaLKC3eEusG/K94fCR2BXU"] in keys
              report["host_key_count"]=len(keys)
          print("TIMEWEB_BUILD_DIAGNOSIS="+json.dumps(report),flush=True)
          PY
