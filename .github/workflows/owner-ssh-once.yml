name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-temporary-access
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read Timeweb build capacity and current server inventory
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys
          sys.path.insert(0,"tools")
          from timeweb_actions_probe import read_catalog,read_resource,summarize,validated_token
          from timeweb_ci_catalog import candidate_presets,ubuntu_images
          token=validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          inventory=read_resource(token,"servers")
          assert summarize("servers",inventory)["complete"]
          print("TIMEWEB_BUILD_CATALOG="+json.dumps({"offers":candidate_presets(read_catalog(token,"presets")),"images":ubuntu_images(read_catalog(token,"os")),"existing":[{k:s.get(k) for k in ("id","cpu","ram","location","status","preset_id","configurator_id")} for s in inventory["servers"]]}),flush=True)
          PY
