name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import base64,datetime,hashlib,json,os,pwd,subprocess,time,urllib.request,urllib.error,xml.etree.ElementTree as ET\nfrom pathlib import Path\nROOT=Path(\"/srv/analyst-ai/workspace\");STATE=Path(\"/var/lib/analyst-ai-build\")\npath=STATE/\"diagnostics/ota-candidate-37.json\"\ndeadline=time.monotonic()+45\nwhile True:\n    archive=json.loads(path.read_text())\n    if archive[\"status\"]!=\"waiting_for_build\" or time.monotonic()>=deadline:break\n    time.sleep(5)\nif archive[\"status\"]!=\"prepared_not_published\":\n    print(\"FINALIZATION_PENDING=\"+json.dumps(archive),flush=True)\n    build=json.loads((STATE/\"build-result.json\").read_text())\n    print(\"CURRENT_BUILD=\"+json.dumps(build),flush=True)\n    p=Path(build[\"log_directory\"])/\"gradle.log\"\n    if p.exists():print(\"GRADLE_TAIL=\"+p.read_text(errors=\"replace\")[-4500:],flush=True)\n    raise SystemExit(0)\ncheck=json.loads((STATE/\"check-result.json\").read_text());build=json.loads((STATE/\"build-result.json\").read_text())\nassert check[\"status\"]==build[\"status\"]==\"passed\"\nassert check[\"source_sha256\"]==build[\"source_sha256\"]==archive[\"source_sha256\"]\napk=Path(archive[\"apk\"])\nwith apk.open(\"rb\") as f: assert hashlib.file_digest(f,\"sha256\").hexdigest()==archive[\"apk_sha256\"]\nassert hashlib.sha256(Path(\"/etc/caddy/Caddyfile\").read_bytes()).hexdigest()==\"48a1aa9673d3e7899b15267e468f7967364deaf222d094912be4578c3502ab5c\",\"active_proxy_changed\"\nassert hashlib.sha256(Path(\"/etc/caddy/Caddyfile.ota-prepared\").read_bytes()).hexdigest()==\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\"\nassert not list(Path(\"/srv/analyst-ai-ota/releases\").rglob(\"*.apk\")),\"unexpected_release_publication\"\ndef request(url,method=\"GET\"):\n    req=urllib.request.Request(url,method=method)\n    try:\n        with urllib.request.urlopen(req,timeout=20) as response:\n            return response.status,response.read(4096).decode(errors=\"replace\")\n    except urllib.error.HTTPError as error:\n        return error.code,error.read(4096).decode(errors=\"replace\")\nlocal={\n    \"policy\":request(\"http://127.0.0.1:8081/client/update-policy\"),\n    \"ready\":request(\"http://127.0.0.1:8081/client/ready\",\"POST\"),\n    \"invalid_apk\":request(\"http://127.0.0.1:8081/client/apk/not-a-release.apk\"),\n}\nassert local[\"policy\"][0]==503 and local[\"ready\"][0]==401 and local[\"invalid_apk\"][0]==404\nexternal=request(\"https://analyst-ai-2941515.twc1.net/client/update-policy\")\nassert external[0]==503\ntotal={k:0 for k in (\"tests\",\"failures\",\"errors\",\"skipped\")}\nfor p in (ROOT/\"app/build/test-results/testDebugUnitTest\").glob(\"TEST-*.xml\"):\n    r=ET.parse(p).getroot()\n    for k in total:total[k]+=int(r.get(k,\"0\"))\nassert total=={\"tests\":163,\"failures\":0,\"errors\":0,\"skipped\":0}\nnow=datetime.datetime.now(datetime.timezone.utc).isoformat()\nnote=f\"\"\"# Автоматические обновления Analyst AI 0.12.1\n\nСостояние на {now}. Подготовлен APK 0.12.1-preview / 37; в серверный канал он не опубликован. Установка на телефоне владельца не подтверждена.\n\n## Запрос владельца\n\n25.10.2026: «так я хочу чтобы приложение обновлялось через сервер на моём телефоне! Без моего ручного обновления!»\n\nРабота выполнена на единственном основном Timeweb 9415007, Analyst AI PRO, Amsterdam, в /srv/analyst-ai/workspace. GitHub использован для резервной копии и ранее разрешённого административного транспорта. Конфигурация VM не менялась; дублирующие серверы не создавались.\n\n## Подготовленное поведение\n\n- При открытом приложении после успешной свежей проверки серверной версии обязательное обновление запускается автоматически, если Android уже разрешил установку из Analyst AI.\n- APK проходит существующие проверки размера, SHA-256, package и сертификата. Используется прежняя линия ru.omnicio.app.debug и прежний ключ подписи.\n- На один APK приходится одна автоматическая попытка в процессе. Повторный опрос и изменение описания релиза не создают новые попытки. После ошибки или отмены доступна явная повторная попытка.\n- Сохранённая сессия PackageInstaller восстанавливается до автоматической операции; устранено окно между регистрацией и открытием новой сессии.\n- Автоматический запуск работает в foreground. Фоновое обновление полностью закрытого приложения этой версией не реализовано.\n- Установленная 0.11.0-preview / 35 содержит прежний ручной запуск. Первый переход требует кнопки «Обновить» в самом приложении после появления релиза на сервере. Изменение сервера не переписывает уже установленный код.\n- Android может потребовать разрешение источника или подтверждение установки. Существующие REQUEST_INSTALL_PACKAGES, UPDATE_PACKAGES_WITHOUT_USER_ACTION и USER_ACTION_NOT_REQUIRED сохранены; системное согласие не обходится.\n\nПлатформенный контракт: https://developer.android.com/reference/android/content/pm/PackageInstaller.SessionParams#setRequireUserAction(int)\n\n## Проверенные байты\n\n| Поле | Значение |\n| --- | --- |\n| Версия | 0.12.1-preview |\n| versionCode | 37 |\n| Package | ru.omnicio.app.debug |\n| APK SHA-256 | {archive['apk_sha256']} |\n| Размер, байт | {archive['apk_bytes']} |\n| Сертификат SHA-256 | {archive['certificate_sha256']} |\n| Android SDK | min / target / compile 37 |\n| Ориентация телефона | portrait |\n| Исходники SHA-256 | {archive['source_sha256']} |\n| Резервная копия кода | {archive['source_backup_commit']} |\n\nAPK и отчёты сохранены на сервере: {archive['archive_directory']}.\nСохранён также настоящий предыдущий APK 0.12.0 / 36. Точные ранее доставленные байты 0.11 / 35 в доступных резервных копиях не найдены; это остаётся ограничением проверки обновления именно с версии телефона.\n\n## Проверки\n\n| Этап | Результат |\n| --- | --- |\n| Полная проверка исходников | passed, {check['finished_at']} |\n| Host tests | 974 passed |\n| Tools tests | 52 passed |\n| Node tests | 61 passed |\n| Backend tests | 1584 passed; 1481 subtests passed |\n| Android JVM | 163 passed, 0 failures/errors/skips |\n| Debug / Preview lint, сборки и test driver | build passed |\n| Подпись, ZIP/DEX/ELF, 16 KiB alignment, manifest | build passed |\n| Сборка | passed, {build['finished_at']} |\n| Установка/upgrade/UI APK37 в Android | не выполнены |\n| OTA-публикация APK37 | не выполнена |\n| Установка на физическом телефоне | не подтверждена |\n\nИсходные receipts: /var/lib/analyst-ai-build/check-result.json и build-result.json. Оба относятся к одному source SHA; APK сохранён с совпадающим SHA отчёта apk-verification.json.\n\nПервый build37 прервала перезагрузка VM около 05:43 UTC. Сборка была завершена сигналом TERM, не сообщением компилятора; причина reboot не установлена. Исходники и прежний APK после перезапуска сверены по SHA. Прерванные receipts сохранены отдельно в diagnostics/interrupted-build-20261025T0543.\n\n## Препятствие для публикации\n\nНа текущей VM отсутствуют /dev/kvm и CPU flags VMX/SVM. Отдельный stock Android API37 / 16384 без установки APK не завершил boot за 1800.382 секунды. Его собственный AVD удалён, процессы остановлены. Exit -9 относится к ограниченной очистке, а не доказанному самостоятельному падению Android.\n\nЭто не runtime-результат APK37. В действующем AGENTS.md и release_publication сохраняются обязательные реальные API37 / 4096 и / 16384: install, upgrade, launch и полный UI suite для точного SHA кандидата. Исторические результаты и успешную сборку нельзя подставлять вместо этой матрицы. Ручной current.json не создавался, publisher и его guards не изменялись.\n\n## Подготовленный серверный транспорт\n\nИзолированная read-only служба analyst-ai-updates.service работает на 127.0.0.1:8081. Root-owned код находится в /opt/analyst-ai-updates; служба использует DynamicUser, ограничения памяти и read-only filesystem.\n\n- GET /client/update-policy читает существующий release contract.\n- GET /client/apk/{{filename}} проверяет реальные байты.\n- POST /client/ready всегда возвращает 401; отсутствующая приватная сессия не считается авторизованной.\n- Приватная БД и owner state этим приложением не создаются.\n- Release root: /srv/analyst-ai-ota/releases, сейчас пустой.\n- Проверено после перезапуска: local policy503, ready401, invalid APK404.\n- /etc/caddy/Caddyfile.ota-prepared прошёл caddy validate; активный Caddyfile не заменён.\n- Публичный HTTPS по-прежнему возвращает maintenance503; private backend ещё не восстановлен.\n\nСледующий обычный выпуск требует настоящей полной Android-матрицы и публикации через проверяющий evidence publisher. Затем нужны переключение подготовленного proxy и внешняя проверка версии, размера, подписи и SHA тех же APK-байтов. Переключение канала делает новую версию обязательной для preview-клиентов; метка «тестовый» сама по себе не меняет этот контракт.\n\"\"\"\ndoc=ROOT/\"docs/AUTOMATIC_UPDATES_0.12.1.md\"\ndoc.write_text(note)\naccount=pwd.getpwnam(\"analyst-build\")\nos.chown(doc,account.pw_uid,account.pw_gid);doc.chmod(0o644)\nheader=\"\"\"## Состояние работы — 25.10.2026, автоматическое обновление 0.12.1\n\nOWNER запросил обновление приложения через сервер на телефоне без ручного обновления.\nНа основном Timeweb подготовлен 0.12.1-preview / 37 с автоматическим запуском\nобновления в foreground. Check, Android JVM/lint, сборка, подпись и целостность прошли.\nПолная Android runtime-матрица для этих байтов не выполнена: stock эмулятор\nна текущей VM не завершил boot за 1800 секунд. OTA37 не опубликован, телефон\nне проверен. Публичный канал подготовлен на loopback; внешний HTTPS пока503.\nДействующие runtime/publication guards сохранены. Подробности и точные SHA:\ndocs/AUTOMATIC_UPDATES_0.12.1.md.\n\n\"\"\"\nagents=ROOT/\"AGENTS.md\"\nold=agents.read_text()\nif not old.startswith(header):\n    assert \"## Состояние работы — 25.10.2026, автоматическое обновление 0.12.1\" not in old\n    agents.write_text(header+old)\nsubprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(ROOT),\"diff\",\"--check\"],check=True)\nfor p in (doc,agents):\n    data=p.read_bytes()\n    print(\"OTA_FINAL_DOCUMENT=\"+json.dumps({\"path\":str(p.relative_to(ROOT)),\"content_base64\":base64.b64encode(data).decode(),\"sha256\":hashlib.sha256(data).hexdigest()}),flush=True)\nprint(\"OTA_FINAL_STATE=\"+json.dumps({\"archive\":archive,\"android_jvm\":total,\"local_http\":{k:v[0] for k,v in local.items()},\"external_https\":external[0],\"check\":check,\"build\":build}),flush=True)\n",timeout=180)
          PY
