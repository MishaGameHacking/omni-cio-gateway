name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-cleanup-inventory
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect current authorized Timeweb application resources for cleanup
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          def owned(s):
              assert s["id"]==121673 and s["name"]=="analyst-ai-msk-20261024" and s["comment"]=="Analyst AI owner authorized Moscow work server 2026-10-24"
              assert s["preset_id"]==6007 and s["location"]=="ru-3" and s["project_id"]==2941515 and Decimal(str(s["price"]))==5480
              return s
          document=p.read_resource(token,"servers")
          assert p.summarize("servers",document)["complete"]
          print("CLEANUP_SERVERS="+json.dumps([{**{k:s.get(k) for k in ("id","name","comment","status","location","cpu","ram","preset_id","project_id")},"ip":p.cloud.public_ipv4(s)} for s in document["servers"]]),flush=True)
          project=get("/projects/2941515/resources")
          print("CLEANUP_PROJECT_RESOURCES="+json.dumps(project),flush=True)
          ips=get("/floating-ips")
          assert ips.get("meta",{}).get("total")==len(ips["ips"])
          print("CLEANUP_FLOATING_IPS="+json.dumps([{k:r.get(k) for k in ("id","ip","resource_id","resource_type","location","is_ddos_guard","availability_zone")} for r in ips["ips"]]),flush=True)
          physical=owned(get("/dedicated-servers/121673")["dedicated_server"])
          print("CLEANUP_BUILDER="+json.dumps({k:physical.get(k) for k in ("id","name","status","location","price","ip","os_id","autoinstall_ready","payment_period")}),flush=True)
          PY
