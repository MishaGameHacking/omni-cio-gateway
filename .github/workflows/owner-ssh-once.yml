name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import json,pathlib,subprocess,hashlib\ns=pathlib.Path(\"/var/lib/analyst-ai-build\")\nfor stage in (\"check\",\"build\",\"runtime\"):\n    p=s/(stage+\"-result.json\")\n    if p.exists():\n        d=json.loads(p.read_text());print(\"WORKSPACE_STAGE=\"+json.dumps(d),flush=True)\n        if d.get(\"status\")==\"failed\":\n            steps=d.get(\"steps\",[])\n            for step in steps:\n                if step.get(\"exit_code\")!=0:\n                    text=pathlib.Path(step[\"log\"]).read_text(errors=\"replace\")\n                    print(\"FAILED_STAGE_LOG_BEGIN\",flush=True);print(text[-14000:],flush=True);print(\"FAILED_STAGE_LOG_END\",flush=True)\np=subprocess.run([\"systemctl\",\"show\",\"analyst-workspace@check\",\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"MemoryPeak\",\"-p\",\"CPUUsageNSec\"],capture_output=True,text=True)\nprint(\"WORKSPACE_CHECK_UNIT=\"+p.stdout.replace(\"\\n\",\";\"),flush=True)\nprint(\"LIVE_BACKEND=\"+subprocess.check_output([\"systemctl\",\"is-active\",\"analyst-ai-owner\"],text=True).strip(),flush=True)\n\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nfor label,args in [\n(\"BACKEND_SOURCE_DIFF\",[\"git\",\"-C\",str(root),\"diff\",\"--name-status\",\"HEAD\",\"fd01d2ac090103cf64557c97aeaf36bc290e2cec\",\"--\",\"backend\",\"deploy\"]),\n(\"WORKSPACE_MODIFIED\",[\"git\",\"-C\",str(root),\"status\",\"--short\"])]:\n    p=subprocess.run(args,capture_output=True,text=True);print(label+\"=\"+json.dumps({\"exit_code\":p.returncode,\"lines\":p.stdout.splitlines()}),flush=True)\nprod=pathlib.Path(\"/opt/analyst-ai/backend\")\nfiles=[p for p in prod.rglob(\"*\") if p.is_file() and \"__pycache__\" not in p.parts and p.suffix==\".py\"]\nsame=sum(1 for p in files if (root/\"backend\"/p.relative_to(prod)).is_file() and hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256((root/\"backend\"/p.relative_to(prod)).read_bytes()).digest())\nprint(\"PRODUCTION_SOURCE_ALIGNMENT=\"+json.dumps({\"python_files\":len(files),\"matching_workspace\":same}),flush=True)\nprint(\"CURRENT_RAM_KIB=\"+next(x.split()[1] for x in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if x.startswith(\"MemTotal:\")),flush=True)\n"
                      print(p.remote(command,"python3 -c "+shlex.quote(remote_script),timeout=60).decode(),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
