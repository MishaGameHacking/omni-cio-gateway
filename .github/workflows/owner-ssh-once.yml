name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess,json\nscript=\"PARTS=[\\\"\\\"]\\nimport base64,zlib,json,pathlib,hashlib,os,pwd,fcntl,tempfile,datetime,sys\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\")\\nstate=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nassert os.geteuid()==pwd.getpwnam(\\\"analyst-build\\\").pw_uid\\nassert root.is_dir() and not root.is_symlink()\\nlock=(state/\\\"workspace.lock\\\").open(\\\"a\\\")\\nfcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\ndef blob(raw):return hashlib.sha1(b\\\"blob \\\"+str(len(raw)).encode()+b\\\"\\\\0\\\"+raw).hexdigest()\\ndeltas=[json.loads(zlib.decompress(base64.b64decode(s))) for s in PARTS]\\nchanges=[]\\nfor d in deltas:\\n relative=d[\\\"path\\\"];p=root/relative\\n assert not relative.startswith(\\\"/\\\") and \\\"..\\\" not in pathlib.PurePosixPath(relative).parts\\n for part in (p,*p.parents):\\n  if part==root:break\\n  assert not part.is_symlink(),\\\"source_symlink\\\"\\n old=p.read_bytes() if p.exists() else None\\n assert (None if old is None else blob(old))==d[\\\"old_blob\\\"],\\\"source_changed:\\\"+relative\\n if \\\"content\\\" in d:new=d[\\\"content\\\"].encode()\\n else:\\n  lines=old.decode().splitlines(keepends=True)\\n  for h in reversed(d[\\\"hunks\\\"]):\\n   assert 0<=h[\\\"start\\\"]<=h[\\\"end\\\"]<=len(lines)\\n   lines[h[\\\"start\\\"]:h[\\\"end\\\"]]=h[\\\"lines\\\"]\\n  new=\\\"\\\".join(lines).encode()\\n changes.append((relative,p,old,new))\\nbackup=state/\\\"diagnostics\\\"/(\\\"redesign-source-\\\"+datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%S%fZ\\\"))\\nbackup.mkdir(parents=True,exist_ok=False)\\nfor relative,p,old,new in changes:\\n if old is not None:\\n  q=backup/relative;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(old)\\n p.parent.mkdir(parents=True,exist_ok=True)\\n fd,name=tempfile.mkstemp(prefix=\\\".\\\"+p.name+\\\".redesign-\\\",dir=p.parent)\\n try:\\n  with os.fdopen(fd,\\\"wb\\\") as f:f.write(new);f.flush();os.fsync(f.fileno())\\n  os.chmod(name,0o644);os.replace(name,p)\\n finally:\\n  if os.path.exists(name):os.unlink(name)\\n print(\\\"REDESIGN_SOURCE_FILE=\\\"+json.dumps({\\\"path\\\":relative,\\\"bytes\\\":len(new),\\\"sha256\\\":hashlib.sha256(new).hexdigest(),\\\"git_blob\\\":blob(new)}),flush=True)\\nsys.path.insert(0,str(root/\\\"deploy\\\"))\\nimport timeweb_workspace as workspace\\nprint(\\\"REDESIGN_SOURCE_APPLIED=\\\"+json.dumps({\\\"files\\\":len(changes),\\\"backup\\\":str(backup),\\\"source_sha256\\\":workspace.source_hash(),\\\"tests_run\\\":False}),flush=True)\\n\"\nr=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"python3\",\"-\"],input=script,text=True,capture_output=True,cwd=\"/srv/analyst-ai/workspace\",timeout=120)\nprint(r.stdout,flush=True)\nif r.returncode:print(r.stderr[-2000:],flush=True);raise RuntimeError(\"guard_fixture_patch_failed\")\nr=subprocess.run([\"systemctl\",\"restart\",\"--no-block\",\"analyst-workspace@check.service\"],capture_output=True,text=True,timeout=15)\nif r.returncode:raise RuntimeError(\"check_start_failed\")\nprint(\"REDESIGN_FULL_CHECK_STARTED=true\",flush=True)\n",timeout=180)
          PY
