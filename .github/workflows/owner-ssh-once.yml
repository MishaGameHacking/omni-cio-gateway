name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          with_ams("backup_token="+repr(os.environ["GH_TOKEN"])+"\n"+"\nimport pathlib,json,subprocess,os,tempfile,pwd,hashlib,datetime,shutil\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\nowner=pwd.getpwnam(\"analyst-build\")\ncheck=json.loads((state/\"check-result.json\").read_text())\ndef git(args,*,env=None,raw=False):\n    r=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",*args],cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)\n    if r.returncode:\n        if args[0]==\"diff\":print(\"AMS_BACKUP_DIFF_ERROR=\"+r.stdout.decode(errors=\"replace\")[-4000:]+r.stderr.decode(errors=\"replace\")[-1000:],flush=True)\n        raise RuntimeError(\"source_backup_git_command_failed_\"+args[0])\n    return r.stdout if raw else r.stdout.decode().strip()\ndigest=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",str(state/\"venv/bin/python\"),\"-c\",\"import sys;sys.path.insert(0,'deploy');import timeweb_workspace;print(timeweb_workspace.source_hash())\"],cwd=root,text=True).strip()\nassert check[\"status\"]==\"passed\" and check[\"source_sha256\"]==digest==\"d22243392b9cabca5f0c11dbd9bb96e62099653a49d4f90e041559844b2e76a2\"\nnote=\"\\n\\n## Проверка нового Timeweb — 24.10.2026, 23:26 МСК\\n\\nОсновной сервер Analyst AI PRO / 9415007 / Amsterdam ams-1, IP 83.217.195.29:\\n4 vCPU, 6 ГБ RAM, 30 ГБ NVMe, Ubuntu 24.04.5. SSH проверен, firewall 22/80/443.\\nSDK37 и platform-tools установлены. Отсутствующий adb вызвал реальный отказ\\nпервого check; после установки полный check прошёл на Timeweb:\\n4 workspace guards, 974 host, 52 tools, 61 Node, 1563 backend и 1481 subtests.\\nSource SHA-256: \"+digest+\".\\nПуть отчётов: /var/lib/analyst-ai-build/runs/20261024T202511Z-check.\\n\\nCPU/RAM/disk не увеличивались сверх согласованных 4/6/30. Server+IPv4 =\\n6840 ₽/месяц, API 9.34 ₽/час. Настроен daily backup с 25.10.2026 UTC, одна\\nкопия диска: 180 ₽/месяц после создания; плановый итог 7020 ₽/месяц.\\n\\nПрежний сервер отсутствовал до нового создания; доступных образов/снапшотов\\nнет. Приватная БД и привязка владельца не восстановлены. Идентичный исходный\\nsigning key найден на исходном Windows runner, передача пока не подтверждена.\\nTELEGRAM_CLIENT_ID/SECRET доступны и приватно подготовлены; OWNER_TELEGRAM_SUB,\\nFERNET_KEY и TIMEWEB_AI_TOKEN в резервных secrets отсутствуют. Значения не\\nпубликовались. API и платный ИИ не объявляются готовыми.\\n\\nKVM/VMX/SVM отсутствуют. Полная Android-матрица и новый APK36 не пройдены.\\nЭто готовое рабочее окружение с проверенным исходным кодом, не выпуск APK.\\n\"\nfor rel in [\"docs/TIMEWEB_WORKSPACE.md\",\"docs/LIVE_UPDATES_0.12.md\",\"docs/PLAN_STATUS.md\"]:\n    path=root/rel\n    current=path.read_text()\n    if \"## Проверка нового Timeweb — 24.10.2026, 23:26 МСК\" not in current:current=current.rstrip()+note\n    path.write_text(current.rstrip()+\"\\n\");os.chown(path,owner.pw_uid,owner.pw_gid)\nreadme=root/\"README.md\";body=readme.read_text();first,sep,rest=body.partition(\"\\n\")\nif \"> 24.10.2026, 23:26 МСК:\" not in body:body=first+\"\\n\\n> 24.10.2026, 23:26 МСК: новый основной Timeweb в Амстердаме настроен; полный host/backend check прошёл. Прежний сервер отсутствует в аккаунте. Восстановление приватных данных, владельца и нового APK не завершено. [Фактическое состояние](docs/TIMEWEB_WORKSPACE.md).\\n\"+sep+rest\nreadme.write_text(body.rstrip()+\"\\n\");os.chown(readme,owner.pw_uid,owner.pw_gid)\nallowed={\".gitignore\",\".github/scripts/native_renderer_evidence.py\",\".github/scripts/tests/test_native_renderer_evidence.py\",\".github/scripts/test_apk_installation.py\",\"deploy/timeweb_workspace.py\",\"AGENTS.md\",\"README.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/TIMEWEB_WORKSPACE.md\",\"docs/LIVE_UPDATES_0.12.md\"}\nmodified=set(git([\"diff\",\"--name-only\",\"-z\"],raw=True).decode().strip(\"\\0\").split(\"\\0\"))|set(git([\"ls-files\",\"--others\",\"--exclude-standard\",\"-z\"],raw=True).decode().strip(\"\\0\").split(\"\\0\"))\nmodified.discard(\"\");assert modified and modified<=allowed,\"unreviewed_backup_paths\"\nfor name in modified:assert (root/name).is_file() and not (root/name).is_symlink() and (root/name).stat().st_size<500000\nbranch=\"refs/heads/backup/timeweb-workspace-20261024\";parent=\"9a735a60329f594a3ca52f0c2e34860bbb17e5d8\"\nassert git([\"ls-remote\",\"origin\",branch]).split()[0]==parent,\"backup_head_changed\"\nwith tempfile.TemporaryDirectory(prefix=\"source-backup-\",dir=state) as directory:\n    folder=pathlib.Path(directory);os.chown(folder,owner.pw_uid,owner.pw_gid);folder.chmod(0o700)\n    ask=folder/\"askpass.py\"\n    ask.write_text(\"#!/usr/bin/python3\\nimport os,sys\\nprint('x-access-token' if 'username' in sys.argv[1].lower() else os.environ['ANALYST_BACKUP_TOKEN'])\\n\")\n    ask.chmod(0o700);os.chown(ask,owner.pw_uid,owner.pw_gid)\n    env={**os.environ,\"GIT_INDEX_FILE\":str(folder/\"index\"),\"GIT_AUTHOR_NAME\":\"Analyst AI Timeweb\",\"GIT_AUTHOR_EMAIL\":\"timeweb-workspace@localhost\",\"GIT_COMMITTER_NAME\":\"Analyst AI Timeweb\",\"GIT_COMMITTER_EMAIL\":\"timeweb-workspace@localhost\",\"GIT_ASKPASS\":str(ask),\"GIT_TERMINAL_PROMPT\":\"0\",\"ANALYST_BACKUP_TOKEN\":backup_token}\n    git([\"read-tree\",parent],env=env)\n    git([\"add\",\"--\",*sorted(modified)],env=env);git([\"diff\",\"--cached\",\"--check\"],env=env)\n    tree=git([\"write-tree\"],env=env)\n    commit=git([\"commit-tree\",tree,\"-p\",parent,\"-m\",\"Back up recovered Amsterdam workspace after complete Timeweb checks\"],env=env)\n    hashes={}\n    for name in sorted(modified):\n        sha=hashlib.sha256((root/name).read_bytes()).hexdigest();assert hashlib.sha256(git([\"show\",commit+\":\"+name],raw=True)).hexdigest()==sha;hashes[name]=sha\n    git([\"push\",\"--force-with-lease=\"+branch+\":\"+parent,\"origin\",commit+\":\"+branch],env=env)\n    assert git([\"ls-remote\",\"origin\",branch]).split()[0]==commit\n    proof={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"branch\":branch,\"commit\":commit,\"source_sha256\":digest,\"files\":hashes}\n    target=state/\"source-backup-proof.json\";target.write_text(json.dumps(proof,indent=2)+\"\\n\");target.chmod(0o600)\n    print(\"AMS_SOURCE_BACKUP=\"+json.dumps({\"commit\":commit,\"source_sha256\":digest,\"files\":len(hashes)}),flush=True)\n",timeout=300)
          PY
