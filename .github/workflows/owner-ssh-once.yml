name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-sdk-host-smokes
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Run previously skipped SDK signature and ADB smoke checks on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,importlib.util,json,os,pathlib,shutil,subprocess,time,traceback,urllib.request,zipfile\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-android-690811a5\";logdir=root/\"analyst-caret-diagnostic-20261024\";sdk=pathlib.Path(\"/opt/analyst-android-sdk\");python=root/\"analyst-ai-development-venv/bin/python\"\nreport_path=logdir/\"verification.json\";report=json.loads(report_path.read_text());report[\"sdk_smoke_preparation\"]={\"server_id\":9413105,\"emulator_installed\":False,\"system_images_installed\":False,\"runtime_matrix_executed\":False}\ndef save():\n    report[\"checked_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\n    report_path.write_text(json.dumps(report,indent=2)+\"\\n\");report_path.chmod(0o600)\ndef run_logged(name,args,timeout=600,env=None,input_text=None):\n    target=logdir/(name+\".log\")\n    with target.open(\"w\") as stream:\n        target.chmod(0o600)\n        result=subprocess.run(args,cwd=repo,env=env,input=input_text,text=True,stdout=stream,stderr=subprocess.STDOUT,timeout=timeout)\n    return result.returncode,target.read_bytes()\ntry:\n    assert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=repo,text=True).strip()==\"690811a5a376181990a64f37d914c87eb6c919b7\"\n    assert sorted(subprocess.check_output([\"git\",\"diff\",\"--name-only\"],cwd=repo,text=True).splitlines())==[\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\"]\n    assert shutil.disk_usage(root).free>=6*1024**3\n    assert not sdk.exists() and not sdk.is_symlink(),\"unexpected_existing_sdk\"\n    archive=root/\"analyst-commandlinetools-linux-15859902.zip\";assert not archive.exists()\n    expected=\"4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583\"\n    started=time.monotonic();digest=hashlib.sha256();size=0\n    with urllib.request.urlopen(\"https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip\",timeout=45) as response,archive.open(\"xb\") as output:\n        archive.chmod(0o600)\n        while True:\n            chunk=response.read(1024*1024)\n            if not chunk:break\n            size+=len(chunk);assert size<=300*1024**2 and time.monotonic()-started<=300,\"download_bound\"\n            digest.update(chunk);output.write(chunk)\n    assert digest.hexdigest()==expected,\"official_android_tools_hash_mismatch\"\n    sdk.mkdir(mode=0o755)\n    dest=sdk/\"cmdline-tools\";dest.mkdir(mode=0o755)\n    with zipfile.ZipFile(archive) as package:\n        for item in package.infolist():\n            assert not item.filename.startswith(\"/\") and \"..\" not in pathlib.PurePosixPath(item.filename).parts\n            assert (item.external_attr>>16)&0o170000 != 0o120000,\"archive_symlink_refused\"\n        package.extractall(dest)\n        for item in package.infolist():\n            mode=(item.external_attr>>16)&0o777\n            if mode:(dest/item.filename).chmod(mode)\n    (dest/\"cmdline-tools\").rename(dest/\"latest\")\n    archive.unlink()\n    cli=sdk/\"cmdline-tools/latest/bin/android\";assert cli.is_file()\n    env=dict(os.environ,ANDROID_SDK_ROOT=str(sdk),ANDROID_HOME=str(sdk),JAVA_HOME=\"/usr/lib/jvm/java-17-openjdk-amd64\",PYTHONDONTWRITEBYTECODE=\"1\")\n    code,data=run_logged(\"sdk-build-tools\",[str(python),\".github/scripts/prepare_android_sdk.py\",\"--sdk\",str(sdk)],timeout=1350,env=env)\n    assert code==0,\"sdk_build_installation_failed\"\n    code,data=run_logged(\"sdk-platform-tools\",[str(cli),\"--sdk=\"+str(sdk),\"sdk\",\"install\",\"platform-tools\"],timeout=600,env=env,input_text=\"y\\n\"*200)\n    assert code==0,\"sdk_platform_tools_failed\"\n    spec=importlib.util.spec_from_file_location(\"sdk_checks\",repo/\".github/scripts/prepare_android_sdk.py\")\n    checks=importlib.util.module_from_spec(spec);spec.loader.exec_module(checks)\n    packages=checks.required_sdk_packages()[:2]+(\"platform-tools\",) if isinstance(checks.required_sdk_packages(),tuple) else checks.required_sdk_packages()[:2]+[\"platform-tools\"]\n    for package in packages:checks._verify_package(sdk,package)\n    report[\"sdk_smoke_preparation\"].update({\"packages\":list(packages),\"archive_sha256\":expected,\"free_disk_gib\":round(shutil.disk_usage(root).free/1024**3,2)})\n    result_file=logdir/\"python-script-tests-with-sdk.json\"\n    runner=\"import json,pathlib,sys,unittest\\nsuite=unittest.defaultTestLoader.discover('.github/scripts/tests',pattern='test_*.py')\\nr=unittest.TextTestRunner(verbosity=2).run(suite)\\npath=pathlib.Path(\"+repr(str(result_file))+\")\\npath.write_text(json.dumps({'tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'skipped':[{'test':t.id(),'reason':reason} for t,reason in r.skipped]},indent=2)+'\\\\n');path.chmod(0o600)\\nsys.exit(0 if r.wasSuccessful() else 1)\\n\"\n    env[\"PYTHONPATH\"]=str(repo/\".github/scripts\")+os.pathsep+str(repo/\".github/scripts/tests\")\n    code,data=run_logged(\"all-scripts-with-sdk\",[str(python),\"-c\",runner],timeout=360,env=env)\n    result=json.loads(result_file.read_text())\n    report[\"all_scripts_with_sdk\"]={\"exit\":code,**result,\"log_sha256\":hashlib.sha256(data).hexdigest()}\n    save();print(\"TIMEWEB_CARET_SDK_VERIFICATION=\"+json.dumps(report),flush=True)\n    assert code==0 and result[\"tests\"]>=962 and result[\"failures\"]==0 and result[\"errors\"]==0 and not result[\"skipped\"],\"script_suite_not_fully_passed\"\n    development=root/\"analyst-ai-development-79be1821\"\n    note=\"Дополнение F01/F23 24.10.2026: на Timeweb 9413105 установлен минимальный SDK (platforms/android-37.0, build-tools/37.0.0, platform-tools; без emulator/system-images). Архив CLI проверен по SHA256 \"+expected+\". Повторный полный запуск Python host-проверок: \"+str(result[\"tests\"])+\" тестов, failures=0, errors=0, skips=0; ранее пропущенные проверки настоящей криптографической подписи тестового APK и изолированного ADB выполнены. Подтверждение /root/analyst-caret-diagnostic-20261024/verification.json, all_scripts_with_sdk. Это не Android runtime матрица 4KB/16KB и не выпуск APK; контрольная версия 0.11 не изменена, реальный сбой strategy/ready;font=2.0 остаётся открытым.\\n\"\n    for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n        path=development/rel;body=path.read_text();assert note not in body;path.write_text(body.rstrip()+\"\\n\\n\"+note)\n    for directory in (repo,development):subprocess.run([\"git\",\"diff\",\"--check\"],cwd=directory,check=True,capture_output=True)\n    print(\"TIMEWEB_SDK_SMOKE_COMPLETED=true\",flush=True)\nexcept Exception as error:\n    report[\"sdk_smoke_error_type\"]=type(error).__name__\n    path=logdir/\"sdk-smoke-error.log\";path.write_text(traceback.format_exc());path.chmod(0o600)\n    save();print(\"TIMEWEB_SDK_SMOKE_COMPLETED=false;error_type=\"+type(error).__name__,flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=2200).decode()
                      print(output,end="",flush=True)
                      assert "TIMEWEB_SDK_SMOKE_COMPLETED=true" in output,"on_server_repair_failed_inspect_private_report"
                      docs=json.loads(p.remote(command,"python3 -c "+shlex.quote("import json,pathlib\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\"\nsecret=json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"TELEGRAM_CLIENT_SECRET\"]\nfiles={rel:(repo/rel).read_text() for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\")}\nfiles.update({rel:(root/\"analyst-ai-android-690811a5\"/rel).read_text() for rel in (\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\")})\nassert all(secret not in text and \"-----BEGIN OPENSSH PRIVATE KEY-----\" not in text and \"-----BEGIN PRIVATE KEY-----\" not in text for text in files.values())\nprint(json.dumps(files))\n"),timeout=30))
                      assert set(docs)=={"AGENTS.md","docs/MASTER_PLAN.md","docs/PLAN_STATUS.md",".github/scripts/native_input_evidence.py",".github/scripts/tests/test_native_input_evidence.py"}
                      def gh(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"+path,method=method,data=data,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              raw=response.read(4*1024*1024+1)
                          return json.loads(raw) if raw else {}
                      ref=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert ref["object"]["sha"]==os.environ["GITHUB_SHA"],"backup_ref_changed"
                      commit=gh("GET","/git/commits/"+ref["object"]["sha"])
                      tree=gh("POST","/git/trees",{"base_tree":commit["tree"]["sha"],"tree":[{"path":path,"mode":"100644","type":"blob","content":text} for path,text in docs.items()]})
                      backed=gh("POST","/git/commits",{"message":"Back up cursor failure diagnostics developed and tested on Timeweb","tree":tree["sha"],"parents":[ref["object"]["sha"]]})
                      current=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert current["object"]["sha"]==ref["object"]["sha"],"backup_ref_changed"
                      gh("PATCH","/git/refs/heads/codex/timeweb-owner-prepare-2026-10-23",{"sha":backed["sha"],"force":False})
                      print("TIMEWEB_DOCUMENT_BACKUP="+json.dumps({"sha":backed["sha"],"tree":tree["sha"],"files":sorted(docs),"edited_on":"Timeweb 9413105"}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
