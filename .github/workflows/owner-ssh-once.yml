name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-verified-checkpoint
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Preserve the verified APK and current owner relocation instructions on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          adopt.select_target(True)
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          observed=[s for s in doc["servers"] if s["id"]==9408159]
          assert len(observed)==1 and observed[0]["ram"]==3072 and observed[0]["cpu"]==1
          p.CONFIGURATION["ram"]=3072
          adopt.verified_target(token)
          with tempfile.TemporaryDirectory(prefix="analyst-build-monitor-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client")
              public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-monitor-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              identifier=key["id"]
              attached=False
              try:
                  access.request(token,"POST","/servers/9408159/ssh-keys",{"ssh_key_ids":[identifier]})
                  attached=True
                  command=p.ssh_command(folder,adopt.NEW_IP,adopt.NEW_HOST_KEY)
                  for attempt in range(12):
                      try:
                          p.remote(command,"test $(id -u) = 0",timeout=12)
                          break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,hashlib,json,os,pathlib,shutil,stat,subprocess\nos.umask(0o077)\nroot=pathlib.Path(\"/root\")\nreport=json.loads((root/\"analyst-android-build-40075308670.json\").read_text())\nassert report[\"status\"]==\"build_verified_runtime_pending\" and report[\"build_and_static_verification_passed\"] is True and report[\"runtime_matrix_passed\"] is False\nsrc=root/\"analyst-ai-android-690811a5\"\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=src,text=True).strip()==\"690811a5a376181990a64f37d914c87eb6c919b7\"\nassert subprocess.check_output([\"git\",\"status\",\"--porcelain\",\"--untracked-files=no\"],cwd=src,text=True)==\"\"\napk=src/\"app/build/outputs/apk/preview/app-preview.apk\"\ndigest=hashlib.sha256(apk.read_bytes()).hexdigest()\nassert digest==\"71feb07dd0379a56ec25513194535a145bd5663dadc77611c50cdc442fccd27d\"\nfolder=root/\"analyst-ai-artifacts\"/report[\"source\"]\nfor part in (folder.parent,folder):\n    assert not part.is_symlink()\n    part.mkdir(mode=0o700,exist_ok=True)\n    part.chmod(0o700)\ntarget=folder/\"Analyst-AI-0.11.0-preview-690811a5.apk\"\nif target.exists():\n    assert not target.is_symlink() and hashlib.sha256(target.read_bytes()).hexdigest()==digest\nelse:\n    descriptor=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n    with os.fdopen(descriptor,\"wb\") as out,apk.open(\"rb\") as inp:\n        shutil.copyfileobj(inp,out)\n        out.flush();os.fsync(out.fileno())\nproof={\"source\":report[\"source\"],\"apk_sha256\":digest,\"apk_bytes\":target.stat().st_size,\"build_run_id\":\"40075308670\",\"jvm_tests\":report[\"jvm_tests\"],\"build_and_static_verification_passed\":True,\"runtime_matrix_passed\":False,\"release_ready\":False,\"phone_orientation\":\"portrait\",\"certificate_sha256\":report[\"apk\"][\"certificate_sha256\"],\"private_artifact\":str(target)}\nproof_path=folder/\"verification.json\"\nassert not proof_path.is_symlink()\ndescriptor=os.open(proof_path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\nwith os.fdopen(descriptor,\"w\") as out:out.write(json.dumps(proof,indent=2)+\"\\n\")\nassert hashlib.sha256(target.read_bytes()).hexdigest()==digest and stat.S_IMODE(target.stat().st_mode)==0o600\npolicy=root/\"analyst-ai-russian-server-config.json\"\nif policy.exists():\n    assert not policy.is_symlink() and stat.S_IMODE(policy.stat().st_mode)==0o600\n    value=json.loads(policy.read_text())\n    value[\"latest_cloud_relocation_request\"]={\"date\":\"2026-10-24\",\"source_server_id\":9408159,\"target_location\":\"ru-1\",\"target_city\":\"Saint Petersburg\",\"selection\":\"cheapest_available_adequate_backend\",\"preserve_source_until_verified\":True,\"dedicated_builder_order_id\":121673,\"billing\":\"hourly\"}\n    temp=policy.with_suffix(\".json.updated\")\n    assert not temp.exists() and not temp.is_symlink()\n    descriptor=os.open(temp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n    with os.fdopen(descriptor,\"w\") as out:\n        out.write(json.dumps(value,ensure_ascii=False,indent=2)+\"\\n\");out.flush();os.fsync(out.fileno())\n    os.replace(temp,policy)\nrepo=root/\"analyst-ai-development-79be1821\"\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=repo,text=True).strip()==\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\"\nmarker=\"## OWNER 24.10.2026 — первый облачный сервер в Санкт-Петербурге\"\ntext=marker+\"\\n\\nOWNER уточнил перенос первого облачного сервера Analyst AI из Нидерландов в Санкт-Петербург. Выбирать самый дешёвый фактически доступный вариант, достаточный для существующего backend; почасовая оплата. Заказанный выделенный сервер 121673 в Москве предназначен для разработки и Android runtime. До проверенного переноса файлов, оригинального ключа подписи, конфигурации, HTTPS и Telegram-входа исходный сервер 9408159 не удалять. Вся разработка, сборка и проверки выполняются на Timeweb; GitHub остаётся резервной копией и ранее разрешённым транспортом SSH/API. Новые функции не добавлять.\\n\"\nfor relative in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\"):\n    path=repo/relative\n    assert path.is_file() and not path.is_symlink()\n    original=path.read_text()\n    if marker not in original:\n        with path.open(\"a\") as out:out.write(\"\\n\"+text)\nstatus=repo/\"docs/PLAN_STATUS.md\"\nstatus_marker=\"## Проверка на Timeweb 24.10.2026 — сборка 690811a5\"\noriginal=status.read_text()\nif status_marker not in original:\n    with status.open(\"a\") as out:\n        out.write(\"\\n\"+status_marker+\"\\n\\nF01/F16/F22/F23. На сервере Timeweb 9408159 завершены JVM (143 tests, 0 failures/errors/skips), lintDebug/lintPreview, assembleDebug/assembleRelease/assemblePreview и отдельный UI driver. Проверены meshes и native/ZIP alignment 16 KB, подпись исходным сертификатом, API37 и portrait обеих production-активностей. Preview APK SHA256: \"+digest+\". Проверка: GitHub transport run 40075308670, выполнение Gradle и verifier только на Timeweb. APK сохранён приватно на Timeweb; не опубликован. Полная runtime-матрица API37 4/16 KB, совместимое обновление и live backend/Telegram остаются открытыми. Сборка не является доказательством готовности приложения или зелёной ветки.\\n\")\nprint(\"TIMEWEB_PRIVATE_BUILD_CHECKPOINT=\"+json.dumps(proof),flush=True)\nprint(\"TIMEWEB_POLICY_CHECKPOINT=\"+json.dumps({\"server_id\":9408159,\"target_city\":\"Saint Petersburg\",\"builder_order_id\":121673,\"modified_docs\":[\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"],\"application_source_unchanged\":True}),flush=True)\n\nevidence=json.loads(\"{\\\"request_date\\\":\\\"2026-10-24\\\",\\\"source_server_id\\\":9408159,\\\"target_location\\\":\\\"ru-1\\\",\\\"target_city\\\":\\\"Saint Petersburg\\\",\\\"checked_preset_ids\\\":[2573,2447,2575,2449,2611,2577,2451],\\\"checked_zones\\\":[\\\"spb-1\\\",\\\"spb-2\\\",\\\"spb-3\\\",\\\"spb-4\\\",\\\"spb-5\\\"],\\\"attempts\\\":[{\\\"preset_id\\\":2573,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2573,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2573,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2573,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2573,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2447,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2447,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2447,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2447,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2447,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2575,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2575,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2575,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2575,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2575,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2449,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2449,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2449,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2449,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2449,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2611,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2611,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2611,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2611,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2611,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2577,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2577,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2577,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2577,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":409,\\\"error_code\\\":\\\"no_free_node\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2577,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2451,\\\"zone\\\":\\\"spb-1\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2451,\\\"zone\\\":\\\"spb-2\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2451,\\\"zone\\\":\\\"spb-3\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2451,\\\"zone\\\":\\\"spb-4\\\",\\\"status\\\":404,\\\"error_code\\\":\\\"preset_not_found\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false},{\\\"preset_id\\\":2451,\\\"zone\\\":\\\"spb-5\\\",\\\"status\\\":400,\\\"error_code\\\":\\\"servers_is_run_out_error\\\",\\\"mentioned_fields\\\":[],\\\"balance_mentioned\\\":false}],\\\"new_server_created\\\":false,\\\"status\\\":\\\"blocked_provider_capacity\\\",\\\"source_preserved\\\":true,\\\"dns_changed\\\":false}\")\nevidence[\"recorded_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\npath=root/\"analyst-ai-spb-migration.json\"\nassert not path.is_symlink()\ndescriptor=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\nwith os.fdopen(descriptor,\"w\") as out:\n    out.write(json.dumps(evidence,ensure_ascii=False,indent=2)+\"\\n\");out.flush();os.fsync(out.fileno())\npolicy=root/\"analyst-ai-russian-server-config.json\"\nvalue=json.loads(policy.read_text())\nvalue[\"latest_cloud_relocation_request\"][\"status\"]=\"blocked_provider_capacity\"\nvalue[\"latest_cloud_relocation_request\"][\"capacity_evidence_file\"]=str(path)\ntemp=policy.with_suffix(\".json.final\")\nassert not temp.exists() and not temp.is_symlink()\ndescriptor=os.open(temp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\nwith os.fdopen(descriptor,\"w\") as out:\n    out.write(json.dumps(value,ensure_ascii=False,indent=2)+\"\\n\");out.flush();os.fsync(out.fileno())\nos.replace(temp,policy)\nfailure_marker=\"### Перенос первого облачного сервера в Санкт-Петербург — фактическая проверка 24.10.2026\"\nstatus=repo/\"docs/PLAN_STATUS.md\"\nif failure_marker not in status.read_text():\n    with status.open(\"a\") as out:\n        out.write(\"\\n\"+failure_marker+\"\\n\\nПроверено 7 минимальных доступных в каталоге тарифов (1–2 vCPU, 1–2 GB RAM) во всех пяти зонах spb-1…spb-5: 35 отказов создания, коды no_free_node, preset_not_found и servers_is_run_out_error. Результат: новый сервер не создан, DNS не переключён, исходный сервер 9408159 и данные сохранены. Это внешний отказ ёмкости, не PASS развёртывания. Последняя проверка выделенного заказа 121673: installing, IP отсутствует; SSH/KVM и полная Android-матрица на нём ещё не проверены.\\n\\nAI Gateway: одна новая запись ключа с лимитами 10 RUB/day и 30 RUB/month; оплачиваемые inference-запросы не выполнялись. Фактический GET /v1/models с сохранённым значением вернул HTTP401: выдано замаскированное значение вместо рабочего виртуального ключа. Авторизация ИИ и production-конфигурация остаются открытыми; секреты не публикуются.\\n\")\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"TIMEWEB_RELOCATION_CHECKPOINT=\"+json.dumps({\"source_server_id\":9408159,\"target_city\":\"Saint Petersburg\",\"status\":evidence[\"status\"],\"attempt_count\":len(evidence[\"attempts\"]),\"preset_count\":len(evidence[\"checked_preset_ids\"]),\"source_preserved\":True,\"dns_changed\":False,\"provider_error_codes\":sorted({row[\"error_code\"] for row in evidence[\"attempts\"]}),\"docs_diff_check\":\"PASS\"}),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=60).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9408159/ssh-keys/"+str(identifier))
                  access.request(token,"DELETE","/ssh-keys/"+str(identifier))
                  print("TIMEWEB_MONITOR_KEY=removed",flush=True)
          req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
