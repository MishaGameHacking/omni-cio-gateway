name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-direct-server-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Observe the directly requested Moscow physical server without creating a second order
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          doc=get("/dedicated-servers")
          rows=doc["dedicated_servers"]
          assert doc.get("meta",{}).get("total")==len(rows),"incomplete_dedicated_inventory"
          selected=[r for r in rows if r.get("name")=="analyst-ai-msk-20261024" and r.get("comment")=="Analyst AI owner authorized Moscow work server 2026-10-24"]
          print("MOSCOW_DIRECT_ORDER_OBSERVATION="+json.dumps({"count":len(rows),"matching_orders":len(selected),"servers":[{k:s.get(k) for k in ("id","name","status","preset_id","location","price","ip","created_at","os_id","bandwidth_id","project_id","is_pre_installed","autoinstall_ready")} for s in selected]}),flush=True)
          fin=get("/account/finances")["finances"]
          account=get("/account/status")["status"]
          print("MOSCOW_DIRECT_ORDER_ACCOUNT="+json.dumps({"balance_positive":Decimal(str(fin["balance"]))>0,"hourly_billing":Decimal(str(fin["hourly_fee"]))>0,"blocked":account["is_blocked"]}),flush=True)
          cloud=p.read_resource(token,"servers")
          assert p.summarize("servers",cloud)["complete"]
          print("PRESERVED_CLOUD_SERVER_IDS="+json.dumps([s["id"] for s in cloud["servers"]]),flush=True)
          PY
