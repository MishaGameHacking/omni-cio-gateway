name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      try:
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          status,data=api("GET","/servers/9415007")
          assert status==200
          current=data["server"]
          safe={k:current.get(k) for k in ("id","name","status","project_id","availability_zone","cpu","ram","preset_id","configurator_id","bandwidth","is_ddos_guard")}
          safe["disks"]=[{k:v.get(k) for k in ("id","size","type","is_mounted","used")} for v in current.get("disks",[])]
          safe["os"]={k:current.get("os",{}).get(k) for k in ("id","name","version")}
          print("REDESIGN_CURRENT_TIMEWEB_CONFIGURATION="+json.dumps(safe),flush=True)
          status,pricing=api("GET","/presets/servers")
          assert status==200
          pools=[v for v in pricing.values() if isinstance(v,list)]
          candidates=[]
          for pool in pools:
              for v in pool:
                  if not isinstance(v,dict):continue
                  cpu=v.get("cpu");ram=v.get("ram")
                  if isinstance(cpu,(int,float)) and isinstance(ram,(int,float)) and 1<=cpu<=4 and 1024<=ram<=8192:
                      candidates.append({k:v.get(k) for k in ("id","name","description","cpu","cpu_frequency","ram","disk","disk_type","price","price_hour","currency","location","availability_zone","type","is_visible","is_available")})
          print("REDESIGN_TIMEWEB_CURRENT_PRESETS="+json.dumps({"top_keys":list(pricing),"candidates":candidates}),flush=True)
          with_ams("import datetime,json,os,pathlib,shutil,subprocess,time\ndef run(args,timeout=20):\n    r=subprocess.run(args,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=timeout)\n    return {'exit_code':r.returncode,'stdout':r.stdout[:24000],'stderr':r.stderr[:500]}\ndef memory():\n    return {k:int(v.split()[0])*1024 for k,v in (line.split(':',1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ('MemTotal','MemAvailable','SwapTotal','SwapFree')}\ndef service():\n    fields=('ActiveState','SubState','MainPID','MemoryCurrent','MemoryPeak','CPUUsageNSec','TasksCurrent','NRestarts','ControlGroup','ActiveEnterTimestamp')\n    r=run(['systemctl','show','analyst-ai-owner.service',*['--property='+k for k in fields]])\n    assert r['exit_code']==0\n    return dict(l.split('=',1) for l in r['stdout'].splitlines() if '=' in l)\nstart=time.monotonic();first=service()\nout={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'kind':'runtime_capacity_readonly','cpu_count':os.cpu_count(),'load_average':os.getloadavg(),'memory':memory(),'disk':dict(zip(('total_bytes','used_bytes','free_bytes'),shutil.disk_usage('/'))),'service_before':first,'directories':{}}\nfor name in ('/opt/analyst-ai/backend','/opt/analyst-ai/venv','/var/lib/analyst-ai','/srv/analyst-ai-ota','/srv/analyst-ai/workspace','/var/lib/analyst-ai-build'):\n    p=pathlib.Path(name)\n    if p.exists():\n        r=run(['du','-s','-x','-B1',name],timeout=30)\n        out['directories'][name]={'exit_code':r['exit_code'],'allocated_bytes':int(r['stdout'].split()[0]) if r['exit_code']==0 else None}\nout['analyst_units']=run(['systemctl','list-units','--all','--no-pager','--plain','analyst-ai-*'])['stdout']\np=pathlib.Path('/var/lib/analyst-ai/backend.db')\nout['database_bytes']=p.stat().st_size\nwhile time.monotonic()-start<30:time.sleep(min(1,30-(time.monotonic()-start)))\nlast=service();elapsed=time.monotonic()-start\nout['service_after']=last;out['sample_seconds']=round(elapsed,3)\nif first['MainPID']==last['MainPID'] and first['CPUUsageNSec'].isdigit() and last['CPUUsageNSec'].isdigit():\n    out['service_cpu_percent_of_one_core']=round((int(last['CPUUsageNSec'])-int(first['CPUUsageNSec']))/(elapsed*1e9)*100,3)\nout['resource_changes_performed']=False;out['trading_actions_performed']=False\nprint('REDESIGN_TIMEWEB_RUNTIME_CAPACITY='+json.dumps(out),flush=True)\n",timeout=180)
          PY
