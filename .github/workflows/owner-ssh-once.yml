X(c.observed_at) AS last_observed_at\n FROM client_versions c JOIN sessions s ON s.token_hash=c.session_hash AND s.user_id=c.user_id\n JOIN users u ON u.id=c.user_id JOIN installation_owner o ON o.singleton=1 AND o.telegram_sub=u.telegram_sub\n WHERE s.expires_at>? AND c.package_name IN ('ru.omnicio.app.debug','ru.omnicio.app')\n GROUP BY c.package_name,c.version_code,c.release_sha256 ORDER BY c.package_name,c.version_code'''\nrows=[dict(r) for r in db.execute(sql,(int(time.time()),))]\ndb.close()\nprint('REDESIGN_ACTUAL_CLIENT_OBSERVATIONS='+json.dumps({'observed_at':int(time.time()),'sessions':rows,'source':'read-only existing authenticated client records','physical_phone_attested':False}),flush=True)\n\"\"\"\nresult=subprocess.run(['runuser','-u','analyst-ai','--','/opt/analyst-ai/venv/bin/python','-c',probe],capture_output=True,text=True,timeout=15,env={'PATH':'/usr/bin:/bin','PYTHONDONTWRITEBYTECODE':'1'})\nprint(result.stdout,flush=True)\nif result.returncode:print('READONLY_CLIENT_PROBE_ERROR='+result.stderr[-1000:],flush=True)\nassert result.returncode==0\n",timeout=120)
