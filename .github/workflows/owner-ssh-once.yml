name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-catalog
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect Moscow offers and the existing server warning flags
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          print("MOSCOW_CLOUD_INVENTORY="+json.dumps([{k:r.get(k) for k in ("id","name","location","availability_zone","cpu","ram","bandwidth","preset_id","configurator_id","status")} for r in doc["servers"]]),flush=True)
          old=get("/servers/9408159")["server"]
          assert old["id"]==9408159 and old["name"]=="analyst-ai-owner-route-20261023"
          safe={k:old.get(k) for k in ("id","status","location","availability_zone","bandwidth","cpu","ram","is_qemu_guest_agent","is_need_reboot","is_need_restart","is_enabled","is_autobackup_active")}
          safe["boolean_flags"]={k:v for k,v in old.items() if isinstance(v,bool)}
          safe["status_field_names"]=[k for k in old if any(s in k.lower() for s in ("error","warn","alert","task","status","reboot","restart","config","update"))]
          safe["response_field_names"]=sorted(old)
          print("MOSCOW_SOURCE_STATUS="+json.dumps(safe),flush=True)
          cfg=get("/configurator/servers")["server_configurators"]
          print("MOSCOW_CONFIGURATORS="+json.dumps([r for r in cfg if r.get("location")=="ru-3"]),flush=True)
          presets=p.read_catalog(token,"presets")["server_presets"]
          print("MOSCOW_PRESETS="+json.dumps([r for r in presets if r.get("location")=="ru-3" and r.get("cpu",0)<=2 and r.get("ram",0)<=4096]),flush=True)
          new=get("/dedicated-servers/121673")["dedicated_server"]
          print("MOSCOW_DEDICATED_CURRENT="+json.dumps({k:new.get(k) for k in ("id","name","status","ip","location","price","autoinstall_ready")}),flush=True)
          
          PY
