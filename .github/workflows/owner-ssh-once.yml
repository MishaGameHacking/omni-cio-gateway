name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify the preserved Timeweb sources and original APK signing certificate before migration
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          assert {s["id"] for s in servers["servers"]}=={9408159},"inventory_changed_reconcile_before_status_write"
          print("RUSSIA_FINAL_INVENTORY="+json.dumps([{k:s.get(k) for k in ("id","name","status","cpu","ram","location")} for s in servers["servers"]]),flush=True)
          import shlex
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          original_select=adopt.select_target
          observed=servers["servers"][0]
          assert observed["ram"] in {1024,3072} and observed["cpu"]==1
          def select_target(new):
              original_select(new)
              if new:p.CONFIGURATION["ram"]=observed["ram"]
          adopt.select_target=select_target
          def save_policy(command):
              script="import datetime,hashlib,json,os,pathlib,stat,subprocess\nos.umask(0o077)\ndef digest(path):\n    h=hashlib.sha256()\n    with path.open(\"rb\") as stream:\n        for block in iter(lambda:stream.read(1024*1024),b\"\"):h.update(block)\n    return h.hexdigest()\nroots=[(\"/root/analyst-ai-android-690811a5\",\"690811a5a376181990a64f37d914c87eb6c919b7\",set()),(\"/root/analyst-ai-development-79be1821\",\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\",{\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"})]\nentries=[]\nsummary=[]\nfor path,expected,allowed in roots:\n    root=pathlib.Path(path)\n    head=subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root,text=True).strip()\n    assert head==expected,\"source_head_changed\"\n    changed=set(subprocess.check_output([\"git\",\"diff\",\"HEAD\",\"--name-only\"],cwd=root,text=True).splitlines())\n    assert changed<=allowed,\"unexpected_source_changes\"\n    files=subprocess.check_output([\"git\",\"ls-files\",\"-z\"],cwd=root).decode().strip(\"\\0\").split(\"\\0\")\n    assert files and all(files)\n    for name in files:\n        file=root/name\n        assert file.is_file() and not file.is_symlink(),\"unsupported_tracked_entry\"\n        entries.append({\"path\":str(file),\"size\":file.stat().st_size,\"sha256\":digest(file)})\n    summary.append({\"path\":path,\"head\":head,\"tracked_files\":len(files),\"modified_documents\":sorted(changed)})\nkey=pathlib.Path(\"/root/.android/debug.keystore\")\nassert key.is_file() and not key.is_symlink() and stat.S_IMODE(key.stat().st_mode)==0o600,\"signing_key_permissions\"\ncert=subprocess.check_output([\"/usr/lib/jvm/java-17-openjdk-amd64/bin/keytool\",\"-exportcert\",\"-alias\",\"androiddebugkey\",\"-keystore\",str(key),\"-storepass\",\"android\"],stderr=subprocess.PIPE)\nfingerprint=hashlib.sha256(cert).hexdigest()\nassert fingerprint==\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\",\"apk_certificate_changed_do_not_regenerate\"\nfor name in (\"/root/.android/debug.keystore\",\"/root/analyst-ai-enrollment.json\",\"/root/analyst-ai-russian-server-config.json\"):\n    path=pathlib.Path(name)\n    assert path.is_file() and not path.is_symlink() and stat.S_IMODE(path.stat().st_mode)==0o600,\"private_source_permissions\"\n    entries.append({\"path\":str(path),\"size\":path.stat().st_size,\"sha256\":digest(path),\"mode\":\"0600\"})\nreport={\"source_server\":9408159,\"target_dedicated_server\":121673,\"prepared_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_roots\":summary,\"apk_signing_certificate_sha256\":fingerprint,\"files\":entries,\"cache_roots\":[\"/opt/analyst-android-sdk\",\"/root/.gradle\",\"/root/.android\"],\"preserve_until_migration_verified\":True,\"migration_complete\":False}\ntarget=pathlib.Path(\"/root/analyst-ai-moscow-transfer.json\")\nassert not target.is_symlink()\ntarget.write_text(json.dumps(report,ensure_ascii=False,indent=2)+\"\\n\")\ntarget.chmod(0o600)\nassert json.loads(target.read_text())==report\nprint(\"MOSCOW_TRANSFER_SOURCE_VERIFIED=\"+json.dumps({\"source_server\":9408159,\"target_server\":121673,\"manifest_path\":str(target),\"tracked_sources\":summary,\"verified_files\":len(entries),\"apk_signing_certificate_sha256\":fingerprint,\"migration_complete\":False},ensure_ascii=False),flush=True)\n"
              out=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=180)
              print(out.decode(),end="",flush=True)
          access.develop_backend=save_policy
          adopt.run(development=True)
          new=get("/dedicated-servers/121673")["dedicated_server"]
          assert new["id"]==121673 and new["name"]=="analyst-ai-msk-20261024" and new["preset_id"]==6007 and new["location"]=="ru-3"
          print("MOSCOW_ORDER_AFTER_SOURCE_CHECK="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          PY
