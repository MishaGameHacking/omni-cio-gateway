\n    tmp=work/\\\"completion-status.tmp\\\";tmp.write_text(json.dumps(state)+\\\"\\\\n\\\");tmp.chmod(0o600);os.replace(tmp,work/\\\"completion-status.json\\\")\\ndef tmux(*args):\\n    return subprocess.run([\\\"tmux\\\",\\\"-S\\\",str(socket),*args],capture_output=True,text=True,timeout=10,check=True).stdout\\nsave()\\ndeadline=time.monotonic()+720\\nwhile time.monotonic()<deadline:\\n    pane=tmux(\\\"capture-pane\\\",\\\"-p\\\",\\\"-J\\\",\\\"-S\\\",\\\"-150\\\",\\\"-t\\\",\\\"owner:0.0\\\")\\n    marker=\\\"Verified Telegram identity (profile hints do not authorize access):\\\\n\\\"\\n    if not state[\\\"bound\\\"] and (work/\\\"login-handoff-armed\\\").is_file() and marker in pane:\\n        assert pane.count(marker)==1\\n        identity=json.JSONDecoder().raw_decode(pane.split(marker,1)[1].lstrip())[0]\\n        assert isinstance(identity,dict) and isinstance(identity.get(\\\"sub\\\"),str)\\n        if not hmac.compare_digest(identity[\\\"sub\\\"],expected):\\n            tmux(\\\"send-keys\\\",\\\"-t\\\",\\\"owner:0.0\\\",\\\"C-c\\\")\\n            state[\\\"phase\\\"]=\\\"different_verified_account_refused\\\";save();sys.exit(1)\\n        if \\\"Check that this is your intended owner.\\\" in pane:\\n            tty=tmux(\\\"display-message\\\",\\\"-p\\\",\\\"-t\\\",\\\"owner:0.0\\\",\\\"#{pane_tty}\\\").strip()\\n            fd=os.open(tty,os.O_RDONLY|os.O_NOCTTY|os.O_NOFOLLOW)\\n            try:\\n                info=os.fstat(fd)\\n                assert stat.S_ISCHR(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\\n                ready=not termios.tcgetattr(fd)[3]&termios.ECHO\\n            finally:os.close(fd)\\n            if ready:\\n                expiry=datetime.datetime.fromisoformat(json.loads((work/\\\"state.json\\\").read_text())[\\\"expires_at_utc\\\"])\\n                assert expiry>datetime.datetime.now(datetime.timezone.utc),\\\"fresh_verification_expired\\\"\\n                tmux(\\\"send-keys\\\",\\\"-l\\\",\\