name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          with_ams("\nimport pathlib,subprocess,json,urllib.request,urllib.error,ssl\nscript=pathlib.Path(\"/root/analyst-runtime-preparation.py\")\nassert not script.exists()\nscript.write_text(\"\\nimport pathlib,subprocess,json,time,os,hashlib,urllib.request,shutil,datetime,pwd\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\");state=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\");sdk=pathlib.Path(\\\"/opt/analyst-android-sdk\\\")\\nproof=pathlib.Path(\\\"/var/lib/analyst-ai-ops/runtime-preparation.json\\\")\\nreport={\\\"started_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"status\\\":\\\"waiting_for_build\\\"}\\ndef save():\\n    proof.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");proof.chmod(0o600)\\nsave()\\ntry:\\n    for attempt in range(360):\\n        build=json.loads((state/\\\"build-result.json\\\").read_text())\\n        if build[\\\"status\\\"]!=\\\"running\\\":break\\n        time.sleep(5)\\n    else:raise RuntimeError(\\\"build_wait_deadline\\\")\\n    assert build[\\\"status\\\"]==\\\"passed\\\",\\\"build_failed_runtime_preparation_paused\\\"\\n    assert shutil.disk_usage(root).free>=10*1024**3,\\\"runtime_sdk_disk_insufficient\\\"\\n    report[\\\"status\\\"]=\\\"installing_android_runtime\\\";save()\\n    env={**os.environ,\\\"JAVA_HOME\\\":\\\"/usr/lib/jvm/java-17-openjdk-amd64\\\",\\\"ANDROID_HOME\\\":str(sdk),\\\"ANDROID_SDK_ROOT\\\":str(sdk)}\\n    subprocess.run([\\\"runuser\\\",\\\"-u\\\",\\\"analyst-build\\\",\\\"--\\\",str(state/\\\"venv/bin/python\\\"),str(root/\\\".github/scripts/prepare_android_sdk.py\\\"),\\\"--sdk\\\",str(sdk),\\\"--runtime\\\"],cwd=root,env=env,check=True,timeout=1800)\\n    path=state/\\\"previous-0.10.0.apk\\\";temporary=state/\\\"previous-0.10.0.download\\\"\\n    url=\\\"https://github.com/MishaGameHacking/omni-cio-gateway/releases/download/android-preview-0a894dddfa858efe6c7be60aea78935adec84c1b/Analyst-AI-0.10.0-preview-0a894dd.apk\\\"\\n    with urllib.request.urlopen(url,timeout=60) as source,temporary.open(\\\"wb\\\") as target:shutil.copyfileobj(source,target)\\n    assert hashlib.sha256(temporary.read_bytes()).hexdigest()==\\\"3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3\\\"\\n    owner=pwd.getpwnam(\\\"analyst-build\\\");os.chown(temporary,owner.pw_uid,owner.pw_gid);temporary.chmod(0o640);os.replace(temporary,path)\\n    acceleration=subprocess.run([str(sdk/\\\"emulator/emulator\\\"),\\\"-accel-check\\\"],capture_output=True,text=True,timeout=30)\\n    version=subprocess.run([str(sdk/\\\"emulator/emulator\\\"),\\\"-version\\\"],capture_output=True,text=True,timeout=30)\\n    assert version.returncode==0,\\\"emulator_binary_cannot_start\\\"\\n    report.update({\\\"status\\\":\\\"prepared\\\",\\\"finished_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"build_source_sha256\\\":build[\\\"source_sha256\\\"],\\\"runtime_images\\\":[\\\"api37-4096\\\",\\\"api37-16384\\\"],\\\"acceleration\\\":acceleration.stdout.strip(),\\\"acceleration_exit\\\":acceleration.returncode,\\\"disk_free\\\":shutil.disk_usage(root).free,\\\"previous_apk_sha256\\\":\\\"3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3\\\",\\\"runtime_tests_passed\\\":False})\\n    save();print(\\\"AMS_RUNTIME_TOOLS_PREPARED=\\\"+json.dumps(report),flush=True)\\nexcept Exception as error:\\n    report.update({\\\"status\\\":\\\"failed\\\",\\\"error_type\\\":type(error).__name__,\\\"error\\\":str(error)});save();raise\\n\");script.chmod(0o700)\ncompile(script.read_text(),str(script),\"exec\")\nsubprocess.run([\"systemd-run\",\"--unit=analyst-runtime-preparation\",\"--property=Type=exec\",\"--property=RuntimeMaxSec=1h\",\"--property=MemoryMax=1024M\",\"--property=CPUWeight=10\",\"--property=StandardOutput=append:/var/log/analyst-runtime-preparation.log\",\"--property=StandardError=append:/var/log/analyst-runtime-preparation.log\",\"/usr/bin/python3\",str(script)],check=True)\ntry:\n    with urllib.request.urlopen(\"https://analyst-ai-2941515.twc1.net/health\",timeout=20) as response:status=response.status\nexcept urllib.error.HTTPError as error:status=error.code\nprint(\"AMS_TLS_VERIFIED=\"+json.dumps({\"certificate_verification\":True,\"http_status\":status,\"expected_maintenance\":status==503}),flush=True)\nprint(\"AMS_RUNTIME_PREPARATION_QUEUED_AFTER_BUILD=true\",flush=True)\n")
          PY
