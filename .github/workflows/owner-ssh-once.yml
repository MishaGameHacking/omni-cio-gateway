name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-build-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Observe actual memory, disk and build progress on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,shlex,subprocess,sys
          sys.path.insert(0,"deploy")
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          import prepare_owner_vm as prepare
          def execute_remote(command):
              script="import json,pathlib,shutil,subprocess,time\nfor sample in range(3):\n    mem={line.split()[0].rstrip(\":\"):int(line.split()[1]) for line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if line.startswith((\"MemTotal:\",\"MemAvailable:\",\"SwapTotal:\",\"SwapFree:\"))}\n    processes=[]\n    for directory in pathlib.Path(\"/proc\").iterdir():\n        if not directory.name.isdecimal():continue\n        try:\n            name=(directory/\"comm\").read_text().strip()\n            if name not in {\"java\",\"aapt2\"}:continue\n            rows=(directory/\"status\").read_text().splitlines()\n            details={\"pid\":int(directory.name),\"name\":name}\n            for line in rows:\n                if line.startswith((\"State:\",\"VmRSS:\",\"VmSwap:\",\"Threads:\")):\n                    key,_,value=line.partition(\":\");details[key]=value.strip()\n            processes.append(details)\n        except (FileNotFoundError,ProcessLookupError,PermissionError):continue\n    report={\"time_utc\":time.strftime(\"%Y-%m-%dT%H:%M:%SZ\",time.gmtime()),\"memory_kib\":mem,\"disk_free_gib\":round(shutil.disk_usage(\"/\").free/1024**3,2),\"build_processes\":processes,\"ephemeral_encryption_key_removed\":not pathlib.Path(\"/root/analyst-signing-transfer-40062413701\").exists()}\n    progress=pathlib.Path(\"/root/analyst-android-build-result.json\")\n    if progress.is_file():\n        data=json.loads(progress.read_text())\n        report[\"completed_phases\"]=data.get(\"phases\",[])\n        report[\"completed_at_utc\"]=data.get(\"completed_at_utc\")\n    kernel=subprocess.run([\"dmesg\",\"--level=err,crit,alert,emerg\"],capture_output=True,text=True,timeout=10)\n    report[\"kernel_oom_lines\"]=[line for line in kernel.stdout.splitlines() if \"out of memory\" in line.lower() or \"killed process\" in line.lower()][-6:]\n    print(\"TIMEWEB_BUILD_RESOURCE_SNAPSHOT=\"+json.dumps(report,sort_keys=True),flush=True)\n    if sample<2:time.sleep(20)\n"
              result=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],timeout=180)
              if result.returncode:raise prepare.ProbeError("timeweb_build_observation_failed_"+str(result.returncode))
          access.develop_backend=execute_remote
          adopt.run(development=True)
          PY
