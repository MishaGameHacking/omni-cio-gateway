name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-publish-coordinator
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Prepare the user-requested installable APK on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import json,os,pathlib,subprocess,sys\nos.umask(0o077)\nw=pathlib.Path(\"/root/analyst-apk-direct-20261024\")\ndata=json.load(sys.stdin)\nassert w.is_dir() and not (w/\"deliver.py\").exists()\n(w/\"deliver.py\").write_text(data[\"delivery\"])\n(w/\"publish.py\").write_text(data[\"publish\"])\nsubprocess.run([\"systemd-run\",\"--no-block\",\"--unit=analyst-direct-apk-delivery\",\"--property=Type=oneshot\",\"--property=StandardOutput=append:/root/analyst-apk-direct-20261024/delivery-runner.log\",\"--property=StandardError=append:/root/analyst-apk-direct-20261024/delivery-runner.log\",\"/usr/bin/python3\",\"-u\",str(w/\"deliver.py\")],check=True,capture_output=True)\nprint(\"TIMEWEB_APK_DELIVERY_WAIT_STARTED=true\")\n"
                      payload="{\"delivery\":\"import datetime,fcntl,hashlib,json,os,pathlib,shlex,subprocess,time,traceback\\nos.umask(0o077)\\nw=pathlib.Path(\\\"/root/analyst-apk-direct-20261024\\\");r=json.loads((w/\\\"builder.json\\\").read_text())\\nassert r[\\\"id\\\"]==9414007 and r[\\\"ip\\\"]==\\\"147.45.153.40\\\"\\nlock=open(w/\\\"delivery.lock\\\",\\\"a\\\");fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\nknown=w/\\\"builder-known-hosts\\\";known.write_text(r[\\\"ip\\\"]+\\\" \\\"+r[\\\"host_public\\\"]+\\\"\\\\n\\\");known.chmod(0o600)\\nbc=[\\\"ssh\\\",\\\"-F\\\",\\\"/dev/null\\\",\\\"-i\\\",str(w/\\\"builder-key\\\"),\\\"-o\\\",\\\"BatchMode=yes\\\",\\\"-o\\\",\\\"IdentitiesOnly=yes\\\",\\\"-o\\\",\\\"ConnectTimeout=10\\\",\\\"-o\\\",\\\"StrictHostKeyChecking=yes\\\",\\\"-o\\\",\\\"HostKeyAlgorithms=ssh-ed25519\\\",\\\"-o\\\",\\\"UserKnownHostsFile=\\\"+str(known),\\\"-o\\\",\\\"ServerAliveInterval=20\\\",\\\"-o\\\",\\\"ServerAliveCountMax=3\\\",\\\"root@\\\"+r[\\\"ip\\\"]]\\nstate={\\\"status\\\":\\\"waiting_for_build\\\",\\\"server_id\\\":r[\\\"id\\\"],\\\"started_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\\ndef save():\\n    (w/\\\"delivery-status.json\\\").write_text(json.dumps(state,ensure_ascii=False)+\\\"\\\\n\\\")\\ndef remote(command,timeout=45):\\n    p=subprocess.run(bc+[command],capture_output=True,timeout=timeout)\\n    if p.returncode:raise RuntimeError(\\\"builder_read_failed_\\\"+str(p.returncode))\\n    return p.stdout\\ntry:\\n    save()\\n    for _ in range(240):\\n        result=json.loads(remote(\\\"cat /root/analyst-apk-build/result.json\\\"))\\n        state[\\\"build_status\\\"]=result[\\\"status\\\"];state[\\\"phase\\\"]=result.get(\\\"phase\\\");save()\\n        if result[\\\"status\\\"]==\\\"build_verified_runtime_pending\\\":break\\n        if result[\\\"status\\\"]==\\\"failed\\\":raise RuntimeError(\\\"actual_build_failed_\\\"+result.get(\\\"error_type\\\",\\\"unknown\\\"))\\n        time.sleep(15)\\n    else:raise RuntimeError(\\\"bounded_build_wait_timeout\\\")\\n    assert result[\\\"compiled_live_origin\\\"] and result[\\\"previous_signature_matches\\\"]\\n    assert result[\\\"apk\\\"][\\\"version_code\\\"]==35 and result[\\\"apk\\\"][\\\"phone_orientation\\\"]==\\\"portrait\\\"\\n    (w/\\\"build-result.json\\\").write_text(json.dumps(result,ensure_ascii=False,indent=2)+\\\"\\\\n\\\")\\n    state[\\\"status\\\"]=\\\"copying_verified_apk\\\";save()\\n    apk=w/\\\"Analyst-AI-0.11.0-preview.apk\\\"\\n    assert not apk.exists()\\n    with apk.open(\\\"xb\\\") as out:\\n        copied=subprocess.run(bc+[\\\"cat /root/analyst-apk-build/Analyst-AI-0.11.0-preview.apk\\\"],stdout=out,stderr=subprocess.PIPE,timeout=120)\\n    assert copied.returncode==0 and apk.stat().st_size==result[\\\"apk\\\"][\\\"bytes\\\"] and hashlib.sha256(apk.read_bytes()).hexdigest()==result[\\\"apk\\\"][\\\"sha256\\\"]\\n    evidence=w/\\\"build-evidence.tar.gz\\\"\\n    assert not evidence.exists()\\n    archive=\\\"tar -czf - -C /root analyst-apk-build/build.py analyst-apk-build/build.log analyst-apk-build/result.json analyst-apk-build/source.diff analyst-ai-android-690811a5/app/build/test-results/testDebugUnitTest analyst-ai-android-690811a5/app/build/reports analyst-ai-android-690811a5/app/build/outputs/mapping/preview analyst-ai-android-690811a5/app/build/outputs/apk/preview/apk-verification.json analyst-ai-android-690811a5/app/build/outputs/apk/preview/signature.txt analyst-ai-android-690811a5/app/build/outputs/apk/preview/badging.txt analyst-ai-android-690811a5/app/build/outputs/apk/preview/manifest.txt analyst-ai-android-690811a5/app/build/outputs/apk/preview/alignment.txt\\\"\\n    with evidence.open(\\\"xb\\\") as out:\\n        copied=subprocess.run(bc+[archive],stdout=out,stderr=subprocess.PIPE,timeout=120)\\n    assert copied.returncode==0 and evidence.stat().st_size>0,\\\"build_evidence_copy_failed\\\"\\n    state[\\\"evidence_sha256\\\"]=hashlib.sha256(evidence.read_bytes()).hexdigest()\\n    state[\\\"status\\\"]=\\\"publishing_verified_apk\\\";save()\\n    p=subprocess.run([\\\"/opt/analyst-ai/venv/bin/python\\\",\\\"-u\\\",str(w/\\\"publish.py\\\")],capture_output=True,text=True,timeout=90)\\n    (w/\\\"publish.log\\\").write_text(p.stdout+\\\"\\\\n\\\"+p.stderr)\\n    assert p.returncode==0,\\\"apk_publish_failed\\\"\\n    delivery=json.loads((w/\\\"delivery.json\\\").read_text())\\n    state[\\\"status\\\"]=\\\"published\\\";state[\\\"url\\\"]=delivery[\\\"url\\\"];state[\\\"apk_sha256\\\"]=result[\\\"apk\\\"][\\\"sha256\\\"];state[\\\"finished_at\\\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\\nexcept BaseException as e:\\n    state[\\\"status\\\"]=\\\"failed\\\";state[\\\"error_type\\\"]=type(e).__name__;state[\\\"error\\\"]=str(e);save()\\n    (w/\\\"delivery-failure.txt\\\").write_text(traceback.format_exc())\\n    raise\\nprint(\\\"TIMEWEB_DIRECT_APK_DELIVERY=\\\"+json.dumps(state,ensure_ascii=False),flush=True)\\n\",\"publish\":\"import datetime,grp,hashlib,json,os,pathlib,pwd,shutil,sys,urllib.request\\nos.umask(0o077)\\nwork=pathlib.Path(\\\"/root/analyst-apk-direct-20261024\\\")\\nreport=json.loads((work/\\\"build-result.json\\\").read_text())\\nassert report[\\\"status\\\"]==\\\"build_verified_runtime_pending\\\" and report[\\\"compiled_live_origin\\\"] and report[\\\"previous_signature_matches\\\"]\\nassert report[\\\"source_diff_sha256\\\"]==\\\"9a5cd88b474118a675c8c98f845d10ad665b5769e5f6ccb4ed2c0b93c58d6f02\\\"\\na=report[\\\"apk\\\"]\\nassert a[\\\"package\\\"]==\\\"ru.omnicio.app.debug\\\" and a[\\\"version_code\\\"]==35 and a[\\\"version_name\\\"]==\\\"0.11.0-preview\\\"\\nassert a[\\\"certificate_sha256\\\"]==\\\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\\\"\\nassert a[\\\"phone_orientation\\\"]==\\\"portrait\\\" and a[\\\"min_sdk\\\"]==37 and a[\\\"signature_v2\\\"] and a[\\\"zipalign_16kb\\\"]\\nsrc=work/\\\"Analyst-AI-0.11.0-preview.apk\\\"\\nassert not src.is_symlink() and src.stat().st_size==a[\\\"bytes\\\"] and hashlib.sha256(src.read_bytes()).hexdigest()==a[\\\"sha256\\\"]\\nsys.path.insert(0,\\\"/opt/analyst-ai\\\")\\nfrom backend.client_updates import AndroidRelease,ReleaseChannel\\nnotes=\\\"0.11.0-preview: 3D-интерфейс, только вертикальная ориентация, новый сервер Timeweb. Сборка для ручной установки по запросу владельца. Полная проверка интерфейса и проверка на телефоне ещё не завершены; ИИ пока не подключён.\\\"\\nrelease=AndroidRelease.parse({\\\"schema_version\\\":1,\\\"package_name\\\":a[\\\"package\\\"],\\\"version_code\\\":a[\\\"version_code\\\"],\\\"version_name\\\":a[\\\"version_name\\\"],\\\"apk_sha256\\\":a[\\\"sha256\\\"],\\\"apk_bytes\\\":a[\\\"bytes\\\"],\\\"certificate_sha256\\\":a[\\\"certificate_sha256\\\"],\\\"min_sdk\\\":a[\\\"min_sdk\\\"],\\\"published_at\\\":int(datetime.datetime.now(datetime.timezone.utc).timestamp()),\\\"notes\\\":notes})\\nenv_lines=pathlib.Path(\\\"/etc/analyst-ai/backend.env\\\").read_text().splitlines()\\nconfigured_release=[l.split(\\\"=\\\",1)[1].strip().strip(\\\"\\\\\\\"\\\\'\\\") for l in env_lines if l.startswith(\\\"ANDROID_RELEASE_DIR=\\\")]\\nassert not configured_release or configured_release==[\\\"/var/lib/analyst-ai/releases\\\"],\\\"unexpected_live_release_directory\\\"\\nchannel_root=pathlib.Path(\\\"/var/lib/analyst-ai/releases\\\")\\ngroup=grp.getgrnam(\\\"analyst-ai\\\").gr_gid\\nfor path in (channel_root,channel_root/release.package_name):\\n    assert not path.is_symlink()\\n    path.mkdir(exist_ok=True,mode=0o750)\\n    os.chown(path,0,group);path.chmod(0o750)\\ndirectory=channel_root/release.package_name\\ncurrent=directory/\\\"current.json\\\"\\nif current.exists():\\n    old=ReleaseChannel(channel_root).current(release.package_name)\\n    assert old.version_code<35 or old.apk_sha256==release.apk_sha256,\\\"different_bytes_already_published_for_same_version\\\"\\ntarget=directory/release.filename\\nif target.exists():assert hashlib.sha256(target.read_bytes()).hexdigest()==release.apk_sha256\\nelse:\\n    temp=directory/(release.filename+\\\".tmp\\\")\\n    assert not temp.exists()\\n    shutil.copyfile(src,temp)\\n    os.chown(temp,0,group);temp.chmod(0o640)\\n    assert hashlib.sha256(temp.read_bytes()).hexdigest()==release.apk_sha256\\n    os.replace(temp,target)\\nmanifest=release.public()\\nfor destination in (directory/(release.filename[:-4]+\\\".json\\\"),current):\\n    assert not destination.is_symlink()\\n    temp=destination.with_name(destination.name+\\\".tmp\\\")\\n    assert not temp.exists()\\n    temp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+\\\"\\\\n\\\")\\n    os.chown(temp,0,group);temp.chmod(0o640)\\n    os.replace(temp,destination)\\nverified=ReleaseChannel(channel_root).current(release.package_name)\\nassert verified.apk_sha256==a[\\\"sha256\\\"] and ReleaseChannel(channel_root).published(release.package_name,release.filename).apk_sha256==a[\\\"sha256\\\"]\\nwith urllib.request.urlopen(\\\"http://127.0.0.1:8080/client/update-policy?package_name=ru.omnicio.app.debug\\\",timeout=15) as response:\\n    live=json.load(response)\\nassert live==manifest\\nwith urllib.request.urlopen(\\\"http://127.0.0.1:8080/health\\\",timeout=10) as response:assert json.load(response)=={\\\"status\\\":\\\"ok\\\"}\\nresult={\\\"url\\\":\\\"https://analyst-ai-2941515.twc1.net\\\"+manifest[\\\"apk_path\\\"],\\\"release\\\":manifest,\\\"build_source_head\\\":report[\\\"source_head\\\"],\\\"build_source_diff_sha256\\\":report[\\\"source_diff_sha256\\\"],\\\"jvm_tests\\\":report[\\\"jvm_tests\\\"],\\\"runtime_matrix_passed\\\":False,\\\"physical_phone_tested\\\":False,\\\"ai_configured\\\":False,\\\"published_at_utc\\\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\\n(work/\\\"delivery.json\\\").write_text(json.dumps(result,ensure_ascii=False,indent=2)+\\\"\\\\n\\\")\\nprint(\\\"TIMEWEB_APK_DELIVERY=\\\"+json.dumps(result,ensure_ascii=False),flush=True)\\n\"}"
                      print(p.remote(command,"python3 -u -c "+shlex.quote(script),payload.encode(),timeout=45).decode(),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
