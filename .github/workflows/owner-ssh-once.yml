name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-repair-observer
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Observe Moscow installation and verify current hourly costs
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          s=get("/servers/9413003")["server"]
          assert s["name"]=="analyst-ai-msk-app-20261024" and s["preset_id"]==6867
          print("MOSCOW_APP_CURRENT="+json.dumps({**{k:s.get(k) for k in ("id","status","status_changed_at","start_at","cpu","ram","is_qemu_agent")},"networks":[{k:n.get(k) for k in ("type","bandwidth")} for n in s["networks"]]}),flush=True)
          ips=get("/floating-ips")
          assert ips["meta"]["total"]==len(ips["ips"])
          ip,=[r for r in ips["ips"] if r["id"]=="a0fc704a-bf26-440a-b55f-facd8db769df"]
          assert ip["ip"]=="81.200.158.176" and ip["resource_id"]==9413003
          print("MOSCOW_IP_COST="+json.dumps({k:ip.get(k) for k in ("id","ip","price","monthly_price","availability_zone","resource_id")}),flush=True)
          d=get("/dedicated-servers/121673")["dedicated_server"]
          print("MOSCOW_BUILDER_CURRENT="+json.dumps({k:d.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          fin=get("/account/finances")["finances"]
          print("MOSCOW_BILLING_CONFIRMED="+json.dumps({"hourly_cost_rub":fin["hourly_cost"],"hourly_fee_rub":fin["hourly_fee"],"monthly_cost_rub":fin["monthly_cost"],"monthly_fee_rub":fin["monthly_fee"],"currency":fin["currency"]}),flush=True)
          
          PY
