name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])

          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=30) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          status,doc=get("/servers/9413105");assert status==200;s=doc["server"]
          print("MAIN_SERVER="+json.dumps({k:s.get(k) for k in ("id","name","status","cpu","ram","preset_id","configurator_id","location","availability_zone","is_ddos_guard","is_enabled")}),flush=True)
          status,presets=get("/presets/servers");assert status==200
          rows=presets["server_presets"]
          wanted=[x for x in rows if x.get("location")=="ru-3" and x.get("cpu",0)<=4 and 2048<=x.get("ram",0)<=8192]
          print("MAIN_UPGRADE_PRESETS="+json.dumps(wanted),flush=True)
          status,configs=get("/configurator/servers");assert status==200
          wanted=[x for x in configs["server_configurators"] if x.get("location")=="ru-3" or x.get("id")==s.get("configurator_id")]
          print("MAIN_CONFIGURATORS="+json.dumps(wanted),flush=True)

          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,json,os,pathlib,shutil,subprocess,tarfile\nroot=pathlib.Path(\"/root\")\ndef run(args,timeout=30):\n    x=subprocess.run(args,capture_output=True,text=True,timeout=timeout)\n    return {\"exit\":x.returncode,\"out\":x.stdout.strip(),\"err\":x.stderr.strip()[-500:]}\nreport={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"disk\":dict(zip((\"total\",\"used\",\"free\"),shutil.disk_usage(\"/\"))),\"cpu_count\":os.cpu_count(),\"kvm_present\":pathlib.Path(\"/dev/kvm\").exists(),\"cpu_virtualization_flags\":any(x in pathlib.Path(\"/proc/cpuinfo\").read_text() for x in (\" vmx \",\" svm \")),\"repos\":{}}\nfor name in (\"analyst-ai-source\",\"analyst-ai-development-79be1821\",\"analyst-ai-android-690811a5\"):\n    p=root/name\n    report[\"repos\"][str(p)]={\"head\":run([\"git\",\"-C\",str(p),\"rev-parse\",\"HEAD\"]),\"status\":run([\"git\",\"-C\",str(p),\"status\",\"--short\"]),\"size\":run([\"du\",\"-sx\",str(p)])}\nreport[\"root_sizes\"]=run([\"du\",\"-x\",\"--max-depth=1\",\"/root\"],60)\nreport[\"opt_sizes\"]=run([\"du\",\"-x\",\"--max-depth=2\",\"/opt\"],60)\nreport[\"tools\"]={tool:run([\"sh\",\"-c\",command]) for tool,command in {\"java\":\"java -version\",\"python\":\"python3 --version\",\"node\":\"node --version\",\"sdk\":\"find /opt /root -maxdepth 4 -name sdkmanager -o -name adb -o -name android.jar -o -name emulator\",\"php\":\"dpkg-query -W 'php*' 2>/dev/null\",\"failed_units\":\"systemctl --failed --no-pager --no-legend\"}.items()}\nreport[\"meminfo\"]={l.split(\":\")[0]:int(l.split()[1])*1024 for l in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if l.startswith((\"MemTotal:\",\"MemAvailable:\",\"SwapTotal:\"))}\nreport[\"timer\"]=run([\"systemctl\",\"is-active\",\"analyst-resource-observer.timer\"])\nbuild=json.loads((root/\"analyst-apk-direct-20261024/build-result.json\").read_text());report[\"build_result\"]=build\nwith tarfile.open(root/\"analyst-apk-direct-20261024/build-evidence.tar.gz\") as tar:report[\"build_archive_files\"]=[x.name for x in tar.getmembers() if x.name.endswith(\".py\")]\nwork=root/\"analyst-workspace-preparation-20261024\";work.mkdir(mode=0o700,exist_ok=True)\n(work/\"initial-inventory.json\").write_text(json.dumps(report,indent=2)+\"\\n\")\nprint(\"MAIN_WORKSPACE_AUDIT=\"+json.dumps(report),flush=True)\n"
                      outcome=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],capture_output=True,timeout=180)
                      print(outcome.stdout.decode(),flush=True)
                      if outcome.returncode:print("AUDIT_FAILURE="+outcome.stderr.decode(errors="replace")[-1500:],flush=True)
                      assert outcome.returncode==0
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
