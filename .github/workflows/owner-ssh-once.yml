name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-build-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read real Timeweb build progress and current Moscow provisioning
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          adopt.select_target(True)
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          observed=[s for s in doc["servers"] if s["id"]==9408159]
          assert len(observed)==1 and observed[0]["ram"]==3072 and observed[0]["cpu"]==1
          p.CONFIGURATION["ram"]=3072
          adopt.verified_target(token)
          with tempfile.TemporaryDirectory(prefix="analyst-build-monitor-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client")
              public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-monitor-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              identifier=key["id"]
              attached=False
              try:
                  access.request(token,"POST","/servers/9408159/ssh-keys",{"ssh_key_ids":[identifier]})
                  attached=True
                  command=p.ssh_command(folder,adopt.NEW_IP,adopt.NEW_HOST_KEY)
                  for attempt in range(12):
                      try:
                          p.remote(command,"test $(id -u) = 0",timeout=12)
                          break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import collections,datetime,json,os,pathlib,shutil,subprocess\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=\"/root/analyst-ai-android-690811a5\",text=True).strip()==\"690811a5a376181990a64f37d914c87eb6c919b7\"\nmem={}\nfor line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n    key,_,value=line.partition(\":\")\n    if key in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}:mem[key+\"_kib\"]=int(value.split()[0])\nactive=pathlib.Path(\"/root/analyst-android-active-build.json\")\nsummary={\"server_id\":9408159,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"memory\":mem,\"disk_free_bytes\":shutil.disk_usage(\"/\").free,\"load_average\":os.getloadavg(),\"active_build_pointer_exists\":active.exists()}\nif active.is_file() and not active.is_symlink():\n    pointer=json.loads(active.read_text())\n    rid=pointer[\"run_id\"]\n    assert rid.isdecimal() and pointer[\"source\"]==\"690811a5a376181990a64f37d914c87eb6c919b7\" and pointer[\"server\"]==9408159\n    report_path=pathlib.Path(\"/root/analyst-android-build-\"+rid+\".json\")\n    log_path=pathlib.Path(\"/root/analyst-android-build-\"+rid+\".log\")\n    assert pointer[\"report\"]==str(report_path) and pointer[\"log\"]==str(log_path)\n    assert not report_path.is_symlink() and not log_path.is_symlink()\n    if report_path.exists():\n        report=json.loads(report_path.read_text())\n        summary[\"build\"]={k:report.get(k) for k in (\"run_id\",\"source\",\"status\",\"started_at_utc\",\"completed_at_utc\",\"active_command\",\"phases\",\"jvm_tests\",\"build_and_static_verification_passed\",\"runtime_matrix_passed\",\"apk\")}\n    if log_path.exists():\n        with log_path.open(\"rb\") as stream:\n            stream.seek(max(0,log_path.stat().st_size-16000))\n            summary[\"build_log_tail\"]=stream.read().decode(\"utf-8\",\"replace\")\nprint(\"TIMEWEB_ANDROID_PROGRESS=\"+json.dumps(summary),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=60).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9408159/ssh-keys/"+str(identifier))
                  access.request(token,"DELETE","/ssh-keys/"+str(identifier))
                  print("TIMEWEB_MONITOR_KEY=removed",flush=True)
          new=access.request(token,"GET","/dedicated-servers/121673")["dedicated_server"]
          assert new["id"]==121673 and new["name"]=="analyst-ai-msk-20261024" and new["preset_id"]==6007 and new["location"]=="ru-3"
          print("MOSCOW_ORDER_CURRENT="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          
          PY
