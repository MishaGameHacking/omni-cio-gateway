name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import json,pathlib,subprocess,hashlib,datetime\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\npaths=[\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\",\"app/src/main/java/ru/omnicio/app/data/backend/BackendConfig.kt\",\"app/src/test/java/ru/omnicio/app/data/backend/BackendConfigTest.kt\",\"AGENTS.md\",\"README.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/TIMEWEB_WORKSPACE.md\",\"deploy/resource_observer.py\",\"deploy/analyst-resource-observer.service\",\"deploy/analyst-resource-observer.timer\",\"deploy/timeweb_workspace.py\",\"deploy/publish_timeweb_workspace.py\",\"deploy/analyst-workspace@.service\",\"deploy/analyst-workspace\",\"deploy/tests/test_timeweb_workspace.py\",\"backend/telegram_browser_app.py\",\"backend/telegram_oidc.py\",\"backend/tests/test_owner_enrollment.py\",\"backend/tests/test_owner_enrollment_install.py\",\"backend/tests/test_telegram_nonce_boundaries.py\",\"deploy/OWNER_TIMEWEB.md\",\"deploy/enroll_owner.py\",\"deploy/install_owner_backend.py\"]\nsha=\"29fff6ce1a1668b79a4c72e07230a102fd743ff6\"\ncmd=[\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(root)]\nsubprocess.run([*cmd,\"fetch\",\"--no-tags\",\"origin\",sha],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=180)\nchanged=set(subprocess.check_output([*cmd,\"diff\",\"--name-only\",\"HEAD\",\"-z\"]).decode().strip(\"\\0\").split(\"\\0\"))\nchanged|=set(subprocess.check_output([*cmd,\"ls-files\",\"--others\",\"--exclude-standard\",\"-z\"]).decode().strip(\"\\0\").split(\"\\0\"))\nchanged.discard(\"\")\nassert changed==set(paths),\"backup_does_not_cover_all_workspace_changes\"\nfor name in paths:\n    public=subprocess.check_output([*cmd,\"show\",sha+\":\"+name])\n    assert public==(root/name).read_bytes(),\"backup_bytes_mismatch_\"+name\nw=pathlib.Path(\"/root/analyst-workspace-preparation-20261024\")\nassert json.loads((w/\"target-cancelled.json\").read_text())[\"deleted\"] is True\nfor name in (\"migration-staging.py\",\"target-plan.json\",\"target.json\"):\n    (w/name).unlink(missing_ok=True)\nproof={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"github_commit\":sha,\"github_branch\":\"backup/timeweb-workspace-20261024\",\"verified_public_files\":len(paths),\"all_local_changes_backed_up\":True,\"no_private_credentials_in_backup\":True}\np=pathlib.Path(\"/var/lib/analyst-ai-ops/workspace-backup-proof.json\");p.write_text(json.dumps(proof,indent=2));p.chmod(0o600)\nprint(\"WORKSPACE_BACKUP_PROOF=\"+json.dumps(proof),flush=True)\nfor service in (\"analyst-ai-owner\",\"caddy\",\"analyst-resource-observer.timer\"):\n    assert subprocess.check_output([\"systemctl\",\"is-active\",service],text=True).strip()==\"active\"\nfailed=subprocess.check_output([\"systemctl\",\"--failed\",\"--no-legend\",\"--plain\"],text=True).strip()\nprint(\"FINAL_FAILED_UNITS=\"+json.dumps(failed.splitlines()),flush=True)\nprint(\"FINAL_WORKSPACE_STATUS=\"+subprocess.check_output([\"/usr/local/bin/analyst-workspace\",\"status\"],text=True),flush=True)\n"
                      result=subprocess.run([*command,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=240)
                      print(result.stdout.decode(),flush=True)
                      if result.returncode:print("WORKSPACE_BACKUP_ERROR="+result.stderr.decode()[-2000:],flush=True)
                      assert result.returncode==0
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          status,inventory=api("GET","/servers?limit=100&offset=0")
          assert status==200 and inventory["meta"]["total"]==len(inventory["servers"])==1
          s=inventory["servers"][0]
          assert s["id"]==9413105 and s["status"]=="on" and s["cpu"]==1 and s["ram"]==1024
          status,costs=api("GET","/account/services/cost");assert status==200
          paid=[x for x in costs["services_costs"] if x.get("total_cost",x.get("cost",0))>0]
          assert len(paid)==1 and paid[0]["service_id"]==9413105 and paid[0]["total_cost"]==1920
          status,data=api("GET","/account/finances");assert status==200
          f=data.get("finances",data)
          assert f["monthly_cost"]==1920
          print("TIMEWEB_FINAL_RESOURCES="+json.dumps({"servers":[{"id":s["id"],"name":s["name"],"status":s["status"],"cpu":s["cpu"],"ram":s["ram"]}],"monthly_rub":f["monthly_cost"],"hourly_rub":f["hourly_cost"],"unpaid_order_removed_and_not_billed":True}),flush=True)
          PY
