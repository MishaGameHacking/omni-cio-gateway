name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,os,shutil,base64,zlib,hashlib,tarfile,io,gzip\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nRUNUSER=shutil.which(\"runuser\");assert RUNUSER\ndeployment=json.loads((state/\"backend-redesign-result.json\").read_text())\nassert deployment.get(\"status\")==\"deployed\" and deployment.get(\"source_sha256\")==\"313e90d767982341c88503ddca207ff33cf4adf9839dbe6c35206ebab104e70e\"\nconfig={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n k,v=line.split(\"=\",1);assert k not in config\n config[k]=json.loads(v) if v.startswith('\"') else v\nconfig.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nINVALIDATION=\"\\\"\\\"\\\"One-shot invalidation of one verified pre-fix discovery attempt.\\n\\nRun only after the corrected production rollout, as analyst-ai with its existing\\nenvironment. argv[1] is the actual completed deployment time in UTC, from the\\nparent's deployment receipt. No work is enqueued and no network call is allowed.\\n\\\"\\\"\\\"\\nimport sys\\nsys.dont_write_bytecode = True\\n\\nfrom datetime import datetime, timedelta, timezone\\nimport hashlib\\nimport json\\nimport math\\nimport os\\nfrom pathlib import Path\\nimport pwd\\nimport sqlite3\\nimport time\\n\\nBACKEND = Path(\\\"/opt/analyst-ai/backend\\\")\\nDATABASE = Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\nEXPECTED_FILES = {\\n    \\\"autonomous_controller.py\\\": \\\"1994204de29b2569843d4d47012bbc372716d9d9db6c33daf058d73ae18600eb\\\",\\n    \\\"volume_purchases.py\\\": \\\"21c5db4e53222f8b813e7da22115338f0c8c00dc4149ec0ac0677037cb2aaabe\\\",\\n    \\\"volume_market.py\\\": \\\"6b5883183634b4e23ed15413462bb7fd908c44092ded8bae7ebfc7f00c4b47ce\\\",\\n}\\nCOLUMNS = (\\n    \\\"user_id\\\", \\\"broker_key\\\", \\\"snapshot_id\\\", \\\"strategy_version\\\", \\\"state\\\",\\n    \\\"result_json\\\", \\\"updated_at\\\", \\\"attempted_at\\\", \\\"lease_owner\\\", \\\"lease_until\\\", \\\"cursor\\\",\\n)\\nOLD_FAILURE = \\\"order_book_not_consistent\\\"\\nPREFIX = \\\"REDESIGN_DISCOVERY_INVALIDATION=\\\"\\n\\n\\ndef deny_network(event, arguments):\\n    if event in {\\n        \\\"socket.connect\\\", \\\"socket.sendto\\\", \\\"socket.sendmsg\\\",\\n        \\\"socket.getaddrinfo\\\", \\\"socket.gethostbyname\\\", \\\"socket.gethostbyaddr\\\",\\n    }:\\n        raise RuntimeError(\\\"network_forbidden_in_discovery_invalidation\\\")\\n\\n\\nsys.addaudithook(deny_network)\\n\\n\\ndef outcome(reason, *, status=\\\"skipped\\\", changed_rows=0, candidate_count=None):\\n    return {\\n        \\\"status\\\": status, \\\"reason\\\": reason,\\n        \\\"changed_rows\\\": changed_rows, \\\"candidate_count\\\": candidate_count,\\n    }\\n\\n\\ndef main():\\n    if os.geteuid() != pwd.getpwnam(\\\"analyst-ai\\\").pw_uid:\\n        return outcome(\\\"wrong_execution_user\\\")\\n    if len(sys.argv) != 2:\\n        return outcome(\\\"deployment_cutoff_required\\\")\\n    try:\\n        deployed = datetime.fromisoformat(sys.argv[1].replace(\\\"Z\\\", \\\"+00:00\\\"))\\n        if deployed.tzinfo is None or deployed.utcoffset() != timedelta(0):\\n            return outcome(\\\"deployment_cutoff_must_be_utc\\\")\\n        deployed_epoch = deployed.timestamp()\\n    except (ValueError, TypeError, OverflowError):\\n        return outcome(\\\"invalid_deployment_cutoff\\\")\\n    now = time.time()\\n    if not 0 < deployed_epoch <= now:\\n        return outcome(\\\"invalid_deployment_cutoff\\\")\\n    # DB times have whole-second precision. Same-second results are ambiguous\\n    # and must be left untouched, even if the receipt contains fractions.\\n    cutoff_second = math.floor(deployed_epoch)\\n\\n    for name, expected in EXPECTED_FILES.items():\\n        path = BACKEND / name\\n        if path.is_symlink() or not path.is_file() or path.resolve().parent != BACKEND:\\n            return outcome(\\\"corrected_backend_not_installed\\\")\\n        if hashlib.sha256(path.read_bytes()).hexdigest() != expected:\\n            return outcome(\\\"corrected_backend_not_installed\\\")\\n\\n    import app\\n    import autonomous_ai\\n    import autonomous_controller as controller\\n    if (Path(app.__file__).resolve().parent != BACKEND\\n            or Path(controller.__file__).resolve().parent != BACKEND\\n            or app.DATABASE_PATH.resolve() != DATABASE\\n            or controller.backend is not app\\n            or controller.state.backend is not app):\\n        return outcome(\\\"production_module_identity_mismatch\\\")\\n    if autonomous_ai.SCHEDULER_ENABLED is not True:\\n        return outcome(\\\"scheduler_disabled\\\")\\n    subject = os.getenv(\\\"ANALYST_OWNER_TELEGRAM_SUB\\\")\\n    if not subject:\\n        return outcome(\\\"owner_configuration_missing\\\")\\n    if DATABASE.is_symlink() or not DATABASE.is_file() or DATABASE.resolve() != DATABASE:\\n        return outcome(\\\"database_path_mismatch\\\")\\n\\n    db = sqlite3.connect(DATABASE.as_uri() + \\\"?mode=rw\\\", uri=True, timeout=3)\\n    db.row_factory = sqlite3.Row\\n    try:\\n        # All eligibility, job/lease checks and the guarded update share the\\n        # same write transaction; concurrent claims cannot slip between them.\\n        db.execute(\\\"BEGIN IMMEDIATE\\\")\\n        columns = tuple(row[1] for row in db.execute(\\\"PRAGMA table_info(automation_discovery)\\\"))\\n        if columns != COLUMNS:\\n            return outcome(\\\"discovery_schema_changed\\\")\\n        user = db.execute(\\n            \\\"SELECT id,tinvest_token_encrypted FROM users WHERE telegram_sub=?\\\",\\n            (subject,),\\n        ).fetchone()\\n        if (user is None\\n                or db.execute(\\\"SELECT COUNT(*) FROM users\\\").fetchone()[0] != 1\\n                or db.execute(\\n                    \\\"SELECT COUNT(*) FROM installation_owner WHERE singleton=1 AND telegram_sub=?\\\",\\n                    (subject,),\\n                ).fetchone()[0] != 1):\\n            return outcome(\\\"single_owner_guard_failed\\\")\\n        owner = int(user[\\\"id\\\"])\\n        if not user[\\\"tinvest_token_encrypted\\\"]:\\n            return outcome(\\\"broker_disconnected\\\")\\n        preference = db.execute(\\n            \\\"SELECT enabled,version,updated_at FROM automation_preferences WHERE user_id=?\\\",\\n            (owner,),\\n        ).fetchone()\\n        preference_before = tuple(preference) if preference is not None else None\\n        # A missing preferences row defaults to enabled in the actual controller.\\n        if controller._preferences_in(db, owner)[\\\"enabled\\\"] is not True:\\n            return outcome(\\\"automation_paused\\\")\\n        active = controller.state.active_strategy(owner, db=db)\\n        if active is None:\\n            return outcome(\\\"active_strategy_missing\\\")\\n        row = db.execute(\\n            \\\"SELECT * FROM automation_discovery WHERE user_id=?\\\", (owner,)\\n        ).fetchone()\\n        if row is None:\\n            return outcome(\\\"no_saved_discovery\\\")\\n        if row[\\\"broker_key\\\"] != controller.state.broker_key(user):\\n            return outcome(\\\"broker_connection_changed\\\")\\n        if row[\\\"strategy_version\\\"] != active[\\\"version\\\"]:\\n            return outcome(\\\"strategy_changed\\\")\\n        if (row[\\\"state\\\"] != \\\"partial\\\"\\n                or row[\\\"lease_owner\\\"] is not None or row[\\\"lease_until\\\"] is not None):\\n            return outcome(\\\"discovery_running_leased_or_state_changed\\\")\\n        if db.execute(\\n            \\\"SELECT COUNT(*) FROM workspace_jobs WHERE user_id=? AND state IN ('queued','running')\\\",\\n            (owner,),\\n        ).fetchone()[0]:\\n            return outcome(\\\"workspace_work_pending\\\")\\n        if db.execute(\\n            \\\"SELECT COUNT(*) FROM ai_work_jobs WHERE user_id=? AND status IN ('queued','running')\\\",\\n            (owner,),\\n        ).fetchone()[0]:\\n            return outcome(\\\"analysis_work_pending\\\")\\n        attempted, updated = row[\\\"attempted_at\\\"], row[\\\"updated_at\\\"]\\n        if type(attempted) is not int or type(updated) is not int:\\n            return outcome(\\\"stored_timestamp_invalid\\\")\\n        if attempted == 0:\\n            return outcome(\\\"already_invalidated\\\")\\n        if attempted < 0 or attempted > updated or attempted > now:\\n            return outcome(\\\"stored_timestamp_invalid\\\")\\n        if updated >= cutoff_second or attempted >= cutoff_second:\\n            return outcome(\\\"result_not_strictly_before_deployment\\\")\\n        if now - attempted >= controller.DISCOVERY_INTERVAL_SECONDS:\\n            return outcome(\\\"already_due_without_invalidation\\\")\\n\\n        try:\\n            result = json.loads(row[\\\"result_json\\\"])\\n        except (TypeError, ValueError):\\n            return outcome(\\\"saved_result_invalid\\\")\\n        if not isinstance(result, dict):\\n            return outcome(\\\"saved_result_invalid\\\")\\n        candidates = result.get(\\\"candidates\\\")\\n        count = len(candidates) if isinstance(candidates, list) else None\\n        if count != 8:\\n            return outcome(\\\"candidate_batch_changed\\\", candidate_count=count)\\n        if (result.get(\\\"state\\\") != \\\"partial\\\"\\n                or result.get(\\\"strategy_version\\\") != active[\\\"version\\\"]\\n                or result.get(\\\"snapshot_id\\\") != row[\\\"snapshot_id\\\"]\\n                or result.get(\\\"automatic_orders\\\") is not False\\n                or result.get(\\\"recommendation_complete\\\") is not False):\\n            return outcome(\\\"saved_result_identity_or_state_changed\\\", candidate_count=count)\\n        try:\\n            result_time = controller.timestamp(result.get(\\\"as_of\\\")).timestamp()\\n        except (ValueError, TypeError, OverflowError):\\n            return outcome(\\\"saved_result_time_invalid\\\", candidate_count=count)\\n        if not 0 < result_time < cutoff_second:\\n            return outcome(\\\"result_not_strictly_before_deployment\\\", candidate_count=count)\\n        reasons = result.get(\\\"reasons\\\")\\n        if (not isinstance(reasons, list) or len(reasons) != 1\\n                or not isinstance(reasons[0], dict)\\n                or reasons[0].get(\\\"code\\\") != \\\"research_incomplete\\\"):\\n            return outcome(\\\"discovery_reason_codes_changed\\\", candidate_count=count)\\n        coverage = result.get(\\\"coverage\\\")\\n        if (not isinstance(coverage, dict) or coverage.get(\\\"reviewed\\\") != 8\\n                or coverage.get(\\\"constraint_checks_passed\\\") != 0):\\n            return outcome(\\\"discovery_coverage_changed\\\", candidate_count=count)\\n        for candidate in candidates:\\n            if not isinstance(candidate, dict):\\n                return outcome(\\\"candidate_shape_changed\\\", candidate_count=count)\\n            checks = candidate.get(\\\"checks\\\")\\n            if (candidate.get(\\\"missing_evidence\\\") != [OLD_FAILURE]\\n                    or candidate.get(\\\"constraints_passed\\\") is not False\\n                    or candidate.get(\\\"recommendation_complete\\\") is not False\\n                    or candidate.get(\\\"strategy_version\\\") != active[\\\"version\\\"]\\n                    or not isinstance(checks, list) or len(checks) != 1\\n                    or not isinstance(checks[0], dict)\\n                    or checks[0].get(\\\"code\\\") != OLD_FAILURE\\n                    or checks[0].get(\\\"state\\\") != \\\"unknown\\\"):\\n                return outcome(\\\"candidate_failure_codes_changed\\\", candidate_count=count)\\n            if any(candidate.get(name) is not None for name in (\\n                    \\\"as_of\\\", \\\"expires_at\\\", \\\"snapshot_id\\\", \\\"evidence_revision\\\",\\n                    \\\"total_cost\\\", \\\"check_id\\\")):\\n                return outcome(\\\"candidate_has_other_evidence\\\", candidate_count=count)\\n\\n        # If the normal interval elapsed while inspecting the data, no mutation\\n        # is necessary. There is no retry or forced refresh path.\\n        if time.time() - attempted >= controller.DISCOVERY_INTERVAL_SECONDS:\\n            return outcome(\\\"already_due_without_invalidation\\\", candidate_count=count)\\n        old_values = tuple(row[name] for name in COLUMNS)\\n        where = \\\" AND \\\".join(name + \\\" IS ?\\\" for name in COLUMNS)\\n        changed = db.execute(\\n            \\\"UPDATE automation_discovery SET attempted_at=0 WHERE \\\" + where,\\n            old_values,\\n        )\\n        if changed.rowcount != 1:\\n            return outcome(\\\"compare_and_swap_did_not_match\\\", candidate_count=count)\\n        after = db.execute(\\n            \\\"SELECT * FROM automation_discovery WHERE user_id=?\\\", (owner,)\\n        ).fetchone()\\n        expected = list(old_values)\\n        expected[COLUMNS.index(\\\"attempted_at\\\")] = 0\\n        if after is None or tuple(after[name] for name in COLUMNS) != tuple(expected):\\n            raise RuntimeError(\\\"unexpected_discovery_update\\\")\\n        preference_after = db.execute(\\n            \\\"SELECT enabled,version,updated_at FROM automation_preferences WHERE user_id=?\\\",\\n            (owner,),\\n        ).fetchone()\\n        if (tuple(preference_after) if preference_after is not None else None) != preference_before:\\n            raise RuntimeError(\\\"unexpected_preference_update\\\")\\n        # Existing live-version triggers are retained; no trigger is disabled.\\n        db.commit()\\n        return outcome(\\\"old_schema_failure_attempt_invalidated\\\", status=\\\"invalidated\\\",\\n                       changed_rows=1, candidate_count=count)\\n    finally:\\n        if db.in_transaction:\\n            db.rollback()\\n        db.close()\\n\\n\\ntry:\\n    report = main()\\n    exit_code = 0\\nexcept sqlite3.OperationalError as error:\\n    value = getattr(error, \\\"sqlite_errorcode\\\", None)\\n    if isinstance(value, int) and (value & 255) in {sqlite3.SQLITE_BUSY, sqlite3.SQLITE_LOCKED}:\\n        report = outcome(\\\"database_busy\\\")\\n        exit_code = 0\\n    else:\\n        report = outcome(\\\"database_error\\\", status=\\\"error\\\", changed_rows=None)\\n        report[\\\"error_type\\\"] = type(error).__name__\\n        exit_code = 1\\nexcept Exception as error:\\n    report = outcome(\\\"guard_or_execution_error\\\", status=\\\"error\\\", changed_rows=None)\\n    report[\\\"error_type\\\"] = type(error).__name__\\n    exit_code = 1\\n\\nprint(PREFIX + json.dumps(report, sort_keys=True), flush=True)\\nraise SystemExit(exit_code)\\n\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\",deployment[\"finished_at\"]],input=INVALIDATION,text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=45)\nrows=[s for s in p.stdout.splitlines() if s.startswith(\"REDESIGN_DISCOVERY_INVALIDATION=\")]\nassert len(rows)==1,\"invalidation_receipt_missing\"\nprint(rows[0],flush=True)\ninvalidation=json.loads(rows[0].split(\"=\",1)[1]);invalidation.update(deployment_finished_at=deployment[\"finished_at\"],process_exit_code=p.returncode)\nout=state/\"discovery-invalidation-result.json\";tmp=out.with_suffix(\".next\");tmp.write_text(json.dumps(invalidation,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,out)\nINNER=\"PATCH_PAYLOAD=\\\"\\\"\\nAPPLY_HELPER=\\\"import base64,zlib,json,pathlib,hashlib,os,pwd,fcntl,tempfile,datetime,sys\\\\nroot=pathlib.Path(\\\\\\\"/srv/analyst-ai/workspace\\\\\\\")\\\\nstate=pathlib.Path(\\\\\\\"/var/lib/analyst-ai-build\\\\\\\")\\\\nassert os.geteuid()==pwd.getpwnam(\\\\\\\"analyst-build\\\\\\\").pw_uid\\\\nassert root.is_dir() and not root.is_symlink()\\\\nlock=(state/\\\\\\\"wo