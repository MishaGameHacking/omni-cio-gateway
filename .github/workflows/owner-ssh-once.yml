name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"/var/lib/analyst-ai-build/venv/bin/python -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("recovery_token="+repr(os.environ["GH_TOKEN"])+"\n"+"\nimport pathlib,subprocess,os,pwd,json,hashlib,base64,tempfile,urllib.request,urllib.error,urllib.parse,datetime\nfrom cryptography.hazmat.primitives import serialization,hashes\nfrom cryptography.hazmat.primitives.asymmetric import padding\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\nEXPECTED={\"release_id\":422969053,\"asset_id\":673253553,\"tag\":\"private-timeweb-signing-9415007-40130594415\",\"ciphertext_sha256\":\"65f9720be183232ce63d975018a33c664438059ced846571fa349fec56215716\",\"bytes\":4263,\"recipient_sha256\":\"e81bf61ed00ba4ec34b9961551869be49f71153b88b70383702b1209ec8ac22f\",\"certificate_sha256\":\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"}\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):return None\nopener=urllib.request.build_opener(NoRedirect())\nheaders={\"Authorization\":\"Bearer \"+recovery_token,\"Accept\":\"application/vnd.github+json\",\"User-Agent\":\"analyst-timeweb-recovery\"}\nbase=\"https://api.github.com/repos/MishaGameHacking/omni-cio-gateway\"\nwith opener.open(urllib.request.Request(base+\"/releases/\"+str(EXPECTED[\"release_id\"]),headers=headers),timeout=30) as r:release=json.loads(r.read(262144))\nassert release[\"draft\"] is True and release[\"tag_name\"]==EXPECTED[\"tag\"]\nasset,=[a for a in release[\"assets\"] if a[\"id\"]==EXPECTED[\"asset_id\"]]\nassert asset[\"size\"]==EXPECTED[\"bytes\"] and asset[\"name\"]==\"analyst-9415007-signing.enc.json\"\nrequest=urllib.request.Request(base+\"/releases/assets/\"+str(asset[\"id\"]),headers={**headers,\"Accept\":\"application/octet-stream\"})\ntry:\n    response=opener.open(request,timeout=30)\nexcept urllib.error.HTTPError as error:\n    if error.code!=302:raise RuntimeError(\"private_asset_http_\"+str(error.code)) from None\n    location=error.headers[\"Location\"];url=urllib.parse.urlsplit(location)\n    assert url.scheme==\"https\" and url.hostname in {\"release-assets.githubusercontent.com\",\"objects.githubusercontent.com\"} and url.port in (None,443)\n    response=opener.open(urllib.request.Request(location,headers={\"User-Agent\":\"analyst-timeweb-recovery\"}),timeout=30)\nwith response:raw=response.read(65537)\nassert len(raw)==EXPECTED[\"bytes\"] and hashlib.sha256(raw).hexdigest()==EXPECTED[\"ciphertext_sha256\"]\npayload=json.loads(raw)\nassert payload[\"server_id\"]==9415007 and payload[\"version\"]==1 and payload[\"recipient_sha256\"]==EXPECTED[\"recipient_sha256\"] and payload[\"certificate_sha256\"]==EXPECTED[\"certificate_sha256\"]\nprivate=pathlib.Path(\"/var/lib/analyst-ai-ops/signing-transport.pem\")\nkey=serialization.load_pem_private_key(private.read_bytes(),password=None)\npem=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)\nassert hashlib.sha256(pem).hexdigest()==EXPECTED[\"recipient_sha256\"]\naad=(\"Analyst-AI-signing-restore:9415007:\"+EXPECTED[\"certificate_sha256\"]+\":\"+EXPECTED[\"recipient_sha256\"]).encode()\naes=key.decrypt(base64.b64decode(payload[\"key\"],validate=True),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=aad))\nkeystore=AESGCM(aes).decrypt(base64.b64decode(payload[\"nonce\"],validate=True),base64.b64decode(payload[\"ciphertext\"],validate=True),aad)\nassert 256<=len(keystore)<=65536\nowner=pwd.getpwnam(\"analyst-build\")\ndirectory=pathlib.Path(\"/var/lib/analyst-ai-build/.android\");directory.mkdir(mode=0o700,exist_ok=True);directory.chmod(0o700);os.chown(directory,owner.pw_uid,owner.pw_gid)\ntarget=directory/\"debug.keystore\"\nwith tempfile.NamedTemporaryFile(dir=directory,delete=False) as f:f.write(keystore);temporary=pathlib.Path(f.name)\ntry:\n    temporary.chmod(0o600)\n    cert=subprocess.check_output([\"keytool\",\"-exportcert\",\"-alias\",\"androiddebugkey\",\"-keystore\",str(temporary),\"-storepass\",\"android\"],stderr=subprocess.DEVNULL)\n    assert hashlib.sha256(cert).hexdigest()==EXPECTED[\"certificate_sha256\"]\n    if target.exists():assert target.read_bytes()==keystore\n    else:os.chown(temporary,owner.pw_uid,owner.pw_gid);os.link(temporary,target)\nfinally:temporary.unlink(missing_ok=True)\nproof={\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"server_id\":9415007,\"certificate_sha256\":EXPECTED[\"certificate_sha256\"],\"original_identity_preserved\":True,\"mode\":oct(target.stat().st_mode&0o777)}\nproofpath=pathlib.Path(\"/var/lib/analyst-ai-ops/signing-restored.json\");proofpath.write_text(json.dumps(proof)+\"\\n\");proofpath.chmod(0o600)\nprivate.unlink()\nprint(\"AMS_SIGNING_RESTORED=\"+json.dumps(proof),flush=True)\nsubprocess.run([\"/usr/local/bin/analyst-workspace\",\"build\"],check=True,timeout=20)\nprint(\"AMS_NATIVE_BUILD_STARTED=true\",flush=True)\n",timeout=180)
          request=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/releases/422969053",method="DELETE",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"analyst-timeweb-recovery"})
          with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(request,timeout=30) as response:
              assert response.status==204
          print("AMS_PRIVATE_HANDOFF_DELETED="+str(422969053),flush=True)
          PY
