name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-signing-transfer
  cancel-in-progress: false
jobs:
  access:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: timeweb-signing-transport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: timeweb-signing-transport
      - name: Fetch exact reviewed server code and prepare native TLS transport
        shell: cmd
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          if errorlevel 1 exit /b 1
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
          if errorlevel 1 exit /b 1
          set "ANALYST_SIGNING_TRANSPORT=%RUNNER_TEMP%\analyst-signing-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          echo ANALYST_SIGNING_TRANSPORT=%ANALYST_SIGNING_TRANSPORT%>>"%GITHUB_ENV%"
          py -3 -m venv "%ANALYST_SIGNING_TRANSPORT%"
          if errorlevel 1 exit /b 1
          "%ANALYST_SIGNING_TRANSPORT%\Scripts\python.exe" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r tools\timeweb-actions-requirements.txt
          if errorlevel 1 exit /b 1
      - name: Transfer the existing signing key directly to the pinned Timeweb host
        shell: '"${{ env.ANALYST_SIGNING_TRANSPORT }}\Scripts\python.exe" {0}'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          import hashlib,json,os,pathlib,shlex,stat,subprocess,sys
          sys.path[:0]=["deploy",".github/scripts"]
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          import prepare_owner_vm as prepare
          from verify_cached_jdk import discover
          pin="bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1"
          assert pathlib.Path(".github/apk-signing-certificate.sha256").read_text().strip()==pin
          source=pathlib.Path.home()/".android"/"debug.keystore"
          assert source.is_file() and not source.is_symlink(),"existing_signing_keystore_unavailable"
          assert 512<=source.stat().st_size<=65536,"unexpected_keystore_size"
          jdk=discover(os.environ["RUNNER_TOOL_CACHE"])
          cert=subprocess.run([str(jdk/"bin/keytool.exe"),"-exportcert","-alias","androiddebugkey","-keystore",str(source),"-storepass","android"],capture_output=True,timeout=30)
          assert cert.returncode==0 and hashlib.sha256(cert.stdout).hexdigest()==pin,"existing_signing_certificate_mismatch"
          def transfer(command):
              script="import hashlib,json,os,pathlib,stat,subprocess,sys\npin=\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\nkeytool=pathlib.Path(\"/usr/lib/jvm/java-17-openjdk-amd64/bin/keytool\")\nassert keytool.is_file(),\"timeweb_java_not_prepared\"\ndata=sys.stdin.buffer.read(65537)\nassert 512<=len(data)<=65536,\"keystore_size_invalid\"\ndirectory=pathlib.Path(\"/root/.android\")\nassert not directory.is_symlink()\ndirectory.mkdir(mode=0o700,exist_ok=True)\nassert directory.stat().st_uid==0\ndirectory.chmod(0o700)\ndest=directory/\"debug.keystore\"\nif dest.exists() or dest.is_symlink():\n    info=dest.lstat()\n    assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\n    assert hashlib.sha256(dest.read_bytes()).digest()==hashlib.sha256(data).digest(),\"existing_signing_key_preserved\"\nelse:\n    fd=os.open(dest,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n    with os.fdopen(fd,\"wb\") as out:\n        out.write(data);out.flush();os.fsync(out.fileno())\ncert=subprocess.run([str(keytool),\"-exportcert\",\"-alias\",\"androiddebugkey\",\"-keystore\",str(dest),\"-storepass\",\"android\"],capture_output=True,timeout=30)\nassert cert.returncode==0 and hashlib.sha256(cert.stdout).hexdigest()==pin,\"timeweb_signing_certificate_mismatch\"\nprint(json.dumps({\"server_id\":9408159,\"certificate_sha256\":pin,\"private_mode\":\"0600\",\"signing_identity_preserved\":True}),flush=True)\n"
              output=prepare.remote(command,"python3 -c "+shlex.quote(script),source.read_bytes(),timeout=60)
              report=json.loads(output)
              assert report["signing_identity_preserved"] is True
              print("TIMEWEB_SIGNING_IDENTITY="+json.dumps(report),flush=True)
          access.develop_backend=transfer
          adopt.run(development=True)
