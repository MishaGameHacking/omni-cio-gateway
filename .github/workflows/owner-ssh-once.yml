name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("\nimport pathlib,os,pwd,stat,json,subprocess,hashlib,datetime,http.client\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nuser=pwd.getpwnam(\"analyst-build\")\nfor stage in (\"build\",\"check\",\"runtime\"):\n    sub=subprocess.check_output([\"systemctl\",\"show\",\"analyst-workspace@\"+stage,\"-p\",\"SubState\",\"--value\"],text=True).strip()\n    assert sub not in (\"running\",\"start\",\"start-pre\"),\"workspace_job_active\"\nfor name in (\"caddy\",\"analyst-ai-owner\"):\n    data=subprocess.check_output([\"systemctl\",\"show\",name,\"-p\",\"LoadState\",\"-p\",\"ActiveState\",\"-p\",\"SubState\"],text=True)\n    print(\"OTA_SERVICE=\"+json.dumps({\"name\":name,\"properties\":data.splitlines()}),flush=True)\nconfig=pathlib.Path(\"/etc/caddy/Caddyfile\")\nassert config.is_file() and not config.is_symlink()\nbody=config.read_bytes()\nprint(\"OTA_CADDY_FILE=\"+json.dumps({\"bytes\":len(body),\"sha256\":hashlib.sha256(body).hexdigest(),\"maintenance\":b\"503\" in body,\"backend_proxy\":b\"8080\" in body}),flush=True)\nconn=http.client.HTTPConnection(\"127.0.0.1\",2019,timeout=5)\ntry:\n    conn.request(\"GET\",\"/config/\");response=conn.getresponse();assert response.status==200\n    raw=response.read(1048577);assert len(raw)<=1048576\n    active=json.loads(raw)\n    print(\"OTA_CADDY_ACTIVE=\"+json.dumps({\"apps\":sorted(active.get(\"apps\",{})),\"storage_custom\":\"storage\" in active,\"logger_writers\":{n:v.get(\"writer\",{}).get(\"output\",\"default\") for n,v in active.get(\"logging\",{}).get(\"logs\",{}).items()},\"http_servers\":len(active.get(\"apps\",{}).get(\"http\",{}).get(\"servers\",{}))}),flush=True)\nfinally:conn.close()\ndirectory=state/\"diagnostics\"\nif not directory.exists():directory.mkdir(mode=0o700);os.chown(directory,user.pw_uid,user.pw_gid)\nassert directory.is_dir() and not directory.is_symlink() and directory.stat().st_uid==user.pw_uid\nsource=\"#!/usr/bin/env python3\\n\\\"\\\"\\\"Private stock-Android boot diagnosis, never an APK/runtime-matrix receipt.\\\"\\\"\\\"\\nfrom __future__ import annotations\\n\\nimport datetime\\nimport fcntl\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport pwd\\nimport re\\nimport signal\\nimport subprocess\\nimport sys\\nimport time\\n\\nROOT = Path(\\\"/srv/analyst-ai/workspace\\\")\\nSTATE = Path(\\\"/var/lib/analyst-ai-build\\\")\\nSDK = Path(\\\"/opt/analyst-android-sdk\\\")\\nBOOT_SECONDS = 1800\\nSAMPLE_SECONDS = 60\\nMAX_EMULATOR_LOG = 32 * 1024 * 1024\\n\\nassert pwd.getpwuid(os.getuid()).pw_name == \\\"analyst-build\\\"\\nsys.path.insert(0, str(ROOT / \\\".github/scripts\\\"))\\nfrom emulator_graphics import EMULATOR_FEATURES, EMULATOR_GPU_MODE\\nfrom emulator_lease import exclusive_emulator\\nfrom emulator_storage import configure_userdata, remove_disposable_avd\\nfrom isolated_adb import isolated_adb_server, stop_owned_server\\nfrom kernel_page_size import system_image\\nfrom test_apk_installation import free_emulator_port\\n\\nstamp = datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%SZ\\\")\\ndirectory = STATE / \\\"diagnostics\\\"\\nassert directory.is_dir() and not directory.is_symlink()\\nwork = directory / f\\\"boot-{stamp}-{os.getpid()}\\\"\\nwork.mkdir(mode=0o700)\\navd_home = work / \\\"avd\\\"\\navd_home.mkdir()\\nemulator_home = work / \\\"emulator-home\\\"\\nemulator_home.mkdir()\\nname = f\\\"analyst-install-{os.getpid()}-1\\\"\\nimage = system_image(37, 16384)\\nadb = str(SDK / \\\"platform-tools/adb\\\")\\nemulator = str(SDK / \\\"emulator/emulator\\\")\\nmanager = str(SDK / \\\"cmdline-tools/latest/bin/avdmanager\\\")\\nlavapipe = list(Path(\\\"/usr/share/vulkan/icd.d\\\").glob(\\\"lvp_icd*.json\\\"))\\nassert len(lavapipe) == 1\\nos.environ.update({\\n    \\\"ANDROID_HOME\\\": str(SDK), \\\"ANDROID_SDK_ROOT\\\": str(SDK),\\n    \\\"ANDROID_AVD_HOME\\\": str(avd_home),\\n    \\\"ANDROID_EMULATOR_HOME\\\": str(emulator_home),\\n    \\\"ANDROID_I_WANT_MY_TCG\\\": \\\"yes\\\",  # Diagnostic-only software emulation.\\n    \\\"VK_ICD_FILENAMES\\\": str(lavapipe[0]), \\\"PYTHONUNBUFFERED\\\": \\\"1\\\",\\n})\\nresult = {\\n    \\\"purpose\\\": \\\"stock_android_boot_diagnostic\\\", \\\"candidate_tested\\\": False,\\n    \\\"matrix_passed\\\": False, \\\"publication_authorized\\\": False,\\n    \\\"android_api\\\": 37, \\\"requested_page_size_bytes\\\": 16384,\\n    \\\"system_image\\\": image, \\\"status\\\": \\\"preparing\\\",\\n    \\\"boot_deadline_seconds\\\": BOOT_SECONDS,\\n    \\\"sample_seconds\\\": SAMPLE_SECONDS, \\\"log_directory\\\": str(work),\\n}\\nprocess = None\\nstarted = None\\ndeadline = None\\nserial = None\\nPROPERTIES = {\\n    \\\"sys.boot_completed\\\", \\\"dev.bootcomplete\\\", \\\"init.svc.zygote\\\",\\n    \\\"init.svc.zygote_secondary\\\", \\\"init.svc.bootanim\\\", \\\"init.svc.servicemanager\\\",\\n    \\\"init.svc.adbd\\\", \\\"init.svc.surfaceflinger\\\", \\\"init.svc.artd\\\",\\n    \\\"init.svc.installd\\\", \\\"ro.build.version.sdk\\\", \\\"ro.product.cpu.abi\\\",\\n}\\nPROCESS_PATTERN = re.compile(\\n    r\\\"zygote|system_server|surfaceflinger|servicemanager|adbd|audioserver|\\\"\\n    r\\\"dex2oat|artd|installd|bootanim\\\", re.IGNORECASE)\\nLOG_PATTERN = re.compile(\\n    r\\\"zygote|system.?server|ActivityManager|boot_progress|BootAnimation|\\\"\\n    r\\\"dex2oat|artd|AndroidRuntime|FATAL|SIGILL|Fatal signal|watchdog|\\\"\\n    r\\\"low.?memory|Could not find.*activity|Waited.*activity\\\", re.IGNORECASE)\\n\\n\\ndef save_result():\\n    temporary = work / \\\"result.next.json\\\"\\n    temporary.write_text(json.dumps(result, indent=2) + \\\"\\\\n\\\")\\n    temporary.chmod(0o600)\\n    temporary.replace(work / \\\"result.json\\\")\\n\\n\\ndef interrupt(signum, frame):\\n    raise KeyboardInterrupt(f\\\"diagnostic_signal_{signum}\\\")\\n\\n\\nsignal.signal(signal.SIGTERM, interrupt)\\nsignal.signal(signal.SIGINT, interrupt)\\n\\n\\ndef capture(*command):\\n    remaining = deadline - time.monotonic()\\n    if remaining <= 0:\\n        return {\\\"code\\\": None, \\\"error\\\": \\\"boot_deadline_reached\\\", \\\"stdout\\\": \\\"\\\"}\\n    try:\\n        p = subprocess.run([adb, \\\"-s\\\", serial, *command],\\n                           stdin=subprocess.DEVNULL, capture_output=True,\\n                           text=True, errors=\\\"replace\\\", timeout=min(8, remaining),\\n                           check=False)\\n        return {\\\"code\\\": p.returncode, \\\"stdout\\\": p.stdout,\\n                \\\"stderr\\\": p.stderr[-1000:]}\\n    except subprocess.TimeoutExpired:\\n        return {\\\"code\\\": None, \\\"error\\\": \\\"command_timeout\\\", \\\"stdout\\\": \\\"\\\"}\\n\\n\\ndef sample():\\n    raw = capture(\\\"shell\\\", \\\"getprop\\\")\\n    properties = {}\\n    if raw[\\\"code\\\"] == 0:\\n        for line in raw[\\\"stdout\\\"].splitlines():\\n            match = re.fullmatch(r\\\"\\\\[([^]]+)\\\\]: \\\\[(.*)\\\\]\\\", line)\\n            if match and match.group(1) in PROPERTIES:\\n                properties[match.group(1)] = match.group(2)[:256]\\n    processes = capture(\\\"shell\\\", \\\"ps\\\", \\\"-A\\\", \\\"-o\\\", \\\"PID,PPID,STAT,NAME\\\")\\n    processes[\\\"stdout\\\"] = \\\"\\\\n\\\".join(\\n        line for line in processes[\\\"stdout\\\"].splitlines()\\n        if PROCESS_PATTERN.search(line))[-16000:]\\n    logcat = capture(\\\"logcat\\\", \\\"-d\\\", \\\"-b\\\", \\\"main\\\", \\\"-b\\\", \\\"system\\\", \\\"-t\\\", \\\"1000\\\", \\\"-v\\\", \\\"threadtime\\\")\\n    logcat[\\\"stdout\\\"] = \\\"\\\\n\\\".join(\\n        line for line in logcat[\\\"stdout\\\"].splitlines()\\n        if LOG_PATTERN.search(line))[-48000:]\\n    events = capture(\\\"logcat\\\", \\\"-d\\\", \\\"-b\\\", \\\"events\\\", \\\"-t\\\", \\\"300\\\", \\\"-v\\\", \\\"threadtime\\\")\\n    events[\\\"stdout\\\"] = \\\"\\\\n\\\".join(\\n        line for line in events[\\\"stdout\\\"].splitlines()\\n        if LOG_PATTERN.search(line))[-24000:]\\n    crash = capture(\\\"logcat\\\", \\\"-d\\\", \\\"-b\\\", \\\"crash\\\", \\\"-v\\\", \\\"threadtime\\\")\\n    crash[\\\"stdout\\\"] = crash[\\\"stdout\\\"][-64000:]\\n    entry = {\\\"elapsed_seconds\\\": round(time.monotonic() - started, 3),\\n             \\\"getprop_code\\\": raw[\\\"code\\\"], \\\"properties\\\": properties,\\n             \\\"processes\\\": processes, \\\"logcat\\\": logcat, \\\"events\\\": events,\\n             \\\"crash\\\": crash, \\\"host_load\\\": os.getloadavg(),\\n             \\\"emulator_exit\\\": process.poll()}\\n    with (work / \\\"samples.jsonl\\\").open(\\\"a\\\") as stream:\\n        stream.write(json.dumps(entry) + \\\"\\\\n\\\")\\n    result[\\\"last_sample_seconds\\\"] = entry[\\\"elapsed_seconds\\\"]\\n    result[\\\"last_properties\\\"] = properties\\n    save_result()\\n    print(\\\"BOOT_DIAGNOSTIC_SAMPLE=\\\" + json.dumps({\\n        \\\"elapsed_seconds\\\": entry[\\\"elapsed_seconds\\\"], \\\"properties\\\": properties,\\n        \\\"emulator_exit\\\": entry[\\\"emulator_exit\\\"]}), flush=True)\\n    return properties.get(\\\"sys.boot_completed\\\") == \\\"1\\\"\\n\\n\\nsave_result()\\ntry:\\n    # The real runtime runner uses this same lock. Never overlap its work.\\n    with (STATE / \\\"workspace.lock\\\").open(\\\"a\\\") as workspace_lock:\\n        fcntl.flock(workspace_lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\\n        with exclusive_emulator():\\n            creation = subprocess.run(\\n                [manager, \\\"create\\\", \\\"avd\\\", \\\"--name\\\", name, \\\"--package\\\", image,\\n                 \\\"--path\\\", str(avd_home / (name + \\\".avd\\\"))], input=\\\"no\\\\n\\\",\\n                capture_output=True, text=True, timeout=120, check=False)\\n            if creation.returncode:\\n                raise RuntimeError(\\\"diagnostic_avd_creation_failed\\\")\\n            configure_userdata(avd_home / (name + \\\".avd\\\"), SDK, image)\\n            acceleration = subprocess.run([emulator, \\\"-accel-check\\\"],\\n                capture_output=True, text=True, timeout=20, check=False)\\n            result[\\\"acceleration_exit\\\"] = acceleration.returncode\\n            result[\\\"acceleration\\\"] = acceleration.stdout[-2000:]\\n            port = free_emulator_port()\\n            serial = f\\\"emulator-{port}\\\"\\n            with isolated_adb_server(Path(adb), work):\\n                with (work / \\\"emulator.log\\\").open(\\\"w\\\") as log:\\n                    process = subprocess.Popen(\\n                        [emulator, \\\"-avd\\\", name, \\\"-port\\\", str(port),\\n                         \\\"-no-window\\\", \\\"-no-audio\\\", \\\"-no-snapshot\\\", \\\"-no-boot-anim\\\",\\n                         \\\"-show-kernel\\\", \\\"-timezone\\\", \\\"Etc/UTC\\\", \\\"-gpu\\\", EMULATOR_GPU_MODE,\\n                         \\\"-feature\\\", EMULATOR_FEATURES, \\\"-memory\\\", \\\"4096\\\", \\\"-cores\\\", \\\"2\\\",\\n                         \\\"-accel\\\", \\\"on\\\" if acceleration.returncode == 0 else \\\"off\\\"],\\n                        stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)\\n                    started = time.monotonic()\\n                    deadline = started + BOOT_SECONDS\\n                    next_sample = started\\n                    result[\\\"status\\\"] = \\\"running\\\"\\n                    save_result()\\n                    try:\\n                        while time.monotonic() < deadline:\\n                            if process.poll() is not None:\\n                                result[\\\"status\\\"] = \\\"emulator_exited_before_boot\\\"\\n                                break\\n                            if (work / \\\"emulator.log\\\").stat().st_size > MAX_EMULATOR_LOG:\\n                                result[\\\"status\\\"] = \\\"diagnostic_log_limit\\\"\\n                                break\\n                            if time.monotonic() >= next_sample:\\n                                if sample():\\n                                    result[\\\"status\\\"] = \\\"diagnostic_boot_completed\\\"\\n                                    result[\\\"page_size\\\"] = capture(\\\"shell\\\", \\\"getconf\\\", \\\"PAGE_SIZE\\\")\\n                                    break\\n                                next_sample += SAMPLE_SECONDS\\n                            time.sleep(min(1, max(0, deadline - time.monotonic())))\\n                        else:\\n                            result[\\\"status\\\"] = \\\"diagnostic_boot_timeout\\\"\\n                        result[\\\"elapsed_seconds\\\"] = round(time.monotonic() - started, 3)\\n                    finally:\\n                        stop_owned_server(process)\\n                        result[\\\"emulator_exit\\\"] = process.returncode\\n                        log.flush()\\nexcept BaseException as error:\\n    result[\\\"status\\\"] = \\\"diagnostic_error\\\"\\n    result[\\\"error_type\\\"] = type(error).__name__\\n    result[\\\"error\\\"] = str(error)[:500]\\n    raise\\nfinally:\\n    try:\\n        if process is not None:\\n            stop_owned_server(process)\\n            remove_disposable_avd(avd_home, work, process=process)\\n            result[\\\"owned_avd_removed\\\"] = True\\n    except BaseException as cleanup_error:\\n        result[\\\"cleanup_error\\\"] = type(cleanup_error).__name__\\n    finally:\\n        save_result()\\n        print(\\\"BOOT_DIAGNOSTIC_RESULT=\\\" + json.dumps(result), flush=True)\\n\\nraise SystemExit(0 if result[\\\"status\\\"] == \\\"diagnostic_boot_completed\\\" else 1)\\n\"\ndestination=directory/\"boot_diagnostic.py\"\nif destination.exists():assert not destination.is_symlink() and destination.read_text()==source\nelse:\n    descriptor=os.open(destination,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n    with os.fdopen(descriptor,\"w\") as stream:stream.write(source);stream.flush();os.fsync(stream.fileno())\n    os.chown(destination,user.pw_uid,user.pw_gid)\nunit=\"analyst-boot-diagnostic-20261025t0501\"\nprops={\"Type\":\"exec\",\"RuntimeMaxSec\":\"2100\",\"TimeoutStopSec\":\"45\",\"KillMode\":\"control-group\",\"User\":\"analyst-build\",\"Group\":\"analyst-build\",\"UMask\":\"0077\",\"MemoryHigh\":\"5033164800\",\"MemoryMax\":\"5452595200\",\"MemorySwapMax\":\"536870912\",\"CPUWeight\":\"20\",\"TasksMax\":\"512\",\"WorkingDirectory\":\"/srv/analyst-ai/workspace\",\"StandardOutput\":\"append:\"+str(directory/\"boot-20261025t0501.log\"),\"StandardError\":\"inherit\"}\ncommand=[\"systemd-run\",\"--unit=\"+unit,*[\"--property=\"+k+\"=\"+v for k,v in props.items()],\"--setenv=HOME=\"+user.pw_dir,\"--setenv=JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64\",\"/usr/bin/xvfb-run\",\"-a\",str(state/\"venv/bin/python\"),\"-B\",str(destination)]\nsubprocess.run(command,capture_output=True,check=True,timeout=15)\nprint(\"OTA_BOOT_DIAGNOSTIC_STARTED=\"+json.dumps({\"unit\":unit,\"boot_deadline_seconds\":1800,\"unit_deadline_seconds\":2100,\"candidate_tested\":False,\"matrix_passed\":False}),flush=True)\n",timeout=120)
          PY
