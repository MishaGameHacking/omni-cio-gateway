name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-build-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read the current host memory pricing before any resize
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,shlex,subprocess,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as prepare
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=prepare.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(prepare.NoRedirect(),urllib.request.HTTPSHandler(context=prepare.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return prepare.decode_response(response.read(2*1024*1024+1))
          fin=get("/account/finances")["finances"]
          status=get("/account/status")["status"]
          balance=Decimal(str(fin["balance"]))
          inventory=prepare.read_resource(token,"servers")
          assert prepare.summarize("servers",inventory)["complete"]
          print("TIMEWEB_HOURLY_ACCOUNT="+json.dumps({"hourly_billing":Decimal(str(fin["hourly_fee"]))>0,"balance_positive":balance>0,"blocked":status["is_blocked"],"servers":[{k:s.get(k) for k in ("id","name","status","cpu","ram","availability_zone")} for s in inventory["servers"]]}),flush=True)
          configs=get("/configurator/servers")["server_configurators"]
          config=next(c for c in configs if c["id"]==153)
          assert config["location"]=="nl-1"
          print("TIMEWEB_EXISTING_HOST_CONFIGURATOR="+json.dumps({k:config.get(k) for k in ("id","location","requirements","prices")}),flush=True)
          candidates=[]
          for memory in (2048,3072,4096):
              price=Decimal(str(config["prices"]["cpu"]))+Decimal(str(config["prices"]["ram"]))*Decimal(memory)/1024+Decimal(str(config["prices"]["disk"]))*15
              candidates.append({"cpu":1,"ram":memory,"disk":15360,"monthly_price_rub":float(price),"monthly_credit_covered":balance>=price+200})
          print("TIMEWEB_TEMPORARY_RAM_OPTIONS="+json.dumps(candidates),flush=True)
          PY
