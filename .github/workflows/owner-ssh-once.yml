name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("PROBE_PAYLOAD=\"\"\nimport base64,zlib,hashlib,json,pathlib,subprocess,os,datetime,urllib.request,re,shutil\nRUNUSER=shutil.which(\"runuser\")\nassert RUNUSER,\"runuser_executable_missing\"\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\npath=state/\"backend-redesign-result.json\"\nif not path.is_file():\n print(\"REDESIGN_DEPLOYMENT_PENDING=\"+json.dumps({\"reason\":\"receipt_not_created\"}),flush=True);raise SystemExit(0)\ndeployment=json.loads(path.read_text());print(\"REDESIGN_BACKEND_DEPLOYMENT=\"+json.dumps(deployment),flush=True)\nif deployment.get(\"status\")!=\"deployed\":raise SystemExit(0)\nassert deployment.get(\"source_sha256\")==\"a1efa109d547023935e8f08c445c68834192b73a130673425ef90487c892d227\"\nconfig={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n k,v=line.split(\"=\",1);assert k not in config\n config[k]=json.loads(v) if v.startswith('\"') else v\nconfig.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nencoded=PROBE_PAYLOAD.encode(\"ascii\")\nassert hashlib.sha256(encoded).hexdigest()==\"41abc4bebf6b58811f5bbaa57be866ea453c6ef5ccc4cdaca2794dd0bb71f485\"\nprobe=zlib.decompress(base64.b64decode(encoded))\nassert hashlib.sha256(probe).hexdigest()==\"5cc45d6867c37dc87d0ad143fbd4f5d0434980d61430db99c802b28f97145eed\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=probe.decode(),text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=45)\nrecords=[line for line in p.stdout.splitlines() if line.startswith(\"REDESIGN_POSTDEPLOY_READONLY=\")]\nassert len(records)==1,\"postdeploy_probe_receipt_missing\"\nprint(records[0],flush=True)\nreadonly=json.loads(records[0].split(\"=\",1)[1])\nprint(\"REDESIGN_POSTDEPLOY_PROBE_EXIT=\"+str(p.returncode),flush=True)\nhost=\"https://analyst-ai-2941515.twc1.net\"\nassert config[\"BACKEND_PUBLIC_URL\"].rstrip(\"/\")==host\nhttp={}\nfor route in (\"/health\",\"/client/update-policy?package_name=ru.omnicio.app.debug\"):\n req=urllib.request.Request(host+route,headers={\"User-Agent\":\"Analyst-Timeweb-release-verifier\"})\n with urllib.request.urlopen(req,timeout=20) as response:\n  raw=response.read(32769);assert len(raw)<=32768\n  body=json.loads(raw);status=response.status\n  if route==\"/health\":\n   assert status==200 and body=={\"status\":\"ok\"}\n   http[\"health\"]={\"status\":status}\n  else:\n   fields=(\"schema_version\",\"package_name\",\"version_code\",\"version_name\",\"apk_sha256\",\"certificate_sha256\",\"minimum_version_code\",\"apk_path\")\n   public={name:body.get(name) for name in fields}\n   assert status==200 and public[\"version_code\"]==37\n   assert public[\"apk_sha256\"]==\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\"\n   assert public[\"certificate_sha256\"]==\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\n   assert response.headers.get(\"Cache-Control\")==\"no-store\"\n   http[\"update_policy\"]={\"status\":status,\"cache_control\":\"no-store\",**public}\nprint(\"REDESIGN_PUBLIC_HTTP=\"+json.dumps(http),flush=True)\nj=subprocess.run([\"journalctl\",\"-u\",\"analyst-ai-owner.service\",\"--since\",\"@\"+str(int(datetime.datetime.fromisoformat(deployment[\"started_at\"]).timestamp())),\"--no-pager\",\"-o\",\"json\"],capture_output=True,text=True,timeout=15)\nassert j.returncode==0\nmessages=[]\nfor line in j.stdout.splitlines():\n if line:messages.append(str(json.loads(line).get(\"MESSAGE\",\"\")))\njournal={\"entries\":len(messages),\"tracebacks\":sum(\"Traceback (most recent call last)\" in s for s in messages),\"error_lines\":sum(bool(re.search(r\"\\bERROR\\b\",s)) for s in messages)}\nprint(\"REDESIGN_POSTDEPLOY_JOURNAL=\"+json.dumps(journal),flush=True)\nreport={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_sha256\":deployment[\"source_sha256\"],\"readonly\":readonly,\"probe_exit_code\":p.returncode,\"public_http\":http,\"journal\":journal}\nout=state/\"postdeploy-redesign-result.json\";tmp=out.with_suffix(\".next\");tmp.write_text(json.dumps(report,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,out)\nif p.returncode:raise SystemExit(p.returncode)\n\nDETAIL_PROBE=\"import pathlib,json,hashlib,xml.etree.ElementTree as ET\\nstate=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\");root=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\")\\nreceipt=json.loads((state/\\\"build-result.json\\\").read_text())\\nassert receipt[\\\"status\\\"]==\\\"passed\\\" and receipt[\\\"source_sha256\\\"]==\\\"a1efa109d547023935e8f08c445c68834192b73a130673425ef90487c892d227\\\"\\napk=pathlib.Path(receipt[\\\"apk\\\"]);digest=hashlib.sha256(apk.read_bytes()).hexdigest();assert digest==receipt[\\\"apk_sha256\\\"]\\nreport=json.loads(apk.with_name(\\\"apk-verification.json\\\").read_text())\\nmanifest=apk.with_name(\\\"manifest.txt\\\").read_text()\\npermissions=sorted(set(__import__(\\\"re\\\").findall(r'android[.]permission[.][A-Z_]+',manifest)))\\nassert \\\"android.permission.ACCESS_NETWORK_STATE\\\" in permissions\\ncounts=dict(tests=0,failures=0,errors=0,skipped=0,suites=0)\\nfor path in (root/\\\"app/build/test-results/testDebugUnitTest\\\").glob(\\\"TEST-*.xml\\\"):\\n suite=ET.parse(path).getroot();counts[\\\"suites\\\"]+=1\\n for name in (\\\"tests\\\",\\\"failures\\\",\\\"errors\\\",\\\"skipped\\\"):counts[name]+=int(suite.get(name,\\\"0\\\"))\\nassert counts[\\\"tests\\\"]>0 and counts[\\\"failures\\\"]==counts[\\\"errors\\\"]==0\\nlint={}\\nfor name in (\\\"debug\\\",\\\"preview\\\"):\\n path=root/(\\\"app/build/reports/lint-results-\\\"+name+\\\".xml\\\")\\n if path.is_file():\\n  issues=ET.parse(path).getroot().findall(\\\"issue\\\")\\n  lint[name]={\\\"errors\\\":sum(x.get(\\\"severity\\\") in (\\\"Error\\\",\\\"Fatal\\\") for x in issues),\\\"warnings\\\":sum(x.get(\\\"severity\\\")==\\\"Warning\\\" for x in issues)}\\nout={\\\"source_sha256\\\":receipt[\\\"source_sha256\\\"],\\\"apk_sha256\\\":digest,\\\"apk_bytes\\\":apk.stat().st_size,\\\"verification\\\":report,\\\"manifest_permissions\\\":permissions,\\\"jvm_tests\\\":counts,\\\"lint\\\":lint}\\ntarget=state/\\\"diagnostics/apk38-build-observation.json\\\";target.write_text(json.dumps(out,indent=2)+\\\"\\\\n\\\");target.chmod(0o640)\\nprint(\\\"REDESIGN_APK_OBSERVATION=\\\"+json.dumps(out),flush=True)\\n\"\nCLEANUP_PROBE=\"import sys\\nsys.dont_write_bytecode=True\\nimport os,pathlib,pwd,fcntl,json,shutil,hashlib\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\");state=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nassert os.geteuid()==pwd.getpwnam(\\\"analyst-build\\\").pw_uid\\nsys.path.insert(0,str(root/\\\"deploy\\\"));import timeweb_workspace as workspace\\nwith (state/\\\"workspace.lock\\\").open(\\\"a\\\") as lock:\\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n before=workspace.source_hash()\\n assert before==\\\"a1efa109d547023935e8f08c445c68834192b73a130673425ef90487c892d227\\\"\\n receipt=workspace.previous(\\\"build\\\",before);apk=pathlib.Path(receipt[\\\"apk\\\"])\\n digest=workspace.sha(apk);assert digest==receipt[\\\"apk_sha256\\\"]\\n path=pathlib.Path(\\\"/var/cache/analyst-ai/gradle/caches/9.8.1/transforms\\\")\\n assert path.is_dir() and not path.is_symlink() and path.resolve()==path\\n assert path.stat().st_uid==os.geteuid() and not os.path.ismount(path)\\n for parent in path.parents:assert not parent.is_symlink()\\n free_before=shutil.disk_usage(root).free\\n shutil.rmtree(path)\\n free_after=shutil.disk_usage(root).free\\n assert workspace.source_hash()==before and workspace.sha(apk)==digest\\n workspace.require_capacity(\\\"runtime\\\")\\n report={\\\"path\\\":str(path),\\\"kind\\\":\\\"reproducible_gradle_transforms\\\",\\\"free_before\\\":free_before,\\\"free_after\\\":free_after,\\\"source_sha256\\\":before,\\\"apk_sha256\\\":digest,\\\"source_and_apk_unchanged\\\":True,\\\"runtime_capacity_passed\\\":True}\\n target=state/\\\"diagnostics/boot-capacity-cleanup.json\\\";target.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");target.chmod(0o640)\\n print(\\\"REDESIGN_CACHE_CLEANUP=\\\"+json.dumps(report),flush=True)\\n\"\nBOOT_PAYLOAD=\"\"\nimport shutil,pwd\ndef as_builder(code,label):\n p=subprocess.run([RUNUSER,\"-u\",\"analyst-build\",\"--\",\"python3\",\"-B\",\"-\"],input=code,text=True,cwd=\"/srv/analyst-ai/workspace\",capture_output=True,timeout=60)\n for line in p.stdout.splitlines():\n  if line.startswith(\"REDESIGN_\"):print(line,flush=True)\n if p.returncode:\n  print(\"REDESIGN_BUILDER_PROBE_FAILURE=\"+json.dumps({\"probe\":label,\"exit_code\":p.returncode,\"stderr_tail\":p.stderr[-2000:]}),flush=True)\n  raise RuntimeError(\"builder_probe_failed:\"+label)\nas_builder(DETAIL_PROBE,\"apk_details\")\nif shutil.disk_usage(root).free<10*1024**3:as_builder(CLEANUP_PROBE,\"bounded_cache_cleanup\")\nelse:print(\"REDESIGN_CACHE_CLEANUP=\"+json.dumps({\"skipped\":True,\"reason\":\"capacity_already_sufficient\",\"free_bytes\":shutil.disk_usage(root).free}),flush=True)\ndata=zlib.decompress(base64.b64decode(BOOT_PAYLOAD))\nassert len(data)==39309 and hashlib.sha256(data).hexdigest()==\"265b4615dd81c072958d8ad3c605801ee73cff07e54b15470503dbedc8aa9940\"\ntarget=state/\"boot_evidence_240.py\";assert not target.is_symlink()\ntmp=target.with_suffix(\".next\");tmp.write_bytes(data);tmp.chmod(0o640)\naccount=pwd.getpwnam(\"analyst-build\");os.chown(tmp,account.pw_uid,account.pw_gid);os.replace(tmp,target)\nunit=\"analyst-boot-evidence-38-20261025\"\ncmd=[\"systemd-run\",\"--no-block\",\"--unit=\"+unit,\"--property=Type=oneshot\",\"--property=User=analyst-build\",\"--property=Group=analyst-build\",\"--property=WorkingDirectory=/srv/analyst-ai/workspace\",\"--property=UMask=0027\",\"--property=MemoryHigh=4800M\",\"--property=MemoryMax=5200M\",\"--property=MemorySwapMax=512M\",\"--property=CPUWeight=20\",\"--property=IOWeight=20\",\"--property=Nice=10\",\"--property=TasksMax=512\",\"--property=TimeoutStartSec=420\",\"--property=TimeoutStopSec=30\",\"--property=KillMode=control-group\",\"--property=SendSIGKILL=yes\",\"/var/lib/analyst-ai-build/venv/bin/python\",\"-B\",str(target)]\nsubprocess.run(cmd,check=True,capture_output=True,text=True,timeout=15)\nprint(\"REDESIGN_BOOT_DIAGNOSTIC_STARTED=\"+json.dumps({\"unit\":unit,\"observation_seconds\":240,\"apk_installed\":False,\"runtime_release_gate\":False}),flush=True)\n",timeout=210)
          PY
