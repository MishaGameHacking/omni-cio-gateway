                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)

                      script="import datetime,hashlib,json,os,pathlib,shlex,shutil,subprocess,sys\nos.umask(0o077)\ndata=json.load(sys.stdin)\nw=pathlib.Path(\"/root/analyst-apk-direct-20261024\")\ndelivery=json.loads((w/\"delivery.json\").read_text());proof=json.loads((w/\"external-download-verification.json\").read_text());build=json.loads((w/\"build-result.json\").read_text())\nassert proof[\"public_download_verified\"] and proof[\"sha256\"]==build[\"apk\"][\"sha256\"]==delivery[\"release\"][\"apk_sha256\"]\nassert build[\"status\"]==\"build_verified_runtime_pending\"\nassert hashlib.sha256((w/\"Analyst-AI-0.11.0-preview.apk\").read_bytes()).hexdigest()==proof[\"sha256\"]\nassert hashlib.sha256((w/\"build-evidence.tar.gz\").read_bytes()).hexdigest()==\"47806472c3967003f0449bba2bf63ea162a14618844188a92a98f064b1bf1c07\"\nassert pathlib.Path(\"/root/.android/debug.keystore\").is_file()\nr=json.loads((w/\"builder.json\").read_text());assert r[\"id\"]==9414007 and r[\"ip\"]==\"147.45.153.40\"\nbc=[\"ssh\",\"-F\",\"/dev/null\",\"-i\",str(w/\"builder-key\"),\"-o\",\"BatchMode=yes\",\"-o\",\"IdentitiesOnly=yes\",\"-o\",\"StrictHostKeyChecking=yes\",\"-o\",\"HostKeyAlgorithms=ssh-ed25519\",\"-o\",\"UserKnownHostsFile=\"+str(w/\"builder-known-hosts\"),\"-o\",\"ConnectTimeout=10\",\"-o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\",\"root@\"+r[\"ip\"]]\ninspect=\"import json,pathlib,subprocess\\nw=pathlib.Path('/root/analyst-apk-build');r=json.loads((w/'result.json').read_text());assert r['status']=='build_verified_runtime_pending'\\np=pathlib.Path('/root/.gradle');files=[x for d in ('caches','wrapper') for x in (p/d).rglob('*') if x.is_file() and not x.is_symlink()]\\nprint(json.dumps({'cache_bytes':sum(x.stat().st_size for x in files),'cache_files':len(files),'resources':subprocess.check_output(['systemctl','show','analyst-apk-direct-build','-p','MemoryPeak','-p','CPUUsageNSec','-p','ExecMainStatus'],text=True)}))\\n\"\nq=subprocess.run(bc+[\"python3 -c \"+shlex.quote(inspect)],capture_output=True,text=True,timeout=60)\nassert q.returncode==0,\"builder_preservation_inspection_failed\"\ncache=json.loads(q.stdout);cache[\"copied\"]=False\nif not pathlib.Path(\"/root/.gradle/caches\").exists() and shutil.disk_usage(\"/\").free>cache[\"cache_bytes\"]+3*1024**3:\n    source=subprocess.Popen(bc+[\"tar -cf - -C /root .gradle/caches .gradle/wrapper\"],stdout=subprocess.PIPE,stderr=subprocess.PIPE)\n    try:\n        dest=subprocess.run([\"tar\",\"-xf\",\"-\",\"-C\",\"/root\"],stdin=source.stdout,capture_output=True,timeout=240)\n        source.stdout.close();source.wait(timeout=30)\n        assert source.returncode==0 and dest.returncode==0,\"gradle_cache_transfer_failed\"\n    finally:\n        if source.poll() is None:source.terminate()\n    files=[x for d in (\"caches\",\"wrapper\") for x in (pathlib.Path(\"/root/.gradle\")/d).rglob(\"*\") if x.is_file() and not x.is_symlink()]\n    assert len(files)==cache[\"cache_files\"] and sum(x.stat().st_size for x in files)==cache[\"cache_bytes\"]\n    cache[\"copied\"]=True\n(w/\"main-server-build-cache.json\").write_text(json.dumps(cache,indent=2)+\"\\n\")\nrepo=pathlib.Path(\"/root/analyst-ai-development-79be1821\")\nheading=data[\"policy\"].splitlines()[0]\nfor name in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    p=repo/name;text=p.read_text()\n    if heading in text:\n        before,old=text.split(heading,1)\n        assert \"\\n## \" not in old,\"newer_section_after_resource_policy\"\n        text=before.rstrip()\n    p.write_text(text.rstrip()+\"\\n\\n\"+data[\"policy\"].rstrip()+\"\\n\")\nreadme=repo/\"README.md\";text=readme.read_text()\nstart=text.index(\"**24.10.2026 — сервер владельца запущен; APK 0.11.0 ещё не выпущен.**\")\nend=text.index(\"**Уточнение OWNER 23.10.2026:\",start)\nblock=\"**24.10.2026 — APK 0.11.0-preview / 35 доступен для ручной установки.**\\nСобран на Timeweb с действующим HTTPS-адресом сервера и прежней подписью.\\n143 JVM-теста, lintPreview, подпись, manifest portrait и статическая проверка\\n16-KB библиотек прошли. Публичное скачивание проверено по полному SHA-256.\\n[Скачать APK](\"+delivery[\"url\"]+\").\\nПолная runtime-матрица и проверка на телефоне не завершены; ИИ пока не подключён.\\nЭто preview по прямому запросу владельца, а не заявление о полностью зелёной ветке.\\nДальнейшие работы выполняются на основных серверах без временных и дублирующих VM.\\nПодробности — в [PLAN_STATUS](docs/PLAN_STATUS.md).\\n\\n\"\ntext=text[:start]+block+text[end:]\ntext=text.replace(\"полные runtime-матрицы нового объединённого SHA ещё обязательны. APK не выпущен.\",\"полные runtime-матрицы нового объединённого SHA ещё обязательны. APK выдан как preview по уточнению OWNER 24.10.2026; полной готовностью это не объявляется.\",1)\nreadme.write_text(text.rstrip()+\"\\n\")\nentry=\"\\n## Ручная доставка APK 0.11.0 — 24.10.2026\\n\\nПо прямому уточнению OWNER APK собран и передан для самостоятельной установки.\\n0.11.0-preview /35, ru.omnicio.app.debug, Android17/API37, portrait.\\nSHA-256: \"+proof[\"sha256\"]+\"; размер \"+str(proof[\"bytes\"])+\" байт.\\nСертификат: \"+proof[\"certificate_sha256\"]+\".\\nИсходник \"+build[\"source_head\"]+\", diff SHA-256 \"+build[\"source_diff_sha256\"]+\".\\n143 JVM-теста без ошибок/пропусков, lintPreview, 3D-ассеты, apksig,\\nzipalign -P16, ELF-выравнивание и portrait manifest прошли.\\nНовый адрес analyst-ai-2941515.twc1.net находится в DEX; заглушка отсутствует.\\nПубличный файл полностью скачан и сверен по SHA-256; /health=200,\\n/workspace без авторизации=401. Установка владельцем не подтверждена.\\nПолная UI-матрица 4KB/16KB, ошибка курсора при font200 и рабочий AI-ключ\\nостаются открытыми. Этот ручной preview не закрывает эти проверки.\\nURL: \"+delivery[\"url\"]+\"\\n\"\np=repo/\"docs/PLAN_STATUS.md\";text=p.read_text()\nif \"## Ручная доставка APK 0.11.0 — 24.10.2026\" not in text:p.write_text(text.rstrip()+\"\\n\"+entry.rstrip()+\"\\n\")\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True,timeout=15)\nresult={\"ready_to_remove_builder\":True,\"builder_id\":9414007,\"apk_sha256\":proof[\"sha256\"],\"verified_download_url\":proof[\"url\"],\"cache\":cache,\"source_and_signing_key_preserved\":True,\"policy_no_temporary_servers_saved\":True,\"prepared_at\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\n(w/\"removal-prerequisites.json\").write_text(json.dumps(result,indent=2)+\"\\n\")\nprint(\"TIMEWEB_MAIN_SERVER_PRESERVATION=\"+json.dumps(result),flush=True)\n"
                      outcome=subprocess.run(command+["python3 -u -c "+shlex.quote(script)],input=json.dumps({"policy":"## OWNER 24.10.2026 — мощность по фактической потребности\n\nДля всех ресурсов Timeweb выбирать необходимую производительность по измеренной\nнагрузке и требованиям приложения, без избыточного запаса. Не выбирать тариф\nтолько по минимальной цене и не заказывать более мощный без подтвержденной причины.\nЭто уточнение отменяет прежние ограничения региона: страна, город и тип ресурса\nне фиксированы; выбирать их по доступности зависимостей, задержкам, надежности\nи полной стоимости. Разработка и сборка остаются на Timeweb; GitHub — резервная\nкопия и уже разрешенный административный транспорт.\n\nПоследнее уточнение OWNER: запрещено создавать временные и дублирующие серверы.\nРазработка, сборки, проверки и запуск выполняются на основных серверах проекта,\nс изменениями существующих основных исходников. Уже созданные лишние машины\nудалять после сохранения исходников, подписи, данных и проверенного результата.\nПри подтвержденной нехватке ресурсов менять конфигурацию основного сервера,\nпроверяя возможность обратного изменения, необходимость перезагрузки и полную\nцену. Увеличение диска не считать обратимым. Запрет на новые серверы также\nраспространяется на скрытое создание VM, кластера или дублирующего окружения.\n\nРазделять внутри основной инфраструктуры backend, данные и резервные копии,\nсборки/проверки и оплачиваемые по запросам AI-вызовы. Для каждой платной сущности\nнужны назначение, измерение потребности и условие завершения использования.\nПроверять фактическое прекращение списаний; выключение не равно удалению.\n100% постоянной загрузки не является целью: нужны приемлемые задержки,\nотсутствие OOM/ошибок и мощность, обоснованная реальными измерениями.\nНе обещать оплату VPS за фактический процент CPU при тарификации ресурсов\nпо времени. Менять размер после выявления узкого места; отдельные K8s,\nбалансировщик и БД добавлять только при доказанной необходимости.\nBackend применять после проверки на основной установке; нативные изменения\nAndroid доставлять новым APK. Правка исходника не меняет установленный APK.\n"}).encode(),capture_output=True,timeout=420)
                      print(outcome.stdout.decode(),flush=True)
                      if outcome.returncode:print("PRESERVATION_FAILURE="+json.dumps({"exit":outcome.returncode,"stderr":outcome.stderr.decode(errors="replace")[-3500:]}),flush=True)
                      assert outcome.returncode==0,"do_not_delete_until_preserved"
                      def api(method,path,body=None):
