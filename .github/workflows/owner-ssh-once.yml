name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,os,stat,fcntl,platform,datetime,shutil,xml.etree.ElementTree as ET\nsdk=pathlib.Path(\"/opt/analyst-android-sdk\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\nresult={\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"platform\":{\"kernel\":platform.release(),\"machine\":platform.machine()}}\nlines=pathlib.Path(\"/proc/cpuinfo\").read_text().splitlines()\nresult[\"cpu\"]={\"logical_processors\":sum(x.startswith(\"processor\") for x in lines),\"model_names\":sorted({x.split(\":\",1)[1].strip() for x in lines if x.startswith(\"model name\")}),\"virtualization_flags\":sorted(set(\" \".join(x.split(\":\",1)[1] for x in lines if x.startswith(\"flags\")).split())&{\"vmx\",\"svm\",\"hypervisor\"}),\"cpu_online\":pathlib.Path(\"/sys/devices/system/cpu/online\").read_text().strip()}\nresult[\"kvm\"]={\"path_exists\":pathlib.Path(\"/dev/kvm\").exists()}\nif pathlib.Path(\"/dev/kvm\").exists():\n p=pathlib.Path(\"/dev/kvm\");s=p.stat();result[\"kvm\"].update(character_device=stat.S_ISCHR(s.st_mode),mode=oct(stat.S_IMODE(s.st_mode)),uid=s.st_uid,gid=s.st_gid)\n try:\n  fd=os.open(p,os.O_RDWR|os.O_CLOEXEC)\n  try:\n   api=fcntl.ioctl(fd,0xAE00,0);vm=fcntl.ioctl(fd,0xAE01,0)\n   result[\"kvm\"].update(api_version=api,create_vm_succeeded=True);os.close(vm)\n  finally:os.close(fd)\n except OSError as e:result[\"kvm\"].update(create_vm_succeeded=False,errno=e.errno)\nfor module in (\"kvm\",\"kvm_intel\",\"kvm_amd\"):\n p=pathlib.Path(\"/sys/module\")/module\n result[\"kvm\"][module+\"_loaded\"]=p.exists()\n q=p/\"parameters/nested\"\n if q.is_file():result[\"kvm\"][module+\"_nested\"]=q.read_text().strip()\nrunuser=shutil.which(\"runuser\");assert runuser\nfor label,args in ((\"emulator_version\",[\"-version\"]),(\"emulator_acceleration\",[\"-accel-check\"])):\n r=subprocess.run([runuser,\"-u\",\"analyst-build\",\"--\",str(sdk/\"emulator/emulator\"),*args],capture_output=True,text=True,timeout=15)\n result[label]={\"returncode\":r.returncode,\"stdout\":r.stdout[:6000],\"stderr\":r.stderr[:2500]}\nresult[\"packages\"]=[]\nfor meta in sorted((sdk/\"system-images\").rglob(\"package.xml\")):\n raw=meta.read_text();root=ET.fromstring(raw)\n details={\"directory\":str(meta.parent),\"xml\":raw[:7000],\"files\":[{\"name\":p.name,\"bytes\":p.stat().st_size} for p in sorted(meta.parent.iterdir()) if p.is_file()]}\n prop=meta.parent/\"source.properties\"\n if prop.is_file():details[\"source_properties\"]=prop.read_text()\n result[\"packages\"].append(details)\nresult[\"memory\"]={line.split(\":\")[0]:line.split(\":\",1)[1].strip() for line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if line.split(\":\")[0] in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}}\nresult[\"host_pressure\"]={k:pathlib.Path(\"/proc/pressure\",k).read_text().strip() for k in (\"cpu\",\"memory\",\"io\")}\nresult[\"proc_stat_cpu\"]=[x for x in pathlib.Path(\"/proc/stat\").read_text().splitlines() if x.startswith(\"cpu\")][:8]\nresult[\"service_states\"]={}\nfor unit in (\"analyst-ai-owner.service\",\"analyst-workspace@build.service\",\"analyst-workspace@runtime.service\",\"analyst-ai-runtime-leaf-4k-fdb.service\"):\n r=subprocess.run([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\"],capture_output=True,text=True,check=True,timeout=10)\n result[\"service_states\"][unit]=r.stdout\np=state/\"diagnostics/runtime-environment-after-cash.json\";p.write_text(json.dumps(result,indent=2)+\"\\n\");p.chmod(0o600)\nprint(\"REDESIGN_RUNTIME_ENVIRONMENT=\"+json.dumps(result),flush=True)\n",timeout=150)
          PY
