name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-final-cleanup-verification
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify only necessary Timeweb resources remain and back up the final evidence
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
                      def read_api(path):
                          request=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                          with opener.open(request,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
                      servers=p.read_resource(token,"servers");assert p.summarize("servers",servers)["complete"]
                      ips=read_api("/floating-ips");assert ips["meta"]["total"]==len(ips["ips"])
                      physical=read_api("/dedicated-servers/121673")["dedicated_server"];assert physical["id"]==121673 and physical["name"]=="analyst-ai-msk-20261024" and physical["project_id"]==2941515
                      project=read_api("/projects/2941515/resources")
                      inventory={"cloud_server_ids":sorted(x["id"] for x in servers["servers"]),"floating_ip_ids":sorted(x["id"] for x in ips["ips"]),"builder":{k:physical.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")},"project_resource_counts":{k:len(v) for k,v in project.items() if isinstance(v,list)}}
                      script="import datetime,json,pathlib,subprocess,sys\nroot=pathlib.Path(\"/root\");inventory=json.loads(sys.argv[1])\nassert inventory[\"cloud_server_ids\"]==[9413105] and inventory[\"floating_ip_ids\"]==[\"40e88e4d-7807-4c99-80a3-f384db68e93a\"]\ncomparison=json.loads((root/\"analyst-telegram-configured-source-ip-comparison.json\").read_text())\nassert comparison[\"temporary_linux_address_removed\"] and comparison[\"default_route_unchanged\"] and not comparison[\"comparison_improved\"]\ninterfaces=json.loads(subprocess.check_output([\"ip\",\"-j\",\"-4\",\"address\",\"show\"],text=True))\naddresses={a[\"local\"] for iface in interfaces for a in iface.get(\"addr_info\",[]) if a.get(\"family\")==\"inet\"}\nassert \"201.24.52.66\" in addresses and \"5.42.112.49\" not in addresses and \"200.165.233.11\" not in addresses\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),**inventory,\"temporary_addresses_removed_from_linux\":True,\"source_ip_change_fixed_telegram\":False,\"telegram_original_successes\":comparison[\"original_ip_successes\"],\"telegram_alternative_successes\":comparison[\"new_ip_successes\"],\"telegram_attempts_per_source\":6,\"application_started\":False,\"working_apk_published\":False}\ntarget=root/\"analyst-timeweb-final-state.json\";target.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nrepo=root/\"analyst-ai-development-79be1821\"\nnote=\"Итог очистки и контроль маршрута 24.10.2026: \"+json.dumps(report,ensure_ascii=False)+\". Пробные IPv4 200.165.233.11 и 5.42.112.49 освобождены в Timeweb; второй был реально настроен в Linux для парного сравнения и затем удалён из ОС. Первое наблюдение без настройки ОС не было проверкой маршрута. Новые DNS/маршрут/платные адреса по неподтверждённой гипотезе не оставлены. Данные об ошибке курсора и необходимости реального входа владельца сохраняются; рабочий выпуск не объявляется.\\n\"\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=repo/rel;text=path.read_text();assert note not in text;path.write_text(text.rstrip()+\"\\n\\n\"+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"TIMEWEB_FINAL_STATE=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script)+" "+shlex.quote(json.dumps(inventory)),timeout=90).decode()
                      print(output,end="",flush=True)
                      docs=json.loads(p.remote(command,"python3 -c "+shlex.quote("import json,pathlib\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\"\nsecret=json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"TELEGRAM_CLIENT_SECRET\"]\nfiles={rel:(repo/rel).read_text() for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\")}\nassert all(secret not in text and \"-----BEGIN OPENSSH PRIVATE KEY-----\" not in text and \"-----BEGIN PRIVATE KEY-----\" not in text for text in files.values())\nprint(json.dumps(files))\n"),timeout=30))
                      assert set(docs)=={"AGENTS.md","docs/MASTER_PLAN.md","docs/PLAN_STATUS.md"}
                      def gh(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"+path,method=method,data=data,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              raw=response.read(4*1024*1024+1)
                          return json.loads(raw) if raw else {}
                      ref=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert ref["object"]["sha"]==os.environ["GITHUB_SHA"],"backup_ref_changed"
                      commit=gh("GET","/git/commits/"+ref["object"]["sha"])
                      tree=gh("POST","/git/trees",{"base_tree":commit["tree"]["sha"],"tree":[{"path":path,"mode":"100644","type":"blob","content":text} for path,text in docs.items()]})
                      backed=gh("POST","/git/commits",{"message":"Back up Timeweb cleanup evidence and current owner instructions","tree":tree["sha"],"parents":[ref["object"]["sha"]]})
                      current=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert current["object"]["sha"]==ref["object"]["sha"],"backup_ref_changed"
                      gh("PATCH","/git/refs/heads/codex/timeweb-owner-prepare-2026-10-23",{"sha":backed["sha"],"force":False})
                      print("TIMEWEB_DOCUMENT_BACKUP="+json.dumps({"sha":backed["sha"],"tree":tree["sha"],"files":sorted(docs),"edited_on":"Timeweb 9413105"}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
