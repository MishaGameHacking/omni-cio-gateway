name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("DEPLOY_SCRIPT=\"MIGRATION=\\\"import asyncio,json,socket\\\\ndef no_network(*args,**kwargs):raise RuntimeError(\\\\\\\"isolated_migration_network_forbidden\\\\\\\")\\\\nsocket.socket.connect=no_network\\\\nsocket.socket.connect_ex=no_network\\\\nimport httpx\\\\nimport app,owner_app,autonomous_ai\\\\nwith app.connect() as db:\\\\n before=[tuple(row) for row in db.execute(\\\\\\\"SELECT id,telegram_sub,tinvest_token_encrypted FROM users ORDER BY id\\\\\\\")]\\\\nasync def run():\\\\n instance=owner_app.create_app()\\\\n async with instance.router.lifespan_context(instance):\\\\n  assert instance.state.single_owner_ready and not autonomous_ai.SCHEDULER_ENABLED\\\\n  assert autonomous_ai._scheduler_task is None\\\\n  async with httpx.AsyncClient(transport=httpx.ASGITransport(app=instance),base_url=\\\\\\\"http://isolated.invalid\\\\\\\") as client:\\\\n   statuses={}\\\\n   for path in (\\\\\\\"/health\\\\\\\",\\\\\\\"/workspace\\\\\\\",\\\\\\\"/automation/status\\\\\\\",\\\\\\\"/automation/decisions\\\\\\\",\\\\\\\"/client/diagnostics/status\\\\\\\"):\\\\n    response=await client.get(path);statuses[path]=response.status_code\\\\n   assert statuses[\\\\\\\"/health\\\\\\\"]==200 and all(code==401 for path,code in statuses.items() if path!=\\\\\\\"/health\\\\\\\")\\\\n  with app.connect() as db:\\\\n   after=[tuple(row) for row in db.execute(\\\\\\\"SELECT id,telegram_sub,tinvest_token_encrypted FROM users ORDER BY id\\\\\\\")]\\\\n   assert after==before,\\\\\\\"existing_owner_or_connections_changed\\\\\\\"\\\\n   assert db.execute(\\\\\\\"PRAGMA integrity_check\\\\\\\").fetchone()[0]==\\\\\\\"ok\\\\\\\"\\\\n  print(\\\\\\\"EXISTING_DATABASE_MIGRATION=\\\\\\\"+json.dumps({\\\\\\\"statuses\\\\\\\":statuses,\\\\\\\"owner_and_connections_preserved\\\\\\\":True,\\\\\\\"scheduler_disabled\\\\\\\":True,\\\\\\\"network_connect_blocked\\\\\\\":True,\\\\\\\"integrity_check\\\\\\\":\\\\\\\"ok\\\\\\\"}),flush=True)\\\\nasyncio.run(run())\\\\n\\\"\\nSMOKE=\\\"import asyncio,json,sqlite3\\\\nimport httpx\\\\nimport owner_app,app,autonomous_ai\\\\nasync def run():\\\\n instance=owner_app.create_app()\\\\n async with instance.router.lifespan_context(instance):\\\\n  assert instance.state.single_owner_ready\\\\n  assert autonomous_ai.SCHEDULER_ENABLED and autonomous_ai._scheduler_task is not None\\\\n  async with httpx.AsyncClient(transport=httpx.ASGITransport(app=instance),base_url=\\\\\\\"http://isolated.invalid\\\\\\\") as client:\\\\n   statuses={}\\\\n   for path in (\\\\\\\"/health\\\\\\\",\\\\\\\"/workspace\\\\\\\",\\\\\\\"/automation/status\\\\\\\",\\\\\\\"/automation/decisions\\\\\\\",\\\\\\\"/client/diagnostics/status\\\\\\\"):\\\\n    response=await client.get(path);statuses[path]=response.status_code\\\\n   assert statuses[\\\\\\\"/health\\\\\\\"]==200\\\\n   assert all(code==401 for path,code in statuses.items() if path!=\\\\\\\"/health\\\\\\\")\\\\n  with app.connect() as db:\\\\n   tables={r[0] for r in db.execute(\\\\\\\"SELECT name FROM sqlite_master WHERE type='table'\\\\\\\")}\\\\n   required={\\\\\\\"automation_preferences\\\\\\\",\\\\\\\"automation_observations\\\\\\\",\\\\\\\"automation_discovery\\\\\\\",\\\\\\\"automation_events\\\\\\\",\\\\\\\"client_diagnostic_events\\\\\\\"}\\\\n   assert required<=tables\\\\n   assert db.execute(\\\\\\\"SELECT COUNT(*) FROM users WHERE tinvest_token_encrypted IS NOT NULL\\\\\\\").fetchone()[0]==0\\\\n  print(\\\\\\\"ISOLATED_STARTUP=\\\\\\\"+json.dumps({\\\\\\\"statuses\\\\\\\":statuses,\\\\\\\"required_tables\\\\\\\":sorted(required),\\\\\\\"scheduler_task_created\\\\\\\":True,\\\\\\\"synthetic_environment\\\\\\\":True}),flush=True)\\\\nasyncio.run(run())\\\\n\\\"\\nimport datetime,fcntl,hashlib,json,os,pathlib,pwd,shutil,signal,sqlite3,stat,subprocess,sys,tempfile,time,traceback\\nfrom http.client import HTTPConnection\\nRUNUSER=shutil.which(\\\"runuser\\\")\\nassert RUNUSER,\\\"runuser_executable_missing\\\"\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\")\\nbuild=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\ninstall=pathlib.Path(\\\"/opt/analyst-ai\\\")\\nenv_path=pathlib.Path(\\\"/etc/analyst-ai/backend.env\\\")\\ndatabase=pathlib.Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\npublic=pathlib.Path(\\\"/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json\\\")\\nstamp=datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%SZ\\\")\\nbackup=pathlib.Path(\\\"/var/backups/analyst-ai\\\")/(\\\"redesign-\\\"+stamp)\\nstage=install/(\\\"backend.next-\\\"+stamp);previous=install/(\\\"backend.previous-\\\"+stamp)\\nreceipt={\\\"status\\\":\\\"preflight\\\",\\\"started_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"backup\\\":str(backup)}\\nresult=build/\\\"backend-redesign-result.json\\\"\\nswapped=False;stopped=False;environment_changed=False;previous_moved=False\\ndef save():\\n temp=result.with_suffix(\\\".next\\\");temp.write_text(json.dumps(receipt,indent=2)+\\\"\\\\n\\\");temp.chmod(0o600);os.replace(temp,result)\\ndef sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()\\ndef run(args,timeout=60,**kwargs):\\n r=subprocess.run(args,capture_output=True,text=True,timeout=timeout,**kwargs)\\n if r.returncode:\\n  if backup.is_dir():\\n   failure=backup/\\\"command-failure.json\\\"\\n   failure.write_text(json.dumps({\\\"program\\\":pathlib.Path(args[0]).name,\\\"returncode\\\":r.returncode,\\\"stdout\\\":r.stdout[-8000:],\\\"stderr\\\":r.stderr[-8000:]},indent=2)+\\\"\\\\n\\\");failure.chmod(0o600)\\n  raise RuntimeError(\\\"command_failed:\\\"+pathlib.Path(args[0]).name)\\n return r.stdout\\ndef signal_failure(signum,frame):raise RuntimeError(\\\"deployment_interrupted\\\")\\nsignal.signal(signal.SIGTERM,signal_failure);signal.signal(signal.SIGINT,signal_failure)\\ndef probe():\\n statuses={}\\n try:\\n  for path in (\\\"/health\\\",\\\"/workspace\\\",\\\"/automation/status\\\",\\\"/automation/decisions\\\",\\\"/client/diagnostics/status\\\"):\\n   c=HTTPConnection(\\\"127.0.0.1\\\",8080,timeout=3)\\n   try:c.request(\\\"GET\\\",path);r=c.getresponse();body=r.read(4096);statuses[path]=r.status\\n   finally:c.close()\\n   if path==\\\"/health\\\" and (r.status!=200 or json.loads(body)!={\\\"status\\\":\\\"ok\\\"}):return None\\n  return statuses if all(code==401 for path,code in statuses.items() if path!=\\\"/health\\\") else None\\n except Exception:return None\\ndef wait_health():\\n for _ in range(25):\\n  answer=probe()\\n  if answer:return answer\\n  time.sleep(1)\\n raise RuntimeError(\\\"backend_health_or_authentication_failed\\\")\\ndef replace_env(raw):\\n fd,tmp=tempfile.mkstemp(prefix=\\\".backend-redesign-\\\",dir=env_path.parent)\\n try:\\n  with os.fdopen(fd,\\\"wb\\\") as f:f.write(raw);f.flush();os.fsync(f.fileno())\\n  os.chmod(tmp,0o600);os.replace(tmp,env_path)\\n finally:\\n  if os.path.exists(tmp):os.unlink(tmp)\\nsave()\\nwith (build/\\\"workspace.lock\\\").open(\\\"a\\\") as lock:\\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n try:\\n  checked=json.loads((build/\\\"check-result.json\\\").read_text())\\n  digest=run([RUNUSER,\\\"-u\\\",\\\"analyst-build\\\",\\\"--\\\",\\\"python3\\\",\\\"-c\\\",\\\"import sys;sys.path.insert(0,'/srv/analyst-ai/workspace/deploy');import timeweb_workspace;print(timeweb_workspace.source_hash())\\\"],cwd=root).strip()\\n  assert checked.get(\\\"status\\\")==\\\"passed\\\" and checked.get(\\\"source_sha256\\\")==digest,\\\"current_sources_must_pass_check\\\"\\n  assert digest==\\\"313e90d767982341c88503ddca207ff33cf4adf9839dbe6c35206ebab104e70e\\\",\\\"unexpected_unary_rollout_source\\\"\\n  receipt[\\\"source_sha256\\\"]=digest\\n  assert install.is_dir() and not install.is_symlink() and (install/\\\"backend\\\").is_dir() and not (install/\\\"backend\\\").is_symlink(),\\\"production_backend_directory_invalid\\\"\\n  assert sha(root/\\\"backend/requirements.txt\\\")==sha(install/\\\"backend/requirements.txt\\\"),\\\"production_dependencies_changed\\\"\\n  prior_manifest=pathlib.Path(\\\"/var/backups/analyst-ai/redesign-20261025T102307Z/candidate-sources.json\\\")\\n  prior_files=json.loads(prior_manifest.read_text())\\n  assert prior_files and all(isinstance(x,dict) and set(x)=={\\\"path\\\",\\\"sha256\\\"} for x in prior_files),\\\"previous_deployment_manifest_invalid\\\"\\n  for old in prior_files:\\n   p=install/\\\"backend\\\"/old[\\\"path\\\"]\\n   assert p.is_file() and not p.is_symlink() and sha(p)==old[\\\"sha256\\\"],\\\"production_changed_since_previous_deployment\\\"\\n  receipt[\\\"previous_sources_verified\\\"]=True\\n  for p in (env_path,database,public):\\n   assert p.is_file() and not p.is_symlink(),\\\"production_path_not_regular\\\"\\n  env_before=env_path.read_bytes();manifest_before=public.read_bytes()\\n  config={}\\n  for line in env_before.decode().splitlines():\\n   if not line or line.lstrip().startswith(\\\"#\\\"):continue\\n   k,v=line.split(\\\"=\\\",1)\\n   assert k not in config,\\\"duplicate_environment_key\\\"\\n   config[k]=json.loads(v) if v.startswith('\\\"') else v\\n  assert config.get(\\\"ANALYSIS_SCHEDULER_ENABLED\\\",\\\"false\\\").lower() in (\\\"true\\\",\\\"1\\\",\\\"yes\\\"),\\\"unexpected_scheduler_configuration\\\"\\n  assert config.get(\\\"AI_EXTERNAL_PROCESSING_APPROVED\\\",\\\"false\\\").lower() in (\\\"false\\\",\\\"0\\\",\\\"no\\\"),\\\"unexpected_external_ai_activation\\\"\\n  assert config.get(\\\"AI_USER_DAILY_RUB\\\",\\\"0\\\") in (\\\"0\\\",\\\"0.0\\\",\\\"0.00\\\") and config.get(\\\"AI_PROJECT_DAILY_RUB\\\",\\\"0\\\") in (\\\"0\\\",\\\"0.0\\\",\\\"0.00\\\"),\\\"unexpected_ai_spending_configuration\\\"\\n  env_after=env_before\\n  backup.mkdir(parents=True,mode=0o700,exist_ok=False);backup.chmod(0o700)\\n  (backup/\\\"backend.env\\\").write_bytes(env_before);(backup/\\\"backend.env\\\").chmod(0o600)\\n  (backup/\\\"public-manifest.json\\\").write_bytes(manifest_before)\\n  source=sqlite3.connect(\\\"file:\\\"+str(database)+\\\"?mode=ro\\\",uri=True);destination=sqlite3.connect(backup/\\\"backend.db\\\")\\n  try:source.backup(destination,pages=256,sleep=.01)\\n  finally:destination.close();source.close()\\n  (backup/\\\"backend.db\\\").chmod(0o600)\\n  stage.mkdir(mode=0o755);stage.chmod(0o755);(stage/\\\"certs\\\").mkdir(mode=0o755);(stage/\\\"certs\\\").chmod(0o755)\\n  files=sorted(p for p in (root/\\\"backend\\\").iterdir() if p.suffix in (\\\".py\\\",\\\".json\\\") or p.name==\\\"requirements.txt\\\")\\n  files.append(root/\\\"backend/certs/russian_trusted_root_ca.pem\\\")\\n  code=[]\\n  for p in files:\\n   assert p.is_file() and not p.is_symlink(),\\\"unsafe_backend_source\\\"\\n   relative=p.relative_to(root/\\\"backend\\\");target=stage/relative\\n   shutil.copyfile(p,target);target.chmod(0o644)\\n   code.append({\\\"path\\\":str(relative),\\\"sha256\\\":sha(target)})\\n  (backup/\\\"candidate-sources.json\\\").write_text(json.dumps(code,indent=2)+\\\"\\\\n\\\")\\n  smoke_dir=pathlib.Path(\\\"/var/lib/analyst-ai\\\")/(\\\"redesign-smoke-\\\"+stamp)\\n  smoke_dir.mkdir(mode=0o700);account=pwd.getpwnam(\\\"analyst-ai\\\");os.chown(smoke_dir,account.pw_uid,account.pw_gid)\\n  smoke_env={\\\"PATH\\\":\\\"/usr/bin:/bin\\\",\\\"LANG\\\":\\\"C.UTF-8\\\",\\\"PYTHONDONTWRITEBYTECODE\\\":\\\"1\\\",\\\"TELEGRAM_CLIENT_ID\\\":\\\"123456\\\",\\\"TELEGRAM_CLIENT_SECRET\\\":\\\"test-only\\\",\\\"ANALYST_OWNER_TELEGRAM_SUB\\\":\\\"synthetic-redesign-owner\\\",\\\"BACKEND_PUBLIC_URL\\\":\\\"https://example.invalid\\\",\\\"FERNET_KEY\\\":\\\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\\\",\\\"DATABASE_PATH\\\":str(smoke_dir/\\\"backend.db\\\"),\\\"ANALYSIS_SCHEDULER_ENABLED\\\":\\\"true\\\",\\\"AI_EXTERNAL_PROCESSING_APPROVED\\\":\\\"false\\\",\\\"AI_USER_DAILY_RUB\\\":\\\"0\\\",\\\"AI_PROJECT_DAILY_RUB\\\":\\\"0\\\"}\\n  smoke=run([RUNUSER,\\\"-u\\\",\\\"analyst-ai\\\",\\\"--\\\",str(install/\\\"venv/bin/python\\\"),\\\"-c\\\",SMOKE],cwd=stage,env=smoke_env,timeout=60)\\n  assert \\\"ISOLATED_STARTUP=\\\" in smoke,\\\"isolated_startup_missing_receipt\\\"\\n  receipt[\\\"isolated_startup\\\"]=json.loads(smoke.split(\\\"ISOLATED_STARTUP=\\\",1)[1].splitlines()[0])\\n  clone=smoke_dir/\\\"existing-migration.db\\\";shutil.copyfile(backup/\\\"backend.db\\\",clone);clone.chmod(0o600);os.chown(clone,account.pw_uid,account.pw_gid)\\n  migration_env={**config,\\\"PATH\\\":\\\"/usr/bin:/bin\\\",\\\"LANG\\\":\\\"C.UTF-8\\\",\\\"PYTHONDONTWRITEBYTECODE\\\":\\\"1\\\",\\\"DATABASE_PATH\\\":str(clone),\\\"ANALYSIS_SCHEDULER_ENABLED\\\":\\\"false\\\",\\\"AI_EXTERNAL_PROCESSING_APPROVED\\\":\\\"false\\\",\\\"AI_USER_DAILY_RUB\\\":\\\"0\\\",\\\"AI_PROJECT_DAILY_RUB\\\":\\\"0\\\"}\\n  migrated=run([RUNUSER,\\\"-u\\\",\\\"analyst-ai\\\",\\\"--\\\",str(install/\\\"venv/bin/python\\\"),\\\"-c\\\",MIGRATION],cwd=stage,env=migration_env,timeout=60)\\n  assert \\\"EXISTING_DATABASE_MIGRATION=\\\" in migrated,\\\"existing_migration_receipt_missing\\\"\\n  receipt[\\\"existing_database_migration\\\"]=json.loads(migrated.split(\\\"EXISTING_DATABASE_MIGRATION=\\\",1)[1].splitlines()[0])\\n  receipt[\\\"status\\\"]=\\\"activating\\\";save()\\n  stopped=True;run([\\\"systemctl\\\",\\\"stop\\\",\\\"analyst-ai-owner.service\\\"],timeout=70)\\n  os.replace(install/\\\"backend\\\",previous);previous_moved=True\\n  os.replace(stage,install/\\\"backend\\\");swapped=True\\n  environment_changed=True;replace_env(env_after)\\n  run([\\\"systemctl\\\",\\\"start\\\",\\\"analyst-ai-owner.service\\\"],timeout=45);stopped=False\\n  receipt[\\\"local_routes\\\"]=wait_health()\\n  assert public.read_bytes()==manifest_before,\\\"public_apk_channel_changed\\\"\\n  assert env_path.read_bytes()==env_after,\\\"environment_changed_during_deployment\\\"\\n  for item in code:assert sha(install/\\\"backend\\\"/item[\\\"path\\\"])==item[\\\"sha256\\\"],\\\"deployed_code_changed\\\"\\n  receipt.update(status=\\\"deployed\\\",previous_backend=str(previous),public_apk_unchanged=True,scheduler_enabled=True,external_ai_enabled=False,real_order_execution_enabled=False)\\n except BaseException as error:\\n  receipt[\\\"error_type\\\"]=type(error).__name__;receipt[\\\"error\\\"]=str(error)\\n  if previous_moved or stopped:\\n   try:\\n    run([\\\"systemctl\\\",\\\"stop\\\",\\\"analyst-ai-owner.service\\\"],timeout=70)\\n    if previous_moved and previous.is_dir():\\n     if (install/\\\"backend\\\").exists():os.replace(install/\\\"backend\\\",install/(\\\"backend.failed-\\\"+stamp))\\n     os.replace(previous,install/\\\"backend\\\")\\n    if environment_changed:replace_env(env_before)\\n    run([\\\"systemctl\\\",\\\"start\\\",\\\"analyst-ai-owner.service\\\"],timeout=45)\\n    # Verify the previous version health contract after rollback.\\n    for _ in range(25):\\n     c=HTTPConnection(\\\"127.0.0.1\\\",8080,timeout=3)\\n     try:c.request(\\\"GET\\\",\\\"/health\\\");r=c.getresponse();good=r.status==200 and json.loads(r.read(1024))=={\\\"status\\\":\\\"ok\\\"}\\n     except Exception:good=False\\n     finally:c.close()\\n     if good:break\\n     time.sleep(1)\\n    assert good,\\\"rollback_health_failed\\\"\\n    receipt[\\\"status\\\"]=\\\"rolled_back\\\"\\n   except BaseException as rollback:\\n    receipt[\\\"status\\\"]=\\\"rollback_failed\\\";receipt[\\\"rollback_error\\\"]=type(rollback).__name__\\n  else:receipt[\\\"status\\\"]=\\\"preflight_failed\\\"\\n finally:\\n  receipt[\\\"finished_at\\\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\\n  print(\\\"REDESIGN_BACKEND_DEPLOYMENT=\\\"+json.dumps(receipt),flush=True)\\nif receipt[\\\"status\\\"]!=\\\"deployed\\\":raise SystemExit(1)\\n\"\nimport pathlib,json,subprocess,os,time\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nchecked=json.loads((state/\"check-result.json\").read_text())\nassert checked.get(\"status\")==\"passed\" and checked.get(\"source_sha256\")==\"313e90d767982341c88503ddca207ff33cf4adf9839dbe6c35206ebab104e70e\",\"unary_check_not_passed\"\ntarget=state/\"backend_unary_deploy.py\";assert not target.is_symlink()\ntmp=target.with_suffix(\".next\");tmp.write_text(DEPLOY_SCRIPT);tmp.chmod(0o600);os.replace(tmp,target)\nsubprocess.run([\"systemd-run\",\"--no-block\",\"--unit=analyst-backend-redesign-38-unary\",\"--property=Type=oneshot\",\"--property=WorkingDirectory=/srv/analyst-ai/workspace\",\"--property=UMask=0077\",\"--property=MemoryMax=512M\",\"--property=TimeoutStartSec=600\",\"--property=TimeoutStopSec=60\",\"--property=KillMode=control-group\",\"/usr/bin/python3\",\"-B\",str(target)],check=True,capture_output=True,text=True,timeout=15)\nprint(\"REDESIGN_UNARY_DEPLOY_STARTED=\"+json.dumps({\"source_sha256\":checked[\"source_sha256\"]}),flush=True)\nfor _ in range(5):\n time.sleep(3)\n r=json.loads((state/\"backend-redesign-result.json\").read_text())\n if r.get(\"source_sha256\")==checked[\"source_sha256\"] and r.get(\"status\") not in (\"preflight\",\"activating\"):\n  print(\"REDESIGN_BACKEND_DEPLOYMENT=\"+json.dumps(r),flush=True);break\n",timeout=150)
