name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-external-timeweb-https-check
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify the public Timeweb HTTPS enrollment endpoint
        run: |
          python3 - <<'PY'
          import datetime,hashlib,http.client,json,ssl
          host="analyst-ai-2941515.twc1.net"
          context=ssl.create_default_context()
          connection=http.client.HTTPSConnection(host,443,timeout=15,context=context)
          connection.connect()
          peer=connection.sock.getpeername()[0]
          assert peer=="201.24.52.66","unexpected_public_server"
          certificate=connection.sock.getpeercert()
          digest=hashlib.sha256(connection.sock.getpeercert(binary_form=True)).hexdigest()
          rows=[]
          for path in ("/health","/workspace"):
              connection.request("GET",path,headers={"Host":host})
              with connection.getresponse() as response:
                  body=response.read(256)
                  rows.append({"path":path,"status":response.status,"enrollment_only":body==b"owner-enrollment-only"})
                  assert response.status==404 and body==b"owner-enrollment-only","unexpected_public_enrollment_gate"
          connection.close()
          print("TIMEWEB_EXTERNAL_ENROLLMENT_TLS="+json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"public_ip":peer,"hostname":host,"certificate_sha256":digest,"certificate_not_after":certificate.get("notAfter"),"verified_tls":True,"routes":rows,"owner_authenticated":False}),flush=True)
          PY
