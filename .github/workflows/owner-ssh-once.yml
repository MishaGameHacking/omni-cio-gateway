name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-retire-redundant-vm
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Retire the redundant NL VM only after verifying Moscow sources, signing key, APK and build receipts
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,json,os,pathlib,stat,subprocess\nroot=pathlib.Path(\"/root\")\nmigration=json.loads((root/\"analyst-moscow-migration.json\").read_text())\nbuild=json.loads((root/\"analyst-moscow-build-evidence-migration.json\").read_text())\nassert migration[\"source_server_id\"]==9408159 and migration[\"destination_server_id\"]==9413105 and migration[\"all_file_hashes_verified\"]\nassert build[\"source_server_id\"]==9408159 and build[\"destination_server_id\"]==9413105 and build[\"all_file_hashes_verified\"] and build[\"file_count\"]==103 and build[\"manifest_sha256\"]==\"3dd48a2d26cad200cf8fd07271af9e6a64b57fae640cf04666ca6e0aed477bda\"\nmanifest=json.loads((root/\"analyst-moscow-app-transfer-9413105.json\").read_text())\nprivate=next(x for x in manifest[\"files\"] if x[\"path\"]==\".android/debug.keystore\")\nkey=root/private[\"path\"]\nassert key.stat().st_uid==0 and stat.S_IMODE(key.stat().st_mode)==0o600 and hashlib.sha256(key.read_bytes()).hexdigest()==private[\"sha256\"]\napk=root/\"analyst-ai-artifacts/690811a5a376181990a64f37d914c87eb6c919b7/Analyst-AI-0.11.0-preview-690811a5.apk\"\nassert hashlib.sha256(apk.read_bytes()).hexdigest()==\"71feb07dd0379a56ec25513194535a145bd5663dadc77611c50cdc442fccd27d\"\nfor name,sha in ((\"analyst-ai-development-79be1821\",\"79be182168e21ae8248e0e0dfa6deb0abfbacbcf\"),(\"analyst-ai-android-690811a5\",\"690811a5a376181990a64f37d914c87eb6c919b7\")):\n    assert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root/name,text=True).strip()==sha\n    subprocess.run([\"git\",\"diff\",\"--check\"],cwd=root/name,capture_output=True,check=True)\nfor name in (\"analyst-ai-enrollment.json\",\"analyst-android-build-40075308670.json\",\"analyst-android-build-40075308670.log\"):\n    path=root/name;assert path.is_file() and not path.is_symlink() and path.stat().st_uid==0\nassert json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"EXPECTED_PUBLIC_IPV4\"]==\"201.24.52.66\"\nreport={\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"destination_server_id\":9413105,\"retiring_server_id\":9408159,\"source_migration_verified\":True,\"build_outputs_and_reports_verified\":True,\"original_signing_key_preserved\":True,\"canonical_apk_preserved\":True,\"ready_to_retire_old_build_vm\":True}\nout=root/\"analyst-old-vm-retirement-gate.json\";out.write_text(json.dumps(report,indent=2)+\"\\n\");out.chmod(0o600)\nprint(\"OLD_VM_RETIREMENT_GATE=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=90).decode()
                      print(output,end="",flush=True)
                      assert "OLD_VM_RETIREMENT_GATE=" in output
                      opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
                      def api(method,path):
                          req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                          try:
                              with opener.open(req,timeout=30) as response:
                                  status=response.status
                                  raw=response.read(4*1024*1024+1)
                              return status,p.decode_response(raw) if raw else {}
                          except urllib.error.HTTPError as error:
                              print("RETIREMENT_API_FAILURE="+json.dumps({"method":method,"path":path,"status":error.code}),flush=True)
                              raise p.ProbeError("retirement_api_denied_or_failed_"+str(error.code)) from None
                      old=api("GET","/servers/9408159")[1]["server"]
                      assert old["id"]==9408159 and old["name"]=="analyst-ai-owner-route-20261023" and old["project_id"]==2941515 and old["location"]=="nl-1" and old["cpu"]==1 and old["ram"]==3072 and p.cloud.public_ipv4(old)=="201.34.146.244"
                      dns=api("GET","/domains/analyst-ai-2941515.twc1.net/dns-records")[1]
                      assert dns["meta"]["total"]==len(dns["dns_records"])
                      addresses=[r["data"]["value"] for r in dns["dns_records"] if r["type"]=="A"]
                      assert addresses==["201.24.52.66"] and not any(r["type"]=="AAAA" for r in dns["dns_records"])
                      code,_=api("DELETE","/servers/9408159")
                      assert code in {200,202,204}
                      print("OLD_VM_DELETE_ACCEPTED="+json.dumps({"id":9408159,"http_status":code}),flush=True)
                      for attempt in range(12):
                          doc=p.read_resource(token,"servers")
                          assert p.summarize("servers",doc)["complete"]
                          if not any(s["id"]==9408159 for s in doc["servers"]):break
                          time.sleep(5)
                      else:raise p.ProbeError("retired_vm_still_listed")
                      ips=api("GET","/floating-ips")[1]
                      assert ips["meta"]["total"]==len(ips["ips"])
                      old_ips=[r for r in ips["ips"] if r["id"]=="5fd94570-416e-46c1-94ff-902897979110"]
                      if old_ips:
                          assert len(old_ips)==1 and old_ips[0]["ip"]=="201.34.146.244" and old_ips[0]["resource_id"] is None
                          ip_code,_=api("DELETE","/floating-ips/5fd94570-416e-46c1-94ff-902897979110")
                          assert ip_code in {200,204}
                      ips=api("GET","/floating-ips")[1]
                      assert ips["meta"]["total"]==len(ips["ips"]) and not any(r["id"]=="5fd94570-416e-46c1-94ff-902897979110" for r in ips["ips"])
                      physical=api("GET","/dedicated-servers/121673")[1]["dedicated_server"]
                      assert physical["id"]==121673 and physical["name"]=="analyst-ai-msk-20261024" and physical["project_id"]==2941515
                      report={"retired_vm_id":9408159,"retired_ip":"201.34.146.244","server_deletion_accepted":True,"server_absent_from_complete_inventory":True,"public_ip_absent_from_complete_inventory":True,"remaining_cloud_servers":[{k:s.get(k) for k in ("id","name","location","cpu","ram","status")} for s in doc["servers"]],"builder":{k:physical.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")},"hostname":"analyst-ai-2941515.twc1.net","current_dns_ipv4":"201.24.52.66"}
                      saved="import datetime,json,pathlib; report="+repr(report)+"; report['checked_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat(); target=pathlib.Path('/root/analyst-timeweb-cleanup.json'); target.write_text(json.dumps(report,indent=2)+chr(10)); target.chmod(0o600)"
                      p.remote(command,"python3 -c "+shlex.quote(saved),timeout=30)
                      print("TIMEWEB_CLEANUP_VERIFIED="+json.dumps(report),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
