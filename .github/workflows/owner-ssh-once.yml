name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-telegram-preflight
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Check registered Telegram callback and Moscow readiness
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import base64,datetime,hashlib,json,pathlib,re,secrets,sys,urllib.parse\nsys.path.insert(0,\"/root/analyst-ai-source\")\nfrom deploy import install_owner_backend as installer\nimport httpx\nroot=pathlib.Path(\"/root\")\nconfig=installer.load_config(enrollment=True)\ninstaller.check_address(config)\ninstaller.source_files()\nfresh={str(path):not(path.exists() or path.is_symlink()) for path in (installer.INSTALL,installer.CONFIG,installer.STATE,installer.UNIT,pathlib.Path(\"/etc/caddy\"),installer.INPUT_CONFIG)}\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"client_id_matches_owner_screenshot\":config[\"TELEGRAM_CLIENT_ID\"]==\"8634181713\",\"origin\":config[\"BACKEND_PUBLIC_URL\"],\"fresh_install_paths\":fresh,\"trusted_origin_confirmed_by_owner_screenshot\":True,\"jwks\":[],\"authorization_redirect_probes\":[]}\nfor attempt in range(3):\n    with httpx.Client(timeout=httpx.Timeout(10,connect=5),verify=True,follow_redirects=False,trust_env=False) as client:\n        row={\"attempt\":attempt+1}\n        try:\n            response=client.get(\"https://oauth.telegram.org/.well-known/jwks.json\")\n            row[\"status\"]=response.status_code\n            keys=response.json().get(\"keys\",[]) if response.status_code==200 and len(response.content)<=131072 else []\n            row[\"usable_rs256\"]=any(k.get(\"kty\")==\"RSA\" and k.get(\"alg\",\"RS256\")==\"RS256\" and all(isinstance(k.get(n),str) and k[n] for n in (\"kid\",\"n\",\"e\")) for k in keys)\n        except (httpx.HTTPError,ValueError,TypeError) as error:row[\"error_type\"]=type(error).__name__\n        report[\"jwks\"].append(row)\nfor label,redirect in ((\"configured\",config[\"TELEGRAM_ENROLLMENT_REDIRECT_URI\"]),(\"unregistered_control\",config[\"BACKEND_PUBLIC_URL\"]+\"/auth/telegram/unregistered-control-20261024\")):\n    verifier=secrets.token_urlsafe(64)\n    parameters={\"client_id\":config[\"TELEGRAM_CLIENT_ID\"],\"redirect_uri\":redirect,\"response_type\":\"code\",\"scope\":\"openid profile\",\"state\":secrets.token_urlsafe(32),\"nonce\":secrets.token_urlsafe(32),\"code_challenge\":base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\"=\").decode(),\"code_challenge_method\":\"S256\"}\n    row={\"callback\":label}\n    try:\n        with httpx.Client(timeout=httpx.Timeout(12,connect=5),verify=True,follow_redirects=False,trust_env=False) as client:\n            response=client.get(\"https://oauth.telegram.org/auth\",params=parameters)\n            row[\"status\"]=response.status_code;row[\"content_type\"]=response.headers.get(\"content-type\",\"\").split(\";\")[0]\n            row[\"response_bytes\"]=len(response.content)\n            body=response.text if len(response.content)<=1024*1024 else \"\"\n            row[\"known_errors\"]=[word for word in (\"invalid_redirect_uri\",\"redirect_uri_mismatch\",\"redirect_uri_invalid\",\"invalid client\",\"invalid_client\",\"redirect uri is not allowed\",\"redirect_uri is not allowed\") if word in body.lower()]\n            row[\"has_telegram_login_form\"]=\"telegram\" in body.lower() and (\"phone\" in body.lower() or \"login\" in body.lower())\n            row[\"html_title\"]=re.sub(r\"[^a-zA-Z0-9 ._-]\",\"\",m.group(1))[:80] if (m:=re.search(r\"<title>([^<]{0,200})</title>\",body,re.I)) else None\n            destination=root/(\"analyst-telegram-authorization-\"+label+\".html\");destination.write_text(body);destination.chmod(0o600)\n            row[\"location_hostname\"]=urllib.parse.urlsplit(response.headers.get(\"location\",\"\")).hostname\n    except (httpx.HTTPError,ValueError) as error:row[\"error_type\"]=type(error).__name__\n    report[\"authorization_redirect_probes\"].append(row)\npath=root/\"analyst-telegram-enrollment-readiness-20261024.json\";path.write_text(json.dumps(report,indent=2)+\"\\n\");path.chmod(0o600)\nprint(\"TIMEWEB_TELEGRAM_ENROLLMENT_READINESS=\"+json.dumps(report),flush=True)\n"
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=180).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
