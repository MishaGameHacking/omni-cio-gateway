name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-temporary-access
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      certificate: ${{ steps.recipient.outputs.certificate }}
      certificate_sha256: ${{ steps.recipient.outputs.certificate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact reviewed server code
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Create an ephemeral encryption recipient only on Timeweb
        id: recipient
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,shlex,subprocess,sys
          sys.path.insert(0,"deploy")
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          import prepare_owner_vm as prepare
          def execute_remote(command):
              script="import base64,hashlib,json,os,pathlib,stat,subprocess,sys\nos.umask(0o077)\nrun_id=sys.argv[1]\nassert run_id.isdecimal()\nroot=pathlib.Path(\"/root/analyst-signing-transfer-\"+run_id)\nroot.mkdir(mode=0o700,exist_ok=False)\nkey=root/\"recipient.key\"\ncert=root/\"recipient.pem\"\ndef run(args,data=None):\n    p=subprocess.run(args,input=data,capture_output=True,timeout=45)\n    if p.returncode:raise RuntimeError(\"signing_envelope_tool_failed\")\n    return p.stdout\nrun([\"openssl\",\"genpkey\",\"-algorithm\",\"RSA\",\"-pkeyopt\",\"rsa_keygen_bits:3072\",\"-out\",str(key)])\nrun([\"openssl\",\"req\",\"-new\",\"-x509\",\"-key\",str(key),\"-out\",str(cert),\"-days\",\"1\",\"-sha256\",\"-subj\",\"/CN=analyst-timeweb-signing-\"+run_id])\nassert stat.S_IMODE(key.stat().st_mode)==0o600 and key.stat().st_uid==0\nprobe=os.urandom(32)\nencrypted=run([\"openssl\",\"cms\",\"-encrypt\",\"-aes-256-gcm\",\"-binary\",\"-outform\",\"DER\",\"-recip\",str(cert),\"-keyopt\",\"rsa_padding_mode:oaep\",\"-keyopt\",\"rsa_oaep_md:sha256\"],probe)\nassert run([\"openssl\",\"cms\",\"-decrypt\",\"-binary\",\"-inform\",\"DER\",\"-recip\",str(cert),\"-inkey\",str(key)],encrypted)==probe\nprint(json.dumps({\"certificate\":base64.b64encode(cert.read_bytes()).decode(),\"certificate_sha256\":hashlib.sha256(cert.read_bytes()).hexdigest(),\"encryption\":\"CMS-AES-256-GCM-RSA-OAEP-SHA256\",\"recipient_key_remains_on_timeweb\":True}))\n"
              output=prepare.remote(command,"python3 -c "+shlex.quote(script)+" "+shlex.quote(os.environ["GITHUB_RUN_ID"]),timeout=120)
              report=json.loads(output)
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as target:
                  target.write("certificate="+report["certificate"]+"\ncertificate_sha256="+report["certificate_sha256"]+"\n")
              print("TIMEWEB_RECIPIENT_READY="+json.dumps({k:v for k,v in report.items() if k!="certificate"}),flush=True)
          access.develop_backend=execute_remote
          adopt.run(development=True)
          PY
  encrypt:
    needs: prepare
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    outputs:
      envelope: ${{ steps.envelope.outputs.envelope }}
    defaults:
      run:
        working-directory: timeweb-signing-transport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: timeweb-signing-transport
      - name: Encrypt the existing signing identity for the Timeweb recipient
        id: envelope
        shell: py -3 {0}
        env:
          TIMEWEB_RECIPIENT_CERT: ${{ needs.prepare.outputs.certificate }}
          TIMEWEB_RECIPIENT_CERT_SHA256: ${{ needs.prepare.outputs.certificate_sha256 }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          import base64,hashlib,json,os,pathlib,shutil,subprocess,sys,tempfile
          sys.path.insert(0,".github/scripts")
          from verify_cached_jdk import discover
          pin="bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1"
          assert pathlib.Path(".github/apk-signing-certificate.sha256").read_text().strip()==pin
          source=pathlib.Path.home()/".android"/"debug.keystore"
          assert source.is_file() and not source.is_symlink() and 512<=source.stat().st_size<=65536
          jdk=discover(os.environ["RUNNER_TOOL_CACHE"])
          cert=subprocess.run([str(jdk/"bin/keytool.exe"),"-exportcert","-alias","androiddebugkey","-keystore",str(source),"-storepass","android"],capture_output=True,timeout=30)
          assert cert.returncode==0 and hashlib.sha256(cert.stdout).hexdigest()==pin,"existing_signing_certificate_mismatch"
          candidates=[pathlib.Path(os.environ["ProgramFiles"])/"Git/usr/bin/openssl.exe",pathlib.Path(os.environ["ProgramFiles"])/"Git/mingw64/bin/openssl.exe"]
          openssl=next((x for x in candidates if x.is_file()),None)
          assert openssl is not None,"bundled_openssl_unavailable"
          recipient=base64.b64decode(os.environ["TIMEWEB_RECIPIENT_CERT"],validate=True)
          assert hashlib.sha256(recipient).hexdigest()==os.environ["TIMEWEB_RECIPIENT_CERT_SHA256"]
          with tempfile.TemporaryDirectory(prefix="analyst-public-recipient-",dir=os.environ["RUNNER_TEMP"]) as temp:
              public=pathlib.Path(temp)/"recipient.pem"
              public.write_bytes(recipient)
              encrypted=subprocess.run([str(openssl),"cms","-encrypt","-aes-256-gcm","-binary","-outform","DER","-recip",str(public),"-keyopt","rsa_padding_mode:oaep","-keyopt","rsa_oaep_md:sha256"],input=source.read_bytes(),capture_output=True,timeout=45)
              assert encrypted.returncode==0 and 512<=len(encrypted.stdout)<=100000,"signing_envelope_encryption_failed"
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
                  out.write("envelope="+base64.b64encode(encrypted.stdout).decode()+"\n")
          print("SIGNING_ENVELOPE_CREATED=CMS_AES_256_GCM_RSA_OAEP_SHA256;private_key_remains_encrypted_in_transit",flush=True)
  build:
    needs: [prepare, encrypt]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact reviewed server code
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Restore the signing identity and build the candidate on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          TIMEWEB_SIGNING_ENVELOPE: ${{ needs.encrypt.outputs.envelope }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,shlex,subprocess,sys
          sys.path.insert(0,"deploy")
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          import prepare_owner_vm as prepare
          def execute_remote(command):
              script="import base64,hashlib,json,os,pathlib,stat,subprocess,sys\nos.umask(0o077)\nrun_id=sys.argv[1]\nassert run_id.isdecimal()\nroot=pathlib.Path(\"/root/analyst-signing-transfer-\"+run_id)\nassert root.is_dir() and not root.is_symlink() and root.stat().st_uid==0 and stat.S_IMODE(root.stat().st_mode)==0o700\nkey=root/\"recipient.key\"\ncert=root/\"recipient.pem\"\nassert {x.name for x in root.iterdir()}=={\"recipient.key\",\"recipient.pem\"}\nfor path in (key,cert):\n    info=path.lstat()\n    assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\nrequest=json.load(sys.stdin)\ntry:\n    if not request[\"envelope\"]:raise RuntimeError(\"encrypted_signing_envelope_unavailable\")\n    payload=base64.b64decode(request[\"envelope\"],validate=True)\n    assert 512<=len(payload)<=100000,\"invalid_encrypted_envelope_size\"\n    result=subprocess.run([\"openssl\",\"cms\",\"-decrypt\",\"-binary\",\"-inform\",\"DER\",\"-recip\",str(cert),\"-inkey\",str(key)],input=payload,capture_output=True,timeout=45)\n    if result.returncode:raise RuntimeError(\"signing_envelope_decryption_failed\")\n    data=result.stdout\n    assert 512<=len(data)<=65536,\"invalid_signing_key_size\"\n    directory=pathlib.Path(\"/root/.android\")\n    assert not directory.is_symlink()\n    directory.mkdir(mode=0o700,exist_ok=True)\n    assert directory.stat().st_uid==0\n    directory.chmod(0o700)\n    dest=directory/\"debug.keystore\"\n    if dest.exists() or dest.is_symlink():\n        info=dest.lstat()\n        assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\n        assert hashlib.sha256(dest.read_bytes()).digest()==hashlib.sha256(data).digest(),\"existing_signing_key_preserved\"\n    else:\n        descriptor=os.open(dest,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n        with os.fdopen(descriptor,\"wb\") as out:\n            out.write(data);out.flush();os.fsync(out.fileno())\n    certificate=subprocess.run([\"/usr/lib/jvm/java-17-openjdk-amd64/bin/keytool\",\"-exportcert\",\"-alias\",\"androiddebugkey\",\"-keystore\",str(dest),\"-storepass\",\"android\"],capture_output=True,timeout=30)\n    pin=\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\n    assert certificate.returncode==0 and hashlib.sha256(certificate.stdout).hexdigest()==pin,\"restored_signing_certificate_mismatch\"\n    print(json.dumps({\"server\":9408159,\"signing_identity_preserved\":True,\"certificate_sha256\":pin,\"private_mode\":\"0600\"}))\nfinally:\n    key.unlink();cert.unlink();root.rmdir()\n"
              output=prepare.remote(command,"python3 -c "+shlex.quote(script)+" "+shlex.quote(os.environ["GITHUB_RUN_ID"]),json.dumps({"envelope":os.environ.get("TIMEWEB_SIGNING_ENVELOPE","")}).encode(),timeout=120)
              print("TIMEWEB_SIGNING_IDENTITY="+output.decode().strip(),flush=True)
              build="import fcntl,hashlib,json,os,pathlib,shutil,signal,stat,subprocess,sys,time,xml.etree.ElementTree as ET\nos.umask(0o077)\nroot=pathlib.Path(\"/root/analyst-ai-android-690811a5\")\nsource=\"690811a5a376181990a64f37d914c87eb6c919b7\"\nsdk=pathlib.Path(\"/opt/analyst-android-sdk\")\njava=pathlib.Path(\"/usr/lib/jvm/java-17-openjdk-amd64\")\npin=\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\nassert root.is_dir() and not root.is_symlink()\nlock=open(\"/root/analyst-android-build.lock\",\"a\")\nfcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=root,text=True).strip()==source\nassert not subprocess.check_output([\"git\",\"status\",\"--porcelain\",\"--untracked-files=no\"],cwd=root)\nassert str(pathlib.Path(\"/root/analyst-build.swap\")) in pathlib.Path(\"/proc/swaps\").read_text()\nassert shutil.disk_usage(root).free>=5*1024**3,\"insufficient_disk_for_compilation\"\nkey=pathlib.Path(\"/root/.android/debug.keystore\")\ninfo=key.lstat()\nassert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600\ncert=subprocess.run([str(java/\"bin/keytool\"),\"-exportcert\",\"-alias\",\"androiddebugkey\",\"-keystore\",str(key),\"-storepass\",\"android\"],capture_output=True,timeout=30)\nassert cert.returncode==0 and hashlib.sha256(cert.stdout).hexdigest()==pin,\"signing_identity_not_preserved\"\nenv={\"PATH\":str(java/\"bin\")+\":/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\",\"HOME\":\"/root\",\"LANG\":\"C.UTF-8\",\"JAVA_HOME\":str(java),\"ANDROID_SDK_ROOT\":str(sdk),\"ANDROID_HOME\":str(sdk),\"PYTHONUNBUFFERED\":\"1\"}\nreport={\"host\":\"timeweb-9408159\",\"source\":source,\"started_at_utc\":time.strftime(\"%Y-%m-%dT%H:%M:%SZ\",time.gmtime()),\"runtime_matrix_passed\":False,\"phases\":[]}\nreport_path=pathlib.Path(\"/root/analyst-android-build-result.json\")\ndef save():\n    report[\"free_disk_gib\"]=round(shutil.disk_usage(root).free/1024**3,2)\n    report_path.write_text(json.dumps(report,indent=2)+\"\\n\")\ndef run(args,timeout=300,out=None):\n    print(\"TIMEWEB_BUILD_PHASE=\"+json.dumps(args),flush=True)\n    started=time.monotonic()\n    process=subprocess.Popen(args,cwd=root,env=env,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n    try:\n        code=process.wait(timeout=timeout)\n    except subprocess.TimeoutExpired:\n        os.killpg(process.pid,signal.SIGTERM)\n        try:process.wait(timeout=15)\n        except subprocess.TimeoutExpired:\n            os.killpg(process.pid,signal.SIGKILL);process.wait()\n        report[\"phases\"].append({\"command\":args,\"exit\":\"timeout\",\"seconds\":round(time.monotonic()-started,1)})\n        save()\n        raise\n    report[\"phases\"].append({\"command\":args,\"exit\":code,\"seconds\":round(time.monotonic()-started,1)})\n    save()\n    if code:raise SystemExit(code)\nprint(\"TIMEWEB_BUILD_START=\"+json.dumps({\"server\":9408159,\"source\":source,\"max_workers\":1,\"parallel\":False,\"kvm\":pathlib.Path(\"/dev/kvm\").exists(),\"disk_free_gib\":round(shutil.disk_usage(root).free/1024**3,2)}),flush=True)\nsave()\nrun([\"python3\",\"tools/prepare_spectrum_checkout.py\"])\nrun([\"./gradlew\",\":app:testDebugUnitTest\",\":app:lintDebug\",\":app:lintPreview\",\":app:assembleDebug\",\":app:assembleRelease\",\":app:assemblePreview\",\":ci-ui-driver:lintDebug\",\":ci-ui-driver:assembleDebug\",\"--stacktrace\",\"--no-parallel\",\"--max-workers=1\"],timeout=4200)\nfor args in ([\"python3\",\"tools/test_native_alignment.py\"],[\"python3\",\"tools/generate_spectrum_meshes.py\",\"--check\",\"--check-apk\"],[\"python3\",\"tools/test_spectrum_meshes.py\"]):run(args)\nout=root/\"app/build/outputs/apk/preview\"\nbuild=sdk/\"build-tools/37.0.0\"\napk=out/\"app-preview.apk\"\nfor filename,args in ((\"signature.txt\",[str(java/\"bin/java\"),\"-jar\",str(build/\"lib/apksigner.jar\"),\"verify\",\"--verbose\",\"--print-certs\",str(apk)]),(\"alignment.txt\",[str(build/\"zipalign\"),\"-c\",\"-P\",\"16\",\"-v\",\"4\",str(apk)]),(\"badging.txt\",[str(build/\"aapt\"),\"dump\",\"badging\",str(apk)]),(\"manifest.txt\",[str(build/\"aapt\"),\"dump\",\"xmltree\",str(apk),\"AndroidManifest.xml\"])):\n    with (out/filename).open(\"w\") as target:run(args,out=target)\nrun([\"python3\",\".github/scripts/verify_apk.py\"])\ncounts={\"suites\":0,\"tests\":0,\"failures\":0,\"errors\":0,\"skipped\":0}\nfor path in (root/\"app/build/test-results/testDebugUnitTest\").glob(\"TEST-*.xml\"):\n    suite=ET.parse(path).getroot()\n    counts[\"suites\"]+=1\n    for name in (\"tests\",\"failures\",\"errors\",\"skipped\"):counts[name]+=int(suite.get(name,0))\nassert counts[\"tests\"]>0 and counts[\"failures\"]==0 and counts[\"errors\"]==0\nreport[\"jvm_tests\"]=counts\nreport[\"apk\"]=json.loads((out/\"apk-verification.json\").read_text())\nreport[\"completed_at_utc\"]=time.strftime(\"%Y-%m-%dT%H:%M:%SZ\",time.gmtime())\nreport[\"build_and_static_verification_passed\"]=True\nsave()\nprint(\"TIMEWEB_ANDROID_BUILD_RESULT=\"+json.dumps(report,sort_keys=True),flush=True)\n"
              stable=command[:-1]+["-o","ServerAliveInterval=30","-o","ServerAliveCountMax=6",command[-1]]
              result=subprocess.run(stable+["python3 -u -c "+shlex.quote(build)],timeout=4650)
              if result.returncode:raise prepare.ProbeError("timeweb_android_build_failed_"+str(result.returncode))
          access.develop_backend=execute_remote
          adopt.run(development=True)
          PY
