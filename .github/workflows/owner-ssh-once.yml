name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nresult=subprocess.run([\"/opt/analyst-ai/venv/bin/python\",\"-I\",\"-B\",\"-c\",\"import base64,datetime,hashlib,importlib.util,json,os,socket,subprocess,sys,time,urllib.request\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\nassert hashlib.sha256((ROOT/\\\"controller.py\\\").read_bytes()).hexdigest()==\\\"89cc6cbaea3e3cd292dbc5a514002ce06efa1a070deaef81c19586900491d65e\\\"\\nassert Path(\\\"/etc/systemd/system/analyst-owner-enrollment.service\\\").read_text()==\\\"[Unit]\\\\nDescription=Private one-use Analyst AI owner enrollment\\\\nAfter=network-online.target caddy.service\\\\nWants=network-online.target\\\\n\\\\n[Service]\\\\nType=exec\\\\nUser=root\\\\nGroup=root\\\\nWorkingDirectory=/root/analyst-owner-handoff\\\\nUMask=0077\\\\nRuntimeMaxSec=650\\\\nTimeoutStopSec=30\\\\nKillMode=control-group\\\\nStandardInput=null\\\\nStandardOutput=null\\\\nStandardError=null\\\\nNoNewPrivileges=yes\\\\nPrivateTmp=yes\\\\nMemoryHigh=201326592\\\\nMemoryMax=268435456\\\\nTasksMax=64\\\\nExecStart=/opt/analyst-ai/venv/bin/python -I -B /root/analyst-owner-handoff/controller.py run\\\\nExecStopPost=/opt/analyst-ai/venv/bin/python -I -B /root/analyst-owner-handoff/controller.py cleanup\\\\n\\\"\\nproof=json.loads((ROOT/\\\"controller-verification.json\\\").read_text())\\nassert proof[\\\"selftest_passed\\\"] is True and proof[\\\"port_available_for_next_flow\\\"] is True and proof[\\\"owner_binding_created\\\"] is False\\nassert hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()==\\\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\\\"\\nspec=importlib.util.spec_from_file_location(\\\"handoff\\\",ROOT/\\\"controller.py\\\")\\ncontroller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)\\ncontroller.prerequisites();controller.verify_sources().check_fresh_owner()\\nwith socket.socket() as sock:sock.bind((\\\"127.0.0.1\\\",8765))\\nold=json.loads((ROOT/\\\"state.json\\\").read_text());assert old[\\\"phase\\\"] in (\\\"cancelled\\\",\\\"expired\\\",\\\"failed\\\") and old[\\\"authorization_url\\\"] is None\\nsuccess=False\\ntry:\\n subprocess.run([\\\"systemctl\\\",\\\"start\\\",\\\"analyst-owner-enrollment.service\\\"],check=True,timeout=20)\\n deadline=time.monotonic()+25;state=None\\n while time.monotonic()<deadline:\\n  state=json.loads((ROOT/\\\"state.json\\\").read_text())\\n  if state.get(\\\"session_id\\\")!=old[\\\"session_id\\\"]:\\n   if state[\\\"phase\\\"]==\\\"waiting_for_telegram\\\":break\\n   if state[\\\"phase\\\"] in (\\\"cancelled\\\",\\\"expired\\\",\\\"failed\\\"):raise RuntimeError(\\\"fresh_owner_login_start_failed\\\")\\n  time.sleep(0.1)\\n assert state and state[\\\"phase\\\"]==\\\"waiting_for_telegram\\\" and state[\\\"session_id\\\"]!=old[\\\"session_id\\\"]\\n assert state[\\\"expires_at\\\"]-time.time()>570 and state[\\\"candidate\\\"] is None and state[\\\"owner_config_created\\\"] is False\\n assert not Path(\\\"/root/analyst-ai-owner.json\\\").exists()\\n with urllib.request.urlopen(\\\"https://analyst-ai-2941515.twc1.net/client/update-policy?package_name=ru.omnicio.app.debug\\\",timeout=15) as response:\\n  policy=json.loads(response.read(16385));assert response.status==200 and policy[\\\"version_code\\\"]==37\\n assert subprocess.run([\\\"systemctl\\\",\\\"is-active\\\",\\\"--quiet\\\",\\\"analyst-owner-enrollment.service\\\"]).returncode==0\\n def emit_envelope(payload,kind,session_id,expires_at,sequence):\\n  from cryptography.hazmat.primitives import hashes,serialization\\n  from cryptography.hazmat.primitives.asymmetric import padding,rsa\\n  from cryptography.hazmat.primitives.ciphers.aead import AESGCM\\n  public_pem=\\\"-----BEGIN PUBLIC KEY-----\\\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvyc8WS9TUYJmZMdZ/a/N\\\\nCkhaF5DsJErf0rHb3Bs8YXcRYuvhyMhp/qjpKPjsuXjvv4lnOjCU1EVgqK9r4mDU\\\\nYpInURKRL7P7ok+liyM/q9pHDFvDBAejaGw0Ume2CDbwlQM18IyWk7IQyLygqvzJ\\\\nKDz5lHQellXk6g7LMswtALK20bluAEDX/XEedNmuTNOCBvGIWZ7yFuOM1Qz3QK8c\\\\nq44tXPKCGMipxZPwIPl2Npyh5YSZUA2SjcLSbMM1TFiQQN+aJEa/adM+18Ql8Wkk\\\\nnbFPqeTalrJveZfTbj18fTBbdi7ERIMA4EG1tBa76FJX3kAliJ9ZKWXZKOVWvsFN\\\\ncJZ5zV4gaOxyU4SqxEtpvDePIt5H+s85KtpU02hv/E99PhJfgwpgbeZpG9vnU/V9\\\\n61CzSivNnyoMurSIc38BkILYMjWCWYcP1n0lHUrhWNtEisMCkl37CcWE6Esp/mbz\\\\n8MaF1cZWvco6uRBM/DDIAWbKIyGlKicfmGb9yRj8ujK9AgMBAAE=\\\\n-----END PUBLIC KEY-----\\\\n\\\".encode()\\n  recipient=\\\"8b6ae36e28368f425f5e619b63e143e8535302a2475a9d525be3858713f16d06\\\"\\n  assert hashlib.sha256(public_pem).hexdigest()==recipient\\n  public=serialization.load_pem_public_key(public_pem)\\n  assert isinstance(public,rsa.RSAPublicKey) and public.key_size==3072\\n  meta={\\\"version\\\":1,\\\"purpose\\\":\\\"analyst-owner-handoff\\\",\\\"server_id\\\":9415007,\\\"origin\\\":\\\"https://analyst-ai-2941515.twc1.net\\\",\\\"session_id\\\":session_id,\\\"expires_at\\\":expires_at,\\\"kind\\\":kind,\\\"sequence\\\":sequence,\\\"recipient_sha256\\\":recipient}\\n  aad=json.dumps(meta,sort_keys=True,separators=(\\\",\\\",\\\":\\\")).encode()\\n  raw=json.dumps(payload,sort_keys=True,separators=(\\\",\\\",\\\":\\\"),ensure_ascii=True).encode();assert len(raw)<=16384\\n  key=os.urandom(32);nonce=os.urandom(12)\\n  cipher=AESGCM(key).encrypt(nonce,raw,aad)\\n  wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=b\\\"analyst-owner-handoff/v1\\\"))\\n  out={\\\"metadata\\\":meta,\\\"wrapped_key\\\":base64.b64encode(wrapped).decode(),\\\"nonce\\\":base64.b64encode(nonce).decode(),\\\"ciphertext\\\":base64.b64encode(cipher).decode()}\\n  print(\\\"OWNER_HANDOFF_ENVELOPE=\\\"+json.dumps(out,separators=(\\\",\\\",\\\":\\\")),flush=True)\\n \\n emit_envelope({\\\"phase\\\":state[\\\"phase\\\"],\\\"authorization_url\\\":state[\\\"authorization_url\\\"],\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"session_id\\\":state[\\\"session_id\\\"]},\\\"authorization\\\",state[\\\"session_id\\\"],state[\\\"expires_at\\\"],2)\\n ready={\\\"server_id\\\":9415007,\\\"phase\\\":\\\"waiting_for_telegram\\\",\\\"expires_at\\\":state[\\\"expires_at\\\"],\\\"expires_at_utc\\\":datetime.datetime.fromtimestamp(state[\\\"expires_at\\\"],datetime.timezone.utc).isoformat(),\\\"owner_binding_created\\\":False,\\\"automatic_identity_binding\\\":False,\\\"ota_version\\\":37,\\\"source_backup_commit\\\":\\\"833aaad9d36f339cbe032a006ccadcf27c5d5731\\\"}\\n print(\\\"OWNER_HANDOFF_READY=\\\"+json.dumps(ready),flush=True)\\n success=True\\nfinally:\\n if not success:\\n  subprocess.run([\\\"systemctl\\\",\\\"stop\\\",\\\"analyst-owner-enrollment.service\\\"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=40)\\n\"],timeout=90)\nraise SystemExit(result.returncode)\n",timeout=150)
