name: Stage the verified Timeweb application runtime
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Decode the reviewed runtime-only migration stage
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,zlib
          encoded=""
          assert hashlib.sha256(encoded.encode()).hexdigest()=="d912753bcdbdcab047922ea095edf036bb5adf398e843b5841522b2b33933136"
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==27744 and hashlib.sha256(raw).hexdigest()=="824401b8417fc9011b1c3dea7e424685127240187e5a5ee39bda6fca412fd404"
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed-runtime-migration-stage.py"
          with path.open("xb") as stream:stream.write(raw)
          path.chmod(0o600)
          print("RUNTIME_STAGE_REVIEWED_TRANSPORT=true")
          PY
      - name: Copy runtime state to the new VM with all new services stopped
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          from contextlib import contextmanager
          import importlib.util,stat
          @contextmanager
          def owned_remote(sid,name,ip,host):
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["id"]==sid and server["name"]==name and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              assert server.get("is_qemu_agent") is True and server.get("status")=="on"
              with tempfile.TemporaryDirectory(prefix="analyst-runtime-stage-access-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);folder.chmod(0o700)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  access.SERVER_ID=sid
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-runtime-stage-"+os.environ["GITHUB_RUN_ID"]+"-"+str(sid),"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.SERVER_ID=sid
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      command=p.ssh_command(folder,ip,host);command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(24):
                          try:
                              check=subprocess.run([*command,"test $(id -u) = 0"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)
                              if check.returncode==0:break
                              if attempt in (0,11,23):print("RUNTIME_STAGE_SSH_WAIT="+json.dumps({"server_id":sid,"attempt":attempt+1,"exit_code":check.returncode,"stderr":check.stderr.decode(errors="replace")[-1500:]}),flush=True)
                              if attempt==23:raise RuntimeError("runtime_stage_ssh_not_ready")
                          except subprocess.TimeoutExpired:
                              if attempt==23:raise
                          time.sleep(5)
                      yield command
                  finally:
                      try:
                          access.SERVER_ID=sid
                          if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      finally:
                          access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("RUNTIME_STAGE_TEMP_KEY_REMOVED="+str(sid),flush=True)
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"reviewed-runtime-migration-stage.py"
          assert path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()=="824401b8417fc9011b1c3dea7e424685127240187e5a5ee39bda6fca412fd404"
          spec=importlib.util.spec_from_file_location("reviewed_runtime_stage",path);module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          with owned_remote(9415007,"Analyst AI PRO","83.217.195.29","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0") as old_command:
              with owned_remote(9417611,"Analyst AI runtime 20261025","31.130.128.55","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g") as new_command:
                  inspection="import json,pathlib,stat\nrows=[]\nfor name in ('/srv/analyst-ai','/srv/analyst-ai/workspace','/var/lib/analyst-ai-build','/var/lib/analyst-ai-build/runs','/var/lib/analyst-ai-build/staging'):\n p=pathlib.Path(name)\n if p.exists():\n  s=p.lstat();rows.append({'path':name,'uid':s.st_uid,'gid':s.st_gid,'mode':oct(stat.S_IMODE(s.st_mode)),'symlink':p.is_symlink()})\n else:rows.append({'path':name,'exists':False})\nprint(json.dumps(rows))\n"
                  print("RUNTIME_MIGRATION_OLD_PARENT_METADATA="+p.remote(old_command,"python3 -",inspection.encode(),timeout=30).decode().strip(),flush=True)
                  module.stage(old_command,new_command,"runtime-20261025-"+os.environ["GITHUB_RUN_ID"])
          PY
