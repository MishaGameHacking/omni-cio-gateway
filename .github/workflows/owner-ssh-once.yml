name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import os,pathlib,subprocess,json,shutil,hashlib,time,re,xml.etree.ElementTree as ET,urllib.request,urllib.error\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\");state=pathlib.Path(\"/var/lib/analyst-ai-build\")\nfor _ in range(60):\n    r=json.loads((state/\"check-result.json\").read_text())\n    if r[\"status\"]!=\"running\":break\n    time.sleep(3)\nassert r[\"status\"]==\"passed\",r\ncounts={}\nfor step in r[\"steps\"]:\n    log=pathlib.Path(step[\"log\"]).read_text(errors=\"replace\")\n    m=re.findall(r\"Ran (\\d+) tests? in\",log)\n    if m:counts[step[\"name\"]]={\"tests\":int(m[-1]),\"passed\":step[\"exit_code\"]==0}\n    if step[\"name\"]==\"node-tests\":\n        counts[\"node-tests\"]={k:int(v) for k,v in re.findall(r\"^# (tests|pass|fail|skipped) (\\d+)$\",log,re.M)}\nxml=ET.parse(pathlib.Path(r[\"log_directory\"])/\"backend-tests.xml\").getroot()\nsuites=list(xml) if xml.tag==\"testsuites\" else [xml]\ncounts[\"backend-tests\"]={k:sum(int(x.attrib.get(k,0)) for x in suites) for k in (\"tests\",\"errors\",\"failures\",\"skipped\")}\nassert counts[\"backend-tests\"][\"errors\"]==counts[\"backend-tests\"][\"failures\"]==counts[\"backend-tests\"][\"skipped\"]==0\nprint(\"WORKSPACE_VERIFIED_TESTS=\"+json.dumps(counts),flush=True)\nassert len(list(pathlib.Path(\"/usr/share/vulkan/icd.d\").glob(\"lvp_icd*.json\")))==1\nassert shutil.which(\"xvfb-run\")\nchecks=[]\nfor path in (\"/etc/analyst-ai/backend.env\",\"/var/lib/analyst-ai/backend.db\"):\n    assert pathlib.Path(path).is_file()\n    assert subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"test\",\"-r\",path]).returncode!=0\n    checks.append(path)\nassert int(next(x.split()[1] for x in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if x.startswith(\"MemTotal:\")))<3500*1024\nguards={}\nfor stage in (\"build\",\"runtime\"):\n    p=subprocess.run([\"systemctl\",\"restart\",\"analyst-workspace@\"+stage+\".service\"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)\n    result=json.loads((state/(stage+\"-result.json\")).read_text())\n    assert p.returncode!=0 and result[\"status\"]==\"blocked\" and result[\"error\"]==\"insufficient_physical_memory_for_\"+stage and result[\"steps\"]==[]\n    guards[stage]={\"status\":result[\"status\"],\"reason\":result[\"error\"],\"workload_started\":False}\nchannel=pathlib.Path(\"/var/lib/analyst-ai/releases/ru.omnicio.app.debug/current.json\")\nbefore=hashlib.sha256(channel.read_bytes()).hexdigest()\np=subprocess.run([\"/usr/local/bin/analyst-workspace\",\"publish\"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)\nassert p.returncode!=0 and b\"build_must_pass_for_current_sources\" in p.stderr and hashlib.sha256(channel.read_bytes()).hexdigest()==before\nguards[\"publish\"]={\"rejected_unverified_build\":True,\"channel_unchanged\":True}\nurl=\"https://analyst-ai-2941515.twc1.net\"\nwith urllib.request.urlopen(url+\"/health\",timeout=30) as response:assert response.status==200 and json.load(response)=={\"status\":\"ok\"}\ntry:urllib.request.urlopen(url+\"/workspace\",timeout=30);raise AssertionError(\"unauthenticated_data_access\")\nexcept urllib.error.HTTPError as e:assert e.code==401\nwith urllib.request.urlopen(url+\"/client/update-policy\",timeout=30) as response:policy=json.load(response);assert response.status==200\nmanifest=json.loads(channel.read_text());assert manifest[\"version_code\"]==35 and manifest[\"apk_sha256\"]==\"bc2ca96b41a14433ff3f0bf085066728ec7ed6de904cb27ac5b960df515dbccc\"\nh=hashlib.sha256();n=0\napkpath=\"/client/apk/Analyst-AI-35-\"+manifest[\"apk_sha256\"]+\".apk\"\nwith urllib.request.urlopen(url+apkpath,timeout=60) as response:\n    for block in iter(lambda:response.read(1048576),b\"\"):h.update(block);n+=len(block)\nassert h.hexdigest()==manifest[\"apk_sha256\"] and n==manifest[\"apk_bytes\"]\nsummary={\"server_id\":9413105,\"one_permanent_server\":True,\"source_sha256\":r[\"source_sha256\"],\"test_counts\":counts,\"guards\":guards,\"private_data_unreadable_by_build_user\":True,\"graphics_dependencies_installed\":True,\"health_http\":200,\"unauth_workspace_http\":401,\"published_version_code\":35,\"apk_sha256\":h.hexdigest(),\"apk_bytes\":n,\"disk_free_bytes\":shutil.disk_usage(\"/\").free,\"build_ready\":False,\"runtime_ready\":False,\"fully_automatic_phone_update_verified\":False}\nwrite=state/\"workspace-final-verification.json\";write.write_text(json.dumps(summary,indent=2));write.chmod(0o640);shutil.chown(write,user=\"analyst-build\",group=\"analyst-build\")\ndoc=root/\"docs/TIMEWEB_WORKSPACE.md\";text=doc.read_text().replace(\"Команды администратора:\\n-\",\"Команды администратора:\\n\\n-\")\ndoc.write_text(text+\"\\n\\nПроверка после объединения backend: \"+json.dumps(counts,ensure_ascii=False)+\". Отказ build/runtime на 1GB и запрет публикации без проверенного build подтверждены фактическим запуском. Backend health200, закрытый workspace401, опубликованный APK35 проверен по размеру и SHA256. Системные Mesa/Vulkan/Xvfb зависимости установлены, образы эмуляторов ожидают достаточного диска/RAM. Производственные backend.env и backend.db недоступны build-пользователю.\\n\")\nshutil.chown(doc,user=\"analyst-build\",group=\"analyst-build\")\nfor name in (\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    p=root/name;p.write_text(p.read_text()+\"\\nПроверено на единственном основном Timeweb: \"+json.dumps(counts,ensure_ascii=False)+\". Канал APK35 сохранен; недостаток RAM подтвержден до запуска сборки/эмуляторов; нет утверждения о полном зеленом выпуске.\\n\");shutil.chown(p,user=\"analyst-build\",group=\"analyst-build\")\nsubprocess.run([\"systemctl\",\"reset-failed\",\"analyst-workspace@build\",\"analyst-workspace@runtime\"],check=True)\nprint(\"WORKSPACE_FINAL_VERIFICATION=\"+json.dumps(summary),flush=True)\nfor name in [\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\",\"app/src/main/java/ru/omnicio/app/data/backend/BackendConfig.kt\",\"app/src/test/java/ru/omnicio/app/data/backend/BackendConfigTest.kt\",\"AGENTS.md\",\"README.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\",\"docs/TIMEWEB_WORKSPACE.md\",\"deploy/resource_observer.py\",\"deploy/analyst-resource-observer.service\",\"deploy/analyst-resource-observer.timer\",\"deploy/timeweb_workspace.py\",\"deploy/publish_timeweb_workspace.py\",\"deploy/analyst-workspace@.service\",\"deploy/analyst-workspace\",\"deploy/tests/test_timeweb_workspace.py\",\"backend/telegram_browser_app.py\",\"backend/telegram_oidc.py\",\"backend/tests/test_owner_enrollment.py\",\"backend/tests/test_owner_enrollment_install.py\",\"backend/tests/test_telegram_nonce_boundaries.py\",\"deploy/OWNER_TIMEWEB.md\",\"deploy/enroll_owner.py\",\"deploy/install_owner_backend.py\"]:\n    p=root/name;content=p.read_text();assert len(content.encode())<600000\n    print(\"WORKSPACE_PUBLIC_FILE=\"+json.dumps({\"path\":name,\"sha256\":hashlib.sha256(content.encode()).hexdigest(),\"content\":content}),flush=True)\n"
                      result=subprocess.run([*command,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=260)
                      print(result.stdout.decode(),flush=True)
                      if result.returncode:print("WORKSPACE_FINAL_ERROR="+result.stderr.decode()[-3000:],flush=True)
                      assert result.returncode==0
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
