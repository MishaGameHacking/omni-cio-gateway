name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,os,subprocess,hashlib,fcntl,stat,datetime,zipfile,pwd,base64,zlib\nROOT=pathlib.Path(\"/srv/analyst-ai/workspace\");STATE=pathlib.Path(\"/var/lib/analyst-ai-build\")\nUNIT=\"analyst-ai-boot-capture-955-v1.service\"\nEXPECTED_SOURCE=\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\"\nHEAD=\"f4e3368fff1209c02b1cd088a5dc6a5380e7e433\"\nCANDIDATE=\"d57ea8c55642aaf1b18703cf0170fdd78b5d73912d57b3415d34c563fcab9649\"\nPREVIOUS=\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\"\nCERT=\"bbce9534fd4cfee8f3bdcaf51a31cce384a4f303f090c8cae9ec558227d59eb1\"\ndef sha(p):\n h=hashlib.sha256()\n with p.open(\"rb\") as stream:\n  for b in iter(lambda:stream.read(1024*1024),b\"\"):h.update(b)\n return h.hexdigest()\nprops=subprocess.check_output([\"systemctl\",\"show\",UNIT,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"MainPID\",\"-p\",\"ControlPID\"],text=True)\nunit=dict(x.split(\"=\",1) for x in props.splitlines() if \"=\" in x)\nfolder=STATE/\"diagnostics/20261025T120007847288Z-boot-capture\"\nreport=json.loads((folder/\"boot-diagnostic.json\").read_text())\nprint(\"REDESIGN_BOOT_TERMINAL_OBSERVATION=\"+json.dumps({\"unit\":unit,\"report\":report}),flush=True)\nassert unit[\"ActiveState\"] in (\"inactive\",\"failed\") and unit[\"MainPID\"]==\"0\" and unit[\"ControlPID\"]==\"0\",\"boot_cleanup_still_running\"\nhelper=STATE/\"archive_boot_capture_955.py\"\nraw=zlib.decompress(base64.b64decode(\"\"))\nassert hashlib.sha256(raw).hexdigest()==\"cb3659cf4139af953ed19b30ad3d4623205897980238bff4707a78c96a45e05c\"\nif helper.exists():assert helper.read_bytes()==raw\nelse:\n with helper.open(\"xb\") as out:out.write(raw)\n helper.chmod(0o400)\narchive_unit=\"analyst-ai-boot-archive-955.service\"\nknown=subprocess.run([\"systemctl\",\"show\",archive_unit,\"-p\",\"LoadState\",\"--value\"],capture_output=True,text=True)\nif known.stdout.strip()==\"not-found\":\n run=subprocess.run([\"systemd-run\",\"--unit\",archive_unit,\"--property=Type=exec\",\"--property=RuntimeMaxSec=600\",\"--property=MemoryMax=384M\",\"--property=Nice=10\",\"--property=StandardOutput=append:\"+str(STATE/\"boot-archive-955.log\"),\"--property=StandardError=append:\"+str(STATE/\"boot-archive-955.log\"),\"/usr/bin/python3\",str(helper)],capture_output=True,text=True,check=True)\n print(\"REDESIGN_BOOT_ARCHIVE_DISPATCH=\"+json.dumps({\"unit\":archive_unit,\"output\":run.stdout,\"stderr\":run.stderr}),flush=True)\ndef source_hash():\n names=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(ROOT),\"ls-files\",\"--cached\",\"--others\",\"--exclude-standard\",\"-z\"]).split(b\"\\0\")\n h=hashlib.sha256()\n for n in sorted(set(names)-{b\"\"}):\n  rel=os.fsdecode(n)\n  if rel in (\"AGENTS.md\",\"README.md\") or rel.startswith(\"docs/\"):continue\n  p=ROOT/rel\n  if p.is_file():h.update(n+b\"\\0\"+sha(p).encode()+b\"\\0\")\n return h.hexdigest()\nwith (STATE/\"workspace.lock\").open(\"r+\") as lock:\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n assert source_hash()==EXPECTED_SOURCE,\"source_changed\"\n checks={}\n for label in (\"check\",\"build\"):\n  p=STATE/(label+\"-result.json\");r=json.loads(p.read_text())\n  assert r[\"status\"]==\"passed\" and r[\"source_sha256\"]==EXPECTED_SOURCE\n  checks[label]={\"receipt_sha256\":sha(p),\"finished_at\":r[\"finished_at\"]}\n build=json.loads((STATE/\"build-result.json\").read_text());assert build[\"apk_sha256\"]==CANDIDATE\n channel=pathlib.Path(\"/srv/analyst-ai-ota/releases/ru.omnicio.app.debug\")\n current=json.loads((channel/\"current.json\").read_text())\n assert current.get(\"version_code\")==37 and current.get(\"apk_sha256\")==PREVIOUS and current.get(\"certificate_sha256\")==CERT\n previous=channel/(\"Analyst-AI-37-\"+PREVIOUS+\".apk\")\n assert previous.is_file() and not previous.is_symlink() and sha(previous)==PREVIOUS\n candidate=ROOT/\"app/build/outputs/apk/preview/app-preview.apk\"\n assert sha(candidate)==CANDIDATE\n verification=json.loads(candidate.with_name(\"apk-verification.json\").read_text())\n assert verification[\"version_code\"]==38 and verification[\"package\"]==\"ru.omnicio.app.debug\" and verification[\"certificate_sha256\"]==CERT\n export=STATE/\"exports\"/\"android38-source955-windows\"\n export.mkdir(parents=True,exist_ok=False)\n account=pwd.getpwnam(\"analyst-build\");os.chown(export,account.pw_uid,account.pw_gid);export.chmod(0o750)\n env=dict(os.environ);env.update({\"GITHUB_SHA\":HEAD,\"GITHUB_WORKSPACE\":str(ROOT),\"RUNNER_TEMP\":str(export),\"PREVIOUS_APK\":str(previous)})\n packed=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",str(STATE/\"venv/bin/python\"),str(ROOT/\"tools/ci_apk_archive.py\"),\"pack\"],cwd=ROOT,env=env,capture_output=True,text=True,timeout=90,check=True)\n archive=export/\"ci-handoff.zip\";assert archive.is_file() and not archive.is_symlink()\n with zipfile.ZipFile(archive) as z:\n  manifest=json.loads(z.read(\"manifest.json\"));assert manifest[\"head\"]==HEAD\n  assert manifest[\"files\"][\"app/build/outputs/apk/preview/app-preview.apk\"][\"sha256\"]==CANDIDATE\n  assert manifest[\"files\"][\"previous.apk\"][\"sha256\"]==PREVIOUS\n  for name,identity in manifest[\"files\"].items():\n   data=z.read(name);assert len(data)==identity[\"bytes\"] and hashlib.sha256(data).hexdigest()==identity[\"sha256\"]\n assert source_hash()==EXPECTED_SOURCE and sha(candidate)==CANDIDATE and sha(previous)==PREVIOUS\n archive.chmod(0o440);os.chown(archive,0,account.pw_gid)\n receipt={\"schema_version\":1,\"kind\":\"timeweb_frozen_android38_windows_inputs\",\"created_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_commit\":HEAD,\"source_sha256\":EXPECTED_SOURCE,\"checks\":checks,\"archive\":str(archive),\"archive_bytes\":archive.stat().st_size,\"archive_sha256\":sha(archive),\"input_files\":manifest[\"files\"],\"public_release\":current,\"public_manifest_sha256\":sha(channel/\"current.json\"),\"published\":False}\n p=export/\"input-receipt.json\";p.write_text(json.dumps(receipt,indent=2)+\"\\n\");p.chmod(0o400)\n print(\"REDESIGN_WINDOWS_INPUT_ARCHIVE=\"+json.dumps(receipt),flush=True)\n",timeout=180)
          PY
