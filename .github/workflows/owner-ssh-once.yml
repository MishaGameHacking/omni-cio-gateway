name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import json,os,subprocess\nfrom pathlib import Path\nscript=Path(\"/var/lib/analyst-ai-build/diagnostics/ota_check_build.py\")\nassert not script.exists(),\"supervisor_already_exists\"\nscript.write_text(\"import datetime,hashlib,json,os,subprocess,time,traceback\\nfrom pathlib import Path\\nROOT=Path(\\\"/srv/analyst-ai/workspace\\\")\\nSTATE=Path(\\\"/var/lib/analyst-ai-build\\\")\\nOUT=STATE/\\\"diagnostics/ota-check-build-20261025.json\\\"\\nEXPECTED={\\\"app/build.gradle.kts\\\":\\\"80e6cf345ec990b314dfecb07a9e992f2c7673a4ad993ab2ec6073ebdcb06140\\\",\\\"app/src/main/java/ru/omnicio/app/ui/updates/MandatoryUpdateHost.kt\\\":\\\"b231d8157778ee8e175dff48537b144233311a59246799d5bfec4ba440d52732\\\",\\\"app/src/main/java/ru/omnicio/app/ui/updates/UpdateAttemptGate.kt\\\":\\\"6ac2f2c729c00bb724d176d2125b14f63df18923b5e9c626ebc050a54b79a746\\\",\\\"app/src/test/java/ru/omnicio/app/ui/updates/UpdateAttemptGateTest.kt\\\":\\\"2994602277c85ee76195e09848f949ba9dca93b56704f3a3c24fda474aad9a4e\\\",\\\"app/src/main/java/ru/omnicio/app/data/updates/UpdateInstaller.kt\\\":\\\"6e3ff3014ad26f8054d17ac59d65f212114c40096dee03f7fb6ceaa89d890097\\\",\\\"app/src/main/java/ru/omnicio/app/ui/spectrum/RequiredUpdateScreen.kt\\\":\\\"cdd0af57edf70af279f27f61415458fe749fe99c9cb9d99b5720a65a4230449c\\\",\\\"backend/public_updates_app.py\\\":\\\"65223e183ab426c2e9fb7619e97aa321f6a9b9c1e4f72392ee8b4fe056edf0d8\\\",\\\"backend/tests/test_public_updates_app.py\\\":\\\"70076e6b1501df2c11d3d70f70d42a886e64997760aa0cc7faf32a66725805c8\\\",\\\"deploy/public_updates.service\\\":\\\"98a5a053ccdbb37938b7cac9bcba937da09cdcd828f913ec2750e01d0bc95cc9\\\"}\\ndef stamp():return datetime.datetime.now(datetime.timezone.utc).isoformat()\\ndef sha(p):\\n    h=hashlib.sha256()\\n    with p.open(\\\"rb\\\") as f:\\n        for b in iter(lambda:f.read(1048576),b\\\"\\\"):h.update(b)\\n    return h.hexdigest()\\ndef props(unit):\\n    p=subprocess.run([\\\"systemctl\\\",\\\"show\\\",unit,\\\"--property=ActiveState,SubState,MainPID,ControlPID,ControlGroup,Result,ExecMainStatus,InvocationID\\\"],capture_output=True,text=True,check=True)\\n    return dict(x.split(\\\"=\\\",1) for x in p.stdout.splitlines() if \\\"=\\\" in x)\\ndef quiet(p):\\n    if p.get(\\\"MainPID\\\",\\\"0\\\")!=\\\"0\\\" or p.get(\\\"ControlPID\\\",\\\"0\\\")!=\\\"0\\\":return False\\n    if p.get(\\\"SubState\\\") not in (\\\"exited\\\",\\\"dead\\\",\\\"failed\\\"):return False\\n    cg=p.get(\\\"ControlGroup\\\",\\\"\\\")\\n    f=Path(\\\"/sys/fs/cgroup\\\"+cg)/\\\"cgroup.events\\\" if cg else None\\n    return f is None or not f.exists() or \\\"populated 0\\\" in f.read_text().splitlines()\\nreport={\\\"status\\\":\\\"running\\\",\\\"started_at\\\":stamp(),\\\"stage\\\":\\\"waiting_for_boot_diagnostic\\\",\\\"stages\\\":[],\\n        \\\"candidate_tested\\\":False,\\\"matrix_passed\\\":False,\\\"publication_authorized\\\":False}\\ndef save():\\n    p=OUT.with_suffix(\\\".next\\\")\\n    p.write_text(json.dumps(report,indent=2)+\\\"\\\\n\\\");p.chmod(0o640);os.replace(p,OUT)\\ndef read_stage(name):\\n    p=STATE/(name+\\\"-result.json\\\")\\n    if not p.exists():return {}\\n    return json.loads(p.read_text())\\ndef check_inputs():\\n    assert {p:sha(ROOT/p) for p in EXPECTED}==EXPECTED,\\\"reviewed_sources_changed\\\"\\ndef run_stage(name,limit,prior=None):\\n    check_inputs()\\n    old=read_stage(name)\\n    unit=\\\"analyst-workspace@\\\"+name+\\\".service\\\"\\n    assert quiet(props(unit)),\\\"stage_already_running\\\"\\n    before=stamp()\\n    report[\\\"stage\\\"]=name;save()\\n    subprocess.run([\\\"systemctl\\\",\\\"restart\\\",\\\"--no-block\\\",unit],check=True)\\n    deadline=time.monotonic()+limit\\n    while time.monotonic()<deadline:\\n        time.sleep(5)\\n        state=props(unit)\\n        cur=read_stage(name)\\n        fresh=cur.get(\\\"started_at\\\")!=old.get(\\\"started_at\\\") and cur.get(\\\"log_directory\\\")!=old.get(\\\"log_directory\\\")\\n        if fresh and cur.get(\\\"status\\\")!=\\\"running\\\" and quiet(state):\\n            assert state.get(\\\"Result\\\")==\\\"success\\\" and state.get(\\\"ExecMainStatus\\\")==\\\"0\\\",name+\\\"_unit_failed\\\"\\n            assert cur.get(\\\"stage\\\")==name and cur.get(\\\"status\\\")==\\\"passed\\\",name+\\\"_receipt_failed\\\"\\n            assert cur.get(\\\"started_at\\\",\\\"\\\")>=before,\\\"stale_stage_timestamp\\\"\\n            assert cur.get(\\\"finished_at\\\",\\\"\\\")>=cur[\\\"started_at\\\"],\\\"missing_finished_timestamp\\\"\\n            assert cur.get(\\\"steps\\\") and all(s.get(\\\"exit_code\\\")==0 for s in cur[\\\"steps\\\"]),\\\"stage_steps_failed\\\"\\n            assert len(cur.get(\\\"source_sha256\\\",\\\"\\\"))==64,\\\"missing_source_digest\\\"\\n            if prior:\\n                assert cur[\\\"source_sha256\\\"]==prior[\\\"source_sha256\\\"],\\\"stage_source_digest_mismatch\\\"\\n                assert sha(Path(cur[\\\"apk\\\"]))==cur[\\\"apk_sha256\\\"],\\\"built_apk_changed\\\"\\n            report[\\\"stages\\\"].append(cur);save()\\n            return cur\\n        if fresh and cur.get(\\\"status\\\") in (\\\"failed\\\",\\\"blocked\\\") and quiet(state):\\n            raise RuntimeError(name+\\\"_failed:\\\"+str(cur.get(\\\"error\\\")))\\n    raise RuntimeError(name+\\\"_supervisor_timeout\\\")\\ntry:\\n    save()\\n    limit=time.monotonic()+900\\n    while not quiet(props(\\\"analyst-boot-diagnostic-20261025t0501.service\\\")):\\n        if time.monotonic()>limit:raise RuntimeError(\\\"boot_diagnostic_cleanup_timeout\\\")\\n        time.sleep(5)\\n    boot=STATE/\\\"diagnostics/boot-20261025T050110Z-16490/result.json\\\"\\n    report[\\\"boot_diagnostic\\\"]=json.loads(boot.read_text()) if boot.exists() else {\\\"status\\\":\\\"result_missing\\\"}\\n    assert sha(STATE/\\\"previous-0.12.0.apk\\\")==\\\"c62c7bb9b2c0fd454ec00985f869f3f9fa3023ed555ced9b5e0ae2a107e7f8d2\\\",\\\"previous_apk_not_preserved\\\"\\n    check=run_stage(\\\"check\\\",1800)\\n    build=run_stage(\\\"build\\\",7500,check)\\n    check_inputs()\\n    report[\\\"status\\\"]=\\\"passed\\\"\\n    report[\\\"stage\\\"]=\\\"check_and_build_completed\\\"\\n    report[\\\"source_sha256\\\"]=build[\\\"source_sha256\\\"]\\n    report[\\\"apk_sha256\\\"]=build[\\\"apk_sha256\\\"]\\nexcept BaseException as exc:\\n    report[\\\"status\\\"]=\\\"failed\\\";report[\\\"error\\\"]=str(exc);report[\\\"error_type\\\"]=type(exc).__name__\\n    print(traceback.format_exc(),flush=True)\\nfinally:\\n    report[\\\"finished_at\\\"]=stamp();save()\\n    print(\\\"OTA_CHECK_BUILD_RESULT=\\\"+json.dumps(report),flush=True)\\nif report[\\\"status\\\"]!=\\\"passed\\\":raise SystemExit(1)\\n\");script.chmod(0o640)\nsubprocess.run([\"systemd-run\",\"--unit=analyst-ota-check-build-20261025\",\"--property=Type=exec\",\"--property=MemoryMax=134217728\",\"--property=TasksMax=32\",\"--property=RuntimeMaxSec=10800\",\"--property=TimeoutStopSec=30\",\"--property=KillMode=control-group\",\"--property=UMask=0077\",\"--property=StandardOutput=append:/var/lib/analyst-ai-build/diagnostics/ota-check-build-20261025.log\",\"--property=StandardError=inherit\",\"/usr/bin/python3\",\"-B\",str(script)],check=True)\nprint(\"OTA_CHECK_BUILD_SUPERVISOR=\"+subprocess.run([\"systemctl\",\"show\",\"analyst-ota-check-build-20261025.service\",\"--property=ActiveState,SubState,Result\"],capture_output=True,text=True,check=True).stdout,flush=True)\nprint(\"WORKSPACE_EFFECTIVE_LIMITS=\"+subprocess.run([\"systemctl\",\"show\",\"analyst-workspace@check.service\",\"analyst-workspace@build.service\",\"--property=MemoryHigh,MemoryMax,MemorySwapMax,CPUQuotaPerSecUSec,TimeoutStartUSec,User\"],capture_output=True,text=True,check=True).stdout,flush=True)\n",timeout=120)
          PY
