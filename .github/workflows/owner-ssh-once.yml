name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,re,datetime\nfrom http.client import HTTPConnection\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\");unit=\"analyst-ai-boot-capture-955-v1.service\"\nprops=subprocess.check_output([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\",\"-p\",\"MemoryCurrent\",\"-p\",\"MemoryPeak\",\"-p\",\"CPUUsageNSec\"],text=True)\nprint(\"REDESIGN_BOOT_CAPTURE_UNIT=\"+json.dumps(props),flush=True)\nreports=[]\nfor p in sorted((state/\"diagnostics\").glob(\"*-boot-capture/boot-diagnostic.json\")):\n try:\n  value=json.loads(p.read_text())\n  if value.get(\"unit\")==unit:reports.append((p,value))\n except (OSError,ValueError):pass\nif not reports:\n print(\"REDESIGN_BOOT_CAPTURE_PENDING=\"+json.dumps({\"receipt_created\":False}),flush=True);raise SystemExit(0)\np,report=reports[-1];folder=p.parent\nprint(\"REDESIGN_BOOT_CAPTURE_RECEIPT=\"+json.dumps(report),flush=True)\ndef tail(path,maximum):\n with path.open(\"rb\") as stream:\n  stream.seek(max(0,path.stat().st_size-maximum))\n  return stream.read(maximum).decode(errors=\"replace\")\nfiles=[{\"name\":q.name,\"bytes\":q.stat().st_size} for q in sorted(folder.iterdir()) if q.is_file()]\nprint(\"REDESIGN_BOOT_CAPTURE_FILES=\"+json.dumps(files),flush=True)\nrx=re.compile(r\"zygote|system_server|ActivityManager|PackageManager|dex2oat|artd|boot_progress|boot_completed|FATAL|Watchdog|lowmemorykiller|Out of memory|Kernel panic\",re.I)\nlogs=[]\nfor q in [folder/\"emulator-kernel.log\",*sorted(folder.glob(\"guest-logcat-all-*.log\"))]:\n if q.is_file():\n  chosen=[line[:800] for line in tail(q,2*1024*1024).splitlines() if rx.search(line)]\n  logs.append({\"name\":q.name,\"tail_matching_lines\":chosen[-22:]})\nfor name in (\"events.jsonl\",\"boot-polls.jsonl\",\"failure.log\"):\n q=folder/name\n if q.is_file():logs.append({\"name\":name,\"tail\":tail(q,2200)})\nprint(\"REDESIGN_BOOT_CAPTURE_PROGRESS=\"+json.dumps(logs),flush=True)\nq=folder/\"resources.jsonl\";rows=[]\nif q.is_file():\n for line in tail(q,512*1024).splitlines():\n  try:rows.append(json.loads(line))\n  except ValueError:pass\nif rows:\n last=rows[-1]\n summary={k:last.get(k) for k in (\"at\",\"elapsed_seconds\",\"phase\",\"host_memory_kib\",\"host_cpu_interval\",\"free_bytes\",\"capture_bytes\")}\n summary[\"cgroup\"]={k:last.get(\"cgroup\",{}).get(k) for k in (\"memory.current\",\"memory.peak\",\"memory.swap.current\",\"memory.events\",\"memory.pressure\",\"cpu.stat\",\"cpu.pressure\",\"io.pressure\")}\n summary[\"qemu\"]=[]\n for proc in last.get(\"processes\",[]):\n  if not proc.get(\"comm\",\"\").startswith((\"qemu\",\"emulator\")):continue\n  item={k:proc.get(k) for k in (\"pid\",\"comm\",\"cpu_core_equivalent\",\"thread_count_observed\",\"threads_truncated\",\"status_memory\")}\n  if len(rows)>1:\n   before=rows[-2];span=last[\"elapsed_seconds\"]-before[\"elapsed_seconds\"]\n   previous={(x[\"pid\"],x[\"start_ticks\"]):x for p in before.get(\"processes\",[]) if p.get(\"pid\")==proc[\"pid\"] for x in p.get(\"thread_cpu\",[])}\n   values=[]\n   for x in proc.get(\"thread_cpu\",[]):\n    old=previous.get((x[\"pid\"],x[\"start_ticks\"]))\n    if old and span>0:\n     ticks=x[\"user_ticks\"]+x[\"system_ticks\"]-old[\"user_ticks\"]-old[\"system_ticks\"]\n     values.append({\"tid\":x[\"pid\"],\"comm\":x[\"comm\"],\"cpu_cores\":round(ticks/last[\"clock_ticks_per_second\"]/span,5)})\n   item[\"thread_interval_seconds\"]=span;item[\"busiest_threads\"]=sorted(values,key=lambda x:x[\"cpu_cores\"],reverse=True)[:10]\n  summary[\"qemu\"].append(item)\n print(\"REDESIGN_BOOT_CAPTURE_RESOURCES=\"+json.dumps(summary),flush=True)\nif report.get(\"stopped_avd_preserved\"):\n manifest=pathlib.Path(report[\"stopped_avd_manifest\"]);assert manifest.parent==folder\n print(\"REDESIGN_BOOT_STOPPED_AVD_MANIFEST=\"+manifest.read_text().replace(\"\\n\",\"\"),flush=True)\nc=HTTPConnection(\"127.0.0.1\",8080,timeout=5)\ntry:\n c.request(\"GET\",\"/health\");r=c.getresponse();body=r.read(1024)\n print(\"REDESIGN_BOOT_LIVE_HEALTH=\"+json.dumps({\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"status\":r.status,\"body_matches\":body.strip()==b'{\"status\":\"ok\"}'}),flush=True)\nfinally:c.close()\n\nimport collections\nfacets={key:collections.deque(maxlen=16) for key in (\"boot_events\",\"package_manager\",\"art\",\"system_server\",\"fatal\",\"last_guest_state\")}\npatterns={\n \"boot_events\":re.compile(r\"boot_progress|boot_complete|BootAnimation|BOOT_PROGRESS\"),\n \"package_manager\":re.compile(r\"\\s(?:PackageManager|PackageManagerTiming|PackageManagerService|PackageParser|DexOptHelper|PackageDexOptimizer)\\s*:\"),\n \"art\":re.compile(r\"\\s(?:artd|dex2oat64|dex2oat32|ArtService|DexoptHelper)\\s*:|dexopt.*first-boot|dex2oat.*verify\"),\n \"system_server\":re.compile(r\"\\s(?:SystemServer|SystemServiceManager|SystemServerTiming)\\s*:\"),\n \"fatal\":re.compile(r\"FATAL EXCEPTION|Fatal signal|WATCHDOG KILLING|system_server.*(?:died|crash)|zygote.*(?:exited|killed)|Kernel panic|Out of memory\")\n}\nfor q in sorted(folder.glob(\"guest-logcat-all-*.log\")):\n with q.open(errors=\"replace\") as stream:\n  for line in stream:\n   if \" I adbd \" in line or \"await_boot_completed\" in line:continue\n   for key,rx2 in patterns.items():\n    if rx2.search(line):facets[key].append(line[:1200].rstrip())\nq=folder/\"guest-state.jsonl\"\nif q.is_file():\n for line in tail(q,12000).splitlines()[-2:]:\n  try:\n   item=json.loads(line);facets[\"last_guest_state\"].append(item)\n  except ValueError:pass\nprint(\"REDESIGN_BOOT_STAGE_FACETS=\"+json.dumps({k:list(v) for k,v in facets.items()}),flush=True)\n\nimport time\nintervention_path=folder/\"memory-high-intervention-result.json\"\nif intervention_path.is_file():\n intervention=json.loads(intervention_path.read_text())\n changed_at=datetime.datetime.fromisoformat(intervention[\"after\"][\"at\"]).timestamp()\n resource_rows=[]\n q=folder/\"resources.jsonl\"\n if q.is_file():\n  for line in q.read_text().splitlines():\n   try:\n    x=json.loads(line)\n    if x.get(\"phase\")==\"boot\":\n     x[\"_ts\"]=datetime.datetime.fromisoformat(x[\"at\"]).timestamp();resource_rows.append(x)\n   except (ValueError,KeyError,TypeError):pass\n def counter_map(value):\n  result={}\n  for line in (value or \"\").splitlines():\n   parts=line.split()\n   if len(parts)==2:\n    try:result[parts[0]]=int(parts[1])\n    except ValueError:pass\n  return result\n def psi_totals(value):\n  result={}\n  for line in (value or \"\").splitlines():\n   parts=line.split()\n   if parts:\n    for entry in parts[1:]:\n     if entry.startswith(\"total=\"):result[parts[0]]=int(entry.split(\"=\",1)[1])\n  return result\n def interval_summary(label,selected):\n  if len(selected)<2:return {\"label\":label,\"rows\":len(selected)}\n  a,b=selected[0],selected[-1];seconds=b[\"_ts\"]-a[\"_ts\"]\n  ca,cb=a.get(\"cgroup\",{}),b.get(\"cgroup\",{})\n  pa,pb=psi_totals(ca.get(\"memory.pressure\")),psi_totals(cb.get(\"memory.pressure\"))\n  ea,eb=counter_map(ca.get(\"memory.events\")),counter_map(cb.get(\"memory.events\"))\n  ua,ub=counter_map(ca.get(\"cpu.stat\")),counter_map(cb.get(\"cpu.stat\"))\n  return {\"label\":label,\"start\":a[\"at\"],\"end\":b[\"at\"],\"seconds\":seconds,\"rows\":len(selected),\n   \"memory_psi_interval_percent\":{k:round((pb[k]-pa[k])/seconds/10000,4) for k in pa.keys()&pb.keys()} if seconds>0 else {},\n   \"memory_event_deltas\":{k:eb[k]-ea[k] for k in ea.keys()&eb.keys()},\n   \"cpu_core_equivalent\":round((ub.get(\"usage_usec\",0)-ua.get(\"usage_usec\",0))/seconds/1e6,5) if seconds>0 else None,\n   \"memory_current_start\":ca.get(\"memory.current\"),\"memory_current_end\":cb.get(\"memory.current\"),\n   \"swap_current_end\":cb.get(\"memory.swap.current\"),\"free_bytes_end\":b.get(\"free_bytes\")}\n windows=[interval_summary(\"last120_before\",[x for x in resource_rows if changed_at-125<=x[\"_ts\"]<changed_at]),\n  interval_summary(\"first120_after\",[x for x in resource_rows if changed_at<=x[\"_ts\"]<=changed_at+125])]\n if resource_rows:\n  last_time=resource_rows[-1][\"_ts\"];windows.append(interval_summary(\"latest120_after\",[x for x in resource_rows if max(changed_at,last_time-125)<=x[\"_ts\"]<=last_time]))\n current_props=subprocess.check_output([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"MainPID\",\"-p\",\"InvocationID\",\"-p\",\"ControlGroup\",\"-p\",\"MemoryHigh\",\"-p\",\"MemoryMax\",\"-p\",\"MemorySwapMax\"],text=True)\n pressure={name:(pathlib.Path(\"/proc/pressure\")/name).read_text().strip() for name in (\"memory\",\"cpu\",\"io\")}\n print(\"REDESIGN_MEMORY_INTERVENTION_EFFECT=\"+json.dumps({\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"intervention_at\":intervention[\"after\"][\"at\"],\"windows\":windows,\"current_unit\":current_props,\"host_pressure\":pressure,\"original_resource_policy_is_initial_only\":True}),flush=True)\nerrors=[]\nfor q in sorted(folder.glob(\"guest-logcat-all-*.log\")):\n with q.open(errors=\"replace\") as stream:\n  for line in stream:\n   if \"ServiceSpecificException: Failed to run dex2oat\" in line or (\"dex2oat\" in line and (\"error_msg\" in line or \"Failed to\" in line or \"ERROR\" in line)):\n    errors.append({\"file\":q.name,\"chars\":len(line),\"line\":line if len(line)<=9000 else line[:700]+\" ...TRUNCATED MIDDLE... \"+line[-7500:]})\nprint(\"REDESIGN_BOOT_DEXOPT_ERRORS_FULL=\"+json.dumps(errors[-12:]),flush=True)\n\n# final bounded Timeweb boot observation before deadline; Windows test host now authorized 2026-10-25T1257Z\n",timeout=150)
          PY
