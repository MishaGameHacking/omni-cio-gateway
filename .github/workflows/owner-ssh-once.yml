name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-caret-diagnostic
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Repair and test observed cursor diagnostic gap on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      script="import datetime,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path(\"/root\")\nrepo=root/\"analyst-ai-android-690811a5\"\npython=root/\"analyst-ai-development-venv/bin/python\"\nassert subprocess.check_output([\"git\",\"rev-parse\",\"HEAD\"],cwd=repo,text=True).strip()==\"690811a5a376181990a64f37d914c87eb6c919b7\"\nassert not subprocess.check_output([\"git\",\"status\",\"--porcelain\",\"--untracked-files=no\"],cwd=repo,text=True).strip(),\"unexpected_existing_source_changes\"\nfor name in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    assert (repo/name).is_file()\nnative=repo/\".github/scripts/native_input_evidence.py\"\ntests=repo/\".github/scripts/tests/test_native_input_evidence.py\"\nold=\"    before = probe.wait_for(lambda: focused_editor(probe.tree(), text, (expected, expected)),\\n                            \\\"Native cursor did not move within the unsent question\\\")\"\nnew=\"    before = _wait_editor(probe, lambda: focused_editor(probe.tree(), text, (expected, expected)),\\n                          \\\"Native cursor did not move within the focused editor\\\",\\n                          \\\"rotation-caret\\\", text)\"\naddition=\"\\n    def test_stuck_caret_reports_native_state_without_advancing_or_disclosing_text(self):\\n        probe = Mock()\\n        root = frame(text=\\\"private draft\\\")\\n        root.set(\\\"keyboard-visible\\\", \\\"true\\\")\\n        probe.tree.return_value = root\\n        failure = AssertionError(\\\"native caret did not move\\\")\\n\\n        def wait(read, _message):\\n            result = read()\\n            if result is None:\\n                raise failure\\n            return result\\n\\n        probe.wait_for.side_effect = wait\\n        with patch(\\\"builtins.print\\\") as output, self.assertRaises(AssertionError) as caught:\\n            native.rotate_focused_draft(probe, \\\"private draft\\\", \\\"portrait-caret\\\", portrait_only=True)\\n        self.assertIs(caught.exception, failure)\\n        lines = [call.args[0] for call in output.call_args_list]\\n        records = [json.loads(line.split(\\\"=\\\", 1)[1]) for line in lines\\n                   if line.startswith(\\\"NATIVE_EDITOR_FAILURE=\\\")]\\n        self.assertEqual(len(records), 1)\\n        self.assertEqual(records[0][\\\"phase\\\"], \\\"rotation-caret\\\")\\n        self.assertEqual(records[0][\\\"sample\\\"], \\\"post-timeout\\\")\\n        self.assertEqual(records[0][\\\"editors\\\"][0][\\\"selection-end\\\"], \\\"5\\\")\\n        self.assertTrue(records[0][\\\"editors\\\"][0][\\\"expected_text_matches\\\"])\\n        self.assertNotIn(\\\"private draft\\\", \\\"\\\\n\\\".join(lines))\\n        self.assertEqual([call.args for call in probe.command.call_args_list],\\n                         [(\\\"shell\\\", \\\"input\\\", \\\"keyevent\\\", \\\"KEYCODE_DPAD_LEFT\\\")] * 2)\\n        probe.capture.assert_not_called()\\n\\n    def test_failed_caret_diagnostic_preserves_original_failure(self):\\n        probe = Mock()\\n        root = frame(text=\\\"private draft\\\")\\n        probe.tree.side_effect = [root, root, ConnectionError(\\\"private transport detail\\\")]\\n        failure = AssertionError(\\\"native caret did not move\\\")\\n\\n        def wait(read, _message):\\n            result = read()\\n            if result is None:\\n                raise failure\\n            return result\\n\\n        probe.wait_for.side_effect = wait\\n        with patch(\\\"builtins.print\\\") as output, self.assertRaises(AssertionError) as caught:\\n            native.rotate_focused_draft(probe, \\\"private draft\\\", \\\"portrait-caret\\\", portrait_only=True)\\n        self.assertIs(caught.exception, failure)\\n        self.assertEqual(output.call_args.args[0], \\\"NATIVE_EDITOR_DIAGNOSTIC_UNAVAILABLE=ConnectionError\\\")\\n        self.assertEqual([call.args for call in probe.command.call_args_list],\\n                         [(\\\"shell\\\", \\\"input\\\", \\\"keyevent\\\", \\\"KEYCODE_DPAD_LEFT\\\")] * 2)\\n        probe.capture.assert_not_called()\\n\\n\"\nassert native.read_text().count(old)==1\ntext=tests.read_text();marker=\"class NativeInputEvidenceTests(unittest.TestCase):\\n\"\nassert text.count(marker)==1 and \"test_stuck_caret_reports_native_state\" not in text\ntests.write_text(text.replace(marker,marker+addition))\nlogdir=root/\"analyst-caret-diagnostic-20261024\";logdir.mkdir(mode=0o700)\nenv=dict(os.environ,PYTHONPATH=str(repo/\".github/scripts\")+os.pathsep+str(repo/\".github/scripts/tests\"),PYTHONDONTWRITEBYTECODE=\"1\")\ndef run_check(name,args):\n    result=subprocess.run([str(python),\"-m\",\"unittest\",*args],cwd=repo,env=env,capture_output=True,timeout=240)\n    output=result.stdout+result.stderr\n    path=logdir/(name+\".log\");path.write_bytes(output);path.chmod(0o600)\n    count=re.search(rb\"Ran (\\d+) tests?\",output)\n    return {\"exit\":result.returncode,\"tests\":int(count.group(1)) if count else 0,\"log_sha256\":hashlib.sha256(output).hexdigest()}\nfocused=[\"test_native_input_evidence.NativeInputEvidenceTests.test_stuck_caret_reports_native_state_without_advancing_or_disclosing_text\",\"test_native_input_evidence.NativeInputEvidenceTests.test_failed_caret_diagnostic_preserves_original_failure\"]\nbefore=run_check(\"before\",focused)\nassert before[\"exit\"]==1 and before[\"tests\"]==2,\"regression_did_not_reproduce\"\nnative.write_text(native.read_text().replace(old,new))\nafter=run_check(\"after\",focused)\nall_scripts=run_check(\"all-scripts\",[\"discover\",\"-s\",\".github/scripts/tests\",\"-p\",\"test_*.py\"])\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,capture_output=True,check=True)\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_head\":\"690811a5a376181990a64f37d914c87eb6c919b7\",\"before\":before,\"after\":after,\"all_scripts\":all_scripts,\"runtime_cursor_failure_fixed\":False,\"android_runtime_executed\":False,\"candidate_apk_unchanged\":True}\nreport_path=logdir/\"verification.json\";report_path.write_text(json.dumps(report,indent=2)+\"\\n\");report_path.chmod(0o600)\nprint(\"TIMEWEB_CARET_DIAGNOSTIC=\"+json.dumps(report),flush=True)\nassert after[\"exit\"]==0 and after[\"tests\"]==2 and all_scripts[\"exit\"]==0 and all_scripts[\"tests\"]>0,\"diagnostic_validation_failed\"\ndevelopment=root/\"analyst-ai-development-79be1821\"\nnote=\"Продолжение F01/F23 24.10.2026: на Timeweb 9413105 воспроизведён недостаток диагностики подтверждённого Android-сбоя run39993098373 (strategy/ready;font=2.0, курсор до поворота). В рабочем дереве 690811a5 ожидание курсора использует существующую ограниченную диагностику без текста; исходный отказ не подавляется, ввод/ожидаемая позиция/портретная проверка не изменены. Два новых отрицательных сценария падали до исправления и проходят после. Проверка Python-сценариев: \"+str(all_scripts[\"tests\"])+\" тестов, exit=0; журнал и хеши /root/analyst-caret-diagnostic-20261024/verification.json. Это исправление наблюдаемости проверки, не доказательство исправления Android runtime. APK и серверный канал не менялись. Полная матрица требует готовности Timeweb 121673; реальный вход и Trusted Origins нового домена остаются непроверенными.\\n\"\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=development/rel;body=path.read_text();assert note not in body;path.write_text(body.rstrip()+\"\\n\\n\"+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=development,capture_output=True,check=True)\n"
                      output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=360).decode()
                      print(output,end="",flush=True)
                      docs=json.loads(p.remote(command,"python3 -c "+shlex.quote("import json,pathlib\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\"\nsecret=json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"TELEGRAM_CLIENT_SECRET\"]\nfiles={rel:(repo/rel).read_text() for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\")}\nfiles.update({rel:(root/\"analyst-ai-android-690811a5\"/rel).read_text() for rel in (\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\")})\nassert all(secret not in text and \"-----BEGIN OPENSSH PRIVATE KEY-----\" not in text and \"-----BEGIN PRIVATE KEY-----\" not in text for text in files.values())\nprint(json.dumps(files))\n"),timeout=30))
                      assert set(docs)=={"AGENTS.md","docs/MASTER_PLAN.md","docs/PLAN_STATUS.md",".github/scripts/native_input_evidence.py",".github/scripts/tests/test_native_input_evidence.py"}
                      def gh(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"+path,method=method,data=data,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              raw=response.read(4*1024*1024+1)
                          return json.loads(raw) if raw else {}
                      ref=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert ref["object"]["sha"]==os.environ["GITHUB_SHA"],"backup_ref_changed"
                      commit=gh("GET","/git/commits/"+ref["object"]["sha"])
                      tree=gh("POST","/git/trees",{"base_tree":commit["tree"]["sha"],"tree":[{"path":path,"mode":"100644","type":"blob","content":text} for path,text in docs.items()]})
                      backed=gh("POST","/git/commits",{"message":"Back up cursor failure diagnostics developed and tested on Timeweb","tree":tree["sha"],"parents":[ref["object"]["sha"]]})
                      current=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert current["object"]["sha"]==ref["object"]["sha"],"backup_ref_changed"
                      gh("PATCH","/git/refs/heads/codex/timeweb-owner-prepare-2026-10-23",{"sha":backed["sha"],"force":False})
                      print("TIMEWEB_DOCUMENT_BACKUP="+json.dumps({"sha":backed["sha"],"tree":tree["sha"],"files":sorted(docs),"edited_on":"Timeweb 9413105"}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
