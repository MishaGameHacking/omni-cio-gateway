name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])

          req=urllib.request.Request("https://api.timeweb.cloud/api/v1/servers/9414261",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=30) as r:s=json.loads(r.read(4194304))["server"]
          assert s["id"]==9414261 and s["name"]=="analyst-ai-workspace-20261024" and s["project_id"]==2941515
          safe={k:s.get(k) for k in ("id","name","status","created_at","cpu","ram","location","availability_zone","configurator_id","preset_id")}
          safe["keys"]=sorted(s)
          safe["networks"]=[{k:n.get(k) for k in ("type","name","is_nat","id","ips")} for n in s.get("networks",[])]
          print("TARGET_SERVER_STATE="+json.dumps(safe),flush=True)
          target_ip=p.cloud.public_ipv4(s)

          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      payload={"ip":target_ip,"status":s["status"],"script":"BOOTSTRAP=\"import json,os,pathlib,subprocess\\nos.umask(0o077)\\nw=pathlib.Path(\\\"/root/analyst-workspace-bootstrap\\\");w.mkdir(mode=0o700,exist_ok=True)\\nlog=(w/\\\"bootstrap.log\\\").open(\\\"a\\\")\\nenv=os.environ.copy();env[\\\"DEBIAN_FRONTEND\\\"]=\\\"noninteractive\\\"\\nsubprocess.run([\\\"apt-get\\\",\\\"update\\\"],env=env,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=300)\\nsubprocess.run([\\\"apt-get\\\",\\\"install\\\",\\\"-y\\\",\\\"--no-install-recommends\\\",\\\"python3-venv\\\",\\\"openjdk-17-jdk-headless\\\",\\\"ca-certificates\\\",\\\"caddy\\\",\\\"git\\\",\\\"rsync\\\",\\\"curl\\\",\\\"unzip\\\",\\\"zip\\\",\\\"xz-utils\\\",\\\"nodejs\\\",\\\"libglu1-mesa\\\",\\\"libvulkan1\\\",\\\"mesa-vulkan-drivers\\\",\\\"libgl1\\\",\\\"libpulse0\\\",\\\"libx11-xcb1\\\",\\\"libxcb-cursor0\\\",\\\"xvfb\\\",\\\"xauth\\\"],env=env,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=900)\\nsubprocess.run([\\\"systemctl\\\",\\\"disable\\\",\\\"--now\\\",\\\"caddy\\\"],check=True,stdout=log,stderr=subprocess.STDOUT)\\nif subprocess.run([\\\"id\\\",\\\"analyst-ai\\\"],capture_output=True).returncode:subprocess.run([\\\"useradd\\\",\\\"--system\\\",\\\"--user-group\\\",\\\"--home-dir\\\",\\\"/var/lib/analyst-ai\\\",\\\"--no-create-home\\\",\\\"--shell\\\",\\\"/usr/sbin/nologin\\\",\\\"analyst-ai\\\"],check=True)\\nssh=pathlib.Path(\\\"/etc/ssh/sshd_config.d/99-analyst-key-only.conf\\\")\\nssh.write_text(\\\"PasswordAuthentication no\\\\nKbdInteractiveAuthentication no\\\\nPermitRootLogin prohibit-password\\\\n\\\")\\nsubprocess.run([\\\"sshd\\\",\\\"-t\\\"],check=True,stdout=log,stderr=subprocess.STDOUT)\\nsubprocess.run([\\\"systemctl\\\",\\\"reload\\\",\\\"ssh\\\"],check=True,stdout=log,stderr=subprocess.STDOUT)\\nsubprocess.run([\\\"passwd\\\",\\\"-l\\\",\\\"root\\\"],check=True,stdout=log,stderr=subprocess.STDOUT)\\n(w/\\\"ready.json\\\").write_text(json.dumps({\\\"ready\\\":True,\\\"cpu\\\":os.cpu_count()})+\\\"\\\\n\\\")\\nprint(\\\"BOOTSTRAP_READY=true\\\")\\n\"\nimport datetime,hashlib,json,os,pathlib,shlex,subprocess,sys,time,traceback\nos.umask(0o077)\nw=pathlib.Path(\"/root/analyst-workspace-preparation-20261024\");d=json.loads((w/\"target.json\").read_text())\nassert d[\"name\"]==\"analyst-ai-workspace-20261024\" and d[\"id\"]!=9413105 and d[\"ip\"]\nssh=[\"ssh\",\"-F\",\"/dev/null\",\"-i\",str(w/\"target-access\"),\"-o\",\"BatchMode=yes\",\"-o\",\"IdentitiesOnly=yes\",\"-o\",\"StrictHostKeyChecking=yes\",\"-o\",\"HostKeyAlgorithms=ssh-ed25519\",\"-o\",\"UserKnownHostsFile=\"+str(w/\"target-known-hosts\"),\"-o\",\"ConnectTimeout=8\",\"-o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\",\"root@\"+d[\"ip\"]]\nreport={\"status\":\"starting\",\"target_id\":d[\"id\"],\"started\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\ndef save():\n    p=w/\"migration-staging.tmp\";p.write_text(json.dumps(report,indent=2)+\"\\n\");p.replace(w/\"migration-staging.json\")\ndef remote(code,timeout=60):\n    r=subprocess.run(ssh+[\"python3 -u -c \"+shlex.quote(code)],capture_output=True,timeout=timeout)\n    if r.returncode:\n        (w/\"target-last-error.txt\").write_bytes(r.stderr)\n        raise RuntimeError(\"target_command_failed_\"+str(r.returncode))\n    return r.stdout\ntry:\n    for _ in range(30):\n        try:\n            remote(\"import os;assert os.getuid()==0\",20);break\n        except (RuntimeError,subprocess.TimeoutExpired):time.sleep(5)\n    else:raise RuntimeError(\"pinned_target_ssh_unavailable\")\n    report[\"status\"]=\"installing_tools\";save()\n    remote(BOOTSTRAP,1500)\n    roots=[\"root/analyst-ai-source\",\"root/analyst-ai-development-79be1821\",\"root/analyst-ai-android-690811a5\",\"root/analyst-ai-artifacts\",\"root/analyst-ai-development-venv\",\"root/analyst-apk-direct-20261024\",\"root/analyst-caret-diagnostic-20261024\",\"root/analyst-live-origin-20261024\",\"root/analyst-resource-audit-20261024\",\"root/analyst-ai-enrollment.json\",\"root/analyst-ai-owner.json\",\"root/.android\",\"root/.gradle\",\"opt/analyst-android-sdk\",\"opt/analyst-ai\",\"etc/analyst-ai\",\"etc/systemd/system/analyst-ai-owner.service\",\"etc/systemd/system/caddy.service.d\",\"etc/systemd/system/analyst-resource-observer.service\",\"etc/systemd/system/analyst-resource-observer.timer\",\"usr/local/lib/analyst-ai-ops\",\"var/lib/analyst-ai-ops\",\"var/lib/caddy\"]\n    for p in roots:assert pathlib.Path(\"/\"+p).exists(),p\n    manifest={}\n    for base in (\"root/analyst-ai-source\",\"root/analyst-ai-development-79be1821\",\"root/analyst-ai-android-690811a5\",\"opt/analyst-ai/backend\"):\n        for p in pathlib.Path(\"/\"+base).rglob(\"*\"):\n            if p.is_file() and not p.is_symlink() and \".git\" not in p.parts and \"build\" not in p.parts and \"__pycache__\" not in p.parts and \".gradle\" not in p.parts:\n                manifest[str(p)]=hashlib.file_digest(p.open(\"rb\"),\"sha256\").hexdigest()\n    for name in (\"/root/.android/debug.keystore\",\"/etc/analyst-ai/backend.env\",\"/root/analyst-apk-direct-20261024/Analyst-AI-0.11.0-preview.apk\"):\n        p=pathlib.Path(name);manifest[name]=hashlib.file_digest(p.open(\"rb\"),\"sha256\").hexdigest()\n    report[\"status\"]=\"copying_existing_sources_tools_and_identity\";save()\n    with (w/\"transfer.log\").open(\"wb\") as log:\n        source=subprocess.Popen([\"tar\",\"-cpf\",\"-\",\"-C\",\"/\",*roots],stdout=subprocess.PIPE,stderr=log)\n        target=subprocess.Popen(ssh+[\"umask 077; tar -xpf - -C /\"],stdin=source.stdout,stdout=log,stderr=log)\n        source.stdout.close()\n        target_exit=target.wait(timeout=900);source_exit=source.wait(timeout=30)\n        assert target_exit==source_exit==0,\"source_transfer_failed\"\n    proof=remote(\"import hashlib,json,pathlib;expected=\"+repr(manifest)+\";assert all(hashlib.file_digest(pathlib.Path(p).open('rb'),'sha256').hexdigest()==h for p,h in expected.items());print(json.dumps({'files':len(expected),'all_sha256_match':True}))\",180)\n    report[\"copy_proof\"]=json.loads(proof)\n    remote(\"import grp,os,pathlib,subprocess;subprocess.run(['chown','-R','caddy:caddy','/var/lib/caddy'],check=True);os.chown('/etc/analyst-ai',0,grp.getgrnam('caddy').gr_gid);os.chown('/etc/analyst-ai/Caddyfile',0,grp.getgrnam('caddy').gr_gid);subprocess.run(['/opt/analyst-ai/venv/bin/python','-m','pip','check'],check=True);subprocess.run(['systemctl','daemon-reload'],check=True);subprocess.run(['systemd-analyze','verify','/etc/systemd/system/analyst-ai-owner.service'],check=True)\",90)\n    report[\"status\"]=\"ready_for_data_cutover\";report[\"finished\"]=datetime.datetime.now(datetime.timezone.utc).isoformat();save()\nexcept BaseException as e:\n    report[\"status\"]=\"failed\";report[\"error_type\"]=type(e).__name__;report[\"error\"]=str(e);save()\n    (w/\"migration-staging-failure.txt\").write_text(traceback.format_exc())\n    raise\n"}
                      print(p.remote(command,"python3 -c "+shlex.quote("import json,os,pathlib,subprocess,sys\nos.umask(0o077);data=json.load(sys.stdin);w=pathlib.Path(\"/root/analyst-workspace-preparation-20261024\")\nt=json.loads((w/\"target.json\").read_text());assert t[\"id\"]==9414261\nif data[\"ip\"]:\n    t[\"ip\"]=data[\"ip\"];(w/\"target.json\").write_text(json.dumps(t,indent=2)+\"\\n\");(w/\"target-known-hosts\").write_text(t[\"ip\"]+\" \"+t[\"host_public\"]+\"\\n\")\n(w/\"migration-staging.py\").write_text(data[\"script\"])\nif data[\"ip\"] and data[\"status\"]==\"on\":\n    unit=\"analyst-workspace-staging\"\n    active=subprocess.run([\"systemctl\",\"is-active\",\"--quiet\",unit],capture_output=True).returncode==0\n    if not active:\n        subprocess.run([\"systemd-run\",\"--unit\",unit,\"--no-block\",\"--property=Type=oneshot\",\"--property=RemainAfterExit=yes\",\"--property=Nice=10\",\"--property=MemoryMax=512M\",\"/usr/bin/python3\",str(w/\"migration-staging.py\")],check=True,capture_output=True)\n    print(\"MIGRATION_STAGING_STARTED=true\")\nelse:print(\"MIGRATION_TARGET_NOT_READY=true\")\n"),json.dumps(payload).encode(),timeout=40).decode(),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
