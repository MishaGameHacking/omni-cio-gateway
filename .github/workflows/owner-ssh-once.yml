name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-dns-confirmation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify actual DNS resolution on Moscow after the provider record changed
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["id"]==9413105 and server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and server["preset_id"]==6867 and p.cloud.public_ipv4(server)=="201.24.52.66"
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,json,pathlib,shutil,socket,subprocess,time\nroot=pathlib.Path(\"/root\");report={\"server_id\":9413105,\"hostname\":\"analyst-ai-2941515.twc1.net\",\"expected_ipv4\":\"201.24.52.66\",\"observations\":[]}\nif shutil.which(\"resolvectl\"):\n    cleared=subprocess.run([\"resolvectl\",\"flush-caches\"],capture_output=True,timeout=15)\n    report[\"local_dns_cache_flush_exit\"]=cleared.returncode\nfor attempt in range(5):\n    try:addresses=sorted({x[4][0] for x in socket.getaddrinfo(report[\"hostname\"],443,socket.AF_INET,socket.SOCK_STREAM)})\n    except OSError as error:addresses=[];report[\"last_error\"]=type(error).__name__\n    report[\"observations\"].append({\"at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"addresses\":addresses})\n    if addresses==[report[\"expected_ipv4\"]]:break\n    if attempt<4:time.sleep(15)\nreport[\"verified\"]=report[\"observations\"][-1][\"addresses\"]==[report[\"expected_ipv4\"]]\nout=root/\"analyst-moscow-dns-confirmation.json\";out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\nhandoff_path=root/\"analyst-moscow-handoff.json\";handoff=json.loads(handoff_path.read_text());handoff[\"dns_confirmation\"]=report\nhandoff_path.write_text(json.dumps(handoff,ensure_ascii=False,indent=2));handoff_path.chmod(0o600)\nready_path=root/\"analyst-moscow-readiness.json\";ready=json.loads(ready_path.read_text());ready[\"dns_resolves_to_moscow\"]=report[\"verified\"]\nready_path.write_text(json.dumps(ready,indent=2));ready_path.chmod(0o600)\nrepo=root/\"analyst-ai-development-79be1821\";heading=\"## TIMEWEB 24.10.2026 — итог проверки DNS после смены адреса\"\nnote=heading+chr(10)+chr(10)+\"После смены A-записи и очистки только локального DNS-кэша фактическое разрешение домена из Москвы: \"+\", \".join(report[\"observations\"][-1][\"addresses\"])+\". Совпадение с 201.24.52.66: \"+str(report[\"verified\"])+\". Это подтверждение DNS, не подтверждение HTTPS, привязки владельца или рабочего приложения.\"+chr(10)\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=repo/rel;old=path.read_text();assert heading not in old\n    path.write_text(old.rstrip()+chr(10)+chr(10)+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"MOSCOW_DNS_CONFIRMATION=\"+json.dumps(report),flush=True)\n"
                  output=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=150).decode()
                  print(output,end="",flush=True)
                  result=json.loads(next(line.split("=",1)[1] for line in output.splitlines() if line.startswith("MOSCOW_DNS_CONFIRMATION=")))
                  assert result["verified"],"dns_not_yet_resolving_to_verified_moscow_address"
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
