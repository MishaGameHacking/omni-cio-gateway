name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-repair
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Repair cloud-init on the existing empty Moscow VM and verify pinned SSH
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,re,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error,uuid
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          import replace_unreachable_vm as replacement
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          name="analyst-ai-msk-app-20261024"
          marker="Analyst AI first cloud server relocation to Moscow 2026-10-24"
          cfg={"configurator_id":43,"cpu":1,"ram":1024,"disk":15360}
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          def inventory():
              doc=p.read_resource(token,"servers")
              assert p.summarize("servers",doc)["complete"],"incomplete_inventory"
              return doc["servers"]
          
          before=inventory()
          assert {s["id"]:(s["name"],s["location"]) for s in before}=={9408159:("analyst-ai-owner-route-20261023","nl-1"),9413003:(name,"ru-3")},"unexpected_inventory_before_repair"
          selected,=[r for r in p.read_catalog(token,"presets")["server_presets"] if r["id"]==6867]
          assert selected["cpu"]==1 and selected["ram"]==1024 and selected["disk"]==15360 and selected["price"]==1720 and selected["bandwidth"]==1000
          price=1720
          sid=9413003
          access.SERVER_ID=sid
          def verify(document):
              s=document["server"]
              assert s["id"]==sid and s["name"]==name and s["comment"]==marker and s["location"]=="ru-3" and s["availability_zone"]=="msk-1"
              assert s["preset_id"]==6867 and s["cpu"]==1 and s["ram"]==1024 and p.cloud.public_ipv4(s)=="81.200.158.176"
              return s
          p.owned_server=verify
          p.NAME=name;p.MARKER=marker;p.CONFIG_LOCATION="ru-3"
          p.cloud.OWNER_MARKER=marker
          server=verify(get("/servers/"+str(sid)))
          assert server["status"] in {"on","installing"},"reconcile_empty_server_before_install"
          init=server.get("cloud_init") or ""
          print("MOSCOW_INIT_READBACK="+json.dumps({"id":sid,"value_type":type(init).__name__,"length":len(init),"real_lines":len(init.splitlines()),"correct_header":init.startswith("#cloud-config"+chr(10)),"redacted":init=="hidden_by_runtime_policy"}),flush=True)
          def mutate(method,suffix,payload):
              assert (method,suffix) in {("PATCH",""),("POST","/action")}
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/servers/"+str(sid)+suffix,method=method,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with opener.open(req,timeout=30) as response:
                      raw=response.read(4*1024*1024+1)
                      return p.decode_response(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  print("MOSCOW_REPAIR_API_FAILURE="+json.dumps({"status":error.code,**p.cloud.error_details(error.read(1024*1024))}),flush=True)
                  raise p.ProbeError("moscow_repair_http_rejection_no_retry") from None
          with tempfile.TemporaryDirectory(prefix="analyst-moscow-repair-",dir=os.environ["RUNNER_TEMP"]) as temp:
              folder=pathlib.Path(temp)
              p.cloud.generate_key(folder/"client");p.cloud.generate_key(folder/"host")
              client=(folder/"client.pub").read_text().strip();host=(folder/"host.pub").read_text().strip()
              cloud={"users":[{"name":"root","lock_passwd":True,"ssh_authorized_keys":[client]}],"ssh_pwauth":False,"disable_root":False,"ssh_deletekeys":True,
                  "ssh_keys":{"ed25519_private":(folder/"host").read_text(),"ed25519_public":host},"ssh":{"emit_keys_to_console":False},"no_ssh_fingerprints":True,
                  "runcmd":[["systemctl","restart","ssh"]]}
              value="#cloud-config"+chr(10)+json.dumps(cloud)+chr(10)
              assert json.loads(value.splitlines()[1])==cloud
              print("MOSCOW_REPAIR_HOST_PIN="+json.dumps({"id":sid,"ip":"81.200.158.176","host_key":host}),flush=True)
              mutate("PATCH","",{"os_id":99,"cloud_init":value})
              changed=verify(get("/servers/"+str(sid)))
              readback=changed.get("cloud_init") or ""
              print("MOSCOW_INIT_PATCH_ACK="+json.dumps({"id":sid,"http_accepted":True,"readback_equal":readback==value,"readback_redacted":readback=="hidden_by_runtime_policy","readback_lines":len(readback.splitlines()),"ssh_verification_pending":True}),flush=True)
              print("MOSCOW_CLOUD_INIT_FIXED="+json.dumps({"id":sid,"ip":"81.200.158.176","host_key":host,"old_server_preserved":True,"application_data_migrated":False}),flush=True)
              # The official twc client reinstalls with PATCH os_id, not the legacy install action.
              print("MOSCOW_EMPTY_REINSTALL_ACCEPTED="+json.dumps({"id":sid}),flush=True)
              cfg={"preset_id":6867,"cpu":1,"ram":1024,"disk":15360}
              ip_id="a0fc704a-bf26-440a-b55f-facd8db769df"
              created_key=access.request(token,"POST","/ssh-keys",{"name":"analyst-msk-repair-"+os.environ["GITHUB_RUN_ID"],"body":client,"is_default":False})
              key=created_key.get("ssh_key",created_key.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==client.split()[:2]
              key_id=key["id"]
              attached=False
              command=p.ssh_command(folder,"81.200.158.176",host)
              address="81.200.158.176"
              try:
                  access.request(token,"POST","/servers/9413003/ssh-keys",{"ssh_key_ids":[key_id]})
                  attached=True
                  last=None
                  for attempt in range(30):
                      current=verify(get("/servers/9413003"))
                      result=None
                      try:
                          result=subprocess.run(command+["cloud-init status --wait >/dev/null && test $(id -u) = 0"],capture_output=True,timeout=20)
                          if result.returncode==0:
                              print("MOSCOW_PINNED_SSH=verified",flush=True)
                              break
                          error=result.stderr.decode("utf-8","replace")
                          reason="host_key_mismatch" if "REMOTE HOST IDENTIFICATION HAS CHANGED" in error or "Host key verification failed" in error else "public_key_auth_failed" if "Permission denied" in error else "connection_timeout" if "timed out" in error else "connection_refused" if "Connection refused" in error else "remote_command_failed"
                      except subprocess.TimeoutExpired:reason="cloud_init_or_transport_timeout"
                      state={"status":current["status"],"reason":reason}
                      if state!=last:print("MOSCOW_SSH_WAIT="+json.dumps(state),flush=True);last=state
                      time.sleep(5)
                  else:raise p.ProbeError("moscow_pinned_ssh_unavailable_after_documented_reinstall")
                  check="import datetime,json,os,pathlib,shutil; print(json.dumps({'cpu':os.cpu_count(),'memory_kib':int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemTotal:'))),'free_disk_bytes':shutil.disk_usage('/').free,'os_release':pathlib.Path('/etc/os-release').read_text(),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))"
                  hardware=json.loads(p.remote(command,"python3 -c "+shlex.quote(check),timeout=30))
                  telegram=json.loads(p.remote(command,"python3 -c "+shlex.quote(replacement.TELEGRAM_CHECK),timeout=60))
                  ready=hardware["memory_kib"]>=selected["ram"]*1024*0.8 and hardware["free_disk_bytes"]>=5*1024**3 and 'VERSION_ID="24.04"' in hardware["os_release"] and telegram.get("telegram_jwks_https") is True
                  print(p.remote(command,"python3 -c "+shlex.quote("import datetime,json,os,pathlib,re,shutil,subprocess\ndef run(args):\n    p=subprocess.run(args,capture_output=True,text=True,timeout=25)\n    return p.returncode,p.stdout.strip()\nreport={\"server_id\":9413003,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"memory\":{},\"free_disk_bytes\":shutil.disk_usage(\"/\").free,\"reboot_required\":pathlib.Path(\"/var/run/reboot-required\").exists()}\nfor line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n    k,_,v=line.partition(\":\")\n    if k in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}:report[\"memory\"][k+\"_kib\"]=int(v.split()[0])\ncode,out=run([\"cloud-init\",\"status\",\"--format\",\"json\"])\ntry:\n    status=json.loads(out)\n    report[\"cloud_init\"]={\"returncode\":code,\"status\":status.get(\"status\"),\"extended_status\":status.get(\"extended_status\"),\"errors_count\":len(status.get(\"errors\",[])),\"recoverable_error_keys\":sorted(status.get(\"recoverable_errors\",{}))}\nexcept Exception:report[\"cloud_init\"]={\"returncode\":code,\"json_valid\":False}\ncode,out=run([\"systemctl\",\"--failed\",\"--plain\",\"--no-legend\",\"--no-pager\"])\nreport[\"failed_units\"]=[line.split()[0] for line in out.splitlines() if line.split() and re.fullmatch(\"[A-Za-z0-9_.@:-]+\",line.split()[0])]\nreport[\"units\"]={}\nfor unit in (\"qemu-guest-agent.service\",\"ssh.service\",\"cloud-final.service\",\"systemd-networkd.service\"):\n    code,out=run([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"ExecMainStatus\"])\n    report[\"units\"][unit]={k:v for line in out.splitlines() if \"=\" in line for k,v in [line.split(\"=\",1)]}\ncode,out=run([\"/usr/sbin/sshd\",\"-T\"])\nreport[\"ssh_effective\"]={line.split()[0]:\" \".join(line.split()[1:]) for line in out.splitlines() if line.split() and line.split()[0] in {\"permitrootlogin\",\"passwordauthentication\",\"pubkeyauthentication\",\"kbdinteractiveauthentication\"}}\ncode,out=run([\"journalctl\",\"-k\",\"-b\",\"-g\",\"Out of memory|Killed process|oom-kill\",\"--no-pager\",\"-o\",\"cat\"])\nreport[\"kernel_oom_log_lines\"]=len([l for l in out.splitlines() if l and not l.startswith(\"--\")])\n\ncode,out=run([\"dpkg-query\",\"-W\",\"-f=\"+chr(36)+\"{db:Status-Status} \"+chr(36)+\"{binary:Package} \"+chr(36)+\"{Version}\"+chr(10)])\nreport[\"php_packages\"]=[line for line in out.splitlines() if line.startswith(\"installed \") and any(t in line.split()[1].lower() for t in (\"php\",\"frankenphp\"))]\nreport[\"php_executables\"]={name:shutil.which(name) for name in (\"php\",\"php-cgi\",\"php-fpm\",\"frankenphp\",\"lsphp\")}\ncode,out=run([\"systemctl\",\"list-unit-files\",\"--no-legend\",\"--no-pager\"])\nreport[\"php_unit_files\"]=[line.split()[0] for line in out.splitlines() if \"php\" in line.lower()]\nreport[\"php_runtime_present\"]=bool(report[\"php_packages\"] or any(report[\"php_executables\"].values()) or report[\"php_unit_files\"])\np=pathlib.Path(\"/root/analyst-moscow-health.json\")\nassert not p.is_symlink()\nfd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\nwith os.fdopen(fd,\"w\") as f:f.write(json.dumps(report,indent=2)+\"\\n\")\nprint(\"MOSCOW_APP_HEALTH=\"+json.dumps(report),flush=True)\n\n\nassert not report[\"php_runtime_present\"],\"unexpected_php_runtime_requires_security_update\"\nassert not report[\"failed_units\"] and report[\"cloud_init\"][\"status\"]==\"done\",\"guest_health_check_failed\"\n"),timeout=90).decode(),end="",flush=True)
                  proof={"id":sid,"name":name,"project_id":2941515,"location":"ru-3","ip":address,"ip_id":ip_id,"host_key":host,"configuration":cfg,"monthly_vm_rub":price,"hardware":hardware,"telegram":telegram,"basic_readiness":ready,"application_started":False,"migration_verified":False,"old_server_id":9408159}
                  p.remote(command,"umask 077; test ! -e /root/analyst-moscow-readiness.json && cat > /root/analyst-moscow-readiness.json",json.dumps(proof,indent=2).encode(),timeout=30)
                  print("MOSCOW_READINESS="+json.dumps(proof),flush=True)
                  if not ready:raise p.ProbeError("moscow_not_ready_no_migration_or_dns_change")
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413003/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_REPAIR_API_KEY=removed",flush=True)
          
          PY
