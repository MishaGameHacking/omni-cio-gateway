name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-build-readonly-inspection
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Check account activation blockers without exposing billing details
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal,InvalidOperation
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(2*1024*1024+1))
          status=get("/account/status")["status"]
          fin=get("/account/finances")["finances"]
          def positive(value):
              try:return Decimal(str(value))>0
              except InvalidOperation:return None
          report={"account_blocked":status.get("is_blocked"),"permanently_blocked":status.get("is_permanent_blocked"),"balance_positive":positive(fin.get("balance")),"paid_hours_positive":positive(fin.get("hours_left"))}
          rows=p.read_resource(token,"servers");assert p.summarize("servers",rows)["complete"]
          report["servers"]=[{k:s.get(k) for k in ("id","name","status","preset_id","availability_zone")} for s in rows["servers"]]
          print("TIMEWEB_START_BLOCKERS="+json.dumps(report),flush=True)
          PY
