name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-build-observation
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Diagnose guest memory visibility and hotplug state without changing the VM
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,shlex,socket,sys,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as prepare
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          original_select=adopt.select_target
          def select_target(new):
              original_select(new)
              if new:prepare.CONFIGURATION["ram"]=3072
          adopt.select_target=select_target
          def execute_remote(command):
              remote="import fcntl,json,pathlib,subprocess\nroot=pathlib.Path(\"/sys/devices/system/memory\")\nmeminfo={x.split(\":\")[0]:int(x.split()[1]) for x in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if x.split(\":\")[0] in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}}\nstates={}\nfor path in root.glob(\"memory[0-9]*/state\"):\n    states[path.parent.name]=path.read_text().strip()\ncpu=pathlib.Path(\"/proc/cpuinfo\").read_text().split()\nreport={\"memory_kib\":meminfo,\"memory_block_states\":states,\"auto_online_blocks\":(root/\"auto_online_blocks\").read_text().strip() if (root/\"auto_online_blocks\").exists() else None,\"block_size_hex\":(root/\"block_size_bytes\").read_text().strip() if (root/\"block_size_bytes\").exists() else None,\"boot_memory_limits\":[v for v in pathlib.Path(\"/proc/cmdline\").read_text().split() if v.startswith((\"mem=\",\"memmap=\"))],\"cpu_vmx\":\"vmx\" in cpu,\"cpu_svm\":\"svm\" in cpu,\"kvm_device\":pathlib.Path(\"/dev/kvm\").exists(),\"kvm_api\":None}\nfor name,args in ((\"lsmem\",[\"lsmem\",\"--json\"]),(\"dmi_memory\",[\"dmidecode\",\"--type\",\"memory\"])):\n    try:\n        r=subprocess.run(args,capture_output=True,text=True,timeout=20)\n        if name==\"lsmem\" and r.returncode==0:\n            report[name]=json.loads(r.stdout)\n        else:\n            report[name]={\"exit\":r.returncode,\"sizes\":[line.strip() for line in r.stdout.splitlines() if line.strip().startswith((\"Size:\",\"Maximum Capacity:\",\"Number Of Devices:\"))]}\n    except (OSError,ValueError,subprocess.TimeoutExpired) as error:report[name]={\"error\":type(error).__name__}\nif report[\"kvm_device\"]:\n    try:\n        with open(\"/dev/kvm\",\"r+b\",buffering=0) as dev:report[\"kvm_api\"]=fcntl.ioctl(dev,0xAE00,0)\n    except OSError as error:report[\"kvm_error\"]=type(error).__name__\nprint(\"TIMEWEB_GUEST_MEMORY_DIAG=\"+json.dumps(report),flush=True)\n"
              result=prepare.remote(command,"python3 -u -c "+shlex.quote(remote),timeout=90)
              print(result.decode("utf-8"),end="",flush=True)
          access.develop_backend=execute_remote
          adopt.run(development=True)
          PY
