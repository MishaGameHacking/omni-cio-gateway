name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import pathlib,os,json,subprocess,hashlib,shlex,datetime,shutil\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nw=pathlib.Path(\"/root/analyst-redesign-20261024\");w.mkdir(mode=0o700,exist_ok=True)\nassert json.loads(pathlib.Path(\"/var/lib/analyst-ai-ops/workspace-backup-proof.json\").read_text())[\"all_local_changes_backed_up\"]\nnotice=\"\"\"## OWNER 24.10.2026 — современный 2D-интерфейс и анимированная графика\nПоследний запрос заменяет прежнее требование «только 3D»: приложение полностью\nперерабатывается в едином современном 2D-стиле; цветные иконки и иллюстрации\nанимируются в 2D или 3D по смыслу. Движение может быть непрерывным или временным;\nучитывать системное отключение анимации, lifecycle и читаемость финансовых данных.\nСохранять строгую вертикальную ориентацию, реальные данные, доступные нативные\nполя ввода, авторизацию, ключ подписи и установленные пользовательские настройки.\nПлан новой версии: 0.12.0 / 36. Требуется исправить подтвержденные дефекты ИИ,\nпроверить актуальные модели, бюджет и реальные ответы, не имитировать ИИ.\nВсе изменения и проверки выполняются в /srv/analyst-ai/workspace на основном\nTimeweb 9413105. GitHub — резервная копия и ранее разрешенный транспорт.\nНе создавать временные/дублирующие серверы. Прежнее ограничение «без новых\nвизуальных изменений» не запрещает этот прямо заказанный полный редизайн.\nРезультаты сборки, runtime, публикации и телефона указывать раздельно.\n\"\"\"\np=root/\"AGENTS.md\";text=p.read_text()\nif \"## OWNER 24.10.2026 — современный 2D-интерфейс\" not in text:\n    p.write_text(text.replace(\"# Analyst AI — текущие правила работы\",\"# Analyst AI — текущие правила работы\\n\\n\"+notice,1))\n    shutil.chown(p,user=\"analyst-build\",group=\"analyst-build\")\n(w/\"started.json\").write_text(json.dumps({\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_backup\":\"29fff6ce1a1668b79a4c72e07230a102fd743ff6\",\"requested_version\":\"0.12.0\",\"version_code\":36}))\nenv={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n    if \"=\" in line and not line.startswith(\"#\"):\n        k,v=line.split(\"=\",1);a=shlex.split(v);env[k]=a[0] if a else \"\"\nai={k:bool(env.get(k,\"\").strip()) for k in (\"TIMEWEB_AI_TOKEN\",\"TIMEWEB_CLOUD_API_KEY\",\"AI_MODEL_FAST\",\"AI_MODEL_STANDARD\",\"AI_MODEL_PREMIUM\")}\nai[\"models\"]={k:env.get(k) for k in (\"AI_MODEL_FAST\",\"AI_MODEL_STANDARD\",\"AI_MODEL_PREMIUM\")}\nprint(\"REDESIGN_AI_CONFIGURATION=\"+json.dumps(ai),flush=True)\nprint(\"REDESIGN_RESOURCES=\"+json.dumps({\"memory\":{l.split(\":\")[0]:int(l.split()[1])*1024 for l in pathlib.Path(\"/proc/meminfo\").read_text().splitlines() if l.startswith((\"MemTotal:\",\"MemAvailable:\",\"SwapTotal:\"))},\"disk\":dict(zip((\"total\",\"used\",\"free\"),shutil.disk_usage(\"/\"))),\"backend\":subprocess.check_output([\"systemctl\",\"is-active\",\"analyst-ai-owner\"],text=True).strip()}),flush=True)\nprint(\"REDESIGN_WORKSPACE_HEAD=\"+subprocess.check_output([\"git\",\"-C\",str(root),\"rev-parse\",\"HEAD\"],text=True).strip(),flush=True)\nfor rel in (\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumDesignSystem.kt\",\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialScene.kt\",\"app/src/main/java/ru/omnicio/app/ui/theme/AnalystTheme.kt\",\"app/build.gradle.kts\",\"backend/timeweb_ai.py\"):\n    b=(root/rel).read_bytes();print(\"REDESIGN_SOURCE_HASH=\"+json.dumps({\"path\":rel,\"sha256\":hashlib.sha256(b).hexdigest()}),flush=True)\n"
                      print(p.remote(command,"python3 -c "+shlex.quote(remote_script),timeout=60).decode(),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
