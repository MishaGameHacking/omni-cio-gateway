name: Verify the staged Timeweb runtime before cutover
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify installed runtime with schedulers disabled and stop it afterward
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        \nsys.path[:0]=[\"deploy\",\"tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm as access\ntoken=p.validated_token(os.environ[\"\
        TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"https://api.timeweb.cloud/api/v1\"\
        +path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"Authorization\":\"Bearer \"\
        +token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\nfrom contextlib\
        \ import contextmanager\nimport importlib.util,stat\n@contextmanager\ndef owned_remote(sid,name,ip,host):\n    status,data=api(\"\
        GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"server\"]\n    assert server[\"id\"]==sid and\
        \ server[\"name\"]==name and server[\"project_id\"]==2941515 and server[\"availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n\
        \    assert server.get(\"is_qemu_agent\") is True and server.get(\"status\")==\"on\"\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-runtime-stage-access-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);folder.chmod(0o700)\n\
        \        p.cloud.generate_key(folder/\"client\");public=(folder/\"client.pub\").read_text().strip()\n        access.SERVER_ID=sid\n\
        \        created=access.request(token,\"POST\",\"/ssh-keys\",{\"name\":\"analyst-runtime-stage-\"+os.environ[\"GITHUB_RUN_ID\"\
        ]+\"-\"+str(sid),\"body\":public,\"is_default\":False})\n        key=created.get(\"ssh_key\",created.get(\"ssh-key\"\
        ,{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n       \
        \ attached=False\n        try:\n            access.SERVER_ID=sid\n            access.request(token,\"POST\",\"/servers/\"\
        +str(sid)+\"/ssh-keys\",{\"ssh_key_ids\":[kid]});attached=True\n            command=p.ssh_command(folder,ip,host);command[1:1]=[\"\
        -o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(24):\n       \
        \         try:\n                    check=subprocess.run([*command,\"test $(id -u) = 0\"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=12)\n\
        \                    if check.returncode==0:break\n                    if attempt in (0,11,23):print(\"RUNTIME_STAGE_SSH_WAIT=\"\
        +json.dumps({\"server_id\":sid,\"attempt\":attempt+1,\"exit_code\":check.returncode,\"stderr\":check.stderr.decode(errors=\"\
        replace\")[-1500:]}),flush=True)\n                    if attempt==23:raise RuntimeError(\"runtime_stage_ssh_not_ready\"\
        )\n                except subprocess.TimeoutExpired:\n                    if attempt==23:raise\n                time.sleep(5)\n\
        \            yield command\n        finally:\n            try:\n                access.SERVER_ID=sid\n           \
        \     if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n            finally:\n\
        \                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"RUNTIME_STAGE_TEMP_KEY_REMOVED=\"\
        +str(sid),flush=True)\n\nREMOTE = \"import datetime, hashlib, json, os, pathlib, shutil, sqlite3, stat, subprocess,\
        \ time\\nimport urllib.error, urllib.request\\n\\ndef need(value, code):\\n    if not value:\\n        raise RuntimeError(code)\\\
        n\\ndef digest(path):\\n    with pathlib.Path(path).open('rb') as stream:\\n        return hashlib.file_digest(stream,\
        \ 'sha256').hexdigest()\\n\\ndef state(unit):\\n    result = subprocess.run(['systemctl', 'show', unit, '--no-pager',\
        \ '-p', 'LoadState', '-p', 'ActiveState', '-p', 'MainPID', '-p', 'ControlPID'], capture_output=True, timeout=15, check=True)\\\
        n    return dict(line.split('=', 1) for line in result.stdout.decode().splitlines() if '=' in line)\\n\\ndef database():\\\
        n    with sqlite3.connect('file:/var/lib/analyst-ai/backend.db?mode=ro', uri=True, timeout=10) as connection:\\n \
        \       connection.execute('PRAGMA query_only=ON')\\n        need(connection.execute('PRAGMA quick_check').fetchall()\
        \ == [('ok',)], 'database_quick_check')\\n        need(connection.execute('PRAGMA foreign_key_check').fetchone() is\
        \ None, 'database_foreign_keys')\\n    return {'quick_check': 'ok', 'foreign_key_check': 'ok'}\\n\\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\\\
        n    def redirect_request(self, *args, **kwargs):\\n        return None\\n\\ndef response(path):\\n    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),\
        \ NoRedirect())\\n    request = urllib.request.Request('http://127.0.0.1:8080' + path, headers={'Accept': 'application/json'})\\\
        n    try:\\n        with opener.open(request, timeout=5) as result:\\n            body = result.read(4097)\\n    \
        \        need(len(body) <= 4096, 'health_body_too_large')\\n            return result.status, body\\n    except urllib.error.HTTPError\
        \ as error:\\n        return error.code, b''\\n\\nos.umask(0o077)\\nneed(os.geteuid() == 0, 'root_required')\\nstage\
        \ = pathlib.Path('/root/.analyst-runtime-stage-runtime-20261025-40206620200')\\nneed(stage.is_dir() and not stage.is_symlink(),\
        \ 'migration_stage_missing')\\nreceipt = json.loads((stage / 'installed-receipt.json').read_text())\\nneed(receipt['stage_id']\
        \ == 'runtime-20261025-40206620200' and receipt['archive_sha256'] == '8bfe20efa3e9917186a897ba484edf0523cc720f75b031e8c9705f1e27cbbcd6',\
        \ 'migration_receipt_changed')\\nneed(digest('/etc/analyst-ai/backend.env') == receipt['original_environment_sha256'],\
        \ 'original_environment_changed')\\noverride = pathlib.Path('/etc/analyst-ai/migration-stage.env')\\nneed(not override.is_symlink()\
        \ and stat.S_IMODE(override.stat().st_mode) == 0o600 and override.stat().st_uid == 0, 'scheduler_override_permissions')\\\
        nneed(override.read_bytes() == b'ANALYSIS_SCHEDULER_ENABLED=false\\\\nSANDBOX_WORKER_ENABLED=false\\\\n', 'scheduler_override_changed')\\\
        nneed(pathlib.Path('/etc/systemd/system/analyst-ai-owner.service.d/90-migration-stage.conf').read_bytes() == b'[Service]\\\
        \\nEnvironmentFile=/etc/analyst-ai/migration-stage.env\\\\n', 'service_override_changed')\\nunits = ('analyst-ai-owner.service',\
        \ 'analyst-ai-updates.service', 'caddy.service')\\nfor unit in units:\\n    current = state(unit)\\n    need(current['ActiveState']\
        \ == 'inactive' and current['MainPID'] == '0', 'new_unit_already_active')\\nreport = {'schema': 1, 'kind': 'new_runtime_local_health',\
        \ 'server_id': 9417611,\\n          'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),\\n   \
        \       'dns_changed': False, 'old_server_modified': False, 'public_cutover': False,\\n          'broker_operations':\
        \ False, 'ai_calls': False, 'scheduler_enabled': False,\\n          'database_before': database(), 'checks': {}}\\\
        nlog = stage / 'runtime-health-command.log'\\nneed(not log.exists(), 'health_probe_already_run')\\nstarted = False\\\
        nerror = None\\ntry:\\n    with log.open('xb') as output:\\n        for name, command in (\\n            ('backend_dependencies',\
        \ ['/opt/analyst-ai/venv/bin/python', '-m', 'pip', 'check']),\\n            ('updates_dependencies', ['/opt/analyst-ai-updates/venv/bin/python',\
        \ '-m', 'pip', 'check']),\\n            ('caddy_configuration', ['/usr/bin/caddy', 'validate', '--config', '/etc/caddy/Caddyfile']),\\\
        n        ):\\n            result = subprocess.run(command, stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT,\
        \ timeout=60)\\n            report['checks'][name] = {'exit_code': result.returncode}\\n            need(result.returncode\
        \ == 0, name + '_failed')\\n        started = True\\n        subprocess.run(['systemctl', 'start', 'analyst-ai-owner.service'],\
        \ stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT, check=True, timeout=60)\\n    deadline = time.monotonic()\
        \ + 60\\n    while True:\\n        try:\\n            health, body = response('/health')\\n            if health ==\
        \ 200 and json.loads(body) == {'status': 'ok'}:\\n                break\\n        except (OSError, ValueError):\\\
        n            pass\\n        need(time.monotonic() < deadline, 'backend_health_deadline')\\n        time.sleep(1)\\\
        n    running = state('analyst-ai-owner.service')\\n    need(running['ActiveState'] == 'active' and int(running['MainPID'])\
        \ > 0, 'backend_not_running')\\n    process_environment = pathlib.Path('/proc/' + running['MainPID'] + '/environ').read_bytes().split(b'\\\
        \\0')\\n    values = dict(entry.split(b'=', 1) for entry in process_environment if b'=' in entry)\\n    need(values.get(b'ANALYSIS_SCHEDULER_ENABLED')\
        \ == b'false' and values.get(b'SANDBOX_WORKER_ENABLED') == b'false', 'scheduler_not_disabled_in_process')\\n    private,\
        \ _ = response('/workspace/me')\\n    need(private == 401, 'private_route_not_protected')\\n    report['checks']['http']\
        \ = {'health': health, 'workspace_without_session': private}\\n    report['checks']['effective_scheduler_override']\
        \ = True\\n    report['database_after'] = database()\\n    report['memory_bytes'] = int(next(line.split()[1] for line\
        \ in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:'))) * 1024\\n    report['disk_free_bytes']\
        \ = shutil.disk_usage('/').free\\n    report['status'] = 'passed_local_backend_health'\\nexcept BaseException as failure:\\\
        n    error = failure\\n    report['status'] = 'failed'\\n    report['error_type'] = type(failure).__name__\\n    report['error_code']\
        \ = str(failure) if type(failure) is RuntimeError else 'operation_failed'\\nfinally:\\n    if started:\\n        stopped\
        \ = subprocess.run(['systemctl', 'stop', 'analyst-ai-owner.service'], capture_output=True, timeout=60)\\n        report['stop_exit_code']\
        \ = stopped.returncode\\n    report['services_after'] = {unit: state(unit) for unit in units}\\n    report['all_services_stopped']\
        \ = all(s['ActiveState'] == 'inactive' and s['MainPID'] == '0' for s in report['services_after'].values())\\n    report['finished_at']\
        \ = datetime.datetime.now(datetime.timezone.utc).isoformat()\\n    (stage / 'local-health-receipt.json').write_text(json.dumps(report,\
        \ sort_keys=True))\\n    print('RUNTIME_LOCAL_HEALTH=' + json.dumps(report, sort_keys=True), flush=True)\\nneed(report['all_services_stopped'],\
        \ 'new_services_remain_active')\\nif error is not None:\\n    raise SystemExit(1)\\n\"\nwith owned_remote(9417611,\"\
        Analyst AI runtime 20261025\",\"31.130.128.55\",\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\") as command:\n    result = subprocess.run([*command,\"python3 -\"],input=REMOTE.encode(),capture_output=True,timeout=300)\n\
        \    print(result.stdout.decode(),end=\"\",flush=True)\n    if result.returncode:\n        raise RuntimeError(\"new_runtime_local_health_failed\"\
        )\nPY\n"
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - deploy/access_owner_vm.py
    - deploy/replace_unreachable_vm.py
    - deploy/adopt_replacement_vm.py
    - .github/workflows/owner-ssh-once.yml
