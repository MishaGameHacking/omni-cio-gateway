name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess,pathlib,json,time\nstate=pathlib.Path('/var/lib/analyst-ai-build')\nchecked=json.loads((state/'check-result.json').read_text())\nassert checked.get('status')!='running','check_still_running'\nprint('REDESIGN_CHECK_STATUS='+json.dumps(checked),flush=True)\nfor step in checked.get('steps',[]):\n log=pathlib.Path(step.get('log','/nonexistent'))\n if log.is_file():print('REDESIGN_CHECK_STEP_TAIL='+json.dumps({'name':step['name'],'exit_code':step.get('exit_code'),'tail':log.read_text(errors='replace')[-18000 if step.get('exit_code',0) else -1200:]}),flush=True)\nscript=\"PARTS=[\\\"\\\",\\\"\\\"]\\nimport base64,zlib,json,pathlib,hashlib,os,pwd,fcntl,tempfile,datetime,sys\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\")\\nstate=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nassert os.geteuid()==pwd.getpwnam(\\\"analyst-build\\\").pw_uid\\nassert root.is_dir() and not root.is_symlink()\\nlock=(state/\\\"workspace.lock\\\").open(\\\"a\\\")\\nfcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\ndef blob(raw):return hashlib.sha1(b\\\"blob \\\"+str(len(raw)).encode()+b\\\"\\\\0\\\"+raw).hexdigest()\\ndeltas=[json.loads(zlib.decompress(base64.b64decode(s))) for s in PARTS]\\nchanges=[]\\nfor d in deltas:\\n relative=d[\\\"path\\\"];p=root/relative\\n assert not relative.startswith(\\\"/\\\") and \\\"..\\\" not in pathlib.PurePosixPath(relative).parts\\n for part in (p,*p.parents):\\n  if part==root:break\\n  assert not part.is_symlink(),\\\"source_symlink\\\"\\n old=p.read_bytes() if p.exists() else None\\n assert (None if old is None else blob(old))==d[\\\"old_blob\\\"],\\\"source_changed:\\\"+relative\\n if \\\"content\\\" in d:new=d[\\\"content\\\"].encode()\\n else:\\n  lines=old.decode().splitlines(keepends=True)\\n  for h in reversed(d[\\\"hunks\\\"]):\\n   assert 0<=h[\\\"start\\\"]<=h[\\\"end\\\"]<=len(lines)\\n   lines[h[\\\"start\\\"]:h[\\\"end\\\"]]=h[\\\"lines\\\"]\\n  new=\\\"\\\".join(lines).encode()\\n changes.append((relative,p,old,new))\\nbackup=state/\\\"diagnostics\\\"/(\\\"redesign-source-\\\"+datetime.datetime.now(datetime.timezone.utc).strftime(\\\"%Y%m%dT%H%M%S%fZ\\\"))\\nbackup.mkdir(parents=True,exist_ok=False)\\nfor relative,p,old,new in changes:\\n if old is not None:\\n  q=backup/relative;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(old)\\n p.parent.mkdir(parents=True,exist_ok=True)\\n fd,name=tempfile.mkstemp(prefix=\\\".\\\"+p.name+\\\".redesign-\\\",dir=p.parent)\\n try:\\n  with os.fdopen(fd,\\\"wb\\\") as f:f.write(new);f.flush();os.fsync(f.fileno())\\n  os.chmod(name,0o644);os.replace(name,p)\\n finally:\\n  if os.path.exists(name):os.unlink(name)\\n print(\\\"REDESIGN_SOURCE_FILE=\\\"+json.dumps({\\\"path\\\":relative,\\\"bytes\\\":len(new),\\\"sha256\\\":hashlib.sha256(new).hexdigest(),\\\"git_blob\\\":blob(new)}),flush=True)\\nsys.path.insert(0,str(root/\\\"deploy\\\"))\\nimport timeweb_workspace as workspace\\nprint(\\\"REDESIGN_SOURCE_APPLIED=\\\"+json.dumps({\\\"files\\\":len(changes),\\\"backup\\\":str(backup),\\\"source_sha256\\\":workspace.source_hash(),\\\"tests_run\\\":False}),flush=True)\\n\"\nr=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"python3\",\"-\"],input=script,text=True,capture_output=True,cwd=\"/srv/analyst-ai/workspace\",timeout=120)\nprint(r.stdout,flush=True)\nif r.returncode:print(r.stderr[-2000:],flush=True);raise RuntimeError(\"audit_coverage_patch_failed\")\nexport_script=\"PATHS=[\\\".github/scripts/audit_python_sources.py\\\",\\\".github/scripts/automation_artifacts.py\\\",\\\".github/scripts/automation_ui_probe.py\\\",\\\".github/scripts/installation_report.py\\\",\\\".github/scripts/profile_launch.py\\\",\\\".github/scripts/profile_ui_probe.py\\\",\\\".github/scripts/spatial_frame_evidence.py\\\",\\\".github/scripts/spatial_ui_probe.py\\\",\\\".github/scripts/test_apk_installation.py\\\",\\\".github/scripts/tests/test_android17_live_spectrum.py\\\",\\\".github/scripts/tests/test_automation_artifacts.py\\\",\\\".github/scripts/tests/test_automation_ui_probe.py\\\",\\\".github/scripts/tests/test_emulator_failures.py\\\",\\\".github/scripts/tests/test_installation_report.py\\\",\\\".github/scripts/tests/test_python_source_audit.py\\\",\\\".github/scripts/tests/test_spectrum_brand_identity.py\\\",\\\".github/scripts/validate_distribution.py\\\",\\\".github/workflows/android-apk.yml\\\",\\\"app/build.gradle.kts\\\",\\\"app/src/debug/java/ru/omnicio/app/AutomationWorkspaceProbe.kt\\\",\\\"app/src/debug/java/ru/omnicio/app/ProfileUiProbeActivity.kt\\\",\\\"app/src/debug/java/ru/omnicio/app/SpectrumDashboardProbe.kt\\\",\\\"app/src/main/AndroidManifest.xml\\\",\\\"app/src/main/java/ru/omnicio/app/AnalystApplication.kt\\\",\\\"app/src/main/java/ru/omnicio/app/MainActivity.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/diagnostics/ClientDiagnostics.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/diagnostics/CrashReportSanitizer.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/notifications/NotificationScheduling.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/notifications/WorkspaceNotificationService.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/portfolio/LivePortfolio.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/workspace/VolumeWorkspaceClient.kt\\\",\\\"app/src/main/java/ru/omnicio/app/data/workspace/WorkspaceEndpointPolicy.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/AnalystBottomBar.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/auth/TelegramLoginScreen.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/home/HomeScreen.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/profile/ProfileScreen.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialComponents.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/spatial/SpatialScene.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/spectrum/SpectrumDesignSystem.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/theme/AnalystTheme.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/workspace/AppearanceScreen.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/workspace/AutonomousDecisionsScreen.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/workspace/WorkspaceData.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/workspace/WorkspaceNavigation.kt\\\",\\\"app/src/main/java/ru/omnicio/app/ui/workspace/WorkspaceUi.kt\\\",\\\"app/src/screenshotTest/kotlin/ru/omnicio/app/preview/AutomationAppearanceScreenshotTest.kt\\\",\\\"app/src/test/java/ru/omnicio/app/data/diagnostics/CrashReportSanitizerTest.kt\\\",\\\"app/src/test/java/ru/omnicio/app/data/notifications/NotificationSchedulingTest.kt\\\",\\\"app/src/test/java/ru/omnicio/app/data/workspace/WorkspaceEndpointPolicyTest.kt\\\",\\\"backend/android_runtime_contract.py\\\",\\\"backend/app.py\\\",\\\"backend/automation_ui_evidence.py\\\",\\\"backend/autonomous_ai.py\\\",\\\"backend/autonomous_controller.py\\\",\\\"backend/client_diagnostics.py\\\",\\\"backend/installation_evidence.py\\\",\\\"backend/release_publication.py\\\",\\\"backend/tests/android_runtime_fixtures.py\\\",\\\"backend/tests/test_automatic_purchase_evidence.py\\\",\\\"backend/tests/test_autonomous_controller.py\\\",\\\"backend/tests/test_client_diagnostics.py\\\",\\\"backend/tests/test_installation_evidence.py\\\",\\\"backend/tests/test_release_runtime_publication.py\\\",\\\"backend/volume_live.py\\\",\\\"backend/volume_purchases.py\\\",\\\"deploy/tests/test_timeweb_workspace.py\\\",\\\"gradle.properties\\\",\\\"app/gradle.lockfile\\\",\\\"gradle.lockfile\\\"]\\nimport pathlib,json,hashlib,zlib,base64,sys,fcntl\\nroot=pathlib.Path(\\\"/srv/analyst-ai/workspace\\\");state=pathlib.Path(\\\"/var/lib/analyst-ai-build\\\")\\nwith (state/\\\"workspace.lock\\\").open(\\\"a\\\") as lock:\\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\\n sys.path.insert(0,str(root/\\\"deploy\\\"));import timeweb_workspace as workspace\\n rows=[]\\n for relative in PATHS:\\n  p=root/relative\\n  assert p.is_file() and not p.is_symlink() and p.resolve().is_relative_to(root)\\n  b=p.read_bytes();text=b.decode(\\\"utf-8\\\")\\n  rows.append({\\\"path\\\":relative,\\\"content\\\":text,\\\"bytes\\\":len(b),\\\"sha256\\\":hashlib.sha256(b).hexdigest(),\\\"git_blob\\\":hashlib.sha1(b\\\"blob \\\"+str(len(b)).encode()+b\\\"\\\\0\\\"+b).hexdigest(),\\\"mode\\\":\\\"100755\\\" if p.stat().st_mode&0o111 else \\\"100644\\\"})\\n raw=json.dumps({\\\"source_sha256\\\":workspace.source_hash(),\\\"files\\\":rows},ensure_ascii=False).encode()\\n encoded=base64.b64encode(zlib.compress(raw,9)).decode();chunks=[encoded[i:i+6000] for i in range(0,len(encoded),6000)]\\n print(\\\"REDESIGN_SOURCE_EXPORT_INFO=\\\"+json.dumps({\\\"files\\\":len(rows),\\\"bytes\\\":len(raw),\\\"sha256\\\":hashlib.sha256(raw).hexdigest(),\\\"parts\\\":len(chunks)}),flush=True)\\n for i,chunk in enumerate(chunks):print(\\\"REDESIGN_SOURCE_EXPORT_CHUNK=\\\"+json.dumps({\\\"number\\\":i,\\\"data\\\":chunk}),flush=True)\\n\"\nr=subprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"python3\",\"-\"],input=export_script,text=True,capture_output=True,cwd=\"/srv/analyst-ai/workspace\",timeout=60)\nprint(r.stdout,flush=True)\nif r.returncode:print(r.stderr[-2000:],flush=True);raise RuntimeError(\"source_export_failed\")\nif checked.get(\"status\")==\"passed\":\n r=subprocess.run([\"systemctl\",\"restart\",\"--no-block\",\"analyst-workspace@check.service\"],capture_output=True,text=True,timeout=15)\n if r.returncode:raise RuntimeError(\"check_restart_failed\")\n print(\"REDESIGN_FULL_CHECK_STARTED=true\",flush=True)\nelse:print(\"REDESIGN_FULL_CHECK_STARTED=false\",flush=True)\n",timeout=180)
          PY
