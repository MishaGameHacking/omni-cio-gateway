name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import pathlib,json,subprocess,time,os,shutil\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nexpected=\"fdb272e3b396586631babd98392590c1562b2c5bafd981dffa831e035b9b7f5c\"\nfor _ in range(7):\n checked=json.loads((state/\"check-result.json\").read_text())\n if checked.get(\"status\")!=\"running\":break\n time.sleep(5)\nprint(\"REDESIGN_CHECK_STATUS=\"+json.dumps(checked),flush=True)\nfor step in checked.get(\"steps\",[]):\n p=pathlib.Path(step[\"log\"])\n if step.get(\"exit_code\",0)!=0:\n  print(\"REDESIGN_CHECK_FAILURE=\"+json.dumps({\"step\":step[\"name\"],\"tail\":p.read_text(errors=\"replace\")[-14000:]}),flush=True)\n elif step[\"name\"] in (\"backend-tests\",\"host-tests\",\"tools-tests\",\"node-tests\",\"python-source-audit\",\"workspace-guard-tests\"):\n  print(\"REDESIGN_CHECK_SUMMARY=\"+json.dumps({\"step\":step[\"name\"],\"tail\":p.read_text(errors=\"replace\")[-600:]}),flush=True)\nif checked.get(\"status\")==\"passed\" and checked.get(\"source_sha256\")==expected:\n subprocess.run([\"systemctl\",\"restart\",\"--no-block\",\"analyst-workspace@build.service\"],check=True,capture_output=True,text=True,timeout=15)\n print(\"REDESIGN_BUILD_STARTED=\"+json.dumps({\"source_sha256\":expected}),flush=True)\nRUNUSER=shutil.which(\"runuser\");assert RUNUSER\nconfig={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n k,v=line.split(\"=\",1);assert k not in config\n config[k]=json.loads(v) if v.startswith('\"') else v\nconfig.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nPROBE=\"\\\"\\\"\\\"Aggregate-only discovery diagnosis; read-only production snapshot, no network.\\\"\\\"\\\"\\nimport sys\\nsys.dont_write_bytecode = True\\n\\nimport ast\\nfrom collections import Counter\\nfrom contextlib import closing\\nfrom dataclasses import asdict\\nfrom decimal import Decimal\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport pwd\\nimport re\\nimport sqlite3\\nimport time\\n\\nBACKEND = Path(\\\"/opt/analyst-ai/backend\\\")\\nDATABASE = Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\nPUBLIC_CODE_MODULES = (\\n    \\\"autonomous_controller.py\\\", \\\"purchase_policy.py\\\", \\\"volume_purchases.py\\\",\\n    \\\"tinvest_portfolio.py\\\", \\\"portfolio_details.py\\\", \\\"volume_market.py\\\",\\n    \\\"volume_contract.py\\\", \\\"volume_jobs.py\\\", \\\"ai_jobs.py\\\",\\n    \\\"autonomous_ai.py\\\", \\\"ai_guarded_client.py\\\", \\\"ai_route_catalog.py\\\",\\n)\\nSTATES = {\\n    \\\"paused\\\", \\\"not_connected\\\", \\\"disabled\\\", \\\"collecting\\\", \\\"waiting\\\",\\n    \\\"attention\\\", \\\"current\\\", \\\"running\\\", \\\"blocked\\\", \\\"partial\\\", \\\"failed\\\",\\n    \\\"stale\\\", \\\"queued\\\", \\\"completed\\\", \\\"cancelled\\\", \\\"uncertain\\\", \\\"fallback\\\",\\n    \\\"skipped\\\", \\\"available\\\", \\\"unavailable\\\", \\\"passed\\\", \\\"unknown\\\",\\n}\\n\\n\\ndef deny_network(event, arguments):\\n    if event in {\\n        \\\"socket.connect\\\", \\\"socket.sendto\\\", \\\"socket.sendmsg\\\",\\n        \\\"socket.getaddrinfo\\\", \\\"socket.gethostbyname\\\", \\\"socket.gethostbyaddr\\\",\\n    }:\\n        raise RuntimeError(\\\"network_forbidden_in_discovery_probe\\\")\\n\\n\\nsys.addaudithook(deny_network)\\n\\n\\nclass SharedRead:\\n    \\\"\\\"\\\"Helpers may close their borrowed handle without ending the read snapshot.\\\"\\\"\\\"\\n    def __init__(self, connection):\\n        self.connection = connection\\n\\n    def execute(self, *args, **kwargs):\\n        return self.connection.execute(*args, **kwargs)\\n\\n    def close(self):\\n        pass\\n\\n\\ndef main():\\n    assert os.geteuid() == pwd.getpwnam(\\\"analyst-ai\\\").pw_uid\\n    import app\\n    import autonomous_ai\\n    import autonomous_controller as controller\\n\\n    assert Path(app.__file__).resolve().parent == BACKEND\\n    assert Path(controller.__file__).resolve().parent == BACKEND\\n    assert app.DATABASE_PATH.resolve() == DATABASE\\n    assert controller.backend is app and controller.state.backend is app\\n    assert controller.purchases.backend is app\\n    subject = os.environ[\\\"ANALYST_OWNER_TELEGRAM_SUB\\\"]\\n    assert subject\\n\\n    # Only strings already present in these public source files may be emitted\\n    # as diagnostic codes. Unknown stored/provider strings never enter stdout.\\n    public_codes = set(controller._MESSAGES)\\n    for filename in PUBLIC_CODE_MODULES:\\n        path = BACKEND / filename\\n        assert path.is_file() and not path.is_symlink()\\n        tree = ast.parse(path.read_text(encoding=\\\"utf-8\\\"))\\n        public_codes.update(\\n            node.value for node in ast.walk(tree)\\n            if isinstance(node, ast.Constant) and isinstance(node.value, str)\\n            and re.fullmatch(r\\\"[a-z][a-z0-9_]{0,79}\\\", node.value)\\n        )\\n    for axis in (\\\"position\\\", \\\"issuer\\\", \\\"group\\\", \\\"sector\\\", \\\"currency\\\"):\\n        public_codes.update((\\n            \\\"portfolio_\\\" + axis + \\\"_unknown\\\",\\n            \\\"candidate_\\\" + axis + \\\"_unverified\\\",\\n            axis + \\\"_limit_exceeded\\\",\\n        ))\\n\\n    def safe_code(value):\\n        return value if isinstance(value, str) and value in public_codes else \\\"unrecognized_code\\\"\\n\\n    def histogram(values):\\n        return dict(sorted(Counter(safe_code(value) for value in values).items()))\\n\\n    def safe_state(value):\\n        return value if isinstance(value, str) and value in STATES else \\\"unrecognized_state\\\"\\n\\n    def sql_histogram(connection, query, parameters, *, state=False):\\n        result = Counter()\\n        for row in connection.execute(query, parameters):\\n            key = safe_state(row[0]) if state else safe_code(row[0])\\n            result[key] += int(row[1])\\n        return dict(sorted(result.items()))\\n\\n    def epoch(value):\\n        try:\\n            return controller.timestamp(value).timestamp()\\n        except (ValueError, TypeError, OverflowError):\\n            return None\\n\\n    def freshness(value, at, seconds):\\n        observed = epoch(value)\\n        return {\\n            \\\"timestamp_valid\\\": observed is not None,\\n            \\\"not_future\\\": observed is not None and observed <= at,\\n            \\\"within_interval\\\": observed is not None and 0 <= at - observed < seconds,\\n        }\\n\\n    db = sqlite3.connect(DATABASE.as_uri() + \\\"?mode=ro\\\", uri=True, timeout=5)\\n    db.row_factory = sqlite3.Row\\n    db.execute(\\\"PRAGMA query_only=ON\\\")\\n    assert db.execute(\\\"PRAGMA query_only\\\").fetchone()[0] == 1\\n    db.execute(\\\"BEGIN\\\")\\n    original_connect = app.connect\\n    borrowed = SharedRead(db)\\n    app.connect = lambda: borrowed\\n    try:\\n        before = time.time()\\n        user = db.execute(\\n            \\\"SELECT id,tinvest_token_encrypted FROM users WHERE telegram_sub=?\\\",\\n            (subject,),\\n        ).fetchone()\\n        assert user is not None, \\\"owner_row_missing\\\"\\n        assert db.execute(\\\"SELECT COUNT(*) FROM users\\\").fetchone()[0] == 1\\n        assert db.execute(\\n            \\\"SELECT COUNT(*) FROM installation_owner WHERE singleton=1 AND telegram_sub=?\\\",\\n            (subject,),\\n        ).fetchone()[0] == 1\\n        owner = int(user[\\\"id\\\"])\\n        status = controller.status(user)\\n        decisions = controller.decisions(user)\\n        discovery = decisions.get(\\\"discovery\\\") or {}\\n        candidates = discovery.get(\\\"candidates\\\") or []\\n        active = controller.state.active_strategy(owner)\\n        currency = (active or {}).get(\\\"config\\\", {}).get(\\\"reserve\\\", {}).get(\\\"currency\\\", \\\"RUB\\\")\\n        snapshot = controller.state.saved_snapshot(user, currency)\\n        stored = db.execute(\\n            \\\"SELECT * FROM automation_discovery WHERE user_id=?\\\", (owner,)\\n        ).fetchone()\\n        try:\\n            revision = asdict(controller.purchases.research_store.read_revision(db))\\n        except controller.purchases.research_store.RevisionUnavailable:\\n            revision = None\\n\\n        refresh_states = sql_histogram(\\n            db, \\\"SELECT state,COUNT(*) FROM workspace_jobs \\\"\\n            \\\"WHERE user_id=? AND kind='refresh' GROUP BY state\\\", (owner,), state=True,\\n        )\\n        automatic_states = sql_histogram(\\n            db, \\\"SELECT state,COUNT(*) FROM workspace_jobs WHERE user_id=? \\\"\\n            \\\"AND request_id LIKE 'auto.full.%' GROUP BY state\\\", (owner,), state=True,\\n        )\\n        refresh_errors = sql_histogram(\\n            db, \\\"SELECT error_code,COUNT(*) FROM workspace_jobs WHERE user_id=? \\\"\\n            \\\"AND kind='refresh' AND error_code IS NOT NULL GROUP BY error_code\\\", (owner,),\\n        )\\n        latest_refresh = db.execute(\\n            \\\"SELECT state,error_code,updated_at FROM workspace_jobs \\\"\\n            \\\"WHERE user_id=? AND kind='refresh' ORDER BY created_at DESC,id DESC LIMIT 1\\\",\\n            (owner,),\\n        ).fetchone()\\n        analysis_states = sql_histogram(\\n            db, \\\"SELECT status,COUNT(*) FROM ai_work_jobs WHERE user_id=? GROUP BY status\\\",\\n            (owner,), state=True,\\n        )\\n        analysis_errors = sql_histogram(\\n            db, \\\"SELECT error_code,COUNT(*) FROM analysis_runs \\\"\\n            \\\"WHERE user_id=? AND error_code IS NOT NULL GROUP BY error_code\\\", (owner,),\\n        )\\n        event_kinds = sql_histogram(\\n            db, \\\"SELECT kind,COUNT(*) FROM automation_events WHERE user_id=? GROUP BY kind\\\",\\n            (owner,),\\n        )\\n        evidence_counts = {\\n            kind: db.execute(\\n                \\\"SELECT COUNT(*) FROM research_evidence_v1 WHERE kind=?\\\", (kind,)\\n            ).fetchone()[0]\\n            for kind in (\\\"issuer_identity\\\", \\\"rating\\\", \\\"statement\\\", \\\"total_returns\\\", \\\"news_event\\\")\\n        }\\n        observation_count = db.execute(\\n            \\\"SELECT COUNT(*) FROM automation_observations WHERE user_id=?\\\", (owner,)\\n        ).fetchone()[0]\\n        after = time.time()\\n\\n        current_snapshot_id = (snapshot or {}).get(\\\"snapshot_id\\\")\\n        active_version = (active or {}).get(\\\"version\\\")\\n        root_snapshot_matches = bool(\\n            current_snapshot_id and discovery.get(\\\"snapshot_id\\\") == current_snapshot_id\\n        )\\n        root_strategy_matches = bool(\\n            active and discovery.get(\\\"strategy_version\\\") == active_version\\n        )\\n        checks = [\\n            check for item in candidates for check in (item.get(\\\"checks\\\") or [])\\n            if isinstance(check, dict)\\n        ]\\n        expiry = [epoch(item.get(\\\"expires_at\\\")) for item in candidates]\\n        predicate_counts = {\\n            \\\"expiry_missing_or_invalid\\\": sum(value is None for value in expiry),\\n            \\\"expired_before_probe\\\": sum(value is not None and value <= before for value in expiry),\\n            \\\"unexpired_after_probe\\\": sum(value is not None and value > after for value in expiry),\\n            \\\"expired_during_probe\\\": sum(value is not None and before < value <= after for value in expiry),\\n            \\\"candidate_snapshot_matches\\\": sum(\\n                bool(current_snapshot_id and item.get(\\\"snapshot_id\\\") == current_snapshot_id)\\n                for item in candidates\\n            ),\\n            \\\"candidate_strategy_matches\\\": sum(\\n                bool(active and item.get(\\\"strategy_version\\\") == active_version)\\n                for item in candidates\\n            ),\\n            \\\"candidate_revision_matches\\\": sum(\\n                revision is not None and item.get(\\\"evidence_revision\\\") == revision\\n                for item in candidates\\n            ),\\n        }\\n        comparable = mismatches = 0\\n        for item, expires in zip(candidates, expiry):\\n            # Do not call a crossing of the expiry boundary a semantic mismatch.\\n            if expires is not None and before < expires <= after:\\n                continue\\n            expected = bool(\\n                active and current_snapshot_id and revision is not None\\n                and root_snapshot_matches and root_strategy_matches\\n                and item.get(\\\"snapshot_id\\\") == current_snapshot_id\\n                and item.get(\\\"strategy_version\\\") == active_version\\n                and item.get(\\\"evidence_revision\\\") == revision\\n                and expires is not None and expires > after\\n            )\\n            comparable += 1\\n            mismatches += item.get(\\\"evidence_current\\\") is not expected\\n\\n        sections = {}\\n        for name in (\\\"news\\\", \\\"calendar\\\"):\\n            section = (snapshot or {}).get(name)\\n            sections[name] = {\\n                \\\"present\\\": isinstance(section, dict),\\n                \\\"state\\\": safe_state(section.get(\\\"state\\\")) if isinstance(section, dict) else \\\"absent\\\",\\n                \\\"reason_code\\\": safe_code(section.get(\\\"reason\\\"))\\n                    if isinstance(section, dict) and section.get(\\\"reason\\\") is not None else None,\\n                \\\"source_count\\\": len(section.get(\\\"sources\\\") or []) if isinstance(section, dict) else 0,\\n            }\\n        coverage = discovery.get(\\\"coverage\\\") or {}\\n        report = {\\n            \\\"probe\\\": \\\"aggregate_discovery_read_only\\\",\\n            \\\"consistent_database_read_snapshot\\\": True,\\n            \\\"python_network_access_blocked\\\": True,\\n            \\\"state\\\": safe_state(status.get(\\\"state\\\")),\\n            \\\"broker_connected\\\": status.get(\\\"broker_connected\\\") is True,\\n            \\\"scheduler_enabled_in_loaded_configuration\\\":\\n                autonomous_ai.SCHEDULER_ENABLED is True and status.get(\\\"scheduler_enabled\\\") is True,\\n            \\\"automation_preference_enabled\\\": status.get(\\\"enabled\\\") is True,\\n            \\\"blocker_code_counts\\\": histogram(\\n                item.get(\\\"code\\\") for item in (status.get(\\\"blockers\\\") or [])\\n            ),\\n            \\\"execution_read_only\\\": all(\\n                value.get(\\\"execution\\\", {}).get(\\\"mode\\\") == \\\"read_only\\\"\\n                and value.get(\\\"execution\\\", {}).get(\\\"real_orders_enabled\\\") is False\\n                for value in (status, decisions)\\n            ),\\n            \\\"ai\\\": {\\n                \\\"configuration_available\\\": status.get(\\\"ai\\\", {}).get(\\\"available\\\") is True,\\n                \\\"reason_code\\\": safe_code(status.get(\\\"ai\\\", {}).get(\\\"reason\\\"))\\n                    if status.get(\\\"ai\\\", {}).get(\\\"reason\\\") is not None else None,\\n                \\\"external_processing_disabled\\\":\\n                    os.getenv(\\\"AI_EXTERNAL_PROCESSING_APPROVED\\\", \\\"false\\\").lower()\\n                    in {\\\"false\\\", \\\"0\\\", \\\"no\\\"},\\n                \\\"budgets_zero\\\": Decimal(os.getenv(\\\"AI_USER_DAILY_RUB\\\", \\\"0\\\")) == 0\\n                    and Decimal(os.getenv(\\\"AI_PROJECT_DAILY_RUB\\\", \\\"0\\\")) == 0,\\n            },\\n            \\\"collection\\\": {\\n                \\\"saved_snapshot_present\\\": snapshot is not None,\\n                \\\"snapshot_freshness_300_seconds\\\": freshness(\\n                    (snapshot or {}).get(\\\"as_of\\\"), after, 300),\\n                \\\"full_collection_freshness_900_seconds\\\": freshness(\\n                    (snapshot or {}).get(\\\"collection\\\", {}).get(\\\"finished_at\\\"),\\n                    after, controller.FULL_REFRESH_SECONDS),\\n                \\\"position_coverage_complete\\\":\\n                    (snapshot or {}).get(\\\"position_coverage\\\", {}).get(\\\"complete\\\") is True,\\n                \\\"refresh_job_state_counts\\\": refresh_states,\\n                \\\"automatic_refresh_job_state_counts\\\": automatic_states,\\n                \\\"refresh_error_code_counts\\\": refresh_errors,\\n                \\\"latest_refresh_state\\\":\\n                    safe_state(latest_refresh[\\\"state\\\"]) if latest_refresh else \\\"absent\\\",\\n                \\\"latest_refresh_has_error\\\":\\n                    latest_refresh[\\\"error_code\\\"] is not None if latest_refresh else None,\\n                \\\"initial_observation_count\\\": observation_count,\\n                \\\"source_sections\\\": sections,\\n            },\\n            \\\"analysis_job_state_counts\\\": analysis_states,\\n            \\\"analysis_error_code_counts\\\": analysis_errors,\\n            \\\"automation_event_kind_counts\\\": event_kinds,\\n            \\\"retained_research_evidence_count_by_kind\\\": evidence_counts,\\n            \\\"discovery\\\": {\\n                \\\"state\\\": safe_state(discovery.get(\\\"state\\\")),\\n                \\\"stored_result_present\\\": bool(stored and stored[\\\"result_json\\\"]),\\n                \\\"stored_connection_matches\\\":\\n                    bool(stored and stored[\\\"broker_key\\\"] == controller.state.broker_key(user)),\\n                \\\"active_strategy_present\\\": active is not None,\\n                \\\"root_snapshot_matches_current\\\": root_snapshot_matches,\\n                \\\"root_strategy_matches_current\\\": root_strategy_matches,\\n                \\\"research_revision_readable\\\": revision is not None,\\n                \\\"freshness_900_seconds\\\": freshness(\\n                    discovery.get(\\\"as_of\\\"), after, controller.DISCOVERY_INTERVAL_SECONDS),\\n                \\\"reason_code_counts\\\": histogram(\\n                    item.get(\\\"code\\\") for item in (discovery.get(\\\"reasons\\\") or [])\\n                ),\\n                \\\"coverage_counts\\\": {\\n                    key: coverage[key] for key in (\\\"scanned\\\", \\\"eligible\\\", \\\"reviewed\\\", \\\"constraint_checks_passed\\\")\\n                    if type(coverage.get(key)) is int and 0 <= coverage[key] <= 1000000\\n                },\\n                \\\"candidate_count\\\": len(candidates),\\n                \\\"constraints_passed_count\\\": sum(\\n                    item.get(\\\"constraints_passed\\\") is True for item in candidates),\\n                \\\"evidence_current_location\\\": \\\"each_candidate_computed_at_read\\\",\\n                \\\"evidence_current_field_present_count\\\": sum(\\n                    type(item.get(\\\"evidence_current\\\")) is bool for item in candidates),\\n                \\\"evidence_current_true_count\\\": sum(\\n                    item.get(\\\"evidence_current\\\") is True for item in candidates),\\n                \\\"evidence_current_false_count\\\": sum(\\n                    item.get(\\\"evidence_current\\\") is False for item in candidates),\\n                \\\"recommendation_complete_true_count\\\": sum(\\n                    item.get(\\\"recommendation_complete\\\") is True for item in candidates),\\n                \\\"missing_evidence_code_counts\\\": histogram(\\n                    code for item in candidates for code in (item.get(\\\"missing_evidence\\\") or [])\\n                ),\\n                \\\"check_code_counts\\\": histogram(item.get(\\\"code\\\") for item in checks),\\n                \\\"check_state_counts\\\": dict(sorted(Counter(\\n                    safe_state(item.get(\\\"state\\\")) for item in checks\\n                ).items())),\\n                \\\"currentness_predicate_counts\\\": predicate_counts,\\n                \\\"currentness_comparable_count\\\": comparable,\\n                \\\"currentness_semantic_mismatch_count\\\": mismatches,\\n                \\\"currentness_is_not_complete_recommendation\\\": True,\\n            },\\n        }\\n    finally:\\n        app.connect = original_connect\\n        db.rollback()\\n        db.close()\\n    print(\\\"REDESIGN_DISCOVERY_READONLY=\\\" + json.dumps(report, sort_keys=True), flush=True)\\n    return 0\\n\\n\\ntry:\\n    code = main()\\nexcept Exception as error:\\n    print(\\\"REDESIGN_DISCOVERY_READONLY=\\\" + json.dumps({\\n        \\\"probe\\\": \\\"aggregate_discovery_read_only\\\",\\n        \\\"error_type\\\": type(error).__name__,\\n    }), flush=True)\\n    code = 1\\n\\nraise SystemExit(code)\\n\"\np=subprocess.run([RUNUSER,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=PROBE,text=True,cwd=\"/opt/analyst-ai/backend\",env=config,capture_output=True,timeout=45)\nrows=[s for s in p.stdout.splitlines() if s.startswith(\"REDESIGN_DISCOVERY_READONLY=\")]\nassert len(rows)==1,\"discovery_receipt_missing\"\nprint(rows[0],flush=True)\nreport=json.loads(rows[0].split(\"=\",1)[1])\nout=state/\"discovery-redesign-result.json\";tmp=out.with_suffix(\".next\");tmp.write_text(json.dumps(report,indent=2)+\"\\n\");tmp.chmod(0o600);os.replace(tmp,out)\nassert p.returncode==0,\"discovery_probe_failed\"\n",timeout=150)
