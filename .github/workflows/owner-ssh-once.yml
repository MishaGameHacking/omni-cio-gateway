name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import subprocess\nresult=subprocess.run([\"/opt/analyst-ai/venv/bin/python\",\"-I\",\"-B\",\"-c\",\"import datetime,hashlib,importlib.util,json,os,subprocess,sys,time\\nfrom pathlib import Path\\nsys.dont_write_bytecode=True\\nROOT=Path(\\\"/root/analyst-owner-handoff\\\")\\nassert hashlib.sha256((ROOT/\\\"controller.py\\\").read_bytes()).hexdigest()==\\\"89cc6cbaea3e3cd292dbc5a514002ce06efa1a070deaef81c19586900491d65e\\\"\\nspec=importlib.util.spec_from_file_location(\\\"handoff\\\",ROOT/\\\"controller.py\\\")\\ncontroller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)\\nenrollment=controller.verify_sources()\\nstate,_=controller.read_json(ROOT/\\\"state.json\\\",private=True)\\nassert state[\\\"session_id\\\"]==\\\"dcbeaea9-5b49-4135-a8e2-65552db8fbd7\\\"\\nassert state[\\\"confirmation_ready_at_ns\\\"]==int(\\\"1792910121692220887\\\")\\nassert state[\\\"phase\\\"]==\\\"awaiting_confirmation\\\" and state[\\\"expires_at\\\"]>time.time()+20\\ncandidate=state[\\\"candidate\\\"];assert type(candidate) is dict and type(candidate[\\\"sub\\\"]) is str\\nassert not (ROOT/\\\"confirm.json\\\").exists() and not enrollment.installer.INPUT_CONFIG.exists()\\ndecision={\\\"kind\\\":\\\"administrator_review_after_human_owner_login\\\",\\\"decided_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"session_id\\\":state[\\\"session_id\\\"],\\\"confirmation_ready_at_ns\\\":state[\\\"confirmation_ready_at_ns\\\"],\\\"basis\\\":\\\"Owner reported completion with current Telegram-verified screenshot; administrator privately reviewed the signed identity and matched the previously explicitly confirmed owner account from 24 October. Existing authorization remains applicable; this is the current single-use flow only.\\\",\\\"candidate_sha256\\\":hashlib.sha256(json.dumps(candidate,sort_keys=True,separators=(\\\",\\\",\\\":\\\")).encode()).hexdigest(),\\\"verified_subject_from_oidc\\\":True,\\\"profile_hint_used_as_authentication\\\":False}\\ncontroller.save_json(ROOT/\\\"owner-review-decision.json\\\",decision)\\ncontroller.save_json(ROOT/\\\"confirm.json\\\",{\\\"session_id\\\":state[\\\"session_id\\\"],\\\"action\\\":\\\"confirm_verified_identity\\\"})\\ndeadline=time.monotonic()+45\\nwhile time.monotonic()<deadline:\\n current,_=controller.read_json(ROOT/\\\"state.json\\\",private=True)\\n props=subprocess.run([\\\"systemctl\\\",\\\"show\\\",\\\"analyst-owner-enrollment.service\\\",\\\"--property=ActiveState,MainPID,Result,ExecMainStatus\\\"],capture_output=True,text=True,check=True).stdout\\n unit=dict(line.split(\\\"=\\\",1) for line in props.splitlines() if \\\"=\\\" in line)\\n if current[\\\"phase\\\"]==\\\"bound\\\" and unit[\\\"ActiveState\\\"]==\\\"inactive\\\" and unit[\\\"MainPID\\\"]==\\\"0\\\":break\\n if current[\\\"phase\\\"] in (\\\"failed\\\",\\\"expired\\\",\\\"cancelled\\\"):raise RuntimeError(\\\"owner_confirmation_not_completed\\\")\\n time.sleep(0.1)\\nassert current[\\\"phase\\\"]==\\\"bound\\\" and current[\\\"owner_config_created\\\"] is True and current[\\\"caddy_restored\\\"] is True\\nassert unit[\\\"ActiveState\\\"]==\\\"inactive\\\" and unit[\\\"MainPID\\\"]==\\\"0\\\" and unit[\\\"ExecMainStatus\\\"]==\\\"0\\\"\\nowner=enrollment.installer.load_config();values=enrollment.installer.load_config(enrollment=True)\\nassert owner[\\\"ANALYST_OWNER_TELEGRAM_SUB\\\"]==candidate[\\\"sub\\\"]\\nassert all(owner[k]==values[k] for k in enrollment.installer.REQUIRED if k!=\\\"ANALYST_OWNER_TELEGRAM_SUB\\\")\\nassert not Path(\\\"/var/lib/analyst-ai\\\").exists() and not Path(\\\"/etc/analyst-ai/backend.env\\\").exists()\\nassert hashlib.sha256(Path(\\\"/etc/caddy/Caddyfile\\\").read_bytes()).hexdigest()==\\\"80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd\\\"\\nreceipt={\\\"phase\\\":\\\"bound\\\",\\\"server_id\\\":9415007,\\\"owner_config_created\\\":True,\\\"verified_identity_reviewed\\\":True,\\\"prior_owner_context_matched\\\":True,\\\"enrollment_completed_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\"caddy_restored\\\":True,\\\"controller_exited_successfully\\\":True,\\\"normal_backend_started\\\":False,\\\"database_created\\\":False}\\ncontroller.save_json(ROOT/\\\"owner-binding-receipt.json\\\",receipt)\\nprint(\\\"OWNER_BINDING_COMPLETED=\\\"+json.dumps(receipt),flush=True)\\n\"],timeout=70)\nraise SystemExit(result.returncode)\n",timeout=120)
          PY
