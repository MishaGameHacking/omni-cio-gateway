name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: write
concurrency:
  group: analyst-timeweb-auth-dependency-audit
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify live Telegram signing keys and installed server dependencies on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      expected={relative:hashlib.sha256(subprocess.check_output(["git","show","HEAD:"+relative])).hexdigest() for relative in (".github/scripts/native_input_evidence.py",".github/scripts/tests/test_native_input_evidence.py")}
                      script="import datetime,hashlib,json,pathlib,subprocess,sys\nimport httpx\nroot=pathlib.Path(\"/root\");source=root/\"analyst-ai-source\";work=root/\"analyst-owner-login-relay-20261024\";android=root/\"analyst-ai-android-690811a5\"\nsys.path.insert(0,str(source))\nfrom deploy import install_owner_backend as installer\nfrom backend.telegram_oidc import _signing_candidates,_rsa_public_key\nfrom cryptography.hazmat.primitives import serialization\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"trusted_origin_confirmed\":True,\"owner_bound\":installer.INPUT_CONFIG.exists(),\"android_runtime_passed\":False,\"certificate_retry_after_utc\":\"2026-10-24T13:02:52+00:00\"}\nvalues=installer.load_config(enrollment=True)\ninstaller.check_address(values)\nfiles=installer.source_files()\nassert all(hashlib.sha256(path.read_bytes()).digest()==hashlib.sha256((installer.INSTALL/\"backend\"/path.relative_to(source/\"backend\")).read_bytes()).digest() for path in files)\nreport[\"installed_backend_files_match_reviewed_source\"]=len(files)\nresult=subprocess.run([str(installer.INSTALL/\"venv/bin/python\"),\"-m\",\"pip\",\"check\"],capture_output=True,text=True,timeout=30)\nreport[\"production_dependency_check_exit\"]=result.returncode\nassert result.returncode==0,\"production_dependency_conflict\"\npinned=json.loads((installer.INSTALL/\"backend/telegram_jwks.json\").read_text())\ndef keys(document):\n    return {(item[\"kid\"],hashlib.sha256(_rsa_public_key(item).public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)).hexdigest()) for item in _signing_candidates(document)}\npinned_keys=keys(pinned);attempts=[];live_keys=set()\nfor attempt in range(3):\n    try:\n        with httpx.Client(timeout=httpx.Timeout(10,connect=5),verify=True,follow_redirects=False,trust_env=False) as client:\n            response=client.get(\"https://oauth.telegram.org/.well-known/jwks.json\")\n            assert response.status_code==200 and len(response.content)<=131072\n            live_keys=keys(response.json())\n        attempts.append({\"attempt\":attempt+1,\"success\":True});break\n    except Exception as error:attempts.append({\"attempt\":attempt+1,\"success\":False,\"error_type\":type(error).__name__})\nreport[\"jwks_fetches\"]=attempts\nreport[\"pinned_signing_keys\"]=len(pinned_keys);report[\"live_signing_keys\"]=len(live_keys);report[\"matching_signing_keys\"]=len(pinned_keys&live_keys);report[\"pinned_keys_current\"]=bool(live_keys) and pinned_keys<=live_keys\nharness={relative:hashlib.sha256((android/relative).read_bytes()).hexdigest() for relative in EXPECTED_HARNESS}\nassert harness==EXPECTED_HARNESS,\"android_diagnostics_backup_mismatch\"\nreport[\"android_diagnostic_file_sha256\"]=harness\nreport[\"android_working_diff_sha256\"]=hashlib.sha256(subprocess.check_output([\"git\",\"diff\",\"--binary\"],cwd=android)).hexdigest()\napk=root/\"analyst-ai-artifacts/690811a5a376181990a64f37d914c87eb6c919b7/Analyst-AI-0.11.0-preview-690811a5.apk\"\nreport[\"candidate_apk_sha256\"]=hashlib.file_digest(apk.open(\"rb\"),\"sha256\").hexdigest()\nassert report[\"candidate_apk_sha256\"]==\"71feb07dd0379a56ec25513194535a145bd5663dadc77611c50cdc442fccd27d\"\npath=work/\"auth-prerequisites.json\";path.write_text(json.dumps(report,indent=2)+\"\\n\");path.chmod(0o600)\nprint(\"TIMEWEB_AUTH_PREREQUISITES=\"+json.dumps(report),flush=True)\ndevelopment=root/\"analyst-ai-development-79be1821\"\nnote=\"F02/F23, 24.10.2026: OWNER прислал подтверждение нового Trusted Origin https://analyst-ai-2941515.twc1.net/ в BotFather (скриншот 15:22 МСК); этот шаг завершён. Частичная свежая установка на 9413105 остановилась до регистрации OWNER: enrollment_tls_probe_failed. Реальный журнал Caddy выявил HTTP 429 Let's Encrypt: общая квота 50 сертификатов на twc1.net за 168 часов, retry-after 2026-10-24 13:02:52 UTC (16:02:52 МСК). ZeroSSL также отказал на предварительной регистрации аккаунта. Дополнительные домены/серверы не покупались; настроена ограниченная повторная попытка после Retry-After. OWNER, backend.env, backend unit и пользовательская БД ещё не созданы. Подпись/JWKS и зависимости установленного backend проверены отдельно: \"+json.dumps({\"reviewed_files\":report[\"installed_backend_files_match_reviewed_source\"],\"pip_check\":report[\"production_dependency_check_exit\"],\"pinned_keys_current\":report[\"pinned_keys_current\"]},ensure_ascii=False)+\". APK не менялся; патч диагностики совпадает с резервной копией GitHub. Полный протокол root-private /root/analyst-owner-login-relay-20261024/auth-prerequisites.json. Эти проверки не подтверждают живой вход, работу ИИ или выпуск APK.\\n\"\nfor relative in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    path=development/relative;body=path.read_text();assert note not in body;path.write_text(body.rstrip()+\"\\n\\n\"+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=development,check=True,capture_output=True)\n"
                      script='EXPECTED_HARNESS='+repr(expected)+'\n'+script
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=180).decode()
                      print(output,end="",flush=True)
                      docs=json.loads(p.remote(command,"python3 -c "+shlex.quote("import json,pathlib\nroot=pathlib.Path(\"/root\");repo=root/\"analyst-ai-development-79be1821\"\nsecret=json.loads((root/\"analyst-ai-enrollment.json\").read_text())[\"TELEGRAM_CLIENT_SECRET\"]\nfiles={rel:(repo/rel).read_text() for rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\")}\nfiles.update({rel:(root/\"analyst-ai-android-690811a5\"/rel).read_text() for rel in (\".github/scripts/native_input_evidence.py\",\".github/scripts/tests/test_native_input_evidence.py\")})\nassert all(secret not in text and \"-----BEGIN OPENSSH PRIVATE KEY-----\" not in text and \"-----BEGIN PRIVATE KEY-----\" not in text for text in files.values())\nprint(json.dumps(files))\n"),timeout=30))
                      assert set(docs)=={"AGENTS.md","docs/MASTER_PLAN.md","docs/PLAN_STATUS.md",".github/scripts/native_input_evidence.py",".github/scripts/tests/test_native_input_evidence.py"}
                      def gh(method,path,body=None):
                          data=None if body is None else json.dumps(body).encode()
                          req=urllib.request.Request("https://api.github.com/repos/MishaGameHacking/omni-cio-gateway"+path,method=method,data=data,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              raw=response.read(4*1024*1024+1)
                          return json.loads(raw) if raw else {}
                      ref=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert ref["object"]["sha"]==os.environ["GITHUB_SHA"],"backup_ref_changed"
                      commit=gh("GET","/git/commits/"+ref["object"]["sha"])
                      tree=gh("POST","/git/trees",{"base_tree":commit["tree"]["sha"],"tree":[{"path":path,"mode":"100644","type":"blob","content":text} for path,text in docs.items()]})
                      backed=gh("POST","/git/commits",{"message":"Back up verified Telegram origin and actual HTTPS issuance blocker","tree":tree["sha"],"parents":[ref["object"]["sha"]]})
                      current=gh("GET","/git/ref/heads/codex/timeweb-owner-prepare-2026-10-23")
                      assert current["object"]["sha"]==ref["object"]["sha"],"backup_ref_changed"
                      gh("PATCH","/git/refs/heads/codex/timeweb-owner-prepare-2026-10-23",{"sha":backed["sha"],"force":False})
                      print("TIMEWEB_DOCUMENT_BACKUP="+json.dumps({"sha":backed["sha"],"tree":tree["sha"],"files":sorted(docs),"edited_on":"Timeweb 9413105"}),flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
