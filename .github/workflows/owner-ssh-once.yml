name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("PROBE=\"import sys\\nsys.dont_write_bytecode=True\\nimport json,os,pathlib,pwd,sqlite3\\nfrom contextlib import closing\\nfrom datetime import datetime,timezone\\nimport app,autonomous_controller as controller,portfolio_details as details,volume_market as market\\nassert os.geteuid()==pwd.getpwnam(\\\"analyst-ai\\\").pw_uid\\nassert app.DATABASE_PATH==pathlib.Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\nassert pathlib.Path(app.__file__).resolve().parent==pathlib.Path(\\\"/opt/analyst-ai/backend\\\")\\nassert market.READ_METHODS[\\\"order_book\\\"]==\\\"MarketDataService/GetOrderBook\\\"\\ndef readonly():\\n db=sqlite3.connect(app.DATABASE_PATH.as_uri()+\\\"?mode=ro\\\",uri=True);db.row_factory=sqlite3.Row;db.execute(\\\"PRAGMA query_only=ON\\\");return db\\napp.connect=readonly\\ntry:\\n with closing(readonly()) as db:\\n  user=db.execute(\\\"SELECT id,tinvest_token_encrypted FROM users WHERE telegram_sub=?\\\",(os.environ[\\\"ANALYST_OWNER_TELEGRAM_SUB\\\"],)).fetchone()\\n  assert user is not None and user[\\\"tinvest_token_encrypted\\\"]\\n  row=db.execute(\\\"SELECT result_json FROM automation_discovery WHERE user_id=?\\\",(int(user[\\\"id\\\"]),)).fetchone()\\n  candidates=json.loads(row[\\\"result_json\\\"])[\\\"candidates\\\"][:2]\\n controller.assert_enabled(int(user[\\\"id\\\"]))\\n results=[]\\n with details.BrokerReader(user) as reader:\\n  for candidate in candidates:\\n   uid=candidate[\\\"instrument_uid\\\"]\\n   book=market.broker_read(reader,\\\"order_book\\\",{\\\"instrumentId\\\":uid,\\\"depth\\\":1})\\n   value=book.get(\\\"isConsistent\\\")\\n   results.append({\\\"is_consistent_present\\\":\\\"isConsistent\\\" in book,\\\"is_consistent_is_true\\\":value is True,\\\"is_consistent_is_false\\\":value is False,\\\"instrument_identity_matches\\\":book.get(\\\"instrumentUid\\\")==uid,\\\"has_orderbook_timestamp\\\":isinstance(book.get(\\\"orderbookTs\\\"),str),\\\"timestamp_fresh_60s\\\":controller.purchases.policy.fresh(book.get(\\\"orderbookTs\\\"),datetime.now(timezone.utc),60),\\\"has_ask_rows\\\":bool(book.get(\\\"asks\\\")),\\\"has_bid_rows\\\":bool(book.get(\\\"bids\\\")),\\\"depth_one\\\":book.get(\\\"depth\\\")==1})\\n print(\\\"REDESIGN_UNARY_BOOK_SHAPE=\\\"+json.dumps({\\\"method\\\":\\\"MarketDataService/GetOrderBook\\\",\\\"responses\\\":results,\\\"only_public_market_data_requested\\\":True,\\\"financial_values_not_logged\\\":True,\\\"order_calls\\\":0}),flush=True)\\nexcept Exception as error:\\n print(\\\"REDESIGN_UNARY_BOOK_SHAPE=\\\"+json.dumps({\\\"error_type\\\":type(error).__name__}),flush=True)\\n raise SystemExit(1)\\n\"\nimport pathlib,json,subprocess,shutil,datetime,os\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nenv={}\nfor line in pathlib.Path(\"/etc/analyst-ai/backend.env\").read_text().splitlines():\n if not line or line.lstrip().startswith(\"#\"):continue\n key,value=line.split(\"=\",1);assert key not in env\n env[key]=json.loads(value) if value.startswith('\"') else value\nenv.update(PATH=\"/usr/bin:/bin\",LANG=\"C.UTF-8\",PYTHONDONTWRITEBYTECODE=\"1\")\nrunner=shutil.which(\"runuser\");assert runner\np=subprocess.run([runner,\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=PROBE,text=True,cwd=\"/opt/analyst-ai/backend\",env=env,capture_output=True,timeout=45)\nlines=[line for line in p.stdout.splitlines() if line.startswith(\"REDESIGN_UNARY_BOOK_SHAPE=\")];assert len(lines)==1\nvalue=json.loads(lines[0].split(\"=\",1)[1]);value[\"observed_at\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\nprint(\"REDESIGN_UNARY_BOOK_SHAPE=\"+json.dumps(value),flush=True);print(\"REDESIGN_UNARY_BOOK_SHAPE_EXIT=\"+str(p.returncode),flush=True)\ntarget=state/\"unary-book-shape-result.json\";target.write_text(json.dumps(value,indent=2)+\"\\n\");target.chmod(0o600)\n\nimport pathlib,json,subprocess,hashlib,datetime\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nunit=\"analyst-boot-evidence-38-20261025-v2.service\"\nr=subprocess.run([\"systemctl\",\"show\",unit,\"--property=ActiveState,SubState,Result,ExecMainStatus,MemoryCurrent,MemoryPeak,CPUUsageNSec\"],capture_output=True,text=True,timeout=10)\nprint(\"REDESIGN_BOOT_UNIT=\"+json.dumps(r.stdout),flush=True)\nmatches=sorted((state/\"diagnostics\").glob(\"boot-evidence-*\"))\nif not matches:\n print(\"REDESIGN_BOOT_PENDING=\"+json.dumps({\"reason\":\"diagnostic_directory_not_created\"}),flush=True);raise SystemExit(0)\ndirectory=matches[-1]\nassert directory.is_dir() and not directory.is_symlink()\nresult=json.loads((directory/\"result.json\").read_text())\nprint(\"REDESIGN_BOOT_RESULT=\"+json.dumps(result),flush=True)\ninfo=[]\nfor name in (\"samples.jsonl\",\"emulator.log\",\"guest-all.log\",\"guest-all.stderr.log\",\"emulator.stderr.log\",\"avd-config.ini\"):\n p=directory/name\n if p.is_file():\n  raw=p.read_bytes();info.append({\"name\":name,\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest()})\nprint(\"REDESIGN_BOOT_FILES=\"+json.dumps(info),flush=True)\nprint(\"REDESIGN_BOOT_DIRECTORY=\"+json.dumps(str(directory)),flush=True)\n",timeout=150)
          PY
