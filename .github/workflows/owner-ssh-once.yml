name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-owner-update-011-handoff
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Verify completed owner binding and live protected backend
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def read_dedicated():
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          dedicated=read_dedicated()
          assert dedicated["id"]==121673 and dedicated["project_id"]==2941515
          print("TIMEWEB_BUILDER_STATUS="+json.dumps({k:dedicated.get(k) for k in ("id","name","status","location","ip","autoinstall_ready")}),flush=True)
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      reference="fd01d2ac090103cf64557c97aeaf36bc290e2cec"
                      paths=subprocess.check_output(["git","ls-tree","-r","--name-only",reference],text=True).splitlines()
                      selected=[path for path in paths if (path.startswith("backend/") and pathlib.PurePosixPath(path).parent==pathlib.PurePosixPath("backend") and (path.endswith((".py",".json")) or path=="backend/requirements.txt")) or path in {"backend/certs/russian_trusted_root_ca.pem","deploy/install_owner_backend.py","deploy/enroll_owner.py","deploy/analyst-ai-owner.service"}]
                      expected={path:hashlib.sha256(subprocess.check_output(["git","show",reference+":"+path])).hexdigest() for path in selected}
                      assert len(expected)>30
                      script="import datetime,hashlib,hmac,json,pathlib,re,stat,subprocess,sys\nroot=pathlib.Path(\"/root\");source=root/\"analyst-ai-source\";work=root/\"analyst-owner-login-relay-renewed-20261024-1344\"\nfor relative,digest in EXPECTED.items():\n    path=source/relative\n    assert path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==digest,\"reviewed_source_changed\"\nsys.path.insert(0,str(source))\nfrom deploy import install_owner_backend as installer\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\nif (work/\"completion-status.json\").is_file():\n    state=json.loads((work/\"completion-status.json\").read_text())\n    report[\"completion\"]={k:state[k] for k in (\"phase\",\"bound\",\"installer_exit\",\"owner_config_exists\",\"local_backend_probe\",\"public_tls_backend_probe\",\"checked_at_utc\") if k in state}\nreport[\"owner_config_exists\"]=installer.INPUT_CONFIG.exists()\nreport[\"backend_env_exists\"]=(installer.CONFIG/\"backend.env\").exists()\nreport[\"backend_unit_exists\"]=installer.UNIT.exists()\nreport[\"caddy_active\"]=subprocess.run([\"systemctl\",\"is-active\",\"caddy\"],capture_output=True,text=True).stdout.strip()\nreport[\"backend_active\"]=subprocess.run([\"systemctl\",\"is-active\",\"analyst-ai-owner\"],capture_output=True,text=True).stdout.strip()\nif installer.INPUT_CONFIG.exists():\n    values=installer.load_config()\n    expected=json.loads((root/\"analyst-owner-login-relay-retry-20261024/verified-identity.json\").read_text())[\"sub\"]\n    report[\"owner_matches_fresh_verified_account\"]=hmac.compare_digest(values[\"ANALYST_OWNER_TELEGRAM_SUB\"],expected)\n    report[\"origin\"]=values[\"BACKEND_PUBLIC_URL\"]\n    report[\"local_health_and_auth_probe\"]=installer.probe()\n    report[\"tls_health_and_auth_probe\"]=installer.probe(\"analyst-ai-2941515.twc1.net\")\n    report[\"env_mode\"]=oct(stat.S_IMODE((installer.CONFIG/\"backend.env\").stat().st_mode)) if report[\"backend_env_exists\"] else None\n    props=subprocess.run([\"systemctl\",\"show\",\"analyst-ai-owner\",\"-p\",\"MainPID\",\"-p\",\"ExecMainStatus\",\"-p\",\"NRestarts\",\"-p\",\"MemoryCurrent\",\"-p\",\"MemoryPeak\",\"-p\",\"User\"],capture_output=True,text=True)\n    report[\"backend_service\"]={k:v for line in props.stdout.splitlines() if \"=\" in line for k,v in [line.split(\"=\",1)]}\ncapture=subprocess.run([\"tmux\",\"-S\",str(work/\"tmux.sock\"),\"capture-pane\",\"-p\",\"-J\",\"-S\",\"-150\",\"-t\",\"owner:0.0\"],capture_output=True,text=True,timeout=10)\nif capture.returncode==0:\n    pane=capture.stdout\n    report[\"verified_identity_seen\"]=\"Verified Telegram identity (profile hints do not authorize access):\" in pane\n    report[\"installer_success_seen\"]=\"OWNER_BACKEND_INSTALL=local_health_auth_and_tls_verified_external_check_pending\" in pane\n    report[\"fixed_errors\"]=re.findall(r\"OWNER_(?:BACKEND_INSTALL|ENROLLMENT)_ERROR=[a-zA-Z0-9_]{1,120}\",pane)\nerror_log=work/\"completion-private.log\"\nreport[\"watcher_private_log_bytes\"]=error_log.stat().st_size if error_log.exists() else None\nif error_log.exists() and error_log.stat().st_size:\n    raw=error_log.read_text()\n    report[\"watcher_error_type\"]=raw.splitlines()[-1].split(\":\",1)[0]\n    report[\"watcher_error_lines\"]=re.findall(r'File \"[^\"]+\", line (\\d+)',raw)\ntarget=root/\"analyst-owner-live-verification-20261024.json\";target.write_text(json.dumps(report,indent=2)+\"\\n\");target.chmod(0o600)\nprint(\"TIMEWEB_OWNER_LIVE_VERIFICATION=\"+json.dumps(report),flush=True)\n"
                      script='EXPECTED='+repr(expected)+'\n'+script
                      output=p.remote(command,"/root/analyst-ai-development-venv/bin/python -u -c "+shlex.quote(script),timeout=1500).decode()
                      print(output,end="",flush=True)
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
