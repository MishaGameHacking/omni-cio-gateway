name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      target_public=p.remote(command,"python3 -c "+shlex.quote("import json,pathlib,subprocess\nw=pathlib.Path(\"/root/analyst-workspace-preparation-20261024\")\nk=w/\"target-access\"\nif not k.exists():subprocess.run([\"ssh-keygen\",\"-q\",\"-t\",\"ed25519\",\"-N\",\"\",\"-f\",str(k)],check=True)\nk.chmod(0o600)\nprint((w/\"target-access.pub\").read_text().strip())\n"),timeout=30).decode().strip()
                      assert target_public.startswith("ssh-ed25519 ")

                      def api(method,path,body=None):
                          req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
                          try:
                              with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                                  raw=r.read(4194305);assert len(raw)<=4194304
                                  return r.status,json.loads(raw) if raw else {}
                          except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
                      status,inventory=api("GET","/servers?limit=100&offset=0");assert status==200 and inventory["meta"]["total"]==len(inventory["servers"])
                      name="analyst-ai-workspace-20261024"
                      assert not any(x["name"]==name for x in inventory["servers"]),"target_exists_reconcile_no_duplicate"
                      status,catalog=api("GET","/configurator/servers");assert status==200
                      choices=[]
                      for offer in catalog["server_configurators"]:
                          if offer.get("location") not in ("nl-1","de-1","fi-1","pl-1") or offer.get("disk_type")!="nvme":continue
                          requirements=offer["requirements"]
                          if requirements.get("gpu_min") not in (None,0):continue
                          if any(not(requirements[k+"_min"]<=v<=requirements[k+"_max"] and (v-requirements[k+"_min"])%requirements[k+"_step"]==0) for k,v in (("cpu",2),("ram",6144),("disk",40960))):continue
                          prices=offer["prices"]
                          price=prices["cpu"]*2+prices["ram"]*6+prices["disk"]*40
                          if 0<price<=6160:choices.append((price,offer["id"],offer["location"]))
                      assert choices,"suitable_hourly_offer_unavailable"
                      choices.sort()
                      assert any(x["id"]==99 and x["version"]=="24.04" for x in p.ubuntu_images(p.read_catalog(token,"os")))
                      p.cloud.generate_key(folder/"target-host")
                      host_public=(folder/"target-host.pub").read_text().strip()
                      config={"users":[{"name":"root","lock_passwd":True,"ssh_authorized_keys":[target_public]}],"ssh_pwauth":False,"disable_root":False,"ssh_deletekeys":True,"ssh_keys":{"ed25519_private":(folder/"target-host").read_text(),"ed25519_public":host_public},"ssh":{"emit_keys_to_console":False},"no_ssh_fingerprints":True,"runcmd":[["systemctl","restart","ssh"]]}
                      created=None
                      for price,cid,location in choices[:4]:
                          cfg={"configurator_id":cid,"cpu":2,"ram":6144,"disk":40960}
                          plan={"name":name,"configuration":cfg,"base_monthly_rub":price,"location":location,"host_public":host_public,"replacement_for":9413105,"role":"single permanent app/development/build server"}
                          storeplan="import json,os,pathlib,sys;os.umask(0o077);pathlib.Path('/root/analyst-workspace-preparation-20261024/target-plan.json').write_text(json.dumps(json.load(sys.stdin),indent=2)+'\\n')"
                          p.remote(command,"python3 -c "+shlex.quote(storeplan),json.dumps(plan).encode(),timeout=25)
                          print("WORKSPACE_TARGET_OFFER="+json.dumps(plan),flush=True)
                          status,answer=api("POST","/servers",{"name":name,"hostname":name,"comment":"Permanent single Analyst AI workspace; replaces VM9413105 after verified migration 2026-10-24","configuration":cfg,"os_id":99,"project_id":2941515,"cloud_init":"#cloud-config\n"+json.dumps(config)+"\n"})
                          if status in (200,201,202):
                              s=answer["server"];assert s["name"]==name and s["project_id"]==2941515
                              created={**plan,"id":s["id"],"ip":p.cloud.public_ipv4(s)}
                              break
                          print("WORKSPACE_TARGET_REJECTED="+json.dumps({"status":status,**answer}),flush=True)
                          assert status==409 and answer.get("error_code") in ("no_free_node","location_not_available","not_available"),"creation_denied_stop"
                      assert created is not None,"no_target_created"
                      storetarget="import json,os,pathlib,sys;os.umask(0o077);d=json.load(sys.stdin);w=pathlib.Path('/root/analyst-workspace-preparation-20261024');(w/'target.json').write_text(json.dumps(d,indent=2)+'\\n');(w/'target-known-hosts').write_text((d.get('ip') or '')+' '+d['host_public']+'\\n')"
                      p.remote(command,"python3 -c "+shlex.quote(storetarget),json.dumps(created).encode(),timeout=25)
                      print("WORKSPACE_TARGET_CREATED="+json.dumps(created),flush=True)
                      for _ in range(45):
                          status,answer=api("GET","/servers/"+str(created["id"]));assert status==200
                          s=answer["server"];ip=p.cloud.public_ipv4(s)
                          if s.get("status")=="on" and ip:
                              created["ip"]=ip
                              p.remote(command,"python3 -c "+shlex.quote(storetarget),json.dumps(created).encode(),timeout=25)
                              print("WORKSPACE_TARGET_ON="+json.dumps(created),flush=True);break
                          time.sleep(8)
                      else:raise RuntimeError("target_installing_do_not_create_another")

                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
