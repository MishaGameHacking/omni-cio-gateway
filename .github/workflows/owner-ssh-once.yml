name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-ai-diagnostic
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Diagnose the actual gateway authentication response on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          adopt.select_target(True)
          doc=p.read_resource(token,"servers")
          assert p.summarize("servers",doc)["complete"]
          observed=[s for s in doc["servers"] if s["id"]==9408159]
          assert len(observed)==1 and observed[0]["ram"]==3072 and observed[0]["cpu"]==1
          p.CONFIGURATION["ram"]=3072
          adopt.verified_target(token)
          with tempfile.TemporaryDirectory(prefix="analyst-build-monitor-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client")
              public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-monitor-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              identifier=key["id"]
              attached=False
              try:
                  access.request(token,"POST","/servers/9408159/ssh-keys",{"ssh_key_ids":[identifier]})
                  attached=True
                  command=p.ssh_command(folder,adopt.NEW_IP,adopt.NEW_HOST_KEY)
                  for attempt in range(12):
                      try:
                          p.remote(command,"test $(id -u) = 0",timeout=12)
                          break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,json,os,pathlib,re,ssl,stat,urllib.error,urllib.request\npath=pathlib.Path(\"/root/analyst-ai-gateway.json\")\ninfo=path.stat()\nassert not path.is_symlink() and stat.S_IMODE(info.st_mode)==0o600 and info.st_uid==0\nsaved=json.loads(path.read_text());key=saved[\"key\"]\nassert saved[\"id\"]==\"70ba4021-d7bd-4006-b93b-34fb0e9dfb14\" and saved[\"project_id\"]==2941515\nreport={\"id\":saved[\"id\"],\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"key_length\":len(key),\"key_contains_mask_char\":any(c in key for c in \"*•\"),\"key_contains_placeholder\":any(s in key.lower() for s in (\"redacted\",\"placeholder\",\"your_api\",\"masked\")),\"models_auth_verified\":False,\"paid_inference_called\":False}\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):raise RuntimeError(\"redirect_refused\")\nopener=urllib.request.build_opener(NoRedirect(),urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()))\nreq=urllib.request.Request(\"https://api.timeweb.ai/v1/models\",headers={\"Authorization\":\"Bearer \"+key,\"Accept\":\"application/json\",\"Accept-Encoding\":\"identity\"})\ntry:\n    with opener.open(req,timeout=30) as response:\n        raw=response.read(4*1024*1024+1);assert len(raw)<=4*1024*1024\n        doc=json.loads(raw)\n        assert isinstance(doc.get(\"data\"),list)\n        report.update({\"status\":response.status,\"models_auth_verified\":True,\"model_count\":len(doc[\"data\"]),\"yandex_models\":[r[\"id\"] for r in doc[\"data\"] if \"yandex\" in r.get(\"id\",\"\").lower()]})\n        catalog=pathlib.Path(\"/root/analyst-ai-gateway-models.json\")\n        assert not catalog.is_symlink()\n        descriptor=os.open(catalog,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\n        with os.fdopen(descriptor,\"w\") as f:f.write(json.dumps(doc))\nexcept urllib.error.HTTPError as error:\n    report[\"status\"]=error.code\n    raw=error.read(65536)\n    try:doc=json.loads(raw)\n    except Exception:doc={}\n    e=doc.get(\"error\",{})\n    if isinstance(e,dict):\n        report[\"error_fields\"]=sorted(e)\n        for field in (\"type\",\"code\"):\n            v=e.get(field)\n            if isinstance(v,str) and re.fullmatch(\"[A-Za-z0-9_]{1,80}\",v) and v!=key:report[\"error_\"+field]=v\n        msg=e.get(\"message\",\"\")\n    else:msg=e if isinstance(e,str) else \"\"\n    if not msg:msg=doc.get(\"detail\",doc.get(\"message\",\"\"))\n    if isinstance(msg,str):\n        clean=msg.replace(key,\"[credential omitted]\")\n        for segment in (key[:8],key[-8:]):\n            clean=clean.replace(segment,\"[credential fragment omitted]\")\n        clean=re.sub(r\"(?i)(Bearer|sk-)[A-Za-z0-9_. -]+\",\"[credential omitted]\",clean)\n        if len(clean)<=400:report[\"diagnostic\"]=clean\n    report[\"response_top_fields\"]=sorted(doc) if isinstance(doc,dict) else []\nexcept Exception as error:\n    reason=getattr(error,\"reason\",error)\n    report.update({\"transport_type\":type(error).__name__,\"reason_type\":type(reason).__name__,\"errno\":getattr(reason,\"errno\",None)})\nout=pathlib.Path(\"/root/analyst-ai-gateway-preflight.json\")\nassert not out.is_symlink()\ndescriptor=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\nwith os.fdopen(descriptor,\"w\") as f:f.write(json.dumps(report,indent=2)+\"\\n\")\nprint(\"TIMEWEB_APP_GATEWAY_DIAGNOSTIC=\"+json.dumps(report),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=60).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9408159/ssh-keys/"+str(identifier))
                  access.request(token,"DELETE","/ssh-keys/"+str(identifier))
                  print("TIMEWEB_MONITOR_KEY=removed",flush=True)
          req=urllib.request.Request("https://api.timeweb.cloud/api/v1/dedicated-servers/121673",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          with opener.open(req,timeout=30) as response:new=p.decode_response(response.read(4*1024*1024+1))["dedicated_server"]
          assert new["id"]==121673 and new["name"]=="analyst-ai-msk-20261024" and new["preset_id"]==6007 and new["location"]=="ru-3"
          print("MOSCOW_ORDER_CURRENT="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          
          PY
