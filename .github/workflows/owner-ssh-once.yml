name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read the dedicated server catalog and available Timeweb locations
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          balance=Decimal(str(get("/account/finances")["finances"]["balance"]))
          doc=get("/presets/dedicated-servers")
          offers=doc["dedicated_servers_presets"]
          assert isinstance(offers,list)
          ordered=sorted(offers,key=lambda x:Decimal(str(x["price"])))
          selected=[]
          for row in ordered[:12]:
              selected.append({**{k:row.get(k) for k in ("id","description","price","cpu","memory","disk","location","is_pre_installed","is_ipmi_enabled")},"monthly_credit_covered":balance>=Decimal(str(row["price"]))+200})
          print("TIMEWEB_DEDICATED_CANDIDATES="+json.dumps({"meta":doc.get("meta"),"offers":selected},ensure_ascii=False),flush=True)
          print("TIMEWEB_LOCATIONS="+json.dumps(get("/locations",2),ensure_ascii=False),flush=True)
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          print("TIMEWEB_REPLACEMENT_CURRENT_INVENTORY="+json.dumps([{k:s.get(k) for k in ("id","name","status","cpu","ram","location","availability_zone")} for s in servers["servers"]]),flush=True)
          PY
