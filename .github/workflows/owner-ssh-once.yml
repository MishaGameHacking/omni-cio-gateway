lue in mutations:\\\\n  changed=dict(st);changed[key]=value\\\\n  try:validate(changed,a,50)\\\\n  except Rejected:pass\\\\n  else:raise AssertionError(\\\\\\\"unsafe_confirmation_accepted\\\\\\\")\\\\n try:validate(st,a,100)\\\\n except Rejected:pass\\\\n else:raise AssertionError(\\\\\\\"expired_confirmation_accepted\\\\\\\")\\\\n print(json.dumps({\\\\\\\"same_identity_retry_tests\\\\\\\":9,\\\\\\\"passed\\\\\\\":True,\\\\\\\"owner_or_session_created\\\\\\\":False}))\\\\n return 0\\\\nif __name__==\\\\\\\"__main__\\\\\\\":\\\\n try:code=selftest() if sys.argv[1:]==[\\\\\\\"selftest\\\\\\\"] else run() if not sys.argv[1:] else 1\\\\n except BaseException:code=1\\\\n raise SystemExit(code)\\\\n\\\",\\\"backend_activate.py\\\":\\\"#!/usr/bin/env python3\\\\nfrom __future__ import annotations\\\\nimport fcntl, hashlib, http.client, importlib.util, json, os, pathlib, pwd, grp\\\\nimport re, secrets, signal, sqlite3, ssl, stat, subprocess, sys, time\\\\nsys.dont_write_bytecode = True\\\\nP = pathlib.Path\\\\nBASE = P('/root/analyst-owner-handoff')\\\\nSNAP = BASE / 'source'\\\\nINSTALL = P('/opt/analyst-ai')\\\\nCONFIG = P('/etc/analyst-ai')\\\\nENV = CONFIG / 'backend.env'\\\\nSTATE = P('/var/lib/analyst-ai')\\\\nUNIT = P('/etc/systemd/system/analyst-ai-owner.service')\\\\nSERVICE = 'analyst-ai-owner.service'\\\\nCADDY = P('/etc/caddy/Caddyfile')\\\\nBEFORE = BASE / 'Caddyfile.before'\\\\nRECEIPT = BASE / 'backend-activation.json'\\\\nHOST = 'analyst-ai-2941515.twc1.net'\\\\nORIGIN = 'https://' + HOST\\\\nBEFORE_SHA = '80e929665273b6782492cd06af2badf5d1076e0a109bc6dc5a6421d618ba4bfd'\\\\nAPK_SHA = '1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74'\\\\nAPK_BYTES = 29820366\\\\nEND = time.monotonic() + 110\\\\nUNIT_TEXT = '''[Unit]\\\\nDescription=Analyst AI single-owner backend\\\\nAfter=network-online.target\\\\nWants=network-online.target\\\\n\\\\n[Service]\\\\nType=simple\\\\nUser=analyst-ai\\\\nGroup=analyst-ai\\\\nWorkingDirectory=/opt/analyst-ai/backend\\\\nEnvironmentFile=/etc/analyst-ai/backend.env\\\\nEnvironment=PYTHONDONTWRITEBYTECODE=1\\\\nEnvironment=PYTHONUNBUFFERED=1\\\\nUnsetEnvironment=TIMEWEB_AI_TOKEN TIMEWEB_CLOUD_API_KEY TIMEWEB_CLOUD_TOKEN\\\\nExecStart=/opt/analyst-ai/venv/bin/uvicorn owner_app:create_app --factory --lifespan on --host 127.0.0.1 --port 8080 --workers 1 --no-access-log\\\\nRestart=on-failure\\\\nRestartSec=5\\\\nTimeoutStartSec=35\\\\nTimeoutStopSec=10\\\\nStateDirectory=analyst-ai\\\\nStateDirectoryMode=0700\\\\nUMask=0077\\\\nMemoryAccounting=true\\\\nMemoryHigh=512M\\\\nMemoryMax=768M\\\\nMemorySwapMax=128M\\\\nTasksMax=128\\\\nNoNewPrivileges=true\\\\nPrivateTmp=true\\\\nProtectHome=true\\\\nProtectSystem=strict\\\\nReadWritePaths=/var/lib/analyst-ai\\\\nRestrictSUIDSGID=true\\\\n\\\\n[Install]\\\\nWantedBy=multi-user.target\\\\n'''.encode()\\\\nPUBLIC_ENV = {\\\\n 'BACKEND_PUBLIC_URL': ORIGIN,\\\\n 'DATABASE_PATH': str(STATE / 'backend.db'),\\\\n 'APP_DEEP_LINK': 'analystai://auth',\\\\n 'TELEGRAM_REDIRECT_URI': ORIGIN + '/auth/telegram/callback',\\\\n 'ANDROID_RELEASE_DIR': '/srv/analyst-ai-ota/releases',\\\\n 'ANDROID_UPDATES_ENABLED': 'true',\\\\n 'ANALYSIS_SCHEDULER_ENABLED': 'false',\\\\n 'AI_EXTERNAL_PROCESSING_APPROVED': 'false',\\\\n 'AI_USER_DAILY_RUB': '0',\\\\n 'AI_PROJECT_DAILY_RUB': '0',\\\\n}\\\\nclass Halt(Exception): pass\\\\ndef need(value, code):\\\\n    if not value: raise Halt(code)\\\\ndef sha(data): return hashlib.sha256(data).hexdigest()\\\\ndef exists(path): return os.path.lexists(path)\\\\ndef remaining(limit):\\\\n    value = END - time.monotonic()\\\\n    need(value > 0, 'activation_deadline')\\\\n    return min(limit, value)\\\\ndef command(argv, limit=12, required=True):\\\\n    result = subprocess.run(argv, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\\\\n                            timeout=remaining(limit), check=False)\\\\n    if required: need(result.returncode == 0, 'command_failed')\\\\n    return result.returncode\\\\n\\\\ndef directory(path, uid=0, mode=None):\\\\n    s = path.lstat()\\\\n    need(stat.S_ISDIR(s.st_mode) and s.st_uid == uid and not s.st_mode & 0o022,\\\\n         'directory_not_trusted')\\\\n    if mode is not None: need(stat.S_IMODE(s.st_mode) == mode, 'directory_mode_invalid')\\\\n\\\\ndef read(path, private=False, maximum=4 * 1024 * 1024):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\\\n    with os.fdopen(fd, 'rb') as stream:\\\\n        s = os.fstat(stream.fileno())\\\\n        need(stat.S_ISREG(s.st_mode) and s.st_uid == 0 and s.st_nlink == 1\\\\n             and not s.st_mode & 0o022 and s.st_size <= maximum, 'file_not_trusted')\\\\n        if private: need(stat.S_IMODE(s.st_mode) == 0o600, 'private_file_mode_invalid')\\\\n        data = stream.read(maximum + 1)\\\\n    need(len(data) <= maximum, 'file_too_large')\\\\n    return data\\\\n\\\\ndef syncdir(path):\\\\n    fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\\\\n    try: os.fsync(fd)\\\\n    finally: os.close(fd)\\\\n\\\\ndef put(path, data, mode, exclusive=False, ownership=None):\\\\n    directory(path.parent)\\\\n    temporary = path.parent / ('.activation-' + secrets.token_hex(12))\\\\n    fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)\\\\n    try:\\\\n        with os.fdopen(fd, 'wb') as stream:\\\\n            if ownership is not None: os.fchown(stream.fileno(), *ownership)\\\\n            os.fchmod(stream.fileno(), mode)\\\\n            stream.write(data); stream.flush(); os.fsync(stream.fileno())\\\\n        if exclusive:\\\\n            os.link(temporary, path, follow_symlinks=False)\\\\n        else:\\\\n            if exists(path): read(path)\\\\n            os.replace(temporary, path)\\\\n        syncdir(path.parent)\\\\n    finally:\\\\n        temporary.unlink(missing_ok=True)\\\\n        syncdir(path.parent)\\\\n\\\\ndef save(record):\\\\n    put(RECEIPT, (json.dumps(record, sort_keys=True) + '\\\\\\\\n').encode(), 0o600)\\\\n\\\\ndef load_receipt():\\\\n    if not exists(RECEIPT): return None\\\\n    value = json.loads(read(RECEIPT, private=True, maximum=65536))\\\\n    need(isinstance(value, dict) and value.get('schema_version') == 1\\\\n         and value.get('operation') == 'owner_backend_activation_v1'\\\\n         and value.get('caddy_before_sha256') == BEFORE_SHA\\\\n         and value.get('unit_sha256') == sha(UNIT_TEXT), 'receipt_not_owned')\\\\n    return value\\\\n\\\\ndef caddy_target(before):\\\\n    need(sha(before) == BEFORE_SHA, 'baseline_hash_changed')\\\\n    text = before.decode('utf-8')\\\\n    pattern = (r'(?m)^[ \\\\\\\\t]*@public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*path /client/update-policy /client/apk/\\\\\\\\* /client/ready\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n[ \\\\\\\\t]*handle @public_updates \\\\\\\\{\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*reverse_proxy 127\\\\\\\\.0\\\\\\\\.0\\\\\\\\.1:8081\\\\\\\\n[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*handle \\\\\\\\{\\\\\\\\n[ \\\\\\\\t]*respond \\\\\\\"Application service is being restored\\\\\\\\.\\\\\\\" 503\\\\\\\\n'\\\\n       r'[ \\\\\\\\t]*\\\\\\\\}\\\\\\\\n\\\\\\\\}\\\\\\\\n?\\\\\\\\Z')\\\\n    match = re.search(pattern, text)\\\\n    need(match is not None and text.startswith(HOST + ' {\\\\\\\\n'), 'caddy_tail_unexpected')\\\\n    tail = '''    @public_updates {\\\\n        method GET HEAD\\\\n        path /client/update-policy /client/apk/*\\\\n    }\\\\n    handle @public_updates {\\\\n        reverse_proxy 127.0.0.1:8081\\\\n    }\\\\n    @owner_enrollment path /auth/telegram/owner-enrollment/callback\\\\n    handle @owner_enrollment {\\\\n        respond \\\\\\\"Owner enrollment is closed.\\\\\\\" 410\\\\n    }\\\\n    handle {\\\\n        reverse_proxy 127.0.0.1:8080\\\\n    }\\\\n}\\\\n'''\\\\n    prefix = text[:match.start()]\\\\n    need(prefix.count('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n') == 1, 'maintenance_header_unexpected')\\\\n    prefix = prefix.replace('\\\\\\\\theader Retry-After \\\\\\\"60\\\\\\\"\\\\\\\\n', '', 1)\\\\n    return ('{\\\\\\\\n    log default {\\\\\\\\n        output discard\\\\\\\\n    }\\\\\\\\n}\\\\\\\\n\\\\\\\\n'\\\\n            + prefix + tail).encode()\\\\n\\\\ndef validate_caddy(data):\\\\n    path = BASE / ('Caddyfile.activation-check-' + secrets.token_hex(8))\\\\n    put(path, data, 0o600, exclusive=True)\\\\n    try:\\\\n        command(['/usr/bin/caddy', 'validate', '--adapter', 'caddyfile', '--config', str(path)], 15)\\\\n    finally:\\\\n        path.unlink(missing_ok=True)\\\\n\\\\ndef replace_caddy(data, accepted):\\\\n    current = read(CADDY)\\\\n    need(sha(current) in accepted, 'caddy_changed_concurrently')\\\\n    info = CADDY.lstat()\\\\n    put(CADDY, data, stat.S_IMODE(info.st_mode), ownership=(info.st_uid, info.st_gid))\\\\n\\\\ndef common():\\\\n    need(os.geteuid() == 0, 'root_required')\\\\n    for path in (P('/root'), BASE, SNAP, SNAP / 'deploy', SNAP / 'backend',\\\\n                 INSTALL, INSTALL / 'backend', INSTALL / 'venv', INSTALL / 'venv/bin',\\\\n                 P('/etc'), P('/etc/caddy'), UNIT.parent, P('/var'), P('/var/lib')):\\\\n        directory(path)\\\\n    directory(BASE, mode=0o700)\\\\n    before = read(BEFORE, private=True)\\\\n    target = caddy_target(before)\\\\n    installer_path = SNAP / 'deploy/install_owner_backend.py'\\\\n    read(installer_path)\\\\n    spec = importlib.util.spec_from_file_location('activation_installer', installer_path)\\\\n    installer = importlib.util.module_from_spec(spec)\\\\n    spec.loader.exec_module(installer)\\\\n    account, group = pwd.getpwnam('analyst-ai'), grp.getgrnam('analyst-ai')\\\\n    need(account.pw_uid > 0 and group.gr_gid > 0 and account.pw_gid == group.gr_gid,\\\\n         'service_identity_invalid')\\\\n    paths = installer.source_files()\\\\n    for source in paths:\\\\n        destination = INSTALL / 'backend' / source.relative_to(SNAP / 'backend')\\\\n        directory(source.parent); directory(destination.parent)\\\\n        need(read(source) == read(destination), 'installed_source_mismatch')\\\\n    read(INSTALL / 'venv/bin/uvicorn')\\\\n    return installer, before, target, account.pw_uid, group.gr_gid, len(paths)\\\\n\\\\ndef http(path, *, public=False, method='GET', maximum=262144):\\\\n    timeout = remaining(4)\\\\n    connection = (http.client.HTTPSConnection(HOST, timeout=timeout,\\\\n                  context=ssl.create_default_context()) if public\\\\n                  else http.client.HTTPConnection('127.0.0.1', 8080, timeout=timeout))\\\\n    try:\\\\n        connection.request(method, path, headers={'Host': HOST, 'Connection': 'close'})\\\\n        response = connection.getresponse()\\\\n        data = response.read(maximum + 1)\\\\n        need(len(data) <= maximum, 'probe_response_too_large')\\\\n        return response.status, dict((k.lower(), v) for k, v in response.getheaders()), data\\\\n    finally:\\\\n        connection.close()\\\\n\\\\ndef healthy():\\\\n    try:\\\\n        code, _, data = http('/health', maximum=4096)\\\\n        return code == 200 and json.loads(data) == {'status': 'ok'}\\\\n    except (OSError, http.client.HTTPException, ValueError):\\\\n        return False\\\\n\\\\ndef probes(public=False):\\\\n    code, _, data = http('/health', public=public, maximum=4096)\\\\n    need(code == 200 and json.loads(data) == {'status': 'ok'}, 'health_failed')\\\\n    code, _, data = http('/client/update-policy?package_name=ru.omnicio.app.debug',\\\\n                         public=public, maximum=16384)\\\\n    policy = json.loads(data) if code == 200 else {}\\\\n    need(code == 200 and policy.get('package_name') == 'ru.omnicio.app.debug'\\\\n         and policy.get('version_code') == 37 and policy.get('minimum_version_code') == 37\\\\n         and policy.get('apk_sha256') == APK_SHA and policy.get('apk_bytes') == APK_BYTES,\\\\n         'ota_policy_failed')\\\\n    for path, method in (('/me', 'GET