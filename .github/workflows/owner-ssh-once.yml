name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("\nimport pathlib,os,pwd,stat,json,subprocess,hashlib,tempfile,shutil\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nuser=pwd.getpwnam(\"analyst-build\")\nexpected={\n\"app/src/main/java/ru/omnicio/app/ui/updates/MandatoryUpdateHost.kt\":\"b952240f0adc013df92833818db6bc8032d53a3e6092abf6fc2172a94eabe30d\",\n\"app/src/main/java/ru/omnicio/app/data/updates/UpdateInstaller.kt\":\"1d925a3960195546e5e7239a086bab06214ad4644beff3eaefd713d8ae8e2e8f\",\n\"app/src/main/java/ru/omnicio/app/ui/spectrum/RequiredUpdateScreen.kt\":\"4c515e5cc75d2598be2483bef11d2b96076d69f180eba4a9ed79821e6d295710\",\n\"app/build.gradle.kts\":\"b147c2169b748bba5201ae9f0c8a7dd8db13da8c0646d908eb59fe387ecc4b74\"}\nchanges={}\noriginals={}\nfor relative,digest in expected.items():\n    target=root/relative\n    assert target.is_file() and not target.is_symlink() and target.resolve().is_relative_to(root)\n    old=target.read_bytes();assert hashlib.sha256(old).hexdigest()==digest,\"source_changed:\"+relative\n    originals[relative]=old;changes[relative]=old.decode()\ndef replace_once(relative,old,new):\n    assert changes[relative].count(old)==1,\"anchor_mismatch:\"+relative\n    changes[relative]=changes[relative].replace(old,new,1)\nhost=\"app/src/main/java/ru/omnicio/app/ui/updates/MandatoryUpdateHost.kt\"\nreplace_once(host,\"    val active = rememberForeground(activity?.lifecycle)\\n\",\"    val active = rememberForeground(activity?.lifecycle)\\n    val foregroundNow by rememberUpdatedState(active)\\n\")\nstart=changes[host].index(\"    LaunchedEffect(active) {\")\nend=changes[host].index(\"    val permissionLauncher =\",start)\nchanges[host]=changes[host][:start]+\"    fun startUpdate(chosen: ReleaseDescriptor, automatic: Boolean = false) {\\n        val decision = chosen.decision(\\n            BuildConfig.APPLICATION_ID,\\n            BuildConfig.VERSION_CODE.toLong(),\\n            Build.VERSION.SDK_INT,\\n        )\\n        if (!processUpdateAttempts.claim(\\n                release = chosen,\\n                decision = decision,\\n                automatic = automatic,\\n                foreground = foregroundNow,\\n                permissionGranted = context.packageManager.canRequestPackageInstalls(),\\n                busy = busy,\\n                installationPending = UpdateInstaller.pending.value,\\n            )\\n        ) return\\n\\n        busy = true\\n        progressFlow.value = 0\\n        feedback = feedback.operationStarted()\\n        UpdateInstaller.statusText.value = null\\n        scope.launch {\\n            try {\\n                val apk = client.download(context, chosen) { progressFlow.value = it }\\n                check(client.current() == chosen) { \\\"Вышла более новая сборка. Повторите проверку.\\\" }\\n                UpdateInstaller.install(context, apk, chosen)\\n            } catch (cancelled: CancellationException) {\\n                throw cancelled\\n            } catch (failure: Exception) {\\n                feedback = feedback.operationFailed(\\n                    failure.message ?: \\\"Не удалось установить обновление. Повторите попытку.\\\",\\n                )\\n            } finally {\\n                busy = false\\n            }\\n        }\\n    }\\n\\n    LaunchedEffect(active, retry, serverBlocked) {\\n        if (!active) return@LaunchedEffect\\n        var pendingRecovered = false\\n        while (isActive) {\\n            checking = true\\n            try {\\n                // Recover existing sessions before any new automatic operation.\\n                if (!pendingRecovered) {\\n                    withContext(Dispatchers.IO) { UpdateInstaller.refreshPending(context) }\\n                    pendingRecovered = true\\n                }\\n                val verified = verifyPolicy(context, client)\\n                release = verified.release\\n                current = verified.current\\n                feedback = feedback.policyChecked()\\n                // Failed policy reads never reach this call; current lifecycle is checked inside.\\n                startUpdate(verified.release, automatic = true)\\n            } catch (cancelled: CancellationException) {\\n                throw cancelled\\n            } catch (_: Exception) {\\n                current = false\\n                feedback = feedback.policyChecked(\\n                    if (BackendConfig.isConfigured) {\\n                        \\\"Не удалось проверить версию на сервере. Повторим проверку автоматически.\\\"\\n                    } else {\\n                        BackendConfig.UNAVAILABLE_MESSAGE\\n                    },\\n                )\\n            } finally {\\n                checking = false\\n            }\\n            delay(60_000)\\n        }\\n    }\\n\"+\"\\n\"+changes[host][end:]\nreplace_once(\"app/src/main/java/ru/omnicio/app/data/updates/UpdateInstaller.kt\",\"/** Only called after an explicit Update tap and APK identity/signature validation. */\",\"/** Shared explicit and automatic update path with APK identity/signature validation. */\")\nreplace_once(\"app/src/main/java/ru/omnicio/app/ui/spectrum/RequiredUpdateScreen.kt\",\"APK загружается с московского сервера Analyst AI.\",\"APK загружается с сервера Analyst AI.\")\nreplace_once(\"app/build.gradle.kts\",\"versionCode = 36\",\"versionCode = 37\")\nreplace_once(\"app/build.gradle.kts\",'versionName = \"0.12.0\"','versionName = \"0.12.1\"')\nnewfiles={\n\"app/src/main/java/ru/omnicio/app/ui/updates/UpdateAttemptGate.kt\":\"package ru.omnicio.app.ui.updates\\n\\nimport ru.omnicio.app.data.updates.ReleaseDecision\\nimport ru.omnicio.app.data.updates.ReleaseDescriptor\\n\\n/** One automatic attempt per APK identity and process; explicit actions may retry. */\\ninternal class UpdateAttemptGate {\\n    private val attempted = mutableSetOf<ReleaseDescriptor>()\\n\\n    @Synchronized\\n    fun claim(\\n        release: ReleaseDescriptor,\\n        decision: ReleaseDecision,\\n        automatic: Boolean,\\n        foreground: Boolean,\\n        permissionGranted: Boolean,\\n        busy: Boolean,\\n        installationPending: Boolean,\\n    ): Boolean {\\n        if (decision != ReleaseDecision.UPDATE_REQUIRED ||\\n            !permissionGranted || busy || installationPending\\n        ) return false\\n        if (automatic && !foreground) return false\\n\\n        // Presentation changes must not trigger another install of the same APK.\\n        val identity = release.copy(notes = \\\"\\\")\\n        if (automatic && identity in attempted) return false\\n        attempted.add(identity)\\n        return true\\n    }\\n}\\n\\n// Survives Activity recreation. Persisted installer sessions are recovered before polling.\\ninternal val processUpdateAttempts = UpdateAttemptGate()\\n\",\n\"app/src/test/java/ru/omnicio/app/ui/updates/UpdateAttemptGateTest.kt\":\"package ru.omnicio.app.ui.updates\\n\\nimport kotlinx.coroutines.CoroutineStart\\nimport kotlinx.coroutines.awaitCancellation\\nimport kotlinx.coroutines.cancelAndJoin\\nimport kotlinx.coroutines.launch\\nimport kotlinx.coroutines.runBlocking\\nimport org.junit.Assert.assertFalse\\nimport org.junit.Assert.assertTrue\\nimport org.junit.Test\\nimport ru.omnicio.app.data.updates.ReleaseDecision\\nimport ru.omnicio.app.data.updates.ReleaseDescriptor\\n\\nclass UpdateAttemptGateTest {\\n    private val release = ReleaseDescriptor(\\n        packageName = \\\"ru.omnicio.app.debug\\\",\\n        versionCode = 37,\\n        versionName = \\\"0.12.1-preview\\\",\\n        sha256 = \\\"a\\\".repeat(64),\\n        bytes = 30_000_000,\\n        certificateSha256 = \\\"b\\\".repeat(64),\\n        minSdk = 37,\\n        notes = \\\"Automatic foreground updates\\\",\\n    )\\n\\n    private fun claim(\\n        gate: UpdateAttemptGate,\\n        candidate: ReleaseDescriptor = release,\\n        decision: ReleaseDecision = ReleaseDecision.UPDATE_REQUIRED,\\n        automatic: Boolean = true,\\n        foreground: Boolean = true,\\n        permissionGranted: Boolean = true,\\n        busy: Boolean = false,\\n        installationPending: Boolean = false,\\n    ): Boolean = gate.claim(\\n        release = candidate,\\n        decision = decision,\\n        automatic = automatic,\\n        foreground = foreground,\\n        permissionGranted = permissionGranted,\\n        busy = busy,\\n        installationPending = installationPending,\\n    )\\n\\n    @Test\\n    fun onlyAnUpdateRequiredDecisionCanStartAnAttempt() {\\n        val gate = UpdateAttemptGate()\\n        for (decision in ReleaseDecision.entries) {\\n            if (decision != ReleaseDecision.UPDATE_REQUIRED) {\\n                assertFalse(\\\"Unexpected start for $decision\\\", claim(gate, decision = decision))\\n            }\\n        }\\n        assertTrue(claim(gate))\\n    }\\n\\n    @Test\\n    fun missingPermissionDoesNotStartOrConsumeAnAttempt() {\\n        val gate = UpdateAttemptGate()\\n        assertFalse(claim(gate, permissionGranted = false))\\n        assertFalse(claim(gate, permissionGranted = false))\\n        assertTrue(claim(gate))\\n        assertFalse(claim(gate))\\n    }\\n\\n    @Test\\n    fun aBackgroundPolicyResultCannotStartOrConsumeAnAutomaticAttempt() {\\n        val gate = UpdateAttemptGate()\\n        assertFalse(claim(gate, foreground = false))\\n        assertTrue(claim(gate))\\n    }\\n\\n    @Test\\n    fun busyOrPendingInstallationDoesNotStartOrConsumeAnAttempt() {\\n        val gate = UpdateAttemptGate()\\n        assertFalse(claim(gate, busy = true))\\n        assertFalse(claim(gate, installationPending = true))\\n        assertTrue(claim(gate))\\n    }\\n\\n    @Test\\n    fun repeatedPollingAndNotesChangesDoNotRepeatTheSameApk() {\\n        val gate = UpdateAttemptGate()\\n        assertTrue(claim(gate))\\n        assertFalse(claim(gate, candidate = release.copy()))\\n        assertFalse(claim(gate, candidate = release.copy(notes = \\\"Corrected release notes\\\")))\\n    }\\n\\n    @Test\\n    fun aDifferentBinaryIdentityGetsItsOwnAutomaticAttempt() {\\n        val gate = UpdateAttemptGate()\\n        assertTrue(claim(gate))\\n        assertTrue(claim(gate, candidate = release.copy(sha256 = \\\"c\\\".repeat(64))))\\n        assertTrue(claim(gate, candidate = release.copy(versionCode = 38, versionName = \\\"0.12.2-preview\\\")))\\n        assertFalse(claim(gate))\\n    }\\n\\n    @Test\\n    fun explicitRetryCanRepeatAnAttemptAndStillSuppressesAutomaticPolling() {\\n        val gate = UpdateAttemptGate()\\n        assertTrue(claim(gate))\\n        assertFalse(claim(gate))\\n        assertTrue(claim(gate, automatic = false))\\n        assertTrue(claim(gate, automatic = false))\\n        assertFalse(claim(gate))\\n    }\\n\\n    @Test\\n    fun anExplicitFirstAttemptAlsoPreventsAnAutomaticRetry() {\\n        val gate = UpdateAttemptGate()\\n        assertTrue(claim(gate, automatic = false))\\n        assertFalse(claim(gate))\\n    }\\n\\n    @Test\\n    fun explicitRetryCannotBypassPermissionOrPendingInstallation() {\\n        val gate = UpdateAttemptGate()\\n        assertFalse(claim(gate, automatic = false, permissionGranted = false))\\n        assertFalse(claim(gate, automatic = false, installationPending = true))\\n        assertFalse(claim(gate, automatic = false, busy = true))\\n        assertTrue(claim(gate, automatic = false))\\n    }\\n\\n    @Test\\n    fun leavingAndReturningToForegroundDoesNotRepeatAnAttempt() {\\n        val gate = UpdateAttemptGate()\\n        assertTrue(claim(gate))\\n        assertFalse(claim(gate, foreground = false))\\n        assertFalse(claim(gate))\\n    }\\n\\n    @Test(timeout = 5000)\\n    fun cancellationDoesNotReleaseTheAutomaticClaim() = runBlocking {\\n        val gate = UpdateAttemptGate()\\n        val operation = launch(start = CoroutineStart.UNDISPATCHED) {\\n            assertTrue(claim(gate))\\n            awaitCancellation()\\n        }\\n        operation.cancelAndJoin()\\n        assertFalse(claim(gate))\\n        assertTrue(claim(gate, automatic = false))\\n    }\\n}\\n\"}\nfor relative,content in newfiles.items():\n    assert not (root/relative).exists() and not (root/relative).is_symlink(),\"new_file_conflict\"\n    changes[relative]=content\ncheckpoint=pathlib.Path(\"/var/lib/analyst-ai-build/ota-native-before-20261025\")\ncheckpoint.mkdir(mode=0o700,exist_ok=False)\nos.chown(checkpoint,user.pw_uid,user.pw_gid)\nfor relative,content in originals.items():\n    destination=checkpoint/relative\n    destination.parent.mkdir(parents=True,exist_ok=True)\n    destination.write_bytes(content)\nfor relative,content in changes.items():\n    destination=root/relative\n    destination.parent.mkdir(parents=True,exist_ok=True)\n    assert destination.parent.resolve().is_relative_to(root)\n    for parent in [destination.parent,*destination.parents]:\n        if parent==root:break\n        assert not parent.is_symlink()\n    descriptor,temp=tempfile.mkstemp(prefix=\".ota-\",dir=destination.parent)\n    with os.fdopen(descriptor,\"w\") as stream:stream.write(content);stream.flush();os.fsync(stream.fileno())\n    os.chmod(temp,0o644);os.chown(temp,user.pw_uid,user.pw_gid);os.replace(temp,destination)\nsubprocess.run([\"runuser\",\"-u\",\"analyst-build\",\"--\",\"git\",\"-C\",str(root),\"diff\",\"--check\"],check=True,timeout=30)\nprint(\"OTA_NATIVE_PATCH=\"+json.dumps({\"version_name\":\"0.12.1-preview\",\"version_code\":37,\"changed_files\":list(changes),\"compiled\":False,\"runtime_passed\":False}),flush=True)\nprint(\"OTA_COMPILER_TOOLS=\"+json.dumps({\"kotlinc\":shutil.which(\"kotlinc\"),\"opt_names\":[p.name for p in pathlib.Path(\"/opt\").iterdir()],\"home\":user.pw_dir}),flush=True)\nunit=\"analyst-boot-diagnostic-20261025t0501\"\nproperties=subprocess.check_output([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"Result\",\"-p\",\"MemoryCurrent\",\"-p\",\"MemoryPeak\",\"-p\",\"CPUUsageNSec\",\"-p\",\"ControlGroup\"],text=True)\nprint(\"OTA_BOOT_STATE=\"+json.dumps(properties.splitlines()),flush=True)\nfolders=sorted(pathlib.Path(\"/var/lib/analyst-ai-build/diagnostics\").glob(\"boot-*/result.json\"))\nif folders:\n    report=json.loads(folders[-1].read_text())\n    print(\"OTA_BOOT_REPORT=\"+json.dumps(report),flush=True)\n",timeout=180)
