name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import os,pathlib,subprocess,pwd,grp,hashlib,json,fcntl,shutil,urllib.request\nassert os.geteuid()==0\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\nunit=\"analyst-emulator-leaf37-4096.service\"\nfor name in (unit,\"analyst-workspace@runtime.service\",\"analyst-workspace@build.service\",\"analyst-workspace@check.service\"):\n    props=dict(x.split(\"=\",1) for x in subprocess.check_output([\"systemctl\",\"show\",name,\"-p\",\"MainPID\",\"-p\",\"ActiveState\"]).decode().splitlines())\n    assert props.get(\"MainPID\",\"0\")==\"0\",name+\"_still_running\"\nfor name in (\"analyst-ai-owner.service\",\"analyst-ai-updates.service\",\"caddy.service\"):\n    assert subprocess.check_output([\"systemctl\",\"is-active\",name]).strip()==b\"active\",name+\"_not_active\"\nfor port in (8080,8081):\n    with urllib.request.urlopen(\"http://127.0.0.1:\"+str(port)+\"/health\",timeout=10) as response:\n        assert response.status==200\nwith (state/\"workspace.lock\").open(\"a\") as lock:\n    fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n    before=shutil.disk_usage(root).free\n    subprocess.run([\"apt-get\",\"clean\"],check=True,timeout=60)\n    after=shutil.disk_usage(root).free\n    assert after>=10*1024**3,\"runtime_disk_capacity_guard_not_met\"\n    script=pathlib.Path(\"/usr/local/libexec/analyst-runtime-leaf37.py\")\n    script.parent.mkdir(parents=True,exist_ok=True)\n    assert not script.is_symlink()\n    content=\"#!/usr/bin/env python3\\n\\\"\\\"\\\"One real API37/4096 leaf run; never a full-matrix publication receipt.\\\"\\\"\\\"\\nimport datetime as dt\\nimport fcntl\\nimport hashlib\\nimport importlib.util\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport pwd\\nimport re\\nimport shutil\\nimport signal\\nimport subprocess\\nimport sys\\nimport time\\nimport traceback\\n\\nROOT = Path(\\\"/srv/analyst-ai/workspace\\\")\\nSTATE = Path(\\\"/var/lib/analyst-ai-build\\\")\\nSDK = Path(\\\"/opt/analyst-android-sdk\\\")\\nPYTHON = STATE / \\\"venv/bin/python\\\"\\nAPK = ROOT / \\\"app/build/outputs/apk/preview/app-preview.apk\\\"\\nPREVIOUS = STATE / \\\"previous-0.12.0.apk\\\"\\nUI = ROOT / \\\"app/build/outputs/apk/preview/ui-screens\\\"\\nEXPECTED = {\\n    \\\"source_sha256\\\": \\\"aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7\\\",\\n    \\\"apk_sha256\\\": \\\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\\\",\\n    \\\"previous_sha256\\\": \\\"c62c7bb9b2c0fd454ec00985f869f3f9fa3023ed555ced9b5e0ae2a107e7f8d2\\\",\\n}\\nLIMIT = 7200\\nINTERVAL = 10\\nif pwd.getpwuid(os.getuid()).pw_name != \\\"analyst-build\\\":\\n    raise RuntimeError(\\\"runner_requires_analyst_build\\\")\\nos.umask(0o027)\\nbase = STATE / \\\"diagnostics\\\"\\nif base.is_symlink():\\n    raise RuntimeError(\\\"diagnostics_directory_is_symlink\\\")\\nbase.mkdir(exist_ok=True)\\nrun = base / (\\\"leaf37-4096-\\\" + dt.datetime.now(dt.timezone.utc).strftime(\\\"%Y%m%dT%H%M%SZ\\\") + \\\"-\\\" + str(os.getpid()))\\nrun.mkdir(mode=0o750)\\nwork = run / \\\"leaf\\\"\\nlog_path = run / \\\"leaf.log\\\"\\nsample_path = run / \\\"samples.jsonl\\\"\\nrelative = next(line[3:] for line in Path(\\\"/proc/self/cgroup\\\").read_text().splitlines() if line.startswith(\\\"0::\\\"))\\nCG = (Path(\\\"/sys/fs/cgroup\\\") / relative.lstrip(\\\"/\\\")).resolve(strict=True)\\nif not CG.is_relative_to(\\\"/sys/fs/cgroup\\\") or not CG.name.endswith(\\\".service\\\"):\\n    raise RuntimeError(\\\"dedicated_systemd_service_cgroup_required\\\")\\nspec = importlib.util.spec_from_file_location(\\\"workspace_gate\\\", ROOT / \\\"deploy/timeweb_workspace.py\\\")\\nworkspace = importlib.util.module_from_spec(spec)\\nspec.loader.exec_module(workspace)\\ndef utc():\\n    return dt.datetime.now(dt.timezone.utc).isoformat()\\ndef digest(path):\\n    h = hashlib.sha256()\\n    with path.open(\\\"rb\\\") as stream:\\n        for block in iter(lambda: stream.read(1024 * 1024), b\\\"\\\"):\\n            h.update(block)\\n    return h.hexdigest()\\ndef identities():\\n    return {\\\"source_sha256\\\": workspace.source_hash(), \\\"apk_sha256\\\": digest(APK), \\\"previous_sha256\\\": digest(PREVIOUS)}\\ndef read(path):\\n    try:\\n        return path.read_text()[:65536].strip()\\n    except OSError as error:\\n        return {\\\"unavailable\\\": type(error).__name__}\\nCG_FILES = (\\\"cpu.stat\\\", \\\"cpu.max\\\", \\\"cpu.weight\\\", \\\"cpu.pressure\\\", \\\"memory.events\\\", \\\"memory.events.local\\\", \\\"memory.pressure\\\", \\\"memory.current\\\", \\\"memory.peak\\\", \\\"memory.high\\\", \\\"memory.max\\\", \\\"memory.swap.current\\\", \\\"memory.swap.peak\\\", \\\"memory.swap.max\\\", \\\"memory.stat\\\", \\\"io.stat\\\", \\\"io.pressure\\\", \\\"pids.current\\\")\\nstarted = time.monotonic()\\nsamples = sample_path.open(\\\"x\\\", encoding=\\\"utf-8\\\")\\nresult = {\\\"purpose\\\": \\\"api37_4096_full_leaf_diagnostic\\\", \\\"status\\\": \\\"preflight\\\", \\\"started_at\\\": utc(), \\\"expected\\\": EXPECTED, \\\"cgroup\\\": str(CG), \\\"log\\\": str(log_path), \\\"samples\\\": str(sample_path), \\\"work_dir\\\": str(work), \\\"shared_ui_directory\\\": str(UI), \\\"full_matrix_completed\\\": False, \\\"runtime_result_written\\\": False}\\nprocess = None\\nlock = None\\nstop_signal = None\\nlaunch_ns = None\\ndef interrupted(signum, _frame):\\n    global stop_signal\\n    stop_signal = signum\\nfor signum in (signal.SIGTERM, signal.SIGINT, signal.SIGHUP):\\n    signal.signal(signum, interrupted)\\ndef save_result():\\n    temp = run / \\\"result.next.json\\\"\\n    temp.write_text(json.dumps(result, indent=2) + \\\"\\\\n\\\")\\n    os.replace(temp, run / \\\"result.json\\\")\\ndef sample(phase):\\n    meminfo = Path(\\\"/proc/meminfo\\\").read_text().splitlines()\\n    vmstat = Path(\\\"/proc/vmstat\\\").read_text().splitlines()\\n    value = {\\n        \\\"at\\\": utc(), \\\"elapsed_seconds\\\": round(time.monotonic() - started, 3), \\\"phase\\\": phase,\\n        \\\"cgroup\\\": {name: read(CG / name) for name in CG_FILES},\\n        \\\"host_pressure\\\": {name: read(Path(\\\"/proc/pressure\\\") / name) for name in (\\\"cpu\\\", \\\"memory\\\", \\\"io\\\")},\\n        \\\"host_meminfo\\\": [line for line in meminfo if line.split(\\\":\\\", 1)[0] in {\\\"MemTotal\\\", \\\"MemAvailable\\\", \\\"SwapTotal\\\", \\\"SwapFree\\\", \\\"Dirty\\\", \\\"Writeback\\\"}],\\n        \\\"host_vmstat\\\": [line for line in vmstat if re.match(r\\\"^(pswpin|pswpout|pgfault|pgmajfault|pgscan\\\\S*|pgsteal\\\\S*|workingset_refault\\\\S*) \\\", line)],\\n        \\\"host_cpu\\\": [line for line in Path(\\\"/proc/stat\\\").read_text().splitlines() if re.match(r\\\"^cpu(?:\\\\d+)? \\\", line)],\\n        \\\"host_uptime\\\": read(Path(\\\"/proc/uptime\\\")),\\n    }\\n    samples.write(json.dumps(value, separators=(\\\",\\\", \\\":\\\")) + \\\"\\\\n\\\")\\n    samples.flush()\\ndef owned_group_members():\\n    if process is None:\\n        return []\\n    members = []\\n    for item in (CG / \\\"cgroup.procs\\\").read_text().split():\\n        pid = int(item)\\n        if pid == os.getpid():\\n            continue\\n        try:\\n            if os.getpgid(pid) == process.pid and os.getsid(pid) == process.pid:\\n                members.append(pid)\\n        except ProcessLookupError:\\n            pass\\n    return members\\ndef stop_owned_group():\\n    if process is None:\\n        return\\n    if owned_group_members():\\n        try:\\n            os.killpg(process.pid, signal.SIGTERM)\\n        except ProcessLookupError:\\n            pass\\n        deadline = time.monotonic() + 15\\n        while time.monotonic() < deadline and owned_group_members():\\n            process.poll()\\n            time.sleep(0.2)\\n        if owned_group_members():\\n            try:\\n                os.killpg(process.pid, signal.SIGKILL)\\n            except ProcessLookupError:\\n                pass\\n    process.wait(timeout=10)\\n    deadline = time.monotonic() + 5\\n    while time.monotonic() < deadline and owned_group_members():\\n        time.sleep(0.2)\\n    result[\\\"remaining_owned_group_members\\\"] = len(owned_group_members())\\n    if result[\\\"remaining_owned_group_members\\\"]:\\n        raise RuntimeError(\\\"owned_process_group_cleanup_incomplete\\\")\\ndef preserve_fresh_screens():\\n    if launch_ns is None or not UI.exists():\\n        return\\n    if UI.is_symlink():\\n        raise RuntimeError(\\\"ui_directory_is_symlink\\\")\\n    destination = run / \\\"ui-screens\\\"\\n    copied = []\\n    for path in sorted(UI.iterdir()):\\n        if path.suffix not in (\\\".png\\\", \\\".json\\\") or path.is_symlink():\\n            continue\\n        if not path.is_file() or path.stat().st_mtime_ns < launch_ns:\\n            continue\\n        destination.mkdir(exist_ok=True)\\n        shutil.copy2(path, destination / path.name)\\n        copied.append({\\\"file\\\": path.name, \\\"sha256\\\": digest(destination / path.name)})\\n    result[\\\"fresh_ui_files\\\"] = copied\\nprint(\\\"LEAF_MONITOR=\\\" + json.dumps({\\\"directory\\\": str(run), \\\"log\\\": str(log_path), \\\"samples\\\": str(sample_path), \\\"result\\\": str(run / \\\"result.json\\\")}), flush=True)\\ntry:\\n    sample(\\\"before\\\")\\n    lock = (STATE / \\\"workspace.lock\\\").open(\\\"a\\\")\\n    fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\\n    result[\\\"before\\\"] = identities()\\n    if result[\\\"before\\\"] != EXPECTED:\\n        raise RuntimeError(\\\"preflight_identity_mismatch\\\")\\n    workspace.require_capacity(\\\"runtime\\\")\\n    for stage in (\\\"check\\\", \\\"build\\\"):\\n        receipt = workspace.previous(stage, EXPECTED[\\\"source_sha256\\\"])\\n        if stage == \\\"build\\\" and receipt.get(\\\"apk_sha256\\\") != EXPECTED[\\\"apk_sha256\\\"]:\\n            raise RuntimeError(\\\"build_receipt_apk_mismatch\\\")\\n    icds = sorted(Path(\\\"/usr/share/vulkan/icd.d\\\").glob(\\\"lvp_icd*.json\\\"))\\n    if len(icds) != 1:\\n        raise RuntimeError(\\\"exactly_one_lavapipe_icd_required\\\")\\n    if stop_signal is not None:\\n        raise InterruptedError(\\\"cancelled_before_launch\\\")\\n    env = dict(os.environ)\\n    env.update({\\n        \\\"ANDROID_HOME\\\": str(SDK), \\\"ANDROID_SDK_ROOT\\\": str(SDK),\\n        \\\"ANDROID_I_WANT_MY_TCG\\\": \\\"yes\\\", \\\"RUN_PROFILE_UI_TESTS\\\": \\\"1\\\",\\n        \\\"VK_ICD_FILENAMES\\\": str(icds[0]), \\\"PYTHONUNBUFFERED\\\": \\\"1\\\",\\n        \\\"GRADLE_USER_HOME\\\": \\\"/var/cache/analyst-ai/gradle\\\",\\n        \\\"JAVA_HOME\\\": \\\"/usr/lib/jvm/java-17-openjdk-amd64\\\",\\n        \\\"TELEGRAM_CLIENT_ID\\\": \\\"123456\\\", \\\"TELEGRAM_CLIENT_SECRET\\\": \\\"test-only\\\",\\n        \\\"BACKEND_PUBLIC_URL\\\": \\\"https://example.invalid\\\",\\n        \\\"FERNET_KEY\\\": \\\"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\\\",\\n        \\\"ANALYSIS_SCHEDULER_ENABLED\\\": \\\"false\\\", \\\"AI_EXTERNAL_PROCESSING_APPROVED\\\": \\\"false\\\",\\n        \\\"DATABASE_PATH\\\": str(run / \\\"tests.sqlite3\\\")\\n    })\\n    command = [\\\"xvfb-run\\\", \\\"-a\\\", str(PYTHON), str(ROOT / \\\".github/scripts/test_apk_installation.py\\\"), \\\"--sdk\\\", str(SDK), \\\"--apk\\\", str(APK), \\\"--previous\\\", str(PREVIOUS), \\\"--api\\\", \\\"37\\\", \\\"--page-bytes\\\", \\\"4096\\\", \\\"--work-dir\\\", str(work)]\\n    result[\\\"status\\\"] = \\\"running\\\"\\n    save_result()\\n    launch_ns = time.time_ns()\\n    deadline = time.monotonic() + LIMIT\\n    next_sample = time.monotonic()\\n    with log_path.open(\\\"x\\\", encoding=\\\"utf-8\\\") as log:\\n        process = subprocess.Popen(command, cwd=ROOT, env=env, stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\\n        while True:\\n            now = time.monotonic()\\n            if stop_signal is not None:\\n                result[\\\"status\\\"] = \\\"cancelled\\\"\\n                result[\\\"signal\\\"] = stop_signal\\n                break\\n            if now >= deadline:\\n                result[\\\"status\\\"] = \\\"leaf_timeout\\\"\\n                break\\n            code = process.poll()\\n            if code is not None:\\n                result[\\\"status\\\"] = \\\"leaf_passed\\\" if code == 0 else \\\"leaf_failed\\\"\\n                break\\n            if now >= next_sample:\\n                sample(\\\"running\\\")\\n                next_sample = now + INTERVAL\\n            time.sleep(min(1.0, max(0.01, deadline - time.monotonic())))\\n        sample(\\\"before_cleanup\\\")\\n        stop_owned_group()\\n        log.flush()\\nexcept BaseException as error:\\n    result[\\\"status\\\"] = \\\"runner_failed\\\"\\n    result[\\\"error_type\\\"] = type(error).__name__\\n    result[\\\"error\\\"] = str(error)[:1000]\\n    (run / \\\"failure.txt\\\").write_text(traceback.format_exc())\\nfinally:\\n    try:\\n        stop_owned_group()\\n    except BaseException as error:\\n        result[\\\"status\\\"] = \\\"cleanup_failed\\\"\\n        result[\\\"cleanup_error\\\"] = type(error).__name__ + \\\": \\\" + str(error)[:300]\\n    if process is not None:\\n        result[\\\"leaf_returncode\\\"] = process.poll()\\n    try:\\n        result[\\\"after\\\"] = identities()\\n        result[\\\"identities_unchanged\\\"] = result[\\\"after\\\"] == EXPECTED\\n        if not result[\\\"identities_unchanged\\\"]:\\n            result[\\\"status\\\"] = \\\"identity_changed\\\"\\n    except BaseException as error:\\n        result[\\\"status\\\"] = \\\"identity_verification_failed\\\"\\n        result[\\\"after_error\\\"] = type(error).__name__ + \\\": \\\" + str(error)[:300]\\n    try:\\n        preserve_fresh_screens()\\n        sample(\\\"after_cleanup\\\")\\n    except BaseException as error:\\n        result[\\\"status\\\"] = \\\"evidence_preservation_failed\\\"\\n        result[\\\"evidence_error\\\"] = type(error).__name__ + \\\": \\\" + str(error)[:300]\\n    result[\\\"finished_at\\\"] = utc()\\n    result[\\\"elapsed_seconds\\\"] = round(time.monotonic() - started, 3)\\n    save_result()\\n    samples.close()\\n    if lock is not None:\\n        lock.close()\\n    print(\\\"LEAF_RESULT=\\\" + json.dumps(result), flush=True)\\nsys.exit(0 if result[\\\"status\\\"] == \\\"leaf_passed\\\" else 1)\\n\"\n    compile(content,str(script),\"exec\")\n    if script.exists():\n        assert script.read_text()==content,\"unexpected_existing_runner\"\n    else:\n        fd=os.open(script,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o755)\n        with os.fdopen(fd,\"w\") as stream:stream.write(content)\n    os.chown(script,0,0);script.chmod(0o755)\n    print(\"LEAF_PREPARED=\"+json.dumps({\"runner\":str(script),\"runner_sha256\":hashlib.sha256(script.read_bytes()).hexdigest(),\"free_before\":before,\"free_after\":after,\"apt_cache_bytes_freed\":after-before}),flush=True)\naccount=pwd.getpwnam(\"analyst-build\")\nassert account.pw_dir==str(state),\"build_account_home_changed\"\ngroup=grp.getgrgid(account.pw_gid).gr_name\ncmd=[\"systemd-run\",\"--unit\",unit,\"--description=Actual APK37 API37 4096 emulator validation\",\n\"--property=Type=exec\",\"--property=User=analyst-build\",\"--property=Group=\"+group,\n\"--property=WorkingDirectory=\"+str(root),\"--property=UMask=0027\",\n\"--property=MemoryAccounting=yes\",\"--property=CPUAccounting=yes\",\n\"--property=MemoryHigh=5033164800\",\"--property=MemoryMax=5452595200\",\"--property=MemorySwapMax=536870912\",\n\"--property=CPUWeight=20\",\"--property=Nice=10\",\"--property=TasksMax=512\",\n\"--property=KillMode=control-group\",\"--property=RuntimeMaxSec=7350\",\"--property=TimeoutStopSec=45\",\n\"--property=NoNewPrivileges=yes\",\"--setenv=PYTHONUNBUFFERED=1\",\"--setenv=JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64\",\nstr(state/\"venv/bin/python\"),\"-B\",str(script)]\nsubprocess.run(cmd,check=True,timeout=30)\nprint(\"LEAF_UNIT=\"+subprocess.check_output([\"systemctl\",\"show\",unit,\"-p\",\"ActiveState\",\"-p\",\"SubState\",\"-p\",\"MainPID\",\"-p\",\"MemoryHigh\",\"-p\",\"MemoryMax\",\"-p\",\"MemorySwapMax\",\"-p\",\"ControlGroup\"]).decode(),flush=True)\n",timeout=150)
          PY
