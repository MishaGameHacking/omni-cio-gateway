name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-spb-catalog
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Read current Saint Petersburg cloud offers without provisioning
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          def get(path):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          inventory=p.read_resource(token,"servers")
          assert p.summarize("servers",inventory)["complete"]
          print("SPB_SERVER_INVENTORY="+json.dumps([{k:r.get(k) for k in ("id","name","location","availability_zone","cpu","ram","disk","configurator_id","preset_id","status")} for r in inventory["servers"]]),flush=True)
          cfg=get("/configurator/servers")["server_configurators"]
          print("SPB_CONFIGURATORS="+json.dumps([r for r in cfg if r.get("location")=="ru-1"]),flush=True)
          presets=p.read_catalog(token,"presets")["server_presets"]
          rows=[r for r in presets if r.get("location")=="ru-1" and r.get("ram",0)<=4096 and r.get("cpu",0)<=2]
          print("SPB_PRESETS="+json.dumps(rows),flush=True)
          print("SPB_OS="+json.dumps([r for r in p.read_catalog(token,"os")["servers_os"] if r.get("id")==99]),flush=True)
          new=get("/dedicated-servers/121673")["dedicated_server"]
          print("MOSCOW_ORDER_CURRENT="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          
          PY
