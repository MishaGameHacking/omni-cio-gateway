name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-dns-replacement
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Replace only the verified A record after PATCH failed and release the verified unbound IP
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
          observed_status={}
          def request(method,path,data=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              with opener.open(req,timeout=30) as response:
                  observed_status[(method,path)]=response.status
                  raw=response.read(2*1024*1024+1)
                  return p.decode_response(raw) if raw else {}
          report={"server_id":9413105,"old_server_get_previously_forbidden":True,"old_server_deletion_verified":False}
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and p.cloud.public_ipv4(server)=="201.24.52.66"
          ips=request("GET","/floating-ips")
          assert ips["meta"]["total"]==len(ips["ips"])
          old=[r for r in ips["ips"] if r["id"]=="a0fc704a-bf26-440a-b55f-facd8db769df"]
          report["unused_ip_present"]=bool(old)
          if old:
              ip,=old
              assert ip["ip"]=="81.200.158.176" and ip.get("resource_id") is None,"unused_address_no_longer_free"
              try:
                  request("DELETE","/floating-ips/a0fc704a-bf26-440a-b55f-facd8db769df")
                  report["unused_ip_delete_http"]=observed_status[("DELETE","/floating-ips/a0fc704a-bf26-440a-b55f-facd8db769df")]
              except urllib.error.HTTPError as error:report["unused_ip_delete_http"]=error.code
              after=request("GET","/floating-ips");assert after["meta"]["total"]==len(after["ips"])
              report["unused_ip_present"]=any(r["id"]=="a0fc704a-bf26-440a-b55f-facd8db769df" for r in after["ips"])
          domain=p.domain_api(token,"GET")["domain"]
          assert domain["fqdn"]==p.HOST and domain["is_technical"] is True and domain["linked_ip"] is None
          path="/domains/"+p.HOST+"/dns-records"
          def records():
              data=request("GET",path);assert data["meta"]["total"]==len(data["dns_records"])
              return data["dns_records"]
          def addresses(rows):
              return [r for r in rows if r["type"] in ("A","AAAA","CNAME") and r.get("fqdn")==p.HOST]
          before=records();row,=addresses(before)
          assert row["id"]==95036473 and row["type"]=="A" and row["data"]["value"]=="201.34.146.244"
          preserved={r["id"]:json.dumps(r,sort_keys=True) for r in before if r["id"]!=95036473}
          try:
              request("POST",path,{"type":"A","subdomain":p.HOST,"value":"201.24.52.66","ttl":300})
              report["dns_create_http"]=observed_status[("POST",path)]
          except urllib.error.HTTPError as error:
              report["dns_create_http"]=error.code
              report["dns_create_error"]=p.cloud.error_details(error.read(2*1024*1024+1))
          for attempt in range(6):
              current=records()
              new=[r for r in addresses(current) if r["type"]=="A" and r["data"]["value"]=="201.24.52.66"]
              if new or report["dns_create_http"]>=400:break
              time.sleep(3)
          if len(new)==1:
              new_row,=new
              assert new_row["id"]!=95036473
              assert {r["id"]:json.dumps(r,sort_keys=True) for r in current if r["id"] not in (95036473,new_row["id"])}==preserved
              old_row,=[r for r in current if r["id"]==95036473]
              assert old_row["type"]=="A" and old_row["data"]["value"]=="201.34.146.244"
              try:
                  request("DELETE",path+"/95036473");report["old_dns_delete_http"]=observed_status[("DELETE",path+"/95036473")]
              except urllib.error.HTTPError as error:report["old_dns_delete_http"]=error.code
              current=records()
              assert {r["id"]:json.dumps(r,sort_keys=True) for r in current if r["id"] not in (95036473,new_row["id"])}==preserved
          current_addresses=addresses(current)
          report["address_records"]=[{"id":r["id"],"type":r["type"],"value":r["data"]["value"]} for r in current_addresses]
          report["dns_points_only_to_moscow"]=len(current_addresses)==1 and current_addresses[0]["type"]=="A" and current_addresses[0]["data"]["value"]=="201.24.52.66"
          print("MOSCOW_DNS_REPLACEMENT="+json.dumps(report),flush=True)
          
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,json,pathlib,socket,subprocess,sys,time\nroot=pathlib.Path(\"/root\");report=json.loads(sys.argv[1])\nreport[\"dns_observations\"]=[]\nfor attempt in range(7):\n    try:resolved=sorted({x[4][0] for x in socket.getaddrinfo(\"analyst-ai-2941515.twc1.net\",443,socket.AF_INET,socket.SOCK_STREAM)})\n    except OSError:resolved=[]\n    report[\"dns_observations\"].append({\"attempt\":attempt+1,\"addresses\":resolved})\n    if resolved==[\"201.24.52.66\"] or not report[\"dns_points_only_to_moscow\"]:break\n    if attempt<6:time.sleep(30)\nreport[\"dns_resolves_to_moscow\"]=report[\"dns_observations\"][-1][\"addresses\"]==[\"201.24.52.66\"]\nreport[\"checked_at_utc\"]=datetime.datetime.now(datetime.timezone.utc).isoformat()\nout=root/\"analyst-moscow-dns-replacement.json\";out.write_text(json.dumps(report,indent=2));out.chmod(0o600)\npath=root/\"analyst-moscow-handoff.json\";handoff=json.loads(path.read_text())\nhandoff[\"dns\"]=report\nhandoff[\"spare_empty_vm_cleanup\"][\"ip_present\"]=report[\"unused_ip_present\"]\nhandoff[\"spare_empty_vm_cleanup\"][\"ip_cleanup_http\"]=report.get(\"unused_ip_delete_http\")\npath.write_text(json.dumps(handoff,ensure_ascii=False,indent=2));path.chmod(0o600)\nrepo=root/\"analyst-ai-development-79be1821\"\nheading=\"## TIMEWEB 24.10.2026 — результат замены A-записи\"\nnote=heading+chr(10)+chr(10)+\"Обновление существующей DNS-записи через документированный PATCH v2 вернуло HTTP 500. Выполнена попытка замены через POST новой A-записи; удаление прежней записи разрешено только после подтверждения новой. Фактические HTTP-результаты: POST=\"+str(report.get(\"dns_create_http\"))+\", DELETE=\"+str(report.get(\"old_dns_delete_http\",\"не выполнялся\"))+\". Остальные DNS-записи сохранены. Только московский IP в DNS: \"+str(report[\"dns_points_only_to_moscow\"])+\"; резолвер московского сервера подтверждает новый IP: \"+str(report[\"dns_resolves_to_moscow\"])+\". Старый адрес 81.200.158.176 проверен как свободный (resource_id=null); его наличие после отдельного запроса освобождения: \"+str(report[\"unused_ip_present\"])+\". Проверка старой VM 9413003 ранее запрещена HTTP 403 и не повторялась; этот результат не подменяется подтверждением удаления VM. Backend ещё не запущен, привязка владельца и HTTPS остаются за штатной интерактивной установкой.\"+chr(10)\nfor rel in (\"AGENTS.md\",\"docs/MASTER_PLAN.md\",\"docs/PLAN_STATUS.md\"):\n    p=repo/rel;old=p.read_text();assert heading not in old\n    p.write_text(old.rstrip()+chr(10)+chr(10)+note)\nsubprocess.run([\"git\",\"diff\",\"--check\"],cwd=repo,check=True,capture_output=True)\nprint(\"MOSCOW_DNS_FINAL=\"+json.dumps(report),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script)+" "+shlex.quote(json.dumps(report)),timeout=300).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
