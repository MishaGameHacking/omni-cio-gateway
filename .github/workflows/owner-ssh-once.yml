\\"A workspace stage is already running\\\")\\n    subprocess.run([\\\"systemctl\\\",\\\"restart\\\",\\\"--no-block\\\",\\\"analyst-workspace@\\\"+command+\\\".service\\\"],check=True)\\n    print(\\\"Started \\\"+command+\\\" on this Timeweb server. Run analyst-workspace status for the measured result.\\\")\\nelif command==\\\"publish\\\":\\n    if os.geteuid()!=0:raise SystemExit(\\\"Run this administrative command as root\\\")\\n    subprocess.run([\\\"/opt/analyst-ai/venv/bin/python\\\",\\\"/srv/analyst-ai/workspace/deploy/publish_timeweb_workspace.py\\\"],check=True)\\nelse:raise SystemExit(\\\"Usage: analyst-workspace {status|check|build|runtime|publish}\\\")\\n\",\"docs/TIMEWEB_WORKSPACE.md\":\"# Timeweb: основное рабочее место Analyst AI\\n\\nВсе редактирование, проверки и сборки выполняются на единственном постоянном\\nсервере проекта. GitHub — резервная копия и ранее разрешенный SSH/API транспорт.\\nНе создавать отдельные серверы для сборки или временных проверок.\\n\\nОсновные исходники: /srv/analyst-ai/workspace. Все ветки и теги GitHub загружены.\\nСуществующие изменения Android сохранены. Не выполнять reset/clean поверх них.\\nПриложение остается строго портретным; package и прежняя подпись сохраняются.\\n\\nProduction: /opt/analyst-ai; конфигурация /etc/analyst-ai; данные и публичный\\nAPK-канал /var/lib/analyst-ai. Разработка не читает production backend.env.\\nBuild-пользователь analyst-build не имеет доступа к пользовательской БД и\\nproduction секретам. Его среда и отчеты: /var/lib/analyst-ai-build,\\nGradle cache: /var/cache/analyst-ai/gradle, SDK: /opt/analyst-android-sdk.\\n\\nКоманды администратора:\\n- analyst-workspace check — проверки Python/Node/backend на самом Timeweb.\\n- analyst-workspace build — все Android варианты, JVM, lint, подпись и APK.\\n- analyst-workspace runtime — полные API37 матрицы 4KB/16KB, затем общий отчет.\\n- analyst-workspace publish — публикация только проверенных текущих байтов\\n  через существующий backend.release_publication, с ростом versionCode.\\n- analyst-workspace status — фактическое состояние, память, место, отчеты.\\n\\nЭтапы запускаются последовательно в systemd под analyst-build, с ограничениями\\nCPU, RAM и доступа к файлам. APK не публикуется после одного assemble.\\nЗапуск этапа не означает прохождение: смотреть *-result.json и systemd status.\\nПубликация требует текущих успешных check/build/runtime и совпадающих SHA256.\\nНативный код изменяется на телефоне только после установки нового APK.\\n\\nНа 24.10.2026 остается сервер 9413105, Москва, 1CPU/1GB/15GB. Стоимость\\n1920 RUB/месяц с IPv4, почасово 2.62 RUB. API отказал в проверенных увеличениях\\nпамяти/CPU с no_free_node. Заказ 9414261 получил no_paid без IP и удален;\\nотсутствие в перечне и расчете стоимости подтверждено. Не создавать новые\\nзаказы без выяснения этого отказа и не возвращать удаленный заказ.\\nНа 1GB сборка и runtime намеренно останавливаются до запуска Gradle/emulator:\\nнехватка физической RAM — это незавершенная подготовка оборудования.\\n4GB достаточно для ранее проверенной сборки; для матрицы с 4GB guest требуется\\nпроверить основной сервер с 6GB RAM. Наличие тарифа не подтверждает KVM.\\nПересборка и новая публикация этим документом не объявляются выполненными.\\n\\nAPK 0.11.0-preview/35 уже доступен через существующий HTTPS канал.\\nУстановленная 0.10/34 содержит прежний удаленный origin: требуется одноразовый\\nпереход на APK с текущим origin. Текущий updater проверяет канал при активном\\nприложении, но начало установки требует кнопки обновления. Разрешение Android\\nна установку из этого приложения обязательно; PackageInstaller может вернуть\\nSTATUS_PENDING_USER_ACTION. Полностью автоматическая доставка и физический\\nтелефон не проверены. Android runtime ошибка курсора при font200 остается\\nоткрыта, AI credential не подключен. Не объявлять приложение полностью готовым.\\n\"}\nfor rel,content in files.items():\n    p=ROOT/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content);p.chmod(0o644)\n    if rel.endswith(\".py\"):compile(content,str(p),\"exec\")\n(STATE/\"runs\").mkdir(exist_ok=True)\nfor path in (ROOT,STATE,cache,pathlib.Path(\"/opt/analyst-android-sdk\")):run([\"chown\",\"-R\",\"analyst-build:analyst-build\",path])\nROOT.parent.chmod(0o755);ROOT.chmod(0o750)\nrun([\"git\",\"config\",\"--global\",\"--add\",\"safe.directory\",ROOT])\nrun([\"runuser\",\"-u\",\"analyst-build\",\"--\",STATE/\"venv/bin/python\",\"-m\",\"pip\",\"check\"])\ns=pathlib.Path(\"/etc/systemd/system/analyst-workspace@.service\");s.write_text(\"[Unit]\\nDescription=Analyst AI workspace stage %i on the permanent Timeweb server\\nAfter=network-online.target analyst-ai-owner.service\\nWants=network-online.target\\n\\n[Service]\\nType=oneshot\\nRemainAfterExit=yes\\nUser=analyst-build\\nGroup=analyst-build\\nWorkingDirectory=/srv/analyst-ai/workspace\\nExecStart=/var/lib/analyst-ai-build/venv/bin/python /srv/analyst-ai/workspace/deploy/timeweb_workspace.py %i\\nEnvironment=ANDROID_HOME=/opt/analyst-android-sdk\\nEnvironment=ANDROID_SDK_ROOT=/opt/analyst-android-sdk\\nEnvironment=JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64\\nEnvironment=GRADLE_USER_HOME=/var/cache/analyst-ai/gradle\\nEnvironment=PYTHONUNBUFFERED=1\\nUMask=0027\\nNice=10\\nCPUWeight=20\\nIOWeight=20\\nMemoryAccounting=yes\\nCPUAccounting=yes\\nMemoryHigh=384M\\nMemoryMax=448M\\nTasksMax=512\\nTimeoutStartSec=4h\\nTimeoutStopSec=45\\nKillMode=control-group\\nNoNewPrivileges=yes\\nPrivateTmp=yes\\nProtectHome=yes\\nProtectSystem=strict\\nReadWritePaths=/srv/analyst-ai/workspace /var/lib/analyst-ai-build /var/cache/analyst-ai /opt/analyst-android-sdk\\nRestrictSUIDSGID=yes\\nProtectKernelTunables=yes\\nProtectControlGroups=yes\\nRestrictAddressFamilies=AF_UNIX AF_INET AF_INET6\\n\")\nfor name,limit,high in ((\"build\",\"3500M\",\"3200M\"),(\"runtime\",\"5G\",\"4800M\")):\n    d=pathlib.Path(\"/etc/systemd/system/analyst-workspace@\"+name+\".service.d\");d.mkdir(exist_ok=True)\n    (d/\"resources.conf\").write_text(\"[Service]\\nMemoryHigh=\"+high+\"\\nMemoryMax=\"+limit+\"\\n\")\np=pathlib.Path(\"/usr/local/bin/analyst-workspace\");p.write_text(\"#!/usr/bin/env python3\\nimport json,os,pathlib,subprocess,sys\\ncommand=sys.argv[1] if len(sys.argv)==2 else \\\"status\\\"\\nif command==\\\"status\\\":\\n    subprocess.run([\\\"runuser\\\",\\\"-u\\\",\\\"analyst-build\\\",\\\"--\\\",\\\"/var/lib/analyst-ai-build/venv/bin/python\\\",\\\"/srv/analyst-ai/workspace/deploy/timeweb_workspace.py\\\",\\\"status\\\"],check=True)\\nelif command in (\\\"check\\\",\\\"build\\\",\\\"runtime\\\"):\\n    if os.geteuid()!=0:raise SystemExit(\\\"Run this administrative command as root\\\")\\n    states=subprocess.check_output([\\\"systemctl\\\",\\\"list-units\\\",\\\"analyst-workspace@*.service\\\",\\\"--state=activating\\\",\\\"--no-legend\\\"],text=True).strip()\\n    if states:raise SystemExit(\\\"A workspace stage is already running\\\")\\n    subprocess.run([\\\"systemctl\\\",\\\"restart\\\",\\\"--no-block\\\",\\\"analyst-workspace@\\\"+command+\\\".service\\\"],check=True)\\n    print(\\\"Started \\\"+command+\\\" on this Timeweb server. Run analyst-workspace status for the measured result.\\\")\\nelif command==\\\"publish\\\":\\n    if os.geteuid()!=0:raise SystemExit(\\\"Run this administrative command as root\\\")\\n    subprocess.run([\\\"/opt/analyst-ai/venv/bin/python\\\",\\\"/srv/analyst-ai/workspace/deploy/publish_timeweb_workspace.py\\\"],check=True)\\nelse:raise SystemExit(\\\"Usage: analyst-workspace {status|check|build|runtime|publish}\\\")\\n\");p.chmod(0o755)\nrun([\"systemctl\",\"daemon-reload\"])\nrun([\"systemd-analyze\",\"verify\",\"analyst-workspace@check.service\",\"analyst-workspace@build.service\",\"analyst-workspace@runtime.service\"])\nw=pathlib.Path(\"/root/analyst-workspace-preparation-20261024\")\nfor name in (\"target-access\",\"target-access.pub\",\"target-known-hosts\"):\n    (w/name).unlink(missing_ok=True)\n(w/\"target-cancelled.json\").write_text(json.dumps({\"id\":9414261,\"deleted\":True,\"delete_status\":204,\"absent_from_inventory\":True,\"absent_from_costs\":True}))\npackages={}\nfor package in (\"fastapi\",\"uvicorn\",\"httpx\",\"PyJWT\",\"cryptography\",\"tzdata\",\"pytest\"):\n    packages[package]=run([STATE/\"venv/bin/python\",\"-c\",\"import importlib.metadata;print(importlib.metadata.version(\"+repr(package)+\"))\"]).decode().strip()\nprint(\"WORKSPACE_INSTALLED=\"+json.dumps({\"workspace\":str(ROOT),\"build_user\":\"analyst-build\",\"dependencies\":packages,\"source_files_preserved\":True,\"signing_key_preserved\":True,\"one_at_a_time\":True,\"memory_build_min_mib\":3500,\"memory_runtime_min_mib\":5500}),flush=True)\nrun([\"systemctl\",\"restart\",\"--no-block\",\"analyst-workspace@check.service\"])\nprint(\"WORKSPACE_CHECK_STARTED=true\",flush=True)\nprint(\"BACKEND_STILL_ACTIVE=\"+run([\"systemctl\",\"is-active\",\"analyst-ai-owner\"]).decode().strip(),flush=True)\n"
