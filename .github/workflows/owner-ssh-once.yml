name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import glob,hashlib,json,os,pathlib,shlex,subprocess\nP=pathlib.Path;ROOT=P(\"/srv/analyst-ai/workspace\");SDK=P(\"/opt/analyst-android-sdk\");STATE=P(\"/var/lib/analyst-ai-build\")\ndef run(args,env=None,timeout=15):\n r=subprocess.run(args,capture_output=True,text=True,env=env,timeout=timeout,check=False);return {\"code\":r.returncode,\"stdout\":r.stdout,\"stderr\":r.stderr[:2000]}\nraw=run([\"systemctl\",\"show\",\"analyst-workspace@runtime.service\",\"--property=Environment\",\"--value\"])\nentries=shlex.split(raw[\"stdout\"]);allowed={\"LD_LIBRARY_PATH\",\"ANDROID_I_WANT_MY_TCG\",\"ANDROID_HOME\",\"ANDROID_SDK_ROOT\",\"ANDROID_AVD_HOME\",\"JAVA_HOME\",\"VK_ICD_FILENAMES\",\"DISPLAY\"}\nenvironment={}\nfor value in entries:\n key,separator,item=value.partition(\"=\")\n if separator and key in allowed:environment[key]=item\nprint(\"RUNTIME_EFFECTIVE_ENV=\"+json.dumps(environment),flush=True)\nenv=dict(os.environ);env.update(environment)\nprint(\"RUNTIME_ENV_VERSION=\"+json.dumps(run([\"runuser\",\"-u\",\"analyst-build\",\"--\",str(SDK/\"emulator/emulator\"),\"-version\"],env=env)),flush=True)\nldd=run([\"ldd\",str(SDK/\"emulator/qemu/linux-x86_64/qemu-system-x86_64\")],env=env)\nprint(\"RUNTIME_MISSING_LIBRARIES=\"+json.dumps([line.strip() for line in ldd[\"stdout\"].splitlines() if \"not found\" in line]),flush=True)\nprint(\"RUNTIME_SDK_ENTRIES=\"+json.dumps(sorted(p.name for p in SDK.iterdir())),flush=True)\nfor relative in (\"emulator/source.properties\",\"system-images/android-37.0/google_apis/x86_64/source.properties\",\"system-images/android-37.0/google_apis_ps16k/x86_64/source.properties\"):\n p=SDK/relative\n if p.is_file():print(\"RUNTIME_SDK_PROPERTIES=\"+json.dumps({\"path\":relative,\"text\":p.read_text()}),flush=True)\nfor name in (\"check-result.json\",\"build-result.json\",\"runtime-result.json\"):\n p=STATE/name\n if p.is_file():print(\"RUNTIME_PREVIOUS_RESULT=\"+json.dumps({\"path\":str(p),\"result\":json.loads(p.read_text())}),flush=True)\nfor folder in (STATE/\"diagnostics\",STATE/\"candidates\"):\n if folder.is_dir():\n  values=[]\n  for path in sorted(folder.iterdir()):\n   values.append({\"path\":str(path),\"is_directory\":path.is_dir(),\"files\":sorted(x.name for x in path.iterdir())[:24] if path.is_dir() else []})\n  print(\"RUNTIME_ARTIFACT_INDEX=\"+json.dumps(values),flush=True)\nfor name in (\"previous-0.10.0.apk\",\"previous-0.12.0.apk\"):\n p=STATE/name\n if p.is_file():\n  h=hashlib.sha256(p.read_bytes()).hexdigest()\n  print(\"RUNTIME_PREVIOUS_APK=\"+json.dumps({\"path\":str(p),\"bytes\":p.stat().st_size,\"sha256\":h}),flush=True)\np=STATE/\"runs/20261024T210914Z-runtime/failure.log\"\nif p.is_file():print(\"RUNTIME_ORIGINAL_FAILURE=\"+json.dumps(p.read_text()[-5000:]),flush=True)\np=STATE/\"runs/20261024T210914Z-runtime/runtime-16384.log\"\nif p.is_file():print(\"RUNTIME_ORIGINAL_LOG_TAIL=\"+json.dumps(p.read_text()[-8000:]),flush=True)\nfor name,start,end in [(\".github/scripts/test_apk_installation.py\",460,595),(\".github/scripts/test_apk_installation.py\",650,830)]:\n p=ROOT/name;lines=p.read_text().splitlines()\n print(\"RUNTIME_HARNESS_SOURCE=\"+json.dumps({\"path\":name,\"first_line\":start+1,\"text\":\"\\n\".join(lines[start:end])}),flush=True)\n",timeout=130)
          PY
