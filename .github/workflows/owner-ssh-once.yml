name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("SOURCE=\"import json\\nimport re\\nimport sqlite3\\nfrom collections import Counter\\nfrom decimal import Decimal, InvalidOperation, localcontext\\nfrom pathlib import Path\\n\\n# Standalone aggregate-only diagnostic. No backend imports or network calls.\\nDATABASE_PATH = Path(\\\"/var/lib/analyst-ai/backend.db\\\")\\n\\n\\ndef obj(value):\\n    return value if isinstance(value, dict) else {}\\n\\n\\ndef amount(value):\\n    # Persisted workspace money is {amount: decimal-string, currency: code}.\\n    value = obj(value).get(\\\"amount\\\")\\n    if not isinstance(value, str) or len(value) > 120:\\n        return None\\n    try:\\n        number = Decimal(value)\\n        return number if (number.is_finite() and abs(number) <= Decimal(\\\"1e24\\\")\\n                          and -40 <= number.as_tuple().exponent <= 24) else None\\n    except InvalidOperation:\\n        return None\\n\\n\\ndef denomination(position):\\n    value = obj(position.get(\\\"metadata\\\")).get(\\\"instrument_currency\\\")\\n    if not value and position.get(\\\"instrument_type\\\") == \\\"cash\\\":\\n        uid = position.get(\\\"instrument_uid\\\")\\n        value = uid[5:] if isinstance(uid, str) and uid.startswith(\\\"cash:\\\") else None\\n    return value if isinstance(value, str) and re.fullmatch(\\\"[A-Z]{3}\\\", value) else None\\n\\n\\ndef audit():\\n    connection = sqlite3.connect(DATABASE_PATH.resolve().as_uri() + \\\"?mode=ro\\\", uri=True, timeout=3)\\n    connection.row_factory = sqlite3.Row\\n    try:\\n        connection.execute(\\\"PRAGMA query_only=ON\\\")\\n        connection.execute(\\\"BEGIN\\\")\\n        owners = connection.execute(\\n            \\\"SELECT u.id FROM users u JOIN installation_owner o \\\"\\n            \\\"ON o.telegram_sub=u.telegram_sub WHERE o.singleton=1\\\"\\n        ).fetchall()\\n        if len(owners) != 1:\\n            return {\\\"owner_row_unique\\\": False}\\n        user_id = owners[0][0]\\n        strategy = connection.execute(\\n            \\\"SELECT config_json FROM workspace_strategy_versions \\\"\\n            \\\"WHERE user_id=? ORDER BY version DESC LIMIT 1\\\", (user_id,)\\n        ).fetchone()\\n        if strategy is None:\\n            return {\\\"active_strategy_present\\\": False}\\n        currency = obj(json.loads(strategy[0]).get(\\\"reserve\\\")).get(\\\"currency\\\")\\n        saved = connection.execute(\\n            \\\"SELECT id,payload_json FROM workspace_snapshots WHERE user_id=? AND currency=?\\\",\\n            (user_id, currency),\\n        ).fetchone()\\n        if saved is None:\\n            return {\\\"strategy_snapshot_present\\\": False}\\n        snapshot = json.loads(saved[\\\"payload_json\\\"])\\n        positions = snapshot.get(\\\"positions\\\") or []\\n        counters, methods, types = Counter(), Counter(), Counter()\\n        seen, total = set(), Decimal(0)\\n        known_types = {\\\"cash\\\", \\\"share\\\", \\\"bond\\\", \\\"etf\\\", \\\"currency\\\", \\\"dfa\\\", \\\"sp\\\", \\\"futures\\\", \\\"option\\\", \\\"security\\\"}\\n        known_methods = {\\\"GetInstrumentBy\\\", \\\"Shares\\\", \\\"Bonds\\\", \\\"Etfs\\\", \\\"Currencies\\\", \\\"Futures\\\", \\\"Options\\\"}\\n        for position in positions:\\n            counters[\\\"positions\\\"] += 1\\n            kind = position.get(\\\"instrument_type\\\")\\n            types[kind if kind in known_types else \\\"missing_or_other\\\"] += 1\\n            metadata = obj(position.get(\\\"metadata\\\"))\\n            identity = obj(position.get(\\\"verified_identity\\\"))\\n            method = obj(metadata.get(\\\"source\\\")).get(\\\"method\\\")\\n            methods[method if method in known_methods else (\\\"missing\\\" if not method else \\\"other\\\")] += 1\\n            is_cash = kind == \\\"cash\\\"\\n            counters[\\\"cash_rows\\\" if is_cash else \\\"non_cash_rows\\\"] += 1\\n            if not is_cash:\\n                counters[\\\"non_cash_currency_unknown\\\"] += denomination(position) is None\\n                counters[\\\"non_cash_sector_missing\\\"] += not bool(metadata.get(\\\"sector\\\"))\\n                counters[\\\"non_cash_identity_missing\\\"] += not bool(identity)\\n                counters[\\\"non_cash_issuer_missing\\\"] += not bool(identity.get(\\\"issuer_id\\\"))\\n                counters[\\\"non_cash_group_missing\\\"] += not bool(identity.get(\\\"group_id\\\"))\\n                counters[\\\"generic_metadata_sector_missing\\\"] += method == \\\"GetInstrumentBy\\\" and not bool(metadata.get(\\\"sector\\\"))\\n                counters[\\\"no_source_currency_unknown\\\"] += not method and denomination(position) is None\\n            key = (position.get(\\\"account_id\\\"), position.get(\\\"instrument_uid\\\"))\\n            value = amount(position.get(\\\"value\\\"))\\n            bad_currency = obj(position.get(\\\"value\\\")).get(\\\"currency\\\") != snapshot.get(\\\"currency\\\")\\n            counters[\\\"value_missing_or_invalid\\\"] += value is None\\n            counters[\\\"value_currency_mismatch\\\"] += value is not None and bad_currency\\n            counters[\\\"value_negative\\\"] += value is not None and value < 0\\n            counters[\\\"duplicate_position_key\\\"] += key in seen\\n            if key in seen or value is None or value < 0 or bad_currency:\\n                continue\\n            seen.add(key)\\n            total += value\\n            counters[\\\"eligible_valued_rows\\\"] += 1\\n        capital = amount(obj(snapshot.get(\\\"capital\\\")).get(\\\"total\\\"))\\n        discovery = connection.execute(\\n            \\\"SELECT snapshot_id FROM automation_discovery WHERE user_id=?\\\", (user_id,)\\n        ).fetchone()\\n        collection = obj(snapshot.get(\\\"collection\\\"))\\n        # research_store helpers initialize tables; do not import or call them.\\n        evidence = {\\n            kind: connection.execute(\\n                \\\"SELECT COUNT(*) FROM research_evidence_v1 WHERE kind=?\\\", (kind,)\\n            ).fetchone()[0]\\n            for kind in (\\\"issuer_identity\\\", \\\"rating\\\", \\\"statement\\\", \\\"total_returns\\\", \\\"news_event\\\")\\n        }\\n        refresh = connection.execute(\\n            \\\"SELECT COUNT(*) FROM workspace_jobs WHERE user_id=? AND kind='refresh' AND state='completed'\\\",\\n            (user_id,),\\n        ).fetchone()[0]\\n        return {\\n            \\\"snapshot_present\\\": True,\\n            \\\"discovery_matches_current_snapshot\\\": bool(discovery and discovery[0] == saved[\\\"id\\\"]),\\n            \\\"snapshot_payload_id_matches_row\\\": snapshot.get(\\\"snapshot_id\\\") == saved[\\\"id\\\"],\\n            \\\"position_coverage_complete\\\": obj(snapshot.get(\\\"position_coverage\\\")).get(\\\"complete\\\") is True,\\n            \\\"completed_full_refresh_jobs\\\": refresh,\\n            \\\"collection_summary_present\\\": bool(collection),\\n            \\\"counts\\\": dict(counters),\\n            \\\"position_types\\\": dict(types),\\n            \\\"metadata_methods\\\": dict(methods),\\n            \\\"capital_amount_valid\\\": capital is not None,\\n            \\\"policy_sum_reconciled_within_cent\\\": capital is not None and abs(total - capital) <= Decimal(\\\"0.01\\\"),\\n            \\\"research_record_counts\\\": evidence,\\n        }\\n    finally:\\n        connection.rollback()\\n        connection.close()\\n\\n\\ntry:\\n    with localcontext() as context:\\n        context.prec = 80\\n        result = audit()\\n    print(json.dumps(result, sort_keys=True))\\nexcept Exception as error:\\n    # Never log traceback, SQL parameters, row contents or exception messages.\\n    print(json.dumps({\\\"probe_failed\\\": type(error).__name__}))\\n    raise SystemExit(1)\\n\"\nimport json,pathlib,subprocess,shutil,datetime,sqlite3\nstate=pathlib.Path(\"/var/lib/analyst-ai-build\")\ndeployment=json.loads((state/\"backend-redesign-result.json\").read_text())\nassert deployment[\"status\"]==\"deployed\" and deployment[\"source_sha256\"]==\"955661284edcb9cf5baa27d3bb1984275dd361857a58fb27b4905dffd87c6d1e\"\nr=subprocess.run([shutil.which(\"runuser\"),\"-u\",\"analyst-ai\",\"--\",\"/opt/analyst-ai/venv/bin/python\",\"-B\",\"-\"],input=SOURCE,text=True,capture_output=True,timeout=15,env={\"PATH\":\"/usr/bin:/bin\",\"LANG\":\"C.UTF-8\"})\nassert r.returncode==0,\"metadata_probe_failed\"\nresult=json.loads(r.stdout)\nnow=datetime.datetime.now(datetime.timezone.utc)\nreport={\"observed_at\":now.isoformat(),\"source_sha256\":deployment[\"source_sha256\"],\"probe_exit_code\":r.returncode,\"result\":result}\np=state/\"metadata-redesign-cash-latest.json\";p.write_text(json.dumps(report,indent=2)+\"\\n\");p.chmod(0o600)\nprint(\"REDESIGN_METADATA_LATEST=\"+json.dumps(report),flush=True)\ndb=sqlite3.connect(\"file:/var/lib/analyst-ai/backend.db?mode=ro\",uri=True,timeout=3)\ntry:\n db.execute(\"PRAGMA query_only=ON\");db.execute(\"BEGIN\")\n rows=db.execute(\"SELECT u.id FROM users u JOIN installation_owner o ON o.telegram_sub=u.telegram_sub WHERE o.singleton=1\").fetchall();assert len(rows)==1\n uid=rows[0][0]\n strategy=json.loads(db.execute(\"SELECT config_json FROM workspace_strategy_versions WHERE user_id=? ORDER BY version DESC LIMIT 1\",(uid,)).fetchone()[0])\n currency=strategy[\"reserve\"][\"currency\"]\n snap=json.loads(db.execute(\"SELECT payload_json FROM workspace_snapshots WHERE user_id=? AND currency=?\",(uid,currency)).fetchone()[0])\n finished=(snap.get(\"collection\") or {}).get(\"finished_at\")\n when=datetime.datetime.fromisoformat(finished.replace(\"Z\",\"+00:00\"))\n age=(now-when).total_seconds()\n states=dict(db.execute(\"SELECT state,COUNT(*) FROM workspace_jobs WHERE user_id=? AND kind='refresh' GROUP BY state\",(uid,)).fetchall())\n print(\"REDESIGN_COLLECTION_TIMING=\"+json.dumps({\"observed_at\":now.isoformat(),\"finished_at\":when.isoformat(),\"age_seconds\":round(age,3),\"next_full_collection_eligible_in_seconds\":max(0,round(900-age,3)),\"refresh_states\":states}),flush=True)\nfinally:db.rollback();db.close()\n",timeout=150)
          PY
