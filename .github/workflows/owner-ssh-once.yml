name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-network
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Diagnose the observed Telegram network failure on Timeweb and remove the unused empty VM
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["id"]==9413105 and server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and server["preset_id"]==6867 and p.cloud.public_ipv4(server)=="201.24.52.66"
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import datetime,hashlib,json,pathlib,socket,ssl,subprocess,time,urllib.request,urllib.error\nreport={\"server_id\":9413105,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"attempts\":[]}\ndef call(args,timeout=25):\n    p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)\n    return {\"exit\":p.returncode,\"stdout\":p.stdout[:8000],\"stderr\":p.stderr[:1500]}\nreport[\"route4\"]=call([\"ip\",\"-4\",\"route\",\"get\",\"149.154.167.99\"])\nreport[\"route6\"]=call([\"ip\",\"-6\",\"route\",\"get\",\"2001:67c:4e8:f004::9\"])\nreport[\"output_firewall\"]=call([\"iptables\",\"-S\",\"OUTPUT\"])\nfor host,path in ((\"oauth.telegram.org\",\"/.well-known/jwks.json\"),(\"pypi.org\",\"/simple/\"),(\"api.timeweb.cloud\",\"/api/v1/os/servers\")):\n    for attempt in range(3 if host==\"oauth.telegram.org\" else 1):\n        row={\"host\":host,\"attempt\":attempt+1}\n        started=time.monotonic()\n        try:\n            req=urllib.request.Request(\"https://\"+host+path,headers={\"Accept\":\"application/json\",\"Accept-Encoding\":\"identity\"})\n            opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()))\n            with opener.open(req,timeout=15) as response:\n                data=response.read(131073)\n                row.update({\"http_status\":response.status,\"bytes\":len(data),\"encoding\":response.headers.get(\"Content-Encoding\"),\"tls_verified\":True})\n                if host==\"oauth.telegram.org\":row[\"jwks_key_count\"]=len(json.loads(data).get(\"keys\",[]))\n        except Exception as error:\n            reason=getattr(error,\"reason\",error)\n            row.update({\"error\":type(error).__name__,\"errno\":getattr(reason,\"errno\",None),\"http_status\":getattr(error,\"code\",None)})\n        row[\"seconds\"]=round(time.monotonic()-started,3);report[\"attempts\"].append(row)\nfor family in (\"-4\",\"-6\"):\n    path=pathlib.Path(\"/root/analyst-public-jwks-\"+family[1:]+\".json\")\n    result=call([\"curl\",family,\"--proto\",\"=https\",\"--connect-timeout\",\"6\",\"--max-time\",\"18\",\"--silent\",\"--show-error\",\"--header\",\"Accept-Encoding: identity\",\"--output\",str(path),\"--write-out\",\"%{http_code} %{remote_ip} %{time_connect} %{time_appconnect} %{time_total}\",\"https://oauth.telegram.org/.well-known/jwks.json\"],timeout=22)\n    if path.exists():\n        try:result[\"jwks_key_count\"]=len(json.loads(path.read_bytes()).get(\"keys\",[]))\n        except Exception:result[\"jwks_json_valid\"]=False\n        path.unlink()\n    report[\"curl\"+family]=result\nout=pathlib.Path(\"/root/analyst-moscow-network.json\")\nout.write_text(json.dumps(report,indent=2));out.chmod(0o600)\nprint(\"MOSCOW_NETWORK_DIAGNOSTIC=\"+json.dumps(report),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=180).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          old=p.cloud.request(token,"GET","/api/v1/servers/9413003")["server"]
          assert old["id"]==9413003 and old["name"]=="analyst-ai-msk-app-20261024" and old["comment"]=="Analyst AI first cloud server relocation to Moscow 2026-10-24" and old["preset_id"]==6867 and old["location"]=="ru-3" and p.cloud.public_ipv4(old)=="81.200.158.176"
          try:
              p.cloud.delete_and_verify(token,9413003)
              print("MOSCOW_UNUSED_VM_REMOVED=9413003",flush=True)
              import replace_unreachable_vm as replacement
              replacement.remove_ip(token,"a0fc704a-bf26-440a-b55f-facd8db769df",9413003)
              print("MOSCOW_UNUSED_IP_REMOVED=a0fc704a-bf26-440a-b55f-facd8db769df",flush=True)
          except p.ProbeError as error:
              print("MOSCOW_UNUSED_CLEANUP_PENDING="+json.dumps({"server_id":9413003,"reason":str(error)}),flush=True)
          
          PY
