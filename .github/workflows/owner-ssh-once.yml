name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          
          def with_ams(remote_script, *, timeout=300):
              sid=9415007;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0"
              status,data=api("GET","/servers/"+str(sid));assert status==200
              server=data["server"]
              assert server["name"]=="Analyst AI PRO" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
              access.SERVER_ID=sid
              with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                  assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                  attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                      cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      result=subprocess.run([*cmd,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                      access.request(token,"DELETE","/ssh-keys/"+str(kid))
                      print("AMS_TEMP_KEY_REMOVED=true",flush=True)
          
          with_ams("import datetime,hashlib,json,os,shutil,subprocess,time\nfrom pathlib import Path\nROOT=Path(\"/srv/analyst-ai/workspace\");STATE=Path(\"/var/lib/analyst-ai-build\")\nassert Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip()==\"6a8036b9-2c1a-492b-845c-dec76cb41e0a\",\"unexpected_additional_reboot\"\ndef show(unit):\n    r=subprocess.run([\"systemctl\",\"show\",unit,\"--property=LoadState,ActiveState,SubState,MainPID,ControlPID\"],capture_output=True,text=True,check=True)\n    return dict(l.split(\"=\",1) for l in r.stdout.splitlines() if \"=\" in l)\nfor unit in (\"analyst-workspace@check.service\",\"analyst-workspace@build.service\",\"analyst-workspace@runtime.service\",\"analyst-ota-check-build-20261025.service\",\"analyst-ota-candidate37-preserve.service\"):\n    s=show(unit)\n    assert s.get(\"MainPID\",\"0\")==\"0\" and s.get(\"ControlPID\",\"0\")==\"0\" and s.get(\"SubState\") in (\"dead\",\"exited\",\"failed\"),(unit,s)\ncode=\"import runpy; m=runpy.run_path('/srv/analyst-ai/workspace/deploy/timeweb_workspace.py'); print(m['source_hash']())\"\ndigest=subprocess.check_output([\"runuser\",\"-u\",\"analyst-build\",\"--\",str(STATE/\"venv/bin/python\"),\"-B\",\"-c\",code],cwd=ROOT,text=True,timeout=120).strip()\nassert digest==\"aef6bb6dc89131b3c1412cc2b5454fc0aa6df68c6cae7e6abf82b379feb118a7\",\"sources_changed_after_reboot\"\nprevious=STATE/\"previous-0.12.0.apk\"\nassert hashlib.sha256(previous.read_bytes()).hexdigest()==\"c62c7bb9b2c0fd454ec00985f869f3f9fa3023ed555ced9b5e0ae2a107e7f8d2\"\nfolder=STATE/\"diagnostics/interrupted-build-20261025T0543\"\nfolder.mkdir(mode=0o700,exist_ok=False)\nfor name in (\"build-result.json\",\"diagnostics/ota-check-build-20261025.json\",\"diagnostics/ota-candidate-37.json\"):\n    shutil.copyfile(STATE/name,folder/Path(name).name)\nr=subprocess.run([\"journalctl\",\"-b\",\"-1\",\"--since\",\"2026-10-25 05:42:45\",\"--until\",\"2026-10-25 05:43:30\",\"-o\",\"json\",\"--no-pager\"],capture_output=True,text=True,timeout=30)\nevents=[]\nfor line in r.stdout.splitlines():\n    try:x=json.loads(line)\n    except ValueError:continue\n    msg=x.get(\"MESSAGE\",\"\")\n    if not isinstance(msg,str):continue\n    if any(k in msg.lower() for k in (\"reboot\",\"power key\",\"powering off\",\"shutting down\",\"shutdown scheduled\",\"requested by\",\"out of memory\",\"killed process\",\"panic\")):\n        events.append({\"message\":msg[:600],\"identifier\":x.get(\"SYSLOG_IDENTIFIER\"),\"unit\":x.get(\"_SYSTEMD_UNIT\"),\"timestamp\":x.get(\"__REALTIME_TIMESTAMP\")})\ninfo={\"utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"source_sha256\":digest,\"status\":\"resuming_after_host_reboot\",\"reboot_events\":events[-30:],\n\"cpu_virtualization_flags\":[v for v in (\"vmx\",\"svm\") if v in Path(\"/proc/cpuinfo\").read_text().split()],\"dev_kvm\":Path(\"/dev/kvm\").exists(),\"reboot_origin_confirmed\":False}\n(folder/\"interruption.json\").write_text(json.dumps(info,indent=2)+\"\\n\")\nprint(\"BUILD_INTERRUPTION=\"+json.dumps(info),flush=True)\ncommon=[\"--property=Type=exec\",\"--property=MemoryMax=134217728\",\"--property=TasksMax=32\",\"--property=TimeoutStopSec=30\",\"--property=KillMode=control-group\",\"--property=UMask=0077\",\"--property=StandardError=inherit\"]\nsubprocess.run([\"systemd-run\",\"--unit=analyst-ota-check-build-20261025\",*common,\"--property=RuntimeMaxSec=10800\",\"--property=StandardOutput=append:/var/lib/analyst-ai-build/diagnostics/ota-check-build-20261025.log\",\"/usr/bin/python3\",\"-B\",str(STATE/\"diagnostics/ota_check_build.py\")],check=True)\nsubprocess.run([\"systemd-run\",\"--unit=analyst-ota-candidate37-preserve\",*common,\"--property=RuntimeMaxSec=7800\",\"--property=StandardOutput=append:/var/lib/analyst-ai-build/diagnostics/ota-candidate37-preserve.log\",\"/usr/bin/python3\",\"-B\",str(STATE/\"diagnostics/ota_candidate_preserve.py\")],check=True)\nprint(\"OTA_PIPELINE_RESUMED=true\",flush=True)\n",timeout=180)
          PY
