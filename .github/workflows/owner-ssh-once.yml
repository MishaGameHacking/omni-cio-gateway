name: Prepare one Timeweb development server
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-delivery
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect and prepare the main Timeweb workspace
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def api(method,path,body=None):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                      raw=r.read(4194305);assert len(raw)<=4194304
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)
                      remote_script="import pathlib,shutil,json,hashlib,subprocess\nroot=pathlib.Path(\"/srv/analyst-ai/workspace\")\nproof=json.loads(pathlib.Path(\"/var/lib/analyst-ai-ops/live-deployment-proof.json\").read_text())\nassert proof[\"status\"]==\"deployed\"\nfor name,digest in proof[\"backend_files\"].items():\n    assert hashlib.sha256((pathlib.Path(\"/opt/analyst-ai/backend\")/name).read_bytes()).hexdigest()==digest\ndef put(name,s):\n    p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(s);shutil.chown(p,user=\"analyst-build\",group=\"analyst-build\")\nput(\"docs/LIVE_UPDATES_0.12.md\",\"# Обновления данных и интерфейс 0.12.0\\n\\nУказание владельца 24.10.2026: данные и серверные изменения поступают в приложение без переустановки; новый APK нужен при изменении его собственного кода. Разработка, проверки и сборка выполняются в основном рабочем дереве Timeweb 9413105.\\n\\n## Разделение обновлений\\n\\n- Данные аккаунта, результаты заданий, проверенные общие источники и конфигурация серверного ИИ меняют непрозрачную ревизию. Открытое приложение перечитывает используемые данные.\\n- Серверный выпуск проходит проверки и контролируемый перезапуск процесса. Произвольная незавершённая правка Python-файла не объявляется автоматически работающим выпуском.\\n- Нативный интерфейс, клиентский код, разрешения и библиотеки Android требуют совместимого подписанного APK. Для внедрения нового клиента синхронизации нужен один такой выпуск.\\n- Серверное развёртывание не изменяет current.json, versionCode, APK или запуск установщика.\\n\\n## Реализация\\n\\nGET /workspace/live — авторизованный long poll до 20 секунд. SQLite-триггеры меняют ревизию в одной транзакции с данными. Проверка новых изменений каждые 500 мс; клиент объединяет всплески с паузой 1 с. Это технические интервалы, а не обещание задержки при любой сети.\\n\\nЛичные и общие ревизии хранятся раздельно. Маркер владельца не подменяется фиктивным пользователем. Сессия перепроверяется во время ожидания; действуют ограничения числа соединений. Ответ не содержит портфеля, ключей или токенов.\\n\\nAndroid сохраняет курсор при переподключении, увеличивает задержку повторов до 30 с и останавливает ожидание в фоне. Уведомление вызывает чтение, не платный запрос ИИ и не повтор задания. Изменение подключения брокера отслеживается отдельным маркером. Чтение основного workspace откладывается до завершения уже выполняемой материализации.\\n\\nВ шапке показывается состояние соединения. «Онлайн» означает связь с сервером; время актуальности финансового источника остаётся отдельным показателем.\\n\\n## 2D-интерфейс\\n\\nОбщие поверхности, навигация, кнопки, карточки, аватар и каталог иконок переведены на нативные Compose/Canvas-компоненты. Светлая и тёмная палитры, цветные векторные иконки, временные реакции и непрерывная анимация загрузки используют общие правила. Режим без движения, фон, энергосбережение и перегрев ограничивают анимацию. Числовая геометрия финансовых графиков не анимируется.\\n\\nТелефонные Activity остаются portrait. Нативный ввод, семантика и пользовательские настройки сохранены. Старые библиотеки/ассеты Filament пока остаются в пакете; создание их движка новым корнем не выполняется. Уменьшение размера APK не заявляется.\\n\\n## Проверенное состояние\\n\\n24.10.2026 в 21:27 МСК серверная часть live развёрнута после успешных проверок исходников d5dd9ca2fce18cd5e38fb5e8f13c8248baf859a90512bff70e39caa84f770de9.\\n\\n- Пройдены host/tools/Node/workspace/backend проверки на Timeweb.\\n- Реальные изолированные SQLite/HTTP-тесты проверяют изоляцию, откат транзакции, переподключение, отзыв сессии, лимиты ожидания и отсутствие платных заданий от heartbeat.\\n- Сохранены и дополнены проверки подписанного Telegram-входа закрытой установки.\\n- После развёртывания: health HTTP200 (132/81/72 мс), /workspace/live без сессии HTTP401, integrity_check=ok, 63 live-триггера. Канал APK побайтно не изменился.\\n- Проверка авторизованного live на production-сессии владельца и на физическом телефоне ещё не выполнена.\\n\\nНативный кандидат: 0.12.0 /36. Сборка и полная Android-матрица учитываются отдельно; наличие файлов не означает выпуск. Текущий опубликованный файл остаётся 0.11.0-preview /35.\\n\\nРеальный ответ ИИ не подтверждён: в рабочем backend отсутствует ключ AI Gateway и выбранные модели. Код не подменяет этот отказ сгенерированным ответом и не использует административный Cloud-токен как ключ модели.\\n\\n## Ресурсы и ограничения\\n\\nОдин основной сервер, 1 CPU/1 ГБ/15 ГБ. Для сборки выделен локальный swap 3 ГБ; cgroup ограничивает Gradle 550 МиБ resident и 2560 МиБ swap, чтобы сохранять доступность API. Это не заменяет физическую RAM для полной проверки эмулятора.\\n\\nПоследнее увеличение основного сервера до стандартной конфигурации 1 CPU/6 ГБ/30 ГБ отклонено Timeweb: HTTP409 no_free_node (24.10.2026, 21:00 МСК). Дополнительные серверы не создавались. APK нельзя объявлять полностью проверенным без фактического прохождения обеих Android17/API37 конфигураций, 4096 и 16384 байта, и полного UI-набора.\\n\")\nmessages={\n\"docs/MASTER_PLAN.md\":\"Уточнение OWNER 24.10.2026 (F01/F02/F16/F20/F22/F23): современный 2D-интерфейс и live-данные. Серверные изменения не требуют нового APK; нативные изменения требуют совместимого подписанного выпуска. Вся разработка и проверки на одном основном Timeweb. Это заменяет прежние требования только 3D и отдельного APK для каждого серверного изменения.\",\n\"docs/PLAN_STATUS.md\":\"24.10.2026, 21:27 МСК: live backend развёрнут после полного набора серверных проверок; канал APK не менялся. Кандидат 0.12.0/36 с 2D и live-клиентом проверяется отдельно. Полная Android-матрица, новый опубликованный APK, телефон и реальный ответ ИИ пока не подтверждены.\",\n\"docs/WORKSPACE_UI.md\":\"Актуальный запрос 24.10.2026: единый нативный 2D-интерфейс с цветной анимацией, только portrait на телефоне. Ниже сохранено описание предыдущей линии; оно не запрещает заказанный новый дизайн.\",\n\"README.md\":\"Разработка 0.12.0/36 ведётся на основном Timeweb: нативный 2D-интерфейс и live-синхронизация. Серверная часть live уже развёрнута; опубликованный APK пока 0.11.0-preview/35. Android-матрица нового кандидата и реальная работа ИИ ещё не подтверждены.\"\n}\nfor name,text in messages.items():\n    p=root/name;link=\"docs/LIVE_UPDATES_0.12.md\" if name==\"README.md\" else \"LIVE_UPDATES_0.12.md\"\n    prefix=\"> \"+text+\" [Подробности и доказательства](\"+link+\").\\n\\n\"\n    if not p.read_text().startswith(prefix):put(name,prefix+p.read_text())\np=root/\"AGENTS.md\"\nprefix=\"## Проверено 24.10.2026, 21:27 МСК\\nLive backend развёрнут после всех серверных проверок; исходники d5dd9ca2fce18cd5e38fb5e8f13c8248baf859a90512bff70e39caa84f770de9. APK-канал не изменялся. Сборка 0.12/36 использует ограниченный swap; прежняя запись о полном запрете сборки по RAM историческая. Runtime требует фактической памяти и полных проверок, пока не подтверждён. Детали: docs/LIVE_UPDATES_0.12.md.\\n\\n\"\nif not p.read_text().startswith(prefix):put(\"AGENTS.md\",prefix+p.read_text())\nprint(\"LIVE_DOCUMENTATION_SAVED=true\",flush=True)\nnames=set(subprocess.check_output([\"git\",\"diff\",\"--name-only\",\"-z\",\"HEAD\"],cwd=root).decode().split(\"\\0\"))\nnames.update(subprocess.check_output([\"git\",\"ls-files\",\"--others\",\"--exclude-standard\",\"-z\"],cwd=root).decode().split(\"\\0\"));names.discard(\"\")\nnames={n for n in names if not n.startswith(\".kotlin/\")}\nfor name in sorted(names):\n    if name in (\"README.md\",\"AGENTS.md\") or name.startswith(\"docs/\"):continue\n    p=root/name\n    assert not p.is_symlink() and p.resolve().is_relative_to(root.resolve())\n    assert p.suffix not in (\".env\",\".jks\",\".keystore\",\".pem\",\".key\",\".db\")\n    data=None if not p.exists() else p.read_text()\n    item={\"path\":name,\"content\":data,\"sha256\":hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,\"mode\":\"100755\" if p.exists() and p.stat().st_mode&0o111 else \"100644\"}\n    print(\"BACKUP_SOURCE=\"+json.dumps(item,ensure_ascii=False),flush=True)\nprint(\"BACKUP_SOURCE_END=true\",flush=True)\n"
                      result=subprocess.run([*command,"python3 -"],input=remote_script.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=300)
                      print(result.stdout.decode(errors="replace"),flush=True)
                      if result.returncode:
                          print("REDESIGN_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-5000:],flush=True)
                          raise RuntimeError("remote_task_failed")
                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
