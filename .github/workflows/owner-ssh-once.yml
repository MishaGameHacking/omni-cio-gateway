name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-apk-download-verification
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Prepare the user-requested installable APK on Timeweb
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          targets=[(9413105,"analyst-ai-msk-app-20261024-b","201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDIYcnB6AxkxAqExaE7FZsq6+fmwNTHmn/OZm9x4pb2l")]
          for server_id,name,ip,old_host in targets:
              access.SERVER_ID=server_id
              server=access.request(token,"GET","/servers/"+str(server_id))["server"]
              assert server["id"]==server_id and server["name"]==name and server["project_id"]==2941515 and p.cloud.public_ipv4(server)==ip
              with tempfile.TemporaryDirectory(prefix="analyst-host-rotation-",dir=os.environ["RUNNER_TEMP"]) as directory:
                  folder=pathlib.Path(directory)
                  p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                  created=access.request(token,"POST","/ssh-keys",{"name":"analyst-preservation-"+str(server_id)+"-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                  key=created.get("ssh_key",created.get("ssh-key",{}))
                  assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
                  key_id=key["id"];attached=False
                  try:
                      access.request(token,"POST","/servers/"+str(server_id)+"/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                      command=p.ssh_command(folder,ip,old_host)
                      command[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                      for attempt in range(12):
                          try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                          except (p.ProbeError,subprocess.TimeoutExpired):
                              if attempt==11:raise
                              time.sleep(5)

                      script="import json,pathlib,subprocess\nw=pathlib.Path(\"/root/analyst-apk-direct-20261024\")\nr={}\nfor name in (\"delivery-status.json\",\"delivery.json\"):\n    p=w/name\n    if p.exists():r[name]=json.loads(p.read_text())\nif r.get(\"delivery-status.json\",{}).get(\"status\")==\"failed\":\n    for name in (\"publish.log\",\"delivery-failure.txt\"):\n        p=w/name\n        if p.exists():r[name]=p.read_text()[-5000:]\nprint(json.dumps(r,ensure_ascii=False))\n"
                      result=json.loads(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=30))
                      print("TIMEWEB_APK_PUBLISH_STATUS="+json.dumps(result,ensure_ascii=False),flush=True)
                      delivery=result.get("delivery.json")
                      if delivery is not None:
                          import datetime,http.client,re,ssl
                          release=delivery["release"]
                          assert release["package_name"]=="ru.omnicio.app.debug" and release["version_code"]==35
                          assert re.fullmatch(r"/client/apk/Analyst-AI-35-[a-f0-9]{64}\\.apk",release["apk_path"])
                          host="analyst-ai-2941515.twc1.net"
                          conn=http.client.HTTPSConnection(host,443,timeout=45,context=ssl.create_default_context())
                          conn.connect();assert conn.sock.getpeername()[0]=="201.24.52.66"
                          cert_sha=hashlib.sha256(conn.sock.getpeercert(binary_form=True)).hexdigest()
                          conn.request("GET","/client/update-policy?package_name=ru.omnicio.app.debug",headers={"Host":host})
                          with conn.getresponse() as response:
                              assert response.status==200 and "no-store" in response.getheader("cache-control","")
                              assert json.loads(response.read(16385))==release
                          conn.request("GET",release["apk_path"],headers={"Host":host})
                          digest=hashlib.sha256();count=0
                          with conn.getresponse() as response:
                              assert response.status==200 and response.getheader("content-type","").startswith("application/vnd.android.package-archive")
                              assert int(response.getheader("content-length"))==release["apk_bytes"]
                              assert response.getheader("X-Content-Type-Options")=="nosniff"
                              while True:
                                  chunk=response.read(262144)
                                  if not chunk:break
                                  count+=len(chunk);assert count<=release["apk_bytes"];digest.update(chunk)
                          assert count==release["apk_bytes"] and digest.hexdigest()==release["apk_sha256"]
                          for path,expected in (("/health",200),("/workspace",401)):
                              conn.request("GET",path,headers={"Host":host})
                              with conn.getresponse() as response:
                                  body=response.read(8192);assert response.status==expected
                                  if path=="/health":assert json.loads(body)=={"status":"ok"}
                          conn.close()
                          proof={"url":delivery["url"],"sha256":digest.hexdigest(),"bytes":count,"certificate_sha256":release["certificate_sha256"],"tls_certificate_sha256":cert_sha,"version_name":release["version_name"],"version_code":35,"public_download_verified":True,"backend_health":True,"unauthenticated_workspace_status":401,"verified_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
                          save="import json,os,pathlib,sys\nos.umask(0o077)\np=pathlib.Path('/root/analyst-apk-direct-20261024/external-download-verification.json')\np.write_text(json.dumps(json.load(sys.stdin),indent=2)+'\\n')\n"
                          p.remote(command,"python3 -c "+shlex.quote(save),json.dumps(proof).encode(),timeout=30)
                          print("TIMEWEB_DELIVERY_EXTERNAL_VERIFIED="+json.dumps(proof),flush=True)
                      else:
                          print("TIMEWEB_DELIVERY_NOT_PUBLISHED_YET=true",flush=True)

                  finally:
                      if attached:access.request(token,"DELETE","/servers/"+str(server_id)+"/ssh-keys/"+str(key_id))
                      access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                      print("REMEDIATION_TEMP_KEY_REMOVED="+str(server_id),flush=True)
          PY
