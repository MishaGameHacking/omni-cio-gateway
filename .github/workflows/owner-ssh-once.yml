 else:\\\\n            need(not record.get('env_sha256'), 'existing_environment_missing')\\\\n            if exists(STATE):\\\\n                need(STATE.is_dir() and not STATE.is_symlink() and not any(STATE.iterdir()),\\\\n                     'data_without_environment_refused')\\\\n            wanted['FERNET_KEY'] = Fernet.generate_key().decode('ascii')\\\\n            env_raw = ''.join(name + '=' + json.dumps(value, ensure_ascii=True) + '\\\\\\\\n'\\\\n                              for name, value in sorted(wanted.items())).encode()\\\\n            put(ENV, env_raw, 0o600, exclusive=True)\\\\n        record['env_sha256'] = sha(env_raw)\\\\n        save(record)\\\\n        prepare_state(uid, gid)\\\\n        if exists(UNIT):\\\\n            need(read(UNIT) == UNIT_TEXT, 'existing_unit_mismatch')\\\\n        else:\\\\n            put(UNIT, UNIT_TEXT, 0o644, exclusive=True)\\\\n        record['phase'] = 'starting'\\\\n        save(record)\\\\n        command(['/usr/sbin/runuser', '-u', 'analyst-ai', '--', '/usr/bin/test', '-r',\\\\n                 '/srv/analyst-ai-ota/releases/ru.omnicio.app.debug/current.json'], 3)\\\\n        command(['/usr/bin/systemctl', 'daemon-reload'], 8)\\\\n        command(['/usr/bin/systemctl', 'start', SERVICE], 12)\\\\n        until = min(END, time.monotonic() + 35)\\\\n        ready = False\\\\n        while time.monotonic() < until:\\\\n            if healthy(): ready = True; break\\\\n            time.sleep(.4)\\\\n        need(ready, 'backend_startup_failed')\\\\n        counts = registry_checks(values, uid)\\\\n        probes(public=False)\\\\n        record.update(phase='locally_verified', counts=counts)\\\\n        save(record)\\\\n        replace_caddy(target, {BEFORE_SHA, sha(target)})\\\\n        command(['/usr/bin/systemctl', 'reload', 'caddy'], 10)\\\\n        probes(public=True)\\\\n        verify_public_apk()\\\\n        record['enabled_by_helper'] = True\\\\n        save(record)\\\\n        command(['/usr/bin/systemctl', 'enable', SERVICE], 5)\\\\n        record.update(phase='verified', https_verified=True, caddy_restored=False,\\\\n                      scheduler_enabled=False, paid_ai_enabled=False)\\\\n        save(record)\\\\n        print(json.dumps({'status': 'activated', 'https_verified': True,\\\\n                          'owner_bound': True, 'scheduler_enabled': False,\\\\n                          'paid_ai_enabled': False, 'counts': counts}), flush=True)\\\\n        return 0\\\\n    except Exception as error:\\\\n        error_code = error.args[0] if isinstance(error, Halt) else 'activation_not_completed'\\\\n        rolled_back = False\\\\n        if operation_started and before is not None and target is not None:\\\\n            try:\\\\n                record['last_error'] = error_code\\\\n                record['last_error_type'] = type(error).__name__\\\\n                rolled_back = rollback(before, target, record)\\\\n            except Exception:\\\\n                rolled_back = False\\\\n        print(json.dumps({'status': error_code, 'rollback_complete': rolled_back}), flush=True)\\\\n        return 1\\\\n    finally:\\\\n        signal.setitimer(signal.ITIMER_REAL, 0)\\\\n        if lock is not None: os.close(lock)\\\\n\\\\nif __name__ == '__main__':\\\\n    try:\\\\n        raise SystemExit(main())\\\\n    except Exception:\\\\n        print('{\\\\\\\"status\\\\\\\":\\\\\\\"activation_not_completed\\\\\\\",\\\\\\\"rollback_complete\\\\\\\":false}', flush=True)\\\\n        raise SystemExit(1)\\\\n\\\"\\nassert (ROOT/\\\"backend_activate.py\\\").read_text()==old\\noriginal=load(\\\"original_activation\\\",ROOT/\\\"backend_activate.py\\\")\\nrecord=original.load_receipt();assert record[\\\"phase\\\"]==\\\"rolled_back\\\" and record[\\\"owner_bound\\\"] is True\\nowner_before=hashlib.sha256(Path(\\\"/root/analyst-ai-owner.json\\\").read_bytes()).hexdigest()\\nenv_before=hashlib.sha256(Path(\\\"/etc/analyst-ai/backend.env\\\").read_bytes()).hexdigest()\\nconfirmed=False\\ntry:original.healthy()\\nexcept AttributeError as error:\\n assert getattr(error,\\\"name\\\",None)==\\\"client\\\" and getattr(error,\\\"obj\\\",None) is original.http\\n confirmed=True\\nassert confirmed\\nprint(\\\"OWNER_ACTIVATION_DEFECT_CONFIRMED=\\\"+json.dumps({\\\"http_module_shadowing\\\":True,\\\"owner_binding_valid\\\":True,\\\"existing_environment_preserved\\\":True}),flush=True)\\ncompile(new,\\\"backend_activate.py\\\",\\\"exec\\\")\\ncontroller.atomic_write(ROOT/\\\"backend_activate.py\\\",new.encode())\\ncurrent=load(\\\"repaired_activation\\\",ROOT/\\\"backend_activate.py\\\")\\nassert current.healthy() is False\\nprint(\\\"OWNER_ACTIVATION_REPAIR_VERIFIED=\\\"+json.dumps({\\\"closed_listener_returns_false\\\":True,\\\"activation_sha256\\\":hashlib.sha256(new.encode()).hexdigest()}),flush=True)\\nresult=subprocess.run([\\\"/opt/analyst-ai/venv/bin/python\\\",\\\"-I\\\",\\\"-B\\\",str(ROOT/\\\"backend_activate.py\\\")],capture_output=True,text=True,timeout=180)\\npublic=json.loads(result.stdout);print(\\\"OWNER_BACKEND_RESUME=\\\"+json.dumps(public),flush=True)\\nassert hashlib.sha256(Path(\\\"/root/analyst-ai-owner.json\\\").read_bytes()).hexdigest()==owner_before\\nassert hashlib.sha256(Path(\\\"/etc/analyst-ai/backend.env\\\").read_bytes()).hexdigest()==env_before\\nreceipt=current.load_receipt()\\nsafe={key:receipt.get(key) for key in (\\\"phase\\\",\\\"owner_bound\\\",\\\"https_verified\\\",\\\"scheduler_enabled\\\",\\\"paid_ai_enabled\\\",\\\"counts\\\",\\\"last_error\\\",\\\"last_error_type\\\",\\\"caddy_restored\\\",\\\"backend_stopped\\\") if key in receipt}\\nprint(\\\"OWNER_BACKEND_ACTIVATION=\\\"+json.dumps(safe),flush=True)\\nassert result.returncode==0 and receipt[\\\"phase\\\"]==\\\"verified\\\"\\nenvironment=current.parse_environment(current.read(current.ENV,private=True,maximum=16384))\\ndb=sqlite3.connect(\\\"file:\\\"+environment[\\\"DATABASE_PATH\\\"]+\\\"?mode=ro\\\",uri=True,timeout=5)\\ntry:\\n db.execute(\\\"PRAGMA query_only=ON\\\");db.row_factory=sqlite3.Row;db.execute(\\\"BEGIN\\\")\\n row=db.execute(\\\"WITH active_owner_sessions AS (\\\\n SELECT s.token_hash,s.user_id,d.created_at,d.last_seen_at\\\\n FROM sessions AS s JOIN users AS u ON u.id=s.user_id\\\\n JOIN installation_owner AS o ON o.singleton=1 AND o.telegram_sub=u.telegram_sub\\\\n JOIN workspace_session_devices AS d ON d.token_hash=s.token_hash\\\\n WHERE s.expires_at>:now\\\\n), accepted_37 AS (\\\\n SELECT a.created_at,a.last_seen_at,c.observed_at\\\\n FROM active_owner_sessions AS a\\\\n JOIN client_versions AS c ON c.session_hash=a.token_hash AND c.user_id=a.user_id\\\\n WHERE c.package_name='ru.omnicio.app.debug' AND c.version_code=37 AND c.release_sha256=:release_sha\\\\n)\\\\nSELECT (SELECT COUNT(*) FROM installation_owner) AS owner_bindings,\\\\n (SELECT COUNT(*) FROM users) AS users_total,\\\\n (SELECT COUNT(*) FROM active_owner_sessions) AS active_owner_sessions,\\\\n (SELECT COUNT(*) FROM active_owner_sessions WHERE created_at>=:since) AS new_owner_sessions,\\\\n (SELECT COUNT(*) FROM accepted_37) AS accepted_v37_sessions,\\\\n (SELECT COUNT(*) FROM accepted_37 WHERE created_at>=:since AND observed_at>=:since) AS new_sessions_with_v37_accepted,\\\\n (SELECT MAX(observed_at) FROM accepted_37 WHERE created_at>=:since) AS latest_new_session_v37_observed_at\\\",{\\\"now\\\":int(time.time()),\\\"since\\\":1792912020,\\\"release_sha\\\":\\\"1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74\\\"}).fetchone()\\n report=dict(row)\\nfinally:db.close()\\nprint(\\\"OWNER_PHONE_SESSION_STATUS=\\\"+json.dumps(report),flush=True)\\nproof={\\\"server_id\\\":9415007,\\\"phase\\\":\\\"verified\\\",\\\"repair\\\":\\\"avoid_http_module_shadowing_in_health_probe\\\",\\\"activation_sha256\\\":hashlib.sha256(new.encode()).hexdigest(),\\\"owner_configuration_unchanged\\\":True,\\\"existing_environment_and_fernet_unchanged\\\":True,\\\"verified_at\\\":int(time.time()),\\\"new_authentication_flow_required\\\":False}\\ncontroller.save_json(ROOT/\\\"backend-repair-verification.json\\\",proof)\\nprint(\\\"OWNER_BACKEND_REPAIR_COMPLETE=\\\"+json.dumps(proof),flush=True)\\n\"],timeout=210)\nraise SystemExit(r.returncode)",timeout=260)
