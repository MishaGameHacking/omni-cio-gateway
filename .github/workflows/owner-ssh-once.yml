name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-timeweb-moscow-dns-source-diagnostic
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Compare system name resolution with public DNS without changing records
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          import access_owner_vm as access
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          access.SERVER_ID=9413105
          server=access.request(token,"GET","/servers/9413105")["server"]
          assert server["id"]==9413105 and server["name"]=="analyst-ai-msk-app-20261024-b" and server["location"]=="ru-3" and server["preset_id"]==6867 and p.cloud.public_ipv4(server)=="201.24.52.66"
          with tempfile.TemporaryDirectory(prefix="analyst-msk-network-",dir=os.environ["RUNNER_TEMP"]) as directory:
              folder=pathlib.Path(directory)
              p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
              created=access.request(token,"POST","/ssh-keys",{"name":"analyst-network-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
              key=created.get("ssh_key",created.get("ssh-key",{}))
              assert type(key.get("id")) is int and key.get("body","").split()[:2]==public.split()[:2]
              key_id=key["id"];attached=False
              try:
                  access.request(token,"POST","/servers/9413105/ssh-keys",{"ssh_key_ids":[key_id]});attached=True
                  command=p.ssh_command(folder,"201.24.52.66","ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdYBqa8Tvw/Bfy8VPCfwaGIsLhWbB9ak603JEmDwuHE")
                  for attempt in range(12):
                      try:p.remote(command,"test $(id -u) = 0",timeout=12);break
                      except (p.ProbeError,subprocess.TimeoutExpired):
                          if attempt==11:raise
                          time.sleep(5)
                  script="import concurrent.futures,datetime,json,pathlib,socket,ssl,subprocess,urllib.request\nhost=\"analyst-ai-2941515.twc1.net\"\nreport={\"server_id\":9413105,\"at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat()}\nreport[\"hosts_file_matches\"]=[line for line in pathlib.Path(\"/etc/hosts\").read_text().splitlines() if host in line.split()]\nreport[\"nss_hosts_rules\"]=[line for line in pathlib.Path(\"/etc/nsswitch.conf\").read_text().splitlines() if line.startswith(\"hosts:\")]\nreport[\"resolver_file_nameservers\"]=[line for line in pathlib.Path(\"/etc/resolv.conf\").read_text().splitlines() if line.startswith(\"nameserver \")]\nreport[\"system_ipv4\"]=sorted({x[4][0] for x in socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)})\ndef query(label,url):\n    row={\"resolver\":label}\n    try:\n        opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()))\n        req=urllib.request.Request(url,headers={\"Accept\":\"application/dns-json\"})\n        with opener.open(req,timeout=12) as response:\n            data=json.loads(response.read(131072));row[\"http_status\"]=response.status\n        row.update({k:data.get(k) for k in (\"Status\",\"AD\",\"Answer\",\"Authority\")})\n    except Exception as error:row[\"error_type\"]=type(error).__name__\n    return row\nqueries=[(\"google-A\",\"https://dns.google/resolve?name=\"+host+\"&type=A\"),(\"cloudflare-A\",\"https://cloudflare-dns.com/dns-query?name=\"+host+\"&type=A\"),(\"google-NS\",\"https://dns.google/resolve?name=twc1.net&type=NS\")]\nwith concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:report[\"public_dns\"]=list(pool.map(lambda item:query(*item),queries))\np=pathlib.Path(\"/root/analyst-moscow-dns-diagnostic.json\");p.write_text(json.dumps(report,indent=2));p.chmod(0o600)\nprint(\"MOSCOW_DNS_DIAGNOSTIC=\"+json.dumps(report),flush=True)\n"
                  print(p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=75).decode(),end="",flush=True)
              finally:
                  if attached:access.request(token,"DELETE","/servers/9413105/ssh-keys/"+str(key_id))
                  access.request(token,"DELETE","/ssh-keys/"+str(key_id))
                  print("MOSCOW_NETWORK_KEY=removed",flush=True)
          
          PY
