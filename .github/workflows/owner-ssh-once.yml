name: Temporary access to the new owner VM
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [deploy/access_owner_vm.py, deploy/replace_unreachable_vm.py, deploy/adopt_replacement_vm.py, .github/workflows/owner-ssh-once.yml]
permissions:
  contents: read
concurrency:
  group: analyst-owner-provider-diagnostics
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the exact checked server sources
        run: |
          git fetch --depth=1 origin fd01d2ac090103cf64557c97aeaf36bc290e2cec
          git fetch --depth=1 origin 79be182168e21ae8248e0e0dfa6deb0abfbacbcf
      - name: Inspect actual Timeweb build capacity while the Moscow server is prepared
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from decimal import Decimal
          sys.path[:0]=["deploy","tools"]
          import prepare_owner_vm as p
          token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
          def get(path,version=1):
              req=urllib.request.Request("https://api.timeweb.cloud/api/v"+str(version)+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              opener=urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context()))
              with opener.open(req,timeout=30) as response:return p.decode_response(response.read(4*1024*1024+1))
          bucket_doc=p.read_resource(token,"buckets")
          print("TIMEWEB_BACKUP_STORAGE_INVENTORY="+json.dumps(p.summarize("buckets",bucket_doc)),flush=True)
          servers=p.read_resource(token,"servers")
          assert p.summarize("servers",servers)["complete"]
          assert {s["id"] for s in servers["servers"]}=={9408159},"inventory_changed_reconcile_before_status_write"
          print("RUSSIA_FINAL_INVENTORY="+json.dumps([{k:s.get(k) for k in ("id","name","status","cpu","ram","location")} for s in servers["servers"]]),flush=True)
          import shlex
          import access_owner_vm as access
          import adopt_replacement_vm as adopt
          original_select=adopt.select_target
          observed=servers["servers"][0]
          assert observed["ram"] in {1024,3072} and observed["cpu"]==1
          def select_target(new):
              original_select(new)
              if new:p.CONFIGURATION["ram"]=observed["ram"]
          adopt.select_target=select_target
          def save_policy(command):
              script="import collections,datetime,json,os,pathlib,shutil,subprocess\nmem={}\nfor line in pathlib.Path(\"/proc/meminfo\").read_text().splitlines():\n    key,_,value=line.partition(\":\")\n    if key in {\"MemTotal\",\"MemAvailable\",\"SwapTotal\",\"SwapFree\"}:mem[key+\"_kib\"]=int(value.split()[0])\ndisk=shutil.disk_usage(\"/\")\nprocesses=collections.Counter(subprocess.check_output([\"ps\",\"-eo\",\"comm=\"],text=True).splitlines())\nsdk=pathlib.Path(\"/opt/analyst-android-sdk\")\nreport={\"server_id\":9408159,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"memory\":mem,\"root_free_bytes\":disk.free,\"java_processes\":processes[\"java\"],\"emulator_processes\":sum(v for k,v in processes.items() if \"qemu\" in k or \"emulator\" in k),\"kvm_device\":pathlib.Path(\"/dev/kvm\").exists(),\"jdk17\":pathlib.Path(\"/usr/lib/jvm/java-17-openjdk-amd64/bin/java\").is_file(),\"sdk_platform37\":(sdk/\"platforms/android-37/android.jar\").is_file(),\"sdk_build_tools37\":(sdk/\"build-tools/37.0.0/apksigner\").is_file(),\"emulator_binary\":(sdk/\"emulator/emulator\").is_file(),\"runtime_images\":[str(p.relative_to(sdk)) for p in (sdk/\"system-images\").glob(\"android-37*/*/*/source.properties\")],\"existing_build_helpers\":[str(p) for p in pathlib.Path(\"/root\").glob(\"analyst-*\") if p.is_file() and p.suffix in {\".py\",\".sh\"}],\"backend_installed\":pathlib.Path(\"/etc/analyst-ai\").exists()}\nreport[\"build_memory_sufficient\"]=mem[\"MemTotal_kib\"]>=2600*1024 and mem[\"MemAvailable_kib\"]>=2200*1024\nprint(\"TIMEWEB_DEVELOPMENT_CAPACITY=\"+json.dumps(report),flush=True)\n"
              out=p.remote(command,"python3 -u -c "+shlex.quote(script),timeout=180)
              print(out.decode(),end="",flush=True)
          access.develop_backend=save_policy
          adopt.run(development=True)
          new=get("/dedicated-servers/121673")["dedicated_server"]
          assert new["id"]==121673 and new["name"]=="analyst-ai-msk-20261024" and new["preset_id"]==6007 and new["location"]=="ru-3"
          print("MOSCOW_ORDER_AFTER_SOURCE_CHECK="+json.dumps({k:new.get(k) for k in ("id","status","ip","price","autoinstall_ready")}),flush=True)
          PY
