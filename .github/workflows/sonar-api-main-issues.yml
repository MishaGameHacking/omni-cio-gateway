name: Sonar main issue inventory

on:
  push:
    branches:
      - diagnostic/sonar-main-remaining-2
    paths:
      - ".github/workflows/sonar-api-main-issues.yml"

permissions:
  contents: read

jobs:
  inventory:
    name: Query Sonar main issues
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Verify Sonar project
        shell: cmd
        run: >-
          curl.exe --fail --silent --show-error -G
          --data-urlencode "component=MishaGameHacking_omni-cio-gateway"
          "https://sonarcloud.io/api/components/show"
      - name: Query unresolved main issues
        shell: cmd
        run: >-
          curl.exe --fail --silent --show-error -G
          --data-urlencode "componentKeys=MishaGameHacking_omni-cio-gateway"
          --data-urlencode "branch=main"
          --data-urlencode "resolved=false"
          --data-urlencode "ps=100"
          "https://sonarcloud.io/api/issues/search"
      - name: Query main measures
        shell: cmd
        run: >-
          curl.exe --fail --silent --show-error -G
          --data-urlencode "component=MishaGameHacking_omni-cio-gateway"
          --data-urlencode "branch=main"
          --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,security_hotspots"
          "https://sonarcloud.io/api/measures/component"
