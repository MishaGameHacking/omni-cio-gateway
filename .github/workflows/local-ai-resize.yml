name: Back up and resize existing local AI host within owner budget
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/local-ai-resize.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
env:
  EXPECTED_TOOLS_SHA: 'eced4c4f7fc5a7ada4391d38a889759aaa105b7e'
  EXPECTED_TOOLS_RUN: '41095250608'
  EXPECTED_SSH_TOOLS_SHA: '7bd97dcb25778d756b6419887052107933736606'
  EXPECTED_SSH_TOOLS_RUN: '41093693464'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful owner WSL verification and unchanged reviewed transport
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            if(!/^[a-f0-9]{40}$/.test(e.EXPECTED_TOOLS_SHA)||/^0+$/.test(e.EXPECTED_TOOLS_SHA)) throw new Error('Exact tested source required');
            if(!/^[1-9][0-9]{7,19}$/.test(e.EXPECTED_TOOLS_RUN)) throw new Error('Exact successful run required');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_TOOLS_SHA||r.path!=='.github/workflows/local-ai-resize-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('Exact diagnostic verification did not pass');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:Number(e.EXPECTED_TOOLS_RUN),per_page:100});
            if(jobs.filter(j=>j.name==='verify'&&j.conclusion==='success'&&j.status==='completed').length!==1) throw new Error('Successful verify job missing');
            for(const path of ['deploy/pre_resize_backup.py','deploy/test_local_ai_resize.py','deploy/local_ai_resize_cost_fixture.json','tools/check_local_ai_resize.py','tools/resize_local_ai_host.py','tools/inspect_infrastructure_budget.py','.github/workflows/local-ai-resize-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('Tested tool changed: '+path);
            }
            const {data:transport}=await github.rest.repos.getContent({...context.repo,path:'tools/owner_plan_transport_20261027.py',ref:context.sha});
            if(transport.sha!=='7478ac9850fe1deeb729d1ccbc8fb0f28b849124') throw new Error('Reviewed transport changed');
      - name: Require tested private SSH diagnostics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const e=process.env;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.EXPECTED_SSH_TOOLS_RUN)});
            if(r.head_sha!==e.EXPECTED_SSH_TOOLS_SHA||r.path!=='.github/workflows/ssh-handshake-tools.yml'||r.head_branch!=='codex/timeweb-owner-prepare-2026-10-23'||r.event!=='push'||r.run_attempt!==1||r.status!=='completed'||r.conclusion!=='success') throw new Error('SSH diagnostic verification required');
            for(const path of ['tools/observe_ssh_handshake.py','tools/test_observe_ssh_handshake.py','tools/check_ssh_handshake.py','.github/workflows/ssh-handshake-tools.yml']) {
              const {data:tested}=await github.rest.repos.getContent({...context.repo,path,ref:e.EXPECTED_SSH_TOOLS_SHA});
              const {data:current}=await github.rest.repos.getContent({...context.repo,path,ref:context.sha});
              if(tested.sha!==current.sha) throw new Error('SSH diagnostic source changed');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd1866ee944ccea2259669f4293379241fd4ee02
          path: .transport-admin
          persist-credentials: false
      - name: Require completed pinned source and model installation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:41094102698});
            if(r.head_sha!=='c7056097e88778a4766e8c3525299d72d497a515'||r.path!=='.github/workflows/local-ai-preparation.yml'||r.status!=='completed'||r.conclusion!=='success'||r.run_attempt!==1) throw new Error('Pinned model preparation not completed');
      - name: Read fresh costs and require bounded same-host resource plan
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 tools/resize_local_ai_host.py
      - name: Prepare fixed private online backup
        shell: python
        run: |
          import json
          from pathlib import Path
          target=Path('deploy/plan-20261027')
          target.mkdir(parents=True,exist_ok=True)
          (target/'operation.py').write_bytes(Path('deploy/pre_resize_backup.py').read_bytes())
          (target/'payload.json').write_text(json.dumps({'purpose':'cpu4_ram8192_disk_unchanged'}))
      - name: Back up existing database source and configuration before resource change
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/observe_ssh_handshake.py
      - name: Recheck current costs and request CPU RAM change once
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/resize_local_ai_host.py --apply
      - name: Preserve sanitized backup and request evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-ai-resize-${{ github.run_id }}
          path: plan-reports/
          if-no-files-found: warn
          retention-days: 7
