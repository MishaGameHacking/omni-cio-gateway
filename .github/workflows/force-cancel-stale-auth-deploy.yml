name: Force cancel stale auth deploy

on:
  push:
    branches:
      - diagnostic/sonar-main-remaining
    paths:
      - ".github/workflows/force-cancel-stale-auth-deploy.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    name: Force cancel superseded auth deploy run
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Force cancel stale run 37181110245
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl.exe --fail --silent --show-error
          -X POST
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer %GH_TOKEN%"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/actions/runs/37181110245/force-cancel"
