name: Final Moscow cutover (owner confirmed callback)
on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/moscow-final-cutover.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Offline regressions and syntax checks before cloud access
        shell: cmd
        run: |
          py -3 -m unittest discover -s migration_tests -p test_moscow_cutover.py -v
          if errorlevel 1 exit /b 1
          py -3 -m py_compile .github\scripts\moscow_cutover.py .github\scripts\migration_snapshot.py .github\scripts\migration_restore.py .github\scripts\migration_access.py
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -n .github/scripts/finalize_moscow.sh
          if errorlevel 1 exit /b 1
      - name: Final snapshot, isolated verification, then single-writer cutover
        shell: cmd
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          "C:\Program Files\Git\bin\bash.exe" .github/scripts/finalize_moscow.sh
          if errorlevel 1 exit /b 1
