# Historical Render hosted-release alignment workflow.
# Amendment 14 retires Render from active V10 release authority. Keep the
# workflow name/manual entry for provenance, but fail closed before any runtime
# probe so it cannot be mistaken for current Cloudflare release acceptance.
# TEMPORARY: the PR-only finalizer below applies one atomic, targeted correction
# and restores this file to its historical workflow form before committing.
name: V10 Hosted Release Alignment

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: v10-hosted-release-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retired-hosted-alignment:
    if: github.event_name == 'workflow_dispatch'
    name: Historical Render alignment path is retired
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Refuse obsolete Render release acceptance
        shell: cmd
        run: |
          @echo off
          echo LEGACY_RENDER_ALIGNMENT_RETIRED_AMENDMENT_14
          echo Render hosted-release alignment is historical evidence only.
          echo Current V10 release authority must use the accepted Cloudflare candidate and promotion sequence.
          exit /b 79

  finalize-cloudflare-node-supply-chain:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'system/cloudflare-public-product'
    name: TEMP atomic Cloudflare Node supply-chain correction
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git config --local --unset-all credential.helper
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Bootstrap protected Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Apply exact Cloudflare Node supply-chain correction
        shell: bash
        run: |
          set -euo pipefail
          node_exe='/c/Program Files/nodejs/node.exe'
          npx_cmd='/c/Program Files/nodejs/npx.cmd'
          test "$("$node_exe" --version | tr -d '\r')" = 'v24.18.0'
          test "$("$npx_cmd" --yes npm@10.9.2 --version | tr -d '\r')" = '10.9.2'

          "$node_exe" - <<'NODE'
          const fs = require('fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (pkg.engines?.node !== '24.18.0' || pkg.engines?.npm !== '11.16.0') {
            throw new Error('unexpected root engine baseline before correction');
          }
          if (pkg.packageManager !== 'npm@11.16.0') {
            throw new Error('unexpected root packageManager before correction');
          }
          pkg.engines.npm = '10.9.2';
          pkg.packageManager = 'npm@10.9.2';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const releasePath = 'scripts/check_v10_cloudflare_release_acceptance.py';
          let release = fs.readFileSync(releasePath, 'utf8');
          const oldBaseline = 'if package.get("engines") != {"node": "24.18.0", "npm": "11.16.0"}:';
          const newBaseline = 'if package.get("engines") != {"node": "24.18.0", "npm": "10.9.2"}:';
          if (!release.includes(oldBaseline) || release.includes(newBaseline)) {
            throw new Error('release checker engine baseline patch precondition failed');
          }
          release = release.replace(oldBaseline, newBaseline);
          fs.writeFileSync(releasePath, release);

          const verifierPath = 'scripts/run_v10_cloudflare_verifier.py';
          let verifier = fs.readFileSync(verifierPath, 'utf8').replace(/\r\n/g, '\n');
          const anchor = `    subprocess.run(\n        [sys.executable, "scripts/check_v10_wp17_web_security.py"],\n        cwd=ROOT,\n        check=True,\n    )\n`;
          const replacement = anchor + `    subprocess.run(\n        [sys.executable, "scripts/check_v10_cloudflare_node_supply_chain.py"],\n        cwd=ROOT,\n        check=True,\n    )\n`;
          if (!verifier.includes(anchor) || verifier.includes('check_v10_cloudflare_node_supply_chain.py')) {
            throw new Error('verifier supply-chain patch precondition failed');
          }
          verifier = verifier.replace(anchor, replacement);
          fs.writeFileSync(verifierPath, verifier);
          NODE

          cat > .npmrc <<'NPMRC'
          ignore-scripts=true
          NPMRC

          cat > scripts/check_v10_cloudflare_node_supply_chain.py <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys
          from typing import Any


          ROOT = Path(__file__).resolve().parents[1]
          PACKAGE = ROOT / "package.json"
          PACKAGE_LOCK = ROOT / "package-lock.json"
          NPMRC = ROOT / ".npmrc"

          _EXPECTED_ENGINES = {"node": "24.18.0", "npm": "10.9.2"}
          _EXPECTED_PACKAGE_MANAGER = "npm@10.9.2"
          _EXPECTED_DEPENDENCIES = {"@cloudflare/containers": "0.3.7"}
          _EXPECTED_DEV_DEPENDENCIES = {"wrangler": "4.127.1"}
          _FORBIDDEN_LIFECYCLE_SCRIPTS = {
              "preinstall",
              "install",
              "postinstall",
              "prepare",
              "prepublish",
              "prepublishOnly",
          }


          def _load_object(path: Path, label: str) -> dict[str, Any]:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError(
                      f"CLOUDFLARE_NODE_SUPPLY_CHAIN_{label}_UNREADABLE"
                  ) from exc
              if not isinstance(value, dict):
                  raise RuntimeError(f"CLOUDFLARE_NODE_SUPPLY_CHAIN_{label}_INVALID")
              return value


          def _object(value: object, label: str) -> dict[str, Any]:
              if not isinstance(value, dict):
                  raise RuntimeError(f"CLOUDFLARE_NODE_SUPPLY_CHAIN_{label}_INVALID")
              return value


          def _read_npmrc() -> tuple[str, ...]:
              try:
                  lines = NPMRC.read_text(encoding="utf-8").splitlines()
              except (OSError, UnicodeError) as exc:
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_NPMRC_UNREADABLE"
                  ) from exc
              return tuple(line.strip() for line in lines if line.strip())


          def validate() -> None:
              package = _load_object(PACKAGE, "PACKAGE")
              if package.get("name") != "omni-cio-v10-cloudflare-delivery":
                  raise RuntimeError("CLOUDFLARE_NODE_SUPPLY_CHAIN_PACKAGE_NAME_INVALID")
              if package.get("engines") != _EXPECTED_ENGINES:
                  raise RuntimeError("CLOUDFLARE_NODE_SUPPLY_CHAIN_TOOLCHAIN_INVALID")
              if package.get("packageManager") != _EXPECTED_PACKAGE_MANAGER:
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_PACKAGE_MANAGER_INVALID"
                  )
              if package.get("dependencies") != _EXPECTED_DEPENDENCIES:
                  raise RuntimeError("CLOUDFLARE_NODE_SUPPLY_CHAIN_DEPENDENCIES_INVALID")
              if package.get("devDependencies") != _EXPECTED_DEV_DEPENDENCIES:
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_DEV_DEPENDENCIES_INVALID"
                  )

              scripts = _object(package.get("scripts"), "SCRIPTS")
              forbidden = sorted(_FORBIDDEN_LIFECYCLE_SCRIPTS.intersection(scripts))
              if forbidden:
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_LIFECYCLE_SCRIPTS_FORBIDDEN:"
                      + ",".join(forbidden)
                  )

              if _read_npmrc() != ("ignore-scripts=true",):
                  raise RuntimeError("CLOUDFLARE_NODE_SUPPLY_CHAIN_NPMRC_INVALID")

              lock = _load_object(PACKAGE_LOCK, "PACKAGE_LOCK")
              if lock.get("lockfileVersion") != 3 or lock.get("requires") is not True:
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCKFILE_VERSION_INVALID"
                  )
              if lock.get("name") != package.get("name") or lock.get(
                  "version"
              ) != package.get("version"):
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCK_IDENTITY_INVALID"
                  )

              packages = _object(lock.get("packages"), "LOCK_PACKAGES")
              root = _object(packages.get(""), "LOCK_ROOT")
              expected_root = {
                  "name": package.get("name"),
                  "version": package.get("version"),
                  "dependencies": _EXPECTED_DEPENDENCIES,
                  "devDependencies": _EXPECTED_DEV_DEPENDENCIES,
                  "engines": _EXPECTED_ENGINES,
              }
              for key, expected in expected_root.items():
                  if root.get(key) != expected:
                      raise RuntimeError(
                          "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCK_ROOT_"
                          f"{key.upper()}_INVALID"
                      )

              containers = _object(
                  packages.get("node_modules/@cloudflare/containers"),
                  "LOCK_CONTAINERS",
              )
              if containers.get("version") != "0.3.7":
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCK_CONTAINERS_INVALID"
                  )

              wrangler = _object(packages.get("node_modules/wrangler"), "LOCK_WRANGLER")
              if wrangler.get("version") != "4.127.1":
                  raise RuntimeError(
                      "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCK_WRANGLER_INVALID"
                  )


          def main() -> int:
              try:
                  validate()
              except RuntimeError as exc:
                  print(str(exc), file=sys.stderr)
                  return 1
              print("V10 Cloudflare Node supply-chain contract passed.")
              print("Cloudflare build toolchain: Node 24.18.0 / npm 10.9.2")
              print("Root dependency lock: package-lock v3, exact package versions")
              print(
                  "Dependency lifecycle scripts: DISABLED by source-controlled .npmrc"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > tests/test_v10_cloudflare_node_supply_chain.py <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import tempfile
          import unittest
          from unittest import mock

          import scripts.check_v10_cloudflare_node_supply_chain as guard


          class CloudflareNodeSupplyChainTests(unittest.TestCase):
              def test_repository_contract_is_valid(self) -> None:
                  guard.validate()

              def test_guard_rejects_provider_npm_mismatch(self) -> None:
                  payload = json.loads(guard.PACKAGE.read_text(encoding="utf-8"))
                  payload["engines"]["npm"] = "11.16.0"
                  with tempfile.TemporaryDirectory() as temporary:
                      candidate = Path(temporary) / "package.json"
                      candidate.write_text(json.dumps(payload), encoding="utf-8")
                      with mock.patch.object(guard, "PACKAGE", candidate):
                          with self.assertRaisesRegex(
                              RuntimeError,
                              "CLOUDFLARE_NODE_SUPPLY_CHAIN_TOOLCHAIN_INVALID",
                          ):
                              guard.validate()

              def test_guard_rejects_package_manager_mismatch(self) -> None:
                  payload = json.loads(guard.PACKAGE.read_text(encoding="utf-8"))
                  payload["packageManager"] = "npm@11.16.0"
                  with tempfile.TemporaryDirectory() as temporary:
                      candidate = Path(temporary) / "package.json"
                      candidate.write_text(json.dumps(payload), encoding="utf-8")
                      with mock.patch.object(guard, "PACKAGE", candidate):
                          with self.assertRaisesRegex(
                              RuntimeError,
                              "CLOUDFLARE_NODE_SUPPLY_CHAIN_PACKAGE_MANAGER_INVALID",
                          ):
                              guard.validate()

              def test_guard_rejects_unsafe_npmrc(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      candidate = Path(temporary) / ".npmrc"
                      candidate.write_text("ignore-scripts=false\n", encoding="utf-8")
                      with mock.patch.object(guard, "NPMRC", candidate):
                          with self.assertRaisesRegex(
                              RuntimeError,
                              "CLOUDFLARE_NODE_SUPPLY_CHAIN_NPMRC_INVALID",
                          ):
                              guard.validate()

              def test_guard_rejects_root_lock_dependency_drift(self) -> None:
                  payload = json.loads(guard.PACKAGE_LOCK.read_text(encoding="utf-8"))
                  payload["packages"][""]["devDependencies"]["wrangler"] = "4.127.0"
                  with tempfile.TemporaryDirectory() as temporary:
                      candidate = Path(temporary) / "package-lock.json"
                      candidate.write_text(json.dumps(payload), encoding="utf-8")
                      with mock.patch.object(guard, "PACKAGE_LOCK", candidate):
                          with self.assertRaisesRegex(
                              RuntimeError,
                              "CLOUDFLARE_NODE_SUPPLY_CHAIN_LOCK_ROOT_"
                              "DEVDEPENDENCIES_INVALID",
                          ):
                              guard.validate()

              def test_guard_rejects_root_lifecycle_scripts(self) -> None:
                  payload = json.loads(guard.PACKAGE.read_text(encoding="utf-8"))
                  payload["scripts"]["postinstall"] = "node scripts/unreviewed.js"
                  with tempfile.TemporaryDirectory() as temporary:
                      candidate = Path(temporary) / "package.json"
                      candidate.write_text(json.dumps(payload), encoding="utf-8")
                      with mock.patch.object(guard, "PACKAGE", candidate):
                          with self.assertRaisesRegex(
                              RuntimeError,
                              "CLOUDFLARE_NODE_SUPPLY_CHAIN_LIFECYCLE_SCRIPTS_FORBIDDEN",
                          ):
                              guard.validate()


          if __name__ == "__main__":
              unittest.main()
          PY

          "$npx_cmd" --yes npm@10.9.2 install \
            --package-lock-only --ignore-scripts --no-audit --no-fund

          rm -f .github/workflows/v10-cloudflare-lock-synthesis.yml
          cat > .github/workflows/v10-hosted-release-alignment.yml <<'YAML'
          # Historical Render hosted-release alignment workflow.
          # Amendment 14 retires Render from active V10 release authority. Keep the
          # workflow name/manual entry for provenance, but fail closed before any runtime
          # probe so it cannot be mistaken for current Cloudflare release acceptance.
          name: V10 Hosted Release Alignment

          on:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: v10-hosted-release-alignment-retired
            cancel-in-progress: false

          jobs:
            retired-hosted-alignment:
              name: Historical Render alignment path is retired
              runs-on: [self-hosted, Windows, X64, omni-cio-ci]
              timeout-minutes: 5
              steps:
                - name: Refuse obsolete Render release acceptance
                  shell: cmd
                  run: |
                    @echo off
                    echo LEGACY_RENDER_ALIGNMENT_RETIRED_AMENDMENT_14
                    echo Render hosted-release alignment is historical evidence only.
                    echo Current V10 release authority must use the accepted Cloudflare candidate and promotion sequence.
                    exit /b 79
          YAML

      - name: Format and run targeted correction checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps ruff==0.16.1
          python -m ruff format \
            scripts/check_v10_cloudflare_node_supply_chain.py \
            scripts/check_v10_cloudflare_release_acceptance.py \
            scripts/run_v10_cloudflare_verifier.py \
            tests/test_v10_cloudflare_node_supply_chain.py \
            tests/test_v10_wp22a_provisioning_contract.py
          python -m ruff check \
            scripts/check_v10_cloudflare_node_supply_chain.py \
            scripts/check_v10_cloudflare_release_acceptance.py \
            scripts/run_v10_cloudflare_verifier.py \
            tests/test_v10_cloudflare_node_supply_chain.py \
            tests/test_v10_wp22a_provisioning_contract.py
          python -m compileall -q \
            scripts/check_v10_cloudflare_node_supply_chain.py \
            scripts/check_v10_cloudflare_release_acceptance.py \
            scripts/run_v10_cloudflare_verifier.py \
            tests/test_v10_cloudflare_node_supply_chain.py \
            tests/test_v10_cloudflare_release_acceptance.py \
            tests/test_v10_wp22a_provisioning_contract.py
          python scripts/check_v10_cloudflare_node_supply_chain.py
          python scripts/check_v10_cloudflare_release_acceptance.py
          python scripts/check_v10_cloudflare_builds_verifier.py
          python -m unittest \
            tests.test_v10_cloudflare_node_supply_chain \
            tests.test_v10_cloudflare_release_acceptance
          git diff --check

      - name: Prove frozen root install and Wrangler entrypoint
        shell: bash
        run: |
          set -euo pipefail
          npx_cmd='/c/Program Files/nodejs/npx.cmd'
          node_exe='/c/Program Files/nodejs/node.exe'
          "$npx_cmd" --yes npm@10.9.2 ci --ignore-scripts --no-audit --no-fund
          "$node_exe" node_modules/wrangler/bin/wrangler.js --version | grep -F '4.127.1'

      - name: Commit and push one atomic correction
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          test ! -e .github/workflows/v10-cloudflare-lock-synthesis.yml
          ! grep -Fq 'TEMPORARY' .github/workflows/v10-hosted-release-alignment.yml
          test -f package-lock.json
          test -f .npmrc
          git status --short
          git add -A
          git diff --cached --check
          git config user.name 'Omni-cio'
          git config user.email 'mishaklimachev@gmail.com'
          git commit -m 'Cloudflare: freeze provider Node supply chain'
          final_sha="$(git rev-parse HEAD)"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          git config --local --unset-all credential.helper
          echo "FINAL_CORRECTION_SHA=${final_sha}"
