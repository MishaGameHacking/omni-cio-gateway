name: V10 Hosted Release Alignment

on:
  workflow_run:
    workflows:
      - V10 Phase 4 Free Preview Deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-hosted-release-alignment
  cancel-in-progress: false

jobs:
  verify-hosted-release:
    name: Verify hosted preview release matches accepted main
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_MAIN_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap current main and classify alignment applicability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git config --local http.lowSpeedLimit 1000
            git config --local http.lowSpeedTime 60
            fetch_status=0
            git fetch --no-tags --prune --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" || fetch_status=$?
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          echo "CURRENT_MAIN_SHA=$current_main_sha" >> "$GITHUB_ENV"
          if [ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]; then
            echo "ALIGNMENT_APPLICABLE=false" >> "$GITHUB_ENV"
            echo "HOSTED_RELEASE_ALIGNMENT=SUPERSEDED_BY_NEWER_MAIN expected=$EXPECTED_MAIN_SHA current=$current_main_sha"
            exit 0
          fi
          echo "ALIGNMENT_APPLICABLE=true" >> "$GITHUB_ENV"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Report superseded alignment without current-runtime claim
        if: env.ALIGNMENT_APPLICABLE == 'false'
        run: >-
          echo HOSTED_RELEASE_ALIGNMENT=SUPERSEDED_BY_NEWER_MAIN
          expected="$EXPECTED_MAIN_SHA" current="$CURRENT_MAIN_SHA"

      - name: Bootstrap isolated Python 3.12.10
        if: env.ALIGNMENT_APPLICABLE == 'true'
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify exact-main Regression Shield before runtime assertion
        if: env.ALIGNMENT_APPLICABLE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_v10_exact_main_regression.py

      - name: Probe canonical hosted release alignment without publishing PASS
        if: env.ALIGNMENT_APPLICABLE == 'true'
        run: >-
          python scripts/check_v10_hosted_release_alignment.py
          --expected-sha "$EXPECTED_MAIN_SHA"
          > hosted_alignment_pass.txt

      - name: Reconfirm current main before publishing runtime PASS
        if: env.ALIGNMENT_APPLICABLE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          REFRESH_ROOT="$(cygpath -u "$RUNNER_TEMP")/omni-cio-hosted-alignment-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          refresh_succeeded=0
          for refresh_attempt in 1 2 3; do
            rm -rf "$REFRESH_ROOT"
            git init "$REFRESH_ROOT"
            git -C "$REFRESH_ROOT" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$REFRESH_ROOT" config --local gc.auto 0
            git -C "$REFRESH_ROOT" config --local credential.helper ""
            git -C "$REFRESH_ROOT" config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            git -C "$REFRESH_ROOT" config --local http.lowSpeedLimit 1000
            git -C "$REFRESH_ROOT" config --local http.lowSpeedTime 60
            refresh_status=0
            git -C "$REFRESH_ROOT" fetch --no-tags --prune --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" || refresh_status=$?
            git -C "$REFRESH_ROOT" config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$refresh_status" -eq 0 ]; then
              refresh_succeeded=1
              break
            fi
            rm -rf "$REFRESH_ROOT"
            if [ "$refresh_attempt" -lt 3 ]; then
              echo "Post-probe main refresh transport failed on attempt ${refresh_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((refresh_attempt * 5))"
            fi
          done
          if [ "$refresh_succeeded" -ne 1 ]; then
            rm -rf "$REFRESH_ROOT"
            echo "Post-probe main refresh transport failed after 3 attempts." >&2
            exit 71
          fi
          current_main_sha="$(git -C "$REFRESH_ROOT" rev-parse refs/remotes/origin/main)"
          rm -rf "$REFRESH_ROOT"
          if [ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]; then
            echo "HOSTED_RELEASE_ALIGNMENT=SUPERSEDED_BY_NEWER_MAIN expected=$EXPECTED_MAIN_SHA current=$current_main_sha phase=post_probe"
            exit 0
          fi
          cat hosted_alignment_pass.txt

      - name: Clean self-hosted alignment workspace
        if: always()
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$(cygpath -u "$RUNNER_TEMP")/omni-cio-hosted-alignment-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
