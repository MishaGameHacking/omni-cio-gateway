# Historical Render hosted-release alignment workflow.
# Amendment 14 retires Render from active V10 release authority. Keep the
# workflow name/manual entry for provenance, but fail closed before any runtime
# probe so it cannot be mistaken for current Cloudflare release acceptance.
# TEMPORARY PR synthesis lane below exists only to derive the exact npm 10.9.2
# root lock blob and MUST be removed before the final reviewed head.
name: V10 Hosted Release Alignment

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: v10-hosted-release-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retired-hosted-alignment:
    if: github.event_name == 'workflow_dispatch'
    name: Historical Render alignment path is retired
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Refuse obsolete Render release acceptance
        shell: cmd
        run: |
          @echo off
          echo LEGACY_RENDER_ALIGNMENT_RETIRED_AMENDMENT_14
          echo Render hosted-release alignment is historical evidence only.
          echo Current V10 release authority must use the accepted Cloudflare candidate and promotion sequence.
          exit /b 79

  synthesize-cloudflare-root-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'system/cloudflare-public-product'
    name: TEMP exact npm 10.9.2 root lock blob synthesis
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - name: Expose installed Git Bash
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git config --local --unset-all credential.helper
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Generate exact provider lock and store immutable blob
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node_exe='/c/Program Files/nodejs/node.exe'
          npx_cmd='/c/Program Files/nodejs/npx.cmd'
          test -f "$node_exe"
          test -f "$npx_cmd"
          node_version="$("$node_exe" --version | tr -d '\r')"
          test "$node_version" = 'v24.18.0'
          npm_version="$("$npx_cmd" --yes npm@10.9.2 --version | tr -d '\r')"
          test "$npm_version" = '10.9.2'
          "$node_exe" -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.engines.npm='10.9.2'; p.packageManager='npm@10.9.2'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
          "$npx_cmd" --yes npm@10.9.2 install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
          payload="$("$node_exe" -e "const fs=require('fs'); process.stdout.write(JSON.stringify({content:fs.readFileSync('package-lock.json').toString('base64'),encoding:'base64'}));")"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary "$payload")"
          blob_sha="$(printf '%s' "$response" | "$node_exe" -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>{const p=JSON.parse(s); if(!/^[0-9a-f]{40}$/.test(p.sha||'')) process.exit(2); process.stdout.write(p.sha);});")"
          echo "PACKAGE_LOCK_BLOB_SHA=${blob_sha}"

      - name: Clean temporary workspace
        if: always()
        shell: cmd
        run: |
          git config --local --unset-all credential.helper >nul 2>nul
          git reset --hard HEAD >nul 2>nul
          git clean -ffdx >nul 2>nul
