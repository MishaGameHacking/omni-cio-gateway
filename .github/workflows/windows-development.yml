        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''PATCH_DIR'']); b=zlib.decompress(base64.b64decode((p/''n00-linux-guest.py.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''9c92c16d88a9e69a6e9b73b61f0e1eff8cd6b1b457451ee104c07bd17a7e29f0''; (p/''n00-linux-guest.py'').write_bytes(b)"

