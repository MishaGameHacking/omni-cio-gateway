        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''PATCH_DIR'']); b=zlib.decompress(base64.b64decode((p/''n00-native45.b64.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''0df6d897098ceaad8143650286a1b32a560f3202a6dc3fc816b303ff6e2b971a''; (p/''n00-native45.b64'').write_bytes(b)"

        if errorlevel 1 exit /b 1

        '
    - name: 'Stage verified administrative transport: patch-manifest.json'
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''PATCH_DIR''])/''patch-manifest.json.b64''; p.open(''w'',encoding=''ascii'').write(''eNpFzDFuwzAMQNG7aG4BUpQoMlcpioAiJSRAbRex2yXI3eut+3//mXa/jcXSBd9St31cfVuW+5EuCd2hVuHO0kqfEeDRBZAwsEkMnVqlgacT/qzxNfZ0+Xim1ZZx6hXgfbXj/jtKPYvjYev+vT2O636zXPksICaHaAMVH2YhWIgrZGHDTtkqw6QM2TicpgtyJ6A5eeSuDe28xvAtRvw/iahBznOWii20VJswqmlxFY1BrLk1MJeCxFi4qFqh2rp2iFY4vT5ff8X2ToE='')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,zlib,base64,hashlib; p=Path(os.environ[''PATCH_DIR'']); b=zlib.decompress(base64.b64decode((p/''patch-manifest.json.b64'').read_text()));
        assert hashlib.sha256(b).hexdigest()==''980ec570faf1873c090c95819c3afc72793b4232709e6f3792a33dbccfe2feab''; (p/''patch-manifest.json'').write_bytes(b)"

        if errorlevel 1 exit /b 1

        '
      id: setup
    - name: Apply patches on Windows and perform every host and Android build check
      id: work
      timeout-minutes: 210
      shell: cmd
      run: 'py -3 "%PATCH_DIR%\windows-full-development.py" control --manifest "%PATCH_DIR%\patch-manifest.json"

        if errorlevel 1 exit /b 1'
    - name: Preserve exact Windows sources, logs, test reports and built APKs
      id: export
      if: always() && steps.setup.outcome == 'success'
      shell: cmd
      run: 'py -3 "%PATCH_DIR%\windows-full-development.py" export

        if errorlevel 1 exit /b 1'
    - name: Retain synthetic Windows and WSL check evidence beyond runner temp cleanup
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: n00-candidate45-build-checks
        path: '${{ runner.temp }}/analyst-development-${{ github.run_id }}-${{ github.run_attempt }}/windows-development.json

          ${{ runner.temp }}/analyst-development-${{ github.run_id }}-${{ github.run_attempt }}/controller.json

          ${{ runner.temp }}/analyst-development-${{ github.run_id }}-${{ github.run_attempt }}/applied-patches.json

          ${{ runner.temp }}/analyst-development-${{ github.run_id }}-${{ github.run_attempt }}/export-receipt.json

          ${{ runner.temp }}/analyst-development-${{ github.run_id }}-${{ github.run_attempt }}/*host-tests.log

