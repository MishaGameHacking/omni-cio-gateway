# Latest explicit owner instruction (2026-10-25): application source edits, builds,
# host/backend/JVM/lint tests and Android emulator tests run on LAPTOP-NPSGA016.
# Ubuntu jobs below perform private byte transport only. Timeweb only stores the
# returned archive; this workflow never builds/tests/publishes application code there.
# Runtime matrix, external quality checks and phone validation remain separate gates.
name: Develop and verify Analyst AI on the Windows laptop
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-development.yml
permissions:
  contents: read
concurrency:
  group: analyst-windows-development-heavy
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify the existing private return transport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Create and verify one private run-owned transfer
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const helper=require(''./.github/scripts/ci_private_transfer.cjs'');

          await helper({github,context,core,command:''prepare''});

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one preflight-owned private draft is required'');

          const release=helper.owned(matches[0],identity);

          if(release.assets.length!==0) throw new Error(''Preflight draft must be empty'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.setOutput(''release_id'',String(release.id));'
  develop:
    name: Apply reviewed source patches and run full Windows checks and build
    needs: preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 230
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
    env:
      SOURCE_ROOT: ${{ github.workspace }}/windows-development-${{ github.run_id }}-${{ github.run_attempt }}
      PATCH_DIR: ${{ github.workspace }}/windows-development-patches-${{ github.run_id }}-${{ github.run_attempt }}
      ANDROID_SDK_ROOT: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      ANDROID_HOME: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
    - name: Require the authorized laptop and a new owned checkout
      shell: cmd
      run: 'py -3 -c "import os,sys,pathlib; assert sys.platform==''win32'' and os.environ.get(''COMPUTERNAME'')==''LAPTOP-NPSGA016'';
        assert sys.version_info[:3]==(3,14,6); p=pathlib.Path(os.environ[''SOURCE_ROOT'']); assert not p.exists() and not
        p.is_symlink()"

        if errorlevel 1 exit /b 1'
    - name: Checkout the exact base source with LF bytes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        path: windows-development-${{ github.run_id }}-${{ github.run_attempt }}
        persist-credentials: false
        clean: false
    - name: Decode reviewed Windows transport 1 of 8
      shell: cmd
      run: 'if exist "%PATCH_DIR%" exit /b 1


        mkdir "%PATCH_DIR%"


        if errorlevel 1 exit /b 1


        echo >"%PATCH_DIR%\bootstrap.transfer-lines"


        if errorlevel 1 exit /b 1


        echo >>"%PATCH_DIR%\bootstrap.transfer-lines"


        if errorlevel 1 exit /b 1


        echo >>"%PATCH_DIR%\bootstrap.transfer-lines"


        if errorlevel 1 exit /b 1


        py -3 -c "import pathlib,os,base64,zlib,hashlib; p=pathlib.Path(os.environ[''PATCH_DIR'']); b=b''''.join((p/''bootstrap.transfer-lines'').read_bytes().splitlines());
        assert hashlib.sha256(b).hexdigest()==''3d1d7861f2871e41d70f9567b52ecaa95bbe84f63a841011cdd26b72af045d3d''; r=zlib.decompress(base64.b64decode(b,validate=True));
        assert hashlib.sha256(r).hexdigest()==''a2251e94fcffe372d340114b98d571ce25d55cdcfc45faf97cc54a1e31e26bdc''; (p/''windows-full-development.py'').write_bytes(r)"


        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 2 of 8
      shell: cmd
      run: 'echo >"%PATCH_DIR%\workspace-portability.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\workspace-portability.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\workspace-portability.transfer-lines"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os,hashlib; p=pathlib.Path(os.environ[''PATCH_DIR'']); b=b''''.join((p/''workspace-portability.transfer-lines'').read_bytes().splitlines());
        assert hashlib.sha256(b).hexdigest()==''70ded08d0247aa7b1dfa8a07f66dffb67414ddaad40f2251ed586300fd01718f''; (p/''workspace-portability.b64'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 3 of 8
      shell: cmd
      run: 'echo >"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 4 of 8
      shell: cmd
      run: 'echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 5 of 8
      shell: cmd
      run: 'echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\owner-windows-policy.transfer-lines"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os,hashlib; p=pathlib.Path(os.environ[''PATCH_DIR'']); b=b''''.join((p/''owner-windows-policy.transfer-lines'').read_bytes().splitlines());
        assert hashlib.sha256(b).hexdigest()==''334e8bf666694b0824f8018a22aa567982a063b5fee4f7e9786e260fcf23478c''; (p/''owner-windows-policy.b64'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 6 of 8
      shell: cmd
      run: 'echo >"%PATCH_DIR%\debug-fixture-replacement.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\debug-fixture-replacement.transfer-lines"

        if errorlevel 1 exit /b 1

        echo >>"%PATCH_DIR%\debug-fixture-replacement.transfer-lines"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os,hashlib; p=pathlib.Path(os.environ[''PATCH_DIR'']); b=b''''.join((p/''debug-fixture-replacement.transfer-lines'').read_bytes().splitlines());
        assert hashlib.sha256(b).hexdigest()==''7400279c0fd9c7662db47e4f87daca39d128946d33a74027e7d7e0209079f8bb''; (p/''debug-fixture-replacement.b64'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Decode reviewed Windows transport 7 of 8
      shell: cmd
      run: 'echo >"%PATCH_DIR%\observed-host-fixes.transfer-lines"


        if errorlevel 1 exit /b 1


        echo >>"%PATCH_DIR%\observed-host-fixes.transfer-lines"


        if errorlevel 1 exit /b 1


        py -3 -c "import pathlib,os,base64,zlib,hashlib; p=pathlib.Path(os.environ[''PATCH_DIR'']); b=b''''.join((p/''observed-host-fixes.transfer-lines'').read_bytes().splitlines());
        assert hashlib.sha256(b).hexdigest()==''f389b4bf8a8ef41e25f140e97f2198573d3e1f67569f3e512c62a164c01b0c74''; (p/''observed-host-fixes.b64'').write_bytes(b)"


        if errorlevel 1 exit /b 1'
    - name: Finish exact reviewed transport and manifest verification
      shell: cmd
      run: 'py -3 -c "import pathlib,os,base64,hashlib; b=base64.b64decode('''',validate=True);
        assert hashlib.sha256(b).hexdigest()==''7e5e4b6a49c3b7e7dcd02964be1e86d6b397880777d07ab872892763e8a89a82''; (pathlib.Path(os.environ[''PATCH_DIR''])/''patch-manifest.json'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
      id: setup
    - name: Apply patches on Windows and perform every host and Android build check
      id: work
      timeout-minutes: 210
      shell: cmd
      run: 'py -3 "%PATCH_DIR%\windows-full-development.py" control --manifest "%PATCH_DIR%\patch-manifest.json"

        if errorlevel 1 exit /b 1'
    - name: Preserve exact Windows sources, logs, test reports and built APKs
      id: export
      if: always() && steps.setup.outcome == 'success'
      shell: cmd
      run: 'py -3 "%PATCH_DIR%\windows-full-development.py" export

        if errorlevel 1 exit /b 1'
    - name: Require the same empty private return draft
      id: evidence_prepare
      if: always() && steps.export.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight
          return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always() && steps.evidence_prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
  collect:
    name: Return exact Windows source/build evidence to Timeweb storage
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9415007;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItaYR3yYmfPA7lJwNgOBGMr0Tu/ioG+Zarm+Utc33z0\"\
        \n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"server\"]\n    assert\
        \ server[\"name\"]==\"Analyst AI PRO\" and server[\"project_id\"]==2941515 and server[\"availability_zone\"]==\"ams-1\"\
        \ and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"analyst-ams-admin-\"\
        ,dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nimport re\nrun=os.environ[\"GITHUB_RUN_ID\"];attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"\
        ]\nexpected=os.environ[\"TRANSFER_SHA256\"]\nassert re.fullmatch(r\"[1-9]\\d{0,19}\",run) and re.fullmatch(r\"[1-9]\\\
        d{0,4}\",attempt)\nassert re.fullmatch(r\"[a-f0-9]{64}\",expected)\nblob=(pathlib.Path(os.environ[\"RUNNER_TEMP\"\
        ])/\"ci-handoff.zip\").read_bytes()\nassert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected\n\
        remote_script=r\"\"\"import pathlib,sys,hashlib,json,os,pwd,stat\ndata=sys.stdin.buffer.read(512*1024**2+1)\nassert\
        \ len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH\nparent=pathlib.Path('/var/lib/analyst-ai-build/incoming')\n\
        account=pwd.getpwnam('analyst-build')\nif not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)\n\
        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\n\
        destination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n\
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\n\
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows\
        \ laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\\
        n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\
        \"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"\
        FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\n\
        with_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require Windows check/build and private transfer success
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required Windows check/build or private transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Windows\
        \ checks/build completed; Android runtime, publication and phone validation remain separate.\""
