name: N00 verify preserved APK38 on Windows API37 4KB and 16KB
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-development.yml
permissions:
  contents: read
concurrency:
  group: analyst-windows-n00-runtime
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify the existing private return transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      baseline_archive_sha256: ${{ steps.baseline_upload.outputs.archive_sha256 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Create and verify one private run-owned transfer
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const helper=require(''./.github/scripts/ci_private_transfer.cjs'');

          await helper({github,context,core,command:''prepare''});

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one preflight-owned private draft is required'');

          const release=helper.owned(matches[0],identity);

          if(release.assets.length!==0) throw new Error(''Preflight draft must be empty'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.setOutput(''release_id'',String(release.id));'
    - name: Transport the public exact APK37 baseline without executing app code
      run: "python3 - <<'PYCODE'\nimport pathlib,os,urllib.request,hashlib,zipfile,json\nsha='1c91b77a8c86453b60ff2340723f3280f64b6e34769ecc984b4663499bb9aa74'\n\
        class NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):return None\n\
        url='https://analyst-ai-2941515.twc1.net/client/apk/Analyst-AI-37-'+sha+'.apk'\nwith urllib.request.build_opener(NoRedirect()).open(url,timeout=90)\
        \ as response:\n    assert response.status==200 and response.headers.get_content_type()=='application/vnd.android.package-archive'\n\
        \    data=response.read(29820367)\nassert len(data)==29820366 and hashlib.sha256(data).hexdigest()==sha\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'ci-handoff.zip'\n\
        with zipfile.ZipFile(path,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:z.writestr('previous37.apk',data)\n\
        print('EXACT_APK37_BASELINE_TRANSPORT='+json.dumps({'apk_sha256':sha,'apk_bytes':len(data),'zip_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'zip_bytes':path.stat().st_size}))\n\
        PYCODE"
    - name: Transfer verified baseline through the owned private draft
      id: baseline_upload
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github,context,core,command:'upload'});
  develop:
    name: Verify exact APK38 with the original full Android assertions
    needs: preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 110
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
    env:
      SOURCE_ROOT: ${{ github.workspace }}/windows-n00-${{ github.run_id }}-${{ github.run_attempt }}
      ANDROID_SDK_ROOT: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      ANDROID_HOME: C:\actions-runner-2\_work\_tool\AndroidSdk\sdk
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      BASELINE_ARCHIVE_SHA256: ${{ needs.preflight.outputs.baseline_archive_sha256 }}
    steps:
    - name: Require the authorized laptop and a new owned checkout
      shell: cmd
      run: 'py -3 -c "import os,sys,pathlib; assert sys.platform==''win32'' and os.environ.get(''COMPUTERNAME'')==''LAPTOP-NPSGA016'';
        assert sys.version_info[:3]==(3,14,6); p=pathlib.Path(os.environ[''SOURCE_ROOT'']); assert not p.exists() and not
        p.is_symlink()"

        if errorlevel 1 exit /b 1'
    - name: Copy the locally verified exact Git checkout without network or hardlinks
      shell: cmd
      run: 'py -3 -c "import pathlib,os,subprocess; src=pathlib.Path(r''C:\actions-runner-2\_work\omni-cio-gateway\omni-cio-gateway\windows-n00-40224242429-1'');
        dst=pathlib.Path(os.environ[''SOURCE_ROOT'']); assert not dst.exists(); assert subprocess.check_output([''git'',''-C'',str(src),''rev-parse'',''HEAD''],text=True,timeout=30).strip()==''d83349eb43cde10bd009c86705748f9f2e330f06'';
        subprocess.run([''git'',''clone'',''--local'',''--no-hardlinks'',''--no-checkout'',str(src),str(dst)],check=True,timeout=120);
        subprocess.run([''git'',''-C'',str(dst),''checkout'',''--detach'',''d83349eb43cde10bd009c86705748f9f2e330f06''],check=True,timeout=120)"

        if errorlevel 1 exit /b 1'
    - name: Receive the exact baseline through GitHub transport
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.preflight.outputs.baseline_archive_sha256 }}
      with:
        script: await require(require('node:path').join(process.env.SOURCE_ROOT,'.github/scripts/ci_private_transfer.cjs'))({github,context,core,command:'download'});
    - name: Prepare reviewed bounded runtime wrapper
      shell: cmd
      run: 'py -3 -c "import pathlib,os; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''n00-runtime.b64''; p.write_text('''',encoding=''ascii'')"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''n00-runtime.b64''; p.open(''a'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''n00-runtime.b64''; p.open(''a'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "import pathlib,os,base64,zlib,hashlib; p=pathlib.Path(os.environ[''RUNNER_TEMP'']); b=zlib.decompress(base64.b64decode((p/''n00-runtime.b64'').read_bytes(),validate=True));
        assert hashlib.sha256(b).hexdigest()==''b659775c600b07446d11448f9ac29575d12db6fe936c78a0b8aeb3e0f70b026f''; (p/''n00-runtime.py'').write_bytes(b)"

        if errorlevel 1 exit /b 1'
    - name: Verify exact preserved APKs, baseline and shared SDK
      id: prepare_inputs
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" prepare

        if errorlevel 1 exit /b 1'
    - name: Remove the verified input asset and retain the same private return draft
      id: baseline_remove
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.preflight.outputs.baseline_archive_sha256 }}
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const helper=require(path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs''));

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(x=>x.tag_name===identity.tag);

          if(matches.length!==1)throw new Error(''Exactly one owned private input draft required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID||release.assets.length!==1)throw new Error(''Private input
          ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          const file=path.join(process.env.RUNNER_TEMP,''ci-handoff.zip''),bytes=fs.readFileSync(file);

          if(bytes.length>32*1024*1024||crypto.createHash(''sha256'').update(bytes).digest(''hex'')!==process.env.TRANSFER_SHA256)throw
          new Error(''Downloaded input changed'');

          const asset=release.assets[0];

          if(!Number.isSafeInteger(asset.id)||asset.id<=0||asset.state!==''uploaded''||asset.size!==bytes.length)throw new
          Error(''Wrong owned input asset'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/assets/''+asset.id,fetch);

          const remote=Buffer.from((await github.rest.repos.getReleaseAsset({...context.repo,asset_id:asset.id,headers:{accept:''application/octet-stream''}})).data);

          if(remote.length!==bytes.length||crypto.createHash(''sha256'').update(remote).digest(''hex'')!==process.env.TRANSFER_SHA256)throw
          new Error(''Remote input changed'');

          const current=helper.owned((await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data,identity);

          if(current.assets.length!==1||current.assets[0].id!==asset.id||current.assets[0].size!==asset.size)throw new Error(''Input
          identity changed before removal'');

          await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:asset.id});

          const empty=helper.owned((await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data,identity);

          if(empty.assets.length!==0)throw new Error(''Input removal not confirmed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          if(crypto.createHash(''sha256'').update(fs.readFileSync(file)).digest(''hex'')!==process.env.TRANSFER_SHA256)throw
          new Error(''Local input changed before removal'');

          fs.unlinkSync(file);

          core.info(''N00_VERIFIED_INPUT_REMOVED_DRAFT_RETAINED=''+JSON.stringify({release_id:release.id,anonymous_access:false}));'
    - name: Full Android 17 runtime with 16 KB pages
      id: runtime16
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" 16384

        if errorlevel 1 exit /b 1'
      if: always() && steps.prepare_inputs.outcome == 'success' && steps.baseline_remove.outcome == 'success'
    - name: Full Android 17 runtime with 4 KB pages
      id: runtime4
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" 4096

        if errorlevel 1 exit /b 1'
      if: always() && steps.prepare_inputs.outcome == 'success' && steps.baseline_remove.outcome == 'success'
    - name: Preserve exact runtime reports and screenshots
      id: export
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-runtime.py" export

        if errorlevel 1 exit /b 1'
      if: always() && steps.prepare_inputs.outcome == 'success' && steps.baseline_remove.outcome == 'success'
    - name: Require the same empty private return draft
      id: evidence_prepare
      if: always() && steps.export.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight
          return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always() && steps.evidence_prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
  collect:
    name: Return exact Windows source/build evidence to Timeweb storage
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"\
        server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"\
        availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nimport re\nrun=os.environ[\"GITHUB_RUN_ID\"];attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"\
        ]\nexpected=os.environ[\"TRANSFER_SHA256\"]\nassert re.fullmatch(r\"[1-9]\\d{0,19}\",run) and re.fullmatch(r\"[1-9]\\\
        d{0,4}\",attempt)\nassert re.fullmatch(r\"[a-f0-9]{64}\",expected)\nblob=(pathlib.Path(os.environ[\"RUNNER_TEMP\"\
        ])/\"ci-handoff.zip\").read_bytes()\nassert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected\n\
        remote_script=r\"\"\"import pathlib,sys,hashlib,json,os,pwd,stat\ndata=sys.stdin.buffer.read(512*1024**2+1)\nassert\
        \ len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH\nparent=pathlib.Path('/var/lib/analyst-ai-build/incoming')\n\
        account=pwd.getpwnam('analyst-build')\nif not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)\n\
        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\n\
        destination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n\
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\n\
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows\
        \ laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\\
        n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\
        \"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"\
        FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\n\
        with_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require both runtime profiles and evidence transport
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required runtime or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Both exact APK38\
        \ emulator profiles passed; Linux and phone checks remain separate.\"\n"
