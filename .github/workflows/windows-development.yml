        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\n\
        destination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n\
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\n\
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows\
        \ laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\\
        n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\
        \"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"\
        FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\n\
        with_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require complete laptop check build and preserved evidence
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required local Linux verification or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho\
        \ \"Local Linux backend checks and evidence transport passed; Android and phone checks are separate.\"\n"
