name: V10 WP22A Phase 4 Public Acceptance

# Historical one-shot synthetic-preview acceptance gate. Phase 4 is accepted.
# Live status/governance/test changes use permanent repository guards; they must
# not re-probe an old hosted release against each later pull-request base SHA.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/architecture/V10_WP22A_PHASE4_ACCEPTANCE_EVIDENCE.json"
      - "docs/architecture/V10_WP22A_PHASE4_ACCEPTANCE_EVIDENCE.md"

permissions:
  contents: read

concurrency:
  group: v10-wp22a-phase4-public-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase4-public-acceptance:
    name: WP22A Phase 4 public acceptance gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local credential.helper ""
          git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git checkout --detach "$EXPECTED_HEAD"
          git config --local --unset-all credential.helper
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner Python
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 20

      - name: Verify exact checked-out head and accepted runtime base binding
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(
              Path('docs/architecture/V10_WP22A_PHASE4_ACCEPTANCE_EVIDENCE.json')
              .read_text(encoding='utf-8')
          )
          if payload['accepted_runtime_main_binding'] != 'github.event.pull_request.base.sha':
              raise SystemExit('Phase-4 acceptance evidence lost PR-base binding')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['PR_BASE_SHA']):
              raise SystemExit('PR base SHA is not a canonical commit identifier')
          print('PHASE4_ACCEPTED_RUNTIME_BASE_BINDING=PASS')
          PY

      - name: Compile public acceptance probe
        run: |
          python -m py_compile scripts\check_v10_wp22a_phase4_public_acceptance.py
          if errorlevel 1 exit /b 30

      - name: Probe exact public Render preview without secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('docs/architecture/V10_WP22A_PHASE4_ACCEPTANCE_EVIDENCE.json')
              .read_text(encoding='utf-8')
          )
          print(payload['public_preview_url'])
          PY
          )"
          python scripts/check_v10_wp22a_phase4_public_acceptance.py \
            --base-url "$BASE_URL" \
            --expected-sha "$PR_BASE_SHA" \
            --attempts 8 \
            --delay-seconds 10 \
            --timeout-seconds 20

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          fi
