# ARCHIVE-IN-PLACE historical WP22A Phase-4 Render/Neon acceptance workflow.
# Amendment 18 removes Render/Neon from current V10 provider authority.
# Historical source/evidence remains reviewable, but this workflow is manual-only
# and hard-disabled so it cannot probe a retired V10 provider.
name: V10 WP22A Phase 4 Public Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp22a-phase4-public-acceptance-retired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-phase4-public-acceptance:
    name: Historical Phase-4 Render acceptance is retired
    if: ${{ false }}
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Refuse retired V10 Render acceptance probing
        shell: cmd
        run: |
          @echo off
          echo LEGACY_WP22A_PHASE4_RENDER_ACCEPTANCE_RETIRED_AMENDMENT_18
          echo Historical evidence remains in source; no retired V10 provider probe is authorized.
          exit /b 80
