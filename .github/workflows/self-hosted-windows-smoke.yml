name: Self-Hosted Windows CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows runner smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner and Git
        shell: cmd
        run: |
          @echo off
          if not "%RUNNER_OS%"=="Windows" exit /b 1
          if not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist .git exit /b 1
          git --version
          echo Runner identity intentionally not logged.
          echo Runner OS verified: %RUNNER_OS%
          echo Runner architecture: %RUNNER_ARCH%

      - name: Bootstrap isolated Python 3.12.10
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Verify Python and workspace
        shell: cmd
        run: |
          @echo off
          python -c "import pathlib, sys; assert sys.version_info[:3] == (3, 12, 10); assert pathlib.Path('pyproject.toml').is_file(); print(sys.version)"
          git status --short

      - name: Clean workspace
        if: always()
        shell: cmd
        run: |
          @echo off
          git reset --hard HEAD
          git clean -ffdx

  authoritative:
    name: V10 authoritative merge gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      TINVEST_TOKEN: regression-test-tinvest-token # pragma: allowlist secret
      GATEWAY_API_KEY: regression-test-gateway-key # pragma: allowlist secret
      RENDER_EXTERNAL_URL: https://omni-cio-gateway.onrender.com
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify OWNER runner identity without raw identity disclosure
        shell: cmd
        run: |
          @echo off
          if not "%RUNNER_OS%"=="Windows" exit /b 1
          if not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist .git exit /b 1
          git --version
          echo Runner identity intentionally not logged.

      - name: Bootstrap protected Python 3.12.10 runtime
        shell: cmd
        run: scripts\bootstrap_windows_ci_python.cmd

      - name: Collect privacy-safe WP5 OWNER node profile
        if: startsWith(github.head_ref, 'v10/wp5-') || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          @echo off
          set "PROFILE=%RUNNER_TEMP%\owner-node-profile.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\collect_owner_node_profile.ps1 -OutputPath "%PROFILE%"
          if errorlevel 1 exit /b %errorlevel%
          echo WP5_NODE_PROFILE_PATH=%PROFILE%>>"%GITHUB_ENV%"

      - name: Apply sanitized WP5 OWNER physical evidence
        if: startsWith(github.head_ref, 'v10/wp5-') || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          @echo off
          python scripts\apply_v10_node_owner_evidence.py "%WP5_NODE_PROFILE_PATH%" docs\architecture\V10_WP5_OWNER_PHYSICAL_EVIDENCE.json --thresholds infrastructure\windows\wp5_node_thresholds.json
          if errorlevel 1 exit /b %errorlevel%

      - name: Assess and validate WP5 OWNER node profile
        if: startsWith(github.head_ref, 'v10/wp5-') || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          @echo off
          python scripts\assess_v10_node_profile.py "%WP5_NODE_PROFILE_PATH%" --thresholds infrastructure\windows\wp5_node_thresholds.json
          if errorlevel 1 exit /b %errorlevel%
          python scripts\validate_v10_node_profile.py "%WP5_NODE_PROFILE_PATH%" --thresholds infrastructure\windows\wp5_node_thresholds.json
          if errorlevel 1 exit /b %errorlevel%
          python -c "import json, os; p=os.environ['WP5_NODE_PROFILE_PATH']; print('WP5_OWNER_NODE_PROFILE_JSON='+json.dumps(json.load(open(p, encoding='utf-8')), separators=(',', ':'), sort_keys=True))"
          if errorlevel 1 exit /b %errorlevel%

      - name: Create isolated protected-runtime environment
        run: |
          VENV_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          VENV_PATH="$VENV_ROOT/omni-cio-authoritative-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$VENV_PATH"
          python -m venv "$VENV_PATH"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$VENV_PATH/Scripts")" >> "$GITHUB_PATH"
          "$VENV_PATH/Scripts/python.exe" -m pip --version

      - name: Build strict Windows dependency projections
        run: |
          python scripts/windows_ci_lock.py project requirements-dev.txt windows-requirements-dev.txt
          python scripts/windows_ci_lock.py project requirements.txt windows-requirements.txt

      - name: Install hash-locked protected-runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r windows-requirements-dev.txt

      - name: Verify lock files are current
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --constraint=requirements.txt \
            --output-file=windows-compiled-requirements.txt \
            requirements.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --quiet \
            --constraint=requirements-dev.txt \
            --output-file=windows-compiled-requirements-dev.txt \
            requirements-dev.in
          python scripts/windows_ci_lock.py verify requirements.txt windows-compiled-requirements.txt
          python scripts/windows_ci_lock.py verify requirements-dev.txt windows-compiled-requirements-dev.txt

      - name: Verify repository and CI policy contracts
        run: |
          python scripts/check_ci_security_baseline.py
          python scripts/check_repository_layout.py
          python scripts/check_v10_repository_boundaries.py
          python scripts/check_v10_toolchain_baseline.py
          python scripts/check_v10_regression_shield.py
          python scripts/check_v10_wp6_privilege_boundary.py

      - name: Compile protected runtime and Core
        run: >-
          python -m compileall -q app.py app_v371.py app_v360.py main.py
          portfolio_market.py portfolio_analytics.py cash_liquidity.py
          purchase_capacity.py purchase_capacity_integrity.py
          operations_analytics.py broker_report_reconciliation omni_cio tests scripts

      - name: Run protected runtime static quality
        run: |
          python -m ruff check .
          python -m ruff format --check \
            scripts tests/test_ci_security_baseline.py \
            tests/test_v10_repository_boundaries.py \
            tests/test_v10_toolchain_baseline.py \
            tests/test_v10_regression_shield.py
          python -m mypy

      - name: Verify stable gateway entrypoint
        run: |
          python - <<'PY'
          import app
          from fastapi.testclient import TestClient

          assert app.app.version == "3.10.0"
          assert app.app is app.base.app
          assert app.ENTRYPOINT == "app:app"
          health = TestClient(app.app).get("/health")
          assert health.status_code == 200
          payload = health.json()
          assert payload["trading_methods"] is False
          print("app:app protected runtime OK", payload["version"])
          PY

      - name: Verify read-only GPT Actions release contract
        run: python scripts/check_read_only_release_contract.py

      - name: Run protected Regression Shield with coverage
        run: >-
          python -m pytest -q
          --junitxml=pytest-results.xml
          --cov=app
          --cov=main
          --cov=portfolio_market
          --cov=portfolio_analytics
          --cov=cash_liquidity
          --cov=purchase_capacity
          --cov=purchase_capacity_integrity
          --cov=operations_analytics
          --cov=sdk_order_compat
          --cov=broker_report_reconciliation
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=60

      - name: Audit protected runtime dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          --disable-pip
          --strict
          --vulnerability-service osv
          --progress-spinner off
          -r windows-requirements.txt

      - name: Run protected SAST
        run: python -m bandit -c pyproject.toml -r . -ll -ii -q

      - name: Scan tracked content for potential secrets
        run: >-
          python -m detect_secrets scan --all-files
          --exclude-files
          '(^|[\\/])(\.git|\.venv|\.venv-ci|\.mypy_cache|\.pytest_cache|\.ruff_cache|__pycache__|requirements(-dev)?\.txt|windows-.*requirements.*\.txt|coverage\.xml|pytest-results\.xml)([\\/]|$)'
          | python scripts/check_ci_security_baseline.py --detect-secrets-report

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoritative-merge-gate-diagnostics
          path: |
            pytest-results.xml
            coverage.xml
            windows-compiled-requirements.txt
            windows-compiled-requirements-dev.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Clean self-hosted workspace
        if: always()
        run: |
          if [ -n "${VENV_PATH:-}" ]; then rm -rf "$VENV_PATH"; fi
          git reset --hard HEAD
          git clean -ffdx
