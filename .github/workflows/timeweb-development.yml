        : PROVIDER, \"checked_at\": now.isoformat(), \"state\": \"available\" if mapped == len(items) and not missing else \"partial\",\\\\n        \"items\": items,\
        \ \"eligible_identifiers\": len(items), \"mapped_identifiers\": mapped,\\\\n        \"missing_identifiers\": missing, \"identifiers_visited\": visited, \"\
