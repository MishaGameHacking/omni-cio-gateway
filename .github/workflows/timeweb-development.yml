        \ position_count, metadata_count = _collect_metadata(user, dashboard, checkpoint, progress)\\\\n    snapshot = normalize_snapshot(user, dashboard, metadata)\\\
        \\n    snapshot[\"snapshot_id\"] = digest({key: snapshot[key] for key in (\"capital\", \"as_of\", \"positions\", \"position_coverage\")})\\\\n    finish =\
        \ min(requested_finish, datetime.fromisoformat(snapshot[\"as_of\"]))\\\\n    operations, operation_sources, operations_complete = _collect_operations(user,\
        \ snapshot, begin, finish, checkpoint, progress)\\\\n    payout_rows, payout_sources, payouts_complete = _payment_events(user, snapshot, checkpoint, progress)\\\
        \\n    payout_rows.extend(_received_payout_events(operations))\\\\n    _collect_market_events(user, checkpoint, progress)\\\\n    snapshot.update(attribution=attribution(user,\
        \ snapshot, operations, operations_complete, begin, finish),\\\\n                    payouts={\"items\": sorted(payout_rows, key=lambda r: str(r.get(\"date\"\
        )), reverse=True), \"complete\": payouts_complete and operations_complete,\\\\n                             \"received_range\": {\"start\": begin.isoformat(),\
        \ \"end\": finish.isoformat()}, \"announced_and_received_are_distinct\": True},\\\\n                    operations={\"items\": operations, \"complete\": operations_complete,\
        \ \"start\": begin.isoformat(), \"end\": finish.isoformat()},\\\\n                    events={\"items\": _held_news(snapshot, checkpoint[\"news\"])}, news=checkpoint[\"\
        news\"], calendar=checkpoint[\"calendar\"])\\\\n    snapshot[\"sources\"] += operation_sources + payout_sources + checkpoint[\"news\"].get(\"sources\", [])\
        \ + checkpoint[\"calendar\"].get(\"sources\", [])\\\\n    snapshot[\"collection\"] = {\"all_positions_retained\": True, \"total_positions\": position_count,\\\
        \\n                              \"metadata_available\": sum(not v.get(\"_unavailable\") for v in metadata.values()),\\\\n                              \"\
