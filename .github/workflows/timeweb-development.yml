        )\\\\n    sections[\"notifications\"] = section(notifications.preferences_data(int(user[\"id\"])), as_of=now_iso())\\\\n    return {\"schema_version\": 1,\
        \ \"snapshot_id\": (snapshot or {}).get(\"snapshot_id\"), \"as_of\": observed, \"currency\": currency,\\\\n            \"sections\": sections, \"sources\"\
        : (snapshot or {}).get(\"sources\", []), \"collection\": (snapshot or {}).get(\"collection\"),\\\\n            \"capabilities\": {\"read_only_broker\": True,\
        \ \"refresh_requires_explicit_job\": True, \"chat\": True,\\\\n                             \"strategy_confirmation\": True, \"notification_channel\": \"\
        app_poll\", \"push_delivery\": False,\\\\n                             \"frame_network_requests\": False}, \"requested_range\": {\"start\": str(start) if\
        \ start else None, \"end\": str(end) if end else None}}\\\\n\\\\n\\\\n@router.get(\"/operations/{account_id}/{operation_id}/position\", responses=HTTP_ERRORS)\\\
        \\ndef operation_position(account_id: str, operation_id: str, user: Annotated[Any, Depends(backend.current_user)]) -> dict:\\\\n    snapshot = state.saved_snapshot(user)\\\
        \\n    operation = next((row for row in (snapshot or {}).get(\"operations\", {}).get(\"items\", []) if row[\"account_id\"] == account_id and row[\"id\"] ==\
        \ operation_id), None)\\\\n    if operation is None:\\\\n        raise HTTPException(404, \"operation_not_in_workspace\")\\\\n    uid = operation.get(\"instrumentUid\"\
        )\\\\n    held = [p for p in (snapshot or {}).get(\"positions\", []) if p[\"account_id\"] == account_id and p[\"instrument_uid\"] == uid]\\\\n    return {\"\
        operation\": operation, \"position_ref\": operation[\"position_ref\"], \"positions\": held,\\\\n            \"relationship\": \"broker_instrument_uid\", \"\
        as_of\": (snapshot or {}).get(\"as_of\")}\\\\n\\\\n\\\\ndef _record_concentration_changes(db, user_id, snapshot, active, old_breaches, new_breaches, all_current,\
        \ complete_axes):\\\\n    for key in new_breaches.keys() | old_breaches.keys():\\\\n        before, after = old_breaches.get(key), new_breaches.get(key)\\\
        \\n        if before is not None and after is not None and before[\"share_percent\"] == after[\"share_percent\"]:\\\\n            continue\\\\n        details_row\
        \ = after or before\\\\n        # An incomplete aggregate may fall below its limit only because a\\\\n        # position lost its valuation/identity. That\
