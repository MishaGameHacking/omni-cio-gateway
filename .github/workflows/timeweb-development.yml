        : notifications.schedule_slots(user_id), \"jobs\": user_jobs(user_id),\\\\n            \"budget\": MoneyLedger(backend.connect).user_summary(user_id), \"\
        readiness\": readiness, \"analysis_diff\": diff}\\\\n\\\\n\\\\n@router.get(\"/cash-ledger\", responses=HTTP_ERRORS)\\\\ndef cash_ledger_status(user: Annotated[Any,\
        \ Depends(backend.current_user)],\\\\n                       currency: Literal[\"RUB\", \"USD\", \"EUR\"] = \"RUB\") -> dict:\\\\n    snapshot = state.saved_snapshot(user,\
