        \ public_sources.snapshot_status(state.saved_snapshot(user, currency))\\\\n\\\\n\\\\n@router.get(\"\", responses=HTTP_ERRORS)\\\\ndef workspace(currency:\
        \ Literal[\"RUB\", \"USD\", \"EUR\"] = \"RUB\", start: date | None = None, end: date | None = None,\\\\n              *, user: Annotated[Any, Depends(backend.current_user)])\
        \ -> dict:\\\\n    snapshot = state.saved_snapshot(user, currency)\\\\n    observed = (snapshot or {}).get(\"as_of\")\\\\n    stale = observed is not None\
        \ and (datetime.now(timezone.utc) - datetime.fromisoformat(observed)).total_seconds() > 900\\\\n    missing = \"workspace_refresh_required\" if user[\"tinvest_token_encrypted\"\
        ] else \"tinvest_not_connected\"\\\\n    base_state, reason = _snapshot_state(snapshot, stale, missing)\\\\n    sections = _snapshot_sections(snapshot, observed,\
        \ base_state, reason)\\\\n    active = state.active_strategy(int(user[\"id\"]))\\\\n    exposures = state.exposure_data(snapshot, (active or {}).get(\"config\"\
        ))\\\\n    exposure_state = \"partial\" if snapshot and any(not axis[\"complete\"] for axis in exposures[\"axes\"]) else base_state\\\\n    sections[\"exposures\"\
        ] = section({\"axes\": exposures[\"axes\"]}, state=exposure_state, reason=reason or (\"identity_or_valuation_coverage_incomplete\" if exposure_state == \"\
        partial\" else None), as_of=observed)\\\\n    sections[\"goals\"] = section(state.goal_data(user), as_of=observed)\\\\n    sections[\"risks\"] = section(state.risk_data(user,\
        \ currency), state=base_state, reason=reason, as_of=observed)\\\\n    sections[\"ai\"] = section(ai_data(user), as_of=now_iso())\\\\n    sections[\"strategy\"\
