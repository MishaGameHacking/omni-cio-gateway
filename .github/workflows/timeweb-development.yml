        \ _due_identifiers(connect, identifiers: list[str], now: datetime, cursor: str | None) -> tuple[dict, list[str]]:\\\\n    \"\"\"Read persistent freshness\
        \ once; a replaced snapshot cannot starve the tail.\"\"\"\\\\n    results, stored, due = {}, {}, []\\\\n    try:\\\\n        with closing(connect()) as db:\\\
