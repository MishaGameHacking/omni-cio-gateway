        \ only breaks equal-time ties.\\\\n    return results, [row[3] for row in sorted(due)]\\\\n\\\\n\\\\ndef collect_snapshot_sources(connect, snapshot: dict,\
        \ checkpoint: dict, progress, *,\\\\n                             at: datetime | None = None, fetch=None) -> dict:\\\\n    \"\"\"A bounded sub-lane of the\
