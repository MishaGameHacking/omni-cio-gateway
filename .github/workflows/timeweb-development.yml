name: Verify autonomous portfolio backend candidate on Timeweb
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-development.yml
permissions:
  contents: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
    - name: Read the existing pinned administrative SSH transport
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Execute candidate regression and full backend tests on Timeweb
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\nsys.path[:0]=[\".transport-admin/deploy\"\
        ,\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\n\
        def api(method,path,body=None):\n    req=urllib.request.Request(\"https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if raw else {}\n    except urllib.error.HTTPError\
        \ as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"\
        83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g\"\n    status,data=api(\"GET\"\
        ,\"/servers/\"+str(sid));assert status==200\n    server=data[\"server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"\
        ]==2941515 and server[\"availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"client\");public=(folder/\"\
        client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\",{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"\
        ],\"body\":public,\"is_default\":False})\n        key=created.get(\"ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int\
        \ and key[\"body\"].split()[:2]==public.split()[:2]\n        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"\
        /ssh-keys\",{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\"\
        ]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n\
        \                    if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input is None else binary_input\n\
        \            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"+shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n                print(\"AMS_REMOTE_ERROR=\"\
        +result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n                raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n\
        \        finally:\n            try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n       \
        \     finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\n\
        remote = '\"\"\"Prepare and verify a candidate entirely on the existing Timeweb development VM.\\n\\nCall check_candidate(PATCH_FILES, change_id=\\'public-sources50\\\
        '). Each mapping value\\nis either a UTF-8 source string or {\\'encoding\\': \\'base64\\', \\'content\\': \\'<base64>\\'}.\\nThis factory does not execute\
        \ until called. It never modifies source49 or runtime.\\nOnly an already successful source49 test run\\'s isolated venv may be reused.\\n\"\"\"\\nfrom __future__\
        \ import annotations\\n\\nimport base64\\nimport datetime\\nimport hashlib\\nimport json\\nimport os\\nfrom pathlib import Path, PurePosixPath\\nimport pwd\\\
        nimport re\\nimport stat\\nimport subprocess\\nimport time\\nimport uuid\\nimport xml.etree.ElementTree as ET\\n\\nBASE = Path(\\'/var/lib/analyst-ai-build/development\\\
        ')\\nBASE_SOURCE = BASE / \\'source49\\'\\nBASE_SOURCE_SHA256 = \\'8e4dc044ec6b700469a597cf8fc3a23aae96e57e5b5413e378dbf3986e2cef60\\'\\nBASE_COMPLETE_SHA256\
        \ = \\'743a71819ec89d97467ce72189374a8070dd0fc3c6611710029b48f4feae8c23\\'\\nBACKUP_COMMIT = \\'521d96293a048e4254bec936710bcfbf166b20a0\\'\\nALLOWED_MODULES\
        \ = frozenset({\\'event_monitor.py\\', \\'volume_workspace.py\\', \\'volume_monitor.py\\',\\n                             \\'public_sources.py\\', \\'market_schedule.py\\\
        ', \\'operations_ledger.py\\'})\\nBASELINE_REGRESSIONS = (\\'backend/tests/test_n02_metadata_recovery.py\\',\\n                        \\'backend/tests/test_n02_lane_recovery.py\\\
        ')\\n\\n\\ndef need(condition, code):\\n    if not condition:\\n        raise RuntimeError(code)\\n\\n\\ndef identity(data):\\n    return {\\'bytes\\': len(data),\
        \ \\'sha256\\': hashlib.sha256(data).hexdigest()}\\n\\n\\ndef safe_relative(name):\\n    need(isinstance(name, str) and 0 < len(name) <= 600 and \\'\\\\\\\
        \\\\' not in name and \\':\\' not in name,\\n         \\'invalid_source_path\\')\\n    path = PurePosixPath(name)\\n    need(not path.is_absolute() and path.as_posix()\
        \ == name and\\n         not any(part in (\\'\\', \\'.\\', \\'..\\', \\'.git\\') for part in path.parts), \\'unsafe_source_path\\')\\n    return path\\n\\\
        n\\ndef read_regular(path, maximum=128 * 1024**2, *, root_owned=False):\\n    info = path.lstat()\\n    need(stat.S_ISREG(info.st_mode) and not path.is_symlink()\
        \ and path.resolve(strict=True) == path\\n         and not info.st_mode & 0o022 and info.st_size <= maximum and\\n         (not root_owned or info.st_uid\
        \ == 0), \\'untrusted_file\\')\\n    with path.open(\\'rb\\') as stream:\\n        data = stream.read(maximum + 1)\\n    need(len(data) == info.st_size and\
        \ len(data) <= maximum, \\'file_changed_while_reading\\')\\n    return data\\n\\n\\ndef inventory(files):\\n    code, complete = hashlib.sha256(), hashlib.sha256()\\\
        n    seen = set()\\n    for name, row in sorted(files.items(), key=lambda pair: pair[0].encode(\\'utf-8\\')):\\n        safe_relative(name)\\n        need(name.casefold()\
        \ not in seen and set(row) == {\\'bytes\\', \\'sha256\\'} and\\n             type(row[\\'bytes\\']) is int and 0 <= row[\\'bytes\\'] <= 128 * 1024**2 and\\\
        n             re.fullmatch(\\'[a-f0-9]{64}\\', row[\\'sha256\\']), \\'invalid_source_inventory\\')\\n        seen.add(name.casefold())\\n        record =\
        \ name.encode(\\'utf-8\\') + b\\'\\\\0\\' + row[\\'sha256\\'].encode(\\'ascii\\') + b\\'\\\\0\\'\\n        complete.update(record)\\n        if name not in\
        \ (\\'AGENTS.md\\', \\'README.md\\') and not name.startswith(\\'docs/\\'):\\n            code.update(record)\\n    return {\\'files\\': files, \\'source_sha256\\\
        ': code.hexdigest(), \\'complete_source_sha256\\': complete.hexdigest()}\\n\\n\\ndef baseline_inventory():\\n    path = BASE / \\'source49-restoration.json\\\
        '\\n    value = json.loads(read_regular(path, 8 * 1024**2, root_owned=True))\\n    need(value.get(\\'source_backup_commit\\') == BACKUP_COMMIT, \\'wrong_baseline_backup_commit\\\
        ')\\n    need(isinstance(value.get(\\'files\\'), dict) and len(value[\\'files\\']) == 993, \\'wrong_baseline_file_count\\')\\n    computed = inventory(value[\\\
        'files\\'])\\n    need(computed[\\'source_sha256\\'] == value[\\'source_sha256\\'] == BASE_SOURCE_SHA256 and\\n         computed[\\'complete_source_sha256\\\
        '] == value[\\'complete_source_sha256\\'] == BASE_COMPLETE_SHA256,\\n         \\'baseline_inventory_digest_mismatch\\')\\n    for name, row in value[\\'files\\\
        '].items():\\n        need(identity(read_regular(BASE_SOURCE / safe_relative(name))) == row, \\'source49_changed_after_restoration\\')\\n    return computed\\\
        n\\n\\ndef successful_baseline_venv():\\n    options = []\\n    for path in BASE.glob(\\'source49-check-*/evidence/timeweb-backend-check.json\\'):\\n    \
        \    try:\\n            raw = read_regular(path, 4 * 1024**2, root_owned=True)\\n            report = json.loads(raw)\\n            tests = report.get(\\\
        'tests\\', {})\\n            steps = report.get(\\'steps\\', [])\\n            if not (report.get(\\'status\\') == \\'passed\\' and report.get(\\'server_id\\\
        ') == 9417611\\n                    and report.get(\\'source_directory\\') == str(BASE_SOURCE)\\n                    and report.get(\\'source_sha256\\') ==\
        \ BASE_SOURCE_SHA256\\n                    and report.get(\\'complete_source_sha256\\') == BASE_COMPLETE_SHA256\\n                    and report.get(\\'source_code_executed_on_timeweb\\\
        ') is True\\n                    and report.get(\\'synthetic_test_environment\\') is True\\n                    and report.get(\\'changed_sources\\') == []\\\
        n                    and all(type(tests.get(k)) is int for k in (\\'tests\\', \\'failures\\', \\'errors\\', \\'skipped\\'))\\n                    and tests[\\\
        'tests\\'] > tests[\\'skipped\\'] and tests[\\'failures\\'] == tests[\\'errors\\'] == 0\\n                    and {\\'compile-backend\\', \\'backend-full-suite\\\
        ', \\'health-openapi\\'} <= {s.get(\\'name\\') for s in steps}\\n                    and all(s.get(\\'exit_code\\') == 0 for s in steps)):\\n            \
        \    continue\\n            state = path.parent.parent\\n            venv = state / \\'venv\\'\\n            python = venv / \\'bin/python\\'\\n         \
        \   if venv.is_dir() and not venv.is_symlink() and python.is_file():\\n                options.append((path.stat().st_mtime_ns, str(python), {\\'path\\':\
        \ str(path), **identity(raw)}))\\n        except (OSError, ValueError, RuntimeError, KeyError, TypeError):\\n            continue\\n    need(options, \\'no_successful_source49_baseline_venv_available\\\
        ')\\n    _, python, report_binding = max(options)\\n    return python, report_binding\\n\\n\\ndef decode_patches(values):\\n    need(isinstance(values, dict)\
        \ and 1 <= len(values) <= 40, \\'invalid_patch_count\\')\\n    decoded = {}\\n    for name, value in values.items():\\n        safe_relative(name)\\n    \
        \    allowed = name.startswith(\\'backend/tests/\\') and re.fullmatch(r\\'backend/tests/test_[a-z0-9_]+\\\\.py\\', name)\\n        allowed = allowed or name\
        \ in {\\'backend/\\' + module for module in ALLOWED_MODULES}\\n        need(allowed, \\'patch_outside_reviewed_backend_scope\\')\\n        if isinstance(value,\
        \ str):\\n            raw = value.encode(\\'utf-8\\')\\n        else:\\n            need(isinstance(value, dict) and set(value) == {\\'encoding\\', \\'content\\\
        '}\\n                 and value[\\'encoding\\'] in (\\'base64\\', \\'utf-8\\') and isinstance(value[\\'content\\'], str),\\n                 \\'invalid_patch_encoding\\\
        ')\\n            raw = base64.b64decode(value[\\'content\\'], validate=True) if value[\\'encoding\\'] == \\'base64\\' else value[\\'content\\'].encode(\\\
        'utf-8\\')\\n        need(0 < len(raw) <= 2 * 1024**2 and b\\'\\\\x00\\' not in raw, \\'invalid_patch_content_size\\')\\n        raw.decode(\\'utf-8\\')\\\
        n        decoded[name] = raw\\n    need(all(name in decoded for name in BASELINE_REGRESSIONS), \\'missing_required_n02_regression_files\\')\\n    return decoded\\\
        n\\n\\ndef owned_directory(path, account):\\n    path.mkdir(mode=0o755)\\n    os.chown(path, account.pw_uid, account.pw_gid)\\n\\n\\ndef write_source(root,\
        \ name, data, account, mode=0o644):\\n    target = root / safe_relative(name)\\n    missing, parent = [], target.parent\\n    while not parent.exists():\\\
        n        missing.append(parent)\\n        parent = parent.parent\\n    for folder in reversed(missing):\\n        owned_directory(folder, account)\\n    with\
        \ target.open(\\'xb\\') as stream:\\n        stream.write(data)\\n    target.chmod(mode)\\n    os.chown(target, account.pw_uid, account.pw_gid)\\n\\n\\ndef\
        \ junit_counts(path):\\n    raw = read_regular(path, 32 * 1024**2)\\n    tree = ET.fromstring(raw)\\n    need(tree.tag in (\\'testsuite\\', \\'testsuites\\\
        '), \\'invalid_junit_root\\')\\n    suites = [tree] if tree.tag == \\'testsuite\\' else list(tree.findall(\\'testsuite\\'))\\n    names = (\\'tests\\', \\\
        'failures\\', \\'errors\\', \\'skipped\\')\\n    counters = [{name: int(suite.get(name, \\'0\\')) for name in names} for suite in suites]\\n    need(counters\
        \ and all(value >= 0 for row in counters for value in row.values()),\\n         \\'negative_or_missing_junit_counters\\')\\n    counts = {name: sum(row[name]\
        \ for row in counters) for name in names}\\n    cases = list(tree.iter(\\'testcase\\'))\\n    # pytest\\'s successful unittest subtests contribute to testsuite@tests\
        \ without\\n    # creating an additional testcase element. Preserve both observed counts;\\n    # failure/error/skip counters must still agree with the actual\
        \ XML elements.\\n    need(len(cases) > 0 and counts[\\'tests\\'] >= len(cases), \\'junit_case_count_mismatch\\')\\n    for counter, element in ((\\'failures\\\
        ', \\'failure\\'), (\\'errors\\', \\'error\\'), (\\'skipped\\', \\'skipped\\')):\\n        need(counts[counter] == sum(len(case.findall(element)) for case\
        \ in cases),\\n             \\'junit_\\' + counter + \\'_element_count_mismatch\\')\\n    counts[\\'testcase_elements\\'] = len(cases)\\n    counts[\\'reported_test_excess\\\
        '] = counts[\\'tests\\'] - len(cases)\\n    failures = [case.get(\\'name\\', \\'\\') for case in cases if case.find(\\'failure\\') is not None]\\n    return\
        \ counts, identity(raw), failures\\n\\n\\ndef check_candidate(PATCH_FILES, *, change_id=\\'public-sources50\\', live_smoke_source: str | None = None):\\n\
        \    need(os.getuid() == 0 and re.fullmatch(\\'[a-z0-9][a-z0-9-]{0,63}\\', change_id), \\'invalid_administrative_candidate_request\\')\\n    need(BASE.is_dir()\
        \ and not BASE.is_symlink() and BASE.resolve(strict=True) == BASE, \\'invalid_development_root\\')\\n    account = pwd.getpwnam(\\'analyst-build\\')\\n  \
        \  need(account.pw_uid != 0, \\'test_user_must_be_unprivileged\\')\\n    baseline = baseline_inventory()\\n    python, baseline_report = successful_baseline_venv()\\\
        n    patches = decode_patches(PATCH_FILES)\\n    need(live_smoke_source is None or isinstance(live_smoke_source, str) and\\n         0 < len(live_smoke_source.encode(\\\
        'utf-8\\')) <= 65536 and \\'\\\\x00\\' not in live_smoke_source,\\n         \\'invalid_administrative_live_smoke_source\\')\\n    suffix = datetime.datetime.now(datetime.timezone.utc).strftime(\\\
        '%Y%m%dT%H%M%SZ\\') + \\'-\\' + uuid.uuid4().hex[:8]\\n    candidate = BASE / (\\'candidate-\\' + change_id + \\'-\\' + suffix)\\n    state = BASE / (\\'candidate-check-\\\
        ' + change_id + \\'-\\' + suffix)\\n    owned_directory(candidate, account)\\n    owned_directory(state, account)\\n    state.chmod(0o700)\\n    for name\
        \ in (\\'home\\', \\'tmp\\', \\'evidence\\', \\'pycache\\', \\'baseline-regressions\\'):\\n        owned_directory(state / name, account)\\n        (state\
        \ / name).chmod(0o700)\\n    live_smoke_path = state / \\'public-source-live-smoke.py\\'\\n    if live_smoke_source is not None:\\n        write_source(state,\
        \ live_smoke_path.name, live_smoke_source.encode(\\'utf-8\\'), account, 0o600)\\n    candidate_files = dict(baseline[\\'files\\'])\\n    for name, row in\
        \ baseline[\\'files\\'].items():\\n        original = read_regular(BASE_SOURCE / name)\\n        need(identity(original) == row, \\'baseline_changed_during_copy\\\
        ')\\n        data = patches.get(name, original)\\n        mode = stat.S_IMODE((BASE_SOURCE / name).stat().st_mode)\\n        need(mode in (0o644, 0o755),\
        \ \\'unexpected_baseline_source_mode\\')\\n        write_source(candidate, name, data, account, mode)\\n        candidate_files[name] = identity(data)\\n\
        \    for name, raw in patches.items():\\n        if name not in baseline[\\'files\\']:\\n            write_source(candidate, name, raw, account)\\n      \
        \      candidate_files[name] = identity(raw)\\n    for name in BASELINE_REGRESSIONS:\\n        write_source(state / \\'baseline-regressions\\', Path(name).name,\
        \ patches[name], account)\\n    candidate_inventory = inventory(candidate_files)\\n    inventory_path = state / \\'evidence/candidate-inventory.json\\'\\\
        n    inventory_path.write_text(json.dumps(candidate_inventory, sort_keys=True, indent=2) + \\'\\\\n\\')\\n    inventory_binding = {\\'path\\': str(inventory_path),\
        \ **identity(read_regular(inventory_path))}\\n    env = {\\n        \\'PATH\\': \\'/usr/bin:/bin\\', \\'HOME\\': str(state / \\'home\\'), \\'LANG\\': \\'C.UTF-8\\\
        ',\\n        \\'PYTHONUNBUFFERED\\': \\'1\\', \\'PYTHONNOUSERSITE\\': \\'1\\', \\'PYTHONPYCACHEPREFIX\\': str(state / \\'pycache\\'),\\n        \\'XDG_CONFIG_HOME\\\
        ': str(state / \\'home/.config\\'), \\'XDG_CACHE_HOME\\': str(state / \\'home/.cache\\'),\\n        \\'TMPDIR\\': str(state / \\'tmp\\'), \\'TMP\\': str(state\
        \ / \\'tmp\\'), \\'TEMP\\': str(state / \\'tmp\\'),\\n        \\'TELEGRAM_CLIENT_ID\\': \\'123456\\', \\'TELEGRAM_CLIENT_SECRET\\': \\'test-only\\',\\n  \
        \      \\'BACKEND_PUBLIC_URL\\': \\'https://example.invalid\\',\\n        \\'TELEGRAM_REDIRECT_URI\\': \\'https://example.invalid/auth/telegram/callback\\\
        ',\\n        \\'FERNET_KEY\\': \\'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\\',\\n        \\'DATABASE_PATH\\': str(state / \\'tests.sqlite3\\'), \\'ANALYSIS_SCHEDULER_ENABLED\\\
        ': \\'false\\',\\n        \\'AI_EXTERNAL_PROCESSING_APPROVED\\': \\'false\\', \\'PIP_CONFIG_FILE\\': \\'/dev/null\\',\\n        \\'PIP_DISABLE_PIP_VERSION_CHECK\\\
        ': \\'1\\',\\n    }\\n    report = {\\n        \\'schema\\': 1, \\'status\\': \\'failed\\', \\'server_id\\': 9417611,\\n        \\'source_backup_commit\\\
        ': BACKUP_COMMIT, \\'source_directory\\': str(candidate),\\n        \\'source_sha256\\': candidate_inventory[\\'source_sha256\\'],\\n        \\'complete_source_sha256\\\
        ': candidate_inventory[\\'complete_source_sha256\\'],\\n        \\'source_code_executed_on_timeweb\\': True, \\'synthetic_test_environment\\': True,\\n  \
        \      \\'source_inventory\\': inventory_binding, \\'baseline_test_receipt\\': baseline_report,\\n        \\'dependency_mode\\': \\'reused_successful_isolated_source49_test_venv\\\
        ', \\'test_python\\': python,\\n        \\'evidence_directory\\': str(state / \\'evidence\\'), \\'baseline_source_changed\\': False,\\n        \\'live_source_changed\\\
        ': False, \\'trading_or_ai_enabled\\': False, \\'steps\\': [],\\n        \\'patch_files\\': {name: identity(raw) for name, raw in patches.items()},\\n   \
        \     \\'baseline_regression\\': {\\'steps\\': []},\\n        \\'administrative_live_smoke\\': ({\\'path\\': str(live_smoke_path),\\n                    \
        \                  **identity(live_smoke_source.encode(\\'utf-8\\'))}\\n                                     if live_smoke_source is not None else None),\\\
        n    }\\n\\n    def run(name, arguments, *, cwd=candidate, timeout=900, step_env=None, expected_failure=False, network=False):\\n        log = state / \\\
        'evidence\\' / (name + \\'.log\\')\\n        environment = env if step_env is None else step_env\\n        unit = \\'analyst-candidate-\\' + suffix.lower()\
        \ + \\'-\\' + name\\n        command = [\\'systemd-run\\', \\'--wait\\', \\'--pipe\\', \\'--collect\\', \\'--quiet\\', \\'--unit=\\' + unit,\\n          \
        \         \\'--uid=\\' + str(account.pw_uid), \\'--gid=\\' + str(account.pw_gid),\\n                   \\'--property=WorkingDirectory=\\' + str(cwd),\\n \
        \                  \\'--property=MemoryMax=1G\\', \\'--property=CPUQuota=100%\\', \\'--property=TasksMax=128\\',\\n                   \\'--property=RuntimeMaxSec=\\\
        ' + str(timeout), \\'--property=TimeoutStopSec=10\\',\\n                   \\'--property=NoNewPrivileges=yes\\', \\'--property=ProtectSystem=strict\\',\\\
        n                   \\'--property=ProtectHome=yes\\', \\'--property=PrivateTmp=yes\\',\\n                   \\'--property=PrivateDevices=yes\\', \\'--property=PrivateNetwork=\\\
        ' + (\\'no\\' if network else \\'yes\\'),\\n                   \\'--property=InaccessiblePaths=-/var/lib/analyst-ai -/etc/analyst-ai -/root\\',\\n       \
        \            \\'--property=ReadWritePaths=\\' + str(state),\\n                   \\'/usr/bin/env\\', \\'-i\\', *[key + \\'=\\' + value for key, value in environment.items()],\
        \ *arguments]\\n        print(\\'TIMEWEB_CANDIDATE_STEP=\\' + name, flush=True)\\n        started = time.monotonic()\\n        with log.open(\\'xb\\') as\
        \ output:\\n            result = subprocess.run(command, stdin=subprocess.DEVNULL, stdout=output,\\n                                    stderr=subprocess.STDOUT,\
        \ timeout=timeout + 30)\\n        row = {\\'name\\': name, \\'exit_code\\': result.returncode, \\'seconds\\': round(time.monotonic() - started, 3),\\n   \
        \            \\'log_sha256\\': identity(read_regular(log, 32 * 1024**2))[\\'sha256\\'], \\'network_allowed\\': network}\\n        target = report[\\'baseline_regression\\\
        '][\\'steps\\'] if expected_failure else report[\\'steps\\']\\n        target.append(row)\\n        print(\\'TIMEWEB_CANDIDATE_RESULT=\\' + json.dumps(row),\
        \ flush=True)\\n        if name == \\'public-source-live-smoke\\':\\n            safe_lines = [line for line in log.read_text(errors=\\'replace\\').splitlines()\\\
        n                          if line.startswith(\\'TIMEWEB_PUBLIC_SOURCE_SMOKE=\\')]\\n            if safe_lines:\\n                print(safe_lines[-1][-18000:],\
        \ flush=True)\\n        elif result.returncode or name in (\\'candidate-targeted-tests\\', \\'backend-full-suite\\', \\'health-openapi\\'):\\n           \
        \ print(log.read_text(errors=\\'replace\\')[-18000:], flush=True)\\n        need(result.returncode == (1 if expected_failure else 0),\\n             \\'baseline_did_not_fail_as_expected\\\
