        instrumentType\") != \"cash\"}\\\\n    for index, uid in enumerate(unique):\\\\n        if uid not in metadata:\\\\n            progress(\"collecting_metadata\"\
        , checkpoint, completed=index, total=len(unique))\\\\n            try:\\\\n                metadata[uid] = market.instrument(user, uid)\\\\n            except\
        \ HTTPException:\\\\n                metadata[uid] = {\"_unavailable\": True}\\\\n            progress(\"collecting_metadata\", checkpoint, completed=index\
        \ + 1, total=len(unique))\\\\n    return metadata, len(all_positions), len(unique)\\\\n\\\\n\\\\ndef _merge_operation_page(saved: dict, items: list) -> None:\\\
        \\n    if not isinstance(items, list):\\\\n        raise HTTPException(502, \"operations_response_invalid\")\\\\n    seen = {item[\"id\"]: item for item in\
        \ saved[\"items\"]}\\\\n    for raw in items:\\\\n        if not isinstance(raw, dict) or not raw.get(\"id\"):\\\\n            raise HTTPException(502, \"\
        operation_identity_missing\")\\\\n        item = details.normalize_operation(raw)\\\\n        if item[\"id\"] in seen and seen[item[\"id\"]] != item:\\\\\
        n            raise HTTPException(502, \"operation_conflicting_observations\")\\\\n        if item[\"id\"] not in seen:\\\\n            saved[\"items\"].append(item)\\\
        \\n            seen[item[\"id\"]] = item\\\\n\\\\n\\\\ndef _collect_operation_pages(reader, account_id: str, saved: dict, begin: datetime, finish: datetime,\
        \ checkpoint: dict, progress) -> None:\\\\n    while not saved[\"complete\"] and saved[\"pages\"] < 200:\\\\n        progress(\"collecting_operations\", checkpoint,\
        \ completed=saved[\"pages\"], total=None)\\\\n        raw = reader.read(\"operations\", {\"accountId\": account_id, \"from\": begin.isoformat(), \"to\": finish.isoformat(),\
        \ \"limit\": 1000,\\\\n                                         \"cursor\": saved[\"cursor\"], \"withoutCommissions\": False, \"withoutTrades\": False})\\\
        \\n        _merge_operation_page(saved, raw.get(\"items\", []))\\\\n        saved[\"pages\"] += 1\\\\n        saved[\"as_of\"] = now_iso()\\\\n        if\
        \ not raw.get(\"hasNext\"):\\\\n            saved[\"complete\"] = True\\\\n        else:\\\\n            cursor = str(raw.get(\"nextCursor\") or \"\")\\\\\
        n            if not cursor or cursor == saved[\"cursor\"]:\\\\n                raise HTTPException(502, \"operations_cursor_invalid\")\\\\n            saved[\"\
        cursor\"] = cursor\\\\n        progress(\"collecting_operations\", checkpoint, completed=saved[\"pages\"], total=None)\\\\n\\\\n\\\\ndef _linked_operation(item:\
        \ dict, account_id: str, ref: dict, held: set) -> dict:\\\\n    uid = item.get(\"instrumentUid\")\\\\n    link = {\"account_id\": account_id, \"instrument_uid\"\
        : uid, \"currently_held\": (account_id, uid) in held} if uid else None\\\\n    return {**item, \"account_id\": account_id, \"source_ids\": [ref[\"id\"]],\
        \ \"position_ref\": link}\\\\n\\\\n\\\\ndef _collect_operations(user: Any, snapshot: dict, begin: datetime, finish: datetime, checkpoint: dict, progress)\
        \ -> tuple:\\\\n    operations, operation_sources, operations_complete = [], [], True\\\\n    stored_operations = checkpoint.setdefault(\"operations\", {})\\\
        \\n    held = {(p[\"account_id\"], p[\"instrument_uid\"]) for p in snapshot[\"positions\"]}\\\\n    with details.BrokerReader(user) as reader:\\\\n      \
        \  for account in snapshot[\"accounts\"]:\\\\n            account_id = account[\"id\"]\\\\n            saved = stored_operations.setdefault(account_id, {\"\
        items\": [], \"cursor\": \"\", \"complete\": False, \"pages\": 0})\\\\n            _collect_operation_pages(reader, account_id, saved, begin, finish, checkpoint,\
        \ progress)\\\\n            operations_complete &= saved[\"complete\"]\\\\n            ref = source(\"GetOperationsByCursor\", account_id, saved.get(\"as_of\"\
        , snapshot[\"as_of\"]), ttl=300)\\\\n            operation_sources.append(ref)\\\\n            operations.extend(_linked_operation(item, account_id, ref,\
        \ held) for item in saved[\"items\"])\\\\n    return operations, operation_sources, operations_complete\\\\n\\\\n\\\\ndef _received_payout_events(operations:\
        \ list) -> list:\\\\n    payout_rows = []\\\\n    for item in operations:\\\\n        if item.get(\"state\") == \"OPERATION_STATE_EXECUTED\" and item.get(\"\
        category\") in {\"coupons\", \"dividends\"}:\\\\n            payout_rows.append({\"id\": \"received:\" + item[\"account_id\"] + \":\" + item[\"id\"], \"instrument_uid\"\
        : item.get(\"instrumentUid\"),\\\\n                                \"account_id\": item[\"account_id\"], \"title\": item[\"title\"], \"kind\": \"coupon\"\
        \ if item[\"category\"] == \"coupons\" else \"dividend\",\\\\n                                \"date\": item[\"date\"], \"status\": \"received\", \"amount\"\
        : money(item.get(\"payment\")), \"per_unit\": None,\\\\n                                \"eligibility_unknown\": False, \"source_ids\": item[\"source_ids\"\
        ], \"operation_id\": item[\"id\"]})\\\\n    return payout_rows\\\\n\\\\n\\\\ndef _collect_market_events(user: Any, checkpoint: dict, progress) -> None:\\\\\
        n    if \"news\" not in checkpoint:\\\\n        checkpoint[\"news\"] = safe_section(lambda: details.cached((\"workspace-news\", *details.identity(user)),\
        \ 600,\\\\n            lambda: market.load_news(user)), empty={\"items\": [], \"complete\": False})\\\\n        progress(\"collecting_news\", checkpoint)\\\
        \\n    if \"calendar\" not in checkpoint:\\\\n        def calendar_envelope():\\\\n            value = market.calendar(user)\\\\n            return section(value,\
        \ as_of=value[\"as_of\"], sources=[value[\"source\"]])\\\\n        checkpoint[\"calendar\"] = safe_section(calendar_envelope, empty={\"exchanges\": []})\\\
        \\n        progress(\"collecting_calendar\", checkpoint)\\\\n\\\\n\\\\ndef _held_news(snapshot: dict, news: dict) -> list:\\\\n    held = defaultdict(list)\\\
        \\n    for position in snapshot[\"positions\"]:\\\\n        held[position[\"instrument_uid\"]].append(position)\\\\n    events = []\\\\n    for item in news.get(\"\
        data\", {}).get(\"items\", []):\\\\n        linked = [uid for uid in item.get(\"instrument_uids\", []) if uid in held]\\\\n        if linked:\\\\n       \
        \     events.append({**item, \"kind\": \"news\", \"instrument_uids\": linked, \"relationship\": \"broker_link\",\\\\n                           \"held_positions\"\
        : [{\"instrument_uid\": uid, \"account_id\": p[\"account_id\"], \"value\": p[\"value\"]} for uid in linked for p in held[uid]],\\\\n                     \
        \      \"impact_is_inference\": True, \"impact\": None})\\\\n    return events\\\\n\\\\n\\\\ndef collect(user: Any, payload: dict, checkpoint: dict, progress)\
        \ -> dict:\\\\n    currency = payload.get(\"currency\", \"RUB\")\\\\n    begin, requested_finish = date_range(date.fromisoformat(payload[\"start\"]) if payload.get(\"\
        start\") else None,\\\\n                                         date.fromisoformat(payload[\"end\"]) if payload.get(\"end\") else None)\\\\n    if checkpoint.get(\"\
        broker_key\") not in {None, state.broker_key(user)}:\\\\n        raise HTTPException(409, \"workspace_broker_connection_changed\")\\\\n    checkpoint[\"broker_key\"\
        ] = state.broker_key(user)\\\\n    progress(\"collecting\", checkpoint)\\\\n    if \"dashboard\" not in checkpoint:\\\\n        checkpoint[\"dashboard\"]\
