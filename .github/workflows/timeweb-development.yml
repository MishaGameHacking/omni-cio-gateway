name: Complete Timeweb Python environment and verify exact source49
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/timeweb-development.yml
permissions:
  contents: read
concurrency:
  group: owner-preview-release-publication
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
    - name: Read the existing pinned administrative SSH transport
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Restore retained sources and execute isolated backend tests on Timeweb
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: |
        python - <<'PY'
        import hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error
        sys.path[:0]=[".transport-admin/deploy",".transport-admin/tools"]
        import prepare_owner_vm as p
        import access_owner_vm as access
        token=p.validated_token(os.environ["TIMEWEB_CLOUD_TOKEN"])
        def api(method,path,body=None):
            req=urllib.request.Request("https://api.timeweb.cloud/api/v1"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
            try:
                with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:
                    raw=r.read(4194305);assert len(raw)<=4194304
                    return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))

        def with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):
            sid=9417611;ip="83.217.195.29";host="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g"
            status,data=api("GET","/servers/"+str(sid));assert status==200
            server=data["server"]
            assert server["name"]=="Analyst AI runtime 20261025" and server["project_id"]==2941515 and server["availability_zone"]=="ams-1" and p.cloud.public_ipv4(server)==ip
            access.SERVER_ID=sid
            with tempfile.TemporaryDirectory(prefix="analyst-ams-admin-",dir=os.environ["RUNNER_TEMP"]) as directory:
                folder=pathlib.Path(directory);p.cloud.generate_key(folder/"client");public=(folder/"client.pub").read_text().strip()
                created=access.request(token,"POST","/ssh-keys",{"name":"analyst-ams-admin-"+os.environ["GITHUB_RUN_ID"],"body":public,"is_default":False})
                key=created.get("ssh_key",created.get("ssh-key",{}));kid=key["id"]
                assert type(kid) is int and key["body"].split()[:2]==public.split()[:2]
                attached=False
                try:
                    access.request(token,"POST","/servers/"+str(sid)+"/ssh-keys",{"ssh_key_ids":[kid]});attached=True
                    cmd=p.ssh_command(folder,ip,host);cmd[1:1]=["-o","ServerAliveInterval=20","-o","ServerAliveCountMax=3"]
                    for attempt in range(12):
                        try:p.remote(cmd,"test $(id -u) = 0",timeout=12);break
                        except (p.ProbeError,subprocess.TimeoutExpired):
                            if attempt==11:raise
                            time.sleep(5)
                    payload=remote_script.encode() if binary_input is None else binary_input
                    remote_command="python3 -" if binary_input is None else "python3 -c "+shlex.quote(remote_script)
                    result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                    if not capture:print(result.stdout.decode(errors="replace"),flush=True)
                    if result.returncode:
                        print("AMS_REMOTE_ERROR="+result.stderr.decode(errors="replace")[-4000:],flush=True)
                        raise RuntimeError("remote_task_failed")
                    return result.stdout
                finally:
                    try:
                        if attached:access.request(token,"DELETE","/servers/"+str(sid)+"/ssh-keys/"+str(kid))
                    finally:
                        access.request(token,"DELETE","/ssh-keys/"+str(kid))
                    print("AMS_TEMP_KEY_REMOVED=true",flush=True)


        remote = '"""Restore retained source49 and run synthetic backend tests on the existing Timeweb VM.\n\nAdministrative payload only. Run as root on the pinned VM through with_ams.\nThe source tests run as analyst-build, with clean synthetic environment, private\nnetwork namespace, bounded resources, and read-only access outside their test state.\nNothing is installed into the runtime venv or deployed to the running application.\n"""\nfrom __future__ import annotations\n\nimport datetime\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path, PurePosixPath\nimport pwd\nimport re\nimport shutil\nimport stat\nimport subprocess\nimport time\nimport uuid\nimport xml.etree.ElementTree as ET\nimport zipfile\n\nARCHIVE = Path(\'/var/lib/analyst-ai-build/incoming/windows-development-40453334023-1/windows-development-evidence.zip\')\nARCHIVE_BYTES = 69716504\nARCHIVE_SHA256 = \'dc171704ffcf004aad7d8990408d301e9b3a63b6f030c0a5321e776cb7711fe4\'\nSOURCE_SHA256 = \'8e4dc044ec6b700469a597cf8fc3a23aae96e57e5b5413e378dbf3986e2cef60\'\nCOMPLETE_SHA256 = \'743a71819ec89d97467ce72189374a8070dd0fc3c6611710029b48f4feae8c23\'\nBACKUP_COMMIT = \'521d96293a048e4254bec936710bcfbf166b20a0\'\nBASE = Path(\'/var/lib/analyst-ai-build/development\')\nSOURCE = BASE / \'source49\'\n\n\ndef need(value, message):\n    if not value:\n        raise RuntimeError(message)\n\n\ndef sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef file_sha(path):\n    digest = hashlib.sha256()\n    with path.open(\'rb\') as stream:\n        for part in iter(lambda: stream.read(1024 * 1024), b\'\'):\n            digest.update(part)\n    return digest.hexdigest()\n\n\ndef safe_name(name):\n    need(isinstance(name, str) and 0 < len(name) <= 600 and \'\\\\\' not in name and \':\' not in name,\n         \'invalid_source_name\')\n    relative = PurePosixPath(name)\n    need(not relative.is_absolute() and relative.as_posix() == name and\n         not any(part in (\'\', \'.\', \'..\', \'.git\') for part in relative.parts), \'unsafe_source_name\')\n    return relative\n\n\ndef trusted_directory(path, *, owners=(0,)):\n    info = path.lstat()\n    need(stat.S_ISDIR(info.st_mode) and not path.is_symlink() and path.resolve(strict=True) == path\n         and info.st_uid in owners and not info.st_mode & 0o022, \'untrusted_directory:\' + str(path))\n\n\ndef read_manifest(bundle):\n    name = \'evidence/source-final.json\'\n    need(bundle.getinfo(name).file_size <= 8 * 1024**2, \'manifest_too_large\')\n    value = json.loads(bundle.read(name))\n    need(set(value) == {\'files\', \'source_sha256\', \'complete_source_sha256\'}, \'wrong_manifest_keys\')\n    need(isinstance(value[\'files\'], dict) and 0 < len(value[\'files\']) <= 20000, \'invalid_manifest_count\')\n    code, complete, seen = hashlib.sha256(), hashlib.sha256(), set()\n    for name, item in sorted(value[\'files\'].items(), key=lambda pair: pair[0].encode(\'utf-8\')):\n        safe_name(name)\n        need(name.casefold() not in seen and set(item) == {\'bytes\', \'sha256\'} and\n             type(item[\'bytes\']) is int and 0 <= item[\'bytes\'] <= 128 * 1024**2 and\n             re.fullmatch(\'[a-f0-9]{64}\', item[\'sha256\']), \'invalid_manifest_entry\')\n        seen.add(name.casefold())\n        record = name.encode(\'utf-8\') + b\'\\0\' + item[\'sha256\'].encode(\'ascii\') + b\'\\0\'\n        complete.update(record)\n        if name not in (\'AGENTS.md\', \'README.md\') and not name.startswith(\'docs/\'):\n            code.update(record)\n    need(code.hexdigest() == value[\'source_sha256\'] == SOURCE_SHA256 and\n         complete.hexdigest() == value[\'complete_source_sha256\'] == COMPLETE_SHA256,\n         \'manifest_source_identity_mismatch\')\n    return value\n\n\ndef restore(account):\n    need(os.getuid() == 0, \'administrative_root_required\')\n    special = Path(\'/var/lib/analyst-ai-build\')\n    for parent in reversed(ARCHIVE.parents):\n        trusted_directory(parent, owners=(0, account.pw_uid) if parent == special else (0,))\n    info = ARCHIVE.lstat()\n    need(stat.S_ISREG(info.st_mode) and not ARCHIVE.is_symlink() and info.st_uid == 0 and\n         not info.st_mode & 0o022 and info.st_nlink == 1 and info.st_size == ARCHIVE_BYTES,\n         \'retained_archive_metadata_mismatch\')\n    need(file_sha(ARCHIVE) == ARCHIVE_SHA256, \'retained_archive_hash_mismatch\')\n    need(shutil.disk_usage(BASE.parent).free > 1024**3, \'insufficient_workspace_disk\')\n    if not BASE.exists():\n        BASE.mkdir(mode=0o755)\n    trusted_directory(BASE)\n    need(not SOURCE.is_symlink(), \'source49_symlink_rejected\')\n\n    with zipfile.ZipFile(ARCHIVE) as bundle:\n        entries = bundle.infolist()\n        names = [entry.filename for entry in entries]\n        need(0 < len(entries) <= 20000 and len(names) == len(set(names)) and\n             sum(entry.file_size for entry in entries) <= 490 * 1024**2, \'unsafe_archive_inventory\')\n        manifest = read_manifest(bundle)\n        expected = {\'source/\' + name for name in manifest[\'files\']}\n        need({name for name in names if name.startswith(\'source/\')} == expected,\n             \'archive_source_inventory_mismatch\')\n        for entry in entries:\n            safe_name(entry.filename)\n            need(not entry.is_dir() and not entry.flag_bits & 1 and\n                 stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG), \'unsafe_archive_entry_type\')\n        if SOURCE.exists():\n            trusted_directory(SOURCE, owners=(account.pw_uid,))\n            need(all((SOURCE / name).is_file() and not (SOURCE / name).is_symlink()\n                     and file_sha(SOURCE / name) == item[\'sha256\']\n                     for name, item in manifest[\'files\'].items()), \'restored_source49_changed\')\n            print(\'TIMEWEB_RESTORE=reused_exact_verified_source49\', flush=True)\n            return manifest\n        SOURCE.mkdir(mode=0o755)\n        os.chown(SOURCE, account.pw_uid, account.pw_gid)\n        for name, identity in manifest[\'files\'].items():\n            entry = bundle.getinfo(\'source/\' + name)\n            need(entry.file_size == identity[\'bytes\'], \'source_size_mismatch\')\n            data = bundle.read(entry)\n            need(len(data) == identity[\'bytes\'] and sha(data) == identity[\'sha256\'], \'source_hash_mismatch\')\n            target = SOURCE / safe_name(name)\n            missing = []\n            parent = target.parent\n            while not parent.exists():\n                missing.append(parent)\n                parent = parent.parent\n            for folder in reversed(missing):\n                folder.mkdir(mode=0o755)\n                os.chown(folder, account.pw_uid, account.pw_gid)\n            with target.open(\'xb\') as stream:\n                stream.write(data)\n            executable = name == \'gradlew\' or bool((entry.external_attr >> 16) & 0o111)\n            target.chmod(0o755 if executable else 0o644)\n            os.chown(target, account.pw_uid, account.pw_gid)\n        (BASE / \'source49-restoration.json\').write_text(json.dumps({\n            \'source_backup_commit\': BACKUP_COMMIT, \'archive_sha256\': ARCHIVE_SHA256,\n            **manifest, \'restored_at_utc\': datetime.datetime.now(datetime.timezone.utc).isoformat()\n        }, sort_keys=True, indent=2) + \'\\n\')\n    return manifest\n\n\ndef main():\n    account = pwd.getpwnam(\'analyst-build\')\n    need(account.pw_uid != 0, \'test_account_must_be_unprivileged\')\n    manifest = restore(account)\n    prerequisite = subprocess.run([\'/usr/bin/python3\', \'-c\', \'import ensurepip\'],\n        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\n    if prerequisite.returncode:\n        apt_env = dict(os.environ, DEBIAN_FRONTEND=\'noninteractive\', NEEDRESTART_MODE=\'l\')\n        subprocess.run([\'apt-get\', \'update\', \'-qq\'], check=True, env=apt_env, timeout=180)\n        subprocess.run([\'apt-get\', \'install\', \'-y\', \'--no-install-recommends\', \'python3.12-venv\'],\n            check=True, env=apt_env, timeout=240)\n        print(\'TIMEWEB_PREREQUISITE=python3.12-venv_installed\', flush=True)\n    suffix = datetime.datetime.now(datetime.timezone.utc).strftime(\'%Y%m%dT%H%M%SZ\') + \'-\' + uuid.uuid4().hex[:8]\n    state = BASE / (\'source49-check-\' + suffix)\n    state.mkdir(mode=0o700)\n    os.chown(state, account.pw_uid, account.pw_gid)\n    for name in (\'home\', \'tmp\', \'evidence\', \'pycache\'):\n        folder = state / name\n        folder.mkdir(mode=0o700)\n        os.chown(folder, account.pw_uid, account.pw_gid)\n    env = {\n        \'PATH\': \'/usr/bin:/bin\', \'HOME\': str(state / \'home\'), \'LANG\': \'C.UTF-8\',\n        \'PYTHONUNBUFFERED\': \'1\', \'PYTHONNOUSERSITE\': \'1\', \'PYTHONPYCACHEPREFIX\': str(state / \'pycache\'),\n        \'XDG_CONFIG_HOME\': str(state / \'home/.config\'), \'XDG_CACHE_HOME\': str(state / \'home/.cache\'),\n        \'TMPDIR\': str(state / \'tmp\'), \'TMP\': str(state / \'tmp\'), \'TEMP\': str(state / \'tmp\'),\n        \'TELEGRAM_CLIENT_ID\': \'123456\', \'TELEGRAM_CLIENT_SECRET\': \'test-only\',\n        \'BACKEND_PUBLIC_URL\': \'https://example.invalid\',\n        \'TELEGRAM_REDIRECT_URI\': \'https://example.invalid/auth/telegram/callback\',\n        \'FERNET_KEY\': \'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\',\n        \'DATABASE_PATH\': str(state / \'tests.sqlite3\'), \'ANALYSIS_SCHEDULER_ENABLED\': \'false\',\n        \'AI_EXTERNAL_PROCESSING_APPROVED\': \'false\', \'PIP_CONFIG_FILE\': \'/dev/null\',\n        \'PIP_DISABLE_PIP_VERSION_CHECK\': \'1\',\n    }\n    report = {\n        \'schema\': 1, \'status\': \'failed\', \'server_id\': 9417611, \'source_backup_commit\': BACKUP_COMMIT,\n        \'source_sha256\': SOURCE_SHA256, \'complete_source_sha256\': COMPLETE_SHA256,\n        \'source_directory\': str(SOURCE), \'evidence_directory\': str(state / \'evidence\'),\n        \'source_code_executed_on_timeweb\': False, \'synthetic_test_environment\': True,\n        \'live_source_changed\': False, \'trading_or_ai_enabled\': False, \'steps\': [],\n    }\n\n    def run(name, arguments, *, timeout=900, network=False, step_env=None, required=True):\n        log = state / \'evidence\' / (name + \'.log\')\n        environment = env if step_env is None else step_env\n        unit = \'analyst-dev49-\' + suffix.lower() + \'-\' + name\n        command = [\'systemd-run\', \'--wait\', \'--pipe\', \'--collect\', \'--quiet\', \'--unit=\' + unit,\n                   \'--uid=\' + str(account.pw_uid), \'--gid=\' + str(account.pw_gid),\n                   \'--property=WorkingDirectory=\' + str(SOURCE),\n                   \'--property=MemoryMax=1G\', \'--property=CPUQuota=100%\', \'--property=TasksMax=128\',\n                   \'--property=RuntimeMaxSec=\' + str(timeout), \'--property=TimeoutStopSec=10\',\n                   \'--property=NoNewPrivileges=yes\', \'--property=ProtectSystem=strict\',\n                   \'--property=ProtectHome=yes\', \'--property=PrivateTmp=yes\',\n                   \'--property=PrivateDevices=yes\', \'--property=PrivateNetwork=\' + (\'no\' if network else \'yes\'),\n                   \'--property=InaccessiblePaths=-/var/lib/analyst-ai -/etc/analyst-ai -/root\',\n                   \'--property=ReadWritePaths=\' + str(state),\n                   \'/usr/bin/env\', \'-i\', *[key + \'=\' + value for key, value in environment.items()], *arguments]\n        started = time.monotonic()\n        print(\'TIMEWEB_STEP=\' + name, flush=True)\n        with log.open(\'xb\') as output:\n            result = subprocess.run(command, stdin=subprocess.DEVNULL, stdout=output,\n                                    stderr=subprocess.STDOUT, timeout=timeout + 30)\n        row = {\'name\': name, \'exit_code\': result.returncode, \'seconds\': round(time.monotonic() - started, 3),\n               \'log_sha256\': file_sha(log), \'network_allowed\': network}\n        report[\'steps\'].append(row)\n        print(\'TIMEWEB_STEP_RESULT=\' + json.dumps(row), flush=True)\n        if result.returncode or name in (\'backend-full-suite\', \'health-openapi\', \'dependency-versions\'):\n            print(log.read_text(errors=\'replace\')[-14000:], flush=True)\n        if required:\n            need(result.returncode == 0, \'timeweb_test_step_failed:\' + name)\n        return result.returncode\n\n    try:\n        python = str(state / \'venv/bin/python\')\n        run(\'test-venv\', [\'/usr/bin/python3\', \'-m\', \'venv\', str(state / \'venv\')], timeout=90)\n        run(\'requirements\', [python, \'-m\', \'pip\', \'--require-virtualenv\', \'install\', \'--no-input\',\n                             \'--no-cache-dir\', \'--index-url\', \'https://pypi.org/simple\',\n                             \'-r\', \'backend/requirements-dev.txt\'], timeout=600, network=True)\n        report[\'dependency_mode\'] = \'isolated_test_venv\'\n        run(\'dependencies\', [python, \'-m\', \'pip\', \'check\'], timeout=60)\n        run(\'dependency-versions\', [python, \'-m\', \'pip\', \'freeze\', \'--all\'], timeout=60)\n        run(\'validate-deploy-script\', [\'/bin/bash\', \'-n\', \'.github/scripts/deploy_timeweb_backend.sh\'], timeout=30)\n        report[\'source_code_executed_on_timeweb\'] = True\n        run(\'compile-backend\', [python, \'-m\', \'compileall\', \'-q\', \'backend\'], timeout=90)\n        junit = state / \'evidence/backend-tests.xml\'\n        run(\'backend-full-suite\', [python, \'-m\', \'pytest\', \'backend/tests\', \'-q\', \'-p\', \'no:cacheprovider\',\n                                   \'--junitxml=\' + str(junit)], timeout=900)\n        tree = ET.fromstring(junit.read_bytes())\n        suites = [tree] if tree.tag == \'testsuite\' else list(tree.findall(\'testsuite\'))\n        totals = {name: sum(int(suite.get(name, \'0\')) for suite in suites)\n                  for name in (\'tests\', \'failures\', \'errors\', \'skipped\')}\n        report[\'tests\'] = totals\n        report[\'junit_sha256\'] = file_sha(junit)\n        need(totals[\'tests\'] > totals[\'skipped\'] and totals[\'failures\'] == totals[\'errors\'] == 0,\n             \'backend_junit_does_not_confirm_pass\')\n        smoke = """from fastapi.testclient import TestClient\nfrom backend.app import app\nwith TestClient(app) as client:\n    health = client.get(\'/health\')\n    assert health.status_code == 200 and health.json() == {\'status\': \'ok\'}\n    assert client.get(\'/openapi.json\').status_code == 200\nprint(\'HEALTH_OPENAPI=passed\')\n"""\n        run(\'health-openapi\', [python, \'-c\', smoke], timeout=90,\n            step_env=dict(env, DATABASE_PATH=str(state / \'health.sqlite3\')))\n        report[\'status\'] = \'passed\'\n    except BaseException as error:\n        report[\'error_type\'] = type(error).__name__\n        report[\'error\'] = str(error)[:500]\n        raise\n    finally:\n        changed = [name for name, row in manifest[\'files\'].items()\n                   if not (SOURCE / name).is_file() or (SOURCE / name).is_symlink()\n                   or file_sha(SOURCE / name) != row[\'sha256\']]\n        report[\'changed_sources\'] = changed\n        if changed:\n            report[\'status\'] = \'failed_integrity\'\n        report[\'finished_at_utc\'] = datetime.datetime.now(datetime.timezone.utc).isoformat()\n        destination = state / \'evidence/timeweb-backend-check.json\'\n        destination.write_text(json.dumps(report, sort_keys=True, indent=2) + \'\\n\')\n        print(\'TIMEWEB_BACKEND_REPORT=\' + json.dumps(report, sort_keys=True), flush=True)\n        need(not changed, \'source_changed_during_tests\')\n\n\nif __name__ == \'__main__\':\n    main()\n'
        with_ams(remote, timeout=1800)
        PY
