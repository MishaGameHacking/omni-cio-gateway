        \"\",\\\\n            (user_id, snapshot[\"currency\"], snapshot[\"snapshot_id\"], state.broker_key(user), state.encode(snapshot), int(time.time())))\\\\\
        n        _record_concentration_changes(db, user_id, snapshot, active, old_breaches, new_breaches, all_current, complete_axes)\\\\n        for item in snapshot.get(\"\
        events\", {}).get(\"items\", []):\\\\n            state.event(db, user_id, \"market_news\", snapshot[\"snapshot_id\"], item, item[\"id\"])\\\\n        volume_credit.record_changes_in(db,\
        \ user_id, snapshot, old)\\\\n\\\\n\\\\ndef ai_data(user: Any) -> dict:\\\\n    user_id = int(user[\"id\"])\\\\n    with closing(backend.connect()) as db:\\\
        \\n        row = db.execute(\"SELECT * FROM analysis_runs WHERE user_id=? ORDER BY created_at DESC,id DESC LIMIT 1\", (user_id,)).fetchone()\\\\n        cards\
        \ = db.execute(\"SELECT id,title,summary,actions_json,evidence_json,created_at FROM insight_cards WHERE user_id=? ORDER BY created_at DESC,id DESC LIMIT 2\"\
        , (user_id,)).fetchall()\\\\n        checked = db.execute(\"SELECT payload_json FROM workspace_records WHERE user_id=? AND kind=\\\\\\'monitor_check\\\\\\\
        ' ORDER BY id DESC LIMIT 1\", (user_id,)).fetchone()\\\\n        check_rows = db.execute(\"SELECT payload_json FROM workspace_records WHERE user_id=? AND\
