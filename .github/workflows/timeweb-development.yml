        \ backend.connect).check_ready(AnalysisTier.FAST)\\\\n        readiness = {\"available\": True, \"reason\": None}\\\\n    except GuardError as error:\\\\\
        n        readiness = {\"available\": False, \"reason\": error.code}\\\\n    try:\\\\n        from .volume_jobs import user_jobs\\\\n    except ImportError:\\\
        \\n        from volume_jobs import user_jobs\\\\n    observed_jobs = [_monitor_job_record(row) for row in monitor_jobs]\\\\n    check_history = []\\\\n  \
        \  for record in check_rows:\\\\n        item = json.loads(record[0])\\\\n        summary = {key: item.get(key) for key in (\"check_id\", \"checked_at\",\
        \ \"state\", \"reason\", \"tier\", \"card_id\", \"run_id\", \"error_code\")}\\\\n        summary[\"observation_count\"] = (item.get(\"trigger\") or {}).get(\"\
