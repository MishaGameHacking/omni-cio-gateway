name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-*.txt"
      - "AGENTS.md"
      - ".sonarcloud.properties"
      - ".github/**"
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    # Persistent self-hosted machines must not execute untrusted fork PR code.
    # Run owner-authored same-repository PRs for early parallel feedback, and
    # keep accepted main as the release-provenance run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests .github/scripts/timeweb_recovery.py .github/scripts/test_timeweb_recovery.py .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py .github/scripts/test_with_postgres.py .github/scripts/report_sonar_annotations.py'
          - name: Mypy
            command: '"%OMNICIO_PYTHON%" -m mypy src .github/scripts/timeweb_recovery.py .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py .github/scripts/test_with_postgres.py .github/scripts/report_sonar_annotations.py'
          - name: Release gate tests
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_release_gate.py'
          - name: Full tests (includes security)
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_with_postgres.py'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python and isolate job environment
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.command }}

      - name: Report Sonar annotations for this exact source
        if: matrix.name == 'Release gate tests'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/report_sonar_annotations.py'

  reviewed_source:
    name: Verify immutable repair source
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.number == 752 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.event.pull_request.head.ref == 'feature/graphite-market-workspace'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - name: Bootstrap pinned Python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd
      - name: Verify fixed repair manifest and store blobs without changing refs
        shell: '"${{ env.OMNICIO_PYTHON }}" {0}'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import zlib
          from pathlib import Path

          root = 'https://api.github.com/repos/MishaGameHacking/omni-cio-gateway'
          baseline = '4f8923b2474abe9de09e1a455db689ef32063130'
          main = '89ed9342a63512b22b4d84a01a0274bc415d9516'
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OmniCIO-reviewed-source',
              })
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return json.load(response)
                  except OSError as exc:
                      if isinstance(exc, urllib.error.HTTPError) and exc.code not in (429, 500, 502, 503, 504):
                          raise
                      if attempt == 2:
                          raise
                      time.sleep(1 + 2 * attempt)
              raise RuntimeError('bounded request failed')

          def identity(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          def read_blob(sha):
              raw = base64.b64decode(request('/git/blobs/' + sha)['content'])
              if identity(raw) != sha:
                  raise RuntimeError('source identity mismatch')
              return raw

          def check_refs():
              if request('/git/ref/heads/main')['object']['sha'] != main:
                  raise RuntimeError('main changed; re-review required')
              if request('/git/ref/heads/feature/graphite-market-workspace')['object']['sha'] != os.environ['EXPECTED_HEAD']:
                  raise RuntimeError('head changed; refusing stale source delivery')

          check_refs()
          parts = [
              '077a7237e55ecc942a43afb2b4fcdcb65797a273',
              '7cfc24a53e60d5919cbe012577191fa08b2be985',
              'e2217923bdbd33696144e0fb2a6056b1f737361f',
              'cd04fac1f9f79f2db1f0717ba3b91eab42453627',
              '3ef801095badf422399b40fb905c636da1c12e8e',
              '5a2530c7cb4f861ddd69ee9a07cf51df1df405aa',
          ]
          encoded = b''.join(read_blob(sha) for sha in parts)
          if identity(encoded) != 'ea80af243e5a7ef848bc48f7b9f7e90c252ce60a':
              raise RuntimeError('complete repair payload mismatch')
          manifest = json.loads(zlib.decompress(base64.b64decode(encoded)))
          allowed = {'.github/workflows/auth-foundation-ci.yml', 'src/omnicio/cbr.py',
              'src/omnicio/market.py', 'tests/frontend-smoke.cjs', 'tests/test_market.py',
              'web/app.css', 'web/app.js', 'web/index.html'}
          if len(manifest) != len(allowed) or {item['path'] for item in manifest} != allowed:
              raise RuntimeError('unexpected repair paths')
          prepared = []
          for item in manifest:
              raw = subprocess.check_output(['git', 'show', baseline + ':' + item['path']])
              if identity(raw) != item['old']:
                  raise RuntimeError('original file mismatch: ' + item['path'])
              text = raw.decode('utf-8')
              end = len(text)
              for start, stop, replacement in reversed(item['edits']):
                  if not 0 <= start <= stop <= end:
                      raise RuntimeError('invalid patch boundaries')
                  text = text[:start] + replacement + text[stop:]
                  end = start
              result = text.encode('utf-8')
              if identity(result) != item['new']:
                  raise RuntimeError('tested file mismatch: ' + item['path'])
              prepared.append((item, result))
          check_refs()
          outputs = []
          for item, result in prepared:
              created = request('/git/blobs', {'content': base64.b64encode(result).decode(), 'encoding': 'base64'})
              if created['sha'] != item['new']:
                  raise RuntimeError('stored blob mismatch')
              outputs.append({'path': item['path'], 'sha': created['sha']})
          Path('reviewed-repair-blobs.json').write_text(json.dumps(outputs), encoding='utf-8')
          print('Verified eight immutable repair blobs. No branch, main or production mutation.')
      - name: Preserve verified source identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-repair-blobs-752
          path: reviewed-repair-blobs.json
          if-no-files-found: error
          retention-days: 1
