name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest
