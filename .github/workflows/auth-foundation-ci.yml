name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-*.txt"
      - "AGENTS.md"
      - ".sonarcloud.properties"
      - ".github/**"
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    # Persistent self-hosted machines must not execute untrusted fork PR code.
    # Run owner-authored same-repository PRs for early parallel feedback, and
    # keep accepted main as the release-provenance run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests .github/scripts/host_recovery.py .github/scripts/tenant_archive.py .github/scripts/inplace_upgrade.py .github/scripts/run_recovery_drill.py .github/scripts/timeweb_recovery.py .github/scripts/test_timeweb_recovery.py .github/scripts/timeweb_public_site.py .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py .github/scripts/timeweb_http.py .github/scripts/test_with_postgres.py .github/scripts/report_sonar_annotations.py .github/scripts/ci_evidence.py .github/scripts/publish_android.py .github/scripts/test_ci_evidence.py .github/scripts/test_publish_android.py'
          - name: Mypy
            command: |
              "%OMNICIO_PYTHON%" -m mypy src .github/scripts/tenant_archive.py .github/scripts/inplace_upgrade.py .github/scripts/run_recovery_drill.py .github/scripts/timeweb_recovery.py .github/scripts/timeweb_public_site.py .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py .github/scripts/timeweb_http.py .github/scripts/test_with_postgres.py .github/scripts/report_sonar_annotations.py .github/scripts/ci_evidence.py .github/scripts/publish_android.py
              if errorlevel 1 exit /b 1
              "%OMNICIO_PYTHON%" -m mypy --platform linux .github/scripts/inplace_upgrade.py .github/scripts/host_recovery.py
          - name: Release gate tests
            command: |
              "%OMNICIO_PYTHON%" .github/scripts/test_release_gate.py
              if errorlevel 1 exit /b 1
              "%OMNICIO_PYTHON%" .github/scripts/test_ci_evidence.py
              if errorlevel 1 exit /b 1
              "%OMNICIO_PYTHON%" .github/scripts/test_publish_android.py
          - name: Full tests (includes security)
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_with_postgres.py'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ matrix.name == 'Full tests (includes security)' && '0' || '1' }}
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python and isolate job environment
        id: python
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }} for public market and email authentication
        id: tests
        shell: cmd
        run: ${{ matrix.command }}

      - name: Preserve PostgreSQL evidence on the self-hosted runner
        if: always() && matrix.name == 'Full tests (includes security)' && steps.python.outcome == 'success'
        shell: cmd
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTCOME: ${{ steps.tests.outcome }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/ci_evidence.py postgres'

      - name: Report Sonar annotations for this exact source
        if: github.event_name == 'pull_request' && matrix.name == 'Release gate tests'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"%OMNICIO_PYTHON%" .github/scripts/report_sonar_annotations.py'

