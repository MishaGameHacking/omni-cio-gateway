name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-*.txt"
      - "AGENTS.md"
      - ".github/**"
  push:
    branches:
      - main
      - diagnostic/main-sonar-reliability-r6

permissions:
  contents: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hosted PR gate
    permissions:
      contents: read
      checks: read
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/diagnostic/main-sonar-reliability-r6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMNICIO_TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@127.0.0.1:5432/omnicio_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: omnicio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnicio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test tooling
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .

      - name: Verify dependency exports match the lock
        run: |
          uv export --locked --group build --no-emit-project --no-header --output-file requirements-runtime.txt > /dev/null
          uv export --locked --group build --extra dev --no-emit-project --no-header --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements-runtime.txt requirements-dev.txt

      - name: Ruff
        run: ruff check src tests .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py

      - name: Mypy
        run: mypy src .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py

      - name: Tests
        run: |
          pytest
          python .github/scripts/test_release_gate.py

      # Temporary read-only diagnostic. Remove before merge.
      - name: Diagnose historical R6 Sonar annotations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = "MishaGameHacking/omni-cio-gateway"
          r6_head = "f688bdfa8dbbd17252fb65a8759a4d72c1ff3550"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "omnicio-sonar-diagnostic/1.0",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          checks = get(
              f"https://api.github.com/repos/{repository}/commits/{r6_head}"
              "/check-runs?filter=all&per_page=100"
          )["check_runs"]
          sonar = [
              check for check in checks
              if check.get("name") == "SonarCloud Code Analysis"
              and check.get("details_url", "").endswith("pullRequest=691")
          ]
          if len(sonar) != 1:
              raise SystemExit(f"expected one R6 Sonar check, got {len(sonar)}")
          annotations = get(sonar[0]["output"]["annotations_url"])
          print(json.dumps({"annotation_count": len(annotations)}, sort_keys=True))
          for annotation in annotations:
              print(
                  json.dumps(
                      {
                          "path": annotation.get("path"),
                          "start_line": annotation.get("start_line"),
                          "end_line": annotation.get("end_line"),
                          "annotation_level": annotation.get("annotation_level"),
                          "title": annotation.get("title"),
                          "message": annotation.get("message"),
                      },
                      ensure_ascii=True,
                      sort_keys=True,
                  )
              )
          PY

  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    # Persistent self-hosted machines must not execute untrusted fork PR code.
    # Run owner-authored same-repository PRs for early parallel feedback, and
    # keep accepted main as the release-provenance run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py'
          - name: Mypy
            command: '"%OMNICIO_PYTHON%" -m mypy src .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py'
          - name: Release gate tests
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_release_gate.py'
          - name: Security tests
            command: '"%OMNICIO_PYTHON%" -m pytest tests/test_security.py'
          - name: Service and support tests
            command: '"%OMNICIO_PYTHON%" -m pytest tests/test_service.py tests/test_vkid.py tests/test_support.py tests/test_broker.py tests/test_portfolio.py tests/test_observer.py'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python and isolate job environment
        shell: cmd
        env:
          PYTHON_ARCHIVE_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.zip
          PYTHON_ARCHIVE_SHA256: 8649692de846c56a7189d6dae5c322ab20deb1b5908b6f39426b62a36f39415d
        run: |
          @echo off
          setlocal EnableExtensions

          set "PYTHON_HOME=%RUNNER_TOOL_CACHE%\omnicio-python-3.12.10"
          set "PYTHON_EXE=%PYTHON_HOME%\python.exe"
          set "PYTHON_ARCHIVE=%RUNNER_TEMP%\python-3.12.10-amd64.zip"

          if not exist "%PYTHON_EXE%" (
            where curl.exe >nul 2>nul
            if errorlevel 1 (
              echo ::error::curl.exe is required to bootstrap the pinned Python runtime.
              exit /b 1
            )

            echo Downloading pinned CPython 3.12.10 from python.org...
            curl.exe --fail --location --retry 3 --retry-delay 2 ^
              --output "%PYTHON_ARCHIVE%" "%PYTHON_ARCHIVE_URL%"
            if errorlevel 1 exit /b 1

            certutil -hashfile "%PYTHON_ARCHIVE%" SHA256 | findstr /i /c:"%PYTHON_ARCHIVE_SHA256%" >nul
            if errorlevel 1 (
              echo ::error::Downloaded Python archive failed SHA256 verification.
              del /q "%PYTHON_ARCHIVE%" 2>nul
              exit /b 1
            )

            if exist "%PYTHON_HOME%" rmdir /s /q "%PYTHON_HOME%"
            mkdir "%PYTHON_HOME%"
            if errorlevel 1 exit /b 1

            powershell.exe -NoLogo -NoProfile -NonInteractive -Command ^
              "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::ExtractToDirectory($env:PYTHON_ARCHIVE, $env:PYTHON_HOME)"
            if errorlevel 1 exit /b 1

            del /q "%PYTHON_ARCHIVE%" 2>nul
          )

          "%PYTHON_EXE%" -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
          if errorlevel 1 exit /b 1

          "%PYTHON_EXE%" -m pip --version >nul 2>nul
          if errorlevel 1 (
            "%PYTHON_EXE%" -m ensurepip --upgrade
            if errorlevel 1 exit /b 1
          )

          "%PYTHON_EXE%" -m venv .venv-ci
          if errorlevel 1 exit /b 1

          set "VENV_PYTHON=%CD%\.venv-ci\Scripts\python.exe"
          "%VENV_PYTHON%" -c "import sys; print(sys.version)"
          if errorlevel 1 exit /b 1

          >>"%GITHUB_ENV%" echo OMNICIO_PYTHON=%VENV_PYTHON%
          >>"%GITHUB_ENV%" echo PIP_CACHE_DIR=%RUNNER_TOOL_CACHE%\omnicio-pip-cache

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.command }}
