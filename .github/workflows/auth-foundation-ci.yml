name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-*.txt"
      - "AGENTS.md"
      - ".sonarcloud.properties"
      - ".github/**"
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    # Persistent self-hosted machines must not execute untrusted fork PR code.
    # Run owner-authored same-repository PRs for early parallel feedback, and
    # keep accepted main as the release-provenance run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py .github/scripts/test_with_postgres.py'
          - name: Mypy
            command: '"%OMNICIO_PYTHON%" -m mypy src .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py'
          - name: Release gate tests
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_release_gate.py'
          - name: Full tests (includes security)
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_with_postgres.py'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python and isolate job environment
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.command }}

      - name: Report Sonar annotations for this exact source
        if: matrix.name == 'Release gate tests'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          $base = 'https://api.github.com/repos/MishaGameHacking/omni-cio-gateway'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $checks = Invoke-RestMethod -Uri "$base/commits/$env:SOURCE_SHA/check-runs?per_page=100" -Headers $headers
          $sonar = $checks.check_runs | Where-Object { $_.name -eq 'SonarCloud Code Analysis' } | Sort-Object id -Descending | Select-Object -First 1
          if (-not $sonar) { Write-Output 'Sonar analysis is not available yet'; exit 0 }
          Write-Output $sonar.output.summary
          if ($sonar.output.annotations_count -gt 0) {
            $items = Invoke-RestMethod -Uri "$base/check-runs/$($sonar.id)/annotations?per_page=100" -Headers $headers
            $items | Select-Object path, start_line, end_line, title, message | ConvertTo-Json -Depth 4
          }
