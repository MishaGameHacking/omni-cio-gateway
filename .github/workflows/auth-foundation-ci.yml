name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hosted PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest

  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests'
          - name: Mypy
            command: '"%OMNICIO_PYTHON%" -m mypy src'
          - name: Security tests
            command: '"%OMNICIO_PYTHON%" -m pytest tests/test_security.py'
          - name: Service and support tests
            command: '"%OMNICIO_PYTHON%" -m pytest tests/test_service.py tests/test_support.py'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Resolve installed Python and isolate job environment
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PYTHON_CMD="

          where py >nul 2>nul
          if not errorlevel 1 (
            py -3.13 -c "import sys; assert sys.version_info[:2] == (3, 13)" >nul 2>nul
            if not errorlevel 1 set "PYTHON_CMD=py -3.13"
            if not defined PYTHON_CMD (
              py -3.12 -c "import sys; assert sys.version_info[:2] == (3, 12)" >nul 2>nul
              if not errorlevel 1 set "PYTHON_CMD=py -3.12"
            )
          )

          if not defined PYTHON_CMD (
            where python >nul 2>nul
            if not errorlevel 1 (
              python -c "import sys; assert sys.version_info[:2] in ((3, 12), (3, 13))" >nul 2>nul
              if not errorlevel 1 set "PYTHON_CMD=python"
            )
          )

          if not defined PYTHON_CMD (
            echo ::error::Python 3.12 or 3.13 is not installed or visible to the runner service.
            where py 2>nul
            where python 2>nul
            exit /b 1
          )

          call %PYTHON_CMD% -m venv .venv-ci
          if errorlevel 1 exit /b 1

          set "VENV_PYTHON=%CD%\.venv-ci\Scripts\python.exe"
          "%VENV_PYTHON%" -c "import sys; print(sys.version)"
          if errorlevel 1 exit /b 1

          >>"%GITHUB_ENV%" echo OMNICIO_PYTHON=%VENV_PYTHON%

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install -e ".[dev]"
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.command }}
