name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/auth-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hosted PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest

  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            task: ruff
          - name: Mypy
            task: mypy
          - name: Security tests
            task: security
          - name: Service and support tests
            task: service-support

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Resolve installed Python and isolate job environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null

          $launcher = Get-Command py -ErrorAction SilentlyContinue
          if ($launcher) {
            foreach ($version in @("3.13", "3.12")) {
              try {
                $candidate = (
                  & $launcher.Source "-$version" -c "import sys; print(sys.executable)" 2>$null |
                    Select-Object -Last 1
                )
                if ($LASTEXITCODE -eq 0 -and $candidate) {
                  $python = $candidate.Trim()
                  break
                }
              } catch {
                # Try the next supported interpreter.
              }
            }
          }

          if (-not $python) {
            $command = Get-Command python -ErrorAction SilentlyContinue
            if ($command) {
              try {
                $version = (
                  & $command.Source -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" |
                    Select-Object -Last 1
                ).Trim()
                if ($LASTEXITCODE -eq 0 -and $version -in @("3.12", "3.13")) {
                  $python = $command.Source
                }
              } catch {
                # Fall through to the explicit diagnostic below.
              }
            }
          }

          if (-not $python) {
            Write-Host "PowerShell execution policy:"
            Get-ExecutionPolicy -List | Format-Table | Out-String | Write-Host
            throw "Python 3.12 or 3.13 is not installed on this self-hosted runner."
          }

          & $python -m venv .venv-ci
          $venvPython = Join-Path $PWD ".venv-ci\Scripts\python.exe"
          & $venvPython -c "import sys; print(sys.version)"
          "OMNICIO_PYTHON=$venvPython" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install project and test tooling
        shell: powershell
        run: |
          & $env:OMNICIO_PYTHON -m pip install --upgrade pip
          & $env:OMNICIO_PYTHON -m pip install -e ".[dev]"

      - name: Run ${{ matrix.name }}
        shell: powershell
        run: |
          switch ("${{ matrix.task }}") {
            "ruff" {
              & $env:OMNICIO_PYTHON -m ruff check src tests
              break
            }
            "mypy" {
              & $env:OMNICIO_PYTHON -m mypy src
              break
            }
            "security" {
              & $env:OMNICIO_PYTHON -m pytest tests/test_security.py
              break
            }
            "service-support" {
              & $env:OMNICIO_PYTHON -m pytest tests/test_service.py tests/test_support.py
              break
            }
            default {
              throw "Unknown self-hosted CI task: ${{ matrix.task }}"
            }
          }
