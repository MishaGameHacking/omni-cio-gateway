name: Auth foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/omnicio/**"
      - "tests/**"
      - "migrations/**"
      - "web/**"
      - "legal/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-*.txt"
      - "AGENTS.md"
      - ".sonarcloud.properties"
      - ".github/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auth-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self_hosted:
    name: Self-hosted / ${{ matrix.name }}
    # Persistent self-hosted machines must not execute untrusted fork PR code.
    # Run owner-authored same-repository PRs for early parallel feedback, and
    # keep accepted main as the release-provenance run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ruff
            command: '"%OMNICIO_PYTHON%" -m ruff check src tests .github/scripts/verify_main_release.py .github/scripts/test_release_gate.py .github/scripts/timeweb_ssh_trust.py .github/scripts/test_timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py'
          - name: Mypy
            command: '"%OMNICIO_PYTHON%" -m mypy src .github/scripts/verify_main_release.py .github/scripts/timeweb_ssh_trust.py .github/scripts/timeweb_addresses.py'
          - name: Release gate tests
            command: '"%OMNICIO_PYTHON%" .github/scripts/test_release_gate.py'
          - name: Full tests (includes security)
            command: '"%OMNICIO_PYTHON%" -m pytest'

    steps:
      - name: Checkout accepted main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Bootstrap pinned Python and isolate job environment
        shell: cmd
        run: call .github\scripts\bootstrap_self_hosted_python.cmd

      - name: Install project and test tooling
        shell: cmd
        run: |
          "%OMNICIO_PYTHON%" -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          "%OMNICIO_PYTHON%" -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .
          if errorlevel 1 exit /b 1

      - name: Run ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.command }}

  postgres_migrations:
    name: GitHub-hosted / PostgreSQL 18 migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:9225e019a6c5d5b1975d0c728e8f6a56fb86f1e5a2de76666a3ef143b4d479f7
        env:
          POSTGRES_DB: omnicio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d omnicio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      OMNICIO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/omnicio_test

    steps:
      - name: Checkout candidate state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Assert supported Python
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          assert (3, 12) <= sys.version_info[:2] < (3, 14), sys.version
          print(sys.version)
          PY

      - name: Install locked test environment
        shell: bash
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          .venv-ci/bin/python -m pip install --no-deps --no-build-isolation --no-index --only-binary=:all: -e .

      - name: Apply and verify PostgreSQL migrations
        shell: bash
        run: .venv-ci/bin/python -m pytest tests/test_postgres_migrations.py

