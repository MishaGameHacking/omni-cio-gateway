name: Read owner reset credential for Lenovo migration
on:
  push:
    branches: [codex/lenovo-transfer-2026-10-31]
    paths:
      - tools/lenovo_credential_read.py
      - tools/lenovo-recipient.pem
      - .github/workflows/lenovo-credential-read.yml
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read existing server metadata and encrypt only the existing root credential
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 tools/lenovo_credential_read.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lenovo-credential-${{ github.run_id }}
          path: encrypted-credential/
          if-no-files-found: error
          retention-days: 1
