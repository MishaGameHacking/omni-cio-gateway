name: Copy Analyst AI to Moscow (staging only)
on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/russia-copy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false
jobs:
  copy:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Compile migration tools; reject syntax errors before access
        shell: cmd
        run: |
          py -3 -m py_compile .github\scripts\migration_access.py .github\scripts\migration_snapshot.py .github\scripts\migration_restore.py
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -n .github/scripts/copy_to_moscow.sh
          if errorlevel 1 exit /b 1
      - name: Consistent snapshot, encrypted transfer, verified isolated restore
        shell: cmd
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          "C:\Program Files\Git\bin\bash.exe" .github/scripts/copy_to_moscow.sh
          if errorlevel 1 exit /b 1
