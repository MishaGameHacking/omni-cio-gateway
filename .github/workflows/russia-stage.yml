name: Russian staging server (owner authorized)

on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/russia-stage.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false

jobs:
  stage:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout audited migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Provision at most one Russian VM; do not stop or delete source
        shell: cmd
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          py -3 .github\scripts\provision_russian_stage.py
          if errorlevel 1 exit /b 1
