name: Exact source for code review

on:
  push:
    branches:
      - feature/mandatory-updates-quant-research
      - feature/spectrum-ui-risk-update
    paths:
      - .github/workflows/review-source.yml

permissions:
  contents: read

jobs:
  archive:
    name: Archive tracked source only
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Archive committed files without Git credentials or runner data
        shell: cmd
        run: |
          git archive --format=zip --output="%RUNNER_TEMP%\analyst-source-%GITHUB_RUN_ID%.zip" HEAD
          if errorlevel 1 exit /b 1
      - name: Save private audit source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-source-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analyst-source-${{ github.run_id }}.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
          overwrite: false
