name: Recover retained frozen theme46 package identities
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/theme46-recovery-inventory.yml
permissions:
  contents: read
concurrency:
  group: analyst-theme46-package-recovery-readonly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout pinned administrative transport only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Read only bounded task package and archive member identities
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\nsys.path[:0]=[\".transport-admin/deploy\"\
        ,\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\n\
        def api(method,path,body=None):\n    req=urllib.request.Request(\"https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if raw else {}\n    except urllib.error.HTTPError\
        \ as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"\
        83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g\"\n    status,data=api(\"GET\"\
        ,\"/servers/\"+str(sid));assert status==200\n    server=data[\"server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"\
        ]==2941515 and server[\"availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"client\");public=(folder/\"\
        client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\",{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"\
        ],\"body\":public,\"is_default\":False})\n        key=created.get(\"ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int\
        \ and key[\"body\"].split()[:2]==public.split()[:2]\n        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"\
        /ssh-keys\",{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\"\
        ]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n\
        \                    if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input is None else binary_input\n\
        \            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"+shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n                print(\"AMS_REMOTE_ERROR=\"\
        +result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n                raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n\
        \        finally:\n            try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n       \
        \     finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\n\
        remote = '\"\"\"Read only names and identities in the existing task archive store.\"\"\"\\nimport datetime\\nimport hashlib\\nimport json\\nimport os\\nfrom\
        \ pathlib import Path\\nimport re\\nimport stat\\nimport zipfile\\n\\nroot = Path(\\'/var/lib/analyst-ai-build\\')\\nassert root.resolve(strict=True) == root\
        \ and root.is_dir()\\npattern = re.compile(r\\'native46|publisher45|themes?[-_]?46|themes?.*(?:bundle|patch|generator)\\', re.I)\\nreport = {\\'observed_at\\\
        ': datetime.datetime.now(datetime.timezone.utc).isoformat(),\\n          \\'root\\': str(root), \\'files\\': [], \\'archive_members\\': [], \\'archives_scanned\\\
        ': 0,\\n          \\'code_executed\\': False, \\'files_changed\\': False, \\'truncated\\': False}\\nseen = 0\\nfor directory, directories, files in os.walk(root,\
        \ followlinks=False):\\n    directories[:] = [name for name in directories if name not in\\n        {\\'.git\\', \\'.gradle\\', \\'.venv\\', \\'venv\\', \\\
        'node_modules\\', \\'avd\\', \\'.android\\', \\'build\\'}\\n        and not (Path(directory) / name).is_symlink()]\\n    for name in files:\\n        seen\
        \ += 1\\n        if seen > 100000:\\n            raise RuntimeError(\\'task_archive_inventory_budget_exceeded\\')\\n        p = Path(directory) / name\\n\
        \        info = p.lstat()\\n        if not stat.S_ISREG(info.st_mode) or p.is_symlink() or info.st_nlink != 1:\\n            continue\\n        if pattern.search(name)\
        \ and p.suffix.lower() in {\\'.py\\', \\'.json\\', \\'.b64\\', \\'.patch\\', \\'.zip\\'}:\\n            row = {\\'path\\': str(p), \\'bytes\\': info.st_size}\\\
        n            if info.st_size < 8 * 1024**2:\\n                row[\\'sha256\\'] = hashlib.sha256(p.read_bytes()).hexdigest()\\n            report[\\'files\\\
        '].append(row)\\n        if name == \\'windows-development-evidence.zip\\' and p.parent.parent.name == \\'incoming\\':\\n            report[\\'archives_scanned\\\
        '] += 1\\n            if report[\\'archives_scanned\\'] > 200:\\n                raise RuntimeError(\\'task_archive_count_budget_exceeded\\')\\n         \
        \   with zipfile.ZipFile(p) as archive:\\n                members = archive.infolist()\\n                assert len(members) <= 10000\\n                for\
        \ member in members:\\n                    if pattern.search(Path(member.filename).name):\\n                        report[\\'archive_members\\'].append({\\\
        'archive\\': str(p), \\'member\\': member.filename,\\n                            \\'bytes\\': member.file_size})\\n        if len(report[\\'files\\']) +\
        \ len(report[\\'archive_members\\']) > 100:\\n            raise RuntimeError(\\'matched_package_budget_exceeded\\')\\nprint(\\'THEME46_RECOVERY_INVENTORY=\\\
        ' + json.dumps(report, sort_keys=True))\\n'\nassert hashlib.sha256(remote.encode()).hexdigest()=='745e662702e58858f4818332f12fc46acd50c44830e8f682410bcde259f4499e'\n\
        with_ams(remote,timeout=180)\nPY\n"
