name: V10 WP16 Web Design System Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp16-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-design-system:
    name: WP16 deterministic Web design-system gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: apps/web

    steps:
      - name: Expose installed Git Bash before repository bootstrap
        shell: cmd
        working-directory: .
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "$git=(Get-Command git.exe -ErrorAction Stop).Source; $root=Split-Path -Parent (Split-Path -Parent $git); $bin=Join-Path $root 'bin'; if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { exit 12 }; $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
          if errorlevel 1 exit /b 12

      - name: Bootstrap exact reviewed repository without external Actions
        shell: bash
        working-directory: .
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          bootstrap_succeeded=0
          for bootstrap_attempt in 1 2 3; do
            rm -rf .git
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local gc.auto 0
            git config --local credential.helper ""
            git config --local --add credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
            fetch_status=0
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git fetch --no-tags --prune --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || fetch_status=$?
            else
              git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event" || fetch_status=$?
            fi
            git config --local --unset-all credential.helper 2>/dev/null || true
            if [ "$fetch_status" -eq 0 ]; then
              bootstrap_succeeded=1
              break
            fi
            rm -rf .git
            if [ "$bootstrap_attempt" -lt 3 ]; then
              echo "Repository bootstrap transport failed on attempt ${bootstrap_attempt}/3; retrying after bounded backoff." >&2
              sleep "$((bootstrap_attempt * 5))"
            fi
          done
          if [ "$bootstrap_succeeded" -ne 1 ]; then
            echo "Repository bootstrap transport failed after 3 attempts." >&2
            exit 70
          fi
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git config --local --get-all credential.helper || true)"

      - name: Bootstrap protected runner tools
        working-directory: .
        run: |
          call scripts\bootstrap_windows_ci_python.cmd
          if errorlevel 1 exit /b 10
          if not exist "C:\Program Files\nodejs\node.exe" exit /b 11
          if not exist "C:\Program Files\nodejs\npm.cmd" exit /b 12
          >>"%GITHUB_PATH%" echo C:\Program Files\nodejs

      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: .
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 13
          echo WP16 exact head: %ACTUAL_HEAD%

      - name: Verify selected Node and npm runtime
        run: |
          "C:\Program Files\nodejs\node.exe" -e "if (process.version !== 'v24.18.0') process.exit(1); console.log(process.version)"
          if errorlevel 1 exit /b 20
          powershell.exe -NoProfile -NonInteractive -Command "$v = (& 'C:\Program Files\nodejs\npm.cmd' --version | Out-String).Trim(); Write-Host ('npm ' + $v); if ($v -ne '11.16.0') { exit 22 }"
          if errorlevel 1 exit /b 22

      - name: Verify committed lock is exact and current
        run: |
          if not exist package-lock.json exit /b 29
          copy /y package-lock.json package-lock.before.json >nul
          call "C:\Program Files\nodejs\npm.cmd" install --package-lock-only --ignore-scripts --no-audit --no-fund
          if errorlevel 1 exit /b 30
          "C:\Program Files\nodejs\node.exe" -e "const fs=require('node:fs'); const assert=require('node:assert/strict'); const before=JSON.parse(fs.readFileSync('package-lock.before.json','utf8')); const after=JSON.parse(fs.readFileSync('package-lock.json','utf8')); assert.deepStrictEqual(after,before);"
          if errorlevel 1 exit /b 31
          del /q package-lock.before.json

      - name: Reproduce dependencies from committed lock
        run: |
          call "C:\Program Files\nodejs\npm.cmd" ci --ignore-scripts --no-audit --no-fund
          if errorlevel 1 exit /b 40

      - name: Type-check Web design system
        run: |
          call "C:\Program Files\nodejs\npm.cmd" run typecheck
          if errorlevel 1 exit /b 41

      - name: Lint Web design system
        run: |
          call "C:\Program Files\nodejs\npm.cmd" run lint
          if errorlevel 1 exit /b 42

      - name: Run Web unit contracts
        run: |
          call "C:\Program Files\nodejs\npm.cmd" test
          if errorlevel 1 exit /b 43

      - name: Build Web design-system gallery
        run: |
          call "C:\Program Files\nodejs\npm.cmd" run build
          if errorlevel 1 exit /b 44

      - name: Run browser accessibility responsive and screenshot evidence
        env:
          OMNI_WEB_BROWSER_CHANNEL: msedge
        run: |
          call "C:\Program Files\nodejs\npm.cmd" run e2e
          if errorlevel 1 exit /b 45

      - name: Audit Web dependencies
        run: |
          call "C:\Program Files\nodejs\npm.cmd" audit --audit-level=high
          if errorlevel 1 exit /b 46

      - name: Verify permanent Web and repository contracts
        working-directory: .
        run: |
          python scripts\check_v10_web_baseline.py
          if errorlevel 1 exit /b 49
          python scripts\check_v10_repository_boundaries.py
          if errorlevel 1 exit /b 50
          python scripts\check_v10_regression_shield.py
          if errorlevel 1 exit /b 51
          python -m unittest tests.test_v10_web_baseline
          if errorlevel 1 exit /b 52

      - name: Summarize lock and visual evidence without external Actions
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            echo "### WP16 evidence"
            if [ -f apps/web/package-lock.json ]; then
              echo "- package-lock.json sha256=$(sha256sum apps/web/package-lock.json | awk '{print $1}')"
            fi
            if [ -d apps/web/test-results ]; then
              echo "- browser test-results produced; details remain in job log/workspace until cleanup"
            else
              echo "- browser test-results not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        working-directory: .
        run: |
          git config --local --unset-all credential.helper 2>/dev/null || true
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git reset --hard HEAD
            git clean -ffdx
          else
            rm -rf .git
          fi
