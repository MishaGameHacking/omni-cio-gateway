name: TEMP V10 Post-Merge Regression Verification 334

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/v10-temp-postmerge-regression-verification-334.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify-postmerge-regression:
    name: Verify exact-main post-merge Regression Shield
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Regression Shield for exact accepted main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 67223469e0031b94d0ada7c5c0d92e3e4efb8d22
        run: |
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_MAIN_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          runs = get_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "regression-shield.yml/runs?branch=main&event=push&per_page=20"
          )["workflow_runs"]
          matches = sorted(
              (
                  run
                  for run in runs
                  if run["head_sha"] == expected
                  and run["event"] == "push"
                  and run["head_branch"] == "main"
              ),
              key=lambda run: run["run_number"],
              reverse=True,
          )
          if len(matches) != 1:
              raise SystemExit("POSTMERGE_REGRESSION_RUN_NOT_FOUND")
          run = matches[0]
          if run["status"] != "completed":
              raise SystemExit(
                  f"POSTMERGE_REGRESSION_NOT_COMPLETED: run={run['id']} "
                  f"status={run['status']}"
              )
          if run["conclusion"] != "success":
              raise SystemExit(
                  f"POSTMERGE_REGRESSION_NOT_GREEN: run={run['id']} "
                  f"conclusion={run['conclusion']}"
              )

          jobs = get_json(run["jobs_url"])["jobs"]
          required = (
              "Quality, contracts and coverage",
              "Dependency, code and secret security",
          )
          for name in required:
              matching = [job for job in jobs if job["name"] == name]
              if len(matching) != 1:
                  raise SystemExit(f"POSTMERGE_REQUIRED_JOB_NOT_FOUND: {name}")
              job = matching[0]
              if job["status"] != "completed" or job["conclusion"] != "success":
                  raise SystemExit(
                      f"POSTMERGE_REQUIRED_JOB_NOT_GREEN: {name} "
                      f"status={job['status']} conclusion={job['conclusion']}"
                  )

          print(
              "REGRESSION_SHIELD_EVIDENCE "
              f"run_id={run['id']} run_number={run['run_number']} "
              f"head_sha={run['head_sha']} conclusion={run['conclusion']}"
          )
          for name in required:
              job = next(job for job in jobs if job["name"] == name)
              print(f"REGRESSION_SHIELD_JOB name={name} conclusion={job['conclusion']}")
