# Historical WP22A Render/Neon provider workflow.
# Amendment 14 retires this path from active V10 provider authority. It remains
# manual-only so historical GitHub links stay resolvable, but invocation fails
# closed before any provider mutation.
name: V10 Phase 4 Free Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-phase4-retired-render-preview
  cancel-in-progress: false

jobs:
  retired-render-preview:
    name: Historical Render preview path is retired
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Refuse obsolete Render provider mutation
        shell: cmd
        run: |
          @echo off
          echo LEGACY_RENDER_PHASE4_RETIRED_AMENDMENT_14
          echo This workflow is historical evidence only and is not an active V10 deployment path.
          echo Use the accepted Timeweb authority under Amendment 18; do not refresh Render attestation or mutate Render.
          exit /b 78
