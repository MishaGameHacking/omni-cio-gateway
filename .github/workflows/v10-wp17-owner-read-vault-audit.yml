name: V10 WP17 OWNER Read Vault Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp17-timeweb-secret-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-read-vault:
    name: OWNER read-vault and runner-isolation evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Prove Timeweb hosted secret boundary has no OWNER-laptop dependency
        run: python scripts/check_v10_timeweb_no_owner_laptop_dependency.py

      - name: Run no-OWNER-laptop regression tests
        run: python -m unittest tests.test_v10_timeweb_no_owner_laptop_dependency
