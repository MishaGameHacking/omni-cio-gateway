name: Repair Moscow update channel

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/scripts/repair_moscow_update_channel.sh"
      - ".github/scripts/run_moscow_update_channel_repair.py"
      - ".github/scripts/tests/test_moscow_update_channel_repair.py"
      - ".github/workflows/repair-moscow-update-channel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyst-moscow-update-channel
  cancel-in-progress: false

jobs:
  repair:
    name: Restore live version policy and verified APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[repair-update-channel]'))
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 35
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      BASH_EXE: C:\Program Files\Git\bin\bash.exe
      RELEASE_TAG: android-preview-a957e62dbf41af06be4a8f9c399e8f3745188344
      RELEASE_APK_NAME: Analyst-AI-0.9.0-preview-a957e62.apk
      RELEASE_APK_SHA256: 32be82e640498010a0b61e073a6d82ec2237e766fac660058c447096445a1076
      RELEASE_REPORT_NAME: apk-verification.json
      RELEASE_REPORT_SHA256: d65a390f166b4b3766539ccd1765b17f22f0e703d73b3b4a3d3bc651a4e2222b

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Validate repair workflow before cloud access
        shell: cmd
        run: |
          py -3 -m unittest discover -s .github\scripts\tests -p "test_moscow_update_channel_repair.py" -v
          if errorlevel 1 exit /b 1
          py -3 -m py_compile .github\scripts\run_moscow_update_channel_repair.py
          if errorlevel 1 exit /b 1
          py -3 .github\scripts\run_moscow_update_channel_repair.py --check
          if errorlevel 1 exit /b 1

      - name: Download exact immutable verified release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const release = (await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            })).data;
            if (release.draft || release.target_commitish !== 'a957e62dbf41af06be4a8f9c399e8f3745188344') {
              throw new Error('Release identity does not match the verified main commit');
            }
            async function download(name, expectedSha, outputName) {
              const asset = release.assets.find(candidate => candidate.name === name);
              if (!asset) throw new Error(`Missing release asset: ${name}`);
              const response = await github.rest.repos.getReleaseAsset({
                ...context.repo,
                asset_id: asset.id,
                headers: {accept: 'application/octet-stream'},
              });
              const bytes = Buffer.from(response.data);
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (digest !== expectedSha) throw new Error(`Release asset checksum mismatch: ${name}`);
              const destination = path.join(process.env.RUNNER_TEMP, outputName);
              fs.writeFileSync(destination, bytes, {mode: 0o600});
              return destination;
            }
            core.exportVariable('APK_PATH', await download(
              process.env.RELEASE_APK_NAME,
              process.env.RELEASE_APK_SHA256,
              `analyst-ai-${context.runId}.apk`,
            ));
            core.exportVariable('REPORT_PATH', await download(
              process.env.RELEASE_REPORT_NAME,
              process.env.RELEASE_REPORT_SHA256,
              `analyst-ai-${context.runId}-verification.json`,
            ));

      - name: Repair canonical backend and update channel
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          py -3 .github\scripts\run_moscow_update_channel_repair.py
          if errorlevel 1 exit /b 1

