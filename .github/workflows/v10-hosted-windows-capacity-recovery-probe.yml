name: V10 Hosted Windows Capacity Recovery Probe

on:
  pull_request:
    paths:
      - ".github/workflows/v10-hosted-windows-capacity-recovery-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-hosted-windows-capacity-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capacity-probe:
    name: Hosted Windows recovery capacity probe
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "HOSTED_RECOVERY_HEAD_MISMATCH"
          }
          Write-Host "HOSTED_RECOVERY_EXACT_HEAD=$actual"

      - name: Verify hosted Windows toolchain candidate
        shell: pwsh
        run: |
          $pythonVersion = (python --version 2>&1 | Out-String).Trim()
          if ($pythonVersion -ne "Python 3.12.10") {
            throw "HOSTED_RECOVERY_PYTHON_VERSION_MISMATCH"
          }

          $node24 = Join-Path $env:RUNNER_TOOL_CACHE "node\24.18.0\x64\node.exe"
          if (-not (Test-Path -LiteralPath $node24 -PathType Leaf)) {
            throw "HOSTED_RECOVERY_NODE24_MISSING"
          }
          $nodeVersion = (& $node24 --version 2>&1 | Out-String).Trim()
          if ($nodeVersion -ne "v24.18.0") {
            throw "HOSTED_RECOVERY_NODE_VERSION_MISMATCH"
          }

          $bash = Get-Command bash.exe -ErrorAction SilentlyContinue
          if ($null -eq $bash) {
            throw "HOSTED_RECOVERY_GIT_BASH_MISSING"
          }

          Write-Host "HOSTED_RECOVERY_WINDOWS_TOOLCHAIN=PASS"

      - name: Verify pinned PostgreSQL 18 supply chain
        shell: pwsh
        run: |
          $uri = "https://get.enterprisedb.com/postgresql/postgresql-18.4-1-windows-x64.exe"
          $expectedSha256 = "44B8187D2DB7E866495952D8260A1D7252CBB5125843142E1F0BF30115D23279"
          $installer = Join-Path $env:RUNNER_TEMP "postgresql-18.4-1-windows-x64.exe"
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $installer
            $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "HOSTED_RECOVERY_POSTGRES18_HASH_MISMATCH"
            }
            Write-Host "HOSTED_RECOVERY_POSTGRES18_SUPPLY=PASS"
          }
          finally {
            Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
          }

      - name: Record bounded recovery probe result
        shell: pwsh
        run: |
          Write-Host "HOSTED_WINDOWS_CAPACITY_RECOVERY_PROBE=PASS"
          Write-Host "PAID_RUNNER_SELECTED=NO"
          Write-Host "BILLING_MUTATION_PERFORMED=NO"
          Write-Host "REAL_SECRETS_USED=NO"
          Write-Host "PRODUCTION_MUTATION_PERFORMED=NO"
