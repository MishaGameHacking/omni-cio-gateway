name: Read candidate52 laptop verification progress
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/workspace-native-progress.yml]
permissions: {}
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read bounded owned build diagnostics
        shell: py -3 {0}
        run: |
          import json, os, re
          from pathlib import Path
          if os.environ.get("COMPUTERNAME") != "LAPTOP-NPSGA016":
              raise RuntimeError("owner_laptop_required")
          for runner in ("actions-runner", "actions-runner-2", "actions-runner-3", "actions-runner-4"):
              folder = Path("C:/") / runner / "_work/_temp/server-version-client-40750352430-1"
              for name in ("shell-build-steps.json", "gradle.log"):
                  path = folder / name
                  if not path.is_file(): continue
                  with path.open("rb") as stream:
                      stream.seek(max(0,path.stat().st_size-26000))
                      value = stream.read(26000).decode("utf-8",errors="replace")
                  if name.endswith(".json"):
                      value = json.dumps([{"label":s.get("label"),"exit_code":s.get("exit_code")} for s in json.loads(value).get("steps",[])])
                  print("OWNED_BUILD_PROGRESS=" + name + "\n" + value[-24000:])
