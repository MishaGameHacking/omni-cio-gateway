name: Read exact debug-probe verification progress
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/workspace-native-progress.yml]
permissions: {}
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read bounded owned check logs
        shell: py -3 {0}
        run: |
          import os
          from pathlib import Path
          if os.environ.get("COMPUTERNAME") != "LAPTOP-NPSGA016":
              raise RuntimeError("owner_laptop_required")
          for runner in ("actions-runner", "actions-runner-2", "actions-runner-3", "actions-runner-4"):
              folder = Path("C:/") / runner / "_work/_temp/server-version-client-40764615158-1"
              for path in folder.glob("*.log"):
                  with path.open("rb") as stream:
                      stream.seek(max(0, path.stat().st_size - 24000))
                      lines = stream.read(24000).decode("utf-8", errors="replace").splitlines()
                  selected = [line for line in lines if any(word in line for word in
                      ("e: ", "FAIL", "Error", "Exception", "BUILD ", "Task ", "Ran ", "OK", "tests completed", "LEASE"))]
                  print(path.name + "\n" + "\n".join(selected[-35:]))
