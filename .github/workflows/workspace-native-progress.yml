name: Read candidate52 laptop verification progress
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/workspace-native-progress.yml]
permissions: {}
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read bounded owned build and render diagnostics
        shell: py -3 {0}
        run: |
          import json, os
          from pathlib import Path
          if os.environ.get("COMPUTERNAME") != "LAPTOP-NPSGA016":
              raise RuntimeError("owner_laptop_required")
          folders = ("redesign-visual-40757305810-1", "server-version-client-40757238094-1")
          for runner in ("actions-runner", "actions-runner-2", "actions-runner-3", "actions-runner-4"):
              for owned in folders:
                  folder = Path("C:/") / runner / "_work/_temp" / owned
                  for path in folder.glob("*steps*.log"):
                      if not any(word in path.name for word in ("gradle", "compose-preview", "host-tests")):
                          continue
                      with path.open("rb") as stream:
                          stream.seek(max(0,path.stat().st_size-18000))
                          value=stream.read(18000).decode("utf-8", errors="replace")
                      lines=value.splitlines()
                      selected=[line for line in lines if any(word in line for word in ("e: ", "FAIL", "Error", "Exception", "BUILD ", "Task ", "Ran ", "OK", "FAILED", "tests completed"))]
                      print(owned + "/" + path.name + "\n" + "\n".join(selected[-40:]))
