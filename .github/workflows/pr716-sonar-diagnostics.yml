name: PR 716 Sonar diagnostics

on:
  push:
    branches:
      - feature/web-market-quotes
    paths:
      - ".github/workflows/pr716-sonar-diagnostics.yml"

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    name: Read Sonar annotations
    if: github.repository == 'MishaGameHacking/omni-cio-gateway'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read exact Sonar check annotations
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $checkId = 111362754643
          $url = "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/$checkId/annotations?per_page=100"
          $rows = Invoke-RestMethod -Headers $headers -Uri $url -Method Get
          $rows |
            Select-Object path,start_line,end_line,annotation_level,title,message |
            ConvertTo-Json -Depth 4
