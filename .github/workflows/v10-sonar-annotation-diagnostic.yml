name: V10 Sonar Annotation Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  checks: read

concurrency:
  group: v10-sonar-annotation-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  annotations:
    name: Read Sonar annotations
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read completed Sonar annotations
        shell: cmd
        run: |
          @echo off
          echo SONAR_DIAGNOSTIC_SOURCE_HEAD=a7b19dd17886142bc33d9b1f40152641634f389e
          curl.exe -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer %GH_TOKEN%" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/99129352927/annotations?per_page=100"
