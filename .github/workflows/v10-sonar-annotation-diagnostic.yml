name: V10 Sonar Annotation Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  checks: read

concurrency:
  group: v10-sonar-annotation-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  annotations:
    name: Read Sonar annotations
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for exact-head Sonar annotations
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["EXPECTED_HEAD"]
          token = os.environ["GH_TOKEN"]
          api = os.environ["GITHUB_API_URL"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          sonar = None
          for attempt in range(36):
              checks = get_json(
                  f"{api}/repos/{repo}/commits/{sha}/check-runs?per_page=100"
              )
              candidates = [
                  item
                  for item in checks.get("check_runs", [])
                  if item.get("name") == "SonarCloud Code Analysis"
                  and item.get("head_sha") == sha
              ]
              if candidates and candidates[0].get("status") == "completed":
                  sonar = candidates[0]
                  break
              if attempt == 35:
                  raise SystemExit("SONAR_DIAGNOSTIC_EXACT_HEAD_NOT_COMPLETE")
              time.sleep(10)

          annotations_url = sonar.get("output", {}).get("annotations_url", "")
          if not annotations_url:
              raise SystemExit("SONAR_DIAGNOSTIC_ANNOTATIONS_URL_MISSING")
          annotations = get_json(f"{annotations_url}?per_page=100")
          print(f"SONAR_DIAGNOSTIC_HEAD={sha}")
          print(f"SONAR_DIAGNOSTIC_CONCLUSION={sonar.get('conclusion')}")
          print(f"SONAR_DIAGNOSTIC_ANNOTATIONS={len(annotations)}")
          for item in annotations:
              path = str(item.get("path", ""))[:300]
              start = item.get("start_line")
              end = item.get("end_line")
              level = str(item.get("annotation_level", ""))[:30]
              title = " ".join(str(item.get("title") or "").split())[:300]
              message = " ".join(str(item.get("message") or "").split())[:1000]
              print(
                  "SONAR_ANNOTATION "
                  f"path={path} lines={start}-{end} level={level} "
                  f"title={title!r} message={message!r}"
              )
          PY
