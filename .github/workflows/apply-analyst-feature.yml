name: Apply Timeweb AI deployment wiring

on:
  push:
    branches:
      - feat/portfolio-currency-five-tabs-ai-policy
    paths:
      - ".github/scripts/apply_timeweb_ai_deploy.py"
      - ".github/workflows/apply-analyst-feature.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/portfolio-currency-five-tabs-ai-policy
          fetch-depth: 0
          clean: true

      - name: Apply deployment transformation
        shell: cmd
        run: |
          py -3 .github\scripts\apply_timeweb_ai_deploy.py
          if errorlevel 1 exit /b 1

      - name: Validate generated deployment files
        shell: cmd
        run: |
          git diff --check
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -n ".github/scripts/deploy_timeweb_backend.sh"
          if errorlevel 1 exit /b 1

      - name: Commit deployment wiring
        shell: cmd
        run: |
          git config user.name "Analyst AI automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github\workflows\timeweb-backend.yml .github\scripts\deploy_timeweb_backend.sh
          git diff --cached --quiet
          if not errorlevel 1 (
            echo No generated changes to commit
            exit /b 0
          )
          git commit -m "feat(ai): deploy Timeweb Gateway configuration securely"
          if errorlevel 1 exit /b 1
          git push origin HEAD:feat/portfolio-currency-five-tabs-ai-policy
          if errorlevel 1 exit /b 1
