name: Apply Analyst AI feature transformation

on:
  push:
    branches:
      - feat/portfolio-currency-five-tabs-ai-policy
    paths:
      - ".github/scripts/apply_analyst_feature.py"
      - ".github/workflows/apply-analyst-feature.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/portfolio-currency-five-tabs-ai-policy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source transformation
        run: python .github/scripts/apply_analyst_feature.py

      - name: Check generated diff
        run: |
          git diff --check
          python -m compileall -q backend

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt

      - name: Run backend tests
        env:
          TELEGRAM_CLIENT_ID: "123456"
          TELEGRAM_CLIENT_SECRET: test-only
          BACKEND_PUBLIC_URL: https://example.invalid
          DATABASE_PATH: /tmp/analyst-ai-feature-tests.sqlite3
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and lint Android app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      - name: Commit transformed source
        run: |
          git config user.name "Analyst AI automation"
          git config user.email "actions@users.noreply.github.com"
          git add AGENTS.md README.md app backend
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: add real portfolio currencies, five tabs and AI spend gate"
          git push origin HEAD:feat/portfolio-currency-five-tabs-ai-policy
