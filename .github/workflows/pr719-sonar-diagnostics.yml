name: PR 719 Sonar diagnostics

on:
  push:
    branches:
      - chore/sonar-zero-probe
    paths:
      - ".github/workflows/pr719-sonar-diagnostics.yml"

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    name: Read Sonar annotations
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Read exact Sonar check annotations
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl.exe --fail --silent --show-error
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer %GH_TOKEN%"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/MishaGameHacking/omni-cio-gateway/check-runs/111366490897/annotations?per_page=100"
