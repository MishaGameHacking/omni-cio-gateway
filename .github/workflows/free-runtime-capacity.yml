name: Read current owner runtime capacity for the free-hosting decision
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/free-runtime-capacity.yml
permissions:
  contents: read
concurrency:
  group: analyst-runtime-capacity-readonly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Checkout pinned administrative transport only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Read bounded current service, memory, disk and health observations
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        PYTHONUNBUFFERED: '1'
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"\
        server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"\
        availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\n\nREMOTE_SHA256 = '6ce23ba3ad32e18e6b91824af70e2e76fc77d6c975c54227d5c596d24b91c066'\n\
        remote = '\"\"\"Read current runtime capacity. No application imports or runtime mutations.\"\"\"\\nimport datetime\\\
        nimport json\\nimport os\\nfrom pathlib import Path\\nimport shutil\\nimport stat\\nimport subprocess\\nimport time\\\
        nimport urllib.request\\n\\n\\ndef main():\\n    assert os.geteuid() == 0\\n    memory = {}\\n    for line in Path(\\\
        '/proc/meminfo\\').read_text().splitlines():\\n        key, value = line.split(\\':\\', 1)\\n        if key in {\\\
        'MemTotal\\', \\'MemAvailable\\', \\'SwapTotal\\', \\'SwapFree\\'}:\\n            memory[key] = int(value.split()[0])\
        \ * 1024\\n    services = {}\\n    allowed = {\\'ActiveState\\', \\'SubState\\', \\'NRestarts\\', \\'MemoryCurrent\\\
        ', \\'MemoryPeak\\', \\'CPUUsageNSec\\'}\\n    for unit in (\\'analyst-ai-owner.service\\', \\'analyst-ai-updates.service\\\
        ', \\'caddy.service\\'):\\n        result = subprocess.run([\\'systemctl\\', \\'show\\', unit, \\'--property=\\' +\
        \ \\',\\'.join(sorted(allowed))],\\n                                capture_output=True, text=True, timeout=8, check=True)\\\
        n        values = dict(line.split(\\'=\\', 1) for line in result.stdout.splitlines() if \\'=\\' in line)\\n      \
        \  assert set(values) <= allowed\\n        services[unit] = values\\n    timings = []\\n    for _ in range(3):\\n\
        \        start = time.monotonic()\\n        with urllib.request.urlopen(\\'http://127.0.0.1:8080/health\\', timeout=5)\
        \ as response:\\n            assert response.status == 200 and response.read(1024) == b\\'{\"status\":\"ok\"}\\'\\\
        n        timings.append(round((time.monotonic() - start) * 1000, 2))\\n    latest = Path(\\'/var/lib/analyst-ai-ops/latest-resource-sample.json\\\
        ')\\n    observation = {\\'available\\': False}\\n    if latest.exists():\\n        info = latest.lstat()\\n     \
        \   assert stat.S_ISREG(info.st_mode) and not latest.is_symlink() and info.st_size <= 16384\\n        value = json.loads(latest.read_bytes())\\\
        n        observation = {\\'available\\': True, \\'sample_at_utc\\': value.get(\\'at_utc\\'),\\n                  \
        \     \\'sample_age_seconds\\': int(time.time()) - int(value[\\'at\\']),\\n                       \\'cpu_busy_percent\\\
        ': value.get(\\'cpu_busy_percent\\'), \\'sqlite_bytes\\': value.get(\\'sqlite_bytes\\')}\\n    disk = shutil.disk_usage(\\\
        '/var/lib/analyst-ai\\')\\n    print(json.dumps({\\'schema\\': 1, \\'kind\\': \\'runtime_capacity_readonly\\', \\\
        'runtime_server_id\\': 9417611,\\n        \\'observed_at\\': datetime.datetime.now(datetime.timezone.utc).isoformat(),\\\
        n        \\'memory_bytes\\': memory, \\'load_average\\': list(os.getloadavg()),\\n        \\'disk_bytes\\': {\\'total\\\
        ': disk.total, \\'used\\': disk.used, \\'free\\': disk.free},\\n        \\'services\\': services, \\'local_health_ms\\\
        ': timings, \\'existing_sample\\': observation,\\n        \\'runtime_files_written\\': False, \\'database_opened\\\
        ': False, \\'services_restarted\\': False,\\n        \\'model_or_broker_calls\\': False, \\'representative_load_test\\\
        ': False}, sort_keys=True))\\n\\n\\nif __name__ == \\'__main__\\':\\n    main()\\n'\nassert __debug__ and os.environ['GITHUB_REPOSITORY']=='MishaGameHacking/omni-cio-gateway'\n\
        assert os.environ['GITHUB_REF']=='refs/heads/codex/timeweb-owner-prepare-2026-10-23'\nassert hashlib.sha256(remote.encode()).hexdigest()==REMOTE_SHA256\n\
        raw=with_ams(remote,timeout=120,capture=True)\nassert 0<len(raw)<32768\nvalue=json.loads(raw)\nassert value['kind']=='runtime_capacity_readonly'\
        \ and value['runtime_server_id']==9417611\nfor key in ('runtime_files_written','database_opened','services_restarted','model_or_broker_calls','representative_load_test'):\n\
        \    assert value[key] is False\nfolder=pathlib.Path(os.environ['RUNNER_TEMP'])/('free-runtime-capacity-'+os.environ['GITHUB_RUN_ID'])\n\
        folder.mkdir(exist_ok=False)\n(folder/'capacity.json').write_bytes(raw)\nprint('RUNTIME_CAPACITY='+json.dumps(value,sort_keys=True),flush=True)\n\
        PY\n"
    - name: Retain original runtime capacity observation
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: free-runtime-capacity
        retention-days: 3
        if-no-files-found: warn
        path: ${{ runner.temp }}/free-runtime-capacity-${{ github.run_id }}/capacity.json
