name: Sonar Annotation Diagnostic

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  sonar-annotations:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - name: Read exact-head Sonar annotations without source mutation
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand 
