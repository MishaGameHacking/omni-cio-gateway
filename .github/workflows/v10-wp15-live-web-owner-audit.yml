name: V10 WP15 Live Web OWNER Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp15-live-web-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-live-audit:
    name: WP15 sanitized live evidence and runner isolation gate
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15

    steps:
      - name: Check out exact dispatched implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact checked-out head
        shell: cmd
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          for /f %%S in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%S"
          if /I not "%ACTUAL_HEAD%"=="%EXPECTED_HEAD%" exit /b 10
          echo WP15 OWNER audit exact head: %ACTUAL_HEAD%

      - name: Run independent non-admin live evidence audit
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File infrastructure\windows\audit_wp15_live_web_runner.ps1 -ExpectedImplementationSha "%GITHUB_SHA%" -AsJson > "%RUNNER_TEMP%\wp15-live-owner-audit.json" 2> "%RUNNER_TEMP%\wp15-live-owner-diagnostic.txt"
          set "AUDIT_EXIT=%ERRORLEVEL%"
          if exist "%RUNNER_TEMP%\wp15-live-owner-audit.json" type "%RUNNER_TEMP%\wp15-live-owner-audit.json"
          if exist "%RUNNER_TEMP%\wp15-live-owner-diagnostic.txt" type "%RUNNER_TEMP%\wp15-live-owner-diagnostic.txt"
          echo WP15_LIVE_OWNER_AUDIT_EXIT=%AUDIT_EXIT%>> "%GITHUB_ENV%"
          echo WP15_LIVE_OWNER_AUDIT=%RUNNER_TEMP%\wp15-live-owner-audit.json>> "%GITHUB_ENV%"
          echo WP15_LIVE_OWNER_DIAGNOSTIC=%RUNNER_TEMP%\wp15-live-owner-diagnostic.txt>> "%GITHUB_ENV%"
          exit /b 0

      - name: Upload sanitized OWNER audit only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp15-live-owner-sanitized-audit
          path: |
            ${{ env.WP15_LIVE_OWNER_AUDIT }}
            ${{ env.WP15_LIVE_OWNER_DIAGNOSTIC }}
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce independent OWNER audit result
        shell: cmd
        run: |
          if "%WP15_LIVE_OWNER_AUDIT_EXIT%"=="0" exit /b 0
          exit /b %WP15_LIVE_OWNER_AUDIT_EXIT%

      - name: Clean self-hosted workspace
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
