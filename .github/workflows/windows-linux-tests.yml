name: N00 full backend verification in WSL on the Windows laptop
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/windows-linux-tests.yml
permissions:
  contents: read
concurrency:
  group: analyst-n00-linux-tests
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify the existing private return transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Create and verify one private run-owned transfer
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const helper=require(''./.github/scripts/ci_private_transfer.cjs'');

          await helper({github,context,core,command:''prepare''});

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one preflight-owned private draft is required'');

          const release=helper.owned(matches[0],identity);

          if(release.assets.length!==0) throw new Error(''Preflight draft must be empty'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.setOutput(''release_id'',String(release.id));'
  develop:
    name: Run the complete backend suite on local Linux with real POSIX semantics
    needs: preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 65
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
    env:
      SOURCE_ROOT: C:/actions-runner-2/_work/omni-cio-gateway/omni-cio-gateway/windows-n00-40227132451-1
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Prepare verified administrative Linux test transport
      shell: cmd
      run: 'py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-linux-checks.py.b64''; p.write_text('''',encoding=''ascii'')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-linux-checks.py.b64''; p.open(''a'',encoding=''ascii'').write('''')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,base64,zlib,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); data=zlib.decompress(base64.b64decode((p/''n00-linux-checks.py.b64'').read_text())); assert hashlib.sha256(data).hexdigest()==''51f6561e672cceedb02537e0ddfd2d2b4bb2abde3e894e24e43fadd670bc8f5b''; (p/''n00-linux-checks.py'').write_bytes(data)"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os; p=Path(os.environ[''RUNNER_TEMP''])/''n00-linux-guest.py.b64''; p.write_text('''',encoding=''ascii'')"

        if errorlevel 1 exit /b 1

        py -3 -c "from pathlib import Path; import os,base64,zlib,hashlib; p=Path(os.environ[''RUNNER_TEMP'']); data=zlib.decompress(base64.b64decode((p/''n00-linux-guest.py.b64'').read_text())); assert hashlib.sha256(data).hexdigest()==''9c92c16d88a9e69a6e9b73b61f0e1eff8cd6b1b457451ee104c07bd17a7e29f0''; (p/''n00-linux-guest.py'').write_bytes(data)"

        if errorlevel 1 exit /b 1'
    - name: Run full backend tests on the laptop inside the owned WSL distribution
      id: linux_checks
      shell: cmd
      run: 'py -3 "%RUNNER_TEMP%\n00-linux-checks.py"

        if errorlevel 1 exit /b 1'
    - name: Require the same empty private return draft
      id: evidence_prepare
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
  collect:
    name: Preserve Windows-hosted Linux test evidence on the existing runtime server
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\nsys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45) as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script, *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\",{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\",{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\",\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n                    if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"+shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n                raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n            try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nimport re\nrun=os.environ[\"GITHUB_RUN_ID\"];attempt=os.environ[\"GITHUB_RUN_ATTEMPT\"]\nexpected=os.environ[\"TRANSFER_SHA256\"]\nassert re.fullmatch(r\"[1-9]\\d{0,19}\",run) and re.fullmatch(r\"[1-9]\\d{0,4}\",attempt)\nassert re.fullmatch(r\"[a-f0-9]{64}\",expected)\nblob=(pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"ci-handoff.zip\").read_bytes()\nassert 0<len(blob)<=512*1024**2 and hashlib.sha256(blob).hexdigest()==expected\nremote_script=r\"\"\"import pathlib,sys,hashlib,json,os,pwd,stat\ndata=sys.stdin.buffer.read(512*1024**2+1)\nassert len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH\nparent=pathlib.Path('/var/lib/analyst-ai-build/incoming')\naccount=pwd.getpwnam('analyst-build')\nif not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)\nassert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\ndestination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\nos.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\nreceipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\nwith_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require complete local Linux checks and preserved evidence
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n    echo \"A required local Linux verification or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Local Linux backend checks and evidence transport passed; Android and phone checks are separate.\"\n"
