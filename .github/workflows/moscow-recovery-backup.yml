name: Moscow one-time recovery backup
on:
  push:
    branches: [infra/russia-migration-preflight]
    paths: [.github/workflows/moscow-recovery-backup.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeweb-russian-migration
  cancel-in-progress: false
jobs:
  backup:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Offline target and mutation scope checks
        shell: py -3 {0}
        run: |
          import copy
          import sys
          from unittest.mock import patch
          sys.path.insert(0, '.github/scripts')
          import moscow_recovery_backup as m
          sample = {'id': 9334503, 'name': m.SERVER_NAME, 'location': 'ru-3', 'availability_zone': 'msk-1', 'preset_id': 6871, 'cpu': 2, 'ram': 2048, 'status': 'on', 'disks': [{'id': 123, 'is_system': True, 'size': 40960, 'type': 'nvme', 'status': 'done'}]}
          assert m.selected_disk(sample) == 123
          for field, value in (('id', 9326369), ('location', 'kz-1'), ('availability_zone', 'ala-1'), ('status', 'off')):
              changed = copy.deepcopy(sample)
              changed[field] = value
              try:
                  m.selected_disk(changed)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('Invalid target accepted')
          for method, path in (('DELETE', '/servers/9334503'), ('POST', '/servers'), ('POST', '/servers/9334503/disks/123/backups/4/action'), ('GET', '/servers/9326369')):
              try:
                  m.cloud(method, path)
              except RuntimeError as error:
                  assert 'scope' in str(error)
              else:
                  raise AssertionError('Out-of-scope mutation accepted')
          with patch.object(m, 'cloud', return_value={'backups': [], 'meta': {'total': 1}}):
              try:
                  m.list_backups('unused')
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('Partial inventory accepted')
          print('BACKUP_OFFLINE_CHECKS=10_passed_no_network')
      - name: Create at most one backup of the verified Moscow disk
        shell: cmd
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          py -3 .github\scripts\moscow_recovery_backup.py
          if errorlevel 1 exit /b 1
