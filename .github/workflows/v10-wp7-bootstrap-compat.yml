name: V10 WP7 Bootstrap Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/v10-wp7-bootstrap-compat.yml"
      - "docs/architecture/V10_WP7_**"
      - "docs/operations/V10_WP7_**"
      - "infrastructure/windows/bootstrap-v10.ps1"
      - "infrastructure/windows/*wp7*"
      - "scripts/*wp7*"
      - "tests/test_v10_wp7_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-wp7-bootstrap-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows-preview:
    name: Clean Windows non-mutating bootstrap preview
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify WP7 static bootstrap contract
        shell: pwsh
        run: |
          python scripts/check_v10_wp7_bootstrap_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse WP7 PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "infrastructure\windows\bootstrap-v10.ps1",
            "infrastructure\windows\rollback_wp7_bootstrap.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Prove preview does not mutate clean hosted node
        shell: powershell
        run: |
          $trackedPaths = @(
            "C:\ProgramData\OmniCIO\bootstrap",
            "C:\ProgramData\OmniCIO\runtime",
            "C:\ProgramData\OmniCIO\data",
            "C:\ProgramData\OmniCIO\logs",
            "C:\ProgramData\OmniCIO\services"
          )
          $before = @{}
          foreach ($path in $trackedPaths) {
            $before[$path] = Test-Path -LiteralPath $path
          }

          $profilePath = Join-Path $env:RUNNER_TEMP "wp7-clean-preview.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\bootstrap-v10.ps1 -AsJson `
            > $profilePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if ($profile.status -notin @("OWNER_ACTION_REQUIRED", "PASS")) { exit 1 }
          if ($profile.mode -ne "PREVIEW") { exit 1 }
          foreach ($name in @(
            "raw_usernames_collected",
            "sids_emitted",
            "hostnames_collected",
            "addresses_collected",
            "secret_values_collected",
            "runner_credentials_collected",
            "private_data_collected"
          )) {
            if ($profile.privacy.$name -ne $false) { exit 1 }
          }

          foreach ($path in $trackedPaths) {
            if ((Test-Path -LiteralPath $path) -ne $before[$path]) {
              Write-Error "WP7 preview mutated tracked path state."
              exit 1
            }
          }
          Remove-Item -LiteralPath $profilePath -Force

      - name: Prove cleanup preview is non-mutating
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\infrastructure\windows\rollback_wp7_bootstrap.ps1 -AsJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
