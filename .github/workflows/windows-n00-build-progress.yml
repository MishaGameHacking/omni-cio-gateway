name: Observe N00 candidate41 laptop build
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths: [.github/workflows/windows-n00-build-progress.yml]
permissions:
  contents: read
  checks: write
  actions: read
concurrency:
  group: analyst-n00-candidate41-build-observer
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 150
    steps:
      - name: Read fixed run status without changing sources or gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: "const cp=require('node:child_process');\nconst created=await github.rest.checks.create({...context.repo,name:'N00 candidate41 full laptop build observations',head_sha:context.sha,status:'in_progress',output:{title:'Waiting for laptop build',summary:'Run40252011635. Build evidence does not establish Android runtime acceptance.'}});\nlet terminal=false;const observedFiles={};\nfor(let poll=0;poll<290;poll++){\n const r=cp.spawnSync('py',['-3','-c',\"import pathlib,sys,os,json,re\\nassert sys.platform=='win32' and os.environ.get('COMPUTERNAME')=='LAPTOP-NPSGA016'\\nout={'host':os.environ['COMPUTERNAME'],'run_id':40252011635,'files':{}}\\nfor suffix in ('','-2','-3','-4'):\\n state=pathlib.Path('C:/actions-runner'+suffix+'/_work/_temp/analyst-development-40252011635-1')\\n if not state.is_dir():continue\\n out['state_root']=str(state)\\n out['source_root']=str(pathlib.Path('C:/actions-runner'+suffix+'/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40252011635-1'))\\n for name in ('windows-development.json','controller.json','applied-patches.json','export-receipt.json','linux-linux-test-report.json'):\\n  p=state/name\\n  if not p.is_file():continue\\n  if p.stat().st_size>2*1024**2:raise RuntimeError('oversized status')\\n  value=json.loads(p.read_text(encoding='utf-8'))\\n  if name=='windows-development.json':\\n   for step in value.get('steps',[]):step.pop('command',None)\\n  out['files'][name]=value\\n for name in ('source-after-patches.json','source-final.json'):\\n  p=state/name\\n  if p.is_file():\\n   value=json.loads(p.read_text(encoding='utf-8'))\\n   out['files'][name]={k:value[k] for k in ('source_sha256','complete_source_sha256')}\\n for p in state.glob('*.log'):\\n  if not any(x in p.name for x in ('host-tests','tools-tests','backend-tests','node-tests','gradle','failure','linux')):continue\\n  with p.open('rb') as f:\\n   f.seek(max(0,p.stat().st_size-12000));lines=f.read().decode('utf-8',errors='replace').splitlines()\\n  rows=[s[:800] for s in lines if re.search(r'^Ran \\\\d+ tests?|^OK\\\\b|FAILED|BUILD SUCCESSFUL|BUILD FAILED|\\\\bpassed\\\\b|\\\\bfailed\\\\b|\\\\bERROR\\\\b|Error:|Exception:',s)]\\n  out.setdefault('test_summaries',{})[p.name]=rows[-8:]\\nprint(json.dumps(out,ensure_ascii=True))\\n\"],{encoding:'utf8',timeout:45000,maxBuffer:150000,env:{...process.env,PYTHONUTF8:'1',PYTHONIOENCODING:'utf-8'}});\n let report;try{if(r.status!==0)throw Error('status read failed');report=JSON.parse(r.stdout.trim());}catch(e){report={error:String(e),stderr:r.stderr?.slice(-1500)};}\n Object.assign(observedFiles,report.files||{});report.files=observedFiles;\n const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40252011635});\n report.workflow_status=run.data.status;report.workflow_conclusion=run.data.conclusion;terminal=run.data.status==='completed';\n const passed=run.data.conclusion==='success'&&observedFiles['windows-development.json']?.status==='passed_check_and_build_only';\n const fence=String.fromCharCode(96).repeat(3);const summary=fence+'json\\n'+JSON.stringify(report,null,2)+'\\n'+fence;\n if(summary.length>63000)throw Error('Build report exceeded bound');\n await github.rest.checks.update({...context.repo,check_run_id:created.data.id,status:terminal?'completed':'in_progress',...(terminal?{conclusion:passed?'success':'failure'}:{}),output:{title:'Actual full Windows WSL build observations',summary}});\n if(terminal)break;\n await new Promise(resolve=>setTimeout(resolve,30000));\n}\nif(!terminal)await github.rest.checks.update({...context.repo,check_run_id:created.data.id,status:'completed',conclusion:'neutral',output:{title:'Observation window ended',summary:'Inspect run40252011635.'}});"
