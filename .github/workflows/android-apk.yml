name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "ci-ui-driver/**"
      - "backend/installation_evidence.py"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/scripts/**"
      - ".github/actions/check-apk/**"
      - ".github/apk-signing-certificate.sha256"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify downloadable APK
    permissions:
      contents: write
    # Release builds have their own non-preemptible queue. The host-wide Python
    # lease in test_apk_installation.py serializes actual ADB/emulator access
    # with PR checks running on the other registered services of this laptop.
    concurrency:
      group: analyst-android-release-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 40
    # Applies before checkout cleans generated Kotlin class paths on Windows.
    # Keep clean checkout enabled; do not change the host's global Git config.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: true

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle repeatedly timed out while downloading from codeload on the
      # private Windows runner. Validate the pinned wrapper directly instead of
      # making an approved release depend on that supplementary action.
      - name: Verify pinned Gradle wrapper
        shell: cmd
        run: |
          certutil -hashfile gradle\wrapper\gradle-wrapper.jar SHA256 > "%RUNNER_TEMP%\gradle-wrapper.sha256"
          if errorlevel 1 exit /b 1
          findstr /I /C:"238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5" "%RUNNER_TEMP%\gradle-wrapper.sha256" >nul
          if errorlevel 1 exit /b 1
          call gradlew.bat --version
          if errorlevel 1 exit /b 1

      - name: Choose Android SDK root
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
          echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"

      - name: Ensure Android SDK 36 is installed
        shell: cmd
        run: |
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" goto tools_ready
          set "TOOLS_ZIP=%RUNNER_TEMP%\commandlinetools-win-15859902_latest.zip"
          curl.exe -fL --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%TOOLS_ZIP%"
          if errorlevel 1 exit /b 1
          certutil -hashfile "%TOOLS_ZIP%" SHA256 > "%TOOLS_ZIP%.sha256"
          if errorlevel 1 exit /b 1
          findstr /I /C:"90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" "%TOOLS_ZIP%.sha256" >nul
          if errorlevel 1 exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\cmdline-tools" mkdir "%ANDROID_SDK_ROOT%\cmdline-tools"
          tar.exe -xf "%TOOLS_ZIP%" -C "%ANDROID_SDK_ROOT%\cmdline-tools"
          if errorlevel 1 exit /b 1
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest" rmdir /s /q "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          move "%ANDROID_SDK_ROOT%\cmdline-tools\cmdline-tools" "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          if errorlevel 1 exit /b 1
          :tools_ready
          set "SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          set "YES_FILE=%RUNNER_TEMP%\android-sdk-yes.txt"
          (for /l %%A in (1,1,50) do @echo y) > "%YES_FILE%"
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" --licenses < "%YES_FILE%"
          if errorlevel 1 exit /b 1
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" "platforms;android-36" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Test APK verification rules
        shell: cmd
        run: |
          py -3 -m unittest discover -s .github\scripts\tests -p "test_*.py" -v
          if errorlevel 1 exit /b 1

      - name: Download installed 0.10.0 APK for exact upgrade compatibility test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag:'android-preview-0a894dddfa858efe6c7be60aea78935adec84c1b'})).data;
            const asset = release.assets.find(a => a.name === 'Analyst-AI-0.10.0-preview-0a894dd.apk');
            if (!asset) throw new Error('0.10.0 reference APK missing');
            const response = await github.rest.repos.getReleaseAsset({...context.repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
            const bytes = Buffer.from(response.data);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== '3a31c602ec885a0d8cac8d76f43369cfb6ed3bdaa928f1cd7429582b0d5a40a3') {
              throw new Error('0.10.0 reference APK checksum mismatch');
            }
            const destination = path.join(process.env.RUNNER_TEMP, `previous-apk-${context.runId}.apk`);
            fs.writeFileSync(destination, bytes);
            core.exportVariable('PREVIOUS_APK', destination);

      - name: Lint and build UI fixture plus compact signed preview APK
        shell: cmd
        run: |
          call gradlew.bat :app:lintDebug :app:lintPreview :app:assembleDebug :app:assemblePreview --stacktrace
          if errorlevel 1 exit /b 1

      - name: Verify upgrade, clean install, launch, and profile UI on Android 15 and 16
        uses: ./.github/actions/check-apk
        env:
          RUN_PROFILE_UI_TESTS: "1"

      - name: Assert verified APK and evidence are present
        shell: cmd
        run: |
          if not exist "app\build\outputs\apk\preview\app-preview.apk" exit /b 1
          if not exist "app\build\outputs\apk\preview\apk-verification.json" exit /b 1
          if not exist "app\build\outputs\apk\preview\install-api-36\install-results.json" exit /b 1
          if not exist "app\build\outputs\apk\preview\install-api-35\install-results.json" exit /b 1
          if not exist "app\build\outputs\apk\preview\ui-screens\*.png" exit /b 1

      # Actions artifact storage is optional retention, not release validation.
      # A full quota must not turn a verified application build red or prevent
      # the separately integrity-checked GitHub Release publication below.
      - name: Retain APK and verification evidence when storage is available
        id: retain_apk
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Analyst-AI-${{ github.sha }}
          path: |
            app/build/outputs/apk/preview/app-preview.apk
            app/build/outputs/apk/preview/apk-verification.json
            app/build/outputs/apk/preview/install-api-36/install-results.json
            app/build/outputs/apk/preview/install-api-35/install-results.json
            app/build/outputs/apk/preview/ui-screens/*.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report unavailable optional Actions retention
        if: steps.retain_apk.outcome == 'failure'
        shell: cmd
        run: |
          echo ::warning::Verified APK retention in GitHub Actions storage failed, usually because the repository artifact quota is full. Build, installation, UI, and release-integrity gates remain authoritative.

      # Publication remains explicit: either a manual workflow dispatch or a
      # main-branch commit carrying the [publish-apk] release marker. This lets
      # an approved merge publish even when optional Actions storage is full.
      - name: Publish verified APK to GitHub Releases
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[publish-apk]')))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const reportPath = 'app/build/outputs/apk/preview/apk-verification.json';
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            // Code 34 belongs to the installed 0.10.0 preview. Changed bytes must use a newer code.
            if (!Number.isSafeInteger(report.version_code) || report.version_code <= 34) {
              throw new Error('A new versionCode is required before publishing changed APK bytes');
            }
            const data = fs.readFileSync('app/build/outputs/apk/preview/app-preview.apk');
            const hash = crypto.createHash('sha256').update(data).digest('hex');
            if (hash !== report.sha256 || report.device_install_test !== 'passed_on_emulators_not_a_physical_phone') {
              throw new Error('APK was not fully validated or changed after validation');
            }
            const version = report.version_name;
            const tag = `android-preview-${sha}`;
            const assetName = `Analyst-AI-${version}-${sha.slice(0, 7)}.apk`;
            const title = `Analyst AI ${version}`;
            const releaseNotes = fs.readFileSync('docs/releases/0.11.0.md', 'utf8').trim();
            if (!releaseNotes.includes('0.11.0') || !releaseNotes.includes('3D100')) throw new Error('Release notes do not identify this update');
            const body = [
              releaseNotes,
              'Signed, non-debuggable preview APK. Android 15+; application ID ru.omnicio.app.debug.',
              'Uses the existing test signing key, not a production-store signing key.',
              'APK signature, ZIP/ELF alignment, DEX integrity, clean installation, upgrade and post-upgrade launch from the installed 0.10.0 preview, plus clean installation and full profile/education UI on Android 15 and 16 x86_64 emulators verified.',
              'A successful emulator run does not claim that every physical-device configuration has been reproduced.',
              `SHA-256: ${hash}`,
              `Signing certificate SHA-256: ${report.certificate_sha256}`,
            ].join('\n\n');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page:100});
            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({owner, repo, tag_name:tag, target_commitish:sha, name:title, body, draft:true, prerelease:true, make_latest:'false'})).data;
            }
            if (!release.draft) {
              if (!release.assets.some(a => a.name === assetName)) throw new Error('Immutable release missing APK');
              core.notice(`APK already published: ${release.html_url}`);
              return;
            }
            const files = [[assetName, data, 'application/vnd.android.package-archive'], ['apk-verification.json', fs.readFileSync(reportPath), 'application/json']];
            for (const [name, bytes, type] of files) {
              for (const asset of release.assets.filter(a => a.name === name)) {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id:asset.id});
              }
              const asset = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data:bytes, headers:{'content-type':type,'content-length':bytes.length}})).data;
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id:asset.id, headers:{accept:'application/octet-stream'}});
              const received = Buffer.from(downloaded.data);
              if (received.length !== bytes.length || !crypto.createHash('sha256').update(received).digest().equals(crypto.createHash('sha256').update(bytes).digest())) {
                throw new Error('Release upload read-back integrity mismatch');
              }
            }
            release = (await github.rest.repos.updateRelease({owner, repo, release_id:release.id, name:title, body, draft:false, prerelease:true, make_latest:'false'})).data;
            core.notice(`APK published and verified: ${release.html_url}`);
            await core.summary.addHeading(title).addRaw(`APK SHA-256: ${hash}\n\n${body}`).write();
