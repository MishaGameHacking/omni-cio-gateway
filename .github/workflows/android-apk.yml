name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build downloadable debug APK
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Choose Android SDK root
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          echo ANDROID_SDK_ROOT=%SDK_ROOT%>>"%GITHUB_ENV%"
          echo ANDROID_HOME=%SDK_ROOT%>>"%GITHUB_ENV%"

      - name: Ensure Android SDK 36 is installed
        shell: cmd
        run: |
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" goto tools_ready

          set "TOOLS_ZIP=%RUNNER_TEMP%\commandlinetools-win-15859902_latest.zip"
          curl.exe -fL --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%TOOLS_ZIP%"
          if errorlevel 1 exit /b 1

          certutil -hashfile "%TOOLS_ZIP%" SHA256 > "%TOOLS_ZIP%.sha256"
          if errorlevel 1 exit /b 1
          findstr /I /C:"90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" "%TOOLS_ZIP%.sha256" >nul
          if errorlevel 1 (
            echo ::error::Android command-line tools checksum mismatch.
            exit /b 1
          )

          if not exist "%ANDROID_SDK_ROOT%\cmdline-tools" mkdir "%ANDROID_SDK_ROOT%\cmdline-tools"
          tar.exe -xf "%TOOLS_ZIP%" -C "%ANDROID_SDK_ROOT%\cmdline-tools"
          if errorlevel 1 exit /b 1
          if exist "%ANDROID_SDK_ROOT%\cmdline-tools\latest" rmdir /s /q "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          move "%ANDROID_SDK_ROOT%\cmdline-tools\cmdline-tools" "%ANDROID_SDK_ROOT%\cmdline-tools\latest"
          if errorlevel 1 exit /b 1

          :tools_ready
          set "SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          set "YES_FILE=%RUNNER_TEMP%\android-sdk-yes.txt"
          (for /l %%A in (1,1,50) do @echo y) > "%YES_FILE%"
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" --licenses < "%YES_FILE%"
          if errorlevel 1 exit /b 1
          call "%SDKMANAGER%" --sdk_root="%ANDROID_SDK_ROOT%" "platforms;android-36" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Lint and build debug APK
        shell: cmd
        run: |
          call gradlew.bat :app:lintDebug :app:assembleDebug --stacktrace
          if errorlevel 1 exit /b 1

      - name: Publish APK to GitHub Releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const tag = `android-debug-${sha}`;
            const assetName = `OMNICIO-debug-${sha.slice(0, 7)}.apk`;
            const apkPath = 'app/build/outputs/apk/debug/app-debug.apk';
            const title = `OMNICIO debug ${sha.slice(0, 7)}`;
            const body = 'Installable debug APK for device testing. Minimum Android version: Android 13 (API 33).';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            let release = releases.find(({tag_name}) => tag_name === tag);

            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: sha,
                name: title,
                body,
                draft: true,
                prerelease: true,
                make_latest: 'false',
              })).data;
            }

            if (!release.draft) {
              const asset = release.assets.find(({name}) => name === assetName);
              if (!asset) {
                throw new Error('Published immutable release is missing its APK asset.');
              }
              core.notice(`APK already published: ${release.html_url}`);
              return;
            }

            for (const asset of release.assets.filter(({name}) => name === assetName)) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

            const data = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
            });

            release = (await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              tag_name: tag,
              target_commitish: sha,
              name: title,
              body,
              draft: false,
              prerelease: true,
              make_latest: 'false',
            })).data;

            core.notice(`APK published: ${release.html_url}`);
