name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "ci-ui-driver/**"
      - "backend/installation_evidence.py"
      - "backend/android_runtime_contract.py"
      - "backend/automation_ui_evidence.py"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/scripts/**"
      - ".github/actions/check-apk/**"
      - ".github/apk-signing-certificate.sha256"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify downloadable APK
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    concurrency:
      group: analyst-android-release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/android-ci.yml
