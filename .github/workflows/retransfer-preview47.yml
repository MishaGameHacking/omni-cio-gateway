name: Return exact retained preview47 to Timeweb without rebuilding
'on':
  push:
    branches:
    - codex/timeweb-owner-prepare-2026-10-23
    paths:
    - .github/workflows/retransfer-preview47.yml
permissions:
  contents: read
concurrency:
  group: preview47-retained-retransfer
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify the existing private return transport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Create and verify one private run-owned transfer
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const helper=require(''./.github/scripts/ci_private_transfer.cjs'');

          await helper({github,context,core,command:''prepare''});

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one preflight-owned private draft is required'');

          const release=helper.owned(matches[0],identity);

          if(release.assets.length!==0) throw new Error(''Preflight draft must be empty'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.setOutput(''release_id'',String(release.id));'
  develop:
    name: Reverify and repackage retained laptop source and APK bytes
    needs: preflight
    runs-on:
    - self-hosted
    - Windows
    - X64
    - omni-cio-ci
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.evidence_upload.outputs.archive_sha256 }}
    env:
      SOURCE_ROOT: C:/actions-runner-3/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40392908825-1
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Read exact retained files and original successful receipts
      id: export
      shell: py -3 {0}
      run: "ORIGINAL_ARTIFACT_B64 = ''\n\
        \nimport base64, datetime, hashlib, io, json, os, pathlib, stat, sys, zipfile\nassert sys.platform == 'win32' and\
        \ os.environ['COMPUTERNAME'] == 'LAPTOP-NPSGA016'\nsha = lambda raw: hashlib.sha256(raw).hexdigest()\nraw = base64.b64decode(ORIGINAL_ARTIFACT_B64,\
        \ validate=True)\nassert len(raw) == 248574 and sha(raw) == '806b87abe941d78e798348bdf1b41247530e193eab8f29380a46810565696868'\n\
        evidence = {}\nwith zipfile.ZipFile(io.BytesIO(raw)) as archive:\n    for member in archive.infolist():\n        path\
        \ = pathlib.PurePosixPath(member.filename)\n        assert not path.is_absolute() and '..' not in path.parts and not\
        \ member.is_dir()\n        assert path.name not in evidence and 0 <= member.file_size < 8000000\n        evidence[path.name]\
        \ = archive.read(member)\nbuild = json.loads(evidence['windows-development.json'])\ninventory = json.loads(evidence['source-final.json'])\n\
        controller = json.loads(evidence['controller.json'])\noriginal_export = json.loads(evidence['export-receipt.json'])\n\
        assert sha(evidence['windows-development.json']) == 'd8f681a58a6b1574f16f284ac514c13a1b942e4683b5de66306a5728b498276f'\n\
        assert sha(evidence['source-final.json']) == '683c97da2fad6395fc3b1ce50a9c43386eececc5b072b3bff4f2df665e7a234e'\n\
        assert sha(evidence['controller.json']) == '6b2ee57854782e3d4bf227f9519d84316ab511a5922606660ad7cc04c1f241a4'\nassert\
        \ build['github']['run_id'] == 40392908825 and build['status'] == 'passed_check_and_build_only'\nroot = pathlib.Path(build['root'])\n\
        assert root == pathlib.Path('C:/actions-runner-3/_work/omni-cio-gateway/omni-cio-gateway/windows-development-40392908825-1')\n\
        def read(path):\n    assert path.resolve(strict=True) == path and path.is_file() and not path.is_symlink()\n    assert\
        \ stat.S_ISREG(path.stat().st_mode) and path.stat().st_size <= 128 * 1024**2\n    return path.read_bytes()\nentries\
        \ = {}\ndef add(name, data):\n    assert name not in entries\n    entries[name] = data\nfor name, identity in inventory['files'].items():\n\
        \    relative = pathlib.PurePosixPath(name)\n    assert not relative.is_absolute() and '..' not in relative.parts\
        \ and ':' not in name and '\\\\' not in name\n    data = read(root / name)\n    assert {'bytes': len(data), 'sha256':\
        \ sha(data)} == identity, name\n    add('source/' + name, data)\nfor name, data in evidence.items():\n    add('evidence/'\
        \ + ('original-export-receipt.json' if name == 'export-receipt.json' else name), data)\nfor name, identity in build['apks'].items():\n\
        \    data = read(root / name)\n    assert {'bytes': len(data), 'sha256': sha(data)} == identity, name\n    add('outputs/'\
        \ + name, data)\nfor name in ('signature.txt', 'alignment.txt', 'badging.txt', 'manifest.txt', 'apk-verification.json',\
        \ 'native-alignment.json'):\n    relative = 'app/build/outputs/apk/preview/' + name\n    add('outputs/' + relative,\
        \ read(root / relative))\nrecovery = {'schema': 1, 'kind': 'verified_retained_build_reexport',\n    'build_run_id':\
        \ 40392908825, 'transport_run_id': int(os.environ['GITHUB_RUN_ID']),\n    'original_failed_collector_job': 121827044250,\
        \ 'original_export': original_export,\n    'all_original_source_files_and_apks_reverified': True,\n    'original_build_receipts_unchanged':\
        \ True, 'new_build_or_tests_executed': False,\n    'original_archive_byte_identity_claimed': False,\n    'created_at':\
        \ datetime.datetime.now(datetime.timezone.utc).isoformat()}\nadd('evidence/reexport-provenance.json', (json.dumps(recovery,\
        \ sort_keys=True) + '\\n').encode())\nenvelope = {'schema': 1, 'kind': 'windows_check_build_source_archive',\n   \
        \ 'source_sha256': inventory['source_sha256'], 'complete_source_sha256': inventory['complete_source_sha256'],\n  \
        \  'base_commit': build['base_commit'], 'report': build, 'controller': controller,\n    'files': {name: {'bytes':\
        \ len(data), 'sha256': sha(data)} for name, data in entries.items()},\n    'runtime_pass': False, 'publication_authorized':\
        \ False, 'phone_verified': False,\n    'created_at': recovery['created_at'], 'reexport': recovery}\ndestination =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-handoff.zip'\nassert not destination.exists()\nwith zipfile.ZipFile(destination,\
        \ 'x', compression=zipfile.ZIP_DEFLATED, compresslevel=3) as archive:\n    for name, data in sorted(entries.items()):\n\
        \        archive.writestr(name, data)\n    archive.writestr('windows-development-envelope.json', json.dumps(envelope,\
        \ sort_keys=True))\nfor name, identity in inventory['files'].items():\n    data = read(root / name)\n    assert {'bytes':\
        \ len(data), 'sha256': sha(data)} == identity, name\ndata = read(destination)\nassert len(data) < 256 * 1024**2\n\
        receipt = {'bytes': len(data), 'sha256': sha(data), 'files': len(entries),\n    'source_sha256': inventory['source_sha256'],\
        \ 'complete_source_sha256': inventory['complete_source_sha256'],\n    'status': build['status'], 'runtime_pass': False,\
        \ 'publication_authorized': False,\n    'reexport': recovery}\nfolder = pathlib.Path(os.environ['RUNNER_TEMP']) /\
        \ 'retransfer47-receipts'\nfolder.mkdir()\n(folder/'export-receipt.json').write_text(json.dumps(receipt, indent=2)+'\\\
        n', encoding='utf-8')\n(folder/'reexport-provenance.json').write_text(json.dumps(recovery, indent=2)+'\\n', encoding='utf-8')\n\
        print('VERIFIED_REEXPORT47=' + json.dumps(receipt))\n"
    - name: Require the same empty private return draft
      id: evidence_prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RETAINED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          const identity=helper.identity(context,process.env);

          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});

          const matches=releases.filter(value=>value.tag_name===identity.tag);

          if(matches.length!==1) throw new Error(''Exactly one owned return draft is required'');

          const release=helper.owned(matches[0],identity);

          if(String(release.id)!==process.env.RETAINED_RELEASE_ID || release.assets.length!==0) throw new Error(''Preflight
          return ownership changed'');

          await helper.inaccessibleWithoutAuth(context.repo,''releases/''+release.id,fetch);

          core.info(''WINDOWS_DEVELOPMENT_PRIVATE_RETURN_READY=true'');'
    - name: Upload the private Windows result archive
      id: evidence_upload
      if: always() && steps.evidence_prepare.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const fs=require(''node:fs''),path=require(''node:path''),crypto=require(''node:crypto'');

          const target=path.join(process.env.SOURCE_ROOT,''.github/scripts/ci_private_transfer.cjs'');

          const bytes=fs.readFileSync(target);

          const blob=crypto.createHash(''sha1'').update(Buffer.from(''blob ''+bytes.length+''\0'')).update(bytes).digest(''hex'');

          if(blob!==''de4d2913298b94dfd8ce2755ca0776b2080415d7'') throw new Error(''Private transfer helper changed'');

          const helper=require(target);

          await helper({github,context,core,command:''upload''});'
    - name: Preserve actual reexport identities
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: preview47-reexport-receipts
        path: ${{ runner.temp }}/retransfer47-receipts/
        retention-days: 3
        if-no-files-found: error
  collect:
    name: Preserve Windows-hosted Linux test evidence on the existing runtime server
    needs:
    - preflight
    - develop
    if: always() && needs.develop.outputs.archive_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Checkout the pinned Timeweb transport helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cd1866ee944ccea2259669f4293379241fd4ee02
        path: .transport-admin
        persist-credentials: false
    - name: Download and verify the exact private evidence archive
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'download'});
    - name: Save verified evidence on Timeweb without publishing
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        TRANSFER_SHA256: ${{ needs.develop.outputs.archive_sha256 }}
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shlex,subprocess,sys,tempfile,time,urllib.request,urllib.error\n\
        sys.path[:0]=[\".transport-admin/deploy\",\".transport-admin/tools\"]\nimport prepare_owner_vm as p\nimport access_owner_vm\
        \ as access\ntoken=p.validated_token(os.environ[\"TIMEWEB_CLOUD_TOKEN\"])\ndef api(method,path,body=None):\n    req=urllib.request.Request(\"\
        https://api.timeweb.cloud/api/v1\"+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={\"\
        Authorization\":\"Bearer \"+token,\"Accept\":\"application/json\",\"Content-Type\":\"application/json\"})\n    try:\n\
        \        with urllib.request.build_opener(p.NoRedirect(),urllib.request.HTTPSHandler(context=p.verified_ssl_context())).open(req,timeout=45)\
        \ as r:\n            raw=r.read(4194305);assert len(raw)<=4194304\n            return r.status,json.loads(raw) if\
        \ raw else {}\n    except urllib.error.HTTPError as e:return e.code,p.cloud.error_details(e.read(65536))\n\ndef with_ams(remote_script,\
        \ *, timeout=300, capture=False, binary_input=None):\n    sid=9417611;ip=\"83.217.195.29\";host=\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILN7hxzg6D6GjaE9OYQ19wH86tSm10pTnv+s81eqOfIU\
        \ runner@runnervmtai0g\"\n    status,data=api(\"GET\",\"/servers/\"+str(sid));assert status==200\n    server=data[\"\
        server\"]\n    assert server[\"name\"]==\"Analyst AI runtime 20261025\" and server[\"project_id\"]==2941515 and server[\"\
        availability_zone\"]==\"ams-1\" and p.cloud.public_ipv4(server)==ip\n    access.SERVER_ID=sid\n    with tempfile.TemporaryDirectory(prefix=\"\
        analyst-ams-admin-\",dir=os.environ[\"RUNNER_TEMP\"]) as directory:\n        folder=pathlib.Path(directory);p.cloud.generate_key(folder/\"\
        client\");public=(folder/\"client.pub\").read_text().strip()\n        created=access.request(token,\"POST\",\"/ssh-keys\"\
        ,{\"name\":\"analyst-ams-admin-\"+os.environ[\"GITHUB_RUN_ID\"],\"body\":public,\"is_default\":False})\n        key=created.get(\"\
        ssh_key\",created.get(\"ssh-key\",{}));kid=key[\"id\"]\n        assert type(kid) is int and key[\"body\"].split()[:2]==public.split()[:2]\n\
        \        attached=False\n        try:\n            access.request(token,\"POST\",\"/servers/\"+str(sid)+\"/ssh-keys\"\
        ,{\"ssh_key_ids\":[kid]});attached=True\n            cmd=p.ssh_command(folder,ip,host);cmd[1:1]=[\"-o\",\"ServerAliveInterval=20\"\
        ,\"-o\",\"ServerAliveCountMax=3\"]\n            for attempt in range(12):\n                try:p.remote(cmd,\"test\
        \ $(id -u) = 0\",timeout=12);break\n                except (p.ProbeError,subprocess.TimeoutExpired):\n           \
        \         if attempt==11:raise\n                    time.sleep(5)\n            payload=remote_script.encode() if binary_input\
        \ is None else binary_input\n            remote_command=\"python3 -\" if binary_input is None else \"python3 -c \"\
        +shlex.quote(remote_script)\n            result=subprocess.run([*cmd,remote_command],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)\n\
        \            if not capture:print(result.stdout.decode(errors=\"replace\"),flush=True)\n            if result.returncode:\n\
        \                print(\"AMS_REMOTE_ERROR=\"+result.stderr.decode(errors=\"replace\")[-4000:],flush=True)\n      \
        \          raise RuntimeError(\"remote_task_failed\")\n            return result.stdout\n        finally:\n      \
        \      try:\n                if attached:access.request(token,\"DELETE\",\"/servers/\"+str(sid)+\"/ssh-keys/\"+str(kid))\n\
        \            finally:\n                access.request(token,\"DELETE\",\"/ssh-keys/\"+str(kid))\n            print(\"\
        AMS_TEMP_KEY_REMOVED=true\",flush=True)\n\n\nimport re\nrun=\"40392908825\";attempt=\"1\" # Original build identity;\
        \ current run only transports its verified files\nexpected=os.environ[\"TRANSFER_SHA256\"]\nassert re.fullmatch(r\"\
        [1-9]\\d{0,19}\",run) and re.fullmatch(r\"[1-9]\\d{0,4}\",attempt)\nassert re.fullmatch(r\"[a-f0-9]{64}\",expected)\n\
        blob=(pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"ci-handoff.zip\").read_bytes()\nassert 0<len(blob)<=512*1024**2\
        \ and hashlib.sha256(blob).hexdigest()==expected\nremote_script=r\"\"\"import pathlib,sys,hashlib,json,os,pwd,stat\n\
        data=sys.stdin.buffer.read(512*1024**2+1)\nassert len(data)==EXPECTED_BYTES and hashlib.sha256(data).hexdigest()==EXPECTED_HASH\n\
        parent=pathlib.Path('/var/lib/analyst-ai-build/incoming')\naccount=pwd.getpwnam('analyst-build')\nif not parent.exists():parent.mkdir(mode=0o750);os.chown(parent,0,account.pw_gid)\n\
        assert parent.resolve()==parent and stat.S_ISDIR(parent.lstat().st_mode)\nfolder=parent/FOLDER\nfolder.mkdir(mode=0o750);os.chown(folder,0,account.pw_gid)\n\
        destination=folder/'windows-development-evidence.zip'\nwith destination.open('xb') as out:out.write(data);out.flush();os.fsync(out.fileno())\n\
        os.chown(destination,0,account.pw_gid);destination.chmod(0o640)\nassert hashlib.sha256(destination.read_bytes()).hexdigest()==EXPECTED_HASH\n\
        receipt={'path':str(destination),'sha256':EXPECTED_HASH,'bytes':len(data),'run_id':RUN_ID,'run_attempt':RUN_ATTEMPT,'publication_authorized':False,'origin':'Windows\
        \ laptop','runtime_pass':False,'source_code_executed_on_timeweb':False}\nmetadata=folder/'transfer-receipt.json';metadata.write_text(json.dumps(receipt,indent=2)+'\\\
        n');os.chown(metadata,0,account.pw_gid);metadata.chmod(0o640)\nprint('WINDOWS_DEVELOPMENT_RETURNED_ARCHIVE='+json.dumps(receipt),flush=True)\n\
        \"\"\"\nremote_script=remote_script.replace(\"EXPECTED_BYTES\",str(len(blob))).replace(\"EXPECTED_HASH\",repr(expected)).replace(\"\
        FOLDER\",repr(\"windows-development-\"+run+\"-\"+attempt)).replace(\"RUN_ID\",run).replace(\"RUN_ATTEMPT\",attempt)\n\
        with_ams(remote_script,timeout=180,binary_input=blob)\nPY\n"
  cleanup:
    name: Remove only this run's private transfer
    needs:
    - preflight
    - develop
    - collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f4e3368fff1209c02b1cd088a5dc6a5380e7e433
        persist-credentials: false
    - name: Verify private transfer removal
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: await require('./.github/scripts/ci_private_transfer.cjs')({github, context, core, command:'cleanup'});
  result:
    name: Require exact retained bytes returned and private transfer removed
    needs:
    - preflight
    - develop
    - collect
    - cleanup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - env:
        PREFLIGHT: ${{ needs.preflight.result }}
        DEVELOP: ${{ needs.develop.result }}
        COLLECT: ${{ needs.collect.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n\
        \    echo \"A required local Linux verification or evidence transport stage failed.\"\n    exit 1\n  fi\ndone\necho\
        \ \"Local Linux backend checks and evidence transport passed; Android and phone checks are separate.\"\n"
