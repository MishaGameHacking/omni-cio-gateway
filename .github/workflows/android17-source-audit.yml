name: Android 17 migration source audit
on:
  push:
    branches: [audit/android17-migration-20261020]
    paths: [.github/workflows/android17-source-audit.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout exact development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c04c78f3453979df336197d744b17b45636f89d
          path: source
          persist-credentials: false
          clean: true
      - name: Checkout reviewed migration templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13649cdd5729b7fdc03728c534c2d5d8db92814c
          path: migration
          persist-credentials: false
          clean: true
      - name: Apply exact-source migration in disposable checkout
        id: migrate
        shell: cmd
        run: |
          py -3 migration\.migration\apply.py --source source --templates migration\.migration
          if errorlevel 1 exit /b 1
          py -3 migration\.migration\followup.py --source source --templates migration\.migration
          if errorlevel 1 exit /b 1
      - name: Create isolated test environment
        id: environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\android17-audit-%GITHUB_RUN_ID%"
          py -3 -m venv "%VENV%"
          if errorlevel 1 exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -r source\backend\requirements-dev.txt
          if errorlevel 1 exit /b 1
          echo AUDIT_PYTHON=%VENV%\Scripts\python.exe>>"%GITHUB_ENV%"
      - name: Full backend tests with synthetic external services
        id: backend
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: cmd
        working-directory: source
        env:
          TELEGRAM_CLIENT_ID: '123456'
          TELEGRAM_CLIENT_SECRET: test-only
          BACKEND_PUBLIC_URL: https://example.invalid
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ANALYSIS_SCHEDULER_ENABLED: 'false'
          AI_EXTERNAL_PROCESSING_APPROVED: 'false'
          DATABASE_PATH: ${{ runner.temp }}\android17-audit-${{ github.run_id }}.sqlite3
        run: |
          "%AUDIT_PYTHON%" -m pytest backend\tests -q --tb=short
          if errorlevel 1 exit /b 1
      - name: All existing APK and CI regression tests
        id: scripts
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: cmd
        working-directory: source
        run: |
          "%AUDIT_PYTHON%" -m pytest .github\scripts\tests -q --tb=short
          if errorlevel 1 exit /b 1
      - name: Retain proposed source blobs without moving branches or publishing APK
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const cwd = path.join(process.env.GITHUB_WORKSPACE, 'source');
            const files = JSON.parse(fs.readFileSync(path.join(cwd, '.migration-result.json'), 'utf8'));
            const entries = [];
            for (const name of files) {
              if (name.startsWith('/') || name.includes('..') || !/^[a-zA-Z0-9_.\/-]+$/.test(name)) throw new Error('Unsafe migration path');
              const content = fs.readFileSync(path.join(cwd, name), 'utf8');
              if (Buffer.byteLength(content) > 300000) throw new Error('Migration file exceeds bound');
              const blob = await github.rest.git.createBlob({...context.repo, content, encoding:'utf-8'});
              entries.push({path:name, mode:'100644', type:'blob', sha:blob.data.sha});
            }
            core.info('MIGRATION_SOURCE_BLOBS=' + JSON.stringify(entries));
            core.info('MIGRATION_FILE_COUNT=' + entries.length);
            core.info('No branch moved, merge performed, model invoked or release deployed.');
