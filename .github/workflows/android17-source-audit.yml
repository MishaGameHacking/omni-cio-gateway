name: Android 17 migration source audit
on:
  push:
    branches: [audit/android17-migration-20261020]
    paths: [.github/workflows/android17-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - name: Set up supported JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect installed modern Android CLI contracts
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT set "SDK_ROOT=%RUNNER_TOOL_CACHE%\AndroidSdk\sdk"
          "%SDK_ROOT%\cmdline-tools\latest\bin\android.exe" --version
          if errorlevel 1 exit /b 1
          "%SDK_ROOT%\cmdline-tools\latest\bin\android.exe" --sdk="%SDK_ROOT%" sdk install --help
          if errorlevel 1 exit /b 1
          "%SDK_ROOT%\cmdline-tools\latest\bin\android.exe" --sdk="%SDK_ROOT%" emulator create --help
          if errorlevel 1 exit /b 1
