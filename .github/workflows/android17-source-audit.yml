name: Android 17 migration inventory
on:
  push:
    branches: [audit/android17-20261020]
    paths: [.github/workflows/android17-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'MishaGameHacking/omni-cio-gateway' && github.ref == 'refs/heads/audit/android17-20261020'
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Inspect current CLI and installed API37 metadata without editing SDK
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const cp = require('node:child_process');
            const candidates = [process.env.ANDROID_SDK_ROOT,process.env.ANDROID_HOME,
              path.join(process.env.LOCALAPPDATA, 'Android','Sdk'),
              path.join(process.env.RUNNER_TOOL_CACHE, 'AndroidSdk','sdk')].filter(Boolean);
            const root = candidates.find(value => fs.existsSync(path.join(value,'cmdline-tools','latest','bin','android.exe')));
            if (!root) throw new Error('No configured SDK with current native Android CLI');
            core.info('SDK_ROOT=' + root);
            for (const family of ['platforms','system-images']) {
              const folder = path.join(root,family);
              if (fs.existsSync(folder)) core.info('SDK_DIRECTORIES=' + JSON.stringify({family,entries:fs.readdirSync(folder)}));
            }
            const packages = ['platforms/android-37.0','platforms/android-37','build-tools/37.0.0',
              'system-images/android-37.0/google_apis/x86_64','system-images/android-37.0/google_apis_ps16k/x86_64'];
            for (const packagePath of packages) {
              for (const name of ['source.properties','package.xml']) {
                const file = path.join(root,packagePath,name);
                if (!fs.existsSync(file)) { core.info('SDK_METADATA_MISSING=' + packagePath + '/' + name); continue; }
                if (fs.statSync(file).size > 65536) throw new Error('SDK metadata unexpectedly large');
                core.info('SDK_METADATA=' + JSON.stringify({package:packagePath,name,text:fs.readFileSync(file,'utf8')}));
              }
            }
            const cli = path.join(root,'cmdline-tools','latest','bin','android.exe');
            for (const args of [['--version'],['--sdk='+root,'sdk','list','--all','*37*']]) {
              const result = cp.spawnSync(cli,args,{encoding:'utf8',timeout:120000,maxBuffer:1048576});
              core.info('SDK_CLI=' + JSON.stringify({args,status:result.status,stdout:result.stdout,stderr:result.stderr}));
              if (result.error || result.status !== 0) throw new Error('Current CLI inventory failed');
            }
