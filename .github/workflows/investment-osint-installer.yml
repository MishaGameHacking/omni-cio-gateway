name: Verify investment OSINT rollback installer on owner laptop
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/investment-osint-installer.yml
      - deploy/investment_osint_release.py
      - deploy/test_investment_osint_release.py
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: osint-installer-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: deploy
      - name: Verify source replacement, dependency bounds and rollback with synthetic files
        shell: cmd
        working-directory: osint-installer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          py -3 -c "import os; assert os.environ.get('COMPUTERNAME') == 'LAPTOP-NPSGA016'"
          if errorlevel 1 exit /b 1
          py -3 deploy\test_investment_osint_release.py -v
          if errorlevel 1 exit /b 1
