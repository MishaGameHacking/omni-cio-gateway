name: Check the owner's existing home host
on:
  push:
    branches: [codex/timeweb-owner-prepare-2026-10-23]
    paths:
      - .github/workflows/home-host-readiness.yml
      - tools/home_host/readiness.ps1
      - tools/home_host/readiness.py
permissions:
  contents: read
concurrency:
  group: analyst-home-host-readiness
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 5
    steps:
      - name: Check Windows, WSL and public data sources
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const crypto = require('node:crypto');
            const path = require('node:path');
            const {spawnSync} = require('node:child_process');
            if (process.platform !== 'win32' || process.env.COMPUTERNAME !== 'LAPTOP-NPSGA016') {
              throw new Error('Owner runner host mismatch');
            }
            async function source(file, ref) {
              const {data} = await github.rest.repos.getContent({...context.repo, path: file, ref});
              if (data.type !== 'file' || data.encoding !== 'base64' || !data.content) throw new Error('Missing diagnostic source');
              return Buffer.from(data.content, 'base64');
            }
            const [winProbe, linuxProbe, brokerCa] = await Promise.all([
              source('tools/home_host/readiness.ps1', context.sha),
              source('tools/home_host/readiness.py', context.sha),
              source('backend/certs/russian_trusted_root_ca.pem', '853090e11dcefef693366159c97316e55045c4c9')
            ]);
            const system = path.join(process.env.SystemRoot, 'System32');
            function call(file, args, input) {
              return spawnSync(file, args, {input, encoding: 'utf8', timeout: 55000, maxBuffer: 100000, windowsHide: true});
            }
            function decode(result) {
              if (result.status !== 0) return {probe_error: result.error?.code || 'process_failed'};
              try { return JSON.parse(result.stdout.trim().replace(/^\uFEFF/, '')); }
              catch { return {probe_error: 'invalid_result'}; }
            }
            const powershell = path.join(system,'WindowsPowerShell','v1.0','powershell.exe');
            const windows = decode(call(powershell, ['-NoProfile','-NonInteractive','-EncodedCommand',
              Buffer.from(winProbe.toString('utf8'),'utf16le').toString('base64')]));
            const wsl = path.join(system, 'wsl.exe');
            const distro = ['-d','Ubuntu-24.04'];
            const linux = decode(call(wsl, [...distro,'--exec','python3','-I','-',brokerCa.toString('base64')],linuxProbe));
            const id = call(wsl, [...distro, '-u','root','--exec','/usr/bin/id','-u']);
            const report = {version:1, run:context.runId, sha:context.sha, at:new Date().toISOString(),
              windows, linux, wsl_root: id.status === 0 && id.stdout.trim() === '0'};
            const key = crypto.randomBytes(32), iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
            const payload = Buffer.concat([cipher.update(JSON.stringify(report),'utf8'), cipher.final()]);
            const ownerKey = '';
            const envelope = crypto.publicEncrypt({key:crypto.createPublicKey({key:Buffer.from(ownerKey,'base64'),
              format:'der',type:'spki'}),oaepHash:'sha256'}, key);
            core.info('HOME_HOST_RECEIPT='+JSON.stringify({k:envelope.toString('base64'),iv:iv.toString('base64'),
              tag:cipher.getAuthTag().toString('base64'),data:payload.toString('base64')}));
            if (windows.probe_error || linux.probe_error) core.setFailed('Host inspection incomplete; see private receipt');
