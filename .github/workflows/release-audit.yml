name: Release readiness audit
on:
  push:
    branches: [fix/reliability-release-041]
    paths: [.github/workflows/release-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read reliability issues and AI credentials readiness
        shell: python
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
        run: |
          import os, json, urllib.request, urllib.error, base64, sys
          sys.stdout.reconfigure(encoding='utf-8', errors='backslashreplace')
          def get(url, token='', basic=False):
              headers={'Accept':'application/json'}
              if token:
                  headers['Authorization']=('Basic '+base64.b64encode((token+':').encode()).decode()) if basic else 'Bearer '+token
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception as e:
                  return type(e).__name__, {}
          project='MishaGameHacking_omni-cio-gateway'
          for label,path in [('BUGS','issues/search?componentKeys='+project+'&branch=main&resolved=false&types=BUG&ps=100'),('GATE','qualitygates/project_status?projectKey='+project+'&branch=main')]:
              status,data=get('https://sonarcloud.io/api/'+path, os.getenv('SONAR_TOKEN',''), True)
              print('SONAR_'+label+'_HTTP='+str(status))
              if label=='BUGS':
                  print('SONAR_BUG_TOTAL='+str(data.get('total','unknown')))
                  for item in data.get('issues',[]):
                      print('SONAR_ISSUE='+json.dumps({k:item.get(k) for k in ['key','rule','severity','component','line','message','flows']}, ensure_ascii=True))
              else:
                  print('SONAR_GATE='+json.dumps(data,ensure_ascii=True))
          ai=os.getenv('TIMEWEB_AI_TOKEN','').strip()
          print('AI_GATEWAY_KEY_PRESENT='+str(bool(ai)))
          if ai:
              status,data=get('https://api.timeweb.ai/v1/models',ai)
              print('AI_GATEWAY_HTTP='+str(status))
              print('AI_GATEWAY_MODELS='+json.dumps([v.get('id') for v in data.get('data',[])],ensure_ascii=True))
          cloud=os.getenv('TIMEWEB_CLOUD_TOKEN','').strip()
          if cloud:
              endpoint='https://timeweb.cloud/api/v1/mcp'
              def rpc(payload):
                  req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+cloud,'Accept':'application/json, text/event-stream','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          text=r.read().decode()
                      if text.lstrip().startswith('{'): return json.loads(text)
                      return json.loads([x[5:].strip() for x in text.splitlines() if x.startswith('data:')][-1])
                  except Exception as e: return {'probe_error':type(e).__name__}
              rpc({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'analyst-readiness','version':'1'}}})
              result=rpc({'jsonrpc':'2.0','id':2,'method':'tools/call','params':{'name':'list_ai_models','arguments':{'type':'llm','include_deprecated':False}}})
              print('CLOUD_AI_CATALOG='+json.dumps(result,ensure_ascii=True))
