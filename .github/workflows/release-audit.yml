name: Public quality metadata
on:
  push:
    branches: [fix/reliability-release-041]
    paths: [.github/workflows/release-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, omni-cio-ci]
    timeout-minutes: 3
    steps:
      - name: Read public Sonar issue metadata without credentials
        shell: py -3 {0}
        run: |
          import json
          import sys
          import urllib.request
          import urllib.error
          sys.stdout.reconfigure(encoding='utf-8', errors='backslashreplace')
          url='https://sonarcloud.io/api/issues/search?componentKeys=MishaGameHacking_omni-cio-gateway&branch=main&resolved=false&types=BUG&ps=100'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload=json.load(response)
              print('PUBLIC_SONAR_TOTAL='+str(payload.get('total')))
              for issue in payload.get('issues',[]):
                  print(json.dumps({k:issue.get(k) for k in ['key','rule','severity','component','line','message','flows']},ensure_ascii=True))
          except urllib.error.HTTPError as error:
              print('PUBLIC_SONAR_UNAVAILABLE_HTTP='+str(error.code))
              raise SystemExit(1)
