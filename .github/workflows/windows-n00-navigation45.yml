      run: "for result in \"$PREFLIGHT\" \"$DEVELOP\" \"$COLLECT\" \"$CLEANUP\"; do\n  if [ \"$result\" != success ]; then\n    echo \"A required runtime or evidence\
        \ transport stage failed.\"\n    exit 1\n  fi\ndone\necho \"Focused portfolio evidence collected; complete matrix acceptance remains separate.\"\n"
