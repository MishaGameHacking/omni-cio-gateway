version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # pip 26.2 removes an internal symbol still imported by pip-tools 7.6.0.
      # Keep the last verified pip until upstream pip-tools publishes compatibility.
      - dependency-name: pip
        versions:
          - "26.2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
