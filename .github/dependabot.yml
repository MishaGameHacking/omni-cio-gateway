version: 2
updates:
  # V10 WP2 selected an exact reproducible toolchain baseline.
  # Routine version-update PRs are temporarily paused while WP4 finalizes
  # release/build provenance. Dependabot security updates remain separate and
  # repository security/audit checks remain mandatory. Re-enable routine
  # version updates only through an explicit reviewed baseline/dependency change.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    ignore:
      # pip 26.2.x removes an internal symbol still imported by pip-tools 7.6.0.
      # Keep the last verified pip until upstream pip-tools publishes compatibility.
      - dependency-name: pip
        versions:
          - ">=26.2,<26.3"

  - package-ecosystem: npm
    directory: /tests/toolchain/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
