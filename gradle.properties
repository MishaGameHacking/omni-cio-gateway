org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Several self-hosted jobs may share one Windows host. Bound per-build workers
# and do not share a Kotlin RMI daemon that another job's cleanup can terminate.
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# A single-use Gradle process exits after this build; never kill another job's JVM.
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
